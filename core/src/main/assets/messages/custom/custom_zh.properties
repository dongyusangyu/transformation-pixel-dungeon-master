custom.testmode.generator.testalignment.name = 阵营调试器
custom.testmode.generator.testalignment.desc = 用于修改指定生物的阵营，使用时先选择要设置的阵营再选择生物进行阵营变更。\n\n所有常规阵营关系：\n_Enemy_与_Ally_和英雄敌对，_Ally_与_Enemy_敌对，_Neutral_通常不与任何生物敌对。\n\n所有特殊阵营关系：\n_Enemy1_、_Enemy2_、_Enemy3_和_Enemy4_只会与除自身阵营外其他三种特殊阵营的生物敌对，不会主动与常规阵营的生物敌对。
custom.testmode.generator.testalignment.ac_give = 修改阵营
custom.testmode.generator.testalignment.ac_enter_arena = 进入怪物测试场
custom.testmode.generator.testalignment.ac_leave_arena = 离开怪物测试场
custom.testmode.generator.testalignment.arena_locked = 只能在测试模式下从未锁定的楼层进入怪物测试场。
custom.testmode.generator.testalignment.arena_no_return = 怪物测试场没有记录有效的返回位置。
custom.testmode.generator.testalignment.arena_only = 怪物测试场只能通过阵营调试器进入或离开。
custom.testmode.generator.testalignment.prompt = 选择要修改阵营的生物
custom.testmode.generator.testalignment.no_char = 该位置没有可修改阵营的生物。
custom.testmode.generator.testalignment.set_success = 已将%s的阵营从%s修改为%s。
custom.testmode.generator.testalignment.null_name = 无阵营
custom.testmode.generator.testalignment.enemy_name = 普通敌人
custom.testmode.generator.testalignment.enemy_desc = 也就是Enemy，常规阵营之一，在地牢中能见到的大多数敌人都默认属于这一阵营。与Ally和英雄阵营的生物敌对。
custom.testmode.generator.testalignment.enemy1_name = 敌对组1
custom.testmode.generator.testalignment.enemy1_desc = 也就是Enemy1，特殊阵营之一，以红色指示。只会与其他特殊阵营的生物敌对，不会主动与常规阵营的生物敌对。
custom.testmode.generator.testalignment.enemy2_name = 敌对组2
custom.testmode.generator.testalignment.enemy2_desc = 也就是Enemy2，特殊阵营之一，以黄色指示。只会与其他特殊阵营的生物敌对，不会主动与常规阵营的生物敌对。
custom.testmode.generator.testalignment.enemy3_name = 敌对组3
custom.testmode.generator.testalignment.enemy3_desc = 也就是Enemy3，特殊阵营之一，以蓝色指示。只会与其他特殊阵营的生物敌对，不会主动与常规阵营的生物敌对。
custom.testmode.generator.testalignment.enemy4_name = 敌对组4
custom.testmode.generator.testalignment.enemy4_desc = 也就是Enemy4，特殊阵营之一，以绿色指示。只会与其他特殊阵营的生物敌对，不会主动与常规阵营的生物敌对。
custom.testmode.generator.testalignment.neutral_name = 中立
custom.testmode.generator.testalignment.neutral_desc = 也就是Neutral，常规阵营之一，常用于未激活的宝箱怪、NPC或需要随时切换阵营的生物。通常不与任何生物敌对。
custom.testmode.generator.testalignment.ally_name = 盟友
custom.testmode.generator.testalignment.ally_desc = 也就是Ally，常规阵营之一，与英雄保持友好。与Enemy阵营的生物敌对。
custom.testmode.generator.testalignment$settingswindow.alignment = 阵营
custom.testmode.generator.testalignment$settingswindow.selected = _当前阵营：%d.%s_
custom.testmode.generator.testalignment$settingswindow.apply_button = 应用到指定生物
