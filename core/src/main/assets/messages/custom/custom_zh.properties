custom.dict.dict.info_intro =版本介绍
custom.dict.dict.info_intro_d =本指南的大部分内容都基于破碎注解版及破碎v3.3.8进行修订，已适配并加入了绝大部分蜕变地牢的改动及新增内容。\n\n_修订＆协助修订：_\n东隅桑榆\nDM-216\nSecher-Nbiw\nOGC\n地牢散人\n\n_破碎注解作者：_\nendlesssolitude/红龙(QQ：1095711567)\nshower/沐沐(QQ：987765678)\n\n_破碎注解版Github链接：_\nhttps://github.com/showerrr/\nstatistical-shattered-pixel-dungeon\n\n如果你在游玩蜕变地牢的过程中发现了与指南资料不符的内容，可于蜕变地牢交流群中进行反馈。\n\n_蜕变地牢交流群(QQ)：_\n一群-1015634881\n二群-940628873\n\n另外，这一栏主要是一些机制说明。

custom.dict.dict.info_tier =武器与护甲阶数
custom.dict.dict.info_tier_d =武器与护甲的不同阶数概率与当前区域有关。\n\n不会自然生成1阶的武器与护甲。\n\n各区域近战武器与投掷武器各阶数的概率(从左到右对应第一至五区域)：\n\n_2阶：_75%，25%，0%，0%，0%\n\n_3阶：_20%，50%，40%，20%，0%\n\n_4阶：_4%，20%，50%，40%，19%\n\n_5阶：_1%，5%，10%，40%，80%\n\n_6阶：_0%，0%，0%，0%，1%\n\n护甲没有6阶，仍使用原本的五阶概率；第五区域为4阶20%、5阶80%。\n\n高塔(-1层及更小楼层)使用独立装备阶数权重：4阶5%、5阶60%、6阶35%。近战武器与投掷武器均按此权重生成；护甲抽中6阶时会降为5阶，因此护甲实际为4阶5%、5阶95%。\n\n_6阶装备降阶：_6阶装备被_嬗变卷轴_或_升变秘卷_使用时，会先按5阶装备处理。嬗变卷轴会从对应的5阶装备池中生成结果，升变秘卷不会生成新的6阶装备。

custom.dict.dict.info_melee =近战武器
custom.dict.dict.info_melee_d =近战武器的力量需求为_8+阶数*2_，在达到1，3，6，10，15，21...级时分别减少1点。\n\n如果力量不足就装备使用，那么每一点超重的力量都会使_攻击速度降至5/6倍_，_精准降至2/3倍_，_防御减少2点_(如果武器拥有防御)，并且_无法进行伏击_。\n\n超出需求的力量会使近战武器获得_0~超出力量_的伤害加成。\n\n近战武器可被强化符石强化，强化速度会增加33%攻击速度但降低30%伤害，而强化伤害则会增加50%伤害但降低67%攻击速度。\n\n近战武器的附魔分为三档：\n_常见(12.5%)：_烈焰，寒霜，恒动，电击\n\n_稀有(5.72%)：_招架，繁茂，弹性，幸运，索敌，紊乱，酸蚀\n\n_罕见(也称强力，2.5%)：_腐化，死神，血饮，横扫\n\n近战武器自然生成时，有5%的概率+2，20%的概率+1，75%的概率+0。\n特殊来源的近战武器可能具有额外等级(如黄金宝箱怪，鱼房，隐藏的迷宫房等)。\n\n近战武器自然生成时，有10%的概率拥有正面附魔(若是如此则必定无诅咒，献祭之火房间除外但也因此必定有等级)，30%的概率拥有诅咒。\n\n自动鉴定近战武器需要20次使用与半级经验。

custom.dict.dict.info_ranged =投掷武器
custom.dict.dict.info_ranged_d =投掷武器的力量需求为_7+阶数*2_，在达到1，3，6，10，15，21...级时分别减少1点。\n\n投掷武器的力量需求、附魔、生成、自动鉴定等机制与近战武器基本一致，在生成时为一组3件(仅豺狼诡术师的掉落会缺失一件)。\n\n投掷武器还具有一定的耐久，每次命中目标都会减少1点耐久(震爆方石则是扔出就会减少)，耐久为0时会损坏1件。\n每次升级都会将部分损坏的投掷武器补全为一组3件并使耐久*2，而神射之戒每1效果等级都会增加20%耐久，此外被装入魔法筒袋的投掷武器也会增加20%耐久。\n\n投掷武器也可被强化符石强化，在近战武器的基础上，强化速度还会增加50%耐久，而强化伤害则会减少33%耐久。\n\n投掷武器在耐久超过100后可以无限使用而不损坏。\n\n投掷武器远程使用会增加50%精准，但贴身使用会减少50%精准。

custom.dict.dict.info_armor =护甲
custom.dict.dict.info_armor_d =护甲的力量需求为_8+阶数*2_，在达到1，3，6，10，15，21...级时分别减少1点。\n\n如果力量不足就装备使用，那么每一点超重的力量都会使_移动速度降至5/6倍_，_闪避降至2/3倍_，_防御减少2点_。\n\n护甲的刻印分为三档：\n_常见(12.5%)：_晦暗，迅捷，粘稠，电势\n\n_稀有(6.67%)：_狱火，磐岩，缠绕，反斥，迷彩，涌流\n\n_罕见(也称强力，3.33%)：_魅惑，敌法，荆棘\n\n护甲自然生成时，有5%的概率+2，20%的概率+1，75%的概率+0。\n特殊来源的护甲可能具有额外等级(如黄金宝箱怪，鱼房，隐藏的迷宫房等)。\n\n护甲自然生成时，有10%的概率拥有正面刻印(若是如此则必定无诅咒，上锁墓碑房间除外但也因此必定有等级)，30%的概率拥有诅咒。\n\n自动鉴定护甲需要10次使用与半级经验。\n\n开启_信念护体_挑战后，护甲防御变为_0~1+阶数+护甲等级_。

custom.dict.dict.info_wand =法杖
custom.dict.dict.info_wand_d =法杖通常拥有2点基础充能上限(魔弹法杖为3点)，灌注入魔杖可以使充能上限+1，每次升级法杖或魔杖都会使充能上限+1，法杖与魔杖的最大充能上限均为10。\n\n法杖每_10+40*充能因数^(最大充能-当前充能)_回合回复1点充能。\n充能因数：普通法杖为_0.875_，魔法筒带内的法杖为_0.85_，魔杖为_0.75_。\n\n在法杖充能效果的影响下，法杖及魔杖每回合回复0.25点充能。\n而在电场中，法杖及魔杖每回合回复1/3点充能(英雄持有法杖处于电场中不算)。\n\n法杖自然生成时，有1/15的概率+2，4/15的概率+1，2/3的概率+0。\n完成老杖匠任务获得的法杖有额外的1级。\n\n法杖自然生成时，有30%的概率拥有诅咒。\n\n自动鉴定法杖需要10次使用与一级经验。

custom.dict.dict.info_wand_cursed =诅咒法杖
custom.dict.dict.info_wand_cursed_d =此处提到的所有诅咒法杖效果如有不能正常释放的情况，则会重新随机效果进行释放。\n\n下为效果总览：\n\n_常见效果_(概率为_60%_，每种_7.5%_)_：_\n\n敌我双方一个冻结一个燃烧，概率均等。\n\n将目标随机传送，若目标不可被传送或无目标可传送则传送英雄。\n\n在目标点产生随机气体(800单位致眩气体，500单位毒气，200单位麻痹气体，概率均等)。\n\n在目标点产生共计30单位的草木再生，长出高草并缠绕附近生物。\n\n在目标点随机触发一个寒气、烈焰或电击陷阱效果，概率均等。\n\n在目标点产生3x3的炼金气泡特效，无实质影响。\n\n释放一个随机法杖效果，等级视为诅咒法杖等级，若诅咒法杖等级低于_楼层数/5_则等级视为_楼层数/5_。\n\n对以英雄为中心的5×5范围内的所有生物造成20回合腐蚀淤泥。\n\n_稀有效果_(概率为_30%_，每种_3.75%_)_：_\n\n在目标点随机生成一株特殊植物，开启_荒芜之地_挑战后不会生成。\n\n英雄向目标输血或是相反，概率均等，输血方受到_楼层数*2_点魔法伤害，被输血方回复_输血方所受伤害/2_点生命。\n\n在目标点产生一次炸弹爆炸。\n\n对英雄和目标产生3x3范围的电击，造成_5+楼层数/4~10+楼层数/4_点电击伤害并施加5回合麻痹，同时英雄会获得10回合法杖充能效果。\n\n在目标点触发一个激流陷阱效果。\n\n在目标点触发一个羊群陷阱效果。\n\n使目标获得20回合飘浮，若目标会飞则使英雄获得20回合飘浮。\n\n吸引全层敌人前往英雄施法时所处的位置。\n\n_罕见效果_(概率为_9%_，每种_1.125%_)_：_\n\n变羊术(对Boss、小Boss和NPC无效)，将目标变为魔法绵羊。\n\n原地触发一个诅咒陷阱效果。\n\n向上的跨层传送(最多10层，跨度越大概率越低)，处于背水一战、拥有Yendor护符或在巨魔铁匠任务层时则只是随机传送。\n\n在目标点触发一个召唤陷阱效果。\n\n对以目标点为中心的7x7圆形范围内的所有生物产生爆燃，造成_5+楼层数~10+楼层数*2_点燃烧伤害并点燃可燃地形和可燃物。\n\n释放类似于护甲技能_元素打击_的效果，随机造成8回合燃烧、10回合冻结、_3+楼层数/2_回合中毒、20回合腐蚀淤泥或_5+楼层数~10+楼层数*2_点电击伤害并施加5回合麻痹，概率均等。\n\n全层生物获得10回合无敌和30回合赐福。\n\n停滞英雄时间100回合，类似于时光沙漏。\n\n_极其罕见效果_(概率为_1%_，每种_0.125%_)_：_\n\n全层长出高草并随机点燃几处(平均5处)。\n\n在目标点生成一个带有不低于1级的装备的黄金宝箱怪。\n\n将诅咒法杖变成一件随机装备，升1级且必定拥有诅咒。\n\n不发生任何事。若语言设置为英文，则会出现弹窗：触发自毁程序，给予三个选项选择，无论选择哪个选项均会强制退出游戏，重进不影响存档。\n\n英雄获得1000回合伪装，期间贴图被随机替换为其他英雄，无实质影响。\n\n超新星爆炸，10回合后对以目标点为中心逐渐扩大到半径9格的圆形范围(可被墙体阻挡)内的所有地格产生数次炸弹爆炸。\n\n对以英雄为中心的11x11范围内的所有地格触发一个塌方陷阱效果，无法在Boss层及铁匠任务层正常触发。\n\n全层获得30~70回合重力混乱，所有生物每1~3回合会被推往随机方向3格。

custom.dict.dict.info_ring =戒指
custom.dict.dict.info_ring_d =戒指的效果以效果等级计算。\n\n对于未诅咒的戒指，_效果等级=戒指等级+1_，也就是0级戒指也有1效果等级。\n对于诅咒的戒指，_效果等级=戒指等级-2_，不会超过0。\n\n装备多个相同的戒指时，每个戒指的效果等级会相加决定最终效果。\n财富之戒是个例外，多个财富之戒在_提升掉落物概率_方面效果等级会正常相加，而在_提升宝藏级掉落给予的装备的等级下限_方面则是等级相等或更低级的财富之戒每个最多只提供2效果等级进行相加。\n\n戒指自然生成时，有1/15的概率+2，4/15的概率+1，2/3的概率+0。\n完成小恶魔任务获得的戒指有额外的2级并拥有诅咒。\n\n戒指自然生成时，有30%的概率拥有诅咒。\n\n自动鉴定戒指需要一级经验。

custom.dict.dict.info_artifact =神器
custom.dict.dict.info_artifact_d =每种神器在一局游戏中都只能生成一次。\n如果每种神器都生成过一次(包括已经出现在水晶宝箱中的神器)，再对现有神器进行嬗变则只会变成0级的戒指(根据神器显示等级每5级提升1级，向下取整)，后续楼层生成的水晶宝箱内的神器会尝试重新生成直至变为戒指。\n\n神器显示等级均为最大10级，但有些神器的实际等级不是10级，如虚空锁链、自然之履和时光沙漏。\n\n神器相对于其他物品的生成概率更低。\n\n神器自然生成时，只会是0级。\n\n神器自然生成时，有30%的概率拥有诅咒。\n\n神器装备后就会直接鉴定。

#items.consumable
custom.dict.dict.info_scroll =卷轴
custom.dict.dict.info_scroll_d =每局不同种子的游戏的卷轴图案是随机的，不能以此判断卷轴效果。\n\n升级卷轴以固定数量生成在地牢中，每个区域3张，共15张。\n开启_禁忌咒文_挑战后，升级卷轴则会以21212分布在五个区域，共8张。\n\n鉴定卷轴与祛邪卷轴是最常见的卷轴，每个上锁的卷轴房里必定有一张鉴定或是祛邪。\n此外，每个商店也会固定刷新一张鉴定、祛邪与探地卷轴。\n\n除升级卷轴以外，其余卷轴均可被烧毁、炸毁、解离等方式破坏。\n\n卷轴拥有两套生成权重，每局游戏会随机选一套进行生成：\n\n第一套：\n鉴定_3_，祛邪_2_，镜像_1_，充能_2_，传送_1_，催眠_1_，探地_1_，盛怒_1_，复仇_1_，恐惧_1_，嬗变_1_\n\n第二套：\n鉴定_3_，祛邪_2_，镜像_2_，充能_1_，传送_2_，催眠_1_，探地_1_，盛怒_1_，复仇_1_，恐惧_1_，嬗变_0_\n\n也就是在一半的游戏中，除特殊房间和隐藏房间以外，嬗变卷轴不会自然生成，掉落随机卷轴的敌人也因此不会掉落嬗变卷轴。\n魅魔的卷轴掉落不受影响，每局游戏的魅魔都能够掉落嬗变卷轴。\n\n隐藏的卷轴房拥有独立的卷轴生成权重：\n鉴定_1_，祛邪_2_，镜像_3_，充能_3_，传送_3_，催眠_4_，探地_4_，盛怒_4_，复仇_4_，恐惧_4_，嬗变_6_\n\n因此可知，嬗变卷轴在隐藏的卷轴房中更容易找到。

custom.dict.dict.info_potion =药剂
custom.dict.dict.info_potion_d =每局不同种子的游戏的药剂颜色是随机的，不能以此判断药剂效果。\n\n力量药剂以固定数量生成在地牢中，每个区域2瓶，共10瓶。\n每个区域的2瓶力量药剂会分别分布在区域内除Boss层外的前两层和后两层。\n\n药剂分为有益药剂与有害药剂。\n力量、治疗、灵视、极速、隐形和经验药剂为默认饮用的有益药剂。\n冰霜、液火、毒气和麻痹药剂为默认扔出的有害药剂。\n而浮空和净化药剂则是饮用和扔出都有相应效果的药剂。\n\n除力量药剂以外，其余药剂均可被冻碎、炸毁、解离等方式破坏。当然，包括力量药剂在内的所有药剂都可以被英雄直接摔碎。\n\n在炼金釜中加入三粒种子可以炼制药剂：\n\n_三粒不同_的种子：50%的概率是完全随机的药剂，50%的概率会根据种子决定药剂。\n\n_两粒相同_的种子：33%的概率是完全随机的药剂，67%的概率会根据种子决定药剂。\n\n_三粒相同_的种子：100%的概率会根据种子决定药剂。\n\n上述有关药剂的炼制对于治疗药剂不完全适用(炼制出治疗的概率会随着炼制出的治疗数量不断衰减)。\n\n药剂拥有两套生成权重，每局游戏会随机选一套进行生成：\n\n第一套：\n治疗_3_，灵视_2_，冰霜_1_，液火_2_，毒气_1_，极速_1_，隐形_1_，浮空_1_，麻痹_1_，净化_1_，经验_1_\n\n第二套：\n治疗_3_，灵视_2_，冰霜_2_，液火_1_，毒气_2_，极速_1_，隐形_1_，浮空_1_，麻痹_1_，净化_1_，经验_0_\n\n也就是在一半的游戏中，除特殊房间和隐藏房间以外，经验药剂不会自然生成，掉落随机药剂的敌人也因此不会掉落经验药剂。\n\n隐藏的炼金房拥有独立的药剂生成权重：\n治疗_1_，灵视_2_，冰霜_3_，液火_3_，毒气_3_，极速_4_，隐形_4_，浮空_4_，麻痹_4_，净化_4_，经验_6_\n\n因此可知，经验药剂在隐藏的炼金房中更容易找到。

custom.dict.dict.info_lim_drop =治疗药剂限制获取
custom.dict.dict.info_lim_drop_d =地牢中的治疗药剂获取是有限的(财富之戒的额外掉落除外)。\n\n敌人的治疗药剂掉落存在上限：\n蝇群_5_，死灵法师_6_，吸血蝙蝠_7_，矮人术士_8_，恶魔血巢必定掉落但只有_4_个。\n\n炼制药剂同样存在限制，炼制出治疗的概率会随着炼制出的治疗数量不断衰减，最多炼制出10瓶，之后即便是三粒阳春草之种也只能炼制出随机的药剂。\n\n限制获取对概率的影响：概率降至_(获取上限-已获取数)/获取上限_倍。


custom.dict.dict.info_food =食物与饱食度
custom.dict.dict.info_food_d =此处提到的“饱食度”、“消耗饱食度”、“回复饱食度”也可分别改为“饥饿度”、“增加饥饿度”、“降低饥饿度”，总之意思都一样。\n\n每层非Boss层都会至少生成一份食物(80%是口粮，20%是肉馅饼)。\n\n英雄拥有_450饱食度上限_，能够回复饱食度并触发进食天赋的食物有：\n\n丰饶之角每点充能回复_90_饱食度。\n地牢浆果和安魂酊剂回复_100_饱食度。\n肉类和小包口粮回复_150_饱食度。\n备用口粮回复_200_饱食度。\n口粮回复_300_饱食度。\n炼制后的无味果、无味果块和肉馅饼回复_450_饱食度。\n全肉大饼回复_900_饱食度+_450_回合饱腹。\n\n这些食物在开启_缩餐节食_挑战后回复的饱食度降至1/3倍(其中全肉大饼综合来看仅降至1/2倍)。\n\n比较特别的是圣愈蜜药和全面净化合剂。\n圣愈蜜药能够回复_150_饱食度甚至能触发进食天赋。\n全面净化合剂则直接回复_450_饱食度但不触发进食天赋。\n两者都不受_缩餐节食_挑战影响。\n\n通常每过1回合就会消耗1点饱食度，一些特殊行为或效果会影响饱食度的消耗：\n\n_触发代谢诅咒：_消耗40点饱食度，与下列额外消耗饱食度的行为不同，这一消耗会直接转化为生命回复(以10比1的比例进行的转化)。\n\n_搜索周围(双击放大镜按键)：_花费2回合，但消耗6点饱食度。\n\n_一次失败的开锁(诅咒骷髅钥匙)：_花费2回合，但消耗6点饱食度。\n\n_挖掘非暗金矿墙体(铁匠任务层)：_花费1回合，但消耗4点饱食度。\n\n_处于饱腹状态(全肉大饼)：_消耗的饱食度会改为消耗饱腹效果的持续时间。\n\n英雄在非极度饥饿状态下拥有自然生命回复，每10回合回复1点生命。\n英雄饱食度为0后会进入极度饥饿状态，不再有自然生命回复，同时每回合受到_英雄最大生命0.1%_的累计伤害(满1立即结算)。

custom.dict.dict.info_priority =角色优先级
custom.dict.dict.info_priority_d =地牢中所有角色都有行动优先级。\n更新视野的优先级最高，其次是英雄，然后是环境效果(如气体)，再次是其它生物(其中盟友优先级稍高，如悲伤幽灵)，最后是各种效果结算(有些效果优先级很高，如治疗)。\n\n所有角色根据一根共同的时间轴决定行动先后，当前消耗回合少者优先。\n当这些角色都需要在同一个时间点行动时，按照优先级递减的顺序进行行动。\n\n合理利用优先级也是一个技巧，比如敌人沿直线行动会不可避免地受到正在扩散的气体的影响(因为气体先扩散并起作用，敌人再进行行动)。

custom.dict.dict.info_hero =英雄
custom.dict.dict.info_hero_d =英雄最大等级为30，30级以后再升级则会获得30回合赐福。\n\n英雄初始精准属性为10，闪避属性为5。\n\n每次升级，英雄精准+1，闪避+1，最大生命+5(_史莱姆娘_为+6)。\n\n英雄本身没有任何属性、抗性和免疫。\n_DM-400_是个例外，它拥有_非生物属性_，免疫流血、中毒和毒气。\n\n英雄拥有一定的被动侦查能力，但随着地牢的深入，隐藏地形会越来越难被发现。\n被动侦查发现隐藏门的概率为_0.2-楼层数/100_(20层之后无法被动发现)。\n被动侦查发现隐藏陷阱的概率为_0.4-楼层数/250_。\n诅咒先见护符会把被动侦查发现隐藏地形的概率全都降为0。

custom.dict.dict.info_mob =敌人
custom.dict.dict.info_mob_d =每个敌人都有击杀后可获得经验的最大英雄等级，当前英雄等级高于敌人可获得经验的最大英雄等级时，击杀敌人不会获得经验。\n\n在这个基础上+2就是击杀后可掉落掉落物的最大英雄等级，一样是高于此等级后击杀敌人不会掉落任何物品，也不会触发财富之戒的额外掉落。\n\n英雄与敌人的距离越近，就越容易被敌人发现。\n被睡眠敌人发现的概率为_1/(距离+潜行值)_。\n被游荡敌人发现的概率为_1/(距离/2+潜行值)_。\n潜行值：初始默认为0(_忍者_为3)，可由晦暗刻印提供。

custom.dict.dict.info_property =敌人属性
custom.dict.dict.info_property_d =一些敌人具有特定的属性，这些属性可以使它们获得一些抗性与免疫(具有抗性则相应的效果会减弱一半，具有免疫则相应的效果会完全无效)。\n\n_Boss属性：_对复仇卷轴、灵爆秘卷和秒杀效果拥有抗性，对同化效果(即变为盟友的效果，如沉沦)免疫，此外敌意符石只能对其造成5回合众矢之的，梦魇秘卷只能对其造成恐惧，腐化法杖最终只能对其造成定命而非腐化。\n\n_小Boss属性：_对同化效果免疫，敌意符石、梦魇秘卷和腐化法杖的效果对其产生的影响与Boss属性一致。\n\n_亡灵、恶魔属性：_无。\n\n_非生物属性：_免疫流血、中毒和毒气。\n\n_火属性：_对焰浪法杖拥有抗性，免疫燃烧。\n\n_冰属性：_对冰霜法杖拥有抗性，免疫冻伤和冻结。\n\n_电属性：_对雷霆法杖和电场拥有抗性。\n\n_酸属性：_对酸蚀拥有抗性，免疫腐蚀淤泥。\n\n_巨型属性：_无法进入宽度为1格的过道以及门。\n\n_无法移动属性：_字面意思。\n\n以上是属性固有的抗性与免疫，除此之外敌人可能还会有专门设定的抗性与免疫。

custom.dict.dict.info_spawn =敌人生成
custom.dict.dict.info_spawn_d =敌人生成数量有一定的规律，初次进入新的一层时该层会生成_3+0~3+该区域对应的层数_个敌人(如第一区域的第4层会生成3+4~7个敌人，其他区域的第4层同理)。\n黑暗层会在此基础上额外生成50%的敌人，而广阔层则会在此基础上额外生成33%的敌人。\n\n通常每50回合尝试生成一个敌人，黑暗层为33回合，拿到Yendor护符返程时清除所有敌人并每_5*当前敌人数量_回合(介于5~25之间，1层进一步缩短60%)生成一个敌人。\n巨魔铁匠任务层固定150回合生成间隔。\n\n敌人只会在英雄的视野外生成。\n\n每次生成敌人时，都有2%的概率将其替换为对应的稀有敌人。\n部分特殊的敌人如装甲石像和水晶宝箱怪(替换水晶宝箱)则为10%的概率，咒缚灵为1%的概率。\n\n跨区域生成同样存在：\n\n4层有2.5%的概率生成疯狂小偷。\n\n9层有2.5%的概率生成吸血蝙蝠。\n\n14层有2.5%的概率生成矮人尸群。\n\n19层有2.5%的概率生成魅魔。


custom.dict.dict.info_shop =商店
custom.dict.dict.info_shop_d =这一部分关于楼层数的计算均向下取整。\n\n商店只在6，11，16层分布，20层也会有商店但需要完成小恶魔任务并击败矮人国王才会生成。\n\n商店出售物品的价格为物品原始价格(也就是卖给店主或小恶魔的价格)的_(1+楼层数/5)*5_倍。\n\n商店会固定出售以下物品：\n\n根据背包内的物品数量出售一个包裹(药剂挎带、卷轴筒和魔法筒带)，例如下楼时背包中数量最多的是药剂(还要算上一个水袋)则生成药剂挎带。若对应物品数量都相等则为随机包裹；\n\n一件_(1+楼层数/5)_阶近战武器、一件_(1+楼层数/5)_阶护甲、一组_(1+楼层数/5)_阶投掷武器和两枚随机涂药飞镖；\n\n一件随机物品，取0~9其中一个数，0为一根法杖，1为一件神器，2为一枚戒指，3~9为一根奥术刻笔；\n\n一瓶治疗药剂和两瓶随机药剂；\n\n一张鉴定卷轴、一张祛邪卷轴和一张探地卷轴；\n\n两件随机物品，一半概率是随机药剂，一半概率是随机卷轴；\n\n两份小包口粮、一个重生十字架、一颗强化符石和两或三个炼金菱晶；\n\n一件随机物品，25%概率是一个蜜蜂罐，25%概率是一个炸弹，50%概率是一对炸弹；\n\n若有已鉴定且未诅咒的时光沙漏，则会尝试生成几袋魔力流沙，生成数量根据楼层决定(x为已生成过的魔力流沙数量)：6层为_(5-x)*0.2_袋，11层为_(5-x)*0.25_袋，16层为_(5-x)*0.5_袋，20层为_(5-x)*0.8_袋。\n\n商店店主或小恶魔处于英雄视野内时，若受到攻击、范围效果、环境效果等影响，第一次会警告英雄，第二次则会跑路且商品全部消失。\n\n尝试用神偷袖章窃取商品失败后，店主或小恶魔会直接跑路且商品全部消失。\n\n其中一层商店的店主或小恶魔跑路并不影响其他楼层的商店继续出售物品。

custom.dict.dict.info_surface =第0层
custom.dict.dict.info_surface_d =第0层是地表城镇。该层会在固定位置生成东隅桑榆、地牢博士、店主和测试石像，测试石像可用于伤害测试。\n\n地表商店按照固定的商品规则生成货物，其中部分装备、药剂和卷轴仍会随机决定，所有商品均按照20层的价格标准出售。\n\n第0层不会自然刷新敌人。上锁庄园内的楼梯通往高塔。

custom.dict.dict.info_tower =高塔
custom.dict.dict.info_tower_d =高塔从第0层上锁庄园内的楼梯进入，入口显示为_-1层_，继续向上会依次显示为-2层、-3层等负数层数。高塔可以无限向上探索，不存在固定的最终层。\n\n高塔使用独立的楼层、房间、陷阱、敌人与奖励生成规则。每_5_层为一个Boss层，Boss会根据地牢种子从当前可用的高塔Boss中确定；玩家每次在高塔内上楼或下楼时，日志都会预告下一场Boss战的楼层与Boss身份。\n\n普通楼层会从当前登记的高塔生物中等概率生成敌人，Boss层则使用独立战斗场地。高塔目前尚未完工，现有内容、数值与规则仍可能继续调整。

custom.dict.dict.tower_chapter =高塔生物
custom.dict.dict.tower_chapter_d =高塔使用独立的怪物与Boss生成表。本节记录当前已经实装的全部高塔生物，包括不会自然生成的召唤物。
custom.dict.dict.tower_camouflage_gnoll =迷彩豺狼
custom.dict.dict.tower_camouflage_gnoll_d =由高塔非Boss层的常规生物中等概率生成。\n\n这个敌人的最大生命为_100_，视野为_8_，攻击距离为_1_，攻击为_20~30_，防御为_0~10_，攻击延迟为_1_，移动速度为_1_，闪避为_20_，精准为_40_。\n\n处于草地、高草或枯草上时，闪避提高至_30_。攻击必定施加中毒：通常延长_2~4_回合，处于上述草地时延长_10~20_回合。\n\n掉落_13_经验，英雄超过_30_级后不再获得经验。有_50%_概率掉落金币。
custom.dict.dict.tower_corrosive_swarm =腐蚀蝇群
custom.dict.dict.tower_corrosive_swarm_d =由高塔非Boss层的常规生物中等概率生成。\n\n这个敌人的最大生命为_200_，视野为_8_，攻击距离为_1_，攻击为_15~25_，防御为_0~10_，攻击延迟为_1_，移动速度为_1_，闪避为_20_，精准为_40_。\n\n每次受到正数伤害都会向周围八格释放淤泥，并在生命高于_10_且附近存在空位时尝试分裂。淤泥伤害对它为_0_，但仍会触发分裂与连锁飞溅。分裂体不提供经验，药剂掉落率会随分裂代数逐代减半。\n\n最初的蝇群掉落_13_经验，英雄超过_30_级后不再获得经验；基础药剂掉落率为_1/8_。
custom.dict.dict.tower_corpse =死尸
custom.dict.dict.tower_corpse_d =由高塔非Boss层的常规生物中等概率生成。\n\n这个敌人的最大生命为_1_，视野为_8_，攻击距离为_1_，攻击为_10~40_，防御为_0_，攻击延迟为_1_，移动速度为_1_，闪避为_20_，精准为_40_。\n\n普通伤害不会降低其生命。任何正数治疗会转化为等量的无视护甲、不可规避伤害，因此只需恢复至少_1_点生命即可消灭它。具有_亡灵属性_。\n\n掉落_13_经验，英雄超过_30_级后不再获得经验。有_1/8_概率掉落毒气药剂。
custom.dict.dict.tower_earthly_serpent =尘世巨蟒
custom.dict.dict.tower_earthly_serpent_d =由高塔非Boss层的常规生物中等概率生成。\n\n这个敌人的基础最大生命为_240_，视野为_8_，攻击距离为_2_且需要弹道连通，基础攻击为_24~36_，防御为_8~16_，基础攻击延迟为_0.5_，基础移动速度为_1_，闪避为_20_，精准为_40_。\n\n它每累计造成1点近战伤害便增加_2_点最大生命，最多提高至_360_；前_100_点累计近战伤害还会将攻击与移动速度逐步提高至_2倍_，并将攻击延迟缩短至_0.25_。每经过1回合时间恢复当前最大生命的_5%_，并持续在自身及周围散布酸雾。近战攻击者对其造成实际伤害时，会按损失生命的_10%_延长中毒。\n\n具有_酸性和巨型属性_，免疫酸雾与腐蚀。掉落_13_经验，英雄超过_30_级后不再获得经验；必定掉落一粒种子。
custom.dict.dict.tower_roast_lamb_warlock =烤全羊术士
custom.dict.dict.tower_roast_lamb_warlock_d =由高塔非Boss层的常规生物中等概率生成。\n\n这个敌人的最大生命为_150_，视野为_8_，近战攻击距离为_1_，近战攻击为_0~20_，防御为_0~10_，攻击延迟为_1_，移动速度为_1_，闪避为_20_，精准为_40_。\n\n它首次攻击每个目标时，会在目标周围空地召唤持续_6_回合的绵羊，同一目标不会被再次放羊。之后只要目标可见且处于_7_格炎浪范围内，它便能越过羊群造成_15~35_点魔法伤害，并施加燃烧与_4_回合残废；炎浪角度为_70度_。\n\n具有_亡灵和火焰属性_，免疫火焰与燃烧。掉落_13_经验，英雄超过_30_级后不再获得经验；基础掉落为_1/6_概率羊群符石，另有初始_1/20_概率掉落焰浪法杖，法杖掉落后概率逐次减半。
custom.dict.dict.tower_mechanical_fist =机械拳头
custom.dict.dict.tower_mechanical_fist_d =由高塔非Boss层的常规生物中等概率生成。\n\n这个敌人的最大生命为_250_，视野为_8_，攻击距离为_1_，攻击为_10~35_，防御为_30~70_，攻击延迟为_1_，移动速度为_1_，闪避为_20_，精准为_40_。\n\n每次攻击命中都会沿攻击方向将目标击退至多_3_格，击退本身不造成碰撞伤害。具有_非生物和巨型属性_。\n\n掉落_13_经验，英雄超过_30_级后不再获得经验；不会掉落普通物品。
custom.dict.dict.tower_mimic_crocodile =拟态鳄鱼
custom.dict.dict.tower_mimic_crocodile_d =由高塔非Boss层的常规生物中等概率生成。\n\n这个敌人的最大生命为_100_，视野为_8_，攻击距离为_1_，通常攻击为_20~30_，防御为_0~10_，攻击延迟为_1_，移动速度为_1_，闪避为_20_，通常精准为_40_。\n\n生成后保持潜伏并对英雄不可见，第一次发动攻击时显形；该次攻击必定命中并造成_90_点基础伤害。每次命中都会施加_3_回合残废，并造成相当于实际伤害_50%_、至少1点的流血。\n\n掉落_13_经验，英雄超过_30_级后不再获得经验；有_1/4_概率掉落神秘肉、_1/100_概率掉落幻影肉。
custom.dict.dict.tower_obscura =胧光怪
custom.dict.dict.tower_obscura_d =由高塔非Boss层的常规生物中等概率生成。\n\n这个敌人的最大生命为_150_，视野为_8_，攻击距离为_1_，攻击为_15~30_，防御为_0~20_，攻击延迟为_1_，移动速度为_1_，闪避为_30_，精准为_50_。\n\n首次发现敌人后开始充能，累计花费_3_次行动在相邻空位召唤唯一一只寄生惧魔。寄生惧魔被击倒后会在下一次存在可用位置时满血复活；胧光怪死亡、失去控制或阵营发生异常时，所属寄生惧魔会被清除。\n\n具有_恶魔属性_。掉落_13_经验，英雄超过_30_级后不再获得经验；不会掉落普通物品。
custom.dict.dict.tower_wild_dread =寄生惧魔
custom.dict.dict.tower_wild_dread_d =只能由_胧光怪_召唤，不会进入高塔自然生成池。\n\n这个敌人的最大生命为_21_，视野为_8_，攻击距离为_1_，攻击为_15~45_，防御为_0~10_，初始攻击延迟为_5_，移动速度为_1_，闪避为_20_，精准为_50_。\n\n完成攻击后会逐步缩短攻击延迟，最低为_1_。只要所属胧光怪仍然存活，它被击倒后便会在死亡位置或附近空位以完整生命复活；坠落或失去主人会令其永久消失。具有_恶魔和非生物属性_。\n\n不提供经验，也不会掉落物品。
custom.dict.dict.tower_alienated_prismatic_guard =异化虹卫
custom.dict.dict.tower_alienated_prismatic_guard_d =由高塔非Boss层的常规生物中等概率生成。\n\n这个敌人的最大生命为_100_，视野为_8_，基础闪避为_20_，基础精准为_40_；攻击距离、攻击、防御、攻击延迟、移动速度、闪避与精准会随英雄当前装备动态变化，无法用固定数值表示。\n\n它每次行动都会复制英雄当前使用的武器、护甲、力量，以及精准、奥术、元素、闪避、武力、狂怒、疾速、根骨、神射和坚韧等战斗戒指效果，武器附魔与护甲刻印也会生效。首次看见英雄时立即尝试产生扭曲镜像，此后每_5_次行动再次尝试分裂。盟友会将它视作英雄。\n\n具有_非生物属性_，免疫毒气、酸雾、燃烧和盟友转化效果。掉落_13_经验，英雄超过_30_级后不再获得经验；有_1/8_概率掉落镜像卷轴。
custom.dict.dict.tower_twisted_mirror =扭曲镜像
custom.dict.dict.tower_twisted_mirror_d =只能由_异化虹卫_分裂产生，不会进入高塔自然生成池。\n\n这个敌人的最大生命为_1_，视野为_8_，基础闪避为_20_，基础精准为_40_；它复制英雄当前武器，因此攻击距离、攻击与攻击延迟随武器动态变化。它不复制英雄护甲、力量与战斗戒指，移动速度固定为_1_，防御仅可能来自所复制武器的格挡能力。\n\n武器附魔会正常生效，盟友会将它视作英雄。具有_非生物属性_，免疫毒气、酸雾、燃烧和盟友转化效果。\n\n不提供经验，也不会掉落物品。
custom.dict.dict.tower_soul_collector =灵魂收集者
custom.dict.dict.tower_soul_collector_d =由高塔非Boss层的常规生物中等概率生成。\n\n这个敌人的最大生命为_200_，视野为_8_，无法攻击，防御为_0~20_，移动速度为_1_，闪避为_20_；攻击距离、攻击、攻击延迟与精准对其没有实际意义。\n\n它会逃离锁定目标，并记录视野内所有死亡单位的位置。每个灵魂需要连续引导_3_次行动才能在原位置或附近空位生成一只强大的怨灵，多个灵魂会依次处理。具有_亡灵属性_。\n\n掉落_13_经验，英雄超过_30_级后不再获得经验；有_1/8_概率掉落灵视药剂。
custom.dict.dict.tower_powerful_wraith =强大的怨灵
custom.dict.dict.tower_powerful_wraith_d =只能由_灵魂收集者_复活灵魂生成，不会进入高塔自然生成池。\n\n这个敌人的最大生命为_100_，视野为_8_，攻击距离为_1_，攻击为_1+有效层数/2~2+有效层数_，防御为_0_，攻击延迟为_0.5_，移动速度为_2_，闪避为_(10+有效层数)×5_，精准为_10+有效层数_。有效层数取生成时的地牢缩放层数。\n\n它会飞行，每次行动恢复_1_点生命；攻击英雄时有_1/3_概率将英雄击退_1_格。具有_亡灵和非生物属性_。\n\n不提供经验，也不会掉落物品。
custom.dict.dict.tower_heavy_crabification =重度蟹化者
custom.dict.dict.tower_heavy_crabification_d =由高塔非Boss层的常规生物中等概率生成。\n\n这个敌人的最大生命为_150_，视野为_8_，攻击距离为_1_，攻击为_15~45_，防御为_0~10_，攻击延迟为_1_，移动速度为_0.5_，通常闪避为_20_，精准为_40_。\n\n面对当前锁定且可见的目标时拥有无限闪避，并能格挡来自角色或普通魔法攻击的伤害。伏击和来自非当前目标的夹击会令其闪避降为_0_，对应角色伤害减半后生效。腐化、环境、陷阱、气体与减益的持续伤害不能被格挡。脱离战斗累计_50_回合后会花费1回合蜕壳并恢复_30_点生命；重新交战会清空进度。\n\n掉落_13_经验，英雄超过_30_级后不再获得经验；有_50%_概率掉落神秘肉。
custom.dict.dict.tower_marsh_slime =泥沼史莱姆
custom.dict.dict.tower_marsh_slime_d =由高塔非Boss层的常规生物中等概率生成。\n\n这个敌人的最大生命为_200_，视野为_8_，攻击距离为_1_，攻击为_15~25_，防御为_0_，攻击延迟为_1_，移动速度为_1_，闪避为_20_，精准为_40_。\n\n第一次实际降低其生命或护盾的伤害会被归类为_物理_或_魔法_，此后同类伤害全部变为0；没有魔法标签的伤害统一视作物理伤害。适应类型会随存档保存。具有_黑暗黏液和巨型属性_。\n\n掉落_13_经验，英雄超过_30_级后不再获得经验；不会掉落普通物品。
custom.dict.dict.tower_rune_spinner =符文蜘蛛
custom.dict.dict.tower_rune_spinner_d =由高塔非Boss层的常规生物中等概率生成。\n\n这个敌人的最大生命为_120_，视野为_8_，攻击距离为_1_，攻击为_15~35_，防御为_0~10_，攻击延迟为_1_，移动速度为_1_，闪避为_20_，精准为_40_。\n\n它沿用蜘蛛的喷网与撤退逻辑，符文蛛网持续_3_回合，踏入者会迟缓_2_回合。噬咬有_50%_概率施加_7~8_回合中毒，并必定强制触发护甲上已有的诅咒刻印；若护甲没有诅咒刻印，每次命中有_1%_概率将其改刻为随机诅咒。免疫符文蛛网。\n\n掉落_13_经验，英雄超过_30_级后不再获得经验；不会掉落普通物品。
custom.dict.dict.tower_chain_shadow_thief =链影盗贼
custom.dict.dict.tower_chain_shadow_thief_d =由高塔非Boss层的常规生物中等概率生成。\n\n这个敌人的最大生命为_100_，视野为_8_，攻击距离为_1_，攻击为_15~40_，防御为_0_，攻击延迟为_0.5_，普通移动速度为_1_，携带赃物逃跑时为_2_，闪避为_20_，精准为_40_。当英雄处于视野内且锁链路径畅通且与英雄距离小于4时，它会使用守卫的锁链效果窃取一次符合条件的背包物品；可堆叠物品会整组被窃取。锁链不会拉动、伤害或残废英雄，锁链为一次性能力。\n\n掉落_13_经验，英雄超过_30_级后不再获得经验；没有固有掉落，死亡时会掉落当前携带的赃物。
custom.dict.dict.tower_pestilence_knight =瘟疫骑士
custom.dict.dict.tower_pestilence_knight_d =高塔每_5_层出现一次Boss层；瘟疫骑士会根据地牢种子与其他已登记Boss等权轮换。\n\n这个敌人的基础最大生命为_1500_，视野为_8_，攻击距离为_1_，基础攻击为_20~30_，防御为_10~25_，攻击延迟为_1_，前两阶段移动速度为_1_，终末阶段为_2_，闪避为_30_，精准为_50_。从高塔内部第_10_层（显示为_-10层_）的Boss战起逐级成长，最多成长6次：每次最大生命提高_5%_、攻击提高_3%_，防御上下限每两次成长约提高1点；终末阶段防御基础值改为_5~18_。\n\n单次受到的最终伤害不超过_150_。生命首次降至_70%_和_35%_时进入收割：先花费1次行动引导，再按场上对应瘴气格数恢复生命，每格_8_点且最多恢复_200_点，随后依次进入爆发与终末阶段。爆发阶段站在自身瘴气中时，除场地净化伤害外受到的伤害降低_20%_。\n\n孵化阶段使用疫病瓶；爆发阶段使用隔离带与三种轮换处方；终末阶段会以苍白冲锋、三段末日行列和感染层数诊断压迫战场。多数范围技能会先预警1回合，疫病瓶会根据英雄速度预警_1~2_回合。近战命中会击退_1_格，并有_50%_概率拒绝新施加的负面效果。\n\n踩上已经就绪的移动净化器，会立刻清除全场瘟疫瘴气及感染。战斗开始后还会对瘟疫骑士造成_100_点伤害，随后净化器会转移位置，并按照英雄行动重新充能_10_回合。\n\n具有_Boss、无法移动和无法睡眠属性_。不提供经验。死亡时必定掉落一瓶全面净化药剂，并从神器、+3戒指、+3法杖、+3附魔板甲、+3六阶武器中额外随机掉落一件奖励。
custom.dict.dict.tower_death_knight =死亡骑士
 custom.dict.dict.tower_death_knight_d =高塔每_5_层出现一次Boss层；死亡骑士会根据地牢种子与其他已登记Boss等权轮换。\n\n这个敌人的最大生命为_1500_，视野为_8_，攻击距离为_1_，攻击为_28~42_，第一、二阶段防御为_15~30_而最终阶段为_0_，攻击延迟为_0.5_，第一、二阶段移动速度为_2_而最终阶段为_3_，闪避为_30_，精准为_50_。每两次近战命中会将目标击退。\n\n单次受到的最终伤害不超过_150_。生命降至_1050_和_525_时锁血并花费1回合转入破阵、死斗阶段，转阶段期间免疫伤害。第一阶段使用直线与扇形轰炸；第二阶段加入十字、圆环、灵魂直线与处刑；最终阶段进一步扩大范围、提高伤害并加快轰炸频率。普通轰炸预警_1_回合，处刑预警_2_回合，技能伤害会随阶段在约_40~95_点间变化。\n\n第二阶段起，麻痹、冻伤、睡眠、恐惧、魅惑和失明等控制时长减半；最终阶段免疫麻痹、冻伤与睡眠。具有_Boss和无法睡眠属性_。\n\n不提供经验。死亡时必定掉落一块附魔符石和一块强化符石，并从神器、+3戒指、+3法杖、+3附魔板甲、+3六阶武器中额外随机掉落一件奖励。
 custom.dict.dict.tower_gentleman_elf =绅士精灵
custom.dict.dict.tower_gentleman_elf_d =高塔Boss层中与其他已登记Boss等权轮换的敌人。\n\n最大生命为_1500_，视野为_6_，攻击距离为_1_，普通攻击为_20~40_，防御为_0~20_，攻击延迟为_1_，前两阶段移动速度为_0.8_，第三阶段为_1.6_，闪避为_25_，精准为_50_。单次受到的最终伤害不超过_50_，生命降至_1200_和_600_时锁血并转阶段。\n\n第一阶段按节奏投掷蓝色醉意酒与黄色昂扬酒，并使用直线突进；投酒只锁定当前敌对目标，没有目标时会等待。第二阶段生成唯一的绿色精灵酒杯，酒杯存在时Boss始终以酒杯为行动目标，不会因受击或其他索敌因素转移目标；酒杯被击破后，下一次可行动时优先使用“这个我吃了！”，之后每_10_个Boss行动回合最多使用一次。酒杯被击破后会让击破者获得昂扬，并将场上昂扬切换为醉意。\n\n第三阶段生成两个幻影；幻影消失后进入狂暴，所有主动攻击替换为宽三格的“这个我吃了！”。全阶段每隔_20_个全局回合准备一次“分着喝吧！”，但只有Boss没有其他特殊能力时才会释放。该能力只影响非同阵营的敌对目标，造成_10_点伤害，并施加_3_回合漂浮眩晕和虚弱。\n\n不提供经验。死亡时在绿光果实（一次掉落_3_个）和酸味的酒香之间等概率选择一项，并继续生成一件高塔Boss通用奖励。

custom.dict.dict.info_feeling =氛围层
custom.dict.dict.info_feeling_d =楼层生成为普通层的概率为50%，否则生成氛围层。\n\n共7种氛围层，每种概率1/14。\n\n隐秘层：本层额外生成一个隐藏房间，且部分正常门会被隐藏。\n\n流水层：本层几乎被水覆盖。\n\n草木层：本层高草覆盖率大幅提升。\n\n陷阱层：本层增加400%不被隐藏的陷阱。\n\n深渊层：本层所有连接房间的过道周围不再有墙体，取而代之的是大面积深渊。\n\n黑暗层：本层视野减半，且敌人初始数量增加50%，敌人生成间隔从50回合变为33回合。\n\n广阔层：本层额外生成一个特殊房间，且房间数量增加50%，敌人初始数量增加33%，物品生成增加2件。

custom.dict.dict.info_chasm =深渊
custom.dict.dict.info_chasm_d =坠入深渊的角色会立即死亡，英雄只会因此获得一半经验。\n\n若英雄坠入深渊则只会损失_英雄最大生命50%_的生命，生命不足一半时则失去_0~max(英雄最大生命25%, 英雄当前生命50%)_的生命(max为取两者中的较大者)。\n此外还会根据英雄坠入深渊前的生命附加原始值为_英雄最大生命*1/(12-6*英雄失血比)_的流血。\n\n坠入深渊的物品会被存储并在英雄下楼时于下层的随机位置生成(不会生成于特殊房间与隐藏房间，下层为Boss层则固定生成在上楼楼梯口附近)，不过药剂和蜜蜂罐会因此碎裂，而种子在未开启_荒芜之地_挑战的情况下会因此生长成特殊植物。

custom.dict.dict.info_lck_floor =背水一战
custom.dict.dict.info_lck_floor_d =英雄在触发Boss战(不包括巨魔铁匠任务层的Boss战)后会获得背水一战效果，该效果会持续到Boss战结束。\n\n背水一战期间英雄无法从本层脱离，同时饱食度不再降低、不再因为极度饥饿而损失生命值、所有自然回复都会被暂停。\n\n背水一战期间英雄可以通过对Boss造成伤害以获取自然回复时间。攻击Boss的衍生敌人无法获取自然回复时间。\n\nBoss每受到1点伤害，英雄都可以获取_n_回合的自然回复时间，在此时间内英雄的生命能够自然回复，决斗家武技、法杖、神器、护甲技能等充能的自然回复也将正常进行。\n\n_n_的值如下(开启_绝命头目_挑战后为中括号内的值)：\n粘咕：_1.5[1]_\n战士？：_1.8[1]_\n天狗：_1[0.67]_\n盗贼？：_1[0.67]_\n暗影映像：_0.25[0.25]_\nDM-300：_1[0.5]_\n矮人国王：_0.33[0.2]_\nYog-Dzewa：_0.5[0.33]_\n古神之拳：_0.5[0.25]_\n大恶魔和他的帮手们：_0.33[0.33]_\n店主和他的帮手们：_0.33[0.33]_\n\n进入背水一战时具有初始_50[20]_回合的自然回复时间。\n\n粘咕通过踩水回复的每点生命值都会扣除英雄_1.5[1]_回合的自然回复时间。

custom.dict.dict.info_ranking =排行榜
custom.dict.dict.info_ranking_d =排行榜按照总分进行从高到低的排列。\n\n分数计算公式：\n总分=(游戏分+寻宝分+探索分+Boss战分+任务分)*挑战倍率*通关倍率。\n\n_游戏分_=最深楼层数*英雄等级*65，上限50000。在最深楼层为26且英雄等级为30时达到上限。\n\n_寻宝分_=金币收集数+背包内所有物品原始价格之和，上限20000。\n\n_探索分_=到达过的楼层数*全探索的楼层数*50，上限20000。\n全探索的条件为：\n_第一：_\n看见过所有生成的物品、打开所有能打开的容器如宝箱、收集到所有钥匙；\n_第二：_\n清除所有献祭之火、魔法火墙、活化石像、宝箱怪；\n_第三：_\n清除所有路障(不包括非堵路的路障)、上锁的门，使用所有钥匙，发现所有隐藏门。\n\n_Boss战分_满分20000，每个Boss可无限扣分，但结算时负分会按0分处理。\n得分细则如下：\n_粘咕：_\n满分1000。每用出一次目标为英雄的蓄力攻击-200分。\n_天狗：_\n满分2000。英雄每次踩到毒镖陷阱-100分，英雄每次被特殊能力影响-100分。\n_DM-300：_\n满分3000。英雄每次受落石攻击-100分，英雄每次受到能量塔电击-100分，英雄每次因地表导线触电-200分。\n_矮人国王：_\n满分4000。英雄每次受到矮人术士的法术攻击-400分。\n_Yog-Dzewa：_\n满分10000。基础5000分，21~24层每有一个恶魔血巢存活+1250分，英雄每次受到本体的激光攻击-500分。\n\n_任务分_满分10000，四个区域四个任务满分分别为1000、2000、3000和4000，每个任务可无限扣分，但结算时负分会按0分处理。\n得分细则如下：\n_悲伤幽灵任务-腐臭老鼠：_\n英雄每次被腐臭老鼠攻击触发腐蚀淤泥且不在水中-50分，英雄每次被腐臭气体(无论任何来源，如混沌香炉)麻痹-100分。\n_悲伤幽灵任务-豺狼诡术师：_\n豺狼诡术师连击数大于1时(迫使其移动即可打断连击)，攻击任何角色-50分。\n_悲伤幽灵任务-巨钳螃蟹：_\n巨钳螃蟹格挡任何角色攻击-50分。\n_老杖匠任务-元素余烬：_\n英雄每次被新生火焰元素的蓄力攻击喷到-200分。\n_老杖匠任务-腐莓之种：_\n英雄每次被腐莓触手攻击-100分。\n_老杖匠任务-尸尘：_\n尸尘召唤的每只怨灵在第二和第三下攻击都会-100分。\n_巨魔铁匠任务-水晶层：_\n英雄每少挖一块暗金矿-50分，英雄未击败水晶尖塔-1000分，英雄在距离水晶尖塔大于等于9格且水晶尖塔满血的情况下每次被水晶守卫攻击-100分，英雄每次被水晶尖塔的特殊攻击击中-100分。\n_巨魔铁匠任务-豺狼层：_\n英雄每少挖一块暗金矿-50分，英雄未击败豺狼地卜师-1000分，英雄每次被豺狼工兵或豺狼地卜师的落石能力与丢出的岩砾击中-100分。\n_小恶魔任务：_\n暂无扣分条件。\n\n_挑战倍率：_0挑战为1，每有一个挑战倍率*1.25(精确到0.05)，9挑战为7.45。\n\n_通关倍率：_满身疮痍(未通关)为1，通关但未携带Yendor护符回到地面为2，携带Yendor护符回到地面为2.5。\n\n其它因素不参与分数计算。

custom.dict.dict.info_bones =英雄遗骸
custom.dict.dict.info_bones_d =英雄在一局游戏中死亡后，英雄遗骸会在下一局游戏的对应楼层生成，如为Boss层则固定在上楼楼梯口附近。\n\n一层只能存在一个英雄遗骸。\n\n一个存档可以开启多个英雄遗骸。例如：存档1死于1层，新建存档2去开启1层的遗骸，在存档2进入2层之前新建存档3死于2层，则存档2进入2层后能够找到存档3的遗骸。\n\n在每日挑战中死亡不会留下英雄遗骸。\n\n如果开启了任意挑战或者自定义种子，死亡后留下的英雄遗骸只会生成英雄专属遗物。\n\n英雄专属遗物效果：\n_纹章残蜡(战士)：_获得_英雄最大生命20%_点护盾(四舍五入)。\n_横断魔杖(法师)：_为背包内的所有法杖及魔杖回复1点充能。\n_残破织物(盗贼)：_获得相当于4回合的神器充能效果(也就是瞬间生效等量回合的神器充能效果)。\n_灵弓残件(女猎手)：_以英雄为中心的3x3地格变为草，其中至多有5格会变为高草。\n_断折剑柄(决斗家)：_获得体能增幅效果，接下来的2次物理攻击额外造成_英雄等级/3_点伤害(向下取整，至少为2)。\n_圣典残页(牧师)：_恢复_英雄最大生命10%_点生命(四舍五入)。\n_破损皮包(绅士)：_获得114枚金币。\n_抹茶布丁(史莱姆娘)：_回复60点饱食度(不受_缩餐节食_挑战影响)并能够触发进食天赋。\n_金属残片(忍者)：_为背包内的所有投掷武器回复1点耐久(不对飞镖及涂药飞镖生效)。\n_损坏控件(DM-400)：_产生一个英雄的镜像。\n_皇室珠宝(矮人公主)：_获得30回合珠宝余能效果，期间背包内的所有戒指获得1级临时等级。\n_瓶装能量(修士)：_获得_2+英雄等级/5_点炼金能量(向下取整)。\n\n较大可能性生成(2/3概率)：\n生成装备栏(每个装备栏1/7概率)或快捷栏(总共2/7概率)中的一件物品，如果对应的栏目没有可以在遗骸中生成的物品则返回初始重新判定。\n\n较小可能性生成(1/3概率)：\n背包内的一件物品(数量为_1~(数量+1)/2_)，如果物品不足三件，则用金币补充到三件。如果金币数量大于100则会生成_50~金币数量/2_枚金币，不足100则只生成50枚金币。\n\n如果生成的是装备则继承原等级但不超过3级，如果是神器则只有0级。\n\n一些物品不能在遗骸中生成，如英雄的初始装备(武器、投掷武器、护甲、神器等)和具有贵重属性的物品(水袋、升级卷轴、力量药剂等)。

custom.dict.dict.fight_mech =战斗机制
custom.dict.dict.fight_mech_d =一次正常的物理攻击分为若干固定步骤。\n\n1.给出攻击。攻击方给出攻击的具体信息，包括伤害，精准等。\n\n2.命中检定。攻守双方进行精准与闪避的修正与计算，在0~最终精准与0~最终闪避的范围内拼点，攻方不失败则为命中。\n\n3.预修正。攻守双方根据特殊状态进行伤害与防御的修正。\n\n4.守方修正。防守方结算防御特效(如护甲刻印)，对伤害进行一次修正。\n\n5.护甲减免。将伤害减去护甲值。\n\n6.攻方修正。攻击方结算攻击特效(如武器附魔)，再一次修正伤害。\n\n7.承受伤害。防守方对计算完成的伤害进行最终修正，如抵抗、免疫。\n\n8.最终结算。防守方承受伤害，处理此次攻击的结果。\n\n命中率的计算(可用于磐岩刻印的减伤计算：_(1-敌方命中率)*刻印强化*0.75_)：\n设a为攻方最终精准，e为守方最终闪避，c为命中率。\na>e时，c=1-e/(a*2)\na≤e时，c=a/(e*2)\n\n必中和必闪效果跳过2步骤且必闪大于必中。\n\n英雄的魔法攻击会跳过3~6步骤。

custom.dict.dict.quest_ghost =悲伤幽灵任务
custom.dict.dict.quest_ghost_d =原先的任务内容先鸽置罢\n\n下面为2.2.0改动：\n幽妹现在会在下楼楼梯所在房间生成和游荡，会避开楼梯和地上物品，移动速度改为0.5不变，三只任务怪更容易在游荡时前往英雄所在地(取两次随机目的地，选择与英雄较近的一个)


custom.dict.dict.quest_windmaker =老杖匠任务
custom.dict.dict.quest_windmaker_d =原先的任务内容先鸽置罢\n\n下面为2.2.0改动：\n尸尘生成怨灵现在需要1/4/9/16/25/36/49/49/...回合，在英雄视野内且与英雄距离大于当前视野半径的1/3(四舍五入)。\n\n新生火元素出生时拥有满生命值，伤害20~25变为10~12，精准25变为15。\n特殊攻击有随机3~5回合冷却时间，冷却完成后随机选取目标相邻格子充能，给予3×3范围的警告，一回合后使该范围着火(但不造成直接伤害)。若弹道受阻选取格子失败则进入1回合冷却。\n仪式房间扩大为至少含墙9*9。\n\n腐梅之心的毒气会根据周围八格实体数量减少。腐梅触手血量40变为80，伤害8~15变为10~20,精准15变为25，掉落率1变为0.75，脱战回血3变为5，且在敌人靠近时需要一回合后才能发现敌人进行攻击


custom.dict.dict.quest_blacksmith =巨魔铁匠任务
custom.dict.dict.quest_blacksmith_d =点击巨魔铁匠与其对话会得到镐子，随后可以通过巨魔铁匠房间内的楼梯下到任务层。\n\n任务层会生成1个巨型房间、3个大型房间、6~8个小型房间和2个包含4~5块暗金矿的隐藏房间(水晶层为晶洞，豺狼层为宝箱)，总共生成45~47块暗金矿，每块可换取50人情，最多可换取2000人情(也就是40块)。\n\n背包中拥有镐子时，点击巨魔铁匠任务层带有暗金矿的墙壁，可将其敲碎并获得一块暗金矿。同时尝试攻击水晶尖塔或打破豺狼地卜师的磐岩护盾都只需要镐子在背包中即可，无需装备。\n\n尝试敲碎不包含暗金矿的墙壁时，同样只花费1回合但会消耗4点饱食度。\n\n任务层固定150回合的敌人生成间隔，敌人生成上限比普通层更低1名。\n\n在任务层，因为可以通过镐子自由出入，所以虚空锁链允许英雄直接进入完全封闭的房间。\n\n每局游戏只能进入一次任务层，上楼梯出任务层视为任务结束。\n\n任务结束后会结算人情，挖矿人情=挖到的暗金矿数量*50，上限2000，如果击败了任务层Boss则额外增加1000人情。同时铁匠会收回镐子，但是保留它的所有属性(即使是诅咒)，以便之后英雄用人情换取镐子时原封不动地归还。\n\n以下为人情奖励：\n花费_250人情_可以获取之前那把镐子，如果结算人情超过2500则改为不消耗人情免费获取。\n花费_500人情_可以进行重铸，融合两件一样的已鉴定且未诅咒的装备，使最高等级的那件+1等级(等级相同则为左边那件+1等级)，并且不会消除原有附魔/刻印、强化等属性。重铸过一次后，下次重铸所需的人情+1000。\n花费_500人情_可以硬化一件已鉴定且未诅咒的武器/护甲，硬化后的装备在用升级卷轴升级时，正面附魔/刻印开始概率被消除的等级范围从4~8级提升至6~10级，若依旧被消除则失去硬化效果以抵挡一次消除。硬化过一次后，下次硬化所需的人情+1000。\n花费_1000人情_可以升级一件可升级的已鉴定且未诅咒的0~1级装备，使其等级+1。升级过一次后，下次升级所需的人情+1000。\n花费_2000人情_可以进行锻造，能从两件不同且已鉴定的武器、一组已鉴定的投掷武器和一件已鉴定的护甲中选择其中一个带走。这些装备是0~3级的概率分别为：30%，45%，20%，5%。这些装备有30%的概率拥有正面附魔/刻印。\n花费_全部人情_可以获取等量金币。


custom.dict.dict.quest_blacksmith1 =巨魔铁匠任务补充
custom.dict.dict.quest_blacksmith1_d =_水晶层：_\n1个巨型房间生成水晶尖塔，3个大型房间生成水晶守卫和水晶灵簇，6~8个小型房间生成水晶灵簇和食物。这些房间都可以生成水晶尖刺和暗金矿。\n此外还有2个隐藏房间(晶洞)生成，晶洞内密集分布大量水晶尖刺以及4~5块暗金矿。\n这些房间除了隐藏房间以外都会有至少一条通路完全连通。\n食物只会生成一份，开启_没入黑暗_挑战后额外生成一根火把，不会生成其他物品。\n敌人只有水晶尖塔、水晶守卫和水晶灵簇三种。\n地面上会遍布不可通行的水晶尖刺，背包内有镐子可以点击与英雄相邻的水晶尖刺以敲碎3x3范围内的所有水晶尖刺。\n\n_豺狼层：_\n1个巨型房间生成豺狼地卜师，3个大型房间生成豺狼工兵、豺狼守卫、路障和豺狼落石陷阱，6~8个小型房间生成豺狼守卫和食物。这些房间都可以生成岩砾和暗金矿。\n此外还有2个隐藏房间(宝箱)生成，房间为规整的方形，中间会有一个装着4~5块暗金矿的宝箱。\n这些房间绝大部分通路都被墙壁和大量岩砾隔断。\n食物会生成两份，开启_没入黑暗_挑战后额外生成一根火把，不会生成其他物品。\n敌人只有豺狼地卜师、豺狼工兵和豺狼守卫三种。\n地面上会遍布不可通行的岩砾，背包内有镐子可以点击与英雄相邻的岩砾以直接敲碎岩砾。\n该层的豺狼落石陷阱触发后会对5x5范围内的生物造成_6~12_点无视护甲的伤害并造成3回合麻痹(豺狼守卫为10回合)，同时会在范围内的每格(不包括上楼楼梯口及周围一圈的地格)以1/3的概率产生一块岩砾。路障周围一圈的地格不受该陷阱影响。\n\n_真菌层：_\n自2023年以来都处于有贴图有部分代码但没实装的状态，距离打赢复活赛还有多久仍是未知数。

