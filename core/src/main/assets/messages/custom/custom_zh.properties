custom.dict.dict.trap_1 =陷阱
custom.dict.dict.trap_1_d =地牢中的各个区域都分布着陷阱，此处会介绍区域陷阱分布及陷阱的效果。\n\n需要注意的是，下列提到的与楼层数挂钩的计算，在拿到Yendor护符返程后均以26代替楼层数计算。\n\n因陷阱房或隐藏房而分布在各区域的陷阱：\n毒镖陷阱，捕猎陷阱，传送陷阱，羊群陷阱，召唤陷阱，爆炸陷阱，落石陷阱。\n\n两个特殊陷阱：\n_排毒气孔：_分布在毒气房中，会源源不断地产生毒气。\n\n_豺狼落石陷阱：_分布在铁匠任务层中，不会被隐藏，触发后对5x5范围内的生物造成_6~12_点无视护甲的伤害并造成3回合麻痹(豺狼守卫为10回合)，同时会在范围内的每格(不包括上楼楼梯口及周围一圈的地格)以1/3的概率产生一块岩砾。路障周围一圈的地格不受该陷阱影响。\n\n常规陷阱介绍：\n_老化飞镖陷阱：_分布在第一区域且1层仅有此类陷阱，不会被隐藏，触发后对最近的生物发射飞镖(同等距离下优先向敌人发射)，造成4~8点伤害。\n\n_毒镖陷阱：_分布在第二、三区域，不会被隐藏，触发后对最近的生物发射毒镖(同等距离下优先向敌人发射)，造成4~8点伤害并造成_8+楼层数*0.67_回合的中毒。\n\n_解离陷阱：_分布在第四、五区域，而在隐藏的金币陷阱房中则会从第三区域开始出现，不会被隐藏，触发后对最近的生物发射解离光束(同等距离下优先向敌人发射)，造成_30+楼层数~50+楼层数_点魔法伤害。\n\n_虫洞陷阱：_全区域分布，可以多次触发而不损坏，触发后将3x3范围内的生物传送到一个固定地点，传送有安全检查。\n\n_寒气陷阱：_分布在第一、二区域，触发后产生3x3范围的寒气，持续10回合。\n\n_烈焰陷阱：_分布在第二、三区域，触发后产生3x3范围的火焰，持续2回合。\n\n_电击陷阱：_分布在第一、二区域，触发后产生3x3范围的电场，持续10回合。在电场中的生物会被麻痹并每2回合受到一次_0~2+楼层数/5_的电击伤害，而在电场中的法杖及魔杖则每回合回复1/3点充能(英雄持有法杖处于电场中不算)。\n\n_警报陷阱：_分布在第一、二区域，触发后将本层所有敌人吸引至陷阱所处的地格。\n\n_捕猎陷阱：_分布在第二、三区域，可以多次触发而不损坏，触发后造成_0~2+楼层数_点伤害并施加原始值等同于伤害的流血以及10回合残废。\n\n_传送陷阱：_分布在第一、二区域，触发后将3x3范围内的生物随机传送到本层各处。\n\n_淤泥陷阱：_分布在第一、二区域，对3x3范围内的生物造成20回合腐蚀淤泥。\n\n_冰霜陷阱：_分布在第三、四、五区域，触发后产生5x5范围的寒气，持续20回合。\n\n_爆炎陷阱：_分布在第四、五区域，触发后产生5x5范围的火焰，持续5回合(水和深渊上为1回合)。\n\n_雷暴陷阱：_分布在第四、五区域，触发后产生5x5范围的电场，持续20回合。在电场中的生物会被麻痹并每2回合受到一次_0~2+楼层数/5_的电击伤害，而在电场中的法杖及魔杖则每回合回复1/3点充能(英雄持有法杖处于电场中不算)。\n\n_守卫陷阱：_分布在第三、四、五区域，触发后在警报陷阱的基础上于本层生成_楼层数/5-1_个持有已鉴定0级武器的召唤守卫。\n\n_闪光陷阱：_分布在第四、五区域，可以多次触发而不损坏，触发后造成_0~4+楼层数_点伤害并施加原始值等同于伤害的流血以及10回合失明和20回合残废。\n\n_扭曲陷阱：_分布在第三、四、五区域，触发后将3x3范围内的生物随机传送到本层各处，同时英雄会遗忘本层地形。\n\n_致眩气体陷阱：_分布在第一、二、三区域，触发后产生总计_300+楼层数*20_单位的致眩气体。\n\n_毒气陷阱：_分布在第一、二区域，触发后产生总计_300+楼层数*20_单位的毒气。\n\n_腐蚀酸雾陷阱：_分布在第三、四、五区域，触发后产生总计_80+楼层数*5_单位的腐蚀酸雾。处于腐蚀酸雾中的生物会直接获得1回合起始伤害为_1+楼层数/4_的酸蚀。\n\n_羊群陷阱：_分布在第一、二区域，触发后生成5x5范围的魔法绵羊，持续6回合。\n\n_召唤陷阱：_全区域分布，触发后生成1~3个当前楼层能够生成的敌人。\n\n_虚弱陷阱：_分布在第四、五区域，触发后造成60回合虚弱，对于Boss和小Boss则为10回合。\n\n_诅咒陷阱：_分布在第四、五区域，触发后诅咒一件装备着的武器(不包括魔杖)或护甲，优先诅咒无附魔的武器或无刻印的护甲，对于神器不会进行诅咒，对于戒指和法杖(包括魔杖)则在主动扔出并触发时进行诅咒。\n\n_激流陷阱：_分布在第二、三、四、五区域，触发后同水爆魔药。\n\n_爆炸陷阱：_全区域分布，触发后相当于直接爆炸的炸弹。\n\n_落石陷阱：_分布在第三、四、五区域，不会被隐藏，触发后对整个房间的生物造成_5+楼层数~10+楼层数*2_点伤害并造成10回合麻痹。\n\n_塌方陷阱：_分布在第三、四、五区域，触发后的第二回合使3x3范围内的生物和物品坠入下一层，无法在Boss层及铁匠任务层正常触发。\n\n_重构陷阱：_分布在第四、五区域，触发后生成3~5个任意敌人，其中一定会生成1个怨灵/巨型食人鱼/宝箱怪/活化石像，有较大的概率生成稀有敌人，这些敌人的最大掉落等级为30。此外还会有1%的概率将生成鼠王，如果在同一层多次生成了鼠王则只会将上一次生成的鼠王传送过去，生成后它会往英雄视野外的方向移动并最终消失。\n\n_缴械陷阱：_分布在第四、五区域，触发后会将英雄手中的武器传送至10~20格远处，但可以直接看到武器的位置，而对于活化石像、装甲石像和召唤守卫则会直接秒杀并原地掉落装备。\n\n_即死陷阱：_分布在第五区域，不会被隐藏，触发后对最近的生物发射即死魔法(同等距离下优先向敌人发射)，造成_生物最大生命*0.5+生物当前生命*0.5_点魔法伤害(Boss对其拥有抗性)，对于英雄则会造成_英雄最大生命*0.9_点魔法伤害。


##*7****************** unclassified
custom.dict.dict.misc_random_mode =随机模式
custom.dict.dict.misc_random_mode_d =随机模式会在固定种子的基础上重排大量地牢规则，使用相同种子时结果可复现。\n\n_物品生成改动：_\n原本生成概率不为0的物品、装备阶数和同类候选会尽量等概率出现。\n1阶的武器，投掷武器和护甲现在可以自然生成。\n武器，投掷武器和护甲生成后的实际力量需求会在_原值-2~原值+1_之间浮动。\n一组投掷武器生成时的堆叠数量不再固定，而是75%概率3件，20%概率2件，5%概率1件。\n除NPC的任务奖励外，戒指和法杖生成后的等级变为0~3，概率与特殊房间的武器等装备一致。\n法杖的鉴定模式现在和戒指类似，在施法前无法通过外形判断法杖类型。\n\n_附魔和诅咒改动：_\n正面附魔/刻印和诅咒附魔/刻印会根据种子打乱——在保证数量不变的情况下，部分正面附魔/刻印会与诅咒附魔/刻印交换，这会影响附魔符石、奥术刻笔等物品的使用以及装备的生成等等(你可能会通过附魔物品得到诅咒附魔/刻印，而献祭之火房间和上锁墓碑房间的等级判断也可能难以适用)。\n正面附魔/刻印在生成时不再区分稀有度，获取的概率均等。\n诅咒法杖效果不再区分稀有度，施法产生的概率均等。\n\n_炼金和蜕变改动：_\n炼金放入魔能触媒得到的4个饰物选项都不再可见。\n使用蜕变卷轴会跳过类型选择，直接给出四个随机选项。\n使用升华秘卷会随机获得一个该秘卷能给予的Boss天赋。\n\n_敌人和地形改动：_\n常规敌人在生成时被替换为对应的稀有敌人的概率提升至20%，装甲石像和水晶宝箱怪为40%，咒缚灵为10%。\n除1层外，每层都会有一个固定生成的非小Boss、非精英敌人获得小型头目效果，生命值提升_楼层数*3_，获得_12%+楼层数*2%_的物理伤害提升和_16%+楼层数*1%_的精准闪避提升。\n击杀小型头目敌人会掉落一件无诅咒的0~3级装备(武器，投掷武器和护甲)。\n常规陷阱在生成时不再按区域限制生成，意味着浅层可以出现深层陷阱，而深层可以出现浅层陷阱。\n守卫陷阱在浅层触发时至少会生成1名召唤守卫而不是无法生成。\n重构陷阱在第一、二、三区域生成时不会被隐藏。\n\n_天赋、专精和护甲技能改动：_\n英雄会根据种子获得完全随机的初始天赋、专精(其中不包括_绅士_)和护甲技能，部分专精会补发几乎必需的职业核心物品或能力，若已有则不会重复给予：\n_狂战士和角斗士：_破损纹章。\n_战斗法师：_灌注了随机法杖的法师魔杖。\n_刺客：_暗影斗篷。\n_狙击手：_灵能弓。\n_守望者：_不会践踏高草。\n_勇士：_可以使用武技。\n_祭司和圣骑士：_神圣法典。\n_AT-400和AU-400：_指令集合工具。\n_炼金师：_炼金喷枪。\n_虔信者：_拥有理智机制但回复和减少方式受限于部分物品和环境等方面的互动并且不可转化为炼金能量。\n可以获得的随机天赋将包括正常流程中无法蜕变得到的天赋，如_绅士_的_潜力激发_和_潜力无限_。\n因专精获得额外的特殊能力时，长按快捷按键可切换特殊能力。\n\n查种器的查询结果会根据当前是否启用随机模式发生变化，也可以在查询条件中写入“随机模式”四个字以按随机模式查询物品生成和随机天赋等信息。

custom.dict.dict.misc_ankh =重生十字架
custom.dict.dict.misc_ankh_d =会在6，11，16和20层的商店固定出售一个，装满露珠的水袋可对其进行祝福，也可将其丢向生命之泉进行祝福。\n\n祝福的十字架会为英雄抵挡一次致命伤害，同时会回复_英雄最大生命25%_点生命并给予3回合无敌。\n\n未祝福的十字架则允许英雄死亡后从背包中选择携带两件物品在本层的随机一处地点满状态复活。复活后会获得4回合隐形，本层地形会被遗忘，而背包则会被留在死亡地点，在拾回背包之前无法拾取任何物品。\n\n若是在背水一战的情况下使用未祝福的十字架复活，则Boss层会被重置，英雄会在上楼楼梯口附近复活，背包也会被放在附近。\n\n若是在击败Boss后的Boss层使用未祝福的十字架复活，则英雄会是在原地复活，不会重置Boss层。\n\n若是在返程Boss战过程中使用未祝福的十字架复活，则英雄会是在原地复活，但只保留1点生命。

custom.dict.dict.misc_amulet_curse = 护符诡咒
custom.dict.dict.misc_amulet_curse_d = 在携带Yendor护符从25层上楼时触发，在此期间，部分与楼层数相关的计算公式均以26代替楼层数计算。\n\n每次到达Boss层会为英雄回复所有生命和450饱食度。\n\n具有诅咒值，初始为0，每上一层新的、非Boss的楼层就会+2，无上限。\n\n消灭一个被强化的敌人可-1诅咒值(恶魔撕裂者与矮人尸群-0.5)，最多降至0。\n\n消灭被强化的敌人同时会获得10经验并触发所有“获得经验时”的效果，即使已经达到等级上限。\n\n诅咒值达到2时，所有敌人的目标改为英雄的方位。\n诅咒值达到4时，所有敌人的移动速度*2。\n诅咒值达到6时，英雄的移动速度减半并且不会超过1。\n诅咒值不低于8时，英雄每回合受到_(诅咒值-4)/4_点伤害。\n\n敌人会受到生命、防御、伤害、精准、闪避五个方面的强化，不同敌人的强化倍率不同。\n\n_强化倍率：_\n恶魔撕裂者_1.2_，魅魔_1.2_，邪眼_1.1_，巨蝎_1.1_\n\n矮人尸群_1.67_，元素_1.67_，矮人术士_1.5_，矮人武僧_1.5_，魔像_1.33_\n\n吸血蝙蝠_2.5_，豺狼暴徒_2.25_，豺狼萨满_2.25_，矿洞蜘蛛_2_，DM-200 _2_\n\n骷髅_5_，疯狂小偷_5_，DM-100 _4.5_，监狱守卫_4_，死灵法师_4_\n\n啮齿小鼠_10_，下水道巨蛇_9_，豺狼巡查_9_，蝇群_8.5_，下水道螃蟹_8_，史莱姆_8_\n\n上述敌人对应的稀有敌人拥有相同的强化倍率。

custom.dict.dict.misc_sac_fire = 献祭之火
custom.dict.dict.misc_sac_fire_d = 取得献祭之火的奖励需要获得_6+楼层数*4_点献祭经验，在献祭之火覆盖的3x3范围中杀死敌人可以获得献祭经验。\n\n大部分敌人的献祭经验为_1+自身经验_，分裂的蝇群为1，活化石像或宝箱怪为_1+楼层数_，巨型食人鱼或金色蜜蜂为_1+楼层数/2_，怨灵为_1+楼层数/3_。杀死敌人获得的献祭经验还需乘2~3计算。\n\n如果是英雄本身则为1000000，是盟友则不会提供献祭经验。\n\n在本层没有敌人的情况下，英雄站在献祭之火的范围中时会立即在本层生成1个敌人，至多因此生成3个敌人。\n\n产生奖励为一件武器，如果生成时没有诅咒则升一级，没有正面附魔还会赋予诅咒附魔，最后诅咒。

custom.dict.dict.misc_reason =理智
custom.dict.dict.misc_reason_d =_修士_的独特机制，起始100点，上限100点，不会随时间回复。\n\n_常规扣除方式：_\n\n炼金时可扣除5点理智转化为1点炼金能量。\n\n装填炼金喷枪时若炼金能量不足以装满，则未满部分每装填1点就扣除5点理智。\n\n受到来自大部分敌人的攻击时，若当前生命值低于最大生命值的一半，则扣除_损失生命+2~5_点理智(不会超过30)。\n\n受到来自_亡灵和恶魔属性_敌人的攻击时，扣除_损失生命+1~2_点理智；若当前生命值低于最大生命值的一半，则扣除_损失生命+2~5_点理智(两种情况均不会超过30)，并且有20%概率获得10回合的惊恐。\n\n受到来自怨灵和咒缚灵的攻击时，扣除5点理智，并且有33%概率获得10回合的惊恐。\n\n受到Yog-Dzewa的激光射击时，扣除25点理智(开启_绝命头目_挑战后为50)，并且直接获得20回合的惊恐；除前述影响外，Yog-Dezwa每次召唤古神之拳都会给予25回合的惊恐，古神之拳在满足生命值条件下给予惊恐的概率也高于常规的_亡灵和恶魔属性_敌人(为50%概率给予10回合的惊恐)。\n\n拥有惊恐效果时，每回合扣除_1~2_点理智，该效果可叠加的最大时长不会超过30回合。\n\n在陷阱地格触发陷阱时，扣除10点理智。\n\n受到饥饿伤害时，扣除2点理智。\n\n装备诅咒物品时，扣除10点理智。\n\n_常规回复方式：_\n\n击杀大部分敌人时，回复_1~2_点理智。\n\n击杀_亡灵和恶魔属性_敌人时，回复_2~5_点理智。\n\n击杀怨灵和咒缚灵时，回复2点理智，并且会清除惊恐效果。\n\n击杀_小Boss属性_敌人时，回复10点理智。\n\n击杀_Boss属性_敌人时，回复50点理智，并且会清除惊恐效果。\n\n击杀Yog-Dzewa时，回复100点理智，并且会清除惊恐效果。\n\n揭露隐藏地形时，为门则回复5点理智，为陷阱则回复2点理智。\n\n回复饱食度的同时会回复_回复的饱食度/100_点理智(向下取整但至少为1，开启_缩餐节食_挑战后为_回复的饱食度/33_)；部分饱食度来源还有额外的回复：幻影鱼肉5点，全肉大饼10点，圣愈蜜药5点且会清除惊恐效果，全面净化合剂20点且会清除惊恐效果，安魂酊剂50点且会清除惊恐效果，生命之泉100点且会清除惊恐效果。\n\n对诅咒物品和咒缚灵使用祛邪卷轴时，回复10点理智。\n\n使用火把时，回复10点理智(开启_没入黑暗_挑战后为5点)。\n\n魔法睡眠期间每2回合回复1点理智。\n\n使用十字架复活时，未祝福则理智重置为100点，祝福则回复50点理智。\n\n_折磨与美德：_\n\n理智为0时，下一回合会获得折磨或美德效果，折磨概率为75%，美德概率为25%。\n\n获得折磨时理智重置为100点，获得美德时回复50点理智(振奋为60点)。\n\n折磨总是持续至多300回合，而美德则是至多150回合。\n\n击杀大部分敌人时，折磨减少6回合，美德增加3回合。\n\n击杀_Boss属性_敌人时，折磨减少100回合，美德增加50回合。\n\n击杀Yog-Dzewa时，清除折磨效果，美德增加150回合。\n\n使用祝福后的十字架复活时，清除折磨效果，美德增加50回合。\n\n折磨期间理智为0则死亡，美德期间理智为0则清除美德并回复100点理智。\n\n_所有折磨：_\n\n_恐惧：_闪避+50%，物理攻击造成的伤害-25%，每次受到未闪避的攻击有30%概率扣除5点理智。\n\n_偏执：_攻击速度+20%，精准-20%，每次攻击未命中敌人有30%概率扣除5点理智。\n\n_绝望：_移动速度+20%，无法闪避攻击。\n\n_狂喜(虔信者)：_攻击速度+50%，物理攻击造成的伤害+30%，闪避-50%。\n\n_所有美德：_\n\n_坚定：_立即获得_最大生命值25%_点不随时间流逝的护盾，溢出的生命回复效果同样会转化为不随时间流逝的护盾(不会超过最大生命值的25%)，击杀敌人有25%概率回复6点理智。\n\n_无畏：_移动速度+50%，清除并免疫惊恐效果。\n\n_振奋：_回复的理智从50点提高至60点，击杀敌人有25%概率回复_最大生命值10%_点生命。

custom.dict.dict.misc_seal =破损纹章
custom.dict.dict.misc_seal_d =_战士_初始携带的特殊物品，可以贴附在无诅咒的护甲上，贴附和拆卸不消耗回合。\n\n装备着的护甲贴附了纹章后，英雄每30回合就会获得1点护盾，上限为_护甲等级+护甲阶数_。\n\n纹章可以保留1级等级，并可在护甲之间转移。\n\n在2层天赋_刻印转移_的影响下，纹章还能够转移刻印，前提是刻下刻印时纹章需已贴附在护甲上。

custom.dict.dict.misc_gold =金币
custom.dict.dict.misc_gold_d =可以在6，11，16和20层的商店购买物品。\n\n通常一堆金币的数量为_30+楼层数*10~60+楼层数*20_，不过特殊情况会有不同的数额。

custom.dict.dict.misc_dust =尸尘
custom.dict.dict.misc_dust_d =老杖匠任务的任务物品，可以在任务房间中的其中一个遗骸里找到。\n\n在背包中时，每_(本层怨灵数量+1)^2_回合(不会超过49回合)生成一个怨灵，生成位置在英雄视野内且与英雄距离大于_当前视野半径/3_格(四舍五入)。

custom.dict.dict.misc_ore =暗金矿
custom.dict.dict.misc_ore_d =巨魔铁匠任务的任务物品，在巨魔铁匠任务层中会生成45~47块，每块可换取50人情，最多可换取2000人情(也就是40块)。\n\n背包中拥有镐子时，点击巨魔铁匠任务层带有暗金矿的墙壁，可将其敲碎并获得一块暗金矿。

custom.dict.dict.misc_soon = coming s∞n
custom.dict.dict.misc_soon_d = 更新内容：遂咕之。

