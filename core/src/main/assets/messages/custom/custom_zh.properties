custom.dict.dict.melee_wornsword =破旧的短剑
custom.dict.dict.melee_wornsword_d =_战士_初始携带的_1_阶武器，_10_力量需求，_1~10_基础伤害。\n\n它的伤害成长为_1~2_，精准修正为_1_，攻击延迟为_1_，攻击距离为_1_。\n\n拥有非诅咒菱晶的等级时，可对其他近战武器进行重铸，使其提升1级(不会因此消除已有附魔)。\n\n_决斗家_武技(顺劈)：造成额外_3+武器等级_点伤害并且必定命中。如果顺劈击杀了一名敌人，则可在5回合内不消耗武技充能再次使用顺劈。

custom.dict.dict.duelist_ability =决斗家武技
custom.dict.dict.duelist_ability_d =_决斗家_的武器会拥有武技充能，可以消耗1点武技充能以释放相应的武技，武技充能上限为_2+(英雄等级-1)/3_且最高为10点，每回合回复_1/[60-1.5*(充能上限-当前充能数)]_点武技充能。\n\n_勇士_的副手武器与主手武器共享武技充能，充能上限+2且充能速度加快50%。\n\n3层天赋_武技训练+1/+2/+3_可为其他英雄提供2/3/4点武技充能上限并固定每90回合回复1点武技充能，对于_决斗家_则为增加1/2/3点武技充能上限。\n\n所有武器的武技效果：\n\n_破旧的短剑/短剑/单手剑/长剑/巨剑(顺劈)：_造成额外_3+武器等级/4+武器等级/5+武器等级/6+武器等级/7+武器等级_点伤害并且必定命中。如果顺劈击杀了一名敌人，则可在5回合内不消耗武技充能再次使用顺劈。\n\n_匕首/长匕首/暗杀之刃(潜行)：_可闪现至最多5/4/3格远并给予_2+武器等级_回合隐形。\n\n_镶钉手套/双钗/魔岩拳套(连击)：_装备后的每次近战或者投掷武器命中都会叠加连击次数(持续5回合，期间再次命中会重置持续时间)，每有1次连击次数，连击武技就增加_3+武器等级/4+武器等级/5+武器等级_点伤害。\n\n_刺剑/武士刀(弓步刺)：_对相距1格的敌人使用会向敌人突进，造成额外_5+1.5*武器等级/8+2*武器等级_点伤害并且必定命中。\n\n_权杖/手斧/硬头锤/战斧/战锤(重击)：_造成额外_3+1.5*武器等级/4+1.5*武器等级/5+1.5*武器等级/5+1.5*武器等级/6+1.5*武器等级_点伤害并施加5回合恍惚，使其精准和闪避减半。这一击必定命中但若不是伏击则没有额外伤害加成。\n\n_手杖/铁头棍(防御架势)：_不消耗回合释放，在_5+武器等级/4+武器等级_回合内使闪避属性翻三倍。\n\n_征讨者的长矛/长矛/关刀(刺退)：_可对攻击距离内不与英雄相邻的敌人释放，造成额外_8+1.5*武器等级/9+2*武器等级/12+2.5*武器等级_点伤害并且必定命中，同时还会击退1格距离。\n\n_胁差/弯刀(剑舞)：_不消耗回合释放，在_6+武器等级/4+武器等级_回合内使攻击速度增加60%且精准属性增加50%。\n\n_臂盾/圆盾/巨型方盾(护卫)：_在_7+武器等级/5+武器等级/3+武器等级_回合内完全抵挡攻击方造成的物理或魔法攻击。在主动造成伤害或回合结束后失去该效果。\n\n_短柄镰/战镰(收割)：_不直接造成伤害但会施加原始值为_15+2.5*武器等级/30+4.5*武器等级_的流血并且必定命中，若敌人免疫流血则改为造成对应伤害。\n\n_皮鞭/长鞭/钢鞭(狠抽)：_对当前所有处于攻击距离内的敌人都进行一次普通攻击并且必定命中。\n\n_链枷(甩动)：_消耗1回合进行1次甩动(持续3回合，期间再次甩动会重置持续时间)，之后可再不消耗武技充能地甩动2次(总共可甩动3次)，甩动后进行攻击会造成额外_(8+2*武器等级)*甩动次数_点伤害并且必定命中。攻击后失去该效果。\n\n_符文之刃(符文挥砍)：_进行一次必定命中的普通攻击并且有_3+0.5*武器等级_倍附魔强度。\n\n_吹箭筒/十字弩(蓄势)：_不消耗回合释放，下次攻击必定命中并根据攻击方式的不同产生不同效果：近战攻击会击退_2/4_格，未涂药的飞镖会造成额外_2+武器等级/4+武器等级_点伤害，涂药飞镖会增加额外_2+武器等级/4+武器等级_点耐久并会在7x7范围内生效(对英雄无效)。攻击后失去该效果。\n\n_巨斧(报复)：_在生命低于最大生命的50%时才可释放，造成额外_15+2*武器等级_点伤害并且必定命中，若这一击击杀了敌人则不会消耗回合。\n\n_镐子(穿刺)：_进行一次必定命中的普通攻击并施加3回合易伤，若为_硬质表皮_敌人则造成额外_8+2*武器等级_点伤害。\n_硬质表皮_敌人包括活化石像、召唤守卫、装甲石像、金色蜜蜂、蝇群、下水道螃蟹、寄居蟹、骷髅、DM-100、矿洞蜘蛛、DM-200、DM-201、水晶灵簇、水晶守卫、水晶尖塔、能量塔、DM-300、魔像、巨蝎、酸液巨蝎、锈蚀之拳、纳垢信徒和黄金魔像。\n\n_武力之戒(拳击架势)：_进入这一架势后，近战攻击造成的伤害固定为_武力之戒伤害+3+(力量-8)/2+武技之戒等级*(力量-4)/8_，但武技充能速度会降低50%并在取消架势的50回合后才会恢复正常。

custom.dict.dict.weapon_ench1 =常见附魔
custom.dict.dict.weapon_ench1_d =常见附魔每个均有_12.5%_的概率出现。\n\n_烈焰附魔：_有_(武器等级+1)/(武器等级+3)_的概率给予目标8回合燃烧，若目标已处于燃烧状态则生效时额外造成一次_燃烧伤害*0.67_的魔法伤害。\n护甲技能_元素打击_效果：产生持续8回合才会自然熄灭的火焰。\n_符文法师_引爆效果：爆炸范围中的所有敌人都会获得8回合燃烧。\n\n_寒霜附魔：_有_(武器等级+1)/(武器等级+4)_的概率给予目标3回合冻伤(上限6回合)。\n护甲技能_元素打击_效果：产生持续8回合才会自然消散的寒气。\n_符文法师_引爆效果：爆炸范围中的所有敌人都会获得10回合冻伤。\n\n_恒动附魔：_击杀目标时获得与溢出伤害等量的伤害储存(溢出伤害不包括上一伤害储存附加的伤害)。伤害储存可以附加于下一次攻击造成的伤害中(前提是下一次攻击造成的伤害来源为拥有该附魔的武器)，每回合会衰减2.5%(每回合至少衰减0.1点)。\n护甲技能_元素打击_效果：不拥有伤害储存时无效果，拥有伤害储存时则消耗伤害储存对所有敌人造成_伤害储存*0.4_点伤害。\n_符文法师_引爆效果：每个被爆炸杀死的敌人都会给予自身6点伤害储存。\n\n_电击附魔：_有_1/3_的概率对除目标以外、以目标为中心的5x5范围内的所有敌人造成_护甲结算后伤害*0.5_的魔法伤害。\n护甲技能_元素打击_效果：产生持续8回合才会自然消散的电场。\n_符文法师_引爆效果：在目标所处地格产生持续3回合的电场。

custom.dict.dict.weapon_ench2 =稀有附魔
custom.dict.dict.weapon_ench2_d =稀有附魔每个均有_5.72%_的概率出现。\n\n_招架附魔：_有_(武器等级+2)/(武器等级+20)_的概率给予使用者_(武器等级+2)*概率_点护盾，持续5回合。\n护甲技能_元素打击_效果：范围内每有一个敌人就会给予自身6点护盾。\n_符文法师_引爆效果：每个被爆炸范围覆盖到的角色都会给予自身6点护盾。\n\n_繁茂附魔：_有_(武器等级+1)/(武器等级+3)_的概率使目标自身所处位置或周围长出_(1+0.1*武器等级)的整数部分_格高草，同时还会有_(1+0.1*武器等级)的小数部分_的概率额外长出1格高草。没有其他有效位置时才会在使用者自身所处位置长出高草。\n护甲技能_元素打击_效果：随机产生8格高草并缠绕所有敌人6回合。\n_符文法师_引爆效果：爆炸范围中的所有敌人都会被缠绕3回合。\n\n_弹性附魔：_有_(武器等级+1)/(武器等级+5)_的概率击退目标2格。\n护甲技能_元素打击_效果：击退范围内所有敌人5格。\n_符文法师_引爆效果：以引爆目标为中心产生一个类似冲击波法杖的效果，击退所有受影响的敌人2格，Boss则为1格。\n\n_幸运附魔：_击杀敌人时有_(武器等级+4)/(武器等级+40)_的概率触发财富之戒的低级或中级消耗品掉落，相当于-5级的财富之戒(0级的财富之戒的消耗品掉落是60%低级30%中级10%高级，每升一级-4%低级+2%中级和高级，在-5级时正好是0%高级，大于-5级开始有概率产生高级掉落)。\n护甲技能_元素打击_效果：范围内所有敌人脚下有12.5%的概率产生一次低级或中级消耗品掉落(这一效果不受英雄等级限制，但也不因奥术之戒等效果对幸运附魔的提升而能产生高级掉落)，每个敌人仅能触发一次。\n_符文法师_引爆效果：每个被爆炸杀死的敌人都会有_印记层数*0.1_的概率产生一次_印记层数_级财富之戒的消耗品掉落。\n\n_索敌附魔：_对于近战武器为近战距离+1，对于远程武器则为至多可穿透3格路径中的墙体与单位。\n护甲技能_元素打击_效果：对范围内所有敌人造成_武器伤害*0.3_点伤害。\n_符文法师_引爆效果：可以获得未被爆炸杀死的敌人的3x3视野10回合。\n\n_紊乱附魔：_随机附魔效果(不包括索敌)，生效概率和生效情况视武器等级及奥术之戒等效果而定。\n护甲技能_元素打击_效果：对范围内所有敌人造成一种随机附魔效果(不包括索敌)，生效概率和生效情况视武器等级及奥术之戒等效果而定。\n_符文法师_引爆效果：产生一种随机附魔引爆效果(包括索敌)。\n\n_酸蚀附魔：_有_(武器等级+1)/(武器等级+3)_的概率给予目标3回合起始伤害为_1+武器等级*0.5_的酸蚀，已经获得酸蚀的目标不会因此叠加回合数。\n护甲技能_元素打击_效果：给予范围内所有敌人6回合起始伤害为2的酸蚀。\n_符文法师_引爆效果：每个被爆炸影响的敌人都会获得_印记层数*2_回合起始伤害为_印记层数_的酸蚀。

custom.dict.dict.weapon_ench3 =罕见附魔
custom.dict.dict.weapon_ench3_d =罕见附魔每个均有_2.5%_的概率出现。\n在这些附魔的描述以及一些天赋(如2层天赋_刻笔  ・布莱恩特+2_)的效果中，这些附魔还可被称为强力附魔。\n\n_腐化附魔：_击杀敌人时有_(武器等级+5)/(武器等级+25)_的概率将敌人腐化。\n护甲技能_元素打击_效果：范围内所有敌人都有_5%~25%_的概率(取决于敌人的失血比)被腐化。\n_符文法师_引爆效果：每个被爆炸影响的敌人都会有_印记层数*0.05_的概率被定命。\n\n_死神附魔：_有_(0.5+0.05*武器等级)*目标失血比^2_的概率造成等同于目标当前生命的魔法伤害(Boss对其拥有抗性)。\n护甲技能_元素打击_效果：范围内所有敌人都有_6%~30%_的概率(取决于敌人的失血比)受到等同于当前生命的魔法伤害(Boss对其拥有抗性)。\n_符文法师_引爆效果：每个被爆炸影响的敌人都会有_(0.5+印记层数*0.1)*敌人失血比^2_的概率受到等同于当前生命的魔法伤害(Boss对其拥有抗性)。\n\n_血饮附魔：_有_0.05+0.25*自身失血比_的概率回复_护甲结算后伤害*0.5_点生命。\n护甲技能_元素打击_效果：范围内每有一个敌人就会为自身回复2.5点生命。\n_符文法师_引爆效果：每个被爆炸范围覆盖到的角色都会有_印记层数*0.1_的概率为自身回复6点生命。\n\n_横扫附魔：_对使用者周围_近战攻击距离_格除主要攻击目标外的所有敌人造成_护甲结算前伤害*(武器等级+1)/(武器等级+10)_点伤害。\n护甲技能_元素打击_效果：对范围内所有敌人造成_6~12_点伤害，若这一普通攻击击杀了敌人则会不消耗护甲充能再释放一次。\n_符文法师_引爆效果：每个被爆炸影响的敌人都会额外受到_印记层数*5_点物理伤害。

custom.dict.dict.weapon_ench4 =诅咒附魔
custom.dict.dict.weapon_ench4_d =各个诅咒附魔的出现概率均等。\n\n_喧闹诅咒：_有_1/20_的概率发出逼动静。总共有10条普通逼动静和3条特殊逼动静，分别占_32/33_和_1/33_的触发概率。\n护甲技能_元素打击_效果：范围内所有敌人都有20%的概率狂乱6回合。\n\n_转移诅咒：_有_1/12_的概率触发，触发时将目标随机传送。\n护甲技能_元素打击_效果：范围内所有敌人都有50%的概率被随机传送。\n\n_炫目诅咒：_有_1/10_的概率触发，致盲所有能看到使用者的目标5回合，使用者则为10回合。\n护甲技能_元素打击_效果：范围内所有敌人都有50%的概率失明6回合。\n\n_易爆诅咒：_每攻击一次积攒_0~10_热量，热量达到100时，目标周围距离使用者最近的那一格会产生一次爆炸。投掷武器触发时，额外减少_9*单次耐久消耗_点耐久。\n护甲技能_元素打击_效果：范围内随机一个敌人有50%的概率产生爆炸。\n\n_血祭诅咒：_有_1/10_的概率获得原始值为_生命比例*生命比例*最大生命/8_的流血。\n护甲技能_元素打击_效果：对自身和所有敌人施加原始值为12的流血。\n\n_妄为诅咒：_有_1/4_的概率获得10回合妄为，精准属性降低80%，成功命中一次即可解除此效果。\n护甲技能_元素打击_效果：范围内所有敌人都有50%的概率获得6回合幻惑。\n\n_极化诅咒：_攻击只会出现1.5倍伤害或完全没有伤害的情况，概率均等。\n护甲技能_元素打击_效果：对范围内所有敌人都有50%的概率造成_24~36_点魔法伤害。\n\n_友善诅咒：_有_1/10_的概率魅惑目标5回合，使用者则为5回合。投掷武器触发时，其对魅惑目标无法造成伤害。\n护甲技能_元素打击_效果：范围内所有敌人都有50%的概率被魅惑6回合。\n\n_沉重诅咒：_武器力量需求+2。\n护甲技能_元素打击_效果：范围内所有敌人都有50%的概率获得6回合虚弱。

custom.dict.dict.weapon_ench5 =神圣附魔
custom.dict.dict.weapon_ench5_d =在施放圣典或圣典拓本的初始法术_神圣武器_后的50回合内，施法者手中的武器会获得神圣附魔，这一附魔会使攻击额外造成_2_点魔法伤害，同时还会覆盖武器原有的附魔效果直至持续时间结束。\n\n_圣骑士_的神圣附魔会得到强化，变为额外造成_6_点魔法伤害，并且不再会覆盖武器原有的附魔效果而是与之共存，同时生效期间内消耗的每点圣典充能都会延长其10回合的持续时间。

custom.dict.dict.missile_dart =飞镖
custom.dict.dict.missile_dart_d =_1_阶投掷武器，_9_力量需求，_1~2_基础伤害，_1~2_伤害成长(尽管不能直接升级)，无限耐久。\n\n与常规投掷武器不同，没有一组3件的限制，也无法被升级、附魔、嬗变、强化和液金修复。\n\n装备吹箭筒后，伤害会提升至_4+吹箭筒等级~10+2*吹箭筒等级_，并能在投掷时生效吹箭筒的附魔。\n\n装备十字弩后，伤害会提升至_4+十字弩等级~12+3*十字弩等级_，并能在投掷时生效十字弩的附魔。

custom.dict.dict.missile_darttipped = 涂药飞镖
custom.dict.dict.missile_darttipped_d = 在6，11，16和20层的商店中固定出售2枚，而普通飞镖可选择一粒种子进行涂药得到对应的1~2枚涂药飞镖。涂药飞镖为_2_阶投掷武器，_11_力量需求，药效基础使用次数为_1_次，其余属性及特性与普通飞镖一致。\n\n对盟友拥有增益效果的涂药飞镖不会对盟友造成伤害。\n\n涂药飞镖效果一览：\n\n_腐莓飞镖(腐莓)：_对于非Boss单位施加10回合起始伤害为_楼层数_的酸蚀，对于Boss单位则施加5回合起始伤害为_楼层数/3_的酸蚀。固定5次药效，无法提升。\n\n_治疗飞镖(阳春草)：_为目标提供_0.5*最大生命+30_的治疗量。\n\n_传送飞镖(消逝草)：_把目标随机传送到距离使用者_8~10_格远的位置。\n\n_寒霜飞镖(冰冠花)：_造成6回合冻伤，如果目标在水上则为10回合。\n\n_燃烧飞镖(烈焰花)：_造成8回合燃烧，若命中地点有可燃物(如门、草)则产生4回合火焰。\n\n_毒液飞镖(断肠苔)：_造成_3+楼层数/3_回合中毒。\n\n_激素飞镖(速行蓟)：_可以给予盟友10回合激素涌动(移动速度*2，攻击速度*1.5)，也可以对敌人造成5回合残废。\n\n_致盲飞镖(致盲草)：_造成10回合失明。\n\n_电击飞镖(风暴藤)：_额外造成_5+楼层数/4~10+楼层数/4_点电击伤害。\n\n_麻痹飞镖(地缚根)：_造成5回合麻痹。\n\n_净化飞镖(魔皇草)：_可以清除盟友身上的所有减益效果并给予10回合全面净化，也可以清除敌人身上的所有增益效果并使其丢失目标。\n\n_神圣飞镖(星陨花)：_可以给予盟友30回合赐福，也可以对_亡灵和恶魔属性_敌人额外造成_10+楼层数/3~20+楼层数/3_点魔法伤害。

custom.dict.dict.missile_bolas =流星索
custom.dict.dict.missile_bolas_d =_3_阶投掷武器，_13_力量需求，_6~9_基础伤害，每件_5_点耐久。\n\n它的伤害成长为_2~3_，可以造成10回合残废。

custom.dict.dict.missile_fishing =捕鱼矛
custom.dict.dict.missile_fishing_d =_2_阶投掷武器，_11_力量需求，_4~10_基础伤害，每件_10_点耐久。\n\n它的伤害成长为_2~2_，对_鱼类_敌人使用则会造成不低于当前生命一半的伤害。\n_鱼类_敌人包括巨型食人鱼、幻影食人鱼、巨型陆地食人鱼和幻影陆地食人鱼。

custom.dict.dict.missile_cube =震爆方石
custom.dict.dict.missile_cube_d =_5_阶投掷武器，_17_力量需求，_10~25_基础伤害，每件_5_点耐久。\n\n它的伤害成长为_2~5_，无论击中目标与否，掷出即消耗耐久，使用效果类似无击退的冲击波法杖并且可对多个目标同时触发附魔。\n\n_狙击手_使用时会标记直接命中的目标进行追击，若无直接命中的目标则随机标记一个命中范围内的目标。

custom.dict.dict.missile_boomerang =重型回旋镖
custom.dict.dict.missile_boomerang_d =_4_阶投掷武器，_15_力量需求，_8~16_基础伤害，每件_10_点耐久。\n\n它的伤害成长为_2~4_，掷出2回合后返回掷出位置，返回时仍可对处于掷出位置的目标造成伤害。

custom.dict.dict.missile_javelin =标枪
custom.dict.dict.missile_javelin_d =_4_阶投掷武器，_15_力量需求，_8~20_基础伤害，每件_10_点耐久。\n\n它的伤害成长为_2~4_。

custom.dict.dict.missile_kunai =苦无
custom.dict.dict.missile_kunai_d =_3_阶投掷武器，_13_力量需求，_6~15_基础伤害，每件_5_点耐久。\n\n它的伤害成长为_2~3_，伏击伤害为_伤害范围的60%~最大伤害_(即60%的伏击修正)。

custom.dict.dict.missile_shuriken =手里剑
custom.dict.dict.missile_shuriken_d =_2_阶投掷武器，_11_力量需求，_4~8_基础伤害，每件_5_点耐久。\n\n它的伤害成长为_2~2_，在移动后进行投掷不会消耗回合。

custom.dict.dict.missile_club =飞槌
custom.dict.dict.missile_club_d =_2_阶投掷武器，_11_力量需求，_4~8_基础伤害，每件_15_点耐久。\n\n它的伤害成长为_2~2_，不会卡在目标身上并且拾取时不消耗回合。

custom.dict.dict.missile_hammer =投掷锤
custom.dict.dict.missile_hammer_d =_5_阶投掷武器，_17_力量需求，_10~20_基础伤害，每件_15_点耐久。\n\n它的伤害成长为_2~5_，不会卡在目标身上并且拾取时不消耗回合。

custom.dict.dict.missile_knife =飞刀
custom.dict.dict.missile_knife_d =_盗贼_初始携带的_1_阶投掷武器，_9_力量需求，_2~6_基础伤害，每件_5_点耐久。\n\n它的伤害成长为_1~2_，伏击伤害为_伤害范围的75%~最大伤害_(即75%的伏击修正)。

custom.dict.dict.missile_throwingspike =飞刺
custom.dict.dict.missile_throwingspike_d =_决斗家_初始携带的_1_阶投掷武器，_9_力量需求，_2~5_基础伤害，每件_10_点耐久。\n\n它的伤害成长为_1~2_。

custom.dict.dict.missile_luckycoin =幸运银币
custom.dict.dict.missile_luckycoin_d =_绅士_初始携带的_1_阶投掷武器，_9_力量需求，_0~1_基础伤害，每件_10_点耐久。\n\n它的伤害成长为_1~2_，命中时给予使用者_3+武器等级_回合的幸运一击(下一次攻击必定命中)。

custom.dict.dict.missile_slimeball =粘液球
custom.dict.dict.missile_slimeball_d =_史莱姆娘_初始携带的_1_阶投掷武器，_9_力量需求，_2~3_基础伤害，每件_5_点耐久。\n\n它的伤害成长为_1~2_，可以造成3回合黏糊糊(移动速度减半)。

custom.dict.dict.missile_damagegear =废弃齿轮
custom.dict.dict.missile_damagegear_d =_DM-400_初始携带的_1_阶投掷武器，_9_力量需求，_2~4_基础伤害，每件_5_点耐久。\n\n它的伤害成长为_1~2_，可以消耗1件为_DM-400_回复_剩余耐久_点生命(这一回复效果不会超过最大生命的一半)。

custom.dict.dict.missile_runestring =符石串
custom.dict.dict.missile_runestring_d =_矮人公主_初始携带的_1_阶投掷武器，_9_力量需求，_2~4_基础伤害，无限耐久。\n\n它的伤害成长为_1~2_(尽管不能直接升级)，与常规投掷武器不同，无法被升级、附魔、强化和液金修复，无法被嬗变出来。可以消耗1件为装备进行附魔，附魔后留下一个失去附魔功能的符石串。\n\n失去附魔功能的符石串每件_15_点耐久，可以被升级、附魔、强化和液金修复，其余属性与原先的符石串一致。

custom.dict.dict.missile_spear =投矛
custom.dict.dict.missile_spear_d =_3_阶投掷武器，_13_力量需求，_6~15_基础伤害，每件_10_点耐久。\n\n它的伤害成长为_2~3_。

custom.dict.dict.missile_stone =投石
custom.dict.dict.missile_stone_d =_战士_初始携带的_1_阶投掷武器，_9_力量需求，_2~5_基础伤害，每件_5_点耐久。\n\n它的伤害成长为_1~2_，不会卡在目标身上并且拾取时不消耗回合。

custom.dict.dict.missile_axe =飞斧
custom.dict.dict.missile_axe_d =_4_阶投掷武器，_15_力量需求，_6~16_基础伤害，每件_5_点耐久。\n\n它的伤害成长为_2~4_，额外附加原始值为_伤害*0.6_的流血。

custom.dict.dict.missile_trident =三叉戟
custom.dict.dict.missile_trident_d =_5_阶投掷武器，_17_力量需求，_10~25_基础伤害，每件_10_点耐久。\n\n它的伤害成长为_2~5_。

custom.dict.dict.missile_gungnir =冈格尼尔
custom.dict.dict.missile_gungnir_d =_6_阶投掷武器，_19_力量需求，_12~30_基础伤害，每件_10_点耐久。\n\n它的伤害成长为_2~6_，精准修正为_必定命中_，投掷延迟为_1_，投掷距离遵循常规投掷武器规则。命中且未损坏时会返回英雄手中，并消耗当前生命值的10%(向下取整且至少1点)；生命值仅剩1点时无法投掷。\n\n命中会施加原始值为_本次伤害50%_的流血。若直接击杀命中前已经流血的敌人，则回复最大生命值的10%。

custom.dict.dict.missile_portableblackhole =便携黑洞
custom.dict.dict.missile_portableblackhole_d =_6_阶投掷武器，_19_力量需求，_10~25_基础伤害，伤害成长为_1~6_。每件未强化时可使用_5_次，一组至多_3_件。\n\n命中单位时会按普通投掷武器造成伤害，并在未损坏时钉入目标体内。向实际落点没有单位的格子投掷时会额外消耗1次耐久；若该格不是深渊，则把本层所有体内钉有便携黑洞、且允许传送的单位移动到落点及其邻近合法空位。\n\n不可移动或具有传送免疫的单位不会被移动；普通敌人、盟友和Boss不因阵营或身份被排除。空间不足时，多出的单位留在原位。钉在单位体内的便携黑洞不会因传送被消耗，可继续作为下一次传送的标记。空地投掷即使落在深渊或没有可传送单位，也会消耗耐久。

custom.dict.dict.missile_spiritbow =灵能弓
custom.dict.dict.missile_spiritbow_d =_女猎手_初始携带的特殊投掷武器，_10_力量需求，_1~6_基础伤害，可以无限射出箭矢。\n\n它的伤害成长为_1~2_(尽管不能直接升级)，会随英雄等级提升而进行升级(视觉上为每5英雄等级提升1级，但伤害则分别在3，8，13，18，23，28英雄等级时提升0~1，而在5，10，15，20，25，30英雄等级时提升1~1)。\n\n_狙击手_追击技能：\n\n_速射(灵能弓不强化)：_追击不消耗回合，射出1支67%伤害的箭矢。\n\n_连射(灵能弓强化攻速)：_追击消耗1回合，连续射出3支50%伤害的箭矢。\n\n_狙杀(灵能弓强化伤害)：_追击消耗2回合，射出1支基础倍率为1.2倍伤害的必中箭矢，会根据自身与该目标相距的距离提升倍率(每相距1格伤害*1.125)，最多3倍(相距8格)。

custom.dict.dict.missile_tatteki =铁炮
custom.dict.dict.missile_tatteki_d =_忍者_转职为_铁炮忍者_后获得的特殊投掷武器。\n\n力量需求时刻与英雄的力量一致(但不会因为根骨之戒等效果提供的额外力量的增减进行变化)。\n\n_0~5_基础伤害，每隔30回合可以发射1颗弹丸。\n\n它的伤害成长为_0~10_(尽管不能直接升级)，可以装备为副手武器使用并且会与主手武器同步等级。除了同步等级带来的伤害提升，每提升1级英雄等级也可以带来_0~5_的伤害提升。神射之戒无法对其进行提升。\n\n铁炮射击仅有0.2倍精准，无法进行伏击，但会对使用者视野内的敌人造成3回合恐惧，并且对被_铁炮忍者_用投掷武器或小小手里剑击中过的目标(即带有弹道修正效果的目标)必定命中。

custom.dict.dict.special_spraygun =炼金喷枪
custom.dict.dict.special_spraygun_d =_修士_初始携带的特殊武器。\n\n力量需求时刻与英雄的力量一致(但不会因为根骨之戒等效果提供的额外力量的增减进行变化)，但力量并不影响该武器的任何属性。\n\n喷射仅对指定敌人造成_1+喷枪等级/2_格(向下取整)击退，可以清除任意目标身上拥有的燃烧和腐蚀淤泥效果，还可以清除魔法火墙。\n\n_炼金师_的炼金喷枪会在原来的喷射效果基础上进行75度角5格半径的群体喷射，对所有目标额外造成_4+喷枪等级~10+5*喷枪等级_点魔法伤害。\n\n最多拥有_6+喷枪等级_点药液余量，每次喷射消耗1点，需要消耗与已损药液余量等量的炼金能量进行装填，会随英雄等级提升而进行升级(每5英雄等级提升1级)。\n\n药剂装配效果：\n\n_通用效果：_装配药剂需要选择一瓶已鉴定的药剂消耗，更改喷射效果并补充6点药液余量(经验药剂为10点)，但力量药剂不会消耗也不会补充药液余量。\n\n_力量药剂：_击退距离+1，对于敌人会附带_4+喷枪等级_回合的虚弱。\n_炼金师-力量药剂：_击退距离+2，对于敌人会附带_8+2*喷枪等级_回合的虚弱。\n\n_治疗药剂：_对于盟友会回复_最大生命*0.3+5*喷枪等级_点生命。\n_炼金师-治疗药剂：_对于盟友不会造成伤害而是回复_最大生命*0.5+5*喷枪等级_点生命，溢出部分会转化为护盾但不会超过最大生命的一半。\n\n_灵视药剂：_对于敌人会随机传送至距离英雄_8~10_格远的位置。\n_炼金师-灵视药剂：_不会造成伤害，对于敌人会随机传送至距离英雄_8~10_格远的位置并获得敌人_4+喷枪等级_回合的3x3视野。\n\n_冰霜药剂：_不会击退敌人，在喷射位置滞留8回合的寒气，同时有_30%+5%*喷枪等级_概率直接冻结目标_4+喷枪等级_回合。\n_炼金师-冰霜药剂：_不会击退敌人也不会造成伤害，在喷射范围滞留8回合的寒气，同时会直接冻结并缠绕目标_4+喷枪等级_回合。\n\n_液火药剂：_不会清除魔法火墙，在喷射位置滞留2回合的火焰，同时会直接点燃目标8回合并造成_1+喷枪等级~3+2*喷枪等级_点燃烧伤害。\n_炼金师-液火药剂：_不会清除魔法火墙也不会造成伤害，在喷射范围滞留2回合的火焰，同时会直接点燃目标8回合并造成_4+喷枪等级~10+5*喷枪等级_点燃烧伤害。\n\n_毒气药剂：_对于敌人会附带_6+2*喷枪等级_回合的中毒。\n_炼金师-毒气药剂：_对于敌人会附带_3+2*喷枪等级_回合起始伤害为2的酸蚀。\n\n_极速药剂：_每隔5回合就可以不消耗回合地喷射一次(通过护甲技能_浓缩药剂_天赋_浓缩精华_随机出来为30回合)，对于敌人会附带_2+喷枪等级/2_回合的残废。\n_炼金师-极速药剂：_每隔5回合就可以不消耗回合地喷射一次(通过护甲技能_浓缩药剂_天赋_浓缩精华_随机出来为30回合)，对于盟友不会造成伤害而是附带10回合的激素涌动，对于敌人会附带_2+喷枪等级/2_回合的残废。\n\n_隐形药剂：_对于敌人会附带_4+喷枪等级_回合的失明。\n_炼金师-隐形药剂：_对于盟友会在造成伤害的同时使英雄获得_(2+喷枪等级/2)*范围内盟友数量_回合的隐形，对于敌人会附带_4+喷枪等级_回合的失明。\n\n_浮空药剂：_对于敌人会附带_2+喷枪等级_回合的眩晕。\n_炼金师-浮空药剂：_使喷射范围覆盖的地格产生水，对于敌人会附带_2+喷枪等级_回合的眩晕，对于_火属性_敌人则会额外造成_5+楼层数~10+2*楼层数_点伤害。\n\n_麻痹药剂：_在喷射位置产生4回合的电场。\n_炼金师-麻痹药剂：_在喷射范围产生8回合的电场。\n\n_净化药剂：_对于敌人会延长2回合已有减益的持续时间。\n_炼金师-净化药剂：_对于盟友不会造成伤害而是清除已有减益并附带10回合的全面净化，对于敌人会延长4回合已有减益的持续时间。\n\n_经验药剂：_对于盟友会附带30回合的赐福，对于_亡灵和恶魔属性_敌人会造成_7+喷枪等级_点魔法伤害。\n_炼金师-经验药剂：_对于盟友不会造成伤害而是附带30回合的赐福，对于_亡灵和恶魔属性_敌人会额外造成_7+喷枪等级_点魔法伤害。

custom.dict.dict.special_ritualdagger =仪式匕首
custom.dict.dict.special_ritualdagger_d =_修士_转职为_虔信者_后获得的特殊武器，_10_力量需求，_1~10_基础伤害。\n\n它的伤害成长为_1~3_(尽管不能直接升级)，会随英雄等级提升而进行升级(每5英雄等级提升1级)，精准修正为_1_，攻击延迟为_0.5_，攻击距离为_1_。\n\n在背包中无需装备即可直接使用。\n\n_虔信者_特效：\n\n攻击后造成永久持续的血液礼品效果，拥有这一效果的敌人受到伤害时会为_虔信者_回复_损失生命/5_点理智(非0情况则向下取整但至少为1)。\n\n在背包中时，每杀死13名敌人就可以使用一次不消耗回合且必中的刺击。刺击选择敌人时会造成4倍伤害并为_虔信者_回复50点理智，选择自己时则会造成1点无视护甲的伤害并使_虔信者_扣除100点理智。

custom.dict.dict.melee_sickle =短柄镰
custom.dict.dict.melee_sickle_d =_2_阶武器，_12_力量需求，_2~20_基础伤害。\n\n它的伤害成长为_1~3_，精准修正为_0.68_，攻击延迟为_1_，攻击距离为_1_。\n\n_决斗家_武技(收割)：不直接造成伤害但会施加原始值为_15+2.5*武器等级_的流血并且必定命中，若敌人免疫流血则改为造成对应伤害。

custom.dict.dict.melee_katana =武士刀
custom.dict.dict.melee_katana_d =_4_阶武器，_16_力量需求，_4~20_基础伤害。\n\n它的伤害成长为_1~5_，精准修正为_1_，攻击延迟为_1_，攻击距离为_1_。\n\n可以抵挡_0~3_点物理伤害。\n\n_决斗家_武技(弓步刺)：对相距1格的敌人使用会向敌人突进，造成额外_8+2*武器等级_点伤害并且必定命中。

custom.dict.dict.melee_war_scythe =战镰
custom.dict.dict.melee_war_scythe_d =_5_阶武器，_18_力量需求，_5~40_基础伤害。\n\n它的伤害成长为_1~6_，精准修正为_0.8_，攻击延迟为_1_，攻击距离为_1_。\n\n_决斗家_武技(收割)：不直接造成伤害但会施加原始值为_30+4.5*武器等级_的流血并且必定命中，若敌人免疫流血则改为造成对应伤害。

##******************************** wands
custom.dict.dict.wand_blastwave =冲击波法杖
custom.dict.dict.wand_blastwave_d =发射1个可造成_1+法杖等级~3+3*法杖等级_点魔法伤害的射弹，在落点产生3x3范围的可将目标击退的冲击波，整个范围内伤害相同。\n\n冲击波的中心击退距离为_法杖等级+3_格，周围击退距离则为_2+法杖等级/2_格(向下取整)。\n\n对于Boss只会造成原先距离一半的击退距离(向上取整)。\n\n_战斗法师_的魔杖近战效果：若攻击目标身上有麻痹效果，则清除攻击目标的麻痹效果并造成_8+2*魔杖等级~12+3*魔杖等级_点魔法伤害，这一近战效果对单个目标存在3回合冷却。\n\n_术士_可对_以射弹落点为中心的3x3_范围内的所有目标施加灵魂标记。\n\n_符石法师_可引爆_以射弹落点为中心的3x3_范围内的所有目标身上的符文印记。\n\n对应魔杖的护甲技能_元素风暴_效果：元素风暴只造成67%的伤害，但会将所有敌人冲出覆盖范围1格。

custom.dict.dict.wand_corruption =腐化法杖
custom.dict.dict.wand_corruption_d =发射1个不造成伤害的射弹，随机施加减益效果并可能将敌人腐化。\n\n腐化能力为_3+法杖等级/3_。\n\n有经验掉落的敌人的修正前腐化抗性为_1+经验掉落_。\n\n大部分无经验掉落的敌人的修正前腐化抗性取决于楼层数：\n分裂的蝇群为4，活化石像和宝箱怪为_1+楼层数_，巨型食人鱼和金色蜜蜂为_1+楼层数/2_，怨灵为_(1+楼层数/4)/5_且返程时楼层数固定为26。\n\n大部分有经验掉落的敌人在返程时的修正前腐化抗性会发生变化：\n经验掉落大于13的敌人不变，经验掉落小于等于13的敌人为14，恶魔撕裂者为11，矮人尸群为8。\n\n所有敌人的修正前腐化抗性都需乘以_1+4*生命比例^2_进行修正。\n\n每有1个减益效果都会降低敌人50%或25%_(未必是法杖施加的，取决于是主要减益还是次要减益)_的腐化抗性，当抗性低至不超过法杖的腐化能力时即可腐化。对于免疫腐化的目标，腐化改为定命(受到的伤害永久增加67%)。\n\n降低50%腐化抗性的主要减益：\n狂乱、幻惑、迟缓、麻痹、恍惚、魅惑、酸蚀、冻结、定命、魂飞魄散、魔法睡眠、灵魂标记。\n\n降低25%腐化抗性的次要减益：\n虚弱、易伤、失明、恐惧、残废、冻伤、缠绕、眩晕、催眠、流血、燃烧、中毒、腐蚀淤泥。\n\n当前不能腐化时，有_腐化能力/腐化抗性_的概率根据权重(括号内为权重，未提及则为0)对目标施加_6+法杖等级*3_回合的主要减益：狂乱(3)、幻惑(2)、迟缓(2)、麻痹(1)。\n\n未能施加主要减益则根据权重对目标施加_6+法杖等级*3_回合的次要减益：虚弱(2)、易伤(2)、失明(1)、恐惧(1)、残废(1)。\n\n若目标已有全部可施加的次要减益，则下次施法必定施加主要减益。\n\n若目标已有全部可施加的主要减益，则下次施法直接腐化(免疫腐化则定命)。\n\n_战斗法师_的魔杖近战效果：有_(魔杖等级+1)/(魔杖等级+6)_的概率施加_4+2*魔杖等级_回合的狂乱。\n\n对应魔杖的护甲技能_元素风暴_效果：元素风暴不造成伤害，但会使敌人狂乱5回合。

custom.dict.dict.wand_beam =解离法杖
custom.dict.dict.wand_beam_d =发射1道可造成_2+法杖等级~8+4*法杖等级_点魔法伤害的光束，光束可以直接穿透生物和固体方块并会根据穿透数量进行伤害修正。\n\n伤害修正：每穿透1个生物或3个固体方块，伤害增加_1~4_。\n\n光束距离为_法杖等级*2+6_。\n\n光束能够破坏可破坏地形(如门、草、储物木桶、书架等)。\n\n_战斗法师_的魔杖近战效果：同索敌附魔，延长1格魔杖近战距离。\n\n所有被光束穿透的目标都会被_术士_施加灵魂标记。\n\n所有被光束穿透的目标都会被_符文法师_引爆其身上的符文印记。\n\n对应魔杖的护甲技能_元素风暴_效果：元素风暴能够无视障碍物和墙体。

custom.dict.dict.wand_fireblast =焰浪法杖
custom.dict.dict.wand_fireblast_d =发射1道可造成_(1+法杖等级)*充能消耗~2*充能消耗*(充能消耗+法杖等级)_点魔法伤害的锥形焰浪。\n\n允许一次消耗复数点充能(释放消耗30%的当前充能，向上取整，至少1点充能)，一次消耗2点充能会额外造成4回合残废，一次消耗3点充能则额外造成4回合麻痹。\n\n每次消耗1/2/3点充能时，焰浪会波及5/7/9格远的范围。\n\n_战斗法师_的魔杖近战效果：根据攻击目标及目标周围的情况有_燃烧角色数量*25%_(若无燃烧角色，则为_燃烧地格数量*5%_)的概率造成3x3范围的_2+2*魔杖等级~8+4*魔杖等级_点魔法伤害，触发后清除受影响目标身上的燃烧效果和周围存在的火焰，这一近战特效只会伤害敌人且不会摧毁物品及部分场景。\n\n处于焰浪范围内的目标均会被_术士_施加灵魂标记。\n\n处于焰浪范围内的目标均会被_符文法师_引爆其身上的符文印记。\n\n对应魔杖的护甲技能_元素风暴_效果：元素风暴会点燃所有敌人8回合并使范围内的门被冲开、草被点燃。

custom.dict.dict.wand_frost =冰霜法杖
custom.dict.dict.wand_frost_d =发射1个可造成_2+法杖等级~8+5*法杖等级_点魔法伤害的射弹。\n\n可对目标叠加_2+法杖等级_回合的冻伤，当目标在水上时提升至_4+法杖等级_回合。\n\n目标已有冻伤效果时，每1回合冻伤会使该法杖对其造成的伤害降低1/15，叠乘计算，最多计算10回合(约降低50%)。对已冻结的目标不会造成伤害，同时也不会打破冻结。\n\n_战斗法师_的魔杖近战效果：根据攻击目标身上的冻伤效果有_(冻伤剩余回合数-1)/9_的概率冻结敌人_冻伤剩余回合数_回合。\n\n对应魔杖的护甲技能_元素风暴_效果：元素风暴会冻结所有敌人10回合并使范围内的火焰熄灭。

custom.dict.dict.wand_lightning =雷霆法杖
custom.dict.dict.wand_lightning_d =发射1道可造成_5+法杖等级~10+5*法杖等级_点魔法伤害的电弧，电弧可以链接与施法目标相邻的角色，若施法目标在水中则链接距离+1。\n\n电弧造成的伤害会随着链接目标的增多而衰减(衰减至_0.4+0.6/目标数量_倍)，若施法目标在水中则取消伤害衰减。\n\n使用者只会在近战距离使用雷霆法杖时被电弧链接，若使用者被电弧链接，则只受到一半的伤害。\n\n_战斗法师_的魔杖近战效果：有_(魔杖等级+1)/(魔杖等级+4)_的概率给予最多2.5回合(根据魔杖等级成长且呈对数衰减趋势，封顶10回合)的起电效果。起电效果会使自身免受雷霆法杖的伤害且雷霆法杖的电弧链接距离+1。\n\n被电弧链接到的目标也会被_术士_施加灵魂标记。\n\n被电弧链接到的目标也会被_符文法师_引爆其身上的符文印记。\n\n对应魔杖的护甲技能_元素风暴_效果：元素风暴会麻痹所有敌人5回合并使范围内的水带上3回合的电火花。

custom.dict.dict.wand_magicmissile =魔弹法杖
custom.dict.dict.wand_magicmissile_d =发射1个可造成_2+法杖等级~8+2*法杖等级_点魔法伤害的射弹。\n\n若背包内存在等级低于魔法法杖的法杖，则命中目标后会获得4回合魔力强化效果，在此效果期间所有等级低于魔弹法杖的法杖在下一次施法时均被视为_等级等于魔弹法杖等级_的法杖，不过对于可进行复数充能消耗的法杖，其施法的充能消耗还是由法杖本身的充能数决定。使用能够生效该效果的法杖施法后会立即失去该效果。\n\n_战斗法师_的魔杖近战效果：为除魔杖外的所有法杖回复0.5点充能。\n\n对应魔杖的护甲技能_元素风暴_效果：元素风暴只造成50%的伤害，但会给予使用者15回合的法杖充能效果。

custom.dict.dict.wand_light =棱光法杖
custom.dict.dict.wand_light_d =发射1道可造成_1+法杖等级~5+3*法杖等级_点魔法伤害的光束，对于_亡灵和恶魔属性_敌人会额外造成1/3的伤害。\n\n光束有_1-3/(法杖等级+5)_的概率造成_2+法杖等级_回合失明。\n\n光束能够探查出射线路径周围一格未被探索的地形，同时还能够揭露隐藏的陷阱和门。\n\n在黑暗层和第五区域施法时会给予使用者_10+法杖等级*5_回合的发光，在启用_没入黑暗_挑战后能够常态给予发光但持续时间缩短至_2+法杖等级_回合。\n\n_战斗法师_的魔杖近战效果：致残攻击目标_(1+魔杖等级)_回合。\n\n对应魔杖的护甲技能_元素风暴_效果：元素风暴只造成67%的伤害，但会致盲敌人5回合并揭露范围内未被探索的地形。

custom.dict.dict.wand_grass =再生法杖
custom.dict.dict.wand_grass_d =发射1道不造成伤害的锥形再生魔法，在范围内长出高草甚至是特殊植物。\n\n再生魔法会对范围内的生物造成_4*充能消耗_回合的缠绕。\n\n允许一次消耗复数点充能(释放消耗30%的当前充能，向上取整，至少1点充能)，长出高草的数量与充能消耗和法杖等级有关，而出现包括结露草和种子荚在内的特殊植物的概率与充能消耗有关。\n\n长出高草和特殊植物的总充能数限制为_20+英雄等级*(2+法杖等级)*{1+[法杖等级/(50-5*法杖等级)]}_，在消耗的总充能数达到限制后，长出高草和特殊植物的数量会逐渐衰减，最终只能长出枯草。可以通过提升英雄等级与法杖等级以继续使用，在法杖达到10级后可无限使用。\n\n一次消耗3点充能可长出黄金莲，持续_25+法杖等级*3_回合，影响_法杖等级_格范围，范围内所有特殊植物有_40%+法杖等级*4%_的概率在触发后掉落种子(15级时为必定)，而涂药飞镖的药效使用次数会因此提升至_1/(0.6-0.04*法杖等级)_倍(15级时为无限)。\n\n_战斗法师_的魔杖近战效果：至少一方站在草中时，自身会获得_0.5*结算前伤害*(魔杖等级+2)/(魔杖等级+6)_点治疗量的草药疗养效果。\n\n_术士_对处于可长草位置的目标施法能够施加灵魂标记。\n\n_符文法师_对处于可长草位置的目标施法能够引爆目标身上的符文印记。\n\n对应魔杖的护甲技能_元素风暴_效果：元素风暴不造成伤害，但会缠绕敌人5回合并在范围内随机生出高草。

custom.dict.dict.wand_transfusion =注魂法杖
custom.dict.dict.wand_transfusion_d =发射1道不造成伤害但会魅惑敌人5回合的光束，并给予使用者_5+法杖等级_点护盾。\n\n对_亡灵属性_敌人施法不会造成魅惑而是改为造成_3+法杖等级~6+2*法杖等级_点魔法伤害。\n\n对盟友(包括被魅惑的目标)施法则会消耗使用者5%的生命以回复盟友_3*法杖等级+消耗生命_点生命，溢出部分会转化为护盾。\n\n_战斗法师_的魔杖近战效果：攻击被魅惑的目标会获得_10+2*魔杖等级_点护盾，并且下一次对盟友(包括被魅惑的目标)施法时不会消耗自身生命。\n\n对应魔杖的护甲技能_元素风暴_效果：元素风暴只会对_亡灵属性_敌人造成伤害，但会魅惑所有非亡灵属性的敌人5回合并为所有盟友(包括被魅惑的目标)回复10点生命(溢出部分会转化为护盾)。

custom.dict.dict.wand_corrosion =酸蚀法杖
custom.dict.dict.wand_corrosion_d =发射1个不造成伤害且可直接穿过生物的射弹，在落点产生沿十字扩散的腐蚀酸雾。\n\n腐蚀酸雾气体量为_50+10*法杖等级_单位，处于腐蚀酸雾中的单位会获得起始伤害为_2+法杖等级_的酸蚀。\n\n_战斗法师_的魔杖近战效果：有_(魔杖等级+1)/(魔杖等级+3)_的概率使目标获得20回合腐蚀淤泥。\n\n_术士_可对_以射弹落点为中心的3x3_范围内的所有目标施加灵魂标记。\n\n_符石法师_可引爆_以射弹落点为中心的3x3_范围内的所有目标身上的符文印记。\n\n对应魔杖的护甲技能_元素风暴_效果：元素风暴不造成伤害，但会给予所有敌人4回合起始伤害为6的酸蚀。

custom.dict.dict.wand_warding =哨卫法杖
custom.dict.dict.wand_warding_d =发射1个不造成伤害的射弹，在合法落点(即空地)生成1个1阶哨卫，再次对哨卫施法可进行升阶，单个哨卫最多升为6阶。\n\n每根哨卫法杖能提供的充能是_2+法杖等级_，维持1~6阶哨卫分别需要消耗1~6点充能，如果所有哨卫法杖提供的充能和不高于维持所有哨卫的充能消耗，则不能再生成或是升级哨卫。\n\n哨卫拥有_3+哨卫阶数_格视野并会与使用者共享。\n\n哨卫攻击时会发射1道可造成_2+法杖等级~8+4*法杖等级_点魔法伤害的光束，攻击延迟为_1_，其中1~3阶哨卫在分别攻击_1_，_3_，_5_次后消散，4~6阶哨卫则是每次攻击分别会消耗_5_，_6_，_7_点生命。\n\n4~6阶哨卫分别拥有_35_，_54_，_84_点生命，_(0~3+楼层数/2)*(7-哨卫阶数)_点防御，_4+楼层数_点闪避。\n\n哨卫具有_非生物和无法移动属性_，免疫催眠、魔法睡眠、恐惧、魂飞魄散、腐化和眩晕。\n\n_战斗法师_的魔杖近战效果：有_(魔杖等级+1)/(魔杖等级+5)_的概率为所有2~3阶哨卫分别恢复_1_，_2_次攻击次数，对于4~6阶哨卫则分别回复_9_，_12_，_16_点生命。\n\n哨卫的攻击可以施加_术士_的灵魂标记。\n\n哨卫的攻击可以引爆_符文法师_施加的符文印记。\n\n对应魔杖的护甲技能_元素风暴_效果：元素风暴不造成伤害，但会为范围内所有2~3阶哨卫分别恢复_1_，_2_次攻击次数，对于4~6阶哨卫则分别回复_9_，_12_，_16_点生命。

custom.dict.dict.wand_soil =灵壤法杖
custom.dict.dict.wand_soil_d =发射1个可造成_4~6+法杖等级*2_点魔法伤害的射弹，命中时给予使用者等同于造成伤害的灵壤护甲。\n\n灵壤护甲能够吸收50%受到的伤害，当护甲量超过_8+法杖等级*4_时，再次施法命中敌人会在其周围生成1个灵壤守卫。\n\n灵壤守卫攻击造成_2~4+楼层数/2_点伤害，攻击延迟为_1_。\n\n灵壤守卫拥有_16+法杖等级*8_点生命，_8_格视野，_法杖等级~3+法杖等级*3_点防御(开启_信念护体_挑战后：_法杖等级~2+法杖等级_点防御)，以及和使用者相同的精准与一半的闪避。\n\n灵壤守卫具有_非生物属性_，免疫恐惧、魂飞魄散和腐化。\n\n_战斗法师_的魔杖近战效果：获得_结算前伤害*33%_的灵壤护甲，灵壤守卫存在时则为其回复等量生命。\n\n对应魔杖的护甲技能_元素风暴_效果：元素风暴只造成50%的伤害，但每对一个敌人造成伤害就会为灵壤守卫回复5点生命值。



##******************************* rings
custom.dict.dict.ring_accuracy =精准之戒
custom.dict.dict.ring_accuracy_d =将穿戴者的精准属性提升至_1.3^效果等级_倍。

custom.dict.dict.ring_element =元素之戒
custom.dict.dict.ring_element_d =降低穿戴者受到的魔法伤害和各种元素(燃烧、毒气、酸蚀等)伤害，同时降低大部分减益效果的持续时间。\n\n上述效果会被降低至_0.825^效果等级_倍。\n\n该戒指提供的元素抗性的效果与魔法羽毛、天赋_原生魔物_的效果一致，同时拥有多个来源的元素抗性效果会直接乘算。

custom.dict.dict.ring_arcana =奥术之戒
custom.dict.dict.ring_arcana_d =穿戴者的附魔和刻印的触发概率变为_1.175^效果等级_倍，大多数附魔和刻印在触发概率超过100%时将增强效果。\n\n所有附魔和刻印在触发概率超过100%后的效果(包括一些没有触发概率的附魔和刻印的增幅情况)：\n\n_烈焰附魔：_即使目标此前没有被点燃，依旧会额外受到_燃烧伤害*(概率-1)*0.67_点魔法伤害(在概率大于200%之前的确是比攻击燃烧目标更低的魔法伤害)。\n\n_寒霜附魔：_冻伤时长及时长上限*概率。\n\n_恒动附魔：_伤害储存量等于_溢出伤害*1.175^效果等级_。\n\n_电击附魔：_魔法伤害*概率。\n\n_招架附魔：_概率超过100%后也仅是根据原公式增加了护盾量，无特殊增幅。\n\n_繁茂附魔：_无论概率是否超过100%，奥术之戒的增幅都会影响生长高草的数量(使目标自身所处位置或周围长出_[(1+0.1*武器等级)*1.175^效果等级]的整数部分_格高草，同时还会有_[(1+0.1*武器等级)*1.175^效果等级]的小数部分_的概率额外长出1格高草)。\n\n_弹性附魔：_击退距离*概率。\n\n_幸运附魔：_模拟_5*概率-10_级财富之戒的消耗品掉落(0级的财富之戒的消耗品掉落是60%低级30%中级10%高级，每升一级-4%低级+2%中级和高级，在-5级时正好是0%高级，大于-5级开始有概率产生高级掉落)。\n\n_索敌附魔：_对于近战武器为近战距离增加_1.175^效果等级_格(四舍五入)，对于远程武器则为至多可穿透_3*1.175^效果等级_格(四舍五入)路径中的墙体与单位。\n\n_紊乱附魔：_视随机出的附魔效果而定。\n\n_酸蚀附魔：_酸蚀起始伤害*概率。\n\n_腐化附魔：_被腐化的单位获得_5*(概率-1)_回合(四舍五入)的激素涌动(移动速度*2，攻击速度*1.5)。\n\n_死神附魔：_请输入文本(实际难以让概率超过100%，就算能超过也没有什么特别的)。\n\n_血饮附魔：_回复量*概率。\n\n_横扫附魔：_生效范围为使用者周围_近战攻击距离_格，在此基础上额外增加_0.5*1.175^效果等级_格(四舍五入)。\n\n_神圣附魔(来自法术神圣武器)：_攻击额外造成_2*1.175^效果等级_点魔法伤害，_圣骑士_则为攻击额外造成_6*1.175^效果等级_点魔法伤害。\n\n_易爆诅咒：_每次积攒的热量需要乘以_1.175^效果等级_。\n\n_极化诅咒：_有_0.5*1.175^效果等级_的概率造成1.5倍伤害(3级奥术之戒的概率就约为95%了)，其余情况为0伤害。\n\n_沉重诅咒：_武器力量需求+2，在此基础上额外增加_1.175^效果等级_(向下取整)。\n\n_晦暗刻印：_原先获得的潜行值提升至_1.175^效果等级_倍。\n\n_迅捷刻印：_原先获得的移动速度加成提升至_1.175^效果等级_倍。\n\n_粘稠刻印：_原先的转化比例提升至_1.175^效果等级_倍，转化比例超过100%时，所受伤害降低至_伤害/转化比例_点并会被全额转化为延缓伤害。\n\n_电势刻印：_法杖充能回复量等于概率。\n\n_狱火刻印：_在火焰中每回合会获得基础量为_(2*1.175^效果等级)-2_点的护盾，护盾量最多不超过4倍基础量(四舍五入，比如基础量是2.4，那就是每回合获得2点且有40%的概率额外获得1点护盾，最多不超过10点)。\n\n_磐岩刻印：_根据我方闪避与敌方精准属性计算闪避概率时，我方闪避属性视为_闪避属性*1.175^效果等级_。\n\n_缠绕刻印：_植被护甲量*概率。\n\n_反斥刻印：_沿攻击反方向的击退距离*概率。\n\n_迷彩刻印：_原先获得的隐形回合提升至_1.175^效果等级_倍。\n\n_涌流刻印：_原先获得的移动速度加成提升至_1.175^效果等级_倍。\n\n_魅惑刻印：_魅惑持续时间*概率。\n\n_敌法刻印：_原先的魔法减伤提升至_1.175^效果等级_倍。\n\n_荆棘刻印：_流血原始值*概率。\n\n_神圣刻印(来自法术神圣护甲)：_提供_1.175^效果等级_点防御，_圣骑士_则为提供_3*1.175^效果等级_点防御。\n\n_臃肿诅咒：_原先通过门所需的回合降低至_0.825^效果等级_倍。\n\n_灌铅诅咒：_护甲力量需求+2，在此基础上额外增加_1.175^效果等级_(向下取整)。\n\n其余未提及的诅咒附魔和诅咒刻印均只是触发概率变为_1.175^效果等级_倍，因此不过多赘述。

custom.dict.dict.ring_energy =能量之戒
custom.dict.dict.ring_energy_d =使穿戴者的法杖、魔杖、神器和护甲技能充能速度提升至_1.175^效果等级_倍。

custom.dict.dict.ring_evasion =闪避之戒
custom.dict.dict.ring_evasion_d =将穿戴者的闪避属性提升至_1.125^效果等级_倍。

custom.dict.dict.ring_force =武力之戒
custom.dict.dict.ring_force_d =赤手空拳时相当于一把等级等同于效果等级的武器，其阶数在穿戴者力量不超过18时为_(力量-8)/2_阶，超过18时则为_(力量-18)/4+5_阶。\n\n_阶数~5*阶数+5_基础伤害， _1~(阶数+1)_伤害成长。\n\n装备武器时会为武器增加_效果等级_点伤害。\n\n_决斗家_武技(拳击架势)：进入这一架势后，近战攻击造成的伤害固定为_武力之戒伤害+3+(力量-8)/2+武技之戒等级*(力量-4)/8_，但武技充能速度会降低50%并在取消架势的50回合后才会恢复正常。

custom.dict.dict.ring_furor =狂怒之戒
custom.dict.dict.ring_furor_d =将穿戴者的攻击速度提升至_1.09051^效果等级_倍。

custom.dict.dict.ring_haste =疾速之戒
custom.dict.dict.ring_haste_d =将穿戴者的移动速度提升至_1.175^效果等级_倍。

custom.dict.dict.ring_might =根骨之戒
custom.dict.dict.ring_might_d =为穿戴者提供_效果等级_点额外力量并将最大生命提升至_1.035^效果等级_倍。

custom.dict.dict.ring_shoot =神射之戒
custom.dict.dict.ring_shoot_d =将穿戴者的投掷武器的伤害提升至_效果等级等同的等级_时的伤害并将投掷武器的耐久提升至_1.2^效果等级_倍(能够影响除腐莓飞镖外的涂药飞镖的药效使用次数)。

custom.dict.dict.ring_tenacity =韧性之戒
custom.dict.dict.ring_tenacity_d =使穿戴者受到的所有伤害降低至_0.85^(效果等级*失血比例)_倍(向上取整，最终所受伤害至少为1点)。

custom.dict.dict.ring_wealth =财富之戒
custom.dict.dict.ring_wealth_d =穿戴者击杀敌人产生原有掉落物的概率提升至_1.2^效果等级_倍，并且在击杀若干敌人后还会触发财富之戒的额外掉落。\n\n财富之戒的额外掉落分为4种(不会有力量药剂、升级卷轴和强化符石)：\n\n_低级掉落(绿色)：_1瓶随机药剂/1张随机卷轴/1块随机符石/金币。\n_中级掉落(蓝色)：_双份的低级掉落/1瓶随机合剂/1张随机秘卷/1瓶紊乱魔药/1个无序结晶/蜂蜜罐/炸弹。\n_高级掉落(紫色)：_双份的中级掉落/1瓶经验药剂/1张嬗变卷轴/1块附魔符石。\n_宝藏级掉落(大于等于2级为金色，低于为紫色)：_1件随机近战武器/护甲/神器/戒指。\n\n每_0~20_次击杀(小Boss计5次，Boss计15次)可触发一次前三级掉落，每_5~10_次前三级掉落会触发一次宝藏级掉落。\n\n0级的财富之戒的消耗品掉落是60%低级30%中级10%高级，每升一级-4%低级+2%中级和高级。\n\n宝藏级掉落给予的装备的不同阶数概率与财富之戒的等级和当前楼层数有关，原理为：计算_(效果等级+楼层数-1)/5_(向下取整)，0~4即对应第一至第五区域的装备掉落，超出4均对应第五区域。\n\n宝藏级掉落给予的装备拥有正面附魔或正面刻印的概率同样与财富之戒的等级有关，原理为：从0~9随机取数，小于_效果等级-1_就附魔，大于等于则不附魔同时检测有无诅咒，有诅咒就清除。\n\n宝藏级掉落默认给予0~2级装备，财富之戒会将这一掉落的装备的等级下限提高至_效果等级/2_级(向下取整)，如1/3/5/7/9...级的财富之戒为2/4/6/8/10...效果等级，因此会提高1/2/3/4/5...等级下限。\n\n在同时装备多个财富之戒的情况下，仅对宝藏级掉落给予的装备等级来说，其他等级相等或更低级的财富之戒_每个最多只提供2效果等级(即仅视为1级的财富之戒)_影响这一掉落的装备的等级下限。\n\n除_矮人公主_外的其他英雄在获得3层天赋_戒指联结+1/+2/+3_并用财富之戒生效该天赋时，该天赋可以直接提供1/2/3效果等级影响宝藏级掉落给予的装备的等级下限。

custom.dict.dict.ring_king =王储之戒
custom.dict.dict.ring_king_d=_矮人公主_初始携带的特殊戒指。可以使用奥术刻笔、附魔符石和注魔秘卷进行附魔，能够存储一个附魔和一个刻印，两者能够正常生效且不会覆盖武器已有的附魔效果和护甲已有的刻印效果。\n\n会随英雄等级提升而进行升级(视觉上为每5英雄等级提升1级，但附魔和刻印强度则分别在3，5，8，10，13，15，18，20，23，25，28，30英雄等级时提升1级，初始为0级强度)。


##******************** trinkets
custom.dict.dict.trinket_trinket_catalyst =魔能触媒
custom.dict.dict.trinket_trinket_catalyst_d =在第一区域的前3层生成，通常会生成在大部分特殊房间或是黄金宝箱中。\n\n炼金时放入，可以花费6点炼金能量进行饰物四选一。\n\n得到的饰物再次进行炼金可以花费炼金能量升级，最高只能升到3级。\n\n嬗变卷轴可用于饰物。

custom.dict.dict.trinket_magicweather =魔法羽毛
custom.dict.dict.trinket_magicweather_d =从0级到3级升级分别消耗_10/15/20_点炼金能量。\n\n_0/1/2/3_级时，英雄通过法杖或魔杖施法造成的魔法伤害和法杖充能速度增加_7.5%/15%/22.5%/30%_，但元素抗性会减少_15%/30%/45%/60%_。\n\n影响元素抗性的效果与元素之戒、天赋_原生魔物_的效果一致，同时拥有多个来源的元素抗性效果会直接乘算。

custom.dict.dict.trinket_spearshield =嵌合矛盾
custom.dict.dict.trinket_spearshield_d =从0级到3级升级分别消耗_20/25/30_点炼金能量。\n\n_矛尖_模式：_0/1/2/3_级时，英雄的物理武器造成的最小伤害变为最大伤害的_40%/60%/80%/100%_，但物理护甲进行的最大减免变为原先的_80%/60%/40%/20%_。\n\n_盾面_模式：_0/1/2/3_级时，英雄的物理护甲进行的最小减免变为最大减免的_40%/60%/80%/100%_，但物理武器造成的最大伤害变为原先的_80%/60%/40%/20%_。\n\n两种生效模式可以互相切换，但每次切换拥有1级英雄等级冷却，冷却期间的最小值修正效果变为0%，饰物不在背包中则无法恢复冷却。\n\n对于物理武器，能影响手中武器、投掷武器、武力之戒和武技的伤害，但非武力之戒的徒手攻击、额外力量增加的伤害范围不受影响。\n\n对于物理护甲，能影响手中武器、身穿护甲和树肤效果的护甲，但各项天赋提供的额外护甲不受影响。\n\n对于最小值的修正效果可以低于原先的最小值，而对于最大值的修正效果不会低于最小值。\n\n同时拥有饰物十三叶草时，嵌合矛盾总是后于十三叶草生效，从而影响造成伤害的最小/最大值。

custom.dict.dict.trinket_dimensional_sundial =位面日晷
custom.dict.dict.trinket_dimensional_sundial_d =从0级到3级升级分别消耗_6/8/10_点炼金能量。\n\n_0/1/2/3_级时，在设备的系统时间晚上8点到早上8点之间刷敌效率为_+0.25/+0.5/+0.75/+1_，其余时间刷敌效率为_-0.05/-0.1/-0.15/-0.2_。\n\n通常每50回合尝试生成一个敌人，黑暗层为33回合，拿到Yendor护符返程时为_5*当前敌人数量_回合(介于5~25之间，1层进一步缩短60%)，最后的回合数才会除以_1+日晷效率_。巨魔铁匠任务层固定150回合生成间隔，不受影响。

custom.dict.dict.trinket_exotic_crystals =奇异能晶
custom.dict.dict.trinket_exotic_crystals_d =从0级到3级升级分别消耗_6/8/10_点炼金能量。\n\n_0/1/2/3_级时，有_12.5%/25%/37.5%/50%_的概率会将自然生成的药剂、卷轴替换为对应的合剂、秘卷。\n\n这一效果同时还影响水晶道路房(六选三)/隐藏的炼金房/隐藏的卷轴房/财富戒指的高级掉落/烧毁书架的卷轴掉落。

custom.dict.dict.trinket_eye_of_newt =蝾螈魔眼
custom.dict.dict.trinket_eye_of_newt_d =从0级到3级升级分别消耗_6/8/10_点炼金能量。\n\n_0/1/2/3_级时，降低英雄_12.5%/25%/37.5%/50%_的视野范围，同时赋予英雄_2/3/4/5_格内对于敌人的灵视感知。\n\n影响视野范围的效果与_狙击手_的天赋_鹰眼远视_乘算，而赋予灵视感知的效果不与2层天赋_敏锐感知_叠加(二者只取范围最大的那个)。

custom.dict.dict.trinket_mimic_tooth =拟箱利齿
custom.dict.dict.trinket_mimic_tooth_d =从0级到3级升级分别消耗_6/8/10_点炼金能量。\n\n灵视效果不再对宝箱怪起效，除水晶宝箱怪和蜕变宝箱怪以外的所有宝箱怪掉落物品+1(纯随机物品，下到种子上到神器)。_0/1/2/3_级时，宝箱怪生成概率变为_1.5/2/2.5/3_倍，且每层额外有_12.5%/25%/37.5%/50%_的概率生成一个黑檀宝箱怪。\n\n黑檀宝箱怪有50%的概率生成于特殊房间之外的随机物品上，40%的概率生成于门上，10%的概率生成于下楼楼梯口，其属性及特性与普通宝箱怪基本一致但开箱时的攻击伤害是普通宝箱怪的2倍，掉落与黄金宝箱怪基本一致但比黄金宝箱怪多一件物品。


custom.dict.dict.trinket_mossy_clump =苔藓丛簇
custom.dict.dict.trinket_mossy_clump_d =从0级到3级升级分别消耗_10/15/20_点炼金能量。\n\n通常普通层的生成概率为50%。_0/1/2/3_级时，普通层有_25%/50%/75%/100%_的概率变为流水或草木层，两者概率均等。\n\n同时拥有饰物陷阱元件时，其效果优先于陷阱元件。

custom.dict.dict.trinket_parchment_scrap =残魔余卷
custom.dict.dict.trinket_parchment_scrap_d =从0级到3级升级分别消耗_10/15/20_点炼金能量。\n\n_0/1/2/3_级时，装备生成带有正面附魔与正面刻印的概率变为原先的_2/4/7/10_倍，带有诅咒的概率则变为原先的_1.5/2/1/0_倍。\n\n装备生成时带有正面附魔与正面刻印的基础概率为10%，诅咒则为30%。这意味着，拥有1~2级的残魔余卷时，生成的装备如果没有正面附魔与正面刻印则必定为诅咒，同时3级的残魔余卷还会使得祭坛房间的武器生成和上锁墓碑房间的护甲生成必定拥有等级。

custom.dict.dict.trinket_petrified_seed =石化种子
