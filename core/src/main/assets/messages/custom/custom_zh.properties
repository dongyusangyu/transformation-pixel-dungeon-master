custom.dict.dict.mob_pylon =能量塔
custom.dict.dict.mob_pylon_d =在DM-300进入超载时激活，地面的电火花会持续指示其方向。\n\n这个敌人的最大生命为_50_(开启_绝命头目_挑战后为_80_)，视野为_8_，无法攻击，防御为_0_，闪避为_0_。\n\n激活时在周围释放顺时针旋转的电弧，伤害为_10~20_。\n\n大幅抑制超过15的伤害(14之后每想要造成一点伤害，需要1，2，3，4...点原始伤害)。\n\n具有_小Boss、电、非生物和无法移动属性_，免疫麻痹、狂乱、眩晕、催眠、魔法睡眠、恐惧和魂飞魄散。\n\n掉落_1_经验，获得经验的最大英雄等级为_-2_级。



##4
custom.dict.dict.ch4 =第四区域：矮人都城
custom.dict.dict.ch4_d =以下是16~19层的敌人信息。

custom.dict.dict.mob_ghoul =矮人尸群
custom.dict.dict.mob_ghoul_d =于16~19层生成，此外有2.5%的概率于14层生成，生成时总是两两生成。\n\n这个敌人的最大生命为_45_，视野为_8_，攻击距离为_1_，攻击为_16~22_，防御为_0~4_，攻击延迟为_1_，移动速度为_1_，闪避为_20_，精准为_24_。\n\n其中一名矮人尸群成员被击倒时，如果能保持位于另一名成员的视野内或其周围7x7范围内，它将陷入假死状态，并在_被击倒次数*5_回合(会因为击倒的那一回合-1)后以_最大生命10%_点生命重生，否则将会死亡。\n\n具有_亡灵属性_。\n\n掉落_5_经验，获得经验的最大英雄等级为_20_级。\n\n有20%的概率掉落一堆金币。

custom.dict.dict.mob_ele_fire =火焰元素
custom.dict.dict.mob_ele_fire_d =于16~19层生成。\n\n这个敌人的最大生命为_60_，视野为_8_，攻击距离为_1_，攻击为_20~25_，防御为_0~5_，攻击延迟为_1_，移动速度为_1_，闪避为_20_，精准为_25_。\n\n攻击时有50%的概率对不处于水上的目标造成_8_回合燃烧。\n\n与已锁定的目标相距大于等于1格时，每_3~5_回合远程释放一次不会直接造成伤害的特殊攻击，对目标造成_4_回合燃烧。\n\n具有_火属性_，在获得冻伤或冻结时失去_最大生命50%~60%_点生命。\n\n掉落_10_经验，获得经验的最大英雄等级为_20_级。\n\n有12.5%的概率掉落一瓶液火药剂。
custom.dict.dict.mob_ele_frost =冰霜元素
custom.dict.dict.mob_ele_frost_d =于16~19层生成。\n\n这个敌人的最大生命为_60_，视野为_8_，攻击距离为_1_，攻击为_20~25_，防御为_0~5_，攻击延迟为_1_，移动速度为_1_，闪避为_20_，精准为_25_。\n\n攻击时有33%的概率造成_3_回合冻伤(目标处于水上为_5_回合)，满10回合造成冻结。\n\n与已锁定的目标相距大于等于1格时，每_3~5_回合远程释放一次不会直接造成伤害的特殊攻击，对目标造成_3_回合冻伤(目标处于水上为_5_回合)，满10回合造成冻结，若目标已经冻结则延长2回合。\n\n具有_冰属性_，在获得燃烧时失去_最大生命50%~60%_点生命。\n\n掉落_10_经验，获得经验的最大英雄等级为_20_级。\n\n有12.5%的概率掉落一瓶冰霜药剂。
custom.dict.dict.mob_ele_shock =电光元素
custom.dict.dict.mob_ele_shock_d =于16~19层生成，生成概率是火焰和冰霜元素的一半。\n\n这个敌人的最大生命为_60_，视野为_8_，攻击距离为_1_，攻击为_20~25_，防御为_0~5_，攻击延迟为_1_，移动速度为_1_，闪避为_20_，精准为_25_。\n\n攻击时会对目标周围一圈的生物(不包括自身但包括其他电光元素)造成_护甲结算后伤害*0.4_的魔法伤害。\n\n与已锁定的目标相距大于等于1格时，每_3~5_回合远程释放一次不会直接造成伤害的特殊攻击，对目标造成_5_回合失明。\n\n具有_电属性_。\n\n掉落_10_经验，获得经验的最大英雄等级为_20_级。\n\n有25%的概率掉落一张充能卷轴。
custom.dict.dict.mob_ele_chaos =混沌元素
custom.dict.dict.mob_ele_chaos_d =有2%的概率替换任一元素生成。\n\n这个敌人的最大生命为_60_，视野为_8_，攻击距离为_1_，攻击为_20~25_，防御为_0~5_，攻击延迟为_1_，移动速度为_1_，闪避为_20_，精准为_25_。\n\n攻击时附带随机一种诅咒法杖效果。\n\n与已锁定的目标相距大于等于1格时，每_3~5_回合远程释放一次不会直接造成伤害的特殊攻击，产生随机一种诅咒法杖效果。\n\n掉落_10_经验，获得经验的最大英雄等级为_20_级。\n\n必定掉落且只会掉落一张嬗变卷轴。

custom.dict.dict.mob_golem =魔像
custom.dict.dict.mob_golem_d =于18~19层生成。\n\n这个敌人的最大生命为_120_，视野为_8_，攻击距离为_1_，攻击为_25~30_，防御为_0~12_，攻击延迟为_1_，移动速度为_1_，闪避为_15_，精准为_28_。\n\n已锁定目标且与目标有一定距离时，会根据情况将目标传送至自身周围距离其他敌人最远的一格：能寻路到目标那格(不考虑巨型属性影响)且与目标相距大于等于1格时，从_0~100/相距距离_随机取数，为0就传送目标；能寻路到目标那格(不考虑巨型属性影响)但因为巨型属性无法抵达时，直接传送目标。每个魔像都能无限使用此能力，使用后会进入_20_回合冷却。\n\n未锁定目标或丢失目标后，花费2回合对自身进行随机传送(可传送至特殊房间和隐藏房间)，传送过程中锁定目标或受到攻击会中止传送但不会重新进入冷却。每个魔像都能无限使用此能力，使用后会进入_30_回合冷却。\n\n具有_非生物和巨型属性_。\n\n掉落_12_经验，获得经验的最大英雄等级为_22_级。\n\n有20%的概率掉落一件随机武器或护甲(阶数概率等效第五区域)，每掉一次概率都会降至1/3倍。

custom.dict.dict.mob_monk =矮人武僧
custom.dict.dict.mob_monk_d =于17~19层生成。\n\n这个敌人的最大生命为_70_，视野为_8_，攻击距离为_1_，攻击为_12~25_，防御为_0~2_，攻击延迟为_0.5_，移动速度为_1_，闪避为_30_，精准为_30_。\n\n受到物理攻击后立即获得凝神，必定闪避下一次受到的物理攻击，之后每_6~7_回合可重新获得凝神，移动时凝神恢复速度加快67%。\n\n具有_亡灵属性_。\n\n掉落_11_经验，获得经验的最大英雄等级为_21_级。\n\n有1/12的概率掉落一份口粮。

custom.dict.dict.mob_senior =武僧大师
custom.dict.dict.mob_senior_d =有2%的概率替换矮人武僧生成。\n\n这个敌人的最大生命为_70_，视野为_8_，攻击距离为_1_，攻击为_16~25_，防御为_0~2_，攻击延迟为_0.5_，移动速度为_1_，闪避为_30_，精准为_30_。\n\n受到物理攻击后立即获得凝神，必定闪避下一次受到的物理攻击，之后每_6~7_回合可重新获得凝神，移动时凝神恢复速度加快233%。\n\n具有_亡灵属性_。\n\n掉落_11_经验，获得经验的最大英雄等级为_21_级。\n\n必定掉落且只会掉落一份肉馅饼。

custom.dict.dict.mob_warlock =矮人术士
custom.dict.dict.mob_warlock_d =于16~19层生成。\n\n这个敌人的最大生命为_70_，视野为_8_，可远程施法造成_12~18_点魔法伤害而在近身时使用近战攻击，近战攻击距离为_1_，近战攻击为_12~18_，防御为_0~8_，攻击延迟为_1_，移动速度为_1_，闪避为_18_，远程精准为_50_，近战精准为_25_。\n\n远程攻击有1/3的概率造成_30_回合降级。\n\n具有_亡灵属性_。\n\n掉落_11_经验，获得经验的最大英雄等级为_21_级。\n\n有50%的概率掉落一瓶随机药剂(不包括力量药剂)。掉落治疗药剂的概率在此基础上除以3，上限7(实际数值，有Bug，理应为8)瓶，每掉一次概率都会降至_(掉落上限-已掉落数)/掉落上限_倍。

custom.dict.dict.ch4_div =第四区域Boss
custom.dict.dict.ch4_div_d =第20层的第四个Boss——矮人国王。战斗分三个阶段，在一个圆形房间进行，房间中心有一个王座，四个角落分别有一个唤灵基座。\n\n矮人国王通常会使用近战攻击，同时能够召唤敌人并拥有两种特殊能力。\n\n_一阶段：_\n\n矮人国王每_10~14_回合会在随机一个唤灵基座上召唤一名敌人(自召唤特效出现后_2_回合产生敌人)，敌人种类随召唤次数变化，第_4的倍数_次召唤为矮人术士(黑烟)或矮人武僧(绿火)，其他为矮人尸群(白骨)。每次受伤会减少_所受伤害/8_回合召唤间隔。\n\n矮人国王拥有两种特殊能力，共享_10~14_回合冷却：\n对最远的敌人进行100回合的生命联结，期间双方平分伤害直到至少一方死亡；\n将最远的敌人传送至目标周围。\n\n每次受伤会减少_所受伤害/8_回合特殊能力冷却。\n两种特殊能力分别会有50%的概率使用。如果已使用了其中一种，下次使用时，未在上次使用的那一种概率提高为87.5%。\n\n矮人国王在损失_250_点生命(超出部分不计)后进入二阶段。\n\n_二阶段：_\n\n矮人国王会传送到王座上，获得_300_点不随时间衰减的护盾，免疫一切伤害，不进行攻击也不会使用特殊能力。\n\n这一阶段会在唤灵基座上召唤三波敌人，第一波为4个矮人尸群，第二波为3个矮人尸群和1个矮人术士或矮人武僧，第三波为2个矮人尸群、1个矮人术士和1个矮人武僧。每一波的每名敌人被击杀都会使矮人国王失去25点护盾，在失去所有护盾后进入三阶段。\n\n_三阶段：_\n\n矮人国王受到的所有伤害会全额转为延缓伤害，不会使用特殊能力。\n\n这一阶段会无间隔地持续召唤敌人，矮人国王死亡时，其召唤的所有敌人也会死亡。\n\n开启_绝命头目_挑战后：\n最大生命+50%(一阶段在损失_350_点生命后进入二阶段，二阶段获得_450_点不随时间衰减的护盾)；\n召唤时自召唤特效出现后_1_回合产生敌人，敌人种类随召唤次数变化，第_3的倍数_次召唤为矮人术士(黑烟)或矮人武僧(绿火)，第_9的倍数_次召唤为魔像(电光)，其他为矮人尸群(白骨)；\n一阶段的召唤间隔和特殊能力冷却变为_8~10_回合；\n二阶段召唤敌人第一波为6个矮人尸群，第二波为4个矮人尸群、1个矮人术士和1个矮人武僧，第三波为2个矮人尸群、1个矮人术士、1个矮人武僧和2个魔像；\n三阶段与原先一致，只是因为最大生命增加导致三阶段的生命更多。\n\n击杀后获得4000排行榜Boss战分数，英雄每次受到矮人术士的法术攻击-400分。

custom.dict.dict.mob_king =矮人国王
custom.dict.dict.mob_king_d =于第20层作为第四区域的Boss出现。\n\n这个敌人的最大生命为_300_，视野为_8_，攻击距离为_1_，攻击为_15~25_，防御为_0~10_，攻击延迟为_1_，移动速度为_1_，闪避为_22_，精准为_26_。\n\n一阶段的矮人国王每_10~14_回合会在随机一个唤灵基座上召唤一名敌人(自召唤特效出现后_2_回合产生敌人)，敌人种类随召唤次数变化，第_4的倍数_次召唤为矮人术士(黑烟)或矮人武僧(绿火)，其他为矮人尸群(白骨)。每次受伤会减少_所受伤害/8_回合召唤间隔。\n\n矮人国王拥有两种特殊能力，共享_10~14_回合冷却：\n对最远的敌人进行100回合的生命联结，期间双方平分伤害直到至少一方死亡；\n将最远的敌人传送至目标周围。\n\n每次受伤会减少_所受伤害/8_回合特殊能力冷却。\n两种特殊能力分别会有50%的概率使用。如果已使用了其中一种，下次使用时，未在上次使用的那一种概率提高为87.5%。\n\n矮人国王在损失_250_点生命(超出部分不计)后进入二阶段。\n\n二阶段的矮人国王会传送到王座上，获得_300_点不随时间衰减的护盾，免疫一切伤害，不进行攻击也不会使用特殊能力。\n\n这一阶段会在唤灵基座上召唤三波敌人，第一波为4个矮人尸群，第二波为3个矮人尸群和1个矮人术士或矮人武僧，第三波为2个矮人尸群、1个矮人术士和1个矮人武僧。每一波的每名敌人被击杀都会使矮人国王失去25点护盾，在失去所有护盾后进入三阶段。\n\n三阶段的矮人国王受到的所有伤害会全额转为延缓伤害，不会使用特殊能力。\n\n这一阶段会无间隔地持续召唤敌人，矮人国王死亡时，其召唤的所有敌人也会死亡。\n\n开启_绝命头目_挑战后：\n最大生命+50%(一阶段在损失_350_点生命后进入二阶段，二阶段获得_450_点不随时间衰减的护盾)；\n召唤时自召唤特效出现后_1_回合产生敌人，敌人种类随召唤次数变化，第_3的倍数_次召唤为矮人术士(黑烟)或矮人武僧(绿火)，第_9的倍数_次召唤为魔像(电光)，其他为矮人尸群(白骨)；\n一阶段的召唤间隔和特殊能力冷却变为_8~10_回合；\n二阶段召唤敌人第一波为6个矮人尸群，第二波为4个矮人尸群、1个矮人术士和1个矮人武僧，第三波为2个矮人尸群、1个矮人术士、1个矮人武僧和2个魔像；\n三阶段与原先一致，只是因为最大生命增加导致三阶段的生命更多。\n\n具有_Boss和亡灵属性_，二、三阶段定命效果不再对其拥有伤害增幅。\n\n掉落_40_经验，获得经验的最大英雄等级为_29_级。\n\n必定掉落一顶矮人国王的皇冠。

##5

custom.dict.dict.ch5 =第五区域：恶魔大厅
custom.dict.dict.ch5_d =以下是21~24层的敌人信息。\n\n从这一区域开始，英雄的视野会逐层降低，21层视野为5，22层视野为4，23层视野为3，24层视野为2，若有黑暗层或开启_没入黑暗_挑战则会进一步降低。

custom.dict.dict.mob_scorpio =巨蝎
custom.dict.dict.mob_scorpio_d =于23~24层生成。\n\n这个敌人的最大生命为_110_，视野为_6_，攻击为远程物理攻击且在近身时会远离，攻击为_30~40_，防御为_0~16_，攻击延迟为_1_，移动速度为_1_，闪避为_24_，精准为_36_。\n\n攻击时有50%的概率造成_10_回合残废。\n\n具有_恶魔属性_。\n\n掉落_14_经验，获得经验的最大英雄等级为_27_级。\n\n有50%的概率掉落一瓶随机药剂(不包括治疗和力量药剂)。

custom.dict.dict.mob_acidic =酸液巨蝎
custom.dict.dict.mob_acidic_d =有2%的概率替换巨蝎生成。\n\n这个敌人的最大生命为_110_，视野为_6_，攻击为远程物理攻击且在近身时会远离，攻击为_30~40_，防御为_0~16_，攻击延迟为_1_，移动速度为_1_，闪避为_24_，精准为_36_。\n\n攻击时有50%的概率造成_10_回合残废，必定造成_20_回合腐蚀淤泥。\n\n受到自身周围目标的攻击时，对目标造成_20_回合腐蚀淤泥。\n\n具有_酸和恶魔属性_。\n\n掉落_14_经验，获得经验的最大英雄等级为_27_级。\n\n必定掉落且只会掉落一瓶经验药剂。

custom.dict.dict.mob_eye =邪眼
custom.dict.dict.mob_eye_d =于21~24层生成。\n\n这个敌人的最大生命为_100_，视野为_6_，可远程蓄力_2_回合释放_30~50_点魔法伤害的死亡凝视而在近身时使用近战攻击，近战攻击距离为_1_，近战攻击为_20~30_，防御为_0~10_，攻击延迟为_1_，移动速度为_1_，闪避为_20_，远程精准为_60_，近战精准为_30_。\n\n死亡凝视蓄力完成后，在弹道未被阻拦且未丢失目标的情况下会直接对目标释放，否则会对目标上一回合所处的位置释放。\n\n蓄力期间受到的一切伤害都会减少75%。\n\n具有_恶魔属性_，对解离法杖、解离陷阱和死亡凝视拥有抗性。\n\n掉落_13_经验，获得经验的最大英雄等级为_26_级。\n\n必定掉落2滴露珠/一粒种子/一块符石，分别为50%，25%，25%的概率。

custom.dict.dict.mob_succubus =魅魔
custom.dict.dict.mob_succubus_d =于21~24层生成。\n\n这个敌人的最大生命为_80_，视野为_6_，攻击距离为_1_，攻击为_25~30_，防御为_0~10_，攻击延迟为_1_，移动速度为_1_，闪避为_25_，精准为_40_。\n\n攻击时有25%的概率造成_5_回合魅惑，攻击被魅惑的目标会恢复_造成伤害+5_点生命(溢出部分会转化为护盾)。\n\n已锁定目标且无法攻击到目标时，与目标进行连线并尝试闪现至连线终点那格，若连线之间有固体地形或其他生物阻挡则闪现至阻挡后的连线终点，闪现不会消耗时间(表现为闪现后可立即攻击或移动)。每个魅魔都能无限使用此能力，使用后会进入_4~6_回合冷却。\n\n处于游荡状态时，也会尝试闪现至寻路路径的终点。\n\n具有_恶魔属性_，免疫魅惑。\n\n掉落_12_经验，获得经验的最大英雄等级为_25_级。\n\n有1/3的概率掉落一张随机卷轴(不包括鉴定和升级卷轴)。

custom.dict.dict.mob_spawner =恶魔血巢
custom.dict.dict.mob_spawner_d =于21~24层固定生成一个。\n\n这个敌人的最大生命为_120_，视野为_8_，无法攻击，防御为_0~12_，闪避为_0_。\n\n在_21/22/23/24_层时，每_60/53/47/40_回合召唤一个恶魔撕裂者。每次受伤会减少_所受伤害_回合召唤间隔。\n\n大幅抑制超过20的伤害(19之后每想要造成一点伤害，需要1，2，3，4...点原始伤害)。\n\n具有_小Boss、恶魔和无法移动属性_，免疫麻痹、狂乱、眩晕、催眠、魔法睡眠、恐惧和魂飞魄散。\n\n掉落_15_经验，获得经验的最大英雄等级为_29_级。\n\n必定掉落一瓶治疗药剂。

custom.dict.dict.mob_ripper =恶魔撕裂者
custom.dict.dict.mob_ripper_d =于21~24层通过恶魔血巢召唤产生。\n\n这个敌人的最大生命为_60_，视野为_6_，攻击距离为_1_，攻击为_15~25_，防御为_0~4_，攻击延迟为_0.5_，移动速度为_1_，闪避为_22_，精准为_30_。\n\n与已锁定的目标相距大于等于1格且无法攻击到目标时，根据弹道选取目标上一回合所处地格与下一回合所处地格连线后的下一地格进行预警，预警结束后花费1回合跳跃到预警位置，若预警位置有目标则弹开至距离跳跃前最近的一格并对目标造成原始值为_护甲结算前伤害75%_的流血。每个恶魔撕裂者都能无限使用此能力，使用后会进入_2~4_回合冷却。\n\n具有_恶魔和亡灵属性_。\n\n掉落_9_经验，获得经验的最大英雄等级为_-2_级。

custom.dict.dict.ch5_div =第五区域Boss
custom.dict.dict.ch5_div_d =第25层的第五个Boss——Yog-Dzewa。本层英雄的视野为4，战斗分五个阶段，在一个十分巨大的房间进行，房间中央是一个9x9的方形高台。\n\nYog-Dzewa无法进行攻击，但会发射只能伤害英雄及其盟友的激光以及召唤敌人。\n\n_前三阶段：_\n\nYog-Dzewa每_10~15_回合会向英雄发射一条_20~30_点魔法伤害的激光(发射前会有1回合路径预警)，若英雄被缠绕则会在英雄解除缠绕后的下一回合再发射。\n\nYog-Dzewa每_10~15_回合召唤一个敌人，每召唤_4_个敌人为一个循环，初次循环召唤顺序会被打乱，后续循环按初次循环的召唤顺序进行召唤。未打乱的召唤顺序：1-古神幼虫，2-古神幼虫，3-古神幼虫，4-古神幼虫。每有一个恶魔血巢未被摧毁，就会从4至1逐个替换为恶魔撕裂者。\n\nYog-Dzewa每损失_300_点生命(超出部分不计)就会使英雄视野-1(最低为1)并召唤一个古神之拳：\n从燃烧&大地、腐烂&锈蚀、辉耀&暗影三组中随机抽取一组，再从抽取的一组中随机一个，已抽取的组后续不再抽取，意味着一组拳头只能出现其中一个。\n\n古神之拳在9x9方形高台范围内免疫一切伤害，古神之拳存在时Yog-Dzewa也会免疫一切伤害但召唤间隔会增加_10_回合。\n\n古神之拳死亡后Yog-Dzewa才会进入下一阶段，同时永久减少_1_回合召唤间隔。\n\n_四阶段：_\n\n在三阶段结束后立即执行，召唤间隔瞬间变为_-15_回合，此时每召唤一个敌人就会增加_7~12_回合，因而允许一次召唤多个敌人，召唤后进入五阶段。\n\n_五阶段：_\n\nYog-Dzewa的激光间隔变为_2_回合，召唤间隔变为_3_回合，其余与前三阶段一致。\n\n无论何种阶段，Yog-Dzewa每损失_400_点生命就会使发射的激光条数+1(最多为3条，但若预警时英雄周围没有能躲过激光的空间，则此次发射的激光条数-1)。每次受伤会减少_所受伤害/10_回合激光间隔和召唤间隔。\n\n开启_绝命头目_挑战后：\n每次召唤古神之拳变为随机抽取两组，两组中每组随机抽取一个，最终一次召唤2个古神之拳，后续召唤再抽取时抽到抽过的组会直接抽取此组未被抽取的拳头，已被抽完的组不再抽取；\n激光造成的魔法伤害变为_32~48_；\n每召唤_6_个敌人为一个循环，初次循环召唤顺序会被打乱，后续循环按初次循环的召唤顺序进行召唤。未打乱的召唤顺序：1-古神幼虫，2-古神幼虫，3-古神幼虫，4-古神幼虫，5-恶魔撕裂者，6-恶魔撕裂者。每有一个恶魔血巢未被摧毁，就会从4至1逐个替换为邪眼或巨蝎(二者在召唤时均为50%概率，并且每个循环召唤的邪眼和巨蝎至多为2只)。\n\n击杀后获得5000排行榜Boss战分数，21~24层每有一个恶魔血巢存活+1250分，英雄每次受到本体的激光攻击-500分。

custom.dict.dict.mob_yog =Yog-Dzewa
custom.dict.dict.mob_yog_d =于第25层作为第五区域的Boss出现。\n\n这个敌人的最大生命为_1000_，视野为_12_，无法攻击，防御为_0_，闪避为_0_。\n\n前三阶段的Yog-Dzewa每_10~15_回合会向英雄发射一条_20~30_点魔法伤害的激光(发射前会有1回合路径预警)，若英雄被缠绕则会在英雄解除缠绕后的下一回合再发射。\n\nYog-Dzewa每_10~15_回合召唤一个敌人，每召唤_4_个敌人为一个循环，初次循环召唤顺序会被打乱，后续循环按初次循环的召唤顺序进行召唤。未打乱的召唤顺序：1-古神幼虫，2-古神幼虫，3-古神幼虫，4-古神幼虫。每有一个恶魔血巢未被摧毁，就会从4至1逐个替换为恶魔撕裂者。\n\nYog-Dzewa每损失_300_点生命(超出部分不计)就会使英雄视野-1(最低为1)并召唤一个古神之拳：\n从燃烧&大地、腐烂&锈蚀、辉耀&暗影三组中随机抽取一组，再从抽取的一组中随机一个，已抽取的组后续不再抽取，意味着一组拳头只能出现其中一个。\n\n古神之拳在9x9方形高台范围内免疫一切伤害，古神之拳存在时Yog-Dzewa也会免疫一切伤害但召唤间隔会增加_10_回合。\n\n古神之拳死亡后Yog-Dzewa才会进入下一阶段，同时永久减少_1_回合召唤间隔。\n\n四阶段会在三阶段结束后立即执行，召唤间隔瞬间变为_-15_回合，此时每召唤一个敌人就会增加_7~12_回合，因而允许一次召唤多个敌人，召唤后进入五阶段。\n\n五阶段的Yog-Dzewa的激光间隔变为_2_回合，召唤间隔变为_3_回合，其余与前三阶段一致。\n\n无论何种阶段，Yog-Dzewa每损失_400_点生命就会使发射的激光条数+1(最多为3条，但若预警时英雄周围没有能躲过激光的空间，则此次发射的激光条数-1)。每次受伤会减少_所受伤害/10_回合激光间隔和召唤间隔。\n\n开启_绝命头目_挑战后：\n每次召唤古神之拳变为随机抽取两组，两组中每组随机抽取一个，最终一次召唤2个古神之拳，后续召唤再抽取时抽到抽过的组会直接抽取此组未被抽取的拳头，已被抽完的组不再抽取；\n激光造成的魔法伤害变为_32~48_；\n每召唤_6_个敌人为一个循环，初次循环召唤顺序会被打乱，后续循环按初次循环的召唤顺序进行召唤。未打乱的召唤顺序：1-古神幼虫，2-古神幼虫，3-古神幼虫，4-古神幼虫，5-恶魔撕裂者，6-恶魔撕裂者。每有一个恶魔血巢未被摧毁，就会从4至1逐个替换为邪眼或巨蝎(二者在召唤时均为50%概率)。\n\n具有_Boss、恶魔和无法移动属性_，免疫恐惧、狂乱、魅惑、催眠和魔法睡眠。\n\n掉落_50_经验，获得经验的最大英雄等级为_29_级。

custom.dict.dict.mob_larva =古神幼虫
custom.dict.dict.mob_larva_d =由Yog-Dzewa召唤产生。\n\n这个敌人的最大生命为_20_，视野为_6_，攻击距离为_1_，攻击为_15~25_，防御为_0~4_，攻击延迟为_1_，移动速度为_1_，闪避为_12_，精准为_30_。\n\n具有_恶魔属性_。\n\n掉落_5_经验，获得经验的最大英雄等级为_-2_级。

custom.dict.dict.mob_fist1 =燃烧之拳&大地之拳
custom.dict.dict.mob_fist1_d =由Yog-Dzewa召唤产生，召唤时这两个拳头会随机出现其中一个。\n\n_燃烧之拳：_\n这个敌人的最大生命为_300_，视野为_6_，攻击距离为_1_，攻击为_18~36_，防御为_0~15_，攻击延迟为_1_，移动速度为_1_，闪避为_20_，精准为_36_。\n\n未锁定目标时会默认往英雄方向游荡。\n\n与已锁定的目标相距大于等于1格时，每_8~12_回合远程释放一次不会直接造成伤害的特殊攻击，使目标所处地格的水被蒸发并产生3x3范围持续_4_回合的火焰(水上不会产生)。\n\n会不断蒸发自身周围一圈的水(每回合蒸发1，2，3格的概率均为1/3)，同时在自身周围一圈不断产生持续_4_回合的火焰(水上不会产生)。\n\n具有_Boss、火和恶魔属性_，免疫冻结。\n\n掉落_25_经验，获得经验的最大英雄等级为_-2_级。\n\n_大地之拳：_\n这个敌人的最大生命为_300_，视野为_6_，攻击距离为_1_，攻击为_18~36_，防御为_0~15_，攻击延迟为_1_，移动速度为_1_，闪避为_20_，精准为_36_。\n\n未锁定目标时会默认往英雄方向游荡。\n\n与已锁定的目标相距大于等于1格时，每_8~12_回合远程释放一次不会直接造成伤害的特殊攻击，使目标周围3x3范围的地格变为草地并有概率长出枯草(长出1，2，3格的概率均为1/3)，同时造成_3_回合缠绕。\n\n自身周围的地格会不断变为草地并有概率长出枯草(长出1，2，3格的概率均为1/3)，同时自身周围每有一株枯草(高草也行)就会获得1/6伤害减免(线性减少)。\n\n具有_Boss和恶魔属性_，免疫燃烧伤害。\n\n掉落_25_经验，获得经验的最大英雄等级为_-2_级。

custom.dict.dict.mob_fist2 =腐烂之拳&锈蚀之拳
custom.dict.dict.mob_fist2_d =由Yog-Dzewa召唤产生，召唤时这两个拳头会随机出现其中一个。\n\n_腐烂之拳：_\n这个敌人的最大生命为_300_，视野为_6_，攻击距离为_1_，攻击为_18~36_，防御为_0~15_，攻击延迟为_1_，移动速度为_1_，闪避为_20_，精准为_36_。\n\n未锁定目标时会默认往英雄方向游荡。\n\n攻击时有50%的概率造成20回合腐蚀淤泥。\n\n与已锁定的目标相距大于等于1格时，每_8~12_回合远程释放一次不会直接造成伤害的特殊攻击，使目标所处地格产生100单位的毒气。\n\n在水中时，每回合回复6点生命，受到的所有伤害会转为原始值为_所受伤害60%_的不可叠加的流血。\n\n具有_Boss、酸和恶魔属性_，免疫毒气。\n\n掉落_25_经验，获得经验的最大英雄等级为_-2_级。\n\n_锈蚀之拳：_\n这个敌人的最大生命为_300_，视野为_6_，攻击距离为_1_，攻击为_22~44_，防御为_0~15_，攻击延迟为_1_，移动速度为_1_，闪避为_20_，精准为_36_。\n\n未锁定目标时会默认往英雄方向游荡。\n\n与已锁定的目标相距大于等于1格时，每_8~12_回合远程释放一次不会直接造成伤害的特殊攻击，对目标造成_4_回合残废。\n\n受到的所有伤害会全额转为延缓伤害。\n\n具有_Boss、恶魔和巨型属性_。\n\n掉落_25_经验，获得经验的最大英雄等级为_-2_级。

custom.dict.dict.mob_fist3 =辉耀之拳&暗影之拳
custom.dict.dict.mob_fist3_d =由Yog-Dzewa召唤产生，召唤时这两个拳头会随机出现其中一个。\n\n_辉耀之拳：_\n这个敌人的最大生命为_300_，视野为_6_，可远程发射光束造成_10~20_点魔法伤害而在近身时使用近战攻击，近战攻击距离为_1_，近战攻击为_18~36_，防御为_0~15_，攻击延迟为_1_，移动速度为_1_，闪避为_20_，远程精准为_72_，近战精准为_36_。\n\n未锁定目标时会默认往英雄方向游荡。\n\n远程攻击造成_5_回合失明。\n\n当前生命小于等于最大生命的一半(若单次受伤不直接秒杀，则在_150_点生命锁定一次)时进行随机传送并对目标造成_15_回合失明，死亡时则造成_30_回合的失明。\n\n具有_Boss、电和恶魔属性_。\n\n掉落_25_经验，获得经验的最大英雄等级为_-2_级。\n\n_暗影之拳：_\n这个敌人的最大生命为_300_，视野为_6_，可远程发射射弹造成_10~20_点魔法伤害而在近身时使用近战攻击，近战攻击距离为_1_，近战攻击为_18~36_，防御为_0~15_，攻击延迟为_1_，移动速度为_1_，闪避为_20_，远程精准为_72_，近战精准为_36_。\n\n未锁定目标时会默认往英雄方向游荡。\n\n远程攻击会使目标的发光效果减少_50_回合持续时间。\n\n当前生命小于等于最大生命的一半(若单次受伤不直接秒杀，则在_150_点生命锁定一次)时进行随机传送并清除目标的发光效果，死亡时再清除一次。\n\n具有_Boss和恶魔属性_。\n\n掉落_25_经验，获得经验的最大英雄等级为_-2_级。

custom.dict.dict.chn = 广谱生物与NPC
custom.dict.dict.chn_d = 以下是出现不限楼层的生物与各NPC。

##all
custom.dict.dict.mob_bee =金色蜜蜂
custom.dict.dict.mob_bee_d =通常在隐藏的蜜蜂房生成并伴有一个破碎蜂蜜罐，在蜂蜜罐破裂后也会产生一只。\n\n这个敌人的最大生命为_(2+楼层数)*4_，视野为_4_，攻击距离为_1_，攻击为_最大生命/10~最大生命/4_，防御为_0_，攻击延迟为_1_，移动速度为_1_，闪避为_9+楼层数_，精准为_9+楼层数_。\n\n只能在破碎蜂蜜罐周围3格内活动，靠近破碎蜂蜜罐的任何生物均会被其锁定。\n\n对其扔出圣愈蜜药可永久转化为盟友并能跟随英雄下楼，与楼层数相关的属性固定为生成时的楼层数。\n\n掉落_0_经验，获得经验的最大英雄等级为_29_级。

custom.dict.dict.mob_mimic =宝箱怪
custom.dict.dict.mob_mimic_d =20%的宝箱会被替换为宝箱怪，在上锁的宝箱房间中的宝箱单独有20%的概率替换为宝箱怪(并且该层有魔能触媒生成时会优先塞入该房间的宝箱怪中)。\n\n这个敌人的最大生命为_(1+楼层数)*6_，视野为_8_，攻击距离为_1_，攻击为_1+楼层数~2+2*楼层数_，防御为_0~1+楼层数/2_，攻击延迟为_1_，移动速度为_1_，闪避为_2+楼层数/2_，精准为_6+楼层数_。\n\n开箱时的攻击拥有无限精准(可被无限闪避效果闪避)，并会造成最大伤害。\n\n具有_恶魔属性_。\n\n掉落_0_经验，获得经验的最大英雄等级为_29_级。\n\n除了掉落原本应装在宝箱中的物品外，额外掉落一堆金币/一件随机武器/一组随机投掷武器/一件随机护甲/一枚随机戒指，概率均为20%。

custom.dict.dict.mob_mimic_golden =黄金宝箱怪
custom.dict.dict.mob_mimic_golden_d =10%的黄金宝箱会被替换为黄金宝箱怪。\n\n以楼层数计算的属性是普通宝箱怪的_1.33_倍，其余属性及特性与普通宝箱怪一致。\n\n具有_恶魔属性_。\n\n掉落_0_经验，获得经验的最大英雄等级为_29_级。\n\n掉落与普通宝箱怪一致，并且掉落的装备(包括投掷武器和法杖)必定没有诅咒，如果掉落的装备不是神器且等级为0则有50%的概率升一级。

custom.dict.dict.mob_mimic_crystal =水晶宝箱怪
custom.dict.dict.mob_mimic_crystal_d =10%的水晶宝箱会被替换为水晶宝箱怪。\n\n属性及特性与普通宝箱怪基本一致，但在激活时会获得_2_回合极速并开始逃跑。\n\n开箱时的攻击会随机吃掉英雄背包内的一件物品(无法吃掉装备着的物品、包裹内的物品、英雄的特殊物品和具有贵重属性的物品)，随机到无法吃掉的物品则继续随机(总共随机10次)直到吃掉能吃的物品。不管有没有吃掉物品，之后都会获得_2_回合极速并开始逃跑，若路径被堵死无法逃跑则会恼羞成怒攻击目标并将目标传送至自身周围随机一格(不会是原位置)。\n\n逃跑过程中从英雄视野内脱离且与英雄的距离大于等于6格时直接消失，吃掉的物品也会因此消失不见。\n\n想要拿回被吃掉的物品就得尽快将其击杀，当然部分物品可能会在其逃跑的过程中发生变化：蜂蜜罐会在被吃掉的瞬间直接破裂。\n\n具有_恶魔属性_。\n\n掉落_0_经验，获得经验的最大英雄等级为_29_级。\n\n只会掉落原本应装在水晶宝箱中的装备，掉落的装备必定没有诅咒。


custom.dict.dict.mob_fish =巨型食人鱼
custom.dict.dict.mob_fish_d =通常在鱼房生成。\n\n这个敌人的最大生命为_10+楼层数*5_，视野为_8_，攻击距离为_1_，攻击为_楼层数~4+楼层数*2_，防御为_0~楼层数_，攻击延迟为_1_，移动速度为_2_，闪避为_10+楼层数*2_，精准为_20+楼层数*2_。\n\n离开水或获得飘浮效果时立即死亡。\n\n免疫所有气体。\n\n掉落_0_经验，获得经验的最大英雄等级为_29_级。\n\n必定掉落一块神秘的肉。

custom.dict.dict.mob_statue =活化石像
custom.dict.dict.mob_statue_d =通常在上锁的石像房生成。\n\n这个敌人的最大生命为_15+楼层数*5_，视野为_8_，攻击距离、攻击及攻击延迟视手中武器而定，防御为_手中武器防御+0~楼层数_，移动速度为_1_，闪避为_4+楼层数_，精准为_手中武器精准修正*(4+楼层数)_。\n\n缴械陷阱可将其秒杀。\n\n具有_非生物属性_，对死神附魔拥有抗性。\n\n掉落_0_经验，获得经验的最大英雄等级为_29_级。\n\n必定掉落手中武器，手中武器必定拥有正面附魔，有5%的概率+2，20%的概率+1，75%的概率+0。

custom.dict.dict.mob_armored_statue =装甲石像
custom.dict.dict.mob_armored_statue_d =有10%的概率替换活化石像生成。\n\n这个敌人的最大生命为_30+楼层数*10_，视野为_8_，攻击距离、攻击及攻击延迟视手中武器而定，防御为_手中武器防御+身着护甲防御+0~楼层数_，移动速度为_1_(受护甲刻印影响)，闪避为_4+楼层数_(身着护甲拥有磐岩刻印则为_0_)，精准为_手中武器精准修正*(4+楼层数)_。\n\n缴械陷阱可将其秒杀。\n\n具有_非生物属性_，对死神附魔拥有抗性。\n\n掉落_0_经验，获得经验的最大英雄等级为_29_级。\n\n必定掉落手中武器和身着护甲，手中武器和身着护甲必定拥有正面附魔和正面刻印，都有5%的概率+2，20%的概率+1，75%的概率+0。

custom.dict.dict.mob_wraith =怨灵
custom.dict.dict.mob_wraith_d =通常在挖坟、挖遗骸时生成。\n\n这个敌人的最大生命为_1_，视野为_8_，攻击距离为_1_，攻击为_1+楼层数/2~2+楼层数_，攻击延迟为_1_，移动速度为_1_，闪避为_精准*5_，精准为_10+楼层数_。\n\n具有_亡灵属性_。\n\n掉落_0_经验，获得经验的最大英雄等级为_29_级。

custom.dict.dict.mob_blacksmith =巨魔铁匠
custom.dict.dict.mob_blacksmith_d =于12~14层生成，生成的房间内有大量烈焰陷阱、通往任务层的楼梯和一些随机武器、投掷武器、护甲的生成。\n\n点击巨魔铁匠与其对话会得到镐子，随后可以通过巨魔铁匠房间内的楼梯下到任务层。\n\n任务层会生成1个巨型房间、3个大型房间、6~8个小型房间和2个包含4~5块暗金矿的隐藏房间(水晶层为晶洞，豺狼层为宝箱)，总共生成45~47块暗金矿，每块可换取50人情，最多可换取2000人情(也就是40块)。\n\n背包中拥有镐子时，点击巨魔铁匠任务层带有暗金矿的墙壁，可将其敲碎并获得一块暗金矿。同时尝试攻击水晶尖塔或打破豺狼地卜师的磐岩护盾都只需要镐子在背包中即可，无需装备。\n\n尝试敲碎不包含暗金矿的墙壁时，同样只花费1回合但会消耗4点饱食度。\n\n任务层固定150回合的敌人生成间隔，敌人生成上限比普通层更低1名。\n\n在任务层，因为可以通过镐子自由出入，所以虚空锁链允许英雄直接进入完全封闭的房间。\n\n每局游戏只能进入一次任务层，上楼梯出任务层视为任务结束。\n\n任务结束后会结算人情，挖矿人情=挖到的暗金矿数量*50，上限2000，如果击败了任务层Boss则额外增加1000人情。同时铁匠会收回镐子，但是保留它的所有属性(即使是诅咒)，以便之后英雄用人情换取镐子时原封不动地归还。\n\n以下为人情奖励：\n花费_250人情_可以获取之前那把镐子，如果结算人情超过2500则改为不消耗人情免费获取。\n花费_500人情_可以进行重铸，融合两件一样的已鉴定且未诅咒的装备，使最高等级的那件+1等级(等级相同则为左边那件+1等级)，并且不会消除原有附魔/刻印、强化等属性。重铸过一次后，下次重铸所需的人情+1000。\n花费_500人情_可以硬化一件已鉴定且未诅咒的武器/护甲，硬化后的装备在用升级卷轴升级时，正面附魔/刻印开始概率被消除的等级范围从4~8级提升至6~10级，若依旧被消除则失去硬化效果以抵挡一次消除。硬化过一次后，下次硬化所需的人情+1000。\n花费_1000人情_可以升级一件可升级的已鉴定且未诅咒的0~1级装备，使其等级+1。升级过一次后，下次升级所需的人情+1000。\n花费_2000人情_可以进行锻造，能从两件不同且已鉴定的武器、一组已鉴定的投掷武器和一件已鉴定的护甲中选择其中一个带走。这些装备是0~3级的概率分别为：30%，45%，20%，5%。这些装备有30%的概率拥有正面附魔/刻印。\n花费_全部人情_可以获取等量金币。\n\n完成任务后获得3000排行榜任务分数，拥有以下扣分条件：\n英雄每少挖一块暗金矿-50分；\n英雄未击败任务Boss-1000分；\n_巨魔铁匠任务-水晶层：_\n英雄在距离水晶尖塔大于等于9格且水晶尖塔满血的情况下每次被水晶守卫攻击-100分，英雄每次被水晶尖塔的特殊攻击击中-100分；\n_巨魔铁匠任务-豺狼层：_\n英雄每次被豺狼工兵或豺狼地卜师的落石能力与丢出的岩砾击中-100分。

custom.dict.dict.mob_ghost =悲伤幽灵
custom.dict.dict.mob_ghost_d =于2~4层生成，必定生成在下楼楼梯口所处的房间。\n\n在2、3、4层的任务分别对应击杀腐臭老鼠、豺狼诡术师、巨钳螃蟹，完成任务可选择一件已鉴定且未诅咒的0~3级的2~5阶随机武器或护甲作为任务奖励(同种子的武器和护甲奖励等级相同)。\n\n0~3级的概率分别为50%，30%，15%，5%。\n\n2~5阶的概率分别为：50%，30%，15%，5%。\n\n完成任务后获得1000排行榜任务分数，拥有以下扣分条件：\n_悲伤幽灵任务-腐臭老鼠：_\n英雄每次被腐臭老鼠攻击触发腐蚀淤泥且不在水中-50分，英雄每次被腐臭气体(无论任何来源，如混沌香炉)麻痹-100分；\n_悲伤幽灵任务-豺狼诡术师：_\n豺狼诡术师连击数大于1时(迫使其移动即可打断连击)，攻击任何角色-50分；\n_悲伤幽灵任务-巨钳螃蟹：_\n巨钳螃蟹格挡任何角色攻击-50分。

custom.dict.dict.mob_imp =野心勃勃的小恶魔
custom.dict.dict.mob_imp_d =于17~19层生成。\n\n在17、18、19层的任务分别对应击杀5个矮人武僧、50%概率5个矮人武僧50%概率4个魔像、4个魔像，在获得了对应数量的矮人徽记后即可提交任务，完成任务会奖励一枚2~4级的诅咒的随机戒指，此后它会在20层摆摊(还需击杀矮人国王才会摆摊)。\n\n2~4级的概率分别为：2/3，4/15，1/15。\n\n完成任务后获得4000排行榜任务分数，暂无扣分条件。

custom.dict.dict.mob_image =镜像
custom.dict.dict.mob_image_d =通常由镜像卷轴产生两个。\n\n只有_1_点生命且没有防御，精准和闪避与英雄一致，造成的伤害为英雄的一半，攻击继承武器的特性和附魔但不享受附魔加成。\n\n免疫毒气、火焰、腐蚀酸雾和腐化。

custom.dict.dict.mob_pris_image =虹光幻像
custom.dict.dict.mob_pris_image_d =通常由虹卫秘卷产生一个。\n\n在英雄被视野内的敌人锁定时会出现，视野内无敌人锁定英雄时则消失变为虹光守卫效果，效果期间幻像每10回合回复1点生命。\n\n幻像继承了英雄的所有防御(包括树肤)、精准和闪避，护甲特性和刻印也被一并继承但不享受刻印加成，同时拥有_10+英雄等级*2.5_点生命和_2+英雄等级/4~4+英雄等级/2_点攻击。\n\n幻像生命为0后的5回合内仍会存在，期间无法行动，也不会被敌人选中，但可被治疗。\n\n幻像存在时再次阅读虹卫秘卷将会为其回复所有生命。\n\n免疫毒气、火焰、腐蚀酸雾和腐化。

custom.dict.dict.mob_wandmaker =老杖匠
custom.dict.dict.mob_wandmaker_d =于7~9层生成，必定生成在上楼楼梯口所处的房间。\n\n三种任务随机，分别需要提交元素余烬、腐莓之种、尸尘，完成任务可从两根已鉴定且未诅咒的1~3级的随机法杖中二选一作为任务奖励。\n\n1~3级的概率分别为：2/3，4/15，1/15。\n\n完成任务后获得2000排行榜任务分数，拥有以下扣分条件：\n_老杖匠任务-元素余烬：_\n英雄每次被新生火焰元素的蓄力攻击喷到-200分；\n_老杖匠任务-腐莓之种：_\n英雄每次被腐莓触手攻击-100分；\n_老杖匠任务-尸尘：_\n尸尘召唤的每只怨灵在第二和第三下攻击都会-100分。

custom.dict.dict.mob_ratking = 鼠王
custom.dict.dict.mob_ratking_d = 于5层生成，必定生成在隐藏的鼠王藏宝库中，内有大量宝箱，开启可获得金币。\n\n此外还会有1%的概率通过非5层的重构陷阱生成鼠王，如果本层已有鼠王则触发重构陷阱尝试生成鼠王时只会将鼠王传送过去，生成后它会往英雄视野外的方向移动并最终消失。\n\n可将矮人国王的皇冠交给它以获得护甲技能_鼠化术_。\n\n每年的愚人节4.1同时是鼠王的生日，它会因此佩戴绿色的王冠。

custom.dict.dict.mob_sheep = 魔法绵羊
custom.dict.dict.mob_sheep_d =通常由羊群陷阱生成，持续6回合。\n\n若持续时间超过20回合(如绵绵炸弹产生的魔法绵羊)可通过互动使其立即消失。

custom.dict.dict.mob_red_sentry = 血色哨卫
custom.dict.dict.mob_red_sentry_d= 通常在哨卫房生成。\n\n这个敌人的最大生命为_1_，视野为_8_，蓄力_1_回合后每回合都会远程发射_2+楼层数/2~4+楼层数_点魔法伤害的激光，防御为_0_，拥有无限闪避，精准为_20+楼层数*2_。\n\n在英雄踏上哨卫房的特殊地板时进行锁定并开始蓄力，会无视英雄的隐形效果，踏出特殊地板后停止锁定和蓄力。\n\n免疫一切伤害和减益效果。\n\n掉落_0_经验，获得经验的最大英雄等级为_29_级。

custom.dict.dict.mob_tormented_spirit =咒缚灵
custom.dict.dict.mob_tormented_spirit_d =有1%的概率替换怨灵生成。\n\n这个敌人的最大生命为_1_，视野为_8_，攻击距离为_1_，攻击为_1+1.5*楼层数/2~2+1.5*楼层数_，攻击延迟为_1_，移动速度为_1_，闪避为_精准*5_，精准为_10+1.5*楼层数_。\n\n在其周围阅读祛邪卷轴时，祛邪卷轴的效果会替换为消耗卷轴净化咒缚灵同时清除英雄拥有的降级效果。\n\n具有_亡灵属性_。\n\n掉落_0_经验，获得经验的最大英雄等级为_29_级。\n\n通过祛邪卷轴净化后，必定掉落一件拥有正面附魔的随机武器或拥有正面刻印的随机护甲，如果掉落的装备等级为0则有50%的概率升一级。

custom.dict.dict.mob_phantom_piranha =幻影食人鱼
custom.dict.dict.mob_phantom_piranha_d =有2%的概率替换巨型食人鱼生成。\n\n这个敌人的最大生命为_10+楼层数*5_，视野为_8_，攻击距离为_1_，攻击为_楼层数~4+楼层数*2_，防御为_0~楼层数_，攻击延迟为_1_，移动速度为_2_，闪避为_10+楼层数*2_，精准为_20+楼层数*2_。\n\n对非周围一圈生物攻击的一切伤害(包括卷轴、炸弹等)拥有50%伤害减免，受到来自角色的伤害且不与角色相邻时会尝试传送到角色周围的水中，否则随机传送至同层的任意一格水中(优先传送至英雄视野外的水中)。\n\n尝试将其弄上岸也会在离水的瞬间进行传送，但在被直接弄下深渊时不会进行传送(没法用冲击波法杖做到这一点，因为会造成伤害导致直接传送)。\n\n离开水(前提是本层的所有水中都有生物导致无法传送)或获得飘浮效果时立即死亡。\n\n免疫所有气体。\n\n掉落_0_经验，获得经验的最大英雄等级为_29_级。\n\n必定掉落一块幻影鱼肉。

custom.dict.dict.mob_crystal_spire =水晶尖塔
custom.dict.dict.mob_crystal_spire_d =于巨魔铁匠任务的水晶层作为Boss出现。\n\n这个敌人的最大生命为_300_，视野为_8_，无法攻击，防御为_0_，闪避为_0_。\n\n背包内有镐子时才可通过镐子对其造成伤害。\n\n初始未激活，受到1次攻击后警告，受到3次攻击后激活，激活后吸引本层所有水晶灵簇和水晶守卫使它们以英雄为方向进行游荡，同时对沉睡的水晶守卫造成_20-与尖塔相距距离_回合麻痹，对于游荡的水晶守卫则给予_(与尖塔相距距离-8)/2_回合极速。\n\n水晶尖塔拥有两种特殊能力，共享_15_回合冷却(激活后的第一次使用为_1_回合冷却，看不到英雄则不会进入冷却)：\n产生十字型或直线型的预警，预警后的下一回合在预警位置产生水晶尖刺，对除水晶灵簇以外的角色造成_6~15_点无视护甲的伤害并往远离水晶尖塔的方向击退1格，对于水晶守卫则造成_18~27_点伤害和_30_回合残废并往远离英雄的方向击退1格。\n\n每次受伤会减少_所受伤害/10_回合特殊能力冷却。\n十字型以英雄为起点，范围为英雄及其上下左右各一格。直线型以自身周围一格为起点，范围为以英雄为方向的7格。两种特殊能力分别会有50%的概率使用。\n\n每损失_100_点生命就会使特殊能力的使用增加_1_回合，特殊能力的范围会因此扩大1圈(十字型扩为菱形，直线型扩为柱形)。\n\n死亡时，对拥有自身位置视野的所有水晶灵簇造成_5_回合失明，对于水晶守卫则造成_最大生命_点无视护甲的伤害。\n\n具有_Boss、非生物和无法移动属性_，免疫一切效果。\n\n掉落_20_经验，获得经验的最大英雄等级为_29_级。\n\n击败后获得1000人情。


custom.dict.dict.mob_crystal_guardian =水晶守卫
custom.dict.dict.mob_crystal_guardian_d =于巨魔铁匠任务的水晶层生成3个，此后不再自然生成。\n\n这个敌人的最大生命为_100_，视野为_8_，攻击距离为_1_，攻击为_10~16_，防御为_0~10_，攻击延迟为_1_，移动速度为_1_，闪避为_14_，精准为_20_。\n\n无法寻路到视野内的目标则始终保持沉睡。\n\n移动能够破坏水晶尖刺(但会尽量不这么做)，与固体地形相邻时移动速度降低为_0.25_。\n\n受到致死伤害后生命锁定为_1_点并进入倒地状态，清除除定命和残废以外的效果，期间每回合恢复5点生命，闪避降低为_0_，只有英雄和水晶尖塔能够继续造成伤害但始终不会致死，无法行动直到生命回满。\n\n具有_小Boss和非生物属性_。\n\n掉落_10_经验，获得经验的最大英雄等级为_-2_级。


custom.dict.dict.mob_crystal_wisp =水晶灵簇
custom.dict.dict.mob_crystal_wisp_d =于巨魔铁匠任务的水晶层生成。\n\n这个敌人的最大生命为_30_，视野为_8_，可远程发射光束造成_5~10_点魔法伤害而在近身时使用近战攻击，近战攻击距离为_1_，近战攻击为_5~10_，防御为_0~5_，攻击延迟为_1_，移动速度为_1_，闪避为_16_，远程精准为_36_，近战精准为_18_。\n\n移动可通过水晶尖刺而不破坏，但发射的光束无法穿过水晶尖刺。\n\n具有_非生物属性_。\n\n掉落_7_经验，获得经验的最大英雄等级为_-2_级。


custom.dict.dict.mob_gnoll_geomancer=豺狼地卜师
custom.dict.dict.mob_gnoll_geomancer_d =于巨魔铁匠任务的豺狼层作为Boss出现。\n\n这个敌人的最大生命为_150_，视野为_12_，无法攻击，防御为_0~6_，闪避为_0_。\n\n背包内有镐子时才可通过镐子打破它的磐岩护盾，破盾后的多余伤害不计。\n\n初始为沉睡，拥有_50_点磐岩护盾，始终记录本层3只豺狼工兵的生成点，受到1次攻击后警告，受到3次攻击后苏醒，使本层所有豺狼工兵及其伙伴强制锁定英雄，没有伙伴的豺狼守卫则使它们以英雄为方向进行游荡。\n\n豺狼地卜师拥有两种特殊能力(与豺狼工兵的两种特殊能力大致相同)，共享_3~5_回合冷却(每次突进后的第一次使用为_1_回合冷却，看不到英雄则不会进入冷却)：\n选取视野内的随机一块岩砾向目标丢出(丢出前会有1回合路径预警)，造成_6~12_点无视护甲的伤害并施加_3_回合麻痹(豺狼守卫为_10_回合)；\n以目标为中心产生5x5范围的随机落石预警。\n\n每次受伤会减少_所受伤害/10_回合特殊能力冷却，与英雄相距距离大于2格或拥有伙伴时每回合额外减少_1_回合特殊能力冷却(英雄拥有麻痹则不会额外减少)。\n两种特殊能力分别会有50%的概率使用。如果已使用了落石能力，下次使用时必定为丢石能力。\n若目标周围一圈有岩砾或上楼楼梯口，或者目标处于路障周围一圈的位置，特殊能力的冷却结束时同样必定使用丢石能力。\n若实在无石可丢，则必定使用落石能力。\n\n落石预警产生时，会选取目标周围其中一格地格为安全位置，若安全位置为固体地形或陷阱则有80%的概率重新选取，为使用者(豺狼地卜师和豺狼工兵)则必定重新选取，其余非安全位置选取必定不会选取使用者。预警后的下一回合在预警位置产生落石，造成_6~12_点无视护甲的伤害并施加_3_回合麻痹(豺狼守卫为_10_回合)，同时会在范围内的每格(不包括上楼楼梯口及周围一圈的地格)以1/3的概率产生一块岩砾。路障周围一圈的地格不受该能力影响。\n\n每损失_50_点生命就进入下一阶段，苏醒或转阶段时获得_25_点磐岩护盾并往已记录的最近的豺狼工兵生成点突进最多12格，同时使下次特殊能力的冷却变为_1_回合。\n\n突进后，生成点周围3格内存在豺狼工兵时会解除其与豺狼守卫的伙伴关系并与其作为伙伴，拥有伙伴时免疫一切伤害(以落石特效显示)。\n\n突进影响范围为_取移动弹道的所有点为中心、形状为旋转45度且对角线长为7格的正方形_覆盖的所有格子。范围内的所有墙体会被破坏(暗金矿会因此掉落)并有2/3的概率变为空地格，否则变为岩砾。而范围外圈的所有空地格都会变为岩砾。\n\n每次转阶段后，豺狼地卜师的丢石能力所能丢出的岩砾数量+1，落石能力的预警范围扩大2圈。\n\n具有_Boss和无法移动属性_，免疫自身所有特殊能力，沉睡时免疫一切效果。\n\n掉落_20_经验，获得经验的最大英雄等级为_29_级。\n\n击败后获得1000人情。




custom.dict.dict.mob_gnoll_guard =豺狼守卫
custom.dict.dict.mob_gnoll_guard_d =于巨魔铁匠任务的豺狼层生成。\n\n这个敌人的最大生命为_35_，视野为_8_，攻击距离为_2_，不相邻时攻击为_16~22_，相邻时攻击为_6~12_，防御为_0~6_，攻击延迟为_1_，移动速度为_1_，闪避为_15_，精准为_20_。\n\n拥有豺狼工兵作为伙伴时，受到的一切伤害减少75%(以落石特效显示)。\n\n游荡时会前往伙伴所在的位置。\n\n掉落_7_经验，获得经验的最大英雄等级为_-2_级。\n\n有10%的概率掉落一根长矛(由于英雄等级限制，实际无法掉落)。



custom.dict.dict.mob_gnoll_sapper =豺狼工兵
custom.dict.dict.mob_gnoll_sapper_d =于巨魔铁匠任务的豺狼层生成3只，此后不再自然生成。\n\n这个敌人的最大生命为_45_，视野为_8_，攻击距离为_1_，攻击为_1~6_，防御为_0~6_，攻击延迟为_1_，移动速度为_1_，闪避为_15_，精准为_18_。\n\n与附近一同生成的豺狼守卫作为伙伴，锁定目标后会唤醒周围3格内的伙伴并强制伙伴锁定该目标。视野内有目标时不会移动，没有目标时只在生成点周围3格内活动。\n\n拥有和豺狼地卜师大致相同的特殊能力(详情请见豺狼地卜师部分)，为_4~6_回合冷却。每次受伤会减少_所受伤害_回合特殊能力冷却。\n\n具有_小Boss属性_。\n\n掉落_10_经验，获得经验的最大英雄等级为_-2_级。



