custom.ch.mimic.goldenmimicforchallenge.name = 金色宝箱怪
custom.ch.mimic.goldenmimicforchallenge.desc = 宝箱怪是一种能随意改变外形的魔法生物。在地牢里它们几乎一直以宝箱形态出现，因为这样总能吸引不防备的冒险者。\n\n金色宝箱怪是试图吸引顶尖冒险者的强大宝箱怪。它们拥有更丰厚的财宝，但相对通常的宝箱怪也更为强大。

custom.ch.mimic.crystalmimicforchallenge.name=水晶宝箱怪
custom.ch.mimic.crystalmimicforchallenge.ate=水晶宝箱怪吃掉了你的%s！
custom.ch.mimic.crystalmimicforchallenge.escaped=水晶宝箱怪逃跑了！
custom.ch.mimic.crystalmimicforchallenge.desc=宝箱怪是一种能随意改变外形的魔法生物。在地牢里它们几乎总会以宝箱形态出现，因为这样更能吸引不防备的冒险者。\n\n水晶宝箱怪相比于它们的近亲更为狡猾，会夺取财宝并尽量避免争斗。它们会在被发现后试图迅速逃离，还能在攻击时将敌人传送到别处。

