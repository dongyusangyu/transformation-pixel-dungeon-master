custom.dict.dict.mob_albino =白化老鼠
custom.dict.dict.mob_albino_d =有2%的概率替换啮齿小鼠生成。\n\n这个敌人的最大生命为_12_，视野为_8_，攻击距离为_1_，攻击为_1~4_，防御为_0~1_，攻击延迟为_1_，移动速度为_1_，闪避为_2_，精准为_8_。\n\n攻击时有50%的概率造成原始值为_2~3_的流血。\n\n掉落_2_经验，获得经验的最大英雄等级为_5_级。\n\n必定掉落一块神秘的肉。

custom.dict.dict.mob_frat =腐臭老鼠
custom.dict.dict.mob_frat_d =在2层接取悲伤幽灵任务后生成。\n\n这个敌人的最大生命为_20_，视野为_8_，攻击距离为_1_，攻击为_1~4_，防御为_0~2_，攻击延迟为_1_，移动速度为_1_，闪避为_5_，精准为_12_。\n\n攻击时有1/3的概率造成_20_回合腐蚀淤泥。\n\n受到攻击会产生20单位的腐臭气体。\n\n具有_小Boss和恶魔属性_，免疫腐臭气体。\n\n掉落_4_经验，获得经验的最大英雄等级为_5_级。

custom.dict.dict.mob_gnoll =豺狼巡查
custom.dict.dict.mob_gnoll_d =于2~4层生成。\n\n这个敌人的最大生命为_12_，视野为_8_，攻击距离为_1_，攻击为_1~6_，防御为_0~2_，攻击延迟为_1_，移动速度为_1_，闪避为_4_，精准为_10_。\n\n掉落_2_经验，获得经验的最大英雄等级为_8_级。\n\n有50%的概率掉落一堆金币。

custom.dict.dict.mob_gnollexile =豺狼流寇
custom.dict.dict.mob_gnollexile_d =有2%的概率替换豺狼巡查生成。\n\n这个敌人的最大生命为_24_，视野为_8_，攻击距离为_2_，攻击为_1~10_，防御为_0~1_，攻击延迟为_1_，移动速度为_1_，闪避为_6_，精准为_15_。\n\n初始保持中立，不与英雄敌对，在英雄视野内受到伤害、范围效果、环境效果等影响后与英雄敌对。\n\n掉落_2_经验，获得经验的最大英雄等级为_8_级。\n\n必定掉落且只会掉落2~3件随机物品。

custom.dict.dict.mob_gnoll_darter =豺狼诡术师
custom.dict.dict.mob_gnoll_darter_d =在3层接取悲伤幽灵任务后生成。\n\n这个敌人的最大生命为_20_，视野为_8_，攻击为远程物理攻击且在近身时会远离，攻击为_1~6_，防御为_0~2_，攻击延迟为_1_，移动速度为_1_，闪避为_5_，精准为_16_。\n\n连续攻击会叠加连击数(攻击被中断则连击数也会中断)，拥有_(0~3)+连击数_攻击等级，攻击等级超过2时使用毒镖造成_攻击等级-2_回合中毒，超过6时使用火镖造成_8_回合燃烧，若目标已处于燃烧状态则换为毒镖。\n\n具有_小Boss属性_。\n\n掉落_5_经验，获得经验的最大英雄等级为_8_级。\n\n必定掉落一组仅有2件的随机投掷武器。

custom.dict.dict.mob_crab =下水道螃蟹
custom.dict.dict.mob_crab_d =于3~4层生成。\n\n这个敌人的最大生命为_15_，视野为_8_，攻击距离为_1_，攻击为_1~7_，防御为_0~4_，攻击延迟为_1_，移动速度为_2_，闪避为_5_，精准为_12_。\n\n掉落_4_经验，获得经验的最大英雄等级为_9_级。\n\n有1/6的概率掉落一块神秘的肉。

custom.dict.dict.mob_hermitcrab =寄居蟹
custom.dict.dict.mob_hermitcrab_d =有2%的概率替换下水道螃蟹生成。\n\n这个敌人的最大生命为_25_，视野为_8_，攻击距离为_1_，攻击为_1~7_，防御为_2~6_，攻击延迟为_1_，移动速度为_1_，闪避为_5_，精准为_12_。\n\n掉落_4_经验，获得经验的最大英雄等级为_9_级。\n\n有50%的概率掉落一块神秘的肉。\n\n必定掉落一件随机护甲。

custom.dict.dict.mob_great_crab =巨钳螃蟹
custom.dict.dict.mob_great_crab_d =在4层接取悲伤幽灵任务后生成。\n\n这个敌人的最大生命为_25_，视野为_8_，攻击距离为_1_，攻击为_1~8_，防御为_0~4_，攻击延迟为_1_，移动速度为_1_，闪避为_0_，精准为_12_。\n\n每移动两次就会暂停一次。\n\n锁定目标后会完全格挡来自目标的任何攻击，在丢失目标后失效。\n\n具有_小Boss属性_。\n\n掉落_6_经验，获得经验的最大英雄等级为_9_级。\n\n必定掉落2块神秘的肉。

custom.dict.dict.mob_swarm =蝇群
custom.dict.dict.mob_swarm_d =于3~4层和6层生成。\n\n这个敌人的最大生命为_50_，视野为_8_，攻击距离为_1_，攻击为_1~4_，防御为_0_，攻击延迟为_1_，移动速度为_1_，闪避为_5_，精准为_10_。\n\n受到物理攻击后失去_当前生命一半_的生命并向周围分裂出一只同等生命的蝇群。\n\n掉落_3_经验，获得经验的最大英雄等级为_9_级。\n\n有1/6的概率掉落一瓶治疗药剂，上限5瓶，每掉一次概率都会降至_(掉落上限-已掉落数)/掉落上限_倍。

custom.dict.dict.mob_caustic_slime =蚀化史莱姆
custom.dict.dict.mob_caustic_slime_d =有2%的概率替换史莱姆生成。\n\n这个敌人的最大生命为_20_，视野为_8_，攻击距离为_1_，攻击为_2~5_，防御为_0_，攻击延迟为_1_，移动速度为_1_，闪避为_5_，精准为_12_。\n\n攻击时有50%的概率造成_20_回合腐蚀淤泥。\n\n大幅抑制超过5的伤害(4之后每想要造成一点伤害，需要1，2，3，4...点原始伤害)。\n\n具有_酸属性_。\n\n掉落_4_经验，获得经验的最大英雄等级为_9_级。\n\n有20%的概率掉落一件0级的随机2阶武器，每掉一次概率都会降至1/4倍。与史莱姆共用概率衰减。\n\n必定掉落一个粘咕球。

custom.dict.dict.mob_slime =史莱姆
custom.dict.dict.mob_slime_d =于4层生成。\n\n这个敌人的最大生命为_20_，视野为_8_，攻击距离为_1_，攻击为_2~5_，防御为_0_，攻击延迟为_1_，移动速度为_1_，闪避为_5_，精准为_12_。\n\n大幅抑制超过5的伤害(4之后每想要造成一点伤害，需要1，2，3，4...点原始伤害)。\n\n掉落_4_经验，获得经验的最大英雄等级为_9_级。\n\n有20%的概率掉落一件0级的随机2阶武器，每掉一次概率都会降至1/4倍。

custom.dict.dict.mob_snake =下水道巨蛇
custom.dict.dict.mob_snake_d =于1~4层生成。\n\n这个敌人的最大生命为_4_，视野为_8_，攻击距离为_1_，攻击为_1~4_，防御为_0_，攻击延迟为_1_，移动速度为_1_，闪避为_25_，精准为_10_。\n\n掉落_2_经验，获得经验的最大英雄等级为_7_级。\n\n有25%的概率掉落一粒随机种子(不包括腐莓之种)。

custom.dict.dict.ch1_div =第一区域Boss
custom.dict.dict.ch1_div_d =第5层的第一个Boss——粘咕。战斗不分阶段，无特殊场地效果，无召唤，粘咕的特殊能力主要是蓄力攻击、水中回复以及半血以下属性提高。\n\n粘咕的通常行动为普通攻击，有20%的概率(半血以下为50%)替换为蓄力攻击。\n\n蓄力需要2回合，期间不会攻击但是攻击距离暂时变为2，移动和不处于锁定状态会打断蓄力。\n\n蓄力结束时使用蓄力攻击，为2倍精准、3倍伤害的单体攻击。\n\n在水中时，每回合回复1点生命。\n\n开启_绝命头目_挑战后：\n最大生命+20%；\n蓄力攻击只需蓄力1回合；\n在水中的回复量会随着回合逐渐加1(最高为3)，离开水时重置回复量。\n\n击杀后获得1000排行榜Boss战分数，每用出一次目标为英雄的蓄力攻击-200分。

custom.dict.dict.mob_goo =粘咕
custom.dict.dict.mob_goo_d =于第5层作为第一区域的Boss出现。\n\n这个敌人的最大生命为_100_，视野为_8_，攻击距离为_1_，攻击为_1~8_，防御为_0~2_，攻击延迟为_1_，移动速度为_1_，闪避为_8_，精准为_10_。\n\n当前生命不高于最大生命的一半时，进入暴怒状态。暴怒状态下，攻击上升为_1~12_，闪避上升为_12_，精准上升为_15_。\n\n每次攻击有20%的概率(暴怒状态为50%)替换为蓄力攻击，拥有2格攻击距离和2倍精准，蓄力2回合后造成3倍伤害。\n\n攻击时有1/3的概率造成_20_回合腐蚀淤泥。\n\n在水中时，每回合回复1点生命。\n\n开启_绝命头目_挑战后：\n最大生命+20%；\n蓄力攻击只需蓄力1回合；\n在水中的回复量会随着回合逐渐加1(最高为3)，离开水时重置回复量。\n\n具有_Boss、恶魔和酸属性_。\n\n掉落_10_经验，获得经验的最大英雄等级为_29_级。\n\n必定掉落2~4个粘咕球，分别为60%，30%，10%的概率。






##2
custom.dict.dict.ch2 =第二区域：监狱
custom.dict.dict.ch2_d =以下是6~9层的敌人信息。

custom.dict.dict.mob_skeleton =骷髅
custom.dict.dict.mob_skeleton_d =于6~9层生成。\n\n这个敌人的最大生命为_25_，视野为_8_，攻击距离为_1_，攻击为_2~10_，防御为_0~5_，攻击延迟为_1_，移动速度为_1_，闪避为_9_，精准为_12_。\n\n死亡时会迸溅碎骨并能伤害到周围一圈的所有生物，迸溅伤害为_6~12_但可以被护甲减免两次。\n\n具有_亡灵和非生物属性_。\n\n掉落_5_经验，获得经验的最大英雄等级为_10_级。\n\n有1/6的概率掉落一件随机武器，每掉一次概率都会降至1/3倍。

custom.dict.dict.mob_thief =疯狂小偷
custom.dict.dict.mob_thief_d =于6~9层生成，此外有2.5%的概率于4层生成。\n\n这个敌人的最大生命为_20_，视野为_8_，攻击距离为_1_，攻击为_1~10_，防御为_0~3_，攻击延迟为_0.5_，移动速度为_1_，闪避为_12_，精准为_12_。\n\n每次攻击英雄都会随机其背包内的一件物品进行窃取(无法窃取装备着的物品、包裹内的物品、英雄的特殊物品和具有贵重属性的物品)，随机到无法窃取的物品则继续攻击直到窃取成功。窃取成功后会开始逃跑，移动速度降低为_5/6_，若路径被堵死无法逃跑则会恼羞成怒重新变回超雄形态继续攻击。\n\n逃跑过程中被攻击会掉落1枚金币，从英雄视野内脱离且与英雄的距离大于等于6格时进行随机传送，窃取得到的物品也会因此消失不见。\n\n想要拿回被窃取的物品就得尽快将其击杀，当然部分物品可能会在其逃跑的过程中被损毁或是发生变化：蜂蜜罐会在被窃取成功的瞬间直接破裂、药剂会因其冻结而立即冻碎、卷轴会因其燃烧而立即烧毁、神秘的肉会因其燃烧而立即变成烤肉。\n\n具有_亡灵属性_。\n\n掉落_5_经验，获得经验的最大英雄等级为_11_级。\n\n有3%的概率掉落一件随机神器或戒指，每掉一次概率都会降至1/3倍。

custom.dict.dict.mob_bandit =疯狂强盗
custom.dict.dict.mob_bandit_d =有2%的概率替换疯狂小偷生成。\n\n这个敌人的最大生命为_20_，视野为_8_，攻击距离为_1_，攻击为_1~10_，防御为_0~3_，攻击延迟为_0.5_，移动速度为_1_，闪避为_12_，精准为_12_。\n\n每次攻击英雄都会随机其背包内的一件物品进行窃取(无法窃取装备着的物品、包裹内的物品、英雄的特殊物品和具有贵重属性的物品)，随机到无法窃取的物品则继续攻击直到窃取成功。窃取成功后会对英雄造成_2~5_回合失明、_3~8_回合残废和_5~7_回合中毒并开始逃跑，移动速度降低为_5/6_，若路径被堵死无法逃跑则会恼羞成怒重新变回超雄形态继续攻击。\n\n逃跑过程中被攻击会掉落1枚金币，从英雄视野内脱离且与英雄的距离大于等于6格时进行随机传送，窃取得到的物品也会因此消失不见。\n\n想要拿回被窃取的物品就得尽快将其击杀，当然部分物品可能会在其逃跑的过程中被损毁或是发生变化：蜂蜜罐会在被窃取成功的瞬间直接破裂、药剂会因其冻结而立即冻碎、卷轴会因其燃烧而立即烧毁、神秘的肉会因其燃烧而立即变成烤肉。\n\n具有_亡灵属性_。\n\n掉落_5_经验，获得经验的最大英雄等级为_11_级。\n\n有100%的概率掉落一件随机神器或戒指，每掉一次概率都会降至1/3倍。与疯狂小偷共用概率衰减。

custom.dict.dict.mob_guard =监狱守卫
custom.dict.dict.mob_guard_d =于7~9层生成。\n\n这个敌人的最大生命为_40_，视野为_8_，攻击距离为_1_，攻击为_4~12_，防御为_0~7_，攻击延迟为_1_，移动速度为_1_，闪避为_10_，精准为_12_。\n\n与已锁定的目标相距小于等于3格且无法攻击到目标时，可用锁链将其拉至身前并造成_5_回合残废(实际4回合，因为拉过去的那一回合会-1，并且会直接攻击一次)。每个监狱守卫只能使用一次此能力，若其身前有深渊则不会使用此能力。\n\n具有_亡灵属性_。\n\n掉落_7_经验，获得经验的最大英雄等级为_14_级。\n\n有20%的概率掉落一件随机护甲，每掉一次概率都会降至1/3倍。

custom.dict.dict.mob_new_ele_fire =新生火焰元素
custom.dict.dict.mob_new_ele_fire_d =老杖匠任务敌人，在有仪式标记的地格上以对角十字摆上四个仪式蜡烛后生成。\n\n这个敌人的最大生命为_60_，视野为_8_，攻击距离为_1_，攻击为_10~12_，防御为_0~5_，攻击延迟为_1_，移动速度为_1_，闪避为_12_，精准为_15_。\n\n每_3~5_回合远程释放一次不会直接造成伤害的特殊攻击，会随机选取一块与目标相邻的地格产生3x3范围的警告，警告后的下一回合使该范围产生持续_8_回合的火焰，若因为弹道受阻等原因导致选取地格失败则进入1回合的冷却。\n\n具有_小Boss和火属性_，在获得冻伤或冻结时失去_最大生命50%~60%_点生命。\n\n掉落_10_经验，获得经验的最大英雄等级为_20_级。\n\n必定掉落一块元素余烬作为老杖匠任务的任务物品。

custom.dict.dict.mob_dm100 =DM-100
custom.dict.dict.mob_dm100_d =于7~9层生成。\n\n这个敌人的最大生命为_20_，视野为_8_，可远程放电造成_3~10_点魔法伤害而在近身时使用近战攻击，近战攻击距离为_1_，近战攻击为_2~8_，防御为_0~4_，攻击延迟为_1_，移动速度为_1_，闪避为_8_，远程精准为_22_，近战精准为_11_。\n\n具有_电和非生物属性_。\n\n掉落_6_经验，获得经验的最大英雄等级为_13_级。\n\n有25%的概率掉落一张随机卷轴(不包括升级卷轴)。

custom.dict.dict.mob_rot_heart =腐莓核心
custom.dict.dict.mob_rot_heart_d =老杖匠任务敌人，在长满了高草的上锁房间中生成。\n\n这个敌人的最大生命为_80_，视野为_8_，无法攻击，防御为_0~5_，闪避为_0_。\n\n受到攻击会产生_5+3*相邻非固体地格数量_单位的毒气。\n\n死亡时，同房间内的所有腐莓触手也会死亡。\n\n具有_小Boss和无法移动属性_，免疫麻痹、狂乱、催眠、魔法睡眠、恐惧、魂飞魄散、眩晕和毒气，在获得燃烧时死亡。\n\n掉落_4_经验，获得经验的最大英雄等级为_29_级。\n\n非燃烧死亡则必定掉落一粒腐莓之种作为老杖匠任务的任务物品。

custom.dict.dict.mob_rot_lash =腐莓触手
custom.dict.dict.mob_rot_lash_d =老杖匠任务敌人，在长满了高草的上锁房间中生成。\n\n这个敌人的最大生命为_80_，视野为_1_，攻击距离为_1_，攻击为_10~20_，防御为_0~8_，攻击延迟为_1_，闪避为_0_，精准为_25_。\n\n目标进入视野范围的那一回合会进行锁定但不进行攻击，攻击会造成_2_回合残废。\n\n未锁定目标或锁定目标不与其相邻时每回合恢复5点生命。\n\n同房间内的腐莓核心死亡时也会死亡。\n\n具有_无法移动属性_，免疫毒气，在获得燃烧时死亡。\n\n掉落_1_经验，获得经验的最大英雄等级为_35_级。\n\n非燃烧死亡则有75%的概率掉落一粒随机种子(不包括腐莓之种)。

custom.dict.dict.mob_necro =死灵法师
custom.dict.dict.mob_necro_d =于8~9层生成。\n\n这个敌人的最大生命为_40_，视野为_8_，无法攻击，防御为_0~5_，移动速度为_1_，闪避为_13_。\n\n与已锁定的目标相距小于等于3格时，会花费2回合在其周围召唤一个属性与常规骷髅无异的骷髅进行作战(此处简称为死灵骷髅)。\n\n召唤死灵骷髅的瞬间会为其恢复5点生命，此后若死灵骷髅生命降低则优先为其恢复5点生命，死灵骷髅生命为满且不拥有激素涌动效果则会给予其_3_回合的激素涌动(移动速度*2，攻击速度*1.5)。\n\n若在召唤死灵骷髅后丢失目标，再次锁定目标时会立即为视野内的死灵骷髅恢复生命或给予激素涌动，视野内没有死灵骷髅则立即将死灵骷髅传送至目标周围并为其恢复生命或给予激素涌动。\n\n死亡时，其召唤的死灵骷髅也会死亡。\n\n具有_亡灵属性_。\n\n掉落_7_经验，获得经验的最大英雄等级为_14_级。\n\n有20%的概率掉落一瓶治疗药剂，上限6瓶，每掉一次概率都会降至_(掉落上限-已掉落数)/掉落上限_倍。

custom.dict.dict.mob_spe_necro = 幽魂法师
custom.dict.dict.mob_spe_necro_d =有2%的概率替换死灵法师生成。\n\n这个敌人的最大生命为_40_，视野为_8_，无法攻击，防御为_0~5_，移动速度为_1_，闪避为_13_。\n\n与已锁定的目标相距小于等于3格时，会花费2回合在其周围召唤一个怨灵，之后仍会无限制地不断召唤怨灵。\n\n死亡时，其召唤的怨灵也会死亡。\n\n具有_亡灵属性_。\n\n掉落_7_经验，获得经验的最大英雄等级为_14_级。\n\n有20%的概率掉落一瓶治疗药剂，上限6瓶，每掉一次概率都会降至_(掉落上限-已掉落数)/掉落上限_倍。与死灵法师共用掉落上限及概率衰减。\n\n必定掉落一张祛邪卷轴。

custom.dict.dict.ch2_div =第二区域Boss
custom.dict.dict.ch2_div_d =第10层的第二个Boss——天狗。本层英雄的视野会提升至12，战斗分两个阶段，一阶段在一个小型方形房间进行，二阶段则在一个大型圆形房间进行。\n\n天狗通常会进行远程物理攻击，在被近身时则会使用近战攻击。\n\n_一阶段：_\n\n天狗会在生命低于200、175、150和125时分别闪现一次并使房间内刷新大量毒镖陷阱(造成_8_回合中毒，至少会有一条安全的路径能走到其周围)，这些毒镖陷阱在刷新出来后会在下一回合被完全隐藏。\n\n这一阶段的闪现会执行100次选取地格，可选取的地格必须是与已锁定的目标及英雄至少相距3格的圆形(以上下左右为标准方向是正好相距3格，以四个斜角为标准方向则是大于2格算3格)及以外范围的地格，并且地格上不能有其他角色。若这100次选取都失败了则为原地闪现。\n\n若单次受到大量伤害，其生命会在176、151、126和101分别锁定一次(意味着一阶段总是会闪现4次)。\n\n天狗在损失_最大生命50%点_生命(超出部分不计)后进入二阶段。\n\n_二阶段：_\n\n天狗会在生命低于100、75、50和25时分别闪现一次。\n\n这一阶段的闪现也会执行100次选取地格，与一阶段不同，可选取的地格必须与已锁定的目标及英雄至少相距5格且不超过6格，同时还要与原先所处的地格至少相距5格(两个条件都不是圆形，也就是怎么斜都是1格)，并且地格上不能有其他角色和物品。若这100次选取都失败了则为原地闪现。\n\n天狗会在这一阶段进场时获得1次特殊能力的可使用次数，之后第一和第二次闪现分别+2可使用次数，第三次闪现+3可使用次数，第四次闪现+4可使用次数。\n\n特殊能力有三种：\n扔出一个5x5范围计时3回合后爆炸的烟尘炸弹(爆炸伤害为_5+楼层数~10+楼层数*2_)；\n扔出一个在十字-X字-十字范围不断循环放电的电击装置(电击伤害为_12_)；\n挥洒出不断向前扩散的细腻粉末(扩散时原地燃烧一次)。\n\n第一次使用必定为烟尘炸弹，第二次使用必定为电击装置，之后则是三种能力随机使用，若随机到上次使用的特殊能力则有90%的概率重新随机一次。\n\n特殊能力的使用总是花费2回合(表现为使用后发呆1回合再在下一回合进行攻击)，但当特殊能力的可使用次数大于等于4次时，再使用特殊能力只会花费1回合(表现为使用后下一回合直接攻击)。\n\n若单次受到大量伤害，其生命会在76、51、26和1分别锁定一次(意味着二阶段总是会闪现4次)。\n\n开启_绝命头目_挑战后：\n最大生命+25%(一阶段在生命低于248、217、186和155时分别闪现一次而在单次受到大量伤害情况下在218、187和156时分别锁定一次，二阶段在生命低于123、92、61和30时分别闪现一次而在单次受到大量伤害情况下在94、63、32和1时分别锁定一次)；\n一阶段的毒镖陷阱会造成_16_回合中毒；\n二阶段挥洒细腻粉末不消耗可使用次数且每次使用特殊能力后都会立即挥洒细腻粉末，随机使用特殊能力时只会从烟尘炸弹和电击装置中随机，使用特殊能力所花费的回合-1(可使用次数大于等于4次时即为花费0回合，表现为使用后立即进行攻击)。\n\n击杀后获得2000排行榜Boss战分数，英雄每次踩到毒镖陷阱-100分，英雄每次被特殊能力影响-100分。

custom.dict.dict.mob_tengu =天狗
custom.dict.dict.mob_tengu_d =于第10层作为第二区域的Boss出现。\n\n这个敌人的最大生命为_200_，视野为_12_，可远程投掷手里剑造成_6~12_点伤害而在近身时使用近战攻击，近战攻击距离为_1_，近战攻击为_6~12_，防御为_0~5_，攻击延迟为_1_，闪避为_15_，远程精准为_20_，近战精准为_10_。\n\n一阶段的天狗会在生命低于_200_、_175_、_150_和_125_时分别闪现一次并使房间内刷新大量毒镖陷阱(造成_8_回合中毒，至少会有一条安全的路径能走到其周围)，这些毒镖陷阱在刷新出来后会在下一回合被完全隐藏。\n\n这一阶段的闪现会执行100次选取地格，可选取的地格必须是与已锁定的目标及英雄至少相距3格的圆形(以上下左右为标准方向是正好相距3格，以四个斜角为标准方向则是大于2格算3格)及以外范围的地格，并且地格上不能有其他角色。若这100次选取都失败了则为原地闪现。\n\n若单次受到大量伤害，其生命会在_176_、_151_、_126_和_101_分别锁定一次(意味着一阶段总是会闪现4次)。\n\n天狗在损失_最大生命50%_点生命(超出部分不计)后进入二阶段。\n\n二阶段的天狗会在生命低于_100_、_75_、_50_和_25_时分别闪现一次。\n\n这一阶段的闪现也会执行100次选取地格，与一阶段不同，可选取的地格必须与已锁定的目标及英雄至少相距5格且不超过6格，同时还要与原先所处的地格至少相距5格(两个条件都不是圆形，也就是怎么斜都是1格)，并且地格上不能有其他角色和物品。若这100次选取都失败了则为原地闪现。\n\n天狗会在这一阶段进场时获得1次特殊能力的可使用次数，之后第一和第二次闪现分别+2可使用次数，第三次闪现+3可使用次数，第四次闪现+4可使用次数。\n\n特殊能力有三种：\n扔出一个5x5范围计时3回合后爆炸的烟尘炸弹(爆炸伤害为_5+楼层数~10+楼层数*2_)；\n扔出一个在十字-X字-十字范围不断循环放电的电击装置(电击伤害为_12_)；\n挥洒出不断向前扩散的细腻粉末(扩散时原地燃烧一次)。\n\n第一次使用必定为烟尘炸弹，第二次使用必定为电击装置，之后则是三种能力随机使用，若随机到上次使用的特殊能力则有90%的概率重新随机一次。\n\n特殊能力的使用总是花费2回合(表现为使用后发呆1回合再在下一回合进行攻击)，但当特殊能力的可使用次数大于等于4次时，再使用特殊能力只会花费1回合(表现为使用后下一回合直接攻击)。\n\n若单次受到大量伤害，其生命会在_76_、_51_、_26_和_1_分别锁定一次(意味着二阶段总是会闪现4次)。\n\n开启_绝命头目_挑战后：\n最大生命+25%(一阶段在生命低于248、217、186和155时分别闪现一次而在单次受到大量伤害情况下在218、187和156时分别锁定一次，二阶段在生命低于123、92、61和30时分别闪现一次而在单次受到大量伤害情况下在94、63、32和1时分别锁定一次)；\n一阶段的毒镖陷阱会造成_16_回合中毒；\n二阶段挥洒细腻粉末不消耗可使用次数且每次使用特殊能力后都会立即挥洒细腻粉末，随机使用特殊能力时只会从烟尘炸弹和电击装置中随机，使用特殊能力所花费的回合-1(可使用次数大于等于4次时即为花费0回合，表现为使用后立即进行攻击)。\n\n具有_Boss和无法移动属性_，免疫失明和恐惧。\n\n掉落_20_经验，获得经验的最大英雄等级为_29_级。\n\n必定掉落一副天狗的面具。



##3

custom.dict.dict.ch3 =第三区域：洞穴
custom.dict.dict.ch3_d =以下是11~14层的敌人信息。

custom.dict.dict.mob_bat =吸血蝙蝠
custom.dict.dict.mob_bat_d =于11~14层生成，此外有2.5%的概率于9层生成。\n\n这个敌人的最大生命为_30_，视野为_8_，攻击距离为_1_，攻击为_5~18_，防御为_0~4_，攻击延迟为_1_，移动速度为_2_，闪避为_15_，精准为_16_。\n\n每次攻击会为自己恢复_造成伤害-4_点生命。\n\n掉落_7_经验，获得经验的最大英雄等级为_15_级。\n\n有1/6的概率掉落一瓶治疗药剂，上限7瓶，每掉一次概率都会降至_(掉落上限-已掉落数)/掉落上限_倍。

custom.dict.dict.mob_brute =豺狼暴徒
custom.dict.dict.mob_brute_d =于11~14层生成。\n\n这个敌人的最大生命为_40_，视野为_8_，攻击距离为_1_，攻击为_5~25_，防御为_0~8_，攻击延迟为_1_，移动速度为_1_，闪避为_15_，精准为_20_。\n\n在生命值清零后获得_24_点护盾(每回合-4)，攻击上升为_15~40_。\n\n掉落_8_经验，获得经验的最大英雄等级为_16_级。\n\n有50%的概率掉落一堆金币。

custom.dict.dict.mob_armored_brute =装甲暴徒
custom.dict.dict.mob_armored_brute_d =有2%的概率替换豺狼暴徒生成。\n\n这个敌人的最大生命为_40_，视野为_8_，攻击距离为_1_，攻击为_5~25_，防御为_6~10_，攻击延迟为_1_，移动速度为_1_，闪避为_15_，精准为_20_。\n\n在生命值清零后获得_21_点护盾(每三回合-1)，攻击上升为_15~40_。\n\n掉落_8_经验，获得经验的最大英雄等级为_16_级。\n\n尽管是对应豺狼暴徒的稀有敌人，但它不会掉落金币。\n\n必定掉落一件鳞甲或板甲，鳞甲为75%的概率，而板甲为25%的概率。

custom.dict.dict.mob_shaman =豺狼萨满
custom.dict.dict.mob_shaman_d =于11~14层生成，生成时为红，蓝，紫色面具的概率分别为40%，40%，20%。\n\n这个敌人的最大生命为_35_，视野为_8_，可远程施法造成_6~15_点魔法伤害而在近身时使用近战攻击，近战攻击距离为_1_，近战攻击为_5~10_，防御为_0~6_，攻击延迟为_1_，移动速度为_1_，闪避为_15_，远程精准为_36_，近战精准为_18_。\n\n远程攻击有50%的概率对目标施加负面效果：_20_回合虚弱(红色)，_20_回合易伤(蓝色)，_30_回合幻惑(紫色)。\n\n掉落_8_经验，获得经验的最大英雄等级为_16_级。\n\n有3%的概率掉落一根随机法杖，每掉一次概率都会降至1/3倍。

custom.dict.dict.mob_spinner =矿洞蜘蛛
custom.dict.dict.mob_spinner_d =于12~14层生成。\n\n这个敌人的最大生命为_50_，视野为_8_，攻击距离为_1_，攻击为_10~20_，防御为_0~6_，攻击延迟为_1_，移动速度为_1_，闪避为_17_，精准为_22_。\n\n攻击时有1/3的概率造成_7~9_回合中毒。\n\n已锁定目标且无法攻击到目标时，根据弹道选取目标上一回合所处地格与下一回合所处地格连线后的下一地格发射蜘蛛网，发射后会扩散为3格，持续_20_回合，可以被扔出的物品、法杖射弹、火焰燃烧等方式破坏，目标踩上后会获得_5_回合缠绕。每只矿洞蜘蛛都能无限使用此能力，使用后会进入_10_回合冷却。\n\n对中毒拥有抗性，免疫蜘蛛网。\n\n掉落_9_经验，获得经验的最大英雄等级为_17_级。\n\n有12.5%的概率掉落一块神秘的肉。

custom.dict.dict.mob_dm200 =DM-200
custom.dict.dict.mob_dm200_d =于13~14层生成。\n\n这个敌人的最大生命为_80_，视野为_8_，攻击距离为_1_，攻击为_10~25_，防御为_0~8_，攻击延迟为_1_，移动速度为_1_，闪避为_12_，精准为_20_。\n\n已锁定目标且与目标有一定距离时，会根据情况发射20单位的毒气：能寻路到目标那格(不考虑巨型属性影响)且与目标相距大于等于1格时，从_0~100/相距距离_随机取数，为0就发射毒气；能寻路到目标那格(不考虑巨型属性影响)但因为巨型属性无法抵达时，直接发射毒气。每个DM-200都能无限使用此能力，使用后会进入_30_回合冷却。\n\n发射毒气为自身与目标连线的直线发射，只要不丢失目标就可以直接穿过固体地形(金属架构、雕像等)发射。发射后，连线的每一格都会产生20单位的毒气。\n\n具有_非生物和巨型属性_。\n\n掉落_9_经验，获得经验的最大英雄等级为_17_级。\n\n有20%的概率掉落一件随机武器或护甲(阶数概率等效第四区域)，每掉一次概率都会降至1/3倍。

custom.dict.dict.mob_dm201 =DM-201
custom.dict.dict.mob_dm201_d =有2%的概率替换DM-200生成。\n\n这个敌人的最大生命为_120_，视野为_8_，攻击距离为_1_，攻击为_15~25_，防御为_0~8_，攻击延迟为_1_，闪避为_12_，精准为_20_。\n\n每次受到来自已锁定目标的攻击且与已锁定目标相距大于等于1格时，发射_15+5*目标周围非固体地格数量_单位的腐蚀酸雾。处于腐蚀酸雾中的生物会直接获得_1_回合起始伤害为_8_的酸蚀。每个DM-201都能无限使用此能力。\n\n发射腐蚀酸雾为自身与目标连线的直线发射，只要不丢失目标就可以直接穿过固体地形(金属架构、雕像等)发射。\n\n具有_非生物、巨型和无法移动属性_。\n\n掉落_9_经验，获得经验的最大英雄等级为_17_级。\n\n有20%的概率掉落一件随机武器或护甲(阶数概率等效第四区域)，每掉一次概率都会降至1/3倍。与DM-200共用概率衰减。\n\n必定掉落一块邪能碎片。

custom.dict.dict.ch3_div =第三区域Boss
custom.dict.dict.ch3_div_d =第15层的第三个Boss——DM-300。战斗分三个阶段，在一个巨大的圆形房间进行，房间中心和角落有大量墙体，四个角落分别有一个未激活的能量塔。\n\nDM-300通常会使用近战攻击，同时拥有两种特殊能力，未锁定目标时会默认往英雄方向游荡。\n\n_一、二阶段：_\n\nDM-300在踩到地表导线时会获得_30+已损生命/10_点护盾。\n\nDM-300拥有两种特殊能力，共享_5~9_回合冷却：\n向已锁定且不是非生物属性的目标发射_100+20*相距距离_单位的毒气，若单位不足250(也就是目标较近的情况)则不足250的部分会均匀喷向自身周围一圈；\n将目标击退到与自身相距2格(本就相距2格及以上则不击退，击退不造成伤害)的位置并以目标为中心产生7x7范围的随机落石预警。\n\n在无法直接攻击到且目标不是非生物属性的情况下，特殊能力冷却结束时必定发射毒气，否则两种特殊能力分别会有50%的概率使用。如果已使用了其中一种，下次使用时，未在上次使用的那一种概率提高为75%。\n当然也有特殊情况，在无法发射毒气(如弹道被阻拦)且目标不拥有麻痹效果的情况下，特殊能力的冷却结束时必定使用落石能力。\n\n发射毒气为自身与目标连线的直线发射。发射后，连线的每一格都会产生20单位的毒气。\n\n落石预警产生时，会选取目标周围其中一格地格为安全位置，若安全位置为墙体或带电地格则有50%的概率重新选取，为DM-300则必定重新选取，其余非安全位置选取必定不会选取DM-300。预警后的下一回合在预警位置产生落石，造成_6~10_点无视护甲的伤害并施加_3_回合麻痹。\n\nDM-300在一、二阶段每损失_100_点生命(超出部分不计)就会进入超载，此时不再会使用特殊能力，免疫一切伤害，强行锁定英雄，移动速度翻倍，移动时能够破坏路径及周围的墙体但会额外花费2回合。此外地表导线和水面会产生伤害为_6~12_的电火花，电火花会持续指示已激活的能量塔的方向，将已激活的能量塔摧毁后会结束DM-300的超载并进入下一阶段。\n\n_三阶段：_\nDM-300的行为模式与一、二阶段一致，但踩到地表导线不再获得护盾。此外地表导线和水面会产生伤害为_6~12_的电火花，电火花会持续指示DM-300的方向。\n\n开启_绝命头目_挑战后：\n最大生命+33%(变为四个阶段，一、二、三阶段与原先的一、二阶段一致，四阶段与原先的三阶段一致)；\n已激活的能量塔最大生命+60%；\n特殊能力冷却变为_5~7_回合，落石能力伤害提高为_10~20_并造成_5_回合麻痹；\n超载时破墙只需额外花费1回合；\n地表导线数量翻倍。\n\n击杀后获得3000排行榜Boss战分数，英雄每次受落石攻击-100分，英雄每次受到能量塔电击-100分，英雄每次因地表导线触电-200分。

custom.dict.dict.mob_dm300 =DM-300
