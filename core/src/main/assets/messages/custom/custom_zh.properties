##************************Alchemy
####Bomb
custom.dict.dict.bomb_arcane =奥术炸弹
custom.dict.dict.bomb_arcane_d =点燃并扔出2回合后爆炸对5x5范围内的所有生物造成_4+楼层数~12+3*楼层数_点魔法伤害。

custom.dict.dict.bomb =炸弹
custom.dict.dict.bomb_d =点燃并扔出2回合后爆炸对3x3范围内的所有生物造成_4+楼层数~12+3*楼层数_点伤害。\n\n其余改造炸弹配方见炼金指南。


custom.dict.dict.bomb_flame =燃烧弹
custom.dict.dict.bomb_flame_d =点燃并扔出2回合后爆炸对5x5范围内的所有生物造成_4+楼层数~12+3*楼层数_点伤害，同时会滞留5x5范围的火焰，持续10回合(在深渊上的火焰只会持续2回合)。

custom.dict.dict.bomb_flash =闪光弹
custom.dict.dict.bomb_flash_d =点燃并扔出2回合后爆炸对5x5范围内的所有生物造成_4+楼层数~12+3*楼层数_点伤害，同时附带25%的电击伤害和10回合麻痹。

custom.dict.dict.bomb_frost =冰霜炸弹
custom.dict.dict.bomb_frost_d =点燃并扔出2回合后爆炸对5x5范围内的所有生物造成_4+楼层数~12+3*楼层数_点伤害，同时附带4回合冻结并滞留5x5范围的寒气，持续10回合。

custom.dict.dict.bomb_holy =神圣炸弹
custom.dict.dict.bomb_holy_d =点燃并扔出2回合后爆炸对5x5范围内的所有生物造成_4+楼层数~12+3*楼层数_点伤害，同时对_亡灵和恶魔属性_的敌人额外造成50%伤害。

custom.dict.dict.bomb_noise =噪音地雷(鞭炮)
custom.dict.dict.bomb_noise_d =点燃并扔出2回合后不会直接爆炸而是产生一次噪音，之后每6回合产生一次噪音，能将本层没有目标的敌人吸引过来，在敌人踩上后爆炸，对5x5范围内的所有生物造成_4+楼层数~12+3*楼层数_点伤害。\n\n在农历新年这几天会更名为“鞭炮”，总共持续7天(农历新年当天为第5天)。

custom.dict.dict.bomb_shocking =烟雾弹
custom.dict.dict.bomb_shocking_d =点燃并扔出2回合后爆炸对5x5范围内的所有生物造成_4+楼层数~12+3*楼层数_点伤害，同时会炸出总计1000单位的烟幕。

custom.dict.dict.bomb_regrowth =再生炸弹
custom.dict.dict.bomb_regrowth_d =点燃并扔出2回合后不会爆炸，而是在9x9圆形范围内长出7x7范围的高草和3~4株特殊植物(最外圈则是践踏过的草)，同时会有持续6回合的从7x7最外圈开始向最中间收缩范围的草木再生(持续长出高草并造成缠绕)，此外还会对7x7范围内的盟友和英雄提供相当于饮用治疗药剂的治疗量(开启_恐药异症_挑战后则改为对英雄造成中毒)。

custom.dict.dict.bomb_shrapnel =破片炸弹
custom.dict.dict.bomb_shrapnel_d =点燃并扔出2回合后爆炸对范围内的所有生物造成_4+楼层数~12+3*楼层数_点伤害，其范围类似8格视野，爆炸范围内存在高草时，将爆炸中心与高草进行连线，处于同一直线且在高草之后的地格不受爆炸影响，同时该爆炸效果不会摧毁物品及部分场景。

custom.dict.dict.bomb_wool =绵绵炸弹
custom.dict.dict.bomb_wool_d =点燃并扔出2回合后爆炸对5x5范围内的所有生物造成_4+楼层数~12+3*楼层数_点伤害，同时生成9x9范围的魔法绵羊，持续200回合(Boss层仅为20回合，互动会直接取消持续时间)。

custom.dict.dict.catalyst_potion = 炼金催化剂
custom.dict.dict.catalyst_potion_d =这个细长的小瓶中盛有由提取的药水精华制得的魔法药液。半透明的药液散发着不断变幻的七彩光芒。\n\n这个催化剂原本的用途是作为一种炼金原料，不过你也可以直接使用它以获取随机的一种药水效果。\n随机的药水效果：3/22概率治疗，1/22概率经验，其余的多种效果（灵视，冰霜，毒气，麻痹，净化，极速，漂浮，隐身，液火）均为1/11概率。\n_不能借此得到力量药剂效果_

custom.dict.dict.catalyst_scroll = 奥术催化剂
custom.dict.dict.catalyst_scroll_d = 这团金黄的魔法之尘由提取的卷轴精华制得。它在黑暗的地牢中发出隐约的微光。\n\n这个催化剂原本的用途是作为一种炼金原料，不过你也可以直接引出其中的魔力以获取随机的一种卷轴效果。\n随机卷轴效果：3/22鉴定，1/22嬗变，其余效果均为1/11（驱邪，探地，催眠，盛怒，恐惧，充能，传送，镜像，复仇）。\n不可回收。\n_不能借此获取升级卷轴效果_

custom.dict.dict.food_chunk =无味果块
custom.dict.dict.food_chunk_d =扔出炼制了有害种子的无味果后残留的无味果块，进食消耗3回合，回复_450_饱食度。\n\n开启_缩餐节食_挑战后仅回复150饱食度。

custom.dict.dict.food_fruit =无味果
custom.dict.dict.food_fruit_d =通过炼金与种子炼制才可食用，进食消耗3回合，回复_450_饱食度，额外效果与炼制种子对应的药剂效果相同。\n\n开启_缩餐节食_挑战后仅回复150饱食度。\n\n注意，通过进食获得的效果在没有加点减少进食回合消耗天赋的情况下，都会减少2回合持续时间。

custom.dict.dict.food_frozen =肉类
custom.dict.dict.food_frozen_d =肉类不论各种状态，进食均消耗3回合，均回复_150_饱食度。\n\n开启_缩餐节食_挑战后仅回复50饱食度。\n\n_神秘的肉：_\n主要通过击杀部分敌人(下水道螃蟹、矿洞蜘蛛、巨型食人鱼等)掉落，食用后20%的概率燃烧8回合，20%的概率缠绕10回合，20%的概率迟缓10回合，20%的概率中毒(时长为_英雄最大生命/5_)，20%的概率无事发生。上述效果每次食用只能触发其中一种。\n\n_冷冻生肉片：_\n主要通过冰冻(自身冻结、寒气、冰霜法杖等)神秘的肉获得，食用后20%的概率获得20回合隐形，20%的概率获得每回合衰减一次的_0~英雄最大生命/4_点树肤，20%的概率获得净化效果(清除中毒、残废、虚弱、易伤、流血、失明、迟缓、眩晕和催眠效果)，20%的概率回复_英雄最大生命/4_点生命，20%的概率无事发生。上述效果每次食用只能触发其中一种。\n\n_烤肉和炖肉：_\n烤肉主要通过燃烧(自身燃烧、火焰、焰浪法杖等)神秘的肉或冷冻生肉片获得，炖肉主要通过神秘的肉炼金获得，二者食用后都没有特殊效果。\n\n注意，通过进食获得的效果在没有加点减少进食回合消耗的天赋的情况下，都会减少2回合持续时间。

custom.dict.dict.food_pie =全肉大饼
custom.dict.dict.food_pie_d =通过炼金加入任意肉类、口粮和肉馅饼(包括节日变体，也可以是幻影鱼肉)炼制获得，进食消耗3回合，回复_900_饱食度(超出饱食度上限的部分无效)，同时会获得450回合饱腹效果。\n\n_饱腹：_行动消耗的饱食度会改为消耗这一效果的持续时间，在此期间每过18回合还会额外回复1点生命。饰物_盐晶立方_可以延长这一来源的效果的持续时间，但额外生命回复的间隔也会被延长，因此该效果期间的额外生命回复总量不变。\n\n开启_缩餐节食_挑战后仅回复300饱食度，饱腹效果持续时间也会降低至150回合。\n\n注意，通过进食获得的效果在没有加点减少进食回合消耗天赋的情况下，都会减少2回合持续时间。

custom.dict.dict.food_pasty =肉馅饼
custom.dict.dict.food_pasty_d =生成口粮时有20%的概率替换口粮，进食消耗3回合，回复_450_饱食度。\n\n开启_缩餐节食_挑战后仅回复150饱食度。\n\n拥有节日变体，在特定时段(看设备的系统日期)会变为特殊食物：\n\n_清蒸荷叶鱼：_在农历新年这几天替换肉馅饼，总共持续7天(农历新年当天为第5天)。在肉馅饼的基础上改为仅回复_300_饱食度(开启_缩餐节食_挑战后为100)，但会留下一个新食物余鱼。余鱼进食消耗3回合，回复_150_饱食度(开启_缩餐节食_挑战后为50)，本质与肉馅饼不同，无法参与全肉大饼的炼制。\n\n_Yendor护符？：_愚人节当天替换肉馅饼。在肉馅饼的基础上会获得相当于2回合的神器充能效果(也就是瞬间生效等量回合的神器充能效果)。\n\n_复活节彩蛋：_在复活节这几天替换肉馅饼，通常持续7天(根据年份有可能与愚人节相撞导致只有6天，复活节当天为第5天)。额外效果与Yendor护符？相同。\n\n_虹色药剂：_在骄傲月6.24~6.30替换肉馅饼。在肉馅饼的基础上对与英雄相邻且正被英雄锁定的非Boss敌人造成5回合魅惑。\n\n_绿色蛋糕：_破碎的像素地牢周年纪念日8.1~8.7替换肉馅饼。在肉馅饼的基础上会获得_英雄当前等级经验需求10%_的经验(最低为2)。\n\n_南瓜派：_万圣节10.24~10.31替换肉馅饼。在肉馅饼的基础上会回复_英雄最大生命5%_的生命(最低为3)。\n\n_蓝色蛋糕：_原版像素地牢周年纪念日12.1~12.7替换肉馅饼。额外效果与绿色蛋糕相同。\n\n_拐杖糖：_冬季假日(圣诞节)12.15~12.26替换肉馅饼。在肉馅饼的基础上会为背包内所有法杖及魔杖回复0.5点充能。\n\n_气泡药剂：_元旦12.27~1.2替换肉馅饼。在肉馅饼的基础上会获得_英雄最大生命10%_的护盾(最低为5)。\n\n_紫色蛋糕：_蜕变地牢周年纪念日1.3~1.20替换肉馅饼。在肉馅饼的基础上会使下次使用蜕变卷轴的蜕变倍率翻倍。

custom.dict.dict.food_ration =口粮和小包口粮
custom.dict.dict.food_ration_d =口粮每层非Boss层都会至少生成一份，进食消耗3回合，回复_300_饱食度。\n\n小包口粮在6，11，16和20层的商店都会出售两份，进食消耗3回合，回复_150_饱食度。\n\n开启_缩餐节食_挑战后口粮仅回复100饱食度，小包口粮仅回复50饱食度。

custom.dict.dict.food_berry =地牢浆果
custom.dict.dict.food_berry_d =通过1层天赋_自然馈赠_在践踏高草时获得，进食消耗1回合，回复_100_饱食度，并且每食用2次就掉落一粒随机种子。\n\n开启_缩餐节食_挑战后仅回复33饱食度。\n\n加点减少进食回合消耗天赋的情况下，进食不再消耗回合。\n\n_地牢浆果的具体生成：_\n\n计算x为_2+2*该天赋已投入天赋点数-剩余浆果数_，通过这一计算得到的x若大于等于5则额外+3，否则额外+2，最后得到的x为预期楼层数。\n\n如果当前楼层数_大于_预期楼层数，则每株高草有10%的概率掉落地牢浆果。\n\n如果当前楼层数_等于_预期楼层数，则每株高草有1/30的概率掉落地牢浆果。\n\n如果当前楼层数_小于_预期楼层数，则每株高草有1/90的概率掉落地牢浆果。

custom.dict.dict.phantom_meat =幻影鱼肉
custom.dict.dict.phantom_meat_d =通过击杀幻影食人鱼获得，进食消耗3回合，回复_450_饱食度，同时会获得冷冻生肉片能给予的所有正面效果。\n\n开启_缩餐节食_挑战后仅回复150饱食度。\n\n注意，通过进食获得的效果在没有加点减少进食回合消耗天赋的情况下，都会减少2回合持续时间。

custom.dict.dict.supply_ration =备用口粮
custom.dict.dict.supply_ration_d =通过1层天赋_备用口粮_在额外生成的宝箱中获得，进食消耗1回合，回复_200_饱食度，同时会回复5点生命和1点暗影斗篷充能。\n\n开启_缩餐节食_挑战后仅回复66饱食度。\n\n加点减少进食回合消耗天赋的情况下，进食不再消耗回合。\n\n_备用口粮宝箱的具体生成：_\n\n第一、二、三个宝箱的生成分别在英雄通过第2、4、7层时解锁。\n\n解锁生成后，每层都会尝试在特殊房间中的安全位置生成一个装着备用口粮的宝箱，一层只会生成一个，全部生成后不再生成。

custom.dict.dict.tincture =安魂酊剂
custom.dict.dict.tincture_d =通过1层天赋_安魂酊剂_在6，11，16和20层的商店中购买获得，进食消耗1回合，回复_100_饱食度，同时会为_修士_回复50点理智并能解除惊恐效果。\n\n开启_缩餐节食_挑战后仅回复_33_饱食度。\n\n加点减少进食回合消耗天赋的情况下，进食不再消耗回合。\n\n_安魂酊剂的具体生成：_\n\n加点天赋后，根据天赋等级，商店会额外出售2~3瓶安魂酊剂(每瓶原始价格为5金币)。若商店生成时未加点天赋，则已生成的商店不会额外出售安魂酊剂。

custom.dict.dict.potion_brews =魔药
custom.dict.dict.potion_brews_d =魔药配方见炼金指南，下为效果总览：\n\n_紊乱魔药：_饮用时从主要为饮用效果的药剂中随机生效一瓶(治疗/灵视/极速/隐形/浮空/净化/经验)，扔出时从主要为扔出效果的药剂中随机生效一瓶(冰霜/液火/毒气/浮空/麻痹/净化)。\n随机的药剂权重大部分都为2，除了治疗为3(开启_恐药异症_挑战则为0)、力量为0、经验为1。\n\n_淤泥魔药：_对7x7范围内的生物造成20回合腐蚀淤泥。\n\n_冰暴魔药：_产生总计1080单位的暴雪，从中心向周围8格的空地扩散每格120容量的气体。\n在暴雪中的生物每回合受到两次3回合的冻伤施加(在水中每次额外造成2回合冻伤)，大于等于10回合时转为冻结。\n\n_雷鸣魔药：_产生7x7范围的电场，持续20回合。\n在电场中的生物会被麻痹并每2回合受到一次_0~2+楼层数/5_的电击伤害，而在电场中的法杖及魔杖则每回合回复1/3点充能(英雄持有法杖处于电场中不算)。\n\n_炼狱魔药：_产生总计1080单位的狱火，从中心向周围8格的空地扩散每格120容量的气体。\n在狱火中的生物每回合获得燃烧。\n\n_水爆魔药：_将3x3范围的地格变为水，5x5范围最外圈的地格则每格有2/3的概率变为水。\n能够清除变为水的地格处的火焰，同时会将落点处或与落点处相邻的生物击退2格。\n中心击退方向与丢出方向相同，往英雄身上丢则是随机方向。\n对落点处的_火属性_生物造成_5+楼层数~10+楼层数*2_点伤害，与落点处相邻则只受到前者2/3的伤害。

custom.dict.dict.potion_elixirs =秘药
custom.dict.dict.potion_elixirs_d =秘药配方见炼金指南，下为效果总览：\n\n_圣愈蜜药：_额外回复150饱食度的治疗药剂，或是可扔出使用的治疗药剂，扔向金色蜜蜂时能使其变为可跟随下楼的盟友。\n\n_水灵秘药：_在水中时每回合回复_英雄最大生命2%_的生命，不在水中时治疗量不会减少，总治疗量为_英雄最大生命*1.5_。\n\n_抗魔秘药：_获得每80回合衰减一次的_0~5+英雄等级/2_点魔法减伤。\n\n_晶触秘药：_获得50回合寒霜之力(免疫冻伤和冻结，每次物理攻击会造成3回合冻伤)。\n\n_毒粹秘药：_获得50回合毒素之力(直到效果结束后的5回合内都免疫中毒且不受毒气影响，自身及周围8格会不断产生6单位毒气)。\n\n_龙血秘药：_获得50回合烈焰之力(免疫燃烧，每次物理攻击会造成8回合燃烧，还会使践踏过的草地变为余烬)。\n\n_羽落秘药：_获得50回合羽落(免疫坠落伤害，每次坠落减少10回合持续时间)。\n\n_根骨秘药：_力量永久+1，并在5级英雄等级之内最多增加_4+最大生命/20_的最大生命。

custom.dict.dict.potion_exp =经验药剂
custom.dict.dict.potion_exp_d =饮用后立刻提升1级英雄等级，英雄等级30级后饮用会给予30回合赐福。\n\n对应_星陨花_之种。\n\n_神意启发合剂：_使指定层的天赋获得两个额外天赋点，每层仅可用一次。\n\n_星陨花_践踏效果：获得30回合赐福。\n\n_守望者_践踏星陨花：额外获得30回合法杖充能效果。

custom.dict.dict.potion_frost =冰霜药剂
custom.dict.dict.potion_frost_d =产生3x3范围的寒气，持续10回合，每回合造成3回合冻伤，在水中额外造成2回合冻伤，大于等于10回合时转为冻结。\n\n对应_冰冠花_之种。\n\n_极速冰冻合剂：_3x3范围立即冻结并缠绕10回合。\n\n_冰冠花_践踏效果：3x3范围立即冻结10回合。\n\n_守望者_践踏冰冠花：同时获得15回合寒霜之力。

custom.dict.dict.potion_haste =极速药剂
custom.dict.dict.potion_haste_d =饮用后获得20回合极速，使英雄移动速度变为3倍。\n\n对应_速行蓟_之种。\n\n_精力回复合剂：_饮用后获得100回合体力充沛，使英雄移动速度提高50%。\n\n_速行蓟_践踏效果：获得5回合时间气泡。\n\n_守望者_践踏速行蓟：额外获得1回合极速。

custom.dict.dict.potion_healing =治疗药剂
custom.dict.dict.potion_healing_d =饮用后获得_14+英雄最大生命*0.8_的治疗量，同时清除中毒、残废、虚弱、易伤、流血、失明、迟缓、眩晕和催眠效果。\n\n治疗药剂无论是敌人掉落还是炼金酿造都有获取上限(财富之戒除外)。\n\n开启_恐药异症_挑战后：治疗药剂、奥术护盾合剂、再生炸弹、圣愈蜜药、水灵秘药、阳光果改为造成_4+英雄等级/2_回合中毒。\n\n对应_阳春草_之种。\n\n_奥术护盾合剂：_饮用后获得_10+英雄最大生命*0.6_点护盾，每回合衰减1点。\n\n_阳春草_践踏效果：获得治疗总量等同于最大生命的草药疗养，每回合回复_(40+最大生命)/150_点生命，移动后失去该效果。\n\n_守望者_践踏阳春草：改为获得总量等同于英雄最大生命的治疗量，每回合回复1点生命。

custom.dict.dict.potion_inv =隐形药剂
custom.dict.dict.potion_inv_d =饮用后获得20回合隐形，期间无法被敌人看见，攻击敌人或使用法杖、神器和卷轴会立即失去该效果。\n\n对应_致盲草_之种。\n\n_暗夜迷雾合剂：_产生共计1080单位的烟幕，从中心向周围8格的空地扩散每格120容量的气体。烟幕可以阻挡敌人的视野且当敌人在烟幕内时仅有3x3的视野，英雄与盟友不受影响。\n\n_致盲草_践踏效果：造成10回合失明与残废。\n\n_守望者_践踏致盲草：改为获得10回合隐形。

custom.dict.dict.potion_fly =浮空药剂
custom.dict.dict.potion_fly_d =饮用后获得20回合飘浮，不会惊醒不与英雄相邻的敌人，能够无视一切地面效果如陷阱、特殊植物、深渊等，同时还会解除缠绕效果。\n\n扔出后则会产生共计1000单位的致眩气体，处于致眩气体中的生物会直接获得2回合眩晕。\n\n对应_风暴藤_之种。\n\n_暴风骤雨合剂：_产生共计1080单位的暴雨，从中心向周围8格的空地扩散每格120容量的气体。暴雨覆盖的地格都会变为水。\n\n_风暴藤_践踏效果：获得10回合眩晕。\n\n_守望者_践踏风暴藤：改为获得10回合飘浮。

custom.dict.dict.potion_fire =液火药剂
custom.dict.dict.potion_fire_d =产生3x3范围的火焰，持续2回合。\n\n对应_烈焰花_之种。\n\n_火龙吐息合剂：_相当于一次消耗2点充能的焰浪法杖(喷出6格火焰)，但喷火本身没有伤害，只是造成燃烧。\n\n_烈焰花_践踏效果：原地产生2回合火焰。\n\n_守望者_践踏烈焰花：同时获得15回合烈焰之力。

custom.dict.dict.potion_vision =灵视药剂
custom.dict.dict.potion_vision_d =饮用后获得20回合灵视，直接获取本层生物3x3的视野，与能够遮挡视野的地形(如门、高草、墙体等)相邻时还会拥有地形后1格的视野。\n\n对应_消逝草_之种。\n\n_魔能透视合剂：_饮用后获得50回合魔能透视，拥有12格视野并且会完全透视，同时免疫失明效果。\n\n_消逝草_践踏效果：随机传送。\n\n_守望者_践踏消逝草：回到上一层的下楼楼梯口处，对于第1层则是固定传送至下楼楼梯口。处于背水一战、拥有Yendor护符或在巨魔铁匠任务层时则只是随机传送。

custom.dict.dict.potion_paralyse =麻痹药剂
custom.dict.dict.potion_paralyse_d =产生共计1000单位的麻痹气体，处于麻痹气体中的生物会直接获得10回合麻痹。\n\n对应_地缚根_之种。\n\n_大地护甲合剂：_获得每50回合衰减一次的_0~2+英雄等级/3_点树肤。\n\n_地缚根_践踏效果：获得总量等于最大生命的植被护甲，每次能够吸收_(楼层数+5)/2_点伤害并消耗等同于吸收伤害的护甲量。\n\n_守望者_践踏地缚根：改为获得每5回合衰减一次的_0~5+英雄等级_点树肤。

custom.dict.dict.potion_purify =净化药剂
custom.dict.dict.potion_purify_d =饮用后获得20回合净化屏障，期间免疫一切环境效果(如火墙、火焰、寒气、气体等)。\n\n扔出后则会清除7x7范围的环境效果。\n\n对应_魔皇草_之种。\n\n_全面净化合剂：_饮用后回复450饱食度并清除绝大部分减益效果，也可对其他生物扔出使用，同时还会获得5回合全面净化，期间不会获得减益。\n\n_魔皇草_践踏效果：清除中毒、残废、虚弱、易伤、流血、失明、迟缓、眩晕和催眠效果。\n\n_守望者_践踏魔皇草：同时获得10回合净化屏障。

custom.dict.dict.potion_str =力量药剂
custom.dict.dict.potion_str_d =饮用后力量永久+1。\n\n力量药剂不可再生，每个区域共2瓶，分别分布在区域内除Boss层外的前两层和后两层，不可被冻碎、炸碎、解离等方式破坏但可以摔碎以及炼金分解。\n\n对应_腐莓_之种，仅可通过老杖匠的腐莓任务获得一粒。\n\n_肌肉记忆合剂：_使一件武器或护甲的力量需求永久-2，不可对已经使用过的武器或护甲使用。\n\n_腐莓_践踏效果：产生共计100单位的毒气。\n\n_守望者_践踏腐莓：改为获得200回合力量激发，期间力量+1。

custom.dict.dict.potion_gas =毒气药剂
custom.dict.dict.potion_gas_d =产生共计1000单位的毒气，处于毒气中的生物每回合受到_1+楼层数/5_点伤害。\n\n对应_断肠苔_之种。\n\n_腐蚀酸雾合剂：_产生共计225单位的腐蚀酸雾，从中心向周围8格的空地扩散每格25容量的气体。处于腐蚀酸雾中的生物会直接获得1回合起始伤害为_2+楼层数/5_的酸蚀。\n\n_断肠苔_践踏效果：获得_5+楼层数*2/3_回合的中毒。\n\n_守望者_践踏断肠苔：改为获得15回合毒素之力。

custom.dict.dict.scroll_identify =鉴定卷轴
custom.dict.dict.scroll_identify_d =选择背包内未鉴定的物品进行鉴定以得到完整的信息。\n\n_预知秘卷：_在本局游戏中永久鉴定随机四种药剂、卷轴或是戒指，未必会是背包内拥有的。\n\n_感知符石：_通过对现有的药剂、卷轴或是戒指进行猜测以试图鉴定，总共可以使用两次。\n\n除去随机的符石生成和拆解鉴定卷轴获得，感知符石还会在每局游戏第一区域的前3层固定生成一块。

custom.dict.dict.scroll_sleep =催眠卷轴
custom.dict.dict.scroll_sleep_d =给予英雄及视野内的生物5回合催眠，催眠结束后英雄和视野内的生物会进入魔法睡眠，进入魔法睡眠的敌人不受到伤害不会醒来(当然依旧会因为盛怒卷轴、警报陷阱等方式惊醒)，英雄和盟友还会因此每回合回复1点生命直到生命回满或是受伤才会醒来。\n\n_魅音秘卷：_选择一个非Boss敌人使其沉沦变为永久盟友，而视野内的其它敌人会被英雄魅惑10回合(Boss则为5回合)。\n\n_沉睡符石：_使目标进入魔法睡眠。

custom.dict.dict.scroll_mapping =探地卷轴
custom.dict.dict.scroll_mapping_d =揭示本层所有地形、隐藏陷阱和隐藏门。\n\n_先见秘卷：_获得400回合危险预知，期间会像先见护符那样自动探查周围8格的地形。\n\n_明示符石：_范围20格的探查，不受地形影响。

custom.dict.dict.scroll_image =镜像卷轴
custom.dict.dict.scroll_image_d =产生2个英雄的镜像，只有1点生命且没有防御，精准和闪避与英雄一致，造成的伤害为英雄的一半，攻击继承武器的特性和附魔但不享受附魔加成。\n\n_虹卫秘卷：_产生1个虹光幻像，在英雄被视野内的敌人锁定时会出现，视野内无敌人锁定英雄时则消失变为虹光守卫效果，效果期间幻像每10回合回复1点生命。\n\n幻像继承了英雄的所有防御(包括树肤)、精准和闪避，护甲特性和刻印也被一并继承但不享受刻印加成，同时拥有_10+英雄等级*2.5_点生命和_2+英雄等级/4~4+英雄等级/2_点攻击。\n\n幻像生命为0后的5回合内仍会存在，期间无法行动，也不会被敌人选中，但可被治疗。\n\n幻像存在时再次阅读这张秘卷将会为其回复所有生命。\n\n_羊群符石：_生成5x5范围的魔法绵羊，持续8回合。

custom.dict.dict.scroll_retribution =复仇卷轴
custom.dict.dict.scroll_retribution_d =对视野内除英雄外的所有生物造成_生物最大生命*0.1+生物当前生命*0.225*增幅_点魔法伤害(Boss对其拥有抗性)，其中增幅为_英雄失血比*4.45_且上限为4，同时造成10回合失明，对于英雄则会造成10回合失明和20回合虚弱。\n\n_灵爆秘卷：_对视野内所有生物造成_生物最大生命*0.5+生物当前生命*0.5_点魔法伤害(Boss对其拥有抗性)，同时造成10回合失明，对于英雄则会造成_英雄最大生命*0.5*0.9^视野内生物数量_点魔法伤害，同时造成10回合失明和100回合虚弱。\n\n_震爆符石：_相当于直接爆炸的炸弹。

custom.dict.dict.scroll_challenge =盛怒卷轴
custom.dict.dict.scroll_challenge_d =将本层所有敌人吸引至英雄阅读卷轴时所处的地格，同时对视野内的所有敌人造成5回合狂乱，受这一效果影响的敌人会优先攻击距离最近的敌人，且在锁定目标后会无视地形(陷阱、深渊等)进行移动。\n\n_决斗秘卷：_创建一个至多7x7范围(可视区域的地格越多范围越大，处于Boss层会减小这一范围)的决斗区域，持续100回合，区域内英雄获得33%的高优先级减伤并且行动不会消耗饱食度，同时将本层敌人吸引至英雄阅读秘卷时所处的地格。\n\n_敌意符石：_造成20回合众矢之的(对于Boss和小Boss只会持续5回合)，使其他敌人强制对其进行攻击。

custom.dict.dict.scroll_recharging =充能卷轴
custom.dict.dict.scroll_recharging_d =获得30回合法杖充能，每回合为法杖及魔杖回复0.25点充能。\n\n_魔能秘卷：_获得30回合神器充能。\n\n_电击符石：_使5x5范围内的生物麻痹1回合，并为背包内的所有法杖及魔杖回复_1+受影响生物数量_点充能。

custom.dict.dict.scroll_uncurse =祛邪卷轴
custom.dict.dict.scroll_uncurse_d =选择背包内完全未鉴定或确定被诅咒的武器、护甲、神器、戒指或法杖进行祛邪以消除上面的诅咒，若完全未鉴定但无诅咒则无事发生。\n\n_驱魔秘卷：_获得20回合魔法免疫，期间不会受到任何魔法伤害且无视一部分特殊能力(如魔像的传送)，但身上的诅咒、附魔和刻印会停止生效(可以随意装卸诅咒装备)，法杖和卷轴等魔法道具会无法使用，戒指和神器也不会提供任何加成，此外法杖和神器的充能以及干枯玫瑰召唤的悲伤幽灵的生命回复都会被暂停。\n\n_探魔符石：_确定未鉴定装备是否拥有等级和诅咒，有等级会提示正面魔法影响，有诅咒会提示诅咒魔法影响，两者都有都会提示，都无则提示无任何魔法。\n\n_拆除符石(暂时移除)：_使17x17范围内的9个陷阱永久失效，优先使距离落点直线距离更近的陷阱失效。

custom.dict.dict.scroll_tp =传送卷轴
custom.dict.dict.scroll_tp_d =进行随机传送并解除缠绕效果，无法传送至被上锁或被隐藏的区域，优先传送至未探索区域，仅隐藏区域未被探索时优先传送至隐藏门附近并立即发现隐藏门。\n\n_归返秘卷：_回到本区域初始楼层的上楼楼梯口处，如果已经处于一个区域的初始楼层，则回到上一区域初始楼层的上楼楼梯口处。处于背水一战、拥有Yendor护符或在巨魔铁匠任务层时则不会生效。\n\n_闪现符石：_瞬移至落点处并解除缠绕效果，无距离限制。

custom.dict.dict.scroll_terror =恐惧卷轴
custom.dict.dict.scroll_terror_d =对视野内的所有敌人造成20回合恐惧，受这一效果影响的敌人会往远离英雄的方向逃跑，每次受到伤害会降低5回合持续时间。\n\n_梦魇秘卷：_对视野内的所有敌人造成20回合魂飞魄散，受这一效果影响的敌人会以2倍移动速度往远离英雄的方向逃跑，在离开英雄的视野后永久消失，每次受到伤害会降低5回合持续时间，对于Boss和小Boss则改为造成20回合恐惧。\n\n_恐惧符石：_造成20回合恐惧。

custom.dict.dict.scroll_meta =蜕变卷轴
custom.dict.dict.scroll_meta_d =选择一个天赋进行蜕变，蜕变前需指定天赋类型以使对应类型的天赋的出现概率提高6倍(选择法术类则选项必定都为法术类天赋)，在指定所选天赋类型后随机给予4个天赋选项进行四选一。\n\n蜕变卷轴除了天赋获取外不可再生，每个区域共4张，不可被烧毁、炸毁、解离等方式破坏但可以炼金分解。\n\n_升华秘卷：_击败Boss会掉落对应的升华秘卷，可使对应的空白天赋升华为选择的Boss天赋，同时还会在对应的天赋层给予一个额外天赋点(_5层Boss_提供的天赋点在_1层_，_10层和15层Boss_提供的天赋点在_2层_，_20层和25层Boss_提供的天赋点在_3层_)。

custom.dict.dict.scroll_alter =嬗变卷轴
custom.dict.dict.scroll_alter_d =选择背包内的可选物品会将其嬗变为随机的同类物品并保留已有的升级、强化、附魔和刻印，对于药剂和卷轴则会分别嬗变为对应的合剂和秘卷，反之亦然。\n\n_升变秘卷：_在嬗变卷轴的基础上可使武器和护甲提升阶数，无法对最高阶的护甲或是英雄护甲等特殊装备使用。\n\n_强化符石：_强化装备的一种属性，但会减弱另一种属性。再次对已强化的装备使用可以改为强化另一种属性或是取消强化。\n\n武器强化速度会使攻击延迟_降低至0.667倍_，伤害_降低至0.7倍_，若为投掷武器则还会使耐久_提高至1.5倍_。\n\n武器强化伤害会使伤害_提高至1.5倍_，攻击延迟_提高至1.667倍_，若为投掷武器则还会使耐久_降低至0.667倍_。\n\n护甲强化闪避会使最高防御_降低2+护甲等级_，闪避_增加4+护甲等级*2_。\n\n护甲强化防御会使最高防御_增加2+护甲等级_，闪避_降低4+护甲等级*2_。\n\n除去拆解嬗变卷轴获得，强化符石还会在每局游戏的6，11，16和20层的商店固定出售一块。

custom.dict.dict.scroll_upgrade =升级卷轴
custom.dict.dict.scroll_upgrade_d =选择背包内的可选物品进行升级，因而提升武器伤害及投掷武器耐久、护甲防御、戒指效果、法杖伤害及充能上限。\n\n每次升级必定消除武器或护甲的诅咒(诅咒附魔或诅咒刻印则是1/3的概率消除)，对于戒指或法杖的诅咒则是1/3的概率消除。\n\n从4级(硬化后为6级)开始升级武器或护甲会概率消除正面附魔或正面刻印，8级(硬化后为10级)或更高等级升级则必定消除。_4~7_级(硬化后为_6~9_级)升级的消除概率：_10%_，_20%_，_40%_，_80%_。\n\n升级卷轴不可再生，每个区域共3张，不可被烧毁、炸毁、解离等方式破坏但可以炼金分解。\n\n开启_禁忌咒文_挑战后，一局游戏的升级卷轴数量会从15张变为8张，以21212分布在5个区域。\n\n_注魔秘卷：_附魔/刻印三选一，第一个选项是常见附魔/刻印，第二个选项是稀有附魔/刻印，第三个选项是随机附魔/刻印。\n\n_附魔符石：_给武器/护甲施加随机附魔/刻印。\n\n在3层天赋_强力符文_的影响下，附魔符石可像注魔秘卷那样发挥功能，只不过第一个选项是随机附魔/刻印，第二个选项是常见附魔/刻印，第三个选项是稀有附魔/刻印。\n\n除去隐藏的符石房和拆解升级卷轴获得，附魔符石还会在每局游戏除Boss层外的6~19层固定生成一块。

custom.dict.dict.spell_spells =结晶法术
custom.dict.dict.spell_spells_d =结晶法术配方见炼金指南，下为效果总览：\n\n_无序结晶：_视野内无敌人时随机触发一张非战斗类卷轴(鉴定/祛邪/充能/传送/催眠/探地/嬗变)，有敌人时则随机触发一张战斗类卷轴(镜像/充能/传送/催眠/盛怒/复仇/恐惧)。\n随机的卷轴权重大部分都为2，除了鉴定为3、升级为0、嬗变为1。\n\n_蜕变结晶：_在指定所选天赋类型后定向选择一个类型中的天赋。\n\n_蜕变棱晶：_将已取得的Boss天赋替换为同位置的候选天赋，也能在具有扩展天赋池的专精内蜕变专精天赋。进入候选天赋界面后取消仍会消耗棱晶。\n\n_强能结晶：_随机触发一种诅咒法杖的效果，同时获得4(瞬间生效)+8(缓慢生效)回合的法杖充能与神器充能效果。\n\n_念力结晶：_抓取物品或是卡在角色身上的所有投掷武器。\n\n_转移结晶：_将目标进行随机传送，除了Boss和小Boss以外的目标会在传送后麻痹10回合。\n\n_炼金菱晶：_将物品转化为对应价值的金币或炼金能量。\n\n_诅咒菱晶：_诅咒一件物品，覆盖原有的附魔或刻印，提供_1+物品等级/6_的额外等级(向下取整)。\n对于武器和护甲，提供的额外等级与诅咒附魔或诅咒刻印绑定，在诅咒附魔或诅咒刻印被消除后会失去额外等级。\n对于法杖，提供的额外等级则与诅咒绑定，并且不会覆盖奥术树脂提供的等级。\n对于戒指，不会提供额外等级，仅诅咒。\n\n_注魔菱晶：_不会消除附魔或刻印的升级卷轴。\n\n_转换菱晶：_将药剂、卷轴、种子、符石和涂药飞镖转换为一个随机的同类物品。\n\n_陷阱晶柱：_能够选取陷阱释放以储存陷阱，再次释放会产生陷阱效果，只在产生陷阱效果时消耗1个。\n\n_唤魔晶柱：_使用前可灌注物品改变能够召唤出的元素：未灌注默认为新生火焰元素，灌注液火药剂为火焰元素，灌注冰霜药剂为冰霜元素，灌注充能卷轴为电光元素，灌注嬗变卷轴为混沌元素。\n召唤出的元素为盟友，属性与楼层数有关，不会跟随英雄下楼，每次召唤会消耗1个。\n\n_返回晶柱：_原地设置一个点位(之后使用可选择重设)，之后使用可随时返回，只在返回时消耗1个。

custom.dict.dict.enforcers_details = 强化道具
custom.dict.dict.enforcers_details_d =强化道具配方见炼金指南，下为效果总览：\n\n_液金：_可以修复投掷武器的耐久甚至是补全一组投掷武器。\n修复投掷武器会消耗_5*(武器阶数+1)*(1.33^武器等级)*(1-当前耐久/100)_滴液金(向上取整)。\n每件投掷武器可转化为_5*(武器阶数+1)*(1.33^武器等级)*(0.25+0.75*剩余耐久比例)_滴液金(向下取整，且计算时武器等级最高取3)。\n\n_奥术树脂：_每根法杖可转化为_2+法杖等级*2_个奥术树脂，可消耗1/2/3个奥术树脂将0/1/2级的法杖升级到1/2/3级。\n奥术树脂提供的等级会被其他来源的升级覆盖(例如0级法杖被奥术树脂提升为1级后，再次使用升级卷轴依旧为1级)，并且被法师魔杖灌注后不会保留。\n\n_圣典拓本：_相当于一次性的神圣法典，拥有8点充能上限，可以消耗充能施放法术，充能不会自然回复。

##**********************armor

custom.dict.dict.armor_cloth =布甲
custom.dict.dict.armor_cloth_d =_1_阶护甲，_10_力量需求，_0~2_基础防御，_1~1_防御成长。\n\n开启_信念护体_挑战后：_0~2_基础防御，_0~1_防御成长。

custom.dict.dict.armor_epic=英雄护甲
custom.dict.dict.armor_epic_d = 英雄护甲由矮人国王的皇冠升级护甲而来，继承了原来护甲的所有属性。\n\n英雄护甲每回合回复_0.2_护甲充能。

custom.dict.dict.armor_leather =皮甲
custom.dict.dict.armor_leather_d =_2_阶护甲，_12_力量需求，_0~4_基础防御，_1~2_防御成长。\n\n开启_信念护体_挑战后：_0~3_基础防御，_0~1_防御成长。

custom.dict.dict.armor_mail =链甲
custom.dict.dict.armor_mail_d =_3_阶护甲，_14_力量需求，_0~6_基础防御，_1~3_防御成长。\n\n开启_信念护体_挑战后：_0~4_基础防御，_0~1_防御成长。

custom.dict.dict.armor_plate =板甲
custom.dict.dict.armor_plate_d =_5_阶护甲，_18_力量需求，_0~10_基础防御，_1~5_防御成长。\n\n开启_信念护体_挑战后：_0~6_基础防御，_0~1_防御成长。

custom.dict.dict.armor_scale =鳞甲
custom.dict.dict.armor_scale_d =_4_阶护甲，_16_力量需求，_0~8_基础防御，_1~4_防御成长。\n\n开启_信念护体_挑战后：_0~5_基础防御，_0~1_防御成长。

custom.dict.dict.armor_slime =粘液护甲
custom.dict.dict.armor_slime_d =_史莱姆娘_初始携带的特殊护甲。无法被卸下或是与其他护甲进行更换。\n\n初始为_1_阶护甲，会在英雄等级为_6，12，18，24_时提升1阶。\n\n力量需求时刻与英雄的力量一致(但不会因为根骨之戒等效果提供的额外力量的增减进行变化)。\n\n其防御及防御成长属性与对应阶数的常规护甲一致(如1阶对应布甲，2阶对应皮甲，依次类推)。\n\n本身无法进行升级，但会在英雄等级为_3，9，15，21，27_时提升1级。\n\n无法对其使用诅咒菱晶，但_史莱姆娘_可以_食用邪能碎片_从而达到一样的效果。

custom.dict.dict.armor_glyph_1 =常见刻印
custom.dict.dict.armor_glyph_1_d =常见刻印每个均有_12.5%_的概率出现。\n\n_晦暗刻印：_增加_1+护甲等级/3_点潜行值，可以降低被敌人发现的概率且随等级成长。\n被睡眠敌人发现的概率为_1/(距离+潜行值)_。\n被游荡敌人发现的概率为_1/(距离/2+潜行值)_。\n受该刻印影响，_格斗宗师_会获得_潜行值*5%_的额外伏击伤害加成。\n\n_迅捷刻印：_在移动至下一格时，若与敌人相距距离保持在大于等于3格的情况(与最近的敌人相距大于等于2格且下一格周围3格没有敌人)，则移动速度提升至_1.2+护甲等级*0.04_倍。\n受该刻印影响，_格斗宗师_会获得_迅捷刻印提供的移速加成*0.75_的近战攻速加成。\n\n_粘稠刻印：_将经过护甲减免过的(不包括其它防御)伤害以_(护甲等级+1)/(护甲等级+6)_的比例转为延缓伤害。\n受该刻印影响，_格斗宗师_的每次物理攻击命中时都会清除当前一半的延缓伤害并将之加成到攻击造成的伤害上。\n\n_电势刻印：_每次受到攻击都有_(护甲等级+1)/(护甲等级+6)_的概率为背包内的所有法杖及魔杖回复1点充能。\n受该刻印影响，_格斗宗师_的每次近战攻击命中时都会为背包内的所有法杖及魔杖回复0.5点充能。

custom.dict.dict.armor_glyph_2 =稀有刻印
custom.dict.dict.armor_glyph_2_d =稀有刻印每个均有_6.67%_的概率出现。\n尽管此处称这些刻印为稀有刻印，但这些刻印都能被2层天赋_刻印转移+1_进行转移。\n\n_狱火刻印：_免疫燃烧效果。\n受该刻印影响，_格斗宗师_在火焰中会获得持续3回合的烈焰之力。\n\n_磐岩刻印：_该刻印会让使用者无法闪避，但在根据我方闪避与敌方精准属性计算出闪避概率后，此概率的_75%_会转化为优先于护甲减免的百分比减伤。\n受该刻印影响，_格斗宗师_会获得等同于闪避属性的额外精准属性。\n\n_缠绕刻印：_每次受到攻击都有25%概率获得_2*护甲等级+5_点植被护甲。植被护甲每次能够吸收_(楼层数+5)/2_点伤害并消耗等同于吸收伤害的护甲量。\n受该刻印影响，_格斗宗师_的每次近战攻击命中时都会有_当前植被护甲量*5%_的概率附带随机一种有害植物效果，触发后会减少_(楼层数+5)/2_点植被护甲。特别的是，触发冰冠花效果时会因此获得1回合的寒霜之力。\n\n_反斥刻印：_每次被相邻单位击中都有_(护甲等级+1)/(护甲等级+5)_的概率将攻击者沿攻击反方向击退2格。\n受该刻印影响，因攻击_格斗宗师_而被刻印击退的攻击者会额外受到_英雄等级*0.5_的无视护甲的伤害。\n\n_迷彩刻印：_践踏高草会获得_3+护甲等级/2_回合的隐形。\n受该刻印影响，_格斗宗师_在生效该刻印的同时还会获得_隐形回合/4_回合的极速。\n\n_涌流刻印：_在移动至下一格时，若下一格为水，则移动速度提升至_2+护甲等级*0.5_倍。\n受该刻印影响，_格斗宗师_在水中会获得等同于英雄等级的额外闪避属性。

custom.dict.dict.armor_glyph_3 =罕见刻印
custom.dict.dict.armor_glyph_3_d =罕见刻印每个均有_3.33%_的概率出现。\n在这些刻印的描述以及一些天赋(如2层天赋_刻印转移+2_)的效果中，这些刻印还可被称为强力刻印。\n\n_魅惑刻印：_每次受到攻击都有_(护甲等级+3)/(护甲等级+20)_的概率魅惑攻击者8~12回合。\n受该刻印影响，_格斗宗师_物理攻击被魅惑的目标会因此回复_造成伤害*0.2_的生命。\n\n_敌法刻印：_提供_0~3_基础魔法减伤(魔法减伤可减免的魔法伤害包括法杖、敌方魔法攻击、解离与即死陷阱等)，_1~1.5_魔法减伤成长(随护甲等级进行成长)。\n受该刻印影响，_格斗宗师_的物理攻击会附带数值等同于魔法减伤的魔法伤害。\n\n_荆棘刻印：_每次受到攻击都有_(护甲等级+2)/(护甲等级+12)_的概率使攻击者获得原始值为_4+护甲等级_的流血。\n受该刻印影响，_格斗宗师_的物理攻击会附带原始值为_造成伤害*0.3_的流血。

custom.dict.dict.armor_glyph_4 =诅咒刻印
custom.dict.dict.armor_glyph_4_d =各个诅咒刻印的出现概率均等。\n\n_反熵诅咒：_每次受到攻击都有_1/8_的概率使穿戴者燃烧4回合并使周围一圈的单位冻结10回合。\n\n_腐蚀诅咒：_每次受到攻击都有_1/10_的概率以穿戴者为中心产生3x3范围的腐蚀淤泥，这一效果会存在10回合。\n\n_定相诅咒：_每次受到攻击都有_1/20_的概率进行随机传送。\n\n_代谢诅咒：_每次受到攻击都有_1/6_的概率将40饱食度直接转化为生命(与自然回复一样是以10比1的比例进行的转化)。\n\n_分身诅咒：_每次受到攻击都有_1/20_的概率复制攻击方或是产生镜像。对于Boss、小Boss、宝箱怪与石像敌人则是会生成一个同区域的常规敌人。\n\n_恶臭诅咒：_每次受到攻击都有_1/8_的概率施放250单位毒气。\n\n_丛生诅咒：_每次受到攻击都有_1/20_的概率随机触发一种植物效果，这一效果_不会被守望者进行增益_。\n\n_臃肿诅咒：_在移动至下一格时，若下一格为门，则此次移动_所需的回合*3_。\n\n_灌铅诅咒：_护甲力量需求+2。

custom.dict.dict.armor_glyph_5 =神圣刻印
custom.dict.dict.armor_glyph_5_d =在施放圣典或圣典拓本的初始法术_神圣护甲_后的50回合内，施法者身上的护甲会获得神圣刻印，这一刻印会提供_1_点防御，同时还会覆盖护甲原有的刻印效果直至持续时间结束。\n\n_圣骑士_的神圣刻印会得到强化，变为提供_3_点防御，并且不再会覆盖护甲原有的刻印效果而是与之共存，同时生效期间内消耗的每点圣典充能都会延长其10回合的持续时间。


##**************************** artifact


custom.dict.dict.artifact_toolkit =炼金工具箱
custom.dict.dict.artifact_toolkit_d =装备后，每回合增加_100/[(10-神器等级)^2]_预热，达到100预热后可进行快捷炼金(10级后无需预热即可进行快捷炼金)。\n\n可以消耗炼金能量进行升级，升1级需要消耗6点炼金能量，最高10级。\n\n会随着英雄获得经验进行充能，每级经验可以提供_2+神器等级_点额外炼金能量。\n\n_神器充能_效果：每回合获得0.25点额外炼金能量。\n\n_诅咒_效果：无法提供额外炼金能量且会阻止使用者进行炼金(包括炼金釜)。\n\n护甲技能_三位一体_幻化效果：默认消耗25护甲充能进行快捷炼金。

custom.dict.dict.artifact_chalice =蓄血圣杯
custom.dict.dict.artifact_chalice_d =缩短自然生命回复所需时间：无圣杯时每隔10回合回复1点生命，有非诅咒圣杯时每隔_10-1.33-神器等级*0.667_回合回复1点生命(相当于缩短至8~2回合)。\n\n通过血祭进行升级，最高10级。每次血祭造成_3+2.5*神器等级^2~7+3.5*神器等级^2_点伤害(最低伤害向上取整，最高伤害向下取整)，血祭伤害可以被_护甲防御、魔法减伤(如敌法刻印、元素之戒)、百分比减伤(如决斗秘卷)_等各种形式的伤害减免降低。\n\n因血祭死亡通过未祝福的十字架复活后，不会提升等级。而用祝福的十字架抵挡血祭造成的致命伤害则可以提升等级，但无敌期间无法进行血祭。\n\n_神器充能_效果：非极度饥饿状态下每回合额外获得_自然生命回复5倍_的生命回复。\n\n_诅咒_效果：无法进行血祭且会让自然生命回复所需时间延长33%。\n\n护甲技能_三位一体_幻化效果：默认消耗25护甲充能获得20回合4/6/8/10级蓄血圣杯加快自然生命回复的效果。

custom.dict.dict.artifact_cloak =暗影斗篷
custom.dict.dict.artifact_cloak_d =_盗贼_初始携带的特殊神器。最大充能数为_3+神器等级_(不会超过10点)，每消耗1点充能可以获得4回合影遁(相当于隐形)，每_45-已损充能数_回合回复1点充能，在高于7级时充能回复所需时间还会降低_(神器等级-7)*5/3_回合。\n\n每次升级需要_50+神器等级*50_的神器经验，最高10级。每消耗1点充能可以获得10神器经验。\n\n每级对应的标准英雄等级为1，3，5，7，9，11，13，16，19，22，当前英雄等级每高于标准英雄等级1级则获得的神器经验*1.1，每低于1级则*0.75。\n\n_神器充能_效果：每回合获得0.25点充能。\n\n_诅咒_效果：无法使用。\n\n护甲技能_三位一体_幻化效果：默认消耗25护甲充能获得4/6/8/10回合的隐形。

custom.dict.dict.artifact_cape =荆棘斗篷
custom.dict.dict.artifact_cape_d =充能满时可以释放，获得_10+神器等级_回合荆棘，期间受到攻击会对周围攻击使用者的生物反弹_护甲结算前所受伤害*0.05*神器等级~护甲结算前所受伤害_点物理伤害，并使本次护甲结算前所受伤害减少等同于反弹伤害的数值。\n\n最大充能数为100点，每次受到攻击可以获得_护甲结算前所受伤害*(0.5+0.05*神器等级)_点充能，同时每级经验可以回复_50+神器等级*5_点充能。荆棘效果期间无法进行充能。\n\n每次升级需要_100+神器等级*20_的神器经验，最高10级。英雄每升一级它就获得100神器经验。\n\n_神器充能_效果：每回合获得4点充能。\n\n_诅咒_效果：无法获得充能且每次使用者受到攻击都有10%的概率获得原始值为_生命比例*生命比例*最大生命/8_的流血。\n\n护甲技能_三位一体_幻化效果：默认消耗25护甲充能获得4/6/8/10回合的荆棘。

custom.dict.dict.artifact_rose =干枯玫瑰
custom.dict.dict.artifact_rose_d =在完成悲伤幽灵任务后可以召唤悲伤幽灵。\n\n悲伤幽灵拥有_神器等级*8+20_点生命，_英雄等级+9_点精准，_英雄等级+4_点闪避。\n\n可以为她进行配装(只能穿戴力量需求不超过_神器等级/2+13_的装备)，配装后的伤害与防御均为装备的面板数值。未配装时，她的伤害为_0~5_，防御为_0_。\n\n悲伤幽灵每回合回复0.2%的生命。\n\n悲伤幽灵消散后需要经过500回合(满100点充能)才能再次召唤。\n\n拥有已鉴定且未诅咒的干枯玫瑰并且完成了悲伤幽灵任务后，可在后续生成的楼层中找到干枯花瓣，拾取时提升1级，最高10级。\n\n干枯花瓣的具体生成：\n英雄每在地牢中通过2层就会解锁1片花瓣的生成，至多解锁11片花瓣的生成(多一片防止找不到，多余花瓣拾取时无效果)。\n此后每层都会尝试生成花瓣，生成时会生成_(已解锁花瓣数-已生成花瓣数)/3_(向上取整)片花瓣。\n\n_神器充能_效果：每回合获得4点充能，或是为悲伤幽灵每回合回复_1+神器等级/3_点生命。\n\n_诅咒_效果：使用者周围每回合都有1%的概率生成一个怨灵。\n\n护甲技能_三位一体_幻化效果：默认消耗50护甲充能召唤一个最大生命等同于4/6/8/10级悲伤幽灵的腐化怨灵。

custom.dict.dict.artifact_chain =虚空锁链
custom.dict.dict.artifact_chain_d =可以让使用者穿过生物和固定方块进行位移(_选取的位移落点周围需有固体方块_，即墙体、障碍物等)，也可以将远处的生物拉到使用者面前。无论何种使用方式都会消耗_位移距离_点充能。\n\n最高等级为_5_(显示等级等于实际等级*2)，充能阈值为_5+实际等级*2_，经过时间和获取经验都可以为其回复充能。\n\n_时间充能：_每_40-(阈值-当前充能数)*2_回合回复1点充能，不会超过阈值。\n_经验充能：_当前充能数低于阈值时，每级经验可以回复6点充能。当前充能数高于阈值时，每级经验回复的充能降低至_阈值/当前充能数_倍。\n\n每次升级需要_100+实际等级*100_的神器经验，英雄每升1级它就获得100神器经验。\n\n_神器充能_效果：当前充能数低于_10+实际等级*4_时每回合获得0.5点充能。\n\n_诅咒_效果：无法获得充能且每回合都有1%的概率使使用者获得10回合残废。\n\n护甲技能_三位一体_幻化效果：默认消耗35护甲充能使用相当于4/6/8/10格范围的虚空锁链。

custom.dict.dict.artifact_beacon =时空道标
custom.dict.dict.artifact_beacon_d =可以消耗1点充能对指定目标或使用者自身进行随机传送，也可以设置当前位置并在之后通过消耗3点充能以立即返回该位置。\n\n最高等级为_3_(显示等级等于实际等级*3.5，向下取整)，最大充能数为_3+实际等级_，每级经验可以回复_最大充能数_点充能。\n\n每次升级需要_15+实际等级*9_神器经验。释放传送魔法会获得4神器经验，释放归返魔法会获得12神器经验。\n\n_神器充能_效果：每回合获得0.133点充能。\n\n_诅咒_效果：无法获得充能和设置地点且每回合都有1%的概率使使用者获得10回合眩晕。\n\n护甲技能_三位一体_幻化效果：默认消耗50护甲充能使用时空道标的传送功能。

custom.dict.dict.artifact_holytome =神圣法典
custom.dict.dict.artifact_holytome_d =_牧师_初始携带的特殊神器。最大充能数为_3+神器等级_(不会超过10点)，可以打开法术窗口以消耗充能来施放基础和通过天赋获得的法术，每_45-已损充能数_回合回复1点充能，在高于7级时充能回复所需时间还会降低_(神器等级-7)*5/3_回合。\n\n每次升级需要_50+神器等级*50_的神器经验，最高10级。每消耗1点充能可以获得10神器经验。\n\n每级对应的标准英雄等级为1，3，5，7，9，11，13，16，19，22，当前英雄等级每高于标准英雄等级1级则获得的神器经验*1.1，每低于1级则*0.75。\n\n_神器充能_效果：每回合获得0.25点充能。\n\n_诅咒_效果：无法使用。

custom.dict.dict.artifact_horn =丰饶之角
custom.dict.dict.artifact_horn_d =每消耗1点充能就会回复90饱食度并能够触发进食相关天赋(小吃一口固定消耗1点充能，直接食用则会根据英雄的剩余饱食度来消耗充能，如剩余220饱食度则会消耗2点充能回复180饱食度至400饱食度，不会再多消耗1点充能导致回复的饱食度溢出)。\n\n最大充能数为_5+神器等级/2_，每级经验可以回复_1.25+神器等级*0.625_点充能。\n\n可以往里贮存食物进行升级，升级收益取决于食物能够回复的饱食度，每300饱食度即升1级(例外的是肉馅饼和幻影鱼肉升2级，而全肉大饼升4级)，最高10级。\n\n开启_缩餐节食_挑战后：每点充能仅回复30饱食度，但每级升级仅需贮存100饱食度的食物(和原先升级的贮存情况一致)。\n\n_神器充能_效果：每回合获得0.25点充能。\n\n_诅咒_效果：无法获得充能且会使进食回复的饱食度减少1/3。\n\n护甲技能_三位一体_幻化效果：默认消耗25护甲充能使用丰饶之角的小吃一口功能。

custom.dict.dict.artifact_armband =神偷袖章
custom.dict.dict.artifact_armband_d =消耗充能以窃取商店的物品，或是从敌人身上直接窃取到原有掉落物(不包括石像和宝箱怪等敌人的掉落物)。\n\n最大充能数为_5+神器等级/2_，每级经验可以回复3点充能。\n\n窃取商品时会尽可能消耗多的充能，每点充能会被视为_10+神器等级/2_的价值，价值大于商品原始价格(原始价格说明详情请见商店部分)则窃取必定成功，小于原始价格则窃取成功率为_充能价值/原始价格_。\n\n窃取敌人时固定消耗1点充能造成_3+神器等级/2_回合的失明和残废，拥有_1+神器等级*0.1_的窃取倍率，直接窃取到原有掉落物的概率为_掉落率*窃取倍率_。若能够进行伏击，则延长2回合造成的减益并增加0.5的窃取倍率。\n\n同一个敌人不能被多次窃取，当英雄等级超过这一敌人的掉落等级时无法窃取到原有掉落物，击杀已被窃取到了原有掉落物的敌人不会掉落原有掉落物。\n\n每次升级需要_10+神器等级*3.33_的神器经验，最高10级。窃取商品时每消耗1点充能可以获得4神器经验，窃取敌人时(无论是否成功)则获得3神器经验(伏击窃取为5神器经验)。\n\n_神器充能_效果：每回合获得0.1点充能。\n\n_诅咒_效果：无法获得充能且每5回合损失1金币。\n\n护甲技能_三位一体_幻化效果：默认消耗25护甲充能使用4/6/8/10级神偷袖章的窃取敌人效果。

custom.dict.dict.artifact_sandal =自然之履
custom.dict.dict.artifact_sandal_d =一共可以升级3次，每次升级分别需要_3，6，9粒不同的种子_。\n\n使践踏高草产生种子的概率变为_1/(21-4*升级次数)_，而产生露珠的概率变为_非满级1/5，满级1/4_。\n\n最大充能数为100点，每次践踏高草可以获得_(3+升级次数)/6_点充能，消耗一定充能可以使用扎根，在3格范围内选择一格触发最后一次喂食的种子对应的植物效果(需要目标地点视野但可穿过墙体触发)。\n\n各种子扎根所需充能如下：\n_腐莓：_8\n_消逝草/致盲草/魔皇草：_12\n_冰冠花/烈焰花/断肠苔/速行蓟/风暴藤：_20\n_地缚根/星陨花：_40\n_阳春草：_80\n\n_神器充能_效果：每回合获得2点充能。\n\n_诅咒_效果：无法获得充能且践踏高草不再获得种子和露珠(但丢出物品和其他生物踩踏仍然可以)。\n\n护甲技能_三位一体_幻化效果：默认消耗25护甲充能使用自然之履的随机有害植物扎根效果。

custom.dict.dict.artifact_key =骷髅钥匙
custom.dict.dict.artifact_key_d =可以消耗一定充能解开上锁的门或宝箱，也可以对一扇普通的门进行上锁，亦或是在使用者周围创建可以遮挡视野的临时墙体。\n\n最大充能数为_3+神器等级/2_(计算结果需向下取整)，每_120-已损充能数*7.5_回合回复1点充能。\n\n解开对应类型的锁需要消耗的充能数不同，常规铁锁为1点，金锁为2点，水晶锁为5点。\n\n进行上锁需要消耗2点充能，可以再次使用该神器不消耗充能地解开，如果门上有生物则上锁时会将该生物挤到与英雄最近但不相邻的地格。\n\n在使用者周围创造临时墙体需要消耗2点充能，墙体持续10回合，横向创建时为3格，斜向创建时则在3格的基础上在使用者周围多创建2格进行连接，可以遮挡视野并能阻止生物和投射物穿过，在对敌人所处位置创建时若敌人身后有空间则会直接将敌人击退1格。\n\n每次升级需要_4+神器等级_的神器经验，最高10级。开锁会获得_2+充能消耗_神器经验，上锁会获得2神器经验，创建临时墙体会获得2神器经验。\n\n_神器充能_效果：每回合获得0.133点充能。\n\n_诅咒_效果：无法获得充能且会使开锁有5/6的概率失败，每次开锁失败会消耗2倍的开锁时间并额外消耗4点饱食度。\n\n护甲技能_三位一体_幻化效果：默认消耗50护甲充能使用一次骷髅钥匙的任意功能(但无法解开水晶锁)。

custom.dict.dict.artifact_talisman =先见护符
custom.dict.dict.artifact_talisman_d =自装备后开始侦测使用者_处于视野范围的附近3格_内是否存有隐藏陷阱，若有则会出现提示：你感到很不安。\n\n最大充能数为100点，每回合回复_0.05+神器等级*0.005_点充能，每次发现隐藏陷阱回复2点充能，发现隐藏门则回复10点。\n\n可以消耗_3+探查距离*1.08_点充能探查一个锥形区域，探查的最大距离不超过_5+神器等级*2_格。\n\n探查范围内的所有隐藏陷阱和隐藏门会被揭露，使用者还会获得_5+神器等级*2_回合范围内所有敌人和物品的3x3视野。\n\n每次升级需要_100+神器等级*50_的神器经验，最高10级。探查到不同目标会获得不同的神器经验：新的地格为1，视野外的每个敌人或物品为10，隐藏陷阱为10，隐藏门为100。\n\n_神器充能_效果：每回合获得2点充能。\n\n_诅咒_效果：无法获得充能且每次搜索周围消耗的饱食度再翻一倍(6变12)，同时还会使被动侦查发现隐藏地形的概率全都降为0。\n\n护甲技能_三位一体_幻化效果：默认消耗35护甲充能使用4/6/8/10级先见护符的最大范围探查效果。

custom.dict.dict.artifact_hourglass =时光沙漏
custom.dict.dict.artifact_hourglass_d =可以消耗充能使自身时间停滞或是冻结周围时间，每_90-已损充能数*3_回合回复1点充能。\n\n停滞自身时间会跳过_消耗充能数*5_回合(默认消耗2点充能，但在当前充能数为1时仍可发动)，期间相当于一直原地不动且保持隐形，其他生物仍然会自由行动，饱食度消耗和自然生命回复的效果依然存在，结束时若不为极度饥饿则会返还期间消耗的饱食度。\n\n冻结周围时间可以持续_消耗充能数*2_回合(默认消耗1点充能，每持续2回合就消耗1点充能)，期间可以自由行动且自身拥有的其他效果不会降低持续时间，其他生物会静止不动，饱食度消耗和自然生命回复会停滞。\n\n最高等级为_5_(显示等级等于实际等级*2)，升级仅会增加充能上限，最大充能数为_5+实际等级_。拥有已鉴定且未诅咒的时光沙漏后，后续新生成的商店会出售魔力流沙(出售数量详情请见商店部分)，购买后提升1实际等级。\n\n_神器充能_效果：每回合获得0.25点充能。\n\n_诅咒_效果：无法获得充能且每回合有10%的概率跳过1回合。\n\n护甲技能_三位一体_幻化效果：默认消耗35护甲充能使用时光沙漏冻结周围时间4/6/8/10回合的效果。

custom.dict.dict.artifact_book =无序魔典
custom.dict.dict.artifact_book_d =最大充能数为_2+神器等级*0.6_(向下取整)，每_120-已损充能数*5_回合回复1点充能，消耗1点充能会随机触发一张卷轴效果(不包括升级和嬗变卷轴，并且触发鉴定、祛邪和探地卷轴的概率减半)。\n\n可以加入介绍中指出的卷轴(需已鉴定)进行升级，最高10级。随机到已加入的卷轴效果时，可以选择额外消耗1点充能改为触发其对应的秘卷效果。\n\n_神器充能_效果：每回合获得0.1点充能。\n\n_诅咒_效果：无法获得充能且会阻止使用者阅读除祛邪卷轴及其秘卷以外的卷轴和秘卷。\n\n护甲技能_三位一体_幻化效果：默认消耗50护甲充能随机触发一张卷轴效果，并有40%/60%/80%/100%的概率可以选择改为触发对应的秘卷效果。

custom.dict.dict.artifact_shuriken =手里剑箱
custom.dict.dict.artifact_shuriken_d =_忍者_初始携带的特殊神器。可以消耗1点充能掷出一枚基础伤害为_2~4_的小小手里剑(伤害分别在1，3，5，7，9神器等级时提升0~1，而在2，4，6，8，10神器等级时提升1~1)，这一伤害可以无视目标的护甲并有_0.1+神器等级*0.1_的概率造成3回合麻痹(不对因此被麻痹过的目标生效)。\n\n充能阈值为_5+神器等级*2_，经过时间和获取经验都可以为其回复充能。\n\n_时间充能：_每_40-(阈值-当前充能数)*2_回合回复1点充能，不会超过阈值。\n_经验充能：_当前充能数低于阈值时，每级经验可以回复6点充能。当前充能数高于阈值时，每级经验回复的充能降低至_阈值/当前充能数_倍。\n\n每次升级需要_100+神器等级*30_的神器经验，最高10级。英雄每升1级它就获得100神器经验。\n\n_神器充能_效果：当前充能数低于_10+神器等级*4_时每回合获得0.5点充能。\n\n_诅咒_效果：无法使用。\n\n护甲技能_三位一体_幻化效果：默认消耗25护甲充能掷出一枚相当于4/6/8/10级手里剑箱所能掷出的小小手里剑。

custom.dict.dict.artifact_tool =指令集合工具
custom.dict.dict.artifact_tool_d =_DM-400_初始携带的特殊神器。最大充能数为_3+(神器等级-1)_(不会低于3点也不会超过10点)，每_80-已损充能数*4_回合回复1点充能，可以消耗_1+当前无人机数量_点充能生产无人机协助作战，在转职前只能生产基础的僚机无人机，在转职后则能根据录入的卷轴选择生产对应的无人机。\n\n所有无人机效果：\n\n_僚机无人机(初始)：_拥有_3+英雄最大生命值*33%_点生命，_1~2_点防御，攻击造成_2+神器等级~2+神器等级*2_点伤害，精准、闪避、攻击速度和移动速度与英雄时刻一致，具有_非生物属性_，攻击拥有指令标记效果的敌人可以无视其护甲。\n\n_侦察无人机(鉴定)：_拥有_3+英雄最大生命值*33%_点生命，_1~2_点防御，不攻击，闪避和移动速度与英雄时刻一致，具有_非生物属性_，每架为英雄提供0.3潜行值，仅有_3+(神器等级+1)/3_格视野(计算结果需向下取整)但会与英雄共享，视野内的敌人会持续获得弱点标记效果(受到的伤害增加33%)。\n\n_闪光无人机(祛邪)：_拥有_3+英雄最大生命值*20%_点生命，_1~2_点防御，攻击造成_1+神器等级~6+神器等级_点伤害并拥有额外2格攻击距离，精准、闪避、攻击速度和移动速度与英雄时刻一致，具有_非生物属性_，攻击拥有指令标记效果的敌人可以造成3回合失明并对_亡灵和恶魔属性_敌人额外造成5点魔法伤害。\n\n_映像无人机(镜像)：_拥有_3+英雄最大生命值*33%_点生命，_1~2_点防御，不攻击，闪避和移动速度与英雄时刻一致，具有_非生物属性_，每架为英雄提供0.3潜行值且每_40-神器等级_回合会在周围产生一个英雄的镜像。\n\n_激光无人机(充能)：_拥有_3+英雄最大生命值*10%_点生命，_1~2_点防御，远程攻击造成_2+神器等级~3+神器等级_点魔法伤害，精准为英雄的2倍，闪避、攻击速度和移动速度与英雄时刻一致，具有_非生物属性_，攻击拥有指令标记效果的敌人有50%的概率造成3回合燃烧。\n\n_庇佑无人机(传送)：_拥有_3+英雄最大生命值*33%_点生命，_1~2_点防御，不攻击，闪避和移动速度与英雄时刻一致，具有_非生物属性_，每架为英雄提供0.3潜行值和_1~3_点防御，死亡后会将摧毁它的敌人随机传送。\n\n_迷乱无人机(催眠)：_拥有_3+英雄最大生命值*33%_点生命，_1~2_点防御，攻击造成_2+神器等级~2+神器等级*2_点伤害，精准、闪避、攻击速度和移动速度与英雄时刻一致，具有_非生物属性_，攻击拥有指令标记效果的敌人有33%的概率造成3回合眩晕并额外有50%的概率将其击退1格。\n\n_护航无人机(探地)：_拥有_3+英雄最大生命值*33%_点生命，_1~2_点防御，不攻击，闪避和移动速度与英雄时刻一致，具有_非生物属性_，每架为英雄提供0.8潜行值且每50回合使英雄获得4回合隐形。\n\n_袭扰无人机(盛怒)：_拥有_3+英雄最大生命值*10%_点生命，_1~2_点防御，攻击造成_1+神器等级~6+神器等级_点伤害并拥有额外2格攻击距离，移动速度为英雄的2倍，精准、闪避和攻击速度与英雄时刻一致，具有_非生物属性_，攻击不拥有指令标记效果的敌人有33%的概率附带3回合指令标记，攻击拥有指令标记效果的敌人有17%的概率造成3回合狂乱。\n\n_爆破无人机(复仇)：_拥有_3+英雄最大生命值*10%_点生命，_1~2_点防御，不攻击但会追逐敌人，移动速度为英雄的2倍，闪避与英雄时刻一致，具有_非生物属性_，每架为英雄提供0.3潜行值，周围存在敌人时每回合流失3点生命，死亡后产生只会伤害敌人的爆炸。\n\n_震慑无人机(恐惧)：_拥有_3+英雄最大生命值*10%_点生命，_1~2_点防御，远程攻击造成_1+神器等级~6+神器等级_点伤害，精准、闪避、攻击速度和移动速度与英雄时刻一致，具有_非生物属性_，攻击不拥有指令标记效果的敌人有17%的概率附带3回合指令标记，攻击拥有指令标记效果的敌人有33%的概率造成6回合恐惧。\n\n_混沌无人机(嬗变)：_拥有_3+英雄最大生命值*33%_点生命，_1~2_点防御，不攻击，闪避和移动速度与英雄时刻一致，具有_非生物属性_，在_20-神器等级_回合后变为另一转职的随机无人机、僚机无人机、镜像、魔法绵羊或是本区域的随机敌人。\n\n所有无人机每隔_15-神器等级_回合回复1点生命。\n\n装备后还可以查看功能菜单并使用“回收指定无人机”、“指挥全体无人机”和“开关无人机定位”的功能。\n\n需要录入升级卷轴进行升级，每次录入提升2级，最高10级。\n\n_神器充能_效果：每回合获得0.2点充能。\n\n_诅咒_效果：无法使用。\n\n护甲技能_三位一体_幻化效果：默认消耗25护甲充能生产一架拥有使用者最大生命值40%/60%/80%/100%生命的僚机无人机。

