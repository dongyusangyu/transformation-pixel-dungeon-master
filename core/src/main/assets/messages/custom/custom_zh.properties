custom.dict.dict.melee_assassin =暗杀之刃
custom.dict.dict.melee_assassin_d =_4_阶武器，_16_力量需求，_4~20_基础伤害。\n\n它的伤害成长为_1~5_，精准修正为_1_，攻击延迟为_1_，攻击距离为_1_。\n\n伏击伤害为_伤害范围的50%~最大伤害_(即50%的伏击修正)。\n\n_决斗家_武技(潜行)：可闪现至最多3格远并给予_2+武器等级_回合隐形。

custom.dict.dict.melee_battleaxe =战斧
custom.dict.dict.melee_battleaxe_d =_4_阶武器，_16_力量需求，_4~20_基础伤害。\n\n它的伤害成长为_1~5_，精准修正为_1.24_，攻击延迟为_1_。攻击距离为_1_。\n\n_决斗家_武技(重击)：造成额外_5+1.5*武器等级_点伤害并施加5回合恍惚，使其精准和闪避减半。这一击必定命中但若不是伏击则没有额外伤害加成。

custom.dict.dict.melee_blowpipe =吹箭筒
custom.dict.dict.melee_blowpipe_d =_2_阶武器，_12_力量需求，_2~12_基础伤害。\n\n它的伤害成长为_1~2_，精准修正为_1_，攻击延迟为_1_，攻击距离为_1_。\n\n装备后，飞镖的伤害提升至_4+吹箭筒等级~10+2*吹箭筒等级_并且能够生效吹箭筒的附魔。\n\n_决斗家_武技(蓄势)：不消耗回合释放，下次攻击必定命中并根据攻击方式的不同产生不同效果：近战攻击会击退2格，未涂药的飞镖会造成额外_2+吹箭筒等级_点伤害，涂药飞镖会增加额外_2+吹箭筒等级_点耐久并会在7x7范围内生效(对英雄无效)。攻击后失去该效果。

