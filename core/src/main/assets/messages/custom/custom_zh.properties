custom.testmode.testboss.testgoo.name = Test：粘咕
custom.testmode.testboss.testgoo.desc = 不管你怎么想，总之这不是什么黑色果冻，更不是什么修格斯的远亲。\n\n_Test改动：_保留粘咕的主要战斗与绝命头目挑战中的分裂行为。作为敌人放置器中的测试Boss，可被放置到任意楼层。
custom.testmode.testboss.testdm300.name = Test：DM-300
custom.testmode.testboss.testdm300.desc = 只是一个超级挖矿机器，装载了突破天际的钻头。\n\n_Test改动：_超载不再依赖能量塔的激活，当前生命值降低至一定阈值后会超载若干回合，随后自动解除超载。作为敌人放置器中的测试Boss，可被放置到任意楼层。
custom.testmode.testboss.testtengu.name = Test：天狗
custom.testmode.testboss.testtengu.desc = 结束了漫长监狱服刑的神秘刺客，现在可不是和他合影的好时机。\n\n_Test改动：_移除了与10层绑定的阶段控制，会围绕当前敌对的目标进行闪现，同时只会生成视觉可见、其他生物也能触发的普通毒镖陷阱。作为敌人放置器中的测试Boss，可被放置到任意楼层。
custom.testmode.testboss.testtengu.notice = 那么，我们开始吧。
custom.testmode.testboss.testtengu.phase = 这里可没有牢房能困住我。
custom.testmode.testboss.testyogdzewa.name = Test：Yog-Dzewa
custom.testmode.testboss.testyogdzewa.desc = 你知道吗，祂的名字有一半是犹格索托斯...。\n\n_Test改动：_古神之拳和恶魔随从的召唤不再使用楼层出口或25层高台的坐标，而是在当前楼层围绕自身寻找合法地格进行召唤。作为敌人放置器中的测试Boss，可被放置到任意楼层。
custom.testmode.testboss.testyogdzewa.notice = 我  为  何  在  这  里
custom.testmode.testboss.testyogdzewa.summon = 到 汝 之 造 物 主 身 边 来
custom.testmode.testboss.testdwarfking.name = Test：矮人国王
custom.testmode.testboss.testdwarfking.desc = 那个狂妄自大、不知好歹的末代国王不知道为什么从他的宫殿中来到了这里。\n\n_Test改动：_移除了王座和20层召唤点的绑定，阶段流程被简化，亡灵随从会在当前楼层围绕国王寻找合法地格应召而来。作为敌人放置器中的测试Boss，可被放置到任意楼层。
custom.testmode.testboss.testdwarfking.notice = 想不到吧，朕乘坐移动王座来到了这里！
custom.testmode.testboss.testdwarfking.summon = 来人，护驾！
custom.testmode.testboss.testdwarfking.shield = 王庭护盾
custom.testmode.testboss.testdwarfking.defeated = 汝竟...击溃了测试阵列...
custom.testmode.testboss.testwarriorboss.name = Test：战士？
custom.testmode.testboss.testwarriorboss.desc = 不是饭桶。\n\n_Test改动：_保留原有的战斗行为。作为敌人放置器中的测试Boss，可被放置到任意楼层。
custom.testmode.testboss.testrogueboss.name = Test：盗贼？
custom.testmode.testboss.testrogueboss.desc = 可怜的天狗在即将结束服刑时就被他干掉了。\n\n_Test改动：_移除了10层绑定，影遁、准备阶段、逸动和召唤暗影映像被简化为任意楼层可运行的版本。作为敌人放置器中的测试Boss，可被放置到任意楼层。
custom.testmode.testboss.testrogueboss.notice = 哈哈，又一个猎物上钩了！
custom.testmode.testboss.testrogueboss.invisibility = 试着抓住我吧！
custom.testmode.testboss.testrogueboss.execute = 吃我一刀！
custom.testmode.testboss.testrogueboss.enraged = 激怒
custom.testmode.testboss.testrogueboss.momentum = 现在还能跟上我的步伐吗？
custom.testmode.testboss.testrogueboss.momentum-recovery = 诶呦我去，累死我了...
custom.testmode.testboss.testhuntressboss.name = Test：女猎手？
custom.testmode.testboss.testhuntressboss.desc = 古神的腐化将女猎手的狩猎本能磨砺成了冷酷的执念。\n\n_Test改动：_移除了15层竞技场与主线奖励的绑定，鹰与触手会在她附近的合法地格出现，消逝草也只在当前楼层传送。作为敌人放置器中的测试Boss，可被放置到任意楼层。
custom.testmode.testboss.testhuntressboss.gale_aim = 风已经记住了你的落点。
custom.testmode.testboss.testhuntressboss.warden = 那就让这里生根吧！
custom.testmode.testboss.testhuntressboss.defeated = 这场狩猎……到此为止。
custom.testmode.testboss.testhuntressboss.boon_blindweed = 致盲草，遮蔽我的身形。
custom.testmode.testboss.testhuntressboss.boon_earthroot = 地缚根，稳固我的步伐。
custom.testmode.testboss.testhuntressboss.boon_fadeleaf = 消逝草，打乱这场追猎。
custom.testmode.testboss.testhuntressboss.boon_firebloom = 火焰花，点燃我的箭矢。
custom.testmode.testboss.testhuntressboss.boon_icecap = 冰冠花，冻结我的箭矢。
custom.testmode.testboss.testhuntressboss.boon_mageroyal = 皇血草，净化我的身躯。
custom.testmode.testboss.testhuntressboss.boon_sorrowmoss = 断肠苔，淬毒我的箭矢。
custom.testmode.testboss.testhuntressboss.boon_starflower = 星陨花，指引我的准星。
custom.testmode.testboss.testhuntressboss.boon_stormvine = 风暴藤，托起我的脚步。
custom.testmode.testboss.testhuntressboss.boon_sungrass = 阳春草，愈合我的伤口。
custom.testmode.testboss.testhuntressboss.boon_swiftthistle = 速行蓟，加快这场追猎。
custom.testmode.testboss.testgreatdemon.name = Test：大恶魔
custom.testmode.testboss.testgreatdemon.desc = 不要和恶魔做生意，这就是教训。\n\n_Test改动：_保留原有的战斗行为。作为敌人放置器中的测试Boss，可被放置到任意楼层。
custom.testmode.testboss.testgreatshoper.name = Test：店主
custom.testmode.testboss.testgreatshoper.desc = 实际上，不只是不要和恶魔做生意。\n\n_Test改动：_移除了王座和20层召唤点的绑定，阶段流程被简化，其帮手会在当前楼层围绕店主寻找合法地格应召而来，落金效果也改为不会砸伤自身的安全版本。作为敌人放置器中的测试Boss，可被放置到任意楼层。
custom.testmode.testboss.testgreatshoper.no_damage = 没用的，有此魔力护盾，你难以伤我分毫。
custom.testmode.testboss.testgreatshoper.summon = 黄金元素，武僧宗师，替我拦住此人！
custom.testmode.testboss.testgreatshoper.summon1 = 两个废物！提穆尔，保护好我。
custom.testmode.testboss.testgreatshoper.phase4 = 提穆尔也不能阻挡你吗？那么，让你跟这些财宝陪葬吧！

