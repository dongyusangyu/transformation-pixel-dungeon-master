custom.ch.boss.yogreal.name=Yog-Dzewa-EX
custom.ch.boss.yogreal.notice=我  看  见  你  了
custom.ch.boss.yogreal.darkness=黑暗正在逼近……
custom.ch.boss.yogreal.hope=汝・之・希・望・皆・为・虚・妄
custom.ch.boss.yogreal.defeated=……
custom.ch.boss.yogreal.rankings_desc=被Yog-Dzewa-EX吞噬
custom.ch.boss.yogreal.desc=Yog-Dzewa是一个古老的神；一个将自己的力量延伸向凡间世界并吞噬它们、以为自身无尽的成长提供养分的巨大怪物。矮人一定是在玩弄黑暗魔法的时候引起了这个巨大恐怖的注意，并且从那以后就一直试图控制他，使之无法侵吞外界。\n\n这位古神起源于一个原始的、充满魔法与混沌的维度，且无法将他的真实形态带入这个世界。因此，他创造了自己的化身并召唤了恶魔们作为他的仆从来完成它的命令。\n\n这只巨眼是古神在这个世界上力量的焦点。虽然这只眼睛本身是不可移动的，但它能够射出强大的魔能光束，并召唤各种恶魔仆从来帮助它。\n\n它会摧毁羊群与蜜蜂这些麻烦的生物。
custom.ch.boss.yogreal.desc_spawners=你感觉到恶魔能量正从上层涌向古神之眼。你在上面活着留下的什么东西正在给古神回馈着能量。_古神会使用这股能量召唤更强大的手下！_
custom.ch.boss.yogreal.destroy_tile=附近似乎发生了一些变化！
custom.ch.boss.yogreal$larva.name=古神幼虫
custom.ch.boss.yogreal$larva.rankings_desc=被Yog-Dzewa-EX吞噬
custom.ch.boss.yogreal$larva.desc=这些古神的小小造物是一种易于制造的简陋生物。虽然单个幼虫十分脆弱，但它们能够被迅速地制造出来，并会在形成一个大数目后变得难以抵挡。\n\n攻击具有一定毒性。\n\n_在古神周围时极大降低受到伤害_。
custom.ch.boss.yogreal$yogrealripper.desc = 这种恐怖的生物是恶魔利用这里残留的众多矮人尸骸而组成的。恶魔撕裂者外观类似苍白瘦弱的矮人，具有残缺不全的躯干与尖利修长的骨爪。\n\n恶魔撕裂者难以承受沉重的打击，但它们行动迅捷并十分危险。它们能够瞬间扑过极远的距离，再用自己的骨爪刺穿目标。\n\n_在古神周围时极大降低受到伤害_。
custom.ch.boss.yogreal$yogrealripper.rankings_desc=被Yog-Dzewa-EX吞噬
custom.ch.boss.yogreal$yogrealscorpio.rankings_desc=被Yog-Dzewa-EX吞噬
custom.ch.boss.yogreal$yogrealsuccubus.rankings_desc=被Yog-Dzewa-EX吞噬

custom.ch.boss.yogrealfist.invuln_warn=拳头邻接古神之眼时无法受到伤害！
custom.ch.boss.yogrealfist.rankings_desc=被Yog-Dzewa-EX吞噬
custom.ch.boss.yogrealfist.desc=这个拳头是古神力量的部分体现。这些拳头与古神的力量相互联系，并且当它们靠近古神之眼时会免疫所有受到的伤害，并极大提升其近战伤害。
custom.ch.boss.yogrealfist$burningfist.name=燃烧之拳
custom.ch.boss.yogrealfist$burningfist.desc=燃烧之拳是由混沌的炽热魔法形成的。它在移动时会不断地引燃周围的环境。它还可以发射火焰能量形成魔法冲击，使目标地陷入一片熊熊烈火。\n\n燃烧之拳引燃环境的能力在靠近水的时候会被抑制，但是其热量实在太大，以至于周围的水很快就会蒸发掉！
custom.ch.boss.yogrealfist$soiledfist.name=大地之拳
custom.ch.boss.yogrealfist$soiledfist.desc=大地之拳是由混沌的大地魔法形成的。当它移动时，它会不断地使周围生出植物。它还可以发射精准的大地冲击，将它的目标困在迅速生长的藤蔓和根系间！\n\n大地之拳能从植物的生命中获得力量，并能根据其周围的植被数量来抵挡伤害！
custom.ch.boss.yogrealfist$rottingfist.name=腐烂之拳
custom.ch.boss.yogrealfist$rottingfist.desc=腐烂之拳是由活生生的腐败组成的。它是一团高塔般庞大的腐肉，可以在近战中喷溅腐蚀淤泥，并喷射毒气作为远程攻击。更糟糕的是，腐烂之拳的巨大质量导致它受到攻击时只会进入流血状态，而不会直接受到伤害。\n\n腐蚀淤泥可以被水洗去，但腐烂之拳也可以通过吸收水来治愈自己！此外，在其流血时对腐烂之拳造成伤害只会刷新其流血状态而不会加重效果。
custom.ch.boss.yogrealfist$rustedfist.name=锈蚀之拳
custom.ch.boss.yogrealfist$rustedfist.desc=锈蚀之拳是由一块活的金属形成的。它是一个高塔般庞大的移动金属块，具有强大的近战能力，并有在远距离外使目标残废的远程攻击能力。由于其巨大的质量，锈蚀之拳所受到的伤害都会被延缓，而非立即作用在其身上。\n\n尽管如此，锈蚀之拳那并不灵活的特性使得它无法通过较窄的走道。另外，虽然锈蚀之拳只会缓慢地受到伤害，但是延缓伤害还会在它受到多次攻击时继续叠加。
custom.ch.boss.yogrealfist$brightfist.name=辉耀之拳
custom.ch.boss.yogrealfist$brightfist.teleport=辉耀之拳在一道使你重度盲目的爆闪中传送到了别处！
custom.ch.boss.yogrealfist$brightfist.desc=辉耀之拳是由纯粹的光能量形成的。它能在每回合射出一道强烈的灼目光束！这些光束除了造成大量伤害外，还会暂时使你失明。辉耀之拳为了逃脱还能发出覆盖全场的刺眼爆闪！\n辉耀之拳在近战中并没有特殊能力。
custom.ch.boss.yogrealfist$darkfist.name=暗影之拳
custom.ch.boss.yogrealfist$darkfist.teleport=暗影之拳在一片使你光源熄灭的漆黑中传送到了别处！
custom.ch.boss.yogrealfist$darkfist.desc=暗影之拳是由纯粹的暗能量形成的。它能在每回合射出强大的暗黑法术！这些法术除了造成大量伤害外，还会削弱你的光源。暗影之拳为了逃脱还能瞬间使全场陷入一片漆黑！\n\n暗影之拳在近战中并没有特殊能力。

custom.ch.boss.yogreallevel.well_name = 空间之井
custom.ch.boss.yogreallevel.well_desc = 井中涌动着空间的魔力。也许它指向某个地方？

########ELITE ENEMIES

custom.ch.mob.sewer.snakeh.name =下水道巨蛇
custom.ch.mob.sewer.snakeh.desc =这些体型庞大的蛇能通过快速滑行以闪避普通的攻击，让它们难以命中。不过伏击与魔法攻击会使它们措手不及。

custom.ch.mob.sewer.rath.name=啮齿小鼠
custom.ch.mob.sewer.rath.desc=虽说啮齿小鼠们具有攻击性，可它们依旧是下水道居民里的弱者。它们的啮咬非常烦人，但只有数量巨大时才会有生命威胁。\n\n死亡时召唤白鼠复仇。此白鼠属性值与楼层相关。

custom.ch.mob.sewer.albinoh.name=白化老鼠
custom.ch.mob.sewer.albinoh.desc=这是一种珍稀的啮齿小鼠，有着纯白色的毛皮和锯齿状的牙齿。\n\n此白鼠属性值与层数相关。

custom.ch.mob.sewer.gnollh.name=豺狼巡查
custom.ch.mob.sewer.gnollh.desc=豺狼是鬣狗状的类人生物。它们在下水道和地牢里游荡，不时向上行动试图向地表发起进攻。豺狼巡查是它们种群里最普通的一员，它们既没有豺狼暴徒强壮，也赶不上萨满聪明。\n\n带有两枚飞镖。

custom.ch.mob.sewer.crabh.name=下水道螃蟹
custom.ch.mob.sewer.crabh.desc=这些巨型的螃蟹位居下水道食物链的顶端。它们行动极其迅速且其厚重的甲壳能承受沉重的打击。\n\n扣除英雄饥饿值，并使其虚弱。

custom.ch.mob.sewer.slimeh.name=史莱姆
custom.ch.mob.sewer.slimeh.desc=史莱姆是一种具有胶质外形与液态内核的奇特魔法生物。城市的下水道为它们提供了充分的水源和富足的养分。\n\n弹性极强，每次最多受到5点伤害，攻击附带击退效果。

custom.ch.mob.sewer.swarmh.name=蝇群
custom.ch.mob.sewer.swarmh.desc=致命的飞蝇群愤怒地发出嗡嗡声。每次非魔法攻击都会把它分割成两群更小但同样危险的飞蝇群。\n\n死亡时，治疗周围敌人。

custom.ch.mob.prison.skeletonh.name=骷髅
custom.ch.mob.prison.skeletonh.desc=骷髅是从那些悲惨的冒险者及地牢原住民尸骨的聚合物产生的，来自下层地牢的邪恶力量将它们从死亡中唤起。在吸收了足够的伤害之后，它们就会在骨头的爆炸中消解。\n死亡后会在楼层某处重构。

custom.ch.mob.prison.thiefh.name=疯狂小偷
custom.ch.mob.prison.thiefh.desc=这些囚犯逃出了他们的牢房，却没能逃出这座监牢。随着时间流逝，这座监牢彻底摧毁了他们仅存的心智，以及对自由的向往。这些疯狂的小偷和强盗很久以前就已经彻底忘记它们是谁，以及它们为何偷窃。\n\n这些敌人比起面对面地战斗，更倾向于偷走你的财物随后逃之夭夭。一定要看紧它们，否则你以后可能再也不会见到自己的被盗财物了。\n\n偷窃距离+1，团伙作案。
custom.ch.mob.prison.thiefh.stole=小偷偷走了你的%s！
custom.ch.mob.prison.thiefh.carries=\n\n这个小偷携带着一个_%s_。明显是偷来的。
custom.ch.mob.prison.thiefh.escapes=小偷带着你的%s逃走了！

custom.ch.mob.prison.bandith.name=疯狂强盗
custom.ch.mob.prison.bandith.desc=这些囚犯逃出了他们的牢房，却没能逃出这座监牢。随着时间流逝，这座监牢彻底摧毁了他们仅存的心智，以及对自由的向往。这些疯狂的小偷和强盗很久以前就已经彻底忘记它们是谁，以及它们为何偷窃。\n\n这些敌人比起面对面地战斗，更倾向于偷走你的财物随后逃之夭夭。一定要看紧它们，否则你以后可能再也不会见到自己的被盗财物了。\n\n原速逃逸、失明攻击。

custom.ch.mob.prison.guardh.name=监狱守卫
custom.ch.mob.prison.guardh.scorpion=给我过来！
custom.ch.mob.prison.guardh.def_verb=格挡
custom.ch.mob.prison.guardh.desc=作为曾经监狱的管理者，这些守卫和那些罪犯已经没什么区别了。它们蹒跚的步伐如同僵尸一般，毫无思绪地四处寻找不属于这片区域的生物，比如你！\n\n它的铁链缠在自己的胯部，也许可以用来将敌人拉扯到非常近的距离。\n\n无限使用的锁链，别想跑！

custom.ch.mob.prison.dm100h.name=DM-100
custom.ch.mob.prison.dm100h.desc=DM-100是一种矮人“防卫机械”的早期机型，用来保护下层矿洞中的矮人矿工。然而由于电击威力不足，它们之后被送给上层的人类监狱。典狱长起初认为DM-100太过残忍而没有启用，但随着时间推移，囚犯变得越来越难以控制，这使得DM-100成为了监狱的必备品。\n\n蓄力攻击。
custom.ch.mob.prison.dm100h$skylightning.ondeath = 当心闪电！
custom.ch.mob.prison.dm100h.zap_kill=闪电球将你彻底击杀…
custom.ch.mob.prison.dm100h$skylightning.rankings_desc = 五雷轰顶

custom.ch.mob.cave.bath.name=吸血蝙蝠
custom.ch.mob.cave.bath.desc=这些敏捷且坚韧的洞穴穹顶生物比看上去可怕地多。它们会通过每次成功的攻击来回复生命，从而击败比它们大得多的对手。\n额外闪避、距离维持。

custom.ch.mob.cave.bruteh.name=豺狼暴徒
custom.ch.mob.cave.bruteh.enraged=激怒
custom.ch.mob.cave.bruteh.def_verb=格挡
custom.ch.mob.cave.bruteh.desc=暴徒是豺狼人中体型最庞大，力量最强壮且生命力最顽强的精英。受到致命伤时，他们会陷入疯狂之中，获得暂时的护盾和极高的伤害加成。\n复活一次、少量投掷武器。
custom.ch.mob.cave.bruteh$bruterage.name=豺狼狂暴
custom.ch.mob.cave.brute$bruterage.desc=这个豺狼暴徒的死亡已经不可避免，但它想拉你作为陪葬品！\n\n时间的推移或是外界的伤害都会消磨护盾。在护盾消散殆尽之际，暴徒会彻底消亡。然而，一定要小心，在这一阶段暴徒会造成巨额伤害！\n\n剩余的护盾：%d。

custom.ch.mob.cave.shamanh.name=豺狼萨满
custom.ch.mob.cave.shamanh.bolt_kill=魔力的冲击粉碎了你...
custom.ch.mob.cave.shamanh.desc=那些最具有智慧的豺狼可以掌握萨满魔法，豺狼萨满由于缺少力量所以更喜欢使用战斗法术。它们在部落中享有很高的地位，即使它们的身形相对薄弱。
custom.ch.mob.cave.shamanh$elementalshaman.spell_desc=佩戴红色面具的萨满会利用冰与电元素对敌人造成可观的伤害。
custom.ch.mob.cave.shamanh$trickshaman.spell_desc=佩戴蓝色面具的萨满会利用剧毒与空间魔法逐渐瓦解敌人。
custom.ch.mob.cave.shamanh$controlshaman.spell_desc=佩戴紫色面具的萨满会对敌人施加大量负面效果，并能蒸发负面效果以造成高额伤害。
custom.ch.mob.cave.shamanh$shamanmagic.rankings_desc=元素之力会毁灭你

custom.ch.mob.cave.spinnerh.name=结网蜘蛛
custom.ch.mob.cave.spinnerh.desc=绿色而多毛的洞穴蜘蛛们会试着去躲避直接的战斗，它们更喜欢在远处等待其猎物卷入蜘网，在剧毒中慢慢死去。它们也能向远处喷吐蛛网，阻挡敌人的行动路线。\n\n高速移动、结网。

custom.ch.mob.city.warlockh.name=暗影术士
custom.ch.mob.city.warlockh.desc=当矮人的兴趣从工程建设转向奥秘学术时，术士们开始在城市中掌权。它们从元素魔法起步，但很快就开始研究恶魔学和死灵术。最强大的术士掌握了矮人王国的王权，其他术士如果想继续练习黑暗魔法，就必须放弃精神的自由，将意志交给他控制。\n\n这些术士拥有具有强大的干扰性魔法，能暂时抑制装备的升级魔力。装备的等级越高，受降级魔法的影响就越严重。\n\n充能吞噬。
custom.ch.mob.city.warlockh.bolt_kill=暗影能量使你的生命衰竭了……

custom.ch.mob.city.monkh.name=矮人武僧
custom.ch.mob.city.monkh.desc=这些僧侣皆是狂热的信徒，倾其所能从一切异族手中保护国王的安全。狂热的信仰使得他们将自己的意志交给了国王，只剩下没有思想的躯壳在城市中游荡。\n\n矮人武僧既不披甲亦不执械，仅仅依靠自己的徒手格斗技巧退敌。精神集中的武僧会必定格挡住一次进攻，哪怕是必中的攻击。武僧在移动时会更快地集中精神，在战斗中就相对慢些。\n\n击飞武器。
custom.ch.mob.city.monkh.disarm=矮人武僧击飞了你的%s！
custom.ch.mob.city.monkh$focus.name=精神集中
custom.ch.mob.city.monkh$focus.desc=这个武僧已经完全集中于目标的一举一动，似乎能预料到目标的下一步动作。\n\n精神集中的武僧一定会格挡下一次物理攻击。格挡会分散武僧的注意力，使得他们需要一段时间重新集中精力来成功格挡攻击。在移动时武僧回复地相对更快。
custom.ch.mob.city.monkh.parried=格挡

custom.ch.mob.city.seniormonkh.name = 武僧大师
custom.ch.mob.city.seniormonkh.desc=这些僧侣皆是狂热的信徒，倾其所能从一切异族手中保护国王的安全。狂热的信仰使得他们将自己的意志交给了国王，只剩下没有思想的躯壳在城市中游荡。\n\n这只武僧掌握了精深的格斗技巧，相较于普通的武僧，他能在移动时更迅速回复集中。精神集中的武僧会必定格挡住一次进攻，哪怕是必中的攻击。武僧在移动时会更快地集中精神，在战斗中就相对慢些。\n\n击飞英雄。
custom.ch.mob.city.seniormonkh.hard_strike = 你被武僧大师击飞了！

custom.ch.mob.city.elementalh$blazingelemental.name=烈焰元素
custom.ch.mob.city.elementalh$blazingelemental.desc=元素生物是一种由于施放强大魔法时的失误产生的混沌生物。元素生物缺乏最基础的智力，它们通常与一种特定的魔法密切相关。\n\n烈焰元素是一种常见的借助火焰之力攻击的元素生物。在近战时它能使得目标燃起大火，对付远处的敌人也能偶尔向目标发射火球。\n\n蒸发、范围引燃、火焰回复。
custom.ch.mob.city.elementalh$freezingelemental.name=极寒元素
custom.ch.mob.city.elementalh$freezingelemental.desc=元素生物是一种由于施放强大魔法时的失误产生的混沌生物。元素生物缺乏最基础的智力，它们通常与一种特定的魔法密切相关。\n\n极寒元素是一种常见的借助冰霜之力弱化敌人的元素生物。它们近战会使敌人陷入冻伤，也能偶尔远程攻击，在水面上冰霜之力的效果会显著加强。\n\n化水、冻结、冰爆、霜冻回复。
custom.ch.mob.city.elementalh$freezingelemental.ice_break_die=你与冰一并碎成了渣...
custom.ch.mob.city.elementalh$lightningelemental.name=闪击元素
custom.ch.mob.city.elementalh$lightningelemental.desc=元素生物是一种由于施放强大魔法时的失误产生的混沌生物。元素生物缺乏最基础的智力，它们通常与一种特定的魔法密切相关。\n\n闪击元素是一种利用电击与闪光攻击敌人，较为少见的元素生物。近战时它会向周遭敌人释放电弧，若主要攻击目标在水中将遭受额外伤害。对付远处的敌人时它们会偶尔释放致盲的强烈闪光。\n\n致盲、绝对致盲、电击防御。
custom.ch.mob.city.elementalh$uncertaintyelemental.name=混沌元素
custom.ch.mob.city.elementalh$uncertaintyelemental.desc=元素生物是一种由于施放强大魔法时的失误产生的混沌生物。元素生物缺乏最基础的智力，它们通常与一种特定的魔法密切相关。\n\n混乱元素是一种极其稀有的元素生物。它们不仅仅局限于一种特定的魔法，而是借助随机的魔法进行强力的攻击，并能制造大范围的混乱。\n\n诅咒法杖天下第一。

custom.ch.mob.city.golemh.name=元素魔像
custom.ch.mob.city.golemh.desc=魔像是矮人们试图利用魔法的新应用弥补机械设备长久以来的缺陷的产物。它们虽不似DM-300那样庞大笨重，但仍具有不可小觑的破坏力。\n\n魔像因体型过大无法进入过道，但矮人们赋予了魔像魔力来弥补这一点——魔像能在各个房间之间传送，并能将无法触及的敌人从远处拉回来。\n\n召唤元素。

custom.ch.mob.hall.eyeh.name=毁灭之眼
custom.ch.mob.hall.eyeh.deathgaze_kill=死亡凝视夺取了你的生命…
custom.ch.mob.hall.eyeh.desc=毁灭之眼是一种将恶魔能量压抑在自己体内的漂浮球形生物。它们拥有近战能力，但其真正的力量蕴藏在它们的魔法之中。\n\n在短暂的蓄能过后邪眼将会释放一种名为_死亡凝视_的毁灭性能量射线。任何受到邪眼的这种凝视的生物都会受到极大的伤害，明智的冒险者都会及时寻求掩护。\n\n解离物品，召唤镜像。
custom.ch.mob.hall.eyeh.one=毁灭之眼解离了你的%s！
custom.ch.mob.hall.eyeh.some=毁灭之眼解离了你的一些%s！
custom.ch.mob.hall.eyeimage.name=毁灭之眼镜像
custom.ch.mob.hall.eyeimage.desc=同毁灭之眼，但缺乏近战能力，一次死亡凝视后便会消散。

custom.ch.mob.hall.ripperh.name=恶魔开膛手
custom.ch.mob.hall.ripperh.leap=恶魔开膛手正准备扑杀！
custom.ch.mob.hall.ripperh.desc=这种恐怖的生物是恶魔利用这里残留的众多矮人尸骸而组成的。恶魔撕裂者外观类似苍白瘦弱的矮人，具有残缺不全的躯干与尖利修长的骨爪。\n\n恶魔撕裂者难以承受沉重的打击，但它们行动迅捷并十分危险。它们能够瞬间扑过极远的距离，再用自己的骨爪刺穿目标。\n\n与一般撕裂者不同的是，开膛手近战也能对目标造成一定的流血，在直面敌人时能造成更持久的流血。每次造成的流血虽不严重，但可以一直叠加，叠加到一定程度会导致致命的爆发！

custom.ch.mob.hall.scorpioh.name=蝎子狙击手
custom.ch.mob.hall.scorpioh.desc=这些巨大的节肢类恶魔生物会尽可能避免一切近距离接触，并且会在远处射出能够致残的尖刺。\n\n持续站定的射击会使得蝎子瞄准目标的要害，有效突破目标的防御并使其失明，且能够对无法看到自身的目标打出_致命一击_。不过它们在移动中会逐渐丢失瞄准。
custom.ch.mob.hall.scorpioh.head_shot=HEAD SHOT!!!

custom.ch.mob.hall.succubush.name=上级魅魔
custom.ch.mob.hall.succubush.desc=魅魔是一种善于操纵敌人的精神的变形恶魔。这一只化为了哥特风的苍白人形，或许是为了吸引矮人术士？\n\n在攻击时，魅魔能够暂时魅惑目标，使其无法直接攻击魅魔本身。魅魔在攻击被魅惑的目标时能吸取其生命精华。\n\n破甲、范围治疗。

custom.ch.mob.scrollofupgradeeater.name=升级转移卷轴
custom.ch.mob.scrollofupgradeeater.desc=_破坏_一件物品并提取其中的等级，且至多保留3级。\n\n
custom.ch.mob.scrollofupgradeeater.not_eat=你的卷轴还没有吸收升级。
custom.ch.mob.scrollofupgradeeater.ready_upgrade=你的卷轴已经吸收了_%d_级。
custom.ch.mob.scrollofupgradeeater.eaten=你的卷轴吸收了%s的等级！
custom.ch.mob.scrollofupgradeeater.cant_eat_equipped=你需要先卸下此装备。
custom.ch.mob.scrollofupgradeeater.upgrade=你的卷轴将魔力注入了%s！
custom.ch.mob.scrollofupgradeeater.inv_title=选择一件物品
custom.ch.mob.scrollofupgradeeater.eat_confirm_title=你确定吗？
custom.ch.mob.scrollofupgradeeater.eat_confirm_body=你的_%s_将被不可逆地破坏！是否继续操作？
custom.ch.mob.scrollofupgradeeater.sure=没问题
custom.ch.mob.scrollofupgradeeater.no=等等！


#buffs
custom.buffs.consistbleeding.name=持续流血
custom.buffs.consistbleeding.desc=持续流血比起普通的流血更为致命，因为这种流血在结束之前不会衰减，而且叠加到一定程度会引发致命的血爆。\n\n当前流血层数：%d\n\n每回合伤害：%.2f
custom.buffs.consistbleeding.heromsg=你正在流血！
custom.buffs.consistbleeding.rankings_desc=过度失血
custom.buffs.consistbleeding.burst=大出血！
custom.buffs.consistbleeding.bleed_die=你的最后一滴血也流干了...
custom.buffs.consistbleeding.burst_die=突然恶化的流血夺走了你的生命...

custom.buffs.absoluteblindness.name = 绝对失明
custom.buffs.absoluteblindness.heromsg= 伸手不见五指，你暂时失去了视觉能力！
custom.buffs.absoluteblindness.desc = 目标暂时失去了视觉能力！\n\n绝对失明效果剩余时长：%s回合

custom.buffs.attributemodifier.name=属性修正
custom.buffs.attributemodifier.desc=修正目标若干战斗属性。当前修正值：\n\n物理攻击：x%.2f +%.2f\n\n物理防御：x%.2f +%.2f\n\n精准能力：x%.2f +%.2f\n\n闪避能力：x%.2f +%.2f\n\n受到伤害：x%.2f +%.2f\n\n生命值：x%.2f +%.2f\n\n当前生命值：%d/%d

custom.buffs.deathcounter.name=死亡宣告
custom.buffs.deathcounter.desc=你的生命已然如风中残烛！\n\n准确而诚实的倒计时精确而无情地记录着这个目标最后的生命。当倒计时归零时，此目标将无条件死亡。\n\n倒计时还剩%.2f回合。

custom.buffs.ignorearmor.name=防御无视
custom.buffs.ignorearmor.desc=该目标的攻击将无视一切防御力。\n\n效果剩余时长：%s回合。

custom.buffs.positivebuffprohibition.name=正面效果禁止
custom.buffs.positivebuffprohibition.desc=该效果阻断了正面效果的持续，令所有正面效果在施加后的一个回合内消散。\n\nTHE WORLD由于暂停了目标的时间，所以不会被阻断。\n\n剩余阻断时长：%s回合。

custom.buffs.thornsshield.name=反伤光环
custom.buffs.thornsshield.desc=该效果使得目标将受到的所有攻击伤害按比例返还给攻击者，并且免疫非攻击伤害。\n\n效果剩余时长：%s回合。
custom.buffs.thornsshield.ondeath=你被反伤致死...
custom.buffs.thornsshield.rankings_desc=小心反伤

custom.buffs.zeroattack.name=攻击力0
custom.buffs.zeroattack.desc=该效果使得目标所有攻击的伤害降至0点。\n\n效果剩余时长：%s回合。

