custom.dict.dict.trinket_rat_skull =巨鼠头骨
custom.dict.dict.trinket_rat_skull_d =从0级到3级升级分别消耗_6/8/10_点炼金能量。\n\n_0/1/2/3_级时，稀有敌人的生成概率变为原先的_2/3/4/5_倍，对装甲石像和水晶宝箱怪的效果减半。\n\n稀有敌人生成的基础概率大多为2%，装甲石像和水晶宝箱怪为10%，咒缚灵为1%。

custom.dict.dict.trinket_clover =十三叶草
custom.dict.dict.trinket_clover_d =从0级到3级升级分别消耗_6/8/10_点炼金能量。\n\n_0/1/2/3_级时，有_15%/30%/45%/60%_的概率使英雄造成的伤害为最大值，而有_10%/20%/30%/40%_的概率使英雄造成的伤害为最小值。

custom.dict.dict.trinket_trap_mechanism =陷阱元件
custom.dict.dict.trinket_trap_mechanism_d =从0级到3级升级分别消耗_6/8/10_点炼金能量。\n\n通常普通层的生成概率为50%。_0/1/2/3_级时，普通层有_25%/50%/75%/100%_的概率变为陷阱或深渊层，两者概率均等，同时还会使_10%/20%/30%/40%_的隐藏陷阱变得可见。\n\n同时拥有饰物苔藓丛簇时，苔藓丛簇的效果更优先。

custom.dict.dict.trinket_wondrous_resin =奇迹树脂
custom.dict.dict.trinket_wondrous_resin_d =从0级到3级升级分别消耗_10/15/20_点炼金能量。\n\n_0/1/2/3_级时，有_25%/50%/75%/100%_的概率使部分诅咒法杖效果变好，且有_12.5%/25%/37.5%/50%_的概率使普通法杖额外释放一次中性或较好的诅咒法杖效果。\n\n因奇迹树脂变好的诅咒法杖效果：\n\n触发敌我双方一个冻结一个燃烧时，不对英雄起作用。\n\n触发随机传送目标或英雄时，只会随机传送目标。\n\n触发输血时，只会由目标输血给英雄。\n\n触发10回合法杖充能效果时，英雄不受电击。\n\n触发目标获得20回合飘浮时，如果目标不是巨型食人鱼或幻影食人鱼则改为英雄获得20回合飘浮。\n\n触发吸引全层敌人时，改为决斗秘卷效果。\n\n触发诅咒自身装备时，改为对目标造成30回合幻惑。\n\n触发跨层传送时，改为随机传送英雄。\n\n触发召唤陷阱时，改为召唤2个英雄的镜像。\n\n触发全层长草并起火时，取消起火。\n\n触发召唤黄金宝箱怪时，使其沉沦。\n\n触发将自身变为随机装备时，改为蜕变卷轴效果。\n\n触发腐蚀淤泥、大范围爆燃、随机元素打击、超新星爆炸、大范围塌方、全层重力混乱时，不影响英雄和盟友。

custom.dict.dict.trinket_salt_cube =盐晶立方
custom.dict.dict.trinket_salt_cube_d =从0级到3级升级分别消耗_6/8/10_点炼金能量。\n\n_0/1/2/3_级时，饱食度消耗的时间间隔变为_1.25/1.5/1.75/2_倍，但每回合的自然生命回复降低至_0.84/0.73/0.66/0.6_倍。\n\n通常情况下，非极度饥饿状态下的英雄每回合会回复0.1点生命，也就是10回合为1点。\n\n尽管自然生命回复的速度因此降低，但其减少每回合的饱食度消耗也使得在同等饱食度的情况下，自然生命回复总量会因为该饰物得到提升。\n\n全肉大饼给予的饱腹效果时长会因此被延长，但饱腹效果提供的额外生命回复间隔也会被延长，总的来说饱腹效果所能给予的额外生命回复总量不会因此改变，仅自然生命回复总量得到了提升。

custom.dict.dict.trinket_vial_of_blood =凝血试管
custom.dict.dict.trinket_vial_of_blood_d =从0级到3级升级分别消耗_6/8/10_点炼金能量。\n\n_0/1/2/3_级时，通过治疗药剂、水袋和生命之泉获得的治疗总量变为_1.125/1.25/1.375/1.5_倍，但每回合的治疗量上限降低至_4+0.15*最大生命/3+0.1*最大生命/2+0.07*最大生命/1+0.05*最大生命_(向上取整)。

custom.dict.dict.trinket_shard_of_oblivion =遗忘碎片
custom.dict.dict.trinket_shard_of_oblivion_d =从0级到3级升级分别消耗_6/8/10_点炼金能量。\n\n会阻止英雄进行自动鉴定，但能用其手动鉴定满足了自动鉴定条件的物品。_0/1/2/3_级时，除了神器栏外，每装备一个未鉴定的物品或50回合内使用过一次未鉴定的投掷武器和法杖，就会增加一级掉率加成，每级掉率加成为20%，最多增加至_20%/40%/60%/80%_。\n\n这一效果与财富之戒和_刺客_的天赋_赏金猎手_加算。

custom.dict.dict.trinket_chaotic_censer =混沌香炉
custom.dict.dict.trinket_chaotic_censer_d =从0级到3级升级分别消耗_6/8/10_点炼金能量。\n\n_0/1/2/3_级时，若英雄视野内存有敌人(不包括未激活的宝箱怪)则会在1~3回合后喷射气体，每_270~330/135~165/90~110/67~82_回合喷射一次。\n\n该饰物喷射气体的当前冷却为面板冷却的_0.9~1.1_倍之间(如0级时面板冷却为300，当前冷却则为270~330之间，向下取整)。\n\n若该饰物喷射气体的当前冷却大于面板冷却的1.2倍，则当前冷却会被重新设定为面板冷却的_0.833~1.2_倍之间(例如当前冷却为300，此时对该饰物进行升级提升至1级后面板冷却为150，当前冷却已大于面板冷却的1.2倍，则当前冷却会被重新设定为124~180之间)。\n\n该饰物在长时间未遇敌的情况下，当前冷却至多可以降低至面板冷却的_-1/3_(如2级时的面板冷却为100，则当前冷却在长时间未遇敌的情况下至多可以降低至-33)，负数冷却会在这次喷射后加成到下一次的当前冷却中(如这次的当前冷却为-20，下一次的当前冷却为90，则下一次的当前冷却变为70)。\n\n该饰物能够喷射的气体：\n\n_寻常气体_(概率为_70%/60%/50%/40%_)_：_300单位毒气，300单位致眩气体，200单位草木再生(禁止自然回复时不会产生)。\n\n_不寻常气体_(概率为_25%/30%/35%/40%_)_：_300单位暴雨，300单位烟幕，200单位腐臭气体。\n\n_稀有气体_(概率为_5%/10%/15%/20%_)_：_300单位狱火，300单位暴雪，200单位腐蚀酸雾。\n\n关于喷射位置选取判定：\n\n_第一步_，规定英雄视野内距离英雄2~6格(英雄所处位置为0格，周围一圈为1格，以此类推)的非固体地格为合法地格。\n其余地格则为非法地格，不会被选取进行喷射，也就是权重为0。\n\n_第二步_，标记敌人所处位置为目标地格。\n若敌人与英雄相距距离大于等于4格，则目标地格会改为敌人所处位置周围距离英雄最近的地格。\n\n_第三步_，根据合法地格和目标地格进行分配权重。\n若目标地格为合法地格，则目标地格的权重为8，而目标地格周围8格每格合法地格的权重为1。\n若目标地格为非法地格，则距离目标地格最近的合法地格的权重为8(同时设最近的合法地格与目标地格的距离为x)，其他与目标地格距离在(x-1)~(x+1)格之间的合法地格的权重为1。\n这里举个例子，距离非法目标地格最近的合法地格就在目标地格周围时，距离x=1，则其他与目标地格距离在0~2格之间的合法地格权重为1。\n\n_第四步_，根据地格权重进行随机喷射。

custom.dict.dict.trinket_goldingot =黄金元宝
custom.dict.dict.trinket_goldingot_d =从0级到3级升级分别消耗_10/15/20_点炼金能量。\n\n_0/1/2/3_级时，英雄造成的物理伤害增加_7.5%/15%/22.5%/30%_，但通过楼层生成、敌人掉落和财富之戒掉落等方式获得的金币量会减少_7.5%/15%/22.5%/30%_。

custom.dict.dict.trinket_ferrettuft =雪貂绒束
custom.dict.dict.trinket_ferrettuft_d =从0级到3级升级分别消耗_6/8/10_点炼金能量。\n\n_0/1/2/3_级时，所有角色(英雄、盟友、敌人等)的闪避属性提升_12.5%/25%/37.5%/50%_。

custom.dict.dict.trinket_bronzewatch =青铜怀表
custom.dict.dict.trinket_bronzewatch_d =从0级到3级升级分别消耗_6/8/10_点炼金能量。\n\n_0/1/2/3_级时，英雄在获得大部分效果(增益、减益乃至冷却效果)时会降低这些效果的持续时间_2/4/6/8_回合。\n\n该饰物不会影响永久持续的效果，持续时间刚好被抵扣或不足以抵扣的效果会至少保留1回合。

custom.dict.dict.trinket_spyglass =幻象裂镜
custom.dict.dict.trinket_spyglass_d =从0级到3级升级分别消耗_6/8/10_点炼金能量。\n\n_0/1/2/3_级时，在非Boss层的每层有_37.5%/75%/100%/100%_的概率额外生成一件低透明度的物品，并有_0%/0%/12.5%/50%_的概率生成第二件低透明度的物品。


##******************** buffs
custom.dict.dict.buff_neg1 =减益效果
custom.dict.dict.buff_neg1_d =这一部分可能并不全面，但已记录了大部分常见的减益效果，部分少见的效果会写明主要来源。\n\n_狂乱：_随机攻击最近的生物，优先攻击敌人，寻路会无视陷阱、深渊等地面效果。\n\n_流血：_每回合造成当前流血数值的伤害，下一回合数值变为原值的_50%~100%_。\n\n_失明：_视野范围变为3x3。\n\n_燃烧：_每回合造成_1~3+楼层数/4_点伤害，每4~6回合烧毁一张卷轴或是将神秘的肉及冷冻生肉片变为烤肉，在水中、被药剂砸中、受到冻伤或冻结会立即解除。\n\n_魅惑：_无法使用近战武器攻击施加者，每次受到伤害会减少5回合持续时间。\n\n_冻伤：_每有1回合冻伤就使行动速度降低10%，至多降至50%，能够解除燃烧。\n\n_酸蚀：_伤害低于_2+楼层数/2_时，每回合增加1点伤害，高于则每回合增加0.5点伤害。\n\n_腐化(腐化附魔、腐化法杖)：_将生物强制转化为盟友关系，每回合受到1%的累计伤害(满1立即结算)。\n\n_定命(腐化法杖)：_受到的所有伤害+67%。\n\n_残废：_移动速度减半。\n\n_降级(矮人术士)：_将武器、护甲、戒指和法杖的等级削弱为_1+sqrt[2*(原等级-1)]_(sqrt为平方根)。等级对应关系(降级后/降级前)：1/1，2/2，3/(3~4)，4/(5~7)，5/(8~11)，6/(12~16)，7/(17~22)。阅读升级卷轴或祛邪卷轴可立刻解除。\n\n_冻结：_冻结角色行动，并冻结一瓶药剂或是将神秘的肉变为冷冻生肉片，能够解除燃烧，受到伤害会立即解除。\n\n_幻惑：_降低20%精准与闪避。\n\n_极度饥饿：_停止英雄的自然生命回复并且每回合受到_英雄最大生命0.1%_的累计伤害(满1立即结算)。\n\n_腐蚀淤泥：_每回合造成_楼层数/5_点伤害，0~4层为0.5点，在水中、被药剂砸中会立即解除。\n\n_麻痹：_取消一切行动，每次受到伤害判定是否解除，判定法则：_0~受到伤害(每回合衰减10%)_与_0~当前生命_各随机取一个数，前者大于后者则解除。通过击退目标导致撞击造成的麻痹会持续_1+击退距离/2_回合。\n\n_中毒：_每回合造成_1+剩余时长/3_点伤害。\n\n_缠绕：_无法移动，飘浮效果或使用传送卷轴、闪现符石、返回晶柱等强制位移可立即解除。\n\n_迟缓：_所有行动速度减半。\n\n_恐惧：_使得生物尽可能远离施加者，每次受到伤害会减少5回合持续时间。\n\n_眩晕：_移动时随机向周围的8格移动。\n\n_易伤：_受到的物理伤害+33%。\n\n_虚弱：_物理攻击造成的伤害-33%。\n\n_催眠(催眠卷轴)：_结束后会进入魔法睡眠。\n\n_魔法睡眠(催眠卷轴、沉睡符石)：_进入魔法睡眠的敌人不受到伤害不会醒来(当然依旧会因为盛怒卷轴、警报陷阱等方式惊醒)，英雄和盟友还会因此每回合回复1点生命直到生命回满或是受伤才会醒来。\n\n_灵魂标记(术士)：_使用法杖或魔杖施法时有_1.07-0.92^(1+法杖等级*此次充能消耗)_的概率标记目标_10+法杖等级_回合，目标受到来自英雄的物理伤害时，英雄会回复_造成伤害*0.4_点生命。\n\n_魂飞魄散(梦魇秘卷)：_以2倍速度远离施加者，离开施加者视野后消失，每次受到伤害会减少5回合持续时间。\n\n_沉沦(魅音秘卷)：_将生物永久变为盟友关系。\n\n_众矢之的(敌意符石)：_使其他敌人强制对其进行攻击。\n\n_延缓伤害(粘稠刻印)：_随时间缓慢到账的伤害。\n\n_妄为(妄为诅咒)：_降低80%精准，成功命中一次会立即解除。\n\n_恍惚(武技重击)：_降低50%精准与闪避。

custom.dict.dict.buff_pos1 =增益效果
custom.dict.dict.buff_pos1_d =这一部分可能并不全面，但已记录了大部分常见的增益效果，部分少见的效果会写明主要来源。\n\n_力量激发(守望者践踏腐莓)：_增加一定的临时力量，每一定回合衰减1点。\n\n_激素涌动(死灵法师、激素飞镖)：_2倍移动速度与1.5倍攻击速度。\n\n_飞影(2层天赋夺命余势)：_移动不消耗回合，每次移动减少1回合持续时间。\n\n_奥术护甲(抗魔秘药)：_提供0~最大值的魔法减伤(同敌法刻印)，最大值每过一段时间减少1点。\n\n_神器充能：_每回合为装备着的所有神器回复一定充能(无充能的神器会有额外效果)，处于背包中且拥有可不装备使用的天赋的神器也有效。\n\n_树肤：_提供0~最大值的物理防御，最大值每过一段时间减少1点。\n\n_奥术屏障(也可称护盾)：_优先于生命吸收大部分伤害，但会随时间衰减(大部分情况每回合-1或是5%，取较小者)。\n\n_招架(招架附魔)：_同奥术屏障，固定持续5回合。\n\n_伤害储存(恒动附魔)：_可以附加于下一次攻击造成的伤害中(前提是下一次攻击造成的伤害来源为拥有恒动附魔的武器)，每回合会衰减2.5%(每回合至少衰减0.1点)。\n\n_赐福：_提高25%精准与闪避。\n\n_净化屏障：_免疫所有负面环境效果(包括天狗的电击装置、天狗的粉尘、蜘蛛网)。\n\n_全面净化(全面净化合剂)：_不会获得减益。\n\n_烈焰之力(龙血秘药)：_免疫燃烧，每次物理攻击会造成8回合燃烧，还会使践踏过的草地变为余烬。\n\n_寒霜之力(晶触秘药)：_免疫冻伤和冻结，每次物理攻击会造成3回合冻伤。\n\n_危险预知(先见秘卷)：_自动探查周围8格的地形。\n\n_危险预知(先见护符)：_侦测附近3格内是否存有隐藏陷阱，若有则会出现提示：你感到很不安。\n\n_极速：_3倍移动速度。\n\n_治疗：_每回合回复剩余总量一定比例(通常是25%)的生命，优先级非常高。\n\n_隐形：_绝大多数生物无法发现隐形的目标，但不代表完全不知道隐形者的方位，在攻击敌人或使用法杖、神器和卷轴后会立即失去该效果。\n\n_影遁(暗影斗篷)：_同隐形。\n\n_飘浮：_不会惊醒不与英雄相邻的敌人，能够无视一切地面效果如陷阱、特殊植物、深渊等，同时还会解除缠绕效果。\n\n_生命联结(矮人国王、牧师的4层法术血色羁绊)：_两角色平分伤害直到至少一方死亡。\n\n_发光：_将视野扩大至6格。\n\n_魔法免疫(驱魔秘卷)：_不会受到任何魔法伤害且无视一部分特殊能力(如魔像的传送)，但身上的诅咒、附魔和刻印会停止生效(可以随意装卸诅咒装备)，法杖和卷轴等魔法道具会无法使用，戒指和神器也不会提供任何加成，此外法杖和神器的充能以及干枯玫瑰召唤的悲伤幽灵的生命回复都会被暂停。\n\n_灵视：_拥有本层所有生物的3x3视野。\n\n_魔能透视(魔能透视合剂)：_拥有12格视野并且会完全透视，同时免疫失明效果。\n\n_虹光守卫(虹卫秘卷)：_在英雄被视野内的敌人锁定时会产生1个虹光幻像，视野内无敌人锁定英雄时则消失变为该效果，效果期间幻像每10回合回复1点生命。\n\n_充能(也可称法杖充能)：_所有法杖及魔杖每回合回复0.25点充能。\n\n_暗影融合(处于静谧花园中)：_隐形，视野变为3x3，每回合饱食度消耗降低1/3。\n\n_体力充沛(精力回复合剂)：_移动速度提高50%。\n\n_毒素之力(毒粹秘药)：_直到效果结束后的5回合内都免疫中毒且不受毒气影响，自身及周围8格会不断产生6单位毒气。\n\n_饱腹(全肉大饼)：_行动消耗的饱食度会改为消耗这一效果的持续时间，在此期间每过18回合还会额外回复1点生命。饰物_盐晶立方_可以延长这一来源的效果的持续时间，但额外生命回复的间隔也会被延长，因此该效果期间的额外生命回复总量不变。\n\n_草药疗养(阳春草)：_每回合回复_(40+最大生命)/150_点生命，移动后失去该效果。\n\n_植被护甲(地缚根、缠绕刻印)：_每次受到攻击能够吸收_(楼层数+5)/2_点伤害并消耗等同于吸收伤害的护甲量。\n\n_水灵治疗(水灵秘药)：_在水中时每回合回复_最大生命2%_的生命，不在水中时治疗量不会减少。\n\n_生命强化(根骨秘药)：_在一定的英雄等级之内最多增加_4+最大生命/20_的最大生命。\n\n_羽落(羽落秘药)：_免疫坠落伤害，每次坠落减少10回合持续时间。\n\n_灵壤护甲(灵壤法杖)：_吸收50%受到的伤害。\n\n_起电(战斗法师的雷霆法杖近战特效)：_有_(魔杖等级+1)/(魔杖等级+4)_的概率给予最多2.5回合(根据魔杖等级成长且呈对数衰减趋势，封顶10回合)的起电效果。起电效果会使自身免受雷霆法杖的伤害且雷霆法杖的电弧链接距离+1。


