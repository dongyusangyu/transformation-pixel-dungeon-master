custom.ch.mimic.mimicdocs.name=拟形地牢说明
custom.ch.mimic.mimicdocs.desc=此文件记载了拟形地牢挑战的大部分情况。
custom.ch.mimic.mimicdocs.ac_read=阅读
custom.ch.mimic.mimicdocs.base_button=基础等级：%d
custom.ch.mimic.mimicdocs.ability_button=异能等级：%d
custom.ch.mimic.mimicdocs.general = 宝箱怪属性修正分为五种：基础、抗性、进攻、防守、辅助。\n_基础_词条修正宝箱怪的基础数值如生命值、攻击力等。\n_抗性_词条针对特定伤害种类进行比例减免。\n_进攻_词条偏向于对敌方造成伤害、施加效果。\n_防守_词条偏向于减免伤害。\n_辅助_词条通过各种异能干扰对手。\n\n宝箱怪生成时具有一些基础词条、一个抗性词条与一些进攻防守辅助词条。\n\n宝箱怪分为四种：混合、进攻、防守、辅助。\n\n_混合_型宝箱怪没有特定的生成倾向。\n_进攻_型宝箱怪必定拥有攻击与进攻词条。\n_防守_型宝箱怪必定拥有生命与防守词条。\n_辅助_型宝箱怪必定拥有移速与辅助词条。\n\n以上必定生成的词条，等级会相对较高（混合型具有随机的较高等级）。\n\n词条生成时随机选择等级，若为0级则没有效果且不显示。词条生成等级会随着宝箱怪等级的上升而逐渐提高。\n\n金色宝箱怪具有小Boss属性。
custom.ch.mimic.mimicdocs.base=基础词条共6种，上限7级。主要修正宝箱怪的基础数据。
custom.ch.mimic.mimicdocs.base_health=_生命_：生命值变为%.2f倍
custom.ch.mimic.mimicdocs.base_atk=_攻击_：基础攻击力变为%.2f倍
custom.ch.mimic.mimicdocs.base_acc=_命中_：命中属性变为%.2f倍
custom.ch.mimic.mimicdocs.base_eva=_闪避_：闪避属性变为%.2f倍
custom.ch.mimic.mimicdocs.base_mov=_移速_：移动速度变为%.2f倍
custom.ch.mimic.mimicdocs.base_ksp=_攻速_：攻击速度变为%.2f倍
custom.ch.mimic.mimicdocs.res=抵抗词条共3种，上限3级。
custom.ch.mimic.mimicdocs.res_melee=_近战抵抗_：受到近战武器伤害减少%.2f
custom.ch.mimic.mimicdocs.res_missile=_远程抵抗_：受到投掷武器伤害减少%.2f
custom.ch.mimic.mimicdocs.res_magic=_魔法抵抗_：受到法杖、环境、效果等伤害减少%.2f
custom.ch.mimic.mimicdocs.atk=进攻词条共8种，上限3级。
custom.ch.mimic.mimicdocs.atk_berserk=_狂战士_：攻击伤害提升%.2f*失去生命值比例*失去生命值比例
custom.ch.mimic.mimicdocs.atk_suppress=_压制_：攻击伤害提升%.2f*剩余生命值比例*剩余生命值比例
custom.ch.mimic.mimicdocs.atk_defkill=_叠甲杀手_：额外造成目标防御力%.2f倍的伤害
custom.ch.mimic.mimicdocs.atk_combo=_连击_：每攻击一次，攻击伤害提升%.2f倍。
custom.ch.mimic.mimicdocs.atk_root=_缠绕之击_：攻击时，有%1$.2f概率缠绕目标%2$.2f回合。
custom.ch.mimic.mimicdocs.atk_curse=_诅咒之击_：攻击时，有%1$.2f概率给与目标%2$.2f回合的一些负面效果。
custom.ch.mimic.mimicdocs.atk_freeze=_冰寒之击_：攻击时，有%1$.2f概率冻伤目标%2$.2f回合。
custom.ch.mimic.mimicdocs.atk_fire=_烈焰之击_：攻击时，有%1$.2f概率燃烧目标。
custom.ch.mimic.mimicdocs.def=防御词条共8种，上限3级。
custom.ch.mimic.mimicdocs.def_copy=_防御复制_：获得对手%.2f倍的防御。
custom.ch.mimic.mimicdocs.def_combores=_历战坚韧_：受到非环境与效果伤害后，增加伤害抵抗，最多使伤害减少至%.2f倍。
custom.ch.mimic.mimicdocs.def_max=_最高限伤_：将超过最大生命值*%.2f的那部分伤害减少80%%。
custom.ch.mimic.mimicdocs.def_min=_最低限伤_：不超过最大生命值*%.2f的伤害变为1点。
custom.ch.mimic.mimicdocs.def_vampire=_吸血_：攻击命中时回复%.2f*攻击伤害的生命值。
custom.ch.mimic.mimicdocs.def_pushback=_反斥_：受到攻击时，50%%概率将对手击退%.1f格。此次伤害降低。
custom.ch.mimic.mimicdocs.def_per=_周期免伤_：将每第%.1f次伤害降为1点。
custom.ch.mimic.mimicdocs.def_immune=_负面免疫_：有%.2f的概率使负面效果无法施加。
custom.ch.mimic.mimicdocs.trk=辅助词条共8种，上限3级。
custom.ch.mimic.mimicdocs.trk_range=_攻距延长_：能攻击%.1f格内的目标。
custom.ch.mimic.mimicdocs.trk_disappear=_随机传送_：受到攻击时，%.2f概率随机传送到其它位置。此次伤害降低。
custom.ch.mimic.mimicdocs.trk_degrade=_降级诅咒_：攻击时有50%%概率赋予降级效果%.2f回合。
custom.ch.mimic.mimicdocs.trk_alert=_高度戒备_：受到伤害时，%.2f概率吸引本层敌人。
custom.ch.mimic.mimicdocs.trk_summon=_敌人召唤_：唤醒时，召唤%.1f个敌人。
custom.ch.mimic.mimicdocs.trk_scan=_隐身探测_：唤醒后，行动时解除%.1f格内角色的隐身
custom.ch.mimic.mimicdocs.trk_chargeeat=_充能吞噬_：攻击时，扣除所有法杖%.1f点充能。
custom.ch.mimic.mimicdocs.trk_hitback=_大力击退_：攻击时，50%%概率击退目标%.1f格。
custom.ch.mimic.mimicdocs.power_base=宝箱怪强度评定完全取决于词条以及等级。每个词条具有强度因数，所有词条的强度因数相乘并*1.1即得强度评定结果。强度因数极大地影响额外掉落物品质。\n\n金色宝箱怪由于强度远超当前楼层，其强度评定结果*1.9。\n\n以当前的词条等级，每个基础词条提供%.2f的强度因数。
custom.ch.mimic.mimicdocs.power_ability=以当前的词条等级，每个其它词条提供%.2f的强度因数。



