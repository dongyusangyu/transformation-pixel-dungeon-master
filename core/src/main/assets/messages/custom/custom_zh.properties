custom.dict.dict.melee_longsword_d =_4_阶武器，_16_力量需求，_4~25_基础伤害。\n\n它的伤害成长为_1~5_，精准修正为_1_，攻击延迟为_1_，攻击距离为_1_。\n\n_决斗家_武技(顺劈)：造成额外_6+武器等级_点伤害并且必定命中。如果顺劈击杀了一名敌人，则可在5回合内不消耗武技充能再次使用顺劈。

custom.dict.dict.melee_mace =硬头锤
custom.dict.dict.melee_mace_d =_3_阶武器，_14_力量需求，_3~16_基础伤害。\n\n它的伤害成长为_1~4_，精准修正为_1.28_，攻击延迟为_1_，攻击距离为_1_。\n\n_决斗家_武技(重击)：造成额外_5+1.5*武器等级_点伤害并施加5回合恍惚，使其精准和闪避减半。这一击必定命中但若不是伏击则没有额外伤害加成。

custom.dict.dict.melee_pickaxe =镐子
custom.dict.dict.melee_pickaxe_d=在接受巨魔铁匠任务时发放，完成任务后收回，可以花费250人情作为奖励获得(总人情超过2500则无需花费人情)。_2_阶武器，_14_力量需求，_2~15_基础伤害。\n\n它的伤害成长为_1~3_，精准修正为_1_，攻击延迟为_1_，攻击距离为_1_。\n\n在巨魔铁匠任务层中，无需装备即可挖掘暗金矿、攻击水晶尖塔、打破豺狼地卜师的磐岩护盾。而在常规楼层中，无需装备即可破坏储物木桶、监狱牢笼、悬吊牢笼、金属架构、长明基座和岩石瓦砾。\n\n_决斗家_武技(穿刺)：进行一次必定命中的普通攻击并施加3回合易伤，若为_硬质表皮_敌人则造成额外_8+2*武器等级_点伤害。\n_硬质表皮_敌人包括活化石像、召唤守卫、装甲石像、金色蜜蜂、蝇群、下水道螃蟹、寄居蟹、骷髅、DM-100、矿洞蜘蛛、DM-200、DM-201、水晶灵簇、水晶守卫、水晶尖塔、能量塔、DM-300、魔像、巨蝎、酸液巨蝎、锈蚀之拳、纳垢信徒和黄金魔像。

custom.dict.dict.melee_staff =法师魔杖
custom.dict.dict.melee_staff_d =_法师_初始携带的_1_阶武器，_10_力量需求，_1~7_基础伤害。\n\n它的伤害成长为_1~2_，精准修正为_1_，攻击延迟为_1_，攻击距离为_1_。\n\n初始灌注了_魔弹法杖_，能够释放所灌注法杖的效果并且充能会比法杖更快，充能上限也会更多1点(最多仍不会超过10)。\n可以灌注未鉴定的法杖，在灌注法杖时，若法杖等级(不包括奥术树脂提供的等级)大于等于魔杖等级，则魔杖会继承法杖等级并在此基础上增加原有的1级(如果魔杖原来无等级则只是直接继承法杖等级)。\n嬗变或升变只会改变魔杖灌注的法杖类型。\n\n_战斗法师_的魔杖近战效果：\n\n_固有(无论灌注何种法杖都有)：_为魔杖回复0.5点充能。\n\n_魔弹：_为除魔杖外的所有法杖回复0.5点充能。\n\n_雷霆：_有_(魔杖等级+1)/(魔杖等级+4)_的概率给予最多2.5回合(根据魔杖等级成长且呈对数衰减趋势，封顶10回合)的起电效果。起电效果会使自身免受雷霆法杖的伤害且雷霆法杖的电弧链接距离+1。\n\n_解离：_同索敌附魔，延长1格魔杖近战距离。\n\n_焰浪：_根据攻击目标及目标周围的情况有_燃烧角色数量*25%_(若无燃烧角色，则为_燃烧地格数量*5%_)的概率造成3x3范围的_2+2*魔杖等级~8+4*魔杖等级_点魔法伤害，触发后清除受影响目标身上的燃烧效果和周围存在的火焰，这一近战特效只会伤害敌人且不会摧毁物品及部分场景。\n\n_酸蚀：_有_(魔杖等级+1)/(魔杖等级+3)_的概率使目标获得20回合腐蚀淤泥。\n\n_冲击波：_若攻击目标身上有麻痹效果，则清除攻击目标的麻痹效果并造成_8+2*魔杖等级~12+3*魔杖等级_点魔法伤害，这一近战效果对单个目标存在3回合冷却。\n\n_灵壤：_获得_结算前伤害*33%_的灵壤护甲，灵壤守卫存在时则为其回复等量生命。\n\n_冰霜：_根据攻击目标身上的冻伤效果有_(冻伤剩余回合数-1)/9_的概率冻结敌人_冻伤剩余回合数_回合。\n\n_棱光：_致残攻击目标_(1+魔杖等级)_回合。\n\n_哨卫：_有_(魔杖等级+1)/(魔杖等级+5)_的概率为所有2~3阶哨卫分别恢复_1_，_2_次攻击次数，对于所有4~6阶哨卫则分别回复_9_，_12_，_16_点生命。\n\n_注魂：_攻击被魅惑的目标会获得_10+2*魔杖等级_点护盾，并且下一次对盟友(包括被魅惑的目标)施法时不会消耗自身生命。\n\n_腐化：_有_(魔杖等级+1)/(魔杖等级+6)_的概率施加_4+2*魔杖等级_回合的狂乱。\n\n_再生：_至少一方站在草中时，自身会获得_0.5*结算前伤害*(魔杖等级+2)/(魔杖等级+6)_点治疗量的草药疗养效果。

custom.dict.dict.melee_rapier =刺剑
custom.dict.dict.melee_rapier_d =_决斗家_初始携带的_1_阶武器，_10_力量需求，_1~8_基础伤害。\n\n它的伤害成长为_1~2_，精准修正为_1_，攻击延迟为_1_，攻击距离为_1_。\n\n可以抵挡_0~1_点物理伤害。\n\n_决斗家_武技(弓步刺)：对相距1格的敌人使用会向敌人突进，造成额外_5+1.5*武器等级_点伤害并且必定命中。

custom.dict.dict.melee_cudgel =权杖
custom.dict.dict.melee_cudgel_d=_牧师_初始携带的_1_阶武器，_10_力量需求，_1~8_基础伤害。\n\n它的伤害成长为_1~2_，精准修正为_1.4_，攻击延迟为_1_，攻击距离为_1_。\n\n_决斗家_武技(重击)：造成额外_3+1.5*武器等级_点伤害并施加5回合恍惚，使其精准和闪避减半。这一击必定命中但若不是伏击则没有额外伤害加成。

custom.dict.dict.melee_walkstick =手杖
custom.dict.dict.melee_walkstick_d=_绅士_初始携带的_1_阶武器，_10_力量需求，_1~7_基础伤害。\n\n它的伤害成长为_1~2_，精准修正为_1_，攻击延迟为_1_，攻击距离为_1_。\n\n攻击命中时有50%的概率获得1点护盾。\n\n_决斗家_武技(防御架势)：不消耗回合释放，在_5+武器等级_回合内使闪避属性翻三倍。

custom.dict.dict.melee_spearofconqueror =征讨者的长矛
custom.dict.dict.melee_spearofconqueror_d =_史莱姆娘_初始携带的_1_阶武器，_9_力量需求，_1~14_基础伤害。\n\n它的伤害成长为_1~3_，精准修正为_1_，攻击延迟为_1.5_，攻击距离为_2_。\n\n_决斗家_武技(刺退)：可对攻击距离内不与英雄相邻的敌人释放，造成额外_8+1.5*武器等级_点伤害并且必定命中，同时还会击退1格距离。

custom.dict.dict.melee_wakizashi =胁差
custom.dict.dict.melee_wakizashi_d=_忍者_初始携带的_1_阶武器，_10_力量需求，_1~7_基础伤害。\n\n它的伤害成长为_1~2_，精准修正为_1_，攻击延迟为_0.8_，攻击距离为_1_。\n\n_决斗家_武技(剑舞)：不消耗回合释放，在_6+武器等级_回合内使攻击速度增加60%且精准属性增加50%。

custom.dict.dict.melee_bracer =臂盾
custom.dict.dict.melee_bracer_d=_矮人公主_初始携带的_1_阶武器，_10_力量需求，_1~6_基础伤害。\n\n它的伤害成长为_1~1_，精准修正为_1_，攻击延迟为_1_，攻击距离为_1_。\n\n拥有_0~2_基础防御，_0~1_防御成长。\n\n_决斗家_武技(护卫)：在_7+武器等级_回合内完全抵挡攻击方造成的物理或魔法攻击。在主动造成伤害或回合结束后失去该效果。

custom.dict.dict.melee_latherwhip =皮鞭
custom.dict.dict.melee_latherwhip_d =_修士_初始携带的_1_阶武器，_10_力量需求，_1~7_基础伤害。\n\n它的伤害成长为_1~1_，精准修正为_1_，攻击延迟为_1_，攻击距离为_3_。\n\n_决斗家_武技(狠抽)：对当前所有处于攻击距离内的敌人都进行一次普通攻击并且必定命中。

custom.dict.dict.melee_steelwhip =钢鞭
custom.dict.dict.melee_steelwhip_d =_5_阶武器，_18_力量需求，_5~23_基础伤害。\n\n它的伤害成长为_1~5_，精准修正为_1_，攻击延迟为_1_，攻击距离为_3_。\n\n_决斗家_武技(狠抽)：对当前所有处于攻击距离内的敌人都进行一次普通攻击并且必定命中。

custom.dict.dict.melee_greatgreatgreatsword =巨巨巨剑
custom.dict.dict.melee_greatgreatgreatsword_d =_6_阶武器，_20_力量需求，_6~35_基础伤害。\n\n它的伤害成长为_1~7_，精准修正为_1_，攻击延迟为_1_，攻击距离为_3_。\n\n_决斗家_武技(顺劈)：造成_13+2*武器等级~42+8*武器等级_点伤害并且必定命中。若顺劈击杀敌人，则本次攻击不消耗回合，并可在5回合内免费再次使用顺劈。

custom.dict.dict.melee_sakurablossomblade =灵刀·樱吹雪
custom.dict.dict.melee_sakurablossomblade_d =_6_阶武器，_20_力量需求，_6~28_基础伤害。\n\n它的伤害成长为_1~7_，精准修正为_1_，攻击延迟为_1_，攻击距离为_1_。\n\n伏击伤害为_伤害范围的50%~最大伤害_(即50%的伏击修正)。每第5次直接命中会将目标击退最多2格并施加2回合易伤。亲手击杀58名敌人后可进化为_妖刀·赤染樱_；进化后失去击退与易伤，改为每次直接命中回复相当于伤害10%的生命。\n\n_决斗家_武技(潜行)：可闪现至最多3格远并给予_2_回合隐形。

custom.dict.dict.melee_chainmace =链球
custom.dict.dict.melee_chainmace_d =_6_阶武器，_22_力量需求，_6~20_基础伤害。\n\n它的伤害成长为_1~7_，精准修正为_1_，攻击延迟为_1_，攻击距离为_1_。\n\n装备后会生成中立铁球随从。普通随行时铁球与持有者同速，回返时为_3倍速度_，且无法被锁定、施加效果、伤害或杀死。投掷必须让铁球与落点的连线穿过持有者，持有者位于铁球与落点之间；落点可以是视野内的空地或生物。落点九宫格内所有生物受到一次近战伤害掷骰两倍的伤害，持有者只承受_1/4_伤害，不会击退。\n\n_决斗家_武技(横扫千军)：瞬间攻击视野内所有弹道有效的敌人，每名敌人受到_6+武器等级~20+7*武器等级_点必中伤害。索敌附魔可忽略弹道要求。

custom.dict.dict.melee_twohandedgreatsword =双手巨剑
custom.dict.dict.melee_twohandedgreatsword_d =_6_阶武器，_20_力量需求，_6~35_基础伤害。\n\n它的伤害成长为_1~7_，精准修正为_1_，攻击延迟为_0.5_，攻击距离为_1_。\n\n装备双手巨剑时，使用投掷武器或法杖会额外消耗1回合。\n\n_决斗家_武技(列车斩)：攻击视野内2格范围中所有弹道有效的敌人，每名敌人受到_6+武器等级~35+7*武器等级_点必中伤害，并强制触发武器自身的附魔。索敌附魔可忽略弹道要求。

custom.dict.dict.melee_palermosword =巴勒莫之剑
custom.dict.dict.melee_palermosword_d =_6_阶武器，_20_力量需求，_6~18_基础伤害。\n\n它的伤害成长为_2~3_，精准修正为_1.2_，攻击延迟为_0.5_，攻击距离为_1_。\n\n每第4次成功命中会获得1次_加速的未来_与_呼吸法_：前者使下一次普通攻击或解象不消耗回合，后者使下一次普通攻击或解象的首次命中以最大伤害的120%作为基础伤害。两种效果都不能叠加。\n\n_决斗家_武技(解象)：选择当前攻击距离之外1格内的敌人，安全突进最多1格并连续攻击至多3次；每次造成_10+3*武器等级~22+4*武器等级_点必中伤害并将目标击退1格。攻击距离加成会扩大选敌范围，但不增加位移距离；后续攻击不额外消耗回合或充能，英雄被麻痹或定身时会停止连击。

custom.dict.dict.melee_hundredtonhammer =100T锤
custom.dict.dict.melee_hundredtonhammer_d =_6_阶武器，_20_力量需求，_6~28_基础伤害。\n\n它的伤害成长为_1~6_，精准修正为_1.16_，攻击延迟为_1_，攻击距离为_1_。\n\n普通攻击有1/3概率击退目标_1+武器等级/7_格。\n\n_决斗家_武技(弹弹锤)：将相邻敌人击退_1+武器等级_格。主目标及其落点周围的敌人会受到_(武器等级*实际位移距离)/2_点物理伤害；无法位移时伤害为0。

custom.dict.dict.melee_oracleterminal =神谕终端[双蛇杖]
custom.dict.dict.melee_oracleterminal_d =_6_阶武器，_20_力量需求，_6~30_基础伤害。\n\n它的伤害成长为_1~7_，精准修正为_1_，攻击延迟为_1_，攻击距离为_1_。\n\n装备后每经过10回合行动时间随机切换形态：_打击武器(30%)_命中时有25%概率施加1回合麻痹与恍惚；_斩击武器(30%)_对攻击范围内其他敌人造成最终伤害25%的物理伤害；_突刺武器(30%)_施加原始值为_4+武器等级_的流血；_镰刀(10%)_使伤害提升50%，并在首次攻击每名敌人时将其击退1格并施加2回合易伤。\n\n_决斗家_武技(重击)：必定命中并施加5回合恍惚。伏击时造成普通武器伤害再加_5+四舍五入(1.5*武器等级)_点伤害，否则只造成普通武器伤害。

custom.dict.dict.melee_demontailwhip =恶魔尾鞭
custom.dict.dict.melee_demontailwhip_d =_6_阶武器，_20_力量需求，_6~30_基础伤害。\n\n它的伤害成长为_1~6_，精准修正为_1_，攻击延迟为_1_，攻击距离为_3+武器等级/7_。\n\n每次成功命中有50%概率施加随机负面效果。触发后有75%概率优先抽取持续4回合的虚弱、易伤、残废、失明或恐惧，其余情况优先抽取持续2回合的狂乱、迟缓、幻惑或麻痹；无法施加抽中的效果时会改选其他效果。\n\n_决斗家_武技(狠抽)：对当前所有处于攻击距离内的敌人造成_6+武器等级~30+6*武器等级_点伤害并且必定命中。

custom.dict.dict.melee_venomoussickle =猛毒小镰刀
custom.dict.dict.melee_venomoussickle_d =_6_阶武器，_20_力量需求，伤害为_6+武器等级~47+7×武器等级_，精准修正为_0.8_，攻击延迟为_1_，攻击距离为_1_。\n\n普通命中活目标时，有_20%+5%×武器等级_概率等权施加一种毒性：中毒_10+武器等级_回合；酸蚀_3+武器等级_回合、初始伤害_5+武器等级_；淤泥_10+武器等级_回合；或腐化法杖的非腐化负面效果，持续_6+3×武器等级_回合。\n\n普通命中后，离开原位并移动到同一目标的邻格，可对其进行一次不耗回合的追镰。追镰与取消延长的攻击不会触发毒性，也不会生成新的追击。\n\n_决斗家_武技（取消）：完成追镰后消耗_1_点充能，使下一次合法攻击不耗回合并按游戏原生伏击语义必定命中。
custom.dict.dict.melee_radiantgoldhalberd =耀金战戟
custom.dict.dict.melee_radiantgoldhalberd_d =_6_阶武器，_22_力量需求，_6~48_基础伤害。+9与+15时力量需求各降低1点；力量药剂精通仍额外降低2点。\n\n它的基础成长为每级_1~9_，每升3级额外增加_1~2_，从+12开始每级再额外增加_1~2_；两种额外成长可以同时生效。精准修正为_1_，攻击延迟为_2_，攻击距离为_3_。虚假之力对这件武器的净负重收益减半。\n\n普通命中分别进行两次独立判定：25%概率施加3回合残废与_3*武器等级_的流血，15%概率施加3回合恍惚；伏击时两项概率分别提高至75%与45%。\n\n_决斗家_武技(贯戟)：消耗_2_点充能，向所选方向发射不旋转的战戟投影，直到实体障碍物或地图边界。路径上的全部敌人都会受到_7+武器等级~7+11*武器等级_点必定命中的武器伤害，包括视野外敌人，并按从远到近的顺序击退1格。紧贴实体障碍或边界的敌人不会移动且本次伤害提高至120%；角色占位或击退免疫不提供增伤。有效路径上没有敌人时仍消耗充能和行动时间，紧邻障碍、没有飞行格时则取消施放。\n

custom.dict.dict.melee_mercuryblade =水银刀
custom.dict.dict.melee_mercuryblade_d =_6_阶武器，_20_力量需求，_6~28_基础伤害。\n\n它的伤害成长为_1~7_，精准修正为_1_，攻击延迟为_0.8_，攻击距离为_1_。\n\n装备后可消耗1份液金投射水银刀影，造成_10+2*武器等级~25+5*武器等级_点伤害并施加2回合黏糊糊。刀影共享本体的等级、强化与附魔，但不受神射之戒增幅。\n\n_决斗家_武技(水银凝结)：不消耗回合，使投射在5回合内不再消耗液金，并将黏糊糊延长至3回合。

custom.dict.dict.melee_auxiliarycore =辅助核心
custom.dict.dict.melee_auxiliarycore_d =_6_阶武器，_20_力量需求，_6~25_基础伤害。\n\n它的伤害成长为_1~7_，精准修正为_1_，攻击延迟为_1_，攻击距离为_1_。\n\n每次攻击固定附加10点魔法伤害。可以消耗辅助核心，为1至5阶近战或投掷武器覆盖施加_魔能_强化，并保留目标的等级、附魔与诅咒。魔能武器命中时额外造成_武器阶数~10_点魔法伤害；原始攻击距离低于2时攻击距离+1，原始攻击距离高于1时攻击延迟变为原来的2/3。\n\n_决斗家_武技(魔能提升)：使辅助核心附加的魔法伤害在3回合内由10点提升至20点，重复使用会刷新持续时间。

custom.dict.dict.melee_shortsword =短剑
custom.dict.dict.melee_shortsword_d =_2_阶武器，_12_力量需求，_2~15_基础伤害。\n\n它的伤害成长为_1~3_，精准修正为_1_，攻击延迟为_1_，攻击距离为_1_。\n\n_决斗家_武技(顺劈)：造成额外_4+武器等级_点伤害并且必定命中。如果顺劈击杀了一名敌人，则可在5回合内不消耗武技充能再次使用顺劈。

custom.dict.dict.melee_quarterstaff =铁头棍
custom.dict.dict.melee_quarterstaff_d =_2_阶武器，_12_力量需求，_2~12_基础伤害。\n\n它的伤害成长为_1~3_，精准修正为_1_，攻击延迟为_1_，攻击距离为_1_。\n\n可以抵挡_0~2_点物理伤害。\n\n_决斗家_武技(防御架势)：不消耗回合释放，在_4+武器等级_回合内使闪避属性翻三倍。

custom.dict.dict.melee_roundshield =圆盾
custom.dict.dict.melee_roundshield_d =_3_阶武器，_14_力量需求，_3~12_基础伤害。\n\n它的伤害成长为_1~2_，精准修正为_1_，攻击延迟为_1_，攻击距离为_1_。\n\n拥有_0~4_基础防御，_0~1_防御成长。\n\n_决斗家_武技(护卫)：在_5+武器等级_回合内完全抵挡攻击方造成的物理或魔法攻击。在主动造成伤害或回合结束后失去该效果。

custom.dict.dict.melee_runicblade =符文之刃
custom.dict.dict.melee_runicblade_d =_4_阶武器，_16_力量需求，_4~20_基础伤害。\n\n它的伤害成长为_1~6_，精准修正为_1_，攻击延迟为_1_，攻击距离为_1_。\n\n_决斗家_武技(符文挥砍)：进行一次必定命中的普通攻击并且有_3+0.5*武器等级_倍附魔强度。

custom.dict.dict.melee_sai =双钗
custom.dict.dict.melee_sai_d =_3_阶武器，_14_力量需求，_3~10_基础伤害。\n\n它的伤害成长为_1~2_，精准修正为_1_，攻击延迟为_0.5_，攻击距离为_1_。\n\n_决斗家_武技(连击)：装备后的每次近战或者投掷武器命中都会叠加连击次数(持续5回合，期间再次命中会重置持续时间)，每有1次连击次数，连击武技就增加_4+武器等级_点伤害。

custom.dict.dict.melee_scimitar =弯刀
custom.dict.dict.melee_scimitar_d =_3_阶武器，_14_力量需求，_3~16_基础伤害。\n\n它的伤害成长为_1~4_，精准修正为_1_，攻击延迟为_0.8_，攻击距离为_1_。\n\n_决斗家_武技(剑舞)：不消耗回合释放，在_4+武器等级_回合内使攻击速度增加60%且精准属性增加50%。

custom.dict.dict.melee_spear =长矛
custom.dict.dict.melee_spear_d =_2_阶武器，_12_力量需求，_2~20_基础伤害。\n\n它的伤害成长为_1~4_，精准修正为_1_，攻击延迟为_1.5_，攻击距离为_2_。\n\n_决斗家_武技(刺退)：可对攻击距离内不与英雄相邻的敌人释放，造成额外_9+2*武器等级_点伤害并且必定命中，同时还会击退1格距离。

custom.dict.dict.melee_sword =单手剑
custom.dict.dict.melee_sword_d =_3_阶武器，_14_力量需求，_3~20_基础伤害。\n\n它的伤害成长为_1~4_，精准修正为_1_，攻击延迟为_1_，攻击距离为_1_。\n\n_决斗家_武技(顺劈)：造成额外_5+武器等级_点伤害并且必定命中。如果顺劈击杀了一名敌人，则可在5回合内不消耗武技充能再次使用顺劈。

custom.dict.dict.melee_hammer =战锤
