custom.buffs.absoluteblindness.desc=対象は一時的に視力を失った！\n\n完全盲目の残り時間：%sターン
custom.buffs.attributemodifier.name=名称
custom.buffs.attributemodifier.desc=対象の複数の戦闘属性を修正する。現在の修正値：\n\n物理攻撃：x%.2f +%.2f\n\n物理防御：x%.2f +%.2f\n\n命中：x%.2f +%.2f\n\n回避：x%.2f +%.2f\n\n被ダメージ：x%.2f +%.2f\n\n体力：x%.2f +%.2f\n\n現在の体力：%d/%d
custom.buffs.deathcounter.name=名称
custom.buffs.deathcounter.desc=あなたの命は風前の灯火だ！\n\n正確で容赦のないカウントダウンが、この対象に残された命を記録している。ゼロになると対象は無条件で死亡する。\n\n残り%.2fターン。
custom.buffs.ignorearmor.name=名称
custom.buffs.ignorearmor.desc=この対象の攻撃はあらゆる防御力を無視する。\n\n効果の残り時間：%sターン。
custom.buffs.positivebuffprohibition.name=名称
custom.buffs.positivebuffprohibition.desc=この効果は有益な効果の継続を妨げ、付与された有益な効果を1ターン以内に消散させる。\n\nTHE WORLDは対象の時間を停止するため、妨げられない。\n\n残りの妨害時間：%sターン。
custom.buffs.thornsshield.name=名称
custom.buffs.thornsshield.desc=この効果は対象が受けるすべての攻撃ダメージを割合に応じて攻撃者へ返し、攻撃以外のダメージを無効化する。\n\n効果の残り時間：%sターン。
custom.buffs.thornsshield.ondeath=情報
custom.buffs.thornsshield.rankings_desc=情報
custom.buffs.zeroattack.name=名称
custom.buffs.zeroattack.desc=この効果により、対象のすべての攻撃ダメージが0になる。\n\n効果の残り時間：%sターン。
custom.buffs.zerodefense.name=名称
custom.buffs.zerodefense.desc=この効果により、対象の物理防御力が0になる。\n\n効果の残り時間：%sターン。
