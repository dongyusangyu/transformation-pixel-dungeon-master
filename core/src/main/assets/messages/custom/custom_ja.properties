
custom.dict.dict.armor_stylus_d=通常は鎧と王太子の指輪に使い、ランダムな刻印を付与する。呪いの刻印は変更できない。第2段階の天賦「刻筆・ブライアント」で武器にも使えるが、呪いは変更できない。
custom.dict.dict.artifact_eye_d=20のチャージを消費して次の攻撃を確実に回避する予知を得る。予知は最大_1+実レベル_層まで蓄積できる。最大レベル5、最大チャージ100、毎ターン_0.5+実レベル×0.1_回復。呪われるとチャージも回避もできない。
custom.dict.dict.artifact_key_d=チャージを使って扉や宝箱を開錠・施錠し、周囲に一時壁を作る。最大チャージは_3+レベル/2_で、鉄・金・水晶の鍵はそれぞれ1・2・5チャージ。呪われるとチャージできず開錠が失敗しやすい。
custom.dict.dict.artifact_necronomicon_d=死体の塵と写本を錬金して得る第6階の神器。敵を腐敗させ、死者を腐敗した亡霊として蘇らせる。呪いの効果と詠唱の仕組みは通常と異なる。
custom.dict.dict.artifact_tool_d=DM-400の初期神器。チャージで特殊ドローンを生産し、巻物を記録して最大レベル10まで強化する。ドローンは偵察、攻撃、護衛、爆破などの役割を持ち、一定ターンごとに回復する。
custom.dict.dict.buff_neg1_d=代表的な弱体効果の一覧。狂乱、出血、盲目、燃焼、呪燃、魅了、凍傷、酸蝕、腐化、定命、残疾、降級、冻结、幻惑、饥饿、麻痹、中毒、缠绕、迟缓、恐惧、眩晕、易伤、虚弱、催眠、魔法睡眠、灵魂标记、魂飞魄散、沉沦、众矢之的、延缓伤害、妄为、恍惚などの効果と解除条件を説明する。
custom.dict.dict.food_frozen_d=肉は種類に関係なく食べるのに3ターンかかり、150満腹度を回復する。神秘の肉、冷凍生肉、魂のロースト、焼肉、煮肉にはそれぞれ異なる確率効果がある。食事で得る効果は通常2ターン短い。
custom.dict.dict.food_pie_d=肉類、食料、肉パイを錬金して作る。3ターンで食べ、900満腹度と450ターンの満腹を得る。満腹中は行動で満腹効果を消費し、18ターンごとに1HP回復する。縮餐節食では効果が弱くなる。
custom.dict.dict.info_intro_d=このガイドは破碎注解版と破碎v3.3.8を基に、蜕变地牢の追加要素に合わせて改訂されている。内容は主にゲームの仕組みを説明する。
custom.dict.dict.info_shop_d=店は通常6・11・16階と20階に現れる。価格は基礎価格の_(1+階数/5)×5_倍で、階数に応じた武器、防具、投擲武器、薬、巻物、食料などを販売する。店主を二度攻撃すると商品を残して逃げる。
custom.dict.dict.melee_auxiliarycore_d=第6階の武器。攻撃に10点の魔法ダメージを追加し、消費して第5階以下の武器に魔力を注入できる。決闘家の武技で一時的に魔法ダメージが倍増する。
custom.dict.dict.melee_chainmace_d=第6階の鎖鉄球武器。鉄球を投げて広範囲に必中特大ダメージを与え、決闘家はチャージを使って視界内の敵を一掃できる。
custom.dict.dict.melee_demontailwhip_d=第6階の鞭。命中時に弱体効果を付与し、決闘家の武技で攻撃範囲内の全敵を必ず攻撃する。
custom.dict.dict.melee_greatgreatgreatsword_d=第6階、筋力20、基礎ダメージ6～35、射程3。決闘家の薙ぎ払いは追加ダメージを与え、撃破後は短時間再使用できる。
custom.dict.dict.melee_hundredtonhammer_d=第6階、筋力20、基礎ダメージ6～21。命中時に敵を吹き飛ばし、決闘家の武技は隣接敵を必ず吹き飛ばして眩暈を与える。
custom.dict.dict.melee_lakesword_d=第6階の湖剣。水と氷を利用した攻撃を行い、決闘家の武技は敵を凍結させる。
custom.dict.dict.melee_mercuryblade_d=第6階の水銀刀。液体金属を消費して刀影を投げ、決闘家は凝滞で短時間その消費を抑えられる。
custom.dict.dict.melee_mountainguard_d=第6階の盾武器。攻撃を防ぎ、チャージ後の武技で視界内の敵を盲目・遅延させる。
custom.dict.dict.melee_oracleterminal_d=第6階の形態変化武器。10ターンごとに鎚、半剣、槍、鎌、叉勺へ変化し、形態ごとに異なる攻撃と武技を持つ。
custom.dict.dict.melee_palermosword_d=第6階の長剣と鎖剣。連続攻撃で命中が上がり、4回命中すると加速の未来と呼吸法を得る。解象は最大4回突進する。
custom.dict.dict.melee_radiantgoldhalberd_d=第6階の非常に重い長柄武器。隣接する最大2体にも命中し、対象数が少ないほどダメージが増える。
custom.dict.dict.melee_sakurablossomblade=霊刀・桜吹雪＆妖刀・赤染桜
custom.dict.dict.melee_sakurablossomblade_d=第6階の霊刀。5回命中するごとに敵を2マス押し出して脆弱にし、58体撃破後に妖刀へ進化する。妖刀は命中時に使用者を回復し、決闘家は残像を残して瞬間移動する。
custom.dict.dict.melee_soulblade_d=第6階の魂刃。命中時に敵の最大HPに応じた魔法ダメージを与え、一定間隔で盾を得る。暮臨は次の3回の攻撃を高速化し射程を伸ばす。
custom.dict.dict.melee_staff_d=魔術師が初期所持する第1階の武器。魔弾の杖を注入済みで、杖の種類に応じて戦闘魔法使いの近接効果が変わる。未鑑定の杖も注入できる。
custom.dict.dict.melee_twohandedgreatsword_d=第6階、筋力20、基礎ダメージ6～35。装備中は投擲武器と杖に追加ターンが必要。列車斬は射線内の敵を必ず攻撃する。
custom.dict.dict.melee_venomoussickle_d=第6階の毒鎌。攻撃は毒と出血を広げ、決闘家の武技は敵を連続して切り裂く。
custom.dict.dict.misc_reason_d=修士の理性は100から始まり時間で回復しない。錬金、被ダメージ、罠、飢餓、呪われた装備で減少し、敵撃破、食事、灯火、净化、復活で回復する。0になると苦悩または美徳を得る。
custom.dict.dict.missile_gungnir_d=第6階の投擲武器。必ず命中して戻るが、投げるたびに現在HPを消費する。出血を付与し、出血中の敵を倒すと回復する。
custom.dict.dict.missile_portableblackhole_d=第6階の投擲武器。投げた地点へ、この階で同武器が刺さった生物を転送する。着地点は空き地でなければならない。
custom.dict.dict.special_ritualdagger_d=虔信者が得る特殊武器。装備せず使え、攻撃で血液の贈り物を付与する。13体撃破ごとに無料の必中刺突を行える。
custom.dict.dict.trinket_twin_demon_eyes_d=炎の眼とレーザーの眼を切り替える饰物。遠距離攻撃後に対象を精密ロックし、位置を明らかにする代わりに使用者を盲目にする。
custom.dict.dict.wand_corruption_d=無害な弾を撃ち、弱体効果を付与して敵を腐化させる。腐化耐性が高い敵には主要・副次弱体を順に与え、腐化免疫の敵には定命を与える。
custom.dict.dict.wand_cursedflame_d=呪燃を広げる緑色の火球を放つ杖。直撃ダメージと着地点の呪燃は強力で、錬金または罠変換で得られる。
custom.dict.dict.scroll_alter_d=バッグ内の対象アイテムを同種のランダムなアイテムへ変成し、強化・付加・エンチャント・刻印を保持します。6階装備はランダムな5階装備へ下げられます。昇格秘巻は武器と防具の階級を上げ、強化石は一属性を強める代わりに別属性を弱めます。強化石は6・11・16・20階の店にも並びます。
custom.dict.dict.duelist_ability_d=決闘士の防具能力と武器技は現在の職業・サブクラスに応じて選択されます。
custom.dict.dict.ring_wealth_d=宝物のドロップ率と品質を高めます。無限の塔では宝物階級に上限があります。
custom.dict.dict.buff_pos1_d=有益な状態効果です。効果は付与元によって異なります。
custom.dict.dict.trap_1_d=踏むと作動し、記載された効果を与えるダンジョンの罠です。
custom.dict.dict.misc_random_mode_d=Random mode reshuffles many dungeon rules from the current seed. The same seed produces the same random-mode results.\n\n_Items:_ items whose original generation chance is not zero, equipment tiers, and candidates inside the same item group are made as even as possible. Newly generated weapons, missile weapons, and armor receive a strength requirement offset from _-2 to +1_. Missile stacks are no longer always 3: they are 3 items 75% of the time, 2 items 20%, and 1 item 5%. Rings and wands generate at +0 to +3 with chances of 75%, 20%, 4%, and 1%.\n\n_Enchantments and curses:_ weapon enchantment pools, weapon curse pools, armor glyph pools, and armor curse pools are shuffled by seed. Pool sizes stay the same, but their contents may move between qualities. Positive weapon enchantments and armor glyphs ignore rarity when generated, choosing evenly from their full positive pools. Cursed wand effects also trigger evenly from all current cursed effects.\n\n_Crafting and scrolls:_ all four trinket catalyst choices are random trinkets. Scrolls of Metamorphosis skip the talent-type choice after the source talent is chosen and present 4 random options directly. Scrolls of Sublimation directly grant a random boss talent.\n\n_Enemies and traps:_ regular enemies have a 20% chance to be replaced by their rare variant when spawned; armored statues and crystal mimics use 40%, and tormented spirits use 10%. Wild traps are no longer limited by region, and guardian traps summon at least one guardian even in shallow floors.\n\n_Subclass kits:_ in random mode, some subclasses receive their core item if the hero does not already have it: Berserker and Gladiator get the Broken Seal, Battlemage gets a Mage's Staff imbued with a random wand, Assassin gets the Cloak of Shadows, Sniper gets the Spirit Bow, Priest and Paladin get the Holy Tome, AT-400 and AU-400 get the Instruction Tool, and Alchemist gets the Spray Gun.\n\nThe seed finder follows the current random-mode setting, and adding "random mode" to a query forces random-mode lookup for item generation and random talent information.
custom.dict.dict.misc_seal_d=カスタム要素で使われる謎の印です。挙動は関連するアイテムやイベントによって変わります。
custom.dict.dict.info_tier_d=装備の階級は基本性能と必要筋力を決めます。高階級ほど強力ですが、入手は困難です。
custom.dict.dict.info_melee_d=近接武器は隣接した敵を攻撃し、階級・強化・必要筋力に応じて性能が変わります。
custom.dict.dict.info_surface_d=0階は新周回の地表です。固定位置にNPCとテスト石像が現れ、中央の塔入口から無限の塔へ入れます。
custom.dict.dict.info_tower=無限の塔
custom.dict.dict.info_tower_d=無限の塔では独自の階層・部屋・罠・敵・報酬生成を行います。5階ごとにボス階があり、内容は今後も調整される可能性があります。
custom.dict.dict.tower_chapter=無限の塔
custom.dict.dict.tower_chapter_d=現在実装されている塔の敵と召喚体の情報です。
custom.dict.dict.info_feeling_d=通常階のほか、特殊な雰囲気階がランダムに生成されます。塔には追加の雰囲気もあります。
custom.dict.dict.info_lck_floor_d=ボス戦中は階層から離脱できず、飢えと自然回復が停止します。ボスへダメージを与えると一時的な自然回復時間を得ます。
custom.dict.dict.info_ranking_d=ランキングは総得点の降順です。ゲーム・宝探し・探索・ボス・クエスト得点に倍率を適用して算出します。
