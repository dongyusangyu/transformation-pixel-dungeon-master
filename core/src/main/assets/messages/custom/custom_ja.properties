custom.testmode.generator.testalignment.desc=指定した生物の陣営を変更します。使用時は、まず設定する陣営を選択し、その後、生物を選択して陣営を変更します。\n\n通常の陣営関係：\n_Enemy_は_Ally_および英雄と敵対し、_Ally_は_Enemy_と敵対します。_Neutral_は通常、どの生物とも敵対しません。\n\n特殊な陣営関係：\n_Enemy1_、_Enemy2_、_Enemy3_、_Enemy4_は、自陣営以外の3つの特殊陣営の生物とのみ敵対し、通常の陣営の生物とは自発的に敵対しません。
