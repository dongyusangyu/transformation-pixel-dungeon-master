custom.dict.dict.food_greenglowfruit_d=高塔ボスの_紳士エルフ_を倒すと入手できる。食べると3ターン消費し、_満腹度100_を回復すると同時に、50ターンの_酔い_（与えるダメージと受けるダメージが20%%減少）と_40点のバリア_を得る。\n\n_小食_チャレンジ中は_満腹度33_だけ回復する。\n\n食事ターンを減らす天賦にポイントを振っていない場合、食事で得る効果の持続時間はすべて2ターン短くなる。
custom.dict.dict.sourwinearoma_d=高塔ボスの_紳士エルフ_を倒すと入手できる。使用にターンを消費せず、英雄を中心とした_9x9範囲_の敵すべてに_5ターンの朦朧_を与える。
custom.dict.dict.food_greenglowfruit=緑光の果実
custom.dict.dict.scroll_extraction_d=高塔の店で常に1つ販売される。強化の巻物などで強化された装備に使用すると、装備に累積した強化回数を数え、同じ数の強化の巻物として取り出す。\n\n抽出に成功すると装備レベルがその数だけ下がり、記録された強化回数が消去される。装備レベルは_0以下_にはならない。
