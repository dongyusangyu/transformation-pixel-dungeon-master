custom.ch.boss.dm300hard.desc=DM-300はドワーフ史上最も強力な「防衛機械」だ。この恐ろしい機械は製造が非常に難しく、地下大都市の入口を守るために数台しか造られなかった。\n\n砲弾を_発射できる砲身_と、攻撃に使う_延長型_高出力ドリルを備えている。\n\n強化DM-300は4種類の砲塔を召喚して戦闘を支援する。\n\nDM-300は空の罠を通過するとエネルギーを吸収し、_少量のシールド_を生成して_砲塔の生成を速める_。\n\n現在の戦闘フェーズ：_%d_。次のフェーズまでの体力：_%d_。
