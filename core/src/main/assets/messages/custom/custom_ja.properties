custom.ch.mimic.mimicdocs.res=情報
custom.ch.mimic.mimicdocs.res_melee=_近接耐性_：近接武器からのダメージを%.2f減らす
custom.ch.mimic.mimicdocs.res_missile=_遠距離耐性_：投擲武器からのダメージを%.2f減らす
custom.ch.mimic.mimicdocs.res_magic=_魔法耐性_：杖、環境、効果などからのダメージを%.2f減らす
custom.ch.mimic.mimicdocs.atk=情報
custom.ch.mimic.mimicdocs.atk_berserk=_狂戦士_：攻撃ダメージが%.2f*失った体力の割合*失った体力の割合だけ増加
custom.ch.mimic.mimicdocs.atk_suppress=_抑圧_：攻撃ダメージが%.2f*残り体力の割合*残り体力の割合だけ増加
custom.ch.mimic.mimicdocs.atk_defkill=_重装殺し_：対象の防御力の%.2f倍の追加ダメージを与える
custom.ch.mimic.mimicdocs.atk_combo=_連撃_：攻撃するたび、攻撃ダメージが%.2f倍増加する。
custom.ch.mimic.mimicdocs.atk_root=_絡みつく一撃_：攻撃時、%1$.2fの確率で対象を%2$.2fターン拘束する。
custom.ch.mimic.mimicdocs.atk_curse=_呪いの一撃_：攻撃時、%1$.2fの確率で対象に%2$.2fターン持続する負の効果を与える。
custom.ch.mimic.mimicdocs.atk_freeze=_氷結の一撃_：攻撃時、%1$.2fの確率で対象を%2$.2fターン凍傷にする。
custom.ch.mimic.mimicdocs.atk_fire=_炎の一撃_：攻撃時、%1$.2fの確率で対象を燃やす。
custom.ch.mimic.mimicdocs.def=情報
custom.ch.mimic.mimicdocs.def_copy=_防御コピー_：相手の防御力の%.2f倍を得る。
custom.ch.mimic.mimicdocs.def_combores=_歴戦の強靭さ_：環境や効果以外のダメージを受けると耐性が増加し、ダメージを最大で%.2f倍まで減らす。
custom.ch.mimic.mimicdocs.def_max=_最大ダメージ制限_：最大体力*%.2fを超えるダメージの超過分を80%%減らす。
custom.ch.mimic.mimicdocs.def_min=_最小ダメージ制限_：最大体力*%.2f以下のダメージを1にする。
custom.ch.mimic.mimicdocs.def_vampire=_吸血_：攻撃命中時、攻撃ダメージの%.2f*に相当する体力を回復する。
custom.ch.mimic.mimicdocs.def_pushback=_反発_：攻撃を受けると、50%%の確率で相手を%.1fマス押し戻す。この攻撃のダメージは減少する。
custom.ch.mimic.mimicdocs.def_per=_周期的ダメージ軽減_：%.1f回ごとのダメージを1にする。
custom.ch.mimic.mimicdocs.def_immune=_負の効果無効_：%.2fの確率で負の効果を無効にする。
custom.ch.mimic.mimicdocs.trk=情報
custom.ch.mimic.mimicdocs.trk_range=_攻撃距離延長_：%.1fマス以内の対象を攻撃できる。
custom.ch.mimic.mimicdocs.trk_disappear=_ランダムテレポート_：攻撃を受けると、%.2fの確率で別の場所へランダムに転送される。この攻撃のダメージは減少する。
custom.ch.mimic.mimicdocs.trk_degrade=_降格の呪い_：攻撃時、50%%の確率で%.2fターン降格効果を与える。
custom.ch.mimic.mimicdocs.trk_alert=_厳戒態勢_：ダメージを受けると、%.2fの確率で階層内の敵を引き寄せる。
custom.ch.mimic.mimicdocs.trk_summon=_敵の召喚_：目覚めたとき、%.1f体の敵を召喚する。
custom.ch.mimic.mimicdocs.trk_scan=_透明化探知_：目覚めた後、行動時に%.1fマス以内のキャラクターの透明化を解除する
custom.ch.mimic.mimicdocs.trk_chargeeat=_充填吸収_：攻撃時、すべての杖から%.1fチャージを奪う。
custom.ch.mimic.mimicdocs.trk_hitback=_強力なノックバック_：攻撃時、50%%の確率で対象を%.1fマス押し戻す。
custom.ch.mimic.mimicdocs.power_base=ミミックの強さ評価は、特性とレベルだけで決まる。各特性には強さ係数があり、すべての係数を掛け合わせて*1.1すると強さ評価になる。強さ係数は追加ドロップの品質に大きく影響する。\n\n金色のミミックは現在の階層を大幅に上回る強さを持つため、強さ評価は*1.9される。\n\n現在の特性レベルでは、各基礎特性が%.2fの強さ係数を与える。
custom.ch.mimic.mimicdocs.power_ability=現在の特性レベルでは、その他の各特性が%.2fの強さ係数を与える。
