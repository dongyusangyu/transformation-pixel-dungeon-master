custom.ch.mimic.mimicdocs.base_health=_体力_：体力が%.2f倍になる
custom.ch.mimic.mimicdocs.base_atk=_攻撃_：基礎攻撃力が%.2f倍になる
custom.ch.mimic.mimicdocs.base_acc=_命中_：命中が%.2f倍になる
custom.ch.mimic.mimicdocs.base_eva=_回避_：回避が%.2f倍になる
