custom.buffs.attributemodifier.desc=대상의 여러 전투 속성을 수정합니다. 현재 수정값:\n\n물리 공격력: x%.2f +%.2f\n\n물리 방어력: x%.2f +%.2f\n\n정확도: x%.2f +%.2f\n\n회피: x%.2f +%.2f\n\n받는 피해: x%.2f +%.2f\n\n체력: x%.2f +%.2f\n\n현재 체력: %d/%d
