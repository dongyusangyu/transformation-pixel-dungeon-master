custom.ch.boss.hdkitem$kingamulet.desc=부적에는 먼지가 가득 쌓여 있어 오랫동안 이곳에 봉인되어 있었던 것 같습니다.\n\n부적에 남은 마력은 매우 약하지만, 제한된 범위 안에서는 여전히 사용자를 보호할 수 있습니다.\n\n사용하면 부적이 사용자를 대신해 피해를 막고, 사용자의 체력에 따라 그 피해를 두 배로 만들어 주변 적에게 되돌려 줍니다.\n\n부적은 아직 %d번 사용할 수 있습니다.
custom.ch.boss.hdkitem$kingamulet$damagecheater.desc=부적은 다음 %d번의 피해를 막아 주며, 사용자의 체력에 비례해 피해를 두 배로 만들어 주변 적에게 되돌려 줍니다.\n\n일정 수준 이상의 피해를 받아야만 부적의 보호가 활성화됩니다.
