custom.buffs.ignorearmor.desc=이 대상의 공격은 모든 방어력을 무시합니다.\n\n효과 남은 시간: %s턴.
custom.buffs.positivebuffprohibition.desc=이 효과는 긍정적 효과의 지속을 막아, 모든 긍정적 효과가 적용된 후 한 턴 안에 사라지게 합니다.\n\nTHE WORLD는 대상의 시간을 멈추므로 차단되지 않습니다.\n\n차단 남은 시간: %s턴.
custom.buffs.thornsshield.desc=이 효과는 대상이 받는 모든 공격 피해의 일정 비율을 공격자에게 되돌려 주며, 비공격 피해에 면역이 되게 합니다.\n\n효과 남은 시간: %s턴.
custom.buffs.thornsshield.rankings_desc=Yog-Dzewa-EX에게 삼켜짐
custom.buffs.zeroattack.desc=이 효과는 대상의 모든 공격 피해를 0으로 만듭니다.\n\n효과 남은 시간: %s턴.
custom.buffs.zerodefense.desc=이 효과는 대상의 물리 방어력을 0으로 만듭니다.\n\n효과 남은 시간: %s턴.
