
custom.dict.dict.armor_stylus_d=보통 갑옷과 왕자의 반지에 사용해 무작위 각인을 부여합니다. 저주받은 각인은 바꿀 수 없습니다. 2단계 특성으로 무기에도 사용할 수 있지만 저주는 바꿀 수 없습니다.
custom.dict.dict.artifact_eye_d=충전 20를 소비해 다음 공격을 확실히 회피하는 예지를 얻습니다. 최대 _1+실제 레벨_중첩, 최대 레벨 5와 충전 100입니다. 저주받으면 충전과 회피를 할 수 없습니다.
custom.dict.dict.artifact_key_d=충전으로 문과 상자를 열거나 잠그고 임시 벽을 만듭니다. 철·금·수정 자물쇠는 각각 1·2·5 충전이 필요하며 저주받으면 충전할 수 없고 개방이 자주 실패합니다.
custom.dict.dict.artifact_necronomicon_d=시체 가루와 문서를 연금해 얻는 6단계 유물입니다. 적을 타락시키고 시체를 타락한 망령으로 되살립니다.
custom.dict.dict.artifact_tool_d=DM-400의 시작 유물입니다. 충전으로 특수 드론을 만들고 강화 두루마리를 기록해 최대 10레벨까지 강화합니다. 드론은 정찰·공격·호위·폭발 등 여러 역할을 가집니다.
custom.dict.dict.buff_neg1_d=주요 약화 효과와 해제 조건을 정리한 목록입니다. 광란, 출혈, 실명, 화상, 저주불, 매혹, 동상, 산성, 타락, 운명, 불구, 격하, 동결, 현혹, 굶주림, 마비, 중독, 속박, 둔화, 공포, 기절, 취약, 약화, 수면, 마법 수면, 영혼 표식 등의 효과를 설명합니다.
custom.dict.dict.food_frozen_d=모든 고기는 먹는 데 3턴이 걸리고 포만도 150을 회복합니다. 신비한 고기, 냉동 생고기, 영혼 구이, 구운 고기, 스튜에는 서로 다른 확률 효과가 있습니다. 음식으로 얻은 효과는 보통 2턴 짧습니다.
custom.dict.dict.food_pie_d=고기와 식량, 고기 파이를 연금해 만듭니다. 3턴 동안 먹고 포만도 900과 450턴의 포만을 얻습니다. 포만 중에는 행동 대신 효과 지속시간을 소비하며 18턴마다 HP 1을 회복합니다.
custom.dict.dict.info_intro_d=이 안내서는 파쇄 주석판과 파쇄 v3.3.8을 바탕으로 변환 던전의 추가 요소에 맞게 개정되었습니다. 주로 게임 메커니즘을 설명합니다.
custom.dict.dict.info_shop_d=상점은 보통 6·11·16층과 20층에 나타납니다. 가격은 기본 가격의 _(1+층/5)×5_배이며 무기, 방어구, 투척 무기, 물약, 두루마리와 식량을 판매합니다. 상점 주인을 두 번 공격하면 상품을 두고 도망갑니다.
custom.dict.dict.melee_auxiliarycore_d=6단계 무기입니다. 공격에 마법 피해 10을 더하고, 소모해 5단계 이하 무기에 마력을 주입할 수 있습니다. 결투가 기술로 잠시 마법 피해를 두 배로 만듭니다.
custom.dict.dict.melee_chainmace_d=6단계 사슬 철구 무기입니다. 철구를 던져 넓은 범위에 반드시 명중하는 피해를 주며, 결투가는 충전으로 시야의 적을 쓸어버립니다.
custom.dict.dict.melee_demontailwhip_d=6단계 채찍입니다. 명중 시 약화 효과를 부여하고 결투가 기술로 사거리 안의 모든 적을 공격합니다.
custom.dict.dict.melee_greatgreatgreatsword_d=6단계, 힘 20, 기본 피해 6~35, 사거리 3입니다. 결투가의 휩쓸기는 추가 피해를 주며 적을 처치하면 잠시 재사용할 수 있습니다.
custom.dict.dict.melee_hundredtonhammer_d=6단계, 힘 20, 기본 피해 6~21입니다. 명중 시 적을 밀쳐내며 결투가 기술은 인접 적을 반드시 밀치고 멍하게 합니다.
custom.dict.dict.melee_lakesword_d=6단계 호수의 검입니다. 물과 얼음을 이용해 공격하고 결투가 기술은 적을 얼립니다.
custom.dict.dict.melee_mercuryblade_d=6단계 수은 칼날입니다. 액체 금속으로 칼날 그림자를 던지며, 결투가는 응고로 잠시 소비를 줄일 수 있습니다.
custom.dict.dict.melee_mountainguard_d=6단계 방패 무기입니다. 공격을 막고 충전 후 기술로 시야의 적을 실명시키고 둔화합니다.
custom.dict.dict.melee_oracleterminal_d=6단계 변형 무기입니다. 10턴마다 망치·반검·창·낫·포크 형태로 바뀌며 형태마다 공격과 기술이 다릅니다.
custom.dict.dict.melee_palermosword_d=6단계 장검과 사슬검입니다. 연속 공격으로 명중이 오르고 4회 명중하면 가속된 미래와 호흡법을 얻습니다. 해상은 최대 4회 돌진합니다.
custom.dict.dict.melee_radiantgoldhalberd_d=6단계의 매우 무거운 장병기입니다. 인접한 적 최대 2명도 공격하며 대상이 적을수록 피해가 증가합니다.
custom.dict.dict.melee_sakurablossomblade=영도·앵화설월 & 요도·적염앵
custom.dict.dict.melee_sakurablossomblade_d=6단계 영도입니다. 5회 명중할 때마다 적을 2칸 밀치고 취약하게 하며 58명 처치 후 요도로 진화합니다. 요도는 명중 시 사용자를 회복하고 결투가는 잔상을 남기며 순간이동합니다.
custom.dict.dict.melee_soulblade_d=6단계 영혼 칼날입니다. 명중 시 적 최대 HP에 비례한 마법 피해를 주고 일정 간격으로 보호막을 얻습니다. 황혼은 다음 3회 공격을 빠르게 하고 사거리를 늘립니다.
custom.dict.dict.melee_staff_d=마법사가 처음 지니는 1단계 무기입니다. 마탄의 마법봉이 주입되어 있으며, 지팡이 종류에 따라 전투 마법사의 근접 효과가 달라집니다.
custom.dict.dict.melee_twohandedgreatsword_d=6단계, 힘 20, 기본 피해 6~35입니다. 장착 중 투척 무기와 마법봉 사용에 추가 턴이 필요하며 열차 베기는 사거리 안의 적을 반드시 공격합니다.
custom.dict.dict.melee_venomoussickle_d=6단계 독 낫입니다. 공격으로 독과 출혈을 퍼뜨리고 결투가 기술로 적을 연속해서 베어냅니다.
custom.dict.dict.misc_reason_d=수도승의 고유 자원인 이성은 100에서 시작하고 시간으로 회복되지 않습니다. 연금, 피해, 함정, 굶주림, 저주 장비로 감소하며 처치, 식사, 횃불, 정화와 부활로 회복합니다. 0이 되면 고통 또는 미덕을 얻습니다.
custom.dict.dict.missile_gungnir_d=6단계 투척 무기입니다. 반드시 명중하고 돌아오지만 던질 때마다 현재 HP를 소모합니다. 출혈을 부여하며 출혈 중인 적을 처치하면 회복합니다.
custom.dict.dict.missile_portableblackhole_d=6단계 투척 무기입니다. 착탄 지점으로 이 층에서 같은 무기가 박힌 생물을 순간이동시킵니다. 착탄 지점은 빈 칸이어야 합니다.
custom.dict.dict.special_ritualdagger_d=경건한 자가 얻는 특수 무기입니다. 장착하지 않고 사용할 수 있으며 공격으로 혈액 공물을 부여합니다. 13명 처치마다 무료 필중 찌르기를 할 수 있습니다.
custom.dict.dict.trinket_twin_demon_eyes_d=화염 눈과 레이저 눈을 전환하는 장신구입니다. 원거리 공격 후 대상을 정밀 고정해 위치를 드러내지만 사용자를 실명시킵니다.
custom.dict.dict.wand_corruption_d=해를 주지 않는 탄환을 발사해 약화를 부여하고 적을 타락시킵니다. 저항이 높으면 주요·보조 약화를 차례로 적용하고, 타락 면역 적에게는 운명을 부여합니다.
custom.dict.dict.wand_cursedflame_d=저주불을 퍼뜨리는 초록 불덩이를 발사하는 마법봉입니다. 직접 피해와 착탄 지점의 저주불이 강력하며 연금 또는 함정 변환으로 얻습니다.
custom.dict.dict.scroll_alter_d=가방의 대상 아이템을 같은 종류의 무작위 아이템으로 변성하며 강화·부여·마법·각인을 유지합니다. 6단계 장비는 무작위 5단계 장비로 내려갑니다. 승격 비전서는 무기와 방어구의 단계를 올리고, 강화석은 한 속성을 강화하는 대신 다른 속성을 약화합니다. 강화석은 6·11·16·20층 상점에도 등장합니다.
custom.dict.dict.duelist_ability_d=결투가의 방어구 능력과 무기 기술은 현재 직업과 하위 직업에 따라 선택됩니다.
custom.dict.dict.ring_wealth_d=보물 드롭 확률과 품질을 높입니다. 무한의 탑에서는 보물 단계에 상한이 있습니다.
custom.dict.dict.buff_pos1_d=유익한 상태 효과입니다. 효과는 부여한 원천에 따라 다릅니다.
custom.dict.dict.trap_1_d=밟으면 작동하여 설명된 효과를 주는 던전 함정입니다.
custom.dict.dict.misc_random_mode_d=Random mode reshuffles many dungeon rules from the current seed. The same seed produces the same random-mode results.\n\n_Items:_ items whose original generation chance is not zero, equipment tiers, and candidates inside the same item group are made as even as possible. Newly generated weapons, missile weapons, and armor receive a strength requirement offset from _-2 to +1_. Missile stacks are no longer always 3: they are 3 items 75% of the time, 2 items 20%, and 1 item 5%. Rings and wands generate at +0 to +3 with chances of 75%, 20%, 4%, and 1%.\n\n_Enchantments and curses:_ weapon enchantment pools, weapon curse pools, armor glyph pools, and armor curse pools are shuffled by seed. Pool sizes stay the same, but their contents may move between qualities. Positive weapon enchantments and armor glyphs ignore rarity when generated, choosing evenly from their full positive pools. Cursed wand effects also trigger evenly from all current cursed effects.\n\n_Crafting and scrolls:_ all four trinket catalyst choices are random trinkets. Scrolls of Metamorphosis skip the talent-type choice after the source talent is chosen and present 4 random options directly. Scrolls of Sublimation directly grant a random boss talent.\n\n_Enemies and traps:_ regular enemies have a 20% chance to be replaced by their rare variant when spawned; armored statues and crystal mimics use 40%, and tormented spirits use 10%. Wild traps are no longer limited by region, and guardian traps summon at least one guardian even in shallow floors.\n\n_Subclass kits:_ in random mode, some subclasses receive their core item if the hero does not already have it: Berserker and Gladiator get the Broken Seal, Battlemage gets a Mage's Staff imbued with a random wand, Assassin gets the Cloak of Shadows, Sniper gets the Spirit Bow, Priest and Paladin get the Holy Tome, AT-400 and AU-400 get the Instruction Tool, and Alchemist gets the Spray Gun.\n\nThe seed finder follows the current random-mode setting, and adding "random mode" to a query forces random-mode lookup for item generation and random talent information.
custom.dict.dict.misc_seal_d=커스텀 콘텐츠에서 사용되는 수수께끼의 봉인입니다. 동작은 관련 아이템이나 이벤트에 따라 달라집니다.
custom.dict.dict.info_tier_d=장비 단계는 기본 성능과 필요 힘을 결정합니다. 높은 단계일수록 강력하지만 얻기 어렵습니다.
custom.dict.dict.info_melee_d=근접 무기는 인접한 적을 공격하며 단계·강화·필요 힘에 따라 성능이 달라집니다.
custom.dict.dict.info_surface_d=0층은 새 게임의 지표면입니다. NPC와 시험 석상이 고정 위치에 나타나며 중앙 입구에서 무한의 탑으로 들어갑니다.
custom.dict.dict.info_tower=무한의 탑
custom.dict.dict.info_tower_d=무한의 탑은 독립적인 층·방·함정·적·보상 생성을 사용합니다. 5층마다 보스 층이 있으며 내용은 계속 조정될 수 있습니다.
custom.dict.dict.tower_chapter=무한의 탑
custom.dict.dict.tower_chapter_d=현재 구현된 탑의 적과 소환수 정보입니다.
custom.dict.dict.info_feeling_d=일반 층 외에 특수 분위기 층이 무작위로 생성됩니다. 탑에는 추가 분위기도 있습니다.
custom.dict.dict.info_lck_floor_d=보스전 동안 층을 떠날 수 없고 허기와 자연 회복이 중지됩니다. 보스에게 피해를 주면 임시 자연 회복 시간을 얻습니다.
custom.dict.dict.info_ranking_d=랭킹은 총점 내림차순입니다. 게임·보물·탐험·보스·퀘스트 점수에 배율을 적용해 계산합니다.
custom.testmode.generator.testspecialization.name=커스텀 전문화 및 방어구 능력
custom.testmode.generator.testspecialization.desc=이 텐구 가면은 개조되어 어떤 전문화와 방어구 능력이든 선택할 수 있습니다.
custom.testmode.generator.testspecialization.no_armor=방어구 능력을 시험하려면 먼저 방어구를 장착해야 합니다.
custom.testmode.generator.testspecialization.subclass_title=전문화 선택
custom.testmode.generator.testspecialization.subclass_message=처음 12개 직업 중 하나를 고른 뒤 그 전문화를 선택합니다.
custom.testmode.generator.testspecialization.choose_subclass_message=적용할 전문화를 선택합니다. 현재 전문화 특성과 전용 효과가 교체됩니다.
custom.testmode.generator.testspecialization.armor_message=처음 12개 직업 중 하나를 고른 뒤 그 방어구 능력을 선택합니다.
custom.testmode.generator.testspecialization.confirm_subclass=이 전문화를 적용할까요? 현재 특성과 전용 효과가 교체됩니다.
custom.testmode.generator.testspecialization.confirm_armor=이 방어구 능력을 적용할까요? 현재 방어구 능력 특성이 교체됩니다.
custom.testmode.mobplacer.name=생물 배치기
custom.testmode.mobplacer.desc=지정한 위치에 설정된 생물을 생성합니다.
custom.testmode.mobplacer.forbidden=여기에는 생물을 배치할 수 없습니다.
custom.testmode.mobplacer.create_failed=이 위치에는 생성할 수 없습니다.
custom.testmode.mobplacer.category_neutral=중립 생물
custom.testmode.mobplacer.category_ally=아군
custom.testmode.mobplacer.category_tower_mobs=탑의 적
custom.testmode.towermobplacer.desc=지정한 위치에 테스트 보스, 탑 보스 또는 보스 하수인을 생성합니다.
custom.testmode.towermobplacer.forbidden=여기에는 보스나 하수인을 배치할 수 없습니다.
custom.testmode.towermobplacer.create_failed=이 위치에는 보스를 생성할 수 없습니다.
custom.testmode.towermobplacer.boss_present=이 층에는 이미 활동 중인 보스가 있습니다.
custom.testmode.towermobplacer.category_regional_boss_units=지역 보스 하수인
custom.testmode.towermobplacer.category_tower_boss_units=탑 보스 하수인
custom.testmode.testboss.testgoo.desc=グー 테스트 보스 설명입니다. (테스트 버전: 어느 층에도 배치할 수 있습니다.)
custom.testmode.testboss.testdm300.desc=DM-300 테스트 보스 설명입니다. (테스트 버전: 어느 층에도 배치할 수 있습니다.)
custom.testmode.testboss.testtengu.desc=天狗 테스트 보스 설명입니다. (테스트 버전: 어느 층에도 배치할 수 있습니다.)
custom.testmode.testboss.testyogdzewa.desc=ヨグ＝제바 테스트 보스 설명입니다. (테스트 버전: 어느 층에도 배치할 수 있습니다.)
custom.testmode.testboss.testdwarfking.desc=ドワーフ王 테스트 보스 설명입니다. (테스트 버전: 어느 층에도 배치할 수 있습니다.)
custom.testmode.testboss.testwarriorboss.desc=戦士？ 테스트 보스 설명입니다. (테스트 버전: 어느 층에도 배치할 수 있습니다.)
custom.testmode.testboss.testrogueboss.desc=盗賊？ 테스트 보스 설명입니다. (테스트 버전: 어느 층에도 배치할 수 있습니다.)
