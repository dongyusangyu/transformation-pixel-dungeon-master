custom.dict.dict.food_greenglowfruit_d=고탑 보스 _신사 엘프_를 처치하면 얻습니다. 먹는 데 3턴이 걸리며 _포만도 100_을 회복하고, 50턴 동안 _취기_(주는 피해와 받는 피해 20%% 감소)와 _보호막 40_을 얻습니다.\n\n_소식_ 도전 중에는 _포만도 33_만 회복합니다.\n\n식사에 필요한 턴을 줄이는 특성에 포인트를 투자하지 않았다면, 먹어서 얻는 효과의 지속 시간이 모두 2턴 줄어듭니다.
custom.dict.dict.sourwinearoma_d=고탑 보스 _신사 엘프_를 처치하면 얻습니다. 사용해도 턴을 소모하지 않으며, 영웅을 중심으로 한 _9x9 범위_의 모든 적에게 _5턴 기절_을 부여합니다.
custom.dict.dict.food_greenglowfruit=녹빛 열매
custom.dict.dict.scroll_extraction_d=고탑 상점에서 항상 하나를 판매합니다. 강화의 주문서 등으로 강화된 장비에 사용하면 장비에 누적된 강화 횟수를 세어 같은 수의 강화의 주문서로 추출합니다.\n\n추출에 성공하면 장비 레벨이 해당 수만큼 내려가고 기록된 강화 횟수가 지워집니다. 장비 레벨은 _0 이하_로 내려가지 않습니다.
