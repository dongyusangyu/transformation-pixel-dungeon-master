custom.buffs.consistbleeding.desc=지속 출혈은 일반 출혈보다 치명적입니다. 지속 출혈은 끝날 때까지 감소하지 않으며, 일정 수치 이상 쌓이면 치명적인 혈폭발을 일으킵니다.\n\n현재 출혈 중첩: %d\n\n턴당 피해: %.2f
