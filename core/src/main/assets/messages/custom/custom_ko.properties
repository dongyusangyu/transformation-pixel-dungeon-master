custom.ch.mob.cave.brute$bruterage.desc=이 놀 폭력배의 죽음은 피할 수 없지만, 너를 함께 끌고 가려 합니다!\n\n시간의 경과와 외부 피해 모두 보호막을 약화시킵니다. 보호막이 완전히 소진되면 폭력배는 완전히 죽습니다. 하지만 조심하세요. 이 단계에서 폭력배는 막대한 피해를 입힙니다!\n\n남은 보호막: %d.
