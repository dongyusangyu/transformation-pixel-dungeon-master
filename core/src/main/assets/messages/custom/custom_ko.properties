custom.ch.mimic.mimicdocs.def_min=_최소 피해 제한_：不超过最大生命值*%.2f的伤害变为1点。
custom.ch.mimic.mimicdocs.def_vampire=_흡혈_：공격정확도时回复%.2f*공격伤害的生命值。
custom.ch.mimic.mimicdocs.def_pushback=_반발_：受到공격时，50%%概率将对手击退%.1f格。此次伤害降低。
custom.ch.mimic.mimicdocs.def_per=_주기 피해 감소_：将每第%.1f次伤害降为1点。
custom.ch.mimic.mimicdocs.def_immune=_부정 효과 면역_：有%.2f的概率使负面效果无法施加。
custom.ch.mimic.mimicdocs.trk=보조 특성은 8종이며 최대 3레벨입니다.
custom.ch.mimic.mimicdocs.trk_range=_공격 거리 연장_：能공격%.1f格内的目标。
custom.ch.mimic.mimicdocs.trk_disappear=_무작위 순간이동_：受到공격时，%.2f概率무작위 순간이동到其它位置。此次伤害降低。
