custom.ch.boss.tenguhard$beamtowerability$beamtoweritem.desc=강화 DM-300이 소환한 원거리 마법 포탑입니다. 주기적으로 표적을 공격합니다.\n\n공격에는 특수 효과가 있습니다.
custom.ch.boss.dm300hard.desc=DM-300은 드워프가 지금까지 발명한 가장 강력한 "방어 기계"입니다. 이렇게 위협적인 기계는 제작이 매우 어려워, 드워프들은 지하 대도시의 입구를 지키기 위해 몇 대만 만들었습니다.\n\nDM-300에는 _포탄을 발사할_ 수 있는 포신과 공격에 사용하는 _연장형_ 고출력 드릴이 장착되어 있습니다.\n\n강화된 DM-300은 전투를 돕는 네 종류의 포탑을 소환합니다.\n\nDM-300은 빈 함정을 지나갈 때 에너지를 흡수하여 _소량의 보호막_을 생성하고 _포탑 생성을 가속_할 수 있습니다.\n\n현재 전투 단계: _%d_. 다음 단계까지 필요한 체력: _%d_.
