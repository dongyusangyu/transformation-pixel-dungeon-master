custom.ch.boss.goohard.name=empowered Goo
custom.ch.boss.goohard.notice=Goo-goo!
custom.ch.boss.goohard.defeated=Goo... goo...
custom.ch.boss.goohard.!!!=!!!
custom.ch.boss.goohard.pumpup=Goo is constantly pumping itself up!
custom.ch.boss.goohard.enraged=enraged
custom.ch.boss.goohard.gluuurp=Gluuuuurp!
custom.ch.boss.goohard.rankings_desc=Digested by empowered Goo
custom.ch.boss.goohard.desc=We know very little about Goo. It may not even be a creature, but an entity born when the wicked matter gathered on the sewer surface gained basic intelligence. In any case, this creature was clearly created by dark magic.\n\nIts gelatinous nature has absorbed a great deal of dark energy. You can feel a chill just by approaching it. If Goo uses that energy to attack you, you certainly won't last long.\n\nEmpowered Goo retains most of the original version's abilities, and adds many abilities _centered on water_.\n\nWhen all 8 tiles around empowered Goo are water, its defense is greatly weakened, but its speed and offensive power are absurdly enhanced.
custom.ch.boss.goomini.name=Goo split
custom.ch.boss.goomini.desc=A swift-moving split of Goo.\n\nAlthough they look harmless, they will actively explode several turns after spawning, causing damage over a fairly large area. If destroyed before then, the explosive threat is greatly reduced.
custom.ch.boss.goomini.!!!=!!
custom.ch.boss.tenguhard.name=empowered Tengu
custom.ch.boss.tenguhard.notice_gotcha=Got you, %s!
custom.ch.boss.tenguhard.interesting=Time to make this fight more interesting...
custom.ch.boss.tenguhard.more_interesting=Time to go one step further!
custom.ch.boss.tenguhard.notice_have=Your life is mine, %s!
custom.ch.boss.tenguhard.defeated=At last... I am free...
custom.ch.boss.tenguhard.rankings_desc=Assassinated by empowered Tengu
custom.ch.boss.tenguhard.desc=A famous and mysterious assassin, named after the etching on his mask.\n\nTengu wears shackles on his wrists and below his knees, but he seems to have escaped the restraint of their chains long ago.\n\nHe will use traps, deceptive magic, and precise lethal attacks to eliminate the only person who can stop his escape: you.\n\nEmpowered Tengu has slightly improved stats, enhanced skill logic, and more sinister abilities.\n\nWhen empowered Tengu continuously attacks a target, hitting the target several times produces an additional effect. Jumping clears this count.
custom.ch.boss.tenguhard.throw_warning=Tengu is about to use a special shuriken!
custom.ch.boss.tenguhard$bombability$bombblob.desc=Overheated smoke and dust roil here. Watch out, it's about to explode!
custom.ch.boss.tenguhard$bombability$bombitem.name=smoke bomb
custom.ch.boss.tenguhard$bombability$bombitem.cant_pickup=It is fixed to the ground, and you cannot move it!
custom.ch.boss.tenguhard$bombability$bombitem.desc=Tengu threw a strangely shaped bomb here, constantly swelling with scorching smoke. It is ticking, seemingly counting down to an explosion!\n\nThe bomb is embedded in the ground, so you cannot pick it up.
custom.ch.boss.tenguhard$fireability$fireblob.desc=Tengu scattered fine powder here that has begun to smoke. It's about to ignite!
custom.ch.boss.tenguhard$beamtowerability$beamtoweritem.name=energy-focusing device
custom.ch.boss.tenguhard$beamtowerability$beamtoweritem.cant_pickup=You cannot pick up such a burning-hot device!
custom.ch.boss.tenguhard$beamtowerability$beamtoweritem.desc=Tengu threw a strange device here, seemingly infused with some destructive magic. It periodically fires piercing magical rays in all directions.\n\nBecause the device is quite hot, you cannot pick it up.
custom.ch.boss.dm300hard.name=empowered DM-300
custom.ch.boss.dm300hard.desc=DM-300 is the most powerful "defense machine" the dwarves ever invented. Such a fearsome machine is extremely difficult to manufacture, so the dwarves only built a few to guard the entrance to their underground metropolis.\n\nIt is equipped with a cannon barrel that can _fire shells_ and an _extended_ high-power drill for attacking.\n\nEmpowered DM-300 summons four kinds of turrets to assist in battle.\n\nWhen DM-300 passes over an empty trap, it can draw energy from it, generating _a small amount of shielding_ and _speeding up turret generation_.\n\nCurrent combat phase: _%d_. Health until next phase: _%d_.
custom.ch.boss.dm300hard.damaged=D A M A G E  T A K E N.  D E F E N S E  L E V E L  I N C R E A S E D!
custom.ch.boss.dm300hard.shield=DM-300 drew energy from the trap!
custom.ch.boss.dm300hard.notice=UNAUTHORIZED PERSONNEL DETECTED
custom.ch.boss.dm300hard.die=FATAL ERROR! ATTEMPTING RE-
custom.ch.boss.dm300hard.def_verb=blocked
custom.ch.boss.dm300hard.ranking_desc=Crushed to death by DM-300
custom.ch.boss.spellcaster$frostcaster.name=Caster-Frost
custom.ch.boss.spellcaster$frostcaster.desc=A ranged spell turret summoned by empowered DM-300. It launches ranged attacks at its target every so often.\n\nAttack pattern: fires a ray at the target location, then next turn that location fires missiles in the four cardinal directions. Inflicts _chill_.
custom.ch.boss.spellcaster$explosioncaster.name=Caster-Disintegration
custom.ch.boss.spellcaster$explosioncaster.desc=A ranged spell turret summoned by empowered DM-300. It launches ranged attacks at its target every so often.\n\nAttack pattern: fires a ray at the target location, affecting a cross-shaped area centered there, then next turn that location fires rays in the four diagonal directions. The first attack inflicts _mark_.\n\nMarked targets take greatly increased damage from all spell turrets.
custom.ch.boss.spellcaster$lightcaster.name=Caster-Light
custom.ch.boss.spellcaster$lightcaster.desc=A ranged spell turret summoned by empowered DM-300. It launches ranged attacks at its target every so often.\n\nAttack pattern: fires a beam at the target location, then next turn updates the target location and fires three scattered beams from the turret. Inflicts _blindness_.\n\nThis turret gains a stronger benefit from mark.
custom.ch.boss.spellcaster$bouncecaster.name=Caster-Bounce
custom.ch.boss.spellcaster$bouncecaster.desc=A ranged spell turret summoned by empowered DM-300. It launches ranged attacks at its target every so often.\n\nAttack pattern: fires a ray at the target location, then next turn updates the target location and fires a ray from the previous hit location. Inflicts _mark_.\n\nMarked targets take greatly increased damage from all spell turrets.
custom.ch.boss.spellcaster.marked=marked
custom.ch.boss.newharddk.name=empowered Dwarf King
custom.ch.boss.newharddk.notice=You dare trespass upon royal ground! Know your place!
custom.ch.boss.newharddk.prepare_to_sacrifice=Die a glorious death!
custom.ch.boss.newharddk.sacrifice_finished=I. Am. Immortal!
custom.ch.boss.newharddk.why_this=I. Am... Why! Why?!
custom.ch.boss.newharddk.empower=Wretches! I command you to kill this intruder at once!
custom.ch.boss.newharddk.phase_1_done=Who dares come here!
custom.ch.boss.newharddk.phase_2_done=You cannot kill me!
custom.ch.boss.newharddk.phase_3_done=You cannot kill me, %s. I. Am. Immortal!
custom.ch.boss.newharddk.teleport_1=Servants, seize this one at once!
custom.ch.boss.newharddk.teleport_2=You lot, hold this one back!
custom.ch.boss.newharddk.defeated=You ignorant fool... you will ruin everything...
custom.ch.boss.newharddk.hint_phase_1=The Dwarf King is protected by a powerful force!
custom.ch.boss.newharddk.hint_phase_2=The Dwarf King is protected by special magic. Perhaps the right kind of attack can break it?
custom.ch.boss.newharddk.hint_phase_3=The Dwarf King has infused curses into the statues. Dismantle them quickly!
custom.ch.boss.newharddk.hint_phase_4=The Dwarf King is performing a ritual. Clear out the summoned enemies quickly!
custom.ch.boss.newharddk.rankings_desc=Fell before empowered Dwarf King
custom.ch.boss.newharddk.curse_kill=You fell beneath the Dwarf King's curse...
custom.ch.boss.newharddk.desc=Many years ago, one of the strongest mages in the dwarven council discovered secret arts beyond life and death. Soon, with this powerful force, he controlled and corrupted the royal family and the entire council, stretching his claws toward every dwarf in the kingdom. Now he has become the king of the dwarves, ruling over a vast host of undead.\n\nEmpowered Dwarf King is an extremely aggressive foe, commanding special dwarven forces and using arts of life and death to destroy intruders.
custom.ch.boss.hdkbuff$mustphysicalatk.name=non-melee absorption
custom.ch.boss.hdkbuff$mustphysicalatk.desc=Absorbs all non-melee damage from you. You can break this effect with melee attacks.
custom.ch.boss.hdkitem$statuepickaxe.name=small pickaxe
custom.ch.boss.hdkitem$statuepickaxe.desc=A lightweight pickaxe, convenient for dismantling small stones and somewhat useful in battle.\n\nThe pickaxe can break walls, but doing so takes a long time.\n\nBecause it is very light, switching to this weapon takes no time.
custom.ch.boss.hdkitem$statuepickaxe.ac_dig=Dismantle
custom.ch.boss.hdkitem$statuepickaxe.not_allowed=You cannot break the wall here!
custom.ch.boss.hdkitem$statuepickaxe.out_map=You cannot reach outside the map!
custom.ch.boss.hdkitem$statuepickaxe.not_adjacent=You can only dismantle adjacent walls!
custom.ch.boss.hdkitem$statuepickaxe.prompt=Choose a wall to dismantle
custom.ch.boss.hdkitem$statuepickaxe.null_target=You cannot choose an invalid target.
custom.ch.boss.hdkitem$statuepickaxe.need_equip=You need to equip this weapon first.
custom.ch.boss.hdkitem$kingamulet.name=king's amulet
custom.ch.boss.hdkitem$kingamulet.desc=The amulet is covered in dust and looks as if it has been sealed here for a long time.\n\nThough the magic remaining in the amulet is very weak, it can still protect its user within a limited range.\n\nAfter use, the amulet will block damage for the user and return it doubled to nearby enemies based on the user's health.\n\nThe amulet can still be used %d times.
custom.ch.boss.hdkitem$kingamulet.ac_apply=USE
custom.ch.boss.hdkitem$kingamulet.already=You are already under the amulet's protection!
custom.ch.boss.hdkitem$kingamulet.use_up=The amulet exhausted its magic and vanished into endless darkness.
custom.ch.boss.hdkitem$kingamulet$damagecheater.name=amulet protection
custom.ch.boss.hdkitem$kingamulet$damagecheater.desc=The amulet will block the next %d instances of damage for you, and return damage doubled to nearby enemies based on your health.\n\nOnly damage of sufficient magnitude can activate the amulet's protection.
custom.ch.boss.hdksummon$hdkstatue.name=king's statue
custom.ch.boss.hdksummon$hdkstatue.desc=A statue summoned by the Dwarf King, perhaps containing unfathomable magic. It would be best to dismantle it quickly.\n\nThe statue is very sturdy, and ordinary weapons can hardly dismantle it.
custom.ch.boss.hdksummon$hdkghoul.name=dwarven ghouls
custom.ch.boss.hdksummon$hdkghoul.desc=As the dwarven kingdom gradually declined and the current Dwarf King seized absolute power, some weaker dwarves, or dwarves who resisted him, were treated unjustly. As the Dwarf King mastered dark magic, these dwarves gradually submitted to his will and eventually became pawns in his army.\n\nBecause they have been corrupted by the Dwarf King, they no longer seek companions in battle.
custom.ch.boss.hdksummon$speedymonk.name=speedy monk
custom.ch.boss.hdksummon$speedymonk.desc=These monks are fanatical believers, doing everything they can to protect the king from all foreign peoples. Their zeal caused them to hand their wills to the king, leaving only mindless shells wandering the city.\n\nDwarven monks wear no armor and carry no weapons, relying only on unarmed combat to repel enemies.\n\nSpeedy monks have high movement and attack speed, but cannot focus enough to parry the next strike.
custom.ch.boss.hdksummon$evasivemonk.name=evasive monk
custom.ch.boss.hdksummon$evasivemonk.desc=These monks are fanatical believers, doing everything they can to protect the king from all foreign peoples. Their zeal caused them to hand their wills to the king, leaving only mindless shells wandering the city.\n\nDwarven monks wear no armor and carry no weapons, relying only on unarmed combat to repel enemies.\n\nEvasive monks have stronger evasion.
custom.ch.boss.hdksummon$tankmonk.name=armored monk
custom.ch.boss.hdksummon$tankmonk.desc=These monks are fanatical believers, doing everything they can to protect the king from all foreign peoples. Their zeal caused them to hand their wills to the king, leaving only mindless shells wandering the city.\n\nArmored monks trade speed for higher defense.
custom.ch.boss.hdksummon$cursewarlock.name=curse warlock
custom.ch.boss.hdksummon$cursewarlock.desc=When dwarven interests shifted from engineering to occult studies, warlocks began to hold power in the city. They started with elemental magic, but soon began studying demonology and necromancy. The strongest warlock seized the kingship of the dwarven kingdom. If the other warlocks wanted to continue practicing dark magic, they had to surrender their mental freedom and give their wills to his control.\n\nThese warlocks wield powerful disruptive magic. They can temporarily suppress the upgrade magic of equipment, draw charge from wands, or interfere with targets using various debuffs.
custom.ch.boss.hdksummon$healingwarlock.name=healing warlock
custom.ch.boss.hdksummon$healingwarlock.desc=When dwarven interests shifted from engineering to occult studies, warlocks began to hold power in the city. They started with elemental magic, but soon began studying demonology and necromancy. The strongest warlock seized the kingship of the dwarven kingdom. If the other warlocks wanted to continue practicing dark magic, they had to surrender their mental freedom and give their wills to his control.\n\nThese warlocks trade part of their damage and curse ability for the power to heal the king and their companions.
custom.ch.boss.hdksummon$dpswarlock.name=destruction warlock
custom.ch.boss.hdksummon$dpswarlock.desc=When dwarven interests shifted from engineering to occult studies, warlocks began to hold power in the city. They started with elemental magic, but soon began studying demonology and necromancy. The strongest warlock seized the kingship of the dwarven kingdom. If the other warlocks wanted to continue practicing dark magic, they had to surrender their mental freedom and give their wills to his control.\n\nThese warlocks are slower, but their dark magic can deal tremendous magical damage to targets!
custom.ch.boss.dwarfkinghard.name=empowered Dwarf King
custom.ch.boss.dwarfkinghard.notice=You dare trespass upon royal ground! Know your place!
custom.ch.boss.dwarfkinghard.lifelink_1=Servants, give your lives to me at once!
custom.ch.boss.dwarfkinghard.lifelink_2=For my great work, die gloriously!
custom.ch.boss.dwarfkinghard.teleport_1=Servants, seize this one at once!
custom.ch.boss.dwarfkinghard.teleport_2=You lot, hold this one back!
custom.ch.boss.dwarfkinghard.buff_all=You lot, eliminate this one at once!
custom.ch.boss.dwarfkinghard.sacrifice=Die a glorious death!
custom.ch.boss.dwarfkinghard.death_rattle=Servants, hold this place!
custom.ch.boss.dwarfkinghard.more_summon=Servants, attack together!
custom.ch.boss.dwarfkinghard.wave_1=Enough! Fight for my rebirth, you slaves!
custom.ch.boss.dwarfkinghard.wave_2=Fight again! Fight for the king!
custom.ch.boss.dwarfkinghard.wave_3=Wretches! I command you to kill this intruder at once!
custom.ch.boss.dwarfkinghard.enraged=You cannot kill me, %s. I. Am. Immortal!
custom.ch.boss.dwarfkinghard.losing=No! You must not... you do not know what lies buried beneath my kingdom...
custom.ch.boss.dwarfkinghard.defeated=You ignorant fool... you will ruin everything...
custom.ch.boss.dwarfkinghard.rankings_desc=Fell before empowered Dwarf King
custom.ch.boss.dwarfkinghard.desc=Many years ago, one of the strongest mages in the dwarven council discovered secret arts beyond life and death. Soon, with this powerful force, he controlled and corrupted the royal family and the entire council, stretching his claws toward every dwarf in the kingdom. Now he has become the king of the dwarves, ruling over a vast host of undead.\n\nThe Dwarf King is an extremely aggressive foe, and will try to suppress intruders with the undead army under his command.\n\nEmpowered Dwarf King has greatly increased health, new abilities, and new logic.\n\nNew abilities:\n\nImmediately summons two followers.\nGrants all followers increased damage and health regeneration.\nCauses up to four followers to summon another follower on death.\nCauses all followers to explode after several turns, dealing massive damage to nearby enemies.
custom.ch.boss.dwarfkinghard$dkghoul.rankings_desc=Fell before empowered Dwarf King
custom.ch.boss.dwarfkinghard$dkmonk.rankings_desc=Fell before empowered Dwarf King
custom.ch.boss.dwarfkinghard$dkwarlock.rankings_desc=Fell before empowered Dwarf King
custom.ch.boss.dwarfkinghard.str_empower=damage boost
custom.ch.boss.yogreal.name=Yog-Dzewa-EX
custom.ch.boss.yogreal.notice=I  S E E  Y O U
custom.ch.boss.yogreal.darkness=Darkness is closing in...
custom.ch.boss.yogreal.hope=All. Your. Hope. Is. Vanity.
custom.ch.boss.yogreal.defeated=...
custom.ch.boss.yogreal.rankings_desc=Devoured by Yog-Dzewa-EX
custom.ch.boss.yogreal.desc=Yog-Dzewa is an ancient god; a vast monster that extends its power toward mortal worlds and devours them to feed its endless growth. The dwarves must have attracted the attention of this great horror while meddling with dark magic, and have tried ever since to control him and prevent him from consuming the outside world.\n\nThis Old God originates from a primal dimension full of magic and chaos, and cannot bring his true form into this world. Thus, he created avatars of himself and summoned demons as servants to carry out his commands.\n\nThis great eye is the focus of the Old God's power in this world. Though the eye itself cannot move, it can fire powerful magical beams and summon various demonic servants to aid it.\n\nIt will destroy troublesome creatures such as sheep and bees.
custom.ch.boss.yogreal.desc_spawners=You feel demonic energy flowing down from the floors above into the eye of the Old God. Something you left alive above is feeding energy back to the Old God. _The Old God will use this energy to summon stronger minions!_
custom.ch.boss.yogreal.destroy_tile=Something nearby seems to have changed!
custom.ch.boss.yogreal$larva.name=larva of the Old God
custom.ch.boss.yogreal$larva.rankings_desc=Devoured by Yog-Dzewa-EX
custom.ch.boss.yogreal$larva.desc=These tiny creations of the Old God are crude creatures that are easy to make. Though individual larvae are very fragile, they can be produced rapidly and become hard to withstand once they gather in large numbers.\n\nTheir attacks are somewhat poisonous.\n\n_Greatly reduces damage taken while near the Old God._
custom.ch.boss.yogreal$yogrealripper.desc=This horrific creature is formed by demons using the many dwarven corpses left here. Demon rippers resemble pale, gaunt dwarves, with incomplete torsos and long, sharp bone claws.\n\nDemon rippers cannot withstand heavy blows, but they are swift and very dangerous. They can instantly pounce across great distances, then pierce their target with bone claws.\n\n_Greatly reduces damage taken while near the Old God._
custom.ch.boss.yogreal$yogrealripper.rankings_desc=Devoured by Yog-Dzewa-EX
custom.ch.boss.yogreal$yogrealscorpio.rankings_desc=Devoured by Yog-Dzewa-EX
custom.ch.boss.yogreal$yogrealsuccubus.rankings_desc=Devoured by Yog-Dzewa-EX
custom.ch.boss.yogrealfist.invuln_warn=The fist cannot be damaged while adjacent to the eye of the Old God!
custom.ch.boss.yogrealfist.rankings_desc=Devoured by Yog-Dzewa-EX
custom.ch.boss.yogrealfist.desc=This fist is a partial manifestation of the Old God's power. These fists are linked to the Old God's power, and become immune to all damage and greatly increase melee damage when near the eye of the Old God.
custom.ch.boss.yogrealfist$burningfist.name=burning fist
custom.ch.boss.yogrealfist$burningfist.desc=The burning fist is formed from chaotic, blazing magic. It continuously ignites the surrounding environment as it moves. It can also fire flame energy as a magical blast, turning the target area into raging fire.\n\nThe burning fist's ability to ignite the environment is suppressed near water, but its heat is so immense that nearby water quickly evaporates!
custom.ch.boss.yogrealfist$soiledfist.name=earthen fist
custom.ch.boss.yogrealfist$soiledfist.desc=The earthen fist is formed from chaotic earth magic. As it moves, it continuously causes plants to grow around it. It can also fire precise earthen shocks, trapping its target among rapidly growing vines and roots!\n\nThe earthen fist draws strength from plant life, and can resist damage based on the amount of vegetation around it!
custom.ch.boss.yogrealfist$rottingfist.name=rotting fist
custom.ch.boss.yogrealfist$rottingfist.desc=The rotting fist is made of living decay. It is a tower-like mass of rotten flesh that splashes corrosive ooze in melee and sprays toxic gas as a ranged attack. Worse still, the rotting fist's huge mass means attacks make it bleed rather than directly damaging it.\n\nCorrosive ooze can be washed away with water, but the rotting fist can also heal itself by absorbing water! In addition, damaging the rotting fist while it is bleeding only refreshes the bleeding rather than worsening the effect.
custom.ch.boss.yogrealfist$rustedfist.name=rusted fist
custom.ch.boss.yogrealfist$rustedfist.desc=The rusted fist is formed from living metal. It is a tower-like moving block of metal with powerful melee abilities and a ranged attack that can cripple targets from afar. Due to its enormous mass, all damage it takes is delayed rather than applied immediately.\n\nEven so, the rusted fist's inflexibility prevents it from passing through narrow corridors. Also, although it only takes damage slowly, delayed damage continues stacking when it is attacked multiple times.
custom.ch.boss.yogrealfist$brightfist.name=bright fist
custom.ch.boss.yogrealfist$brightfist.teleport=The bright fist teleports elsewhere in a flash that blinds you heavily!
custom.ch.boss.yogrealfist$brightfist.desc=The bright fist is formed from pure light energy. It can fire an intense dazzling beam each turn! These beams deal heavy damage and temporarily blind you. To escape, the bright fist can also emit a blinding flash across the entire arena!\nThe bright fist has no special melee abilities.
custom.ch.boss.yogrealfist$darkfist.name=dark fist
custom.ch.boss.yogrealfist$darkfist.teleport=The dark fist teleports elsewhere in pitch-black darkness that snuffs out your light!
custom.ch.boss.yogrealfist$darkfist.desc=The dark fist is formed from pure dark energy. It can fire powerful dark spells each turn! These spells deal heavy damage and weaken your light source. To escape, the dark fist can instantly plunge the entire arena into darkness!\n\nThe dark fist has no special melee abilities.
custom.ch.boss.yogreallevel.well_name=spatial well
custom.ch.boss.yogreallevel.well_desc=Spatial magic surges within the well. Perhaps it points somewhere?
custom.ch.mob.sewer.snakeh.name=sewer giant snake
custom.ch.mob.sewer.snakeh.desc=These large snakes can dodge ordinary attacks with rapid slithering, making them hard to hit. Ambushes and magical attacks, however, will catch them off guard.
custom.ch.mob.sewer.rath.name=rodent mouse
custom.ch.mob.sewer.rath.desc=Though rodent mice are aggressive, they remain among the weaker denizens of the sewers. Their bites are very annoying, but only become life-threatening in great numbers.\n\nSummons white rats for revenge on death. These white rats' stats depend on the floor.
custom.ch.mob.sewer.albinoh.name=albino rat
custom.ch.mob.sewer.albinoh.desc=A rare rodent mouse with pure white fur and jagged teeth.\n\nThis white rat's stats depend on the floor.
custom.ch.mob.sewer.gnollh.name=gnoll patrol
custom.ch.mob.sewer.gnollh.desc=Gnolls are hyena-like humanoids. They wander the sewers and dungeon, occasionally moving upward in attempts to attack the surface. Gnoll patrols are the most ordinary members of their kind, neither as strong as gnoll brutes nor as clever as shamans.\n\nCarries two darts.
custom.ch.mob.sewer.crabh.name=sewer crab
custom.ch.mob.sewer.crabh.desc=These giant crabs sit at the top of the sewer food chain. They move extremely quickly, and their heavy shells can withstand heavy blows.\n\nReduces the hero's hunger and weakens them.
custom.ch.mob.sewer.slimeh.name=slime
custom.ch.mob.sewer.slimeh.desc=Slimes are strange magical creatures with gelatinous bodies and liquid cores. The city's sewers provide them with ample water and abundant nutrients.\n\nExtremely elastic, takes at most 5 damage at a time, and attacks knock targets back.
custom.ch.mob.sewer.swarmh.name=swarm of flies
custom.ch.mob.sewer.swarmh.desc=A deadly swarm of flies buzzes angrily. Each non-magical attack splits it into two smaller but equally dangerous swarms.\n\nOn death, heals nearby enemies.
custom.ch.mob.prison.skeletonh.name=skeleton
custom.ch.mob.prison.skeletonh.desc=Skeletons are created from the merged bones of tragic adventurers and dungeon natives, raised from death by evil forces from the lower dungeon. After absorbing enough damage, they dissolve in an explosion of bones.\nThey will reconstruct somewhere on the floor after death.
custom.ch.mob.prison.thiefh.name=mad thief
custom.ch.mob.prison.thiefh.desc=These prisoners escaped their cells, but never escaped the prison. Over time, the prison utterly destroyed what remained of their minds and their longing for freedom. These mad thieves and bandits long ago forgot who they were and why they steal.\n\nRather than fighting face to face, these enemies prefer to steal your belongings and flee. Keep a close eye on them, or you may never see your stolen goods again.\n\nSteal distance +1, works in gangs.
custom.ch.mob.prison.thiefh.stole=The thief stole your %s!
custom.ch.mob.prison.thiefh.carries=\n\nThis thief is carrying a _%s_. Clearly stolen.
custom.ch.mob.prison.thiefh.escapes=The thief escaped with your %s!
custom.ch.mob.prison.bandith.name=mad bandit
custom.ch.mob.prison.bandith.desc=These prisoners escaped their cells, but never escaped the prison. Over time, the prison utterly destroyed what remained of their minds and their longing for freedom. These mad thieves and bandits long ago forgot who they were and why they steal.\n\nRather than fighting face to face, these enemies prefer to steal your belongings and flee. Keep a close eye on them, or you may never see your stolen goods again.\n\nEscapes at normal speed and attacks with blinding strikes.
custom.ch.mob.prison.guardh.name=prison guard
custom.ch.mob.prison.guardh.scorpion=Get over here!
custom.ch.mob.prison.guardh.def_verb=blocked
custom.ch.mob.prison.guardh.desc=As former wardens of the prison, these guards are no different from the criminals now. They stagger like zombies, mindlessly searching for creatures that do not belong in this area, such as you!\n\nIts chain is wrapped around its own waist and hips, and may be used to pull enemies very close.\n\nUnlimited-use chains. Don't even think about running!
custom.ch.mob.prison.dm100h.name=DM-100
custom.ch.mob.prison.dm100h.desc=DM-100 is an early model of dwarven "defense machinery", used to protect dwarven miners in the lower mines. Because its electric shock was not powerful enough, they were later sent to the human prison above. The warden initially considered DM-100 too cruel and did not activate them, but as prisoners became harder to control over time, DM-100 became essential prison equipment.\n\nCharged attack.
custom.ch.mob.prison.dm100h$skylightning.ondeath=Watch out for lightning!
custom.ch.mob.prison.dm100h.zap_kill=The lightning orb killed you completely...
custom.ch.mob.prison.dm100h$skylightning.rankings_desc=Struck by heavenly thunder
custom.ch.mob.cave.bath.name=vampire bat
custom.ch.mob.cave.bath.desc=These agile and tenacious creatures of the cave ceiling are far more frightening than they look. They restore health with each successful attack, allowing them to defeat opponents much larger than themselves.\nExtra evasion, keeps distance.
custom.ch.mob.cave.bruteh.name=gnoll brute
custom.ch.mob.cave.bruteh.enraged=enraged
custom.ch.mob.cave.bruteh.def_verb=blocked
custom.ch.mob.cave.bruteh.desc=Brutes are the largest, strongest, and toughest elites among gnolls. When dealt a fatal wound, they fall into a frenzy, gaining temporary shielding and an extremely high damage bonus.\nRevives once, carries a small number of thrown weapons.
custom.ch.mob.cave.bruteh$bruterage.name=gnoll rage
custom.ch.mob.cave.brute$bruterage.desc=This gnoll brute's death is inevitable, but it wants to take you with it!\n\nTime and external damage both wear down the shield. When the shield is exhausted, the brute dies completely. Be careful, however: in this phase the brute deals tremendous damage!\n\nShield remaining: %d.
custom.ch.mob.cave.shamanh.name=gnoll shaman
custom.ch.mob.cave.shamanh.bolt_kill=The blast of magic shattered you...
custom.ch.mob.cave.shamanh.desc=The most intelligent gnolls can master shamanic magic. Gnoll shamans lack strength, so they prefer battle spells. They hold high status in their tribes despite their relatively frail bodies.
custom.ch.mob.cave.shamanh$elementalshaman.spell_desc=Shamans wearing red masks use ice and lightning elements to deal considerable damage to enemies.
custom.ch.mob.cave.shamanh$trickshaman.spell_desc=Shamans wearing blue masks use poison and spatial magic to gradually break down enemies.
custom.ch.mob.cave.shamanh$controlshaman.spell_desc=Shamans wearing purple masks inflict many debuffs on enemies, and can evaporate debuffs to deal heavy damage.
custom.ch.mob.cave.shamanh$shamanmagic.rankings_desc=Elemental power will destroy you
custom.ch.mob.cave.spinnerh.name=webspinner
custom.ch.mob.cave.spinnerh.desc=Green, hairy cave spiders try to avoid direct combat, preferring to wait at a distance for prey to become tangled in webs and slowly die in poison. They can also spit webs from afar to block enemy movement routes.\n\nHigh-speed movement, webbing.
custom.ch.mob.city.warlockh.name=shadow warlock
custom.ch.mob.city.warlockh.desc=When dwarven interests shifted from engineering to occult studies, warlocks began to hold power in the city. They started with elemental magic, but soon began studying demonology and necromancy. The strongest warlock seized the kingship of the dwarven kingdom. If the other warlocks wanted to continue practicing dark magic, they had to surrender their mental freedom and give their wills to his control.\n\nThese warlocks wield powerful disruptive magic that can temporarily suppress the upgrade magic of equipment. The higher the equipment level, the worse the effect of degradation magic.\n\nCharge devour.
custom.ch.mob.city.warlockh.bolt_kill=Shadow energy drained your life away...
custom.ch.mob.city.monkh.name=dwarven monk
custom.ch.mob.city.monkh.desc=These monks are fanatical believers, doing everything they can to protect the king from all foreign peoples. Their zeal caused them to hand their wills to the king, leaving only mindless shells wandering the city.\n\nDwarven monks wear no armor and carry no weapons, relying only on unarmed combat to repel enemies. A focused monk will always parry one incoming attack, even an attack that would otherwise be guaranteed to hit. Monks focus faster while moving and more slowly in battle.\n\nDisarms weapons.
custom.ch.mob.city.monkh.disarm=The dwarven monk knocked away your %s!
custom.ch.mob.city.monkh$focus.name=focused
custom.ch.mob.city.monkh$focus.desc=This monk is completely focused on every move of the target, and seems able to predict the target's next action.\n\nA focused monk will always parry the next physical attack. Parrying breaks the monk's focus, requiring some time to refocus before they can parry again. Monks recover focus relatively faster while moving.
custom.ch.mob.city.monkh.parried=parried
custom.ch.mob.city.seniormonkh.name=monk master
custom.ch.mob.city.seniormonkh.desc=These monks are fanatical believers, doing everything they can to protect the king from all foreign peoples. Their zeal caused them to hand their wills to the king, leaving only mindless shells wandering the city.\n\nThis monk has mastered profound combat techniques. Compared to ordinary monks, it can recover focus more quickly while moving. A focused monk will always parry one incoming attack, even an attack that would otherwise be guaranteed to hit. Monks focus faster while moving and more slowly in battle.\n\nKnocks the hero away.
custom.ch.mob.city.seniormonkh.hard_strike=You were knocked away by the monk master!
custom.ch.mob.city.elementalh$blazingelemental.name=blazing elemental
custom.ch.mob.city.elementalh$blazingelemental.desc=Elementals are chaotic creatures born from mishaps while casting powerful magic. They lack even the most basic intelligence, and are usually closely tied to a specific kind of magic.\n\nBlazing elementals are common elementals that attack with the power of fire. In melee, they can set targets ablaze, and they can occasionally fire fireballs at distant enemies.\n\nEvaporation, area ignition, fire healing.
custom.ch.mob.city.elementalh$freezingelemental.name=freezing elemental
custom.ch.mob.city.elementalh$freezingelemental.desc=Elementals are chaotic creatures born from mishaps while casting powerful magic. They lack even the most basic intelligence, and are usually closely tied to a specific kind of magic.\n\nFreezing elementals are common elementals that weaken enemies with frost. Their melee attacks inflict frostbite, and they can occasionally attack from range. Their frost power is greatly strengthened over water.\n\nWater melting, freezing, ice burst, frost healing.
custom.ch.mob.city.elementalh$freezingelemental.ice_break_die=You shattered into fragments along with the ice...
custom.ch.mob.city.elementalh$lightningelemental.name=lightning elemental
custom.ch.mob.city.elementalh$lightningelemental.desc=Elementals are chaotic creatures born from mishaps while casting powerful magic. They lack even the most basic intelligence, and are usually closely tied to a specific kind of magic.\n\nLightning elementals are relatively rare elementals that attack with electric shocks and flashes. In melee, they release arcs of electricity at nearby enemies, and their main target takes extra damage if standing in water. Against distant enemies, they occasionally release a powerful blinding flash.\n\nBlinding, absolute blindness, electric defense.
custom.ch.mob.city.elementalh$uncertaintyelemental.name=chaos elemental
custom.ch.mob.city.elementalh$uncertaintyelemental.desc=Elementals are chaotic creatures born from mishaps while casting powerful magic. They lack even the most basic intelligence, and are usually closely tied to a specific kind of magic.\n\nChaos elementals are extremely rare elemental creatures. They are not limited to one specific kind of magic, instead using random magic for powerful attacks and creating wide-area chaos.\n\nCursed wands are number one under heaven.
custom.ch.mob.city.golemh.name=elemental golem
custom.ch.mob.city.golemh.desc=Golems are the dwarves' attempt to use new applications of magic to compensate for long-standing flaws in machinery. They are not as huge and cumbersome as DM-300, but still possess formidable destructive power.\n\nGolems are too large to enter corridors, but the dwarves gave them magic to compensate: golems can teleport between rooms and pull unreachable enemies back from afar.\n\nSummons elementals.
custom.ch.mob.hall.eyeh.name=eye of destruction
custom.ch.mob.hall.eyeh.deathgaze_kill=The death gaze seized your life...
custom.ch.mob.hall.eyeh.desc=The eye of destruction is a floating spherical creature that suppresses demonic energy within itself. It has melee capability, but its true power lies in its magic.\n\nAfter a brief charge, the eye will release a destructive energy ray called _death gaze_. Any creature struck by this gaze takes tremendous damage, and wise adventurers seek cover in time.\n\nDisintegrates items, summons mirror images.
custom.ch.mob.hall.eyeh.one=The eye of destruction disintegrated your %s!
custom.ch.mob.hall.eyeh.some=The eye of destruction disintegrated some of your %s!
custom.ch.mob.hall.eyeimage.name=eye of destruction image
custom.ch.mob.hall.eyeimage.desc=Like an eye of destruction, but without melee capability. It dissipates after one death gaze.
custom.ch.mob.hall.ripperh.name=demon ripper
custom.ch.mob.hall.ripperh.leap=The demon ripper is preparing to pounce!
custom.ch.mob.hall.ripperh.desc=This horrific creature is formed by demons using the many dwarven corpses left here. Demon rippers resemble pale, gaunt dwarves, with incomplete torsos and long, sharp bone claws.\n\nDemon rippers cannot withstand heavy blows, but they are swift and very dangerous. They can instantly pounce across great distances, then pierce their target with bone claws.\n\nUnlike ordinary rippers, this ripper can also inflict some bleeding in melee. When facing enemies directly, it can cause longer-lasting bleeding. Each bleed is not severe, but they can keep stacking and eventually cause a lethal burst!
custom.ch.mob.hall.scorpioh.name=scorpion sniper
custom.ch.mob.hall.scorpioh.desc=These huge arthropod demons avoid close contact whenever possible, firing crippling spikes from afar.\n\nStanding still and continuing to shoot lets the scorpion aim for the target's weak points, effectively piercing their defense and blinding them. It can also land a _head shot_ against targets that cannot see it. However, it gradually loses aim while moving.
custom.ch.mob.hall.scorpioh.head_shot=HEAD SHOT!!!
custom.ch.mob.hall.succubush.name=greater succubus
custom.ch.mob.hall.succubush.desc=Succubi are shapeshifting demons skilled at manipulating enemies' minds. This one has taken the form of a pale gothic humanoid, perhaps to appeal to dwarven warlocks?\n\nWhen attacking, a succubus can temporarily charm the target, preventing them from directly attacking the succubus itself. When attacking a charmed target, the succubus drains their life essence.\n\nArmor breaking, area healing.
custom.ch.mob.scrollofupgradeeater.name=scroll of upgrade transfer
custom.ch.mob.scrollofupgradeeater.desc=_Destroys_ an item and extracts its levels, retaining at most 3 levels.\n\n
custom.ch.mob.scrollofupgradeeater.not_eat=Your scroll has not absorbed any upgrades yet.
custom.ch.mob.scrollofupgradeeater.ready_upgrade=Your scroll has absorbed _%d_ levels.
custom.ch.mob.scrollofupgradeeater.eaten=Your scroll absorbed the levels of %s!
custom.ch.mob.scrollofupgradeeater.cant_eat_equipped=You need to unequip this item first.
custom.ch.mob.scrollofupgradeeater.upgrade=Your scroll infused magic into %s!
custom.ch.mob.scrollofupgradeeater.inv_title=Choose an item
custom.ch.mob.scrollofupgradeeater.eat_confirm_title=Are you sure?
custom.ch.mob.scrollofupgradeeater.eat_confirm_body=Your _%s_ will be irreversibly destroyed! Continue?
custom.ch.mob.scrollofupgradeeater.sure=No problem
custom.ch.mob.scrollofupgradeeater.no=Wait!
custom.buffs.consistbleeding.name=persistent bleeding
custom.buffs.consistbleeding.desc=Persistent bleeding is deadlier than ordinary bleeding, because it does not decay before ending, and stacking it high enough can trigger a lethal blood burst.\n\nCurrent bleed stacks: %d\n\nDamage per turn: %.2f
custom.buffs.consistbleeding.heromsg=You are bleeding!
custom.buffs.consistbleeding.rankings_desc=Excessive blood loss
custom.buffs.consistbleeding.burst=Massive bleeding!
custom.buffs.consistbleeding.bleed_die=Your last drop of blood has run dry...
custom.buffs.consistbleeding.burst_die=The sudden worsening of your bleeding took your life...
custom.buffs.absoluteblindness.name=absolute blindness
custom.buffs.absoluteblindness.heromsg=It is pitch black. You temporarily lose your sight!
custom.buffs.absoluteblindness.desc=The target has temporarily lost sight!\n\nAbsolute blindness remaining: %s turns
custom.buffs.attributemodifier.name=attribute modifier
custom.buffs.attributemodifier.desc=Modifies several combat attributes of the target. Current modifiers:\n\nPhysical attack: x%.2f +%.2f\n\nPhysical defense: x%.2f +%.2f\n\nAccuracy: x%.2f +%.2f\n\nEvasion: x%.2f +%.2f\n\nDamage taken: x%.2f +%.2f\n\nHealth: x%.2f +%.2f\n\nCurrent health: %d/%d
custom.buffs.deathcounter.name=death sentence
custom.buffs.deathcounter.desc=Your life is already a candle in the wind!\n\nAn accurate and honest countdown records the final life of this target with precise cruelty. When the countdown reaches zero, this target dies unconditionally.\n\nCountdown remaining: %.2f turns.
custom.buffs.ignorearmor.name=ignore defense
custom.buffs.ignorearmor.desc=This target's attacks ignore all defense.\n\nEffect remaining: %s turns.
custom.buffs.positivebuffprohibition.name=positive effect prohibition
custom.buffs.positivebuffprohibition.desc=This effect blocks the persistence of positive effects, causing all positive effects to dissipate within one turn after being applied.\n\nTHE WORLD is not blocked because it stops the target's time.\n\nBlock remaining: %s turns.
custom.buffs.thornsshield.name=retaliation aura
custom.buffs.thornsshield.desc=This effect returns all attack damage the target receives to the attacker proportionally, and grants immunity to non-attack damage.\n\nEffect remaining: %s turns.
custom.buffs.thornsshield.ondeath=You were killed by reflected damage...
custom.buffs.thornsshield.rankings_desc=Beware reflected damage
custom.buffs.zeroattack.name=zero attack
custom.buffs.zeroattack.desc=This effect reduces all attack damage dealt by the target to 0.\n\nEffect remaining: %s turns.
custom.buffs.zerodefense.name=zero defense
custom.buffs.zerodefense.desc=This effect reduces the target's physical defense to 0.\n\nEffect remaining: %s turns.
