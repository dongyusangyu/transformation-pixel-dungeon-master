custom.dict.dict.melee_twohandedgreatsword_d=A _tier-6_ weapon requiring _20 strength_ and dealing _6–35 base damage_.\n\nIts damage scales by _1–7_, accuracy modifier is _1_, speed is _0.5_, and reach is _1_.\n\nWhile equipped, using a missile weapon or wand costs an extra turn.\n\n_Duelist ability (Train Slash):_ Makes a normal attack against every enemy within 2 tiles with a clear line of fire (or any enemy in range with the Seeking enchantment). These attacks always hit and trigger enchantments.
custom.dict.dict.missile_gungnir_d=A _tier-6_ missile weapon requiring _19 strength_, dealing _12–30 base damage_, with _10 uses_ per item.\n\nIts damage scales by _2–6_ and it always hits. If it hits without breaking, it returns to the user and costs _10% of current HP_ (rounded down, minimum 1). It cannot be thrown when only 1 HP remains.\n\nIt also inflicts bleeding with a base value of _50% of damage_. If it directly kills an already bleeding enemy, it restores _10% of the user's maximum HP_.
custom.dict.dict.artifact_necronomicon=necronomicon
custom.dict.dict.melee_staff_d=The _tier-1_ weapon carried by the _Mage_ at the start of the game. It requires _10 strength_ and deals _1–7 base damage_.\n\nIts damage scales by _1–2_, accuracy modifier is _1_, speed is _1_, and reach is _1_.\n\nIt starts infused with the _Magic Missile wand_. It can cast the infused wand's effect, recharges faster than a normal wand, and has 1 extra maximum charge (still capped at 10).\n\nIt can be infused with an unidentified wand. If the wand's level (excluding Arcane Resin levels) is at least the staff's current level, the staff inherits that level and adds its original +1; an unupgraded staff simply inherits the wand's level. Transmutation and metamorphosis only change the kind of wand infused.\n\n_Battlemage melee effects:_\n\n_Innate (all infusions):_ Restores 0.5 charge to the staff.\n\n_Magic Missile:_ Restores 0.5 charge to every wand except the staff.\n\n_Lightning:_ Has a _(staff level + 1)/(staff level + 4)_ chance to grant up to 2.5 turns of electrification, scaling with staff level and capped at 10. Electrification makes the user immune to Lightning damage and increases the Lightning wand's arc-link range by 1.\n\n_Disintegration:_ Functions like the Seeking enchantment and increases staff melee reach by 1.\n\n_Fireblast:_ Depending on burning creatures and tiles around the target, has a _25% per burning creature_ chance (or _5% per burning tile_ if none are burning) to deal _2 + 2 × staff level_ to _8 + 4 × staff level_ magical damage in a 3×3 area. It removes burning and nearby fire, damages enemies only, and does not destroy items or some terrain.\n\n_Corrosion:_ Has a _(staff level + 1)/(staff level + 3)_ chance to inflict Corrosive Sludge for 20 turns.\n\n_Shockwave:_ If the target is Paralyzed, removes Paralysis and deals _8 + 2 × staff level_ to _12 + 3 × staff level_ magical damage. This effect has a 3-turn cooldown per target.\n\n_Spectral:_ Grants Spectral armor equal to _33% of pre-resolution damage_ and restores the same amount to a Spectral Guardian, if present.\n\n_Frost:_ Has a _(remaining Frostbite turns − 1)/9_ chance to freeze the target for its remaining Frostbite duration.\n\n_Prismatic:_ Cripples the target for _1 + staff level_ turns.\n\n_Sentry:_ Has a _(staff level + 1)/(staff level + 5)_ chance to restore 1 and 2 attacks to all tier-2 and tier-3 sentries, and 9, 12, and 16 HP to all tier-4, tier-5, and tier-6 sentries.\n\n_Soul Mark:_ Attacking a Charmed target grants _10 + 2 × staff level_ shielding and makes the next cast on an ally (including the Charmed target) free of HP cost.\n\n_Corruption:_ Has a _(staff level + 1)/(staff level + 6)_ chance to inflict Rage for _4 + 2 × staff level_ turns.\n\n_Regrowth:_ If either combatant stands in grass, grants Herbal Healing equal to _0.5 × pre-resolution damage × (staff level + 2)/(staff level + 6)_.\n\n_Cursed Flame:_ If the target is Cursed Burning, removes it, deals _(1 + remaining Cursed Burning turns) × (1 + staff level/3 to 5 + staff level/3)_ Cursed Burning damage, and reapplies it for 4 turns. This effect has a 9-turn cooldown per target.
custom.dict.dict.misc_reason_d=The Monk's unique resource starts at 100, has a maximum of 100, and does not regenerate over time.\n\n_Normal sanity loss:_\n\nAlchemy can spend 5 sanity to create 1 alchemical energy.\n\nWhen loading an alchemical spray gun, every point of capacity that cannot be filled by alchemical energy costs 5 sanity.\n\nWhen hit by most enemies while below half maximum HP, lose _lost HP + 2–5_ sanity (maximum 30).\n\nHits from _undead or demonic_ enemies cost _lost HP + 1–2_ sanity, or _lost HP + 2–5_ while below half HP (maximum 30 in either case), and have a 20% chance to cause 10 turns of panic.\n\nHits from Wraiths and Bound Souls cost 5 sanity and have a 33% chance to cause 10 turns of panic.\n\nYog-Dzewa's laser costs 25 sanity (50 with the _Desperate Bosses_ challenge) and immediately causes 20 turns of panic. Each Ancient Fist summon also causes 25 turns of panic, and Ancient Fists have a 50% chance to cause 10 turns of panic when the HP condition is met.\n\nWhile panicked, lose _1–2_ sanity each turn; panic can stack for at most 30 turns.\n\nTriggering a trap costs 10 sanity. Hunger damage costs 2. Equipping a cursed item costs 10.\n\n_Normal sanity gain:_\n\nKilling most enemies restores _1–2_ sanity; killing an _undead or demonic_ enemy restores _2–5_; killing a Wraith or Bound Soul restores 2 and clears panic; killing a _mini-boss_ restores 10; killing a _boss_ restores 50 and clears panic; killing Yog-Dzewa restores 100 and clears panic. Revealing a hidden door restores 5, and revealing a hidden trap restores 2.\n\nRestoring satiety also restores _satiety restored/100_ sanity (rounded down, minimum 1; _satiety restored/33_ with _Reduced Nutrition_). Some foods add more: Phantom Fish Meat 5, Full Meat Pie 10, Holy Healing Honey 5 and clears panic, Full Purification Elixir 20 and clears panic, Tranquilizer 50 and clears panic, and the Fountain of Health 100 and clears panic.\n\nUsing a Scroll of Remove Curse on a cursed item or Bound Soul restores 10 sanity. Using a torch restores 10 (5 with _Into Darkness_). During Magical Sleep, restore 1 sanity every 2 turns. Reviving with an Ankh resets sanity to 100 if unblessed, or restores 50 if blessed.\n\n_Torments and virtues:_\n\nAt 0 sanity, gain a torment or virtue on the next turn: 75% torment, 25% virtue. Torments reset sanity to 100; virtues restore 50 (Exhilaration restores 60). Torments last up to 300 turns; virtues up to 150. Most kills reduce a torment by 6 or extend a virtue by 3; boss kills reduce by 100 or extend by 50. Killing Yog-Dzewa clears torments and extends a virtue by 150. A blessed Ankh revival clears torments and extends a virtue by 50. At 0 sanity, torments kill you; virtues clear and restore 100 sanity.\n\n_All torments:_\n_Fear:_ +50% evasion, −25% physical damage, and a 30% chance to lose 5 sanity when hit.\n_Paranoia:_ +20% attack speed, −20% accuracy, and a 30% chance to lose 5 sanity when an attack misses.\n_Despair:_ +20% movement speed, but attacks cannot be evaded.\n_Ecstasy (Pious):_ +50% attack speed, +30% physical damage, −50% evasion.\n\n_All virtues:_\n_Fortitude:_ Gain a permanent shield equal to 25% of maximum HP; overhealing also becomes permanent shield up to that cap. Kills have a 25% chance to restore 6 sanity.\n_Fearlessness:_ +50% movement speed and immunity to panic.\n_Exhilaration:_ Sanity restoration increases from 50 to 60; kills have a 25% chance to restore 10% of maximum HP.
custom.dict.dict.buff_neg1_d=This list is not exhaustive, but records most common debuffs; rare effects name their main source.\n\n_Rage:_ Randomly attacks the nearest creature, preferring enemies; pathfinding ignores traps, chasms, and other floor effects.\n_Bleeding:_ Deals current bleeding damage each turn, then reduces its value to _50–100%_ next turn.\n_Blindness:_ Vision becomes 3×3.\n_Burning:_ Usually lasts up to 8 turns and deals _1–3 + floor/4_ damage per turn. Every 4–6 turns it burns a scroll or turns Mystery Meat/Frozen Carpaccio into Roast Meat. Water, a potion impact, Frostbite, or Freeze ends it.\n_Cursed Burning:_ Usually lasts up to 4 turns, deals 1 hit on odd turns and 2 on even turns for _1–3 + floor/8_ each, and burns a scroll or turns Mystery Meat/Frozen Carpaccio into Soul Roast when applied and every 2–3 turns. Water, potion impacts, Frostbite, and Freeze cannot end it.\n_Charm:_ Cannot attack the applier with a melee weapon; each hit taken shortens it by 5 turns.\n_Frostbite:_ Each turn reduces action speed by 10%, to a minimum of 50%; it can end Burning.\n_Corrosion:_ Below _2 + floor/2_ damage, damage rises by 1 each turn; above that it rises by 0.5.\n_Corruption:_ Forces a creature to become an ally and deals 1% cumulative damage each turn, resolving at 1 damage.\n_Fate:_ Permanent +67% damage taken.\n_Cripple:_ Halves movement speed.\n_Degrade:_ Dwarf Sorcerers reduce weapon, armor, ring, and wand levels to _1 + sqrt[2 × (old level − 1)]_. Upgrade or Remove Curse immediately ends it.\n_Freeze:_ Freezes action and a potion, or turns Mystery Meat into Frozen Carpaccio; it ends Burning and breaks on taking damage.\n_Hex:_ −20% accuracy and evasion.\n_Starvation:_ Stops natural HP regeneration and deals cumulative _0.1% of maximum HP_ damage each turn.\n_Corrosive Sludge:_ Deals _floor/5_ per turn (0.5 on floors 0–4); water or a potion impact ends it.\n_Slimed:_ Halves movement speed.\n_Paralysis:_ Cancels all actions; halves hero evasion or sets other creatures' evasion to 0. Damage may end it based on random damage and current HP. Impact paralysis lasts _1 + knockback distance/2_ turns.\n_Poison:_ Deals _1 + remaining duration/3_ each turn.\n_Roots:_ Prevents movement; Levitation and forced movement end it.\n_Slow:_ Halves all action speeds.\n_Terror:_ Drives a creature away from the applier; each hit taken shortens it by 5 turns.\n_Stun:_ Movement goes randomly to one of the 8 adjacent tiles.\n_Vulnerable:_ +33% physical damage taken.\n_Weakness:_ −33% physical damage dealt.\n_Sleep:_ On ending, becomes Magical Sleep.\n_Magical Sleep:_ An enemy does not wake from damage-free sleep (though Rage Scrolls and alarm traps can wake it). Heroes and allies restore 1 HP per turn until full or hurt.\n_Soul Mark:_ Wands can mark a target for _10 + wand level_ turns; physical damage from the hero restores _40% of damage_ as HP.\n_Soul Distortion:_ Flees from the applier at double speed, disappears after leaving sight, and loses 5 turns when hit.\n_Subjugation:_ Permanently turns a creature into an ally.\n_Marked Target:_ Forces other enemies to attack the target.\n_Delayed Damage:_ Damage arrives gradually over time.\n_Recklessness:_ −80% accuracy and ends after one successful hit.\n_Daze:_ −50% accuracy and evasion.
custom.dict.dict.artifact_tool_d=The _DM-400_'s starting special artifact. Maximum charge is _3 + (artifact level − 1)_ (minimum 3, maximum 10); one charge regenerates every _80 − 4 × charge lost_ turns. Producing a drone costs _1 + current drone count_ charge. Before class promotion it can produce only an Escort Drone; afterward, Upgrade Scrolls choose the drone type.\n\n_All drones:_\n_Escort (starting):_ _3 + 33% hero maximum HP_, _1–2 defense_, _2 + artifact level_ to _2 + 2 × artifact level_ damage; accuracy, evasion, attack speed, and movement speed match the hero. It is nonliving and ignores armor when attacking Command-marked enemies.\n_Scout (Identify):_ _3 + 33% maximum HP_, _1–2 defense_, no attack; shares the hero's evasion and movement speed, grants 0.3 stealth per drone, has _3 + (artifact level + 1)/3_ shared sight, and continuously applies Weakness (33% more damage taken) to enemies in view.\n_Flash (Remove Curse):_ _3 + 20% maximum HP_, _1–2 defense_, _1 + artifact level_ to _6 + artifact level_ damage, +2 reach; against Command-marked targets it can Blind for 3 turns and deals 5 extra magical damage to undead and demons.\n_Mirror (Mirror):_ _3 + 33% maximum HP_, _1–2 defense_, no attack; grants 0.3 stealth per drone and creates a hero mirror every _40 − artifact level_ turns.\n_Laser (Recharge):_ _3 + 10% maximum HP_, _1–2 defense_, ranged _2 + artifact level_ to _3 + artifact level_ magical damage, twice the hero's accuracy; Command-marked targets have a 50% chance to Burn for 3 turns.\n_Blessing (Teleport):_ _3 + 33% maximum HP_, _1–2 defense_, no attack; grants 0.3 stealth and _1–3 defense_ per drone. On death, randomly teleports the enemy that destroyed it.\n_Confusion (Sleep):_ _3 + 33% maximum HP_, _1–2 defense_, _2 + artifact level_ to _2 + 2 × artifact level_ damage; Command-marked targets have a 33% chance to be Stunned for 3 turns and an additional 50% chance to be knocked back 1 tile.\n_Escort (Magic Mapping):_ _3 + 33% maximum HP_, _1–2 defense_, no attack; grants 0.8 stealth per drone and grants the hero 4 turns of Invisibility every 50 turns.\n_Raider (Rage):_ _3 + 10% maximum HP_, _1–2 defense_, _1 + artifact level_ to _6 + artifact level_ damage, +2 reach, double hero movement speed; unmarked targets have a 33% chance to gain Command for 3 turns, marked targets have a 17% chance to Rage for 3 turns.\n_Bomber (Revenge):_ _3 + 10% maximum HP_, _1–2 defense_, no attack but chases enemies at double speed; grants 0.3 stealth, loses 3 HP per turn while enemies are nearby, and explodes on death, damaging enemies only.\n_Suppressor (Terror):_ _3 + 10% maximum HP_, _1–2 defense_, ranged _1 + artifact level_ to _6 + artifact level_ damage; unmarked targets have a 17% chance to gain Command for 3 turns, marked targets have a 33% chance to suffer 6 turns of Terror.\n_Chaos (Transmutation):_ _3 + 33% maximum HP_, _1–2 defense_, no attack; after _20 − artifact level_ turns becomes a random drone from another promotion, an Escort Drone, a Mirror, a Magic Sheep, or a random enemy from the area.\n\nEvery drone restores 1 HP every _15 − artifact level_ turns. While equipped, the function menu can recycle a selected drone, command all drones, or toggle drone location tracking. It upgrades by recording Upgrade Scrolls; each recording grants 2 levels, up to level 10.\n\n_Artifact recharge:_ +0.2 charge per turn.\n\n_Curse:_ Cannot be used.\n\n_Armor ability (Trinity):_ By default, spend 25 armor charge to produce an Escort Drone with 40%/60%/80%/100% of the user's maximum HP.
custom.dict.dict.artifact_key_d=Spend charge to unlock a locked door or chest, lock an ordinary door, or create temporary walls around the user that block vision.\n\nMaximum charge is _3 + artifact level/2_ (rounded down), and 1 charge regenerates every _120 - 7.5 × charge lost_ turns.\n\nUnlocking costs 1 charge for an ordinary iron lock, 2 for a gold lock, and 5 for a crystal lock.\n\nLocking a door costs 2 charge. The key can then unlock that door again without charge. If a creature is in the doorway, locking pushes it to the nearest tile to the hero that is not adjacent.\n\nCreating temporary walls costs 2 charge and lasts 10 turns. A horizontal wall is 3 tiles long; a diagonal wall adds 2 tiles around the user to connect it. Walls block vision and prevent creatures and projectiles from passing. If a wall is created on an enemy and there is room behind it, the enemy is pushed back 1 tile.\n\nEach upgrade requires _4 + artifact level_ artifact experience; maximum level is 10. Unlocking grants _2 + charge spent_ experience, while locking a door or creating temporary walls grants 2.\n\n_Artifact recharge:_ Regenerates 0.133 charge per turn.\n\n_Curse:_ Charge cannot be gained, and unlocking has a 5-in-6 chance to fail. Each failed attempt takes twice as long and costs 4 extra satiety.\n\n_Armor ability (Trinity):_ By default, spend 50 armor charge to use any Skeleton Key function once (except unlocking crystal locks).
custom.dict.dict.food_frozen_d=All meat varieties take 3 turns to eat and restore _150_ satiety.\n\nWith the _Reduced Nutrition_ challenge enabled, they restore only 50 satiety.\n\n_Mystery Meat:_ Usually dropped by certain enemies such as sewer crabs, cave spiders, and giant piranhas. Eating it has an equal 20% chance to cause 8 turns of burning, 10 turns of roots, 10 turns of slow, poison lasting _hero maximum HP/5_, or no effect. Only one outcome can occur per serving.\n\n_Frozen Carpaccio:_ Usually made by freezing Mystery Meat (with the hero's Freeze effect, cold, a Frost wand, and similar effects). Eating it has an equal 20% chance to grant 20 turns of invisibility, barkskin that decays each turn from _0 to hero maximum HP/4_, cleanse poison, cripple, weakness, vulnerability, bleeding, blindness, slow, stun, and sleep, restore _hero maximum HP/4_ HP, or do nothing. Only one outcome can occur per serving.\n\n_Soul Roast:_ Usually made by cursed-burning Mystery Meat (with the hero's cursed burning, cursed flame, a Wand of Cursed Flame, and similar effects). Eating it grants 10 turns of incorporeality: immunity to cursed flame and cursed burning, +100% evasion, and -50% accuracy.\n\n_Roast Meat and Stewed Meat:_ Roast Meat is made by burning Mystery Meat or Frozen Carpaccio (with the hero's burning, fire, a Fireblast wand, and similar effects). Stewed Meat is made by alchemizing Mystery Meat. Neither has a special effect when eaten.\n\nUnless you have a talent that reduces the turn cost of eating, effects granted by food last 2 fewer turns.
custom.dict.dict.info_shop_d=All floor-based calculations in this section are rounded down.\n\nShops normally appear on floors 6, 11, and 16, connected to the starting room. A shop also appears on floor 20 after completing the Imp's quest and defeating the Dwarf King.\n\nShop prices are _(1 + floor/5) × 5_ times an item's base price (the price paid by the Shopkeeper or Imp when buying it from you). In New Game+, the surface shop on floor 0 uses floor-20 prices, its reserve stock uses floor-25 prices, and Tower shops always use floor-30 prices.\n\nEvery shop stocks: one bag chosen according to the item counts in your inventory (Potion Bandolier, Scroll Holder, or Magical Holster; potions also count a Waterskin, and ties are random); one melee weapon, armor, and stack of missiles of tier _(1 + floor/5)_, plus two random-tipped darts; one random item selected by a roll from 0 to 9 (0: wand, 1: artifact, 2: ring, 3–9: Arcane Stylus); one Potion of Healing and two random potions; one Scroll of Identify, one Scroll of Remove Curse, and one Scroll of Magic Mapping; two random items, each equally likely to be a potion or scroll; two Small Rations, one Ankh, one Upgrade Stone, and two or three Alchemystic Catalysts; and one random item (25% chance of a Jar of Bees, 25% a Bomb, 50% a pair of Bombs).\n\nIf you have an identified, uncursed Hourglass, the shop tries to stock Magic Sandbags. The number depends on the floor and on _x_, the number already generated: floor 6: _(5-x) × 0.2_; floor 11: _(5-x) × 0.25_; floor 16: _(5-x) × 0.5_; floor 20: _(5-x) × 0.8_.\n\nIf the Shopkeeper or Imp is in the hero's sight and is affected by an attack, area effect, or environmental effect, they warn the hero the first time. A second incident makes them flee and all their goods disappear.\n\nFailing to steal an item with the Master Thieves' Armband also makes the Shopkeeper or Imp flee, removing all their goods. One shopkeeper fleeing does not affect shops on other floors.
custom.dict.dict.special_ritualdagger_d=A special weapon granted when the _Monk_ becomes a _Pious_, requiring _10 strength_ and dealing _1–10 base damage_.\n\nIts damage scales by _1–3_ (though it cannot be upgraded directly); it gains one level for every 5 hero levels. Its accuracy modifier is _1_, speed is _0.5_, and reach is _1_.\n\nIt can be used directly from the inventory without being equipped.\n\n_Pious effects:_\n\nAttacks inflict a permanent Blood Offering. When the dagger first hits, and whenever later physical attacks cause the marked enemy to lose HP, the Pious restores _lost HP/5_ sanity (rounded down, minimum 1; at most 5 per hit against a Boss or mini-boss).\n\nWhile the dagger is in the inventory, every 13 kills grants one free, guaranteed-hit stab. Stabbing an enemy deals four times the damage and restores 50 sanity to the Pious. Stabbing themself deals 1 armor-piercing damage and costs the Pious 100 sanity.
custom.dict.dict.wand_corruption_d=Fires a harmless projectile that randomly applies debuffs and may corrupt the target.\n\nCorruption power is _3 + wand level/3_.\n\nBefore modifiers, the corruption resistance of enemies that grant experience is _1 + their experience value_.\n\nFor most enemies that grant no experience, base resistance depends on the floor: Split Flies: 4; Animated Statues and Mimics: _1 + floor_; Giant Piranhas and Golden Bees: _1 + floor/2_; Wraiths: _(1 + floor/4)/5_, with the return trip treated as floor 26.\n\nOn the return trip, base resistance changes for most enemies that grant experience: enemies worth more than 13 experience are unchanged; those worth 13 or less become 14; Demon Rippers become 11; and Dwarf Corpses become 8.\n\nMultiply every enemy's base resistance by _1 + 4 × health ratio²_.\n\nEach debuff reduces resistance by 50% or 25% (whether the wand applied it or not, depending on whether it is major or minor). A target is corrupted once its resistance is no greater than the wand's corruption power. Targets immune to corruption instead become Fated, permanently taking 67% more damage.\n\nMajor debuffs reduce corruption resistance by 50%: Rage, Hex, Slow, Paralysis, Daze, Charm, Corrosion, Freeze, Fate, Soul Mark, Magical Sleep, Soul Mark, and Cursed Burning.\n\nMinor debuffs reduce it by 25%: Weakness, Vulnerable, Blindness, Terror, Cripple, Frost, Roots, Stun, Sleep, Bleeding, Burning, Poison, and Corrosive Sludge.\n\nIf the target cannot yet be corrupted, the wand has a chance equal to _corruption power/corruption resistance_ to apply a major debuff for _6 + 3 × wand level_ turns, weighted as follows: Rage (3), Hex (2), Slow (2), Paralysis (1).\n\nIf no major debuff is applied, it chooses a minor debuff for _6 + 3 × wand level_ turns, weighted as follows: Weakness (2), Vulnerable (2), Blindness (1), Terror (1), Cripple (1).\n\nIf the target already has every applicable minor debuff, the next cast is guaranteed to apply a major debuff. If it already has every applicable major debuff, the next cast corrupts it directly (or applies Fate if it is immune).\n\n_Battlemage melee effect:_ Has a chance of _(wand level + 1)/(wand level + 6)_ to inflict Rage for _4 + 2 × wand level_ turns.\n\n_Armor ability (Elemental Blast) for the matching wand:_ Deals no damage, but causes enemies to Rage for 5 turns.
custom.dict.dict.melee_sakurablossomblade_d=_Spirit Blade: Sakura Blizzard:_\nA _tier-6_ weapon requiring _20 strength_ and dealing _6–28 base damage_.\n\nIts damage scales by _1–7_, accuracy modifier is _1_, speed is _1_, and reach is _1_.\n\nAmbush damage ranges from _50% of the minimum damage to maximum damage_ (a 50% ambush bonus).\n\nEvery fifth hit knocks the target back 2 tiles and makes it Vulnerable for 5 turns.\n\nAfter killing 58 enemies, it evolves into _Demon Blade: Crimson Sakura_.\n\n_Demon Blade: Crimson Sakura:_\nA _tier-6_ weapon requiring _20 strength_ and dealing _6–28 base damage_. Its damage scales by _1–7_; accuracy modifier, speed, and reach are all _1_.\n\nAmbush damage ranges from _50% of the minimum damage to maximum damage_ (a 50% ambush bonus).\n\nEach hit restores _10% of damage dealt_ as HP.\n\n_Duelist ability (Afterimage):_ Blink up to 2 tiles, leaving a mirror image with _6 + 6 × weapon level_ maximum HP, and gain invisibility for _2 + weapon level_ turns.
custom.dict.dict.melee_palermosword_d=A _tier-6_ weapon requiring _20 strength_ and dealing _6–18 base damage_.\n\nIts damage scales by _1–4_, accuracy modifier is _1_, speed is _0.5_, and reach is _1_.\n\nEach consecutive hit on the same target increases its accuracy modifier by 0.2. This resets after 3 turns without attacking or when switching targets.\n\nEvery fourth hit grants one charge of Accelerated Future and Breathing Method. Accelerated Future makes the next attack or ability use with this weapon free of turn cost. Breathing Method makes the first strike of its next attack or ability deal 1.2 times maximum damage.\n\n_Duelist ability (Unravel):_ Spend 2 charges (1 while Accelerated Future is active) to make four successive lunging attacks in one turn (free while Accelerated Future is active) against any enemy within _reach + 1_. Each strike deals _6 + weapon level_ bonus damage and always hits. If a target dies before all four lunges are complete, a random enemy within _reach + 1_ of your current position is chosen for the remaining attacks. The ability ends once all attacks are made or no valid target remains.
custom.dict.dict.melee_chainmace_d=A _tier-6_ weapon requiring _22 strength_ and dealing _6–23 base damage_.\n\nIts damage scales by _1–8_, accuracy modifier is _0.8_, speed is _1_, and reach is _1_.\n\nIt cannot ambush.\n\nWhile equipped, an iron ball appears and follows the wielder at the same movement speed. If the wielder has enough strength, the ball can be hurled with the weapon's quick ability to deal _12 + 2 × weapon level_ to _46 + 16 × weapon level_ damage to all characters in a 3×3 area around the landing point. This attack always hits and deals 75% less damage to the wielder. The ball then returns at three times its movement speed. To throw it, the ball must be near the wielder, and the wielder must lie between the ball and the target point.\n\n_Duelist ability (Sweeping Strike):_ Spend 2 charges to deal _16 + 4 × weapon level_ bonus damage to every enemy in sight with a clear line of fire (or any enemy in range with the Seeking enchantment). The attack always hits.
custom.dict.dict.melee_auxiliarycore_d=A _tier-6_ weapon requiring _20 strength_ and dealing _6–25 base damage_.\n\nIts damage scales by _1–7_, accuracy modifier is _1_, speed is _1_, and reach is _1_.\n\nAttacks deal an additional 10 magical damage (affected by Upgrade Stones).\n\nYou can expend the weapon to empower a melee or missile weapon of tier 5 or lower. Its attacks then deal _weapon tier–10_ bonus magical damage. If its original reach is less than 2, its reach increases by 1; otherwise, its attack delay is reduced by one third.\n\n_Duelist ability (Arcane Empowerment):_ Activate without spending a turn. For _2 + weapon level_ turns, the weapon's bonus magical damage is doubled.
custom.dict.dict.melee_hundredtonhammer_d=A _tier-6_ weapon requiring _20 strength_ and dealing _6–21 base damage_.\n\nIts damage scales by _1–7_, accuracy modifier is _1.18_, speed is _1_, and reach is _1_.\n\nOn hit, it has a 1-in-3 chance to knock the target back _2 + weapon level/4_ tiles (rounded down); ambushes always trigger the knockback.\n\n_Duelist ability (Launch):_ Can only target an adjacent enemy. It always knocks the target back, deals _7 + 1.5 × weapon level_ bonus damage, and inflicts Daze for 5 turns, halving accuracy and evasion. It always hits, but only ambushes receive the bonus damage. If other enemies are adjacent to the landing point, they take one third of the damage.
custom.dict.dict.artifact_necronomicon_d=A _tier-6_ artifact obtained only through alchemy: _one Corpse Dust, one Rubbings Tome, one identified unequipped uncursed wand_, and _10_ alchemical energy. It starts at level _0_ with _5/5_ charge; its level cap is _5_ and hard charge cap is _5+artifact level_.\n\nWhile equipped and not cursed or Magic Immune, hero experience grants artifact experience and charge; thresholds are _100/200/300/400/500_ and overflow is retained. Time charge uses the missing-charge curve _multiplier/(120−5×missing charge)_, only while natural regeneration is active.\n\n_Chant_ costs _1 charge_ against a legal ordinary enemy and binds its soul; normal death is intercepted, the target is restored and corrupted, and one corrupted Wraith appears nearby. Chasm death is not intercepted. Empty ground costs _2 charge_ and summons up to _2+artifact level_ corrupted Wraiths in valid adjacent cells; occupied, solid, transition and abyss cells are rejected.\n\nWhen cursed, the book shares Corpse Dust's single `DustGhostSpawner` cadence; curse spawning is not suppressed by Magic Immunity, while normal chanting and charge paths are.
custom.dict.dict.scroll_alter_d=Select an eligible backpack item and transmute it into a random item of the same type, preserving upgrades, enhancements, enchantments, and glyphs. Potions and scrolls become their corresponding exotic versions and vice versa. Using it on tier-6 equipment downgrades it to a random tier-5 item. The Ascension Scroll raises weapon or armor tiers, but tier-5 equipment cannot be raised further. Enhancement Stones strengthen one attribute while weakening another. Weapon speed and damage enhancements and armor evasion and defense enhancements modify their listed stats. Enhancement Stones also appear in shops on floors 6, 11, 16, and 20.
custom.dict.dict.scroll_extraction=extraction terminal
custom.dict.dict.scroll_extraction_d=Always sold in Tower shops. Use it on equipment upgraded by Scrolls of Upgrade or similar methods to count its cumulative upgrade investments and extract the same number of Scrolls of Upgrade.\n\nAfter a successful extraction, the equipment loses the corresponding number of levels and its recorded upgrade count is cleared; its level cannot fall below _0_.
custom.dict.dict.duelist_ability_d=Duelist armor abilities and weapon skills are selected from the current class and subclass options.
custom.dict.dict.ring_wealth_d=Increases the chance and quality of treasure drops. Its treasure tier is capped in the Endless Tower.
custom.dict.dict.buff_pos1_d=A beneficial status effect. Its exact effect depends on the source that granted it.
custom.dict.dict.trap_1_d=A dungeon trap that activates when triggered and applies its listed effect.
custom.dict.dict.misc_seal_d=A mysterious seal used by custom content. Its behavior depends on the associated item or event.
custom.dict.dict.info_melee_d=Melee weapons attack adjacent targets and scale with their tier, upgrades, and strength requirements.
custom.dict.dict.info_feeling_d=Most floors are ordinary; others gain a random atmosphere with special generation rules. Tower floors include additional atmosphere types.
custom.dict.dict.info_lck_floor_d=During a boss fight the hero cannot leave the floor, hunger and natural regeneration pause, and dealing damage to the boss grants temporary regeneration time.
custom.dict.dict.info_ranking_d=Rankings sort scores from highest to lowest. Total score combines game, treasure, exploration, boss, and quest scores, then applies challenge and completion multipliers.
custom.dict.dict.missile_club_d=_Tier 2_ thrown weapon; requires _11_ Strength, deals _4–8_ base damage, and has _15_ durability per weapon.\n\nIts damage scaling is _2–2_. It does not stick to targets, and picking it up does not consume a turn.
custom.dict.dict.food_ration_d=At least one ration spawns on every non-Boss floor. Eating takes 3 turns and restores _300_ hunger.\n\nSmall rations are sold in pairs in shops on floors 6, 11, 16, and 20. Eating takes 3 turns and restores _150_ hunger.\n\nWith the _Dietary Restriction_ challenge, rations restore only 100 hunger and small rations restore 50.
custom.dict.dict.missile_javelin_d=_Tier 4_ thrown weapon; requires _15_ Strength, deals _8–20_ base damage, and has _10_ durability per weapon.\n\nIts damage scaling is _2–4_.
custom.dict.dict.missile_trident_d=_Tier 5_ thrown weapon; requires _17_ Strength, deals _10–25_ base damage, and has _10_ durability per weapon.\n\nIts damage scaling is _2–5_.
custom.dict.dict.misc_gold_d=Gold can be spent at shops on floors 6, 11, 16, and 20.\n\nA pile usually contains _30+10×floor depth to 60+20×floor depth_ gold, though special cases may yield different amounts.
custom.dict.dict.missile_throwingspike_d=The _Duelist's_ starting _Tier 1_ thrown weapon; requires _9_ Strength, deals _2–5_ base damage, and has _10_ durability per weapon.\n\nIts damage scaling is _1–2_.
custom.dict.dict.melee_greatshield_d=_Tier 5_ weapon; requires _18_ Strength, deals _5–18_ base damage, and has _1–4_ damage scaling. Its accuracy modifier is _1_, delay is _1_, and reach is _1_.\n\nIt has _0–6_ base defense and _0–2_ defense scaling.\n\n_Duelist Technique (Guard):_ Fully blocks physical and magical attacks for _3+weapon level_ turns. The effect ends after dealing damage or when the turn ends.
custom.dict.dict.melee_mace_d=_Tier 3_ weapon; requires _14_ Strength and deals _3–16_ base damage.\n\nIts damage scaling is _1–4_, accuracy modifier _1.28_, delay _1_, and reach _1_.\n\n_Duelist Technique (Crush):_ Deals an extra _5+1.5×weapon level_ damage and inflicts 5 turns of Daze, halving Accuracy and Evasion. The strike always hits, but gains no bonus damage unless it is a surprise attack.
