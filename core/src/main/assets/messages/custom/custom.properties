custom.dict.dict.missile_portableblackhole=portable wormhole
custom.dict.dict.missile_portableblackhole_d=A tier _6_ thrown weapon requiring _19_ strength. It deals _10-25_ base damage; minimum damage grows by _2_ and maximum damage by _6_ per level. Each item has _5_ base uses and stacks to _3_. A hit follows normal missile rules and embeds the weapon if the target survives. Throwing at an empty landing cell consumes one extra use and, unless it is a pit, relocates eligible units carrying embedded Portable Wormholes to that cell or nearby legal cells. Immovable and teleport-immune units stay put; if space is insufficient, remaining units are not moved.

custom.dict.dict.melee_hundredtonhammer=100T hammer
custom.dict.dict.melee_oracleterminal=oracle terminal
custom.dict.dict.melee_oracleterminal_d=A tier _6_ weapon requiring _20_ strength, dealing _6-30_ base damage with _1-7_ growth. It changes form every _10_ turns. Non-scythe forms transfer _5_ weight from the selected form to the scythe form after each roll; selecting the scythe resets weights to _30/30/30/10_. Blunt grants +20 accuracy and a 1/3 chance to paralyze for 1 turn; slash grants +20 attack speed and a 1/3 chance to disarm for 1 turn; thrust grants +20 movement speed and a 1/3 chance to apply bleeding equal to 30 of damage dealt; scythe grants +50 damage and makes each foe vulnerable for 5 turns on its first hit. Below _10_ HP, the next form is spoon, which halves damage. The Duelist's ability changes with form: blunt heavy blow, instant sword dance for _2+weapon level_ turns, armor-piercing thrust with _2+floor(weapon level/7)_ extra range, scythe bleeding, or spoon, which instantly consumes all charges to heal _10_ maximum HP without using a turn.
custom.dict.dict.melee_mercuryblade=mercury blade
custom.dict.dict.melee_mercuryblade_d=A tier _6_ weapon requiring _20_ strength. Base melee damage is _6-28_ with _1-7_ growth, accuracy _1_, delay _0.8_, reach _1_. Its projected blade deals _8+2×level to 20+4×level_ damage and inflicts 2 turns of Ooze. The Duelist ability stabilizes it for _2+level_ turns, removing liquid-metal cost and increasing Ooze to 3 turns.
custom.dict.dict.melee_auxiliarycore=auxiliary core
