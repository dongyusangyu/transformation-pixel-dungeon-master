custom.dict.dict.bomb_holy_d=Ignites and explodes after 2 turns, dealing _4+floor depth~12+3*floor depth_ damage to all creatures in a 5x5 area, with 50% bonus damage to enemies with _undead or demonic properties_.
custom.dict.dict.ring_energy_d=Increases the recharge speed of the wearer's wands, artifacts, and armor abilities to _1.175^effect level_ times normal.
custom.dict.dict.ring_shoot_d=Raises thrown-weapon damage to the value at _an upgrade level equal to the effect level_ and increases durability to _1.2^effect level_ times normal. This can affect the uses of coated darts except rotberry darts.
custom.dict.dict.bomb_shocking_d=Ignites and explodes after 2 turns, dealing _4+floor depth~12+3*floor depth_ damage to all creatures in a 5x5 area and releasing 1000 units of smoke.
custom.dict.dict.bomb_wool_d=Ignites and explodes after 2 turns, dealing _4+floor depth~12+3*floor depth_ damage to all creatures in a 5x5 area and creating magic sheep in a 9x9 area for 200 turns (20 turns on boss floors; interaction ends the effect immediately).
custom.dict.dict.ring_haste_d=Increases the wearer's movement speed to _1.175^effect level_ times normal.
custom.dict.dict.ring_might_d=Grants the wearer _effect level_ bonus points of Strength and raises maximum HP to _1.035^effect level_ times normal.
custom.dict.dict.bomb_flash_d=Ignites and explodes after 2 turns, dealing _4+floor depth~12+3*floor depth_ damage to all creatures in a 5x5 area, plus 25% shock damage and 10 turns of paralysis.
custom.dict.dict.ring_furor_d=Increases the wearer's attack speed to _1.09051^effect level_ times normal.
custom.dict.dict.bomb_shrapnel_d=Ignites and explodes, dealing _4+floor depth~12+3*floor depth_ damage to all creatures in range. Its radius resembles an 8-tile field of view; tall grass can block the blast, and the explosion does not destroy items or certain scenery.
custom.dict.dict.bomb_arcane_d=Ignites and explodes after 2 turns, dealing _4+floor depth~12+3*floor depth_ magical damage to all creatures in a 5x5 area.
custom.dict.dict.ring_tenacity_d=Reduces all damage taken by the wearer to _0.85^(effect level*missing HP ratio)_ times normal, rounded up (final damage is at least 1).
custom.dict.dict.ring_evasion_d=Increases the wearer's Evasion to _1.125^effect level_ times normal.
custom.dict.dict.bomb_frost_d=Ignites and explodes after 2 turns, dealing _4+floor depth~12+3*floor depth_ damage to all creatures in a 5x5 area, freezing them for 4 turns and leaving a 5x5 field of cold for 10 turns.
custom.dict.dict.bomb_flame_d=Ignites and explodes after 2 turns, dealing _4+floor depth~12+3*floor depth_ damage to all creatures in a 5x5 area and leaving fire there for 10 turns (fire over chasms lasts only 2 turns).
custom.testmode.testbag.desc=This bag stores test items.\n\nItems that do not fit in this bag will be placed in Test Bag #2.
