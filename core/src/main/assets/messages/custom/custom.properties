custom.dict.dict.spell_spells=Crystalline Spells
custom.dict.dict.spell_spells_d=Crystalline spell recipes are listed in the Alchemy Guide. Their effects are summarized below:\n\n_Unstable Spell:_ Randomly triggers a non-combat scroll when no enemies are visible, or a combat scroll when enemies are visible. Most scrolls have a weight of 2; identify has 3, upgrade has 0, and transmutation has 1.\n\n_Metamorphosis Crystal:_ After choosing a talent type, lets the hero select a talent of that type.\n\n_Metamorphosis Prism:_ Replaces an acquired Boss talent with a candidate from the same slot, or transforms an eligible subclass talent within its expanded subclass pool. Cancelling after candidates appear still consumes the prism.\n\n_Wild Energy:_ Triggers a random cursed-wand effect and grants 4 immediate plus 8 gradual turns of wand and artifact recharging.\n\n_Telekinetic Grab:_ Retrieves an item or all thrown weapons stuck in a character.\n\n_Phase Shift:_ Randomly teleports the target; non-boss and non-miniboss targets are paralyzed for 10 turns afterward.\n\n_Alchemize:_ Converts an item into gold or alchemical energy based on its value.\n\n_Curse Infusion:_ Curses an item, replacing its enchantment or glyph, and grants 1 + item level / 6 bonus levels, rounded down.\n\n_Magical Infusion:_ Upgrades an item without removing its enchantment or glyph.\n\n_Recycle:_ Converts a potion, scroll, seed, runestone, or tipped dart into a random item of the same kind.\n\n_Reclaim Trap:_ Stores a selected trap effect, then recreates that effect on its next use; only recreating the trap consumes one.\n\n_Summon Elemental:_ Can be infused to change the summoned allied elemental. The elemental does not follow between floors, and each summon consumes one.\n\n_Beacon of Returning:_ Sets or resets a return point, then returns the hero to it from anywhere; only returning consumes one.

custom.dict.dict.info_surface=Floor 0
custom.dict.dict.artifact_eye=precognitive eye
custom.dict.dict.artifact_eye_d=An artificial eye that predicts the next instant. It has no passive evasion bonus. While equipped and uncursed, it gradually restores charge. Activating _Momentary Foresight_ costs _20% charge_, consumes no time, and stores one guaranteed dodge, up to _artifact level + 1_ stored dodges. Dodges consumed from Momentary Foresight do not grant artifact experience.\n\nMaximum charge is _100_. Natural recharge is _0.5 + 0.1 * artifact level_ charge per turn, from _0.5_ at +0 to _1_ at +5. External artifact recharge grants _3_ charge per recharge unit. The eye gains artifact experience equal to _100 * the hero's level-progress gained_, and each ordinary enemy-attack dodge grants _10_ more. Each upgrade requires _100 + 100 * artifact level_ experience; maximum level is _5_, while its displayed level is twice its actual level.\n\n_Artifact recharge_ effect: follows the same external recharge interface as other artifacts.\n\n_Curse_ effect: the eye cannot gain charge and enemy attacks against you always hit.\n\n_Armor ability, Trinity_ effect: grants _1_ guaranteed dodge, plus one additional dodge per Spirit Form talent point, for _35_ armor charge. This effect remains independent of the eye's active storage cap.
custom.dict.dict.info_tier=Weapon and Armor Tiers
custom.dict.dict.info_tier_d=Weapon and armor tier probabilities depend on the current region.\n\nTier 1 weapons and armor do not generate naturally.\n\nFor melee and missile weapons, tier probabilities from left to right correspond to regions 1 through 5:\n\n_Tier 2:_ 75%, 25%, 0%, 0%, 0%\n\n_Tier 3:_ 20%, 50%, 40%, 20%, 0%\n\n_Tier 4:_ 4%, 20%, 50%, 40%, 19%\n\n_Tier 5:_ 1%, 5%, 10%, 40%, 80%\n\n_Tier 6:_ 0%, 0%, 0%, 0%, 1%\n\nArmor has no tier 6 and still uses the original five-tier probabilities; region 5 uses tier 4 at 20% and tier 5 at 80%.\n\nThe Tower uses independent tier weights on floors -1 and below: tier 4 at 5%, tier 5 at 60%, and tier 6 at 35%. Melee and missile weapons use these weights; tier 6 armor downgrades to tier 5, so armor effectively uses tier 4 at 5% and tier 5 at 95%.\n\n_Tier 6 item downgrade:_ A tier 6 item used with a _scroll of transmutation_ or _scroll of uptier_ is first treated as a tier 5 item. Transmutation draws from the corresponding tier 5 pool, and a scroll of uptier cannot create a new tier 6 item.
custom.dict.dict.info_surface_d=Floor 0 is the surface town. Dongyusangyu, the dungeon doctor, the shopkeeper, and a test statue are generated at fixed locations. The test statue can be used for damage testing.\n\nThe surface shop follows fixed stock rules, although some equipment, potions, and scrolls are still selected randomly. All merchandise uses the pricing standard for depth 20.\n\nEnemies do not respawn naturally on floor 0. The staircase inside the locked manor leads to the Tower.
custom.dict.dict.info_tower=Tower
custom.dict.dict.info_tower_d=The Tower is reached through the locked manor on floor 0. It begins at _floor -1_ and continues upward without a fixed final floor.\n\nThe Tower uses independent floor, room, trap, enemy, and reward generation. Every _5th_ floor is a boss floor. Whenever the hero moves between Tower floors, the log predicts the floor and identity of the next boss.\n\nRegular floors select evenly from all registered Tower creatures. The Tower is still unfinished, so its content, balance, and rules may continue to change.
custom.dict.dict.armor_stylus=Arcane Stylus
custom.dict.dict.armor_stylus_d=The Arcane Stylus is generally used on armor to apply a random glyph. It cannot replace a cursed glyph.\n\nThe King's Ring can also be inscribed with a random glyph.\n\nWith the _Kebi_ talent, its eligible targets expand to weapons, which receive a random enchantment.
custom.dict.dict.tower_chapter=Tower creatures
custom.dict.dict.tower_chapter_d=All currently implemented Tower creatures, including summoned creatures which do not spawn naturally.
custom.dict.dict.tower_camouflage_gnoll=camouflage gnoll
custom.dict.dict.tower_camouflage_gnoll_d=One of _13_ equally weighted regular Tower creatures.\n\nMaximum health _100_; vision _8_; range _1_; damage _20-30_; armor _0-10_; attack delay _1_; speed _1_; evasion _20_; accuracy _40_. Grass raises evasion to _30_ and increases its on-hit poison from _2-4_ to _10-20_ turns.\n\nAwards _13_ experience through hero level _30_ and has a _50%_ gold drop chance.
custom.dict.dict.tower_corrosive_swarm=corrosive swarm
custom.dict.dict.tower_corrosive_swarm_d=One of _13_ equally weighted regular Tower creatures.\n\nMaximum health _200_; vision _8_; range _1_; damage _15-25_; armor _0-10_; attack delay _1_; speed _1_; evasion _20_; accuracy _40_. Damage splashes ooze around it and can split the swarm while it has more than _10_ health. Ooze deals zero damage to these swarms but still triggers splitting and chained bursts.\n\nThe original awards _13_ experience through hero level _30_. Its base potion drop chance is _1/8_ and halves with each split generation.
custom.dict.dict.tower_corpse=corpse
custom.dict.dict.tower_corpse_d=One of _13_ equally weighted regular Tower creatures.\n\nMaximum health _1_; vision _8_; range _1_; damage _10-40_; armor _0_; attack delay _1_; speed _1_; evasion _20_; accuracy _40_. Ordinary damage is ignored, while positive healing becomes equal unavoidable damage. It is undead.\n\nAwards _13_ experience through hero level _30_ and has a _1/8_ toxic gas potion drop chance.
custom.dict.dict.tower_earthly_serpent=earthly serpent
custom.dict.dict.tower_earthly_serpent_d=One of _13_ equally weighted regular Tower creatures.\n\nBase maximum health _240_; vision _8_; ballistic range _2_; base damage _24-36_; armor _8-16_; base attack delay _0.5_; base speed _1_; evasion _20_; accuracy _40_. Melee damage dealt can raise maximum health to _480_ and double damage and speed while halving attack delay. It heals _10%_ maximum health per turn, emits corrosive gas, and poisons melee attackers.\n\nIt is acidic and large, awards _13_ experience through level _30_, and always drops a seed.
custom.dict.dict.tower_roast_lamb_warlock=roast lamb warlock
custom.dict.dict.tower_roast_lamb_warlock_d=One of _13_ equally weighted regular Tower creatures.\n\nMaximum health _150_; vision _8_; melee range _1_; melee damage _0-20_; armor _0-10_; attack delay _1_; speed _1_; evasion _20_; accuracy _40_. It surrounds each new target once with sheep lasting _6_ turns, then casts a range-_7_, 70-degree fireblast for _15-35_ magic damage, burning, and _4_ turns of crippling.\n\nIt is undead, fiery, and fire-immune. It awards _13_ experience through level _30_ and may drop a flock stone or fireblast wand.
custom.dict.dict.tower_mechanical_fist=mechanical fist
custom.dict.dict.tower_mechanical_fist_d=One of _13_ equally weighted regular Tower creatures.\n\nMaximum health _250_; vision _8_; range _1_; damage _10-35_; armor _30-70_; attack delay _1_; speed _1_; evasion _20_; accuracy _40_. Every hit pushes its target up to _3_ cells without collision damage.\n\nIt is inorganic and large, awards _13_ experience through level _30_, and drops no regular item.
custom.dict.dict.tower_mimic_crocodile=mimic crocodile
custom.dict.dict.tower_mimic_crocodile_d=One of _13_ equally weighted regular Tower creatures.\n\nMaximum health _100_; vision _8_; range _1_; normal damage _20-30_; armor _0-10_; attack delay _1_; speed _1_; evasion _20_; normal accuracy _40_. It starts hidden; its first attack always hits for _90_ base damage. Every hit cripples for _3_ turns and causes bleeding equal to half the damage dealt.\n\nAwards _13_ experience through level _30_ and may drop mystery or phantom meat.
custom.dict.dict.tower_obscura=the obscura
custom.dict.dict.tower_obscura_d=One of _13_ equally weighted regular Tower creatures.\n\nMaximum health _150_; vision _8_; range _1_; damage _15-30_; armor _0-20_; attack delay _1_; speed _1_; evasion _30_; accuracy _50_. After first sight it spends _3_ actions summoning one wild dread. That dread revives while its owner lives and disappears with it.\n\nIt is demonic, awards _13_ experience through level _30_, and drops no regular item.
custom.dict.dict.tower_wild_dread=wild dread
custom.dict.dict.tower_wild_dread_d=Summoned only by _the obscura_.\n\nMaximum health _21_; vision _8_; range _1_; damage _15-45_; armor _0-10_; initial attack delay _5_; speed _1_; evasion _20_; accuracy _50_. Completed attacks reduce its attack delay toward _1_. It revives at full health while its owner lives.\n\nIt is demonic and inorganic, awards no experience, and drops nothing.
custom.dict.dict.tower_alienated_prismatic_guard=alienated prismatic guard
custom.dict.dict.tower_alienated_prismatic_guard_d=One of _13_ equally weighted regular Tower creatures.\n\nMaximum health _100_; vision _8_; base evasion _20_; base accuracy _40_. Its remaining combat values dynamically copy the hero's weapon, armor, strength, and combat rings, including enchantments and glyphs. It splits immediately after seeing the hero and attempts another twisted mirror every _5_ actions. Allies mistake it for the hero.\n\nIt is inorganic, awards _13_ experience through level _30_, and has a _1/8_ mirror image scroll drop chance.
custom.dict.dict.tower_twisted_mirror=twisted mirror
custom.dict.dict.tower_twisted_mirror_d=Created only by an _alienated prismatic guard_.\n\nMaximum health _1_; vision _8_; base evasion _20_; base accuracy _40_; speed _1_. It copies the hero's weapon, reach, damage, delay, and enchantment, but not armor, strength, or rings. Allies mistake it for the hero.\n\nIt is inorganic, awards no experience, and drops nothing.
custom.dict.dict.tower_soul_collector=soul collector
custom.dict.dict.tower_soul_collector_d=One of _13_ equally weighted regular Tower creatures.\n\nMaximum health _200_; vision _8_; cannot attack; armor _0-20_; speed _1_; evasion _20_. It flees enemies, records deaths in sight, and channels each soul for _3_ actions before raising a powerful wraith.\n\nIt is undead, awards _13_ experience through level _30_, and has a _1/8_ mind vision potion drop chance.
custom.dict.dict.tower_powerful_wraith=powerful wraith
custom.dict.dict.tower_powerful_wraith_d=Raised only by a _soul collector_.\n\nMaximum health _100_; vision _8_; range _1_; damage _1+scaling depth/2_ to _2+scaling depth_; armor _0_; attack delay _0.5_; speed _2_; evasion _(10+scaling depth)x5_; accuracy _10+scaling depth_. It flies, heals _1_ health per action, and has a _1/3_ chance to push the hero one cell.\n\nIt is undead and inorganic, awards no experience, and drops nothing.
custom.dict.dict.tower_heavy_crabification=heavy crabification
custom.dict.dict.tower_heavy_crabification_d=One of _13_ equally weighted regular Tower creatures.\n\nMaximum health _150_; vision _8_; range _1_; damage _15-45_; armor _0-10_; attack delay _1_; speed _0.5_; normal evasion _20_; accuracy _40_. It blocks attacks from its visible current target. Ambushes and flanking set evasion to zero and deal half character damage; corruption, terrain, traps, gases, and damage-over-time effects bypass its guard. After _50_ peaceful turns it molts and heals _30_.\n\nAwards _13_ experience through level _30_ and has a _50%_ mystery meat drop chance.
custom.dict.dict.tower_marsh_slime=marsh slime
custom.dict.dict.tower_marsh_slime_d=One of _13_ equally weighted regular Tower creatures.\n\nMaximum health _200_; vision _8_; range _1_; damage _15-25_; armor _0_; attack delay _1_; speed _1_; evasion _20_; accuracy _40_. The first physical or magical damage type that reduces its health or shielding becomes fully negated thereafter.\n\nIt is dark slime and large, awards _13_ experience through level _30_, and has a _1/4_ chance to drop a blob of goo.
custom.dict.dict.tower_rune_spinner=rune spinner
custom.dict.dict.tower_rune_spinner_d=One of _13_ equally weighted regular Tower creatures.\n\nMaximum health _120_; vision _8_; range _1_; damage _15-35_; armor _0-10_; attack delay _1_; speed _1_; evasion _20_; accuracy _40_. Its rune web lasts _3_ turns and slows for _2_. Bites can poison, force an existing cursed glyph to trigger, and have a _1%_ chance to place a random cursed glyph when none is present.\n\nAwards _13_ experience through level _30_ and drops no regular item.
custom.dict.dict.tower_chain_shadow_thief=chain-shadow thief
custom.dict.dict.tower_chain_shadow_thief_d=One of _14_ equally weighted regular Tower creatures.\n\nMaximum health _100_; vision _8_; range _1_; damage _15-40_; armor _0_; attack delay _1_; speed _1_, then _2_ while fleeing with stolen goods; evasion _20_; accuracy _40_. When an enemy hero is visible and a projectile line is clear, it fires Guard's chain effect once to steal one eligible backpack item. Stackable items are taken as a whole stack. It does not pull, damage, or cripple the hero.\n\nAwards _13_ experience through level _30_, drops no intrinsic item, and drops the stolen item on death.
custom.dict.dict.tower_death_butterfly=death butterfly
custom.dict.dict.tower_death_butterfly_d=One of _15_ equally weighted regular Tower creatures.\n\nMaximum health _120_; vision _8_; range _1_; damage _10-20_; armor _0-15_; attack delay _1_; speed _1_; evasion _30_; accuracy _40_. It flies and is undead. A successful melee hit has a _50%_ chance to place a non-stacking death curse for _10 turns_, then the butterfly flees while its own curse remains. The curse cannot affect bosses or minibosses. Natural expiry kills a non-hero outright and affects the hero like a Grim Trap. Full cleansing or killing the matching caster removes only that curse safely.\n\nAwards _13_ experience through level _30_ and drops no regular item.
custom.dict.dict.tower_dark_mechanical_fist=dark mechanical fist
custom.dict.dict.tower_dark_mechanical_fist_d=This corrupted construct retains the mechanical fist's _250_ health, _10–35_ damage and _30–70_ armor. Its melee attacks knock targets back up to _3_ cells, and successful hits inflict _3_ turns of blindness. At the start of each actionable turn, its eye fires a Health Ray at one visible enemy with a clear trajectory for half of a normal damage roll without consuming its action. This magical shot cannot miss and applies no other effect.\n\nIt always drops one cursed metal shard, and this drop does not decay.
custom.dict.dict.tower_myriad_black_shadow=myriad black shadow
custom.dict.dict.tower_myriad_black_shadow_d=A rare replacement for the alienated prismatic guard slot; Rat Skull rarity bonuses apply. Maximum health _100_; vision _8_; range _1_; damage and armor mirror the hero's current weapon and armor; attack delay and speed follow the guard replica. It mirrors the hero's combat rings and cannot be selected by allies. Every _5_ actionable turns it splits one fragile tower creature with _1_ health, _0_ experience, and no direct loot; recursive summoners and mirror variants are excluded. It always drops a Scroll of Transmutation.
custom.dict.dict.tower_tapir_crocodile=tapir crocodile
custom.dict.dict.tower_tapir_crocodile_d=A rare replacement for the mimic crocodile slot; Rat Skull rarity bonuses apply. Maximum health _100_; vision _8_; normal damage _20-30_; armor _0-10_; evasion _20_; accuracy _40_. Its hidden ambush fires a warding missile for _60_ magical damage, then puts a surviving target into magical sleep. Normal ranged zaps use the same missile, deal _20-30_ magical damage, and have a _50%_ sleep chance. It refuses to attack sleeping targets; once revealed, it never hides again. Adjacent melee attacks retain the mimic crocodile's bleeding. It may independently drop a Stone of Deep Sleep at _1/2_ and a Shocking Brew at _1/12_.
custom.dict.dict.tower_pestilence_knight=Pestilence Knight
custom.dict.dict.tower_pestilence_knight_d=A seeded candidate for every _5th_ Tower floor.\n\nBase maximum health _1500_; vision _8_; range _1_; base damage _20-30_; armor _10-25_; attack delay _1_; speed _1_, then _2_ in Terminal; evasion _30_; accuracy _50_. Later boss floors grant up to six growth ranks.\n\nFinal damage is capped at _150_. At _70%_ and _35%_ health it channels Harvest, heals up to _200_ from miasma, and advances phase. Its warned skills spread infection, prescriptions, charges, and miasma. It rejects new negative effects _50%_ of the time.\n\nStepping onto the ready mobile purifier instantly clears plague miasma and infection within a _13-by-13_ area of the arena. After combat begins it also deals _100_ damage to the Knight, then relocates and recharges for _10_ hero turns.\n\nAwards no experience. Drops a Potion of Cleansing and one reward from the Tower boss reward pool.
custom.dict.dict.tower_death_knight=Death Knight
 custom.dict.dict.tower_death_knight_d=A seeded candidate for every _5th_ Tower floor.\n\nMaximum health _1500_; vision _8_; range _1_; damage _28-42_; armor _15-30_, then _0_ in Death Duel; attack delay _0.5_; speed _2_, then _3_; evasion _30_; accuracy _50_.\n\nFinal damage is capped at _150_. Health locks at _1050_ and _525_ advance its three phases. Each transition starts _five_ invulnerable teleport slashes, first immediately and then every _3_ world turns. Each slash deals _10-20_ base damage, ignores ordinary dodge and foresight, and applies _5_ turns of blindness and slow on hit. Death Duel slashes ignore armor; a slash without a legal landing is skipped.\n\nA skill hit dispels selected temporary benefits and adds one execution mark. HP strictly below _5% x stacks x current maximum HP_ causes execution, bypassing shields. Marks clear on victory or resurrection. Normal melee independently has _33%_ cripple and _10%_ degrade chances; transition slashes have neither. Each _200_ HP lost by the knight reduces the hero's natural vision by _10%_, to a minimum of _2_; torchlight restores at least _6_.\n\nAwards no experience. Drops an enchantment stone, an augmentation stone, and one reward from the Tower boss reward pool.
 custom.dict.dict.tower_gentleman_elf=Fairy Gentleman
 custom.dict.dict.tower_gentleman_elf_d=A seeded candidate for every _5th_ Tower floor and an equally weighted Tower Boss.\n\nMaximum health _1500_; vision _6_; range _1_; damage _20-40_; armor _0-20_; attack delay _1_; speed _0.8_, then _1.6_ in the mirror phase; evasion _25_; accuracy _50_. Final damage is capped at _50_. Health locks at _1200_ and _600_ advance its three phases.\n\nThe first phase alternates blue Drunkenness wine, yellow Exhilaration wine, and a warned line rush. Wine targets the current enemy and waits when no enemy exists. The second phase creates one green wine cup; the Gentleman rushes to a cup four to eight tiles away along a clear ballistic line, damaging the warned route. Breaking the cup grants Exhilaration and converts existing Exhilaration to Drunkenness.\n\nThe third phase creates two illusions; after they vanish, all active attacks become a three-tile-wide “I’ll Have This!” charge. Every _5-20_ global turns it charges “Let’s Share!”, which is released only when no other special ability is selected. It deals _5_ magical damage and applies _3_ turns of Vertigo and Weakness to other units.\n\nAwards no experience. Death chooses Green Spirit (three items) or Sour Liquor Aroma with equal probability, then uses the Tower Boss reward pool.
custom.dict.dict.misc_random_mode=Random Mode
custom.dict.dict.misc_random_mode_d=Random mode reshuffles many dungeon rules from the current seed. The same seed produces the same random-mode results.\n\n_Items:_ items whose original generation chance is not zero, equipment tiers, and candidates inside the same item group are made as even as possible. Newly generated weapons, missile weapons, and armor receive a strength requirement offset from _-2 to +1_. Missile stacks are no longer always 3: they are 3 items 75% of the time, 2 items 20%, and 1 item 5%. Rings and wands generate at +0 to +3 with chances of 75%, 20%, 4%, and 1%.\n\n_Enchantments and curses:_ weapon enchantment pools, weapon curse pools, armor glyph pools, and armor curse pools are shuffled by seed. Pool sizes stay the same, but their contents may move between qualities. Positive weapon enchantments and armor glyphs ignore rarity when generated, choosing evenly from their full positive pools. Cursed wand effects also trigger evenly from all current cursed effects.\n\n_Crafting and scrolls:_ all four trinket catalyst choices are random trinkets. Scrolls of Metamorphosis skip the talent-type choice after the source talent is chosen and present 4 random options directly. Scrolls of Sublimation directly grant a random boss talent.\n\n_Enemies and traps:_ regular enemies have a 20% chance to be replaced by their rare variant when spawned; armored statues and crystal mimics use 40%, and tormented spirits use 10%. Wild traps are no longer limited by region, and guardian traps summon at least one guardian even in shallow floors.\n\n_Subclass kits:_ in random mode, some subclasses receive their core item if the hero does not already have it: Berserker and Gladiator get the Broken Seal, Battlemage gets a Mage's Staff imbued with a random wand, Assassin gets the Cloak of Shadows, Sniper gets the Spirit Bow, Priest and Paladin get the Holy Tome, AT-400 and AU-400 get the Instruction Tool, and Alchemist gets the Spray Gun.\n\nThe seed finder follows the current random-mode setting, and adding "random mode" to a query forces random-mode lookup for item generation and random talent information.

custom.dict.dict.melee_venomoussickle=venomous sickle
custom.dict.dict.melee_venomoussickle_d=A _tier-6_ weapon requiring _20 strength_. It deals _6+weapon level to 47+7×weapon level damage_, has _0.8_ accuracy, _1_ attack delay, and _1-tile_ reach.\n\nAfter a normal attack hits a living target, the sickle records that target and the hero's position. Move at least once, then move next to the same target to make the next attack against it cost no time. Attacking another target, the target dying, unequipping, or throwing the weapon clears the record. This free attack does not inflict toxicity or create another pursuit record.\n\nA normal hit on a living target has a _20% + 5%×weapon level_ chance to apply one equally weighted toxic effect: poison for _10+weapon level_ turns; corrosion for _3+weapon level_ turns with _5+weapon level_ initial damage; ooze for _10+weapon level_ turns; or a non-corruption debuff from the Wand of Corruption for _6+3×weapon level_ turns.\n\n_Duelist_ ability (follow-up attack): after the movement-triggered free attack, spend _1_ charge to make the next Venomous Sickle attack cost no time and count as a surprise attack. This attack does not inflict toxicity or create another pursuit record.
custom.dict.dict.melee_radiantgoldhalberd=radiant gold halberd
custom.dict.dict.melee_radiantgoldhalberd_d=A _tier-6_ weapon requiring _22 strength_ and dealing _6-48 base damage_. Its requirement drops by 1 at +9 and +15, while mastery still reduces it by 2 more.\n\nIt grows by _1-9_ per level, gains another _1-2_ every third level, and gains a further _1-4_ each level from +12 onward; both extra curves can apply together. It has _1.0 accuracy_, _2.0 attack delay_, and _3-tile reach_. Falsehood Power provides only half of its normal net encumbrance benefit.\n\nA successful normal attack also strikes up to two hostile characters in the four cardinal cells around the primary target. Splash attacks are guaranteed to hit, cannot harm allies, and cannot cause further splashes. If the attack hits _1/2/3 total targets_, all its weapon damage is multiplied by _1.25/1.12/1.0_ respectively. _Transfix_ does not trigger this splash.\n\n_Duelist ability (transfix):_ spends _2 charges_ to launch a non-spinning projection along the chosen direction until solid terrain or the map boundary. Every enemy on the line, including unseen enemies, takes guaranteed weapon damage of _7+level to 7+11*level_ and is processed from farthest to nearest for a 1-tile knockback. An enemy pinned against terrain or the boundary stays in place and takes 120% damage; occupation by another character or knockback immunity grants no bonus. A valid empty line still costs charge and time, while an immediately blocked direction cancels the cast.\n

custom.dict.dict.melee_soulblade=soul blade
custom.dict.dict.melee_soulblade_d=A _tier-6_ melee weapon with a base _20 strength requirement_. It deals _6+weapon level to 24+6×weapon level damage_, has _1.0 accuracy_, _1.0 attack delay_, and _1-tile reach_. Its block range is _0 to 6+2×weapon level_.\n\nEach successful hit on a living enemy has chance _(weapon level+5)/25_ to rend the soul for magic damage equal to 10% of the target's maximum health, floored and never below 1. Against targets with _MINIBOSS_ or _BOSS_ properties, that damage is reduced to one third, still with a minimum of 1. When the shield cooldown is ready, a hit grants a normal shield equal to _15+weapon level×the hero's maximum health_. The shield does not stack and follows normal barrier decay. The shield cooldown is _25-weapon level_ turns, with a minimum of 1.\n\nIn addition to its alchemy recipe, Sacrificial Fire rewards have a _10%_ chance to directly generate a _level-0, unidentified, uncursed, unenchanted_ Soul Blade.\n\n_Duelist ability (Duskfall):_ costs _1 charge_ and consumes no time. The next three melee attacks made with Soul Blade gain _1.5× attack speed_ and _+1 reach_. A miss still consumes an attack; other weapons, thrown weapons, and wands do not. Recasting refreshes the counter to three instead of stacking it. The buff survives weapon switching and is saved with the game.
custom.dict.dict.melee_lakesword=lake sword
custom.dict.dict.melee_lakesword_d=A _tier-6_ sword requiring _20 strength_. It deals _5+weapon level to 30+7×weapon level damage_ with _1.0 accuracy_, _1.0 attack delay_, and _1-tile reach_. Its three states are sheathed, charged, and spent. While a sheathed Lake Sword is equipped in either weapon slot, the final natural regeneration delay is multiplied by _0.5_ (this effect does not stack).\n\nThe _Draw_ action is available while sheathed. It selects a direction and traces a _WONT_STOP_ line for _5+weapon level tiles_, ignoring characters and terrain blockers. Flammable terrain is destroyed; only living enemies on the line are attacked, charm is ignored, and each attack is guaranteed to hit. The action takes one turn and then changes the sword to _charged_ for _4+weapon level turns_. During that charged window, equipped melee attacks deal _1.5× rolled weapon damage_ rounded to the nearest integer and gain _+1 reach_. When the timer expires, or the sword is dropped or thrown, it becomes _spent_.\n\nPicking up the lost _scabbard_ restores the first unsheathed Lake Sword, prioritizing primary slot, secondary slot, then backpack. A scabbard is generated at most once on each eligible ordinary main-dungeon or tower floor; shop, boss, quest, and special floors are excluded.\n\n_Duelist ability (Wind Protection):_ costs _1 charge_ and consumes no time. It grants _2+weapon level turns_ of invisibility and 5 turns of haste without changing the sword state.
custom.dict.dict.melee_mountainguard=mountain guard
custom.dict.dict.melee_mountainguard_d=A _tier-6_ melee weapon with a base _22 strength requirement_. Its base damage is _6+weapon level to 21+5×weapon level_, with _1-5 damage growth_, _1.0 accuracy modifier_, _1.0 attack delay_, and _1-tile attack distance_. Its block range is _0 to 7+3×weapon level_. Blocking, damage charging, the energy tracker, and release action only work while Mountain Guard occupies the primary weapon slot.\n\nEach point of final health or shielding loss dealt directly by an enemy character adds _1%_ mountain energy, capped at 100%. Zero damage, environmental and ongoing effects, and self-damage do not charge it. At 100%, releasing costs one turn and applies Slow and Blindness for _5+weapon level turns_ to every enemy in the hero's field of view, ignoring walls and projectile paths. Default actions prioritize release, then Wall Counter, then the ordinary action.\n\n_Duelist ability (Wall Counter):_ costs _2 charges_ and one turn, lasting _2+weapon level turns_. It reduces direct physical attacks from enemies to zero; magical, environmental, ongoing, and non-enemy damage are unaffected. Each trigger returns guaranteed armor-piercing physical damage equal to a random value from _half the weapon's minimum damage to half its maximum damage_. The buff is the source, so reflection triggers no weapon, enchantment, or recursive counter effects.
custom.dict.dict.tower_hunger_knight=Hunger Knight
custom.dict.dict.tower_hunger_knight_d=An equally weighted candidate on every Tower Boss floor.\n\nMaximum health _1500_; vision _8_; base speed _1_ and _1.5_ in the final phase; base evasion _25_; base accuracy _50_. Its saved private tier-six weapon and armor determine damage, reach, attack delay, defense, glyphs, enchantments and further stat modifiers. Final incoming damage is capped at _150_, with health locks at _1000_ and _300_.\n\nEach phase suppresses one invested ordinary talent and one invested Boss talent of the matching tier. The first phase suppresses weapon enchantments and armor glyphs; the second restores them but inventory slots attenuate only positive Ring of Haste speed; the third maintains full Magic Immunity. None of these effects deletes equipment or talent points, and no item is truly stolen.\n\nWarned Ration-Breaker, frozen-line Famine Thrust, anti-swarm Empty-Stomach Quake and three final-phase Exhaustion Flurries pressure positioning and resources. Melee attacks increase hunger.\n\nAwards no experience. Its private equipment never drops. Death grants the normal Tower metamorphosis scroll and one reward from the Tower Boss reward pool.
custom.dict.dict.wand_cursedflame=wand of cursed flame
custom.dict.dict.wand_cursedflame_d=This wand can be obtained by alchemy or trap conversion. Its alchemy recipe uses _one Wand of Magic Missile, one Wand of Fireblast, one Cursed Metal Shard_, and _5 alchemical energy_. Both source wands must be identified, uncursed, and unequipped. The result takes their average level rounded up, capped at _+3_. Throwing either source wand onto an active Cursed Flame or Soul Scorch trap instead creates a _cursed +0_ wand. Each zap consumes _1 charge_; the base charge limit is _2_.\n\nIt launches a bright-green fireball that seeds cursed flame in a _3×3_ area around impact for _2+ceil(wand level/3) turns_. A directly hit target also takes _2+wand level to 8+5×wand level_ magic damage. The direct hit and area flames can both affect the same target. Cursed flame and Cursed Burning use their own elemental damage resolution, bypass armor, and can ignite flammable terrain and burnable inventory.\n\n_Battlemage:_ a melee hit on a cursed-burning target consumes that status and deals extra cursed-burning damage: _(1+remaining cursed-burning turns)×random(1+floor(wand level/3) to 5+floor(wand level/3))_. Each target has a _9-turn_ cooldown; if it survives, it is given _4 turns_ of Cursed Burning again.\n\n_Elemental Blast:_ deals _67%_ of normal damage, opens doors in its area, and seeds _4 turns_ of cursed flame in every affected cell except the hero's, including water and pits. Elemental Power can extend this to at most _8 turns_. This wand is excluded from random wand generation.
custom.dict.dict.trinket_twin_demon_eyes=Twin Demon Eyes
custom.dict.dict.trinket_twin_demon_eyes_d=A trinket found in the trinket generation pool. Its initial mode is random: _Flame Eye_ or _Laser Eye_. Upgrade energy costs are _20/25/30_. Once identified, the current mode is shown. A successful ranged hit on a living enemy locks onto it for _4+2×trinket level turns_. The lock reveals its position even while blind and blinds the hero for the same duration; a longer pre-existing blindness is never shortened. The lock ends if its duration expires, the target dies/disappears, or the trinket leaves the backpack, then switches mode and displays an orange message.\n\n_Flame Eye:_ fires a bright-green cursed-flame missile on lock turns _1, 3, 5, 7, 9..._, stopping at the first creature or obstacle. It fires _2/3/4/5 shots_ at trinket levels _+0/+1/+2/+3_. A creature hit takes _1+2×trinket level_ cursed-burning damage; the first hit inflicts _4 turns_ of Cursed Burning, later hits inflict _1+trinket level turns_. Bronze Watch and resistances affect actual duration, and reapplication does not shorten a longer existing burn. The missile still seeds cursed flame at a wall; if the wall is not flammable, it seeds _2 turns_ of flame at the last free cell before it. On lock end, the mode changes to Laser Eye.\n\n_Laser Eye:_ charges during the lock, then fires a fixed _12-tile_ ray from the hero toward the target's current cell (or its last recorded position if it disappeared). The ray pierces walls and creatures and hits each creature at most once for random _5+trinket level_ to _(5+trinket level)×charge turns_ magical damage. The damage cannot be evaded, while magical resistance and immunity still apply. Thirteen Leaf Clover affects the random roll. Floor transitions cancel resolution, preventing hits on the previous floor. On lock end, the mode changes to Flame Eye.
custom.dict.dict.melee_greatgreatgreatsword_d=A _tier-6_ weapon requiring _20 strength_ and dealing _6–35 base damage_.\n\nIts damage scales by _1–7_, accuracy modifier is _1_, speed is _1_, and reach is _3_.\n\n_Duelist ability (Cleave):_ Deals _7 + weapon level_ bonus damage and always hits. If Cleave kills an enemy, you can use it again without spending ability charge for the next 5 turns.
custom.dict.dict.melee_demontailwhip_d=A _tier-6_ weapon requiring _20 strength_ and dealing _6–30 base damage_.\n\nIts damage scales by _1–6_, accuracy modifier is _1_, speed is _1_, and reach is _3 + weapon level/7_ (rounded down).\n\nOn hit, it has a 50% chance to inflict a random debuff: a 75% chance of 4 turns of Weakness, Vulnerable, Cripple, Blindness, or Terror, and a 25% chance of 2 turns of Rage, Slow, Hex, or Paralysis.\n\n_Duelist ability (Savage Lash):_ Makes a normal attack against every enemy currently within reach; these attacks always hit.
custom.dict.dict.info_intro_d=Most of this guide is based on the Shattered Pixel Dungeon Annotated Edition and Shattered v3.3.8. It has been revised to reflect and include most changes and additions in Transformation Pixel Dungeon.\n\n_Revised and assisted by:_\nDongyu Sangyu\nDM-216\nSecher-Nbiw\nOGC\nDungeon Wanderer\n\n_Authors of the Shattered annotations:_\nendlesssolitude/Red Dragon (QQ: 1095711567)\nshower/Mumu (QQ: 987765678)\n\n_GitHub repository for the annotated edition:_\nAnnotated edition reference materials omitted\n\nIf you find anything in Transformation Pixel Dungeon that conflicts with this guide, please report it in the game's QQ group.\n\n_Transformation Pixel Dungeon QQ groups:_\nGroup 1: 1015634881\nGroup 2: 940628873\nGroup 3: 1107032719\n\nThis section mainly explains game mechanics.
custom.dict.dict.food_pie_d=Made by alchemizing any meat (including Soul Roast), a ration, and a meat pie (including holiday variants; Phantom Fish Meat also works). Eating it takes 3 turns, restores _900_ satiety (any amount above the satiety cap is wasted), and grants Satiety for 450 turns.\n\n_Satiety:_ Actions spend this effect's duration instead of satiety. While it lasts, you also recover 1 HP every 18 turns. The _Salt Cube_ trinket extends this effect, but also lengthens the interval between bonus healing, so the total bonus HP restored remains unchanged.\n\nWith the _Reduced Nutrition_ challenge enabled, the pie restores only 300 satiety and Satiety lasts 150 turns.\n\nEating-granted effects lose 2 turns of duration unless you have a talent that reduces the turn cost of eating.
custom.dict.dict.food_greenglowfruit=green glow fruit
custom.dict.dict.food_greenglowfruit_d=Obtained by defeating the Tower Boss Fairy Gentleman. Eating takes 3 turns, restores _100_ satiety, grants 50 turns of _Drunkenness_ (damage dealt and damage taken are both reduced by 20%), and grants _40 Barrier_.\n\nWith the _Reduced Nutrition_ challenge enabled, it restores only _33_ satiety.\n\nUnless you have a talent that reduces the turn cost of eating, effects granted by food last 2 fewer turns.

custom.dict.dict.sourwinearoma=sour wine aroma
custom.dict.dict.sourwinearoma_d=Obtained by defeating the Tower Boss Fairy Gentleman. It consumes no turn and inflicts _5 turns of Vertigo_ on all enemies within a _9x9 area_ centered on the hero.
