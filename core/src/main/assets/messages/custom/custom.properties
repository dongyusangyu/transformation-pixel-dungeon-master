custom.testmode.generator.testalignment.name=Alignment Debugger
custom.testmode.generator.testalignment.desc=Used to change the Alignment of a creature at a selected position. After use, first choose the Alignment to set, then press apply and select the target creature on the map.\n\nNormal hostility: ENEMY attacks ALLY and the hero, ALLY attacks ENEMY, and NEUTRAL does not actively select enemies.\n\nSpecial hostility: ENEMY1, ENEMY2, ENEMY3, and ENEMY4 only attack creatures belonging to the other three special ENEMY alignments, and do not actively attack normal ENEMY, ALLY, NEUTRAL, or the hero.
custom.testmode.generator.testalignment.ac_give=Set Alignment
custom.testmode.generator.testalignment.prompt=Choose a creature whose alignment will be changed
custom.testmode.generator.testalignment.no_char=There is no creature at this position whose alignment can be changed.
