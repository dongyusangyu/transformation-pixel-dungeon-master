custom.ch.mimic.goldenmimicforchallenge.name=golden mimic
custom.ch.mimic.goldenmimicforchallenge.desc=Mimics are magical creatures that can freely change shape. In the dungeon they almost always appear as chests, because that reliably attracts unwary adventurers.\n\nGolden mimics are powerful mimics that try to lure top adventurers. They contain richer treasure, but are also stronger than ordinary mimics.
custom.ch.mimic.crystalmimicforchallenge.name=crystal mimic
custom.ch.mimic.crystalmimicforchallenge.ate=The crystal mimic ate your %s!
custom.ch.mimic.crystalmimicforchallenge.escaped=The crystal mimic escaped!
custom.ch.mimic.crystalmimicforchallenge.desc=Mimics are magical creatures that can freely change shape. In the dungeon they almost always appear as chests, because that better attracts unwary adventurers.\n\nCrystal mimics are more cunning than their relatives. They seize treasure and avoid battle as much as possible. Once discovered, they try to flee quickly, and can teleport enemies elsewhere when attacking.
custom.ch.mimic.mimicscroll.name=mimic scroll
custom.ch.mimic.mimicscroll.desc=Transforms all non-friendly creatures into mimics. Note that these mimics do not carry any items by themselves!
custom.ch.mimic.mimicscroll.ac_read=READ
custom.ch.mimic.mimicscroll.banished=Absolutely not. What are you trying to do?!
custom.ch.mimic.mimicdocs.name=Mimic Dungeon Manual
custom.ch.mimic.mimicdocs.desc=This file records most information about the Mimic Dungeon challenge.
custom.ch.mimic.mimicdocs.ac_read=READ
custom.ch.mimic.mimicdocs.base_button=Base Level: %d
custom.ch.mimic.mimicdocs.ability_button=Ability Level: %d
custom.ch.mimic.mimicdocs.general=Mimic attribute modifiers are divided into five types: base, resistance, offense, defense, and support.\n_Base_ affixes modify a mimic's base stats such as health and attack.\n_Resistance_ affixes provide proportional reduction against specific damage types.\n_Offense_ affixes focus on dealing damage and applying effects.\n_Defense_ affixes focus on reducing damage.\n_Support_ affixes interfere with opponents through special abilities.\n\nWhen a mimic spawns, it has several base affixes, one resistance affix, and several offense, defense, or support affixes.\n\nMimics come in four types: mixed, offensive, defensive, and support.\n\n_Mixed_ mimics have no specific generation bias.\n_Offensive_ mimics always have attack and offense affixes.\n_Defensive_ mimics always have health and defense affixes.\n_Support_ mimics always have movement speed and support affixes.\n\nThe affixes guaranteed in this way have relatively high levels, while mixed mimics have a randomly selected high-level affix.\n\nAffix levels are chosen randomly when generated. Level 0 has no effect and is not displayed. Generated affix levels gradually rise as mimic level increases.\n\nGolden mimics have miniboss properties.
custom.ch.mimic.mimicdocs.base=There are 6 base affixes, capped at level 7. They mainly modify a mimic's base stats.
custom.ch.mimic.mimicdocs.base_health=_Health_: health becomes %.2fx
custom.ch.mimic.mimicdocs.base_atk=_Attack_: base attack becomes %.2fx
custom.ch.mimic.mimicdocs.base_acc=_Accuracy_: accuracy becomes %.2fx
custom.ch.mimic.mimicdocs.base_eva=_Evasion_: evasion becomes %.2fx
custom.ch.mimic.mimicdocs.base_mov=_Move Speed_: movement speed becomes %.2fx
custom.ch.mimic.mimicdocs.base_ksp=_Attack Speed_: attack speed becomes %.2fx
custom.ch.mimic.mimicdocs.res=There are 3 resistance affixes, capped at level 3.
custom.ch.mimic.mimicdocs.res_melee=_Melee Resistance_: reduces damage from melee weapons by %.2f
custom.ch.mimic.mimicdocs.res_missile=_Ranged Resistance_: reduces damage from thrown weapons by %.2f
custom.ch.mimic.mimicdocs.res_magic=_Magic Resistance_: reduces damage from wands, environments, effects, and similar sources by %.2f
custom.ch.mimic.mimicdocs.atk=There are 8 offense affixes, capped at level 3.
custom.ch.mimic.mimicdocs.atk_berserk=_Berserker_: attack damage increases by %.2f * missing health ratio * missing health ratio
custom.ch.mimic.mimicdocs.atk_suppress=_Suppress_: attack damage increases by %.2f * remaining health ratio * remaining health ratio
custom.ch.mimic.mimicdocs.atk_defkill=_Armor-Stack Killer_: deals extra damage equal to %.2fx the target's defense
custom.ch.mimic.mimicdocs.atk_combo=_Combo_: each attack increases attack damage by %.2fx.
custom.ch.mimic.mimicdocs.atk_root=_Rooting Strike_: when attacking, has a %1$.2f chance to root the target for %2$.2f turns.
custom.ch.mimic.mimicdocs.atk_curse=_Cursing Strike_: when attacking, has a %1$.2f chance to inflict several debuffs on the target for %2$.2f turns.
custom.ch.mimic.mimicdocs.atk_freeze=_Freezing Strike_: when attacking, has a %1$.2f chance to frostbite the target for %2$.2f turns.
custom.ch.mimic.mimicdocs.atk_fire=_Blazing Strike_: when attacking, has a %1$.2f chance to ignite the target.
custom.ch.mimic.mimicdocs.def=There are 8 defense affixes, capped at level 3.
custom.ch.mimic.mimicdocs.def_copy=_Defense Copy_: gains %.2fx the opponent's defense.
custom.ch.mimic.mimicdocs.def_combores=_Battle-Hardened_: after taking non-environment and non-effect damage, increases damage resistance, reducing damage to as low as %.2fx.
custom.ch.mimic.mimicdocs.def_max=_Maximum Damage Cap_: reduces damage above max health * %.2f by 80%%.
custom.ch.mimic.mimicdocs.def_min=_Minimum Damage Cap_: damage no greater than max health * %.2f becomes 1.
custom.ch.mimic.mimicdocs.def_vampire=_Vampirism_: restores health equal to %.2f * attack damage on hit.
custom.ch.mimic.mimicdocs.def_pushback=_Repulsion_: when attacked, has a 50%% chance to knock the opponent back %.1f tiles. This damage is reduced.
custom.ch.mimic.mimicdocs.def_per=_Periodic Damage Immunity_: reduces every %.1fth instance of damage to 1.
custom.ch.mimic.mimicdocs.def_immune=_Debuff Immunity_: has a %.2f chance to prevent debuffs from being applied.
custom.ch.mimic.mimicdocs.trk=There are 8 support affixes, capped at level 3.
custom.ch.mimic.mimicdocs.trk_range=_Extended Reach_: can attack targets within %.1f tiles.
custom.ch.mimic.mimicdocs.trk_disappear=_Random Teleport_: when attacked, has a %.2f chance to randomly teleport elsewhere. This damage is reduced.
custom.ch.mimic.mimicdocs.trk_degrade=_Degrade Curse_: attacks have a 50%% chance to inflict degradation for %.2f turns.
custom.ch.mimic.mimicdocs.trk_alert=_High Alert_: when damaged, has a %.2f chance to attract enemies on this floor.
custom.ch.mimic.mimicdocs.trk_summon=_Enemy Summon_: when awakened, summons %.1f enemies.
custom.ch.mimic.mimicdocs.trk_scan=_Invisibility Detection_: after awakening, removes invisibility from characters within %.1f tiles when acting.
custom.ch.mimic.mimicdocs.trk_chargeeat=_Charge Devour_: when attacking, removes %.1f charge from all wands.
custom.ch.mimic.mimicdocs.trk_hitback=_Heavy Knockback_: when attacking, has a 50%% chance to knock the target back %.1f tiles.
custom.ch.mimic.mimicdocs.power_base=Mimic power rating depends entirely on affixes and levels. Each affix has a power factor. Multiply all affix power factors together and then multiply by 1.1 to get the power rating. The power factor greatly affects the quality of extra drops.\n\nBecause golden mimics are far stronger than the current floor, their power rating is multiplied by 1.9.\n\nAt the current affix level, each base affix provides a power factor of %.2f.
custom.ch.mimic.mimicdocs.power_ability=At the current affix level, each other affix provides a power factor of %.2f.
