custom.testmode.testboss.testgoo.name=Test Goo
custom.testmode.testboss.testgoo.desc=Little is known about Goo. It may not even be a creature, but a mass of vile sewer matter given basic intelligence by dark magic.\n\n_Test version:_ keeps Goo's combat behavior and slime splitting, but is intended for placement on any floor through the Mob Placer.
custom.testmode.testboss.testdm300.name=Test DM-300
custom.testmode.testboss.testdm300.desc=DM-300 is the largest and most powerful defense machine the dwarves ever built, armed with toxic exhaust vents, a heavy drill, and an energy-overload combat mode.\n\n_Test version:_ supercharge no longer depends on boss-floor pylons. When its HP reaches a threshold, it enters supercharge for several turns, then automatically loses the charge.
custom.testmode.testboss.testtengu.name=Test Tengu
custom.testmode.testboss.testtengu.desc=Tengu is a famous and enigmatic assassin who fights with traps, deceptive magic, and precise attacks.\n\n_Test version:_ the PrisonBossLevel phase controller is removed. Tengu can be placed on any floor, jumps near his current enemy, and creates visible normal Poison Dart Traps that any creature can trigger instead of hidden Tengu Dart Traps.
custom.testmode.testboss.testtengu.notice=So, the test begins.
custom.testmode.testboss.testtengu.phase=No prison can hold me here.
custom.testmode.testboss.testyogdzewa.name=Test Yog-Dzewa
custom.testmode.testboss.testyogdzewa.desc=Yog-Dzewa is an Old God whose eye serves as the focus of its power in this world, summoning demons and avatars to defend it.\n\n_Test version:_ fist and demon summons no longer use the level exit or Halls boss arena positions. They are created around Yog on valid cells of the current floor.
custom.testmode.testboss.testyogdzewa.notice=I. SEE. THIS. FLOOR.
custom.testmode.testboss.testyogdzewa.summon=The eye calls a servant into this place.
custom.testmode.testboss.testdwarfking.name=Test King of Dwarves
custom.testmode.testboss.testdwarfking.desc=The King of Dwarves rules over a legion of undead subjects and tries to overwhelm enemies with summoned minions.\n\n_Test version:_ throne and CityBossLevel summoning points are removed. The king's phases are simplified, and undead subjects are summoned around the king on valid cells of the current floor.
custom.testmode.testboss.testdwarfking.notice=How dare you intrude upon a portable throne!
custom.testmode.testboss.testdwarfking.summon=Subjects, attend your king!
custom.testmode.testboss.testdwarfking.shield=Royal ward
custom.testmode.testboss.testdwarfking.defeated=You've... broken the test formation...
custom.testmode.testboss.testwarriorboss.name=Test Warrior?
custom.testmode.testboss.testwarriorboss.desc=Warrior? has fallen under the Old God's influence and fights with berserker, gladiator, and heroic leap techniques.\n\n_Test version:_ keeps the original combat style and is provided as a Mob Placer boss entry for arbitrary-floor testing.
custom.testmode.testboss.testrogueboss.name=Test Rogue?
custom.testmode.testboss.testrogueboss.desc=Rogue? attacks from shadow, retreats when pressured, and turns his speed into deadly ambushes.\n\n_Test version:_ the PrisonNewBossLevel victory controller is removed. Invisibility, execution, momentum, and shadow support are simplified so the boss can function on any floor.
custom.testmode.testboss.testrogueboss.notice=Haha, another mark took the bait!
custom.testmode.testboss.testrogueboss.invisibility=Try to catch me!
custom.testmode.testboss.testrogueboss.execute=Take this blade!
custom.testmode.testboss.testrogueboss.enraged=enraged
custom.testmode.testboss.testrogueboss.momentum=Can you still keep up with me?
custom.testmode.testboss.testrogueboss.momentum-recovery=Oof, I'm exhausted...
custom.testmode.testboss.testhuntressboss.name=Test Huntress?
custom.testmode.testboss.testhuntressboss.desc=The Old God's corruption has sharpened the huntress's instincts into a merciless obsession.\n\n_Test version:_ the 15th-floor arena dependency and campaign rewards are removed. Hawks and tentacles appear on valid cells near her, and Fadeleaf teleports on the current arbitrary floor. This boss can be placed by the Mob Placer on any floor.
custom.testmode.testboss.testhuntressboss.gale_aim=The wind has already marked your path.
custom.testmode.testboss.testhuntressboss.warden=Then let this place take root!
custom.testmode.testboss.testhuntressboss.defeated=The hunt... ends here.
custom.testmode.testboss.testhuntressboss.boon_blindweed=Blindweed, hide me.
custom.testmode.testboss.testhuntressboss.boon_earthroot=Earthroot, harden my stance.
custom.testmode.testboss.testhuntressboss.boon_fadeleaf=Fadeleaf, scatter the hunt.
custom.testmode.testboss.testhuntressboss.boon_firebloom=Firebloom, kindle my arrows.
custom.testmode.testboss.testhuntressboss.boon_icecap=Icecap, chill my arrows.
custom.testmode.testboss.testhuntressboss.boon_mageroyal=Mageroyal, cleanse me.
custom.testmode.testboss.testhuntressboss.boon_sorrowmoss=Sorrowmoss, poison my arrows.
custom.testmode.testboss.testhuntressboss.boon_starflower=Starflower, guide my aim.
custom.testmode.testboss.testhuntressboss.boon_stormvine=Stormvine, lift my step.
custom.testmode.testboss.testhuntressboss.boon_sungrass=Sungrass, mend my wounds.
custom.testmode.testboss.testhuntressboss.boon_swiftthistle=Swiftthistle, quicken the chase.
custom.testmode.testboss.testgreatdemon.name=Test Great Demon
custom.testmode.testboss.testgreatdemon.desc=The great demon is an empowered imp with a powerful body, attack-reflecting defenses, and the ability to call lesser demons.\n\n_Test version:_ keeps the original combat style and is provided as a Mob Placer boss entry for arbitrary-floor testing.
custom.testmode.testboss.testgreatshoper.name=Test Shopkeeper
custom.testmode.testboss.testgreatshoper.desc=The shopkeeper has transformed himself through dwarven secrets, attacks by throwing wealth around, and recruits powerful remnants to protect his interests.\n\n_Test version:_ CityBossLevel throne, pedestal, and summoning-point dependencies are removed. Gold bosses and undead helpers are summoned near the shopkeeper on valid cells, and falling gold uses a test-safe version that will not strike the test shopkeeper itself.
custom.testmode.testboss.testgreatshoper.no_damage=Useless. With this magical shield, you can scarcely harm me.
custom.testmode.testboss.testgreatshoper.summon=Golden elemental, grandmaster monk, stop this intruder for me!
custom.testmode.testboss.testgreatshoper.summon1=Useless, both of you! Thymor, protect me.
custom.testmode.testboss.testgreatshoper.phase4=Even Thymor cannot stop you? Then be buried with these treasures!
