custom.testmode.generator.testalignment.null_name=No Alignment
custom.testmode.generator.testalignment.enemy_name=Normal Enemy
custom.testmode.generator.testalignment.enemy_desc=ENEMY. The standard hostile alignment. It treats the hero and ALLY-aligned creatures as enemies, and is the default alignment for most monsters.
custom.testmode.generator.testalignment.enemy1_name=Enemy Group 1
custom.testmode.generator.testalignment.enemy1_desc=ENEMY1. One of the special hostile alignments. It only actively attacks creatures aligned with ENEMY2, ENEMY3, or ENEMY4, and does not actively attack normal ENEMY, ALLY, NEUTRAL, or the hero.
custom.testmode.generator.testalignment.enemy2_name=Enemy Group 2
custom.testmode.generator.testalignment.enemy2_desc=ENEMY2. One of the special hostile alignments. It only actively attacks creatures aligned with ENEMY1, ENEMY3, or ENEMY4, and does not actively attack normal ENEMY, ALLY, NEUTRAL, or the hero.
custom.testmode.generator.testalignment.enemy3_name=Enemy Group 3
custom.testmode.generator.testalignment.enemy3_desc=ENEMY3. One of the special hostile alignments. It only actively attacks creatures aligned with ENEMY1, ENEMY2, or ENEMY4, and does not actively attack normal ENEMY, ALLY, NEUTRAL, or the hero.
custom.testmode.generator.testalignment.enemy4_name=Enemy Group 4
custom.testmode.generator.testalignment.enemy4_desc=ENEMY4. One of the special hostile alignments. It only actively attacks creatures aligned with ENEMY1, ENEMY2, or ENEMY3, and does not actively attack normal ENEMY, ALLY, NEUTRAL, or the hero.
custom.testmode.generator.testalignment.neutral_name=Neutral
custom.testmode.generator.testalignment.neutral_desc=NEUTRAL. A neutral alignment. It usually does not actively select enemies, and is often used for inactive mimics, NPCs, or mechanism-like creatures.
custom.testmode.generator.testalignment.ally_name=Ally
custom.testmode.generator.testalignment.ally_desc=ALLY. The hero-side ally alignment. It usually attacks normal ENEMY-aligned enemies, and is treated as an enemy by normal ENEMY creatures.
