ui.updatenotification.title=Обновление
ui.updatenotification$wndupdate.title=Доступно обновление!
ui.updatenotification$wndupdate.versioned_title=Доступно обновление: %s
ui.updatenotification$wndupdate.desc=Shattered Pixel Dungeon регулярно обновляется переработками существующего содержания игры, или добавлением совершенно нового контента!\n\nВ обновлениях также часто улучшается баланс игры с тем, чтобы определенные предметы/герои/враги не были слишком сильными или слишком слабыми.\n\nОбновления также содержат исправления ошибок и багов, а также другие различные улучшения.
ui.updatenotification$wndupdate.button=На страницу обновлений

ui.changelist.v0_3_x.v0_3_0fix1.button_2.text=_-_ Улучшены правила призыва призраков с помощью _Некрономикона_ и _Прахa_.
ui.changelist.v0_3_x.v0_3_0fix2.button_1.text=_-_ Добавлены следующие новшества, связанные с новым эффектом окружения _Проклятое пламя_ и новым эффектом _Проклятое горение_: новая _Проклятая огненная палочка_, украшение _Парные демонические глаза_, еда _Жареная душа_, ловушки _Проклятое пламя_ и _Сожжение души_. Для всего нового добавлены соответствующие записи в справочник.\n_-_ Добавлена новая фоновая музыка для поверхности нулевого этажа и заданий торговца на нулевом этаже.\n_-_ Добавлен новый облик для мага, дуэлянта и монаха.
ui.changelist.v0_3_x.v0_3_0fix2.button_2.text=_-_ Многие материалы, добавленные в начале версии 0.3.0, получили новую графику, а большинство текстов было дополнительно отредактировано.\n_-_ Сила большинства оружий 6-го уровня, появившихся в начале версии 0.3.0, была скорректирована: многие усилены или полностью переработаны.\n_-_ Некоторые предметы переименованы: _Призма превращения_ стала _Призмой преображения_, _Свиток извлечения_ — _Терминалом извлечения_, также переименованы многие коллекционные предметы из заданий торговца на нулевом этаже.\n_-_ Многие записи справочника обновлены под текущую версию. Записи о врагах Башни пока ещё не закончены.\n_-_ Улучшена арена боя с _Охотницей?_; теперь она не менее разнообразна, чем арена DM-300.\n_-_ Здоровье _Психического орла_ Охотницы? увеличено до 20, а первые две физические атаки по нему не наносят урона.\n_-_ В новом цикле перед входом в Башню можно взять не более 13 лечебных зелий. Некоторые эффекты снаряжения в Башне ослаблены (например, сокровищная добыча от колец богатства не может быть выше 3-го уровня).\n_-_ Боссы Башни теперь могут получить не более 3 единиц прямого урона за ход. В ближнем бою они также могут проводить дополнительные атаки по метке удара, наложенной особой способностью.\n_-_ Механики боя _Рыцаря смерти_, _Рыцаря чумы_, _Рыцаря голода_ и _Эльфа-джентльмена_ полностью переработаны: теперь их труднее победить, а бой с ними стал интерактивнее.\n_-_ Музыка на обычных этажах Башни теперь меняется в зависимости от врагов поблизости и состояния здоровья героя.\n_-_ Торговец в Башне больше не продаёт отравленные дротики.\n_-_ Изменён интерфейс тестовых инструментов, например _Расстановщика существ_ и _Расстановщика боссов_.\n_-_ При включении _Случайного режима_ теперь появляется запрос подтверждения; _Ежедневное испытание_ больше не зависит от этого режима.\n_-_ Изменены ингредиенты для _Вспомогательного ядра_. _Вливание магии_ больше нельзя применять к дротикам и связкам рун без зачарования.\n_-_ _Гладиатор_ ослаблен (да что, даже Shattered ослабляет Воина? Не спешите, дочитайте): множитель урона Удара и Размаха теперь не превышает 500%. Талант _Мастерство боя_ при использовании Бури больше не расходует соответствующее число комбо, но по-прежнему сбрасывает всё комбо. Это изменение не позволяет долго поддерживать чрезмерно высокое комбо и постоянно наносить взрывной урон... Воин ведь не...\n_-_ _Фанатик_ ослаблен: эффект кровавого дара ритуального кинжала изменён. Рассудок восстанавливается только тогда, когда физический урон, нанесённый самим фанатиком, уменьшает его здоровье. Одно восстановление от босса или мини-босса ограничено 5.
ui.changelist.v0_3_x.v0_3_0fix2.button_3.text=_-_ Исправлены ошибки некоторых особых атак _боссов Башни_ и определения границ боевых арен.\n_-_ Исправлены ошибки получения некоторых значков.\n_-_ Исправлены ошибки урона и приёмов некоторых видов оружия 6-го уровня.\n_-_ И множество других мелких исправлений.
