ui.updatenotification$wndupdate.desc=Shattered Pixel Dungeon is regularly updated with overhauls to existing game content, or entirely new content!\n\nGame balance is also frequently improved in game updates, so that specific items/heroes/enemies aren't too strong or too weak.\n\nUpdates also include fixes for bugs and other various stability improvements.
ui.updatenotification$wndupdate.button=Go To Update Page

ui.changelist.v0_2_x.v0_2_9fix3.button_1.title=Random Mode
ui.changelist.v0_2_x.v0_2_9fix3.button_1.text=_-_ Hero Select now includes a _Random Mode_ toggle. When enabled, each run randomizes the hero's class talent pool, subclass options, and armor abilities into a single mixed build.\n_-_ Seed Finder, rankings, and several identification/reward flows now understand Random Mode better, making seed checks and record review much smoother.
ui.changelist.v0_2_x.v0_2_9fix3.button_2.title=Content and UI
ui.changelist.v0_2_x.v0_2_9fix3.button_2.text=_-_ Rankings now record and display the key Random Mode choices for each run, including talents, subclass, and armor ability details.\n_-_ The journal and catalog were expanded further, and several windows, icons, and settings screens were polished; data settings also gained a quick way to copy the cloud UUID.
ui.changelist.v0_2_x.v0_2_9fix3.button_3.title=Balance and Fixes
ui.changelist.v0_2_x.v0_2_9fix3.button_3.text=_-_ Added a scaling _minor boss_ enemy and adjusted some room, enemy spawn, and reward behavior to make runs less predictable.\n_-_ Rebalanced and fixed a broad set of wand, ring, scroll, weapon, and talent interactions, including Random Mode subclass starter gear, identification flow, and several edge-case bugs.
ui.changelist.v0_2_x.v0_2_9fix2.button_1.title=New
ui.changelist.v0_2_x.v0_2_9fix2.button_1.text=_-_ Rubbings Tome is now placed in the magical holster by default.\n_-_ Added a new armor curse glyph: _Leaden_.\n_-_ Added Friar skin 1.\n_-_ Added more comprehensive talent statistics.\n_-_ Added an option to disable animations.
ui.changelist.v0_2_x.v0_2_9fix2.button_2.title=Changes
ui.changelist.v0_2_x.v0_2_9fix2.button_2.text=_-_ Scrolls of Metamorphosis and Transformation Crystals now sell for _0_ gold.\n_-_ Scrolls of Metamorphosis, Scrolls of Sublimation, and Transformation Crystals now convert into _0_ alchemical energy.\n_-_ Liquid Fire sprayguns can now ignite barricades and doors even when fired directly beside them.
ui.changelist.v0_2_x.v0_2_9fix2.button_3.title=Bug Fixes
ui.changelist.v0_2_x.v0_2_9fix2.button_3.text_1=_-_ Fixed non-Ninja heroes failing to wake sleeping enemies nearby.\n_-_ Fixed pre-subclass alchemy sprayguns only firing up to _5 tiles_ away.\n_-_ Fixed a bug where quitting after an ankh resurrection triggered by torment death could allow reloading into resurrection without consuming the ankh.\n_-_ Fixed incorrect attack range logic for alchemy sprayguns before and after subclassing.\n_-_ Fixed Adrenaline Surge not having its duration reduced by Bronze Watch.
ui.changelist.v0_2_x.v0_2_9fix2.button_3.text_2=_-_ Fixed Shadows failing to apply while Bronze Watch was owned.\n_-_ Fixed supercharged DM-300 not continuously tracking the hero's current position.

ui.changelist.v0_3_x.v0_3_0alpha.button_1.title=New Cycle and Endless Tower
ui.changelist.v0_3_x.v0_3_0alpha.button_1.text=_-_ Clearing a run can now open a _New Cycle_ and an endlessly ascending tower.\n_-_ The tower has its own floor themes, generation rules, shops, boss floors, and difficulty scaling.\n_-_ New Cycle adds independent scoring, rankings, and a Hall of Heroes; exploration depth and total score are no longer constrained by the old limits.
ui.changelist.v0_3_x.v0_3_0alpha.button_2.title=Tower Ecology and Bosses
ui.changelist.v0_3_x.v0_3_0alpha.button_2.text=_-_ Added a large group of tower-exclusive enemies, with traits and attributes matched to their behavior.\n_-_ Added tower boss encounters including the _Pestilence Knight_ and _Death Knight_, with dedicated mechanics, rewards, and battle music.
ui.changelist.v0_3_x.v0_3_0alpha.button_3.title=Huntress? Boss Battle
ui.changelist.v0_3_x.v0_3_0alpha.button_3.text=_-_ Added the _Huntress?_ return boss and its dedicated arena.\n_-_ The battle uses multiple phases, ranged hunting pressure, arena interactions, and special handling for allied creatures.
ui.changelist.v0_3_x.v0_3_0alpha.button_4.title=Tier-6 Weapons
ui.changelist.v0_3_x.v0_3_0alpha.button_4.text=_-_ Added a full set of _tier-6 melee and missile weapons_, each with distinct properties or weapon abilities.\n_-_ Tier-6 equipment is integrated into tower generation, transmutation, the journal, and test generators, with a small natural drop chance late in the normal dungeon.
ui.changelist.v0_3_x.v0_3_0alpha.button_5.title=New Items and Alchemy
ui.changelist.v0_3_x.v0_3_0alpha.button_5.text=_-_ Added the _Scroll of Extraction_, which recovers recorded upgrade-scroll investment from eligible equipment.\n_-_ Added the _Metamorphosis Prism_, allowing targeted replacement of eligible boss or subclass talents.\n_-_ Added treasure items with common, rare, epic, and legendary qualities, including restrained rarity coloring in the backpack.
ui.changelist.v0_3_x.v0_3_0alpha.button_6.title=Minigames and Surface Content
ui.changelist.v0_3_x.v0_3_0alpha.button_6.text=_-_ Added the _Dungeon Doctor_ quiz, treasure hunting, extraction raids, and other optional activities.\n_-_ Expanded surface areas, shops, and supporting encounters to provide more content outside the standard descent.
ui.changelist.v0_3_x.v0_3_0alpha.button_7.title=Journal and Test Tools
ui.changelist.v0_3_x.v0_3_0alpha.button_7.text=_-_ Integrated the custom reference library into the journal and expanded entries for tower content, tier-6 equipment, and other new systems.\n_-_ Added independent specialization testing and expanded equipment, missile, consumable, armor-skill, and catalog test support.
ui.changelist.v0_3_x.v0_3_0alpha.button_8.title=Damage and Ranged Combat
ui.changelist.v0_3_x.v0_3_0alpha.button_8.text=_-_ Combat calls now carry explicit damage tags, making physical, magical, armor-piercing, elemental, and other damage easier to identify and maintain.\n_-_ Ranged physical attacks, ranged spells, and drone attacks now share a unified ranged-attack protocol for common restrictions and interactions.\n_-_ Damage icons, resistance checks, and combat effects were aligned with the actual damage category wherever possible.
ui.changelist.v0_3_x.v0_3_0alpha.button_9.title=Rankings and New-Cycle Records
ui.changelist.v0_3_x.v0_3_0alpha.button_9.text=_-_ New-Cycle scoring now uses absolute exploration depth, removes category caps, and uses a wider numeric range for endless runs.\n_-_ Rankings and the Hall of Heroes now preserve more run-defining choices, including mixed-build subclass, armor ability, and talent records.
ui.changelist.v0_3_x.v0_3_0alpha.button_10.title=Combat Compatibility and Balance
ui.changelist.v0_3_x.v0_3_0alpha.button_10.text=_-_ Expanded cross-class compatibility for weapon abilities, subclass resources, armor abilities, artifacts, and their related triggers.\n_-_ Rebalanced many hero, enemy, boss, tower, weapon, trinket, and buff interactions, with clearer boundaries for special effects.
ui.changelist.v0_3_x.v0_3_0alpha.button_11.title=Tower Rules and Presentation
ui.changelist.v0_3_x.v0_3_0alpha.button_11.text=_-_ Tower floors now generate regular equipment and consumables while excluding permanent-stat consumables, and each floor grants a Scroll of Metamorphosis.\n_-_ Tower shops appear every five floors, scale their prices with height, and always stock a Scroll of Extraction.\n_-_ Added tower depth notation, music routing, boss-floor lockdown behavior, ally relocation, and height-based balance rules.
ui.changelist.v0_3_x.v0_3_0alpha.button_12.title=Resurrection and Save Stability
ui.changelist.v0_3_x.v0_3_0alpha.button_12.text=_-_ Fixed an exploit where force-closing during an unblessed ankh resurrection could restore an earlier state without paying the intended cost.\n_-_ Improved save restoration and floor-transition safety for buffs, inventories, rankings, and special boss transitions.
ui.changelist.v0_3_x.v0_3_0alpha.button_13.title=Missile Weapon Fixes
ui.changelist.v0_3_x.v0_3_0alpha.button_13.text=_-_ Closed several flow-based missile-weapon duplication cases and corrected stack-wide upgrade extraction behavior.\n_-_ Gungnir now consumes durability normally, and transmuting unsupported tier-6 equipment safely falls back to tier 5.\n_-_ Test generators now downgrade unavailable tier-6 missile categories instead of producing invalid previews.
ui.changelist.v0_3_x.v0_3_0alpha.button_14.title=Boss Battle Stability
ui.changelist.v0_3_x.v0_3_0alpha.button_14.text=_-_ Fixed Warrior? leap targeting, damage-before-knockback order, multi-target impact, and cases that left the hero permanently busy.\n_-_ Fixed animation-disabled stalls in several boss phases, including Dwarf King and Rogue? encounters.\n_-_ Corrected DM-300 tracking, challenge achievement checks, and several tower boss state transitions.
ui.changelist.v0_3_x.v0_3_0alpha.button_15.title=Mixed-Build Compatibility
ui.changelist.v0_3_x.v0_3_0alpha.button_15.text=_-_ Fixed cross-class Champion weapon-ability charging, descriptions, upgrade previews, cooldowns, and talent triggers.\n_-_ Fixed Devotee ritual-dagger progression and several subclass or armor-ability choices that depended on original class equipment.\n_-_ Mixed-build choices and their resulting abilities are now restored and recorded more consistently.
ui.changelist.v0_3_x.v0_3_0alpha.button_16.title=Artifacts and Buffs
ui.changelist.v0_3_x.v0_3_0alpha.button_16.text=_-_ Separated the Thorn Cloak's active thorn effect from artifact charging, preserving it across saves and preventing duplicate activations.\n_-_ Corrected Bronze Watch duration interactions and removed passive turn-based charging from the Time Beacon.\n_-_ Aligned Magic Feather's elemental resistance coverage with the Ring of Elements.
ui.changelist.v0_3_x.v0_3_0alpha.button_17.title=Crashes and Combat Feedback
ui.changelist.v0_3_x.v0_3_0alpha.button_17.text=_-_ Fixed multiple crashes caused by missing heroes, item sprites, ranking data, invalid test previews, and floor-transition state.\n_-_ Fixed several actor-thread stalls and invalid target references during delayed or area effects.\n_-_ Corrected mismatches between damage behavior, immunity checks, icons, and ability descriptions.
