ui.changelist.v0_2_x.v0_2_9fix3.button_1.title=Random Mode
ui.changelist.v0_2_x.v0_2_9fix3.button_1.text=_-_ Hero Select now includes a _Random Mode_ toggle. When enabled, each run randomizes the hero's class talent pool, subclass options, and armor abilities into a single mixed build.\n_-_ Seed Finder, rankings, and several identification/reward flows now understand Random Mode better, making seed checks and record review much smoother.
ui.changelist.v0_2_x.v0_2_9fix3.button_2.title=Content and UI
ui.changelist.v0_2_x.v0_2_9fix3.button_2.text=_-_ Rankings now record and display the key Random Mode choices for each run, including talents, subclass, and armor ability details.\n_-_ The journal and catalog were expanded further, and several windows, icons, and settings screens were polished; data settings also gained a quick way to copy the cloud UUID.
ui.changelist.v0_2_x.v0_2_9fix3.button_3.title=Balance and Fixes
ui.changelist.v0_2_x.v0_2_9fix3.button_3.text=_-_ Added a scaling _minor boss_ enemy and adjusted some room, enemy spawn, and reward behavior to make runs less predictable.\n_-_ Rebalanced and fixed a broad set of wand, ring, scroll, weapon, and talent interactions, including Random Mode subclass starter gear, identification flow, and several edge-case bugs.
ui.changelist.v0_2_x.v0_2_9fix2.button_1.title=New
ui.changelist.v0_2_x.v0_2_9fix2.button_1.text=_-_ Rubbings Tome is now placed in the magical holster by default.\n_-_ Added a new armor curse glyph: _Leaden_.\n_-_ Added Friar skin 1.\n_-_ Added more comprehensive talent statistics.\n_-_ Added an option to disable animations.
ui.changelist.v0_2_x.v0_2_9fix2.button_2.title=Changes
ui.changelist.v0_2_x.v0_2_9fix2.button_2.text=_-_ Scrolls of Metamorphosis and Transformation Crystals now sell for _0_ gold.\n_-_ Scrolls of Metamorphosis, Scrolls of Sublimation, and Transformation Crystals now convert into _0_ alchemical energy.\n_-_ Liquid Fire sprayguns can now ignite barricades and doors even when fired directly beside them.
ui.changelist.v0_2_x.v0_2_9fix2.button_3.title=Bug Fixes
ui.changelist.v0_2_x.v0_2_9fix2.button_3.text_1=_-_ Fixed non-Ninja heroes failing to wake sleeping enemies nearby.\n_-_ Fixed pre-subclass alchemy sprayguns only firing up to _5 tiles_ away.\n_-_ Fixed a bug where quitting after an ankh resurrection triggered by torment death could allow reloading into resurrection without consuming the ankh.\n_-_ Fixed incorrect attack range logic for alchemy sprayguns before and after subclassing.\n_-_ Fixed Adrenaline Surge not having its duration reduced by Bronze Watch.
ui.changelist.v0_2_x.v0_2_9fix2.button_3.text_2=_-_ Fixed Shadows failing to apply while Bronze Watch was owned.\n_-_ Fixed supercharged DM-300 not continuously tracking the hero's current position.

ui.changelist.v0_3_x.v0_3_0.button_1.title=New Content
ui.changelist.v0_3_x.v0_3_0.button_1.text=_-_ Added _New Cycle_, accessible from completed ranking records; select the record's _crown icon_ to reveal the entry action.\n_-_ Added the _floor 0 town_, where players can interact with NPCs, play minigames, or enter the tower for a new adventure.\n_-_ Added the _Tower_, an endless region with a random boss every five floors and many new enemies.\n_-_ Added new _tier-6 weapons_ and _artifacts_ for tower exploration.\n_-_ Added the _Scroll of Extraction_, available from the floor 0 shopkeeper and stocked every five tower floors to help players switch equipment builds.\n_-_ Added the _Metamorphosis Prism_, which transforms eligible boss and subclass talents.\n_-_ Added the floor 15 _Huntress?_ boss battle; defeating her grants one of her boss talents.\n_-_ Added the _Hall of Heroes_, where favorite game records can be saved for long-term viewing.
ui.changelist.v0_3_x.v0_3_0.button_2.title=New Talents
ui.changelist.v0_3_x.v0_3_0.button_2.text=_-_ Added _three Huntress boss talents_.\n_-_ Added new _subclass talents_ for Warrior, Rogue, Mage, and Duelist, obtainable through the _Metamorphosis Prism_.
ui.changelist.v0_3_x.v0_3_0.button_3.title=Changes
ui.changelist.v0_3_x.v0_3_0.button_3.text=_-_ Reworked _Phantom Shooter_ and _Thousandfold Throwing_ to better match their earliest designs.\n_-_ Significantly refactored _missile-weapon mechanics_ and _combat damage types_ at the code level.\n_-_ Significantly revised the _save system_.
ui.changelist.v0_3_x.v0_3_0.button_4.title=Visual Updates
ui.changelist.v0_3_x.v0_3_0.button_4.text=_-_ Improved many _test-tool interfaces_ and added _new skins_ and other visual content.
ui.changelist.v0_3_x.v0_3_0.button_5.title=Bug Fixes
ui.changelist.v0_3_x.v0_3_0.button_5.text=_-_ Fixed _more bugs than we can reasonably count_.
ui.changelist.v0_3_x.v0_3_0fix1.button_1.text=_-_ Added the _Necronomicon_, an artifact that can summon wraiths or bind enemies to your side. It can be crafted with corpse dust.
ui.changelist.v0_3_x.v0_3_0fix1.button_2.text=_-_ Improved wraith summoning with the _Necronomicon_ and _Corpse Dust_.
ui.changelist.v0_3_x.v0_3_0fix2.button_1.text=_-_ Added the _Wand of Cursed Flame_, which can be crafted through alchemy and spreads cursed fire among enemies.\n_-_ Added the _Twin Demon Eyes_ trinket, which alternates between cursed fire and laser attacks.\n_-_ Added _Soul-Roasted Meat_, the _Cursed Flame Trap_, and the _Soul Scorch Trap_.\n_-_ Added new background music for the _floor 0 town_.
ui.changelist.v0_3_x.v0_3_0fix2.button_2.text=_-_ In the _Tower_, you can carry at most _13 healing potions_, and some potion effects are weaker.\n_-_ _Tower bosses_ can take at most _three direct hits per turn_; their melee attacks can also deal extra blows through _Slash Marks_.\n_-_ Adjusted the fights against the _Death Knight_, _Pestilence Knight_, _Gentleman Elf_, and _Hunger Knight_.\n_-_ Music on regular Tower floors now changes with nearby enemies and the hero's health; _darts_ are no longer sold in Tower shops.\n_-_ Adjusted the damage, abilities, and handling of several _tier-6 weapons_.\n_-_ The _crystal key_ used to leave the _extraction raid_ has been replaced by an _access card_.\n_-_ Improved the selection screens of the _Mob Placer_, _Boss Placer_, and other test tools.\n_-_ Enabling _Random Mode_ now asks for confirmation; _Daily Run_ ignores this setting.
ui.changelist.v0_3_x.v0_3_0fix2.button_3.text=_-_ Fixed some _Tower bosses'_ special attacks and battle-area rules.\n_-_ Fixed the _Death Knight's_ slash effect and visual issues with several Tower creatures.\n_-_ Fixed text and buttons overlapping in the _Random Mode_ confirmation window on small screens.\n_-_ Fixed some _cursed flame_ effects, _Precognitive Eye_ messages, and badge award notifications.\n_-_ Fixed damage and ability issues with several _tier-6 weapons_.
