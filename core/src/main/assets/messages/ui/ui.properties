ui.changelist.v0_1_x.v0_1_6.button_1.text=Added _10_ positive talents.\n_-_ _Tier 1:_ Butcher of Zhuo County, Acidic Stomach, Savor Every Bite, Unstoppable\n_-_ _Tier 2:_ Arrow Piercing Stone\n_-_ _Tier 3:_ Painful Purification, Triumphant Return, Weapon Crafting, Private Stash, Earth's Feast\n
ui.changelist.v0_1_x.v0_1_2.button_2.text=The talent _Slime Infusion_ now grants 10 points of deferred damage.\n
ui.changelist.v0_1_x.v0_1_2.button_4.text=Update date: January 16, 2025\n
ui.changelist.v0_1_x.v0_1_3.button_2.text=The cooldown of Tengu's talent _Smoke Bomb_ has been reduced from 50 turns to 20.\n
ui.changelist.v0_1_x.v0_1_3.button_3.text=Fixed various display and text errors, as well as crashes.\n
ui.changelist.v0_1_x.v0_1_3.button_4.text=Update date: January 18, 2025\n
ui.changelist.v0_1_x.v0_1_4.button_4.text=Update date: January 20, 2025\n
ui.changelist.v0_1_x.v0_1_5.button_3.text=Fixed various sprite errors.\n
ui.changelist.v0_1_x.v0_1_6.button_3.text=Update date: January 23, 2025\n
ui.changelist.v0_1_x.v0_1_7.button_2.text=Update date: January 23, 2025\n_-_ Ascension Scroll descriptions now explain Boss talent tiers and talent-point allocation, along with other changes.\n
ui.changelist.v0_1_x.v0_1_4.button_2.text=Added _1_ challenge.\n_-_ _Talent Weakening:_ Talent +1 has no effect; +2 and +3 only grant +1; +4 only grants +2.\n
ui.changelist.v0_2_x.v0_2_6.button_3.text=Added _2_ items in _fix4_.\n_-_ _Transmutation Crystal:_ lets the user target a common talent for transmutation; can be made with Transmutation Scrolls.\n_-_ _Transmutation Pillar:_ can transmute the selected talent indefinitely without being consumed; a test item usable only in Test Mode.\n
ui.changelist.v0_2_x.v0_2_3.button_5.text=Weakened the spell talent _Shepherd's Code_: the +1 flock area is smaller and +2 energy cost rises from 2 to 3.\n_-_ Strengthened _Indulgence_: gold cost reduced from 500/300 to 200/150.\n_-_ Strengthened the Tier 1 _Walking Stick_: starting damage increased from 1–6 to 1–7.\n
ui.changelist.v0_2_x.v0_2_9.button_1.text=This version's limited negative talent set is _Set 1_.\n_-_ Added _5_ positive talents.\n_-_ _Tier 1:_ Crystal Powder, Bastion Shield\n_-_ _Tier 2:_ Aberration Bane, Bullseye\n_-_ _Tier 3:_ Midas Touch\n
ui.changelist.v0_2_x.v0_2_1.button_5.text=Strengthened the talents _Elixir of Might_, _Painful Purification_, _Will to Survive_, _Engineer_, _Riposte_, _Feast and Fight_, and _Abacus_.\n_-_ Also includes miscellaneous bug fixes and challenge-screen adjustments.\n
ui.changelist.v0_1_x.v0_1_8.button_3.text=Fixed various sprite errors.\n
ui.changelist.v0_1_x.v0_1_5.button_1.text=Added _2_ challenges.\n_-_ _Red Envelope Operation:_ normal enemy drops become red envelopes, which always contain New Year money and rarely a special surprise.\n_-_ _Maximum Wheat:_ each talent slot can only be transmuted once.\n
ui.changelist.v0_1_x.v0_1_6.button_2.text=Fixed Phantom Archer consuming thrown items, and adjusted _Master Planner_ and the challenge section size on the rankings screen.\n
ui.changelist.v0_1_x.v0_1_8.button_4.text=Update date: January 24, 2025\n_-_ Added one Transmutation Scroll option.\n_-_ Optimized opening New Year red envelopes in one click.\n_-_ Adjusted several talent strengths.\n
