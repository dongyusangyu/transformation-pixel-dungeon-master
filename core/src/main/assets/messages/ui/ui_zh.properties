ui.changelist.v0_1_x.v0_1_8.button_1.title=天赋更新
ui.changelist.v0_1_x.v0_1_8.button_1.text=_-_ 新增共计_20_个正面天赋。\n_-_ _1层：_带刺玫瑰，饭里藏金，水鬼索命，灰烬账簿，照明之秘\n_-_ _2层：_好吃到飞，道友且慢，五雷正法，马猴烧酒\n_-_ _3层：_脚底抹油，纵火狂，天有撅人之好，英雄之名，天地之力，以水代食，天使姿态，故乡的云，极度深寒，知识渊博，不要视奸\n
ui.changelist.v0_1_x.v0_1_8.button_2.title=美少女“战士”！
ui.changelist.v0_1_x.v0_1_8.button_2.text=_-_ 天赋马猴烧酒新增变身贴图，由_DM-216_绘制。\n
ui.changelist.v0_1_x.v0_1_8.button_3.title=Bug修复
ui.changelist.v0_1_x.v0_1_8.button_3.text=_-_ 修复各类贴图错误。\n
ui.changelist.v0_1_x.v0_1_8.button_4.title=改动
ui.changelist.v0_1_x.v0_1_8.button_4.text=_-_ 更新日期：2025年1月24日\n_-_ _蜕变卷轴_选项+1。\n_-_ _新春红包_一键打开代码优化。\n_-_ 部分天赋强度调整。\n
ui.changelist.v0_1_x.v0_1_9.button_1.title=天赋更新
ui.changelist.v0_1_x.v0_1_9.button_1.text=_-_ 新增共计_20_个正面天赋。\n_-_ _1层：_破损核心，麻醉酊剂，吃出经验\n_-_ _2层：_深渊凝视，自然之行\n_-_ _3层：_痴愚，爱情背刺，概念格挡，算盘，时之沙，开卷有益，强化斗篷，万灵药水，活动肌肉，四海乘风，回味无穷，生日礼物，收集种子，脑袋尖尖，强化袖章\n\n
ui.changelist.v0_1_x.v0_1_9.button_2.title=平衡调整\n
ui.changelist.v0_1_x.v0_1_9.button_2.text=_-_ 天赋巨物杀手增伤提高，并更名为_巨人杀手_。\n_-_ DM-300天赋_毒气喷射_加强，在两格距离内不会释放气体并可以在一般位置上释放气体。\n
ui.changelist.v0_1_x.v0_1_9.button_3.title=Bug修复
ui.changelist.v0_1_x.v0_1_9.button_3.text=_-_ 修复各类贴图错误。\n
ui.changelist.v0_1_x.v0_1_9.button_4.title=改动
ui.changelist.v0_1_x.v0_1_9.button_4.text=_-_ 更新日期：2025年1月26日\n_-_ 预加载_v0.2_的更新。\n
ui.changelist.v0_2_x.v0_2_9.button_1.title=天赋更新
ui.changelist.v0_2_x.v0_2_9.button_1.text=_-_ 本版本限定负面天赋组为：_限定1_。\n_-_ 新增共计_5_个正面天赋。\n_-_ _1层：_晶体火药，防壁巨盾\n_-_ _2层：_异魔克星，正中靶心\n_-_ _3层：_点金之手\n
ui.changelist.v0_2_x.v0_2_9.button_2.title=修士
ui.changelist.v0_2_x.v0_2_9.button_2.text=_-_ 修士初始携带一把独特的炼金喷枪，可以装配药剂进行喷射。修士还拥有理智机制，可以转化为炼金能量、获得额外效果。击败Yog-Dzewa即可解锁修士及成就。\n_-_ _两个转职：_炼金师和虔信者。\n_-_ _三个护甲技能：_理智针剂、浓缩药剂和圣光祷告。\n
ui.changelist.v0_2_x.v0_2_9.button_3.title=内容更新
ui.changelist.v0_2_x.v0_2_9.button_3.text=_-_ 新增1个饰物：_嵌合矛盾_。\n_-_ 在游戏内右上角菜单新增_资料_按钮，可直接查看测试时间的神秘指南。\n_-_ 全面革新查种器，查询效率较原版显著提升，并提供更多查询设置选择。\n_-_ 初步补全蜕变新增内容的英文文本。\n_-_ 新增战士新皮肤：皮肤4，女猎手新皮肤：皮肤3，均由_可则_绘制。\n_-_ 革新并统一治疗效果的逻辑。\n
ui.changelist.v0_2_x.v0_2_9.button_4.title=测试时间更新
ui.changelist.v0_2_x.v0_2_9.button_4.text=_-_ 测试时间新增_自定义法杖_，可以自由调试法杖施法效果用于测试。\n_-_ 测试时间新增_阵营调试器_，可以修改指定生物的阵营。\n_-_ 追加四种新的特殊阵营：_Enemy1_、_Enemy2_、_Enemy3_、_Enemy4_，并为其追加红、黄、蓝、绿四种贴图区分效果。\n_-_ 追加多名测试Boss，方便在任意楼层进行数值与机制测试。\n_-_ 投掷武器生成器现在像近战武器生成器一样支持附魔、诅咒和阶数生成。\n
ui.changelist.v0_2_x.v0_2_9.button_5.title=改动
ui.changelist.v0_2_x.v0_2_9.button_5.text=_-_ 更新日期：2026年6月8日\n_-_ 千面手成就的判定条件由击败_粘咕_调整为击败_第一个Boss_。\n_-_ 大部分可以游荡的盟友已参考镜像的AI调整了游荡逻辑，减少原地来回移动的问题。\n_-_ 天赋_幻影迷步_+1/+2在极速效果达到6/10回合时，不再继续给予极速。\n_-_ 阅读升华秘卷选择天赋后，现在会播放英雄阅读卷轴动画与read音效，并可触发各类读卷天赋。\n_-_ 盗贼新增角色特性：能从更远距离探测秘密与陷阱，并直接获悉楼层出口位置。\n_-_ 符石串附魔现在可以触发三层天赋_强力符文_的效果。\n_-_ 调整手里剑箱贴图的透明描边。\n_-_ 部分游戏内文本描述调整。\n
ui.changelist.v0_2_x.v0_2_9.button_6.title=Bug修复
ui.changelist.v0_2_x.v0_2_9.button_6.text_1=_-_ 修复天赋_食人心智_单次施法触发时会回复两次饱食度的问题。\n_-_ 修复天赋_魔能感知+2_在满足直接鉴定条件时，使用饰物遗忘碎片仍提示未满足鉴定条件的问题。\n_-_ 修复天赋_深渊凝视_穿透修正异常结算、伤害加成完全不生效的问题。\n_-_ 修复PC端非全屏时，按键可交互位置与准心位置不符的问题。\n_-_ 修复_重力混乱_没有正常显示buff文本的问题。\n_-_ 修复通过_更多戒指_、诅咒戒指、背包装满和生命之泉组合可能触发报错的问题。\n_-_ 修复阅读蜕变卷轴无法触发各类读卷天赋的问题。\n
ui.changelist.v0_2_x.v0_2_9.button_6.text_2=_-_ 修复2层天赋_强力投掷_可以对英雄自身造成伤害的问题。\n_-_ 修复Boss天赋_定向塌方_在法杖无充能时尝试使用法杖也会计入施法次数的问题。\n_-_ 修复2层天赋_万毒入体_实际概率只有描述数值一半的问题。\n_-_ 修复带有戒指强化或珠宝余能效果时读档可能报错的问题。\n_-_ 修复蜕变卷轴无法参与_无序结晶_制作的问题。\n_-_ 修复敌法刻印减伤在动能吸收限伤后生效的问题。\n_-_ 修复使用可直接伤害国王的圣典法术击败国王仍能获得徽章_掣君无刃_的问题。\n_-_ 修复_破旧的短剑_可以对飞镖和符石串进行重铸升级的问题。\n_-_ 修复_粘液球_给予黏糊糊效果后，退出重进读档可能报错的问题。\n_-_ 修复_元素之戒_会覆盖其他来源的元素抗性效果的问题。\n_-_ 修复1层天赋_破损核心_和_符文利刃_容易导致5层Boss死亡后楼层仍锁定的问题。\n
ui.changelist.v0_2_x.v0_2_0.button_1.title=绅士
ui.changelist.v0_2_x.v0_2_0.button_1.text=_-_ 绅士缺乏战斗能力，没有专精和护甲技能，不过好在其有无限的潜力激发，能够从冒险新手蜕变成一方强者。\n_-_ 该职业拥有一个特别宝箱，可以随机开出职业道具，3层天赋有4个可蜕变天赋槽。\n_-_ 使用一张蜕变卷轴即可解锁绅士及成就。\n
ui.changelist.v0_2_x.v0_2_0.button_2.title=平衡性调整
ui.changelist.v0_2_x.v0_2_0.button_2.text=_-_ 天赋_活动肌肉_加强，持续时间从100回合提高至300回合。\n_-_ 改动_破冰行动_、_破损核心_等天赋的伤害类型。\n_-_ 天赋_借痛排毒_削弱，获得全面净化效果的概率降低。\n_-_ 矮人国王天赋_王之加护_不再有额外的免伤效果。\n
ui.changelist.v0_2_x.v0_2_0.button_3.title=改动
ui.changelist.v0_2_x.v0_2_0.button_3.text=_-_ 更新日期：2025年1月28日\n_-_ 击败古神后_小恶魔_会在25层祝玩家新年快乐。\n_-_ 新增_批量升级_按钮，需要鉴定升级道具才能使用，一次能够使用10张升级卷轴。\n_-_ _升华秘卷_现在可被收纳进卷轴筒，物品图鉴增加升华秘卷、红包以及特别宝箱。\n
ui.changelist.v0_2_x.v0_2_1.button_1.title=天赋更新
ui.changelist.v0_2_x.v0_2_1.button_1.text=_-_ 新增共计_1_个正面天赋。\n_-_ _2层：_强化魔典\n_-_ 以上新增内容均由_Secher-Nbiw_开发完成。\n
ui.changelist.v0_2_x.v0_2_1.button_2.title=黄金元宝
ui.changelist.v0_2_x.v0_2_1.button_2.text=_-_ 新增饰物：黄金元宝，通过消耗金钱获得额外的伤害倍率。\n_-_ 本饰物由_Secher-Nbiw_制作。\n
ui.changelist.v0_2_x.v0_2_1.button_3.title=新增返程Boss战：大恶魔
ui.changelist.v0_2_x.v0_2_1.button_3.text=_-_ _开启条件：_携带护符与25层小恶魔对话触发。\n_-_ 本场Boss战是一个可选择的挑战，并非玩家通关阻碍，故数值极高，要谨慎对待。如果玩家搞清楚该场Boss战机制，会变得相当简单。\n_-_ 本场Boss战会给玩家Boss得分增加10000分，击败Boss可以获得新徽章，在游戏背景故事新增一则返程见闻。\n_-_ 本场Boss战敌人贴图均由_可则_和_幻影の人食い雑魚_绘制。\n
ui.changelist.v0_2_x.v0_2_1.button_4.title=挑战更新
ui.changelist.v0_2_x.v0_2_1.button_4.text=_-_ 新增_1_个挑战。\n_-_ _负面天赋：_玩家到达2，6，11，21层会强制从2个负面天赋中二选一，目前新增17个负面天赋可供玩家游玩。\n_-_ _负面：_永恒诅咒，饭桶，命运抉择，无尽恶意，有气无力，营养不良，目光短浅，蝙蝠血清，近视眼，陆游(未实装)，九龙拉馆，奸商，致敬牢大，好吃到爆，脑袋着地，喝水塞牙，生命在于运动，圣杯弱化\n
ui.changelist.v0_2_x.v0_2_1.button_5.title=平衡性调整
ui.changelist.v0_2_x.v0_2_1.button_5.text=_-_ 天赋_万灵药水_、_借痛排毒_、_求生意志_、_工程技师_、_反戈一击_、_盛食厉兵_和_算盘_加强。\n_-_ 此外还有各类杂项Bug修复以及挑战界面调整。\n
ui.changelist.v0_2_x.v0_2_1.button_6.title=改动
ui.changelist.v0_2_x.v0_2_1.button_6.text=_-_ 更新日期：2025年2月1日\n
ui.changelist.v0_2_x.v0_2_2.button_1.title=天赋更新
ui.changelist.v0_2_x.v0_2_2.button_1.text=_-_ 新增共计_23_个正面天赋，_10_个法术天赋，_21_个负面天赋。\n_-_ _1层：_书中黄金，白幽馈赠，人身攻击，蜂蜜鱼缸，金币巧克力\n_-_ _2层：_探险直觉，釜底抽薪，万毒入体，种子回收，享乐主义，引火上身，量子骇入，击落卫星，顷刻炼化\n_-_ _3层：_极限施法，精准射击，宝藏嗅觉，超越极限，健康食物，极限反应，空蝉幻舞，圣光信仰，常启书室\n_-_ _1层法术：_牧羊原旨，银光锐语，升天咒\n_-_ _2层法术：_神明庇佑，圣法皈依，赎罪券，创世纪\n_-_ _3层法术：_净化邪恶，神力领域风暴，复活术\n_-_ _负面：_心智崩塌，无可回避，寄生，泥头车，糊人总冠军，畏光，失控魔法，冬泳怪鸽，干柴烈火，见异思迁，饥饿难耐，会员制餐厅，长启速逝，饭前洗手，荆棘丛生，热情满满，战意盈然，相位利爪，深层恐惧，门都没有，上升气流\n_-_ 于fix1完全实装负面天赋_陆游_及其衍生敌人_巨型陆地食人鱼_\n
ui.changelist.v0_2_x.v0_2_2.button_2.title=绅士完善
ui.changelist.v0_2_x.v0_2_2.button_2.text=_-_ 于_fix1_将初始武器变更为_手杖_，初始伤害1~6点，攻击概率叠加护盾。\n_-_ 于_fix2_将_手杖_加入图鉴，并由_DM-216_对小人进行重绘。\n_-_ 于_fix3_将返程结算立绘重绘，同时还将特别宝箱改为_公文包_并能够自选职业道具，均由_DM-216_进行绘制。\n_-_ 于_fix6_新增遗物破损皮包，能够开出一些金币。\n_-_ 于_fix7_为公文包增加了神圣法典选项。\n
ui.changelist.v0_2_x.v0_2_2.button_3.title=内容同步
ui.changelist.v0_2_x.v0_2_2.button_3.text=_-_ 于_fix7_进行_破碎v3.0_的内容同步(感谢_委员会全员_以及_墨意-天志_为内容同步更新进行的大量测试)。\n_-_ _牧师实装：_牧师实装并对牧师初始天赋进行调整。牧师天赋除启蒙圣餐外，其余天赋被其他英雄蜕变出来均无效果变更，同时启蒙圣餐被其他英雄蜕变出来的效果也进行了改动，而卷藏咒言新增无法复制蜕变卷轴和升华秘卷的改动。\n_-_ _杂项内容：_决斗家的镶钉手套、双钗、魔岩拳套和十字弩的武技加强；对饰物苔藓丛簇、拟箱利齿、十三叶草、混沌香炉、遗忘碎片和陷阱元件的效果改动；狙击手天赋联动升级的效果改动；游戏存档界面的ui改动；暗影斗篷和神圣法典无法嬗变的改动；对疯狂强盗的描述补充。\n_-_ 于_fix8_同步_破碎v3.0_对财富戒指的改动(装卸戒指会继承保底次数而非直接重置)。\n_-_ 于_fix9_同步_破碎v3.0.1_苔藓丛簇和神圣武器、神圣护甲的效果。\n
ui.changelist.v0_2_x.v0_2_2.button_4.title=内容更新
ui.changelist.v0_2_x.v0_2_2.button_4.text=_-_ 完全实装饰物_黄金元宝_。\n_-_ 于_fix1_加入了幽妹的特殊对话内容，当玩家变身美少女“战士”后在每次下楼时概率触发(不与幽妹原对话内容同时触发)。\n_-_ 于_fix2_实装沉重诅咒，使武器力量需求+2。\n_-_ 于_fix5_通关排行榜的挑战页面加入一个奇妙的入口，随后于_fix6_移除。\n_-_ 于_fix7_实装_横扫附魔_，攻击一个目标时有几率对使用者周围所有目标造成一定打击(决斗家护甲技能元素打击效果未定)，由_Secher-Nbiw_制作。\n_-_ 同时还实装了_圣典拓本_，使其他英雄也能像牧师一样释放法术，不过由于其不稳定性，充能无法以任何形式回复，同时有些需要选取目标释放的法术在不选取目标尝试取消释放后依旧会消耗充能，需谨慎使用。拓本可通过炼金获取(具体可查看炼金图鉴-强化武器部分，材料中的奥术刻笔仅为需要放入，不会消耗)。\n_-_ 于_fix9_补充_横扫附魔_的元素打击效果。\n
ui.changelist.v0_2_x.v0_2_2.button_5.title=视觉更新
ui.changelist.v0_2_x.v0_2_2.button_5.text=_-_ _DM-300_贴图改动，由_Lefted_绘制。\n_-_ 于_fix3_进行主界面标题重绘，由_DM-216_绘制。\n_-_ 在_fix3~7_更新期间为大量天赋进行了描述补充、注释补充以及高亮内容调整。\n_-_ 于_fix7_重绘了绅士小人、绅士的英雄护甲、升华秘卷、符石、大恶魔徽章、天狗天赋等内容，同时还重绘了所有UI界面，顺便将DM-300天赋辟谷之术更名为_电子养胃_。\n_-_ 于_fix9_更新饱食度UI，类似MC的饱食度设计。\n
ui.changelist.v0_2_x.v0_2_2.button_6.title=平衡性调整
ui.changelist.v0_2_x.v0_2_2.button_6.text=_-_ 于_fix2_削弱天赋_正义惩戒_给予的祝福效果。\n_-_ 于_fix3_加强_奸奇信徒_，使其远程攻击能够消除全面净化效果。\n_-_ 同时加强负面天赋_陆游_，现在还能够生成幻影陆地食人鱼，贴图由_可则_和_DM-216_绘制。\n_-_ 于_fix4_将天赋_茉莉花茶_和_军用水袋_从2层天赋池移动至1层天赋池。\n_-_ 天赋_摸鱼时间+2_效果新增：鱼房额外生成1条巨型食人鱼。\n_-_ 加强天赋_马猴烧酒_，现在可以通过阅读神器魔典触发。\n_-_ 加强天赋_天地之力_，每级增伤从12%上调至15%，地缚根护甲能够触发(守望者踩地缚根给的树肤不触发)。\n_-_ 削弱天赋_涿郡屠户_，增加掉落的等级限制。\n_-_ 削弱天赋_享乐主义_，伤害由3/6下调至2/4。\n_-_ 于2月16日——_DM-216_的生日加强负面天赋_无尽恶意_，+0时的生效概率上调至40%，扣除的生命值由“当前生命值的10%”变成“最大生命值的10%”。\n_-_ 于_fix6_将法师魔杖的初始伤害由1~6上调至1~7。\n
ui.changelist.v0_2_x.v0_2_2.button_7.title=改动
ui.changelist.v0_2_x.v0_2_2.button_7.text=_-_  更新日期：2025年2月2日-4月12日\n_-_ 于_fix3_对批量升级功能进行改动：对投掷武器进行批量升级只能起到一张升级的效果。\n_-_ 于_fix5_限制存档数量。\n_-_ 于_fix8_将圣典拓本转化的能量从8提升至3*剩余充能数。\n_-_  于_fix10_新增资源类天赋的物品获得上限，通过升级及蜕变获得资源的效果至多触发16次(绅士为29次)。\n
ui.changelist.v0_2_x.v0_2_2.button_8.title=Bug修复
ui.changelist.v0_2_x.v0_2_2.button_8.text=_-_ 于_fix2_修复负面天赋_畏光_常态生效的问题，同时还修复了人物选择界面绅士介绍图标的显示问题。\n_-_ 于_fix3_修复大恶魔Buff图标显示异常的问题。\n_-_ 于_fix4_修复绅士介绍和开始界面的显示问题，同时还修复了部分天赋的描述问题。\n_-_ 于_fix5_修复负面天赋_泥头车_只对巨型精英生效的问题，同时将天赋_细嚼慢咽_的饱腹效果维持在450/150回合(后者为启用挑战缩餐节食的情况)。\n_-_ 于_fix8_修复_绅士_三层天赋生效异常问题，同时修复饰物凝血试管和负面天赋寄生的文本显示问题。\n
ui.changelist.v0_2_x.v0_2_3.button_1.title=天赋更新
ui.changelist.v0_2_x.v0_2_3.button_1.text=_-_ 新增共计_7_个正面天赋，_4_个负面天赋。\n_-_ _1层：_含沙射影，自动拾取\n_-_ _2层：_诅咒护体，势能转换，涅槃\n_-_ _3层：_灰烬之弓，速行藓神教\n_-_ _负面：_蚀骨之火，跳脸硅胶，草木皆兵，灾厄诅咒\n
ui.changelist.v0_2_x.v0_2_3.button_2.title=新增返程Boss战：店主
ui.changelist.v0_2_x.v0_2_3.button_2.text=_-_ _开启条件：_携带护符与20层店主对话触发。\n_-_ 本场Boss战同样会给玩家Boss得分增加10000分，击败Boss可以获得新徽章，在游戏背景故事新增一则返程见闻。\n_-_ 本场Boss战敌人贴图由_可则_、_幻影の人食い雑魚_、_DM-216_和_放縦鵺_绘制。\n
ui.changelist.v0_2_x.v0_2_3.button_3.title=挑战更新
ui.changelist.v0_2_x.v0_2_3.button_3.text=_-_ 新增_2_个挑战。\n_-_ _恶劣环境：_使破碎原有挑战提升至等级2，未勾选任何其他挑战则随机启用一项挑战。\n_-_ _极端环境：_使破碎原有挑战提升至等级3，自动启用恶劣环境挑战。\n_-_ 仅为信念护体、恐药异症、集群智能、没入黑暗、禁忌咒文和荒芜之地添加新的挑战效果。\n
ui.changelist.v0_2_x.v0_2_3.button_4.title=内容同步
ui.changelist.v0_2_x.v0_2_3.button_4.text=_-_ 对_破碎v3.1_的内容进行同步：楼层改动，木桶及后续障碍物可用镐子或炸弹清除，且炸弹只能清除3x3范围障碍；牧师增强与削弱；新成就；探索分计算方式；新敌人(豺狼流寇和寄居蟹)和新饰物(雪貂绒束)；战士天赋丰盛一餐、受衅怒火和液蕴意志改动，关于纹章部分只修改贴图，不改变其机制及相关天赋。\n
ui.changelist.v0_2_x.v0_2_3.button_5.title=平衡性调整
ui.changelist.v0_2_x.v0_2_3.button_5.text=_-_ 削弱法术天赋_牧羊原旨_，+1释放的羊群范围缩小，+2能耗从2点上调至3点。\n_-_ 加强法术天赋_赎罪券_，金币消耗从500/300下调至200/150。\n_-_ 加强1阶武器_手杖_，初始伤害从1~6上调至1~7。\n
ui.changelist.v0_2_x.v0_2_3.button_6.title=改动
ui.changelist.v0_2_x.v0_2_3.button_6.text=_-_ 更新日期：2025年7月23日\n_-_ 移除了_升华秘卷_的警告界面并调整其逻辑。\n
ui.changelist.v0_2_x.v0_2_4.button_1.title=天赋更新
ui.changelist.v0_2_x.v0_2_4.button_1.text=_-_ 可蜕变的正面天赋划分为_物攻_，_法伤_，_特效_，_资源_，_法术_，_辅助_，_其他_共7类，在使用蜕变卷轴蜕变天赋时可选择类型，该类型天赋将以3倍概率出现在选项中。具体天赋分类请到对应天赋详情页查看。\n_-_ 负面天赋划分为_12个通用_负面天赋，和_4组每组8个版本限定_负面天赋，每次大版本更新时改变限定天赋组。具体负面天赋划分到天赋详情页查看。\n_-_ 本版本限定负面天赋组为：_限定1_。\n_-_ 新增共计_5_个正面天赋，_5_个法术天赋，_1_个负面天赋。\n_-_ _1层：_灵光闪现，预知秘卷爱好者\n_-_ _2层：_火球术，女巫媚药\n_-_ _3层：_溃决之手\n_-_ _1层法术：_奸奇咒法，聚焦光线\n_-_ _2层法术：_神行术，荆棘之鞭\n_-_ _3层法术：_转愈圣术\n_-_ _负面：_手滑点错\n
ui.changelist.v0_2_x.v0_2_4.button_2.title=视觉更新
ui.changelist.v0_2_x.v0_2_4.button_2.text=_-_ 标题界面、Boss击杀、失败等同步_破碎v3.0_的美术风格，由_DM-216_绘制。\n
ui.changelist.v0_2_x.v0_2_4.button_3.title=内容改动
ui.changelist.v0_2_x.v0_2_4.button_3.text=_-_ 更新日期：2025年7月30日-7月31日\n_-_ 为_精英强敌_和_绝命头目_挑战新增等级2和等级3的内容。\n_-_ 同步了破碎对于_臃肿诅咒_和_狱火刻印_的改动。\n_-_ 于_fix1_使得力量药剂不再因为坠入深渊而碎裂，同时使得被变成魔法绵羊的宝箱怪能够掉落物品。
ui.changelist.v0_2_x.v0_2_4.button_4.title=Bug修复
ui.changelist.v0_2_x.v0_2_4.button_4.text=_-_ 修复天赋_我全都要_和_营养不良_的失效问题，同时修复天赋_超越极限_生效异常的问题。\n_-_ 修复成就_光荣凯旋_获取异常问题。\n_-_ 于_fix1_修复神圣精英敌人坠落导致游戏卡死的问题，同时修复天赋_溃决之手_触发异常问题。\n
ui.changelist.v0_2_x.v0_2_5.button_1.title=天赋更新
ui.changelist.v0_2_x.v0_2_5.button_1.text=_-_ 本版本限定负面天赋组为：_限定2_。\n_-_ 新增共计_13_个正面天赋，_7_个法术天赋。\n_-_ _1层：_液体感知，水波荡漾，狩猎直觉，雷雨发庄稼，疯狂舞者\n_-_ _2层：_自然亲和，优质吸收，食人心智，高速突破\n_-_ _3层：_盈能生命，致残毒云，恶魔之焰，投掷回收\n_-_ _1层法术：_圣愈一击\n_-_ _2层法术：_天启，装备赐福，灼热强光\n_-_ _3层法术：_神圣手雷，刀刃阶梯，黄金回旋\n
ui.changelist.v0_2_x.v0_2_5.button_2.title=史莱姆娘
ui.changelist.v0_2_x.v0_2_5.button_2.text_1=_-_ 史莱姆娘只有9点力量，但拥有更高的初始生命值和生命成长。同时初始穿戴无法脱下的粘液护甲，会随史莱姆娘等级提升而提高等级和等阶。史莱姆娘还可以花费一回合让种子在体内发芽，并立刻触发种子对应的植被效果。击败粘咕即可解锁史莱姆娘及成就。\n_-_ _两个转职：_水灵史莱姆和暗液史莱姆。\n_-_ _三个护甲技能：_阳春法阵、飞湍瀑流和狂史日记。\n_-_ 角色由_叶·凌卡缇娜·霜麟_设计，_可则_和_DM-216_绘制美术素材，_Secher-Nbiw_制作。\n
ui.changelist.v0_2_x.v0_2_5.button_2.text_2=_-_ 于_fix1_新增1阶投掷武器_粘液球_，由史莱姆娘初始携带2个，击中敌人时给予3回合黏糊糊效果，使敌人移速减半，由_DM-216_提议制作。\n_-_ 加强_粘液护甲_，从原来的每6级一次升级加强到每3级一次升级，最多+5。\n_-_ 加强_征讨者的长矛_，初始伤害从1~12上调至1~14。\n_-_ 加强_暗液史莱姆_，攻击附带淤泥的概率上调至50%，暗液钩爪冷却下降至50，天赋_暗液缠身_和_强效淤泥_得到加强。\n_-_ 于_fix2_改动_粘液护甲_，现在无法使用诅咒棱晶升级，但依然和_fix1_版本一样可以通过食用邪能碎片达到相同的效果。\n_-_ 移除史莱姆娘_英雄液铠_的转移功能。\n_-_ 削弱_水灵史莱姆_的天赋_水灵强愈_。\n_-_ 削弱_暗液史莱姆_的_暗液钩爪_，设置12格的最大距离限制。\n_-_ 于_fix3_调整护甲技能_狂史日记_，击杀敌人会有掉落物产生，但充能消耗由75提升至90。\n_-_ 削弱_粘液护甲_，自动升级所需史莱姆娘等级从3/6/9/12/15调整为3/9/15/21/27。\n_-_ 削弱天赋_暗液缠身+3_，恢复的饱食度从90调整为45。\n_-_ 于_fix4_调整天赋_暗液缠身+3_，使用暗液钩爪将敌人拉下深渊后不再能重置冷却。\n
ui.changelist.v0_2_x.v0_2_5.button_3.title=新增5层Boss：战士？
ui.changelist.v0_2_x.v0_2_5.button_3.text=_-_ _战士？_和_粘咕_根据种子有1/2概率生成。\n_-_ _战士？_拥有狂战士和角斗士的部分特性，以及能够使用护甲技能。击败战士？可掉落纹章残蜡、1~3个口粮和专属_升华秘卷_并能获得_饭桶终结者_成就。\n_-_ 新增_3_个战士？天赋：最强之盾，连击套餐，陷阵之志\n_-_ 于_fix1_调整战士？的技能冷却，现在每10回合能够进行一次英勇之跃。\n
ui.changelist.v0_2_x.v0_2_5.button_4.title=挑战更新
ui.changelist.v0_2_x.v0_2_5.button_4.text=_-_ 于fix4新增_1_个挑战。\n_-_ _测试时间：_与破碎注解版一样的测试时间挑战，便于玩家进行游戏测试，目前仅为_v2.4_。\n
ui.changelist.v0_2_x.v0_2_5.button_5.title=内容同步
ui.changelist.v0_2_x.v0_2_5.button_5.text=_-_ 于_fix4_进行_破碎v3.2_的内容同步。\n_-_ _投武改动：_主要同步关于投武重做的内容，大部分削弱内容不作保留。投武耐久维持原状，原本是10和15耐久的投武不进行耐久削弱，当然飞刺也继续保持10耐久而不进行增强；投武升级的耐久提升仅从x3降低为x2；2阶及以上的投武伤害下限成长依旧为2，1阶投石和飞刺的成长从1~1改回1~2，均不进行削弱；不改动手里剑，保持为移动后投掷不消耗回合并且无cd限制；不削弱飞斧的流血；不削弱回旋镖的耐久，依然为10；不削弱苦无和方石的基础伤害上限；不削弱流星索和飞斧的伤害上限成长；保留投武空射固定消耗1回合的特性，相当于正常的丢出物品；保留投武被炸减少耐久的特性(这包括易爆诅咒的触发)。\n_-_ _杂项内容：_女猎手原来的生存直觉保留，同时加入投武鉴定版的生存直觉在蜕变池子中，名字变更为狩猎直觉；不保留针对矢石保养和联动升级的削弱；保留友善诅咒触发后使对应武器伤害降低至0的特性；针对狂战士的削弱不保留；其余有关牧师、战斗法师等增强保留；加入快捷备注功能；所有蜕变新增物品、单位图鉴都同步了破碎3.2图鉴中的未发现时的提示文本。\n
ui.changelist.v0_2_x.v0_2_5.button_6.title=内容更新
ui.changelist.v0_2_x.v0_2_5.button_6.text=_-_ 加入_幸运银币_作为绅士的初始投掷武器，用以替换投石。\n_-_ 于_fix1_加入了幽妹的特殊对话内容，当玩家变身美少女“战士”后在每次下楼时概率触发(不与幽妹原对话内容同时触发)。\n_-_ 于_fix3_添加新的_探索指南2篇_、_史莱姆娘英雄故事1则_，同时新增_1_个成就。\n_-_ _死境斗士_：在开启包括“恶劣环境”和“极端环境”八个挑战的情况下通关。\n_-_ 于_fix4_加入绅士的转职详情，仅用于查看潜力无限天赋，整体和原先一样无变化，同时为万事通成就加了绅士，并在“关于蜕变地牢”界面_内置创意投稿链接_。\n
ui.changelist.v0_2_x.v0_2_5.button_7.title=视觉更新
ui.changelist.v0_2_x.v0_2_5.button_7.text=_-_ 添加￥红色￥、￡橙色￡以及€绿色€字体，由咕(QQ1323933183)指导完成。\n_-_ 于_fix1_完善主界面的“关于蜕变地牢”界面，同时调整部分文本。\n_-_ 于_fix2_微调史莱姆娘的立绘位置。\n_-_ 于_fix3_加入红杯图标，在开启挑战极端环境后替换游戏内原先的金杯，同时对部分文本进行修订。\n_-_ 于_fix4_加入红包作战图标，在游戏内会在挑战图标旁边显示。\n_-_ 于_fix5_加入测试时间图标，在游戏内会替换原先的金杯或红杯。\n
ui.changelist.v0_2_x.v0_2_5.button_8.title=平衡性调整
ui.changelist.v0_2_x.v0_2_5.button_8.text=_-_ 于_fix1_为天赋_无敌一餐_、_饭里藏金_、_吃出经验_和_生日礼物_设置100次触发上限。\n_-_ 于_fix2_为法术天赋_荆棘之鞭_设置12格的最大距离限制。\n_-_ 于_fix3_削弱武僧宗师，使其不再能触发绝大多数的玩家天赋特殊效果。\n_-_ 于_fix5_加强法术天赋_荆棘之鞭_和_神力领域风暴_，充能消耗均向下调整1点，同时调整天狗天赋_奇袭投掷_，现在需要瞄准目标投掷才能生效不耗时特性但灵能弓也能够享受此加成。\n_-_ 于_fix6_令所有角色开局鉴定蜕变卷轴，同时加强天赋_即兴投掷_，冷却从50下调到20。\n
ui.changelist.v0_2_x.v0_2_5.button_9.title=改动
ui.changelist.v0_2_x.v0_2_5.button_9.text=_-_ 更新日期：2025年8月8日~8月18日\n_-_ 这一版本的更新还包括了6次fix更新，此处将所有fix更新内容合并。\n_-_ 于_fix2_为所有法术天赋添加了是否消耗回合的描述，可通过圣典查看法术详情得知，同时还为部分法术增加了快捷瞄准功能(例如聚焦光线)。\n_-_  于_fix3_对物理增伤类天赋进行翻新，当前天赋增伤=伤害x累计天赋增伤倍率+天赋固定增伤值(累计天赋增伤倍率为所有物理增伤天赋倍率乘积，天赋固定增伤值为固定增伤天赋之和)。\n_-_ 于_fix6_使得无序魔典能够触发除符文复制外的其他使用卷轴的天赋(实验性改动)，同时允许空手触发需要近战触发的天赋。\n
ui.changelist.v0_2_x.v0_2_5.button_10.title=Bug修复
ui.changelist.v0_2_x.v0_2_5.button_10.text_1=_-_ 修复天赋_极限施法_和_目光短浅_生效异常的问题，同时修复精英强敌3级、知识之泉导致游戏崩溃的问题。\n_-_ 于_fix1_修复天赋_极限施法_伤害异常以及_暗气释放_和_陷阵之志_生效异常的问题，同时修复_蓄血圣杯_等治疗溢出问题以及护甲技能_狂史日记_导致的贴图异常问题。\n_-_ 于_fix2_试修复豺狼流寇的敌对问题。\n_-_ 修复史莱姆娘食用_邪能碎片_不能完全诅咒粘液护甲的问题。\n\n_-_ 修复暗液钩爪释放时天赋异常触发问题，如果遇到暗液钩爪功能消失，可通过进食恢复功能。\n_-_ 修复天赋_暗气释放_异常问题。\n_-_ 修复_水灵史莱姆_生成粘液消耗异常的问题。\n_-_ 修复护甲技能_三位一体_的界面排版问题。\n_-_ 尝试修复战士？贴图位置异常问题，不确定是否会再次出现。\n_-_ 尝试修复_矮人国王二阶段_卡死的情况，经测试后暂无问题。\n_-_ 尝试修复一部分返程报错的情况。\n
ui.changelist.v0_2_x.v0_2_5.button_10.text_2=_-_ 于_fix3_修复_战士？_和挑战_精英强敌3级_的一些问题，同时将遗漏的天赋_夺命余势_和_启蒙圣餐_加回2层天赋池。\n_-_ 于_fix4_修复了_千面手_成就和_万事通_成就中的_史莱姆_、_水灵史莱姆_和_暗液史莱姆_不会亮的问题，同时修复了幽妹可以装备并复制出粘液护甲、战士？被击杀后不会重复获得_饭桶终结者_成就(不在局内显示)、负面天赋_营养不良_的生效异常和天赋_空蝉幻舞_的触发异常问题。\n_-_ 于_fix5_修复被护甲技能_鼠化术_鼠化的敌人在恢复正常后能够发动绯红之王进行时删连续殴打的问题，同时修复武技等必中效果被闪避、轻弓和重弓平A耗时异常(修复后轻弓和重弓空射都是1回合，击中敌人时则为正常)、_狙击手_追击耗时异常、_索敌附魔_失效、部分文本的错误以及表述不当等问题。\n_-_ 于_fix6_修复部分pc端界面错误的问题。\n
ui.changelist.v0_2_x.v0_2_6.button_1.title=天赋更新
ui.changelist.v0_2_x.v0_2_6.button_1.text=_-_ 根据投票，自本版本开始，天赋池up倍率从3倍上调至_6倍_。\n_-_ 本版本限定负面天赋组为：_限定3_。\n_-_ 新增共计_5_个正面天赋。\n_-_ _1层：_敏捷反击，吓我一跳\n_-_ _2层：_快速搜索，忍者应酬\n_-_ _3层：_千发投掷\n于_fix3_新增共计_10_个正面天赋\n_-_ _1层：_虚假之力，魔弹射手，蜘蛛感应，NO集群，更多人情，静滞电流\n_-_ _2层：_刻笔·布莱恩特，奇迹炼金\n_-_ _3层：_炎烬化身，冰能一餐，五金元素\n
ui.changelist.v0_2_x.v0_2_6.button_2.title=忍者
ui.changelist.v0_2_x.v0_2_6.button_2.text=_-_ 忍者初始携带一件_独特的手里剑箱_，可从箱中快速取出并投射小小手里剑以打击甚至是干扰敌人。忍者能从更远的距离_探测秘密与陷阱_，并且行动_更难被敌人察觉_。击败天狗即可解锁忍者及成就。\n_-_ _两个转职：_铁炮忍者和忍术大师。\n_-_ _三个护甲技能：_影武者、平蜘蛛釜和一之太刀。\n_-_ 角色由_东榆桑榆_和_幻影食人杂鱼_设计，_DM-216_绘制美术素材，_东榆桑榆_制作。\n_-_ 追加一则关于忍者的英雄故事并新增相关成就。\n_-_ 于_fix1_将_手里剑箱_初始伤害由4~8下调至2~4，并且重新调整了瞄准判定。\n_-_ _铁炮忍者的铁炮_现在伤害下限恒定为0，而恐惧效果调整为只对敌人生效。\n_-_ _忍术大师_通过_遁术-草木复苏_召唤的沉沦触手现在可以通过交互清除。\n
ui.changelist.v0_2_x.v0_2_6.button_3.title=内容更新
ui.changelist.v0_2_x.v0_2_6.button_3.text=_-_ 于_fix4_新增_2_个物品。\n_-_ _蜕变结晶：_它会允许使用者对任一通用天赋进行定向蜕变。可以通过使用蜕变卷轴合成获取。\n_-_ _蜕变晶柱：_可以无限蜕变指定天赋，不会消耗自身。测试道具，只能在测试时间使用。\n
ui.changelist.v0_2_x.v0_2_6.button_4.title=视觉更新
ui.changelist.v0_2_x.v0_2_6.button_4.text=_-_ 于_fix2_调整紫色ui的饱和度，使按键颜色不会过于明亮。\n_-_ 于_fix3_为挑战界面增加图标，由_咕(QQ1323933183)_协助完成。\n_-_ 挑战图标的美术素材，由_DM-216_绘制。\n
ui.changelist.v0_2_x.v0_2_6.button_5.title=平衡性调整
ui.changelist.v0_2_x.v0_2_6.button_5.text_1=_-_ 获得道具的最大次数从16次上调至26次，绅士仍保留额外的13次上限。\n_-_ _长启书室_共用获得道具的最大次数。\n_-_ fix2改动：\n_-_ 天赋_女巫媚药_给予的魅惑效果由5回合提高至15回合。\n_-_ 天赋_燃咒+2_给予的恐惧效果改为眩晕。\n_-_ 天赋_量子骇入_给予的眩晕效果由2/3回合下调至1/2回合。\n_-_ 负面天赋_干柴烈火_给予的魅惑效果由3回合提高至10回合。\n_-_ 暗液史莱姆天赋_暗气释放_不再有冷却限制，且给予的净化屏障持续时间上调至4回合。\n_-_ 调整护甲技能_狂史日记_造成的伤害。\n
ui.changelist.v0_2_x.v0_2_6.button_5.text_2=_-_ fix3加强天赋：\n_-_ _脑袋尖尖_：力量提升3/6/9。\n_-_ _陷阱专家_：回收概率提升至66%，75%，80%。\n_-_ _引火上身_：提供的烈焰之力回合数提升至5/8。\n_-_ _顷刻炼化_：获得炼金能量的概率从10%/15%上调至40%/60%。\n_-_ _金币巧克力_：金币消耗减半。\n_-_ _军用水袋_：水袋上限增加提升至15/30，生命之泉可以装满水袋，而非装至20点。\n_-_ _武器制造_：获得的武器力量需求-2。\n_-_ _眼力惊人_：增伤提高至35%，精准提升降低至35%。\n_-_ _赐福圣餐_：祝福延长至25/35回合。\n_-_ _宝贵经验_：神意启发合剂也能触发效果，并且+2时饮用经验及其合剂给予祝福回合上调至50。\n_-_ _诅咒护体_：额外等级对武器也生效。\n_-_ _长期素食_：肉食给予的饱食度降低从50%下调到30%。\n_-_ _打草惊蛇_：巨蛇从狂乱改变为腐化。\n_-_ _卧榻之侧_：激素涌动回合提升至3/5。\n
ui.changelist.v0_2_x.v0_2_6.button_5.text_3=_-_ fix3加强天赋：\n_-_ _爆破狂魔_：升级该天赋可额外获得一个炸弹。\n_-_ _饭里藏金_：升级该天赋可获得量提升至25/35。\n_-_ _麻醉酊剂_：护盾量上调至5/8。\n_-_ _反戈一击_：固定对敌人造成0.5倍等级的反伤。\n_-_ _活动肌肉_：升级获得的力量翻倍，持续时间延长。\n_-_ _盛食厉兵_：增伤和伤害减免上调至15%/30%/45%和10%/20%/30%。\n
ui.changelist.v0_2_x.v0_2_6.button_5.text_4=_-_ fix3调整和削弱天赋：\n_-_ _暗液缠身_：改为8回合法杖充能+5回合神器充能。\n_-_ _工程技师_：下放到2层。\n_-_ _所向披靡_：上调到2层。\n_-_ _火球术_，_金币护盾_，_势能转换_，_掠阵之影_：下放到1层。\n_-_ _击落卫星_：调整类型为其他类。\n_-_ _燃咒_：+1给予残废，+2给予失明。\n_-_ _极限施法_：极限施法的降低充能速度从原来的10%/20%/30%上调至13%/26%/39%。\n_-_ _借痛排毒_：获得全面净化效果概率从25%下调至15%。\n_-_ _黄金回旋_：+2增伤取消，+3对恶魔亡灵增伤降低至30%。\n
ui.changelist.v0_2_x.v0_2_6.button_5.text_5=_-_ fix4加强和削弱天赋：\n_-_ _十全大补_：效果翻倍。\n_-_ _震撼爆炸，爆破狂魔_：升级立即获取1个炸弹，且不占用上限。\n_-_ _人身攻击_：升级此天赋额外获得一张盛怒卷轴。\n_-_ _水鬼索命_：+1时的怨灵给予5回合狂乱效果，+2给予腐化效果。\n_-_ _健康食物，万灵药水_：在原效果基础上增加1回合持续时长。\n_-_ _烟雾掩护_：冷却从20回合上调至25回合，可以自由释放，烟雾量上调至100/150。\n_-_ _吓我一跳_：闪避给予的护盾量上升至+2/+3，叠加上限分别为4/6点。\n_-_ _水灵回复_：如果玩家处于极度饥饿状态，该天赋回复效率减半。\n_-_ _NO集群_：移入其他类。\n
ui.changelist.v0_2_x.v0_2_6.button_6.title=改动
ui.changelist.v0_2_x.v0_2_6.button_6.text=_-_ 更新日期：2025年8月23日-9月29日\n_-_ 于_fix4_为天赋图鉴的天赋背景根据类型设置了不同的颜色区分。\n_-_ 为不同Boss掉落的_升华秘卷_在文本上添加区分。\n\n_-_ 更新绝大多数的天赋描述。\n_-_ _战士_初始力量上调至11点。\n
ui.changelist.v0_2_x.v0_2_6.button_7.title=Bug修复
ui.changelist.v0_2_x.v0_2_6.button_7.text=_-_ 修复天赋_自然亲和_和_盈能生命_生效异常的问题。\n_-_ 于_fix1_修复天赋_目光短浅_和觉察之泉的视野问题。\n_-_ 修复天赋_云隐一餐_对号角的减回合不生效的问题。\n_-_ 修复护甲技能平蜘蛛釜不触发其他天赋的问题。\n_-_ 修复腐化触手异常掉落问题。\n_-_ 于_fix2_试修复忍术大师释放遁术导致的游戏崩溃。\n_-_ 修复击杀英雄Boss无法获得徽章问题。\n_-_ 于_fix3_修复盗贼的检测范围缩小的问题。\n_-_ 修复天赋_怨灵爪牙_生效异常问题。\n_-_ 修复天赋_马猴烧酒_变身时长异常的问题。\n_-_ 修复天赋_原生魔物_生效异常的问题。\n_-_ 修复魔杖灌注和文章贴附异常问题。\n_-_ 于_fix4_实装多数测试工具。\n_-_ 修复天赋_强化袖章_生效异常问题。\n_-_ 修复天赋_虚假之力_生效异常问题。\n
ui.changelist.v0_2_x.v0_2_7.button_1.title=天赋更新
ui.changelist.v0_2_x.v0_2_7.button_1.text=_-_ 本版本限定负面天赋组为：_限定4_。\n_-_ 新增共计_5_个正面天赋。\n_-_ _1层：_超算代码，定期维护\n_-_ _2层：_高效指令，火箭拳头\n_-_ _3层：_重拳出击\n_-_ 于_fix4_新增共计_7_个正面天赋，并为0.2.8版本预载_4_个负面天赋。\n_-_ _1层：_极恶中队，地牢英雄，嗜酒如命\n_-_ _2层：_经验固化，美梦长眠，光明震慑\n_-_ _3层：_财富石像\n_-_ _负面：_饿鬼道，无法安息，被诅咒者，高利贷\n_-_ 于_fix5_为0.2.8版本预载_4_个负面天赋，与_fix4_的4个合并为_限定5_。\n_-_  _负面：_吉列豆蒸，炼金事故，晶化躯壳，恶毒诅咒\n
ui.changelist.v0_2_x.v0_2_7.button_2.title=DM-400
ui.changelist.v0_2_x.v0_2_7.button_2.text_1=_-_ DM-400可以借助_指令集合工具_生产无人机协助作战，同时它的物理攻击还会_强化_战斗型无人机对敌人造成的效果。它还拥有_非生物_属性。击败DM-300即可解锁DM-400及成就\n_-_ _两个转职：_AT-400和AU-400。\n_-_ _三个护甲技能：_例行维护、废气排出和蜂巢集群。\n_-_ 角色由_DM-216_设计，_DM-216_绘制美术素材，_东隅桑榆_制作。\n_-_ 追加一则关于DM-400的英雄故事并新增_1_个相关成就。\n_-_ 于_fix1_为所有无人机增加1~2点初始护甲。\n_-_ _激光无人机_增加2倍命中，标记点燃概率上调至50%。\n_-_ _迷乱无人机_的血量上调。\n_-_ _袭扰和震慑无人机_的伤害统一上调。\n_-_ _混沌无人机_的变化所需时间减少10回合。\n_-_ _爆破无人机_自动掉血距离缩短至1格。\n_-_ _所有辅助型无人机_每架可为玩家提供0.3潜行点(_护航无人机_为0.8)。\n_-_ 现在能获取所有无人机自身所处地格的视野。\n_-_ 增加_游荡_和_回收_功能，回收时若无人机血量≥80%则返还1点工具充能。\n_-_ 增加卷轴记录功能，使AT-400/AU-400可以自由制造已录入卷轴对应的无人机。\n
ui.changelist.v0_2_x.v0_2_7.button_2.text_2=_-_ 于_fix2_对以下无人机进行调整。\n_-_ _侦察和护航无人机_生命提升。\n_-_ _映像无人机_产生镜像所需回合-8，生命提升。\n_-_ _庇佑无人机_给予玩家的护甲加成提升至1~3。\n_-_ _混沌无人机_现在会随机变化为另一转职的无人机类型或是一些随机魔法生物。\n
ui.changelist.v0_2_x.v0_2_7.button_3.title=新增10层Boss：盗贼？
ui.changelist.v0_2_x.v0_2_7.button_3.text=_-_ 于_fix4_新增该Boss。\n_-_ _盗贼？_和_天狗_根据种子有1/2概率生成。\n_-_ _盗贼？_拥有刺客和疾行者的部分特性，以及能够使用护甲技能。击败盗贼？可掉落残破织物、天狗的面具和专属_升华秘卷_并能获得_缉拿归案_成就。\n_-_ 新增_4_个盗贼？天赋：阴影杀手，杀戮盛宴，人潮汹涌，幻影迷步\n_-_ 该Boss由_Secher-Nbiw_和_DM-216_设计，_Secher-Nbiw_制作。\n
ui.changelist.v0_2_x.v0_2_7.button_4.title=挑战更新
ui.changelist.v0_2_x.v0_2_7.button_4.text=_-_ 于_fix5_追加挑战_天赋弱化_、_最大麦穗_和_负面天赋_的2、3级挑战效果。\n
ui.changelist.v0_2_x.v0_2_7.button_5.title=内容更新
ui.changelist.v0_2_x.v0_2_7.button_5.text=_-_ 于_fix1_为_悲伤幽灵_、_灵能飞鹰_等可指挥盟友增加游荡功能，使用对应装备指挥后点击盟友即可进行游荡。\n_-_ 于_fix2_更新无人机相关音频，全部音频由_Lefted_制作。\n_-_ 于_fix3_新增饰物：_青铜怀表_，可以降低玩家自身大部分效果的持续时间。\n_-_ 绅士新增护甲技能：_卖身契约_，可以让敌人为你打工一辈子。\n_-_ 于_fix4_将蜕变秘卷改为_蜕变卷轴_并独立为类似升级卷轴的资源。\n新增_升变秘卷_作为嬗变卷轴的新秘卷，在保有嬗变能力的同时，还能够提升武器、投掷武器与护甲的等阶。\n新增图鉴的查询(_双击图鉴分类图标可唤醒搜索栏_)和天赋获取的统计功能，由_Secher-Nbiw_制作。\n_-_ 于_fix5_增加新生物_蜕变宝箱怪_。\n为战士初始武器_破旧的短剑_追加重铸功能。\n_沉重诅咒_追加奥术之戒增幅效果。\n为_悲伤幽灵_的游荡功能、战士？Boss战、盗贼？Boss战添加新的对话文本。\n
ui.changelist.v0_2_x.v0_2_7.button_6.title=视觉更新
ui.changelist.v0_2_x.v0_2_7.button_6.text=_-_ 于_fix3_为所有英雄专属的吃饭天赋改变底色，提高辨识度，便于玩家蜕变区分。\n新增_4_种饱食度UI，可以在设置中切换，多数情况下需要重启游戏才能生效。\n对DM-400的_饥饿状态_进行视觉改动。\n以上更新内容均由_DM-216_绘制。\n_-_ 于_fix4_对部分游戏内容及文本描述进行视觉调整。\n
ui.changelist.v0_2_x.v0_2_7.button_7.title=平衡性调整
ui.changelist.v0_2_x.v0_2_7.button_7.text=_-_ 天赋_优质吸收_露珠回复从+1/+2提升至+2/+3，_极限施法_每级降低的法杖充能速度从13%下调至10%，_破损核心_+2伤害从1-2点上调至2点。\n_-_ 于_fix5_削弱盗贼？Boss天赋_杀戮盛宴_：击杀敌人获得的生命恢复和神器充能分别从10%/15%和4/6回合下调至5%/7.5%和2/3回合。\n削弱天赋_动能吸收_：现在至少会受到1点伤害。\n调整天赋_水灵回复_：水灵回复的回复总量现在受玩家等级影响，不再因饥饿导致回复间隔延长。\nBoss_盗贼？_的隐遁等效果现在可以被物理以外的伤害类型中断。\n_盗贼_的初始一层天赋窃贼直觉改为_暗影庇护_。\n
ui.changelist.v0_2_x.v0_2_7.button_8.title=改动
ui.changelist.v0_2_x.v0_2_7.button_8.text=_-_ 更新日期：2025年10月13日-12月19日\n_-_ 于_fix1_调整无人机群体指挥，同时调整辅助无人机的行动逻辑。\n允许蓝底法杖拆成树脂。\n_-_ 于_fix2_调整天赋_移形换位_和单独指挥无人机的逻辑。\n_-_ 于_fix3_让卷轴房能够自然生成圣典拓本。\n_等级3的集群智能_不再影响盟友。\n投武_废弃齿轮_取消中矢效果。\n同步_破损纹章_换甲可直接贴附的功能。\n蓝底法杖拆成树脂将会显示数量，便于玩家判断等级。\n_升华秘卷_文本调整。\n天赋_极度深寒_去掉实战本就不生效的冻结效果。\n牧师护甲技能_三位一体_界面调整，其他文本改动，追加新神器的三位一体效果。\n追加_祭司_使用部分法术会施加圣辉的效果\n技能_烟雾掩护_和_暗液钩爪_机制调整。\n_-_ 于_fix4_为水灵史莱姆产生的史莱姆粘液增加1格共享视野。\n_-_ 于_fix5_让盗贼？战前获得的一组手里剑变为已鉴定状态。\n圣典法术_复活术_现在只能选取自己和盟友。\n
ui.changelist.v0_2_x.v0_2_7.button_9.title=Bug修复
ui.changelist.v0_2_x.v0_2_7.button_9.text_1=_-_ 修复天赋_烟雾掩护_生效异常的问题，同时修复物品_蜕变结晶_导致的天赋丢失问题。\n_-_ 于_fix1_修复天赋_快捷工具_生效异常问题。\n修复天赋_法杖回收_生效异常问题。\n修复护甲刻印_涌流_、_迅捷_、_臃肿_生效异常问题。\n修复神器_无序魔典_阅读异常问题。\n_-_ 于_fix2_修复AU-400天赋_快速巡航_生效异常问题。\n修复无人机视野问题，但是部分情况下存在少量显示错误。\n_-_ 于_fix3_修复天赋_见异思迁_，_法杖回收_，_圣餐真言_，_胃有强酸_，_顷刻炼化_的生效异常问题。\n修复护甲技能_狂史日记_的生效异常问题。\n修复护甲技能_元素打击横扫附魔_的生效异常问题并对相关文本进行优化。\n修复神器_指令集合工具_充能消耗异常问题。\n修复_法师魔杖_灌注蓝底法杖导致的显示错误。\n修复返程Boss战中通过未祝福的十字架复活导致的楼层重置问题，现在返程Boss战玩家可以通过未祝福的十字架原地复活，但只保留1点生命。\n
ui.changelist.v0_2_x.v0_2_7.button_9.text_2=_-_ 于_fix4_修复天赋_动能转换_，_打草惊蛇_，_定期维护_，_赐福圣餐_，_机身加固_，_烈气护盾_，_生命在于运动_，_进食过载_生效异常问题。\n修复_横扫附魔_的触发异常问题\n修复_暗液史莱姆_复活获得忍术的问题。\n修复_AT-400_的无人机击杀矮人国王无法达成掣君无刃成就的问题。\n修复十字架Boss层复活异常问题。\n_-_ 于_fix5_修复天赋_掠阵之影_，_奇迹炼金_，_冬泳怪鸽_，_新手福利_，_盈能生命_，_恶魔之焰_，_工程技师_，_烟雾掩护_，_极度深寒_，_神圣感知_，_阴影杀手_，_进食过载_，_杀戮盛宴_，_战意盎然_，_经验固化_在特定场景下的生效异常问题。\n修复排行榜显示不全、视野残留、复活术对象选取问题、炸弹哑火、激光无人机不同步攻速、盗贼？战背景音乐消失、盗贼？斩杀目标选取异常、闪光无人机伤害类型错误、角色升级无提示等异常问题。\n
ui.changelist.v0_2_x.v0_2_8.button_1.title=天赋更新
ui.changelist.v0_2_x.v0_2_8.button_1.text=_-_ 本版本限定负面天赋组为：_限定5_。\n_-_ 新增共计_5_个正面天赋。\n_-_ _1层：_魔能感知，奥术护体\n_-_ _2层：_魔能裹身，锐利魔矢\n_-_ _3层：_强力符文\n
ui.changelist.v0_2_x.v0_2_8.button_2.title=矮人公主
ui.changelist.v0_2_x.v0_2_8.button_2.text=_-_ 矮人公主初始携带一枚_独特的王储之戒_，能够像武器与护甲那样存储附魔与刻印并直接作用于二者之上。矮人公主还能消耗8点炼金能量将任意符石转换为附魔符石。击败矮人国王即可解锁矮人公主及成就。\n_-_ _两个转职：_符文法师和格斗宗师。\n_-_ _三个护甲技能：_大步流星、禁忌法术和君王之刃。\n_-_ 角色由_DM-216_和_叶·凌卡缇娜·霜麟_设计，_DM-216_绘制美术素材，_东隅桑榆_制作。\n_-_ 追加一则关于矮人公主的英雄故事并新增相关成就。\n
ui.changelist.v0_2_x.v0_2_8.button_3.title=内容更新
ui.changelist.v0_2_x.v0_2_8.button_3.text=_-_ 新增全新武器附魔：_酸蚀_，这个附魔会使武器在攻击敌人时为其注入酸蚀魔法，这一恶毒的魔法会不断侵蚀敌人的身体，十分致命。\n_-_ 追加正常成就1个：_年度最佳_。此外还有隐藏成就1个，请玩家游戏内自行探寻。\n_-_ 挑战_红包挑战_更新为马年版本，物品_红包_也做出相应改动。\n_-_ 追加蜕变地牢周年庆食物_蜕变蛋糕_，祝蜕变地牢一周年生日快乐！\n_-_ 于_fix1_新增皮肤功能，目前战士、法师、盗贼、忍者、女猎手、史莱姆娘追加新皮肤。\n_-_ 于_fix2_新增战士新皮肤：皮肤2，女猎手新皮肤：皮肤2。\n_-_ 于_fix3_追加大量新皮肤，本次皮肤主要由_DM-216_、_诺亚7385_和_狗emoji_绘制。\n_-_ 于_fix3_更新DM-300的2个Boss天赋：雷霆打击和定向塌方，并将天赋_充能超载_和_毒气喷射_下放至二层天赋。\n_-_ 于_fix3_追加2把新武器和1个新饰物：吹箭筒、钢鞭和魔法羽毛，由_DM-216_和_Secher-Nbiw_设计并制作，相关音效则由_Lefted_制作。\n
ui.changelist.v0_2_x.v0_2_8.button_4.title=内容同步
ui.changelist.v0_2_x.v0_2_8.button_4.text=_-_ 于_fix1_同步_破碎v3.3_的新神器_骷髅钥匙_和新饰物_幻象裂镜_。\n_-_ 于_fix2_同步_破碎v3.2-3.3_的多数杂项改动。\n_-_ 同步DM-300的落石伤害、悲伤幽灵与玫瑰、液蕴机敏的优先级、神圣护盾与神圣护甲、冲击波魔杖与焰浪魔杖的战斗法师特效、投掷锤与飞槌拾取、标题界面、金色蜜蜂索敌等多项改动。\n_-_ 同步圣杯血祭、飞速投掷、抵近射击、迅捷刻印、涌流刻印、臃肿诅咒、白化小鼠、电击附魔、精英怪物生成、天狗出场、角斗士连击、排行榜等多项改动。\n
ui.changelist.v0_2_x.v0_2_8.button_5.title=视觉更新
ui.changelist.v0_2_x.v0_2_8.button_5.text=_-_ 于_fix1_同步破碎3.2版本的UI改动。\n_-_ 于_fix1_在_戒指地牢_作者_吔柠檬的滑稽_帮助下完善Boss_盗贼?_的血条隐藏机制。\n_-_ 于_fix3_大量英雄、怪物贴图翻新，以上内容均由_DM-216_绘制。\n_-_ 对部分游戏内容及文本描述进行视觉调整。\n
ui.changelist.v0_2_x.v0_2_8.button_6.title=改动
ui.changelist.v0_2_x.v0_2_8.button_6.text_1=_-_ 更新日期：2026年1月12日-2026年5月4日\n_-_ 法术_祈愿诗篇_全面修改为不消耗时间释放。\n_-_ 盗贼？战结束后，上方房间门不再上锁。\n_-_ 选人界面立绘改动，由_诺亚7385_绘制。\n_-_ 于_fix1_加强投掷武器符石串，并且附魔后保留一个残留物供玩家投掷。\n法术_聚焦光线_的射弹调整为黄色光线。\n盗贼？受伤时减少的逸动时长降低。\n格斗宗师缠绕刻印、行云流水、招架姿态与王储之戒文本做出调整。\n_-_ 于_fix2_将投石的拾取改为不再消耗回合。\n为图鉴中的天赋描述附带兼容效果描述。\n追加书架被破坏后掉落随机道具的效果。\n护甲技能_平蜘蛛釜_伤害加强且充能消耗下调。\n
ui.changelist.v0_2_x.v0_2_8.button_6.text_2=_-_ 于_fix2_补充升华秘卷、红包、公文包的使用数量统计。\n_-_ 于_fix3_补充史莱姆娘食用道具音效和矮人公主遗物使用音效。\n让破坏书架产生的卷轴会受到饰品_奇异能晶_影响，干枯玫瑰充能上限限制在100%。\n让无序魔典在可以选择读秘卷时不再破除隐形和时间气泡的效果。\n调整天赋_双持饰物_、_灵光闪现_、_时之沙_、_经验固化_、_符文涌动_、_五雷正法_、_光明震慑_、_继承遗志_等效果。\n调整哨卫法杖的哨卫，使其可以触发多种法伤类天赋的效果。\n武技_拳击架势_现在可以生效手中武器、_索敌附魔_及天赋_厚积薄发_的攻击距离加成。\n_手里剑箱_的伤害显示现在能随神射之戒等级变化，由迅牢作者_迅_协助调整。\n优化镐子和炸弹破坏部分障碍的效果。\n护甲技能_三位一体_在拥有多个可幻化物品时能够滑动查看。\n部分贴图、文本描述调整。\n
ui.changelist.v0_2_x.v0_2_8.button_7.title=Bug修复
ui.changelist.v0_2_x.v0_2_8.button_7.text_1=_-_ 修复饰物_奇异能晶_道具生成问题。\n_-_ 修复对物品_蜕变卷轴_嬗变导致的无损耗问题。\n_-_ 于_fix1_修复负面天赋_无法安息_造成的一系列问题，并设置当怪物坠落死亡时无法触发该天赋。\n修复_指令集合工具_异常触发神器相关天赋、_磐岩刻印_异常不触发、_盛魔一餐_次数异常消耗、_更多戒指_导致升级天赋时戒指自动卸下等问题。\n修复_指令标记_和_符文印记_异常施加、_奇异能晶_影响正常嬗变卷轴生成、_根骨戒指_诅咒显示异常、_金币巧克力_触发异常与生命之泉触发异常问题。\n_-_ 于_fix2_修复多个敌人同时死亡导致的卡死问题。\n修复天赋_武技训练_异常触发、护甲技能_禁忌法术_结算异常、豺狼流寇获得精英效果时立刻进入追击状态的问题。\n
ui.changelist.v0_2_x.v0_2_8.button_7.text_2=_-_ 于_fix3_修复使用转移结晶、强能结晶、念力结晶卡死的问题。\n修复陷阱晶柱数量异常、蜕变卷轴未统计使用次数、征讨者的长矛武技数值异常、_动能转换_无法对骷髅钥匙生效的问题。\n修复天赋_联动升级_狙击标记回合、_云隐一餐_触发次数、_开卷有益_和_继承遗志_生效异常、_厚积薄发_攻击距离异常、_符文印记_和_暗影印记_导致崩溃等问题。\n修复_神圣附魔_没有完全覆盖附魔、_武技充能_兼容效果增伤异常、_更多戒指_和_戒指联结_生效异常、色孽信徒的费洛蒙气体魅惑未生效、战士？起跳时退出重进导致崩溃等问题。\n
