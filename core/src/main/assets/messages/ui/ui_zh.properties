ui.changelist.v0_1_x.v0_1_0.title=v0.1：蜕变地牢诞生
ui.changelist.v0_1_x.v0_1_0.button_1.title=蜕变地牢诞生
ui.changelist.v0_1_x.v0_1_0.button_1.text=_-_ 诞生日期：2025年1月13日\n_-_ 蜕变地牢横空出世！以天赋蜕变为主要玩法，由_东隅桑榆_制作。\n_-_ 本地牢还为所有固定流程的Boss增加了升华秘卷的掉落，同时还调整了各个角色的天赋及天赋数量，并且除Boss层外每层还会固定生成一张蜕变卷轴供玩家进行天赋蜕变。\n希望各位玩得开心！\n
ui.changelist.v0_1_x.v0_1_1.button_1.title=天赋更新
ui.changelist.v0_1_x.v0_1_1.button_1.text=_-_ 新增共计_11_个正面天赋和_1_个联动的Boss天赋。\n_-_ _1层：_强力进攻，恐惧化身\n_-_ _2层：_求生意志，强力投掷，燃咒，正义惩戒，掠阵之影\n_-_ _3层：_陷阱专家，反戈一击，继承遗志，排山倒海(原为_萝卜地牢_天赋)\n_-_ _Boss天赋：_动能转换(击败矮人国王可选取，原为_萝卜地牢_天赋)\n
ui.changelist.v0_1_x.v0_1_1.button_2.title=改动
ui.changelist.v0_1_x.v0_1_1.button_2.text=_-_ 更新日期：2025年1月14日\n_-_ 涉及近战攻击的本地牢天赋改为需装备近战武器触发。\n_-_ _升华秘卷_取消释放后不会被消耗。\n
ui.changelist.v0_1_x.v0_1_2.button_1.title=天赋更新
ui.changelist.v0_1_x.v0_1_2.button_1.text=_-_ 新增共计_18_个正面天赋。\n_-_ _1层：_扰乱打击，第三只手，水性攻击，爆破狂魔\n_-_ _2层：_打草惊蛇，宝贵经验，诡异投掷，豺狼巫术，更多机会，金币护盾，眼力惊人，重甲运用，轻甲运用，赐福圣餐\n_-_ _3层：_武技训练，魔力回收，工程技师，幻影射手\n
ui.changelist.v0_1_x.v0_1_2.button_2.title=平衡性调整
ui.changelist.v0_1_x.v0_1_2.button_2.text=_-_ 粘咕天赋_淤泥附着_增加10点延缓伤害效果。\n
ui.changelist.v0_1_x.v0_1_2.button_3.title=Bug修复
ui.changelist.v0_1_x.v0_1_2.button_3.text=_-_ 修复部分_v0.1.1_的天赋触发条件异常及伤害倍率异常问题。\n
ui.changelist.v0_1_x.v0_1_2.button_4.title=改动
ui.changelist.v0_1_x.v0_1_2.button_4.text=_-_ 更新日期：2025年1月16日\n
ui.changelist.v0_1_x.v0_1_3.button_1.title=天赋更新
ui.changelist.v0_1_x.v0_1_3.button_1.text=_-_ 新增_天赋图鉴_，可在日志中查看。\n_-_ 新增共计_18_个正面天赋。\n_-_ _1层：_加厚护甲，算无遗策，插标卖首，护盾一餐，力量锻炼，治疗一餐，遍体鳞伤，十全大补，野蛮体魄\n_-_ _2层：_耐摔王，军用水袋，茉莉花茶，神之左手，神之右手，强化锁链，强化圣杯\n_-_ _3层：_暴怒攻击，金币法阵\n
ui.changelist.v0_1_x.v0_1_3.button_2.title=平衡性调整
ui.changelist.v0_1_x.v0_1_3.button_2.text=_-_ 天狗天赋_烟雾掩护_冷却时间由50回合下调至20回合。\n
ui.changelist.v0_1_x.v0_1_3.button_3.title=Bug修复
ui.changelist.v0_1_x.v0_1_3.button_3.text=_-_ 修复显示、文本错误、闪退问题等。\n
ui.changelist.v0_1_x.v0_1_3.button_4.title=改动
ui.changelist.v0_1_x.v0_1_3.button_4.text=_-_ 更新日期：2025年1月18日\n
ui.changelist.v0_1_x.v0_1_4.button_1.title=天赋更新
ui.changelist.v0_1_x.v0_1_4.button_1.text=_-_ 新增共计_20_个正面天赋。\n_-_ _1层：_破冰行动，劲冠三军，更多天赋，新手福利，摸鱼时间，淬毒匕首，震撼爆炸，画饼充饥，班门弄斧\n_-_ _2层：_燃烧之血，卧榻之侧，巨物杀手，我全都要，长期素食，律令震慑，负重前行\n_-_ _3层：_厚积薄发，双持饰品，无敌一餐，盛食厉兵\n
ui.changelist.v0_1_x.v0_1_4.button_2.title=挑战更新
ui.changelist.v0_1_x.v0_1_4.button_2.text=_-_ 新增_1_个挑战。\n_-_ _天赋弱化：_天赋+1不生效，+2、+3只生效+1，+4只生效+2。\n
ui.changelist.v0_1_x.v0_1_4.button_3.title=Bug修复
ui.changelist.v0_1_x.v0_1_4.button_3.text=_-_ 修复_王之加护_、_军用水袋_、_动能转换_等部分天赋不生效的问题。\n
ui.changelist.v0_1_x.v0_1_4.button_4.title=改动
ui.changelist.v0_1_x.v0_1_4.button_4.text=_-_ 更新日期：2025年1月20日\n
ui.changelist.v0_1_x.v0_1_5.button_1.title=挑战更新
ui.changelist.v0_1_x.v0_1_5.button_1.text=_-_ 新增_2_个挑战。\n_-_ _红包作战：_所有敌人的常规掉落物被替换为红包，红包必定能开出压岁钱，有小概率开出特别惊喜。\n_-_ _最大麦穗：_每个天赋槽被蜕变过一次后不能够再次蜕变。\n
ui.changelist.v0_1_x.v0_1_5.button_2.title=视觉更新
ui.changelist.v0_1_x.v0_1_5.button_2.text=_-_ 对大量天赋图标进行重绘，使美术风格更加贴近破碎，由_DM-216_进行重绘。\n
ui.changelist.v0_1_x.v0_1_5.button_3.title=Bug修复
ui.changelist.v0_1_x.v0_1_5.button_3.text=_-_ 修复各类贴图错误。\n
ui.changelist.v0_1_x.v0_1_5.button_4.title=改动
ui.changelist.v0_1_x.v0_1_5.button_4.text=_-_ 更新日期：2025年1月21日\n_-_ 调整_红包作战_挑战：红包可以开出另一种特殊物品，启用此挑战会使游戏得分清零，同时解决宝箱怪、小偷、任务敌人等敌人的掉落异常问题。\n_-_ 对_女猎手_的初始天赋进行调整。\n_-_ _DM-300_掉落的升华秘卷给予的天赋点移到2层，使用升华秘卷还会有金光特效。\n
ui.changelist.v0_1_x.v0_1_6.button_1.title=天赋更新
ui.changelist.v0_1_x.v0_1_6.button_1.text=_-_ 新增共计_10_个正面天赋。\n_-_ _1层：_涿郡屠夫，胃有强酸，细嚼慢咽，所向披靡\n_-_ _2层：_矢贯坚石\n_-_ _3层：_借痛排毒，载誉而归，武器制造，私房钱，大地一餐\n
ui.changelist.v0_1_x.v0_1_6.button_2.title=Bug修复
ui.changelist.v0_1_x.v0_1_6.button_2.text=_-_ 修复_幻影射手_吞投掷物的Bug，顺便调整_算无遗策_效果以及排行榜处挑战栏目大小等。\n
