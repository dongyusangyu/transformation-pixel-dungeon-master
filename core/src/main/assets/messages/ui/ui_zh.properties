ui.changelist.v0_1_x.v0_1_7.button_1.text=_-_ 新增_3_个Boss天赋。\n_-_ _Yog-Dzewa：_幼虫呼唤，巨拳之力，死亡射线\n
ui.changelist.v0_1_x.v0_1_7.button_2.title=改动
