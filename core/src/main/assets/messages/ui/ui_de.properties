ui.updatenotification$wndupdate.desc=Shattered Pixel Dungeon wird regelmäßig mit Revisionen des bestehenden Spielinhalts aktualisiert, oder es wird komplett neuer Spielinhalt eingeführt!\n\nDie Spielbalance wird in den Aktualisierungen auch häufig verbessert, damit bestimmte Gegenstände, Helden oder Feinde nicht zu stark oder zu schwach sind.\n\nAktualisierungen enthalten auch Ausbesserungen von Fehlern und verschiedene Verbesserungen der Stabilität.
ui.updatenotification$wndupdate.button=Zur Seite mit der Aktualisierung gehen

ui.changelist.v0_3_x.v0_3_0fix1.button_2.text=_-_ Die Regeln für das Beschwören von Gespenstern durch _Necronomicon_ und _Leichenstaub_ wurden erweitert.
ui.changelist.v0_3_x.v0_3_0fix2.button_1.text=_-_ Rund um den neuen Umgebungseffekt _Fluchflammen_ und den neuen Statuseffekt _Verfluchtes Brennen_ kamen folgende Inhalte hinzu: der neue Zauberstab _Fluchflammenstab_, das neue Schmuckstück _Zwillingsdämonenaugen_, das neue Essen _Seelenbraten_ sowie die Fallen _Fluchflammenfalle_ und _Seelenbrandfalle_. Für all diese Neuerungen gibt es nun passende Einträge im Bestiarium.\n_-_ Für die Oberfläche auf Ebene 0 und die Aufträge des Händlers auf Ebene 0 wurde neue Hintergrundmusik hinzugefügt.\n_-_ Für Magier, Duellant und Mönch wurde jeweils ein neuer Skin hinzugefügt.
ui.changelist.v0_3_x.v0_3_0fix2.button_2.text=_-_ Viele zu Beginn von Version 0.3.0 hinzugefügte Inhalte wurden grafisch überarbeitet, und zahlreiche Texte wurden weiter verbessert.\n_-_ Die meisten zu Beginn von Version 0.3.0 hinzugefügten Waffen der Stufe 6 wurden neu ausbalanciert; viele wurden verstärkt oder vollständig überarbeitet.\n_-_ Einige Gegenstände wurden umbenannt: Der _Wandelprisma_ heißt nun _Erhebungsprisma_, die _Extraktionsrolle_ heißt nun _Extraktionsterminal_, und viele Sammlerstücke aus den Aufträgen des Händlers auf Ebene 0 erhielten ebenfalls neue Namen.\n_-_ Viele Einträge im Bestiarium wurden überarbeitet und an die aktuelle Version angepasst; die Einträge zu den Turmgegnern sind noch nicht vollständig fertiggestellt.\n_-_ Die Arena für den Kampf gegen _Jägerin?_ wurde verbessert und ist nun ebenso abwechslungsreich wie die Arena von DM-300.\n_-_ Das Leben des _Psionischen Adlers_ von Jägerin? wurde auf 20 erhöht; außerdem werden die ersten beiden physischen Angriffe gegen ihn wirkungslos.\n_-_ In einem neuen Zyklus kannst du vor dem Betreten des Turms höchstens 13 Heiltränke mitnehmen. Außerdem werden einige Ausrüstungseffekte im Turm abgeschwächt (zum Beispiel kann der Schatzfund von Reichtumsringen höchstens Stufe 3 erreichen).\n_-_ Turmbosse können pro Runde höchstens dreimal direkten Schaden erleiden. Im Nahkampf können sie außerdem mit einer durch ihre Spezialfähigkeit verursachten Hiebsmarkierung zusätzlich angreifen.\n_-_ Die Kampfmechaniken von _Todesritter_, _Pestilenzritter_, _Hungerritter_ und _Gentleman-Elf_ wurden umfassend überarbeitet. Sie sind nun schwerer zu besiegen und bieten mehr Interaktion.\n_-_ Die Musik auf normalen Turmebenen verändert sich nun abhängig von nahen Gegnern und dem Leben des Helden.\n_-_ Der Turmhändler verkauft keine vergifteten Wurfpfeile mehr.\n_-_ Die Benutzeroberflächen der Testwerkzeuge _Kreaturenplatzierer_, _Bossplatzierer_ und weiterer Werkzeuge wurden angepasst.\n_-_ Beim Aktivieren des _Zufallsmodus_ erscheint nun eine Bestätigung. Der _Tageslauf_ wird von diesem Modus nicht mehr beeinflusst.\n_-_ Die Zutaten für den _Hilfskern_ wurden angepasst. _Arkane Infusion_ kann nicht mehr auf Wurfpfeile oder Runensteine angewendet werden, die keine Verzauberung besitzen.\n_-_ Der _Gladiator_ wurde abgeschwächt (was, Krieger werden sogar in Shattered abgeschwächt? Keine Sorge, lies erst weiter): Der Schadensmultiplikator von Hieb und Schwung ist nun auf 500 % begrenzt. Das Talent _Kampfmeisterschaft_ verbraucht bei Sturm nicht mehr die entsprechende Kombozahl, sondern setzt weiterhin die gesamte Kombo zurück. Insgesamt soll so verhindert werden, dass dauerhaft extrem hohe Kombos gehalten werden und ständig Explosionsschaden verursachen... Der Krieger ist doch nicht etwa ...\n_-_ Der _Eiferer_ wurde abgeschwächt: Die Wirkung des Blutopfers des Ritualdolchs wurde geändert. Geist kann nur noch wiederhergestellt werden, wenn der Eiferer durch eigenen physischen Schaden Leben verliert. Die Wiederherstellung durch Bosse und Minibosse ist auf höchstens 5 pro Treffer begrenzt.
ui.changelist.v0_3_x.v0_3_0fix2.button_3.text=_-_ Einige Spezialangriffe der _Turmbosse_ und die Kollisionsbereiche ihrer Kampfarenen wurden korrigiert.\n_-_ Fehler beim Erhalt einiger Abzeichen wurden behoben.\n_-_ Fehler mit Schaden und Spezialtechniken einiger Waffen der Stufe 6 wurden behoben.\n_-_ Außerdem wurden zahlreiche weitere Kleinigkeiten behoben.
