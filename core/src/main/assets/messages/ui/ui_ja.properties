ui.updatenotification$wndupdate.desc=Shattered Pixel Dungeonは、既存コンテンツの見直しや新規コンテンツによって定期的に更新されます。\n\n更新によってゲームバランスも改善されるので、特定のアイテム、勇士、敵などが強すぎたり弱すぎたりしないように調整されます。\n\n更新にはバグ修正や、その他の細々とした改善が含まれます。
ui.updatenotification$wndupdate.button=更新ページへ

###更新テキスト
ui.changelist.v0_3_x.v0_3_0fix1.button_2.text=_-_ _死霊の書_と_屍塵_による怨霊召喚の規則を改善。
ui.changelist.v0_3_x.v0_3_0fix2.button_1.text=_-_ 錬金術で作れる新武器_魔焔の杖_を追加。呪焔で敵を焼き尽くす。\n_-_ 魔焔とレーザーの2形態を切り替える装身具_双子の魔眼_を追加。\n_-_ _魂焼き肉_、_呪焔の罠_、_魂焼きの罠_を追加。\n_-_ _0階の町_に新しいBGMを追加。
ui.changelist.v0_3_x.v0_3_0fix2.button_2.text=_-_ _高塔_へ持ち込める治癒の薬を最大_13本_に制限し、一部の薬の効果を調整。\n_-_ _高塔のボス_が1ターンに受ける直接ダメージを最大_3回_に制限。近接攻撃には_斬撃マーク_で追撃可能。\n_-_ _死の騎士_、_疫病の騎士_、_紳士エルフ_、_飢餓の騎士_の戦闘を調整。\n_-_ 高塔の通常階のBGMが周囲の敵と英雄の体力に応じて変化。高塔の店から_投げ矢_を削除。\n_-_ 複数の_第6階級武器_のダメージ、技、使い勝手を調整。\n_-_ _脱出レイド_の脱出に使う水晶の鍵を_アクセスカード_に変更。\n_-_ _敵配置器_、_ボス配置器_などのテストツールの選択画面を調整。\n_-_ _ランダムモード_を有効にすると確認画面を表示。_デイリーチャレンジ_には影響しない。
ui.changelist.v0_3_x.v0_3_0fix2.button_3.text=_-_ _高塔のボス_の一部特殊攻撃と戦闘エリア判定を修正。\n_-_ _死の騎士_の剣気と一部高塔生物の表示を修正。\n_-_ 小さな画面で_ランダムモード_の確認ウィンドウの文字とボタンが重なる問題を修正。\n_-_ _呪焔_の効果、_予知の目_の通知、一部バッジの獲得通知を修正。\n_-_ 一部の_第6階級武器_のダメージと技の異常を修正。
