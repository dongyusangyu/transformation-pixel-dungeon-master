ui.updatenotification$wndupdate.desc=Shattered Pixel Dungeon est régulièrement mis à jour avec des refontes du contenu existant, voire du contenu totalement inédit!\n\nL'équilibre du jeu est également fréquemment amélioré lors des mises à jour de façon à ce que les objets/héros/ennemis ne soient ni trop forts ni trop faibles.\n\nLes mises à jour contiennent aussi des corrections de bugs et différentes améliorations concernant la stabilité du jeu.
ui.updatenotification$wndupdate.button=Aller à la page de la mise à jour

ui.changelist.v0_3_x.v0_3_0fix1.button_2.text=_-_ Les règles d’invocation des spectres par le _Nécromancien_ et la _Poussière funéraire_ ont été améliorées.
ui.changelist.v0_3_x.v0_3_0fix2.button_1.text=_-_ Les nouveautés suivantes accompagnent le nouvel effet de terrain _Flammes maudites_ et le nouvel effet _Combustion maudite_ : la baguette _Flammes maudites_, le bijou _Yeux démoniaques jumeaux_, le repas _Viande grillée de l’âme_, ainsi que les pièges _Flammes maudites_ et _Âme brûlante_. Des entrées de journal ont été ajoutées pour chacun de ces éléments.\n_-_ De nouvelles musiques d’ambiance ont été ajoutées à la surface du niveau 0 et aux quêtes du marchand du niveau 0.\n_-_ Un nouveau skin a été ajouté au Mage, au Duelliste et au Moine.
ui.changelist.v0_3_x.v0_3_0fix2.button_2.text=_-_ De nombreux contenus ajoutés au début de la version 0.3.0 ont reçu de nouveaux graphismes, et la plupart des textes ont été peaufinés.\n_-_ La puissance de la plupart des armes de niveau 6 ajoutées au début de la version 0.3.0 a été ajustée ; beaucoup ont été renforcées ou entièrement repensées.\n_-_ Certains objets ont changé de nom : le _Prisme de métamorphose_ devient le _Prisme d’ascension_, le _Parchemin d’extraction_ devient le _Terminal d’extraction_, et de nombreux objets de collection des quêtes du marchand du niveau 0 ont également été renommés.\n_-_ Plusieurs entrées du journal ont été actualisées pour correspondre à la version actuelle. Celles sur les ennemis de la Tour restent à terminer.\n_-_ L’arène du combat contre la _Chasseresse ?_ a été améliorée et est désormais aussi riche que celle de DM-300.\n_-_ Les PV de l’_Aigle psychique_ de la Chasseresse ? passent à 20, et ses deux premières attaques physiques sont annulées.\n_-_ Dans un nouveau cycle, vous ne pouvez emporter que 13 potions de soin au maximum avant d’entrer dans la Tour. Certains effets d’équipement y sont aussi affaiblis (par exemple, le butin de rang trésor des anneaux de richesse ne peut dépasser le niveau 3).\n_-_ Les boss de la Tour ne peuvent plus subir que 3 dégâts directs par tour. Au corps à corps, ils peuvent aussi effectuer des attaques supplémentaires grâce à la marque de frappe appliquée par leur capacité spéciale.\n_-_ Les mécanismes de combat du _Chevalier de la mort_, du _Chevalier de la peste_, du _Chevalier de la faim_ et de l’_Elfe gentleman_ ont été entièrement revus afin de les rendre plus difficiles à vaincre et plus interactifs.\n_-_ La musique des étages ordinaires de la Tour varie désormais selon les ennemis proches et l’état de santé du héros.\n_-_ Le marchand de la Tour ne vend plus de fléchettes empoisonnées.\n_-_ L’interface des outils de test, comme le _Placeur de créatures_ et le _Placeur de boss_, a été ajustée.\n_-_ L’activation du _Mode aléatoire_ affiche désormais une confirmation, et le _Défi quotidien_ n’est plus affecté par ce mode.\n_-_ Les ingrédients du _Noyau auxiliaire_ ont été modifiés. L’_Infusion arcanique_ ne peut plus être appliquée aux fléchettes ni aux amas de runes dépourvus d’enchantement.\n_-_ Le _Gladiateur_ a été affaibli (quoi ? Même Shattered affaiblit le Guerrier ? Pas de panique, lisez la suite) : le multiplicateur de dégâts de l’Impact et du Balayage est plafonné à 500 %. Le talent _Maîtrise des techniques_ ne consomme plus le combo correspondant lors de l’utilisation de Tempête, mais réinitialise toujours tout le combo. Ce changement évite de conserver un combo excessivement élevé pendant trop longtemps pour infliger sans cesse des dégâts explosifs... Le Guerrier ne va quand même pas être...\n_-_ Le _Dévot_ a été affaibli : l’effet du don de sang du poignard rituel a changé. Le Dévot ne récupère du sang-froid que si ses propres dégâts physiques lui font perdre des PV. La récupération par coup contre un boss ou un mini-boss est plafonnée à 5.
ui.changelist.v0_3_x.v0_3_0fix2.button_3.text=_-_ Correction de certaines attaques spéciales des _boss de la Tour_ et de problèmes de détection dans leurs arènes.\n_-_ Correction de problèmes d’obtention de certains badges.\n_-_ Correction de dégâts et de techniques spéciales erronés pour certaines armes de niveau 6.\n_-_ Et bien d’autres corrections diverses.
