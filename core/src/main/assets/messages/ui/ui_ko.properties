###갱신 텍스트
ui.changelist.v0_3_x.v0_3_0fix1.button_2.text=_-_ _네크로노미콘_과 _시체 먼지_의 원혼 소환 규칙을 개선。
ui.changelist.v0_3_x.v0_3_0fix2.button_1.text=_-_ 연금술로 만들 수 있는 새 무기 _마염의 지팡이_ 추가. 저주불로 적을 태운다.\n_-_ 마염과 레이저 형태를 전환하는 장신구 _쌍둥이 악마의 눈_ 추가.\n_-_ _영혼 구이_, _저주불 함정_, _영혼 태우기 함정_ 추가.\n_-_ _0층 마을_에 새 배경 음악 추가。
ui.changelist.v0_3_x.v0_3_0fix2.button_2.text=_-_ _탑_에는 치유 물약을 최대 _13개_까지 가져갈 수 있으며 일부 물약 효과도 약화。\n_-_ _탑 우두머리_는 턴마다 직접 피해를 최대 _3회_ 받으며, 근접 공격에 _베기 표식_ 추가 타격 가능。\n_-_ _죽음의 기사_, _역병 기병_, _신사 엘프_, _굶주림의 기사_ 전투 방식 조정。\n_-_ 탑 일반 층의 배경 음악이 주변 적과 영웅의 체력에 따라 바뀌며 탑 상점에서 _투척 다트_ 제거。\n_-_ 여러 _6단계 무기_의 피해, 기술, 사용감 조정。\n_-_ _탈출 레이드_의 탈출용 수정 열쇠를 _출입 카드_로 교체。\n_-_ _적 배치기_와 _우두머리 배치기_ 등 시험 도구의 선택 화면 조정。\n_-_ _무작위 모드_를 켤 때 확인 창 추가. _일일 도전_에는 적용되지 않음。
ui.changelist.v0_3_x.v0_3_0fix2.button_3.text=_-_ _탑 우두머리_의 일부 특수 공격 및 전투 구역 판정 오류 수정。\n_-_ _죽음의 기사_ 검기와 일부 탑 생물의 표시 오류 수정。\n_-_ 작은 화면에서 _무작위 모드_ 확인 창의 글자와 버튼이 겹치는 문제 수정。\n_-_ _저주불_ 효과, _예지의 눈_ 알림, 일부 배지 획득 알림 수정。\n_-_ 일부 _6단계 무기_의 피해 및 기술 오류 수정。
ui.changelist.v0_1_x.v0_1_0.title=v0.1: 변성 던전 탄생
ui.changelist.v0_1_x.v0_1_0.button_1.title=변성 던전 탄생
ui.changelist.v0_1_x.v0_1_0.button_1.text=_-_ 탄생일: 2025년 1월 13일\n_-_ 변성 던전이 등장했습니다! 특성 변성을 중심으로 동우상유가 제작했습니다.\n_-_ 고정 보스가 승화 비전을 드롭하며 직업 특성과 특성 수를 조정했습니다. 보스 층 외에는 변성 주문서가 생성됩니다.\n즐겁게 플레이하세요!\n
ui.changelist.v0_1_x.v0_1_1.button_1.title=특성 업데이트
ui.changelist.v0_1_x.v0_1_1.button_1.text=_-_ 긍정 특성 11개와 연계 보스 특성 1개 추가.\n_-_ _1층:_ 강력한 공격, 공포의 화신\n_-_ _2층:_ 생존 의지, 강력한 투척, 저주 연소, 정의의 응징, 진영의 그림자\n_-_ _3층:_ 함정 전문가, 반격, 유산 계승, 산을 무너뜨리는 파도\n_-_ _보스 특성:_ 운동 에너지 변환\n
ui.changelist.v0_1_x.v0_1_1.button_2.title=변경
ui.changelist.v0_1_x.v0_1_1.button_2.text=_-_ 업데이트 날짜: 2025년 1월 14일\n_-_ 근접 공격 특성은 근접 무기 장착 시 발동하도록 변경.\n_-_ 승화 주문서는 취소해도 소모되지 않음.\n
ui.changelist.v0_1_x.v0_1_2.button_1.title=특성 업데이트
ui.changelist.v0_1_x.v0_1_2.button_1.text=_-_ 긍정 특성 18개 추가.\n_-_ _1층:_ 교란 타격, 세 번째 손, 수중 공격, 폭파광\n_-_ _2층:_ 풀을 건드려 뱀을 깨우기, 귀중한 경험, 기묘한 투척, 놀 주술, 더 많은 기회, 금화 방패, 놀라운 시력, 중갑 운용, 경갑 운용, 축복의 만찬\n_-_ _3층:_ 무기 기술 훈련, 마력 회수, 공학자, 환영 사수\n
ui.changelist.v0_1_x.v0_1_2.button_2.title=밸런스 조정
ui.changelist.v0_1_x.v0_1_2.button_2.text=_-_ 구 특성 _점액 부착_에 지연 피해 10 추가.\n
ui.changelist.v0_1_x.v0_1_2.button_3.title=버그 수정
ui.changelist.v0_1_x.v0_1_2.button_3.text=_-_ v0.1.1 특성 발동 조건과 피해 배율 오류 수정.\n
ui.changelist.v0_1_x.v0_1_2.button_4.title=변경
ui.changelist.v0_1_x.v0_1_2.button_4.text=_-_ 업데이트 날짜: 2025년 1월 16일\n
ui.changelist.v0_1_x.v0_1_3.button_1.title=특성 업데이트
ui.changelist.v0_1_x.v0_1_3.button_1.text=_-_ 특성 도감 추가.\n_-_ 긍정 특성 18개 추가.\n_-_ _1층:_ 두꺼운 갑옷, 완벽한 계산, 표적의 목, 한 끼 방패, 힘 단련, 치료 식사, 만신창이, 만병통치, 야만적 체력\n_-_ _2층:_ 낙하왕, 군용 수통, 재스민차, 신의 왼손, 신의 오른손, 강화 사슬, 강화 성배\n_-_ _3층:_ 격노 공격, 금화 진법\n
