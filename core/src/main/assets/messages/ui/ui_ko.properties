ui.changelist.v0_1_x.v0_1_3.button_4.title=변경
ui.changelist.v0_1_x.v0_1_3.button_4.text=_-_ 업데이트 날짜: 2025년 1월 18일\n
ui.changelist.v0_1_x.v0_1_4.button_1.title=특성 업데이트
ui.changelist.v0_1_x.v0_1_4.button_1.text=_-_ 긍정 특성 20개 추가.\n_-_ _1층:_ 빙결 작전, 삼군의 왕관, 더 많은 특성, 초보자 혜택, 낚시 시간, 독 단검, 충격 폭발, 그림의 떡, 어부지리\n_-_ _2층:_ 불타는 피, 침상 곁, 거물 사냥꾼, 모두 원해, 장기 채식, 법령 위압, 짐을 지고 전진\n_-_ _3층:_ 두껍게 쌓아 한 번에 터뜨리기, 쌍수 장신구, 무적 식사, 풍성한 무기\n
ui.changelist.v0_1_x.v0_1_4.button_2.title=도전 업데이트
ui.changelist.v0_1_x.v0_1_4.button_2.text=_-_ 도전 1개 추가.\n_-_ _특성 약화:_ 특성 +1은 무효, +2·+3은 +1만, +4는 +2만 적용.\n
