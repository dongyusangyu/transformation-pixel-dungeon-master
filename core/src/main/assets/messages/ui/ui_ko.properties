ui.changelist.v0_1_x.v0_1_8.button_4.title=변경
ui.changelist.v0_1_x.v0_1_8.button_4.text=_-_ 업데이트 날짜: 2025년 1월 24일\n_-_ 변성 주문서 선택지 +1.\n_-_ 신춘 세뱃돈 일괄 열기 최적화.\n_-_ 일부 특성 위력 조정.\n
ui.changelist.v0_1_x.v0_1_9.button_1.title=특성 업데이트
ui.changelist.v0_1_x.v0_1_9.button_1.text=_-_ 긍정 특성 20개 추가.\n_-_ _1층:_ 손상된 핵, 마취 팅크, 경험을 먹다\n_-_ _2층:_ 심연의 응시, 자연의 길\n_-_ _3층:_ 어리석음, 사랑의 배신, 개념 방어, 주판, 시간의 모래, 책을 펴면 유익, 강화 망토, 만능약, 활동 근육, 사해를 누비다, 여운, 생일 선물, 씨앗 수집, 뾰족한 머리, 강화 완장\n
ui.changelist.v0_1_x.v0_1_9.button_2.title=밸런스 조정
ui.changelist.v0_1_x.v0_1_9.button_2.text=_-_ 거물 사냥꾼의 추가 피해를 높이고 거인 사냥꾼으로 이름 변경.\n_-_ DM-300 특성 독가스 분사 강화.\n
ui.changelist.v0_1_x.v0_1_9.button_3.title=버그 수정
ui.changelist.v0_1_x.v0_1_9.button_3.text=_-_ 각종 텍스처 오류 수정.\n
ui.changelist.v0_1_x.v0_1_9.button_4.title=변경
ui.changelist.v0_1_x.v0_1_9.button_4.text=_-_ 업데이트 날짜: 2025년 1월 26일\n_-_ v0.2 업데이트 사전 로드.\n
ui.changelist.v0_2_x.v0_2_9fix4.button_1.title=새 콘텐츠
ui.changelist.v0_2_x.v0_2_9fix4.button_1.text=_-_ 신사 서류가방에 무기 기술 숙련 옵션 추가.\n_-_ 시공의 표지와 가시 망토 유물 구현 및 밸런스 조정.\n_-_ 테스트 시간에 디버그 두루마리 추가.\n_-_ 적 배치기, 층 제어기, 지형 개조기, 변성 수정 기둥 기능 확장.\n
ui.changelist.v0_2_x.v0_2_9fix4.button_2.title=변경
ui.changelist.v0_2_x.v0_2_9fix4.button_2.text_1=_-_ 일부 특성 및 연금술 효과 조정.\n_-_ 사제의 수리검 상자에 성휘 소모 추가.\n
ui.changelist.v0_2_x.v0_2_9fix4.button_2.text_2=_-_ 강화된 도적 보스의 그림자 환영 능력 조정.\n_-_ 무작위 모드에서 일부 적과 장비 생성 규칙 조정.

