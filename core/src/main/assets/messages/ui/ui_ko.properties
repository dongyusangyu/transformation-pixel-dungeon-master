ui.changelist.v0_1_x.v0_1_5.button_4.text=_-_ 업데이트 날짜: 2025년 1월 21일\n_-_ 세뱃돈 작전 조정 및 점수 초기화 문제 수정.\n_-_ 여사냥꾼 시작 특성 조정.\n_-_ DM-300 승화 주문서 특성 점수를 2층으로 이동.\n
ui.changelist.v0_1_x.v0_1_6.button_1.title=특성 업데이트
ui.changelist.v0_1_x.v0_1_6.button_1.text=_-_ 긍정 특성 10개 추가.\n_-_ _1층:_ 탁군 도살자, 강산성 위, 천천히 씹기, 무적의 기세\n_-_ _2층:_ 바위를 꿰뚫는 화살\n_-_ _3층:_ 고통으로 독 배출, 명예로운 귀환, 무기 제작, 비자금, 대지의 한 끼\n
ui.changelist.v0_1_x.v0_1_6.button_2.title=버그 수정
ui.changelist.v0_1_x.v0_1_6.button_2.text=_-_ 환영 사수가 투척물을 삼키는 버그와 일부 효과 및 랭킹 표시를 수정.\n
