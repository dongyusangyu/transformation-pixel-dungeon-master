ui.changelist.v0_1_x.v0_1_7.button_2.text=_-_ 업데이트 날짜: 2025년 1월 23일\n_-_ 승화 주문서 설명에 보스 특성 위치와 점수 배분을 표시.\n
ui.changelist.v0_1_x.v0_1_8.button_1.title=특성 업데이트
ui.changelist.v0_1_x.v0_1_8.button_1.text=_-_ 긍정 특성 20개 추가.\n_-_ _1층:_ 가시 장미, 밥 속의 금, 물귀신, 잿빛 장부, 조명의 비밀\n_-_ _2층:_ 맛있어서 날아갈 듯, 벗이여 잠시만, 오뢰 정법, 마후주\n_-_ _3층:_ 발바닥 기름, 방화광, 하늘은 사람을 꺾는다, 영웅의 이름, 천지의 힘, 물로 식사 대신, 천사의 자세, 고향의 구름, 극한의 한기, 박식, 염탐 금지\n
