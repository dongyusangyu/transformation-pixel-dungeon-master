ui.changelist.v0_1_x.v0_1_5.button_1.text=_-_ 도전 2개 추가.\n_-_ _세뱃돈 작전:_ 적의 일반 드롭이 모두 세뱃돈으로 바뀝니다.\n_-_ _최대 보리 이삭:_ 각 특성 슬롯은 한 번만 변성됩니다.\n
