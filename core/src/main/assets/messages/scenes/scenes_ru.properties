scenes.heroselectscene.random_mode_desc=Этот режим гораздо более «случайный», чем обычная игра. Он меняет появление некоторых предметов, существ и участков местности, а также знакомые игровые механики, приближая игру к классическому рогалику.\n\nЕго можно включить только на один забег. _В случайном режиме по-прежнему можно получать значки, а текущие игры будут отмечены в рейтинге._\n\nОн не так сильно повышает сложность, как испытания, но всё же добавляет немало особенностей. Включить его? Вы можете отключить режим в любой момент до входа в подземелье.
