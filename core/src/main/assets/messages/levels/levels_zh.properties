###features
levels.features.chasm.chasm=深渊
levels.features.chasm.yes=是的，我知道我在做什么
levels.features.chasm.no=不，我改主意了
levels.features.chasm.jump=你确定要跳入深渊中？从这么高的地方摔下去一定很疼。
levels.features.chasm.ondeath=你落地过猛摔死了...
levels.features.chasm.rankings_desc=死于撞击



###rooms
levels.rooms.special.magicalfireroom$eternalfire.desc=这里竖立着一面似乎由魔法生成的亮绿色致密火墙。这面火墙足够致密以至于你无法通过，它还会点燃任何过于靠近的物体。火墙没有任何会自然熄灭的迹象，你得用点什么东西才能熄灭它。

levels.rooms.special.sentryroom$sentry.name=血色哨卫
levels.rooms.special.sentryroom$sentry.desc=这红似鲜血的哨卫结晶像是被刻意安置在此，守卫着房间另一端的宝藏。如果你进入警戒区域，它就会向你发射解离光束。\n\n它对所有的负面效果都免疫，能一眼看穿隐形效果，但似乎需要充能一段时间才能开火。\n\n不知何故，哨卫只会向你开火，就好像它知道地牢里的居民对宝藏没有威胁一样。
levels.rooms.special.sentryroom$sentry.discover_hint=你可在任何地牢区域发现该敌人。

levels.rooms.special.toxicgasroom$toxicvent.name=排毒气孔
levels.rooms.special.toxicgasroom$toxicvent.desc=一定是一个莽撞的冒险家在很久以前触发了这个陷阱。尽管处于不活跃状态，它仍在向房间中喷射有毒气体，而且没有停止的迹象。要想探索这个房间，你得想想办法避免毒气的伤害。

levels.rooms.special.weakfloorroom$hiddenwell.name=远处的井
levels.rooms.special.weakfloorroom$hiddenwell.desc=你隐约可以看到深处有一口井，也许这下面有些什么？

levels.rooms.quest.blacksmithroom$questentrance.name=矿井入口
levels.rooms.quest.blacksmithroom$questentrance.desc=这架梯子通往铁匠铺下方的一座旧矿井。

levels.rooms.quest.ritualsiteroom$ritualmarker.name=仪式标记
levels.rooms.quest.ritualsiteroom$ritualmarker.desc=为某种黑暗仪式而画下的标记。蜡烛通常摆在四个角上。

levels.rooms.quest.massgraveroom$bones.name=乱葬岗
levels.rooms.quest.massgraveroom$bones.desc=遍地都是尸骨，这里到底发生过什么？

levels.rooms.quest.mineentrance$questexit.name=矿井出口
levels.rooms.quest.mineentrance$questexit.desc=这架梯子通向矿井外，连通到铁匠铺。

###traps
levels.traps.roastsheeptrap.discover_hint=你可在高塔中随机发现该陷阱。
levels.traps.redcrosstrap.discover_hint=你可在高塔中随机发现该陷阱。
levels.traps.malicetrap.discover_hint=你可在高塔中随机发现该陷阱。
levels.traps.infernaltrap.discover_hint=你可在高塔中随机发现该陷阱。
levels.traps.rimetrap.discover_hint=你可在高塔中随机发现该陷阱。
levels.traps.digestiontrap.discover_hint=你可在高塔中随机发现该陷阱。
levels.traps.transformationtrap.discover_hint=你可在高塔中随机发现该陷阱。
levels.traps.abyssexplosivetrap.discover_hint=你可在高塔中随机发现该陷阱。
levels.traps.alarmtrap.name=警报陷阱
levels.traps.alarmtrap.alarm=陷阱产生的尖锐的警报声在地牢里回荡！
levels.traps.alarmtrap.desc=这个陷阱看起来有着能造成很大响动的机制。触发它将使本层所有生物对这里产生警觉。

levels.traps.blazingtrap.name=爆炎陷阱
levels.traps.blazingtrap.desc=踩进这个陷阱会点燃某种极具力量的化学混合物，导致很大一块区域起火。

levels.traps.burningtrap.name=烈焰陷阱
levels.traps.burningtrap.desc=踩进这个陷阱会点燃某种化学混合物，导致附近一块区域起火。
levels.traps.cursedflametrap.name=咒焰陷阱
levels.traps.cursedflametrap.desc=这种陷阱和烈焰陷阱的触发原理几乎一致，但被额外施加了恶毒的灵魂之力！激活它会导致附近一块区域燃起蚀骨的咒火。
levels.traps.soulscorchtrap.name=灼魂陷阱
levels.traps.soulscorchtrap.desc=这种陷阱和爆炎陷阱的触发原理几乎一致，但被额外施加了极其恶毒的灵魂之力！激活它会导致很大一块区域燃起足以腐蚀灵魂的咒火。

levels.traps.chillingtrap.name=寒气陷阱
levels.traps.chillingtrap.desc=被触发时，这个陷阱里的化学药剂会迅速冻结附近的空气。

levels.traps.confusiontrap.name=致眩气体陷阱
levels.traps.confusiontrap.desc=触发这个陷阱将在附近释放出一片致眩气体。

levels.traps.cursingtrap.name=诅咒陷阱
levels.traps.cursingtrap.curse=你身上的装备被诅咒了！
levels.traps.cursingtrap.desc=这个陷阱充满了诅咒的力量。触发它会诅咒你身上的部分装备。

levels.traps.malicetrap.name=恶意陷阱
levels.traps.malicetrap.curse=你身上的全部装备都被诅咒了！
levels.traps.malicetrap.item_curse=一股恶意诅咒了陷阱上的装备！
levels.traps.malicetrap.already_cursed=大量恶意从陷阱中弥散而出，幸好你没有直接踩上去。
levels.traps.malicetrap.desc=这个高塔陷阱充满了恶意的能量。触发它会诅咒你身上的全部装备。

levels.traps.infernaltrap.name=炼狱陷阱
levels.traps.infernaltrap.desc=触发这个高塔陷阱将在附近释放出一片狱火气体。

levels.traps.rimetrap.name=雾凇陷阱
levels.traps.rimetrap.desc=触发这个高塔陷阱将在附近释放出一片致眩气体和暴雪气体。
levels.traps.redcrosstrap.name=鲜血陷阱
levels.traps.redcrosstrap.desc=这个高塔陷阱包含着仅对敌对生物有效的治愈魔法，触发它将为本层的所有敌对生物恢复生命。
levels.traps.digestiontrap.name=消化陷阱
levels.traps.digestiontrap.digested=地上的所有物品都被高塔消化了！
levels.traps.digestiontrap.empty=地上没有可以被高塔消化的物品。
levels.traps.digestiontrap.unsupported=消化陷阱只能在高塔内生效。
levels.traps.digestiontrap.desc=这个高塔陷阱似乎连接着高塔的“胃”，它能将本层所有躺在地上的物品随机转移至上下相邻的两个楼层中。

levels.traps.transformationtrap.name=转换陷阱
levels.traps.transformationtrap.changed=你的天赋发生了不可预测的转换！天赋%s被转换为了%s。
levels.traps.transformationtrap.unchanged=一股转换能量迅速掠过了你的身体，但没有发生任何变化。
levels.traps.transformationtrap.desc=触发这个高塔陷阱将使附近的生物陷入狂乱，并能使你的随机一个天赋发生难以预测的转换。

levels.traps.roastsheeptrap.name=烧烤陷阱
levels.traps.roastsheeptrap.desc=可以确信是那些烤全羊术士的杰作，触发这个高塔陷阱会创造一群魔法绵羊并使很大一块区域起火。

levels.traps.disarmingtrap.name=缴械陷阱
levels.traps.disarmingtrap.disarm=你手中的武器被传送走了！
levels.traps.disarmingtrap.desc=这个陷阱包含着非常有针对性的传送魔法，它会将触发陷阱的受害者的武器传送到其他位置。

levels.traps.disintegrationtrap.name=解离陷阱
levels.traps.disintegrationtrap.one=陷阱解离了你的%s！
levels.traps.disintegrationtrap.some=陷阱解离了你一部分的%s！
levels.traps.disintegrationtrap.ondeath=你被解离陷阱击杀...
levels.traps.disintegrationtrap.desc=被触发时，这个陷阱将会用解离射线袭击离它最近的目标，造成显著伤害的同时破坏物品。\n\n幸运的是，触发机关并没有被隐藏起来。

levels.traps.distortiontrap.name=重构陷阱
levels.traps.distortiontrap.desc=这种陷阱由来源不明的奇特魔法制作，触发后会召唤各式各样的怪物到这里。

levels.traps.abyssexplosivetrap.name=空爆陷阱
levels.traps.abyssexplosivetrap.desc=这个高塔陷阱悬浮于深渊之上，任何飞行着的生物进到所在位置时都会将其引爆，而原本不能飞行的生物在浮空触发这个陷阱时还有可能坠入深渊。

levels.traps.explosivetrap.name=爆炸陷阱
levels.traps.explosivetrap.desc=这个陷阱包含一些粉状炸药和一个触发机制。激活它会导致一定范围的爆炸。

levels.traps.flashingtrap.name=闪光陷阱
levels.traps.flashingtrap.desc=被触发时，这个陷阱将点燃储存在里面的强效闪光粉，使受害者暂时失明，残废，并受到伤害。\n\n这个陷阱的闪光粉储备显然很多，可以在损坏前触发很多次。

levels.traps.flocktrap.name=羊群陷阱
levels.traps.flocktrap.desc=也许是个来自一些业余法师的玩笑，触发这个陷阱就会创造一群魔法绵羊。

levels.traps.frosttrap.name=冰霜陷阱
levels.traps.frosttrap.desc=被触发时，这个陷阱里的化学药剂会迅速冻结附近大范围的空气。

levels.traps.gatewaytrap.name=虫洞陷阱
levels.traps.gatewaytrap.desc=这种特殊的传送陷阱可以被反复激活并且总是通向同样的目的地。

levels.traps.geysertrap.name=激流陷阱
levels.traps.geysertrap.desc=被触发时，大量的水会从中喷涌而出，对火属性敌人造成伤害，击退周围所有角色，熄灭火焰并覆盖周遭的地形。

levels.traps.gnollrockfalltrap.name=豺狼落石陷阱
levels.traps.gnollrockfalltrap.desc=这个落石陷阱在制作过程中注入了土石术法。触发时，该陷阱会导致在其周围5x5区域内的岩石松动并立即崩塌掉落。该处的岩石与寻常处相比更为松脆，因此其伤害性弱于常规的落石陷阱，但你的护甲却不能很好的抵御其伤害。此外，落石不会发生在支撑矿层结构的支架周边。\n\n_这个陷阱无法辨别敌友，因此对豺狼人和你都同样有效。_

levels.traps.grimtrap.name=即死陷阱
levels.traps.grimtrap.ondeath=你被即死陷阱的冲击彻底击杀...
levels.traps.grimtrap.desc=非常强大的破坏魔法储存在这个陷阱里，足以瞬间杀死除了状态最佳的英雄外的所有生物。触发它将向最近的生物发送一个致命的远程冲击魔法。\n\n幸好的是，触发机关并没有被隐藏起来。

levels.traps.grippingtrap.name=捕猎陷阱
levels.traps.grippingtrap.desc=触发这个陷阱将使一对钳子合上，伤害受害者并将他们固定在这里。\n\n由于其简单的构造，这种陷阱可被多次激活而不损毁。

levels.traps.guardiantrap.name=守卫陷阱
levels.traps.guardiantrap.alarm=陷阱产生的尖锐的警报声在地牢里回荡！
levels.traps.guardiantrap.desc=这个陷阱有着奇怪的魔法机制，它将召唤守卫并向将使本层所有生物对这里产生警觉。
levels.traps.guardiantrap$guardian.name=召唤守卫
levels.traps.guardiantrap$guardian.desc=这个蓝色的幻影似乎是地牢中石像守卫的一个召唤映像。
levels.traps.guardiantrap$guardian.desc_weapon=虽然雕像本身是几乎无形的，但它装备着的_%s_看起来是真家伙。

levels.traps.oozetrap.name=淤泥陷阱
levels.traps.oozetrap.desc=这个陷阱将会洒出腐蚀性的淤泥，它将烧灼你的皮肤直到被洗掉。

levels.traps.pitfalltrap.name=塌方陷阱
levels.traps.pitfalltrap.triggered_hero=你周围的地板在迅速崩塌！
levels.traps.pitfalltrap.triggered=陷阱附近的地板在迅速崩塌！
levels.traps.pitfalltrap.no_pit=这里的地面太结实了，塌方陷阱在这里无效。
levels.traps.pitfalltrap.desc=这种陷阱与一种大型活板门装置相连，在激活后会使周围的地板迅速崩塌！不过这类陷阱在坚实的地面上会失效。

levels.traps.poisondarttrap.name=毒镖陷阱
levels.traps.poisondarttrap.ondeath=你被毒镖陷阱击杀...
levels.traps.poisondarttrap.desc=附近一定藏着一个小型飞镖发射器，激活这个陷阱会导致它向最近的目标射出一个毒镖。\n\n幸好的是，触发机关并没有被隐藏起来。

levels.traps.rockfalltrap.name=落石陷阱
levels.traps.rockfalltrap.ondeath=你被落石砸扁了...
levels.traps.rockfalltrap.desc=这个陷阱和头顶上一片松散的岩石相连，触发它会导致石块崩塌砸向整个房间！如果这种陷阱不是在某个房间内，石块会砸向陷阱周围的一定区域。\n\n幸运的是，触发机关并没有被隐藏起来。

levels.traps.shockingtrap.name=电击陷阱
levels.traps.shockingtrap.desc=一种储存着大量电能的机关。触发这个陷阱会让它把能量释放出来在附近形成小范围的电能场。

levels.traps.stormtrap.name=雷暴陷阱
levels.traps.stormtrap.desc=一种储存着庞大电能的机关。触发这个陷阱会让它把能量释放出来形成大范围的雷电风暴。

levels.traps.summoningtrap.name=召唤陷阱
levels.traps.summoningtrap.desc=触发这个陷阱将召唤本区域的一些怪物到这里。

levels.traps.teleportationtrap.name=传送陷阱
levels.traps.teleportationtrap.desc=当这种陷阱被触发时，其周遭的所有东西都会被各自传送到本层的随机地点。

levels.traps.tengudarttrap.desc=显然，天狗做了充分的战斗准备。这个陷阱会激活一个隐藏的飞镖发射器，向距离最近且不是天狗的单位发射一枚毒镖。\n\n陷阱的制造技巧极其高深，不使用魔法手段的话，触发装置完全无法找到。不过陷阱在刚被布置的短时间内是可以用肉眼观察到的。

levels.traps.toxictrap.name=毒气陷阱
levels.traps.toxictrap.desc=触发这个陷阱将放出一片有毒气体到这附近。

levels.traps.trap.discover_hint=你可在地牢中随机发现该陷阱，每个区域都会出现不同的陷阱。
levels.traps.trap.rankings_desc=死于%s

levels.traps.corrosiontrap.name=腐蚀酸雾陷阱
levels.traps.corrosiontrap.desc=触发这个陷阱将在附近释放出一片致命的强酸性雾气。

levels.traps.warpingtrap.name=扭曲陷阱
levels.traps.warpingtrap.desc=这种陷阱和传送陷阱颇为相似，不过它还会导致英雄忘却本层的地图与各种东西的方位！

levels.traps.weakeningtrap.name=虚弱陷阱
levels.traps.weakeningtrap.desc=陷阱中的黑暗魔法能够吸取任何接触物里的能量，不过强大的敌人能抵抗这种效果。

levels.traps.worndarttrap.name=老化飞镖陷阱
levels.traps.worndarttrap.ondeath=你被老化飞镖陷阱击杀...
levels.traps.worndarttrap.desc=附近一定藏着一个小型飞镖发射器，激活这个陷阱会导致它向最近的目标射出一个飞镖。\n\n年久失修导致它并不怎么危险，触发机关甚至没有被隐藏起来...



###levels
levels.cavesbosslevel.wires_name=地表导线
levels.cavesbosslevel.wires_desc=被挖掘的地面上露出粗大的导线，这些导线连接着周围的电力装置。\n\n导线中一定有电流流过。DM-300经过时可能会从导线中汲取一些能量。
levels.cavesbosslevel.energy_desc=这里的地面闪烁着电火花，直接踩上去会触电。_电火花似乎都在朝向某个位置..._也许它们指向电源？
levels.cavesbosslevel.gate_name=金属城门
levels.cavesbosslevel.gate_desc=一面高大的金属城门挡住了通往矮人都城的道路。门中间的金属盒嗡嗡作响，想必是与附近的电路与设备相连。也许击败DM-300能开启这扇大门？
levels.cavesbosslevel.gate_desc_broken=这扇大门一定是以某种形式与DM-300相连，因为在DM-300损坏时它也随之爆炸。现在这扇门炸得只剩下零星的碎片。
levels.huntressbosslevel.gate_desc=一面高大的金属城门挡住了通往矮人都城的道路。这扇大门原本可以正常推开，如今却被底下的泥土封固，不论怎么推都纹丝不动。也许击败女猎手？能开启这扇大门？
levels.huntressbosslevel.gate_desc_broken=与女猎手？的战斗结束后，底下的泥土变得松软，这扇大门也因战斗的余波直接崩解了。现在这扇门炸得只剩下零星的碎片。
levels.cavesbosslevel.water_desc=周围奔涌着强大的电流，这里的水可能不太安全...

levels.citybosslevel.throne_name=王座
levels.citybosslevel.throne_desc=这座醒目的高大王座曾是矮人国王的席位，但现在它已属于一位沉湎于力量的死灵法师。\n\n说不清是不是有什么魔法或是机械装置与王座相连，矮人国王在上面坐着时会拥有额外的能力。
levels.citybosslevel.summoning_name=唤灵基座
levels.citybosslevel.summoning_desc=唤灵基座的中央有一个巨大的开口，时不时涌出一些黑暗能量。\n\n矮人国王利用这些基座来聚焦死灵魔法，为其召唤奴仆。召唤物的生成需要一段时间的能量聚集，召唤物的类型取决于聚积于此的魔力。

levels.caveslevel.grass_name=荧光苔藓
levels.caveslevel.high_grass_name=荧光蘑菇
levels.caveslevel.water_name=冰冷水潭
levels.caveslevel.entrance_desc=通向上一层的梯子。
levels.caveslevel.exit_desc=通向下一层的梯子。
levels.caveslevel.high_grass_desc=高耸的蘑菇群遮挡了你的视线。
levels.caveslevel.wall_deco_desc=岩壁上能隐约看见金属矿脉的纹路，难道是黄金？
levels.caveslevel.bookshelf_desc=到底会有谁需要在洞窟里摆上这么个书架？
levels.caveslevel.region_deco_name=金属架构
levels.caveslevel.region_deco_desc=一个大型全金属架构，可能是在矮人过去在此处采矿时建造的。你认为你在其上层看到了早已废弃的矿车轨道。

levels.citylevel.water_name=异色水潭
levels.citylevel.high_grass_name=茂盛花朵
levels.citylevel.entrance_desc=通向上一层的斜坡。
levels.citylevel.exit_desc=通向下一层的斜坡。
levels.citylevel.deco_desc=这里少了一些地砖。
levels.citylevel.sp_desc=厚地毯覆盖着地板。
levels.citylevel.statue_desc=这尊雕像刻画出了一位摆出英勇姿态的矮人。
levels.citylevel.bookshelf_desc=不同学科的书排满了书架。
levels.citylevel.region_deco_name=长明基座
levels.citylevel.region_deco_desc=一个在其上燃有明亮的绿色魔法火焰的凸起基座。火焰是如此致密，好似固化了一般。

levels.hallslevel.water_name=低温岩浆
levels.hallslevel.grass_name=余烬苔藓
levels.hallslevel.high_grass_name=余烬蘑菇
levels.hallslevel.statue_name=台柱
levels.hallslevel.water_desc=看起来如同岩浆一般，不过没有感受到热度，应该可以碰触。
levels.hallslevel.statue_desc=这个柱子由货真价实的人形生物头骨垒成。酷毙了。
levels.hallslevel.bookshelf_desc=用远古语言写就的书籍堆积在书架里。
levels.hallslevel.region_deco_name=岩石瓦砾
levels.hallslevel.region_deco_desc=一块巨石，似乎是从天花板或附近的墙壁上掉下来的。

levels.surfacetownlevel.dungeon_entrance_name=地牢入口
levels.surfacetownlevel.dungeon_entrance_desc=通往地牢的楼梯，已经没有必要再下去了。
levels.surfacetownlevel.tower_entrance_name=高塔入口
levels.surfacetownlevel.tower_entrance_desc=通往高塔的楼梯，最好做足准备再上去。
levels.surfacetownlevel.bookshelf_desc=一些关于科学与魔法的书排满了书架。
levels.surfacetownlevel.region_deco_name=树林
levels.surfacetownlevel.region_deco_desc=一片茂密的树林。穿过整片树林就可以回到城镇，重新过上普通人的生活，但这显然不是你追求的人生。

levels.minigame.extraction.extractionraidlevel.water_name=污浊水潭
levels.minigame.extraction.extractionraidlevel.grass_name=杂草
levels.minigame.extraction.extractionraidlevel.exit_name=传送装置
levels.minigame.extraction.extractionraidlevel.exit_desc=飞船内部的传送装置，在识别到至少一张门禁卡后激活。你需要尽快找到门禁卡并通过它进行安全撤离。
levels.minigame.extraction.extractionraidlevel.cargo_crate_name=飞船货箱
levels.minigame.extraction.extractionraidlevel.cargo_crate_desc=一些装着不知道什么东西的货箱堵住了你的去路。
levels.minigame.extraction.extractionraidlevel.bookshelf_desc=书架上放着一堆看不懂语言的书籍，但大概能看出来都是些船员手册或飞船维修相关的内容。

levels.towers.towerlevel.water_name=高塔水潭
levels.towers.towerlevel.grass_name=高塔杂草
levels.towers.towerlevel.decoration_name=高塔装饰
levels.towers.towerlevel.decoration_desc=只是一些用于装饰高塔房间的物件。
levels.towers.towerlevel.bookshelf_desc=书架上摆满了书籍，尝试将每本翻开都只能看见一片空白。
levels.towers.towerlevel.entrance_desc=通往高塔下层的楼梯。
levels.towers.towerlevel.exit_desc=通往高塔上层的楼梯。


levels.level.hidden_trap=一个隐藏的%s被触发了！
levels.level.chasm_name=深渊
levels.level.floor_name=地板
levels.level.grass_name=草
levels.level.water_name=水潭
levels.level.wall_name=墙壁
levels.level.closed_door_name=关着的门
levels.level.open_door_name=开着的门
levels.level.entrace_name=楼层入口
levels.level.exit_name=楼层出口
levels.level.embers_name=余烬
levels.level.furrowed_grass_name=枯萎的植被
levels.level.locked_door_name=锁着的门
levels.level.crystal_door_name=水晶之门
levels.level.pedestal_name=基座
levels.level.barricade_name=路障
levels.level.high_grass_name=高草
levels.level.locked_exit_name=锁着的楼层出口
levels.level.unlocked_exit_name=开放的楼层出口
levels.level.well_name=井
levels.level.empty_well_name=干涸的井
levels.level.statue_name=雕像
levels.level.inactive_trap_name=已触发的陷阱
levels.level.bookshelf_name=书架
levels.level.alchemy_name=炼金釜
levels.level.default_name=???
levels.level.chasm_desc=你看不到底。
levels.level.water_desc=进入水潭中可熄灭身上的火焰。
levels.level.entrance_desc=通向上一层的楼梯。
levels.level.exit_desc=通向下一层的楼梯。
levels.level.embers_desc=地上散落着余烬。
levels.level.high_grass_desc=茂密的植被遮挡了你的视线。
levels.level.locked_door_desc=这扇门锁着，而你需要匹配的钥匙才能打开它。
levels.level.crystal_door_desc=这扇锁着的门由魔力水晶铸造而成。你的视线可以穿过它，但你的身体不能，还是找找对应的水晶钥匙吧。
levels.level.locked_exit_desc=沉重的铁栏杆封锁住了通往下一层的楼梯。
levels.level.barricade_desc=木栅栏依然坚固，但早已风干多年。或许可以点燃烧掉？
levels.level.inactive_trap_desc=这个陷阱已经被触发过了，现在一点也不危险。
levels.level.statue_desc=有人想装饰一下这里，很显然，它没能成功...
levels.level.alchemy_desc=这口炼金釜中充满了魔力之水。物品可以在里面共炼以制造新的物品。
levels.level.empty_well_desc=这座井已经枯竭了。

levels.level$feeling.chasm_title=深渊层
levels.level$feeling.sky_island_title=空岛层
levels.level$feeling.barren_title=荒芜层
levels.level$feeling.chaos_title=混沌层
levels.level$feeling.water_title=流水层
levels.level$feeling.grass_title=草木层
levels.level$feeling.dark_title=黑暗层
levels.level$feeling.large_title=广阔层
levels.level$feeling.traps_title=陷阱层
levels.level$feeling.secrets_title=隐秘层
levels.level$feeling.chasm_desc=你的脚步声在楼层中回荡不绝。
levels.level$feeling.sky_island_desc=这一楼层的房间如岛屿般悬于深渊之上，彼此之间没有任何连接。
levels.level$feeling.barren_desc=这一楼层的地面没有任何水源，也看不到草木生长的痕迹。
levels.level$feeling.chaos_desc=这一楼层的环境十分混沌，物理与魔法的法则都相互颠倒了。
levels.level$feeling.water_desc=你听到周围水花四处飞溅的声音。
levels.level$feeling.grass_desc=浓郁的草木气息弥漫在空气中。
levels.level$feeling.dark_desc=你能听到敌人在暗中潜伏的声音。
levels.level$feeling.large_desc=这一楼层的规模似乎不同寻常的广阔。
levels.level$feeling.traps_desc=这一楼层的地面陷阱密布，暗藏杀机。
levels.level$feeling.secrets_desc=这一楼层的气氛暗示着潜藏其中的秘密。

levels.mininglevel.wall_desc=不算太硬的平整岩壁。你可以用镐子挖过去，只是这样做很费力，会使你饿得更快。
levels.mininglevel.gold_extra_desc=你也许能用镐子把它挖出来。
levels.mininglevel.crystal_name=水晶尖刺
levels.mininglevel.boulder_name=岩砾
levels.mininglevel.crystal_desc=这里冒出了一个硕大的彩色水晶。这种水晶很脆弱，可以使用镐子轻易地破坏掉。挖掘其临近位置也可以将其破坏。
levels.mininglevel.boulder_desc=这里有一块巨大的岩砾阻挡了去路。用镐子应当可以轻易地破坏掉它。
levels.mininglevel.barricade_desc=此处的木栅栏稳当地嵌入了矿层中，充当着矿层顶部的支撑。\n\n这些设施大概是豺狼人为了防止落石做制的临时设施。_所有相邻的地格都不会受到落石攻击与陷阱的影响。_\n\n不过看起来和地牢各处见到的木栅栏一样，应该也是能烧起来的。

levels.prisonlevel.water_name=阴冷水潭
levels.prisonlevel.empty_deco_desc=其上仍残留着干涸的血迹。
levels.prisonlevel.bookshelf_desc=这个书架可能是监狱图书馆的残留物。烧掉怎么样？
levels.prisonlevel.region_deco_name=监狱牢笼
levels.prisonlevel.region_deco_desc=恰好能装下一个人的金属牢笼。它似乎被某种方式锁在了地上，根本无法移动。
levels.prisonlevel.region_deco_alt_name=悬吊牢笼
levels.prisonlevel.region_deco_alt_desc=恰好能容纳一个人的金属牢笼，以铁索悬吊于深渊之上。

levels.sewerlevel.water_name=浑浊水潭
levels.sewerlevel.empty_deco_desc=潮湿且发黄的苔藓覆盖其上。
levels.sewerlevel.bookshelf_desc=这个书架塞满了没用的成功学书籍。烧掉怎么样？
levels.sewerlevel.region_deco_name=储物木桶
levels.sewerlevel.region_deco_desc=一个几乎和你差不多大的木桶。里面肯定装满了什么东西，重得搬不动。

levels.prisonnewbosslevel$diedtengu.name=天狗的尸体
levels.prisonnewbosslevel$diedtengu.desc=一个著名的神秘刺客，你了解他的故事并为此做足了准备，此刻却只看见了他的尸体。\n\n令人奇怪的是，本应在他脸上的那副面具消失了，贸然前去查看或许十分危险，可眼下你也没有任何退路了。

levels.surfacetownlevel.tower_entry_title=无尽高塔
levels.surfacetownlevel.tower_entry_desc=这座直入云霄的高塔自开放以来，便吸引了无数冒险家前来挑战。来历成谜的建筑之内涌动着一股奇异的意志，它侵蚀血肉，扭曲心智，将无数陨落的探索者变为塔中徘徊的怪物。无尽的财富...禁忌的魔法...失落的秘密...形形色色的传说引诱着一批又一批来客踏入其中，却鲜少有人能平安归来。\n\n如今你站在入口处，感觉得到阴冷的气息自上方漫出。前路吉凶未卜，但新的冒险就在眼前，若要因为难以活着离开就放弃挑战固然明智...但这是，弱者的思维。\n\n_进入这座高塔后将无法返回地表。_你确定现在就要进入高塔吗？
levels.surfacetownlevel.tower_entry_enter=我进塔！
levels.surfacetownlevel.tower_entry_cancel=再准备一下
levels.surfacetownlevel.tower_healing_limit=一股神秘的力量阻止你携带超过%d瓶治疗药剂进入高塔。看来你需要先整理多余的药剂才能进入。
levels.towers.towerlevel.surface_blocked=通往地表的楼梯口被封死了。
levels.traps.plaguebrazier.name=灾疫净化器
levels.traps.plaguebrazier.desc=触发这个净化器会清除大范围的瘴气、污水和生物身上的疫病，并对瘟疫骑士造成大量伤害。但已被击倒的瘟疫守卫也会因此迅速复原。\n\n如果场上存在尚可活动的瘟疫守卫，净化器就无法正常触发。\n\n净化器每次触发后都会随机转移位置，并需要在瘟疫骑士行动12次后才能再次触发。
levels.towers.pestilencearenacontroller.prelude=房间被完全封闭了。铺天盖地的苍白瘴气之间尚留有一条安全的道路，通往了左侧的灾疫净化器。
levels.towers.pestilencearenacontroller.purifier_start=灾疫净化器抹去了苍白瘴气。瘟疫骑士应召现身！
levels.towers.pestilencearenacontroller.purifier_strike=灾疫净化器清除了大范围的瘴气、污水和你身上的疫病，并从瘟疫骑士身上剥离了%d点生命。灾疫净化器已被转移到其他位置。
levels.towers.pestilencearenacontroller.recharging=灾疫净化器正在充能，还需要瘟疫骑士行动%d次才能被再次触发。
levels.towers.pestilencearenacontroller.guard_blocked=场上仍有尚可活动的瘟疫守卫，无法触发灾疫净化器。


