###features
levels.features.chasm.chasm=Gouffre
levels.features.chasm.yes=Oui, je sais ce que je fais
levels.features.chasm.no=Non, j'ai changé d'avis
levels.features.chasm.jump=Voulez-vous vraiment sauter dans le gouffre ? Une chute de cette hauteur sera douloureuse.
levels.features.chasm.ondeath=Vous êtes mort de votre chute...
levels.features.chasm.rankings_desc=Mort à l'impact.



###rooms
levels.rooms.special.magicalfireroom$eternalfire.desc=Un épais mur de feu vert se tient là, sans doute grâce à la magie. Il est si dense que vous ne pouvez pas passer au travers, et il enflamme tout ce qui s'approche trop. Le feu ne semble pas brûler de manière naturelle, vous devrez utiliser quelque chose pour l'éteindre.

levels.rooms.special.sentryroom$sentry.name=sentinelle rouge
levels.rooms.special.sentryroom$sentry.desc=Cette sentinelle rouge sang semble garder le trésor de l'autre côté de cette salle. Elle tirera des rayons de désintégration si vous pénétrez la zone qu'elle défend.\n\nElle est immunisée contre les effets négatifs et peut voir au travers de l'invisibilité, mais semble prendre du temps pour charger avant de tirer.\n\nD'une manière ou d'une autre, la sentinelle n'attaque que vous, comme si elle savait que les habitants du donjon n'étaient pas une menace pour le trésor.

levels.rooms.special.toxicgasroom$toxicvent.name=conduite de gaz toxique
levels.rooms.special.toxicgasroom$toxicvent.desc=Un aventurier malchanceux a sûrement activé ce piège des années auparavant. En dépit de son état inactif, il continue de répandre un gaz toxique dans la pièce et n'a pas l'air de s'arrêter. Vous aurez besoin de quelque chose pour vous protéger du gaz si vous voulez explorer cette pièce.

levels.rooms.special.weakfloorroom$hiddenwell.name=Puits profond
levels.rooms.special.weakfloorroom$hiddenwell.desc=Vous distinguez seulement un puits dans les profondeurs, peut-être y a-t-il quelque chose d'intéressant en bas ?

levels.rooms.quest.blacksmithroom$questentrance.name=Entrée de la mine
levels.rooms.quest.blacksmithroom$questentrance.desc=Cette échelle mène à une ancienne mine juste en dessous de l’atelier du forgeron.

levels.rooms.quest.ritualsiteroom$ritualmarker.name=Marque rituelle
levels.rooms.quest.ritualsiteroom$ritualmarker.desc=Une marque peinte pour un rituel obscur. Des bougies y sont habituellement placées aux quatre angles.

levels.rooms.quest.massgraveroom$bones.name=Fosse commune
levels.rooms.quest.massgraveroom$bones.desc=Des os recouvrent le sol, qu'est-il arrivé ici ?

levels.rooms.quest.mineentrance$questexit.name=Sortie de la mine
levels.rooms.quest.mineentrance$questexit.desc=Cette échelle mène en dehors de la mine, dans l’atelier du forgeron.

###traps
levels.traps.alarmtrap.name=Piège à alarme
levels.traps.alarmtrap.alarm=Le piège émet un son perçant qui se réverbère dans le donjon !
levels.traps.alarmtrap.desc=Ce piège semble lié à un mécanisme d'alarme bruyante. Le déclencher va probablement alerter tout ce qui se trouve à cet étage.

levels.traps.blazingtrap.name=Piège de flammes
levels.traps.blazingtrap.desc=Activer ce piège déclenchera une puissante charge chimique qui enflammera la zone alentour.

levels.traps.burningtrap.name=piège de feu
levels.traps.burningtrap.desc=Marcher sur ce piège enflammera un mélange de produits chimiques, mettant le feu à la zone environnante.

levels.traps.chillingtrap.name=Piège de froid
levels.traps.chillingtrap.desc=Lorsqu'il est activé, les produits chimiques de ce piège vont rapidement geler l'air aux alentours.

levels.traps.confusiontrap.name=Piège à gaz de confusion
levels.traps.confusiontrap.desc=Activer ce piège remplira l'espace alentour de gaz de confusion.

levels.traps.cursingtrap.name=piège de malédiction
levels.traps.cursingtrap.curse=Vos objets équipés sont maudits !
levels.traps.cursingtrap.desc=Ce piège contient la même magie malveillante trouvée dans un équipement maudit. L'activer maudira certains objets dans les alentours immédiats.

levels.traps.disarmingtrap.name=Piège de désarmement
levels.traps.disarmingtrap.disarm=Votre arme est téléportée ailleurs !
levels.traps.disarmingtrap.desc=Ce piège contient une magie de téléportation très spéciale qui enverra l'arme de sa victime ailleurs.

levels.traps.disintegrationtrap.name=Piège de désintégration
levels.traps.disintegrationtrap.one=Le piège désintègre votre %s !
levels.traps.disintegrationtrap.some=Le piège désintègre certains de vos %s !
levels.traps.disintegrationtrap.ondeath=Vous avez été tué par le piège de désintégration...
levels.traps.disintegrationtrap.desc=Lorsqu'il est déclenché, ce piège va envoyer des rayons de désintégration à la cible la plus proche, infligeant des dégâts importants et détruisant des objets.\n\nHeureusement, le mécanisme de déclenchement n'est pas caché.

levels.traps.distortiontrap.name=Piège de distorsion
levels.traps.distortiontrap.desc=Construit à partir d'une magie inconnue, ce piège va invoquer toutes sortes de créatures jusqu'à vous.

levels.traps.explosivetrap.name=Piège explosif
levels.traps.explosivetrap.desc=Ce piège contient de la poudre explosive et un mécanisme de mise à feu. L'activer provoquera une explosion dans la zone alentour.

levels.traps.flashingtrap.name=Piège éblouissant
levels.traps.flashingtrap.desc=Lorsqu'il est activé, ce piège va allumer une puissante poudre explosive stockée à l'intérieur, ce qui va temporairement aveugler, estropier et blesser sa victime.\n\nCe piège doit avoir un grand stock de poudre, car il peut être activé de nombreuses fois sans casser.

levels.traps.flocktrap.name=Piège à moutons
levels.traps.flocktrap.desc=Peut-être est-ce une farce d'un mage amateur ? Activer ce piège créera un troupeau de moutons magiques.

levels.traps.frosttrap.name=Piège de gel
levels.traps.frosttrap.desc=Lorsqu'il est activé, les produits chimiques de ce piège vont rapidement geler l'air dans une grande zone aux alentours.

levels.traps.gatewaytrap.name=Piège portail
levels.traps.gatewaytrap.desc=Ce piège de téléportation est spécial : il peut s'activer indéfiniment et vous téléporte à chaque fois au même endroit.

levels.traps.geysertrap.name=Piège à geyser
levels.traps.geysertrap.desc=Une fois ce piège activé, un geyser va jaillir, ce qui blesse les ennemis ardents, éjecte tous les personnages alentour, éteint les feux et recouvre le terrain d'eau.

levels.traps.gnollrockfalltrap.name=piège d'avalanche gnoll
levels.traps.gnollrockfalltrap.desc=Ce piège d'avalanche est en partie magique. Quand il est déclenché, des pierres vont se décrocher et tomberont immédiatement dans une zone de 5x5 autour du piège. Comme les roches de cette région sont plus tendres, elles ne feront pas autant de dégâts qu'un piège d'avalanche classique, mais l'armure ne sera pas aussi efficace pour s'en protéger. Les barricades soutenant le plafond, les roches ne tomberont pas sur les cases à côté d'elles.\n\n_Ce piège ne différencie pas les amis des ennemis, et sera tout aussi dangereux pour les gnolls qu'il l'est pour vous._

levels.traps.grimtrap.name=Piège macabre
levels.traps.grimtrap.ondeath=Vous avez été tué dans l'explosion du piège macabre.
levels.traps.grimtrap.desc=Une magie destructrice extrêmement puissante est stockée dans ce piège, suffisante pour tuer sur-le-champ tous les héros, sauf les plus résistants. Activer ce piège enverra un rayon de magie mortelle vers le personnage le plus proche.\n\nHeureusement, le mécanisme de déclenchement n'est pas caché.

levels.traps.grippingtrap.name=Piège barbelé
levels.traps.grippingtrap.desc=Ce piège se referme sur les pieds de celui qui le déclenche, le blessant et ralentissant son déplacement.\n\nGrâce à sa conception simple, ce piège peut se déclencher de nombreuses fois sans se casser.

levels.traps.guardiantrap.name=Piège du gardien
levels.traps.guardiantrap.alarm=Le piège émet un son perçant qui se réverbère dans le donjon !
levels.traps.guardiantrap.desc=Ce piège est relié à un drôle de mécanisme qui invoquera des gardiens et alertera tous les ennemis du niveau.
levels.traps.guardiantrap$guardian.name=gardien invoqué
levels.traps.guardiantrap$guardian.desc=Cette apparition bleue semble être un reflet invoqué de l'un des gardiens de pierre du donjon.
levels.traps.guardiantrap$guardian.desc_weapon=Bien que la statue elle-même soit presque immatérielle, l'arme qu'elle brandit (_%s_) semble réelle.

levels.traps.oozetrap.name=Piège de vase
levels.traps.oozetrap.desc=Ce piège aspergera de la vase caustique à l'activation. La vase brûlera jusqu'à ce qu'elle soit nettoyée.

levels.traps.pitfalltrap.name=Piège à trappe
levels.traps.pitfalltrap.triggered_hero=Le sol commence à s'effondrer autour de vous !
levels.traps.pitfalltrap.triggered=Le sol commence à s'effondrer autour du piège déclenché !
levels.traps.pitfalltrap.no_pit=Le sol est ici trop solide pour y mettre un piège.
levels.traps.pitfalltrap.desc=Ce piège est connecté à un système de trappes qui, peu après s'être déclenché va faire tomber tout ce qui se trouve dessus ! Cependant, il ne marche pas dans les endroits avec les sols les plus solides.

levels.traps.poisondarttrap.name=Piège à fléchettes empoisonnées
levels.traps.poisondarttrap.ondeath=Le piège à fléchette empoisonnée vous a tué...
levels.traps.poisondarttrap.desc=Un petit lanceur de fléchettes doit être caché à proximité, le déclenchement de ce piège l'amènera à lancer une fléchette empoisonnée à la cible la plus proche.\n\nHeureusement le mécanisme de déclenchement n'est pas caché.

levels.traps.rockfalltrap.name=Piège d'avalanche
levels.traps.rockfalltrap.ondeath=Vous avez été écrasé par une chute de pierres...
levels.traps.rockfalltrap.desc=Ce piège est raccordé à un ensemble de rochers vacillants, l'enclencher causera la chute des rochers qui viendront s'écrabouiller dans toute la pièce !\n\nHeureusement, le mécanisme de déclenchement n'est pas caché.

levels.traps.shockingtrap.name=Piège choquant
levels.traps.shockingtrap.desc=Un mécanisme contenant une importante quantité d'énergie. Déclencher ce piège libèrera cette énergie dans la zone environnante.

levels.traps.stormtrap.name=Piège d'orage
levels.traps.stormtrap.desc=Un mécanisme contenant une énorme quantité d'énergie. Déclencher ce piège libèrera cette énergie sous forme d'un grand orage électrique.

levels.traps.summoningtrap.name=Piège d'invocation
levels.traps.summoningtrap.desc=Activer ce piège invoquera un certain nombre des monstres de ce niveau.

levels.traps.teleportationtrap.name=Piège de téléportation
levels.traps.teleportationtrap.desc=À chaque fois que ce piège est activé, tout ce qui se trouve autour est téléporté aléatoirement dans le niveau.

levels.traps.tengudarttrap.desc=Tengu s’est clairement préparé pour un combat. Ce piège activera un souffleur de fléchettes caché qui tirera une fléchette empoisonnée à la chose la plus proche qui n’est pas Tengu.\n\nLe piège est si bien fait que le mécanisme de déclenchement est impossible à détecter sans aide magique. Cependant, le piège est visible pendant un moment quand il est posé.

levels.traps.toxictrap.name=Piège de gaz toxique
levels.traps.toxictrap.desc=Activer ce piège emplira l'espace avoisinant de gaz toxique.

levels.traps.trap.rankings_desc=Tué par : %s

levels.traps.corrosiontrap.name=Piège de gaz corrosif
levels.traps.corrosiontrap.desc=Déclencher ce piège libèrera un gaz acide mortel dans les environs immédiats.

levels.traps.warpingtrap.name=Piège de déplacement
levels.traps.warpingtrap.desc=Tout ce qui active ce piège sera téléporté dans un autre lieu de ce niveau, mais en plus le héros oubliera la disposition du niveau.

levels.traps.weakeningtrap.name=Piège affaiblissant
levels.traps.weakeningtrap.desc=La magie contenue dans ce piège dévore l'énergie de tout ce qui rentre en contact avec elle. Cependant, les puissants ennemis devraient tenir le coup.

levels.traps.worndarttrap.name=piège à fléchettes usé
levels.traps.worndarttrap.ondeath=Le piège à fléchette usé vous a tué...
levels.traps.worndarttrap.desc=Un petit lance-fléchettes est caché à proximité, déclencher ce piège en projettera une sur la cible la plus proche.\n\nA cause de sa vétusté il n'est cependant plus très dangereux et il n'est même plus caché...



###levels
levels.cavesbosslevel.wires_name=Câbles dénudés
levels.cavesbosslevel.wires_desc=Le sol est partiellement creusé ici, montrant de gros fils exposés. Ils doivent connecter le réseau électrique circulant dans cette zone.\n\nLes fils semblent être traversés par du courant. Si le DM-300 marche ici, il pourra peut-être en tirer de l'électricité.
levels.cavesbosslevel.energy_desc=Le sol ici est étincelant d'électricité, il est dangereux de marcher dessus. _Les étincelles semblent graviter dans une certaine direction..._ peut-être qu'elles mènent à la source d'alimentation ?
levels.cavesbosslevel.gate_name=Portail de métal
levels.cavesbosslevel.gate_desc=Une grande porte métallique qui bloque le chemin menant à la métropole naine. Le boîtier métallique au centre produit un bruit lourd, il doit être connecté aux circuits et aux machines à proximité. Peut-être que détruire le DM-300 ouvrira la porte ?
levels.cavesbosslevel.gate_desc_broken=La porte doit avoir été connectée au DM-300 d'une manière ou d'une autre, car elle a explosé lorsque le DM-300 a été vaincu. Il n'en reste plus que quelques barres de fer brisées.
levels.cavesbosslevel.water_desc=Avec toute cette électricité dans l'air, l'eau pourrait être dangereuse...

levels.citybosslevel.throne_name=Trône
levels.citybosslevel.throne_desc=Cet impressionnant trône est le siège de l'empire nain, désormais utilisé par un nécromancien fou de pouvoir.\n\nIl doit y avoir des pièces magiques ou mécaniques sur le trône, le roi des nains semble acquérir une puissance supplémentaire lorsqu'il est dessus.
levels.citybosslevel.summoning_name=Piédestal d'invocation
levels.citybosslevel.summoning_desc=Ce piédestal a une grande ouverture au centre, qui rayonne d'une énergie sombre.\n\nLe roi des nains utilise ces piédestaux comme points centraux pour sa magie nécromantique et pour invoquer des serviteurs. Le piédestal doit charger pendant quelques tours avant que le serviteur n'apparaisse, et le type de serviteur invoqué dépend du pouvoir magique s'y accumulant.

levels.caveslevel.grass_name=Mousse fluorescente
levels.caveslevel.high_grass_name=Champignons fluorescents
levels.caveslevel.water_name=Eau glaciale
levels.caveslevel.entrance_desc=L'échelle mène au niveau supérieur.
levels.caveslevel.exit_desc=L'échelle descend au niveau suivant.
levels.caveslevel.high_grass_desc=D'immenses champignons bloquent la vue.
levels.caveslevel.wall_deco_desc=Une veine de minerai est visible dans le mur. De l'or ?
levels.caveslevel.bookshelf_desc=Qui aurait besoin d'une bibliothèque dans une grotte ?

levels.citylevel.water_name=Eau de couleur douteuse
levels.citylevel.high_grass_name=Grandes fleurs épanouies
levels.citylevel.entrance_desc=Une rampe mène au niveau supérieur.
levels.citylevel.exit_desc=Une rampe descend au niveau inférieur.
levels.citylevel.deco_desc=Des carreaux manquent au sol.
levels.citylevel.sp_desc=Un épais tapis recouvre le sol.
levels.citylevel.statue_desc=La statue représente un nain dans une pose héroïque.
levels.citylevel.bookshelf_desc=Des rangées de livres sur des sujets variés emplissent les étagères.

levels.hallslevel.water_name=Lave froide
levels.hallslevel.grass_name=Braisemousse
levels.hallslevel.high_grass_name=Braisechampignon
levels.hallslevel.statue_name=Pilier
levels.hallslevel.water_desc=Ça ressemble à de la lave froide, c'est probablement sans danger de la toucher.
levels.hallslevel.statue_desc=Ces piliers sont faits de vrais crânes humanoïdes. Génial.
levels.hallslevel.bookshelf_desc=Des livres en langages anciens sont tassés dans la bibliothèque.

levels.level.hidden_trap=Un %s caché se déclenche !
levels.level.chasm_name=Gouffre
levels.level.floor_name=Sol
levels.level.grass_name=Herbe
levels.level.water_name=Eau
levels.level.wall_name=Mur
levels.level.closed_door_name=Porte close
levels.level.open_door_name=Porte ouverte
levels.level.entrace_name=Entrée du niveau
levels.level.exit_name=Sortie du niveau
levels.level.embers_name=Braises
levels.level.furrowed_grass_name=Végétation sillonnée
levels.level.locked_door_name=Porte verrouillée
levels.level.crystal_door_name=Porte de cristal
levels.level.pedestal_name=Piédestal
levels.level.barricade_name=Barricade
levels.level.high_grass_name=Hautes herbes
levels.level.locked_exit_name=Sortie du niveau verrouillée
levels.level.unlocked_exit_name=Sortie du niveau ouverte
levels.level.well_name=Puits
levels.level.empty_well_name=Puits vide
levels.level.statue_name=Statue
levels.level.inactive_trap_name=Piège déclenché
levels.level.bookshelf_name=Bibliothèque
levels.level.alchemy_name=Chaudron d'alchimie
levels.level.default_name=???
levels.level.chasm_desc=Vous ne voyez pas le fond.
levels.level.water_desc=En cas de feu, marchez dans l'eau pour l'éteindre.
levels.level.entrance_desc=Ces escaliers mènent au niveau supérieur.
levels.level.exit_desc=Ces escaliers descendent au niveau suivant.
levels.level.embers_desc=Des braises couvrent le sol.
levels.level.high_grass_desc=Une végétation épaisse bloque la vue.
levels.level.locked_door_desc=La porte est verrouillée, vous devez trouver la bonne clé pour l'ouvrir.
levels.level.crystal_door_desc=Cette porte est faite de cristal magique. Vous pouvez voir au travers, mais vous aurez besoin d'une clef de cristal pour l'ouvrir.
levels.level.locked_exit_desc=De lourdes grilles bloquent les escaliers qui descendent.
levels.level.barricade_desc=La cloison de bois est fermement fixée mais a séché au fil du temps. Pourrait-elle brûler ?
levels.level.inactive_trap_desc=Le piège a déjà été activé et ne présente plus de danger.
levels.level.statue_desc=Quelqu'un a tenté de décorer cet endroit, mais n'y est visiblement pas parvenu.
levels.level.alchemy_desc=Ce chaudron déborde d'eau magique. Les objets peuvent être mélangés dans le chaudron pour en créer de nouveaux !
levels.level.empty_well_desc=Le puits s'est asséché.

levels.level$feeling.chasm_title=étage effondré
levels.level$feeling.water_title=étage inondé
levels.level$feeling.grass_title=étage herbeux
levels.level$feeling.dark_title=étage sombre
levels.level$feeling.large_title=étage étendu
levels.level$feeling.traps_title=étage piégé
levels.level$feeling.secrets_title=étage à secrets
levels.level$feeling.chasm_desc=L'écho de vos pas résonne à travers le donjon.
levels.level$feeling.water_desc=Vous entendez des bruits d'eau tout autour de vous.
levels.level$feeling.grass_desc=Vous sentez une forte odeur de végétation dans l'air.
levels.level$feeling.dark_desc=Vous entendez vos ennemis se déplacer dans l'obscurité.
levels.level$feeling.large_desc=Cet étage du donjon semble inhabituellement grand.
levels.level$feeling.traps_desc=Le sol semble particulièrement traître ici.
levels.level$feeling.secrets_desc=L'atmosphère particulière vous laisse deviner que ce niveau recèle de nombreux secrets.

levels.mininglevel.wall_desc=Une paroi rocheuse lisse, un peu plus molle que d'habitude. Vous pouvez la traverser à l'aide de votre pioche, mais cela vous demandera un certain effort et augmentera un peu votre faim.
levels.mininglevel.gold_extra_desc=Vous pouvez probablement la miner avec votre pioche.
levels.mininglevel.crystal_name=Pic de cristal
levels.mininglevel.boulder_name=Rocher
levels.mininglevel.crystal_desc=Il y a ici une grande structure en cristal coloré. Ces cristaux sont fragiles et se brisent facilement avec une pioche ou en minant quelque chose à côté.
levels.mininglevel.boulder_desc=Il y a un énorme rocher qui bloque le passage. Une pioche devrait facilement le casser.
levels.mininglevel.barricade_desc=La barricade en bois est correctement installée et constitue un support pour le plafond.\n\nElle a probablement été construite par les gnolls pour prévenir les éboulements. _Toutes les cases adjacentes sont protégées des pièges et attaques d'avalanche._\n\nÇa a l'air de pouvoir brûler aussi bien qu'une autre barricade.

levels.prisonlevel.water_name=Eau froide et opaque
levels.prisonlevel.empty_deco_desc=Il y a de vieilles tâches de sang sur le sol.
levels.prisonlevel.bookshelf_desc=C'est probablement les vestiges de la bibliothèque de la prison. Est-ce que ça brûle ?

levels.sewerlevel.water_name=Eau sombre
levels.sewerlevel.empty_deco_desc=De la mousse jaunâtre couvre le sol.
levels.sewerlevel.bookshelf_desc=La bibliothèque est remplie de livres bon marché et sans intérêt. Est-ce que ça brûle ?
levels.minigame.extraction.mobs.chronosuccubus.discover_hint=Vous pouvez найти этого ennemi pendant une certaine quête.
levels.minigame.extraction.mobs.deferredscorpio.discover_hint=Vous pouvez trouver cet ennemi pendant une certaine quête.
levels.minigame.extraction.mobs.vaultarmoredstatue.discover_hint=Vous pouvez trouver cet ennemi pendant une certaine quête.
levels.minigame.extraction.mobs.veilbreakereye.discover_hint=Vous pouvez trouver cet ennemi pendant une certaine quête.
levels.caveslevel.region_deco_desc=Une grande structure entièrement métallique, probablement construite par les nains lorsqu’ils exploitaient la mine. Des rails de wagonnets abandonnés sont peut-être visibles aux niveaux supérieurs.
levels.caveslevel.region_deco_name=structure métallique
levels.citylevel.region_deco_desc=Un piédestal surélevé surmonté d’une flamme magique vert vif. La flamme est si dense qu’elle semble presque solide.
levels.citylevel.region_deco_name=piédestal éternellement ardent
levels.hallslevel.region_deco_desc=Une énorme pierre qui semble être tombée du plafond ou d’un mur proche.
levels.hallslevel.region_deco_name=débris rocheux
levels.huntressbosslevel.gate_desc=Une haute porte métallique bloque la route vers la cité naine. La terre a scellé sa base et elle est impossible à pousser. Peut-être que vaincre la Chasseresse ? l’ouvrira.
levels.huntressbosslevel.gate_desc_broken=Après le combat contre la Chasseresse ?, la terre sous la porte s’est détachée et le combat l’a brisée. Il n’en reste que des fragments.
levels.level$feeling.barren_desc=Ni eau ni végétation ne pousse sur cet étage désolé.
levels.level$feeling.barren_title=étage stérile
levels.level$feeling.chaos_desc=Sur cet étage, les dégâts physiques et magiques échangent leur nature.
levels.level$feeling.chaos_title=étage du chaos
levels.level$feeling.sky_island_desc=Les salles flottent au-dessus de l’abîme, sans pont entre elles.
levels.level$feeling.sky_island_title=étage des îles célestes
levels.minigame.extraction.extractionraidlevel.bookshelf_desc=Ces livres sont écrits dans une langue inconnue. Ce sont apparemment des manuels d’équipage et d’entretien des vaisseaux.
levels.minigame.extraction.extractionraidlevel.cargo_crate_desc=Des caisses remplies d’une cargaison inconnue bloquent votre chemin.
levels.minigame.extraction.extractionraidlevel.cargo_crate_name=caisse de cargaison
levels.minigame.extraction.extractionraidlevel.exit_desc=Le téléporteur du vaisseau s’active après avoir reconnu au moins une carte d’accès. Trouvez-en une pour évacuer en sécurité.
levels.minigame.extraction.extractionraidlevel.exit_name=téléporteur
levels.minigame.extraction.extractionraidlevel.grass_name=mauvaises herbes
levels.minigame.extraction.extractionraidlevel.water_name=bassin pollué
levels.prisonlevel.region_deco_alt_desc=Une cage métallique juste assez grande pour une personne, suspendue par des chaînes au-dessus du gouffre.
levels.prisonlevel.region_deco_alt_name=cage suspendue
levels.prisonlevel.region_deco_desc=Une cage métallique juste assez grande pour une personne. Elle semble verrouillée au sol et ne bouge pas.
levels.prisonlevel.region_deco_name=cage de prison
levels.prisonnewbosslevel$diedtengu.desc=Un assassin célèbre et mystérieux. Vous connaissez son histoire et vous étiez préparé, mais il ne reste que son cadavre.\n\nÉtrangement, le masque qui devait couvrir son visage a disparu. L’examiner imprudemment pourrait être dangereux, mais il n’y a plus de retour possible.
levels.prisonnewbosslevel$diedtengu.name=cadavre de Tengu
levels.rooms.special.sentryroom$sentry.discover_hint=Vous pouvez trouver cet ennemi dans toute région du donjon.
levels.sewerlevel.region_deco_desc=Un tonneau en bois presque aussi grand que vous. Il doit être plein, car il est trop lourd pour être déplacé.
levels.sewerlevel.region_deco_name=baril de stockage
levels.surfacetownlevel.bookshelf_desc=Les étagères sont remplies de livres sur la science et la magie.
levels.surfacetownlevel.dungeon_entrance_desc=Des escaliers mènent au donjon. Il n’est pas nécessaire de redescendre.
levels.surfacetownlevel.dungeon_entrance_name=entrée du donjon
levels.surfacetownlevel.region_deco_desc=Une forêt dense. Au-delà se trouvent la ville et une vie ordinaire, mais ce n’est pas celle que vous cherchez.
levels.surfacetownlevel.region_deco_name=bois
levels.surfacetownlevel.tower_entrance_desc=Des escaliers mènent à la tour. Préparez-vous bien : une fois dedans, vous ne pourrez plus revenir à la surface.
levels.surfacetownlevel.tower_entrance_name=entrée de la tour
levels.surfacetownlevel.tower_entry_cancel=Annuler
levels.surfacetownlevel.tower_entry_enter=Entrer
levels.surfacetownlevel.tower_entry_title=entrer dans la haute tour
levels.surfacetownlevel.tower_healing_limit=Vous pouvez apporter au plus %d potions de soins dans la tour. Rangez ou utilisez le surplus.
levels.towers.pestilencearenacontroller.guard_blocked=Vainquez ou désactivez chaque garde de peste actif avant d’utiliser le purificateur.
levels.towers.pestilencearenacontroller.prelude=L’arène se scelle. Un chemin sûr traverse une mer impossible de miasmes pâles vers le purificateur à gauche.
levels.towers.pestilencearenacontroller.purifier_start=Le purificateur efface les miasmes pâles. Le Chevalier de la peste relève le défi !
levels.towers.pestilencearenacontroller.purifier_strike=Le purificateur nettoie l’arène, retire %d PV au Chevalier de la peste puis se déplace.
levels.towers.pestilencearenacontroller.recharging=Le purificateur recharge encore : il reste %d actions du boss.
levels.surfacetownlevel.tower_entry_desc=Une fois dans la haute tour, vous ne pourrez plus revenir à l’étage 0. Voulez-vous continuer ?
levels.towers.towerlevel.bookshelf_desc=Les étagères sont pleines de livres, mais chaque livre ouvert ne contient que des pages blanches.
levels.towers.towerlevel.decoration_desc=Objets servant à décorer les salles de la tour.
levels.towers.towerlevel.decoration_name=décoration de la tour
levels.towers.towerlevel.entrance_desc=Escaliers menant à l’étage inférieur de la tour.
levels.towers.towerlevel.exit_desc=Escaliers menant à l’étage supérieur de la tour.
levels.towers.towerlevel.grass_name=mauvaises herbes de la tour
levels.towers.towerlevel.surface_blocked=Depuis la haute tour, aucun chemin ne revient à l’étage 0.
levels.towers.towerlevel.water_name=bassin de la tour
levels.traps.abyssexplosivetrap.desc=Ce piège de la tour flotte au-dessus d’un gouffre et détonne dès qu’une créature entre dans sa case. La lévitation ne protège pas du déclenchement et les créatures sans vol peuvent tomber après l’explosion.
levels.traps.abyssexplosivetrap.discover_hint=Vous pouvez trouver ce piège aléatoirement dans la tour.
levels.traps.abyssexplosivetrap.name=piège explosif abyssal
levels.traps.cursedflametrap.desc=Ce piège fonctionne comme un piège de feu, mais il est chargé d’une énergie d’âme malveillante. Son activation embrase une zone voisine de feu maudit.
levels.traps.cursedflametrap.name=piège de flamme maudite
levels.traps.digestiontrap.desc=À son déclenchement, ce piège envoie tous les objets des tas au sol vers un étage adjacent aléatoire de la tour. Les potions et graines sont transportées sans danger.
levels.traps.digestiontrap.digested=Le donjon a digéré votre butin !
levels.traps.digestiontrap.discover_hint=Vous pouvez trouver ce piège aléatoirement dans la tour.
levels.traps.digestiontrap.empty=Le donjon n’a trouvé aucun butin au sol à digérer.
levels.traps.digestiontrap.name=piège de digestion
levels.traps.digestiontrap.unsupported=Le piège de digestion ne fonctionne que dans la haute tour.
levels.traps.infernaltrap.desc=À son déclenchement, ce piège libère un enfer dans la zone immédiate 3×3. Les flammes se propagent comme le breuvage infernal, pour un volume total de 1080.
levels.traps.infernaltrap.discover_hint=Vous pouvez trouver ce piège aléatoirement dans la tour.
levels.traps.infernaltrap.name=piège infernal
levels.traps.malicetrap.already_cursed=La malveillance ne trouve aucun nouvel équipement à maudire.
levels.traps.malicetrap.curse=La malveillance maudit tout votre équipement porté !
levels.traps.malicetrap.desc=Ce piège de la haute tour est chargé d’énergie malveillante. Son déclenchement maudit tout équipement porté par le héros ou maudissable sur le piège.
levels.traps.malicetrap.discover_hint=Vous pouvez trouver ce piège aléatoirement dans la tour.
levels.traps.malicetrap.item_curse=La malveillance maudit l’équipement posé sur le piège !
levels.traps.malicetrap.name=piège de malveillance
levels.traps.plaguebrazier.desc=Marchez sur ce purificateur : il élimine les miasmes et les égouts dans une zone 13×13 et retire l’infection. Il ne s’active qu’en l’absence de garde de peste actif. Après le début du combat, il inflige aussi 100 dégâts au Chevalier de la peste, restaure les gardes en récupération, se déplace après chaque usage et recharge en douze actions de boss.
levels.traps.plaguebrazier.name=purificateur de peste
levels.traps.redcrosstrap.desc=À son déclenchement, ce piège soigne tous les monstres hostiles de l’étage. Chacun reçoit le double du numéro d’étage, jusqu’à 200 PV.
levels.traps.redcrosstrap.discover_hint=Vous pouvez trouver ce piège aléatoirement dans la tour.
levels.traps.redcrosstrap.name=piège de la croix rouge
levels.traps.rimetrap.desc=Au tour suivant, ce piège libère une brume lévitante et un blizzard dans une zone 5×5. Les deux effets se propagent avec la puissance de leurs potions.
levels.traps.rimetrap.discover_hint=Vous pouvez trouver ce piège aléatoirement dans la tour.
levels.traps.rimetrap.name=piège de givre
levels.traps.roastsheeptrap.desc=À son déclenchement, ce piège de la haute tour invoque un troupeau de moutons et embrase la zone comme un piège de feu. Les moutons ne souffrent pas des flammes mais bloquent temporairement le passage.
levels.traps.roastsheeptrap.discover_hint=Vous pouvez trouver ce piège aléatoirement dans la tour.
levels.traps.roastsheeptrap.name=piège de moutons rôtis
levels.traps.soulscorchtrap.desc=Ce piège fonctionne comme un piège de feu, mais contient une énergie d’âme particulièrement malveillante. Son activation embrase une grande zone d’un feu maudit qui corrode l’âme.
levels.traps.soulscorchtrap.name=piège de brûlure d’âme
levels.traps.transformationtrap.changed=Votre talent change de façon imprévisible : %s -> %s.
levels.traps.transformationtrap.desc=Ce piège de la haute tour rend fous ennemis et alliés dans sa zone 3×3 pendant 50 tours. Si le héros est pris dedans, un talent commun devient un talent légal aléatoire du même niveau.
levels.traps.transformationtrap.discover_hint=Vous pouvez trouver ce piège aléatoirement dans la tour.
levels.traps.transformationtrap.name=piège de transmutation
levels.traps.transformationtrap.unchanged=L’énergie de transformation vous traverse, mais aucun talent ne change.
levels.traps.trap.discover_hint=Vous pouvez trouver ce piège aléatoirement dans le donjon. Chaque région possède des pièges différents.
