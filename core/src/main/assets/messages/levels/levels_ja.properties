levels.traps.malicetrap.curse=身につけている装備がすべて呪われた！
levels.traps.malicetrap.item_curse=罠の上の装備が悪意によって呪われた！
levels.traps.malicetrap.already_cursed=罠から強い悪意が漂う。直接踏まなくてよかった。
levels.traps.malicetrap.desc=この高塔の罠は悪意のエネルギーに満ちている。発動すると、身につけているすべての装備を呪う。
levels.traps.infernaltrap.desc=この高塔の罠が発動すると、近くに地獄の炎のガスを放つ。
levels.traps.rimetrap.desc=この高塔の罠が発動すると、近くに眩暈の霧と吹雪のガスを放つ。
levels.traps.redcrosstrap.name=十字架の罠
levels.traps.redcrosstrap.desc=この高塔の罠には敵対する生物だけに効く治癒の魔法が込められている。発動すると、この階にいる敵対生物すべての体力を回復する。
levels.traps.digestiontrap.digested=床に落ちていた品々が高塔に消化された！
levels.traps.digestiontrap.empty=高塔が消化できる落とし物はなかった。
levels.traps.digestiontrap.desc=この高塔の罠は、高塔の「胃」につながっているようだ。床に落ちている品々を、この階の上下どちらか隣の階へランダムに転送する。
levels.traps.transformationtrap.changed=才能が予測不能な変化を遂げた！才能%sは%sに変化した。
levels.traps.transformationtrap.unchanged=変化のエネルギーが体を通り抜けたが、何も変わらなかった。
levels.traps.transformationtrap.desc=この高塔の罠が発動すると、近くの生物を狂乱させる。また、才能のひとつを予測不能な形に変化させることもある。
levels.traps.roastsheeptrap.name=羊の丸焼き罠
levels.traps.roastsheeptrap.desc=焼き羊術師たちの仕業に違いない。この高塔の罠が発動すると、魔法の羊の群れを呼び出し、広い範囲に火を放つ。
levels.traps.abyssexplosivetrap.name=空中爆発の罠
levels.traps.abyssexplosivetrap.desc=この高塔の罠は深淵の上に浮かび、飛行中の生物がその場所に入ると爆発する。飛行できない生物が浮遊中に罠を起動すると、深淵へ落ちることもある。
levels.huntressbosslevel.gate_desc=背の高い金属の門がドワーフの都への道を塞いでいる。門の根元は土に固められ、押してもびくともしない。女狩人？を倒せば開くのだろうか？
levels.huntressbosslevel.gate_desc_broken=女狩人？との戦いの後、門の下の土が崩れ、戦いの余波で門も砕け散った。今は破片がわずかに残るだけだ。
levels.surfacetownlevel.dungeon_entrance_name=ダンジョン入口
levels.surfacetownlevel.dungeon_entrance_desc=ダンジョンへ続く階段。もう降りる必要はない。
levels.surfacetownlevel.tower_entrance_name=高塔の入口
levels.surfacetownlevel.tower_entrance_desc=高塔へ続く階段。登る前に十分な準備をしよう。中へ入ると地上へ戻れない。
levels.surfacetownlevel.bookshelf_desc=科学と魔法に関する本が棚いっぱいに並んでいる。
levels.surfacetownlevel.region_deco_name=森林
levels.surfacetownlevel.region_deco_desc=鬱蒼とした森。森を抜ければ町に戻り、普通の暮らしを送れる。しかし、それは君の求める人生ではない。
levels.minigame.extraction.extractionraidlevel.water_name=汚染された水たまり
levels.minigame.extraction.extractionraidlevel.grass_name=雑草
levels.minigame.extraction.extractionraidlevel.exit_name=転送装置
levels.minigame.extraction.extractionraidlevel.exit_desc=宇宙船内の転送装置。アクセスカードを1枚以上認識すると起動する。カードを見つけて、安全に脱出しよう。
levels.minigame.extraction.extractionraidlevel.cargo_crate_name=宇宙船の貨物箱
levels.minigame.extraction.extractionraidlevel.cargo_crate_desc=中身のわからない貨物箱が道を塞いでいる。
levels.minigame.extraction.extractionraidlevel.bookshelf_desc=読めない言語の本が並んでいる。乗組員向けの手引きや宇宙船の整備書のようだ。
levels.towers.towerlevel.water_name=高塔の水たまり
levels.towers.towerlevel.grass_name=高塔の雑草
levels.towers.towerlevel.decoration_name=高塔の装飾
levels.towers.towerlevel.decoration_desc=高塔の部屋を飾るための品々。
levels.towers.towerlevel.bookshelf_desc=棚いっぱいに本が並んでいるが、開いてみてもどの本も白紙だ。
levels.towers.towerlevel.entrance_desc=高塔の下の階へ続く階段。
levels.towers.towerlevel.exit_desc=高塔の上の階へ続く階段。
levels.level$feeling.sky_island_desc=この高塔の部屋は島のように深淵の上に浮かび、互いにつながっていない。
levels.level$feeling.barren_desc=この高塔の階には水源がなく、草木の生えた跡も見当たらない。
levels.level$feeling.chaos_desc=この高塔の階は混沌に満ち、物理と魔法の法則が逆転している。
levels.surfacetownlevel.tower_entry_title=無限の高塔
levels.surfacetownlevel.tower_entry_desc=高くそびえるこの塔は、開放されて以来、挑戦を求める冒険者を惹きつけてきた。由来の知れない建物の中には奇妙な意志が渦巻き、肉体を蝕み、心を歪め、倒れた探索者を塔をさまよう怪物へと変えてしまう。尽きない富…禁忌の魔法…失われた秘密…さまざまな伝説に誘われ、次々と人々が足を踏み入れるが、無事に帰る者はほとんどいない。\n\n今、君は入口に立ち、上から冷たい気配が漂ってくるのを感じる。先に何が待つかはわからないが、新たな冒険が目の前にある。生きて帰れないかもしれないから挑戦をやめるのは賢明だろう…だが、それは弱者の考えだ。\n\n_高塔に入ると地上へ戻れない。_今すぐ高塔に入る？
levels.surfacetownlevel.tower_entry_enter=塔に入る！
levels.surfacetownlevel.tower_entry_cancel=準備に戻る
levels.surfacetownlevel.tower_healing_limit=謎の力により、治癒の薬を%d本以上持って高塔へ入ることはできない。余分な薬を整理してから入ろう。
levels.towers.towerlevel.surface_blocked=地上へ続く階段は封鎖されている。
levels.traps.plaguebrazier.name=疫病浄化装置
levels.traps.plaguebrazier.desc=この浄化装置を起動すると、広範囲の瘴気と汚水を取り除き、君の疫病も浄化して、疫病の騎士に大ダメージを与える。ただし、倒れていた疫病の衛兵もすぐに復活する。\n\n活動中の疫病の衛兵が残っていると、装置は起動できない。\n\n装置は使用後にランダムな場所へ移動し、再使用には疫病の騎士が12回行動するまで充電が必要。
levels.towers.pestilencearenacontroller.prelude=部屋が完全に封鎖された。白い瘴気が一面に広がる中、左手の疫病浄化装置へ続く安全な道が一本だけ残っている。
levels.towers.pestilencearenacontroller.purifier_start=疫病浄化装置が白い瘴気を消し去った。疫病の騎士が呼び出された！
levels.towers.pestilencearenacontroller.purifier_strike=疫病浄化装置が広範囲の瘴気と汚水、君の疫病を取り除き、疫病の騎士の体力を%d奪った。装置は別の場所へ移動した。
levels.towers.pestilencearenacontroller.recharging=疫病浄化装置は充電中。再起動には疫病の騎士があと%d回行動する必要がある。
levels.towers.pestilencearenacontroller.guard_blocked=活動中の疫病の衛兵が残っているため、疫病浄化装置を起動できない。
levels.rooms.special.sentryroom$sentry.discover_hint=この敵はダンジョンのどの地域でも見つかります。
levels.traps.cursedflametrap.name=呪炎の罠
levels.traps.cursedflametrap.desc=この罠は炎上の罠に似ていますが、凶悪な魂の力が込められています。起動すると、近くの範囲を呪炎で燃え上がらせます。
levels.traps.soulscorchtrap.name=魂焦がしの罠
levels.traps.soulscorchtrap.desc=この罠は炎上の罠に似ていますが、特に凶悪な魂の力が込められています。起動すると広い範囲を、魂を腐食させる呪炎で燃え上がらせます。
levels.traps.malicetrap.name=悪意の罠
levels.traps.infernaltrap.name=地獄の罠
levels.traps.rimetrap.name=霜の罠
levels.traps.digestiontrap.name=消化の罠
levels.traps.digestiontrap.unsupported=消化の罠は無限の塔の中でのみ機能します。
levels.traps.transformationtrap.name=変化の罠
levels.traps.trap.discover_hint=この罠はダンジョンでランダムに見つかります。地域ごとに異なる罠が出現します。
levels.caveslevel.region_deco_name=金属構造物
levels.caveslevel.region_deco_desc=すべて金属でできた大きな構造物。ドワーフが遠い昔にここで採掘していた頃に建てられたようです。上層には長く放棄されたトロッコの線路が見える気がします。
levels.citylevel.region_deco_name=永遠燃焼の台座
levels.citylevel.region_deco_desc=明るい緑色の魔法の炎が燃える、高くなった台座。炎は非常に密度が高く、ほとんど固体のように見えます。
levels.hallslevel.region_deco_name=岩石の瓦礫
levels.hallslevel.region_deco_desc=天井か近くの壁から落ちてきたような巨大な岩。
levels.level$feeling.sky_island_title=空島の階
levels.level$feeling.barren_title=荒地の階
levels.level$feeling.chaos_title=混沌の階
levels.prisonlevel.region_deco_name=監獄の檻
levels.prisonlevel.region_deco_desc=一人が入れるほどの大きさの金属製の檻。何らかの方法で床に固定されているようで、まったく動かせません。
levels.prisonlevel.region_deco_alt_name=吊り下げ檻
levels.prisonlevel.region_deco_alt_desc=一人が入れるほどの金属製の檻。鎖で深淵の上に吊り下げられています。
levels.sewerlevel.region_deco_name=貯蔵樽
levels.sewerlevel.region_deco_desc=あなたとほぼ同じ大きさの木樽。何かで満たされているらしく、重すぎて動かせません。
levels.prisonnewbosslevel$diedtengu.name=天狗の遺体
levels.prisonnewbosslevel$diedtengu.desc=有名で謎めいた暗殺者。あなたは彼の物語を知り、周到に備えてきましたが、今見つかるのは彼の遺体だけです。\n\n奇妙なことに、顔にあるはずの仮面が消えています。軽率に調べるのは非常に危険かもしれませんが、もう後戻りはできません。
