levels.level.crystal_door_name=Kristalltür
levels.level.pedestal_name=Podest
levels.level.barricade_name=Barrikade
levels.level.high_grass_name=hohes Gras
levels.level.locked_exit_name=Verschlossener Ebenenausgang
levels.level.unlocked_exit_name=Entriegelter Ebenenausgang
levels.level.well_name=Brunnen
levels.level.empty_well_name=versiegter Brunnen
levels.level.statue_name=Statue
levels.level.inactive_trap_name=ausgelöste Falle
levels.level.bookshelf_name=Bücherregal
levels.level.alchemy_name=Alchemiekessel
levels.level.default_name=???
levels.level.chasm_desc=Du kannst den Boden nicht sehen.
levels.level.water_desc=Wenn du brennst, gehe ins Wasser, um das Feuer zu löschen.
levels.level.entrance_desc=Die Treppe führt hinauf zu einer höheren Ebene.
levels.level.exit_desc=Die Treppe führt hinunter auf eine tiefere Ebene.
levels.level.embers_desc=Der Boden ist mit Asche bedeckt.
levels.level.high_grass_desc=Dichte Vegetation versperrt die Sicht.
levels.level.locked_door_desc=Diese Tür ist verschlossen. Du brauchst einen passenden Schlüssel, um sie aufzuschließen.
levels.level.crystal_door_desc=Diese verschlossene Tür ist aus magischem Kristall gefertigt. Du kannst zwar hindurchsehen, jedoch benötigst du einen Kristallschlüssel, um sie zu öffnen.
levels.level.locked_exit_desc=Dicke Eisenstangen versperren den Zugang zu den weiterführenden Treppen.
levels.level.barricade_desc=Eine Barrikade aus Holz wurde hier sorgfältig errichtet, aber das Holz scheint sehr vertrocknet zu sein. Ob man es anzünden kann?
levels.level.inactive_trap_desc=Diese Falle wurde bereits ausgelöst und kann keinen Schaden mehr anrichten.
levels.level.statue_desc=Irgendjemand hat versucht, diesen Ort ansehnlich zu gestalten, ist aber offensichtlich daran gescheitert.
levels.level.alchemy_desc=Dieser Kessel ist mit magischem Wasser gefüllt. Gegenstände können darin in etwas Neues verwandelt werden!
levels.level.empty_well_desc=Der Brunnen ist ausgetrocknet.

levels.level$feeling.chasm_title=Ebene des Abgrunds
levels.level$feeling.water_title=Ebene des Wasser
levels.level$feeling.grass_title=Ebene des Gras
levels.level$feeling.dark_title=Dunkle Ebene
levels.level$feeling.large_title=Große Ebene
levels.level$feeling.traps_title=Ebene der Fallen
levels.level$feeling.secrets_title=Ebene der Geheimnisse
levels.level$feeling.chasm_desc=Deine Schritte hallen durch das Dungeon.
levels.level$feeling.water_desc=Du hörst das Plätschern von Wasser in deiner Nähe.
levels.level$feeling.grass_desc=Ein beißender Geruch von Vegetation liegt in der Luft.
levels.level$feeling.dark_desc=Du hörst die Bewegungen von Feinden in der Dunkelheit.
levels.level$feeling.large_desc=Diese Ebene des Dungeons kommt dir ungewöhnlich ausgedehnt vor.
levels.level$feeling.traps_desc=Der Boden hier macht einen sehr trügerischen Eindruck.
levels.level$feeling.secrets_desc=Die Atmosphäre dieser Ebene deutet auf viele versteckte Geheimnisse hin.

levels.mininglevel.wall_desc=Eine glatte Gesteinswand, die etwas weicher ist als sonst üblich. Du kannst mit deiner Spitzhacke hindurchhacken, aber das braucht etwas Anstrengung und erhöht entsprechend deinen Hunger ein wenig.
levels.mininglevel.gold_extra_desc=Du kannst das vermutlich mit deiner Spitzhacke herausfördern.
levels.mininglevel.crystal_name=Kristallstachel
levels.mininglevel.boulder_name=Geröllbrocken
levels.mininglevel.crystal_desc=Hier tritt farbiges Kristall großflächig zutage. Diese Kristalle sind zerbrechlich und können leicht mit einer Spitzhacke gebrochen werden, oder sie zerbrechen, wenn in unmittelbarer Nähe geschürft wird.
levels.mininglevel.boulder_desc=Hier ist ein großer Geröllbrocken, der den Weg versperrt. Es sollte recht einfach sein, ihn mit einer Spitzhacke zu brechen.
levels.mininglevel.barricade_desc=Die Barrikade aus Holz steht fest und dient dazu, die Decke zu stützen.\n\nGebaut wurde sie vermutlich durch die Gnolls, die sich so etwas Schutz vor fallenden Steinen erhofften. _Jedes angrenzende Feld ist vor Steinschlagfallen und Angriffen geschützt._\n\nSie sieht so aus, als würde sie genauso gut brennen wie jede andere Barrikade.

levels.prisonlevel.water_name=Dunkles Wasser
levels.prisonlevel.empty_deco_desc=Der Boden ist mit Flecken getrockneten Bluts bedeckt.
levels.prisonlevel.bookshelf_desc=Dies ist wahrscheinlich das Überbleibsel einer Gefängnisbibliothek. Vielleicht kann man das anzünden?

levels.sewerlevel.water_name=Trübes Wasser
levels.sewerlevel.empty_deco_desc=Gelbes, feuchtes Moos bedeckt den Boden.
levels.sewerlevel.bookshelf_desc=Dieses Bücherregal ist voll mit billigen und nutzlosen Büchern. Vielleicht kann man es entzünden?
levels.minigame.extraction.mobs.chronosuccubus.discover_hint=Du findest diesen Gegner während einer bestimmten Quest.
levels.minigame.extraction.mobs.deferredscorpio.discover_hint=Du findest diesen Gegner während einer bestimmten Quest.
levels.minigame.extraction.mobs.vaultarmoredstatue.discover_hint=Du findest diesen Gegner während einer bestimmten Quest.
levels.minigame.extraction.mobs.veilbreakereye.discover_hint=Du findest diesen Gegner während einer bestimmten Quest.
levels.caveslevel.region_deco_desc=Eine große Konstruktion ganz aus Metall, vermutlich einst von Zwergen beim Bergbau errichtet. Auf den oberen Ebenen erkennst du vielleicht längst verlassene Lorenwege.
levels.caveslevel.region_deco_name=Metallkonstruktion
levels.citylevel.region_deco_desc=Ein erhöhter Sockel mit einer hellgrünen magischen Flamme. Die Flamme ist so dicht, dass sie beinahe fest wirkt.
levels.citylevel.region_deco_name=Ewig brennender Sockel
levels.hallslevel.region_deco_desc=Ein gewaltiger Stein, der offenbar von der Decke oder einer nahen Wand herabfiel.
levels.hallslevel.region_deco_name=Felsgeröll
levels.huntressbosslevel.gate_desc=Ein hohes Metalltor versperrt den Weg zur Zwergenstadt. Erde hat seine Basis versiegelt, sodass es sich nicht öffnen lässt. Vielleicht öffnet der Sieg über die Jägerin? es.
levels.huntressbosslevel.gate_desc_broken=Nach dem Kampf mit der Jägerin? lockerte sich die Erde unter dem Tor, und der Kampf zertrümmerte es. Nur verstreute Bruchstücke bleiben.
levels.level$feeling.barren_desc=Auf dieser öden Ebene wachsen weder Wasser noch Pflanzen.
levels.level$feeling.barren_title=Öde Ebene
levels.level$feeling.chaos_desc=Auf dieser Ebene tauschen physischer und magischer Schaden ihre Natur.
levels.level$feeling.chaos_title=Chaos-Ebene
levels.level$feeling.sky_island_desc=Die Räume hängen über dem Abgrund, ohne Brücken zwischen ihnen.
levels.level$feeling.sky_island_title=Himmelsinsel-Ebene
levels.minigame.extraction.extractionraidlevel.bookshelf_desc=Diese Bücher sind in einer unbekannten Sprache verfasst. Es scheinen Handbücher für die Besatzung und Wartungsanleitungen für Schiffe zu sein.
levels.minigame.extraction.extractionraidlevel.cargo_crate_desc=Kisten mit unbekannter Fracht versperren dir den Weg.
levels.minigame.extraction.extractionraidlevel.cargo_crate_name=Schiffsfrachtkiste
levels.minigame.extraction.extractionraidlevel.exit_desc=Das Teleportationsgerät des Schiffs aktiviert sich, sobald es mindestens eine Zugangskarte erkennt. Finde eine Karte und evakuiere dich sicher.
levels.minigame.extraction.extractionraidlevel.exit_name=Teleportationsgerät
levels.minigame.extraction.extractionraidlevel.grass_name=Unkraut
levels.minigame.extraction.extractionraidlevel.water_name=Verschmutzte Pfütze
levels.prisonlevel.region_deco_alt_desc=Ein Metallkäfig, gerade groß genug für eine Person, hängt an Ketten über dem Abgrund.
levels.prisonlevel.region_deco_alt_name=Hängender Käfig
levels.prisonlevel.region_deco_desc=Ein Metallkäfig, gerade groß genug für eine Person. Er scheint am Boden verriegelt und lässt sich nicht bewegen.
levels.prisonlevel.region_deco_name=Gefängniskäfig
levels.prisonnewbosslevel$diedtengu.desc=Ein berühmter und geheimnisvoller Assassine. Du kennst seine Geschichte und warst vorbereitet, doch nun findest du nur seine Leiche.\n\nSeltsam: Die Maske, die sein Gesicht bedecken sollte, fehlt. Unvorsichtiges Untersuchen könnte gefährlich sein, doch es gibt keinen Weg zurück.
levels.prisonnewbosslevel$diedtengu.name=Leiche des Tengu
levels.rooms.special.sentryroom$sentry.discover_hint=Du findest diesen Gegner in jeder Dungeonregion.
levels.sewerlevel.region_deco_desc=Ein fast so großes Holzfass wie du. Es muss voll sein, denn es ist viel zu schwer zum Bewegen.
levels.sewerlevel.region_deco_name=Lagerfass
levels.surfacetownlevel.bookshelf_desc=Die Regale sind voller Bücher über Wissenschaft und Magie.
levels.surfacetownlevel.dungeon_entrance_desc=Treppen zum Dungeon. Es gibt keinen Grund, wieder hinabzusteigen.
levels.surfacetownlevel.dungeon_entrance_name=Dungeon-Eingang
levels.surfacetownlevel.region_deco_desc=Dichter Wald. Dahinter liegen die Stadt und ein gewöhnliches Leben, doch das ist nicht das Leben, das du suchst.
levels.surfacetownlevel.region_deco_name=Waldland
levels.surfacetownlevel.tower_entrance_desc=Treppen zum Turm. Bereite dich gut vor; drinnen kannst du nicht zur Oberfläche zurückkehren.
levels.surfacetownlevel.tower_entrance_name=Turmeingang
levels.surfacetownlevel.tower_entry_cancel=Abbrechen
levels.surfacetownlevel.tower_entry_enter=Betreten
levels.surfacetownlevel.tower_entry_title=Hochturm betreten
levels.surfacetownlevel.tower_healing_limit=Du darfst höchstens %d Heiltränke in den Turm bringen. Lagere oder benutze den Überschuss zuerst.
levels.towers.pestilencearenacontroller.guard_blocked=Besiege oder deaktiviere alle aktiven Seuchenwächter, bevor du den Reiniger benutzt.
levels.towers.pestilencearenacontroller.prelude=Die Arena wird versiegelt. Ein sicherer Weg führt durch ein Meer blasser Miasmen zum Reiniger links.
levels.towers.pestilencearenacontroller.purifier_start=Der Reiniger löscht die blassen Miasmen. Der Seuchenritter nimmt die Herausforderung an!
levels.towers.pestilencearenacontroller.purifier_strike=Der Reiniger leert die Arena, entzieht dem Seuchenritter %d LP und verlegt sich dann.
levels.towers.pestilencearenacontroller.recharging=Der Reiniger lädt noch: %d Bossaktionen verbleiben.
levels.surfacetownlevel.tower_entry_desc=Sobald du den Hochturm betrittst, kannst du nicht zu Ebene 0 zurückkehren. Möchtest du wirklich fortfahren?
levels.towers.towerlevel.bookshelf_desc=Die Regale sind voller Bücher, doch jedes aufgeschlagene Buch enthält nur leere Seiten.
levels.towers.towerlevel.decoration_desc=Gegenstände zur Dekoration der Turmräume.
levels.towers.towerlevel.decoration_name=Turmdekoration
levels.towers.towerlevel.entrance_desc=Treppen zur darunterliegenden Turmebene.
levels.towers.towerlevel.exit_desc=Treppen zur darüberliegenden Turmebene.
levels.towers.towerlevel.grass_name=Turmunkraut
levels.towers.towerlevel.surface_blocked=Aus dem Hochturm gibt es keinen Weg zurück zu Ebene 0.
levels.towers.towerlevel.water_name=Turmpfütze
levels.traps.abyssexplosivetrap.desc=Diese Turmfalle schwebt über einem Abgrund und detoniert, sobald etwas ihr Feld betritt. Schweben schützt nicht vor dem Auslöser; flugunfähige Wesen können nach der Explosion stürzen.
levels.traps.abyssexplosivetrap.discover_hint=Du kannst diese Falle zufällig im Turm finden.
levels.traps.abyssexplosivetrap.name=Abgrundsprengfalle
levels.traps.cursedflametrap.desc=Diese Falle funktioniert wie eine Brennfalle, ist aber mit bösartiger Seelenenergie erfüllt. Beim Auslösen entzündet sie in der Nähe verfluchtes Feuer.
levels.traps.cursedflametrap.name=Verfluchte-Flammen-Falle
levels.traps.digestiontrap.desc=Beim Auslösen schickt diese Falle alle Gegenstände aus losen Haufen auf eine zufällige benachbarte Turmebene. Tränke und Samen werden sicher transportiert.
levels.traps.digestiontrap.digested=Der Dungeon hat deine Beute verdaut!
levels.traps.digestiontrap.discover_hint=Du kannst diese Falle zufällig im Turm finden.
levels.traps.digestiontrap.empty=Der Dungeon fand keine lose Beute zum Verdauen.
levels.traps.digestiontrap.name=Verdauungsfalle
levels.traps.digestiontrap.unsupported=Die Verdauungsfalle funktioniert nur im Hochturm.
levels.traps.infernaltrap.desc=Beim Auslösen setzt diese Falle im nahen 3×3-Bereich eine Hölle frei. Die Flammen breiten sich wie das höllische Gebräu aus, insgesamt 1080 Volumen.
levels.traps.infernaltrap.discover_hint=Du kannst diese Falle zufällig im Turm finden.
levels.traps.infernaltrap.name=Höllenfalle
levels.traps.malicetrap.already_cursed=Die Bosheit findet keine neue Ausrüstung zum Verfluchen.
levels.traps.malicetrap.curse=Die Bosheit verflucht deine gesamte getragene Ausrüstung!
levels.traps.malicetrap.desc=Diese Hochturmfalle ist voller bösartiger Energie. Beim Auslösen verflucht sie jede angelegte Ausrüstung des Helden oder verfluchbare Ausrüstung auf der Falle.
levels.traps.malicetrap.discover_hint=Du kannst diese Falle zufällig im Turm finden.
levels.traps.malicetrap.item_curse=Die Bosheit verflucht die Ausrüstung auf der Falle!
levels.traps.malicetrap.name=Bosheitsfalle
levels.traps.plaguebrazier.desc=Betritt diesen Seuchenreiniger: Er entfernt Seuchenmiasmen und Abwasser in einem 13×13-Bereich und beseitigt Infektionen. Er kann nur aktiviert werden, wenn kein Seuchenwächter aktiv ist. Nach Kampfbeginn fügt er dem Seuchenritter 100 Schaden zu, stellt danach genesende Wächter wieder her, verlegt sich nach jeder Nutzung und lädt über zwölf Bossaktionen.
levels.traps.plaguebrazier.name=Seuchenreiniger
levels.traps.redcrosstrap.desc=Beim Auslösen heilt diese Falle jedes feindliche Monster auf der Ebene. Jedes erhält Heilung in Höhe des Doppelten der Turmebene, höchstens 200 LP.
levels.traps.redcrosstrap.discover_hint=Du kannst diese Falle zufällig im Turm finden.
levels.traps.redcrosstrap.name=Rotkreuzfalle
levels.traps.rimetrap.desc=In der nächsten Runde setzt diese Falle schwebenden Nebel und einen Schneesturm in einem 5×5-Bereich frei. Beide Effekte breiten sich mit der Stärke ihrer Tränke aus.
levels.traps.rimetrap.discover_hint=Du kannst diese Falle zufällig im Turm finden.
levels.traps.rimetrap.name=Reiffalle
levels.traps.roastsheeptrap.desc=Beim Auslösen beschwört diese Hochturmfalle eine Schafherde und setzt die Umgebung wie eine Brennfalle in Brand. Die Schafe bleiben unversehrt, versperren aber vorübergehend den Weg.
levels.traps.roastsheeptrap.discover_hint=Du kannst diese Falle zufällig im Turm finden.
levels.traps.roastsheeptrap.name=Schafbratenfalle
levels.traps.soulscorchtrap.desc=Diese Falle funktioniert wie eine Flammenfalle, ist aber mit besonders bösartiger Seelenenergie erfüllt. Beim Auslösen setzt sie einen großen Bereich mit verfluchtem Feuer in Brand, das die Seele versengt.
levels.traps.soulscorchtrap.name=Seelenbrandfalle
levels.traps.transformationtrap.changed=Dein Talent ändert sich unvorhersehbar: %s -> %s.
levels.traps.transformationtrap.desc=Diese Hochturmfalle lässt Feinde und Verbündete in ihrem 3×3-Bereich 50 Runden lang Amok laufen. Wird der Held getroffen, wird eines seiner allgemeinen Talente in ein zufälliges legales Talent derselben Stufe verwandelt.
levels.traps.transformationtrap.discover_hint=Du kannst diese Falle zufällig im Turm finden.
levels.traps.transformationtrap.name=Transmutationsfalle
levels.traps.transformationtrap.unchanged=Transformationsenergie durchströmt dich, doch kein Talent ändert sich.
levels.traps.trap.discover_hint=Du kannst diese Falle zufällig im Dungeon finden. In jeder Region erscheinen andere Fallen.
