items.keys.wornkey.name=낡은 열쇠
items.armor.curses.leaden.name=납의 %s
items.armor.curses.leaden.desc=이 갑옷은 납의 저주를 받아 무겁고 둔해졌습니다. 착용자는 이동 속도가 느려집니다.
items.armor.glyphs.affection.combat=마법사가 공격받으면 애정의 인장이 적을 매혹해 잠시 공격을 멈추게 합니다.
items.armor.glyphs.antimagic.combat=마법 방지 인장이 마법 피해를 줄이고 착용자를 마법 효과로부터 보호합니다.
items.armor.glyphs.brimstone.combat=유황 인장은 화염 피해에 저항을 부여하고 전투 중 적을 불태웁니다.
items.armor.glyphs.camouflage.combat=위장 인장은 주변 지형과 섞이게 하여 은신 효과를 부여합니다.
items.armor.glyphs.entanglement.combat=얽힘 인장은 적을 덩굴로 묶고 이동을 방해합니다.
items.armor.glyphs.flow.combat=흐름의 인장은 물 위에서 이동 속도를 높이고 영웅의 힘을 증가시킵니다.
items.armor.glyphs.obfuscation.combat=모호함의 인장은 착용자의 정보를 숨기고 적의 명중률을 낮춥니다.
items.armor.glyphs.potential.combat=잠재력의 인장은 적중 시 충전 에너지를 생성하고 전투 중 완드를 회복시킵니다.
items.armor.glyphs.repulsion.combat=반발의 인장은 적을 밀쳐내고 영웅의 힘에 비례한 추가 피해를 줍니다.
items.armor.glyphs.stone.combat=돌의 인장은 받은 피해를 방어력으로 바꾸지만 이동 속도를 낮춥니다.
items.armor.glyphs.swiftness.combat=신속의 인장은 이동 속도를 높이고 근접 공격의 재사용 시간을 줄입니다.
items.armor.glyphs.thorns.combat=가시의 인장은 피해를 받은 적에게 출혈을 일으켜 피해를 반사합니다.
items.armor.glyphs.viscosity.combat=점성의 인장은 피해를 지연시키고 시간이 지나면 독성 피해로 바꿉니다.
items.armor.armor$glyph.discover_hint=던전에서 발견하거나 마법 부여 아이템을 사용하면 이 인장을 얻을 수 있습니다.
items.artifacts.capeofthorns.desc_cursed=저주받은 가시 망토는 착용자를 가시로 감싸 공격받을 때마다 피를 흘리게 합니다.
items.artifacts.driedrose$wndghosthero.cant_strength_unknown=그 영웅의 힘을 알 수 없어 이 아이템을 장착할 수 없습니다.
items.artifacts.driedrose$ghosthero.discover_hint=특정 영웅으로 이 아이템을 발견할 수 있습니다.
items.artifacts.driedrose$ghosthero.seen_warrior_1=내가 기억하기로 너는 끈질긴 전사였지.
items.artifacts.driedrose$ghosthero.seen_warrior_2=정말... 오랜만이군.
items.artifacts.driedrose$ghosthero.seen_warrior_3=난 아직 포기하지 않았어...
items.artifacts.driedrose$ghosthero.seen_rogue_1=그 도적의 시대는 이미 끝났군.
items.artifacts.driedrose$ghosthero.seen_rogue_2=이제 네가 그를 대신하는구나.
items.artifacts.driedrose$ghosthero.seen_rogue_3=계속 서둘러, 작은 친구여.
items.artifacts.driedrose$ghosthero.directed_wander_1=좋아, 잠깐 둘러보자.
items.artifacts.driedrose$ghosthero.directed_wander_2=조심해서 움직여.
items.artifacts.driedrose$ghosthero.directed_wander_3=길을 정찰해 보자.
items.artifacts.driedrose$ghosthero.directed_wander_4=여긴 길이 막혔어.
items.artifacts.holytome.desc=이 성서는 성직자의 지식과 성스러운 마법을 강화해 다양한 주문을 사용할 수 있게 합니다. 사용하면 성직자의 능력이 점차 강해집니다.
items.artifacts.lloydsbeacon.no_charge_zap=순간이동 마법을 방출하려면 %s 충전이 필요합니다.
items.artifacts.lloydsbeacon.no_charge_return=귀환 마법을 방출하려면 3 충전이 필요합니다.
items.artifacts.lloydsbeacon.full_charge=신호기가 완전히 충전되었습니다.
items.artifacts.lloydsbeacon.cursed=저주받은 순간이동 신호기는 사용할 수 없습니다.
items.artifacts.skeletonkey.lock_no_space=잠글 공간이 없습니다.
items.artifacts.skeletonkey.iron_charges=철문을 열려면 1 충전이 필요합니다.
items.artifacts.skeletonkey.gold_charges=황금문을 열려면 2 충전이 필요합니다.
items.artifacts.skeletonkey.lock_charges=문을 잠그려면 2 충전이 필요합니다.
items.artifacts.skeletonkey.wall_charges=임시 벽을 만들려면 2 충전이 필요합니다.
items.artifacts.skeletonkey.crystal_charges=수정문을 열려면 5 충전이 필요합니다.
items.artifacts.skeletonkey.wont_open=열쇠가 어떤 이유로든 문을 열지 못합니다.
items.artifacts.skeletonkey.locked_with_key=이 문은 이미 열쇠로 잠겨 있습니다.
items.artifacts.skeletonkey.force_lock=문이 이미 잠겨 있어 강제로 열 수 없습니다.
items.artifacts.skeletonkey.discard=해골 열쇠를 버리시겠습니까?
items.artifacts.skeletonkey.levelup=해골 열쇠가 더 강해졌습니다!
items.artifacts.skeletonkey.desc=정교하게 조각된 해골 모양의 열쇠입니다. 관찰할 때마다 조금씩 다르게 보입니다.
items.artifacts.skeletonkey.desc_worn=이 열쇠의 마법은 문을 열 때 열쇠를 소모하지 않게 합니다. 열쇠는 잠긴 문 근처에서 자동으로 작동합니다.
items.artifacts.skeletonkey.desc_cursed=저주받은 해골 열쇠는 완전히 불안정하며 어떤 문에도 사용할 수 없습니다.
items.artifacts.skeletonkey$keywall.desc=열쇠로 만든 임시 마법 벽입니다.
