items.artifacts.capeofthorns.effect_conflict=가시 망토의 효과가 다른 효과와 충돌하여 방출할 수 없습니다.
items.artifacts.capeofthorns.cursed=저주받은 가시 망토는 사용할 수 없습니다.
items.artifacts.capeofthorns$thorns.full_charge=가시 망토가 완전히 충전되었습니다.
