items.weapon.melee.bracer.stats_desc=이 무기는 0~%d의 피해를 막습니다. 강화하면 방어량이 증가합니다.
items.weapon.melee.bracer.ability_name=호위
items.weapon.melee.bracer.typical_ability_desc=결투가는 팔 방패로 자신을 _호위_하여 보통 _%d턴_ 동안 자신을 향한 물리 및 마법 공격을 완전히 막습니다. 결투가가 공격을 막은 뒤 반격하거나 주문을 시전하면 호위가 끝납니다.
items.weapon.melee.bracer.ability_desc=결투가는 팔 방패로 자신을 _호위_하여 _%d턴_ 동안 자신을 향한 물리 및 마법 공격을 완전히 막습니다. 결투가가 공격을 막은 뒤 반격하거나 주문을 시전하면 호위가 끝납니다.
items.weapon.melee.bracer.upgrade_ability_stat_name=무기 기술 지속 시간
items.weapon.melee.bracer.desc=손목부터 팔꿈치까지의 팔뚝을 덮는 가벼운 방패로, 어느 정도 방어 기능을 제공합니다.
items.weapon.melee.bracer.discover_hint=어떤 영웅이 처음부터 이 아이템을 지닙니다.
items.weapon.missiles.runestring.name=룬석 끈
items.weapon.missiles.runestring.stats_desc=직접 강화할 수 없지만 품질이 매우 높습니다. 투척하는 것 외에도 마법부여 룬석처럼 장비에 사용할 수 있습니다.
items.weapon.missiles.runestring.desc=마력이 깃든 룬석을 한데 꿴 끈입니다. 그중 하나에는 열 글자의 룬이 새겨져 은은한 보랏빛을 내며 특히 눈에 띕니다.
items.weapon.missiles.runestring.ac_enchant=마법부여
items.weapon.missiles.runestring.discover_hint=어떤 영웅이 처음부터 이 아이템을 지닙니다.
items.weapon.missiles.runestring.inv_title=아이템에 마법부여
items.weapon.missiles.runestring$runestring1.name=룬석 끈
items.weapon.missiles.runestring$runestring1.stats_desc=이 무기는 마법부여 능력을 잃었지만 다른 투척 무기처럼 강화, 마법부여, 업그레이드 및 수리할 수 있습니다.
items.weapon.missiles.runestring$runestring1.desc=마력을 잃은 룬석을 한데 꿴 끈입니다. 마력을 주입해도 원래대로 돌아오지 않고, 사람 머리를 때리는 능력만 남았습니다.
items.remains.royaljewelry.name=왕실 보석
items.remains.royaljewelry.desc=화려한 보석으로, 어느 드워프 왕실 구성원이 착용하던 반지의 일부인 듯합니다. 아직 비전 에너지가 조금 남아 있어 모든 반지의 레벨을 일시적으로 올릴 수 있습니다. 마지막 비전 에너지가 소진되면 이 보석은 수많은 미세한 결정 조각으로 빠르게 분해되어 사라집니다.
items.remains.royaljewelry$jewelryenhanced.name=보석의 잔여 에너지
items.remains.royaljewelry$jewelryenhanced.desc=반지가 일시적으로 1레벨 강화되었습니다.\n\n남은 턴: %s턴
items.weapon.enchantments.corrosionenchanted.name=산성 부식 %s
items.weapon.enchantments.corrosionenchanted.desc=이 마법부여는 무기로 적을 공격할 때 산성 부식 마법을 주입합니다. 이 사악한 마법은 적의 몸을 계속 침식해 매우 치명적입니다.
items.weapon.enchantments.corrosionenchanted.elestrike_desc=무기에 산성 부식 마법부여가 있으면 원소 타격이 범위 내 모든 적에게 6턴 동안 초기 피해 2의 산성 부식을 부여합니다.
items.weapon.enchantments.corrosionenchanted.runemark=_룬 마법사_가 산성 부식 마법부여가 있는 표식을 폭발시키면 폭발에 휘말린 모든 적이 산성 부식을 얻습니다.
items.rings.ringofking.name=왕태자의 반지
items.rings.ringofking.stats=이 반지를 착용하면 마법부여와 각인의 힘을 주입할 수 있습니다.
items.rings.ringofking.desc=왕실의 신분을 상징하는 이 반지는 마법부여와 각인의 힘을 저장해 장비한 무기와 갑옷에 직접 적용합니다. 장비의 기존 마법부여 및 각인과 충돌하지 않아 동시에 적용됩니다. 저주받은 반지는 마법부여와 각인의 힘을 제공하지 않습니다.
items.rings.ringofking.desc1=직접 강화할 수 없지만 레벨이 오를수록 점차 강해집니다. 현재 레벨에서 이 반지에 저장된 마법부여와 각인은 _%d_레벨의 효과를 냅니다.
items.rings.ringofking.desc2=이 반지를 착용하면 _%s_이(가) 무기에 적용되는 것을 느낄 수 있습니다.
items.rings.ringofking.desc3=이 반지를 착용하면 _%s_이(가) 갑옷에 적용되는 것을 느낄 수 있습니다.
items.rings.ringofking.desc4=이 반지에서는 마법부여와 각인의 힘을 얻을 수 없습니다.
items.rings.ringofking.desc5=마법부여.
items.rings.ringofking.desc6=각인.
items.rings.ringofking.desc7=왕태자의 반지에 주입할 마법부여 또는 각인을 선택하세요.
items.rings.ringofking.desc8=마법부여 주입
items.rings.ringofking.desc9=각인 주입
items.rings.ringofking.discover_hint=어떤 영웅이 처음부터 이 아이템을 지닙니다.
items.armor.princessarmor.name=영웅의 관
items.armor.princessarmor.desc=갑옷도 함께 변했지만, 당신은 결국 그것을 직접 쓰고 자신에게 속한 권능을 느낍니다. 폐하, 마지막 왕이 저지른 죄를 속죄하여 수많은 희생자의 영혼이 안식을 얻도록 하소서.
items.weapon.melee.steelwhip.name=강철 채찍
items.weapon.melee.steelwhip.stats_desc=이 무기는 놀라운 공격 사거리를 지닙니다.
items.weapon.melee.steelwhip.desc=차갑게 빛나고 유난히 무거운 강철 채찍입니다. 가느다란 뱀 같은 채찍이 마디마디 이어져 휘두를 때 공기를 가릅니다.
items.weapon.melee.steelwhip.ability_name=세게 휘두르기
items.weapon.melee.steelwhip.typical_ability_desc=결투가는 강철 채찍으로 주변의 모든 적을 _세게 휘두릅니다_. 이 무기 기술은 보통 사거리 안의 각 적에게 _5~23의 피해_를 주며 반드시 명중합니다.
items.weapon.melee.steelwhip.ability_desc=결투가는 강철 채찍으로 주변의 모든 적을 _세게 휘두릅니다_. 이 무기 기술은 사거리 안의 각 적에게 _%1$d~%2$d의 피해_를 주며 반드시 명중합니다.
items.weapon.melee.blowpipe.name=취관
items.weapon.melee.blowpipe.ability_name=힘 모아 쏘기
items.weapon.melee.blowpipe.typical_ability_desc=결투가는 취관에 _힘을 모을_ 수 있습니다. 다음 공격이 반드시 명중하며 상황에 따라 세 효과 중 하나가 발동합니다: 근접 공격은 적을 밀쳐내고, 약을 바르지 않은 다트는 보통 _2의 추가 피해_를 주며, 약을 바른 다트는 7x7 범위에서 효과를 발동하고 보통 _2회의 사용 횟수_를 추가합니다.
items.weapon.melee.blowpipe.ability_desc=결투가는 취관에 _힘을 모을_ 수 있습니다. 다음 공격이 반드시 명중하며 상황에 따라 세 효과 중 하나가 발동합니다: 근접 공격은 적을 밀쳐내고, 약을 바르지 않은 다트는 _%s의 추가 피해_를 주며, 약을 바른 다트는 7x7 범위에서 효과를 발동하고 _%s회의 사용 횟수_를 추가합니다.
items.weapon.melee.blowpipe.desc=단단한 목재로 만든 취관입니다. 속이 고르고 비어 있어 다트 같은 작은 화살을 넣고 불어 빠르게 발사할 수 있습니다. 놀라운 강도 덕분에 휘두르기만 해도 좋은 효과를 냅니다.
items.weapon.melee.blowpipe.upgrade_ability_stat_name=무기 기술 보너스
items.weapon.melee.blowpipe$weakchargedshot.name=발사 준비
items.weapon.melee.blowpipe$weakchargedshot.desc=결투가가 취관에 힘을 집중하고 있습니다. 다음 공격이 반드시 명중하며 상황에 따라 세 효과 중 하나가 발동합니다:\n-근접 공격이 적을 몇 칸 밀쳐냅니다.\n-약을 바르지 않은 다트가 추가 피해를 줍니다.\n-약을 바른 다트의 사용 횟수가 늘고 7x7 범위에서 효과를 발동합니다. 긍정적 효과는 아군에게만, 부정적 효과는 적에게만 적용됩니다. 결투가는 이 기술로 긍정적 다트 효과를 자신에게 적용할 수 없습니다.
items.trinkets.magicfeather.name=마법 깃털
items.trinkets.magicfeather.desc=어떤 마법사가 기르던 까마귀에게서 뽑은 깃털을 연금술 솥에서 끓여 만든 것으로, 약간의 마력이 깃들었습니다. 깃털의 마력은 지팡이를 강화하는 듯하지만 던전의 마법 환경을 더 위험하게 만듭니다.
items.trinkets.spearshield.name=결합 창방패
items.trinkets.spearshield.desc=날카로운 창끝이 방패를 꿰뚫고 단단한 방패가 창끝을 부러뜨려 둘이 단단히 결합되었습니다. 이제 빼내기 어렵습니다. 피해나 방어력을 극단적으로 높이는 듯하지만 그에 대응하는 능력은 극단적으로 감소합니다.
items.trinkets.spearshield.typical_stats_desc=이 장신구는 보통 물리 공격의 최소 피해 또는 물리 방어의 최소 피해 감소를 최대값의 _%1$s%%_로 고정하며, 물리 방어의 최대 피해 감소 또는 물리 공격의 최대 피해를 최대값의 _%2$s%%_로 고정합니다. 제작되기 전에는 현재 적용 모드를 알 수 없습니다. 적용 모드를 전환할 수 있지만 전환할 때마다 다시 전환하려면 영웅 레벨을 올려야 하며, 그 전까지 부정적 영향이 더 커집니다.\n\n이 장신구의 강화에는 막대한 연금술 에너지가 소모됩니다.
items.trinkets.spearshield.ac_switch_mode=전환
items.trinkets.spearshield.spear_stats_desc=현재 레벨에서 이 장신구는 물리 공격의 최소 피해를 최대값의 _%1$s%%_로 고정하고 물리 방어의 최대 피해 감소를 최대값의 _%2$s%%_로 고정합니다. 당신은 방패에 부러져 박힌 _창끝_으로 앞을 찌르고 있습니다. 다른 적용 모드로 전환할 수 있지만 전환할 때마다 다시 전환하려면 영웅 레벨을 올려야 하며, 그 전까지 부정적 영향이 더 커집니다.\n\n이 장신구의 강화에는 막대한 연금술 에너지가 소모됩니다.
items.trinkets.spearshield.shield_stats_desc=현재 레벨에서 이 장신구는 물리 방어의 최소 피해 감소를 최대값의 _%1$s%%_로 고정하고 물리 공격의 최대 피해를 최대값의 _%2$s%%_로 고정합니다. 당신은 창끝에 꿰뚫린 _방패면_을 앞에 세우고 있습니다. 다른 적용 모드로 전환할 수 있지만 전환할 때마다 다시 전환하려면 영웅 레벨을 올려야 하며, 그 전까지 부정적 영향이 더 커집니다.\n\n이 장신구의 강화에는 막대한 연금술 에너지가 소모됩니다.
items.trinkets.spearshield.switch_spear=결합 창방패의 창끝을 앞으로 겨누자 장신구가 일부 에너지를 잃었습니다.
items.trinkets.spearshield.switch_shield=결합 창방패의 방패면을 앞으로 세우자 장신구가 일부 에너지를 잃었습니다.
items.trinkets.spearshield.switch_fail=이 장신구의 에너지를 회복해 적용 모드를 다시 전환하려면 영웅 레벨을 올려야 합니다.
items.trinkets.spearshield$spearshieldcooldown.name=결합 창방패-회복
items.trinkets.spearshield$spearshieldcooldown.desc=방금 결합 창방패의 적용 모드를 전환해 장신구의 에너지를 일부 소모했습니다. 다시 전환하려면 에너지가 충분히 회복되어야 합니다.\n\n이 장신구는 영웅 레벨을 올려 에너지를 회복합니다. 에너지가 회복되기 전까지 공격과 방어의 최소값 보정은 최대값의 0%%로 고정됩니다.\n\n회복 필요 레벨: %.2f\n장신구가 가방에 없으면 회복할 수 없습니다.
items.weapon.melee.latherwhip.name=가죽 채찍
items.weapon.melee.latherwhip.stats_desc=이 무기는 놀라운 공격 사거리를 지닙니다.
items.weapon.melee.latherwhip.ability_name=세게 휘두르기
items.weapon.melee.latherwhip.typical_ability_desc=결투가는 가죽 채찍으로 주변의 모든 적을 _세게 휘두릅니다_. 이 무기 기술은 보통 사거리 안의 각 적에게 _%1$d~%2$d의 피해_를 주며 반드시 명중합니다.
items.weapon.melee.latherwhip.ability_desc=결투가는 가죽 채찍으로 주변의 모든 적을 _세게 휘두릅니다_. 이 무기 기술은 사거리 안의 각 적에게 _%1$d~%2$d의 피해_를 주며 반드시 명중합니다.
### 최종 추가 번역
items.weapon.melee.latherwhip.desc=손에 잘 맞는 가죽 채찍입니다. 피해는 적지만 긴 사거리가 이를 보완합니다.
items.food.tincture.name=안혼 틴크처
items.food.tincture.eat_msg=정신을 차려 보니 벌써 들이켰습니다!
items.food.tincture.desc=침향을 술에 오래 담가 추출한 틴크처로 마음을 달래고 어둠의 공포에 맞설 정신을 돕습니다. 액체 음식이라 빠르게 먹을 수 있습니다.\n\n허기는 조금만 채우지만 공포를 즉시 해제하고 수도사의 이성을 크게 회복합니다.
items.food.tincture.discover_hint=영웅의 재능으로 이 아이템을 발견할 수 있습니다.
items.remains.bottledenergy.name=병에 든 에너지
items.remains.bottledenergy.desc=연금술에 정통한 수도사가 남긴 약제입니다. 액체 연금 에너지 결정이 들어 있으며 마개를 뽑아 사용할 수 있습니다. 마개를 힘껏 뽑으면 병이 유리 조각으로 부서져 사라집니다.
items.weapon.spraygun.name=연금 분사총
items.weapon.spraygun.ac_spray=분사
items.weapon.spraygun.ac_load_energy=에너지 장전
items.weapon.spraygun.ac_load_potion=약제 장착
items.weapon.spraygun.prompt=분사 방향을 선택하세요
items.weapon.spraygun.prompt_load=감정한 약제 한 병을 선택하세요
items.weapon.spraygun.no_charges=분사총의 약액이 바닥나 분사할 수 없습니다.
items.weapon.spraygun.no_target=자신을 겨눌 수 없다는 신념이 있습니다.
items.weapon.spraygun.full=분사총의 약액이 충분해 장전할 필요가 없습니다.
items.weapon.spraygun.no_energy=연금 에너지가 부족해 분사총을 장전할 수 없습니다.
items.weapon.spraygun.load_energy=분사총에 연금 에너지를 장전해 약액을 보충했습니다.
items.weapon.spraygun.load_reason=이성을 연금 에너지로 변환해 분사총을 장전했습니다.
items.weapon.spraygun.load_potion=분사총에 %s을(를) 장착해 약액을 보충했습니다.
items.weapon.spraygun.load_strength=분사총에 힘의 물약을 장착했습니다. 약제는 온전히 남았습니다.
items.weapon.spraygun.load_concentrated=분사총에 농축 약제를 추가 장착해 약액을 보충하고 다음 분사를 강화했습니다.
items.weapon.spraygun.desc_unloaded=개조 흔적이 많은 총입니다. 연결된 병에 약제를 장착해 분사합니다. 병 안에는 액체 연금 에너지 결정이 가득하며 약액처럼 분사할 수 있지만 효과는 미미합니다.
items.weapon.spraygun.desc_loaded=개조 흔적이 많은 총입니다. 연결된 병에 약제를 장착해 분사합니다. 병 안의 약액은 장착한 약제와 색이 다르고 해당 씨앗의 분쇄액처럼 보입니다.
items.weapon.spraygun.stats=직접 강화할 수 없지만 레벨에 따라 강해집니다. 현재 레벨에서 약액은 적을 _%d_칸 밀쳐냅니다.
items.weapon.spraygun.stats_alchemist=직접 강화할 수 없지만 레벨에 따라 강해집니다. 현재 레벨에서 약액은 _%1$d~%2$d의 피해_를 주고 적을 _%3$d_칸 밀쳐냅니다.
items.weapon.spraygun.charges=약제 한 병의 사용 횟수는 제한되며 현재 약액은 _%1$d/%2$d_입니다. 소진되면 약제를 다시 장착하거나 같은 양의 연금 에너지로 장전할 수 있습니다. 에너지가 부족하면 이성을 소모해 에너지를 만들 수 있습니다.
items.weapon.spraygun.concentrated=_농축 약제_를 추가 장착하면 다음 분사가 강화됩니다.
items.weapon.spraygun.effect_none=약제를 장착하지 않으면 무해한 액체 연금 에너지 결정을 분사합니다.
items.weapon.spraygun.effect_none_alchemist=약제를 장착하지 않으면 뜨거운 액체 연금 에너지 결정을 분사합니다.
items.weapon.spraygun.effect_strength=_힘의 물약_을 장착하면 분사의 밀쳐내기 거리가 늘고 적을 약화합니다.
items.weapon.spraygun.effect_strength_alchemist=_힘의 물약_을 장착하면 더 강하게 밀쳐내고 적을 무력화합니다.
items.weapon.spraygun.effect_liquid_flame=_액체 화염 물약_을 장착하면 불꽃을 분사해 대상에게 약간의 화상 피해를 줍니다.
items.weapon.spraygun.effect_liquid_flame_alchemist=_액체 화염 물약_을 장착하면 많은 불꽃을 분사해 막대한 화상 피해를 줍니다.
items.weapon.spraygun.effect_haste=_신속 물약_을 장착하면 일정 간격으로 시간 소모 없이 분사하며 적의 이동 속도를 잠시 낮춥니다.
items.weapon.spraygun.effect_haste_alchemist=_신속 물약_을 장착하면 아군의 능력을 잠시 높이고 적의 이동 속도를 낮춥니다.
items.weapon.spraygun.effect_healing=_치유 물약_을 장착하면 아군을 효과적으로 치료합니다.
items.weapon.spraygun.effect_healing_alchemist=_치유 물약_을 장착하면 아군을 해치지 않고 강하게 치료하며 초과 치유량은 보호막이 됩니다.
items.weapon.spraygun.effect_frost=_서리 물약_을 장착하면 냉기를 분사해 일정 확률로 대상을 얼립니다.
items.weapon.spraygun.effect_frost_alchemist=_서리 물약_을 장착하면 피해와 밀쳐내기 없이 대상을 즉시 얼립니다.
items.weapon.spraygun.effect_levitation=_부유 물약_을 장착하면 적을 잠시 기절시킵니다.
items.weapon.spraygun.effect_levitation_alchemist=_부유 물약_을 장착하면 적을 기절시키고 지면에 물을 고입니다.
items.weapon.spraygun.effect_toxic_gas=_독가스 물약_을 장착하면 적에게 중독을 일으킵니다.
items.weapon.spraygun.effect_toxic_gas_alchemist=_독가스 물약_을 장착하면 적에게 산성 부식을 일으킵니다.
items.weapon.spraygun.effect_purity=_정화 물약_을 장착하면 적의 약화 효과 지속 시간이 늘어납니다.
items.weapon.spraygun.effect_purity_alchemist=_정화 물약_을 장착하면 아군의 약화를 제거하고 적의 약화 지속 시간을 늘립니다.
items.weapon.spraygun.effect_paralytic_gas=_마비 가스 물약_을 장착하면 착탄 즉시 전기장을 만듭니다.
items.weapon.spraygun.effect_paralytic_gas_alchemist=_마비 가스 물약_을 장착하면 넓고 강한 전기장을 만듭니다.
items.weapon.spraygun.effect_experience=_경험 물약_을 장착하면 아군을 오래 축복하거나 언데드와 악마에게 피해를 줍니다.
items.weapon.spraygun.effect_experience_alchemist=_경험 물약_을 장착하면 아군을 오래 축복하고 언데드와 악마에게 추가 피해를 줍니다.
items.weapon.spraygun.effect_mind_vision=_마음의 눈 물약_을 장착하면 적과 접촉할 때 무작위로 순간이동시킵니다.
items.weapon.spraygun.effect_mind_vision_alchemist=_마음의 눈 물약_을 장착하면 적을 순간이동시키고 잠시 위치를 감지하지만 피해는 없습니다.
items.weapon.spraygun.effect_invisibility=_투명화 물약_을 장착하면 적을 잠시 실명시킵니다.
items.weapon.spraygun.effect_invisibility_alchemist=_투명화 물약_을 장착하면 적을 실명시키고 범위에 아군이 있으면 연금술사를 투명화합니다.
items.weapon.spraygun.discover_hint=어떤 영웅이 처음부터 이 아이템을 지닙니다.
