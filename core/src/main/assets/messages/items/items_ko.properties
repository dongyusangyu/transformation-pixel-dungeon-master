items.bags.bag.discover_hint=상점에서 구매하면 이 아이템을 발견할 수 있습니다.
items.bags.velvetpouch.discover_hint=영웅이 처음부터 지니고 있는 아이템입니다.
items.bombs.arcanebomb.discover_hint=다른 아이템을 조합하면 이 아이템을 발견할 수 있습니다.
