items.trinkets.twindemoneyes.stats_desc_laser=현재 레벨에서 이 장신구는 원거리 무기가 명중하면 _%1$d턴_ 동안 정밀 고정해 시야와 관계없이 대상 위치를 알 수 있게 하지만 _%1$d턴_ 동안 실명시킵니다. 고정 중 _레이저 눈_이 힘을 모아 종료 시 대상에게 강한 광선을 쏘고 다른 고정 모드로 전환합니다.\n\n이 장신구 강화에는 막대한 연금술 에너지가 소모됩니다.
items.trinkets.twindemoneyes.flame_eye=마염 눈
items.trinkets.twindemoneyes.laser_eye=레이저 눈
items.trinkets.twindemoneyes.mode_changed_laser=오른쪽 눈이 레이저 눈으로 전환되었습니다.
items.trinkets.twindemoneyes.mode_changed_flame=오른쪽 눈이 마염 눈으로 전환되었습니다.
