items.weapon.melee.ritualdagger.no_reason_buff=지금은 의식 단검의 찌르기를 감당할 수 없습니다.
items.weapon.melee.ritualdagger.stab_enemy=적의 가슴에 단검을 찔러 이성 50을 회복했습니다.
items.weapon.melee.ritualdagger.stab_self=손가락을 찔러 이성 100을 잃었습니다.
items.weapon.melee.ritualdagger.ondeath=손가락을 찔러 과다출혈로 사망했습니다...
items.weapon.melee.ritualdagger.rankings_desc=사망 원인: 의식 단검
items.weapon.melee.ritualdagger.wnd_desc=의식 단검이 충분한 피를 흡수했습니다. 어떻게 찌르시겠습니까?
items.weapon.melee.ritualdagger.stab_enemy_opt=적에게 찌르기
items.weapon.melee.ritualdagger.stab_self_opt=자신에게 찌르기
items.weapon.melee.ritualdagger.desc=피로 물든 단검입니다. 칼날의 붉은빛이 사라지지 않고 불길한 기운을 냅니다. 손에 쥐면 피를 갈망하는 것이 느껴집니다.
items.weapon.melee.ritualdagger.desc_ready=피로 물든 단검입니다. 충분한 피를 흡수해 다음 찌르기가 정신 에너지를 돌려주거나 정신을 크게 소모하게 합니다. 사용법에 따라 달라집니다.
items.weapon.melee.ritualdagger.stats=직접 강화할 수 없지만 레벨에 따라 강해집니다. 현재 _%1$d~%2$d의 피해_를 주며 정상 사용에 _%3$d 힘_이 필요합니다.
items.weapon.melee.ritualdagger.fast=매우 빠른 무기입니다.\n
items.weapon.melee.ritualdagger.no_equip=장비하지 않아도 바로 사용할 수 있습니다.
items.weapon.melee.ritualdagger.discover_hint=직업 전문화를 선택한 영웅이 얻습니다.
items.weapon.melee.ritualdagger$ritualtracker.name=희생 의식
items.weapon.melee.ritualdagger$ritualtracker.desc=의식 단검이 피를 갈망합니다...\n\n적 13명을 누적 처치하면 신자는 턴을 소모하지 않고 특별한 찌르기를 사용할 수 있습니다.\n\n적을 찌르면 큰 피해를 주고 이성 50을 회복합니다.\n\n자신을 찌르면 약간의 피해를 받고 이성 100을 잃습니다.\n\n이 의식을 완료하려면 적 %1$d명을 더 처치해야 합니다.
items.weapon.melee.ritualdagger$bloodgift.name=피의 선물
items.weapon.spraygun$hastespraycooldown.name=신속 분사-재사용 대기
items.weapon.spraygun$hastespraycooldown.desc=연금 분사총으로 방금 빠르게 분사했습니다. 총열이 식을 때까지 다시 빠른 분사를 할 수 없습니다.\n\n남은 대기 시간: %s턴
items.armor.friararmor.name=영웅의 로브
items.armor.friararmor.desc=이 기묘한 로브를 입으면 수도사가 특수 기술을 사용할 수 있습니다.
items.artifacts.instructiontool.max_drone=생산한 드론은 10대를 넘을 수 없습니다.
items.treasures.treasures.name=보물
items.treasures.treasures.desc=밀봉된 귀중한 보물 상자입니다. 가치는 희귀도로 결정됩니다. 강화, 중첩, 변환할 수 없습니다.
items.treasures.treasures.rarity=희귀도: _%s_
