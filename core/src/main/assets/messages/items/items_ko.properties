items.artifacts.holytome.no_spell=현재 이 주문을 시전할 수 없습니다.
items.artifacts.holytome.cursed=저주받은 성서는 사용할 수 없습니다.
items.artifacts.holytome.levelup=성서가 더 강해졌습니다!
items.artifacts.holytome.discover_hint=영웅이 처음부터 지니고 있는 아이템입니다.
