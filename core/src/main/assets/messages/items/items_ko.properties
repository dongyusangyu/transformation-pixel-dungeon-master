items.weapon.melee.tier6.soulblade.typical_stats_desc=0~%1$d의 피해를 막습니다. 강화하면 방어량이 증가합니다.\n공격 시 영혼을 가를 확률이 있으며 최대 생명력에 비례한 추가 마법 피해를 줍니다.\n보통 일정 시간마다 공격으로 사용자에게 %2$d 보호막을 제공합니다. %3$s
items.weapon.melee.tier6.soulblade.stats_desc=0~%1$d의 피해를 막습니다. 강화하면 방어량이 증가합니다.\n공격 시 영혼을 가를 확률이 있으며 최대 생명력에 비례한 추가 마법 피해를 줍니다.\n일정 시간마다 공격으로 사용자에게 %2$d 보호막을 제공합니다. %3$s
