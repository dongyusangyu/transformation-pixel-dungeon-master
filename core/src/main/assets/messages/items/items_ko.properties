items.artifacts.instructiontool.discover_hint=어떤 영웅이 처음부터 이 아이템을 지닙니다.
items.artifacts.instructiontool.action=지휘
items.artifacts.instructiontool.prompt2=여기는 기능 메뉴입니다. 기능 설명과 해당 기능의 사용법을 확인할 수 있습니다.\n\n_회수:_ 지정한 드론 하나를 선택해 회수합니다. 드론의 현재 생명력이 최대 생명력의 80%보다 높으면 도구 충전량 1을 돌려받습니다.\n_지휘-배회:_ 드론을 아무거나 누르면 모든 드론이 배회 상태가 됩니다(인접하지 않은 드론을 두 번 눌러 개별 배회시킬 수도 있습니다).\n_지휘-추종:_ 영웅을 누르면 모든 드론이 추종 상태가 됩니다(인접하지 않은 드론을 한 번 누른 뒤 영웅을 눌러 개별 추종시킬 수도 있습니다).\n_지휘-공격:_ 적을 누르면 모든 드론이 공격 상태가 됩니다(인접하지 않은 드론을 한 번 누른 뒤 적을 눌러 개별 공격시킬 수도 있습니다).\n_지휘-대기:_ 타일을 누르면 모든 드론이 대기 상태가 됩니다(인접하지 않은 드론을 한 번 누른 뒤 타일을 눌러 개별 대기시킬 수도 있습니다).\n_위치 확인:_ 켜져 있으면 시야 밖에 있는 모든 드론의 위치를 알 수 있고 지정한 드론을 원격 조작할 수 있습니다.
