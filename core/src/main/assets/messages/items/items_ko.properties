items.artifacts.instructiontool$drone.discover_hint=어떤 영웅의 유물을 통해 이 개체를 발견할 수 있습니다.
items.weapon.missiles.damagegear.name=폐기된 기어
items.weapon.missiles.damagegear.stats_desc=이 무기는 투척할 수 있을 뿐 아니라 DM-400이 자신을 수리해 해당 내구도만큼 생명을 회복하는 데 사용할 수도 있습니다. 수리로 회복하는 총 생명력은 현재 최대 생명력의 절반을 넘지 않습니다.
items.weapon.missiles.damagegear.desc=어디서 모았는지 알 수 없는 폐기 부품입니다. 손에 들면 무게가 확실히 느껴집니다. 적에게 던지는 것 외에 무언가를 수리하는 데 쓸 수도 있을 것 같습니다.
