items.weapon.melee.ritualdagger.no_target=그렇게는 할 수 없습니다.
items.weapon.melee.ritualdagger.too_far=적이 너무 멉니다.
items.weapon.melee.ritualdagger.bad_stab_target=가까운 적이나 자신을 선택해야 합니다.
