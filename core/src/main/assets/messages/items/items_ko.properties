items.artifacts.shuriken_box.desc_equipped=이 수리검 상자가 던지는 작은 수리검은 각각 _%1d~%2d의 피해_를 줍니다. 투척 무기 피해를 높이는 효과가 있다면 작은 수리검에도 적용됩니다.\n\n이동 후 작은 수리검을 턴 소모 없이 던질 수 있으며 대상의 방어를 무시합니다. 명중하면 _%3$s%%_ 확률로 대상을 3턴 동안 마비시킵니다. 이미 이렇게 마비된 대상은 다시 작은 수리검에 마비되지 않습니다.\n\n작은 수리검은 투척 무기의 특성을 지녀 원거리 투척 시 정확도가 높지만 인접한 대상에게는 정확도가 크게 낮아집니다.
