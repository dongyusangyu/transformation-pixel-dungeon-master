items.artifacts.instructiontool$instructionmark.name=지령 표식
items.artifacts.instructiontool$instructionmark.desc=이 적은 DM-400에게 표식되었습니다.\n\nDM-400의 물리 공격은 공격한 적에게 일정 시간 표식을 남길 수 있으며, 그동안 모든 전투 드론의 공격이 해당 대상에게 추가 효과를 줍니다.\n\n표식 지속 턴: %s턴
items.artifacts.instructiontool$instructionmark.desc_at=이 적은 AT-400에게 주요 공격 대상으로 표식되었습니다.\n\n표식이 있는 동안 이 적이 AT-400의 물리 공격으로 받는 피해가 30%% 증가합니다(전투 드론이 주는 피해는 증가하지 않습니다).\n\n표식 지속 턴: %s턴
items.artifacts.instructiontool$instructionmark.desc_au=이 적은 AU-400에게 고위험 대상으로 표식되었습니다.\n\n표식이 있는 동안 이 적이 AU-400에게 주는 물리 공격 피해가 20%% 감소합니다(지원 드론이 받는 피해는 감소하지 않습니다).\n\n표식 지속 턴: %s턴
items.artifacts.instructiontool$drone.name=윙맨 드론
items.artifacts.instructiontool$drone.desc=처음 생산할 수 있는 기본 드론입니다. 기본적인 전투 성능과 우수한 방호 능력을 갖췄습니다.\n\n약간의 초기 방어력을 지니며, 지령 표식이 있는 적을 공격하면 대상의 방어력에 따라 추가 피해를 줍니다. 도구에 업그레이드 이외의 두루마리를 입력하면 해당 드론으로 자동 변화합니다.
