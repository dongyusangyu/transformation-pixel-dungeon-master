items.remains.brokentool.name=망가진 제어 장치
items.remains.brokentool.desc=망가진 금속 제어 장치입니다. 한때 어떤 기계 창조물이 사용하던 도구였던 듯합니다. 비합리적으로 보이지만 노출된 전선을 연결해 잠시 사용할 수 있으며, 자신과 완전히 같은 환영을 만들어 냅니다. 사용한 뒤, 즉 전기 신호가 흐르는 순간 완전히 고장 나 산산이 부서져 사라집니다.
