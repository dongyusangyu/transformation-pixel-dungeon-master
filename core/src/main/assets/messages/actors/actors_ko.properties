actors.hero.abilities.cleric.trinity.max_drone=현재 10기의 드론이 생산되어 최대 생산 한도에 도달했습니다. 삼위일체로도 생산할 수 없습니다。
levels.minigame.extraction.overburden.name=수색 철수 하중
levels.minigame.extraction.overburden.desc=전리품의 하중이 장비가 제공하는 이동 가속을 억누르고 있습니다. 점유된 가방 칸 하나당 남은 장비 가속이 2/3로 유지됩니다. 가방 용기와 물주머니는 하중에 포함되지 않습니다。\n\n점유된 가방 칸: %d\n장비 가속 유지: %d%%
levels.minigame.extraction.extractionraidrun.session_name=수색 철수 위탁
levels.minigame.extraction.extractionraidrun.session_desc=이 의뢰는 현재의 수색타격철수 대전 기록을 담고 있습니다. 이를 통해 자진으로 항복할 수 있으며, 이는 사망과 동일한 반하드코어 손실을 초래합니다.
levels.minigame.extraction.extractionraidrun.missing_key=철수 장치가 반응하지 않습니다. 수정 열쇠가 필요합니다。
levels.minigame.extraction.extractionraidrun.extract_title=철수 지점
levels.minigame.extraction.extractionraidrun.extract_body=철수 장치가 %d개의 수정 열쇠를 인식했습니다. 지금 철수하여 이번 판의 전리품을 보존하시겠습니까?
levels.minigame.extraction.extractionraidrun.extract=즉시 철수
levels.minigame.extraction.extractionraidrun.continue_raid=계속 수색
levels.minigame.extraction.extractionraidrun.success=철수 성공, 이번 판에서 획득한 전리품이 안전 아이템으로 전환되었습니다。
levels.minigame.extraction.extractionraidrun.success_bonus=철수 성공, 남은 수정 열쇠가 %d골드로 교환되었습니다。
levels.minigame.extraction.extractionraidrun.failure=철수 실패: 이번 판 전리품 %1 일반 소모품 %2 잃었습니다。
levels.minigame.extraction.extractionraidrun.abandon_action=수색 철수 포기
levels.minigame.extraction.extractionraidrun.abandon_title=이번 판을 포기하시겠습니까?
levels.minigame.extraction.extractionraidrun.abandon_body=철수 지점을 통해 나가지 않으면, 이번 판의 표시된 아이템 전부를 잃고 일반 소모품 1~2개를 무작위로 잃습니다。
levels.minigame.extraction.extractionraidrun.abandon=손실 감수

actors.blobs.pheromone.desc=페로몬 가스가 여기 깔려 있습니다. 영웅을 혼란시키고 쾌락 신도의 동맹을 강화합니다。
actors.mobs.chaosdisciples$succboss.name=쾌락 신도
actors.mobs.chaosdisciples$succboss.desc=쾌락 신도는 한때 서큐버스였으며, 작은 악마의 친구였습니다. 작은 악마의 야망을 돕기 위해 강력한 힘을 추구하여 혼돈의 신 쾌락의 신도가 되었습니다。\n\n쾌락 신도는 많은 서큐버스를 소환하여 자신을 위해 싸우게 할 수 있습니다. 다행히도 이 능력은 일정 시간 간격으로만 발동할 수 있습니다. 그 외에도 페로몬 가스를 방출하여 적 유닛의 영웅에 대한 침몰 또는 고용 효과를 해제하고 치유 및 호르몬 고동을 부여하며, 영웅과 그 동맹을 매혹시킵니다。
actors.mobs.chaosdisciples$summoncooldown.name=서큐버스 소환-대기
actors.mobs.chaosdisciples$summoncooldown.desc=쾌락 신도가 방금 서큐버스를 소환했습니다. 잠시 후에 다시 발동할 수 있습니다。\n\n잔여 대기 시간: %s턴
actors.mobs.chaosdisciples$scorpioboss.name=나구 신도
actors.mobs.chaosdisciples$scorpioboss.desc=나구 신도는 한때 거대 전갈이었으며, 작은 악마의 친구였습니다. 작은 악마의 야망을 돕기 위해 강력한 힘을 추구하여 혼돈의 신 나구의 신도가 되었습니다。\n\n나구 신도는 전염병을 퍼뜨리는 데 능숙하며, 주변에 치명적인 바이러스 가스를 방출합니다. 그 외에도 강력한 방어력을 가지고 있어 물리 공격과 마법 공격 모두 그를 해치기 어렵고, 원거리 물리 피해를 반사할 수 있습니다. 하지만 _특정 원소 피해에 더 취약한 것 같습니다_。
actors.mobs.chaosdisciples$scorpioboss.fire=불! 불! 너무 더워!
actors.mobs.chaosdisciples$eyeboss.name=첸치 신도
actors.mobs.chaosdisciples$eyeboss.desc=첸치 신도는 한때 사악한 눈이었으며, 작은 악마의 친구였습니다. 작은 악마의 야망을 돕기 위해 강력한 힘을 추구하여 혼돈의 신 첸치의 신도가 되었습니다。\n\n첸치 신도는 교활한 녀석으로, 일정 시간마다 고대 신처럼 치명적인 레이저를 발사할 수 있습니다. 그 외에도 무서운 흑마법을 방출하여 영웅의 정신을 혼란시키며, 공격을 받은 후 무작위 텔레포트를 수행합니다。
actors.mobs.chaosdisciples$ripperboss.name=공노 신도
actors.mobs.chaosdisciples$ripperboss.desc=공노 신도는 한때 찢는 자였으며, 작은 악마의 친구였습니다. 작은 악마의 야망을 돕기 위해 강력한 힘을 추구하여 혼돈의 신 공노의 신도가 되었습니다。\n\n공노 신도는 호전적인 녀석으로 근접 전투에 능숙하며, 근접 전투와 피격 시 이익과 연속 공격 효과를 얻어 그의 무서운 이동력과 공격 빈도를 더욱 강화합니다. 그의 손에 죽은 영웅만 56명에 달합니다。
actors.mobs.chaosdisciples$ripperboss.combo=공노 신도의 현재 연속 공격 수는 %d입니다
actors.mobs.chaosdisciples$ripperboss.combotime=, 남은 연속 공격 시간은 %s턴입니다。
actors.mobs.npcs.greatimp.name=작은 악마?
actors.mobs.npcs.greatimp.newyear=새해 복 많이 받아! 내가 왜 여기 있냐고? 그건 중요하지 않아, 어서 부적을 가지러 가!
actors.mobs.npcs.greatimp.hello=깜짝이야! 내가 왜 여기 있냐고? 그건 중요하지 않아, 어서 부적을 가지러 가!
actors.mobs.npcs.greatimp.amulet=부적을 찾았어? 그럼 얼른 집에 가서 가족과 함께 설날을 보내자!
actors.mobs.npcs.greatimp.warning=결국 들켰군. 내가 여기 온 이유는 고대 신 Yog-Dzewa의 남은 힘을 빼앗아 모든 악마 군단을 지휘한 다음, 이 지하 감옥을 지배하고, 나아가 전 세계를 정복하기 시작하기 위해서다! 너는 여기서 나를 막으려고 무의미한 저항을 할 거냐, 아니면 조용히 떠나서 남은 인생을 즐기겠냐?
actors.mobs.npcs.greatimp.yes=그를 막아라!
actors.mobs.npcs.greatimp.no=나랑 상관없어
actors.mobs.npcs.greatimp.time=형제들, 올라타! 나를 위해 시간을 벌어줘!
actors.mobs.npcs.greatimp.desc=왜인지는 모르지만, 작은 악마가 이곳에 와 있습니다。
actors.mobs.npcs.greatimp.die=날 위해 시간을 벌어줘서 고마워. 이제 나는 무적이다!
actors.mobs.npcs.greatimp.nothing=......
actors.mobs.greatdemon.name=큰 악마
actors.mobs.greatdemon.desc=방금 고대 신의 힘을 흡수한 작은 악마는 더 긴 악마 뿔, 수염, 날개가 자라났습니다... 더 이상 작은 악마라고 부를 수 없으며, 큰 악마라고 불러야 합니다。\n\n큰 악마는 강건한 몸을 가지고 있으며, 일정 시간마다 특정 공격을 막아내고 반사합니다. 전투 마법에 대한 지식이 부족하여 다양한 마법을 사용하기는 어렵지만, 근접 전투 능력은 상당히 뛰어나며, 다른 하급 악마를 소환하여 보조 전투를 하게 할 수도 있습니다。
actors.mobs.greatdemon.die=이 힘이, 어째서 이렇게 약한 거지, 앞날이 기구하구나...
actors.mobs.greatdemon.throw=자, 내 롱기누스의 창을 한번 받아봐라!
actors.mobs.greatdemon.melee=한번 악마 참격을 맛보아라!
actors.mobs.greatdemon.summon=내 부름에 응답하라, 악마들이여!
actors.mobs.greatdemon.defence=피부 경화! 칼이든 창이든, 나를 조금도 해칠 수 없다!
actors.mobs.greatdemon.haste=큰 악마가 악마의 날개를 빠르게 펄럭이며 엄청난 속도로 비행합니다。
actors.mobs.greatdemon.magic=마력 방어, 가동!
actors.mobs.greatdemon.missiles=마법 결계, 모든 화살과 화살촉을 반사해 줘!
actors.mobs.greatdemon$summoncooldown.name=악마 소환-대기
actors.mobs.greatdemon$summoncooldown.desc=큰 악마가 방금 하급 악마 2마리를 소환했습니다. 잠시 후에 다시 발동할 수 있습니다。\n\n잔여 대기 시간: %s턴
actors.mobs.greatdemon$hastecooldown.name=마력 날개-대기
actors.mobs.greatdemon$hastecooldown.desc=큰 악마가 방금 맹렬히 마력 날개를 펄럭여 가속 효과를 얻었습니다. 이제 잠시 쉬어야 합니다。\n\n잔여 대기 시간: %s턴
actors.mobs.greatdemon$magiccooldown.name=마법 방어-대기
actors.mobs.greatdemon$magiccooldown.desc=마법 방어는 일정 시간만 유지됩니다. 잠시 후에 다시 발동할 수 있습니다。\n\n잔여 대기 시간: %s턴
actors.mobs.greatdemon$meleescooldown.name=가시 피부-대기
actors.mobs.greatdemon$meleescooldown.desc=가시 피부는 일정 시간만 유지됩니다. 잠시 후에 다시 발동할 수 있습니다。\n\n잔여 대기 시간: %s턴
actors.mobs.greatdemon$missilescooldown.name=원거리 반사-대기
actors.mobs.greatdemon$missilescooldown.desc=원거리 반사는 일정 시간만 유지됩니다. 잠시 후에 다시 발동할 수 있습니다。\n\n잔여 대기 시간: %s턴
actors.mobs.greatdemon$throwcooldown.name=롱기누스의 창-대기
actors.mobs.greatdemon$throwcooldown.desc=롱기누스의 창이 방금 큰 악마에 의해 던져졌습니다. 잠시 후에 다시 발동할 수 있습니다。\n\n잔여 대기 시간: %s턴
actors.mobs.greatdemon$meleesdefence.name=가시 피부
actors.mobs.greatdemon$meleesdefence.desc=일정 시간 동안 근접 피해를 크게 줄이고, 일부 피해를 공격자에게 반사합니다。\n\n잔여 턴 수: %s턴
actors.mobs.greatdemon$missilesdefence.name=원거리 반사
actors.mobs.greatdemon$missilesdefence.desc=일정 시간 동안 투척 무기의 피해를 완전히 면역하고, 마법의 형태로 공격자에게 반격합니다。\n\n잔여 턴 수: %s턴

actors.mobs.landpiranha.name=거대 육지 피라냐
actors.mobs.landpiranha.desc=거대 피라냐가 기이한 마법의 힘으로 인해 다리가 생기고 공기 중에서 숨을 쉴 수 있게 되었습니다. 어떤 재능의 힘을 약화시키면 원래 상태로 돌아갈지도 모릅니다。
actors.mobs.landpiranha.discover_hint=특정 부정적 재능을 가진 후 어떤 지하 감옥 지역에서든 이 적을 발견할 수 있습니다。
actors.mobs.phantomlandpiranha.name=환영 육지 피라냐
actors.mobs.phantomlandpiranha.desc=환영 육지 피라냐는 환영 피라냐가 기이한 마법에 의해 뒤틀린 희귀 변종으로, 기이한 반투명 몸체와 마법 능력을 가지고 있습니다. 공격을 받으면 텔레포트할 수 있어 공격도 하고 도망도 칠 수 있습니다!\n\n대처하기는 어렵지만, 그 고기는 마법력을 지녀 매우 귀중하게 여겨집니다。
actors.mobs.phantomlandpiranha.discover_hint=특정 부정적 재능을 가진 후 어떤 지하 감옥 지역에서든 이 적을 발견할 수 있습니다。
actors.mobs.teststatue.name=테스트 석상
actors.mobs.teststatue.desc=누군가 여기 세워둔 석상입니다. 매우 단단해 보여서, 당신도 주먹질하고 싶어집니다。
actors.mobs.goldboss$monkmaster.name=무술 달인
actors.mobs.goldboss$monkmaster.desc=무술 달인은 드워프 무도의 정점에 도달한 자로, 그 능력의 한계를 본 사람은 아무도 없습니다。\n\n무술 달인의 상대가 아무리 빨라도, 무술 달인은 항상 상대보다 더 빠릅니다. 무술 달인은 비열한 술책을 혐오하므로, 그를 화나게 하지 않는 것이 좋습니다。
actors.mobs.goldboss$monkmaster.missileweapon=젠장, 뒤에서 치는 거냐, 그럼 덤벼봐!
actors.mobs.goldboss$goldelemental.name=황금 원소
actors.mobs.goldboss$goldelemental.desc=황금 원소는 상점 주인이 드워프 왕이 남긴 원소 정체의 법에 따라 소환한 원소 생물입니다。\n\n황금 원소는 스스로 원소 정체의 법을 사용하여 다른 원소 생물을 소환할 수 있으며, 영웅의 재물을 빼앗거나 심지어 무에서 재물을 창조할 수도 있습니다。
actors.mobs.goldboss$goldelemental.steal=황금 원소가 당신의 몸에서 300골드를 빼냈습니다。
actors.mobs.goldboss$goldelemental.give=황금 원소가 당신의 가방에 400골드를 무에서 창조했습니다。
actors.mobs.goldboss$goldgolem.name=황금 골렘
actors.mobs.goldboss$goldgolem.desc=황금 골렘은 상점 주인의 손을 거쳐 개조된 골렘으로, 온몸이 황금으로 만들어져 일반 골렘보다 훨씬 위압적입니다。\n\n황금 골렘은 일반 골렘에 비해 텔레포트 능력은 잃었지만, 더 강력한 공방 속성을 가지며, 생물을 마비시키는 고압 전기장을 즉시 방출할 수 있고, 마법 생물을 순간적으로 압도할 수도 있습니다。
actors.mobs.goldboss$goldgolem.electricity=에너지 외부 유출, 방출!
actors.mobs.goldboss$electricitycooldown.name=전기장 방출-대기
actors.mobs.goldboss$electricitycooldown.desc=황금 골렘이 방금 전기장을 방출했습니다. 잠시 후에 다시 방출할 수 있습니다。\n\n잔여 대기 시간: %s턴
actors.mobs.goldboss$thymor.name=대마도사 티무르
actors.mobs.goldboss$thymor.desc=티무르는 뛰어난 드워프 흑마법사로, 무술 달인과 협력하여 드워프 왕의 통치를 전복하려 했으나, Yog-Dzewa가 이끄는 악마 군단의 공포를 목격한 후 결국 드워프 왕에게 귀순하여 최전선에서 악마와 싸워 왔습니다. 현재는 드워프 왕이 죽은 후 상점 주인과 협력하여 당신의 Yendor 부적을 빼앗아 이미 썩어버린 드워프 도성을 부흥시키려 하고 있습니다。\n\n티무르는 흑마법과 광범위한 저주 금지 마법을 사용하는 데 능숙하며, 누군가가 그가 순식간에 거대한 악마 군단을 소멸시키는 것을 목격했다고 합니다。
actors.mobs.goldboss$thymor.curse=왜비왜비, 왜비바부!
actors.mobs.goldboss$thymor.cursedo=찌리구루루, 방출!
actors.mobs.goldboss$thymor.bolt_kill=당신은 티무르의 강력한 흑마법에 의해 죽었습니다...
actors.mobs.goldboss$sheepcursecooldown.name=광범위 사망 저주-대기
actors.mobs.goldboss$sheepcursecooldown.desc=사망 저주는 적대적 생물을 즉시 죽일 수 있지만, 영웅은 이 효과에 면역입니다。\n\n잔여 대기 시간: %s턴
actors.buffs.mostdegrade.name=극강 등급 하락 저주
actors.buffs.mostdegrade.desc=강력한 어둠 마법이 업그레이드 두루마리가 당신의 장비에 주입한 마력을 삼키고 있습니다!\n\n등급 하락 상태의 장비는 원래 등급보다 낮은 상태로 간주됩니다. _원래 몇 등급이든 상관없이 3등급 감소합니다_。아이템의 설명도 등급 하락의 영향에 따라 변경됩니다。\n\n하지만 등급 하락은 장비의 힘 요구, 지팡이 충전, 투척 무기 내구도 및 장신구에는 영향을 미치지 않습니다。\n\n등급 하락 효과 잔여 시간: %s턴\n\n티무르가 부여한 등급 하락 효과는 더 강력할 뿐만 아니라, 사악 제거 두루마리로도 해제할 수 없습니다。

actors.buffs.hunger.dmhungry=저전력
actors.buffs.hunger.dmstarving=전력 부족
actors.buffs.hunger.onhungry=배가 좀 고픕니다。
actors.buffs.hunger.ondmhungry=현재 전력이 낮습니다。
actors.buffs.hunger.ondmstarving=현재 전력이 부족합니다。
actors.buffs.hunger.cursedhorn=음식을 먹을 때 저주받은 뿔피리가 음식 에너지의 일부를 훔쳐갔습니다。
actors.buffs.hunger.desc_intro_hungry=당신의 배가 계속 음식을 갈구하고 있지만, 아직 그렇게 심각하지는 않습니다。
actors.buffs.hunger.desc_intro_starving=당신의 굶주림 정도가 생명을 위협하고 있습니다。
actors.buffs.hunger.desc_intro_dmhungry=현재 전력이 낮지만, 남은 전력으로 당분간 기체를 정상적으로 가동할 수 있습니다。
actors.buffs.hunger.desc_intro_dmstarving=현재 전력이 심각하게 부족하여 기체의 정상 가동을 위협하기 시작했습니다。
actors.buffs.hunger.desc=\n\n굶주림은 지하 감옥에서 시간을 보내면서 천천히 누적되며, 참을 수 없을 정도로 배고파질 때까지 계속됩니다. 극도로 배고플 때 생명력 회복이 중단되고 천천히 감소하기 시작합니다。\n\n음식을 합리적으로 사용하는 것이 매우 중요합니다! 생명력이 충분하다면, 음식이 더 많아질 때까지 기다렸다가 먹는 것이 좋습니다. 올바른 배급으로 음식을 더 효과적으로 활용할 수 있습니다!
actors.buffs.hunger.dmdesc=\n\n지하 감옥 전체를 탐험하면서 계속 전력을 소비합니다. 시간을 많이 보낼수록 전력도 낮아집니다. 전력이 부족해지기 시작하면 기체의 정상 가동을 위협하며, 생명력 회복이 중단되고 천천히 감소하기 시작합니다。\n\n지하 감옥에서 충전하기는 어렵지만, 당신 체내의 전체 소형 열화학 변환 시스템은 음식을 효율적으로 전기 에너지로 변환할 수 있습니다. 물론 음식도 마찬가지로 제한적이므로, 음식을 합리적으로 활용하는 방법을 배우는 것이 매우 중요합니다!
actors.hero.talent$aggressivebarriercooldown.name=맹렬한 기운 보호막-대기
actors.hero.talent$aggressivebarriercooldown.desc=방금 이 재능을 발동했습니다. 잠시 기다려야 다시 발동할 수 있습니다。\n\n잔여 대기 시간: %s턴
actors.hero.talent$liquidagilacctracker.name=액체 민첩
actors.hero.talent$liquidagilacctracker.desc=결투가의 다음 일반 근접 공격이 추가 명중률을 얻습니다。\n\n잔여 턴 수: %s
actors.hero.talent$lethalhastecooldown.name=치명적 여세-대기
actors.hero.talent$lethalhastecooldown.desc=방금 이 재능을 발동했습니다. 잠시 기다려야 다시 발동할 수 있습니다。\n\n잔여 대기 시간: %s턴
actors.hero.talent$swiftequipcooldown.name=신속 장비-대기
actors.hero.talent$swiftequipcooldown.desc=방금 이 재능을 발동했습니다. 잠시 기다려야 다시 발동할 수 있습니다。\n\n잔여 대기 시간: %s턴
actors.hero.talent$preciseassaulttracker.name=정밀 타격
actors.hero.talent$preciseassaulttracker.desc=결투가의 다음 일반 근접 공격이 명중률 보너스를 얻습니다。\n\n잔여 턴 수: %s
actors.hero.talent$deadlyfollowuptracker.name=치명적 추격
actors.hero.talent$deadlyfollowuptracker.desc=결투가가 최근 투척 무기로 적을 명중시켰습니다. 같은 대상에 대한 근접 공격이 피해 보너스를 얻습니다。\n\n잔여 턴 수: %s
actors.hero.talent$combinedlethalityabilitytracker.executed=처형
actors.hero.talent$satiatedspellstracker.name=시전 보호막
actors.hero.talent$satiatedspellstracker.desc=사제의 다음 시전이 소량의 보호막을 제공합니다。
actors.hero.talent$searinglightcooldown.name=작열하는 빛
actors.hero.talent$searinglightcooldown.desc=방금 이 재능을 발동했습니다. 잠시 기다려야 다시 발동할 수 있습니다。\n\n잔여 대기 시간: %s턴
actors.hero.talent.type=재능 유형: _%s_

actors.hero.heroclass.freeman=신사
actors.hero.heroclass.freeman_desc_short=_신사_는 더 많은 잠재력을 발휘할 수 있으며, 독특한 _서류 가방_을 초기 소지한다.
actors.hero.heroclass.freeman_desc=신사는 초기 소지하는 _독특한 서류 가방_에서 특별한 아이템이나 능력을 얻을 수 있다.

신사는 전문적인 전투 훈련을 받지 않아 전투 능력이 부족하지만, _무한한 잠재력을 발휘할 수 있다_.

또한 신사는 초기 소지품으로 _지팡이_, _행운의 은화_, 천 갑옷, 물주머니와 벨벳 주머니를 가진다.

신사가 게임 시작 시 감정하는 아이템:
_-_경험의 물약
_-_변질의 두루마리, 감정의 두루마리와 변환의 두루마리
actors.hero.heroclass.freeman_unlock=_변질의 두루마리로 변질 사용_하여 신사 해제
actors.hero.herosubclass.freeman=신사
actors.hero.herosubclass.freeman_short_desc=_신사_는 텐구의 가면에서 더 많은 힘을 얻을 수 없지만, 여전히 더 많은 잠재력을 발휘할 수 있다.
actors.hero.herosubclass.freeman_desc=신사는 텐구의 가면을 착용해도 큰 힘을 얻지 못하지만, 가면이 해체된 후 추가로 변질의 두루마리를 얻는다.

또한 신사는 더 많은 잠재력을 발휘할 수 있다.

actors.hero.heroclass.slimegirl=슬라임 소녀
actors.hero.heroclass.slimegirl_desc_short=슬라임 소녀는 초기 소지하며 벗을 수 없지만 성장하는 _점액 갑옷_을 가지며, _씨앗을 체내에서 발아_시킬 수 있다.
actors.hero.heroclass.slimegirl_desc=슬라임 소녀는 초기 소지하는 _독특한 점액 갑옷_은 벗을 수 없지만 슬라임 소녀의 레벨이 오름에 따라 추가 레벨을 얻고 심지어 등급이 상승한다.

슬라임 소녀는 힘이 낮지만 더 높은 초기 생명력과 성장을 가지며, _씨앗을 체내에서 발아시켜 해당 식물 효과_를 낼 수 있다. 이는 보통 1턴을 소모한다.

또한 슬라임 소녀는 초기 소지품으로 _징벌자의 창_, _점액 구슬 2개_, 물주머니와 벨벳 주머니를 가진다.

슬라임 소녀는 마물로서 인간의 학식이 많지 않아 게임 시작 시 감정하는 아이템:
_-_변질의 두루마리와 감정의 두루마리
actors.hero.heroclass.slimegirl_unlock=_한 게임에서 끈끈이를 처치_하여 슬라임 소녀 해제

actors.hero.heroclass.ninja=닌자
actors.hero.heroclass.ninja_desc_short=닌자는 _수리검 상자_를 사용하여 적을 타격하거나 마비시킬 수 있다. 또한 더 먼 _탐지 거리_와 더 높은 _은신 능력_을 가진다.
actors.hero.heroclass.ninja_desc=닌자는 초기 소지하는 _독특한 수리검 상자_에서 작은 수리검을 빠르게 꺼내 투척하여 적을 타격하거나 마비시킬 수 있다.

닌자는 더 먼 거리에서 _비밀과 함정을 탐지_하며, 행동이 _적에게 더 감지되기 어렵다_.

또한 닌자는 초기 소지품으로 _왜사시(脇差)_, 천 갑옷, 물주머니와 벨벳 주머니를 가진다.

닌자가 게임 시작 시 감정하는 아이템:
_-_독가스의 물약
_-_변질의 두루마리, 감정의 두루마리와 순간 이동의 두루마리
actors.hero.heroclass.ninja_unlock=_한 게임에서 텐구를 처치_하여 닌자 해제

actors.hero.heroclass.dm400=DM-400
actors.hero.heroclass.dm400_desc_short=DM-400는 _명령 집합 도구_를 사용하여 무인기를 생산해 전투를 지원하며, 물리 공격은 전투형 무인기의 효과를 _강화_한다. 또한 _비생물_ 속성을 가진다.
actors.hero.heroclass.dm400_desc=DM-400는 초기 소지하는 _독특한 명령 집합 도구_로 무인기를 생산하여 전투를 지원할 수 있다.

DM-400는 _비생물_ 속성을 가지며, 초기 생명력이 낮고 무기를 소지하지 않지만 맨손 공격으로 _1~8의 피해_를 줄 수 있다. DM-400의 물리 공격이 적에게 명중하면 3턴간 중첩되지 않는 _명령 표식_ 효과를 부여하며, 이는 일부 전투형 무인기의 효과를 강화한다.

또한 DM-400는 초기 소지품으로 _폐기된 톱니바퀴 2개_, 천 갑옷, 물주머니와 벨벳 주머니를 가진다.

DM-400가 게임 시작 시 감정하는 아이템:
_-_서리의 물약
_-_변질의 두루마리, 감정의 두루마리와 충전의 두루마리
actors.hero.heroclass.dm400_unlock=_한 게임에서 DM-300을 처치_하여 DM-400 해제
actors.hero.herosubclass.waterslime=물 슬라임
actors.hero.herosubclass.waterslime_short_desc=_물 슬라임_은 더 높은 최대 생명력을 가지며, 물리 공격을 받으면 슬라임 점액을 분열시켜 흡수하면 생명력을 회복한다.
actors.hero.herosubclass.waterslime_desc=물 슬라임은 현재 레벨의 50%에 해당하는 최대 생명력을 추가로 얻으며, 최대 생명력의 1%에 해당하는 자연 생명력 회복 배율을 가진다(최소 1).

물 슬라임은 물리 공격을 받으면 현재 생명력의 10%를 잃고 주변 9x9 범위 내에 무작위로 슬라임 점액 한 조각을 분열시키며, 이 점액을 흡수하여 최대 생명력의 10%를 회복할 수 있다.

슬라임 점액 분열 시 최소 1의 생명력을 소모하며(사망하지는 않음), 생성 후 30턴의 재사용 대기시간이 있으며, 공격을 받으면 대기시간이 1턴 감소한다.

actors.hero.herosubclass.darkslime=어둠 슬라임
actors.hero.herosubclass.darkslime_short_desc=_어둠 슬라임_은 일부 최대 생명력을 잃지만, 부식성 진흙에 면역이 되고 적에게 진흙을 튀기며, 어둠 점액 갈고리를 사용할 수 있다.
actors.hero.herosubclass.darkslime_desc=어둠 슬라임은 지하 감옥의 사악한 영양분을 흡수하여 어둠의 힘을 얻었으며, 이로 인해 최대 생명력이 20% 감소하지만 부식성 진흙에 면역이 된다.

어둠 슬라임은 대상을 공격할 때 50% 확률로 20턴간 부식성 진흙 효과를 부여하며, 피해를 받을 때도 15% 확률로 공격자에게 20턴간 부식성 진흙 효과를 부여한다(원거리 공격 시 이 확률은 두 배가 된다).

어둠 슬라임은 65턴마다 한 번씩 어둠 점액 갈고리를 발사하여 시야 내의 적 한 명을 끌어당기고 3턴간 속박 효과를 부여할 수 있다.

actors.hero.herosubclass.tatteki_ninja=철포 닌자
actors.hero.herosubclass.tatteki_ninja_short_desc=_철포 닌자_는 강력한 철포를 얻으며, 극도로 높은 피해와 긴 발사 간격을 가집니다.
actors.hero.herosubclass.tatteki_ninja_desc=철포 닌자는 철포를 얻으며, 보조 무기로 장착하여 주 무기의 레벨을 공유할 수 있습니다. 철포 사격은 극도로 높은 피해를 입히며, 명중 여부와 관계없이 시야 내의 적을 공포에 빠뜨리지만, 매 사격마다 30턴의 간격이 필요합니다.\n\n철포 닌자의 철포는 정확도가 극도로 낮고 매복에 사용할 수 없지만, 투척 무기나 작은 수리검을 던져 적에게 탄도 보정 효과를 부여할 수 있으며, 이 효과의 영향을 받은 대상은 반드시 철포에 맞게 됩니다.

철포 닌자의 철포는 명중률이极低并且 매복에 사용할 수 없지만, 투척 무기나 작은 수리검을 던져 적에게 탄도 수정 효과를 부여하여 해당 목표가 반드시 철포에 맞게 할 수 있다.

actors.hero.herosubclass.ninja_master=인술 대사
actors.hero.herosubclass.ninja_master_short_desc=_인술 대사_는 시간이 지남에 따라 인술 에너지를 얻으며, 이를 소모하여 지형에 따라 다양한 인술을 발동할 수 있다.
actors.hero.herosubclass.ninja_master_desc=인술 대사는 지형에 따라 인술 에너지를 소모하여 다양한 인술을 발동한다. 인술 에너지는 보통 40턴마다 1포인트 회복된다.

일반 지형:
은신술-그림자 은신: 순간 이동 및 은신
근접술-제비 돌기: 빠른 참격 및 혼란
투척술-그림자 일격: 다음 투척 시 적을 불구로 만들고 출혈

물 지형:
은신술-물의 인술: 일정 시간 물 위에서 이동 속도 2배
근접술-류수참: 더 먼 거리에서 참격 및 냉기 부여
투척술-비수 투척: 다음 투척 시 주변 물을 낙점으로 이동

풀 또는 잔해 지형:
은신술-초목 소생: 주변에腐莓 촉수 생성
근접술-덩굴 속박: 강력한 참격 및 행동 제한
투척술-백화난산: 다음 투척 시 무작위 유해 식물 효과 발생

actors.hero.herosubclass.at400=AT-400
actors.hero.herosubclass.at400_short_desc=_AT-400_은 더 다양한 종류의 전투용 드론을 소환하여 지원할 수 있으며, 방대한 드론 군단이 더 효과적으로 모든 적대 대상을 타격합니다.
actors.hero.herosubclass.at400_desc=AT-400는 표식이 있는 적을 공격할 때 물리 피해가 30% 증가하며, 더 많은 두루마리를 등록하여 더 다양한 종류의 전투형 무인기를 호출할 수 있으며, 이 무인기들은 전투 성능이 더 우수하다.

섬광 무인기(축령): 적을 공격하면서 시야 방해
레이저 무인기(충전): 강력한 레이저 광선으로 적을 태움
혼란 무인기(최면): 공격 시 적을 현기증나게 하거나 밀쳐냄
교란 무인기(성노): 적을 교란하거나 광란 상태로 만듦
위협 무인기(공포): 화력压制으로 적을 위협
혼돈 무인기(변환): 일정 시간 후任意 지원형 무인기나 이상한 것으로 변함

# NPC entries
actors.mobs.npcs.slimemucus.name=슬라임 점액
actors.mobs.npcs.slimemucus.desc=슬라임 점액은 물의 정령 슬라임의 몸에서 분리된 점액 덩어리입니다. 바닥에 떨어진 후 점액 아래의 미생물을 흡착하여 팽창하며, 물의 정령 슬라임이 흡수하면 더 많은 체력을 회복할 수 있습니다. 물론 적의 공격으로 파괴될 수도 있습니다.\n\n슬라임 점액은 10의 체력을 가지며, 매 턴마다 1씩 잃습니다. 물의 정령 슬라임은 점액 주변 8칸 내에서 클릭하여 흡수할 수 있습니다. 흡수 과정은 턴을 소모하지 않습니다.\n\n슬라임 점액은 물의 정령 슬라임의 절반 방어력을 상속받습니다.
actors.mobs.npcs.slimemucus.absorb_title=흡수
actors.mobs.npcs.slimemucus.absorb_confirm=흡수
actors.mobs.npcs.slimemucus.absorb_cancel=취소
actors.mobs.npcs.slimemucus.absorb_body=이것은 당신의 몸에서 분리된 점액 덩어리입니다. 주변의 많은 양분을 흡착한 것처럼 보입니다.\n\n이 점액을 흡수하시겠습니까? 체력을 회복할 수 있습니다.
actors.mobs.npcs.slimemucus.discover_hint=특정 영웅 전직을 통해 이 유닛을 발견할 수 있습니다.
actors.mobs.npcs.ghost.rat_2=제발 도와주세요... 그 혐오스러운 것을 죽여주세요...\n\n_물 근처에서 싸우세요... 그의 악취를 피하세요..._
actors.mobs.npcs.wandmaker.intro_1=\n\n나는 지팡이 제작에 필요한 희귀 재료를 찾으러 왔지만 길을 잃었고, 몸의 마법 방패도 점점 약해지고 있습니다. 당장 떠나야 하지만 빈손으로 가고 싶지는 않습니다.
actors.mobs.npcs.wandmaker.intro_2=\n\n만약 그것을 가져다 주신다면, 제가 정성껏 만든 지팡이를 보답으로 드리겠습니다! 두 개를 가져왔으니 마음에 드는 것을 고르세요.
actors.mobs.npcs.shopboss.name=상점 주인
actors.mobs.npcs.shopboss.desc=상점 주인이 당신을 따라 이곳까지 온 것 같습니다. 지금 이리저리 두리번거리며 무언가를 찾고 있는 듯합니다.
actors.mobs.npcs.shopboss.hello=보물, 금화, 헤헤… 이 먼 길을 온 보람이 있군.
actors.mobs.npcs.shopboss.warning=뭐? 너도 내 보물을 빼앗으려는 거냐? 부적을 얻었다고 잘난 척하지 마라. 눈치 있으면 당장 꺼져. 어차피 이 부적은 언젠가 내 것이 될 테니까… (음흉한 웃음)
actors.mobs.npcs.shopboss.yes=돈은 함께 나누는 거지
actors.mobs.npcs.shopboss.no=나랑 상관없어


# Boss entries
actors.mobs.rogueboss.name=도적?
actors.mobs.rogueboss.desc=사악한 고대 신은 타인의 깊은 욕망을 잘 파악하여 어둠의 길로 유인합니다. 도적?은 지금 텐구의 가면을 들고 현상금 임무 완료에 기뻐하고 있습니다. 아마 감옥 끝에 있는 텐구는 그가 죽인 것 같습니다.\n\n도적?은 그림자 속에서 치명적인 매복을 펼치는 데 능숙하며, 불리한 상황에서는 민첩한 발걸음으로 적에게서 멀어지며 수리검을 던져 공격합니다.\n\n그가 그림자 속으로 잠적하면 근접 공격이 불가능하지만, 원거리 공격을 시도해 볼 수는 있습니다.
actors.mobs.rogueboss.notice=하하, 또 하나의 먹잇감이 걸려들었군!
actors.mobs.rogueboss.angered=젠장... 그렇다면...
actors.mobs.rogueboss.invisibility=잡아 보시지?
actors.mobs.rogueboss.momentum=이제 나를 따라잡을 수 있겠나?
actors.mobs.rogueboss.execute=한 방 먹어라!
actors.mobs.rogueboss.spkill=당신은 도적?에게 참살당했습니다...
actors.mobs.rogueboss.kill=당신은 도적?의 간계에 희생되었습니다...
actors.mobs.rogueboss.rankings_desc=당신은 도적?의 간계에 희생되었습니다...
actors.mobs.rogueboss.executeninja=도적?:"닌자여, 나를 비열하다고 탓하지 마라..."
actors.mobs.rogueboss$absoluteinvisibility.name=그림자 은신
actors.mobs.rogueboss$momentumtime.desc=도적?은 현재 기동 상태입니다. 이 동안 그는 두 배 속도로 이동하며, 더 높은 회피, 정확도 및 피해 보너스를 가집니다.\n\n다행히 도적?은 피해를 받을 때마다 기동 상태 지속 시간이 3턴씩 줄어듭니다. 기동 상태가 끝나면 잠시 휴식이 필요합니다.\n\n효과 잔여 시간: %s턴
actors.mobs.rogueboss$momentumtime.spdesc=도적?이 방금 기동 상태를 종료했습니다. 휴식이 필요하며, 이 동안 더 많은 피해를 받습니다.\n\n하지만 방심하지 마십시오. 도적?은 휴식 중에도 여전히 기동력을 축적하고 있으며, 완전히 회복되면 다시 기동 상태에 돌입합니다.\n\n도적?이 %s턴 더 휴식해야 합니다.
actors.mobs.rogueboss$shadowrogue.name=그림자 도적
actors.mobs.rogueboss$shadowrogue.desc=무형의 그림자로 만들어진 도적?의 복제체입니다. 움직임 없이 텅 빈 눈을 뜨고 있으며, 연기 같은 어둠이 주변에서 서서히 피어오릅니다.\n\n완벽한 복제체라고는 할 수 없지만, 충분히 유능한 살인자입니다. 도적?이 위급한 상황에서 소환하여 당신의 발목을 잡으려 합니다. 텅 빈 눈으로 당신을 응시하는 모습이 실로 소름 끼칩니다.
actors.mobs.rogueboss$shadowrogue.discover_hint=특정 도전 과제를 활성화한 후 지하 감옥 지역에서 이 적을 발견할 수 있습니다.
actors.mobs.warriorboss.name=전사?
actors.mobs.warriorboss.desc=사악한 고대 신은 타인의 깊은 욕망을 잘 파악하여 어둠의 길로 유인합니다. 전사?는 이제 눈에 보이는 모든 생물을 삼키려 합니다.\n\n전사?는 광전사와 검투사의 전투 기술을 능숙하게 사용하며, 심지어 용감한 도약도 사용할 수 있습니다.\n\n그가 도약을 준비하기 전에, 그의 주의를 분산시킬 방법이 있을지도 모릅니다. 예를 들어... 음식.
actors.mobs.warriorboss.wake=뭐? 밥 시간인가?
actors.mobs.warriorboss.wantfood=음식, 맛있는 음식...
actors.mobs.warriorboss.def=나도 민첩하단 말이야!
actors.mobs.warriorboss.defeated=아직... 먹지 못한 음식이 많았는데...
actors.mobs.warriorboss$berserk.name=분노

actors.mobs.greatshoper.name=상점 주인
actors.mobs.greatshoper.desc=한동안 보이지 않던 상점 주인은 예전과는 완전히 다른 사람이 되었습니다. 표정과 태도에서 그의 탐욕과 기쁨이 드러나며, 그 안에는 당신에 대한 적의도 포함되어 있습니다.\n\n주인은 드워프 도서관의 비술을 이용해 자신을 모든 마법에 면역인 상태로 개조하고, 금을 마구 던지는 것을 공격 수단으로 삼았으며, 남은 드워프 강자들을 자신의 이익 집단에 결합시켰습니다.
actors.mobs.greatshoper.die=보물! 내 보물!
actors.mobs.greatshoper.gold_kill=당신은 금화에 맞아 죽었습니다...
actors.mobs.greatshoper.summon=황금 정령, 무술 대사, 이 사람을 막아라!
actors.mobs.greatshoper.summon1=두 쓸모없는 놈들! 티무르, 나를 잘 지켜라!
actors.mobs.greatshoper.phase4=티무르도 당신을 막을 수 없다는 말인가? 그럼, 이 보물들과 함께 묻혀라!
actors.mobs.greatshoper.no_damage=소용없다. 이 마법 보호막으로는 네가 나를 해칠 수 없다.
actors.mobs.greatshoper$goldcurse.name=황금 저주
actors.mobs.greatshoper$goldcurse.desc=황금 저주는 드워프가 남긴 금술 중 하나로, 시전자를 죽여야만 끝나는 강력한 저주입니다. 하지만 상점 주인이 멋대로 이 금술의 이름을 바꿔버렸습니다.\n\n황금 저주의 영향으로 영웅은 매 턴 10골드를 잃으며, 골드가 100 미만이면 매 턴 5의 생명력을 잃습니다. 다른 아군은 매 턴 1의 생명력을 잃습니다.\n\n황금 저주는 다른 출처의 피해를 지연 피해로 전환하여 주문자가 면역되기 어렵게 만듭니다.
actors.mobs.thief.carries=\n\n이 도둑은 _%s_을(를) 가지고 있습니다. 분명 훔친 것입니다.
actors.mobs.rogueboss$absoluteinvisibility.desc=도적?은 그림자 망토를 사용하여 투명 상태에 돌입했습니다.\n\n이 상태에서는 도적?에게 직접 근접 공격을 할 수 없지만, 원거리 공격을 받으면 즉시 투명이 해제됩니다.\n\n현재 생명력이 최대 생명력의 절반보다 높으면, 투명 상태의 도적?은 준비 단계에 돌입하여 10턴 후에 당신을 참살합니다. 현재 생명력이 최대 생명력의 절반보다 낮으면, 투명 상태의 도적?의 기동 효과 지속 시간이 자연히 감소하지 않습니다.\n\n그림자 은신 효과 잔여 시간: %s턴
actors.mobs.rogueboss$absoluteinvisibility.spname=준비 단계
actors.mobs.rogueboss$absoluteinvisibility.spdesc=도적?이 인내심을 가지고 기다리며, 그림자 속에서 치명타를 준비하고 있습니다.\n\n약 10턴의 준비 후, 도적?은 순간적으로 당신에게 돌진하여 참살을 시도합니다. 이 일격은 회피할 수 없고 특히 치명적입니다! 다행히 원거리 공격이 있다면 그를 방해하여 준비 단계에서 벗어나게 할 수 있습니다.\n\n도적?이 %s턴 동안 준비했습니다.
actors.mobs.rogueboss$momentumtime.name=기동
actors.mobs.rogueboss$momentumtime.spname=회복
actors.mobs.rogueboss.defeated=설마... 텐구보다 강하다니...
actors.mobs.rogueboss.enraged=격노
actors.mobs.warriorboss.kill=당신은 전사?의 육탄 돌진에 의해 으스러졌습니다...
actors.mobs.warriorboss$combo.name=연속 공격
actors.mobs.warriorboss$combo.desc=전사?는 연속으로 적을 타격하며 점점 더 강해집니다. 공격이 명중할 때마다 연속 공격 수가 1씩 증가하지만, 오랫동안 공격하지 않으면 연속 공격 수가 초기화됩니다.\n\n일정 연속 공격 수에 도달하면 전사?는 받아넘기기를 활성화하여 막대한 보호막을 얻고 다음 공격을 반드시 회피합니다. 받아넘기기를 활성화하면 연속 공격 수가 초기화됩니다.\n\n현재 연속 공격 수: %1$d\n\n연속 공격이 %2$s턴 후에 사라집니다.
actors.mobs.warriorboss.wantjump=젠장, 다리가 짧다고 무시하는 거냐?!
actors.mobs.warriorboss.eat=이 음식은 정말 맛있군...
actors.mobs.warriorboss.leap=육탄 돌진!
actors.mobs.warriorboss$berserk.angered_desc=전사?가 입은 부상 정도에 따라 공격력이 증가합니다. 전사?가 물리 피해를 받으면 분노를 축적하여 더 강력한 공격력을 얻습니다.\n\n분노는 시간이 지나면 사라집니다. 전사?의 생명력이 낮을수록 분노가 오래 지속됩니다.\n\n현재 분노: _%.0f%%_\n_+%.0f%%_ 피해

# Buff entries
actors.buffs.championenemy$corrosion.name=부식 정예
actors.buffs.championenemy$corrosion.desc=근접 공격 속도 +100% 및 부식 진흙 효과, 사망 시 주변에 부식 진흙 분사
actors.buffs.championenemy$haste.name=신속 정예
actors.buffs.championenemy$haste.desc=근접 공격 속도 +100%, 이동 속도 +50%
actors.buffs.championenemy$transform.name=변화 정예
actors.buffs.championenemy$transform.desc=받는 피해 -25%, 사망 후 최대 체력의 3% 생명력으로 해당 지역 무작위 적으로 부활, 부활 후 변화 정예 속성 상실 및 무작위 정예 속성 1개 획득
actors.buffs.championenemy$holy.name=신성 정예
actors.buffs.championenemy$holy.desc=받는 피해 -25%, 사망 후 최대 체력의 5% 생명력으로 부활 및 5턴 무적 효과 획득, 부활 후 신성 정예 속성 상실
actors.buffs.darkhook.name=암액 갈고리
actors.buffs.darkhook.desc=마음에 드는 사냥감을 고를 때입니다.\n\n65턴마다 한 번씩 암액 갈고리를 발사하여 시야 내의 한 적을 끌어당기고 %s턴의 결박 효과를 부여합니다.\n\n이 기술의 거리 제한은 12칸입니다.
actors.buffs.darkhook.cant_pull=대상을 끌어당길 수 없습니다.
actors.buffs.darkhook.more_distance=거리가 너무 멀어 닿을 수 없습니다.
actors.buffs.darkhook.does_nothing=이 거리에서는 더 이상 끌어당길 수 없습니다.
actors.buffs.ninja_energy.name=인술 에너지
actors.buffs.ninja_energy.desc=인술 대사는 시간이 지남에 따라 인술 에너지를 얻습니다. 이 에너지를 소모하여 지형에 따라 다양한 인술을 발동할 수 있습니다.\n\n인술 에너지는 보통 40턴마다 1포인트 회복됩니다.\n\n현재 에너지: %d/10
actors.buffs.ninja_energy.action=인술
actors.buffs.ninja_energy$ninjaability$transported.name_normal=둔술-그림자 은신
actors.buffs.ninja_energy$ninjaability$transported.desc_normal=1턴을 소모하여 최대 5칸 떨어진 위치로 순간 이동하고 5턴의 투명 효과를 얻습니다.
actors.buffs.ninja_energy$ninjaability$transported.name_grass=둔술-초목 소생
actors.buffs.ninja_energy$ninjaability$transported.desc_grass=주변에 1~3개의 침몰한 썩은 덩굴 촉수를 생성할 수 있습니다.
actors.buffs.ninja_energy$ninjaability$transported.name_water=둔술-수둔
actors.buffs.ninja_energy$ninjaability$transported.desc_water=물 위에서 이동 속도가 2배가 되는 유유자적 효과를 8턴 동안 얻습니다.
actors.buffs.ninja_energy$ninjaability$transported.less=공간이 부족하여 촉수를 생성할 수 없습니다.
actors.buffs.ninja_energy$ninjaability$transported.more_distance=거리가 너무 멀어 순간 이동할 수 없습니다.
actors.buffs.ninja_energy$ninjaability$taijutsu.name_normal=근접술-제비 돌기
actors.buffs.ninja_energy$ninjaability$taijutsu.desc_normal=적에게 50% 피해의 참격을 가하고 5턴의 현기증을 부여합니다.
actors.buffs.ninja_energy$ninjaability$taijutsu.name_grass=근접술-덩굴 속박
actors.buffs.ninja_energy$ninjaability$taijutsu.desc_grass=적에게 125% 피해의 참격을 가하고 5턴의 결박을 부여합니다.
actors.buffs.ninja_energy$ninjaability$taijutsu.name_water=근접술-류수참
actors.buffs.ninja_energy$ninjaability$taijutsu.desc_water=적에게 가하는 참격이 추가 1칸의 공격 거리를 가지며 5턴의 동상을 부여합니다.
actors.buffs.ninja_energy$ninjaability$throw.name_grass=투척술-백화난산
actors.buffs.ninja_energy$ninjaability$throw.name_water=투척술-비수 투척
actors.buffs.ninja_energy$ninjaability$throw.name_normal=투척술-그림자 일격
actors.buffs.ninja_energy$ninjaability$throw.desc_grass=투척술 효과를 얻어, 다음에 풀숲이나 잔디 지형에서 투척 시 무작위 유해 식물 효과를 발동시킵니다.
actors.buffs.ninja_energy$ninjaability$throw.desc_water=투척술 효과를 얻어, 다음에 물 지형에서 투척 시 인술 대사 주변의 물 지형을 해당 낙점으로 이동시킵니다.
actors.buffs.ninja_energy$ninjaability$throw.desc_normal=투척술 효과를 얻어, 다음에 일반 지형에서 투척 시 투척 무기 피해에 기반한 출혈과 불구를 부여합니다.
actors.buffs.ninja_energy$ninjaability$throw.hive_throw=투척술 상태에 돌입했습니다.
actors.buffs.ninja_energy$watersmooth.name=유유자적
actors.buffs.ninja_energy$watersmooth.desc=인술 대사가 수둔술을 발동했습니다. 이 효과 동안 인술 대사의 물 위 이동 속도가 2배가 됩니다.\n\n잔여 턴 수: %s턴
actors.buffs.ninja_energy$gas_storage.name=가스 저장
actors.buffs.ninja_energy$gas_storage.desc=인술 대사가 주변의 가스를 체내에 저장합니다. 다음 투척술 사용 시 이 가스를 목표 위치에 방출할 수 있습니다.
actors.buffs.ninja_energy$throw_skill.name=투척술
actors.buffs.ninja_energy$throw_skill.desc=닌자 마스터가 닌자 에너지를 손에 축적하며, 이 에너지는 투척 무기와 함께 던져져 추가 효과를 발생시킵니다.\n\n일반 지형에서는 투척 시 투척 무기 피해에 기반한 출혈과 불구 효과가 추가됩니다.\n\n물 지형에서는 투척 시 닌자 마스터 주변의 물 지형을 해당 낙점으로 이동시킬 수 있습니다.\n\n풀숲이나 잔디 지형에서는 투척 시 무작위 유해 식물 효과를 발동시킵니다.

# Ability entries
actors.hero.abilities.ninja.decoy.name=그림자 무사
actors.hero.abilities.ninja.decoy.short_desc=닌자가 _그림자 무사_를 소환하여 전투를 보조하고 치명타를 대신 받게 합니다.
actors.hero.abilities.ninja.decoy.less=공간이 부족하여 그림자 무사를 소환할 수 없습니다.
actors.hero.abilities.ninja.decoy$decoyman.name=그림자 무사
actors.hero.abilities.ninja.decoy$decoyman.desc=그림자가 형체화된 그림자 무사입니다. 그 동작 하나하나가 당신과 똑같아서 적이 당신과 그를 구분하기 어렵습니다.\n\n매우 취약해 보이며, 당신이 치명타를 받을 때 대신 받아낼 수 있습니다. 하지만 그 대가로 막대한 피해를 입거나 즉시 사망할 수도 있습니다.
actors.hero.abilities.ninja.decoy$decoyman.discover_hint=특정 영웅 갑옷 기술을 통해 이 유닛을 발견할 수 있습니다.
actors.hero.abilities.ninja.decoy$decoyman.direct_follow=목숨을 걸고 따르겠다!
actors.hero.abilities.ninja.decoy$decoyman.die2=푸하... 이 연기... 정말 맛없어...
actors.hero.abilities.ninja.decoy$decoyman.die3=살아있는 것 자체가, 전투의 증거입니다...
actors.hero.abilities.ninja.decoy$shadowmark.name=그림자 표식
actors.hero.abilities.ninja.onesword.name=일지태도
actors.hero.abilities.ninja.onesword.short_desc=닌자가 검성의 전투 오의 _일지태도_를 펼쳐, 단시간에 이동 속도, 근접 공격 속도 및 근접 피해를 증가시킵니다.
actors.hero.abilities.ninja.onesword$oku_onesword.name=오의: 일지태도
actors.hero.abilities.ninja.spiderjar.name=평거미 솥
actors.hero.abilities.ninja.spiderjar.short_desc=닌자가 대량의 화약을 _평거미 솥_에 장전하여 불을 붙인 후 던집니다. 심지가 다 타면 엄청난 폭발 피해를 줍니다.
actors.hero.abilities.ninja.spiderjar$spider.name=평거미 솥
actors.hero.abilities.ninja.spiderjar$spider.desc=화약으로 가득 찬 귀중한 다기 세트로, 어떤 거물이 가장 아끼는 물건이었습니다. 지금은 닌자가 화약을 가득 채우고 심지에 불을 붙였습니다.\n\n이 다기에서는 매혹적인 향기가 나며, 지속적으로 적을 끌어들입니다.
actors.hero.abilities.ninja.spiderjar$smallspider.name=작은 거미 솥
actors.hero.abilities.ninja.spiderjar$smallspider.desc=평거미 솥이 폭발한 후, 안에 작은 거미 솥이 완전히 폭발하지 않은 채 남아있습니다.\n\n이 다기에서는 매혹적인 향기가 나며 화려한 사이버 LED 조명 효과가 있어 지속적으로 적을 끌어들입니다.
actors.hero.abilities.slime.madslime.desc=슬라임 양이 섭식 욕구로 가득 차 있습니다. 인접한 적 한 명을 삼켜 포만감을 회복할 수 있습니다. 삼켜진 적은 막대한 피해를 입고 즉사합니다.\n\n슬라임 양은 보스, 중간 보스, 정예 및 아군을 삼킬 수 없습니다.\n\n기본 포만감 회복: 250 (식사 제한 도전 과제의 영향을 받음)
actors.hero.abilities.slime.madslime.eat=대상이 정말 맛있습니다. 힘이 솟는 것을 느낍니다.
actors.hero.abilities.slime.madslime.eat2=무언가 당신을 보호하는 장벽이 있는 것 같습니다.
actors.hero.abilities.slime.madslime.no_target=삼킬 대상이 없습니다.
actors.hero.abilities.slime.madslime.more_distance=대상이 너무 멉니다.
actors.hero.abilities.slime.madslime.strong_target=대상을 삼킬 수 없습니다.
actors.hero.abilities.slime.springspell.short_desc=슬라임 양이 _춘계 법진_을 소환하여 자신과 아군이 약초 요양 효과를 얻습니다.
actors.hero.abilities.slime.springspell.desc=슬라임 양이 춘계 법진을 소환하여 자신과 아군에게 약초 요양 효과를 제공할 수 있습니다.\n\n기본 치유량: 25
actors.hero.abilities.slime.rapidwaterfall.desc=슬라임 양이 자신을 중심으로 증발하는 수증기를 생성하여 주변 지역을 물웅덩이로 바꿀 수 있습니다.\n\n수증기 기본량: 45
actors.hero.abilities.slime.rapidwaterfall$rapidwater.name=비류폭류
actors.hero.abilities.dm400.routine$overload.name=과부하 모드
actors.hero.abilities.dm400.routine$overload.desc=경고! DM-400과 그 부속 드론이 과부하 모드에 돌입했습니다!\n\n이 동안 DM-400과 드론의 공격 속도와 이동 속도가 두 배가 되지만, DM-400이 받는 피해도 증가합니다.\n\n잔여 턴 수: %s턴
actors.hero.abilities.dm400.discharge_gas.name=폐가스 배출
actors.hero.abilities.dm400.discharge_gas.short_desc=DM-400이 _폐가스 배출_을 수행하여 체내에 축적된 유해 가스를 방출합니다.
actors.hero.abilities.dm400.discharge_gas.desc=DM-400이 체내에 오래 축적된 폐가스를 배출하여 시야 내의 모든 적에게 독가스를 분사하고, 자신의 모든 디버프 효과를 제거합니다.\n\n시야 내에 적이 없으면 독가스를 방출하지 않고 자신의 디버프만 제거합니다.\n\n폐가스 기본량: 50
actors.hero.abilities.dm400.honeycomb.desc=DM-400이 벌집 군집 프로그램을 가동합니다. 20턴 동안 드론이 파괴될 때마다 DM-400이 최대 생명력의 %만큼 회복하고, 2턴의 유물 충전을 부여합니다.
actors.hero.abilities.dm400.honeycomb$honeycombbuff.name=군집 프로그램
actors.hero.abilities.freeman.salescontract.short_desc=신사가 적을 현혹하여 _고용 계약_을 체결하게 하여, 적이 평생 그를 위해 일하게 합니다.
actors.hero.abilities.freeman.salescontract$saleself.name=평생 고용
actors.hero.abilities.freeman.salescontract$saleself.desc=이 적은 신사에게 속아 자신을 무조건 신사에게 팔아넘겼으며, 지금은 신사를 위해 일하고 있습니다.\n\n이미 계약을 체결한 적은 분명 다시 계약할 수 없습니다. 아무리 그래도 다음 생까지 바칠 수는 없지 않겠습니까?
actors.hero.abilities.freeman.salescontract$workerwraith.desc=억울함과 원한을 가득 안고 죽은 노동자(마물)가 화한 원령입니다. 비록 육체는 죽었지만 여전히 계약 내용에 따라 신사를 위해 일해야 합니다.\n\n불쌍하게도 정말로 신사에게 두 번 일하게 되었습니다.

# Ally entries
actors.hero.ally.attackdrone.name=전투형 드론
actors.hero.ally.attackdrone.desc=전투 전용 드론입니다.
actors.hero.ally.attackdrone$anesthesiadrone.name=마취 드론
actors.hero.ally.attackdrone$anesthesiadrone.desc=_최면 두루마리_를 등록하여 생산된 전투형 드론입니다. 두 개의 기계 팔에 전기 충격 장치가 연결되어 있으며, 대상을 마비시킬 정도는 아니지만 현기증을 유발합니다.\n\n지휘 표식 효과가 있는 적을 공격 시 33% 확률로 3턴 현기증을 부여하고 추가로 50% 확률로 한 칸 밀쳐냅니다.
actors.hero.ally.attackdrone$flashdrone.name=섬광 드론
actors.hero.ally.attackdrone$flashdrone.desc=_구마 두루마리_를 등록하여 생산된 전투형 드론입니다. 레이저 총신이 장착되어 있지만 실제로는 동공에서 레이저 광선을 발사하여 적을 공격합니다.\n\n3칸의 공격 거리를 가지며, 지휘 표식 효과가 있는 적을 공격 시 7턴 실명시킵니다. 또한 지휘 표식이 있는 언데드 및 악마 속성 적에게 추가로 5의 마법 피해를 입힙니다.
actors.hero.ally.attackdrone$laserdrone.name=레이저 드론
actors.hero.ally.attackdrone$laserdrone.desc=_충전 두루마리_를 등록하여 생산된 전투형 드론입니다. 떠 있는 대형 레이저 포처럼 보이며 실제로도 그렇습니다. 발사되는 레이저는 고기 구이에 매우 적합할 것입니다.\n\n원거리 공격 및 마법 피해를 입히며, 지휘 표식 효과가 있는 적을 공격 시 50% 확률로 3턴 연소시킵니다.
actors.hero.ally.attackdrone$shockdrone.name=충격 드론
actors.hero.ally.attackdrone$shockdrone.desc=_공포 두루마리_를 등록하여 생산된 전투형 드론입니다. 중형 저격 총신이 장착되어 있어 대상의 살점을 쉽게 꿰뚫을 수 있습니다.\n\n원거리 공격을 하며, 지휘 표식이 없는 적을 공격 시 17% 확률로 1턴의 지휘 표식을 부여합니다. 지휘 표식이 있는 적을 공격 시 33% 확률로 6턴 공포에 빠뜨립니다.
actors.hero.ally.attackdrone$raiddrone.name=습격 드론
actors.hero.ally.attackdrone$raiddrone.desc=_격노 두루마리_를 등록하여 생산된 전투형 드론입니다. 이 소형 드론은 더 빠른 비행 속도를 가지며, 대상을 괴롭히는 데 매우 적합합니다.\n\n2배의 비행 속도와 1칸의 공격 거리를 가집니다. 지휘 표식이 없는 적을 공격 시 33% 확률로 1턴의 지휘 표식을 부여합니다. 지휘 표식이 있는 적을 공격 시 17% 확률로 3턴 광란에 빠뜨립니다.
actors.hero.ally.auxiliarydrone.name=보조형 드론
actors.hero.ally.auxiliarydrone.desc=보조 전용 드론입니다.
actors.hero.ally.auxiliarydrone$scoutdrone.name=정찰 드론
actors.hero.ally.auxiliarydrone$scoutdrone.desc=_감정 두루마리_를 등록하여 생산된 보조형 드론입니다. 주로 정찰 작업에 사용되며, 동공이 항상 주변 지형과 활동 대상을 스캔합니다. 또한 호스트와 전체 시야를 공유하는 유일한 부속 드론입니다.\n\n초기 시야 범위는 작지만(도구 업그레이드 시 확장), DM-400과 전체 시야를 공유하며 시야 내 모든 적의 약점을 표시하여 표시된 적이 받는 피해를 33% 증가시킵니다(중첩 불가).
actors.hero.ally.auxiliarydrone$escortdrone.name=호위 드론
actors.hero.ally.auxiliarydrone$escortdrone.desc=_탐지 두루마리_를 등록하여 생산된 보조형 드론입니다. 호스트의 행동을 은폐하는 능력을 가지고 있어 탐험 활동에 안전을 제공합니다.\n\nDM-400의 행동이 적에게 감지되기 어렵게 만들며, 일정 시간마다 DM-400을 4턴 투명 상태로 만듭니다.
actors.hero.ally.auxiliarydrone$protectdrone.name=보호 드론
actors.hero.ally.auxiliarydrone$protectdrone.desc=_전송 두루마리_를 등록하여 생산된 보조형 드론입니다. 호스트 주변에 무형의 방어 역장을 생성하며, 파괴되면 공격자를 다른 곳으로 이동시킵니다.\n\n존재 시 DM-400에게 추가 1~3의 방어구를 제공하며, 적에게 파괴되면 적을 무작위 장소로 전송시킵니다.
actors.hero.ally.auxiliarydrone$bombdrone.name=폭발 드론
actors.hero.ally.auxiliarydrone$bombdrone.desc=_복수 두루마리_를 등록하여 생산된 보조형 드론입니다. 큰 살상력을 가진 폭파 능력을 가지며, 빠르게 목표에 접근하여 자폭 공격을 합니다. 폭발은 호스트와 다른 부속 드론을 해치지 않습니다.\n\n2배의 비행 속도를 가지며, 주변 1칸에 적이 있으면 지속적으로 생명력을 잃습니다. 생명력이 모두 소진되거나 파괴되면 적에게만 피해를 주는 폭발을 일으킵니다.
actors.hero.ally.auxiliarydrone$mirrordrone.name=거울 드론
actors.hero.ally.auxiliarydrone$mirrordrone.desc=_거울 두루마리_를 등록하여 생산된 보조형 드론입니다. 새로운 영상 기술을 채택하여 자유롭게 행동하는 사용자의 거울상을 투영할 수 있습니다.\n\n일정 시간마다 주변에 DM-400의 거울상을 1개 생성합니다. 업그레이드 도구는 거울상 생성에 필요한 시간을 단축시킵니다.
actors.hero.ally.auxiliarydrone$chaosdrone.name=혼돈 드론
actors.hero.ally.auxiliarydrone$chaosdrone.desc=_변화 두루마리_를 등록하여 생산된 특수 드론입니다. 알 수 없는 이유로 출처를 알 수 없는 흑백 색상 블록이 몸 주변에서 깜빡입니다.\n\n아무 기능도 없으며, 일정 시간 후 DM-400의 전문화에 따라 무작위 보조형 또는 전투형 드론으로 변화합니다. 업그레이드 도구는 변화에 필요한 시간을 단축시킵니다.
actors.hero.ally.auxiliarydrone$weaknessmark.name=약점 표식
actors.hero.ally.auxiliarydrone$weaknessmark.desc=이 적의 약점이 정찰 드론에 의해 표시되었습니다.\n\n정찰 드론의 시야 내에 있는 적은 약점이 지속적으로 표시되어 받는 피해가 33% 증가합니다.\n\n잔여 턴 수: %s턴

# Remaining non-talent entries
actors.hero.abilities.slime.madslime.name=광식 일기
actors.hero.abilities.slime.madslime.short_desc=슬라임 양이 _광식 일기_를 터득하여, 무한한 섭식 욕구로 인접한 적을 삼켜버릴 수 있습니다.
actors.hero.abilities.slime.madslime.eat1=상처가 천천히 치유되는 것을 느낍니다.
actors.hero.abilities.slime.madslime.self_target=자신을 선택할 수 없습니다.
actors.hero.abilities.slime.springspell.name=춘계 법진
actors.hero.abilities.slime.rapidwaterfall.name=비류폭류
actors.hero.abilities.slime.rapidwaterfall.short_desc=슬라임 양이 _비류폭류_를 펼쳐 주변에 증발하는 수증기를 가득 채우고, 주변 지역을 물웅덩이로 바꾸며 모든 함정을 파괴합니다.
actors.hero.abilities.slime.rapidwaterfall.desc=슬라임 양이 _비류폭류_를 펼쳐 주변에 증발하는 수증기를 가득 채웁니다. 이 수증기는 주변 지역을 물웅덩이로 바꾸며 모든 함정을 파괴합니다.
actors.hero.abilities.slime.rapidwaterfall$rapidwater.desc=증발하는 수증기로 주변 지역을 물웅덩이로 바꾸고 모든 함정을 파괴합니다.
actors.hero.abilities.ninja.onesword.desc=닌자가 검성의 전투 오의 일지태도를 펼쳤습니다! 이 오의는 10턴간 지속됩니다.\n\n오의 일지태도를 펼친 후, 닌자는 2배의 이동 속도와 50%의 공격 속도를 가지며, 근접 피해가 10% 증가합니다. 손에 든 무기가 협차나 일본도라면 근접 피해가 추가로 20% 증가합니다.
actors.hero.abilities.ninja.onesword$oku_onesword.desc=신당류 최강의 검술 오의로, 지금은 닌자가 근접 기술에 활용하여 이동 속도, 공격 속도 및 근접 피해를 증가시킵니다.\n\n잔여 턴 수: %s턴
actors.hero.abilities.ninja.decoy.desc=닌자가 그림자 무사를 소환했습니다. 그림자 무사가 존재하는 동안 이 능력을 사용하여 그를 지휘할 수 있습니다. 그림자 무사는 초기에 40의 생명력과 10~15의 공격력을 가집니다.\n\n그림자 무사는 닌자의 전투를 보조할 수 있습니다. 닌자가 치명적인 공격을 받으면 그림자 무사가 대신 막대한 피해를 받고 사망합니다.
actors.hero.abilities.ninja.decoy$decoyman.direct_attack=전군 출격!
actors.hero.abilities.ninja.decoy$decoyman.direct_defend=명령대로 하겠습니다.
actors.hero.abilities.ninja.decoy$decoyman.directed_wander=적을 찾아 섬멸하라.
actors.hero.abilities.ninja.decoy$decoyman.die1=고향의 벚꽃이 또 피었군요, 하지만 돌아갈 수 없습니다...
actors.hero.abilities.ninja.decoy$decoyman.die4=사요나라... (폭발 사산)
actors.hero.abilities.ninja.decoy$shadowmark.desc=그림자 무사가 이 적에게 그림자 표식을 새겼습니다.\n\n표식이 새겨진 적은 닌자와 그림자 무사에게 더 많은 피해를 받습니다.\n\n잔여 턴 수: %s턴
actors.hero.abilities.ninja.spiderjar.desc=고천명 평거미 솥은 폭발하기 전에 생물은 물론 기계까지도 취하게 하는 향기를 발산하여, 잠들지 않은 적을 끌어들여 냄새를 맡게 합니다. 일반적으로 끌려든 적은 매 턴 50% 확률로 시야 내의 닌자나 아군에게 주의를 돌립니다.\n\n고천명 평거미 솥은 폭발 후 3x3 범위의 유닛에게 20~40의 피해를 줍니다.
actors.hero.abilities.ninja.spiderjar$spider.ondeath=당신은 마츠나가 히사히데처럼 화약에 불을 붙여 모두에게 멋진 불꽃놀이를 선사했습니다...
actors.hero.abilities.freeman.salescontract.name=고용 계약
actors.hero.abilities.freeman.salescontract$workerwraith.name=노동자 원령
actors.hero.abilities.dm400.routine.name=정기 유지 보수
actors.hero.abilities.dm400.routine.short_desc=DM-400이 _정기 유지 보수_를 수행하여 단시간에 자체 기능을 향상시킵니다.
actors.hero.abilities.dm400.routine.desc=DM-400이 4턴 동안 자체 정기 유지 보수를 수행합니다. 이 동안 받는 피해가 50% 감소하며, 이후 10턴의 과부하 상태에 돌입합니다.\n\n과부하 동안 DM-400은 2배의 공격 속도와 이동 속도를 가지며(드론도 혜택을 받음), 자체가 받는 피해가 50% 증가합니다.
actors.hero.abilities.dm400.honeycomb.name=벌집 군집
actors.hero.abilities.dm400.honeycomb.short_desc=DM-400이 _벌집 군집_ 프로그램을 가동합니다. 드론이 파괴될 때마다 호스트에게 버프를 제공합니다.
actors.hero.abilities.dm400.honeycomb$honeycombbuff.desc=DM-400이 이 프로그램을 실행 중입니다. 부속 드론이 호스트와 데이터를 공유합니다.\n\n프로그램 실행 중 모든 부속 드론이 파괴되면 호스트에 데이터를 전송하여 DM-400의 생존 상태를 유지하고 새 드론 생성을 가속화합니다.\n\n잔여 턴 수: %s턴
actors.hero.herosubclass.au400=AU-400
actors.hero.herosubclass.au400_short_desc=_AU-400_는 더 다양한 종류의 보조형 드론을 호출할 수 있으며, 강력한 기능을 가진 드론으로 생존 능력을 효과적으로 향상시킬 수 있습니다.
actors.hero.herosubclass.au400_desc=AU-400은 표식이 있는 적의 물리 공격을 받을 때 20%의 피해 감소를 가지며, 더 많은 두루마리를 등록하여 더 다양한 종류의 보조형 드론을 호출할 수 있으며, 이 드론들은 보조 성능이 더욱 우수합니다.\n\n정찰 드론(감정): 정찰과 동시에 적의 약점을 드러냄\n거울 드론(거울): 일정 시간마다 당신의 거울상을 생성\n보호 드론(전송): 방어력을 향상시키고 위험한 적을 이동시킴\n호위 드론(탐지): 행동을 은폐하여 탐험 안전성 향상\n폭발 드론(복수): 자폭으로 적을 살상\n혼돈 드론(변화): 일정 시간 후 무작위 전투형 드론이나 이상한 것으로 변함
actors.blobs.discharge_gas$dm400gas.name=기계 폐가스
actors.blobs.discharge_gas$dm400gas.desc=여기에 녹색을 띤 기계 폐가스가 소용돌이치고 있습니다. DM-400과 그 드론은 이 가스의 영향을 무시합니다.

