actors.hero.talent.abyssal_gaze.title=심연의 응시
actors.hero.talent.abyssal_gaze.desc=_+1：_해리 지팡이 시전 시 생물 또는 고체 지형 관통 시 피해 관통 보정 효과 _2배_ 증가。\n\n_+2：_1의 효과에 더해, 해리 지팡이 시전 피해 _20% 증가_。
actors.hero.talent.abyssal_gaze.comment=「네가 심연을 응시할 때, 심연도 너를 응시하고 있다。」

actors.hero.talent.moronity.title=치우
actors.hero.talent.moronity.desc=_+1：_지팡이 또는 완드 시전 시 _무작위로 1턴 혼란, 취약 또는 허약_ 부여。\n\n_+2：_지팡이 또는 완드 시전 시 _무작위로 2턴 혼란, 취약 또는 허약_ 부여。\n\n_+3：_지팡이 또는 완드 시전 시 _무작위로 3턴 혼란, 취약 또는 허약_ 부여。
actors.hero.talent.moronity.comment=이 재능은 세 가지 약화 효과 중 하나를 무작위로 부여하며, 한 번에 모두 부여하지는 않습니다。

actors.hero.talent.journey_nature.title=자연의 여정
actors.hero.talent.journey_nature.desc=_+1：_자연의 신발의 씨앗 드롭 확률 증가 효과 _50% 향상_。\n\n_+2：_1의 효과에 더해, 자연의 신발의 뿌리내림 충전 소모 _50% 감소_(사용 시 충전 요구량은 변경되지 않음)。
actors.hero.talent.journey_nature.comment=「여사냥꾼이 신는 신발。」

actors.hero.talent.love_backstab.title=사랑의 등짝 칼
actors.hero.talent.love_backstab.desc=_+1：_매혹_ 상태의 유닛에게 피해 _15% 증가_。\n\n_+2：_매혹_ 상태의 유닛에게 피해 _30% 증가_。\n\n_+3：_매혹_ 상태의 유닛에게 피해 _45% 증가_。
actors.hero.talent.love_backstab.comment=「감옥 첫 번째 검, 먼저 마음을 찌른다。」

actors.hero.talent.concept_grid.title=개념 방어
actors.hero.talent.concept_grid.desc=_+1：_비굶주림 피해, 지연 피해의 _피해 -1_, 모든 피해 감소 후 계산。\n\n_+2：_비굶주림 피해, 지연 피해의 _피해 -2_, 모든 피해 감소 후 계산。\n\n_+3：_비굶주림 피해, 지연 피해의 _피해 -3_, 모든 피해 감소 후 계산。
actors.hero.talent.concept_grid.comment=

actors.hero.talent.abacus.title=주판
actors.hero.talent.abacus.desc=_+1：_물리 공격 시 _50% 확률_로 _2 중첩 가능 보호막_ 증가。\n\n_+2：_물리 공격 시 _75% 확률_로 _2 중첩 가능 보호막_ 증가。\n\n_+3：_물리 공격 시 _반드시_ _2 중첩 가능 보호막_ 증가。
actors.hero.talent.abacus.comment=

actors.hero.talent.time_sand.title=시간의 모래
actors.hero.talent.time_sand.desc=_+1：_시간 모래시계가 자신을 정지시켜 건너뛸 수 있는 턴 _2배_。\n\n_+2：_1의 효과에 더해, 시간 모래시계의 충전당 주변 동결 지속 시간 _1턴 증가_(첫 번째 충전 소모 시 증가하지 않음)。\n\n_+3：_1과 2의 효과에 더해, 시간 모래시계 충전 속도 _20% 증가_。
actors.hero.talent.time_sand.comment=「더 월드!!!」

actors.hero.talent.damaged_core.title=파손된 코어
actors.hero.talent.damaged_core.desc=_+1：_물리 공격 시 _1 마법 피해_ 추가。\n\n_+2：_물리 공격 시 _2 마법 피해_ 추가。
actors.hero.talent.damaged_core.comment=「치킨 요리 천하제일!」

actors.hero.talent.read_profitable.title=책 속의 이익
actors.hero.talent.read_profitable.desc=해당 재능 업그레이드 시, 두루마리 읽기 시 무작위로 _1종 버프_ 획득。\n\n_+1：_무작위 버프에 _5턴 전면 정화, 부유 또는 신속_ 포함。\n\n_+2：_1의 효과에 더해, _5턴 투명_ 포함。\n\n_+3：_1과 2의 효과에 더해, _최대 체력 2.5%의 체력_ 회복 포함。
actors.hero.talent.read_profitable.comment=이 재능은 무질서 마법서를 읽어도 발동됩니다。

actors.hero.talent.strength_cloak.title=강화 망토
actors.hero.talent.strength_cloak.desc=_+1：_암흑 망토의 충전당 추가로 _1턴 그림자 은신_ 부여。\n\n_+2：_암흑 망토의 충전당 추가로 _1.5턴 그림자 은신_ 부여。\n\n_+3：_암흑 망토의 충전당 추가로 _2턴 그림자 은신_ 부여, 충전 속도 _20% 증가_。
actors.hero.talent.strength_cloak.comment=

actors.hero.talent.anesthesia.title=마취 팅크
actors.hero.talent.anesthesia.desc=_+1：_물약 섭취 시 _5 보호막_ 획득하여 다음 피해 방어。\n\n_+2：_물약 섭취 시 _8 보호막_ 획득하여 다음 피해 방어。
actors.hero.talent.anesthesia.comment=「팅크제。」

actors.hero.talent.wanling_potion.title=만능 물약
actors.hero.talent.wanling_potion.desc=_+1：_물약 섭취 시 _2턴 전면 정화_ 획득。\n\n_+2：_물약 섭취 시 _3턴 전면 정화_ 획득。\n\n_+3：_물약 섭취 시 _4턴 전면 정화_ 및 영웅의 모든 약화 효과 제거。
actors.hero.talent.wanling_potion.comment=「어떤 쓰레기 왕이 원하는 만능약이 아닙니다。」

actors.hero.talent.active_muscles.title=근육 활동
actors.hero.talent.active_muscles.desc=_+1：_레벨 업 시 _2 임시 힘_ 획득。\n\n_+2：_레벨 업 시 _4 임시 힘_ 획득。\n\n_+3：_레벨 업 시 _6 임시 힘_ 획득。
actors.hero.talent.active_muscles.comment=이 효과는 _400턴_ 지속됩니다。

actors.hero.talent.sea_wind.title=사해의 바람
actors.hero.talent.sea_wind.desc=_+1：_영웅이 물 속에서 _20% 이동 속도 증가_。\n\n_+2：_영웅이 물 속에서 _40% 이동 속도 증가_。\n\n_+3：_영웅이 물 속에서 _60% 이동 속도 증가_。
actors.hero.talent.sea_wind.comment=「큰 바람이 불어 구름이 날아간다。」

actors.hero.talent.endless_meal.title=여운이 남는 식사
actors.hero.talent.endless_meal.desc=_+1：_섭취 시 _2턴 시간 기포_ 획득。\n\n_+2：_섭취 시 _4턴 시간 기포_ 획득。\n\n_+3：_섭취 시 _6턴 시간 기포_ 획득。
actors.hero.talent.endless_meal.comment=

actors.hero.talent.experience_meal.title=경험치 식사
actors.hero.talent.experience_meal.desc=_+1：_섭취 시 _2 경험치_ 획득。\n\n_+2：_섭취 시 _3 경험치_ 획득。
actors.hero.talent.experience_meal.comment=이 재능은 재능 _구름 식사_, _무적 식사_ 및 _생일 선물_과 _100회 발동 제한_을 공유합니다。\n\n「한 번 먹고, 한 번 더 먹고, 또 한 번 먹고...」

actors.hero.talent.birthday_gift.title=생일 선물
actors.hero.talent.birthday_gift.desc=_+1：_섭취 시 _17% 확률_로 _1회 하급 드롭_。\n\n_+2：_섭취 시 _33% 확률_로 _1회 하급 드롭_。\n\n_+3：_섭취 시 _50% 확률_로 _1회 하급 드롭_。
actors.hero.talent.birthday_gift.comment=이 재능은 재능 _경험치 식사_, _구름 식사_ 및 _무적 식사_와 _100회 발동 제한_을 공유합니다。\n\n「생일 축하합니다!」

actors.hero.talent.collect_plants.title=식물 수집
actors.hero.talent.collect_plants.desc=_+1：_무작위 씨앗 3개_ 획득。\n\n_+2：_무작위 씨앗 4개_ 획득。\n\n_+3：_무작위 씨앗 5개_ 및 _무미 과일 1개_ 획득。
actors.hero.talent.collect_plants.comment=이러한 업그레이드 또는 변태를 통해 직접 자원을 획득하는 재능은 _26회 발동 제한_(신사는 _39회_)을 공유합니다。\n\n이 재능은 썩은 딸기 씨앗을 제공하지 않습니다。

actors.hero.talent.sharp_head.title=머리가 뾰족함
actors.hero.talent.sharp_head.desc=_+1：_힘 +3_, 명중률 _17% 감소_。\n\n_+2：_힘 +6_, 명중률 _33% 감소_。\n\n_+3：_힘 +9_, 명중률 _50% 감소_。
actors.hero.talent.sharp_head.comment=「그럼 내가 묻겠다。」

actors.hero.talent.strength_armband.title=강화 완장
actors.hero.talent.strength_armband.desc=_+1：_신도둑 완장의 충전 속도 _20% 증가_。\n\n_+2：_1의 효과에 더해, 신도둑 완장의 적에게서 훔친 약화 효과 지속 시간 _30% 증가_。\n\n_+3：_1과 2의 효과에 더해, 신도둑 완장으로 훔친 적이 영웅에게 _3턴 호르몬 폭주_ 부여, 상품 도난 충전 소모 _1 감소_(최소 소모는 0 아래로 내려가지 않으며 도난 성공률 및 사용 시 충전 요구량은 변경되지 않음)。
actors.hero.talent.strength_armband.comment=

actors.hero.talent.strength_book.title=강화 마법서
actors.hero.talent.strength_book.desc=_+1：_무질서 마법서 읽기 시 _시야 내 적 유무_에 따라 _전투/비전투_ 두루마리 효과 발동。\n\n_+2：_1의 효과에 더해, 무질서 마법서 충전 속도 _20% 증가_。
actors.hero.talent.strength_book.comment=무질서 수정과 마찬가지로, _전투_ 두루마리에는 분신/충전/순간 이동/최면/분노/복수/공포 두루마리가 포함되며, _비전투_ 두루마리에는 감정/퇴마/충전/순간 이동/최면/지형 탐사 두루마리가 포함됩니다。\n\n「이것이 진정한 무질서 마법서다。」

actors.hero.talent.eternal_curse.title=영원한 저주
actors.hero.talent.eternal_curse.desc=_+0：_최소 _2장의 퇴마 두루마리_가 필요하여 저주 제거。\n\n_+1：_1장의 퇴마 두루마리로 저주 제거 가능, 하지만 _저주 부여/각인 유지_。\n\n_+2：_1장의 퇴마 두루마리로 저주 완전 제거 가능。
actors.hero.talent.eternal_curse.comment=「저주가 많아도 부담되지 않는다。」\n\n_DM-216의 저주_
actors.hero.talent.eternal_curse.unremove=퇴마 양이 부족하여 저주를 제거할 수 없습니다。

actors.hero.talent.eater.title=대식가
actors.hero.talent.eater.desc=_+0：_굶주림 속도 _30% 증가_。\n\n_+1：_굶주림 속도 _15% 증가_。\n\n_+2：_굶주림 속도 증가하지 않음。
actors.hero.talent.eater.comment=「내 말 들어봐 내 말 들어봐 내 말 들어봐 내 말 들어봐 내 말 들어봐 내 말 들어봐 내 말 들어봐 배고파。」

actors.hero.talent.fate_decision.title=운명의 선택
actors.hero.talent.fate_decision.desc=_+0：_변태 _선택지 -2_。\n\n_+1：_변태 _선택지 -1_。\n\n_+2：_변태 선택지 그대로。
actors.hero.talent.fate_decision.comment=「이것이 운명이다。」\n\n_DM-216이 좌우수를 뽑지 못한 분노_

actors.hero.talent.endless_malice.title=끝없는 악의
actors.hero.talent.endless_malice.desc=_+0：_아이템 획득 시 _40% 확률_로 _최대 체력 10%_의 체력 감소。\n\n_+1：_아이템 획득 시 _30% 확률_로 _최대 체력 5%_의 체력 감소。\n\n_+2：_아이템 획득 시 체력이 감소하지 않음。
actors.hero.talent.endless_malice.comment=「당신은 이 아이템들이 새 주인에게 품는 악의를 느낄 수 있습니다。」\n\n_DM-216의 악의_
actors.hero.talent.endless_malice.kill=당신은 의도적인 게임 디자인으로 사망했습니다...
actors.hero.talent.endless_malice.rankings_desc=사망 원인: 의도적인 게임 디자인

actors.hero.talent.feeble.title=기력 없음
actors.hero.talent.feeble.desc=_+0：_물리 피해 _20% 감소_。\n\n_+1：_물리 피해 _10% 감소_。\n\n_+2：_물리 피해 감소하지 않음。
actors.hero.talent.feeble.comment=「잡어 — 잡어 물공」

actors.hero.talent.malnutrition.title=영양 실조
actors.hero.talent.malnutrition.desc=_+0：_극도로 배고픈 상태_에서 굶주림 피해를 받을 때마다 _10턴 혼란 및 허약_ 획득。\n\n_+1：_극도로 배고픈 상태_에서 굶주림 피해를 받을 때마다 _10턴 허약_ 획득。\n\n_+2：_극도로 배고픈 상태에서 추가 약화 효과를 받지 않음。
actors.hero.talent.malnutrition.comment=「치료 처방: KFC 패밀리 세트 x1\n총 비용: 50。」

actors.hero.talent.shortsighted.title=근시
actors.hero.talent.shortsighted.desc=_+0：_시야 _40% 감소_。\n\n_+1：_시야 _20% 감소_。\n\n_+2：_시야 감소하지 않음。
actors.hero.talent.shortsighted.comment=

actors.hero.talent.bat_serum.title=박쥐 혈청
actors.hero.talent.bat_serum.desc=_+0：_적 근접 피해 시 _40% 흡혈 효과_ 획득。\n\n_+1：_적 근접 피해 시 _20% 흡혈 효과_ 획득。\n\n_+2：_적이 추가 흡혈 효과를 얻지 않음。
actors.hero.talent.bat_serum.comment=「의욕적으로 영웅의 고기를 먹고, 웃으며 피팩의 피를 마신다。」

actors.hero.talent.myopia.title=근시
actors.hero.talent.myopia.desc=_+0：_명중률 _40% 감소_。\n\n_+1：_명중률 _20% 감소_。\n\n_+2：_명중률 감소하지 않음。
actors.hero.talent.myopia.comment=

actors.hero.talent.land_swimming.title=육지 수영
actors.hero.talent.land_swimming.desc=_+0：_거대 피라냐와 환영 피라냐가 각각 _거대 육지 피라냐와 환영 육지 피라냐_로 대체되며, 대체 전과 속성은 동일합니다。\n\n_+1：_거대 육지 피라냐와 환영 육지 피라냐의 이동 속도 50% 감소。\n\n_+2：_거대 피라냐와 환영 피라냐가 더 이상 거대 육지 피라냐와 환영 육지 피라냐로 대체되지 않으며, 육지의 거대 육지 피라냐와 환영 육지 피라냐는 즉시 사망합니다。
actors.hero.talent.land_swimming.comment=「강 위에서 공자가 말하길, 가는 것은 이와 같구나。」

actors.hero.talent.jiulongla_coffin.title=구룡관
actors.hero.talent.jiulongla_coffin.desc=_+0：_영웅의 _최대 체력 40%_ 감소。\n\n_+1：_영웅의 _최대 체력 20%_ 감소。\n\n_+2：_영웅의 최대 체력이 더 이상 감소하지 않음。
actors.hero.talent.jiulongla_coffin.comment=「지하 감옥에서 비보가 전해졌다. 지하 감옥의 영웅 전사가 과식하여 30레벨에 배낭이 가득 찼고, 결국 고대 신의 레이저에 맞아 사망했다。」

actors.hero.talent.cowboy.title=악덕 상인
actors.hero.talent.cowboy.desc=_+0：_아이템 구매 시 _30% 확률_로 _돌팔매_로 대체됨。\n\n_+1：_아이템 구매 시 _15% 확률_로 _돌팔매_로 대체됨。\n\n_+2：_구매한 아이템이 더 이상 돌팔매로 대체되지 않음。
actors.hero.talent.cowboy.comment=가방(두루마리 통, 물약 가방, 마법 주머니)도 포함됩니다。\n\n「본 프로젝트의 합법적 수익은 모두 식량 구매에 사용됩니다。」

actors.hero.talent.mamba_out.title=맘바 아웃
actors.hero.talent.mamba_out.desc=_+0：_영웅이 심연에 떨어진 후 추가로 _최대 체력 20%_의 _지연 피해_ 획득。\n\n_+1：_영웅이 심연에 떨어진 후 추가로 _최대 체력 15%_의 _지연 피해_ 획득。\n\n_+2：_영웅이 심연에 떨어진 후 더 이상 지연 피해를 받지 않음。
actors.hero.talent.mamba_out.comment=「천천히! 내가 베겠다! 맘바 아웃!」

actors.hero.talent.explosion_meal.title=폭발 식사
actors.hero.talent.explosion_meal.desc=_+0：_섭취 시 _20% 확률_로 폭발。\n\n_+1：_섭취 시 _10% 확률_로 폭발。\n\n_+2：_섭취 시 폭발하지 않음。
actors.hero.talent.explosion_meal.comment=「너는 옥면 수류탄 왕이다。」

actors.hero.talent.handon_ground.title=머리부터 땅에
actors.hero.talent.handon_ground.desc=_+0：_부유_ 상태 해제 시, _기본값 현재 체력 10%의 출혈_ 효과。\n\n_+1：_부유_ 상태 해제 시, _기본값 현재 체력 10%의 출혈_ 효과。\n\n_+2：_부유 상태 해제 시 출혈하지 않음。
actors.hero.talent.handon_ground.comment=「착지할 때 조심해야 합니다...」\n「맛있어서 날아감과 함께 사용하면 묘한 효과가 있습니다。」

actors.hero.talent.chill_water.title=물 마시다 이에 끼임
actors.hero.talent.chill_water.desc=_+0：_이슬 및 물약 섭취 시 _30% 확률_로 _동상_ 효과 획득。\n\n_+1：_이슬 섭취 시 _15% 확률_로 _동상_ 효과 획득, 물약 섭취 시 동상 없음。\n\n_+2：_이슬 및 물약 섭취 시 동상 효과를 받지 않음。
actors.hero.talent.chill_water.comment=「운이 나쁘면 물을 마셔도 이에 끼인다。」\n「하지만 게임에는 별 영향이 없습니다。」

actors.hero.talent.life_sport.title=생명은 운동에 있다
actors.hero.talent.life_sport.desc=_+0：_대기 시 _2 피해_。\n\n_+1：_대기 시 _1 피해_。\n\n_+2：_대기 시 피해를 받지 않음。
actors.hero.talent.life_sport.comment=길게 눌러 잠자기는 한 번만 피해를 적용합니다。
actors.hero.talent.life_sport.kill=운동은 심신 건강에 좋습니다...
actors.hero.talent.life_sport.rankings_desc=사망 원인: 너무 게으름

actors.hero.talent.weaken_chalice.title=약화된 성배
actors.hero.talent.weaken_chalice.desc=_+0：_축혈 성배의 피의 제물 피해 _100% 증가_。\n\n_+1：_축혈 성배의 피의 제물 피해 _50% 증가_。\n\n_+2：_축혈 성배의 피의 제물 피해 변하지 않음。
actors.hero.talent.weaken_chalice.comment=「성배는 그냥 트로피라서 아무 쓸모도 없지, 그렇지?」

actors.hero.talent.extreme_casting.title=극한 시전
actors.hero.talent.extreme_casting.desc=_+1：_지팡이와 완드 충전 속도 _10% 감소_하지만 _시전 피해 20% 증가_。\n\n_+2：_지팡이와 완드 충전 속도 _20% 감소_하지만 _시전 피해 40% 증가_。\n\n_+3：_지팡이와 완드 충전 속도 _30% 감소_하지만 _시전 피해 60% 증가_。
actors.hero.talent.extreme_casting.comment=「익스플로젼!」

actors.hero.talent.precise_shot.title=정밀 사격
actors.hero.talent.precise_shot.desc=_+1：_3칸 밖_의 적에게 투척 무기 공격 시 _10%_ 명중률 및 피해 증가。\n\n_+2：_3칸 밖_의 적에게 투척 무기 공격 시 _20%_ 명중률 및 피해 증가。\n\n_+3：_3칸 밖_의 적에게 투척 무기 공격 시 _30%_ 명중률 및 피해 증가。
actors.hero.talent.precise_shot.comment=영능궁 등 특수 투척 무기를 가진 영웅이 이 재능을 획득하면 특수 투척 무기도 이 재능의 효과를 받습니다。

actors.hero.talent.exploration_intuition.title=탐험 직감
actors.hero.talent.exploration_intuition.desc=_+1：_숨겨진 문과 숨겨진 함정에 대한 수동 탐지 _50% 향상_。\n\n_+2：_숨겨진 문과 숨겨진 함정에 대한 수동 탐지 _100% 향상_。
actors.hero.talent.exploration_intuition.comment=「어디 보자!」

actors.hero.talent.fudi_chouxin.title=밑장 빼기
actors.hero.talent.fudi_chouxin.desc=_+1：_물리 공격 시 _25% 확률_로 _2턴 허약_。\n\n_+2：_물리 공격 시 _50% 확률_로 _2턴 허약_。
actors.hero.talent.fudi_chouxin.comment=「중화。」

actors.hero.talent.poison_inbody.title=만독 침투
actors.hero.talent.poison_inbody.desc=_+1：_자신의 _약화 효과 1개당_, 물리 공격 _피해 10% 증가_。\n\n_+2：_자신의 _약화 효과 1개당_, 물리 공격 _피해 20% 증가_。
actors.hero.talent.poison_inbody.comment=「아직 좋은 영웅인가?」

actors.hero.talent.treasure_sense.title=보물 감각
actors.hero.talent.treasure_sense.desc=_+1：_새 층에 진입할 때마다 _17% 확률_로 모든 아이템 위치 파악。\n\n_+2：_새 층에 진입할 때마다 _33% 확률_로 모든 아이템 위치 파악。\n\n_+3：_새 층에 진입할 때마다 _50% 확률_로 모든 아이템 위치 파악。
actors.hero.talent.treasure_sense.comment=「나·가·보·였·다。」

actors.hero.talent.seed_recycling.title=씨앗 재활용
actors.hero.talent.seed_recycling.desc=_+1：_식물이 밟힌 후 _20% 확률_로 씨앗 드롭。\n\n_+2：_식물이 밟힌 후 _40% 확률_로 씨앗 드롭。
actors.hero.talent.seed_recycling.comment=이 재능은 썩은 딸기 씨앗의 정상 드롭에 영향을 주지 않습니다。\n\n「윤회의 교체 시, 만물이 자양분을 받는다。」

actors.hero.talent.hedonism.title=쾌락주의
actors.hero.talent.hedonism.desc=_+1：_자신이 _배고픔 또는 극도로 배고픔_ 상태가 아닐 때, _피해가 2 추가 증가_, 모든 피해 증가 재능 전에 적용。\n\n_+2：_자신이 _배고픔 또는 극도로 배고픔_ 상태가 아닐 때, _피해가 4 추가 증가_, 모든 피해 증가 재능 전에 적용。
actors.hero.talent.hedonism.comment=「한가하면 한세월, 게으르면 평생이다!」

actors.hero.talent.beyond_limit.title=한계 초월
actors.hero.talent.beyond_limit.desc=_+1：_레벨 업 시 _20턴 신속 및 호르몬 폭주_ 획득。\n\n_+2：_레벨 업 시 _40턴 신속 및 호르몬 폭주_ 획득。\n\n_+3：_레벨 업 시 _60턴 신속 및 호르몬 폭주_ 획득。
actors.hero.talent.beyond_limit.comment=

actors.hero.talent.healthy_food.title=건강한 음식
actors.hero.talent.healthy_food.desc=_+1：_섭취 시 _2턴 전면 정화_ 획득。\n\n_+2：_섭취 시 _3턴 전면 정화_ 획득。\n\n_+3：_섭취 시 _4턴 전면 정화_ 획득。
actors.hero.talent.healthy_food.comment=「이 빵을 먹고, 다시 한번 멋진 사내가 되자。」

actors.hero.talent.mental_collapse.title=정신 붕괴
actors.hero.talent.mental_collapse.desc=_+0：_물리 공격 시 _20% 확률_로 _50% 반사 피해_。\n\n_+1：_물리 공격 시 _10% 확률_로 _50% 반사 피해_。\n\n_+2：_물리 공격 시 반사 피해 없음。
actors.hero.talent.mental_collapse.comment=「누가, 나를 죽였는가。」\n「그리고 나는, 누구를 죽였는가!」

actors.hero.talent.unavoidable.title=피할 수 없음
actors.hero.talent.unavoidable.desc=_+0：_받는 피해 최소 _최대 체력의 10%_。\n\n_+1：_받는 피해 최소 _최대 체력의 5%_。\n\n_+2：_더 이상 최소 피해 제한 없음。
actors.hero.talent.unavoidable.comment=

actors.hero.talent.parasitism.title=기생
actors.hero.talent.parasitism.desc=_+0：_적 사망 후 _20% 확률_로 고대 신 유충 1마리 생성_。\n\n_+1：_적 사망 후 _10% 확률_로 고대 신 유충 1마리 생성_。\n\n_+2：_적 사망 후 더 이상 고대 신 유충 생성되지 않음。
actors.hero.talent.parasitism.comment=이 부정적 재능으로 생성된 고대 신 유충은 여전히 이 부정적 재능의 영향을 받습니다。\n\n「지하 감옥이 더러우니... 기생충이 좀 있는 것도 정상입니다(하수도에서 기생을 선택하면 게임 경험이 크게 향상됩니다)。」

actors.hero.talent.dump_truck.title=덤프 트럭
actors.hero.talent.dump_truck.desc=_+0：_거대_ 속성의 적 _피해 100% 증가_, _이동 속도 100% 증가_。\n\n_+1：_거대_ 속성의 적 _피해 50% 증가_, _이동 속도 50% 증가_。\n\n_+2：_거대 속성의 적의 피해와 이동 속도 증가하지 않음。
actors.hero.talent.dump_truck.comment=_거대_ 속성 적은 DM-200, DM-201, DM-300, 골렘, 녹슨 주먹, 황금 골렘 및 거대 엘리트 적을 포함합니다。\n\n「바로 세 대의 트럭을 보내주마!」

actors.hero.talent.burnout_champion.title=불타는 챔피언
actors.hero.talent.burnout_champion.desc=_+0：_이동 시 _4% 확률_로 _3턴 연소_ 효과 획득。\n\n_+1：_이동 시 _2% 확률_로 _3턴 연소_ 효과 획득。\n\n_+2：_이동 시 더 이상 자연 발화하지 않음。
actors.hero.talent.burnout_champion.comment=「이것은 코비가 소원했던 새벽 4시의 로스앤젤레스다。」

actors.hero.talent.photophoby.title=광공포증
actors.hero.talent.photophoby.desc=_+0：_발광_ 상태에서 _명중률과 피해 40% 감소_。\n\n_+1：_발광_ 상태에서 _명중률과 피해 20% 감소_。\n\n_+2：_발광 상태에서 명중률과 피해 감소하지 않음。
actors.hero.talent.photophoby.comment=

actors.hero.talent.outcontrol_magic.title=통제 불능 마법
actors.hero.talent.outcontrol_magic.desc=_+0：_지팡이 또는 완드 시전 시 _40% 확률_로 자체 폭발。\n\n_+1：_지팡이 또는 완드 시전 시 _20% 확률_로 자체 폭발。\n\n_+2：_지팡이 또는 완드 시전 시 더 이상 자체 폭발하지 않음。
actors.hero.talent.outcontrol_magic.comment=「루이즈의 마법。」

actors.hero.talent.winter_swimming.title=겨울 수영 괴짜
actors.hero.talent.winter_swimming.desc=_+0：_영웅이 물 속에서 이동 시 _10% 확률_로 _3턴 동상_ 효과 획득。\n\n_+1：_영웅이 물 속에서 이동 시 _5% 확률_로 _3턴 동상_ 효과 획득。\n\n_+2：_영웅이 물 속에서 이동 시 동상 효과를 받지 않음。
actors.hero.talent.winter_swimming.comment=「더 무해한 불타는 재능。」

actors.hero.talent.fire_wood.title=마른 장작
actors.hero.talent.fire_wood.desc=_+0：_적 공격 시 _10% 확률_로 양측 10턴 매혹 및 양측 5턴 연소_。\n\n_+1：_적 공격 시 _5% 확률_로 양측 10턴 매혹 및 양측 5턴 연소_。\n\n_+2：_적 공격 시 더 이상 양측이 불타는 사랑에 빠지지 않음。
actors.hero.talent.fire_wood.comment=「우리는 밤새도록 빙글빙글 돌다 불길 속으로 사라졌다。」\n「마른 장작을 고른 아이는 변태 두루마리를 태워버릴 것입니다。」

actors.hero.talent.be_inconstant.title=변덕스러움
actors.hero.talent.be_inconstant.desc=_+0：_무기 획득 시 _20% 확률_로 즉시 장착。\n\n_+1：_무기 획득 시 _10% 확률_로 즉시 장착。\n\n_+2：_무기 획득 시 즉시 장착되지 않음。
actors.hero.talent.be_inconstant.comment=

actors.hero.talent.unbear_hunger.title=참기 힘든 배고픔
actors.hero.talent.unbear_hunger.desc=_+0：_받는 굶주림 피해 _100% 증가_。\n\n_+1：_받는 굶주림 피해 _50% 증가_。\n\n_+2：_받는 굶주림 피해 증가하지 않음。
actors.hero.talent.unbear_hunger.comment=

actors.hero.talent.vip_meal.title=회원제 식사
actors.hero.talent.vip_meal.desc=_+0：_섭취 시 현재 _20%_의 골드 소모。\n\n_+1：_섭취 시 현재 _10%_의 골드 소모。\n\n_+2：_섭취 시 골드를 소모하지 않음。
actors.hero.talent.vip_meal.comment=「영웅에게는 세 가지 욕망이 있다: 먹고 싶은 욕망, 탐험하고 싶은 욕망, 보물을 찾고 싶은 욕망。」

actors.hero.talent.fast_die.title=상시 빠른 죽음
actors.hero.talent.fast_die.desc=_+0：_로드할 때마다 _최대 체력 20%_의 체력 감소。\n\n_+1：_로드할 때마다 _최대 체력 10%_의 체력 감소。\n\n_+2：_로드 시 체력이 감소하지 않음。
actors.hero.talent.fast_die.comment=이 재능은 영웅을 죽음에 이르게 하지 않으며, 최소 1 체력을 유지합니다。\n\n게임 내에서 Yendor 부적 획득 후 게임 종료 여부를 선택하는 화면에 진입할 때 자동으로 로드되어 체력이 감소합니다。\n\n「그래서 내가 직접 이 세이브를 끝냈다!」\n「이 사람아, 머릿속에 든 건 다른 게임뿐이구나!」

actors.hero.talent.wash_hand.title=식사 전 손 씻기
actors.hero.talent.wash_hand.desc=_+0：_이슬 수집 시 _20% 확률_로 3턴 중독。\n\n_+1：_이슬 수집 시 _10% 확률_로 3턴 중독。\n\n_+2：_이슬 수집 시 중독되지 않음。
actors.hero.talent.wash_hand.comment=「왜 수돗물은 더러운데, 수돗물로 씻은 사과는 바로 먹을 수 있을까?」\n「— 케제가 친절하게 제공한 화이트보드 재능」

actors.hero.talent.thorns_sprang.title=가시 돋음
actors.hero.talent.thorns_sprang.desc=_+0：_높은 풀을 밟을 때 _20% 확률_로 _기본값 1의 출혈_。\n\n_+1：_높은 풀을 밟을 때 _10% 확률_로 _기본값 1의 출혈_。\n\n_+2：_높은 풀을 밟을 때 출혈하지 않음。
actors.hero.talent.thorns_sprang.comment=「신발을 신지 않고 풀숲을 지나면 생기는 결과。」\n「— 케제의 세심한 화이트보드 재능」

actors.hero.talent.fullpassion.title=열정 가득
actors.hero.talent.fullpassion.desc=_+0：_모든 모방 상자의 _기습 피해 60% 증가_, 이동 속도 _2배_。\n\n_+1：_모든 모방 상자의 _기습 피해 30% 증가_, 이동 속도 _1.5배_。\n\n_+2：_모든 모방 상자의 기습 피해와 이동 속도 정상으로 복귀。
actors.hero.talent.fullpassion.comment=「이제 누가 감히 이빨을 하겠는가?」\n\n_DM-216의 열정_

actors.hero.talent.fullfighting.title=전의앙연
actors.hero.talent.fullfighting.desc=_+0：_적 처치 시 _60% 확률_로 층 전체 적 각성。\n\n_+1：_적 처치 시 _30% 확률_로 층 전체 적 각성。\n\n_+2：_적 처치 시 더 이상 층 전체 적을 각성시키지 않음。
actors.hero.talent.fullfighting.comment=

actors.hero.talent.phaseclaw.title=위상 발톱
actors.hero.talent.phaseclaw.desc=_+0：_적 _공격 거리 +1_, 공격 시 _10% 확률_로 3턴 취약。\n\n_+1：_적 _공격 거리 +1_。\n\n_+2：_적 공격 거리가 더 이상 증가하지 않음。
actors.hero.talent.phaseclaw.comment=

actors.hero.talent.backfired.title=불붙은 자신
actors.hero.talent.backfired.desc=_+1：_액화 불 물약 섭취 시 _5턴 화염의 힘_ 획득。\n\n_+2：_액화 불 물약 섭취 시 _8턴 화염의 힘_ 획득。
actors.hero.talent.backfired.comment=「추울 때는 따뜻한 음료를 마셔야지!」

actors.hero.talent.goldofbook.title=책 속의 황금
actors.hero.talent.goldofbook.desc=_+1：_두루마리 읽기 시 _50 골드_ 획득。\n\n_+2：_두루마리 읽기 시 _100 골드_ 획득。
actors.hero.talent.goldofbook.comment=이 재능은 무질서 마법서를 읽어도 발동됩니다。\n\n「책 속에 황금 집이 있다는 게 그냥 동기부여 문구인 줄 알았는데...」

actors.hero.talent.extreme_reaction.title=극한 반응
actors.hero.talent.extreme_reaction.desc=_+1：_적의 물리 공격 회피 시 _1턴 호르몬 폭주_ 획득。\n\n_+2：_적의 물리 공격 회피 시 _2턴 호르몬 폭주_ 획득。\n\n_+3：_적의 물리 공격 회피 시 _3턴 호르몬 폭주_ 획득。
actors.hero.talent.extreme_reaction.comment=영웅이 현재 가진 호르몬 폭주 효과의 지속 시간이 5턴을 초과하면, 이 재능이 더 이상 호르몬 폭주 효과를 중첩하지 않습니다。

actors.hero.talent.deep_fear.title=깊은 공포
actors.hero.talent.deep_fear.desc=_+0：_층이 깊어질수록, 영웅의 _도달한 최대 층 x3_만큼 최대 체력 감소。\n\n_+1：_층이 깊어질수록, 영웅의 _도달한 최대 층 x2_만큼 최대 체력 감소。\n\n_+2：_더 이상 층이 깊어져도 최대 체력이 감소하지 않음。
actors.hero.talent.deep_fear.comment=「영웅이라면 100층까지 내려가라!(실제로 100층은 없지만)」\n\n_DM-216이 심어놓은 공포_

actors.hero.talent.no_door.title=문은 없다
actors.hero.talent.no_door.desc=_+0：_일반 문이 숨겨진 문으로 대체될 _확률 x2_。\n\n_+1：_일반 문이 숨겨진 문으로 대체될 _확률 x1.5_。\n\n_+2：_더 이상 일반 문이 숨겨진 문으로 대체될 확률이 증가하지 않음。
actors.hero.talent.no_door.comment=

actors.hero.talent.updraft.title=상승 기류
actors.hero.talent.updraft.desc=_+0：_연소 시 _동일 턴의 부유_ 획득, 부유 시 _동일 턴의 연소_ 획득。\n\n_+1：_연소 시 _동일 턴의 부유_ 획득, 부유 시 더 이상 동일 턴의 연소를 획득하지 않음。\n\n_+2：_연소와 부유 시 더 이상 동일 턴의 해당 효과를 획득하지 않음。
actors.hero.talent.updraft.comment=이 부정적 재능을 통해 얻은 부유와 연소는 이 부정적 재능으로 인해 해당 효과가 지속적으로 중첩되지 않습니다。\n\n「만약 지하 감옥의 부유가 제트 추진 마법이라면...」

actors.hero.talent.quantum_hacking.title=양자 해킹
actors.hero.talent.quantum_hacking.desc=_+1：_지팡이 또는 완드 시전이 대상에 명중 후, 대상에게 _1턴 기절_ 부여。\n\n_+2：_지팡이 또는 완드 시전이 대상에 명중 후, 대상에게 _2턴 기절_ 부여。
actors.hero.talent.quantum_hacking.comment=「오랫동안 마법학 연구는 정체되어 있었습니다. 사람들이 마력으로 생물의 뇌를 침투하려고 시도하기 전까지는。」

actors.hero.talent.cicada_dance.title=환상의 춤
actors.hero.talent.cicada_dance.desc=_+1：_영웅이 물리 공격으로 적을 죽일 때 _2턴 투명_ 획득。\n\n_+2：_영웅이 물리 공격으로 적을 죽일 때 _3턴 투명_ 획득。\n\n_+3：_영웅이 물리 공격으로 적을 죽일 때 _4턴 투명_ 획득。
actors.hero.talent.cicada_dance.comment=

actors.hero.talent.chocolate_coins.title=초콜릿 코인
actors.hero.talent.chocolate_coins.desc=_+1：_굶주림 피해 발동 시, 가방에 골드가 _25_ 이상이면 _17 골드 소모_하여 이번 피해 차단。\n\n_+2：_굶주림 피해 발동 시, 가방에 골드가 _50_ 이상이면 _35 골드 소모_하여 이번 피해 차단。
actors.hero.talent.chocolate_coins.comment=「어떤 마법사의 악취미일지도 모르지만, 어쨌든 이 코인들은 먹을 수 있습니다。」

actors.hero.talent.ghost_gift.title=유령의 선물
actors.hero.talent.ghost_gift.desc=_+1：_슬픈 유령의 방어구 보상 선택 후, _75% 확률_로 무기 보상도 함께 획득。\n\n_+2：_슬픈 유령의 방어구 보상 선택 후, _반드시_ 무기 보상도 함께 획득。
actors.hero.talent.ghost_gift.comment=무기 보상 선택 시 이 재능은 발동되지 않습니다。\n\n「유령아, 넌 내 가장 친한 친구야。」

actors.hero.talent.personal_attack.title=인신 공격
actors.hero.talent.personal_attack.desc=_+1：_분노 두루마리 읽기 시, 영향을 받은 적에게 _5턴 취약_ 효과 부여。\n\n_+2：_분노 두루마리 읽기 시, 영향을 받은 적에게 _5턴 취약_ 및 _5턴 허약_ 효과 부여。
actors.hero.talent.personal_attack.comment=해당 재능 업그레이드 시 _분노 두루마리 1장_ 추가 획득, 이 재능은 무질서 마법서의 분노 두루마리를 읽어도 발동됩니다。\n\n이러한 업그레이드 또는 변태를 통해 직접 자원을 획득하는 재능은 _26회 발동 제한_(신사는 _39회_)을 공유합니다。\n\n「왜 그렇게 크게 소리치는 거야。」

actors.hero.talent.shoot_satellite.title=위성 격추
actors.hero.talent.shoot_satellite.desc=_+1：_비행_ 상태의 적에게 _피해 20% 증가_。\n\n_+2：_비행_ 상태의 적에게 _피해 30% 증가_。
actors.hero.talent.shoot_satellite.comment=돌팔매로 _비행_ 상태의 적에게 피해를 입히면 _피해 2배_。\n\n상시 _비행_ 상태의 적은 황금 벌, 유령, 저주받은 영혼, 파리 떼, 신생 불 정령, 흡혈 박쥐, 수정 영기, 불 정령, 서리 정령, 번개 정령, 혼돈 정령, 사악한 눈, 대악마 및 황금 정령을 포함합니다. 또한 모든 적에게 _부유_ 효과를 부여하여 이 재능을 발동시킬 수 있습니다。\n\n「지하 감옥 은혜 이야기: 전사 할아버지가 세 개의 +20 극강 돌멩이로 고대 신을 격파。」

actors.hero.talent.holy_faith.title=신성한 신앙
actors.hero.talent.holy_faith.desc=_+1：_영웅이 _발광_ 효과를 얻을 때, 추가로 _5턴 축복 및 지팡이 충전_ 획득。\n\n_+2：_영웅이 _발광_ 효과를 얻을 때, 추가로 _7턴 축복 및 지팡이 충전_ 획득。\n\n_+3：_영웅이 _발광_ 효과를 얻을 때, 추가로 _9턴 축복, 지팡이 충전_ 및 _4턴 유물 충전_ 획득。
actors.hero.talent.holy_faith.comment=

actors.hero.talent.honey_fish.title=꿀 물고기 항아리
actors.hero.talent.honey_fish.desc=_+1：_꿀 항아리를 던지면 그 자리에 물이 생성되고 황금 벌 대신 거대 피라냐가 생성되며, 거대 피라냐는 _50턴 광란_ 획득。\n\n_+2：_1의 효과에 더해, 꿀 항아리 파괴 위치에 추가로 _물폭발 물약 효과 1회_ 발동。
actors.hero.talent.honey_fish.comment=이 재능으로 생성된 거대 피라냐는 환영 피라냐로 대체될 수도 있으며, 모두 부정적 재능 _육지 수영_의 영향을 받습니다。\n\n「파란색 불투명 어항。」

actors.hero.talent.instant_refining.title=순간 제련
actors.hero.talent.instant_refining.desc=_+1：_적이 죽을 때, 영웅이 _40% 확률_로 1 연금 에너지 획득。\n\n_+2：_적이 죽을 때, 영웅이 _60% 확률_로 1 연금 에너지 획득。
actors.hero.talent.instant_refining.comment=이 재능의 드롭은 영웅 레벨 제한의 영향을 받습니다。\n\n「한 번에 잡아서, 순간 제련。」

actors.hero.talent.changqi_bookstore.title=상시 서재
actors.hero.talent.changqi_bookstore.desc=_+1：_두루마리 읽기 시 _30% 확률_로 무작위 마법석 1개 획득。\n\n_+2：_두루마리 읽기 시 _45% 확률_로 무작위 마법석 1개 획득。\n\n_+3：_두루마리 읽기 시 _60% 확률_로 무작위 마법석 1개 획득。
actors.hero.talent.changqi_bookstore.comment=이 재능은 마법 부여 마법석을 획득하지 않으며, 무질서 마법서를 읽어도 발동되지만, 자원 획득 횟수는 _26회_(신사는 _39회_)로 제한되며, 이 제한은 대부분의 업그레이드 또는 변태를 통해 직접 자원을 획득하는 재능과 공유됩니다。

actors.hero.talent.ascension_curse.title=승천 저주
actors.hero.talent.ascension_curse.desc=_+1：_성전이 _승천 저주_를 시전할 수 있습니다. 1 충전 소모로 자신 _5턴 부유_。\n\n_+2：_성전이 _승천 저주_를 시전할 수 있습니다. 1 충전 소모로 자신 _8턴 부유_。
actors.hero.talent.ascension_curse.comment=「날아올라라!」

actors.hero.talent.divine_protection.title=신의 가호
actors.hero.talent.divine_protection.desc=_+1：_성전이 _신의 가호_를 시전할 수 있습니다. 1 충전 소모로 자신 _3턴 무적_。\n\n_+2：_성전이 _신의 가호_를 시전할 수 있습니다. 1 충전 소모로 자신 _5턴 무적_。
actors.hero.talent.divine_protection.comment=「내 위에 사람이 있다。」

actors.hero.talent.shepherd_intention.title=목양의 원칙
actors.hero.talent.shepherd_intention.desc=_+1：_성전이 _목양의 원칙_을 시전할 수 있습니다. 1 충전 소모로 지정 위치 _작은 마법 양 떼 생성_。\n\n_+2：_성전이 _목양의 원칙_을 시전할 수 있습니다. 1 충전 소모로 지정 위치 _마법 양 떼 생성_。
actors.hero.talent.shepherd_intention.comment=「이 양들은 어디서 온 걸까?」

actors.hero.talent.conversion_holy.title=성법 귀의
actors.hero.talent.conversion_holy.desc=_+1：_성전이 _성법 귀의_를 시전할 수 있습니다. 2 충전 소모로 _시야 내 임의 대상 침몰_。\n\n_+2：_1의 효과에 더해, 대상에게 _10턴 축복_ 부여。
actors.hero.talent.conversion_holy.comment=이 법술로 침몰시킨 적은 드롭 아이템을 생성하지 않습니다。\n\n「신성 교회에 가입하세요, 신성 교회에 가입해 주셔서 감사합니다。」

actors.hero.talent.purifying_evil.title=악의 정화
actors.hero.talent.purifying_evil.desc=_+1：_성전이 _악의 정화_를 시전할 수 있습니다. 2 충전 소모로 _대상의 모든 버프 효과 제거_。\n\n_+2：_1의 효과에 더해, _대상의 엘리트 효과도 제거_。\n\n_+3：_1과 2의 효과에 더해, _언데드 및 악마 속성_ 적에게 _영웅 최대 체력의 20%_ 피해(보스에게는 절반)。
actors.hero.talent.purifying_evil.comment=

actors.hero.talent.divine_storm.title=신력 영역 폭풍
actors.hero.talent.divine_storm.desc=_+1：_성전이 _신력 영역 폭풍_을 시전할 수 있습니다. 3 충전 소모로 대상 위치에 _3x3 범위_, _10턴_ 지속의 전기장 생성。\n\n_+2：_성전이 _신력 영역 폭풍_을 시전할 수 있습니다. 3 충전 소모로 대상 위치에 _7x7 범위_, _20턴_ 지속의 전기장 생성。\n\n_+3：_2의 효과에 더해, _5x5 범위_, _5턴_ 지속의 화염도 생성。
actors.hero.talent.divine_storm.comment=

actors.hero.talent.genesis.title=창세기
actors.hero.talent.genesis.desc=_+1：_성전이 _창세기_를 시전할 수 있습니다. 3 충전 소모로 _이전 두 층의 재능 포인트 초기화_。\n\n_+2：_성전이 _창세기_를 시전할 수 있습니다. 3 충전 소모로 _모든 재능 포인트 초기화_。
actors.hero.talent.genesis.comment=「그리고 모든 것이 역전되기 시작했다。」

actors.hero.talent.indulgence.title=면죄부
actors.hero.talent.indulgence.desc=_+1：_성전이 _면죄부_를 시전할 수 있습니다. _200 골드_ 소모로 _1 성전 충전_ 회복。\n\n_+2：_성전이 _면죄부_를 시전할 수 있습니다. _150 골드_ 소모로 _1 성전 충전_ 회복。
actors.hero.talent.indulgence.comment=이 법술은 성전 탁본에는 적용되지 않습니다。\n\n「후회된다。」

actors.hero.talent.silver_language.title=은빛 날카로운 말
actors.hero.talent.silver_language.desc=_+1：_성전이 _은빛 날카로운 말_을 시전할 수 있습니다. 1 충전 소모로 대상 _3턴 광란_。\n\n_+2：_성전이 _은빛 날카로운 말_을 시전할 수 있습니다. 1 충전 소모로 대상 _5턴 광란_。
actors.hero.talent.silver_language.comment=「누가 성전에 이런 상스러운 말이 적혀 있을 거라 생각했겠는가?」

actors.hero.talent.resurrection.title=부활술
actors.hero.talent.resurrection.desc=_+1：_성전이 _부활술_을 시전할 수 있습니다. 3 충전 소모로 자신 또는 아군에게 _5턴 사자 소생_ 효과 부여, 효과 지속 중 사망 시 즉시 부활。\n\n_+2：_성전이 _부활술_을 시전할 수 있습니다. 3 충전 소모로 자신 또는 아군에게 _10턴 사자 소생_ 효과 부여, 효과 지속 중 사망 시 즉시 부활。\n\n_+3：_성전이 _부활술_을 시전할 수 있습니다. 3 충전 소모로 자신 또는 아군에게 _10턴 사자 소생_ 효과 부여, 효과 지속 중 사망 시 즉시 부활 및 _20턴 축복_ 효과 획득。
actors.hero.talent.resurrection.comment=이 법술을 아군에게 시전하면 부활 시 최상의 상태가 되며, 영웅 자신에게 시전하면 부활 시 최대 1 체력만 회복됩니다。

actors.hero.talent.bone_fire.title=뼈를 녹이는 불
actors.hero.talent.bone_fire.desc=_+0：_발생한 _불이 자연히 꺼지지 않음_, 캐릭터가 불 피해를 받을 때 아이템 파손 _확률 2배_。\n\n_+1：_발생한 _불이 자연히 꺼지지 않음_。\n\n_+2：_발생한 불이 정상적으로 꺼짐。
actors.hero.talent.bone_fire.comment=

actors.hero.talent.jump_face_silicone.title=얼굴에 실리콘
actors.hero.talent.jump_face_silicone.desc=_+0：_적 각성 시 _2턴 시간 기포_ 획득。\n\n_+1：_적 각성 시 _1턴 시간 기포_ 획득。\n\n_+2：_적 각성 시 더 이상 시간 기포를 획득하지 않음。
actors.hero.talent.jump_face_silicone.comment=「와!」

actors.hero.talent.grass_mob.title=풀도 병사
actors.hero.talent.grass_mob.desc=_+0：_높은 풀이 파괴될 때 _20% 확률_로 썩은 덩굴 촉수 1개 생성。\n\n_+1：_높은 풀이 파괴될 때 _10% 확률_로 썩은 덩굴 촉수 1개 생성。\n\n_+2：_높은 풀이 파괴될 때 더 이상 썩은 덩굴 촉수가 생성되지 않음。
actors.hero.talent.grass_mob.comment=

actors.hero.talent.disaster_curse.title=재앙의 저주
actors.hero.talent.disaster_curse.desc=_+0：_적이 영웅에게 근접 피해를 줄 때 _50% 확률_로 1턴 지연 및 허약 부여。\n\n_+1：_적이 영웅에게 근접 피해를 줄 때 _25% 확률_로 1턴 지연 및 허약 부여。\n\n_+2：_적이 영웅에게 근접 피해를 줄 때 더 이상 지연 및 허약을 부여하지 않음。
actors.hero.talent.disaster_curse.comment=

actors.hero.talent.ashes_bow.title=잿빛 활
actors.hero.talent.ashes_bow.desc=_+1：_투척 무기로 피해를 줄 때 _1턴 연소_ 부여。\n\n_+2：_투척 무기로 피해를 줄 때 _2턴 연소_ 부여。\n\n_+3：_투척 무기로 피해를 줄 때 _3턴 연소_ 부여。
actors.hero.talent.ashes_bow.comment=이 재능은 _5턴 쿨다운_이 있습니다。\n\n영능궁 등 특수 투척 무기를 가진 영웅이 이 재능을 획득하면 특수 투척 무기도 이 재능의 효과를 받습니다。
actors.hero.talent$ashesbowcooldown.name=잿빛 활-쿨다운
actors.hero.talent$ashesbowcooldown.desc=방금 이 재능을 사용했습니다. 잠시 후에 다시 사용할 수 있습니다。\n\n남은 쿨다운: %s턴

actors.hero.talent.swift_church.title=신속 교회
actors.hero.talent.swift_church.desc=_+1：_재생 지팡이 1개_ 획득。\n\n_+2：_1의 효과에 더해(자원 획득 제외), _시간 기포_ 상태에서 공격 시 시간 기포가 _5턴 감소_하며 즉시 종료되지 않음。\n\n_+3：_시간 기포_ 상태에서 공격 시 시간 기포가 _3턴 감소_하며 즉시 종료되지 않음。
actors.hero.talent.swift_church.comment=이러한 업그레이드 또는 변태를 통해 직접 자원을 획득하는 재능은 _26회 발동 제한_(신사는 _39회_)을 공유합니다。\n\n「무서운 보라색 옷 여자가 무한 4턴을 만들어 마지막 구역 보스를 물리쳤다, 그녀가 누군지 알지?」

actors.hero.talent.protect_curse.title=저주 보호
actors.hero.talent.protect_curse.desc=_+1：_저주받은 무기와 방어구가 _1 추가 레벨_ 획득。\n\n_+2：_저주받은 무기와 방어구가 _2 추가 레벨_ 획득。
actors.hero.talent.protect_curse.comment=「이제 정말 저주가 많아도 부담되지 않는다。」

actors.hero.talent.potential_energy.title=위치 에너지 전환
actors.hero.talent.potential_energy.desc=_+1：_영웅이 심연에 떨어진 후 불구 효과 대신 _3턴 신속_ 효과 획득。\n\n_+2：_영웅이 심연에 떨어진 후 불구 효과 대신 _5턴 신속_ 효과 획득。
actors.hero.talent.potential_energy.comment=「지하 감옥 전격전。」

actors.hero.talent.nirvana.title=열반
actors.hero.talent.nirvana.desc=_+1：_자신의 _연소_ 효과 종료 후, _자신의 레벨/2의 체력 회복_。\n\n_+2：_1의 효과에 더해, _연소_ 상태에서 적 공격 시 _3턴 연소_ 부여。
actors.hero.talent.nirvana.comment=「뼈를 녹이는 불도 두렵지 않다。」

actors.hero.talent.insinuation.title=함사섭영
actors.hero.talent.insinuation.desc=_+1：_수면 상태의 생물에게 시전 시 _3턴 중독_ 효과 추가 부여。\n\n_+2：_수면 상태의 생물에게 시전 시 _5턴 중독_ 효과 추가 부여。
actors.hero.talent.insinuation.comment=「함사섭영인, 수병불지。교언구인죄, 지사불의。」

actors.hero.talent.auto_pick.title=자동 획득
actors.hero.talent.auto_pick.desc=_+1：_아이템 획득 소요 시간이 정상의 _50%_로 감소。\n\n_+2：_아이템 획득 _더 이상 시간 소모 없음_。
actors.hero.talent.auto_pick.comment=「누가 내 자동 획득을 켜놨어?」

actors.hero.talent.hand_slip.title=손이 미끄러졌어요
actors.hero.talent.hand_slip.desc=_+0：_이동 후 다음 턴 받는 피해 _50% 증가_。\n\n_+1：_이동 후 다음 턴 받는 피해 _25% 증가_。\n\n_+2：_이동 후 더 이상 받는 피해가 증가하지 않음。
actors.hero.talent.hand_slip.comment=「이번 판은 안정적이다。」

actors.hero.talent.hand_destruction.title=붕괴의 손
actors.hero.talent.hand_destruction.desc=_+1：_물리 공격이 _사신 저항이 없고 체력이 _5% 미만_인 대상을 즉시 _처형_。\n\n_+2：_물리 공격이 _사신 저항이 없고 체력이 _10% 미만_인 대상을 즉시 _처형_。\n\n_+3：_물리 공격이 _사신 저항이 없고 체력이 _15% 미만_인 대상을 즉시 _처형_。
actors.hero.talent.hand_destruction.comment=

actors.hero.talent.predictive_lover.title=예지 비전 애호가
actors.hero.talent.predictive_lover.desc=_+1：_예지 비전 읽기 시 _아이템 1종 추가 감정_。\n\n_+2：_예지 비전 읽기 시 _아이템 2종 추가 감정_。
actors.hero.talent.predictive_lover.comment=이 재능은 무질서 마법서의 예지 비전을 읽어도 발동됩니다。\n\n「여러분, 저는 반지를 좋아합니다。」

actors.hero.talent.fire_ball.title=불덩이
actors.hero.talent.fire_ball.desc=_+1：_가연성 지형에 시전 시 해당 지형에 _1 단위의 화염_ 방출。\n\n_+2：_가연성 지형에 시전 시 해당 지형에 _2 단위의 화염_ 방출。
actors.hero.talent.fire_ball.comment=「이건... 작은 화염 파도인가?」

actors.hero.talent.flash_genius.title=섬광 천재
actors.hero.talent.flash_genius.desc=_+1：_감지 마법석으로 아이템 감정 성공 시 층 내 적에게 _2턴 실명 및 기절_ 부여。\n\n_+2：_감지 마법석으로 아이템 감정 성공 시 층 내 적에게 _3턴 실명 및 기절_ 부여。
actors.hero.talent.flash_genius.comment=해당 재능 업그레이드 시 _감지 마법석 1개_ 추가 획득。\n\n이러한 업그레이드 또는 변태를 통해 직접 자원을 획득하는 재능은 _26회 발동 제한_(신사는 _39회_)을 공유합니다。\n\n「섬광탄。」

actors.hero.talent.witch_potion.title=마녀의 매혹 물약
actors.hero.talent.witch_potion.desc=_+1：_물약 투척 시 대상 위치의 적에게 _15턴 매혹_ 부여。\n\n_+2：_물약 투척 시 대상 위치의 적에게 _15턴 매혹 및 5턴 중독_ 부여。
actors.hero.talent.witch_potion.comment=「평소에는 쓴맛의 커피, 그 안에 매혹 물약이 들어 있었습니다...」\n「가장 성숙한 나는, 아름다운 광대를 사모하며, 행복하게 꿈에 빠져듭니다...」

actors.hero.talent.traitorous_spell.title=첸치 주법
actors.hero.talent.traitorous_spell.desc=_+1：_성전이 _첸치 주법_을 시전할 수 있습니다. _2 충전_ 소모로 지정 위치에 저주 지팡이 효과 방출。\n\n_+2：_성전이 _첸치 주법_을 시전할 수 있습니다. _1 충전_ 소모로 지정 위치에 저주 지팡이 효과 방출。
actors.hero.talent.traitorous_spell.comment=「이것은 성전에 기록된 법술 같지 않습니다。」

actors.hero.talent.sprint_spell.title=신행술
actors.hero.talent.sprint_spell.desc=_+1：_성전이 _신행술_을 시전할 수 있습니다. 1 충전 소모로 _3턴 신속_ 획득。\n\n_+2：_성전이 _신행술_을 시전할 수 있습니다. 1 충전 소모로 _5턴 신속_ 획득。
actors.hero.talent.sprint_spell.comment=「신속력。」

actors.hero.talent.focus_light.title=초점 광선
actors.hero.talent.focus_light.desc=_+1：_성전이 _초점 광선_을 시전할 수 있습니다. 1 충전 소모로 고온 광선을 발사하여 _4~8_ 피해를 주고 경로와 대상을 점화。\n\n_+2：_성전이 _초점 광선_을 시전할 수 있습니다. 1 충전 소모로 고온 광선을 발사하여 _6~10_ 피해를 주고 경로와 대상을 점화。
actors.hero.talent.focus_light.comment=「이것은, 고온 광선총입니다。」

actors.hero.talent.zhuanyu_spell.title=치유 전환술
actors.hero.talent.zhuanyu_spell.desc=_+1：_성전이 _치유 전환술_을 시전할 수 있습니다. 1 충전 소모로 현재 보호막을 _50%_ 비율로 치유 효과로 전환。\n\n_+2：_성전이 _치유 전환술_을 시전할 수 있습니다. 1 충전 소모로 현재 보호막을 _75%_ 비율로 치유 효과로 전환。\n\n_+3：_성전이 _치유 전환술_을 시전할 수 있습니다. 1 충전 소모로 현재 보호막을 _100%_ 비율로 치유 효과로 전환。
actors.hero.talent.zhuanyu_spell.comment=이 법술의 총 치유량은 영웅 최대 체력의 절반을 초과할 수 없습니다。\n\n「성전이 보호막만 주고 치유 효과는 없는 결함을 보완했습니다。」

actors.hero.talent.thorn_whip.title=가시 채찍
actors.hero.talent.thorn_whip.desc=_+1：_성전이 _가시 채찍_을 시전할 수 있습니다. 1 충전 소모로 적을 끌어당기고 _기본값 3의 출혈_ 부여。\n\n_+2：_성전이 _가시 채찍_을 시전할 수 있습니다. 1 충전 소모로 적을 끌어당기고 _기본값 5의 출혈_ 부여。
actors.hero.talent.thorn_whip.comment=「신의 채찍。」

actors.hero.talent.strongest_shield.title=최강의 방패
actors.hero.talent.strongest_shield.desc=_+1：_물리 공격을 받을 때 _50% 확률_로 추가 방어구 감면 1회。\n\n_+2：_1의 효과에 더해, 마법 공격을 받을 때도 _50% 확률_로 방어구 감면 1회。
actors.hero.talent.strongest_shield.comment=

actors.hero.talent.combo_package.title=연타 패키지
actors.hero.talent.combo_package.desc=_+1：_근접 공격 _6회 명중_ 시 섭취 효과 1회 발동。\n\n_+2：_근접 공격 _4회 명중_ 시 섭취 효과 1회 발동。
actors.hero.talent.combo_package.comment=이 재능으로 섭취 효과를 발동시켜 얻은 유물 충전 효과는 풍요의 뿔을 충전할 수 없습니다。\n\n「안 먹었어? 한 대 맞아봐!」
actors.hero.talent$combopackage.name=연타 패키지
actors.hero.talent$combopackage.desc=왜인지 모르게, 적을 계속 때리다 보면 맛있는 음식을 먹는 듯한 쾌감을 느낄 수 있습니다。\n\n근접 연타로 일정 횟수 명중 시 섭취 효과를 발동할 수 있습니다。\n\n현재 연타 수: %1

actors.hero.talent.break_enemy_ranks.title=진형 돌파의 의지
actors.hero.talent.break_enemy_ranks.desc=_+1：_시야 내 적 1명당 영웅에게 _0~3 방어구_ 제공。\n\n_+2：_시야 내 적 1명당 영웅에게 _1~4 방어구_ 제공。
actors.hero.talent.break_enemy_ranks.comment=

actors.hero.talent.hunting_intuition.title=사냥 직감
actors.hero.talent.hunting_intuition.desc=_+1：_닌자의 투척 무기 감정 속도가 원래의 _3배_로 증가。\n\n_+2：_닌자가 _투척 무기로 적 명중 시_ 즉시 감정 가능。
actors.hero.talent.hunting_intuition.comment=「투척 무기를 능숙하게 사용하지 못한다면, 닌자라고 할 수 있겠는가?」

actors.hero.talent.revelation.title=천계
actors.hero.talent.revelation.desc=_+1：_성전이 _천계_를 시전할 수 있습니다. 3 충전 소모로 _3턴의 천계_ 획득, 자신의 기존 _긍정 재능 효과 레벨 +1_。\n\n_+2：_성전이 _천계_를 시전할 수 있습니다. 3 충전 소모로 _5턴의 천계_ 획득, 자신의 기존 _긍정 재능 효과 레벨 +1_。
actors.hero.talent.revelation.comment=재능 효과 레벨은 제한 레벨을 초과할 수 없습니다。\n\n「재능 약화? 하찮은 것。」

actors.hero.talent.holy_grenade.title=신성 수류탄
actors.hero.talent.holy_grenade.desc=_+1：_성전이 _신성 수류탄_을 시전할 수 있습니다. 2 충전 소모로 대상 _3x3 범위_의 적에게 _15~30_ 피해。\n\n_+2：_성전이 _신성 수류탄_을 시전할 수 있습니다. 2 충전 소모로 대상 _3x3 범위_의 적에게 _20~40_ 피해。\n\n_+3：_성전이 _신성 수류탄_을 시전할 수 있습니다. 2 충전 소모로 대상 _5x5 범위_의 적에게 _20~40_ 피해。
actors.hero.talent.holy_grenade.comment=신성 수류탄은 _언데드 및 악마 속성_의 적에게 항상 최대 피해를 입힙니다。\n\n「할렐루야~」

actors.hero.talent.blade_star.title=칼날 계단
actors.hero.talent.blade_star.desc=_+1：_성전이 _칼날 계단_을 시전할 수 있습니다. 2 충전 소모로 _3x3 범위_, _10턴_ 지속의 칼날 영역 생성。\n\n_+2：_성전이 _칼날 계단_을 시전할 수 있습니다. 2 충전 소모로 _5x5 범위_, _10턴_ 지속의 칼날 영역 생성。\n\n_+3：_성전이 _칼날 계단_을 시전할 수 있습니다. 2 충전 소모로 _7x7 범위_, _10턴_ 지속의 칼날 영역 생성。
actors.hero.talent.blade_star.comment=칼날 영역은 매 턴 적에게 4~8의 방어구 무시 피해를 주고 _1턴 불구_를 부여합니다。

actors.hero.talent.sacred_blade.title=황금 회전
actors.hero.talent.sacred_blade.desc=_+1：_성전이 _황금 회전_을 시전할 수 있습니다. 2 충전 소모로 대상에게 _근접 무기 기반 마법 피해_。\n\n_+2：_1의 효과에 더해, _언데드 및 악마 속성_ 적에게 항상 최대 피해。\n\n_+3：_1과 2의 효과에 더해, _언데드 및 악마 속성_ 적에게 추가 _30% 증가_ 피해。
actors.hero.talent.sacred_blade.comment=「어떤 철구는 아닙니다。」

actors.hero.talent.equipment_bless.title=장비 축복
actors.hero.talent.equipment_bless.desc=_+1：_성전이 _장비 축복_을 시전할 수 있습니다. 2 충전 소모로 _50턴의 장비 축복_ 획득, 모든 무기와 방어구가 _1 추가 레벨_ 획득。\n\n_+2：_성전이 _장비 축복_을 시전할 수 있습니다. 2 충전 소모로 _50턴의 장비 축복_ 획득, 모든 무기와 방어구가 _2 추가 레벨_ 획득。
actors.hero.talent.equipment_bless.comment=「신이 만든 물건。」

actors.hero.talent.hotlight.title=작열하는 강광
actors.hero.talent.hotlight.desc=_+1：_성전이 _작열하는 강광_을 시전할 수 있습니다. _3 충전_ 소모로 시야 내 영웅 및 아군을 제외한 대상에게 _3턴 실명_, _언데드 및 악마 속성_ 적에게 _3턴 연소_。\n\n_+2：_성전이 _작열하는 강광_을 시전할 수 있습니다. _2 충전_ 소모로 시야 내 영웅 및 아군을 제외한 대상에게 _3턴 실명_, _언데드 및 악마 속성_ 적에게 _3턴 연소_。
actors.hero.talent.hotlight.comment=「섬광탄 투척!」

actors.hero.talent.healattack.title=성스러운 치유 일격
actors.hero.talent.healattack.desc=_+1：_신성_ 상태의 적에게 물리 공격 시 _3 체력_ 회복。\n\n_+2：_신성_ 상태의 적에게 물리 공격 시 _영웅 레벨 30%의 체력_ 회복。
actors.hero.talent.healattack.comment=「주님의 가호가 있기를(쾅—)。」

actors.hero.talent.eat_mind.title=마음 먹기
actors.hero.talent.eat_mind.desc=_+1：_지팡이 또는 완드로 1 마법 피해를 입힐 때마다 _0.2 포만감_ 회복。\n\n_+2：_지팡이 또는 완드로 1 마법 피해를 입힐 때마다 _0.3 포만감_ 회복。
actors.hero.talent.eat_mind.comment=「작은 것에서 큰 것을 보고, 마음을 먹는다。」

actors.hero.talent.disabliity_posion.title=불구 독구름
actors.hero.talent.disabliity_posion.desc=_+1：_부식 지팡이 시전으로 생성된 부식 산성 안개 _초기 피해 2 증가_ 및 _가스량 30% 추가 증가_。\n\n_+2：_1의 효과에 더해, 부식 산성 안개 내의 적이 지속적으로 _1턴 불구_ 획득。\n\n_+3：_1과 2의 효과에 더해, 부식 산성 안개 내의 적이 지속적으로 _1턴 허약 및 혼란_ 획득。
actors.hero.talent.disabliity_posion.comment=

actors.hero.talent.light_crop.title=번개 비료
actors.hero.talent.light_crop.desc=_+1：_전기장 내에서 일반 빈 땅이 _풀을 자라게_ 하고, 잔해와 풀이 _높은 풀을 자라게_ 합니다。\n\n_+2：_1의 효과에 더해, 번개 지팡이 시전 시 시전 위치에 _이 재능 1의 풀 생성_ 효과를 적용합니다。
actors.hero.talent.light_crop.comment=「N2+O2 방전 시 2NO 생성。」\n「2NO+O2가 2NO2 생성。」\n「2NO2+H2O가 2HNO3+NO 생성。」

actors.hero.talent.devil_flame.title=악마의 불꽃
actors.hero.talent.devil_flame.desc=_+1：_화염파 지팡이 시전 시, _원래 충전 소모가 1_이면 _충전 소모 0_。\n\n_+2：_화염파 지팡이 시전 시, _원래 충전 소모가 2 이상_이면 _충전 소모 -1_。\n\n_+3：_2의 효과에 더해, 화염파 지팡이 시전 피해 _20% 증가_, 화염 체류 시간 _1턴 연장_。
actors.hero.talent.devil_flame.comment=이 재능이 감소시키는 충전 소모는 화염파 지팡이 시전 시 입히는 피해에 영향을 주지 않으며, 여전히 원래 충전 소모를 기준으로 계산됩니다。

actors.hero.talent.fast_break.title=경험 축적
actors.hero.talent.fast_break.desc=_+1：_적 드롭 경험치와 전리품의 _최대 레벨 +2_。\n\n_+2：_적 드롭 경험치와 전리품의 _최대 레벨 +3_。
actors.hero.talent.fast_break.comment=「재물... 분신... 유령... 아직 더 할 수 있어...」

actors.hero.talent.crazy_dancer.title=미친 댄서
actors.hero.talent.crazy_dancer.desc=_+1：_영웅이 적의 물리 피해를 회피하면, 적이 _2턴 광란_。\n\n_+2：_영웅이 적의 물리 피해를 회피하면, 적이 _3턴 광란_。
actors.hero.talent.crazy_dancer.comment=「그만 싸워!」

actors.hero.talent.throwing_recycling.title=투척 회수
actors.hero.talent.throwing_recycling.desc=_+1：_물리 공격이 _화살이 꽂힌 상태_의 적에게 _25% 확률_로 적 몸에 박힌 투척 무기를 회수할 수 있습니다.\n\n_+2：_물리 공격이 _화살이 꽂힌 상태_의 적에게 _50% 확률_로 적 몸에 박힌 투척 무기를 회수할 수 있습니다.\n\n_+3：_물리 공격이 _화살이 꽂힌 상태_의 적에게 _75% 확률_로 적 몸에 박힌 투척 무기를 회수할 수 있습니다.
actors.hero.talent.throwing_recycling.comment=「이론상의 비도 무한 콤보。」

actors.hero.talent.falsehood_power.title=거짓된 힘
actors.hero.talent.falsehood_power.desc=_+1：_힘 -1_, 초과 힘 요구 무기 또는 방어구 장비 시 힘 패널티 _3 감소_。\n\n_+2：_힘 -1_, 초과 힘 요구 무기 또는 방어구 장비 시 힘 패널티 _4 감소_。
actors.hero.talent.falsehood_power.comment=「거짓된 힘이지만, 진짜보다 더 강력하다。」

actors.hero.talent.flame_incarnation.title=화염의 화신
actors.hero.talent.flame_incarnation.desc=_+1：_연소_ 상태의 적 처치 후, _10% 확률_로 불 정령 1개 소환_하여 전투。\n\n_+2：_연소_ 상태의 적 처치 후, _20% 확률_로 불 정령 1개 소환_하여 전투。\n\n_+3：_연소_ 상태의 적 처치 후, _30% 확률_로 불 정령 1개 소환_하여 전투。
actors.hero.talent.flame_incarnation.comment=이 재능으로 생성된 불 정령의 속성은 층의 영향을 받습니다。

actors.hero.talent.marksman.title=마탄 사수
actors.hero.talent.marksman.desc=_+1：_마탄 지팡이 시전으로 레벨이 상승한 지팡이를 다음 시전 시 _충전 소모 없음_。\n\n_+2：_1의 효과에 더해, 마탄 지팡이 _시전 피해 +3_。
actors.hero.talent.marksman.comment=이 특성은 충전을 소모하지 않는 효과가 마법탄 지팡이 자체에는 적용되지 않습니다.\n\n"콩 사수가 무슨 뜻이냐고?"

actors.hero.talent.spider_sense.title=거미 감각
actors.hero.talent.spider_sense.desc=_+1：_영웅이 시야 밖의 공격을 받을 때 _1턴 시간 기포_ 획득。\n\n_+2：_영웅이 시야 밖의 공격을 받을 때 _2턴 시간 기포_ 획득。
actors.hero.talent.spider_sense.comment=「피터의 센스。」

actors.hero.talent.no_more_mob.title=NO 클러스터
actors.hero.talent.no_more_mob.desc=_+1：_시야 밖의 잠든 적이 클러스터 지능 발동 시, _50% 확률_로 깨어나지 않음。\n\n_+2：_1의 효과에 더해, 이로 인해 깨어난 적이 _배회 상태_에 들어가며 영웅을 찾지 않음。
actors.hero.talent.no_more_mob.comment=「다시는 3레벨 클러스터를 켜지 않겠어。」

actors.hero.talent.kebi.title=각필 브라이언트
actors.hero.talent.kebi.desc=_+1：_오술 각필이 이제 _무기에 마법 부여를 부여_할 수 있습니다。\n\n_+2：_1의 효과에 더해, 오술 각필이 _강력한 마법 부여/각인 부여 확률 증가_。
actors.hero.talent.kebi.comment=「브라이언트는 작지만 성공한 마법 부여사였습니다. 그는 많은 강력한 마법 부여와 각인을 창조했습니다. 안타깝게도 이 마법 부여사는 부유 각인 시연 중 불행히도 추락사했으며, 이후 이 각인에 대한 연구는 금지되었습니다。」

actors.hero.talent.ice_meal.title=얼음 에너지 식사
actors.hero.talent.ice_meal.desc=_+1：_섭취 시 _1턴_만 소모하며, _2턴의 서리 힘_ 획득。\n\n_+2：_섭취 시 _1턴_만 소모하며, _4턴의 서리 힘_ 획득。\n\n_+3：_2의 효과에 더해, 섭취 시 영웅 주변 생물에게 _10턴 빙결_。
actors.hero.talent.ice_meal.comment=

actors.hero.talent.more_favors.title=더 많은 호의
actors.hero.talent.more_favors.desc=_+1：_트롤 대장장이 임무에서 암금석 1개당 제공하는 호의 _25 증가_。\n\n_+2：_트롤 대장장이 임무에서 암금석 1개당 제공하는 호의 _50 증가_, 호의 상한이 3000에서 _4000_으로 증가。
actors.hero.talent.more_favors.comment=「입은 험하지만 사람은 좋다。」

actors.hero.talent.hardware_elements.title=철물 원소
actors.hero.talent.hardware_elements.desc=_+1：_원소 잔불이 소환 수정 제련 시 소모되지 않지만, 제련에 필요한 _연금 에너지 소모가 20으로 증가_。\n\n_+2：_원소 잔불이 소환 수정 제련 시 소모되지 않지만, 제련에 필요한 _연금 에너지 소모가 15로 증가_。\n\n_+3：_원소 잔불이 소환 수정 제련 시 소모되지 않으며, 제련에 필요한 _연금 에너지 소모가 더 이상 증가하지 않음_。
actors.hero.talent.hardware_elements.comment=「무한한 에너지를 얻는 것도 연금술의 목적 중 하나입니다。」

actors.hero.talent.static_light.title=정체 전류
actors.hero.talent.static_light.desc=_+1：_시전 피해 +1_, 지팡이 또는 완드 시전으로 적 공격 시 _입힌 피해 5% 턴의 마비_ 추가 부여。\n\n_+2：_시전 피해 +2_, 지팡이 또는 완드 시전으로 적 공격 시 _입힌 피해 7.5% 턴의 마비_ 추가 부여。
actors.hero.talent.static_light.comment=이 재능이 부여하는 마비 턴은 내림 처리됩니다。\n\n「이것은 번개 법왕을 향한 작은 한 걸음입니다。」

actors.hero.talent.miracle_alchemy.title=기적의 연금
actors.hero.talent.miracle_alchemy.desc=_+1：_연금 시 _20% 확률_로 연금 산물 _1개 추가 제련_。\n\n_+2：_연금 시 _40% 확률_로 연금 산물 _1개 추가 제련_。
actors.hero.talent.miracle_alchemy.comment=이 재능은 장신구, 찜, 익힌 무미 과일, 근육 기억 혼합물, 주입 마법 비전, 모든 폭탄, 액체 금속, 성전 탁본, 근골 비약, 주입 마름 결정 및 변태 수정의 제련에는 적용되지 않습니다。\n\n「연금 자체가 기적입니다. 저는 연금을 사랑합니다。」

actors.hero.talent.hungry_ghost.title=배고픈 귀신
actors.hero.talent.hungry_ghost.desc=_+0：_굶주림 피해를 받을 때 _유령 1개 생성_, 유령 공격 시 _포만감 5 감소_。\n\n_+1：_굶주림 피해를 받을 때 _유령 1개 생성_。\n\n_+2：_굶주림 피해를 받을 때 더 이상 유령이 생성되지 않음。
actors.hero.talent.hungry_ghost.comment=

actors.hero.talent.unable_rest.title=안식 불가
actors.hero.talent.unable_rest.desc=_+0：_언데드 및 악마 속성_ 적이 치명적 피해를 받을 때 _1 체력_ 유지 및 _최대 체력 20%의 보호막_ 획득。\n\n_+1：_언데드 및 악마 속성_ 적이 치명적 피해를 받을 때 _1 체력_ 유지。\n\n_+2：_언데드 및 악마 속성 적이 치명적 피해를 받으면 바로 죽음。
actors.hero.talent.unable_rest.comment=이 재능은 원래 부활 능력이 있는 적(예: 드워프 시체) 및 보스 적에게는 적용되지 않습니다。

actors.hero.talent.cursedman.title=저주받은 자
actors.hero.talent.cursedman.desc=_+0：_아이템에 _업그레이드 두루마리, 주입 마법 비전, 마법 부여 마법석 또는 오술 각필_ 사용 시 아이템이 저주받음。\n\n_+1：_아이템에 _마법 부여 마법석 또는 오술 각필_ 사용 시 아이템이 저주받음。\n\n_+2：_아이템에 업그레이드 두루마리, 주입 마법 비전, 마법 부여 마법석 또는 오술 각필 사용 시 더 이상 저주받지 않음。
actors.hero.talent.cursedman.comment=

actors.hero.talent.usury.title=고리대금
actors.hero.talent.usury.desc=_+0：_1000 골드 획득? 어쨌든 영웅이 다음 층마다 _200 골드_의 이자 차감。\n\n_+1：_이자가 _150 골드_로 감소。\n\n_+2：_더 이상 이자가 차감되지 않음。
actors.hero.talent.usury.comment=
actors.hero.talent.usury.nomoney=예상치 못했지! 점주가 네 대출을 일부 횡령했어!
actors.hero.talent.usury.principal=점주가 너에게 신청해준 고리대금이다。
actors.hero.talent.usury.interest=층당 이자 지급: %d 골드。

actors.hero.talent.armed_uprising.title=극악 중대
actors.hero.talent.armed_uprising.desc=_+1：_아군의 물리 공격이 영웅이 가진 대부분의 _물공 효과_를 동기화합니다。\n\n_+2：_1의 효과에 더해, 아군의 물리 공격이 영웅이 가진 대부분의 _물공 피해 증가_도 동기화합니다。
actors.hero.talent.armed_uprising.comment=이 재능의 동기화 효과는 주로 영웅이 가진 재능 및 영웅 자체의 특성에 따라 결정됩니다。\n\n「전원 출격!」

actors.hero.talent.dungeon_hero.title=지하 감옥 영웅
actors.hero.talent.dungeon_hero.desc=_+1：_임무 NPC 및 각 지역의 상인과 처음 상호작용할 때, _하급 드롭 2개_ 획득。\n\n_+2：_임무 NPC 및 각 지역의 상인과 처음 상호작용할 때, _중급 드롭 2개_ 획득。
actors.hero.talent.dungeon_hero.comment=「에메랄드나 아이템 거래는 받지 않습니다。」

actors.hero.talent.exp_solid.title=경험치 고정
actors.hero.talent.exp_solid.desc=_+1：_영웅 레벨 1 감소_ 및 _경험치 물약 1병_ 획득。\n\n_+2：_영웅 레벨 2 감소_ 및 _경험치 물약 2병_ 획득。
actors.hero.talent.exp_solid.comment=이 재능은 자원 획득 횟수가 상한에 도달한 후에도 업그레이드 시 영웅 레벨을 낮출 수 있습니다. 이러한 업그레이드 또는 변태를 통해 직접 자원을 획득하는 재능은 _26회 발동 제한_(신사는 _39회_)을 공유합니다。\n\n「약해졌다고? 아니, 강해졌어(부의 반지를 착용하며)。」

actors.hero.talent.wealth_statue.title=부의 석상
actors.hero.talent.wealth_statue.desc=_+1：_살아있는 석상과 장갑 석상 사망 시 _레벨 2의 무작위 반지_ 드롭, 소환 수호자 사망 시 _레벨 1의 무작위 반지_ 드롭。\n\n_+2：_살아있는 석상과 장갑 석상 사망 시 _레벨 3의 무작위 반지_ 드롭, 소환 수호자 사망 시 _레벨 2의 무작위 반지_ 드롭。\n\n_+3：_살아있는 석상과 장갑 석상 사망 시 _레벨 4의 무작위 반지_ 드롭, 소환 수호자 사망 시 _레벨 3의 무작위 반지_ 드롭。
actors.hero.talent.wealth_statue.comment=이 재능으로 획득한 반지는 미감정 상태이며, 이 재능의 자원 획득 횟수는 _26회_(신사는 _39회_)로 제한되며, 이 제한은 대부분의 업그레이드 또는 변태를 통해 직접 자원을 획득하는 재능과 공유됩니다。

actors.hero.talent.sweet_sleep.title=달콤한 잠
actors.hero.talent.sweet_sleep.desc=_+1：_기습 시 _30%의 추가 피해_。\n\n_+2：_기습 시 _40%의 추가 피해_。
actors.hero.talent.sweet_sleep.comment=「죽음은 두렵지 않다. 죽음은 시원한 여름밤, 근심 없이 편히 잠들 수 있는 곳이다。」

actors.hero.talent.light_shock.title=광명 섬광
actors.hero.talent.light_shock.desc=_+1：_프리즘 지팡이 1개_ 획득, 프리즘 지팡이 시전으로 실명을 유발할 뿐만 아니라 _지팡이 레벨 50% 턴의 불구_도 유발, 시전 전 대상이 이미 실명 상태였어도 불구가 유발됩니다。\n\n_+2：_1의 효과에 더해(자원 획득 제외), 프리즘 지팡이 시전으로 실명을 유발하거나 실명 대상에게 시전 시, 피해 _30% 증가_。
actors.hero.talent.light_shock.comment=이러한 업그레이드 또는 변태를 통해 직접 자원을 획득하는 재능은 _26회 발동 제한_(신사는 _39회_)을 공유합니다。\n\n「위광을 손에 쥐고, 세상의 악행을 쓸어버리리라。」

actors.hero.talent.boozy.title=술고래
actors.hero.talent.boozy.desc=_+1：_물약 섭취 시 _5 체력 회복_ 및 턴당 감소하는 _0~5 나무 껍질_ 추가 획득。\n\n_+2：_물약 섭취 시 _10 체력 회복_ 및 턴당 감소하는 _0~10 나무 껍질_ 추가 획득。
actors.hero.talent.boozy.comment=「약은 미주와 같아서, 오래될수록 더 향기롭다。」

actors.hero.talent.shadow_killer.title=그림자 암살자
actors.hero.talent.shadow_killer.desc=_+1：_기습으로 얻는 _피해 보정 25% 증가_ 및 _적 방어구 100%_의 추가 피해。\n\n_+2：_기습으로 얻는 _피해 보정 100% 증가_ 및 _적 방어구 150%_의 추가 피해。
actors.hero.talent.shadow_killer.comment=

actors.hero.talent.kill_spree.title=학살 광란
actors.hero.talent.kill_spree.desc=_+1：_영웅이 물리 공격으로 적을 죽일 때 _적 최대 체력 5%의 체력 회복_ 및 _2턴의 유물 충전_ 획득。\n\n_+2：_영웅이 물리 공격으로 적을 죽일 때 _적 최대 체력 7.5%의 체력 회복_ 및 _3턴의 유물 충전_ 획득。
actors.hero.talent.kill_spree.comment=

actors.hero.talent.seaofpeople.title=인파
actors.hero.talent.seaofpeople.desc=_+1：_시야 내 적 1명당, 이동 속도 _30% 증가_。\n\n_+2：_시야 내 적 1명당, 이동 속도 _45% 증가_。
actors.hero.talent.seaofpeople.comment=

actors.hero.talent.phantom_step.title=환영 미보
actors.hero.talent.phantom_step.desc=_+1：_투명 또는 그림자 은신 해제 후, _3턴 신속_ 및 _1턴 환영 미보_(모든 공격 회피) 획득。\n\n_+2：_투명 또는 그림자 은신 해제 후, _5턴 신속_ 및 _2턴 환영 미보_(모든 공격 회피) 획득。
actors.hero.talent.phantom_step.comment=이 재능이 _+1/+2_ 레벨일 때, 영웅이 이미 _6/10턴_ 이상의 신속 효과를 가지고 있으면 이 재능으로 신속 효과의 지속 시간을 더 이상 늘릴 수 없습니다。\n\n재구성 지하 감옥의 새로운 힘!
actors.hero.talent$phantomstep.name=환영 미보
actors.hero.talent$phantomstep.desc=모든 도둑 길드 멤버가 동경하는 최고의 경지, 그것이 바로 이 능력을 손에 넣는 것입니다。\n\n이 효과의 영향으로, 당신은 모든 물리적 또는 마법적 공격을 회피합니다。\n\n효과 잔여 시간: %s턴

actors.hero.talent.steam_bean.title=증기 콩
actors.hero.talent.steam_bean.desc=_+0：_적에 대한 첫 번째 물리 공격 시 영웅이 _8턴의 혼란_에 빠짐。\n\n_+1：_적에 대한 첫 번째 물리 공격 시 영웅이 _4턴의 혼란_에 빠짐。\n\n_+2：_물리 공격 시 더 이상 영웅이 혼란에 빠지지 않음。
actors.hero.talent.steam_bean.comment=

actors.hero.talent.alchemy_accident.title=연금 사고
actors.hero.talent.alchemy_accident.desc=_+0：_연금 산물 제련 시 _20% 확률_로 영웅 중심으로 폭발 발생。\n\n_+1：_연금 산물 제련 시 _10% 확률_로 영웅 중심으로 폭발 발생。\n\n_+2：_이제 연금이 안전해짐。
actors.hero.talent.alchemy_accident.comment=

actors.hero.talent.shell_cry.title=결정화된 외골격
actors.hero.talent.shell_cry.desc=_+0：_영웅의 방어구가 체력 감소에 따라 감소하며, 최대 _100%_ 감소。\n\n_+1：_영웅의 방어구가 체력 감소에 따라 감소하며, 최대 _50%_ 감소。\n\n_+2：_영웅의 방어구가 더 이상 체력 감소에 따라 감소하지 않음。
actors.hero.talent.shell_cry.comment=

actors.hero.talent.mal_curse.title=악독한 저주
actors.hero.talent.mal_curse.desc=_+0：_저주받은 장비가 _2 레벨 감소_。\n\n_+1：_저주받은 장비가 _1 레벨 감소_。\n\n_+2：_저주가 더 이상 장비 레벨에 영향을 주지 않음。
actors.hero.talent.mal_curse.comment=이 재능은 장비 레벨을 음수로 낮출 수 있습니다。\n\n오리지널 픽셀 던전의 강력한 저주!

actors.hero.talent.thunder_strike.title=번개 타격
actors.hero.talent.thunder_strike.desc=해당 재능 업그레이드 시, 물리 공격에 _입힌 피해의 50%_의 전격이 추가됩니다(영웅과 아군은 전격 피해를 받지 않음). 전격은 공격 대상과 인접한 생물을 연결할 수 있습니다(공격자는 연결되지 않음). 공격 대상이 물 속에 있거나 영웅이 _지팡이 또는 유물 충전 효과_를 가지고 있으면 연결 거리 +1。\n\n_+1：_전격이 _연결된 적에게만_ 피해를 입힙니다。\n\n_+2：_전격이 _모든 연결된 적에게_ 피해를 입힙니다。
actors.hero.talent.thunder_strike.comment=「내가 DM-300도 고장 난 로봇이라고 말한 적 있나? 아는 사람?」

actors.hero.talent.directional_collapse.title=방향성 붕괴
actors.hero.talent.directional_collapse.desc=_+1：_지팡이 또는 완드 _4회_ 시전마다 시전 대상 주변에 대량 낙석 발생, _10~20_의 방어구 무시 피해 및 _3턴 마비_。\n\n_+2：_지팡이 또는 완드 _3회_ 시전마다 시전 대상 주변에 대량 낙석 발생, _10~20_의 방어구 무시 피해 및 _3턴 마비_。
actors.hero.talent.directional_collapse.comment=이 재능으로 발생한 낙석은 영웅과 아군에게 피해와 마비를 입히지 않습니다。
actors.hero.talent$directionalcollapse.name=방향성 붕괴
actors.hero.talent$directionalcollapse.desc=DM-300의 고출력 드릴에서 떨어져 나온 금속 조각은 다른 금속 잔해에서 수집한 사악한 조각과는 약간 다른 듯하며, 손가락으로 닿는 순간 빠르게 사라져 버렸습니다. 이것이 무엇을 의미하는지 알 수 없지만, 배낭 속의 지팡이가 더 강해진 것을 느낄 수 있습니다.\n\n_%s_회 시전할 때마다 방향성 붕괴가 발동되어, 시전 대상 주변에 낙석을 발생시켜 10~20의 방어 무시 피해와 3턴 마비를 줍니다. 다행히도 이 낙석은 당신과 아군에게는 영향을 미치지 않습니다.\n\n현재 시전 횟수: %s


#새로운 법술
actors.hero.spells.ascension_curse.name=승천 저주
actors.hero.spells.ascension_curse.short_desc=시전자에게 부유 효과를 부여합니다。
actors.hero.spells.ascension_curse.desc=시전자가 주문을 외워 자신을 잠시 동안 가볍게 만들어 _%1 동안 부유할 수 있습니다。\n\n이 법술 시전 _1턴 소모_。

actors.hero.spells.divine_protection.name=신의 가호
actors.hero.spells.divine_protection.short_desc=시전자를 잠시 동안 무적으로 만듭니다。
actors.hero.spells.divine_protection.desc=시전자가 성전의 힘을 통해 신의 가호를 빌며, 응답을 받은 후 자신이 무적 상태가 되어 _%1$d턴_ 동안 지속됩니다.\n\n이 주문은 시전에 _1턴_이 소모됩니다.

actors.hero.spells.shepherd_intention.name=목양의 원칙
actors.hero.spells.shepherd_intention.short_desc=지정 위치에 마법 양 떼를 소환합니다。
actors.hero.spells.shepherd_intention.desc=시전자가 성전을 통해 체내의 마력을 응집한 후, 지정 위치에 소환합니다... 마법 양 떼? 글쎄, 적어도 죽지 않는다는 건 확실합니다。\n\n이 법술 시전 _1턴 소모_。

actors.hero.spells.conversion_holy.name=성법 귀의
actors.hero.spells.conversion_holy.short_desc=대상을 침몰시킬 수 있습니다。
actors.hero.spells.conversion_holy.no_target=침몰시킬 대상이 없습니다。
actors.hero.spells.conversion_holy.desc=시전자가 성전의 신력을 보여주어 대상을 신성 교회에 귀의시켜 충성스러운 하인으로 만듭니다。\n\n이 법술로 침몰시킨 적은 드롭 아이템을 생성하지 않습니다。\n\n이 법술 시전 _1턴 소모_。

actors.hero.spells.purifying_evil.name=악의 정화
actors.hero.spells.purifying_evil.short_desc=대상을 정화할 수 있습니다。
actors.hero.spells.purifying_evil.no_target=정화할 대상이 없습니다。
actors.hero.spells.purifying_evil.desc=시전자가 성전의 거대한 신성한 힘을 통해 적을 정화하여 버프를 제거하고, 엘리트 효과까지 제거하며 언데드 및 악마 속성 적에게 피해를 입힙니다。\n\n이 법술 시전 _1턴 소모_。

actors.hero.spells.divine_storm.name=신력 영역 폭풍
actors.hero.spells.divine_storm.short_desc=강력한 신력 영역을 생성하여 적을 심판합니다。
actors.hero.spells.divine_storm.desc=시전자가 성전을 인도하여 강력한 신력 영역을 생성, 적을 마비시키거나 불태웁니다。\n\n이 법술 시전 _1턴 소모_。

actors.hero.spells.genesis.name=창세기
actors.hero.spells.genesis.short_desc=자신의 재능을 초기화합니다。
actors.hero.spells.genesis.desc=시전자가 신이 세계를 창조한 것처럼 자신을 재구성합니다。\n\n이 법술 시전 _1턴 소모_。

actors.hero.spells.indulgence.name=면죄부
actors.hero.spells.indulgence.short_desc=골드를 소모하여 성전 충전을 회복합니다。
actors.hero.spells.indulgence.desc=시전자가 _%1 골드_를 소모하여 자신의 죄를 씻고 성전 충전을 회복합니다。\n\n이 법술 시전 _1턴 소모_。\n\n이 법술은 성전 탁본에는 적용되지 않습니다。
actors.hero.spells.indulgence.no_tome=성전이 없으면, 당신의 참회는 의미 없습니다。

actors.hero.spells.silver_language.name=은빛 날카로운 말
actors.hero.spells.silver_language.short_desc=대상을 잠시 동안 광란시킵니다。
actors.hero.spells.silver_language.no_target=이로 인해 광란할 대상이 없습니다。
actors.hero.spells.silver_language.desc=시전자가 목표를 향해 성전에 적힌 몇 구절을 큰 소리로 낭독하여, 즉시 방어를 무너뜨리고 _%1$d턴_ 동안 광란 상태에 빠뜨립니다.\n\n이 주문은 시전에 _1턴_이 소모됩니다.

actors.hero.spells.resurrection.name=부활술
actors.hero.spells.resurrection.short_desc=대상이 단시간 내에 사망하면 부활시킵니다。
actors.hero.spells.resurrection.no_target=해당 대상에게 법술을 적용할 수 없습니다。
actors.hero.spells.resurrection.desc=시전자가 성전의 위력을 빌려 자신 또는 아군에게 강력한 부활술을 시전합니다. 단시간 내에 사망하면 부활할 수 있습니다。\n\n이 법술 시전 _1턴 소모_。
actors.hero.spells.resurrection$resurrection.name=사자 소생
actors.hero.spells.resurrection$resurrection.desc=이 캐릭터는 사망 후 부활합니다! \n\n이 효과의 영향을 받는 아군은 효과 지속 중 사망 시 최상의 상태로 부활합니다。\n\n이 효과의 영향을 받는 것이 영웅이라면, 영웅이 효과 지속 중 사망해도 부활하지만 최대 1 체력만 유지합니다。\n\n잔여 턴 수: %s

actors.hero.spells.traitorous_spell.name=첸치 주법
actors.hero.spells.traitorous_spell.short_desc=저주 지팡이 효과를 방출합니다。
actors.hero.spells.traitorous_spell.desc=시전자가 첸치 신선의 주술을 사용하여 대상에게 무작위 저주 효과를 적용합니다。\n\n이 법술 시전 _1턴 소모_。

actors.hero.spells.sprint_spell.name=신행술
actors.hero.spells.sprint_spell.short_desc=자신에게 신속 효과를 부여합니다。
actors.hero.spells.sprint_spell.desc=시전자가 법주를 방출하여 마치 신행태보 대종처럼 하루 천리를 달리는 속도를 얻어, 자신에게 _%1 신속_을 부여합니다。\n\n이 법술 시전 _1턴 소모_。

actors.hero.spells.focus_light.name=초점 광선
actors.hero.spells.focus_light.short_desc=고온 광선을 발사하여 모든 것을 불태웁니다。
actors.hero.spells.focus_light.desc=시전자가 고온 광선을 발사하여 _%1~%2 피해_를 주고 경로와 대상을 점화합니다。\n\n이 법술 시전 _1턴 소모_。

actors.hero.spells.zhuanyu_spell.name=치유 전환술
actors.hero.spells.zhuanyu_spell.short_desc=보호막을 치유량으로 전환합니다。
actors.hero.spells.zhuanyu_spell.desc=시전자 자신의 보호막을 _%d%%_의 비율로 치료 효과로 전환하며, 총 치료량은 최대 생명력의 절반을 초과할 수 없습니다.\n\n이 주문은 시전에 _1턴_이 소모됩니다.

actors.hero.spells.thorn_whip.name=가시 채찍
actors.hero.spells.thorn_whip.short_desc=대상을 끌어당기고 출혈을 부여합니다。
actors.hero.spells.thorn_whip.no_target=끌어당길 대상이 없거나 해당 대상을 끌어당길 수 없습니다。
actors.hero.spells.thorn_whip.more_distance=거리가 너무 멀어 닿을 수 없습니다。
actors.hero.spells.thorn_whip.desc=시전자의 손에 가시 달린 황금 채찍이 나타나 대상을 끌어당기고 _기본값 %1 출혈_을 추가합니다。\n\n이 법술의 거리 제한은 _12칸_입니다。\n\n이 법술 시전 _1턴 소모_。

actors.hero.spells.revelation.name=천계
actors.hero.spells.revelation.short_desc=자신의 기존 긍정 재능 레벨을 상승시킵니다。
actors.hero.spells.revelation.desc=시전자가 하늘의 계시를 받아 _%1 천계_를 획득, 자신의 기존 _긍정 재능 효과 레벨 +1_。\n\n재능 효과 레벨은 제한 레벨을 초과할 수 없습니다。\n\n이 법술 시전 _시간 소모 없음_。
actors.hero.spells.revelation$revelationbuff.name=천계
actors.hero.spells.revelation$revelationbuff.desc=당신이 하늘의 계시를 받았다고 느낍니다. 모든 기존 긍정 재능 효과 레벨 +1。\n\n잔여 턴 수: %s턴

actors.hero.spells.holy_grenade.name=신성 수류탄
actors.hero.spells.holy_grenade.short_desc=폭발을 일으켜 적을 살상합니다。
actors.hero.spells.holy_grenade.desc=시전자가 에너지 광구를 던져, 광구 낙하 지점 _%1%1 범위에 _%2~%3 피해를 입힙니다. 언데드 및 악마 대상은 항상 최대 피해를 받습니다。\n\n이 법술 시전 _1턴 소모_。

actors.hero.spells.blade_star.name=칼날 계단
actors.hero.spells.blade_star.short_desc=칼날 영역을 생성하여 적을 공격하고 불구를 만듭니다。
actors.hero.spells.blade_star.desc=시전자가 성광을 실체화하여 칼날로 만듭니다. _%1%1 범위의 칼날 영역이 형성되어, 영역 내의 적은 지속적으로 _4~8_의 피해를 받고 _3턴 불구_ 효과를 얻습니다. 이 영역은 _10턴_ 유지됩니다。\n\n이 법술 시전 _1턴 소모_。
actors.hero.spells.blade_star.invalid_target=해당 위치에 칼날 영역을 생성할 수 없습니다。
actors.hero.spells.blade_star$blade_stair.name=칼날 영역
actors.hero.spells.blade_star$blade_stair.desc=이곳은 이미 칼날 영역으로 변했습니다. 칼날 영역은 지속적으로 적을 공격하고 감속시킵니다。

actors.hero.spells.sacred_blade.name=황금 회전
actors.hero.spells.sacred_blade.short_desc=성광으로 응축된 부메랑을 던져 대상에게 마법 피해를 입힙니다。
actors.hero.spells.sacred_blade.desc=시전자가 성광으로 응축된 부메랑을 던져 대상에게 _손에 든 무기 기반의 마법 피해_를 입힙니다. 언데드 및 악마 대상은 추가 피해 보너스를 받습니다。\n\n이 법술 시전 _1턴 소모_。

actors.hero.spells.equipment_bless.name=장비 축복
actors.hero.spells.equipment_bless.short_desc=모든 무기와 방어구를 강화합니다。
actors.hero.spells.equipment_bless.desc=시전자가 모든 무기와 방어구에 축복을 내려 레벨이 일시적으로 상승합니다。\n\n이 법술 시전 _1턴 소모_。
actors.hero.spells.equipment_bless$blessbuff.name=장비 축복
actors.hero.spells.equipment_bless$blessbuff.desc=몸에 지닌 장비가 축복을 받은 느낌입니다.\n\n이 효과가 지속되는 동안 모든 무기와 방어구의 레벨이 일시적으로 상승합니다.\n\n남은 턴 수: %s턴

actors.hero.spells.hotlight.name=작열하는 강광
actors.hero.spells.hotlight.short_desc=강광을 방출하여 적을 실명시킵니다。
actors.hero.spells.hotlight.desc=시전자가 작열하는 강광을 방출하여 시야 내 모든 적을 _3턴 실명_시키며, 언데드 및 악마 적을 직접 점화합니다。\n\n이 법술 시전 _1턴 소모_。

actors.hero.heroclass.freeman=신사
actors.hero.heroclass.freeman_desc_short=신사_는 더 많은 잠재력을 발휘할 수 있으며_, 초기에 독특한 _서류 가방_을 휴대하고 있습니다.
actors.hero.heroclass.freeman_desc=신사는 초기에 _독특한 서류 가방_을 휴대하고 있으며, 그 안에서 특별한 아이템이나 능력을 얻을 수 있습니다.\n\n신사는 전문적인 전투 훈련을 받지 않았기에 전투 능력이 거의 없지만, _무한한 잠재력을 발휘할 수 있습니다_.\n\n또한, 신사는 초기에 _지팡이 하나_, _행운의 은화 하나_, 천갑옷, 물주머니와 벨벳 주머니를 휴대하고 있습니다.\n\n신사가 게임 시작 시 감정하는 아이템:\n_-_경험의 물약\n_-_변이의 두루마리, 감정의 두루마리와 변질의 두루마리
actors.hero.heroclass.freeman_unlock=_변태 두루마리로 재능 변태_하여 신사 해제。
actors.hero.herosubclass.freeman=신사
actors.hero.herosubclass.freeman_short_desc=_신사_는 텐구의 가면에서 더 많은 힘을 얻을 수 없지만, 여전히 더 많은 잠재력을 발휘할 수 있습니다。
actors.hero.herosubclass.freeman_desc=신사는 텐구의 가면을 쓴 후 많은 힘을 얻지 못했지만, 가면이 붕괴된 후 추가로 변태 두루마리 1장을 얻습니다。\n\n또한, 신사는 여전히 더 많은 잠재력을 발휘할 수 있습니다。

actors.hero.abilities.freeman.salescontract.desc=이 적은 신사에게 속아 자신을 무조건 신사에게 팔아넘겼으며, 지금은 신사를 위해 일하고 있습니다。
actors.hero.abilities.freeman.salescontract.desc=억울함과 원한을 가득 안고 죽은 노동자(마물)가 화한 원령입니다. 비록 육체는 죽었지만 여전히 계약 내용에 따라 신사를 위해 일해야 합니다。\n\n불쌍하게도 정말로 신사에게 두 번 일하게 되었습니다。
actors.hero.abilities.freeman.salescontract.self_target=자신을 선택할 수 없습니다。
actors.hero.abilities.freeman.salescontract.no_target=계약을 체결할 대상이 없습니다。
actors.hero.abilities.freeman.salescontract.more_distance=대상이 너무 멉니다。
actors.hero.abilities.freeman.salescontract.strong_target=대상이 당신과의 계약 체결을 거부하며 당신을 경멸합니다。
actors.hero.talent.elite_recruit.title=엘리트 채용
actors.hero.talent.elite_recruit.desc=_+1：_계약 체결 시, 신사가 추가로 _200골드_를 지불하여 계약한 적에게 무작위 엘리트 효과 하나를 부여합니다。\n\n_+2：_계약 체결 시, 신사가 추가로 _150골드_를 지불하여 계약한 적에게 무작위 엘리트 효과 하나를 부여합니다。\n\n_+3：_계약 체결 시, 신사가 추가로 _100골드_를 지불하여 계약한 적에게 무작위 엘리트 효과 하나를 부여합니다。\n\n_+4：_계약 체결 시, 신사가 추가로 _50골드_를 지불하여 계약한 적에게 무작위 엘리트 효과 하나를 부여합니다。
actors.hero.talent.elite_recruit.comment=
actors.hero.talent.prim_accu.title=원시 축적
actors.hero.talent.prim_accu.desc=_+1：_계약한 적이 물리 공격으로 다른 적을 공격하면 신사에게 _10골드_를 제공합니다。\n\n_+2：_계약한 적이 물리 공격으로 다른 적을 공격하면 신사에게 _20골드_를 제공합니다。\n\n_+3：_계약한 적이 물리 공격으로 다른 적을 공격하면 신사에게 _30골드_를 제공합니다。\n\n_+4：_계약한 적이 물리 공격으로 다른 적을 공격하면 신사에게 _40골드_를 제공합니다。
actors.hero.talent.prim_accu.comment=
actors.hero.talent.soul_contract.title=영혼 계약
actors.hero.talent.soul_contract.desc=_+1：_계약을 맺은 적이 죽으면 _부패한 노동귀가_ 되며, 신사는 계약의 무시된 세부 조항을 통해 원래 노동귀가 받아야 할 산업 재해 보상금을 대신 받아 _100골드_를 얻습니다.\n\n_+2：_+1을 기반으로, 노동귀의 부패 효과가 _종신 고용_ 효과로 변경됩니다.\n\n_+3：_+1과 +2를 기반으로, 노동귀가 _무작위 정예_ 효과도 얻습니다.\n\n_+4：_+1, +2, +3을 기반으로, 노동귀의 _최대 생명력이 이전 생명체(원래 계약 적)와 동일해집니다_.
actors.hero.talent.soul_contract.comment=

actors.mobs.transformmimic.name=변태 미믹
actors.mobs.transformmimic.desc=미믹은 외형을 자유자재로 바꾸는 마법 생물입니다. 지하 감옥에서는 거의 항상 보물 상자 형태로 나타나는데, 방심한 모험가를 유인하기에 딱 좋기 때문입니다。\n\n변태 미믹은 변태 두루마리가 어떤 사악한 힘에 의해 형체화되어 탄생한 미믹입니다. 공방 능력은 일반 미믹과 다르지 않지만, 항상 변태 두루마리만 들어있고 다른 전리품은 없습니다。
actors.mobs.transformmimic.reveal=저기에 미믹이 있다!
actors.mobs.transformmimic.hidden_name=보라색 보물 상자?
actors.mobs.transformmimic.hidden_desc=열기 전에는 안에 뭐가 들었는지 알 수 없습니다!\n\n이 보라색 보물 상자는 흔히 보는 상자와는 많이 달라 보이니, 함부로 열지 않는 것이 좋겠습니다。
actors.mobs.transformmimic.discover_hint=특정 도전 과제를 활성화한 후 어떤 지하 감옥 지역에서든 이 적을 발견할 수 있습니다。

actors.hero.heroclass.princess=드워프 공주
actors.hero.heroclass.princess_desc_short=드워프 공주는 마법 부여와 각인을 저장할 수 있는 _왕세자 반지_를 휴대하며, 약간의 연금 에너지를 소모하여 임의의 마법석을 _마법 부여석_으로 변환할 수 있습니다。
actors.hero.heroclass.princess_desc=드워프 공주는 초기부터 _독특한 왕세자 반지_를 휴대하며, 무기나 방어구처럼 마법 부여와 각인을 저장하여 이들에 직접 적용할 수 있습니다。\n\n드워프 공주는 임의의 마법석을 _마법 부여석_으로 직접 _변환_할 수 있으며, 이는 8의 연금 에너지를 소모합니다。\n\n또한, 드워프 공주는 초기 _방패 하나_, _마법석 한 줄_, 천 갑옷, 물주머니와 천 주머니를 휴대합니다。\n\n드워프 공주가 시작 시 감정하는 아이템:\n_-_부유 물약\n_-_변태 두루마리, 감정 두루마리 및 복수 두루마리
actors.hero.heroclass.princess_unlock=_한 게임에서 드워프 왕을 처치_하여 드워프 공주를 해제합니다。

actors.hero.talent.enchant_meal.title=마법 식사
actors.hero.talent.enchant_meal.desc=_+1：_섭취 시 드워프 공주의 물리 무기에 부여된 마법 부여 또는 저주의 발동 확률이 증가하여, 이후 _3회 공격_이 1.33배의 발동 확률을 가집니다。\n\n_+2：_섭취 시 드워프 공주의 물리 무기에 부여된 마법 부여 또는 저주의 발동 확률이 증가하여, 이후 _5회 공격_이 1.33배의 발동 확률을 가집니다。
actors.hero.talent.enchant_meal.comment=왕세자 반지에 마법 부여가 있다면, 이 재능은 맨손 공격, 자체 마법 부여가 없는 무기 또는 투척 무기에도 적용됩니다。\n\n「내가 말한 적 있나, 많이 먹을수록 오한 에너지가 강해진다고?」
actors.hero.talent$enchantmeal.name=마법 부여 강화
actors.hero.talent$enchantmeal.desc=당신의 다음 몇 회 물리 공격 시 마법 부여 발동 확률이 증가합니다。\n\n잔여 횟수: %1
actors.hero.talent.mana_sense.title=마력 감지
actors.hero.talent.mana_sense.desc=_+1：_드워프 공주가 마법 부여와 각인이 있는 무기와 방어구를 감정하는 속도가 _5배_로 증가합니다。\n\n_+2：_드워프 공주가 _마법 부여와 각인이 있는 무기와 방어구를 장비할 때_ 직접 감정할 수 있습니다。
actors.hero.talent.mana_sense.comment=「수업 시간에 항상 말했듯이, 너는 태어날 때부터 오한 에너지에 가장 예민한 감지 능력을 지니고 있어。」
actors.hero.talent.rune_blade.title=룬 블레이드
actors.hero.talent.rune_blade.desc=_+1：_드워프 공주가 마법 부여가 있는 물리 무기로 공격 시 _1의 마법 피해_를 추가로 입힙니다。\n\n_+2：_드워프 공주가 마법 부여가 있는 물리 무기로 공격 시 _2의 마법 피해_를 추가로 입힙니다。
actors.hero.talent.rune_blade.comment=왕세자 반지에 마법 부여가 있다면, 이 재능은 맨손 공격, 자체 마법 부여가 없는 무기 또는 투척 무기에도 적용됩니다。\n\n「넘치는 오한 에너지가 실질적인 마력으로 변한다。」
actors.hero.talent.arcane_shield.title=오한 보호
actors.hero.talent.arcane_shield.desc=_+1：_공격을 받을 때, 드워프 공주가 장비한 방어구에 각인이 있으면 즉시 _2의 보호막_을 얻습니다。\n\n_+2：_공격을 받을 때, 드워프 공주가 장비한 방어구에 각인이 있으면 즉시 _3의 보호막_을 얻습니다。
actors.hero.talent.arcane_shield.comment=이 재능에는 _20턴 재사용 대기시간_이 있습니다。\n\n왕세자 반지에 각인이 있다면, 이 재능은 무장 방어, 자체 각인이 없는 방어구에도 적용됩니다。\n\n「넘치는 오한 에너지가 당신을 보호할 것이다。」
actors.hero.talent$arcaneshieldcooldown.name=오한 보호-대기
actors.hero.talent$arcaneshieldcooldown.desc=방금 이 재능을 발동했습니다. 잠시 기다려야 다시 발동할 수 있습니다。\n\n잔여 대기 시간: %s턴
actors.hero.talent.royal_meal.title=왕실 향연
actors.hero.talent.royal_meal.desc=_+1：_드워프 공주가 _1턴_만 소모하여 섭취하며, 섭취 후 10턴 동안 왕세자 반지 _1레벨 상승_。\n\n_+2：_드워프 공주가 _1턴_만 소모하여 섭취하며, 섭취 후 10턴 동안 왕세자 반지 _2레벨 상승_。
actors.hero.talent.royal_meal.comment=가방에 왕세자 반지가 없다면, 이 재능은 _+1/+2_ 레벨에서 모든 반지를 _5/10턴_ 동안 1레벨 상승시킵니다。\n\n「고상한 사람의 식사。」
actors.hero.talent$royalmeal.name=왕실 향연
actors.hero.talent$royalmeal.desc=드워프 공주가 섭취 후 왕세자 반지를 강화하여 추가 레벨을 얻습니다。\n\n가방에 왕세자 반지가 없다면, 이 효과는 대신 모든 반지가 추가 레벨을 얻도록 변경됩니다。\n\n잔여 턴 수: %s턴
actors.hero.talent.rune_expert.title=룬 전문가
actors.hero.talent.rune_expert.desc=_+1：_드워프 공주가 임의의 마법석을 마법 부여석으로 변환하는 데 필요한 연금 에너지 소모 _2 감소_。\n\n_+2：_드워프 공주가 임의의 마법석을 마법 부여석으로 변환하는 데 필요한 연금 에너지 소모 _4 감소_。
actors.hero.talent.rune_expert.comment=「궁정 마법 부여사의 가르침이 아직도 생생합니다. 룬의 변환이 이제는 숨 쉬는 것처럼 쉬워졌습니다。」
actors.hero.talent.rune_expert.meta_desc=_이 재능이 다른 영웅에게 획득될 경우_, +1/+2 레벨에서 두루마리를 연금 가마에서 분해할 때 얻는 마법석 개수가 +1/+2 증가합니다。

actors.hero.talent.str_rune.title=강력 룬
actors.hero.talent.str_rune.desc=_+1：_드워프 공주가 마법 부여석 사용 시 무작위 등급에 _일반 등급_ 옵션이 추가됩니다。\n\n_+2：_드워프 공주가 마법 부여석 사용 시 무작위 등급에 _희귀 등급_ 옵션이 추가됩니다。\n\n_+3：_드워프 공주가 마법 부여석 사용 시 무작위 등급에 _일반 등급_과 _희귀 등급_ 옵션이 모두 추가됩니다。
actors.hero.talent.str_rune.comment=
actors.hero.talent.more_ring.title=더 많은 반지
actors.hero.talent.more_ring.desc=_+1：_드워프 공주가 _왕세자 반지_를 장신구 칸에 장비할 수 있습니다。\n\n_+2：_드워프 공주가 _임의의 반지_를 장신구 칸에 장비할 수 있습니다。
actors.hero.talent.more_ring.comment=이 재능이 효과 중 변태되면, 이미 장신구 칸에 장비된 반지는 자동으로 해제됩니다。\n\n「정말 장신구를 좋아하는 녀석이군。」
actors.hero.talent.more_ring.meta_desc=_이 재능이 다른 영웅에게 획득될 경우_, +1 레벨에서 턴 소모 없이 임의의 반지를 장착/해제할 수 있으며, +2 레벨에서 임의의 반지를 장신구 칸에 장비할 수 있습니다。
actors.hero.talent.mana_wreath.title=마력 감싸기
actors.hero.talent.mana_wreath.desc=_+1：_드워프 공주가 마법 부여가 있는 물리 무기로 적을 처치한 후 _5턴마다_ 1씩 감소하는 0~10의 오한 보호막을 얻습니다。\n\n_+2：_드워프 공주가 마법 부여가 있는 물리 무기로 적을 처치한 후 _10턴마다_ 1씩 감소하는 0~10의 오한 보호막을 얻습니다。
actors.hero.talent.mana_wreath.comment=왕세자 반지에 마법 부여가 있다면, 이 재능은 맨손 공격, 자체 마법 부여가 없는 무기 또는 투척 무기에도 적용됩니다。\n\n「넘치는 오한 에너지는 마법 공격을 막는 오한 보호막으로도 변할 수 있다。」
actors.hero.talent.magic_arrow.title=예리한 마법 화살
actors.hero.talent.magic_arrow.desc=_+1：_드워프 공주가 마법 부여가 있는 투척 무기로 공격 시, 피해가 _15%_ 증가합니다。\n\n_+2：_드워프 공주가 마법 부여가 있는 투척 무기로 공격 시, 피해가 _30%_ 증가합니다。
actors.hero.talent.magic_arrow.comment=왕세자 반지에 마법 부여가 있다면, 이 재능은 자체 마법 부여가 없는 투척 무기에도 적용됩니다。\n\n만약 마법 활 등 특수 투척 무기를 가진 영웅이 이 재능을 획득하면, 마법 부여가 있는 특수 투척 무기도 이 재능의 혜택을 받습니다。\n\n「오한 에너지를 화살에 집중하면 더 강력한 위력을 발휘한다。」
actors.hero.talent.ring_bond.title=반지 결속
actors.hero.talent.ring_bond.desc=_+1：_드워프 공주 가방 내 다른 반지의 레벨이 왕세자 반지보다 낮으면, _1레벨 추가_를 얻습니다。\n\n_+2：_드워프 공주 가방 내 다른 반지의 레벨이 왕세자 반지보다 낮으면, _2레벨 추가_를 얻습니다。\n\n_+3：_드워프 공주 가방 내 다른 반지의 레벨이 왕세자 반지보다 낮으면, _3레벨 추가_를 얻습니다。
actors.hero.talent.ring_bond.comment=이 재능이 제공하는 추가 레벨은 왕세자 반지의 레벨을 초과할 수 없습니다。
actors.hero.talent.ring_bond.meta_desc=_이 재능이 다른 영웅에게 획득될 경우_, +1/+2/+3 레벨에서 여러 동일한 반지의 결속 효과가 추가로 1/2/3레벨 증가합니다。

actors.hero.herosubclass.runemage=룬 마법사
actors.hero.herosubclass.runemage_short_desc=_룬 마법사_는 긍정 마법 부여가 있는 물리 공격 후 캐릭터에게 룬 표식을 적용합니다. 룬 표식은 지팡이 시전으로 폭발시킬 수 있으며 마법 부여에 따라 특수 효과를 발생시킵니다。
actors.hero.herosubclass.runemage_desc=룬 마법사는 긍정 마법 부여가 있는 물리 공격 후 캐릭터에게 룬 표식을 적용합니다. 적용된 룬 표식은 해당 마법 부여 정보를 저장하며, 저장된 마법 부여 수가 표식 중첩 수입니다. 이 표식은 지팡이 시전의 영향을 받을 때 폭발합니다。\n\n룬 마법사가 지팡이로 룬 표식을 폭발시키면, 3x3 범위의 모든 적에게 표식 중첩 수 x 5의 추가 피해를 입히고, 표식에 저장된 마법 부여에 따라 특수 효과가 발생합니다。

actors.buffs.runemark.name=룬 표식
actors.buffs.runemark.desc=룬 마법사가 마법 부여의 힘을 빌려 대상에게 표식을 새겼습니다. 시전에 맞으면 폭발을 일으키며, 이 폭발은 적에게만 추가 마법 피해를 입히고 룬 마법사와 그 동료에게는 영향을 미치지 않으며, 환경이나 아이템도 파괴하지 않습니다。\n\n이 표식은 시전에 의해 폭발하거나 대상이 사망할 때까지 유지됩니다。\n\n표식이 저장한 마법 부여:
actors.buffs.runemark$runesurge.name=룬 고동
actors.buffs.runemark$runesurge.desc=룬 마법사가 다음 일정 시간 동안 발동되는 마법 부여 효과가 강화됩니다。\n\n잔여 턴 수: %s턴

actors.hero.talent.darkmark.title=어둠의 표식
actors.hero.talent.darkmark.desc=_+1：_룬 마법사가 룬 표식을 적용할 때 추가로 _3턴 현혹_을 부여합니다。\n\n_+2：_룬 마법사가 룬 표식을 적용할 때 추가로 _3턴 현혹과 취약_을 부여합니다。\n\n_+3：_룬 마법사가 룬 표식을 적용할 때 추가로 _3턴 현혹, 취약 및 허약_을 부여합니다。
actors.hero.talent.darkmark.comment=

actors.hero.talent.rune_blast.title=룬 폭발
actors.hero.talent.rune_blast.desc=_+1：_룬 마법사가 적용한 룬 표식이 폭발할 때 모든 지팡이에 _표식 중첩 수 x 0.25의 충전_을 회복시킵니다。\n\n_+2：_+1의 효과에 더해, 룬 마법사가 적용한 룬 표식이 _2회 폭발 가능_하며, 두 번째 폭발이 다른 지팡이 시전이었다면 _폭발 피해 +10_。\n\n_+3：_+1과 +2의 효과에 더해, 룬 마법사가 적용한 룬 표식의 _폭발 범위가 5x5로 증가_합니다。
actors.hero.talent.rune_blast.comment=

actors.hero.talent.rune_surge.title=룬 고동
actors.hero.talent.rune_surge.desc=_+1：_룬 마법사가 룬 표식을 폭발시킨 후 _10턴_ 동안, 그녀의 마법 부여 효과가 _33%_ 증가합니다。\n\n_+2：_룬 마법사가 룬 표식을 폭발시킨 후 _15턴_ 동안, 그녀의 마법 부여 효과가 _67%_ 증가합니다。\n\n_+3：_룬 마법사가 룬 표식을 폭발시킨 후 _20턴_ 동안, 그녀의 마법 부여 효과가 _100%_ 증가합니다。
actors.hero.talent.rune_surge.comment=주의, 이 재능은 오한의 반지와 동일하게 무기 마법 부여의 원래 효과만 증폭시키며 룬 표식의 폭발 효과는 증폭시키지 않습니다。

actors.hero.herosubclass.combatmaster=격투 달인
actors.hero.herosubclass.combatmaster_short_desc=_격투 달인_의 방어구 각인은 추가 강력 효과를 가지며, 다양한 전투 자세에 능숙합니다。
actors.hero.herosubclass.combatmaster_desc=격투 달인은 방어구 각인의 잠재력을 더 잘 발휘할 수 있어, 긍정 각인에 관한 추가 강력 효과를 부여받습니다. 격투 달인은 또한 다양한 전투 자세에 능숙하여 근접 전투에서 더 유리합니다。\n\n격투 달인은 시작 시 균형 자세를 취하며, 자세 전환 시 턴을 소모하지 않지만, 자세 전환 후 6턴 이내에 다시 자세를 전환하면 10턴 동안 혼미 상태에 빠지며 그동안 자세 전환이 불가능합니다。\n\n균형 자세: 각종 전투 능력과 방어 능력을 소폭 향상\n공격 자세: 각종 전투 능력을 향상시키지만 방어 능력 일부 감소\n방어 자세: 각종 방어 능력을 향상시키지만 전투 능력 일부 감소\n\n이 전문화는 자세 전환이 가능할 때 특수 능력을 가지며, 동시에 여러 특수 능력을 가질 때는 단축 기능을 길게 눌러 특수 능력을 전환할 수 있습니다。

actors.buffs.fightstance.balance_name=균형 자세
actors.buffs.fightstance.balance_desc=격투 달인이 _균형 자세_에 있습니다. 이 자세에서 그녀의 각종 전투 능력과 방어 능력이 일정 수준 향상됩니다。
actors.buffs.fightstance.balance_desc1=근접 피해, 방어구 방어, 명중률 및 회피율 10% 향상。
actors.buffs.fightstance.balance_desc2=근접 피해, 방어구 방어, 명중률 및 회피율 15% 향상。
actors.buffs.fightstance.balance_desc3=근접 피해, 방어구 방어, 공격 속도, 이동 속도, 명중률 및 회피율 15% 향상。
actors.buffs.fightstance.invasion_name=공격 자세
actors.buffs.fightstance.invasion_desc=격투 달인이 _공격 자세_에 있습니다. 이 자세에서 그녀의 각종 전투 능력이 향상되지만 방어 능력이 감소합니다。
actors.buffs.fightstance.invasion_desc1=근접 피해 20% 증가 및 30% 확률로 2연속 공격(두 번째 공격은 무기의 마법 부여를 정상적으로 발동시킬 수 있음), 단 자신의 회피율 30% 감소。
actors.buffs.fightstance.invasion_desc2=근접 피해 30% 증가 및 30% 확률로 2연속 공격(두 번째 공격은 무기의 마법 부여를 정상적으로 발동시킬 수 있음), 단 자신의 회피율 30% 감소。
actors.buffs.fightstance.invasion_desc3=근접 피해 30% 증가 및 50% 확률로 2연속 공격(두 번째 공격은 무기의 마법 부여를 정상적으로 발동시킬 수 있음), 단 자신의 회피율 15% 감소。
actors.buffs.fightstance.parry_name=방어 자세
actors.buffs.fightstance.parry_desc=격투 달인이 _방어 자세_에 있습니다. 이 자세에서 그녀의 각종 방어 능력이 향상되지만 전투 능력이 감소합니다。
actors.buffs.fightstance.parry_desc1=방어구 방어 20% 증가 및 30턴마다 집중 획득(이 효과는 중첩되지 않으며 자세 전환 시 해제됨), 단 자신의 명중률 30% 감소。
actors.buffs.fightstance.parry_desc2=방어구 방어 30% 증가 및 30턴마다 집중 획득(이 효과는 중첩되지 않으며 자세 전환 시 해제됨), 단 자신의 명중률 30% 감소。
actors.buffs.fightstance.parry_desc3=방어구 방어 30% 증가 및 20턴마다 집중 획득(이 효과는 중첩되지 않으며 자세 전환 시 해제됨), 단 자신의 명중률 15% 감소。
actors.buffs.fightstance.duration=격투 달인이 이 자세를 유지한 지 %s턴이 지났습니다。
actors.buffs.fightstance.action=전환할 자세를 선택하십시오。
actors.buffs.fightstance$stabilize.name=자세 안정
actors.buffs.fightstance$stabilize.desc=방금 자세를 한 번 전환했습니다. 몸이 안정된 후에 다시 전환할지 결정하는 것이 좋습니다。\n\n이후 일정 시간 내에 다시 자세를 전환하면 몸의 균형을 맞추는 데 더 많은 시간이 필요하여 자세 전환을 할 수 없게 됩니다。\n\n자세를 안정시키는 데 %s턴이 더 필요합니다。
actors.buffs.fightstance$coordination.name=자세 조율
actors.buffs.fightstance$coordination.desc=방금 짧은 시간 내에 여러 번 자세를 전환했습니다. 몸의 균형을 맞추기 위해 잠시 후에 다시 자세를 전환할 수 있습니다。\n\n몸의 균형을 조율하는 데 %s턴이 더 필요합니다。
actors.buffs.fightstance$focus.name=집중
actors.buffs.fightstance$focus.desc=격투 달인이 주변 상황에 집중하고 있습니다. 다가오는 다음 공격을 예측할 수 있습니다. 집중 상태일 때, 그녀는 다음 공격을 반드시 받아넘깁니다。

actors.hero.talent.fluent.title=자연스러운 전환
actors.hero.talent.fluent.desc=_+1：_격투 달인이 단시간 내에 여러 번 자세를 전환해도 _더 이상 혼미에 빠지지 않지만_, 10턴 동안 여전히 자세를 전환할 수 없습니다。\n\n_+2：_+1의 효과에 더해, 격투 달인이 균형 자세에서 공격 자세로 전환하면 _5턴 극속_을 얻고, 균형 자세에서 방어 자세로 전환하면 _20의 보호막_을 얻습니다。\n\n_+3：_+1과 +2의 효과에 더해, 격투 달인이 공격 자세에서 균형 자세로 전환하면 _4턴 지팡이 충전_을 얻고, 방어 자세에서 균형 자세로 전환하면 _4턴 장신구 충전_을 얻습니다。
actors.hero.talent.fluent.comment=

actors.hero.talent.stance_mastery.title=자세 달인
actors.hero.talent.stance_mastery.desc=_+1：_격투 달인이 균형 자세에 있을 때, 향상된 각종 능력 효과가 _5%_ 추가 증가합니다。\n\n_+2：_+1의 효과에 더해, 격투 달인이 공격 자세에 있을 때의 근접 피해 보너스 및 방어 자세에 있을 때의 방어구 방어 보너스가 모두 _30%_로 증가합니다。\n\n_+3：_+1과 +2의 효과에 더해, 격투 달인이 균형 자세에 있을 때 _공격 속도와 이동 속도도 향상_되며, 공격 자세의 연속 공격 확률이 _50%_로 증가하고, 방어 자세의 집중 간격이 _20턴_으로 감소하며, 두 자세의 해당 부정적 영향이 모두 _15%_로 감소합니다。
actors.hero.talent.stance_mastery.comment=

actors.hero.talent.inelement.title=여유 있음
actors.hero.talent.inelement.desc=_+1：_격투 달인이 임의의 자세로 _20턴_ 이상 유지되면, 그녀의 각인 효과가 _33%_ 증가합니다。\n\n_+2：_격투 달인이 임의의 자세로 _15턴_ 이상 유지되면, 그녀의 각인 효과가 _67%_ 증가합니다。\n\n_+3：_격투 달인이 임의의 자세로 _10턴_ 이상 유지되면, 그녀의 각인 효과가 _100%_ 증가합니다。
actors.hero.talent.inelement.comment=주의, 이 재능은 오한의 반지와 동일하게 방어구 각인의 원래 효과만 증폭시키며 격투 달인의 추가 효과는 증폭시키지 않습니다。

actors.hero.abilities.princess.marchforward.name=성큼성큼
actors.hero.abilities.princess.marchforward.short_desc=드워프 공주가 _성큼성큼_ 계속 전진하며, 걸을 때마다 더욱 빨라집니다。
actors.hero.abilities.princess.marchforward.desc=드워프 공주가 성큼성큼 계속 전진하며, 이동 속도가 50% 증가하고, 추가로 한 걸음 걸을 때마다 5%씩 추가 증가하며, 최대 100%까지 증가합니다。\n\n드워프 공주가 피해를 입으면 즉시 이 효과가 중단됩니다。
actors.hero.abilities.princess.marchforward$forward.name=성큼성큼
actors.hero.abilities.princess.marchforward$forward.desc=드워프 공주가 성큼성큼 계속 전진하며, 이동 속도 %1%% 증가, 추가로 한 걸음 걸을 때마다 5%%씩 추가 증가, 최대 %2%%까지 증가합니다。\n\n이 효과는 %3 피해를 입을 때까지 지속됩니다。
actors.hero.abilities.princess.marchforward.say=방금은 지연 전술이었다!
actors.hero.talent.speedup.title=채찍질
actors.hero.talent.speedup.desc=_+1：_드워프 공주의 이동 속도 보너스 및 보너스 상한이 추가로 _12.5%_ 증가합니다。\n\n_+2：_드워프 공주의 이동 속도 보너스 및 보너스 상한이 추가로 _25%_ 증가합니다。\n\n_+3：_드워프 공주의 이동 속도 보너스 및 보너스 상한이 추가로 _37.5%_ 증가합니다。\n\n_+4：_드워프 공주의 이동 속도 보너스 및 보너스 상한이 추가로 _50%_ 증가합니다。
actors.hero.talent.speedup.comment=

actors.hero.talent.run_attack.title=달리기 공격법
actors.hero.talent.run_attack.desc=_+1：_드워프 공주가 이 상태에서 물리 공격 시 _7.5% 확률_로 턴을 소모하지 않습니다。\n\n_+2：_드워프 공주가 이 상태에서 물리 공격 시 _15% 확률_로 턴을 소모하지 않습니다。\n\n_+3：_드워프 공주가 이 상태에서 물리 공격 시 _22.5% 확률_로 턴을 소모하지 않습니다。\n\n_+4：_드워프 공주가 이 상태에서 물리 공격 시 _30% 확률_로 턴을 소모하지 않습니다。
actors.hero.talent.run_attack.comment=

actors.hero.talent.delay_tactic.title=지연 전술
actors.hero.talent.delay_tactic.desc=_+1：_드워프 공주가 _2회 피해_를 입어야 이 효과가 중단되며, 공격자에게 피해를 입힌 경우 해당 공격자에게 _2턴 지연_을 부여합니다。\n\n_+2：_드워프 공주가 _2회 피해_를 입어야 이 효과가 중단되며, 공격자에게 피해를 입힌 경우 해당 공격자에게 _4턴 지연_을 부여합니다。\n\n_+3：_드워프 공주가 _3회 피해_를 입어야 이 효과가 중단되며, 공격자에게 피해를 입힌 경우 해당 공격자에게 _6턴 지연_을 부여합니다。\n\n_+4：_드워프 공주가 _3회 피해_를 입어야 이 효과가 중단되며, 공격자에게 피해를 입힌 경우 해당 공격자에게 _8턴 지연_을 부여합니다。
actors.hero.talent.delay_tactic.comment=

actors.hero.abilities.princess.taboomagic.name=금기 마법
actors.hero.abilities.princess.taboomagic.short_desc=드워프 공주가 _금기 마법_을 방출하여 적에게 많은 약화 효과를 부여합니다。
actors.hero.abilities.princess.taboomagic.desc=드워프 공주가 드워프 서고에 기록된 금기 마법을 방출하여 적에게 매우 악독한 저주를 걸어 대상이 많은 약화 효과를 얻도록 합니다。\n\n마법의 선택 가능 대상에는 자신과 동맹이 포함되지 않으며, 이 마법에 선택된 적은 10턴 동안 현혹, 취약 및 허약을 얻습니다. 이 마법은 룬 마법사가 적용한 룬 표식을 폭발시킬 수 있습니다。
actors.hero.abilities.princess.taboomagic.no_target=현재 위치에 적절한 시전 대상이 없습니다。
actors.hero.abilities.princess.taboomagic.say=천천히, 조용히, 생명은 이렇게 먼지가 되어 사라진다。
actors.hero.abilities.princess.taboomagic.say1=죽음은 천천히 다가온다—예측할 수도, 피할 수도 없다。
actors.hero.abilities.princess.taboomagic.say2=마음이 이런 타격을 견딜 수 있으리라 기대해서는 안 된다。
actors.hero.abilities.princess.taboomagic.say3=정신이 혼미해지고, 숨이 가빠지며, 이성의 끝을 넘어 끝없는 광기로 추락한다!

actors.hero.abilities.princess.taboomagic.prompt=금기 마법 시전 대상을 선택하십시오

actors.hero.talent.element_curse.title=원소 저주
actors.hero.talent.element_curse.desc=_+1：_금기 마법이 추가로 _4턴 연소 또는 8턴 동상_을 부여합니다。\n\n_+2：_+1의 효과에 더해, 추가로 _5턴 속박_을 부여합니다。\n\n_+3：_금기 마법이 추가로 _8턴 연소 또는 16턴 동상_을 부여합니다。\n\n_+4：_+3의 효과에 더해, 추가로 _10턴 속박_을 부여합니다。
actors.hero.talent.element_curse.comment=
actors.hero.talent.afflicted_illness.title=질병에 시달림
actors.hero.talent.afflicted_illness.desc=_+1：_금기 마법이 추가로 _4턴 중독_과 _기본값 4의 출혈_을 부여합니다。\n\n_+2：_+1의 효과에 더해, 추가로 _5턴 불구_를 부여합니다。\n\n_+3：_금기 마법이 추가로 _8턴 중독_과 _기본값 8의 출혈_을 부여합니다。\n\n_+4：_+3의 효과에 더해, 추가로 _10턴 불구_를 부여합니다。
actors.hero.talent.afflicted_illness.comment=
actors.hero.talent.spread_pain.title=고통 확산
actors.hero.talent.spread_pain.desc=_+1：_드워프 공주가 100% 방어구 충전으로 금기 마법을 방출할 때, 마법의 영향 범위가 선택한 대상을 중심으로 한 _3x3 범위_로 확대됩니다。\n\n_+2：_드워프 공주가 100% 방어구 충전으로 금기 마법을 방출할 때, 마법의 영향 범위가 선택한 대상을 중심으로 한 _5x5 범위_로 확대됩니다。\n\n_+3：_드워프 공주가 100% 방어구 충전으로 금기 마법을 방출할 때, 마법의 영향 범위가 선택한 대상을 중심으로 한 _7x7 범위_로 확대됩니다。\n\n_+4：_드워프 공주가 100% 방어구 충전으로 금기 마법을 방출할 때, 마법의 영향 범위가 선택한 대상을 중심으로 한 _9x9 범위_로 확대됩니다。
actors.hero.talent.spread_pain.comment=영웅이나 동맹이 이 범위 내에 있어도 영향을 받지 않습니다。

actors.hero.abilities.princess.kingblade.name=군주 검
actors.hero.abilities.princess.kingblade.short_desc=드워프 공주가 _군주 검_을 휘둘러 적을 강타하고 반격을 어렵게 만듭니다。
actors.hero.abilities.princess.kingblade.desc=드워프 공주가 인접한 적에게 한 번의 필중 일반 공격을 가할 수 있으며, 이 공격은 50%의 피해 보너스를 가집니다。\n\n이 공격을 받은 적이 죽지 않으면 8턴의 무장 해제를 얻고, 적이 죽으면 드워프 공주 시야 내의 모든 적이 4턴의 무장 해제를 얻습니다. 무장 해제 중인 적은 드워프 공주와 그 동맹에게 물리 피해를 입힐 수 없으며, 보스 적은 이 효과에 저항합니다。
actors.hero.abilities.princess.kingblade.no_target=인접한 대상을 선택해야 합니다。
actors.hero.abilities.princess.kingblade.say1=물러나라!
actors.hero.abilities.princess.kingblade.say2=무장 해제
actors.hero.abilities.princess.kingblade$disarm.name=무장 해제
actors.hero.abilities.princess.kingblade$disarm.desc=이 적은 당신에게 무장 해제되었습니다。\n\n무장 해제된 적은 이 기간 동안 계속 공격하지만, 당신과 동맹에게 물리 피해를 입힐 수 없습니다. 보스 적은 여전히 50%%의 물리 피해를 입힙니다。\n\n무장 해제 효과 지속 시간: %s턴
actors.hero.talent.king_gaze.title=왕의 분노
actors.hero.talent.king_gaze.desc=_+1：_군주 검을 휘두름과 동시에, 드워프 공주가 _2턴 투시_를 얻고 시야 내 적이 즉시 _4턴 무장 해제_를 얻습니다。\n\n_+2：_군주 검을 휘두름과 동시에, 드워프 공주가 _4턴 투시_를 얻고 시야 내 적이 즉시 _4턴 무장 해제_를 얻습니다。\n\n_+3：_군주 검을 휘두름과 동시에, 드워프 공주가 _6턴 투시_를 얻고 시야 내 적이 즉시 _4턴 무장 해제_를 얻습니다。\n\n_+4：_군주 검을 휘두름과 동시에, 드워프 공주가 _8턴 투시_를 얻고 시야 내 적이 즉시 _4턴 무장 해제_를 얻습니다。
actors.hero.talent.king_gaze.comment=
actors.hero.talent.king_power.title=왕의 힘
actors.hero.talent.king_power.desc=_+1：_드워프 공주의 이 공격에 얻는 피해 보너스가 _62.5%_로 증가합니다。\n\n_+2：_드워프 공주의 이 공격에 얻는 피해 보너스가 _75%_로 증가합니다。\n\n_+3：_드워프 공주의 이 공격에 얻는 피해 보너스가 _87.5%_로 증가합니다。\n\n_+4：_드워프 공주의 이 공격에 얻는 피해 보너스가 _100%_로 증가합니다。
actors.hero.talent.king_power.comment=
actors.hero.talent.king_might.title=왕의 위엄
actors.hero.talent.king_might.desc=_+1：_드워프 공주의 이 공격이 적을 죽이면, _5% 방어구 충전_이 반환됩니다。\n\n_+2：_드워프 공주의 이 공격이 적을 죽이면, _10% 방어구 충전_이 반환됩니다。\n\n_+3：_드워프 공주의 이 공격이 적을 죽이면, _15% 방어구 충전_이 반환됩니다。\n\n_+4：_드워프 공주의 이 공격이 적을 죽이면, _20% 방어구 충전_이 반환됩니다。
actors.hero.talent.king_might.comment=


actors.hero.heroclass.friar=수사
actors.hero.heroclass.friar_desc_short=수사는 _연금 분사기_를 사용하여 물약을 장전해 분사할 수 있습니다. 수사는 _이성을 소모하여 연금 에너지로 전환_할 수 있으며, 이성이 고갈되면 _마음이 시험을 받게_ 됩니다。
actors.hero.heroclass.friar_desc=수사는 초기 _독특한 연금 분사기_를 휴대하며, 물약을 장전하여 분사할 수 있습니다。\n\n수사는 _일정 이성을 소모하여 연금 에너지로 전환_할 수 있습니다. 수사는 지하 감옥 깊은 곳을 탐험하면서 이성을 잃을 수도 있으며, 이성이 고갈되면 _마음이 시험을 받게_ 됩니다。\n\n또한, 수사는 초기 _채찍 하나_, 천 갑옷, 물주머니와 천 주머니를 휴대합니다。\n\n수사가 시작 시 감정하는 아이템:\n_-_극속 물약\n_-_변태 두루마리, 감정 두루마리 및 공포 두루마리
actors.hero.heroclass.friar_unlock=_한 게임에서 Yog-Dzewa를 처치_하여 수사를 해제합니다。
actors.buffs.reason.name=이성
actors.buffs.reason.desc_full=당신의 의식은 매우 명료합니다. 적어도 지금은 그렇습니다。\n\n
actors.buffs.reason.desc_half=약간 어지럽지만 행동에 지장은 없습니다。\n\n
actors.buffs.reason.desc_quarter=머리가 터질 듯이 아프고 숨쉬기도 어려워집니다。\n\n
actors.buffs.reason.desc_zero=당신은 광기의 가장자리에 있습니다!\n\n
actors.buffs.reason.desc_simple=지하 감옥을 탐험하는 동안 무서운 적과 마주하거나, 치명적인 함정을 밟거나, 굶주림에 시달리는 것은 당신의 소중한 이성을 갉아먹습니다. 이성이 모두 소진되면 당신의 마음이 시험을 받게 됩니다. 먼저 찾아오는 것은 정신적 고통일까요? 아니면 절망 속에서야 발현되는 고귀한 품성일까요? 아무도 모릅니다。\n\n물론 모든 것이 불편한 것만은 아닙니다. 연금을 하거나 연금 분사기를 장전할 때, 일부 이성을 희생하여 필요한 연금 에너지를 만들어낼 수 있습니다. 연금 에너지 1을 만들기 위해 5의 이성이 소모됩니다。\n\n이성은 일반적으로 시간이 지나도 회복되지 않으며, 주로 적을 처치하거나, 숨겨진 비밀을 발견하거나, 섭취를 통해 회복됩니다。\n\n현재 이성: %s/100
actors.buffs.reason.half=약간 어지럽지만 큰 문제는 없습니다。
actors.buffs.reason.quarter=머리가 터질 듯이 아프고 이성이 흔들립니다。
actors.buffs.reason.zero=당신은 광기의 가장자리에 있습니다!
actors.buffs.reason.kaoyan=당신의 마음이 시험을 받고 있습니다...
actors.buffs.reason.energize_name=에너지 추출
actors.buffs.reason.energize_desc=특정 아이템을 추출하여 일정량의 연금 에너지로 전환할 수 있습니다. 여기에는 물약, 두루마리, 씨앗, 마법석 등 연금 관련 아이템이 포함됩니다。\n\n또한 일부 이성을 소모하여 필요한 연금 에너지로 전환할 수도 있습니다. 일반적으로 연금 에너지 1을 만들기 위해 5의 이성이 소모됩니다。\n\n현재 이성: %s/100
actors.buffs.reason.energize_item=추출할 아이템을 선택하십시오
actors.buffs.reason.energize_1=이성 5를 에너지 1로 전환
actors.buffs.reason.die=당신은 심부전으로 사망했습니다...
actors.buffs.reason.rankings_desc=사망 원인: 심부전
actors.buffs.suffering.name=고통
actors.buffs.suffering.desc=%s 획득!
actors.buffs.suffering$fear.name=고통: 공포
actors.buffs.suffering$fear.desc=비겁과 나약함이 드디어 그 먹잇감을 움켜쥐었습니다。\n\n이 고통 기간 동안, 당신의 회피율 +50%%, 단 입히는 물리 피해 -25%%。\n\n만약 적에게 맞을 경우 30%%의 확률로 추가로 이성 5가 감소합니다。\n\n이 고통은 %s턴 더 지속되며, 적을 처치하면 더 빨리 없앨 수 있습니다。\n\n이성이 0이 되면, 당신은 고통 속에서 쇠약해져 죽습니다。
actors.buffs.suffering$paranoia.name=고통: 편집증
actors.buffs.suffering$paranoia.desc=인간은 때때로 광기 속에서 문득 깨달음을 얻기도 하지만, 너무나 드문 일입니다...\n\n이 고통 기간 동안, 당신의 공격 속도 +20%%, 단 명중률 -20%%。\n\n공격이 빗나갈 경우 30%%의 확률로 추가로 이성 5가 감소합니다。\n\n이 고통은 %s턴 더 지속되며, 적을 처치하면 더 빨리 없앨 수 있습니다。\n\n이성이 0이 되면, 당신은 고통 속에서 쇠약해져 죽습니다。
actors.buffs.suffering$despair.name=고통: 절망
actors.buffs.suffering$despair.desc=이 지옥에는 희망이 없습니다. 조금의 희망조차 없습니다。\n\n이 고통 기간 동안, 당신의 이동 속도 +20%%, 단 어떤 공격도 회피할 수 없습니다。\n\n이 고통은 %s턴 더 지속되며, 적을 처치하면 더 빨리 없앨 수 있습니다。\n\n이성이 0이 되면, 당신은 고통 속에서 쇠약해져 죽습니다。

actors.buffs.virtue.name=미덕
actors.buffs.virtue.desc=%s 획득!
actors.buffs.virtue$firm.name=미덕: 확고부동
actors.buffs.virtue$firm.desc=많은 이들이 공포와 혼란에 빠지겠지만, 이 사람은 아니다, 바로 지금이 아니야!\n\n이 미덕 기간 동안, 최대 체력 25%%이며 자연 감소하지 않는 보호막을 얻고, 넘치는 생명력 회복도 자연 감소하지 않는 보호막으로 전환됩니다。\n\n뿐만 아니라, 적을 처치할 때마다 25%%의 확률로 추가로 이성 6을 회복합니다。\n\n이 미덕은 %s턴 더 지속되며, 적을 처치하면 효과적으로 연장할 수 있습니다。\n\n이성이 0이 되면, 즉시 이성 100을 회복하지만 미덕을 잃게 됩니다。
actors.buffs.virtue$inspire.name=미덕: 고무
actors.buffs.virtue$inspire.desc=끝없는 고난도 희망을 잉태할 수 있으며, 활력을 불러일으킵니다!\n\n이 미덕을 발동하면 당신의 이성이 비교적 좋은 상태로 돌아갑니다.\n\n뿐만 아니라, 이 미덕이 지속되는 동안 적을 처치할 때마다 _25%_ 확률로 추가로 최대 생명력의 _10%_를 회복합니다.\n\n이 미덕은 _%s_턴 동안 지속되며, 적 처치 시 효과적으로 연장할 수 있습니다.\n\n이성이 0이 되면 즉시 100의 이성을 회복하지만, 미덕을 잃게 됩니다.
actors.buffs.virtue$fearless.name=미덕: 용감무쌍
actors.buffs.virtue$fearless.desc=가장 절망적인 어둠 속에서만, 갑작스러운 용기가 가장 눈부신 빛을 발합니다。\n\n이 미덕 기간 동안, 이동 속도 +50%%。\n\n뿐만 아니라, 당신은 어떤 어둠도 두려워하지 않으며, 더 이상 공포 효과의 영향을 받지 않습니다。\n\n이 미덕은 %s턴 더 지속되며, 적을 처치하면 효과적으로 연장할 수 있습니다。\n\n이성이 0이 되면, 즉시 이성 100을 회복하지만 미덕을 잃게 됩니다。

actors.buffs.panic.name=공포
actors.buffs.panic.desc=시들어 가는 듯한 공포가 마음을 삼켰습니다!\n\n언데드와 악마 적의 공격은 직접적으로 당신의 이성을 갉아먹을 뿐만 아니라, 전례 없는 공포에 빠지게 할 수도 있습니다. 공포 상태에서는 턴당 1~2의 이성이 감소합니다。\n\n공포를 없애는 데 %s턴이 더 필요합니다...
actors.buffs.panic.get=전례 없는 공포를 느낍니다!

actors.hero.talent.tranquil_tincture.title=안정 팅크제
actors.hero.talent.tranquil_tincture.desc=_+1：_수사가 이후 몇 층의 지하 감옥을 탐험할 때, 상점에서 _2병의 안정 팅크제_를 구매할 수 있습니다。\n\n_+2：_수사가 이후 몇 층의 지하 감옥을 탐험할 때, 상점에서 _3병의 안정 팅크제_를 구매할 수 있습니다。
actors.hero.talent.tranquil_tincture.comment=안정 팅크제는 빠르게 섭취할 수 있으며, 소량의 포만감을 회복하고 공포 효과를 해제하며 수사에게 이성 50을 회복시킵니다。

actors.buffs.erodingsoul.name=침골 잠혼
actors.buffs.erodingsoul.desc=부패 마법은 생물이 부화되지 않은 경우에도 그 영혼을 일부 침식합니다。\n\n이 효과의 영향을 받는 생물은 사망 시 20% 확률로 부패한 원령으로 변하며, 기존의 약화 효과(이 효과 자체 제외) 하나당 이 확률이 5%씩 증가합니다。\n\n생물이 죽음이 도래하기 전에 이미 부화되거나 정명된 경우, 이 효과는 계속 지속되며, 완전히 사망한 후 직접 부패한 원령으로 변하게 합니다。\n\n이 효과는 생명이 끝날 때까지 영구히 지속됩니다。

actors.hero.talent.eroding_soul.title=침골 잠혼
actors.hero.talent.eroding_soul.desc=_+1：_부패 지팡이 1개_ 획득, 부패 지팡이 시전이 추가로 영구적인 _침골 잠혼_ 효과를 부여합니다(_언데드 속성_ 적에게는 무효)。\n\n_+2：_+1의 효과에 더해(자원 획득 제외), 부패 지팡이 시전이 _50% 확률_로 추가로 하나의 약화 효과를 부여합니다。
actors.hero.talent.eroding_soul.comment=침골 잠혼 효과를 얻은 생물은 사망 시 _20% + 기존 약화 효과 수 x 5% 확률_로 부패한 원령으로 변합니다. 해당 생물이 이미 부화 또는 정명된 경우, 이 효과는 유지되어 완전히 사망한 후 직접 부패한 원령으로 변하게 합니다。\n\n이러한 업그레이드 또는 변태를 통해 직접 자원을 획득하는 재능은 _26회 발동 제한_(신사는 _39회_)을 공유합니다。

actors.hero.talent.credulous.title=신앙 배반
actors.hero.talent.credulous.desc=_+1：_성전이 _신앙 배반_ 법술을 시전할 수 있게 되어, 충전 1을 소모하여 _10턴 마법 면역_을 얻습니다。\n\n_+2：_+1의 효과에 더해, 해당 법술 시전 _시간 소모 없음_。
actors.hero.talent.credulous.comment=「배신자, 벌을 받을지어다。」

actors.hero.talent.penetrating_cast.title=돌파
actors.hero.talent.penetrating_cast.desc=_+1：_직접 피해를 입힐 수 있는 지팡이 또는 완드 시전이 적이 가진 모든 약화 효과를 제거하고, 제거된 약화 효과 하나당 이번 시전 피해가 _10%_ 증가합니다。\n\n_+2：_직접 피해를 입힐 수 있는 지팡이 또는 완드 시전이 적이 가진 모든 약화 효과를 제거하고, 제거된 약화 효과 하나당 이번 시전 피해가 _20%_ 증가합니다。
actors.hero.talent.penetrating_cast.comment=「적의 표면에 머무는 마력을 함께 꿰뚫으면, 남은 충격이 더 깊이 살에 박힌다。」

actors.hero.talent.bountiful_enhancement.title=풍요 강화
actors.hero.talent.bountiful_enhancement.desc=_+1：_풍요의 뿔에서 음식을 섭취하면 _5턴 풍요 저장_ 효과를 얻습니다。\n\n_+2：_+1의 효과에 더해, 풍요의 뿔 충전 1당 회복되는 포만감이 _20_ 증가합니다。\n\n_+3：_풍요의 뿔 충전 1당 회복되는 포만감이 _30_ 증가합니다。
actors.hero.talent.bountiful_enhancement.comment=풍요 저장 효과가 종료되면 _섭취 특성이 한 번 발동_됩니다. 단시간 내에 풍요의 뿔에서 여러 번 음식을 섭취해도 풍요 저장 효과 종료 시 섭취 특성의 발동 횟수가 증가하지 않습니다。\n\n「풍요는 단순히 더 많은 음식을 의미하는 것이 아니라, 매번 식사에서 오는 정신적 풍요로움을 의미한다。」
actors.hero.talent$delayedsatisfaction.name=풍요 저장
actors.hero.talent$delayedsatisfaction.desc=풍요의 뿔에서 음식을 섭취하여 정신적 풍요를 얻었습니다. 그 마력이 %s턴 후에 섭취 특성을 한 번 더 발동시킵니다。

actors.hero.talent.ice_hell.title=얼음 지옥
actors.hero.talent.ice_hell.desc=_+1：_서리 지팡이 시전이 _동상_ 상태의 적을 공격할 때 _더 이상 피해 감소가 없습니다_。\n\n_+2：_+1의 효과에 더해, 서리 지팡이 시전이 _빙결_ 상태의 적을 공격할 때 _지팡이 레벨 x 4_의 마법 피해를 입힙니다。\n\n_+3：_+1과 +2의 효과에 더해, 서리 지팡이 시전이 _50% 확률_로 대상 위치에 _3x3 범위_, 지속 _10턴_의 한기를 생성합니다。
actors.hero.talent.ice_hell.comment=「추위는 더 이상 천천히 온도를 빼앗는 데 그치지 않고, 모든 생명을 얼려버리는 지옥으로 공간 자체를 변화시킨다。」

actors.hero.talent.boss_talent_slot_1.title=빈 재능
actors.hero.talent.boss_talent_slot_1.desc=이 지하 감옥에 내려오기 전부터 어딘가 이상하다고 느꼈는데, 지금에야 원래 가지고 있던 재능이 지워져 빈 공간만 남았다는 것을 알게 되었습니다...\n\n다행히도, 이 지하 감옥 깊은 곳의 강력한 적을 물리치면 더 강력한 힘을 얻게 될 것입니다. 어쨌든 지금은 계속 나아가는 것만이 유일한 선택입니다。\n\n_5층_ 보스가 드롭하는 승화 비급을 읽으면 해당 재능이 대응하는 보스 재능으로 승화하고 1층 재능에 추가 재능 포인트 1개를 제공합니다. 그 전까지 이 재능은 업그레이드할 수도 변태할 수도 없습니다。
actors.hero.talent.boss_talent_slot_1.comment=
actors.hero.talent.boss_talent_slot_2.title=빈 재능
actors.hero.talent.boss_talent_slot_2.desc=이 지하 감옥에 내려오기 전부터 어딘가 이상하다고 느꼈는데, 지금에야 원래 가지고 있던 재능이 지워져 빈 공간만 남았다는 것을 알게 되었습니다...\n\n다행히도, 이 지하 감옥 깊은 곳의 강력한 적을 물리치면 더 강력한 힘을 얻게 될 것입니다. 어쨌든 지금은 계속 나아가는 것만이 유일한 선택입니다。\n\n_10층_ 보스가 드롭하는 승화 비급을 읽으면 해당 재능이 대응하는 보스 재능으로 승화하고 2층 재능에 추가 재능 포인트 1개를 제공합니다. 그 전까지 이 재능은 업그레이드할 수도 변태할 수도 없습니다。
