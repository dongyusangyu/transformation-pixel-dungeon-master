###blobs
actors.blobs.blizzard.name=뇌진폭
actors.blobs.blizzard.desc=여기에 눈보라가 몰아치고 있다.

actors.blobs.confusiongas.name=어지러움 가스
actors.blobs.confusiongas.desc=여기에 어지러움을 유발하는 가스가 서려 있다.

actors.blobs.electricity.name=전기장
actors.blobs.electricity.desc=이 전기장에서 불꽃이 끊임없이 반짝인다.
actors.blobs.electricity.rankings_desc=감전사
actors.blobs.electricity.ondeath=감전사로 죽었다...

actors.blobs.fire.name=불꽃
actors.blobs.fire.desc=불꽃이 여기에서 맹렬하게 타오르고 있다.

actors.blobs.foliage.name=낙엽
actors.blobs.foliage.desc=빛기둥이 지하 정원의 어둠을 뚫고 들어온다.

actors.blobs.freezing.name=서리
actors.blobs.freezing.desc=공기가 뼈를 시리게 할 정도로 차갑고, 매우 이례적이다.

actors.blobs.goowarn.name=어둠의 에너지
actors.blobs.goowarn.desc=어둠의 에너지가 여기서 꿈틀거리고 있다!

actors.blobs.inferno.name=지옥의 불
actors.blobs.inferno.desc=지옥의 불꽃이 여기에서 맹렬하게 타오르고 있다.

actors.blobs.paralyticgas.name=마비 가스
actors.blobs.paralyticgas.desc=여기에 마비를 유발하는 가스가 서려 있다.

actors.blobs.regrowth.name=식물 재생

actors.blobs.sacrificialfire.name=희생의 불
actors.blobs.sacrificialfire.desc=이것은 희생의 불을 안고 있는 제단이다. 여기서 목숨을 잃은 생물은 모두 지하 감옥의 유령에게 바치는 제물이 된다.\n\n아마도 충분히 희생하면 보답을 받을 수 있을까?
actors.blobs.sacrificialfire.worthy=불꽃이 제물을 삼키고 더욱 강하게 타오른다.
actors.blobs.sacrificialfire.unworthy=불꽃이 제물을 삼켰으나, 아무런 변화가 없다.
actors.blobs.sacrificialfire.reward=불꽃이 갑자기 치솟더니 사라지고, 보상을 남긴다!

actors.blobs.smokescreen.name=연막
actors.blobs.smokescreen.desc=여기에 짙은 검은 연기가 피어오르고 있다.

actors.blobs.stenchgas.name=썩은 냄새 가스
actors.blobs.stenchgas.desc=여기에 썩은 악취가 서려 있다.

actors.blobs.stormcloud.name=폭우
actors.blobs.stormcloud.desc=여기에 끓어오르는 수증기가 서려 있다.

actors.blobs.toxicgas.name=독가스
actors.blobs.toxicgas.desc=여기에 녹색으로 빛나는 독가스가 서려 있다.
actors.blobs.toxicgas.rankings_desc=질식사
actors.blobs.toxicgas.ondeath=독가스에 질식하여 죽었다...

actors.blobs.corrosivegas.name=부식성 안개
actors.blobs.corrosivegas.desc=여기에 치명적인 부식성 안개가 서려 있다.

actors.blobs.waterofawareness.name=인지의 샘
actors.blobs.waterofawareness.procced=한 모금 마시자 지식이 머릿속으로 밀려드는 것을 느낀다.
actors.blobs.waterofawareness.desc=이 우물의 물에서 지식의 힘이 흘러나오고 있다. 우물물을 마시면 장착한 모든 장비를 감정하고, 배낭 속 모든 물건의 저주를 탐지하며, 이 층의 모든 아이템 위치를 드러낸다.

actors.blobs.waterofhealth.name=생명의 샘
actors.blobs.waterofhealth.procced=한 모금 마신 후, 즉시 모든 상처가 치유되는 것을 느낀다.
actors.blobs.waterofhealth.desc=이 우물의 물에서 생명의 힘이 흘러나오고 있다. 우물물을 마시면 상처를 치유하고, 허기를 해소하며, 장착한 모든 장비의 저주를 정화한다.

actors.blobs.web.name=거미줄
actors.blobs.web.desc=여기의 모든 것이 두꺼운 거미줄로 덮여 있다. 거미줄에 닿거나 던져진 모든 것은 거미줄을 끊지만, 동시에 제자리에 고정된다.
###buffs

actors.buffs.swiftthistle$timebubble.name=시간 기포
actors.buffs.swiftthistle$timebubble.desc=시간 흐름을 가속하는 기포입니다.\n\n기포 안에서 여러 번 행동할 수 있지만, 공격이나 주문 시전 시 이 효과가 중단됩니다.\n\n남은 시간: %s턴

actors.buffs.timekeepershourglass$timestasis.name=시간 정지
actors.buffs.timekeepershourglass$timestasis.desc=자신의 시간을 완전히 정지시킵니다. 주변의 시간은 계속 흐릅니다. 정지 중에는 행동할 수 없지만 외부 영향으로부터 거의 안전합니다.\n\n남은 시간: %s턴

actors.buffs.timekeepershourglass$timefreeze.name=시간 동결
actors.buffs.timekeepershourglass$timefreeze.desc=외부 시간이 동결되었습니다. 이제 순간적으로 모든 행동을 완료할 수 있습니다. 직접 취소하거나 모래시계 충전이 소진될 때까지 지속됩니다. 공격하거나 마법을 사용해도 해제됩니다.\n\n다음 충전 소모까지: %s턴

actors.buffs.adrenaline.name=아드레날린 분출
actors.buffs.adrenaline.desc=아드레날린으로 인한 순수한 잠재력의 폭발입니다. 이동 속도와 공격 속도를 향상시킵니다.\n\n이동 속도 2배, 공격 속도 1.5배.\n\n지속 시간: %s턴

actors.buffs.adrenalinesurge.name=힘의 격려
actors.buffs.adrenalinesurge.desc=강력한 힘이지만, 영구적이지는 않습니다.\n\n힘 증가: +%d\n효과 감소까지: %s턴

actors.buffs.amok.name=광란
actors.buffs.amok.desc=대상을 극도의 분노와 혼란 상태에 빠뜨립니다.\n\n광란에 빠진 생물은 아군과 적을 가리지 않고 가까이 오는 모든 것을 공격합니다.\n\n남은 시간: %s턴

actors.buffs.arcanearmor.name=비전 갑옷
actors.buffs.arcanearmor.desc=얇은 보호막이 주변을 감싸 일정량의 마법 피해를 막아줍니다.\n\n현재 마법 방어력: 0~%d\n\n비전 갑옷 감소까지: %s턴

actors.buffs.artifactrecharge.name=유물 충전
actors.buffs.artifactrecharge.desc=마력이 몸속을 흘러 손에 쥔 유물의 충전 속도를 높입니다.\n\n각 유물마다 영향은 다르지만 충전 속도가 크게 향상됩니다.\n\n남은 시간: %s턴

actors.buffs.ascensionchallenge.name=부적의 저주
actors.buffs.ascensionchallenge.desc=어째서인지 고신이 여전히 부적을 통해 이 세계에 영향을 미치고 있습니다. 당신이 위로 올라가는 것을 막으려 합니다!\n\n고신은 적을 더 많고 강하게 만들어 지하 감옥 전체를 더 위험하게 만듭니다! 다행히 고신이 강화한 적을 물리쳐 그 힘을 약화시킬 수 있습니다. 방치하면 고신의 힘은 더욱 강해집니다.
actors.buffs.ascensionchallenge.desc_clear=부적에서 발산되는 어둠의 에너지가 최대로 약화되었습니다.
actors.buffs.ascensionchallenge.desc_beckon=부적이_멀리 있는 적을 부르고_ 있습니다. 당신의 위치를 알리고 있습니다.
actors.buffs.ascensionchallenge.desc_haste=부적이_멀리 있는 적을 가속_시켜 더 빨리 다가오게 합니다!
actors.buffs.ascensionchallenge.desc_slow=부적이_당신을 감속_시키고 모든 가속 효과를 차단합니다!
actors.buffs.ascensionchallenge.desc_damage=부적에서 솟구치는 어둠의 에너지가 매우 강력해져_직접 피해를 주고_ 있습니다!
actors.buffs.ascensionchallenge.beckon=부적이 멀리 있는 적을 부르기 시작했습니다.
actors.buffs.ascensionchallenge.haste=부적이 주변 적의 이동 속도를 높이기 시작했습니다!
actors.buffs.ascensionchallenge.slow=배낭 속의 부적이 갑자기 무겁게 느껴집니다!
actors.buffs.ascensionchallenge.damage=부적이 어둠의 에너지를 방출하기 시작했습니다. 뜨겁고 참을 수 없습니다!
actors.buffs.ascensionchallenge.weaken_info_no_kills=적을 물리치면 부적의 저주가 약화됩니다!
actors.buffs.ascensionchallenge.weaken_info=부적의 저주를 약화시키려면 적을 물리쳐야 합니다!
actors.buffs.ascensionchallenge.weaken=부적의 저주가 천천히 사라지는 것을 느낍니다.
actors.buffs.ascensionchallenge.break=잠시 숨을 고르며 상처가 아물기 시작하는 것을 느낍니다!
actors.buffs.ascensionchallenge.almost=고신이 부적을 제어하는 힘이 약해지는 것이 느껴집니다. 승리의 빛이 보입니다!
actors.buffs.ascensionchallenge.on_kill=어둠의 에너지가 당신을 삼켰습니다...

actors.buffs.barkskin.name=나무 껍질
actors.buffs.barkskin.desc=피부가 단단해져 나무 껍질처럼 거칠고 튼튼해집니다.\n\n단단해진 피부가 방어력을 높여 물리 공격을 더 잘 막아냅니다.\n\n현재 증가 방어력: 0~%d\n효과 감소까지: %s턴\n\n여러 출처에서 나무 껍질 효과를 얻을 때, 가장 강력한 효과만 적용됩니다.

actors.buffs.barrier.name=비전 장벽
actors.buffs.barrier.desc=모든 피해를 막을 수 있는 에너지 장벽입니다.\n\n비전 장벽의 에너지가 남아 있는 한 모든 피해를 완전히 차단합니다. 이 에너지는 시간이 지나면서 점차 감소합니다.\n\n남은 보호막 에너지: %d

actors.buffs.berserk.angered=분노
actors.buffs.berserk.berserk=광폭
actors.buffs.berserk.exhausted=고갈
actors.buffs.berserk.recovering=회복
actors.buffs.berserk.angered_desc=광전사가 입은 피해가 공격력을 높입니다. 물리 피해를 입으면 분노를 쌓아 더 강한 공격을 합니다. 방어력으로 막은 피해도 분노를 쌓습니다.\n\n분노는 시간이 지나면서 줄어듭니다. 광전사의 체력이 낮을수록 분노가 더 오래 유지됩니다.\n\n분노가 100%%에 도달하면 광전사는 광폭화하여 문장 최대 보호막의 2배에 해당하는 보호막을 얻습니다. 발동 시 체력이 낮을수록 보호막이 높아져 최대 6배까지 증가합니다. 이 보호막은 시간이 지나면서 감소하며, 보호막이 모두 소진되면 광전사는 휴식이 필요합니다.\n\n현재 분노: _%.0f%%_\n_+%.0f%%_ 피해
actors.buffs.berserk.berserk_desc=공포와 불안이 사라지고 분노만 남았습니다. 이 상태의 광전사는 매우 강력해져_50%의 추가 피해를 입히고 추가 보호막을 얻습니다._\n\n이 추가 보호막은 광전사 문장 최대 보호막의 2배이며, 체력이 낮을수록 최대 6배까지 증가합니다. 보호막이 0이 되면 광폭 상태가 종료됩니다.\n\n광폭 종료 후 광전사는 휴식이 필요하며 그 후에 다시 분노를 쌓을 수 있습니다.
actors.buffs.berserk.recovering_desc=내부 잠재력은 한정적입니다. 광전사는 충분히 휴식해야 다시 분노를 발산할 수 있습니다.\n\n회복 상태의 광전사는 피해로 분노를 쌓을 수 없습니다.
actors.buffs.berserk.recovering_desc_turns=회복에 필요한 턴 수: %d
actors.buffs.berserk.recovering_desc_levels=회복에 필요한 레벨: %.2f
actors.buffs.berserk.rankings_desc=광폭사
actors.buffs.berserk.action_name=광폭
actors.buffs.berserk.no_seal=광폭하려면 파손된 문장이 필요합니다!

actors.buffs.bleeding.name=출혈
actors.buffs.bleeding.ondeath=출혈로 인해 죽었습니다...
actors.buffs.bleeding.heromsg=출혈 중입니다!
actors.buffs.bleeding.rankings_desc=출혈사
actors.buffs.bleeding.desc=상처에서 불안하게 피가 쏟아지고 있습니다.\n\n출혈은 매 턴 피해를 줍니다. 피해량은 매 턴 무작위로 줄어들어 결국 멈춥니다.\n\n현재 출혈 피해: %d

actors.buffs.bless.name=축복
actors.buffs.bless.desc=집중력이 샘솟고 있습니다. 신이 내린 선물이라고 합니다.\n\n축복 상태는 명중률과 회피율을 25%% 높여 전투에서 유리하게 만듭니다.\n\n남은 시간: %s턴

actors.buffs.blindness.name=실명
actors.buffs.blindness.heromsg=실명했습니다!
actors.buffs.blindness.desc=실명으로 주변이 어둠에 잠깁니다.\n\n실명 시 시야가 1타일로 줄어들어 원거리 공격이 어렵고 멀리 있는 적을 추적하기 힘듭니다. 또한 실명한 영웅은 두루마리나 책을 읽을 수 없습니다.\n\n남은 시간: %s턴

actors.buffs.buff.heromsg=
actors.buffs.burning.name=연소
actors.buffs.burning.heromsg=불이 붙었습니다!
actors.buffs.burning.burnsup=%s이(가) 불탔습니다!
actors.buffs.burning.ondeath=불에 타 죽었습니다...
actors.buffs.burning.rankings_desc=소사
actors.buffs.burning.desc=불길에 휩싸이는 것보다 더 고통스러운 것은 없습니다.\n\n불은 액체에 꺼지거나 스스로 사라질 때까지 매 턴 피해를 줍니다. 물속에 들어가면 불이 꺼지며, 물약 병을 깨뜨려도 같은 효과가 있습니다.\n\n또한 불은 접촉하는 모든 가연성 지형과 물체에 불을 붙입니다.\n\n남은 시간: %s턴

actors.buffs.championenemy.warn=%s명의 강적 기운을 느꼈습니다.
actors.buffs.championenemy$blazing.name=맹염 정예
actors.buffs.championenemy$blazing.desc=맹염 정예는 근접 피해 25%를 추가로 입히고, 공격 대상을 불태우며, 화염에 면역이고, 사망 시 주변을 불태웁니다. 단, 불은 물 위로 번지지 않습니다.
actors.buffs.championenemy$projecting.name=추적 정예
actors.buffs.championenemy$projecting.desc=추적 정예는 근접 피해 25%를 추가로 입히고, 근접 공격 사거리가 3타일 더 깁니다.
actors.buffs.championenemy$antimagic.name=반마 정예
actors.buffs.championenemy$antimagic.desc=반마 정예는 피해 감소 50%를 가지며, 모든 마법 효과에 완전히 면역입니다.
actors.buffs.championenemy$giant.name=거대 정예
actors.buffs.championenemy$giant.desc=거대 정예는 피해 감소 80%와 근접 공격 사거리 1타일 추가를 가지지만, 좁은 공간에 들어갈 수 없습니다.
actors.buffs.championenemy$blessed.name=축복 정예
actors.buffs.championenemy$blessed.desc=축복 정예는 명중률과 회피율이 4배입니다.
actors.buffs.championenemy$growing.name=성장 정예
actors.buffs.championenemy$growing.desc=성장 정예는 명중률, 회피율, 물리 피해, 피해 감소가 꾸준히 증가합니다.\n\n현재 명중률/회피율/피해 증가: %1%%\n현재 피해 감소: %2%%
actors.buffs.championenemy$randomminiboss.name=소형 보스
actors.buffs.championenemy$randomminiboss.desc=고신이 지하 감옥의 악한 생물 중 하나를 무작위로 축복하여 더 강력하고 무서운 존재로 만들었습니다.\n\n이 효과가 있는 적의 능력치는 현재 층에 따라 강화되어 더 쓰러뜨리기 어려워집니다. 그 대신 더 풍부한 전리품을 떨어뜨립니다.

actors.buffs.charm.name=매혹
actors.buffs.charm.heromsg=매혹당했습니다!
actors.buffs.charm.cant_attack=대상 적에게 매혹되어 공격할 수 없습니다.
actors.buffs.charm.desc=매혹은 원수 사이를 일시적으로 서로 반하게 만드는 제어 마법입니다.\n\n매혹된 대상은 매혹 시전자를 직접 공격할 수 없지만, 다른 적은 공격할 수 있습니다. 피해를 입으면 매혹이 깨어나 지속 시간이 줄어듭니다.\n\n남은 시간: %s턴

actors.buffs.chill.name=냉기
actors.buffs.chill.freezes=%s이(가) 얼었습니다!
actors.buffs.chill.desc=완전히 얼지는 않았지만 매우 춥습니다.\n\n냉기에 걸린 대상의 모든 행동이 느려집니다. 감속 정도는 남은 냉기 시간에 따라 달라집니다. 가장 심한 경우 지연 효과와 같아집니다.\n\n남은 시간: %1\n현재 감속: %2%%

actors.buffs.combo.name=연속 공격
actors.buffs.combo.action_name=연속 공격
actors.buffs.combo.combo=%d연속!
actors.buffs.combo.bad_target=대상은 공격 사거리 내의 적이어야 합니다.
actors.buffs.combo.prompt=공격 대상을 선택하세요
actors.buffs.combo.desc=검투사가 상대를 성공적으로 타격하면 전투 기세를 쌓습니다. 명중할 때마다 연속 공격이 1씩 증가하지만, 오랫동안 공격하지 않으면 초기화됩니다. 검투사가 연속 공격을 쌓는 동안 파손된 문장의 보호막은 감소하지 않습니다.\n\n연속 공격을 쌓으면 반드시 명중하는 연속 공격 기술을 사용할 수 있습니다! 2, 4, 6, 8, 10연속에 도달하면 각각 다른 기술을 사용할 수 있습니다. 일부 기술은 연속 공격을 초기화하고 일부는 그렇지 않습니다. 각 기술은 연속 공격당 한 번만 사용 가능합니다.\n\n현재 연속 공격: %1\n\n초기화까지 남은 턴: %2
actors.buffs.combo$combomove.clobber.name=충격
actors.buffs.combo$combomove.clobber.desc=적 1명을 2타일 밀쳐내지만 피해는 없으며, 심연에 떨어뜨릴 수 없습니다. 연속 공격 1 증가.
actors.buffs.combo$combomove.clobber.empower_desc=적을 _3타일 밀쳐내고, 기절을 부여하며, 심연에 떨어뜨릴 수 있습니다_ 하지만 피해는 없습니다. 연속 공격 1 증가.
actors.buffs.combo$combomove.slam.name=강타
actors.buffs.combo$combomove.slam.desc=자신의 방어력 %d%%(연속 공격 x20%%)의 추가 피해를 입힙니다. 사용 후 연속 공격이 초기화됩니다.
actors.buffs.combo$combomove.slam.empower_desc=_최대 %1 도약하여 대상에 접근_하여 자신의 방어력 %2%%(연속 공격 x20%%)의 추가 피해를 입힙니다. 사용 후 연속 공격이 초기화됩니다.
actors.buffs.combo$combomove.parry.name=받아 넘기기
actors.buffs.combo$combomove.parry.desc=사용 후, 다음 턴에 받는 첫 공격을 받아 넘기고 즉시 반격합니다. 받아 넘기지 못하면 연속 공격이 초기화됩니다.
actors.buffs.combo$combomove.parry.empower_desc=사용 후, 다음 턴에 받는 _모든 공격_을 받아 넘기고 즉시 반격합니다. 받아 넘기지 못하면 연속 공격이 초기화됩니다.
actors.buffs.combo$combomove.crush.name=분쇄
actors.buffs.combo$combomove.crush.desc=주 대상에게 %d%%(연속 공격 x25%%)의 피해를 주고, 7x7 범위 내 다른 적에게는 절반의 피해를 줍니다. 사용 후 연속 공격 초기화.
actors.buffs.combo$combomove.crush.empower_desc=_최대 %1 도약하여 대상에 접근_하여 주 대상에게 %2%%(연속 공격 x25%%)의 피해를 주고, 7x7 범위 내 다른 적에게는 절반의 피해를 줍니다. 사용 후 연속 공격 초기화.
actors.buffs.combo$combomove.fury.name=폭우
actors.buffs.combo$combomove.fury.desc=연속 공격 1당 적 1명을 공격하며, 각 공격은 60% 피해를 주고 무기 마법부여를 발동시킬 수 있습니다. 사용 후 연속 공격 초기화.
actors.buffs.combo$combomove.fury.empower_desc=_최대 %d타일 도약하여 대상에 접근_하여 현재 연속 공격 수만큼 적을 공격하며, 각 공격은 60%%의 피해를 주고 마법부여를 발동시킬 수 있습니다. 사용 후 연속 공격 초기화.

actors.buffs.corruption.name=타락
actors.buffs.corruption.desc=이 저주받은 생물은 타락의 영향으로 정신이 흐려졌습니다. 피가 마르기 시작하고 피부가 시들며, 불안정한 에너지로 인해 매 순간이 고통스럽습니다.\n\n타락한 생물은 모든 적에게 적대적이지만, 시간이 지나면 죽습니다.\n\n남은 시간: %s턴

actors.buffs.corruptingcorruption.name=타락하는 타락
actors.buffs.corruptingcorruption.desc=타락의 힘이 점점 무시무시해집니다.\n\n\n매 턴 확률이 점점 높아져 타락한 적이 더 타락할 수 있습니다. 타락하는 타락 추가: +%d

actors.buffs.cripple.name=절름발이
actors.buffs.cripple.heromsg=절름발이가 되었습니다!
actors.buffs.cripple.desc=절름발이가 되면 이동이 크게 제한되어 도망치거나 추적하기 어렵습니다.\n\n이동 속도가 절반으로 감소합니다.\n\n남은 시간: %s턴

actors.buffs.danger.name=위험 감지
actors.buffs.danger.desc=위험을 감지하여 전투에 더 잘 대비하게 됩니다.\n\n회피율과 명중률이 약간 증가합니다.\n\n남은 시간: %s턴

actors.buffs.darkness.name=어둠
actors.buffs.darkness.desc=당신은 압도적인 어둠에 휩싸였습니다. 아무것도 볼 수 없습니다.\n\n시야가 0타일로 줄어들어 아무것도 볼 수 없습니다.\n\n남은 시간: %s턴

actors.buffs.disguise.name=변장
actors.buffs.disguise.desc=현재 당신은 광부 복장을 하고 있습니다. 적들은 당신이 그들 중 하나라고 생각합니다.\n\n지하 감옥의 몬스터에게 인식되지 않고 자유롭게 이동할 수 있습니다. 그러나 적과의 거리가 3타일 이내로 가까워지면 변장이 깨어집니다. 또한 발각되지 않았더라도 적에게는 드문 일이 아니며, 어떤 대상은 항상 의심스러워합니다.

actors.buffs.earthimprisonment.name=지구 감금
actors.buffs.earthimprisonment.desc=단단한 바위가 대상의 다리를 완전히 감싸 아무것도 할 수 없게 만듭니다. 하지만 어떤 행동도 불가능한 대신 밖으로부터의 피해도 입지 않습니다.

actors.buffs.electrocution.name=전기 충격
actors.buffs.electrocution.ondeath=감전사로 죽었습니다...
actors.buffs.electrocution.rankings_desc=감전사
actors.buffs.electrocution.desc=전기가 몸을 타고 흐릅니다.\n\n감전된 대상은 매 턴 피해를 입습니다. 물에 잠긴 대상은 더 많은 피해를 입습니다.\n\n현재 전기 피해: %d

actors.buffs.fireimbue.name=불의 주입
actors.buffs.fireimbue.desc=주변 온도가 올라가고 피부가 따가워집니다.\n\n불의 주입 효과를 받는 동안 근접 공격이 대상을 불태웁니다.\n\n남은 시간: %s턴

actors.buffs.frost.name=동결
actors.buffs.frost.desc=완전히 얼었습니다! \n\n동결된 대상은 행동 불능이 되지만, 피해에 완전히 면역되며 피해를 받으면 동결이 깨어집니다.

actors.buffs.fury.name=광폭
actors.buffs.fury.desc=분노가 잠재력을 끌어올립니다!\n\n광폭 상태에서는 2번 공격을 하고, _치명타에 필요한 힘 요구치가 -3_이 됩니다. 이 상태가 유지될수록 체력이 서서히 줄어듭니다. 각 공격마다 피해를 더 받습니다.

actors.buffs.gasesimmunity.name=가스 면역
actors.buffs.gasesimmunity.desc=모든 유해 가스로부터 완전히 보호됩니다.\n\n남은 시간: %s턴

actors.buffs.guard.name=방어 태세
actors.buffs.guard.desc=현재 방어 태세입니다. 공격 시 방어 효과가 해제됩니다.\n\n방어 태세 시 피해 감소가 증가합니다. 방어 태세가 빛나며 방어율이 더 높아집니다.\n\n방어 태세 지속 시간: %d턴

actors.buffs.guardiantouch.name=축복의 손길
actors.buffs.guardiantouch.desc=신의 은총이 심신을 보호합니다.\n\n받는 피해가 40% 감소합니다.\n\n축복의 손길 지속 시간: %s턴

actors.buffs.healing.name=재생
actors.buffs.healing.desc=%s이(가) 치유됨
actors.buffs.healing.heromsg=재생의 힘이 당신을 다시 일으킵니다!
actors.buffs.healing.desc_enemy=상처가 눈에 띄게 아물고 있습니다!\n\n재생 중에는 매 턴 일정량의 생명력을 회복합니다.\n\n지속 시간: %s턴

actors.buffs.hunger.hungry=배고픔
actors.buffs.hunger.starving=굶주림
actors.buffs.hunger.heromsg=너무 배가 고픕니다!
actors.buffs.hunger.onstarving=굶주려 죽어가고 있습니다...
actors.buffs.hunger.rankings_desc=굶어 죽음
actors.buffs.hunger.ondeath=굶어 죽었습니다...
actors.buffs.hunger.spoiled=%s이(가) 상했습니다!
actors.buffs.hunger.desc_hungry=음식이 필요합니다. 배고프면 생명력과 체력이 천천히 회복되지 않습니다.\n\n허기 수준: 배고픔
actors.buffs.hunger.desc_starving=먹을 것을 찾으십시오. 굶주리면 지속적으로 체력이 줄고 회복 효과를 받을 수 없습니다.\n\n또한 굶주리면 힘이 빠져 전투 능력이 심각하게 저하됩니다.\n\n허기 수준: 굶주림\n\n적용 약화:\n_%s_

actors.buffs.healing.desc=치유 마력이 상처를 아물게 합니다.\n\n생명력이 매 턴 안정적으로 회복되며, 시간이 지나면서 회복량이 줄어듭니다.\n\n다음 턴 회복량: %d\n\n남은 총 회복량: %d

actors.buffs.herodisguise.name=변장
actors.buffs.herodisguise.desc=환영 마법이 외모를 바꾸었습니다! 완전히 장식적인 효과지만 어쨌든 기분이 묘합니다.\n\n변장 효과 잔여 시간: %s턴

actors.buffs.hex.name=혼란
actors.buffs.hex.heromsg=정신이 마법에 교란되었습니다!
actors.buffs.hex.desc=집중력을 교란하는 어둠의 마법으로, 대상이 방향을 정확히 판단하지 못하게 합니다.\n\n혼란 상태는 명중률과 회피율을 20%% 감소시켜 전투를 불리하게 만듭니다.\n\n잔여 시간: %s턴

actors.buffs.holdfast.name=불굴
actors.buffs.holdfast.desc=전사가 이 자리를 사수하여 방어력 %1~%2 얻고, 연속 공격 및 보호막 감소 속도를 %3%% 늦춥니다. 이동 시 해제됩니다.

actors.buffs.invisibility.name=투명화
actors.buffs.invisibility.desc=주변 지형과 완전히 융합되어 보이지 않게 됩니다.\n\n투명화 중에는 적이 추적하거나 공격할 수 없습니다. 대부분의 물리 공격이나 마법(예: 두루마리, 지팡이)은 투명화를 즉시 해제합니다.\n\n잔여 시간: %s턴

actors.buffs.invulnerability.name=무적
actors.buffs.invulnerability.desc=이 유닛이 무적의 힘으로 가득 차 일시적으로 완전한 무적 상태가 되었습니다!\n\n잔여 시간: %s턴

actors.buffs.levitation.name=공중 부양
actors.buffs.levitation.desc=마력이 몸을 지면에서 떠오르게 합니다.\n\n부양 중에는 조용히 이동하며 지면 기반 효과를 모두 무시합니다. 함정이 발동되지 않고, 불이 물에 꺼지지 않으며, 식물이 짓밟히지 않고, 뿌리에 결박되지 않으며, 심연을 건널 수 있습니다. 효과 종료 시 주의하세요!\n\n잔여 시간: %s턴

actors.buffs.lifelink.name=생명 결속
actors.buffs.lifelink.ondeath=생명 결속의 공유 피해로 죽었습니다...
actors.buffs.lifelink.desc=이 유닛의 생명력이 근처의 다른 유닛과 연결되었습니다. 받는 모든 피해를 함께 나눕니다.\n\n피해를 받을 때마다 절반이 결속된 유닛에게 전달됩니다.\n\n잔여 시간: %s턴

actors.buffs.light.name=발광
actors.buffs.light.desc=가장 어두운 지하 감옥에서도 안정적인 광원이 곁에 있다는 것은 항상 위안이 됩니다.\n\n빛이 어둠을 물리쳐 주변 환경을 볼 수 있게 해줍니다.\n\n잔여 시간: %s턴

actors.buffs.lockedfloor.name=결사 항전
actors.buffs.lockedfloor.desc=현재 층이 완전히 봉쇄되어 떠날 수 없습니다!\n\n봉쇄 중에는 배고픔이 증가하지 않으며, 극심한 배고픔으로 체력이 줄지 않습니다. 또한 보스전이 아니라면 모든 passive 회복이 중단됩니다.\n\n게다가 층이 봉쇄된 상태에서 축복받지 않은 환생 십자가로 부활하면 봉쇄가 초기화됩니다.\n\n이 층의 보스를 처치하여 봉쇄를 해제하세요!

actors.buffs.lostinventory.name=분실된 행낭
actors.buffs.lostinventory.desc=행낭을 지하 감옥 어딘가에 잃어버렸습니다! 되찾기 전에는 대부분의 아이템을 줍거나 사용할 수 없습니다.

actors.buffs.magicalsight.name=마법 투시
actors.buffs.magicalsight.desc=눈을 감아도 마음으로 주변을 꿰뚫어 볼 수 있습니다.\n\n마법 투시 상태에서는 벽과 지형을 뚫고 볼 수 있으며, 시야 반경이 12타일로 확장됩니다.\n\n잔여 시간: %s턴

actors.buffs.magicalsleep.name=마법 수면
actors.buffs.magicalsleep.toohealthy=충분히 건강하여 강한 졸음을 이겨냈습니다!
actors.buffs.magicalsleep.fallasleep=마법 수면에 깊이 빠져들었습니다...
actors.buffs.magicalsleep.wakeup=깨어나니 온몸이 상쾌하고 건강해진 기분입니다!
actors.buffs.magicalsleep.desc=대상이 마법 수면에 깊이 빠져 자연적으로 깨어나지 않습니다.\n\n마법 수면은 일반 수면과 같지만, 피해를 입어야만 깨어납니다.\n\n영웅과 동맹에게는 상처를 빨리 회복하는 재생 효과가 있습니다.

actors.buffs.magicimmune.name=마법 면역
actors.buffs.magicimmune.desc=모든 마법이 통하지 않습니다. 마법에 완전히 면역입니다.\n\n마법 면역 상태에서는 모든 마법 효과(저주, 마법부여, 각인, 지팡이, 두루마리, 반지, 유물 등)가 영향을 미치지 못합니다. 단, 영웅 갑옷 기술은 이 영향을 받지 않습니다.\n\n잔여 시간: %s턴

actors.buffs.mindvision.name=정신 시야
actors.buffs.mindvision.desc=이 층의 모든 생물이 머릿속에 보입니다. 매우 기이한 느낌입니다.\n\n정신 시야가 유지되는 동안 이 층의 모든 생물이 시야에 드러납니다. 이를 통해 본 생물도 시야 내 대상으로 간주되어 많은 마법 효과의 영향을 받을 수 있습니다.\n\n잔여 시간: %s턴

actors.buffs.momentum.momentum=모멘텀 축적
actors.buffs.momentum.running=질주
actors.buffs.momentum.resting=회복
actors.buffs.momentum.action_name=질주
actors.buffs.momentum.momentum_desc=이동 중에 질주자가 모멘텀을 축적합니다. 모멘텀을 소모하여 질주 상태에 돌입할 수 있습니다.\n\n모멘텀 1당 2턴의 질주를 유지할 수 있으며, 최대 20까지 저장 가능합니다. 이동을 멈추면 모멘텀이 빠르게 소멸합니다.\n\n현재 모멘텀: %d
actors.buffs.momentum.running_desc=이동 중에 질주자가 모멘텀을 축적합니다. 모멘텀을 소모하여 질주 상태에 돌입할 수 있습니다.\n\n질주 상태에서는 2배 속도로 이동하며, 레벨에 비례한 추가 회피를 얻습니다.\n\n잔여 시간: %d턴
actors.buffs.momentum.resting_desc=이동 중에 질주자가 모멘텀을 축적합니다. 모멘텀을 소모하여 질주 상태에 돌입할 수 있습니다.\n\n지금은 체력을 회복해야 다시 모멘텀을 축적할 수 있습니다.\n\n회복 필요 시간: %d턴

actors.buffs.monkenergy.name=내공
actors.buffs.monkenergy.action=무공
actors.buffs.monkenergy.desc=무사가 적을 처치할 때마다 무공을 사용할 수 있는 내공을 얻습니다. 대부분의 적은 1의 내공만 제공하며, 시간이 지나도 내공은 사라지지 않습니다.\n\n현재 내공: %1/%2
actors.buffs.monkenergy.desc_cooldown=무사가 방금 무공을 사용했습니다. 다시 사용하려면 기다려야 합니다.\n\n남은 재사용 대기시간: %d턴
actors.buffs.monkenergy$monkability$flurry.name=난무
actors.buffs.monkenergy$monkability$flurry.desc=턴을 소모하지 않는 2회 공격, 각각 %1~%2 방어 무시 피해를 줍니다. 이 무공은 연속으로 사용할 수 없습니다.
actors.buffs.monkenergy$monkability$flurry.empower_desc=턴을 소모하지 않는 2회 공격, 각각 %1~%2 피해를 주고 _무기 마법부여를 발동_시키며 방어를 무시합니다. 무사가 직전에 적을 명중시켰다면 이 무공은 연속으로 사용할 수 없습니다.
actors.buffs.monkenergy$monkability$focus.name=집중
actors.buffs.monkenergy$monkability$focus.desc=무사가 1턴을 소모하여 집중 상태에 돌입, 다음에 받는 공격을 받아 넘깁니다.
actors.buffs.monkenergy$monkability$focus.empower_desc=무사가 _즉시 집중 상태에 돌입_, 다음에 받는 공격을 받아 넘깁니다.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=집중
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=무사가 주변에 집중하여 다음 공격을 예측합니다. 집중 상태에서 오는 다음 공격을 반드시 받아 넘깁니다.
actors.buffs.monkenergy$monkability$dash.name=순보
actors.buffs.monkenergy$monkability$dash.prompt=위치 선택
actors.buffs.monkenergy$monkability$dash.desc=최대 6타일 떨어진 위치로 즉시 돌진합니다. 위험 지형을 넘을 수 있지만, 적이나 단단한 벽은 통과할 수 없습니다.
actors.buffs.monkenergy$monkability$dash.empower_desc=최대 _8타일_ 떨어진 위치로 즉시 돌진합니다. 위험 지형을 넘을 수 있지만, 적이나 단단한 벽은 통과할 수 없습니다.
actors.buffs.monkenergy$monkability$dragonkick.name=용퇴
actors.buffs.monkenergy$monkability$dragonkick.desc=치명적인 발차기, %1~%2 방어 무시 피해를 주고 적을 밀쳐내며, 밀려난 거리만큼의 턴 동안 마비시킵니다.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=치명적인 발차기, _%1~%2 피해_를 주고 방어를 무시하며, _주변의 모든 적_을 밀쳐내고 밀려난 거리만큼 마비시킵니다.
actors.buffs.monkenergy$monkability$meditate.name=명상
actors.buffs.monkenergy$monkability$meditate.desc=무사가 1턴을 소모하여 내공을 운용, 대부분의 부정적 효과를 몰아내고 8턴 동안 지팡이와 유물 충전을 얻습니다.
actors.buffs.monkenergy$monkability$meditate.empower_desc=무사가 1턴을 소모하여 내공을 운용, 대부분의 부정적 효과를 몰아내고 8턴 동안 지팡이와 유물 충전을 얻습니다. _명상 중에는 10% 피해 저항을 얻고 잃은 생명력의 20%를 서서히 회복합니다._

actors.buffs.ooze.name=부식성 진흙
actors.buffs.ooze.heromsg=진흙이 몸을 녹이고 있습니다! 씻어내세요!
actors.buffs.ooze.ondeath=완전히 녹아 사라졌습니다...
actors.buffs.ooze.rankings_desc=용해
actors.buffs.ooze.desc=끈적한 산성 진흙이 살과 뼈에 달라붙어 천천히 녹이고 있습니다.\n\n부식성 진흙은 지속적으로 피해를 주며, 물에 들어가면 즉시 씻겨집니다.\n\n잔여 시간: %s턴

actors.buffs.paralysis.name=마비
actors.buffs.paralysis.heromsg=마비되었습니다!
actors.buffs.paralysis.out=마비 해제
actors.buffs.paralysis.desc=보통 최악의 일은 아무것도 할 수 없는 것입니다.\n\n마비는 모든 행동을 봉쇄하고, 효과가 사라질 때까지 기다려야 합니다. 피해를 입으면 마비에서 벗어나는 데 도움이 됩니다.\n\n잔여 시간: %s턴

actors.buffs.pin.cushion=바늘꽂이
actors.buffs.pin.name=고정
actors.buffs.pin.desc=대상이 제자리에 고정되어 이동할 수 없습니다.\n\n고정 상태에서는 이동이 불가능하지만 다른 행동은 할 수 있습니다. 충분히 힘을 쓰면 고정에서 벗어날 수 있습니다.\n\n잔여 시간: %s턴

actors.buffs.poison.name=중독
actors.buffs.poison.heromsg=중독되었습니다!
actors.buffs.poison.ondeath=독에 의해 죽었습니다...
actors.buffs.poison.rankings_desc=독사
actors.buffs.poison.desc=독소가 몸속에서 퍼져나갑니다.\n\n중독된 대상은 매 턴 피해를 입습니다. 중독 피해는 시간이 지나면서 줄어듭니다.\n\n현재 중독 피해: %d

actors.buffs.prepared.name=준비 자세
actors.buffs.prepared.alert=발각됨!
assets/actors/buffs/prepared/0.png
actors.buffs.prepared.desc=숨을 죽이고 은밀히 움직이며 치명적인 일격을 준비합니다.\n\n준비 자세에서는 이동 속도가 반으로 줄지만, 다음 근접 공격이 은신 피해를 입히고 특수 효과를 발동시킵니다. 일반적으로 준비 공격은 4배의 피해를 입히며, 이 피해는 명중 보정을 받습니다.\n\n피해를 입거나 적이 가까이 오면 준비 자세가 깨어집니다.

actors.buffs.prismaticguard.name=수호광벽
actors.buffs.prismaticguard.desc=빛의 수호자가 주변을 맴돌며 공격을 막아냅니다.\n\n빛의 수호자는 10%의 피해를 흡수합니다. 하지만 이 수호자는 취약하여 피해를 입으면 사라집니다.\n\n수호가 피해를 입었습니다...

actors.buffs.recharge.name=재충전
actors.buffs.recharge.desc=마력이 당신의 지팡이와 반지를 관통해 흐릅니다.\n\n재충전 상태에서는 지팡이가 충전을 회복할 때마다 추가로 1의 충전을 얻습니다.\n\n재충전 잔여 시간: %s턴

actors.buffs.revealedarea.name=지역 드러내기
actors.buffs.revealedarea.desc=이 지역은 완전히 드러났습니다.\n\n당신은 이 지역에서 모든 비밀과 함정을 볼 수 있습니다.

actors.buffs.revealmap.name=지도 드러내기
actors.buffs.revealmap.desc=영혼의 눈으로 이 층을 꿰뚫어 봅니다.\n\n지도 드러내기 상태에서는 전체 층의 지도가 표시되어 길을 찾는 것이 매우 쉬워집니다.\n\n잔여 시간: %s턴

actors.buffs.root.name=결속
actors.buffs.root.heromsg=발이 땅에 결박되었습니다!
actors.buffs.root.desc=땅에 묶여 움직일 수 없습니다.\n\n뿌리에 결박되면 몸은 움직일 수 없지만 다른 행동은 계속할 수 있습니다.\n\n잔여 시간: %s턴

actors.buffs.shadows.name=그림자 망토
actors.buffs.shadows.desc=당신은 그림자 그 자체가 되었습니다.\n\n그림자 망토가 활성화되어 있는 동안에는 적에게 전혀 보이지 않습니다. 그림자 망토 상태에서는 공격할 수 없으며, 공격하면 효과가 해제됩니다. 망토는 점차 힘을 잃습니다.\n\n잔여 시간: %s턴

actors.buffs.sharpthorns.name=날카로운 가시
actors.buffs.sharpthorns.desc=가시가 당신의 피부를 뚫고 자라나 곧 부러질 것입니다.\n\n날카로운 가시가 공격자를 찔러 피해를 줍니다.\n\n잔여 시간: %s턴

actors.buffs.shieldbarrier.name=방패 방벽
actors.buffs.shieldbarrier.action_name=방벽 강화
actors.buffs.shieldbarrier.desc=방패로 몸을 보호하고 있습니다.\n\n방패 방벽은 1~%d의 피해를 흡수하며, 방벽이 약화되면 발동 효과가 사라집니다.

actors.buffs.silence.name=침묵
actors.buffs.silence.heromsg=침묵에 걸렸습니다!
actors.buffs.silence.desc=어떤 마법 효과가 이 지역의 모든 소리를 흡수하여 당신이 입을 열 수 없게 만들었습니다.\n\n침묵 상태에서는 말을 할 수 없어 지팡이와 두루마리 같은 마법 아이템을 사용할 수 없습니다.\n\n잔여 시간: %s턴

actors.buffs.slow.name=감속
actors.buffs.slow.heromsg=느려졌습니다!
actors.buffs.slow.desc=당신의 움직임이 마치 물속에서처럼 느려졌습니다.\n\n감속 상태에서는 모든 행동이 두 배의 시간이 걸립니다.\n\n잔여 시간: %s턴

actors.buffs.snare.name=덫
actors.buffs.snare.desc=대상이 덫에 걸렸습니다! 움직일 수 없습니다.\n\n잔여 시간: %s턴

actors.buffs.soulmark.name=영혼 표식
actors.buffs.soulmark.desc=대상이 영혼 표식에 찍혔습니다.\n\n영혼 표식이 있는 대상은 표식을 건 사람이 가하는 마법 피해의 일부를 받습니다.\n\n잔여 시간: %s턴

actors.buffs.speed.name=신속
actors.buffs.speed.heromsg=에너지가 다리로 몰려듭니다!
actors.buffs.speed.desc=강력한 에너지가 다리 근육으로 흘러들어 믿을 수 없는 속도로 움직일 수 있게 합니다!\n\n신속 상태에서는 2배의 이동 속도를 가지지만, 다른 행동 속도는 그대로입니다.\n\n잔여 시간: %s턴

actors.buffs.stamina.name=체력 강화
actors.buffs.stamina.heromsg=체력이 증가했습니다!
actors.buffs.stamina.desc=체력이 일시적으로 증가했습니다.\n\n최대 생명력이 %d 증가합니다. 이 추가 생명력은 체력 강화 효과가 사라지면 함께 사라집니다.\n\n잔여 시간: %s턴

actors.buffs.sunderarmor.name=방어구 파괴
actors.buffs.sunderarmor.desc=대상의 방어구가 손상되어 약화되었습니다.\n\n방어구 파괴는 대상이 받는 물리 피해를 20% 증가시킵니다.\n\n잔여 시간: %s턴

actors.buffs.terror.name=공포
actors.buffs.terror.heromsg=당신은 겁에 질려 도망쳤습니다!
actors.buffs.terror.desc=두려움이 대상을 사로잡아 도망치게 만듭니다.\n\n공포에 질린 대상은 도망치려 하며, 시야에서 사라지면 더 멀리 도망칩니다.\n\n잔여 시간: %s턴

actors.buffs.thorns.name=가시
actors.buffs.thorns.desc=가시가 대상을 감싸 공격자에게 피해를 되돌려줍니다.\n\n잔여 시간: %s턴

actors.buffs.timefreeze.name=시간 정지(장판)

actors.buffs.timefreeze.desc=지역 내의 시간이 완전히 정지되었습니다.\n\n영역 내의 적들은 시간 정지 효과를 받아 움직이지 못하며, 피해에 면역이 됩니다. 영역이 사라질 때까지 적들은 완전히 무력화됩니다.\n\n잔여 시간: %s턴

actors.buffs.toxicimbue.name=독의 주입
actors.buffs.toxicimbue.desc=당신은 독으로 가득 차 있습니다!\n\n근접 공격이 대상을 중독시킵니다. 독 저항력이 높아져 독에 의한 피해가 50% 감소합니다.\n\n잔여 시간: %s턴

actors.buffs.prepared.name=암살자의 검 준비
actors.buffs.prepared.desc=암살자의 검이 준비 상태에서 추가 피해를 줍니다. 추가 피해는 현재 체력을 기반으로 하며 체력이 낮을수록 더 많은 피해를 줍니다.
actors.buffs.prepared.damage=추가 암살 피해: 최대 %d%%

actors.buffs.visionscroll.name=시야 표식
actors.buffs.visionscroll.desc=이 적은 정신 시야의 영향을 받아 위치가 드러납니다.\n\n잔여 시간: %s턴

actors.buffs.weakness.name=약화
actors.buffs.weakness.heromsg=힘이 빠져나가는 것이 느껴집니다!
actors.buffs.weakness.desc=근육이 힘을 잃고 움직임이 둔해집니다.\n\n약화 상태에서는 힘 요구치가 2 증가하여 무거운 장비를 효과적으로 사용하기 어렵습니다.\n\n잔여 시간: %s턴

actors.buffs.wet.name=젖음
actors.buffs.wet.desc=완전히 흠뻑 젖었습니다.\n\n젖은 상태에서는 자연적으로 마를 때까지 화염 피해를 50% 덜 받습니다. 마르는 데 시간이 걸립니다.\n\n잔여 시간: %s턴

actors.buffs.windfury.name=질풍
actors.buffs.windfury.desc=당신은 질풍의 힘으로 가득 차 있습니다!\n\n질풍 상태에서는 하나의 대상에게 2회 연속 공격을 가합니다.\n\n잔여 시간: %s턴

actors.buffs.wrath.name=분노의 천벌
actors.buffs.wrath.desc=분노가 당신의 힘을 증폭시킵니다!\n\n분노의 천벌 상태에서는 공격력이 50% 증가합니다. 이 효과는 영구적이지 않습니다.\n\n잔여 시간: %s턴

actors.buffs.dualswield.name=쌍수
actors.buffs.dualswield.desc=당신은 두 자루의 무기를 휘두르고 있습니다.\n\n쌍수 상태에서는 한 번의 행동으로 두 번 공격합니다. 두 번째 공격은 첫 번째 공격의 절반 피해를 줍니다.\n\n잔여 시간: %s턴

actors.buffs.camoflage.name=위장
actors.buffs.camoflage.desc=주변 환경과 조화를 이루어 적의 시야를 피합니다.\n\n위장 상태에서는 적이 당신을 발견하기 어려워집니다. 공격하거나 너무 가까이 다가가면 위장이 해제됩니다.

actors.buffs.counter.name=반격
actors.buffs.counter.desc=다음 공격을 기다리며 반격을 준비하고 있습니다.\n\n반격 상태에서는 다음에 받는 근접 공격을 회피하고 즉시 반격하여 150% 피해를 줍니다.

actors.buffs.empowerment.name=강화
actors.buffs.empowerment.desc=마법 에너지가 무기에 깃들었습니다.\n\n강화 상태에서는 근접 공격이 25% 추가 마법 피해를 줍니다.\n\n잔여 시간: %s턴

actors.buffs.guardcharge.name=방패 충전
actors.buffs.guardcharge.desc=방패에 에너지가 충전되어 있습니다.\n\n방패 충전은 방어 성공 시 추가 방어력을 제공합니다.\n\n잔여 시간: %s턴

actors.buffs.imbue.name=주입
actors.buffs.imbue.desc=마법 속성이 무기에 주입되었습니다.\n\n주입 상태에서는 근접 공격이 50% 추가 속성 피해를 줍니다. 속성은 현재 주입된 마법에 따라 달라집니다.\n\n잔여 시간: %s턴

actors.buffs.mana.name=마나
actors.buffs.mana.desc=마나가 몸속에서 활활 타오르고 있습니다.\n\n마나 상태에서는 지팡이 충전 속도가 빨라집니다.\n\n잔여 시간: %s턴

actors.buffs.manashield.name=마나 보호막
actors.buffs.manashield.desc=마나가 피해를 대신 흡수합니다.\n\n마나 보호막은 받는 피해를 50% 줄이고, 나머지 50%는 마나를 소모하여 방어합니다.\n\n잔여 시간: %s턴

actors.buffs.rage.name=격노
actors.buffs.rage.desc=분노가 당신을 사로잡았습니다!\n\n격노 상태에서는 공격력이 30% 증가하지만 방어력이 20% 감소합니다.\n\n잔여 시간: %s턴

actors.buffs.retribution.name=응징
actors.buffs.retribution.desc=신성한 힘이 당신의 공격을 강화합니다.\n\n응징 상태에서는 언데드에게 50% 추가 피해를 줍니다.\n\n잔여 시간: %s턴

actors.buffs.shield.name=보호막
actors.buffs.shield.desc=보호막이 당신을 감싸 피해를 흡수합니다.\n\n보호막은 지속 시간 동안 모든 피해를 흡수합니다. 시간이 지나면 서서히 사라집니다.\n\n잔여 보호막: %d

actors.buffs.smoke.name=연기
actors.buffs.smoke.desc=짙은 연기가 당신을 감쌌습니다.\n\n연기 상태에서는 적이 당신을 발견하기 어려워집니다.\n\n잔여 시간: %s턴

actors.buffs.soul.name=영혼
actors.buffs.soul.desc=영혼의 힘이 깃들었습니다.\n\n영혼 상태에서는 처치한 적의 영혼을 흡수하여 능력치를 강화합니다.\n\n잔여 시간: %s턴

actors.buffs.stun.name=기절
actors.buffs.stun.desc=대상이 기절하여 아무 행동도 할 수 없습니다.\n\n잔여 시간: %s턴

actors.buffs.temporalstun.name=시간 감금
actors.buffs.temporalstun.desc=시간의 흐름이 멈추었습니다. 당신은 꼼짝할 수 없습니다.\n\n잔여 시간: %s턴

actors.buffs.venomgas.name=맹독 가스
actors.buffs.venomgas.desc=이 가스는 독가스보다 훨씬 더 위험합니다. 매우 천천히 퍼지지만, 닿으면 매우 치명적입니다.\n\n잔여 시간: %s턴

actors.buffs.daze.name=현기증
actors.buffs.daze.heromsg=어지럽습니다!
actors.buffs.daze.desc=귀에서 윙윙거리는 소리가 나고 시야가 흐려져 전투가 매우 어려워집니다.\n\n현기증 상태에서는 명중률과 회피율이 50%% 감소합니다.\n\n잔여 시간: %s턴

actors.buffs.degrade.name=등급 하락
actors.buffs.degrade.heromsg=장비가 일시적으로 약화되었습니다!
actors.buffs.degrade.desc=강력한 어둠의 마법이 업그레이드 두루마리가 주입한 마력을 잠식하고 있습니다!\n\n등급 하락 상태의 장비는 원래 등급보다 낮은 것으로 간주됩니다. _3레벨을 초과하는 업그레이드는 더 심각한 역효과를 받습니다._ 아이템 설명도 등급 하락의 영향을 반영하여 변경됩니다.\n\n단, 등급 하락은 장비의 힘 요구치, 지팡이 충전, 투척 무기 내구도, 유물에는 영향을 미치지 않습니다.\n\n잔여 시간: %s턴\n\n업그레이드 두루마리나 제거의 두루마리를 사용하면 이 어둠의 마법을 즉시 해제할 수 있습니다.

actors.buffs.doom.name=파멸
actors.buffs.doom.desc=우주 전체가 당신을 죽이려 할 때 계속 싸울 의미가 있을까요?\n\n파멸에 걸린 대상은 받는 모든 피해가 17% 증가합니다.\n\n파멸은 영구적이며 죽어야만 해제됩니다.

actors.buffs.dread.name=공포
actors.buffs.dread.desc=뼈를 파고드는 두려움이 대상을 이 지하 감옥에서 도망치게 만듭니다!\n\n공포에 질린 생물은 적에게서 빠르게 도망치며, 시야에서 사라지면 지하 감옥 전체에서 사라집니다. 도망치는 적은 아이템을 떨어뜨리지 않으며, 절반의 경험치만 줍니다. 피해를 입으면 안정됩니다.\n\n잔여 시간: %d턴

actors.buffs.drowsy.name=졸음
actors.buffs.drowsy.desc=마법의 힘이 대상을 깨어 있기 어렵게 만듭니다. 몇 턴 후 마법 수면에 빠집니다.\n\n영웅의 경우, 잠들어야 할 턴에 생명력이 가득하거나 그동안 피해를 입으면 마법 수면이 발동하지 않습니다.\n\n잠들기까지 %s턴

actors.buffs.earthimbue.name=대지의 힘
actors.buffs.earthimbue.desc=대지의 힘이 깃들었습니다!\n\n효과가 지속되는 동안 모든 물리 공격이 적의 발밑 지면을 변화시켜 일정 시간 절름발이로 만듭니다.\n\n잔여 시간: %s턴

actors.buffs.enhancedrings.name=반지 강화
actors.buffs.enhancedrings.desc=도적이 유물을 사용하여 반지를 강화해 +1 업그레이드를 부여했습니다.\n\n잔여 시간: %s턴

actors.buffs.frost.name=빙결
actors.buffs.frost.freezes=%s이(가) 얼었습니다!
actors.buffs.frost.desc=얼음 조각과 혼동하지 마십시오. 이 온화한 동결은 단순히 대상을 얼음으로 감쌉니다.\n\n동결은 마비와 유사하게 대상을 행동 불능으로 만듭니다. 차이점은 피해를 입으면 얼음이 깨지면서 즉시 효과가 해제됩니다.\n\n잔여 시간: %s턴

actors.buffs.frostimbue.name=서리의 힘
actors.buffs.frostimbue.desc=서리의 힘이 깃들었습니다!\n\n모든 물리 공격이 적에게 냉기를 축적시킵니다. 또한 추위에 완전히 면역이 됩니다.\n\n잔여 시간: %s턴

actors.buffs.blobimmunity.name=정화 장벽
actors.buffs.blobimmunity.desc=이상한 에너지가 주변을 감싸 유해한 환경 효과를 차단합니다.\n\n정화 장벽이 지속되는 동안 모든 부정적 환경 효과에 면역이 됩니다.\n\n잔여 시간: %s턴

actors.buffs.gravitychaostracker.name=중력 혼돈
actors.buffs.gravitychaostracker.desc_intro=몇 턴마다 현재 층의 모든 유닛이 무작위 방향으로 던져집니다.
actors.buffs.gravitychaostracker.desc_positive=하지만 당신과 동맹은 이에 면역인 것 같습니다.
actors.buffs.gravitychaostracker.desc_duration=중력 혼돈이 얼마나 지속될지는 알 수 없지만, 영원히 계속되지는 않을 것입니다.

actors.buffs.physicalempower.name=체력 증폭
actors.buffs.physicalempower.desc=공격이 강화되어, 다음 몇 번의 물리 공격이 적에게 추가 피해를 줍니다.\n\n추가 피해: %1\n남은 횟수: %2

actors.buffs.pincushion.name=명중
actors.buffs.pincushion.desc=던진 무기가 이 캐릭터에 박혀 있습니다. 처치하면 무기가 바닥에 떨어집니다.\n\n박혀 있는 아이템:

actors.buffs.preparation.name=준비 단계
actors.buffs.preparation.action_name=치명타
actors.buffs.preparation.desc=암살자가 인내심을 가지고 기다리며, 그림자 속에서 치명적인 일격을 준비합니다.
actors.buffs.preparation.desc_dmg=다음 공격은 _%1%%의 추가 피해_를 주고, 체력이 _%2%%_ 이하인 일반 적 또는 _%3%%_ 이하인 보스를 즉시 처치합니다.
actors.buffs.preparation.desc_dmg_likely=이 공격은 높은 피해가 나올 확률도 더 높습니다.
actors.buffs.preparation.desc_blink=최대 %d타일까지 적에게 순간 이동하여 공격할 수 있습니다.
actors.buffs.preparation.desc_invis_time=암살자가 _%d_턴 동안 투명 상태입니다.
actors.buffs.preparation.desc_invis_next=이 공격은 _%d_턴 후에 더 강해집니다.
actors.buffs.preparation.prompt=공격할 대상을 선택하세요!\n최대 돌진 거리: %d타일
actors.buffs.preparation.no_target=공격할 대상이 없습니다.
actors.buffs.preparation.out_of_reach=대상에게 돌진할 수 없습니다.
actors.buffs.preparation.assassinated=암살

actors.buffs.prismaticguard.name=무지개 수호자
actors.buffs.prismaticguard.desc=보이지 않는 무지개 수호자의 보호를 받고 있습니다. 적이 나타나면 수호자가 나타나 싸웁니다!\n\n비활성화 상태에서는 모든 피해를 서서히 회복합니다.\n\n현재 생명력: %d/%d
actors.buffs.prismaticguard.desc_many=이 무지개 환영은 만물일심에 의해 강화되었습니다. 남은 턴: %d

actors.buffs.recharging.name=충전
actors.buffs.recharging.desc=마력이 몸속을 흘러 지팡이와 마법봉의 충전 속도를 높입니다.\n\n이 효과는 매 턴 기본 충전에 0.25의 추가 지팡이 충전을 제공합니다.\n\n잔여 시간: %s턴

actors.buffs.revealedarea.name=지역 공개
actors.buffs.revealedarea.desc=지하 감옥의 한 지역이 공개되어, 이 층 어디서든 그곳을 볼 수 있습니다.\n\n잔여 시간: %s턴

actors.buffs.revealedchar.name=발각됨
actors.buffs.revealedchar.desc=이 유닛이 발각되어 어디에 있든 볼 수 있습니다.\n\n잔여 시간: %s턴

actors.buffs.roots.name=뿌리 결속
actors.buffs.roots.heromsg=움직일 수 없습니다!
actors.buffs.roots.desc=뿌리(자연적이든 마법적이든)가 발목을 감아 땅에 단단히 고정했습니다.\n\n뿌리 결속은 대상을 현재 위치에 묶어 이동이나 대부분의 이동 기술을 사용할 수 없게 합니다. 전송 효과를 포함한 다른 행동은 가능합니다.\n\n잔여 시간: %s턴

actors.buffs.scrollempower.name=두루마리 강화
actors.buffs.scrollempower.desc=마법사가 두루마리를 읽을 때 생성된 에너지가 지팡이를 일시적으로 강화합니다!\n\n지팡이 강화: +%1\n남은 유효 시전 횟수: %2

actors.buffs.shadows.name=그림자 융합
actors.buffs.shadows.desc=주변 그림자와 융합되어 투명해지고 신진대사가 느려집니다.\n\n투명화 중에는 적이 추적하거나 공격할 수 없습니다. 대부분의 물리 공격이나 마법은 투명화를 즉시 해제합니다. 또한 그림자 융합 상태에서는 포만감 소모 속도가 감소합니다.\n\n그림자 융합은 그림자를 벗어나거나 적과 직접 접촉할 때까지 지속됩니다.

actors.buffs.snipersmark.name=저격 표식
actors.buffs.snipersmark.action_name_snapshot=속사
actors.buffs.snipersmark.action_name_volley=연사
actors.buffs.snipersmark.action_name_sniper=저격
actors.buffs.snipersmark.desc=저격수가 최근에 조준한 대상에 집중합니다. 정신력 활로 특수 공격을 할 수 있으며, 공격 방식은 활의 강화 방식에 따라 다릅니다.\n\n강화되지 않은 활은 _속사_로, 낮은 피해지만 턴을 소모하지 않는 사격을 합니다.\n\n속도 강화 활은 세 발 _연사_를 합니다. 각 화살은 낮은 피해지만 마법부여를 발동시킬 수 있습니다. 1턴 소모.\n\n피해 강화 활은 _저격_을 합니다. 이 화살은 반드시 명중하며, 대상과의 거리에 따라 추가 피해를 줍니다. 2턴 소모.\n\n잔여 시간: %s턴

actors.buffs.soulmark.name=영혼 표식
actors.buffs.soulmark.desc=흑마법사가 대상의 영혼에 표식을 남겼습니다. 대상이 물리 피해를 입을 때 흑마법사의 생명력을 회복시킵니다.\n\n잔여 시간: %s턴

actors.buffs.vulnerable.name=취약
actors.buffs.vulnerable.heromsg=외부의 피해가 더 아프게 느껴집니다!
actors.buffs.vulnerable.desc=취약 마법은 대상이 방어력으로 감소된 모든 물리 피해를 33%% 더 받게 만듭니다.\n\n잔여 시간: %s턴

actors.buffs.corrosion.name=부식
actors.buffs.corrosion.heromsg=강산에 녹고 있습니다!
actors.buffs.corrosion.ondeath=완전히 녹아 사라졌습니다...
actors.buffs.corrosion.rankings_desc=용해
actors.buffs.corrosion.desc=강산이 놀라운 속도로 살, 금속, 뼈를 부식시킵니다.\n\n대상이 산에 노출된 시간이 길수록 산 피해가 증가합니다.\n\n잔여 시간: %1\n현재 산 피해: %2

actors.buffs.vertigo.name=현기증
actors.buffs.vertigo.desc=세상이 빙글빙글 돈다면 일직선으로 걷기가 매우 어려워집니다.\n\n현기증이 지속되는 동안 대상의 이동은 의도한 방향이 아닌 무작위 방향으로 이루어집니다.\n\n잔여 시간: %s턴

actors.buffs.wandempower.name=마법봉 강화
actors.buffs.wandempower.desc=공격형 마법봉이 강화되어, 다음 몇 번의 공격이 추가 피해를 줍니다.\n\n추가 피해: %1\n남은 공격 횟수: %2

actors.buffs.wellfed.name=포만
actors.buffs.wellfed.dmname=전량 충전
actors.buffs.wellfed.desc=충분히 먹어서 배가 부릅니다.\n\n포만 상태에서는 포만도가 소모되지 않으며, 시간이 지나면서 추가 생명력을 회복합니다.\n\n잔여 시간: %d턴
actors.buffs.wellfed.dmdesc=현재 전량이 충전되었습니다.\n\n전량 충전 시 오랜 시간 동안 전력이 감소하지 않으며, 시간이 지나면서 추가 생명력을 회복합니다.\n\n잔여 시간: %d턴

actors.buffs.foresight.name=위험 예지
actors.buffs.foresight.desc=어째서인지 머릿속에 주변 지형이 그려집니다.\n\n위험 예지가 지속되는 동안 주변 넓은 범위의 지형이 드러나며, 숨겨진 문과 함정도 포함됩니다.\n\n잔여 시간: %s턴

actors.buffs.greaterhaste.name=섬광 이동
actors.buffs.greaterhaste.desc=놀라운 속도로 모든 것이 정지된 것처럼 느껴집니다.\n\n섬광 이동 효과 중에는 이동이 턴을 소모하지 않지만, 다른 행동은 정상 속도입니다. 타일당 1턴의 섬광 이동을 소모합니다.\n\n섬광 이동 남은 턴: %d턴

actors.buffs.haste.name=신속
actors.buffs.haste.desc=강력한 에너지가 다리 근육으로 흘러들어 믿을 수 없는 속도로 움직일 수 있게 합니다!\n\n신속 상태에서는 3배의 이동 속도를 가지지만, 다른 행동 속도는 그대로입니다.\n\n잔여 시간: %s턴

actors.buffs.toxicimbue.name=독의 힘
actors.buffs.toxicimbue.desc=독의 힘이 깃들었습니다!\n\n이동 시 몸에서 독가스가 뿜어져 나와 적을 해칩니다. 지속 중 및 종료 후 몇 턴 동안 독가스와 중독에 면역이 됩니다.\n\n잔여 시간: %s턴

actors.buffs.corruption.desc=타락 마법이 생물체의 생명 본질을 침범하여 본래의 성질을 뒤틀었습니다.\n\n타락한 생물은 동맹을 공격하고 원래의 적은 무시합니다. 타락 효과는 피해를 주어 대상이 천천히 죽게 만듭니다.\n\n타락은 영구적이며 죽어야만 해제됩니다.
actors.buffs.cripple.desc=다리가 제대로 접히지 않는 것을 느낍니다.\n\n절름발이는 이동 속도를 절반으로 줄여 한 타일을 이동하는 데 2턴이 소모됩니다.\n\n잔여 시간: %s턴
actors.buffs.fury.name=분노
actors.buffs.fury.heromsg=격노에 빠졌습니다!
actors.buffs.fury.desc=맹렬한 분노가 몸속에서 타오르며 물리 공격 피해가 50%% 증가합니다.\n\n생명력이 최대치의 50%% 미만일 때 활성화됩니다.
actors.buffs.fireimbue.desc=불의 힘이 깃들었습니다!\n\n모든 물리 공격이 적을 불태울 수 있습니다. 또한 불에 완전히 면역이 됩니다.\n\n잔여 시간: %s턴

###hero

##abilities
actors.hero.abilities.armorability.self_target=자신을 대상으로 지정할 수 없습니다!
actors.hero.abilities.armorability.no_target=공격할 수 있는 대상이 없습니다!

actors.hero.abilities.warrior.bash.name=강타
actors.hero.abilities.warrior.bash.short_desc=전사가 대상에게 돌진하여_강타_를 가하고, 2타일 뒤로 밀쳐내며 일정 확률로 기절시킵니다.
actors.hero.abilities.warrior.bash.desc=전사가 2의 충전을 소모하여 적에게 돌진하고 무기 피해에 10을 더한 피해를 줍니다. 그 후 적을 2타일 뒤로 밀쳐냅니다. 대상이 벽이나 다른 적과 충돌하면 1턴 동안 기절합니다.\n\n밀쳐내는 효과로는 적을 구덩이에 떨어뜨릴 수 없습니다.

actors.hero.abilities.warrior.shockwave.name=충격파
actors.hero.abilities.warrior.shockwave.short_desc=전사가 발을 구르며_충격파_를 발생시켜 주변의 모든 적을 밀쳐내고 일정 확률로 기절시킵니다.
actors.hero.abilities.warrior.shockwave.desc=전사가 땅을 힘껏 구릅니다. 충격파가 전사를 중심으로 한 3x3 영역에 25%의 피해를 주고 대상의 다음 턴을 지웁니다. 중앙에 가까울수록 더 높은 확률로 다음 턴이 지워집니다.

actors.hero.abilities.warrior.leap.name=영웅의 도약
actors.hero.abilities.warrior.leap.short_desc=전사가 선택한 지점으로_도약_하여 충격 지점 근처의 모든 적에게 둔화 피해를 줍니다.
actors.hero.abilities.warrior.leap.desc=전사가 최대 6타일 떨어진 지점으로 도약합니다. 도착지에 적이 있으면 밀쳐내고, 도착지 근처의 모든 적에게 무기 등급에 비례한 둔화 피해를 줍니다.

actors.hero.abilities.mage.elementalblast.name=원소 폭풍
actors.hero.abilities.mage.elementalblast.no_staff=마법봉 없이는 이 능력을 사용할 수 없습니다.
actors.hero.abilities.mage.elementalblast.short_desc=마법사가 마법봉에서_원소 폭풍_을 방출하여 자신을 중심으로 한 넓은 원형 영역을 휩쓸며, 주입된 지팡이에 따라 다른 효과를 냅니다.
actors.hero.abilities.mage.elementalblast.desc=마법사가 폭풍 같은 마력을 방출하여 반경 4의 원형 영역을 휩쓸며 대상에게 15~25의 피해를 줍니다. 원소 폭풍의 효과는 마법봉에 주입된 지팡이에 따라 달라집니다.
actors.hero.abilities.mage.elementalblast.generic_desc=원소 폭풍의 효과는 지팡이로 대상을 시전하는 효과와 유사합니다.

actors.hero.abilities.mage.wildmagic.name=야생 마법
actors.hero.abilities.mage.wildmagic.no_wands=시전할 지팡이가 없습니다!
actors.hero.abilities.mage.wildmagic.short_desc=마법사가 지팡이에서_야생 마법_을 끌어내어 한 턴 안에 지정된 대상에게 여러 번 무작위로 시전합니다.
actors.hero.abilities.mage.wildmagic.desc=마법사가 지팡이의 마력을 끌어내어 한 턴 안에 최대 4회 무작위로 시전합니다. 이 능력은 마법사의 마법봉을 방출하지 않습니다.\n\n이 능력으로 지팡이를 사용할 때, 지팡이는 2레벨 상승한 것으로 간주되며 최대 +3까지 가능합니다. 이 능력으로 주문을 시전하면 충전량의 절반만 소모되며, 각 지팡이는 최대 2회 무작위로 시전됩니다.

actors.hero.abilities.mage.warpbeacon.name=공간 신호기
actors.hero.abilities.mage.warpbeacon.depths=다른 층으로는 이동할 수 없습니다!
actors.hero.abilities.mage.warpbeacon.locked_floor=층이 봉쇄되어 떠날 수 없습니다!
actors.hero.abilities.mage.warpbeacon.too_far=이 위치는 너무 멉니다!
actors.hero.abilities.mage.warpbeacon.invalid_beacon=거기에 신호기를 설치할 수 없습니다!
actors.hero.abilities.mage.warpbeacon.window_desc=현재 신호기는 %d층에 설치되어 있습니다.
actors.hero.abilities.mage.warpbeacon.window_tele=신호기 위치로 귀환
actors.hero.abilities.mage.warpbeacon.window_clear=신호기 제거
actors.hero.abilities.mage.warpbeacon.window_cancel=취소
actors.hero.abilities.mage.warpbeacon.short_desc=마법사가 현재 위치에_공간 신호기_를 설치하여 순간적으로 신호기 위치로 이동할 수 있습니다.
actors.hero.abilities.mage.warpbeacon.desc=마법사가 언제든지 돌아올 수 있는 신호기를 설치합니다. 신호기 설치는 1턴이 걸리지만, 귀환은 시간이 걸리지 않습니다.\n\n마법사는 초기 상태에서 다른 층으로 이동할 수 없으며, 잠긴 방과 같은 접근 불가능한 영역에는 설치할 수 없습니다. 귀환 시 목표 위치에 적이 있으면 밀쳐냅니다.

actors.hero.abilities.rogue.smokebomb.name=연막 폭발
actors.hero.abilities.rogue.smokebomb.fov=시야 내의 빈 타일로만 점프할 수 있습니다
actors.hero.abilities.rogue.smokebomb.prompt=점프할 위치를 선택하세요
actors.hero.abilities.rogue.smokebomb$ninjalog.name=목각 인형
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=어째서인지 적들은 이것이 바로 도적이라고 확신합니다.
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=특정 영웅 갑옷 기술을 통해 이 유닛을 발견할 수 있습니다.
actors.hero.abilities.rogue.smokebomb.short_desc=도적이 제자리에서_연막 폭발_을 일으킨 후 섬광처럼 사라지며, 원점 주변의 적들을 실명시킵니다.
actors.hero.abilities.rogue.smokebomb.desc=도적이 제자리에서 연막 폭발을 일으키고 최대 6타일 거리까지 섬광 이동합니다. 섬광 이동은 적과 위험 지형을 무시하지만, 벽과 같은 단단한 지형에는 막힙니다.\n\n도적의 원래 위치 근처에 있던 적들은 5턴 동안 실명합니다.

actors.hero.abilities.rogue.deathmark.name=필살의 표식
actors.hero.abilities.rogue.deathmark.ally_target=적만 표시할 수 있습니다
actors.hero.abilities.rogue.deathmark.short_desc=도적이 선택한 적에게_필살의 표식_을 겁니다. 표식된 적은 추가 피해를 받지만, 표식 기간 중에는 죽지 않습니다.
actors.hero.abilities.rogue.deathmark.desc=도적이 선택한 적을 표시하여 25%의 추가 피해를 받게 합니다. 표시는 시간이 걸리지 않으며 5턴 동안 지속됩니다.\n\n표시된 적은 추가 피해를 받지만, 표시 기간 중에는 죽지 않습니다. 표시가 끝날 때 체력이 0인 적은 즉시 사망합니다.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=필살의 표식
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=이 표식된 적은 25%%의 추가 피해를 받지만, 표식 기간 중에는 죽지 않습니다.\n\n표식 남은 시간: %s턴

actors.hero.abilities.rogue.shadowclone.name=그림자 분신
actors.hero.abilities.rogue.shadowclone.short_desc=도적이_그림자 분신_을 소환하여 전투를 돕게 합니다.
actors.hero.abilities.rogue.shadowclone.desc=도적이 그림자 분신을 소환하고 지휘할 수 있습니다. 분신 지휘는 충전을 소모하지 않습니다.\n\n분신은 80의 체력과 10~20의 근접 피해를 가지며 방어력은 없습니다. 특정 재능이 활성화되면 이러한 능력치가 주인의 무기와 갑옷에 따라 강화될 수 있습니다.
actors.hero.abilities.rogue.shadowclone$shadowally.name=그림자 분신
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=분신이 그 위치로 이동했습니다.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=분신이 당신을 따라가고 있습니다.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=분신이 공격하고 있습니다!
actors.hero.abilities.rogue.shadowclone$shadowally.directed_wander=분신이 주변을 정찰하고 있습니다.
actors.hero.abilities.rogue.shadowclone$shadowally.desc=무형의 그림자로 만들어진 도적의 복제품. 꼼짝도 하지 않고 빈 눈으로 멍하니 있으며, 연기 같은 어둠이 주변에서 천천히 피어오릅니다.\n\n완벽한 복제품이라고는 할 수 없지만, 쓸 만한 암살자이며 특정 재능이 있다면 주인의 장비로부터 이점을 얻을 수 있습니다.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=특정 영웅 갑옷 기술을 통해 이 유닛을 발견할 수 있습니다.

actors.hero.abilities.armorability.prompt=능력을 사용할 위치를 선택하세요
actors.hero.abilities.armorability.cost=충전 소모: _%d_

actors.hero.abilities.warrior.heroicleap.name=영웅의 도약
actors.hero.abilities.warrior.heroicleap.prompt=도약할 위치를 선택하세요
actors.hero.abilities.warrior.heroicleap.short_desc=전사가 지정한 위치로_영웅의 도약_을 하여 모든 적과 위험 지형을 넘을 수 있습니다.
actors.hero.abilities.warrior.heroicleap.desc=전사가 지정한 위치로 도약하며, 경로상의 모든 적과 위험 지형을 넘습니다. 단, 벽이나 기타 단단한 지형은 넘을 수 없습니다.
actors.hero.abilities.warrior.shockwave.name=지면 충격파
actors.hero.abilities.warrior.shockwave.short_desc=전사가 땅을 강타하여 부채꼴 영역에_지면 충격파_를 가합니다. 충격파에 맞은 적은 피해를 입고 절름발이가 됩니다.
actors.hero.abilities.warrior.shockwave.desc=전사가 땅을 강타하여 전방 60도 부채꼴 5타일 범위에 충격파를 발생시킵니다.\n\n맞은 적은 5턴 동안 절름발이가 되고 5~10의 피해를 받습니다. 전사의 힘이 10을 초과할 때마다 피해가 1~2씩 증가합니다.

actors.hero.abilities.warrior.endure.name=고통의 인내
actors.hero.abilities.warrior.endure$enduretracker.name=고통의 분노
actors.hero.abilities.warrior.endure$enduretracker.desc=전사가 참아낸 피해를 분노로 엮어 적에게 추가 피해를 쏟아냅니다.\n\n추가 피해: %1\n남은 공격 횟수: %2
actors.hero.abilities.warrior.endure.short_desc=전사가_고통을 인내_하며 몇 턴간 큰 피해 저항을 얻습니다. 이후 참아낸 피해량에 비례한 추가 피해를 줍니다.
actors.hero.abilities.warrior.endure.desc=전사가 3턴 동안 인내하며 받는 모든 피해를 절반으로 줄입니다. 이 감소 효과는 다른 감소 효과보다 우선 적용됩니다.\n\n이후 10턴 내의 다음 공격이 추가 피해를 줍니다. 추가 피해량은 인내 기간 중 받은 모든 원시 피해의 절반과 같습니다.\n\n전사가 연속 공격 상태라면, 이 능력은 3턴의 연속 공격 시간을 보상합니다.

actors.hero.abilities.huntress.spectralblades.name=영혼의 검
actors.hero.abilities.huntress.spectralblades.short_desc=여사냥꾼이 대상에게_영혼의 검_을 던져 장착한 근접 무기에 따라 피해를 줍니다.
actors.hero.abilities.huntress.spectralblades.desc=여사냥꾼이 적에게 정신력 검을 던져 근접 무기로 원거리 공격을 합니다. 마법부여를 포함한 모든 근접 공격 효과가 유지됩니다.

actors.hero.abilities.huntress.naturespower.name=자연의 힘
actors.hero.abilities.huntress.naturespower.short_desc=여사냥꾼이_자연의 힘_을 불러내어 일시적으로 이동 속도와 정신력 활 사격 속도를 증가시킵니다.
actors.hero.abilities.huntress.naturespower.desc=여사냥꾼과 그녀의 활에 자연의 힘이 깃듭니다! 이 힘은 8턴 동안 지속됩니다.\n\n자연의 힘을 받은 여사냥꾼은 2배의 이동 속도와 +33%의 정신력 활 사격 속도를 얻습니다. 이 힘은 저격수 특성의 추가 공격에는 영향을 미치지 않습니다.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=자연의 힘
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=여사냥꾼이 일시적인 자연의 힘을 얻어 이동 속도와 정신력 활 사격 속도가 증가합니다.\n\n남은 턴: %s

actors.hero.abilities.huntress.spirithawk.name=정신력 독수리
actors.hero.abilities.huntress.spirithawk.no_space=주변에 소환할 빈 공간이 없습니다.
actors.hero.abilities.huntress.spirithawk.short_desc=여사냥꾼이_정신력 독수리_ 소환수를 불러 정찰을 돕고 적의 주의를 끕니다.
actors.hero.abilities.huntress.spirithawk.desc=여사냥꾼이 정신력 독수리를 소환합니다. 독수리가 존재하는 동안 이 능력을 사용하여 지시할 수 있습니다. 독수리는 100턴 동안 존재하며, 지시는 충전을 소모하지 않습니다.\n\n정신력 독수리는 연약하고 공격력이 약하지만, 빠른 이동, 민첩한 회피, 정확한 공격으로 이를 보완합니다. 독수리는 여사냥꾼과 시야를 공유하며 화염, 독가스 등의 모든 환경 효과에 면역입니다. 독수리는 여사냥꾼의 지시에만 공격합니다.
actors.hero.abilities.huntress.spirithawk$hawkally.name=정신력 독수리
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=독수리가 그 위치로 이동했습니다.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=독수리가 당신을 따라가고 있습니다.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=독수리가 공격하고 있습니다!
actors.hero.abilities.huntress.spirithawk$hawkally.directed_wander=독수리가 주변을 정찰하고 있습니다.
actors.hero.abilities.huntress.spirithawk$hawkally.desc=사냥녀가 소환한 정신 에너지 독수리로, 온몸에서 밝고 공허한 푸른 빛을 발산합니다. 계속해서 고개를 돌려 주변 환경을 탐색합니다.\n\n독수리는 육체적 전투에 적합하지 않지만, 그 속도와 시야 거리 덕분에 효율적인 정찰과 위험한 유인 임무를 수행할 수 있습니다.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=남은 턴: %d턴
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=독수리가 다음 %d번의 공격을 반드시 회피합니다.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=특정 영웅 갑옷 기술을 통해 이 유닛을 발견할 수 있습니다.

actors.hero.abilities.duelist.challenge.name=정정당당한 결투
actors.hero.abilities.duelist.challenge.prompt=결투할 적을 선택하세요
actors.hero.abilities.duelist.challenge.already_dueling=동시에 한 번에 하나의 결투만 할 수 있습니다.
actors.hero.abilities.duelist.challenge.ally_target=적에게만 결투를 신청할 수 있습니다.
actors.hero.abilities.duelist.challenge.unreachable_target=접근할 수 없는 대상을 선택할 수 없습니다.
actors.hero.abilities.duelist.challenge.distant_target=그 적이 너무 멀어 결투를 신청할 수 없습니다.
actors.hero.abilities.duelist.challenge.short_desc=결투사가 근처의 적에게_정정당당한 결투_를 신청하여, 짧은 시간 동안 다른 모든 적의 시간을 멈춥니다.
actors.hero.abilities.duelist.challenge.desc=결투사가 근처의 적에게 결투를 신청합니다. 선택된 적은 응전해야 하며, 다른 적들은 일시적으로 시간이 정지됩니다.\n\n결투사는 5타일 내 접근 가능한 적에게만 결투를 신청할 수 있습니다. 결투가 10턴 진행되거나, 적이 죽거나, 결투사와 적의 거리가 5타일을 초과하면 결투가 종료됩니다.\n\n시간이 정지된 적은 무적 상태입니다. 결투사의 동맹은 이 능력에 영향을 받지 않지만, 우두머리에게 사용하면 그 추종자들도 정지되지 않습니다.
actors.hero.abilities.duelist.challenge$duelparticipant.name=결투 중
actors.hero.abilities.duelist.challenge$duelparticipant.desc=이 캐릭터는 결투 중입니다. 결투 당사자와 그 동맹 또는 추종자는 정상적으로 활동할 수 있지만, 다른 캐릭터는 시간이 정지되어 행동할 수 없습니다.\n\n결투가 일정 시간을 초과하거나, 결투 당사자 중 하나가 죽거나, 거리가 5타일을 초과하면 결투가 종료됩니다.\n\n남은 턴: %d

actors.hero.abilities.duelist.elementalstrike.name=원소 타격
actors.hero.abilities.duelist.elementalstrike.short_desc=결투사가_원소 타격_을 가하여, 무기의 마법부여에 기반한 효과를 부채꼴 범위에 방출합니다.
actors.hero.abilities.duelist.elementalstrike.desc=결투사가 적 또는 지점을 타격하여 반드시 명중하는 일반 공격을 가하고, 65도 각도 4타일 반경의 부채꼴 범위에 마법 효과를 발생시킵니다. 구체적인 효과는 결투사의 주 무기 마법부여에 따라 달라집니다.
actors.hero.abilities.duelist.elementalstrike.generic_desc=마법부여가 없는 원소 타격은 소형 마력 폭발을 일으켜 범위 내 모든 적에게 6~12의 피해를 줍니다.

actors.hero.abilities.duelist.feint.name=속임수
actors.hero.abilities.duelist.feint.prompt=돌진할 위치를 선택하세요
actors.hero.abilities.duelist.feint.too_far=그 위치는 인접하지 않습니다.
actors.hero.abilities.duelist.feint.bad_location=그 위치로 이동할 수 없습니다.
actors.hero.abilities.duelist.feint.short_desc=결투사가_속임수_를 써서 공격하는 척하며 인접 위치로 돌진합니다. 적이 그녀의 잔상을 공격하도록 유도하여 허점을 드러내게 합니다.
actors.hero.abilities.duelist.feint.desc=결투사가 공격하는 척하며 인접 위치로 돌진하고, 원래 자리에 잔상을 남깁니다. 결투사를 공격하던 적은 잔상을 공격하게 됩니다.\n\n잔상을 공격한 적은 혼란에 빠져 원래 다음 행동이 취소되고, 기습당할 수 있게 됩니다.

actors.hero.abilities.cleric.ascendedform.name=초승
actors.hero.abilities.cleric.ascendedform.short_desc=사제가_초승_하여 신격에 들어가 새로운 주문, 공격 거리, 보호막을 얻습니다.
actors.hero.abilities.cleric.ascendedform.desc=사제가 신성 에너지를 방출하여 10턴 동안 지속되는 신격 형태에 돌입합니다. 이 형태에서 사제는 새로운 주문을 시전할 수 있고, 공격 거리가 2타일, 보호막이 30 증가합니다. 또한 성전 충전 1을 소모하여 주문을 시전할 때마다 10의 보호막을 얻습니다.\n\n초승과 그 주문을 통해 부여된 보호막은 자연 감소하지 않지만, 초승이 종료되면 즉시 사라집니다. 이 기술을 재사용하면 초승의 지속 시간이 초기화됩니다.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=초승
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=신성 에너지가 사제 주변에 흐릅니다. 신격 상태에서 사제는 신성 에너지로 적을 탐지하여 공격 거리가 2 증가하고, 성전 충전을 1 사용할 때마다 10의 보호막을 얻습니다. 또한 초승 관련 재능을 통해 잠금 해제된 주문을 시전할 수 있습니다.\n\n초승과 그 주문을 통해 얻은 보호막은 자연 감소하지 않지만, 초승이 종료되면 즉시 사라집니다.\n\n현재 보호막: %1\n남은 턴: %2

actors.hero.abilities.cleric.trinity.name=삼위일체
actors.hero.abilities.cleric.trinity.no_imbue=삼위일체가 아직 어떤 위격의 효과도 얻지 못했습니다. 위격 주문을 사용하여 효과를 얻으십시오!
actors.hero.abilities.cleric.trinity.no_duplicate=삼위일체는 이미 장착한 장비의 효과를 복제할 수 없습니다!
actors.hero.abilities.cleric.trinity.ench_glyph_use=삼위일체가 _%2 충전_을 소모하여 이 마법부여 또는 각인 효과를 _%1 동안 얻습니다.
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=삼위일체가 _%2 충전_을 소모하여 이 _강력한_ 마법부여 또는 각인 효과를 _%1 동안 얻습니다.
actors.hero.abilities.cleric.trinity.wand_use=삼위일체가 _%2 충전_을 소모하여 이 지팡이의 _%1 효과를 사용합니다.
actors.hero.abilities.cleric.trinity.wand_multi_use=삼위일체가 _%2 충전_을 소모하여 이 _복수 충전_ 지팡이의 _%1 효과를 사용합니다.
actors.hero.abilities.cleric.trinity.thrown_use=삼위일체가 _%2 충전_을 소모하여 이 투척 무기의 _%1 효과를 사용합니다.
actors.hero.abilities.cleric.trinity.ring_use=삼위일체가 _%2 충전_을 소모하여 20턴 동안 이 반지의 _%1 효과를 얻습니다.
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=삼위일체가 _%2 충전_을 소모하여 이 유물의 원격 연금 효과를 사용합니다.
actors.hero.abilities.cleric.trinity.chaliceofblood_use=삼위일체가 _%2 충전_을 소모하여 이 유물의 _%1 수동 생명력 회복 효과를 20턴 동안 얻습니다.
actors.hero.abilities.cleric.trinity.driedrose_use=삼위일체가 _%2 충전_을 소모하여 이 유물의 유령 소환 효과(%1 유령 생명력)를 사용합니다.
actors.hero.abilities.cleric.trinity.etherealchains_use=삼위일체가 _%2 충전_을 소모하여 이 유물의 _%1 범위 사슬 발사 효과를 사용합니다.
actors.hero.abilities.cleric.trinity.hornofplenty_use=삼위일체가 _%2 충전_을 소모하여 이 유물의 한입 효과를 사용합니다.
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=삼위일체가 _%2 충전_을 소모하여 이 유물의 _%1 적 절도 효과를 사용합니다.
actors.hero.abilities.cleric.trinity.sandalsofnature_use=삼위일체가 _%2 충전_을 소모하여 이 유물의 무작위 유해 씨앗 발아 효과를 사용합니다.
actors.hero.abilities.cleric.trinity.talismanofforesight_use=삼위일체가 _%2 충전_을 소모하여 이 유물의 _%1 탐지 효과를 사용합니다.
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=삼위일체가 _%2 충전_을 소모하여 이 유물의 시간 정지 효과(%1)를 얻습니다.
actors.hero.abilities.cleric.trinity.unstablespellbook_use=삼위일체가 _%2 충전_을 소모하여 이 유물의 무작위 두루마리 효과(%1/10 확률로 추가 소모 없이 사용)를 사용합니다.
actors.hero.abilities.cleric.trinity.skeletonkey_use=삼위일체가 _%2 충전_을 소모하여 이 유물의 삽입 효과를 사용합니다.
actors.hero.abilities.cleric.trinity.cloakofshadows_use=삼위일체가 _%2 충전_을 소모하여 이 유물의 투명화 효과(%1)를 얻습니다.
actors.hero.abilities.cleric.trinity.capeofthorns_use=삼위일체가 _%2 충전_을 소모하여 이 유물의 가시 효과(%1)를 얻습니다.
actors.hero.abilities.cleric.trinity.lloydsbeacon_use=삼위일체가 _%2 충전_을 소모하여 이 유물의 전송 효과를 사용합니다.
actors.hero.abilities.cleric.trinity.shuriken_box_use=삼위일체가 _%2 충전_을 소모하여 이 유물의 _%1 소형 수리검 투척 효과를 사용합니다.
actors.hero.abilities.cleric.trinity.instructiontool_use=삼위일체가 _%2 충전_을 소모하여 이 유물의 _%1/10_ 영웅 최대 생명력의 윙맨 드론 생산 효과를 사용합니다.
actors.hero.abilities.cleric.trinity.cost=이 갑옷 기술의 충전 소모량은 고정되지 않지만, 일반적으로 _%d_입니다.
actors.hero.abilities.cleric.trinity.short_desc=사제가_삼위일체_ 갑옷 기술을 얻어 신력을 통해 만물을 꿰뚫고, 새로운 주문을 사용하여 이미 감정한 장비를 선택하여 형상화합니다.
actors.hero.abilities.cleric.trinity.desc=사제가_삼위일체_ 갑옷 기술을 얻어 세 가지 새로운 주문을 통해 다양한 물품 효과를 선택하고 사용합니다. 각 위격 주문은 사제가 이번 게임에서 이미 감정한 다른 종류의 장비 효과를 형상화하는 데 특화되어 있습니다: 체의 위격(무기와 갑옷), 지의 위격(지팡이와 투척 무기), 혼의 위격(반지와 유물).\n\n각 위격 주문은 한 번에 하나의 효과만 형상화할 수 있으며, 사제는 삼위일체 사용 시 어떤 위격 주문의 효과를 사용할지 선택할 수 있습니다. 삼위일체는 이미 장착한 장비의 효과를 복제할 수 없습니다.
actors.hero.abilities.cleric.trinity$wndusetrinity.text=삼위일체에서 사용할 위격 주문을 선택하세요. 다른 위격의 효과는 동시에 적용될 수 있습니다.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_체의 위격: %s_
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_지의 위격: %s_
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_혼의 위격: %s_
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=삼위일체가 형상화할 물품 효과를 선택하세요. 확인 전에 추가 정보가 표시됩니다.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=체의 위격 효과 선택
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=지의 위격 효과 선택
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=혼의 위격 효과 선택

actors.hero.abilities.cleric.powerofmany.name=만물일심
actors.hero.abilities.cleric.powerofmany.prompt_default=동맹 또는 위치를 선택하세요
actors.hero.abilities.cleric.powerofmany.prompt_ally=성천맹약에게 명령
actors.hero.abilities.cleric.powerofmany.ally_exists=이미 강화된 동맹이 있습니다.
actors.hero.abilities.cleric.powerofmany.no_vision=시야 밖의 위치는 대상으로 할 수 없습니다.
actors.hero.abilities.cleric.powerofmany.only_allies=동맹만 강화할 수 있습니다.
actors.hero.abilities.cleric.powerofmany.short_desc=사제가_만물일심_을 인도하여 기존 동맹을 강화하거나, 에너지를 응집하여 새로운 맹약을 창조합니다.
actors.hero.abilities.cleric.powerofmany.desc=사제가_만물일심_을 인도하여 기존 동맹을 강화하거나, 에너지를 응집하여 100턴 동안 지속되는 완전히 새로운 맹약을 창조합니다. 빈 위치에 이 갑옷 기술을 사용하면 새로운 맹약을 창조합니다.\n\n만물일심으로 강화된 동맹은 25% 피해 보너스와 25% 피해 감소를 얻고, 사제와 시야를 공유합니다. 갑옷 능력을 사용할 때 동맹은 25의 보호막도 얻습니다.\n\n사제는 강화된 동맹에게만 사용할 수 있는 세 가지 새로운 주문도 얻습니다. 만물일심은 이러한 주문이 효과를 발휘하는 동안 종료되지 않습니다.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=만물일심
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=이 동맹이 만물일심으로 강화되어 25%% 피해 보너스와 25%% 피해 감소를 얻습니다. 동맹은 또한 사제와 시야를 공유하며 만물일심 주문의 혜택을 받을 수 있습니다.\n\n무지개 수호자와 같은 동맹이 사라져도 만물일심 효과는 지속되지만, 지속 시간은 계속 줄어듭니다.\n\n남은 턴: %s
actors.hero.abilities.cleric.powerofmany$lightally.name=성천맹약
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=동맹이 그 위치로 이동했습니다.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=동맹이 당신을 따라가고 있습니다.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=동맹이 공격하고 있습니다!
actors.hero.abilities.cleric.powerofmany$lightally.directed_wander=동맹이 주변을 정찰하고 있습니다.
actors.hero.abilities.cleric.powerofmany$lightally.desc=사제의 모험 동료 클론으로, 전체가 응축된 성광으로 만들어졌습니다. 성천맹약이 다른 영웅의 외형을 가지고 있어도 그들의 독특한 능력은 없습니다. 이 동맹은 만물일심 효과가 유지되는 한 계속 존재합니다.\n\n이 동맹은 만물일심 갑옷 기술을 다시 사용하여 충전 소모 없이 지휘할 수 있습니다.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=특정 영웅 갑옷 기술을 통해 이 유닛을 발견할 수 있습니다.

actors.hero.abilities.ratmogrify.name=쥐 변신술
actors.hero.abilities.ratmogrify.cant_transform=이 대상은 쥐로 변신할 수 없습니다!
actors.hero.abilities.ratmogrify.too_strong=이 적이 너무 강력하여 쥐 변신술이 통하지 않습니다!
actors.hero.abilities.ratmogrify.short_desc=폐하께서_쥐 변신술_을 사용하여 적을 변신시킬 수 있습니다! 적은 일시적으로 모든 특수 능력을 잃은 쥐가 됩니다.
actors.hero.abilities.ratmogrify.desc=적을 6턴 동안 쥐로 변신시킬 수 있습니다! 단, 보스, 동맹, 또는 쥐 자체는 변신시킬 수 없습니다.\n\n쥐로 변신한 적은 원래 능력치를 유지하지만 모든 특수 능력을 잃습니다.
actors.hero.abilities.ratmogrify$transmograt.name=쥐 변신 %s
actors.hero.abilities.ratmogrify$transmograt.desc=이 적이 쥐로 변했습니다. 내게는 모든 게 좋은 일이다! — 쥐왕
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=사망 원인: 쥐 변신 적

##Cleric Spells
actors.hero.spells.auraofprotection.name=수호의 오라
actors.hero.spells.auraofprotection.short_desc=성기사와 주변 동맹의 방어를 강화합니다.
actors.hero.spells.auraofprotection.desc=성기사가 보호 에너지를 방출하여 주변에 _20턴_ 동안 지속되는 수호의 오라를 형성합니다. 성기사의 _2타일_ 내 모든 동맹(성기사 자신 포함)은 _%1%%_의 피해 감소와 _%2%%_의 성기사 갑옷 각인 강화를 얻습니다.\n\n이 피해 감소는 다른 감소 효과(예: 갑옷)보다 우선 적용됩니다. 각인 강화는 항상 적용되지만, 성기사 자신이나 무지개 수호자가 이미 성기사의 각인 효과를 받고 있다면 중복 적용되지 않습니다.\n\n이 주문은 _1턴을 소모_합니다.
actors.hero.spells.auraofprotection$aurabuff.name=수호의 오라
actors.hero.spells.auraofprotection$aurabuff.desc=성기사가 주변에 보호 에너지를 방출하고 있습니다.\n\n근처의 모든 동맹(성기사 자신 포함)은 피해 감소와 성기사 갑옷 각인 강화를 얻습니다.\n\n남은 턴: %s

actors.hero.spells.beamingray.name=광령 소환
actors.hero.spells.beamingray.no_space=동맹이 나타날 공간이 없습니다.
actors.hero.spells.beamingray.out_of_range=그 위치가 범위를 벗어났습니다.
actors.hero.spells.beamingray.short_desc=동맹을 전송하고 피해 보너스를 부여합니다.
actors.hero.spells.beamingray.desc=사제가 동맹의 힘을 인도하여 동맹을 특정 위치로 전송하는 광선이 됩니다. 광선이 적에게 닿으면 전송 광선이 동맹을 적 근처로 전송하여 공격 대상으로 삼습니다.\n\n전송 광선의 최대 범위는 _%1, 만물일심이 _4타일_ 내 가장 가까운 적에 대한 피해 보너스를 _%2%%_로 _10턴_ 동안 증가시킵니다. 이 주문은 평소에는 이동할 수 없는 동맹도 전송할 수 있지만, 그 경우 전송 광선 범위가 절반으로 줄어듭니다.\n\n이 주문은 _1턴을 소모_합니다.
actors.hero.spells.beamingray$beamingrayboost.name=광령 소환
actors.hero.spells.beamingray$beamingrayboost.desc=이 동맹이 최근 광령 소환의 전송 광선으로 전송되어, 전송 후 가장 가까운 적에 대한 피해 보너스를 얻습니다. 만물일심은 이 강화 효과가 지속되는 동안 종료되지 않습니다.\n\n남은 턴: %s

actors.hero.spells.blessspell.name=신성 축복
actors.hero.spells.blessspell.short_desc=시전자에게 축복과 보호막을, 다른 대상에게 축복과 치유를 부여합니다.
actors.hero.spells.blessspell.desc=시전자가 자신 또는 시야 내의 대상을 신성 축복합니다.\n\n자신을 대상으로 하면 약한 효과로 _%1 축복_과 _%2 보호막_을 얻습니다.\n\n다른 대상을 대상으로 하면 강한 효과로 _%3 축복_과 _%4 치유_를 얻습니다. 초과 치유는 보호막으로 전환됩니다.\n\n이 주문은 대상에 관계없이 _1턴을 소모_합니다.

actors.hero.spells.bodyform.name=체의 위격
actors.hero.spells.bodyform.short_desc=삼위일체의 마법부여 또는 각인을 선택합니다.
actors.hero.spells.bodyform.desc=사제가 이번 게임에서 이미 감정한 마법부여 또는 각인을 선택하여 삼위일체가 그 효과를 형상화하게 합니다.\n\n삼위일체 사용 시 사제는 선택한 마법부여 또는 각인의 효과를 _%d턴_ 동안 얻습니다. 이 임시 마법부여/각인은 일반 마법부여/각인이 가져야 할 모든 효과를 가집니다.\n\n이 주문은 삼위일체가 현재 형상화한 체의 위격 효과를 갱신합니다.\n\n이 주문은 _시간을 소모하지 않습니다_.
actors.hero.spells.bodyform$bodyformbuff.name=체의 위격
actors.hero.spells.bodyform$bodyformbuff.desc=위격 주문 체의 위격이 마법부여 또는 각인의 효과를 제공하여, 마치 현재 무기나 갑옷에 장착한 것처럼 작용합니다.\n\n참고로 체의 위격은 이미 장착한 장비의 효과를 복제할 수 없습니다.\n\n현재 효과: %1\n\n남은 턴: %2

actors.hero.spells.cleanse.name=신성 정화
actors.hero.spells.cleanse.short_desc=디버프를 제거하고 보호막을 얻습니다.
actors.hero.spells.cleanse.desc=시전자가 자신과 시야 내 동맹의 모든 디버프를 제거합니다. 이후 영향받은 모든 대상은 _%1 동안 디버프 면역과 _%2 보호막_을 얻습니다.\n\n이 주문은 _1턴을 소모_합니다.

actors.hero.spells.clericspell.prompt=대상을 선택하세요
actors.hero.spells.clericspell.no_target=그곳에 대상이 없습니다.
actors.hero.spells.clericspell.invalid_target=그 위치를 대상으로 할 수 없습니다.
actors.hero.spells.clericspell.invalid_enemy=그 적을 대상으로 할 수 없습니다.
actors.hero.spells.clericspell.charge_cost=충전 소모: %d

actors.hero.spells.divinesense.name=신성 감지
actors.hero.spells.divinesense.short_desc=단시간에 넓은 범위의 정신 감지를 얻습니다.
actors.hero.spells.divinesense.desc=시전자가 주변 환경에 감각을 집중하여 _50턴_ 동안 _%d타일_ 범위의 정신 감지를 얻습니다.\n\n이 주문은 _시간을 소모하지 않습니다_.
actors.hero.spells.divinesense$divinesensetracker.name=신성 감지
actors.hero.spells.divinesense$divinesensetracker.desc=이 대상이 일시적으로 정신 감지로 주변 생물을 볼 수 있습니다!\n\n남은 턴: %s

actors.hero.spells.divineintervention.name=신성 개입
actors.hero.spells.divineintervention.short_desc=사제와 동맹의 보호막을 크게 강화합니다.
actors.hero.spells.divineintervention.desc=사제가 성전을 통해 자신과 동맹에게 무적의 신력을 주입하여 모든 보호막을 _%1 높이고 초승을 _%2 연장합니다. 이 주문의 비할 데 없는 방어력은 매우 높은 충전 소모와 균형을 이룹니다.\n\n초승이 제공하는 다른 보호막과 마찬가지로 이 보호막은 자연 감소하지 않지만 초승 종료 시 즉시 사라집니다.\n\n이 주문은 _1턴을 소모_합니다.

actors.hero.spells.flash.name=천국의 계단
actors.hero.spells.flash.prompt=위치를 선택하세요
actors.hero.spells.flash.short_desc=근처 위치로 순간 이동합니다.
actors.hero.spells.flash.desc=사제가 근처 위치에 초승의 신력을 인도하여 그곳으로 순간 이동합니다. 천국의 계단은 사제를 범위 내에 있으며 점유되지 않은 탐색된 모든 위치로 이동시킬 수 있습니다. 같은 초승 중에 이 주문을 사용할 때마다 더 많은 성전 충전을 소모합니다.\n\n이 주문은 _1턴을 소모_합니다.

actors.hero.spells.guidinglight.name=신도의 빛
actors.hero.spells.guidinglight.short_desc=원거리 마법 필중 피해를 줍니다.
actors.hero.spells.guidinglight.desc=시전자가 마력 광탄을 발사하여 대상에게 _2~8 피해_를 주고 성휘를 부여합니다. 성휘 상태인 적에게 다음 힘 요구치 이하의 물리 공격이 반드시 명중합니다.\n\n이 주문은 _1턴을 소모_합니다.
actors.hero.spells.guidinglight.desc_priest=_사제가 이 주문을 시전할 때 더 강력해집니다._ 50턴 동안 첫 번째 주문 시전 시 성전 충전을 소모하지 않으며, 성휘는 복사, 지팡이, 다른 유닛, 적에게 직접 작용하는 유물에 의해 소모될 수 있습니다. 이렇게 성휘를 사용할 경우, _사제 레벨+5_의 추가 마법 피해를 입힙니다.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=신도의 빛
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=사제는 50턴마다 한 번씩 신도의 빛을 무료로 시전할 수 있습니다.\n\n남은 턴: %s
actors.hero.spells.guidinglight$illuminated.name=성휘
actors.hero.spells.guidinglight$illuminated.desc=이 대상이 신도의 빛에 맞아 성휘를 얻었습니다. 성휘의 밝기는 주변을 비출 만큼 충분하지 않지만, 그 마법으로 사제의 공격이 더 명중하기 쉬워집니다.
actors.hero.spells.guidinglight$illuminated.desc_priest=사제는 파효광휘, 지팡이 시전, 동맹 공격 또는 일부 유물 효과를 통해 성휘를 소모하여 발동시킬 수 있습니다. 이렇게 성휘를 사용하면 사제 레벨+5의 추가 마법 피해를 줍니다.
actors.hero.spells.guidinglight$illuminated.desc_generic=다른 영웅은 열광의 빛 재능으로 적에게 추가 피해를 줄 수 있지만, 명중 보너스는 얻을 수 없습니다.

actors.hero.spells.hallowedground.name=신성 영역
actors.hero.spells.hallowedground.prompt=위치를 선택하세요
actors.hero.spells.hallowedground.short_desc=동맹을 치유하고, 적을 감속하며, 범위 내에 식물을 확산시킵니다.
actors.hero.spells.hallowedground.desc=사제가 신성 마법을 근처 땅에 집중시켜 _%1%1 범위의 신성 영역을 _20턴_ 동안 창조합니다.\n\n시전 시 즉시 모든 동맹을 _15_ 치유하고(부상 없는 동맹과 사제는 보호막 획득), 적을 잠시 결속시키며 잔디를 확산시킵니다.\n\n신성 영역은 매 턴 동맹을 _1_ 치유하고(부상 없는 동맹과 사제는 보호막 획득), 적을 절름발이로 만들며 무작위로 높은 잔디를 생성합니다.\n\n신성 영역은 불에 의해 파괴됩니다. 또한 수동 회복이 비활성화되었거나 사제가 오랫동안 경험치를 얻지 못하면 신성 영역은 마른 잔디만 생성합니다.\n\n이 주문은 _1턴을 소모_합니다.
actors.hero.spells.hallowedground$hallowedterrain.desc=이곳이 신성 영역으로 변화했습니다. 신성 영역은 적을 감속하고 동맹을 치유하며 식물을 확산시킵니다.

actors.hero.spells.holyintuition.name=신성 직감
actors.hero.spells.holyintuition.prompt=아이템을 선택하세요
actors.hero.spells.holyintuition.cursed=이 아이템에 악의적인 마력이 숨어 있음을 느낍니다.
actors.hero.spells.holyintuition.uncursed=이 아이템은 저주받지 않았습니다.
actors.hero.spells.holyintuition.short_desc=아이템의 저주 여부를 감정합니다.
actors.hero.spells.holyintuition.desc=시전자가 아이템에 감각을 집중하여 장착하지 않고도 저주 여부를 판별합니다.\n\n이 주문은 _1턴을 소모_합니다.

actors.hero.spells.holylance.name=신성 창
actors.hero.spells.holylance.short_desc=높은 원거리 마법 피해를 줍니다.
actors.hero.spells.holylance.desc=사제가 대량의 에너지를 치명적인 투척용 성창으로 응집합니다. 성창은 _%1~%2 피해_를 주며, 언데드와 악마 대상에게는 반드시 최대 피해를 줍니다.\n\n이 주문은 충전 소모가 매우 높으며 _30턴의 재사용 대기시간_이 있습니다.\n\n이 주문은 _1턴을 소모_합니다.
actors.hero.spells.holylance$lancecooldown.name=신성 창 쿨다운
actors.hero.spells.holylance$lancecooldown.desc=사제가 최근 신성 창을 시전했습니다. 다시 시전하려면 기다려야 합니다.\n\n남은 턴: %s

actors.hero.spells.holyward.name=신성 갑옷
actors.hero.spells.holyward.glyph_name=신성 %s
actors.hero.spells.holyward.glyph_desc=이 각인이 갑옷이 방어할 수 있는 피해량을 약간 증가시킵니다.
actors.hero.spells.holyward.short_desc=임시로 각인을 덮어써서 갑옷 방어를 강화합니다.
actors.hero.spells.holyward.desc=시전자가 착용한 갑옷에 신성 각인을 부여하여 갑옷 방어력을 _1_ 증가시킵니다. 이 주문은 시간을 소모하지 않습니다.\n\n이 각인은 _50턴_ 동안 지속되며, 지속 시간 동안 갑옷의 기존 긍정적 각인을 덮어씁니다. 시전자는 갑옷이 없어도 신성 각인 효과를 발동시킬 수 있습니다.\n\n이 주문은 _시간을 소모하지 않습니다_.
actors.hero.spells.holyward.desc_paladin=_성기사가 이 주문을 시전할 때 더 강력해집니다._ 신성 방어구의 추가 피해 방어가 _3_으로 증가하며 기존의 마법 부여를 덮어쓰지 않습니다. 신성 방어구가 활성화된 상태에서 다른 주문을 시전할 때 사용하는 충전 1점마다 10턴씩 효과가 연장됩니다.
actors.hero.spells.holyward$holyarmbuff.name=신성 갑옷
actors.hero.spells.holyward$holyarmbuff.desc=시전자가 착용한 갑옷에 신성 각인을 부여하여, 기존 각인을 임시로 덮어쓰고 갑옷이 피해를 1 추가 방어하게 합니다.\n\n남은 턴: %s
actors.hero.spells.holyward$holyarmbuff.desc_paladin=성기사가 착용한 갑옷에 신성 각인을 부여하여 갑옷이 피해를 3 추가 방어하게 합니다.\n\n신성 갑옷 효과 중 다른 주문을 시전할 때 소모된 충전 1당 주문 효과가 10턴 연장됩니다.\n\n남은 턴: %s

actors.hero.spells.holyweapon.name=신성 무기
actors.hero.spells.holyweapon.ench_name=신성 %s
actors.hero.spells.holyweapon.ench_desc=신성 무기에 공격당한 적은 추가 마법 피해를 받습니다.
actors.hero.spells.holyweapon.short_desc=임시로 마법부여를 덮어써서 무기 피해를 강화합니다.
actors.hero.spells.holyweapon.desc=시전자가 손에 든 무기에 신성 마법부여를 부여하여 무기가 적을 공격할 때마다 추가로 _2 마법 피해_를 줍니다. 이 주문은 시간을 소모하지 않습니다.\n\n이 마법부여는 _50턴_ 동안 지속되며, 지속 시간 동안 무기의 기존 긍정적 마법부여를 덮어씁니다. 맨손 공격도 신성 마법부여 효과를 발동시킬 수 있습니다.\n\n이 주문은 _시간을 소모하지 않습니다_.
actors.hero.spells.holyweapon.desc_paladin=_성기사가 이 주문을 시전할 때 더 강력해집니다._ 신성 무기의 추가 마법 피해가 _6_으로 증가하며 기존의 마법 부여를 덮어쓰지 않습니다. 신성 무기가 활성화된 상태에서 다른 주문을 시전할 때 사용하는 충전 1점마다 10턴씩 효과가 연장됩니다.
actors.hero.spells.holyweapon.runemark=_룬마법사_가 신성 마법부여가 저장된 문장을 폭파시킬 때 일정 확률로 축복을 얻을 수 있습니다.
actors.hero.spells.holyweapon$holywepbuff.name=신성 무기
actors.hero.spells.holyweapon$holywepbuff.desc=시전자가 손에 든 무기에 신성 마법부여를 부여하여, 기존 마법부여를 임시로 덮어쓰고 무기 공격마다 2의 추가 마법 피해를 줍니다.\n\n남은 턴: %s
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=성기사가 손에 든 무기에 신성 마법부여를 부여하여 공격마다 6의 추가 마법 피해를 줍니다.\n\n신성 무기 효과 중 다른 주문을 시전할 때 소모된 충전 1당 주문 효과가 10턴 연장됩니다.\n\n남은 턴: %s

actors.hero.spells.judgement.name=종말의 심판
actors.hero.spells.judgement.short_desc=시야 내 모든 적에게 피해를 줍니다.
actors.hero.spells.judgement.desc=사제가 하늘을 찢고 성광의 이름으로 시야 내 모든 적을 심판합니다. 주문은 _%1~%2 피해_를 기본으로 주며, 사제가 초승에 들어간 이후(또는 마지막 종말의 심판 시전 이후)의 시전 횟수당 추가로 _33%%_ 피해를 줍니다.\n\n현재 종말의 심판이 _%3~%4 피해_를 줍니다.\n\n이 주문은 _1턴을 소모_합니다.

actors.hero.spells.layonhands.name=성스러운 손길
actors.hero.spells.layonhands.short_desc=근처 대상을 즉시 치유하거나 성기사가 보호막을 얻습니다.
actors.hero.spells.layonhands.desc=성기사가 손을 통해 신성 에너지를 인도하여 닿는 모든 대상을 치유하거나 보호합니다.\n\n성기사는 이 주문을 시전하여 근처 모든 대상에게 _%1 치유_를 주거나, 자신에게 _%1 보호막_을 얻을 수 있습니다. 초과 치유는 보호막으로 전환됩니다.\n\n이 주문은 즉시, 반복 시전할 수 있지만, 세 번 시전 값 이상의 보호막을 즉시 부여할 수는 없습니다.\n\n이 주문은 _시간을 소모하지 않습니다_.

actors.hero.spells.lifelinkspell.name=피의 인연
actors.hero.spells.lifelinkspell.short_desc=동맹과 받는 피해를 공유하고 피해 감소를 부여합니다.
actors.hero.spells.lifelinkspell.desc=사제가 자신과 강화된 동맹 사이의 생명 결속을 강화합니다. 이 강화된 생명 결속은 _%1 동안 지속되며, 영웅과 동맹이 받는 모든 피해를 공유하고 만물일심의 피해 감소를 _%2%%_까지 높입니다. 피해 공유는 갑옷보다 우선순위가 낮지만 만물일심의 피해 감소보다는 높습니다.\n\n생명 결속이 효과 중일 때, 한쪽에 시전된 3단계 이하의 사제 버프 주문은 양쪽 모두에 효과가 있습니다.\n\n이 주문은 _1턴을 소모_합니다.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=피의 인연
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=사제가 최근 이 동맹에게 피의 인연을 시전하여 생명 결속을 확립했습니다.\n\n생명 결속의 일반 효과 외에도 이 대상은 피해 감소를 얻으며, 사제 버프 주문이 사제와 이 동맹에게 시전될 때 양쪽 모두에 적용됩니다. 또한 만물일심은 이 효과가 지속되는 동안 종료되지 않습니다.\n\n남은 턴: %s

actors.hero.spells.mindform.name=지의 위격
actors.hero.spells.mindform.short_desc=삼위일체의 지팡이 또는 투척 무기를 선택합니다.
actors.hero.spells.mindform.desc=사제가 이번 게임에서 이미 감정한 지팡이 또는 투척 무기를 선택하여 삼위일체가 그 효과를 형상화하게 합니다.\n\n삼위일체 사용 시 사제는 선택한 아이템의 _%d레벨_ 단일 공격 효과를 사용합니다. 이 공격은 해당 아이템을 정상 사용할 때 발동하는 모든 효과를 발동시킵니다.\n\n이 주문은 삼위일체가 현재 형상화한 지의 위격 효과를 갱신합니다.\n\n이 주문은 _시간을 소모하지 않습니다_.

actors.hero.spells.mnemonicprayer.name=기원의 시편
actors.hero.spells.mnemonicprayer.short_desc=동맹/적의 버프/디버프를 연장하고 성휘를 다시 부여합니다.
actors.hero.spells.mnemonicprayer.desc=사제가 특정 대상의 모든 버프 또는 디버프를 _%1 연장하는 기원을 낭독합니다. 버프는 동맹(사제 자신 포함)에게 더 오래 지속되고, 디버프는 적에게 더 오래 지속됩니다.\n\n기원의 시편은 특정 대상의 버프 또는 디버프를 한 번만 연장할 수 있으며, 갑옷 기술의 버프는 연장할 수 없습니다.\n\n이 주문은 _시간을 소모하지 않습니다_.

actors.hero.spells.radiance.name=파효 광휘
actors.hero.spells.radiance.short_desc=시야 내 적에게 성휘를 발동 및 부여하고 일시적으로 기절시킵니다.
actors.hero.spells.radiance.desc=사제가 전신에서 성광을 발산하여 시야 내 모든 적을 _3턴_ 동안 기절시킵니다. 적이 이미 성휘를 보유했다면 주문이 성휘의 추가 피해를 발동시킨 후 다시 성휘를 부여합니다. 이 층의 시야가 어두우면 사제가 _100턴_ 동안 발광합니다.\n\n이 주문은 _1턴을 소모_합니다.

actors.hero.spells.recallinscription.name=권장 주문
actors.hero.spells.recallinscription.short_desc=최근 사용한 마법석 또는 두루마리 효과를 재사용합니다.
actors.hero.spells.recallinscription.desc=시전자가 신성 마법을 사용하여 최근 사용한 마법석을 복제하고 _%s_턴 전에 사용한 두루마리 또는 마법석의 마법 효과를 다시 발동시킵니다.\n\n권장 주문은 업그레이드 두루마리, 변이 두루마리, 승화 비전서 효과를 다시 발동시킬 수 없습니다. 충전 소모는 최근 사용한 아이템에 따라 달라집니다: 마법석 2충전, 두루마리 3충전, 비전서 4충전. 변이 두루마리 또는 변이/업그레이드 두루마리의 마법석/비전서 효과를 발동시킬 때 충전 소모가 두 배가 됩니다.\n\n이 주문은 _1턴을 소모_합니다.
actors.hero.spells.recallinscription$useditemtracker.name=최근 사용한 마법석
actors.hero.spells.recallinscription$useditemtracker.desc=시전자가 최근 권장 주문 효과와 호환되는 아이템을 사용했습니다. 주문을 시전하여 아이템 효과를 다시 발동시킬 수 있습니다.\n\n사용한 아이템: %1\n\n남은 턴: %2

actors.hero.spells.shieldoflight.name=신성 보호막
actors.hero.spells.shieldoflight.short_desc=단일 대상에게만 적용되는 임시 갑옷을 얻습니다.
actors.hero.spells.shieldoflight.desc=시전자가 자신과 적 사이에 약한 성방패를 창조하여 _5턴_ 동안 해당 적에 대한 갑옷 방어력을 _%1~%2 증가시킵니다.\n\n이 주문은 _시간을 소모하지 않지만_ 여러 대상을 동시에 사용할 수 없습니다.
actors.hero.spells.shieldoflight$shieldoflighttracker.name=신성 보호막
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=약한 성방패가 이 대상과 적 사이에 있습니다. 성방패의 강도는 공격을 완전히 방어하기에 충분하지 않지만 약화시킬 수 있습니다.\n\n남은 턴: %s

actors.hero.spells.spiritform.name=혼의 위격
actors.hero.spells.spiritform.short_desc=삼위일체의 반지 또는 유물을 선택합니다.
actors.hero.spells.spiritform.desc=사제가 이번 게임에서 이미 감정한 반지 또는 유물(신성 법전 제외)을 선택하여 삼위일체가 그 효과를 형상화하게 합니다.\n\n선택한 아이템이 반지인 경우, 삼위일체는 선택한 반지의 _%1 효과를 _20턴_ 동안 얻습니다.\n\n선택한 아이템이 유물인 경우, 삼위일체는 선택한 유물의 _%2 효과를 복제합니다. 삼위일체가 유물을 사용할 때의 구체적인 효과와 갑옷 충전 소모는 유물에 따라 다릅니다.\n\n이 주문은 삼위일체가 현재 형상화한 혼의 위격 효과를 갱신합니다.\n\n이 주문은 _시간을 소모하지 않습니다_.
actors.hero.spells.spiritform$spiritformbuff.name=혼의 위격
actors.hero.spells.spiritform$spiritformbuff.desc=위격 주문 혼의 위격이 아이템의 효과를 제공하여, 마치 장비 칸에 장착한 것처럼 작용합니다.\n\n참고로 혼의 위격은 이미 장착한 장비의 효과를 복제할 수 없습니다.\n\n현재 효과: %1\n\n남은 턴: %2

actors.hero.spells.smite.name=지성 참격
actors.hero.spells.smite.short_desc=추가 피해와 마법부여 강화가 있는 필중 공격입니다.
actors.hero.spells.smite.desc=성기사가 정의의 힘을 치명적인 근접 공격에 주입합니다.\n\n정상 근접 피해에 더해, 지성 참격은 힘 요구치 이하의 공격이 반드시 명중하고 _300%%_의 마법부여 강화와 _%1~%2 추가 마법 피해_를 줍니다.\n\n지성 참격의 추가 마법 피해는 성기사의 레벨에 따라 성장하며, 악마와 언데드 적에게는 반드시 최대 추가 마법 피해를 줍니다.\n\n이 주문은 _1턴을 소모_합니다.

actors.hero.spells.stasis.name=성계 투영
actors.hero.spells.stasis.short_desc=동맹을 지하 감옥 밖으로 이동시키고 상태를 정지합니다.
actors.hero.spells.stasis.desc=사제가 아군과의 연결을 자신에게 집중시켜, 아군을 일시적으로 사제 체내의 정체된 에너지 상태로 변화시킵니다. 아군은 최대 _%d턴_ 동안 정체되며, 정체 상태에서는 모든 긍정 효과가 시간의 영향을 받지 않습니다.\n\n주문 효과가 자연스럽게 종료되면 아군이 사제 근처에 나타나며, 사제는 소모 없이 즉시 이 주문을 다시 시전하여 효과를 조기 종료할 수 있습니다. 별계 투사는 움직일 수 없는 아군도 이동시킬 수 있지만, 층을 넘어 이동시킬 수는 없습니다.\n\n이 주문은 시전에 _1턴_이 소모됩니다.
actors.hero.spells.stasis$stasisbuff.name=성계 투영
actors.hero.spells.stasis$stasisbuff.left_behind=이동할 수 없는 동맹이 뒤에 남겨졌습니다.
actors.hero.spells.stasis$stasisbuff.desc=사제가 현재 성계 투영으로 동맹을 정지 상태로 두고 있습니다. 이 동맹의 만물일심을 포함한 모든 긍정적 효과가 정지되며, 주문 효과 종료 시 동맹이 사제 근처에 다시 나타납니다. 주문 효과는 성계 투영을 다시 시전하여 조기 종료할 수 있습니다.\n\n정지된 동맹: %1\n남은 턴: %2

actors.hero.spells.sunray.name=양광선
actors.hero.spells.sunray.short_desc=원거리 마법 피해를 주고 대상을 한 번 실명시킵니다.
actors.hero.spells.sunray.desc=시전자가 대상에게 실명 광선을 발사하여 _%1~%2 피해_를 주고 _%3 동안 실명시킵니다. 양광선은 언데드와 악마 대상에게 반드시 최대 피해를 줍니다.\n\n이 주문에 맞은 적은 시각을 조절하여 다시 실명되지 않도록 합니다. 그러나 실명 후 다시 이 주문에 맞으면, 압도적인 강광이 실명 대신 마비를 일으킵니다.\n\n이 주문은 _1턴을 소모_합니다.

actors.hero.spells.walloflight.name=신성 장벽
actors.hero.spells.walloflight.short_desc=적을 차단하는 장벽을 창조합니다.
actors.hero.spells.walloflight.desc=성기사가 성광을 벽으로 응집하여 전방에 _1타일_ 두께, _%1 너비의 신성 장벽을 _20턴_ 동안 창조합니다.\n\n신성 장벽은 시야를 차단하지 않는 것을 제외하고 일반 벽과 동일합니다. 장벽 생성 시 장벽에 갇힌 적은 잠시 기절하며 조건이 허락되면 밀쳐집니다. 장벽에 걸린 모든 것은 꺼낼 수 있습니다.\n\n신성 장벽은 8방향으로 시전할 수 있습니다. 이미 장벽이 존재하면 이 주문을 무료로 다시 사용하여 즉시 장벽을 해제할 수 있습니다.\n\n이 주문은 _1턴을 소모_합니다.
actors.hero.spells.walloflight.early_end=신성 장벽을 해제했습니다.
actors.hero.spells.walloflight$lightwall.desc=신성 장벽이 이곳의 통로를 막고 있습니다.

##main hero
actors.hero.hero.name=당신
actors.hero.hero.leave=아직 떠날 수 없습니다. 지하 감옥에 묻힌 명예가 당신을 부르고 있습니다!
actors.hero.hero.level_up=레벨 업!
actors.hero.hero.new_level=레벨 업! 명중률, 회피율, 최대 생명력이 증가합니다!
actors.hero.hero.new_talent=재능 포인트 +1!
actors.hero.hero.unspent=아직 사용하지 않은 재능 포인트가 있습니다!
actors.hero.hero.level_cap=더 이상 강해질 수 없지만, 경험치가 당신에게 힘을 줍니다!
actors.hero.hero.you_now_have=획득: %s.
actors.hero.hero.you_cant_have=휴대할 수 없습니다: %s.
actors.hero.hero.locked_chest=상자가 잠겨 있고 열쇠가 없습니다.
actors.hero.hero.locked_door=해당하는 열쇠가 없습니다.
actors.hero.hero.noticed_smth=무언가를 발견했습니다.
actors.hero.hero.wait=...
actors.hero.hero.search=수색
actors.hero.hero.search_distracted=집중할 수 없어 주변 수색이 매우 어렵습니다.
actors.hero.hero.key_distracted=자물쇠를 열지 못했습니다. 다시 시도해야 합니다.
actors.hero.hero.pain_resist=고통이 졸음을 이겨내게 합니다.
actors.hero.hero.revive=환생 십자장에서 생명의 에너지가 폭발합니다!

##classes
actors.hero.heroclass.warrior=전사
actors.hero.heroclass.warrior_desc_short=전사는_파손된 문장_으로 보호막을 생성하여 추가 피해를 줄입니다. 문장은 갑옷 간에 이동할 수 있으며 _1단계 업그레이드를 담을 수 있습니다_.
actors.hero.heroclass.warrior_desc=전사는_독특한 파손된 문장_을 가지고 시작하며, 문장이 부착된 갑옷을 착용하면 시간이 지나면서 생명력 위에 보호막을 생성합니다. 문장은 갑옷 간에 이동할 수 있으며 1단계 업그레이드를 담을 수 있습니다.\n\n전사는 더 높은 힘을 가져 _더 무거운 장비를 더 쉽게 사용_할 수 있습니다.\n\n전사는 _낡은 단검_, _돌 세 개_, 천 갑옷, 물 주머니, 천 주머니를 가지고 시작합니다.\n\n전사가 시작 시 감정한 아이템:\n_-_ 치유 물약\n_-_ 변이 두루마리, 감정 두루마리, 격노 두루마리
actors.hero.heroclass.warrior_unlock=전사는 시작부터 잠금 해제되어 있습니다.

actors.hero.heroclass.mage=마법사
actors.hero.heroclass.mage_desc_short=마법사는 비전 전문가로, 지팡이보다 강력한_마법봉_을 가지고 시작합니다. 마법봉은 발견한 _모든 지팡이_를 주입할 수 있습니다.
actors.hero.heroclass.mage_desc=마법사는_독특한 마법봉_을 가지고 시작합니다. 마법봉의 자동 충전 속도는 일반 지팡이보다 눈에 띄게 빠르며 최대 충전이 1 높습니다. 마법사는 지하 감옥에서 찾은 다양한 지팡이를 마법봉에 주입할 수 있습니다.\n\n마법사는 마법봉에 주입된_마탄 지팡이_, 천 갑옷, 물 주머니, 천 주머니를 가지고 시작합니다.\n\n마법사가 시작 시 감정한 아이템:\n_-_ 액화 불 물약\n_-_ 변이 두루마리, 감정 두루마리, 업그레이드 두루마리
actors.hero.heroclass.mage_unlock=_업그레이드 두루마리로 아이템을 강화_하여 마법사를 잠금 해제하세요.

actors.hero.heroclass.rogue=도적
actors.hero.heroclass.rogue_desc_short=도적은_그림자 망토_로 은신하고 적을 기습할 수 있습니다. 더 먼 거리에서_비밀과 함정을 탐지_하고 _층 출구의 위치_를 바로 알 수 있습니다.
actors.hero.heroclass.rogue_desc=도적은_독특한 그림자 망토_를 가지고 시작합니다. 착용하면 도적이 언제든지 투명화할 수 있습니다.\n\n도적은 더 먼 거리에서 _비밀과 함정을 탐지_하고 _층 출구의 위치_를 바로 알 수 있습니다.\n\n도적은_단검_, _비수 세 개_, 천 갑옷, 물 주머니, 천 주머니를 가지고 시작합니다.\n\n도적이 시작 시 감정한 아이템:\n_-_ 투명화 물약\n_-_ 변이 두루마리, 감정 두루마리, 지형 탐사 두루마리
actors.hero.heroclass.rogue_unlock=_한 게임에서 10회 기습_하여 도적을 잠금 해제하세요.

actors.hero.heroclass.huntress=여사냥꾼
actors.hero.heroclass.huntress_desc_short=여사냥꾼은 투척 무기에 능숙하며 무한히 발사할 수 있는_정신력 활_을 가지고 있습니다. 높은 잔디를_짓밟지 않고 통과_할 수 있습니다.
actors.hero.heroclass.huntress_desc=여사냥꾼은_독특한 정신력 활_을 가지고 시작하며, 마법 화살을 무한히 발사할 수 있습니다.\n\n여사냥꾼은 높은 잔디를_짓밟지 않고 통과_할 수 있습니다.\n\n여사냥꾼은_박힌 장갑_, 천 갑옷, 물 주머니, 천 주머니를 가지고 시작합니다.\n\n여사냥꾼이 시작 시 감정한 아이템:\n_-_ 정신 시야 물약\n_-_ 변이 두루마리, 감정 두루마리, 최면 두루마리
actors.hero.heroclass.huntress_unlock=_한 게임에서 투척 무기로 10회 적 명중_하여 여사냥꾼을 잠금 해제하세요.

actors.hero.heroclass.duelist=결투사
actors.hero.heroclass.duelist_desc_short=결투사는 무기 마스터로, 무기로_독특한 무예_를 사용할 수 있습니다. 무예는_무기에 따라 다릅니다_.
actors.hero.heroclass.duelist_desc=결투사는_독특은 검_을 가지고 시작하며, 시간이 지나면서 자연 충전되는 특수 무예를 보유합니다.\n\n결투사는 지하 감옥의 모든 무기를 들 때_다른 무예_를 가집니다.\n\n결투사는_투척 바늘 두 개_, 천 갑옷, 물 주머니, 천 주머니를 가지고 시작합니다.\n\n결투사가 시작 시 감정한 아이템:\n_-_ 힘 물약\n_-_ 변이 두루마리, 감정 두루마리, 분신 두루마리
actors.hero.heroclass.duelist_unlock=_힘 요구치를 충족하는 2단계 이상 무기 장착_하여 결투사를 잠금 해제하세요.

actors.hero.heroclass.cleric=사제
actors.hero.heroclass.cleric_desc_short=사제는_신성 법전_으로 신성 마법을 인도하는 신성 시전자입니다. 재능을 통해_주문을 배우고 업그레이드_할 수 있습니다.
actors.hero.heroclass.cleric_desc=사제는_독특한 신성 법전_을 가지고 시작하여 다양한 주문을 시전할 수 있습니다.\n\n사제의 대부분의 재능은_주문 학습 또는 업그레이드_에 집중되어 있습니다.\n\n사제는_지팡이_, 천 갑옷, 물 주머니, 천 주머니를 가지고 시작합니다.\n\n사제가 시작 시 감정한 아이템:\n_-_ 정화 물약\n_-_ 변이 두루마리, 감정 두루마리, 제거 두루마리
actors.hero.heroclass.cleric_unlock=_저주받은 장비 하나의 저주를 완전히 정화_하여 사제를 잠금 해제하세요.

actors.hero.herosubclass.berserker=광전사
actors.hero.herosubclass.berserker_short_desc=_광전사_는 피해를 입으면 분노를 쌓습니다. 분노는 공격력을 높이고 100%%에 도달하면 추가 보호막을 활성화합니다.
actors.hero.herosubclass.berserker_desc=광전사는 물리 피해를 입을 때(갑옷이 막은 피해도 포함!) 분노를 얻습니다! 분노는 시간이 지나면서 꾸준히 감소하지만, 생명력이 낮을 때는 더 천천히 감소합니다.\n\n분노는 최대 50%의 추가 피해를 제공할 수 있습니다. 분노가 가득 차면 광전사가 광폭화하여 폭발적인 보호막을 얻고, 보호막이 남아 있는 동안 분노가 유지됩니다. 보호막은 광전사의 갑옷 레벨에 따라 증가하며 생명력이 낮을 때 크게 강화됩니다. 광폭화 후에는 잠시 휴식이 필요합니다.\n\n이 특성은 100% 분노 시 특수 능력을 가집니다. 여러 특수 능력을 가질 때는 단축키를 길게 눌러 전환할 수 있습니다._무작위 모드_에서 파손된 문장이 없는 상태로 이 특성을 선택하면 파손된 문장을 얻습니다.

actors.hero.herosubclass.gladiator=검투사
actors.hero.herosubclass.gladiator_short_desc=_검투사_는 공격 성공 시 연속 공격을 쌓습니다. 연속 공격을 소모하여 특수 전술을 사용할 수 있습니다.
actors.hero.herosubclass.gladiator_desc=검투사가 근접 무기 또는 투척 무기로 적을 명중시킬 때마다 연속 공격 1을 쌓습니다. 5턴(처치 후 15턴) 내에 명중하지 못하면 연속 공격이 초기화됩니다.\n\n연속 공격을 쌓으면 다양한 반드시 명중하는 연속 공격 전술을 사용할 수 있습니다:\n2연속: 적 밀쳐내기, 연속 유지\n4연속: 방어력 기반 피해\n6연속: 공격 받아 넘기기, 연속 유지\n8연속: 대상과 주변 적 공격\n10연속: 연속당 1회 공격\n\n이 특성은 연속 공격 축적 시 특수 능력을 가집니다. 여러 특수 능력을 가질 때는 단축키를 길게 눌러 전환할 수 있습니다._무작위 모드_에서 파손된 문장이 없는 상태로 이 특성을 선택하면 파손된 문장을 얻습니다.

actors.hero.herosubclass.battlemage=전투 마법사
actors.hero.herosubclass.battlemage_short_desc=_전투 마법사_는 마법봉으로 근접 공격 시 추가 주문 효과를 부여합니다. 효과는 마법봉에 주입된 지팡이 종류에 따라 다릅니다.
actors.hero.herosubclass.battlemage_desc=전투 마법사가 마법봉으로 근접 공격 시 마법부여와 유사한 추가 효과를 부여하며, 효과는 주입된 지팡이 종류에 따라 다양합니다. 마법봉 근접 공격은 충전 0.5를 회복시킵니다.\n\n_무작위 모드_에서 마법사의 마법봉이 없는 상태로 이 특성을 선택하면 무작위 지팡이가 주입된 마법봉을 얻습니다.

actors.hero.herosubclass.warlock=흑마법사
actors.hero.herosubclass.warlock_short_desc=_흑마법사_는 지팡이 사용 시 일정 확률로 적의 영혼을 표식합니다. 표식된 적에게 물리 피해를 입힐 때마다 생명력을 회복합니다.
actors.hero.herosubclass.warlock_desc=흑마법사가 지팡이를 사용할 때 일정 확률로 영혼 표식을 부여합니다. 표식 부여 확률과 지속 시간은 지팡이 레벨에 따라 증가합니다.\n\n흑마법사가 표식된 적을 공격할 때 5 피해당 2의 생명력을 회복합니다. 이 효과는 물리 공격에만 적용되며 지팡이 시전 피해에는 적용되지 않습니다!

actors.hero.herosubclass.assassin=암살자
actors.hero.herosubclass.assassin_short_desc=투명 상태에서_암살자_는 치명적인 공격을 준비합니다. 오래 기다릴수록 공격이 더 강력해집니다.
actors.hero.herosubclass.assassin_desc=암살자는 투명 상태에서 강력한 일격을 준비합니다. 준비 시간이 길수록 다음 공격이 더 치명적입니다. 준비 단계는 최대 9턴까지 누적됩니다.\n\n충분히 준비되면 암살자의 다음 공격은 추가 피해를 주고, 대상에게 순간 이동하며, 충분히 약한 적을 즉시 처치할 수 있습니다.\n\n이 특성은 투명 상태에서 특수 능력을 가집니다. 여러 특수 능력을 가질 때는 단축키를 길게 눌러 전환할 수 있습니다._무작위 모드_에서 그림자 망토가 없는 상태로 이 특성을 선택하면 그림자 망토를 얻습니다.

actors.hero.herosubclass.freerunner=질주자
actors.hero.herosubclass.freerunner_short_desc=_질주자_는 달릴 때 모멘텀을 축적합니다. 모멘텀을 사용하여 질주 효과를 활성화하고 속도와 회피 보너스를 얻습니다.
actors.hero.herosubclass.freerunner_desc=질주자는 달릴 때 모멘텀을 축적합니다. 이동할 때마다 모멘텀 1을 얻으며 최대 10까지 축적할 수 있고, 움직이지 않으면 빠르게 감소합니다. 모멘텀은 질주 상태를 활성화하는 데 사용되며, 모멘텀 1당 2턴의 질주를 얻습니다.\n\n질주 상태의 질주자는 2배 속도로 달리며 레벨에 비례한 추가 회피를 얻습니다. 질주 종료 후에는 잠시 휴식하여 모멘텀을 다시 축적해야 합니다.\n\n이 특성은 모멘텀 축적 시 특수 능력을 가집니다. 여러 특수 능력을 가질 때는 단축키를 길게 눌러 전환할 수 있습니다.

actors.hero.herosubclass.sniper=저격수
actors.hero.herosubclass.sniper_short_desc=_저격수_의 원거리 공격이 방어구를 관통합니다. 투척 무기로 적을 맞힌 후 정신력 활로 특수 추격을 할 수 있습니다.
actors.hero.herosubclass.sniper_desc=저격수는 원거리 전투의 달인으로, 원거리 공격이 적의 방어구를 무시합니다. 투척 무기로 적을 맞힌 후 저격 표식을 부여하여 정신력 활로 추격을 할 수 있습니다. 추격의 형태는 활의 강화 방식에 따라 다릅니다.\n\n강화되지 않은 활은 피해가 약간 낮지만 시간을 소모하지 않는 속사를 발사합니다. 속도 강화 활은 세 발을 연사하며 각 화살은 피해는 낮지만 마법부여를 발동시킬 수 있고 1턴을 소모합니다. 피해 강화 활은 반드시 명중하는 저격 화살을 발사하여 거리 기반 추가 피해를 주며 2턴을 소모합니다.\n\n이 특성은 저격 표식 부여 시 특수 능력을 가집니다. 여러 특수 능력을 가질 때는 단축키를 길게 눌러 전환할 수 있습니다._무작위 모드_에서 정신력 활이 없는 상태로 이 특성을 선택하면 정신력 활을 얻습니다.

actors.hero.herosubclass.warden=파수꾼
actors.hero.herosubclass.warden_short_desc=_파수꾼_은 높은 잔디를 꿰뚫어 볼 수 있으며, 식물을 심고 밟을 때 추가 효과를 얻습니다.
actors.hero.herosubclass.warden_desc=파수꾼은 자연의 힘과 강력한 연결을 가지고 있어 식물과 관련된 여러 능력을 가집니다. 파수꾼은 높은 잔디와 마른 잔디를 꿰뚫어 볼 수 있습니다.\n\n파수꾼이 심은 씨앗 주변에는 잔디가 자라며, 식물을 밟을 때 원래 효과 대신 추가 효과를 얻어 모든 식물이 완전히 무해해집니다.\n\n_무작위 모드_에서 높은 잔디 통과 시 여전히 짓밟히는 경우, 이 특성을 선택하면 더 이상 짓밟지 않게 됩니다.

actors.hero.herosubclass.champion=용사
actors.hero.herosubclass.champion_short_desc=_용사_는 두 무기를 휘두를 수 있으며 더 많은 무예 충전을 가집니다. 주 무기로 일반 공격을 하지만 보조 무기로 자유롭게 전환하고 두 무기의 각각 무예를 사용할 수 있습니다.
actors.hero.herosubclass.champion_desc=용사는 근접 무기를 능숙하게 다루며, 주 무기 외에 보조 무기를 하나 더 장착할 수 있습니다. 용사는 주 무기로 일반 공격을 하지만 시간을 소모하지 않고 주/보조 무기를 전환할 수 있으며 두 무기의 각각 무예를 사용할 수 있습니다.\n\n또한 무예 충전 상한이 2 높고 무예 충전 회복 속도가 50% 증가합니다.\n\n이 특성은 주/보조 무기 전환 가능 시 특수 능력을 가집니다. 여러 특수 능력을 가질 때는 단축키를 길게 눌러 전환할 수 있습니다._무작위 모드_에서 무예를 사용할 수 없는 경우 이 특성을 선택하면 무예 사용에 능숙해집니다.

actors.hero.herosubclass.monk=무사
actors.hero.herosubclass.monk_short_desc=_무사_는 전투 중 내공을 축적하여 여러 무공을 사용할 수 있습니다.
actors.hero.herosubclass.monk_desc=무사의 무술 조예는 매우 깊습니다. 적을 처치할 때 내공을 축적하여 여러 방어적 및 기능적 능력을 사용할 수 있습니다. 내공은 시간이 지나도 사라지지 않지만 무사 레벨에 기반한 저장 상한이 있습니다.\n\n1 내공: 빠른 주먹 연속 타격\n2 내공: 정신 집중, 다음 공격 회피\n3 내공: 순간 이동, 근처 위치로 돌진\n4 내공: 힘 모은 발차기, 근처 적 밀쳐내기\n5 내공: 상태 제거, 지팡이/유물 충전\n\n이 특성은 내공 축적 시 특수 능력을 가집니다. 여러 특수 능력을 가질 때는 단축키를 길게 눌러 전환할 수 있습니다.

actors.hero.herosubclass.priest=사제
actors.hero.herosubclass.priest_short_desc=_사제_는 새로운 원거리 주문과 강화된 신도의 빛을 얻습니다.
actors.hero.herosubclass.priest_desc=사제가 원거리 공격과 마법 아이템 호환성을 중점으로 한 일련의 새로운 업그레이드 주문을 얻습니다.\n\n사제는 50턴마다 한 번 _신도의 빛_을 무료로 시전할 수 있으며, 대상 적에게 성휘를 부여하고 동맹, 지팡이 및 일부 유물을 통해 성휘를 소모하여 사제 레벨+5의 추가 피해를 줄 수 있습니다.\n\n사제는 또한 주문 _파효 광휘_를 얻어 2 충전을 소모하여 어둠을 몰아내고, 시야 내 모든 적에게 성휘를 발동 및 부여하며 일시적으로 기절시킵니다.\n\n_무작위 모드_에서 신성 법전이 없는 상태로 이 특성을 선택하면 신성 법전을 얻습니다.

actors.hero.herosubclass.paladin=성기사
actors.hero.herosubclass.paladin_short_desc=_성기사_는 새로운 근접 주문과 강화된 신성 무기 및 신성 갑옷을 얻습니다.
actors.hero.herosubclass.paladin_desc=성기사가 근접 공격과 무기/갑옷 호환성을 중점으로 한 일련의 새로운 업그레이드 주문을 얻습니다.\n\n성기사의 주문 _신성 무기_와 _신성 갑옷_의 공방 보너스가 크게 강화되어 기존 마법부여와 각인을 덮어쓰지 않으며 다른 주문을 시전하여 지속 시간을 연장할 수 있습니다.\n\n성기사는 또한 주문 _지성 참격_을 얻어 추가 피해와 마법부여 강도가 있는 반드시 명중하는 근접 공격을 수행합니다.\n\n_무작위 모드_에서 신성 법전이 없는 상태로 이 특성을 선택하면 신성 법전을 얻습니다.

##talents
actors.hero.talent$provokedangertracker.name=도발된 분노
actors.hero.talent$provokedangertracker.desc=전사가 방금 보호막을 잃었습니다. 다음 물리 공격이 추가 피해를 줍니다.\n\n남은 턴: %s
actors.hero.talent$lingeringmagictracker.name=잔류 마력
actors.hero.talent$lingeringmagictracker.desc=마법사가 방금 마법봉이나 지팡이를 사용했습니다. 다음 물리 공격이 추가 피해를 줍니다.\n\n남은 턴: %s
actors.hero.talent$followupstriketracker.name=추가 타격
actors.hero.talent$followupstriketracker.desc=여사냥꾼이 최근 투척 무기로 공격했습니다. 같은 대상에 대한 다음 근접 공격이 피해 보너스를 얻습니다.\n\n남은 턴: %s
actors.hero.talent$patientstriketracker.name=침착한 일격
actors.hero.talent$patientstriketracker.desc=결투사가 방금 한 턴을 기다렸습니다. 다음 근접 공격이 추가 피해를 줍니다.
actors.hero.talent$improvisedprojectilecooldown.name=즉석 투척 쿨다운
actors.hero.talent$improvisedprojectilecooldown.desc=방금 이 재능을 사용했습니다. 다시 사용하려면 기다려야 합니다.\n\n남은 쿨다운: %s턴
actors.hero.talent$rejuvenatingstepscooldown.name=회춘의 걸음 쿨다운
actors.hero.talent$rejuvenatingstepscooldown.desc=방금 이 재능을 사용했습니다. 다시 사용하려면 기다려야 합니다.\n\n남은 쿨다운: %s턴
actors.hero.talent$seershotcooldown.name=탐지 사격 쿨다운
actors.hero.talent$seershotcooldown.desc=방금 이 재능을 사용했습니다. 다시 사용하려면 기다려야 합니다.\n\n남은 쿨다운: %s턴

actors.hero.talent.invigorating_meal.title=활력 식사
actors.hero.talent.invigorating_meal.desc=_+1：_여사냥꾼이 1턴만에 식사하며(베리류는 턴 소모 없음), _1턴의 신속_을 얻습니다.

_+2：_여사냥꾼이 1턴만에 식사하며(베리류는 턴 소모 없음), _2턴의 신속_을 얻습니다.
actors.hero.talent.invigorating_meal.comment=「여사냥꾼은 민첩하지만, 빨리 달리려면 배불리 먹어야 합니다。」
actors.hero.talent.liquid_nature.title=액체 자연
actors.hero.talent.liquid_nature.desc=_+1：_여사냥꾼이 물약을 마시거나 던질 때 주변에 _최대 4타일의 높은 잔디_가 자라며, 주변 적이 _1턴_ 동안 결속됩니다.

_+2：_최대 6타일의 높은 잔디, _2턴_ 결속.
actors.hero.talent.liquid_nature.comment=힘 물약, 경험치 물약 또는 이들로 만든 연금 아이템을 사용하면 효과가 두 배가 됩니다.
actors.hero.talent.rejuvenating_steps.title=회춘의 걸음
actors.hero.talent.rejuvenating_steps.desc=_+1：_여사냥꾼이 낮은 잔디/잔해를 밟으면 높은 잔디로 재생, _10턴_ 쿨다운.

_+2：__5턴_ 쿨다운.
actors.hero.talent.rejuvenating_steps.comment=수동 회복이 비활성화되었거나 경험치를 오래 못 얻으면 마른 잔디만 생성.
actors.hero.talent.heightened_senses.title=예리한 감각
actors.hero.talent.heightened_senses.desc=_+1：_주변 _2타일_ 내 모든 대상 정신 감지.

_+2：__3타일_.
actors.hero.talent.heightened_senses.comment=「사냥꾼의 직감。」
actors.hero.talent.durable_projectiles.title=투척 무기 관리
actors.hero.talent.durable_projectiles.desc=_+1：_투척 무기 _50% 추가 내구도_.

_+2：__75%_.
actors.hero.talent.durable_projectiles.comment=「뛰어난 사냥꾼은 무기 관리를 잘해야 합니다。」

actors.hero.talent.point_blank.title=근접 사격
actors.hero.talent.point_blank.desc=_+1：_근접 거리 투척/활 명중 보정 -50% → _-25%_.

_+2：_ → _정상_.

_+3：_ → _+25%_.
actors.hero.talent.seer_shot.title=탐지 사격
actors.hero.talent.seer_shot.desc=_+1：_화살로 땅을 맞추면 착탄 지점 3x3 시야 _5턴_.

_+2：__10턴_.

_+3：__15턴_.
actors.hero.talent.seer_shot.comment=재사용 대기시간 _20턴_.
actors.hero.talent.seer_shot.meta_desc=_다른 영웅이 얻으면_ 모든 투척 무기로 발동 가능.

actors.hero.talent.farsight.title=독수리 시야
actors.hero.talent.farsight.desc=_+1：_시야 _25%_ 확장.

_+2：__50%_.

_+3：__75%_.
actors.hero.talent.shared_enchantment.title=연동 마법부여
actors.hero.talent.shared_enchantment.desc=_+1：_투척 무기 _33%_로 정신력 활 마법부여 획득.

_+2：__67%_.

_+3：__100%_.
actors.hero.talent.shared_upgrades.title=연동 업그레이드
actors.hero.talent.shared_upgrades.desc=_+1：_업그레이드된 투척 무기 _레벨당_ 표식 시간 _1턴_ 증가, _단계x2.5%_ 특수 공격 피해.

_+2：__2턴_, _단계x5%_.

_+3：__3턴_, _단계x7.5%_.
actors.hero.talent.shared_upgrades.comment=명사수의 반지는 업그레이드로 간주되지 않음.

actors.hero.talent.durable_tips.title=지속성 약액
actors.hero.talent.durable_tips.desc=_+1：_약물 표창 _2배_ 내구도.

_+2：__3배_.

_+3：__4배_.
actors.hero.talent.barkskin.title=나무 껍질
actors.hero.talent.barkskin.desc=_+1：_풀숲에 있을 때, 파수꾼은 자신의 레벨에 비례하는 _0~50%_의 나무 껍질 효과를 얻으며, 해당 효과는 매 턴마다 감소합니다.\n\n_+2：_풀숲에 있을 때, 파수꾼은 자신의 레벨에 비례하는 _0~100%_의 나무 껍질 효과를 얻으며, 해당 효과는 매 턴마다 감소합니다.\n\n_+3：_풀숲에 있을 때, 파수꾼은 자신의 레벨에 비례하는 _0~150%_의 나무 껍질 효과를 얻으며, 해당 효과는 매 턴마다 감소합니다.

_+2：__0~100%_.

_+3：__0~150%_.
actors.hero.talent.shielding_dew.title=이슬 보호
actors.hero.talent.shielding_dew.desc=_+1：_생명력 만땅 시 이슬 -> 최대 생명력 _20%_ 보호막.

_+2：__40%_.

_+3：__60%_.

actors.hero.talent.fan_of_blades.title=엽도 부채
actors.hero.talent.fan_of_blades.desc=_+1：_영혼의 검 +_1_ 추가 대상, 50% 피해.

_+2：_+2, _60도_.

_+3：_+3, _90도_.

_+4：_+4, _120도_.
actors.hero.talent.projecting_blades.title=추적 검
actors.hero.talent.projecting_blades.desc=_+1：_명중률 +25%, 최대 _2타일_ 지형 관통.

_+2：_+50%, _4타일_.

_+3：_+75%, _6타일_.

_+4：_+100%, _8타일_.
actors.hero.talent.spirit_blades.title=정신력 검
actors.hero.talent.spirit_blades.desc=_+1：_30%_ 확률로 정신력 활 마법부여 추가 사용.

_+2：__60%_.

_+3：__90%_.

_+4：_100% + _10%_ 마법부여 강화.

actors.hero.talent.growing_power.title=성장하는 힘
actors.hero.talent.growing_power.desc=_+1：_자연의 힘 사격/이동 속도 보너스 33%/100% → _38%/125%_.

_+2：_→ _42%/150%_.

_+3：_→ _46%/175%_.

_+4：_→ _50%/200%_.
actors.hero.talent.natures_wrath.title=자연의 분노
actors.hero.talent.natures_wrath.desc=_+1：_자연의 힘 중 활 사격 _8%_ 확률로 유해 식물 효과.

_+2：__17%_.

_+3：__25%_.

_+4：__33%_.
actors.hero.talent.wild_momentum.title=자연의 화살
actors.hero.talent.wild_momentum.desc=_+1：_정신력 활 처치 시 자연의 힘 +_1턴_(최대 2).

_+2：_+2(최대 4).

_+3：_+3(최대 6).

_+4：_+4(최대 8).

actors.hero.talent.eagle_eye.title=독수리 감시
actors.hero.talent.eagle_eye.desc=_+1：_독수리 시야 6→_7타일_.

_+2：_→_8_.

_+3：_→_9_ + _2타일_ 정신 감지.

_+4：_→_10_ + _3타일_ 정신 감지.
actors.hero.talent.go_for_the_eyes.title=눈 공격
actors.hero.talent.go_for_the_eyes.desc=_+1：_독수리 할퀴기 → _2턴_ 실명.

_+2：__5턴_ 실명.

_+3：_5턴 실명 + _2턴_ 절름발이.

_+4：_5턴 실명 + _5턴_ 절름발이.
actors.hero.talent.swift_spirit.title=질풍의 혼
actors.hero.talent.swift_spirit.desc=_+1：_독수리 속도 턴당 2→_2.5타일_, 처음 _2회_ 회피.

_+2：_→_3타일_, _4회_ 회피.

_+3：_→_3.5타일_, _6회_ 회피.

_+4：_→_4타일_, _8회_ 회피.

actors.hero.talent.strengthening_meal.title=강화 식사
actors.hero.talent.strengthening_meal.desc=_+1：_식사 시 다음 _2회_ 물리 공격 +3 피해.

_+2：_다음 _3회_ 물리 공격 +3 피해.
actors.hero.talent.strengthening_meal.comment=「배불리 먹어야 싸울 힘이 납니다。」
actors.hero.talent.adventurers_intuition.title=탐험 직감
actors.hero.talent.adventurers_intuition.desc=_+1：_무기 감정 속도 _2.5배_, 갑옷 감정 _1.75배_.

_+2：_무기 _장착 시_ 즉시 감정, 갑옷 감정 _2.5배_.
actors.hero.talent.adventurers_intuition.comment=「백 가지 무기에 능통하다。」
actors.hero.talent.patient_strike.title=침착한 일격
actors.hero.talent.patient_strike.desc=_+1：_근접 공격 전 기다리면 _1~2_ 추가 피해.

_+2：__2_ 추가 피해.
actors.hero.talent.patient_strike.comment=「기를 가라앉히고, 주먹은 번개처럼。」
actors.hero.talent.aggressive_barrier.title=격투 보호막
actors.hero.talent.aggressive_barrier.desc=_+1：_생명력 50% 이하에서 무예 사용 시 _3_ 보호막.

_+2：__5_ 보호막.
actors.hero.talent.aggressive_barrier.comment=「위기 속에서 발휘되는 용사의 힘。」
actors.hero.talent.aggressive_barrier.meta_desc=_다른 영웅이 얻으면_ 저생명력 근접 공격 시 발동. 50턴 쿨다운.

actors.hero.talent.focused_meal.title=집중 식사
actors.hero.talent.focused_meal.desc=_+1：_1턴 식사, _0.67_ 무예 충전 회복.

_+2：__1_ 무예 충전 회복.
actors.hero.talent.focused_meal.comment=「백 가지 무예도 밥을 먹어야 쓸 수 있다。」
actors.hero.talent.focused_meal.meta_desc=_다른 영웅이 얻으면_ 물리 공격에 레벨/3(+1) 또는 레벨/2(+2) 추가 피해.
actors.hero.talent.liquid_agility.title=액체 민첩
actors.hero.talent.liquid_agility.desc=_+1：_물약 사용 시 _4배_ 회피, 5턴 내 다음 근접 공격 _3배_ 명중.

_+2：_무한 회피, 무한 명중.
