# Talent inner class entries
actors.hero.talent$ninjasocial.name=닌자 사교
actors.hero.talent$ninjasocial.desc=다음 몇 회의 공격 중, 닌자의 정확도가 50% 향상됩니다.\n\n잔여 횟수: %s
actors.hero.talent$agileattack.name=민첩 반격
actors.hero.talent$agileattack.desc=닌자가 최근 적의 공격을 회피했습니다. 대상에게 가하는 다음 물리 공격이 피해 보너스를 얻습니다.
actors.hero.talent$resilientarmor.name=탄력 갑옷
actors.hero.talent$resilientarmor.desc=몸이 더 유연해진 것을 느낍니다. 갑옷까지도 마찬가지입니다.\n\n0~3의 추가 방어구를 얻어 다음 %1$d회의 공격을 방어합니다.
actors.hero.talent$feintcooldown.name=성동격서-쿨다운
actors.hero.talent$feintcooldown.desc=방금 물건을 던져 적을 유인했습니다. 당분간 소리를 내도 주의를 끌기 어렵습니다.\n\n잔여 쿨다운: %s턴
actors.hero.talent$darkhookcooldown.name=갈고리 회복
actors.hero.talent$darkhookcooldown.desc=암액 슬라임이 방금 암액 갈고리를 사용했습니다. 대상을 세게 끌어당겨 많은 체력을 소모했으므로 회복이 필요합니다.\n\n이 능력이 회복되기까지 %s턴 더 필요합니다.
actors.hero.talent$markmeal.name=표식 타격
actors.hero.talent$markmeal.desc=DM-400의 다음 몇 회 물리 공격이 부여하는 지휘 표식 효과가 연장됩니다.\n\n다른 영웅이 이 효과를 얻으면, 다음 몇 회 물리 공격이 대상에게 일정 턴의 현기증 효과를 부여합니다.\n\n잔여 횟수: %1$d
actors.hero.talent$slimemucuscooldown.name=점액 분열
actors.hero.talent$slimemucuscooldown.desc=물 정령 슬라임이 방금 슬라임 점액을 분열했습니다. 다시 분열하려면 시간이 필요합니다. 또한 공격을 받으면 점액 분열이 가속화됩니다.\n\n물 정령 슬라임이 %s턴 후에 다음 점액을 분열할 수 있습니다.
actors.hero.talent$xiadef.name=하의 보법
actors.hero.talent$xiadef.desc=닌자가 두루마리를 읽은 후 잠시 오의를 깨달아 몸이 가볍고 민첩해졌습니다.\n\n이 효과로 회피율이 10% 향상되어 적의 공격을 더 잘 회피할 수 있습니다.\n\n잔여 턴 수: %s턴

# Talent comments
actors.hero.talent.agile_attack.comment="남무삼, 이렇게 멋진 회피 반격 콤보라니, 닌자 다이내믹 비전을 가진 제군들은 이미 훤히 보고 있겠지."
actors.hero.talent.ally_warp.comment=마법사는 이동할 수 없는 아군과 위치를 교환할 수 없습니다.\n\nDM-400(랜덤 모드에서 DM-400이 아닌 AT-400 및 AU-400 전문화 포함)이 이 재능을 획득하면, _+1/+2/+3_ 레벨에서 _2/4/6칸 범위 내_ 인접하지 않은 드론을 클릭하여 위치 교환 또는 지휘를 선택할 수 있습니다.
actors.hero.talent.arcane_vision.comment="적에게 붙어 있는 마력으로 그들의 위치를 감지할 수 있습니다."
actors.hero.talent.assassins_reach.comment=이 순간 이동은 위험 지형이나 적을 넘을 수 있지만, 벽 등 견고한 지형은 통과할 수 없습니다.
actors.hero.talent.assist_upgrade.comment=이 재능으로 중첩된 보호막은 최대 생명력의 절반을 초과할 수 없습니다.\n\n이 재능은 편대 드론, 혼돈 드론 및 전투형 드론에는 적용되지 않습니다.
actors.hero.talent.backup_barrier.comment="마지막 파동."
actors.hero.talent.battle_upgrade.comment=이 재능은 편대 드론에 적용되지 않습니다.
actors.hero.talent.big_fist.comment=무력의 반지를 장비하면 DM-400의 맨손 피해가 직접 중첩되지 않고 대체되지만, 이 재능의 적 방어구 무시 효과는 유지됩니다.
actors.hero.talent.body_form.comment=삼위일체는 동시에 하나의 위격 효과만 환생할 수 있습니다. 희귀하고 강력한 마법 부여나 각인을 선택할 때, 삼위일체의 갑옷 충전 소모가 더 높아집니다.
actors.hero.talent.body_reinforce.comment="철인 100과 그 철갑 군단."
actors.hero.talent.body_replacement.comment=동시에 하나의 대체 목각만 존재할 수 있습니다.
actors.hero.talent.cached_rations.comment=비상 식량은 빠르게 섭취할 수 있으며, 중간 정도의 포만감을 회복하고 5의 생명력을 회복하며 그림자 망토에 1 충전을 제공합니다.\n\n"도적 길드가 회원들에게 제공하는 물자 지원입니다."
actors.hero.talent.close_the_gap.comment=이 순간 이동은 위험 지형이나 적을 넘을 수 있지만, 벽 등 견고한 지형은 통과할 수 없습니다. 순간 이동 거리는 결투 개시 거리 판정에도 포함됩니다.
actors.hero.talent.combined_lethality.comment=이 공격은 일반 근접 무기 공격일 수도 있고, 무술의 일부일 수도 있습니다.
actors.hero.talent.dark_gas.comment=이 재능의 세 가지 가스는 각각 확률적으로 방출되며 한 번에 모두 방출되지 않습니다.
actors.hero.talent.dark_liquid.comment=이 재능이 +3 레벨일 때 적을 심연으로 끌어내려도 암액 갈고리의 쿨다운이 초기화되지 않습니다.
actors.hero.talent.deathless_fury.comment=주의, 광폭화 종료 시 광전사의 생명력이 0이면 사망합니다.
actors.hero.talent.divine_intervention.comment=신성 간섭은 최대 5의 성전 충전을 소모하며, 동일한 초월 승천에서 한 번만 시전할 수 있습니다.
actors.hero.talent.divine_sense.comment="그는 사람의 길을 주목하시며, 사람의 모든 걸음을 보신다. 어둠과 음영도 죄지은 자의 은신처가 될 수 없다."
actors.hero.talent.efficient_healing.comment=이 재능은 약초 요양의 총 치유량에 영향을 주지 않으며, 치유 속도만 향상시킵니다.
actors.hero.talent.efficient_order.comment="Go Work."
actors.hero.talent.empowering_meal.comment="섭취 후 순간, 체내의 마력이 끓어오르는 것을 느낄 수 있습니다."
actors.hero.talent.endless_rage.comment=분노 수치가 100%를 초과하면, 초과 분노 4%마다 1%의 보호막이 증가하고 광폭화 쿨다운이 1% 감소하지만, 피해 증가 효과는 200%를 초과할 수 없습니다.
actors.hero.talent.energizing_meal.comment="섭취는 더 풍부한 마력을 가져다줍니다."
actors.hero.talent.energy_absorption.comment=이 재능의 효과 판정은 모든 피해 감소 이후에 이루어집니다.
actors.hero.talent.fast_cruise.comment=이 재능은 편대 드론, 혼돈 드론 및 전투형 드론에는 적용되지 않습니다.
actors.hero.talent.feint.comment=이 재능은 잠든 적을 깨울 수 있습니다. 일반적으로 유인된 적은 매 턴 50% 확률로 시야 내의 닌자나 아군에게 주의를 돌립니다.\n\n"놀려먹는 거냐, 이 망할 놈아!"
actors.hero.talent.flash.comment=천국 계단은 초기에 3의 성전 충전을 소모하며, 동일한 초월 승천 활성화 중 매 시전 시 충전 소모가 +1씩 증가합니다.
actors.hero.talent.fly_drone.comment=이 재능은 편대 드론, 혼돈 드론 및 보조형 드론에는 적용되지 않습니다.
actors.hero.talent.followup_strike.comment="부상당한 적을 강타하여 숨 쉴 틈을 주지 마라."
actors.hero.talent.glimpse.comment="사람은 그 하나만 알고, 다른 것은 알지 못한다."
actors.hero.talent.hearty_meal.comment="이 떡을 먹고 나면, 다시 한 번 멋진 사내가 되자."
actors.hero.talent.holy_bath.comment=이 재능의 넉백 효과는 적을 심연으로 떨어뜨릴 수 없습니다.
actors.hero.talent.holy_intuition.comment="당신의 말씀은 내 발의 등이요, 내 길의 빛입니다."
actors.hero.talent.holy_lance.comment=성창은 _언데드 및 악마 속성_의 적에게 항상 최대 피해를 입힙니다. 성창은 30턴의 쿨다운이 있으며, 이후 다시 시전할 수 있습니다.
actors.hero.talent.improvised_projectiles.comment=이 재능에는 _10턴 쿨다운_이 있습니다.\n\n"전사는 심심할 때면 물건을 손에 들고 던지며 놀다 보니, 어느새 정확히 적의 눈동자에 던질 수 있는 능력을 갖추게 되었다."
actors.hero.talent.inscribed_power.comment=업그레이드 두루마리, 변질의 두루마리 또는 위 두루마리들로 제련한 연금 아이템을 사용할 경우, 지팡이의 강화 시전 횟수가 두 배가 됩니다.\n\n생산량이 많은 연금 아이템(예: 대부분의 결정체)의 경우, 이 특성은 해당 아이템의 단일 생산 수량에 기반한 확률로 발동합니다.\n\n이 특성은 무질서한 마법서를 읽어도 발동할 수 있습니다.\n\n"두루마리에 새겨진 룬 자체에 많은 마력이 담겨 있습니다."
actors.hero.talent.inscribed_stealth.comment=업그레이드 두루마리, 변질의 두루마리 또는 위 두루마리들로 제련한 연금 아이템을 사용할 경우, 얻는 은신 효과의 지속 시간이 두 배가 됩니다.\n\n생산량이 많은 연금 아이템(예: 대부분의 결정체)의 경우, 이 특성은 해당 아이템의 단일 생산 수량에 기반한 확률로 발동합니다.\n\n이 특성은 무질서한 마법서를 읽어도 발동할 수 있습니다.\n\n"도둑은 어둠 속에서 남이 보지 못하는 작은 비밀들을 뒤적이는 데 익숙해져 있습니다."
actors.hero.talent.iron_stomach.comment="전시 중에는 식사 시간에 휴전하는 것이 양측 전사의 암묵적 합의였다."
actors.hero.talent.iron_will.comment="강철은 어떻게 단련되는가."
actors.hero.talent.judgement.comment=종말 천계는 5의 성전 충전을 소모합니다. 사제가 초월 승천에 진입한 이후 또는 마지막 종말 천계 시전 이후의 매 시전마다 33%의 추가 피해를 입힙니다.
actors.hero.talent.kill_continue.comment="전전긍긍, 심연에 임하듯, 얇은 얼음을 밟듯."
actors.hero.talent.kono_fukusa.comment="츠리노부시는 동양 전략가가 창안한 전술로, 적을 유인해 깊숙이 들인 후 섬멸 매복을 펼치는 것이 핵심이며, 북방 국가와 연합하여 늑대인간의 침입을 저지할 때 소수로 다수를 이겼습니다."
actors.hero.talent.kunikuchi.comment="국붕포는 구경이 매우 큰 화포로, 그 굉장한 소리는 실제 위력보다 적을 더 효과적으로 위협합니다(물론 위력도 만만치 않습니다)."
actors.hero.talent.lay_on_hands.comment=이 법술의 오버힐은 보호막으로 전환됩니다. 성유는 반복 시전이 가능하지만, 세 번 시전 수치를 초과하는 보호막을 즉시 부여할 수 없습니다.
actors.hero.talent.lethal_momentum.comment="전혈류!"
actors.hero.talent.light_box.comment=가방에 수리검 상자가 없으면, 이 재능은 _+1/+2/+3_ 레벨에서 유물 사용 후 4턴 동안 모든 투척 무기의 레벨을 _1/2/3_ 올려줍니다.
actors.hero.talent.lingering_magic.comment="본질은 시전 후 손에 약간의 마력이 남는 현상입니다."
actors.hero.talent.liquid_perception.comment=이 재능은 힘의 물약이나 경험치 물약을 재료로 제작한 아이템을 섭취할 때도 발동됩니다.
actors.hero.talent.liquid_willpower.comment=힘의 물약, 경험의 물약 또는 위 물약들로 제련한 연금 아이템을 사용할 경우, 얻는 보호막량이 두 배가 됩니다.\n\n생산량이 많은 연금 아이템(예: 폭발물 주머니)의 경우, 이 특성은 해당 아이템의 단일 생산 수량에 기반한 확률로 발동합니다.\n\n"한 병의 독한 술이 전사의 투지를 불러일으킬 수 있듯, 물약도 마찬가지입니다."
actors.hero.talent.longrange_warp.comment=마법사는 이 능력을 사용하여 봉쇄된 층을 벗어날 수 없습니다.
actors.hero.talent.mark_meal.comment="4 65 6C 69 63 6F 75 73."
actors.hero.talent.mind_form.comment=삼위일체는 동시에 하나의 지위격 효과만 환생할 수 있습니다.
actors.hero.talent.mnemonic_prayer.comment=기원 시편은 특정 대상의 버프 또는 디버프 효과를 한 번만 연장할 수 있으며, 갑옷 스킬의 버프 효과는 연장할 수 없습니다.
actors.hero.talent.monastic_vigor.comment=돌파 상태일 때:\n-공진으로 무기 마법 부여 사용.\n-응시가 턴을 소모하지 않음.\n-등운의 돌진 거리 4.\n-반룡의 피해 150%, 인접한 모든 적을 밀쳐내고 기절시킴.\n-명상이 20%의 손실 생명력을 천천히 회복하고 80%의 피해 저항 제공.
actors.hero.talent.mystical_meal.comment=이 재능은 풍요의 뿔이 그 자체를 충전하는 것을 허용하지 않습니다.\n\n"모험가들의 마법 아이템 사용 수요를 충족시키기 위해, 식품점은 종종 마법사를 고용하여 음식에 소량의... 마력을 첨가합니다."
actors.hero.talent.natures_aid.comment="자연신의 축복, 아주 미미하더라도."
actors.hero.talent.natures_bounty.comment=장과는 빠르게 섭취할 수 있으며, 소량의 포만감을 회복하고 실용적인 씨앗 하나를 얻을 수도 있습니다.\n\n"자연의 선물에 감사드립니다."
actors.hero.talent.natures_wrath.comment=발동 가능한 식물: 실명초, 염열화, 빙관화, 단장태, 폭풍등.
actors.hero.talent.new_trap.comment=매회 비류폭포를 사용하여 얻는 함정 결정 기둥은 최대 3개입니다.
actors.hero.talent.ninja_meal.comment=가방에 수리검 상자가 없으면, 이 재능은 _+1/+2_ 레벨에서 _1/2턴의 유물 충전_을 제공합니다(풍요의 뿔 자체 충전 불가).\n\n"고기 소로 가득 찬 배부른 군량, 그는 한입에 다 먹어치웠다!"
actors.hero.talent.ninja_social.comment="남무삼, 이 얼마나 정확한 chop 연타인가, 실로 좋은 솜씨다."
actors.hero.talent.offensive.comment="감히 호랑이를 맨손으로 때리지 않고, 감히 황하를 걸어서 건너지 않는다."
actors.hero.talent.over_code.comment=이 재능은 업그레이드 두루마리나 변화 두루마리를 재료로 제작한 아이템을 읽을 때도 발동됩니다.\n\n"Decoding Files..."
actors.hero.talent.over_meal.comment="3 72 75 6E 63 68 79."
actors.hero.talent.point_blank.comment=주의, 비근접 거리에서 투척 무기 또는 영능궁을 사용할 때 항상 50%의 정확도 보정을 받습니다.
actors.hero.talent.protective_shadows.comment="어둠 속을 걸으며, 빛을 섬긴다."
actors.hero.talent.provoked_anger.comment="북방의 용사에게 도전한 자는 모두 잠들었다."
actors.hero.talent.qianfa_throwing.comment=영능궁 등 특수 투척 무기를 가진 영웅이 이 재능을 획득하면 특수 투척 무기도 이 재능의 보너스를 받습니다.\n\n"지시 ・하나: 수리검 100발로 쓰러뜨릴 수 없는 적은, 수리검 1발로 쓰러뜨리려 하지 말고, 수리검 1000발을 던져라!"
actors.hero.talent.quality_absorption.comment=이 재능은 물주머니의 이슬에도 적용되지만, 한 번의 흡수량만 증가시킵니다.
actors.hero.talent.quick_search.comment=주의, 일반 수색은 항상 2턴이 소요되며 2배의 포만감을 소모합니다.\n\n"주변 환경을 모두 탐색해야 안심하고 휴식과 전투를 할 수 있습니다."
actors.hero.talent.recall_inscription.comment=권장 주언은 업그레이드 두루마리, 변화 두루마리 및 승화 비전 효과를 다시 발동시킬 수 없습니다. 충전 소모는 가장 최근에 사용한 아이템에 따라 변화합니다: 마법석 2 충전, 두루마리 3 충전, 비전 5 충전. 변화 두루마리 또는 변화/업그레이드 두루마리의 마법석/비전 효과를 발동시키면 충전 소모가 두 배가 됩니다.\n\n"이 또 한 번은 흔들리는 것, 즉 창조된 것들이 제거되어 흔들리지 않는 것이 영원히 남게 함을 가리킨다."
actors.hero.talent.recover_charge.comment="Recycle."
actors.hero.talent.remote_beacon.comment=마법사는 자신이 도달할 수 없는 위치에 신호기를 설치할 수 없습니다.
actors.hero.talent.rocket_fist.comment=근접 무기로 공격하면 넉백 확률이 _30%에 불과_합니다.\n\n"로켓 펀치——!!!"
actors.hero.talent.rogues_foresight.comment="드디어 찾았다."
actors.hero.talent.runic_transference.comment=파손된 문장은 갑옷에 각인이 새겨져 있을 당시의 각인만 휴대할 수 있습니다.\n\n"새겨져 있는 것은 각인뿐만 아니라, 전사의 옛 영광도 있습니다."
actors.hero.talent.scholars_intuition.comment="이런 것들은 마법사 학원에서 이미 배웠습니다."
actors.hero.talent.searing_light.comment="빛이 어둠 속에 비치지만, 어둠은 빛을 이기지 못했다."
actors.hero.talent.shared_enchantment.comment=투척 무기에 어떤 마법 부여가 있든, 영능궁의 마법 부여를 정상적으로 발동시킬 수 있습니다.
actors.hero.talent.shield_battery.comment="비상 조치."
actors.hero.talent.shield_of_light.comment="두려워하지 마라, 내가 너와 함께 있음이니라. 놀라지 마라, 내가 네 하나님이 됨이니라. 내가 너를 굳세게 하고, 내가 너를 도울 것이며, 내가 나의 의로운 오른손으로 너를 붙들리라."
actors.hero.talent.silent_steps.comment="쉿."
actors.hero.talent.slime_greenhouse.comment=황무지 도전 과제를 활성화한 후, 이 재능을 업그레이드하면 씨앗이 체내에서 발아하는 데 필요한 턴 수가 _10_에서 _5_로 감소합니다.
actors.hero.talent.soko.comment="조합은 동양 국가의 화포 장전 기술에 있어 중요한 혁신으로, 단일 발사에 필요한 정량 화약과 탄환을 미리 죽통이나 종이에 밀봉하여, 사용 시 바로 총신에 부어 넣음으로써 철포수의 사격 효율을 분당 1~2발에서 4~5발로 향상시켰습니다."
actors.hero.talent.spirit_form.comment=삼위일체는 동시에 하나의 혼위격 효과만 환생할 수 있습니다. 삼위일체를 통해 유물을 사용할 때 효과와 갑옷 충전 소모는 유물에 따라 다릅니다.
actors.hero.talent.stasis.comment=아군이 정체 상태일 때, 사제는 광령 소환을 시전하여 아군을 다시 소환하거나, 혈색 인대를 시전하여 아군이 법술 효과를 미리 받게 할 수 있습니다. 그러나 정체 상태의 아군은 혈색 인대의 법술 효과를 받을 수 없습니다.
actors.hero.talent.sucker_punch.comment="매복은 모든 도둑 길드 멤버의 필수 과목입니다."
actors.hero.talent.survivalists_intuition.comment="생존을 위해, 당신은 이 장비들의 정보를 빠르게 파악해야 합니다."
actors.hero.talent.sustain_mark.comment=이 재능은 습격 드론과 충격 드론에 적용됩니다.
actors.hero.talent.target_targeting.comment="Target Locked."
actors.hero.talent.tbm.comment="Repairing Files..."
actors.hero.talent.telefrag.comment=영웅은 자해로 사망하지 않으며, 이 피해는 마법 저항 효과로 경감될 수 있습니다.
actors.hero.talent.terror_mach.comment=각 적은 이로 인해 한 번만 공포 효과를 받습니다.
actors.hero.talent.thiefs_intuition.comment="당신은 도둑 길드에서 도매한 《보석 감정 매뉴얼》에서 이 보석들을 본 적이 있습니다."
actors.hero.talent.unencumbered_spirit.comment=주의, 맨손이나 무력의 반지로 공격 시 이 재능의 이점이 없습니다.
actors.hero.talent.veterans_intuition.comment="이것은 북방 전장에서 얻은 경험입니다."
actors.hero.talent.wall_of_light.comment=신성 장벽은 8방향으로 배치할 수 있으며, 동시에 하나의 장벽만 존재할 수 있습니다.
actors.hero.talent.wand_preservation.comment="고가치의 지팡이는 항상 사람들의 눈길을 끕니다."
actors.hero.talent.wide_search.comment="눈길이 닿는 곳에, 숨을 곳은 없다."
actors.hero.talent.xia.comment=업그레이드 두루마리, 변질의 두루마리 또는 위 두루마리들로 제련한 연금 아이템을 사용할 경우, 얻는 하보법 효과 지속 시간이 두 배가 됩니다.\n\n생산량이 많은 연금 아이템(예: 대부분의 결정체)의 경우, 이 특성은 해당 아이템의 단일 생산 수량에 기반한 확률로 발동합니다.\n\n이 특성은 무질서한 마법서를 읽어도 발동할 수 있습니다.\n\n"오래전, 첫 번째로 닌자 기술의 오의를 터득한 닌자 마스터가 두루마리 한 장을 이용해 한 가지 오의를 발명했습니다: 그것은 바로 하보법입니다."
actors.hero.talent.you_scared_me.comment=이 재능으로 얻는 보호막은 _+1/+2_ 레벨에서 _4/6_을 초과할 수 없습니다.\n\n"풍림화산, 다도, 그리고... 풍림화산."
actors.hero.talent.yunying_meal.comment=이 재능은 재능 _경험치 식사_, _무적 한 끼_ 및 _생일 선물_과 _100회 발동 제한_을 공유합니다.\n\n"아이이이이이! 닌자! 여기에 어떻게 닌자가 있어?!"

actors.hero.talent.hallowed_ground.comment=시전 시, 주문이 즉시 아군을 15 생명력 치료하고, 적을 짧게 얽어매며 낮은 풀을 퍼뜨립니다. 이후, 신성 영역은 천천히 아군을 치료하고, 적을 불구로 만들며 무작위로 높은 풀을 생성합니다. 신성 영역은 사제에게는 치료 대신 보호막을 제공하며, 불에 의해 파괴됩니다.
actors.hero.talent.agile_attack.desc=_+1：_닌자가 적의 공격을 회피했을 때, 그의 다음 물리 공격이 _3의 추가 피해_를 입힙니다.\n\n_+2：_닌자가 적의 공격을 회피했을 때, 그의 다음 물리 공격이 _5의 추가 피해_를 입힙니다.
actors.hero.talent.allhunting.desc=_+1：_그림자 무사가 적을 공격한 후 _2턴의 그림자 표식_을 새깁니다. 표식이 새겨진 적은 닌자와 그림자 무사에게 받는 피해가 _15% 증가_합니다.\n\n_+2：_그림자 무사가 적을 공격한 후 _4턴의 그림자 표식_을 새깁니다. 표식이 새겨진 적은 닌자와 그림자 무사에게 받는 피해가 _30% 증가_합니다.\n\n_+3：_그림자 무사가 적을 공격한 후 _6턴의 그림자 표식_을 새깁니다. 표식이 새겨진 적은 닌자와 그림자 무사에게 받는 피해가 _45% 증가_합니다.\n\n_+4：_그림자 무사가 적을 공격한 후 _8턴의 그림자 표식_을 새깁니다. 표식이 새겨진 적은 닌자와 그림자 무사에게 받는 피해가 _60% 증가_합니다.
actors.hero.talent.ally_warp.desc=_+1：_마법사가 _2칸 범위 내_의 아군 한 명을 선택하여 즉시 위치를 교환합니다.\n\n_+2：_마법사가 _4칸 범위 내_의 아군 한 명을 선택하여 즉시 위치를 교환합니다.\n\n_+3：_마법사가 _6칸 범위 내_의 아군 한 명을 선택하여 즉시 위치를 교환합니다.
actors.hero.talent.arcane_vision.desc=_+1：_마법사가 적에게 시전할 때, 그들에 대한 투시 감지를 얻어 _10턴_ 지속됩니다.\n\n_+2：_마법사가 적에게 시전할 때, 그들에 대한 투시 감지를 얻어 _15턴_ 지속됩니다.
actors.hero.talent.assassins_reach.desc=_+1：_암살자의 각 단계 준비 순간 이동 거리가 1/2/3/4칸에서 _1/3/4/6칸_으로 증가합니다.\n\n_+2：_암살자의 각 단계 준비 순간 이동 거리가 1/2/3/4칸에서 _2/4/6/8칸_으로 증가합니다.\n\n_+3：_암살자의 각 단계 준비 순간 이동 거리가 1/2/3/4칸에서 _2/5/7/10칸_으로 증가합니다.
actors.hero.talent.assist_upgrade.desc=_+1：_AU-400이 생산한 모든 보조형 드론이 각각 _50턴_마다 호스트에게 _4의 보호막_을 제공합니다.\n\n_+2：_AU-400이 생산한 모든 보조형 드론이 각각 _40턴_마다 호스트에게 _4의 보호막_을 제공합니다.\n\n_+3：_AU-400이 생산한 모든 보조형 드론이 각각 _30턴_마다 호스트에게 _4의 보호막_을 제공합니다.
actors.hero.talent.backup_barrier.desc=_+1：_마법사가 지팡이의 마지막 충전을 방출할 때마다 _3의 보호막_을 얻습니다.\n\n_+2：_마법사가 지팡이의 마지막 충전을 방출할 때마다 _5의 보호막_을 얻습니다.
actors.hero.talent.backup_barrier.meta_desc=_이 재능이 다른 영웅에게 획득될 경우_, 보유한 레벨이 가장 높은 지팡이에 의해 발동됩니다.
actors.hero.talent.battle_upgrade.desc=_+1：_AT-400이 생산한 모든 전투형 드론의 피해가 _15% 증가_하며, 적의 방어구에 기반한 추가 증가도 있습니다. 이 추가 증가는 최대 적 _26.7%의 방어구를 무시_하는 것과 같습니다.\n\n_+2：_AT-400이 생산한 모든 전투형 드론의 피해가 _22.5% 증가_하며, 최대 적 _53.3%의 방어구를 무시_합니다.\n\n_+3：_AT-400이 생산한 모든 전투형 드론의 피해가 _30% 증가_하며, 최대 적 _80%의 방어구를 무시_합니다.
actors.hero.talent.big_fist.desc=_+1：_DM-400의 맨손 공격이 적의 방어구를 무시하며, 피해가 _3~20_으로 증가합니다.\n\n_+2：_DM-400의 맨손 공격이 적의 방어구를 무시하며, 피해가 _4~25_으로 증가합니다.\n\n_+3：_DM-400의 맨손 공격이 적의 방어구를 무시하며, 피해가 _5~30_으로 증가합니다.
actors.hero.talent.blast_radius.desc=_+1：_원소 폭풍의 반경이 4칸에서 _5칸_으로 확대됩니다.\n\n_+2：_원소 폭풍의 반경이 4칸에서 _6칸_으로 확대됩니다.\n\n_+3：_원소 폭풍의 반경이 4칸에서 _7칸_으로 확대됩니다.\n\n_+4：_원소 폭풍의 반경이 4칸에서 _8칸_으로 확대됩니다.
actors.hero.talent.body_reinforce.desc=_+1：_DM-400이 생산한 드론이 그 _50%의 방어구_를 상속받습니다.\n\n_+2：_DM-400이 생산한 드론이 그 _75%의 방어구_를 상속받습니다.
actors.hero.talent.body_reinforce.meta_desc=_이 재능이 다른 영웅에게 획득될 경우_, +1 레벨에서 영웅이 최소 20 피해를 받을 때 5%의 피해 감소를, +2 레벨에서 최소 10 피해를 받을 때 10%의 피해 감소를 얻습니다.
actors.hero.talent.body_replacement.desc=_+1：_순간 이동 시, 도적이 _20 생명력과 1~3 방어구_를 가진 대체 목각을 남깁니다.\n\n_+2：_순간 이동 시, 도적이 _40 생명력과 2~6 방어구_를 가진 대체 목각을 남깁니다.\n\n_+3：_순간 이동 시, 도적이 _60 생명력과 3~9 방어구_를 가진 대체 목각을 남깁니다.\n\n_+4：_순간 이동 시, 도적이 _80 생명력과 4~12 방어구_를 가진 대체 목각을 남깁니다.
actors.hero.talent.body_slam.desc=_+1：_전사의 용감한 도약 착지 시, 모든 인접한 적에게 _1~4+25% 방어구_의 피해를 입힙니다.\n\n_+2：_전사의 용감한 도약 착지 시, 모든 인접한 적에게 _2~8+50% 방어구_의 피해를 입힙니다.\n\n_+3：_전사의 용감한 도약 착지 시, 모든 인접한 적에게 _3~12+75% 방어구_의 피해를 입힙니다.\n\n_+4：_전사의 용감한 도약 착지 시, 모든 인접한 적에게 _4~16+100% 방어구_의 피해를 입힙니다.
actors.hero.talent.bounty_hunter.desc=_+1：_암살자가 기술로 참살한 적의 전리품 드롭 확률이 준비 단계 레벨에 따라 _2/4/8/16%_ 증가합니다.\n\n_+2：_암살자가 기술로 참살한 적의 전리품 드롭 확률이 _4/8/16/32%_ 증가합니다.\n\n_+3：_암살자가 기술로 참살한 적의 전리품 드롭 확률이 _6/12/24/48%_ 증가합니다.
actors.hero.talent.cached_rations.desc=_+1：_도적이 이후 몇 층의 지하 감옥을 탐험할 때, 상자에서 _2개의 비상 식량_을 찾을 수 있습니다.\n\n_+2：_도적이 이후 몇 층의 지하 감옥을 탐험할 때, 상자에서 _3개의 비상 식량_을 찾을 수 있습니다.
actors.hero.talent.cleave.desc=_+1：_검투사가 적을 처치했을 때, _30턴_ 이내의 다음 공격이 여전히 연속 공격 수를 유지합니다.\n\n_+2：_검투사가 적을 처치했을 때, _45턴_ 이내의 다음 공격이 여전히 연속 공격 수를 유지합니다.\n\n_+3：_검투사가 적을 처치했을 때, _60턴_ 이내의 다음 공격이 여전히 연속 공격 수를 유지합니다.
actors.hero.talent.cloned_armor.desc=_+1：_그림자 무사가 주인의 방어구 값의 _12%_를 얻고, _25%_ 확률로 주인 방어구의 각인을 사용합니다.\n\n_+2：_그림자 무사가 주인의 방어구 값의 _24%_를 얻고, _50%_ 확률로 주인 방어구의 각인을 사용합니다.\n\n_+3：_그림자 무사가 주인의 방어구 값의 _36%_를 얻고, _75%_ 확률로 주인 방어구의 각인을 사용합니다.\n\n_+4：_그림자 무사가 주인의 방어구 값의 _48%_를 얻고, _100%_ 확률로 주인 방어구의 각인을 사용합니다.
actors.hero.talent.conserved_magic.desc=_+1：_광란 마법이 매회 시전 시 지팡이의 충전 소모를 0.5에서 _0.33_으로 낮추고, 광란 마법이 _25%_ 확률로 시간을 소모하지 않습니다.\n\n_+2：_광란 마법이 매회 시전 시 지팡이의 충전 소모를 0.5에서 _0.225_로 낮추고, 광란 마법이 _50%_ 확률로 시간을 소모하지 않습니다.\n\n_+3：_광란 마법이 매회 시전 시 지팡이의 충전 소모를 0.5에서 _0.15_로 낮추고, 광란 마법이 _75%_ 확률로 시간을 소모하지 않습니다.\n\n_+4：_광란 마법이 매회 시전 시 지팡이의 충전 소모를 0.5에서 _0.1_로 낮추고, 광란 마법이 _100%_ 확률로 시간을 소모하지 않습니다.
actors.hero.talent.dark_gas.desc=_+1：_암액 슬라임이 공격을 받은 후 _20% 확률_로 소량의 _독가스_를 방출하고 _4턴 정화 보호막_ 효과를 얻습니다.\n\n_+2：_암액 슬라임이 공격을 받은 후 _20% 확률_로 소량의 _독가스 또는 부식 가스_를 방출하고 _4턴 정화 보호막_ 효과를 얻습니다.\n\n_+3：_암액 슬라임이 공격을 받은 후 _20% 확률_로 소량의 _독가스, 부식 또는 부패 가스_를 방출하고 _4턴 정화 보호막_ 효과를 얻습니다.
actors.hero.talent.dark_liquid.desc=_+1：_암액 슬라임이 암액 갈고리를 사용하면 추가로 대상에게 _2턴 결박_ 효과를 부여하여 총 5턴이 됩니다.\n\n_+2：_+1에 더해, 추가로 대상에게 _20턴 부식 진흙_ 효과를 부여합니다.\n\n_+3：_+1과 +2에 더해, _결박_ 상태에서 사망한 적이 암액 슬라임에게 _8턴 지팡이 충전과 4턴 유물 충전_을 제공하며, _암액 갈고리의 쿨다운을 초기화_합니다.
actors.hero.talent.deadly_gas.desc=_+1：_DM-400이 분사하는 독가스 _피해 +1_.\n\n_+2：_DM-400이 분사하는 독가스 _피해 +2_.\n\n_+3：_DM-400이 분사하는 독가스 _피해 +3_.\n\n_+4：_DM-400이 분사하는 독가스 _피해 +4_.
actors.hero.talent.deathless_fury.desc=_+1：_광전사가 즉사 직전이고 분노 수치가 최소 100%일 때, 자동으로 광폭화합니다. 발동 후 _3 영웅 레벨_의 쿨다운이 필요합니다.\n\n_+2：_광전사가 즉사 직전이고 분노 수치가 최소 100%일 때, 자동으로 광폭화합니다. 발동 후 _2 영웅 레벨_의 쿨다운이 필요합니다.\n\n_+3：_광전사가 즉사 직전이고 분노 수치가 최소 100%일 때, 자동으로 광폭화합니다. 발동 후 _1 영웅 레벨_의 쿨다운이 필요합니다.
actors.hero.talent.deathly_durability.desc=_+1：_빼앗는 표식으로 죽은 적이 도적에게 표식이 새겨질 때 생명력의 _13%_에 해당하는 보호막을 부여합니다.\n\n_+2：_빼앗는 표식으로 죽은 적이 도적에게 표식이 새겨질 때 생명력의 _25%_에 해당하는 보호막을 부여합니다.\n\n_+3：_빼앗는 표식으로 죽은 적이 도적에게 표식이 새겨질 때 생명력의 _38%_에 해당하는 보호막을 부여합니다.\n\n_+4：_빼앗는 표식으로 죽은 적이 도적에게 표식이 새겨질 때 생명력의 _50%_에 해당하는 보호막을 부여합니다.
actors.hero.talent.delicious_digestion.desc=_+1：_슬라임 양이 100% 갑옷 충전으로 광식 일기를 사용할 때, 충전 소모가 _16% 감소_합니다.\n\n_+2：_슬라임 양이 100% 갑옷 충전으로 광식 일기를 사용할 때, 충전 소모가 _30% 감소_합니다.\n\n_+3：_슬라임 양이 100% 갑옷 충전으로 광식 일기를 사용할 때, 충전 소모가 _40% 감소_합니다.\n\n_+4：_슬라임 양이 100% 갑옷 충전으로 광식 일기를 사용할 때, 충전 소모가 _50% 감소_합니다.
actors.hero.talent.desperate_power.desc=_+1：_마법사의 지팡이와 완드가 마지막 충전을 사용할 때 시전 효과가 _1레벨 추가_됩니다.\n\n_+2：_마법사의 지팡이와 완드가 마지막 충전을 사용할 때 시전 효과가 _2레벨 추가_됩니다.\n\n_+3：_마법사의 지팡이와 완드가 마지막 충전을 사용할 때 시전 효과가 _3레벨 추가_됩니다.
actors.hero.talent.deversion.desc=_+1：_그림자 무사의 최대 생명력이 _50_으로, 공격력이 _20~25_로 증가합니다.\n\n_+2：_+1에 더해, 한 번 소환으로 _2명의 그림자 무사_를 생성할 수 있습니다.\n\n_+3：_그림자 무사의 최대 생명력이 _60_으로, 공격력이 _30~35_로 증가합니다.\n\n_+4：_+3에 더해, 한 번 소환으로 _3명의 그림자 무사_를 생성할 수 있습니다.
actors.hero.talent.discharge_happy.desc=_+1：_DM-400이 독가스를 분사한 후 _2턴 극속_을 얻습니다.\n\n_+2：_DM-400이 독가스를 분사한 후 _4턴 극속_을 얻습니다.\n\n_+3：_DM-400이 독가스를 분사한 후 _6턴 극속_을 얻습니다.\n\n_+4：_DM-400이 독가스를 분사한 후 _8턴 극속_을 얻습니다.
actors.hero.talent.double_jump.desc=_+1：_전사가 용감한 도약을 사용한 후, 3턴 이내 다음 사용 시 충전 소모가 _16% 감소_합니다.\n\n_+2：_전사가 용감한 도약을 사용한 후, 3턴 이내 다음 사용 시 충전 소모가 _30% 감소_합니다.\n\n_+3：_전사가 용감한 도약을 사용한 후, 3턴 이내 다음 사용 시 충전 소모가 _40% 감소_합니다.\n\n_+4：_전사가 용감한 도약을 사용한 후, 3턴 이내 다음 사용 시 충전 소모가 _50% 감소_합니다.
actors.hero.talent.double_mark.desc=_+1：_하나의 대상을 표식한 후 즉시 다른 대상을 표식할 때, 표식 충전 소모가 _30% 감소_합니다.\n\n_+2：_하나의 대상을 표식한 후 즉시 다른 대상을 표식할 때, 표식 충전 소모가 _50% 감소_합니다.\n\n_+3：_하나의 대상을 표식한 후 즉시 다른 대상을 표식할 때, 표식 충전 소모가 _65% 감소_합니다.\n\n_+4：_하나의 대상을 표식한 후 즉시 다른 대상을 표식할 때, 표식 충전 소모가 _75% 감소_합니다.
actors.hero.talent.efficient_healing.desc=_+1：_춘계 법진이 제공하는 _약초 요양_ 효과가 _매 턴 1.5 생명력 회복_으로 향상됩니다.\n\n_+2：_춘계 법진이 제공하는 _약초 요양_ 효과가 _매 턴 2 생명력 회복_으로 향상됩니다.\n\n_+3：_춘계 법진이 제공하는 _약초 요양_ 효과가 _매 턴 2.5 생명력 회복_으로 향상됩니다.\n\n_+4：_춘계 법진이 제공하는 _약초 요양_ 효과가 _매 턴 3 생명력 회복_으로 향상됩니다.

actors.hero.talent.efficient_order.desc=_+1：_주문이 _4턴 더_ 지속됩니다.\n\n_+2：_주문이 _8턴 더_ 지속됩니다.\n\n_+3：_주문이 _12턴 더_ 지속됩니다.\n\n_+4：_주문이 _16턴 더_ 지속됩니다.
actors.hero.talent.elemental_power.desc=_+1：_원소 폭풍이 적에게 _2턴 동상_을 부여합니다.\n\n_+2：_+1에 더해, 원소 폭풍이 적에게 _2턴 출혈_도 부여합니다.\n\n_+3：_원소 폭풍이 적에게 _4턴 동상_을 부여합니다.\n\n_+4：_+3에 더해, 원소 폭풍이 적에게 _4턴 출혈_도 부여합니다.
actors.hero.talent.empowered_strike.desc=_+1：_물리 공격이 적의 방어구를 _2_만큼 무시합니다.\n\n_+2：_물리 공격이 적의 방어구를 _4_만큼 무시합니다.\n\n_+3：_물리 공격이 적의 방어구를 _6_만큼 무시합니다.\n\n_+4：_물리 공격이 적의 방어구를 _8_만큼 무시합니다.
actors.hero.talent.empowering_life.desc=_+1：_영웅의 레벨이 1 증가할 때마다 _최대 생명력이 1 증가_합니다. 이 재능은 _26회_ 발동으로 제한됩니다.\n\n_+2：_영웅의 레벨이 1 증가할 때마다 _최대 생명력이 2 증가_합니다. 이 재능은 _26회_ 발동으로 제한됩니다.
actors.hero.talent.empowering_meal.desc=_+1：_섭취 시, 영웅이 사용하는 _다음 2회 시전_의 위력이 _1레벨 향상_됩니다.\n\n_+2：_섭취 시, 영웅이 사용하는 _다음 3회 시전_의 위력이 _1레벨 향상_됩니다.
actors.hero.talent.endless_rage.desc=_+1：_분노 수치가 100%를 초과하여도 계속 축적되며, 초과 분노 _4%_마다 _1% 피해_로 전환되며, 광폭화 쿨다운이 _1% 감소_합니다. 피해 증가는 최대 _200%_입니다.\n\n_+2：_초과 분노 _3%_마다 _1% 피해_로 전환됩니다.\n\n_+3：_초과 분노 _2%_마다 _1% 피해_로 전환됩니다.
actors.hero.talent.energizing_meal.desc=_+1：_섭취 후, 영웅이 _5턴 지팡이 충전_을 얻습니다.\n\n_+2：_섭취 후, 영웅이 _7턴 지팡이 충전_을 얻습니다.\n\n_+3：_섭취 후, 영웅이 _9턴 지팡이 충전_을 얻습니다.\n\n_+4：_섭취 후, 영웅이 _12턴 지팡이 충전_을 얻습니다.
actors.hero.talent.energy_absorption.desc=_+1：_영웅이 _3 초과 피해_를 받을 때마다 에너지를 축적하여, 최대 _5 회_ 축적 후 다음 물리 공격이 _6 추가 피해_를 입힙니다.\n\n_+2：_영웅이 _3 초과 피해_를 받을 때마다 에너지를 축적하여, 최대 _4 회_ 축적 후 다음 물리 공격이 _10 추가 피해_를 입힙니다.\n\n_+3：_영웅이 _3 초과 피해_를 받을 때마다 에너지를 축적하여, 최대 _3 회_ 축적 후 다음 물리 공격이 _14 추가 피해_를 입힙니다.
actors.hero.talent.energy_absorption.meta_desc=_이 재능이 다른 영웅에게 획득될 경우_, +1/+2/+3 레벨에서 초과 피해를 입은 후 1/2/3의 보호막을 얻습니다.
actors.hero.talent.enhanced_combo.desc=_+1：_연속 공격 보너스가 _2배_ 증가합니다(예: 2연타는 4연타와 같음).\n\n_+2：_연속 공격 보너스가 _3배_ 증가합니다.\n\n_+3：_연속 공격 보너스가 _4배_ 증가합니다.
actors.hero.talent.enhanced_lethality.desc=_+1：_암살자의 준비 단계가 제공하는 피해 보너스가 _15% 추가 증가_합니다.\n\n_+2：_암살자의 준비 단계가 제공하는 피해 보너스가 _30% 추가 증가_합니다.
actors.hero.talent.enhanced_rings.desc=_+1：_반지의 효과가 _15%_ 증가합니다.\n\n_+2：_반지의 효과가 _30%_ 증가합니다.
actors.hero.talent.enraged_catalyst.desc=_+1：_분노 두루마리 읽기 시, 영향을 받은 적이 _5턴 광란_ 상태가 됩니다.\n\n_+2：_분노 두루마리 읽기 시, 영향을 받은 적이 _5턴 광란 및 쇠약_ 상태가 됩니다.
actors.hero.talent.evasive_armor.desc=_+1：_닌자의 회피율이 _15%_ 증가합니다.\n\n_+2：_닌자의 회피율이 _30%_ 증가합니다.\n\n_+3：_닌자의 회피율이 _45%_ 증가합니다.
actors.hero.talent.even_the_odds.desc=_+1：_시야 내의 적 1명당, 영웅의 _공격력이 10% 증가_합니다.\n\n_+2：_시야 내의 적 1명당, 영웅의 _공격력이 15% 증가_합니다.\n\n_+3：_시야 내의 적 1명당, 영웅의 _공격력이 20% 증가_합니다.\n\n_+4：_시야 내의 적 1명당, 영웅의 _공격력이 25% 증가_합니다.
actors.hero.talent.excess_charge.desc=_+1：_지팡이와 완드의 최대 충전량이 _1 증가_합니다.\n\n_+2：_지팡이와 완드의 최대 충전량이 _2 증가_합니다.
actors.hero.talent.expanding_wave.desc=_+1：_진동 충격파의 반경이 1칸에서 _2칸_으로 증가합니다.\n\n_+2：_진동 충격파의 반경이 1칸에서 _3칸_으로 증가합니다.\n\n_+3：_진동 충격파의 반경이 1칸에서 _4칸_으로 증가합니다.\n\n_+4：_진동 충격파의 반경이 1칸에서 _5칸_으로 증가합니다.
actors.hero.talent.fast_cruise.desc=_+1：_AT-400이 생산한 모든 전투형 드론의 이동 속도가 _30% 증가_합니다.\n\n_+2：_AT-400이 생산한 모든 전투형 드론의 이동 속도가 _60% 증가_합니다.\n\n_+3：_AT-400이 생산한 모든 전투형 드론의 이동 속도가 _90% 증가_합니다.
actors.hero.talent.fear_the_reaper.desc=_+1：_암살자의 처형 능력이 _15%_ 더 많은 생명력을 가진 적을 처형할 수 있습니다.\n\n_+2：_암살자의 처형 능력이 _30%_ 더 많은 생명력을 가진 적을 처형할 수 있습니다.
actors.hero.talent.feint.desc=_+1：_닌자가 빈 땅에 무기가 아닌 물건을 던지면 시야 내의 적을 해당 위치로 유인합니다. _10턴 쿨다운_.\n\n_+2：_닌자가 빈 땅에 무기가 아닌 물건을 던지면 시야 내의 적을 해당 위치로 유인합니다. _5턴 쿨다운_.
actors.hero.talent.fire_everything.desc=_+1：_일회용 총기가 주는 피해가 _25%_ 증가합니다.\n\n_+2：_일회용 총기가 주는 피해가 _50%_ 증가합니다.\n\n_+3：_일회용 총기가 주는 피해가 _75%_ 증가합니다.
actors.hero.talent.firework.desc=_+1：_평거미 솥 폭발 피해가 _20%_ 증가합니다.\n\n_+2：_+1에 더해, 평거미 솥 폭발 반경이 _3x3_으로 증가합니다.\n\n_+3：_평거미 솥 폭발 피해가 _40%_ 증가합니다.\n\n_+4：_+3에 더해, 평거미 솥 폭발 반경이 _5x5_로 증가합니다.
actors.hero.talent.fly_drone.desc=_+1：_AT-400이 생산한 모든 전투형 드론이 첫 _1회_ 공격을 반드시 회피합니다.\n\n_+2：_AT-400이 생산한 모든 전투형 드론이 첫 _2회_ 공격을 반드시 회피합니다.\n\n_+3：_AT-400이 생산한 모든 전투형 드론이 첫 _3회_ 공격을 반드시 회피합니다.
actors.hero.talent.followup_strike.desc=_+1：_여사냥꾼이 활이나 기타 투척 무기로 적을 명중시켰을 때, 해당 적에 대한 다음 근접 공격이 _2의 추가 피해_를 입힙니다.\n\n_+2：_여사냥꾼이 활이나 기타 투척 무기로 적을 명중시켰을 때, 해당 적에 대한 다음 근접 공격이 _3의 추가 피해_를 입힙니다.
actors.hero.talent.food_bonus.desc=_+1：_섭취 시 _10%_ 확률로 섭취 효과가 두 배로 발동됩니다.\n\n_+2：_섭취 시 _20%_ 확률로 섭취 효과가 두 배로 발동됩니다.
actors.hero.talent.glimpse.desc=_+1：_암살자 또는 닌자가 적을 처치할 때, _20%_ 확률로 _5턴 투명_을 얻습니다.\n\n_+2：_암살자 또는 닌자가 적을 처치할 때, _40%_ 확률로 _5턴 투명_을 얻습니다.\n\n_+3：_암살자 또는 닌자가 적을 처치할 때, _60%_ 확률로 _5턴 투명_을 얻습니다.
actors.hero.talent.glorious_dead.desc=_+1：_닌자의 그림자 무사가 파괴된 후, 닌자가 _3턴 극속_을 얻습니다.\n\n_+2：_닌자의 그림자 무사가 파괴된 후, 닌자가 _5턴 극속_을 얻습니다.\n\n_+3：_닌자의 그림자 무사가 파괴된 후, 닌자가 _7턴 극속_을 얻습니다.
actors.hero.talent.hasty_retreat.desc=_+1：_도적이 피해를 입은 후, _50%_ 확률로 _2턴 극속_을 얻습니다.\n\n_+2：_도적이 피해를 입은 후, _50%_ 확률로 _4턴 극속_을 얻습니다.
actors.hero.talent.hearty_meal.desc=_+1：_섭취 시 추가로 _5의 생명력_을 회복합니다.\n\n_+2：_섭취 시 추가로 _10의 생명력_을 회복합니다.\n\n_+3：_섭취 시 추가로 _15의 생명력_을 회복합니다.
actors.hero.talent.hold_fast.desc=_+1：_전사가 꽉 쥐기 사용 시 _2턴_ 더 오래 지속됩니다.\n\n_+2：_전사가 꽉 쥐기 사용 시 _4턴_ 더 오래 지속됩니다.
actors.hero.talent.holy_bath.desc=_+1：_성전의 신성 수류탄과 작열하는 강광이 추가로 적을 _1칸_ 밀쳐냅니다.\n\n_+2：_성전의 신성 수류탄과 작열하는 강광이 추가로 적을 _2칸_ 밀쳐냅니다.
actors.hero.talent.impact_wave.desc=_+1：_진동 충격파가 적에게 _1턴 마비_를 추가로 부여합니다.\n\n_+2：_진동 충격파가 적에게 _2턴 마비_를 추가로 부여합니다.\n\n_+3：_진동 충격파가 적에게 _3턴 마비_를 추가로 부여합니다.\n\n_+4：_진동 충격파가 적에게 _4턴 마비_를 추가로 부여합니다.
actors.hero.talent.improvised_projectiles.desc=_+1：_전사가 무기가 아닌 물건을 던질 때, _10~15_의 피해를 입힙니다.\n\n_+2：_전사가 무기가 아닌 물건을 던질 때, _15~20_의 피해를 입힙니다.
actors.hero.talent.inscribed_power.desc=_+1：_두루마리 읽기 시, 영웅의 _지팡이가 1회 강화 시전_을 얻습니다.\n\n_+2：_두루마리 읽기 시, 영웅의 _지팡이가 2회 강화 시전_을 얻습니다.
actors.hero.talent.inscribed_stealth.desc=_+1：_두루마리 읽기 시, 영웅이 _5턴 투명_을 얻습니다.\n\n_+2：_두루마리 읽기 시, 영웅이 _7턴 투명_을 얻습니다.
actors.hero.talent.iron_stomach.desc=_+1：_섭취에 소모되는 턴이 _1턴_ 감소합니다.\n\n_+2：_섭취에 소모되는 턴이 _2턴_ 감소합니다.
actors.hero.talent.iron_will.desc=_+1：_전사가 받는 _출혈과 중독_ 피해가 _15% 감소_합니다.\n\n_+2：_전사가 받는 _출혈과 중독_ 피해가 _30% 감소_합니다.\n\n_+3：_전사가 받는 _출혈과 중독_ 피해가 _45% 감소_합니다.
actors.hero.talent.iron_will.meta_desc=_이 재능이 다른 영웅에게 획득될 경우_, +1/+2/+3 레벨에서 출혈과 중독 피해가 12%/24%/36% 감소합니다.
actors.hero.talent.kill_continue.desc=_+1：_근접 무기로 적을 처치했을 때, _오의: 일지태도_가 _1턴 연장_됩니다.\n\n_+2：_근접 무기로 적을 처치했을 때, _오의: 일지태도_가 _2턴 연장_됩니다.\n\n_+3：_근접 무기로 적을 처치했을 때, _오의: 일지태도_가 _3턴 연장_됩니다.\n\n_+4：_근접 무기로 적을 처치했을 때, _오의: 일지태도_가 _4턴 연장_됩니다.
actors.hero.talent.kono_fukusa.desc=_+1：_암살자의 순간 이동 또는 닌자의 그림자 무사 생성 시, _50%_ 확률로 주변 1칸 내의 적이 _3턴 매혹_에 빠집니다.\n\n_+2：_암살자의 순간 이동 또는 닌자의 그림자 무사 생성 시, _100%_ 확률로 주변 1칸 내의 적이 _3턴 매혹_에 빠집니다.
actors.hero.talent.kunikuchi.desc=_+1：_일회용 총기의 폭발 반경이 _3x3_으로 증가합니다.\n\n_+2：_일회용 총기의 폭발 반경이 _5x5_로 증가합니다.
actors.hero.talent.lethal_defense.desc=_+1：_닌자의 맨손 방어가 _50%_ 확률로 출혈을 유발한 적의 공격을 회피합니다.\n\n_+2：_닌자의 맨손 방어가 _100%_ 확률로 출혈을 유발한 적의 공격을 회피합니다.
actors.hero.talent.lethal_momentum.desc=_+1：_암살자가 순간 이동한 후 다음 물리 공격이 _20%_ 추가 피해를 입힙니다.\n\n_+2：_암살자가 순간 이동한 후 다음 물리 공격이 _40%_ 추가 피해를 입힙니다.\n\n_+3：_암살자가 순간 이동한 후 다음 물리 공격이 _60%_ 추가 피해를 입힙니다.
actors.hero.talent.light_box.desc=_+1：_닌자의 던지기 스킬이 그 _범위를 50%_ 증가시킵니다.\n\n_+2：_닌자의 던지기 스킬이 그 _범위를 100%_ 증가시킵니다.\n\n_+3：_닌자의 던지기 스킬이 그 _범위를 150%_ 증가시킵니다.
actors.hero.talent.light_cloak.desc=_+1：_유물 충전 속도가 _15%_ 증가합니다.\n\n_+2：_유물 충전 속도가 _30%_ 증가합니다.
actors.hero.talent.light_cloak.meta_desc=_이 재능이 다른 영웅에게 획득될 경우_, +1/+2 레벨에서 유물 충전 속도가 10%/20% 증가합니다.
actors.hero.talent.lingering_magic.desc=_+1：_시전 후, _50%_ 확률로 _1턴_ 동안 마력이 잔류하여 다음 시전이 _1레벨 향상_됩니다.\n\n_+2：_시전 후, _75%_ 확률로 _1턴_ 동안 마력이 잔류하여 다음 시전이 _1레벨 향상_됩니다.
actors.hero.talent.liquid_armor.desc=_+1：_물약 섭취 후, _5턴_ 동안 방어구가 _2_ 증가합니다.\n\n_+2：_물약 섭취 후, _5턴_ 동안 방어구가 _4_ 증가합니다.
actors.hero.talent.liquid_perception.desc=_+1：_물약 섭취 시, _25%_ 확률로 _3턴 투시_를 얻습니다.\n\n_+2：_물약 섭취 시, _50%_ 확률로 _3턴 투시_를 얻습니다.
actors.hero.talent.liquid_willpower.desc=_+1：_물약 섭취 시, _3의 보호막_을 얻습니다.\n\n_+2：_물약 섭취 시, _6의 보호막_을 얻습니다.
actors.hero.talent.longrange_warp.desc=_+1：_마법사의 원거리 순간 이동 최대 거리가 _6칸_으로 증가합니다.\n\n_+2：_마법사의 원거리 순간 이동 최대 거리가 _8칸_으로 증가합니다.\n\n_+3：_마법사의 원거리 순간 이동 최대 거리가 _10칸_으로 증가합니다.
actors.hero.talent.mark_meal.desc=_+1：_DM-400이 식사 후 _다음 2회 물리 공격_이 대상에게 _3턴의 지휘 표식을_ 부여합니다.\n\n_+2：_DM-400이 식사 후 _다음 3회 물리 공격_이 대상에게 _3턴의 지휘 표식을_ 부여합니다.
actors.hero.talent.mark_meal.meta_desc=_이 재능이 다른 영웅에게 획득될 경우_, +1/+2 레벨에서 식사 후 다음 2/3회 물리 공격이 대상에게 2/3턴의 현기증을 부여합니다.
actors.hero.talent.mass_healing.desc=_+1：_춘계 법진의 범위가 3x3에서 _5x5_로 확대됩니다.\n\n_+2：_춘계 법진의 효과가 아군에게도 적용됩니다.
actors.hero.talent.mind_water.desc=_+1：_인술 대사가 _근접술_ 방출 시 소모되는 인술 에너지가 1 감소합니다.\n\n_+2：_인술 대사가 _근접술 및 투척술_ 방출 시 소모되는 인술 에너지가 1 감소합니다.\n\n_+3：_인술 대사가 _둔술, 근접술 및 투척술_ 방출 시 소모되는 인술 에너지가 1 감소합니다.
actors.hero.talent.mystical_charge.desc=_+1：_전투 마법사가 완드로 근접 공격을 명중시킬 때, _0.5턴_에 해당하는 유물 충전 효과를 얻습니다.\n\n_+2：_전투 마법사가 완드로 근접 공격을 명중시킬 때, _1턴_에 해당하는 유물 충전 효과를 얻습니다.\n\n_+3：_전투 마법사가 완드로 근접 공격을 명중시킬 때, _1.5턴_에 해당하는 유물 충전 효과를 얻습니다.
actors.hero.talent.mystical_meal.desc=_+1：_섭취 시, _25%_ 확률로 가방 내의 _무작위 유물이 2턴 충전_됩니다.\n\n_+2：_섭취 시, _50%_ 확률로 가방 내의 _무작위 유물이 2턴 충전_됩니다.
actors.hero.talent.natural_affinity.desc=_+1：_여사냥꾼이 식물을 밟을 때, _33%_ 확률로 효과가 _2배_로 발동됩니다.\n\n_+2：_여사냥꾼이 식물을 밟을 때, _67%_ 확률로 효과가 _2배_로 발동됩니다.\n\n_+3：_여사냥꾼이 식물을 밟을 때, _100%_ 확률로 효과가 _2배_로 발동됩니다.
actors.hero.talent.natures_aid.desc=_+1：_시야 내 식물의 효과가 발동될 때, 여사냥꾼이 _2턴_마다 1씩 감소하는 0~2의 나무 껍질을 얻습니다.\n\n_+2：_시야 내 식물의 효과가 발동될 때, 여사냥꾼이 _2턴_마다 1씩 감소하는 0~2의 나무 껍질을 얻습니다.
actors.hero.talent.natures_bounty.desc=_+1：_여사냥꾼이 이후 몇 층의 지하 감옥을 탐험할 때, 상자에서 _2개의 야생 장과_를 찾을 수 있습니다.\n\n_+2：_여사냥꾼이 이후 몇 층의 지하 감옥을 탐험할 때, 상자에서 _3개의 야생 장과_를 찾을 수 있습니다.
actors.hero.talent.necromancers_minions.desc=_+1：_강령술사가 소환한 하수인의 최대 생명력이 _30%_ 증가합니다.\n\n_+2：_강령술사가 소환한 하수인의 최대 생명력이 _60%_ 증가합니다.
actors.hero.talent.new_trap.desc=_+1：_비류폭류의 증발 수증기로 함정을 파괴할 때, _20%_ 확률로 _1개의 함정 결정 기둥_이 생성됩니다.\n\n_+2：_비류폭류의 증발 수증기로 함정을 파괴할 때, _40%_ 확률로 _1개의 함정 결정 기둥_이 생성됩니다.\n\n_+3：_비류폭류의 증발 수증기로 함정을 파괴할 때, _60%_ 확률로 _1개의 함정 결정 기둥_이 생성됩니다.\n\n_+4：_비류폭류의 증발 수증기로 함정을 파괴할 때, _80%_ 확률로 _1개의 함정 결정 기둥_이 생성됩니다.
actors.hero.talent.ninja_meal.desc=_+1：_섭취 시, _50%_ 확률로 _수리검 상자 1개_를 얻습니다.\n\n_+2：_섭취 시, _100%_ 확률로 _수리검 상자 1개_를 얻습니다.
actors.hero.talent.ninja_social.desc=_+1：_닌자가 물리 무기로 적을 처치한 후, 다음 _3회 공격_의 정확도가 50% 향상됩니다.\n\n_+2：_닌자가 물리 무기로 적을 처치한 후, 다음 _5회 공격_의 정확도가 50% 향상됩니다.
actors.hero.talent.no_pick.desc=_+1：_적을 삼켜 회복하는 포만감이 _20% 향상_됩니다.\n\n_+2：_적을 삼켜 회복하는 포만감이 _40% 향상_됩니다.\n\n_+3：_적을 삼켜 회복하는 포만감이 _60% 향상_됩니다.\n\n_+4：_적을 삼켜 회복하는 포만감이 _80% 향상_됩니다.
actors.hero.talent.offensive.desc=_+1：_물리 공격이 _10%_의 추가 피해를 입힙니다.\n\n_+2：_물리 공격이 _20%_의 추가 피해를 입힙니다.\n\n_+3：_물리 공격이 _30%_의 추가 피해를 입힙니다.
actors.hero.talent.original_monster.desc=_+1：_변화한 적의 최대 생명력이 _15%_ 증가하고, 피해가 _15%_ 증가합니다.\n\n_+2：_변화한 적의 최대 생명력이 _30%_ 증가하고, 피해가 _30%_ 증가합니다.
actors.hero.talent.over_code.desc=_+1：_두루마리 읽기 시, _50%_ 확률로 추가 효과를 얻습니다.\n\n_+2：_두루마리 읽기 시, _100%_ 확률로 추가 효과를 얻습니다.
actors.hero.talent.over_extend.desc=_+1：_무기와 방어구의 필요 힘이 _1_ 감소합니다.\n\n_+2：_무기와 방어구의 필요 힘이 _2_ 감소합니다.\n\n_+3：_무기와 방어구의 필요 힘이 _3_ 감소합니다.
actors.hero.talent.over_meal.desc=_+1：_섭취 시, _30%_ 확률로 이번 섭취가 턴을 소모하지 않습니다.\n\n_+2：_섭취 시, _60%_ 확률로 이번 섭취가 턴을 소모하지 않습니다.
actors.hero.talent.over_time.desc=_+1：_DM-400의 과부하 모드 지속 시간이 _15턴_으로 증가합니다.\n\n_+2：_DM-400의 과부하 모드 지속 시간이 _20턴_으로 증가합니다.\n\n_+3：_DM-400의 과부하 모드 지속 시간이 _25턴_으로 증가합니다.\n\n_+4：_DM-400의 과부하 모드 지속 시간이 _30턴_으로 증가합니다.
actors.hero.talent.perfect_copy.desc=_+1：_그림자 무사가 주인으로부터 _20%_의 공격력을 상속받습니다.\n\n_+2：_그림자 무사가 주인으로부터 _35%_의 공격력을 상속받습니다.\n\n_+3：_그림자 무사가 주인으로부터 _50%_의 공격력을 상속받습니다.
actors.hero.talent.potent_healing.desc=_+1：_약초 요양의 치유 속도가 _50%_ 증가합니다.\n\n_+2：_약초 요양의 치유 속도가 _100%_ 증가합니다.
actors.hero.talent.potent_ooze.desc=_+1：_슬라임 양이 입히는 부식 피해가 _25%_ 증가합니다.\n\n_+2：_슬라임 양이 입히는 부식 피해가 _50%_ 증가합니다.
actors.hero.talent.power_gunpowder.desc=_+1：_평거미 솥 폭발 피해가 _25~55_로 증가합니다.\n\n_+2：_+1에 더해, 평거미 솥 폭발 범위가 _5x5_로 증가합니다.\n\n_+3：_평거미 솥 폭발 피해가 _30~70_로 증가합니다.\n\n_+4：_+3에 더해, 평거미 솥 폭발 범위가 _7x7_로 증가합니다.
actors.hero.talent.process_extend.desc=_+1：_군집 프로그램 가동 중, 드론이 파괴될 때마다 프로그램의 유효 시간이 _0.5턴_ 연장됩니다.\n\n_+2：_군집 프로그램 가동 중, 드론이 파괴될 때마다 프로그램의 유효 시간이 _1턴_ 연장됩니다.\n\n_+3：_군집 프로그램 가동 중, 드론이 파괴될 때마다 프로그램의 유효 시간이 _1.5턴_ 연장됩니다.\n\n_+4：_군집 프로그램 가동 중, 드론이 파괴될 때마다 프로그램의 유효 시간이 _2턴_ 연장됩니다.
actors.hero.talent.projectile_momentum.desc=_+1：_투척 무기의 사거리가 _1칸_ 증가합니다.\n\n_+2：_투척 무기의 사거리가 _2칸_ 증가합니다.\n\n_+3：_투척 무기의 사거리가 _3칸_ 증가합니다.
actors.hero.talent.protective_shadows.desc=_+1：_닌자가 그림자 무사와 함께 있을 때, 받는 피해가 _10%_ 감소합니다.\n\n_+2：_닌자가 그림자 무사와 함께 있을 때, 받는 피해가 _20%_ 감소합니다.
actors.hero.talent.provoked_anger.desc=_+1：_전사가 피해를 입을 때, _50%_ 확률로 추가 분노를 얻습니다.\n\n_+2：_전사가 피해를 입을 때, _100%_ 확률로 추가 분노를 얻습니다.
actors.hero.talent.qianfa_throwing.desc=_+1：_투척 무기의 공격 속도가 _30%_ 증가합니다.\n\n_+2：_투척 무기의 공격 속도가 _60%_ 증가합니다.\n\n_+3：_투척 무기의 공격 속도가 _100%_ 증가합니다.
actors.hero.talent.quality_absorption.desc=_+1：_물주머니의 이슬 1회 흡수량이 _생명력 회복 +1_ 증가합니다.\n\n_+2：_물주머니의 이슬 1회 흡수량이 _생명력 회복 +2_ 증가합니다.
actors.hero.talent.quick_search.desc=_+1：_수색 속도가 _10%_ 증가합니다.\n\n_+2：_수색 속도가 _20%_ 증가합니다.
actors.hero.talent.quick_tool.desc=_+1：_DM-400의 드론 생산 속도가 _20%_ 증가합니다.\n\n_+2：_DM-400의 드론 생산 속도가 _40%_ 증가합니다.\n\n_+3：_DM-400의 드론 생산 속도가 _60%_ 증가합니다.
actors.hero.talent.quick_tool.meta_desc=_이 재능이 다른 영웅에게 획득될 경우_, +1/+2/+3 레벨에서 유물 충전 속도가 10%/20%/30% 증가합니다.
actors.hero.talent.reactive_barrier.desc=_+1：_영웅이 디버프를 받을 때, _50%_ 확률로 _2의 보호막_을 얻습니다.\n\n_+2：_영웅이 디버프를 받을 때, _100%_ 확률로 _2의 보호막_을 얻습니다.
actors.hero.talent.recover_charge.desc=_+1：_영웅이 두루마리나 무질서 마법서를 읽은 후, _2턴_의 유물 충전을 얻습니다.\n\n_+2：_영웅이 두루마리나 무질서 마법서를 읽은 후, _4턴_의 유물 충전을 얻습니다.
actors.hero.talent.recover_charge.meta_desc=_이 재능이 다른 영웅에게 획득될 경우_, +1에서 영웅이 두루마리나 무질서 마법서를 읽은 후 2턴의 유물 충전을, +2에서 4턴의 유물 충전을 얻습니다.
actors.hero.talent.remote_beacon.desc=_+1：_신호의 최대 거리가 _2칸_ 증가합니다.\n\n_+2：_신호의 최대 거리가 _4칸_ 증가합니다.\n\n_+3：_신호의 최대 거리가 _6칸_ 증가합니다.
actors.hero.talent.resilient_meal.desc=_+1：_섭취 시, _50%_ 확률로 _2턴 동안 0~3의 나무 껍질_을 얻습니다.\n\n_+2：_섭취 시, _100%_ 확률로 _3턴 동안 0~3의 나무 껍질_을 얻습니다.
actors.hero.talent.rocket_fist.desc=_+1：_물리 공격이 _25%_ 확률로 대상을 _1칸_ 밀쳐냅니다.\n\n_+2：_물리 공격이 _50%_ 확률로 대상을 _1칸_ 밀쳐냅니다.
actors.hero.talent.rogues_foresight.desc=_+1：_도적이 새로운 층에 진입할 때마다, _20%_ 확률로 함정의 위치를 드러냅니다.\n\n_+2：_도적이 새로운 층에 진입할 때마다, _40%_ 확률로 함정의 위치를 드러냅니다.\n\n_+3：_도적이 새로운 층에 진입할 때마다, _60%_ 확률로 함정의 위치를 드러냅니다.
actors.hero.talent.runic_transference.desc=_+1：_완드 사용 시 사용한 _완드에 1회 충전_됩니다.\n\n_+2：_완드 사용 시 사용한 _완드에 2회 충전_됩니다.\n\n_+3：_완드 사용 시 사용한 _완드에 3회 충전_됩니다.
actors.hero.talent.runic_transference.meta_desc=_이 재능이 다른 영웅에게 획득될 경우_, +1/+2/+3 레벨에서 완드 사용 시 사용한 완드에 1/2/3회 충전됩니다.
actors.hero.talent.scholars_intuition.desc=_+1：_미확인 두루마리나 마법서를 확인할 때, _25%_ 확률로 두 배의 지식을 얻습니다.\n\n_+2：_미확인 두루마리나 마법서를 확인할 때, _50%_ 확률로 두 배의 지식을 얻습니다.
actors.hero.talent.shadow_blade.desc=_+1：_칼날 투사체의 피해가 _10%_ 증가합니다.\n\n_+2：_칼날 투사체의 피해가 _20%_ 증가합니다.\n\n_+3：_칼날 투사체의 피해가 _30%_ 증가합니다.
actors.hero.talent.shadow_step.desc=_+1：_그림자 무사에게 순간 이동 시, 피해가 _20%_ 증가합니다.\n\n_+2：_그림자 무사에게 순간 이동 시, 피해가 _40%_ 증가합니다.\n\n_+3：_그림자 무사에게 순간 이동 시, 피해가 _60%_ 증가합니다.
actors.hero.talent.shield_battery.desc=_+1：_DM-400의 과부하 모드가 유지되는 동안, 매 턴 _2의 보호막_을 얻습니다.\n\n_+2：_DM-400의 과부하 모드가 유지되는 동안, 매 턴 _3의 보호막_을 얻습니다.\n\n_+3：_DM-400의 과부하 모드가 유지되는 동안, 매 턴 _4의 보호막_을 얻습니다.\n\n_+4：_DM-400의 과부하 모드가 유지되는 동안, 매 턴 _5의 보호막_을 얻습니다.
actors.hero.talent.shinkage.desc=_+1：_인술 에너지의 충전 속도가 _15%_ 증가합니다.\n\n_+2：_인술 에너지의 충전 속도가 _30%_ 증가합니다.\n\n_+3：_인술 에너지의 충전 속도가 _45%_ 증가합니다.
actors.hero.talent.shock_force.desc=_+1：_진동 충격파가 _2_의 추가 피해를 입힙니다.\n\n_+2：_진동 충격파가 _4_의 추가 피해를 입힙니다.\n\n_+3：_진동 충격파가 _6_의 추가 피해를 입힙니다.\n\n_+4：_진동 충격파가 _8_의 추가 피해를 입힙니다.
actors.hero.talent.shrug_it_off.desc=_+1：_전사가 방어할 때, _15%_ 확률로 피해를 완전히 무시합니다.\n\n_+2：_전사가 방어할 때, _30%_ 확률로 피해를 완전히 무시합니다.\n\n_+3：_전사가 방어할 때, _45%_ 확률로 피해를 완전히 무시합니다.
actors.hero.talent.silent_steps.desc=_+1：_도적이 피해를 입었을 때, _1턴_의 보이지 않는 상태를 얻습니다.\n\n_+2：_도적이 피해를 입었을 때, _2턴_의 보이지 않는 상태를 얻습니다.
actors.hero.talent.slime_greenhouse.desc=_+1：_변태된 열매, 덩굴 씨앗, 포자 구, 수집한 불씨가 자연 분해될 때, _30%_ 확률로 1회 충전을 얻습니다.\n\n_+2：_변태된 열매, 덩굴 씨앗, 포자 구, 수집한 불씨가 자연 분해될 때, _60%_ 확률로 1회 충전을 얻습니다.
actors.hero.talent.slime_greenhouse.meta_desc=_이 재능이 다른 영웅에게 획득될 경우_, +1/+2 레벨에서 변태된 열매, 덩굴 씨앗, 포자 구, 수집한 불씨가 자연 분해될 때 20%/40% 확률로 1회 충전을 얻습니다.
actors.hero.talent.soko.desc=_+1：_50%_ 확률로 분노 수치가 필요치 않게 광폭화합니다.\n\n_+2：_100%_ 확률로 분노 수치가 필요치 않게 광폭화합니다.
actors.hero.talent.soul_eater.desc=_+1：_강령술사가 적을 처치할 때, _20%_ 확률로 시체에서 하수인을 소환합니다.\n\n_+2：_강령술사가 적을 처치할 때, _40%_ 확률로 시체에서 하수인을 소환합니다.
actors.hero.talent.soul_hunting.desc=_+1：_강령술사가 하수인과 함께 있을 때, _모든 피해가 15% 증가_합니다.\n\n_+2：_강령술사가 하수인과 함께 있을 때, _모든 피해가 30% 증가_합니다.
actors.hero.talent.soul_siphon.desc=_+1：_강령술사가 직접 적을 처치할 때, 처치한 적의 생명력의 _20%_를 회복합니다.\n\n_+2：_강령술사가 직접 적을 처치할 때, 처치한 적의 생명력의 _40%_를 회복합니다.
actors.hero.talent.special_mark.desc=_+1：_물리 공격 시, _10%_ 확률로 적에게 _2턴의 지휘 표식_을 부여합니다.\n\n_+2：_물리 공격 시, _20%_ 확률로 적에게 _2턴의 지휘 표식_을 부여합니다.\n\n_+3：_물리 공격 시, _30%_ 확률로 적에게 _2턴의 지휘 표식_을 부여합니다.
actors.hero.talent.speedy_stealth.desc=_+1：_닌자가 투명 상태일 때, 이동 속도가 _15%_ 증가합니다.\n\n_+2：_닌자가 투명 상태일 때, 이동 속도가 _30%_ 증가합니다.\n\n_+3：_닌자가 투명 상태일 때, 이동 속도가 _45%_ 증가합니다.
actors.hero.talent.striking_wave.desc=_+1：_군중 제어의 효과 범위가 _2×1 직선_으로 확장됩니다.\n\n_+2：_군중 제어의 효과 범위가 _3×1 직선_으로 확장됩니다.
actors.hero.talent.strong_perserve.desc=_+1：_속박이 적을 완전히 무력화시킬 확률이 15% 증가합니다.\n\n_+2：_속박이 적을 완전히 무력화시킬 확률이 30% 증가합니다.
actors.hero.talent.strongman.desc=_+1：_전사의 힘 요구량이 _1_ 감소합니다.\n\n_+2：_전사의 힘 요구량이 _2_ 감소합니다.\n\n_+3：_전사의 힘 요구량이 _3_ 감소합니다.
actors.hero.talent.sucker_punch.desc=_+1：_닌자가 적을 처치한 후, _50%_ 확률로 추가 턴을 얻습니다.\n\n_+2：_닌자가 적을 처치한 후, _100%_ 확률로 추가 턴을 얻습니다.
actors.hero.talent.survivalists_intuition.desc=_+1：_여사냥꾼이 새로운 층에 진입할 때마다, _20%_ 확률로 층의 계단 위치를 드러냅니다.\n\n_+2：_여사냥꾼이 새로운 층에 진입할 때마다, _40%_ 확률로 층의 계단 위치를 드러냅니다.\n\n_+3：_여사냥꾼이 새로운 층에 진입할 때마다, _60%_ 확률로 층의 계단 위치를 드러냅니다.
actors.hero.talent.sustain_mark.desc=_+1：_지휘 표식의 지속 시간이 _2턴_ 증가합니다.\n\n_+2：_지휘 표식의 지속 시간이 _5턴_ 증가합니다.
actors.hero.talent.sustained_retribution.desc=_+1：_닌자의 반격이 유지되는 시간이 _2턴_ 증가합니다.\n\n_+2：_닌자의 반격이 유지되는 시간이 _4턴_ 증가합니다.\n\n_+3：_닌자의 반격이 유지되는 시간이 _6턴_ 증가합니다.
actors.hero.talent.target_targeting.desc=_+1：_DM-400과 드론의 집합 명령이 모든 아군에게 할당된 대상을 알려줍니다. 집합 명령 쿨다운이 _20%_ 감소합니다.\n\n_+2：_DM-400과 드론의 집합 명령이 모든 아군에게 할당된 대상을 알려줍니다. 집합 명령 쿨다운이 _40%_ 감소합니다.\n\n_+3：_DM-400과 드론의 집합 명령이 모든 아군에게 할당된 대상을 알려줍니다. 집합 명령 쿨다운이 _60%_ 감소합니다.
actors.hero.talent.target_targeting.meta_desc=_이 재능이 다른 영웅에게 획득될 경우_, 집합 명령 쿨다운이 +1/+2/+3 레벨에서 5%/10%/15% 감소합니다.
actors.hero.talent.tbm.desc=_+1：_적 처치 시, _15%_ 확률로 폭발하는 시체를 생성합니다.\n\n_+2：_적 처치 시, _30%_ 확률로 폭발하는 시체를 생성합니다.\n\n_+3：_적 처치 시, _45%_ 확률로 폭발하는 시체를 생성합니다.
actors.hero.talent.tea_stains.desc=_+1：_물주머니의 최대 이슬 저장량이 _5_ 증가합니다.\n\n_+2：_물주머니의 최대 이슬 저장량이 _10_ 증가합니다.
actors.hero.talent.telefrag.desc=_+1：_암살자가 적에게 순간 이동할 때, _50%_ 확률로 _3의 추가 피해_를 입힙니다.\n\n_+2：_암살자가 적에게 순간 이동할 때, _100%_ 확률로 _3의 추가 피해_를 입힙니다.
actors.hero.talent.terror_mach.desc=_+1：_전투 드론이 적에게 피해를 입힐 때, _10%_ 확률로 대상을 _1턴 공포_에 빠뜨립니다.\n\n_+2：_전투 드론이 적에게 피해를 입힐 때, _20%_ 확률로 대상을 _1턴 공포_에 빠뜨립니다.\n\n_+3：_전투 드론이 적에게 피해를 입힐 때, _30%_ 확률로 대상을 _1턴 공포_에 빠뜨립니다.
actors.hero.talent.thiefs_intuition.desc=_+1：_도적이 새로운 층에 진입할 때마다, _20%_ 확률로 근처의 중요한 아이템 위치를 드러냅니다.\n\n_+2：_도적이 새로운 층에 진입할 때마다, _40%_ 확률로 근처의 중요한 아이템 위치를 드러냅니다.\n\n_+3：_도적이 새로운 층에 진입할 때마다, _60%_ 확률로 근처의 중요한 아이템 위치를 드러냅니다.
actors.hero.talent.tough_meal.desc=_+1：_섭취 시, 추가로 _2의 보호막_을 얻습니다.\n\n_+2：_섭취 시, 추가로 _4의 보호막_을 얻습니다.
actors.hero.talent.upon_wave.desc=_+1：_파도 충격파의 사거리가 _2칸_ 증가합니다.\n\n_+2：_파도 충격파의 사거리가 _4칸_ 증가합니다.\n\n_+3：_파도 충격파의 사거리가 _6칸_ 증가합니다.
actors.hero.talent.use_environment.desc=_+1：_여사냥꾼이 함정을 해체할 때, _25%_ 확률로 해당 층의 적에게 무작위 디버프를 부여합니다.\n\n_+2：_여사냥꾼이 함정을 해체할 때, _50%_ 확률로 해당 층의 적에게 무작위 디버프를 부여합니다.
actors.hero.talent.veterans_intuition.desc=_+1：_전사가 새로운 층에 진입할 때마다, _20%_ 확률로 근처의 위험을 드러냅니다.\n\n_+2：_전사가 새로운 층에 진입할 때마다, _40%_ 확률로 근처의 위험을 드러냅니다.\n\n_+3：_전사가 새로운 층에 진입할 때마다, _60%_ 확률로 근처의 위험을 드러냅니다.
actors.hero.talent.violent_storm.desc=_+1：_원소 폭풍이 _15%_ 더 많은 피해를 입힙니다.\n\n_+2：_원소 폭풍이 _30%_ 더 많은 피해를 입힙니다.\n\n_+3：_원소 폭풍이 _45%_ 더 많은 피해를 입힙니다.
actors.hero.talent.wand_preservation.desc=_+1：_완드 사용 시, _15%_ 확률로 충전을 소모하지 않습니다.\n\n_+2：_완드 사용 시, _30%_ 확률로 충전을 소모하지 않습니다.\n\n_+3：_완드 사용 시, _45%_ 확률로 충전을 소모하지 않습니다.
actors.hero.talent.wand_preservation.meta_desc=_이 재능이 다른 영웅에게 획득될 경우_, +1/+2/+3 레벨에서 완드 사용 시 10%/20%/30% 확률로 충전을 소모하지 않습니다.
actors.hero.talent.water_body.desc=_+1：_슬라임이 물에 들어갈 때, 주변 1칸 내의 적을 밀쳐내고 _3턴의 쇠약_을 부여합니다.\n\n_+2：_슬라임이 물에 들어갈 때, 주변 1칸 내의 적을 밀쳐내고 _5턴의 쇠약_을 부여합니다.\n\n_+3：_슬라임이 물에 들어갈 때, 주변 2칸 내의 적을 밀쳐내고 _8턴의 쇠약_을 부여합니다.
actors.hero.talent.water_regeneration.desc=_+1：_물 속에서 슬라임의 생명력 재생이 매 턴 _2_ 증가합니다.\n\n_+2：_물 속에서 슬라임의 생명력 재생이 매 턴 _4_ 증가합니다.\n\n_+3：_물 속에서 슬라임의 생명력 재생이 매 턴 _6_ 증가합니다.
actors.hero.talent.water_revival.desc=_+1：_물 속에 있을 때, 슬라임의 방어구가 _25%_ 증가합니다.\n\n_+2：_물 속에 있을 때, 슬라임의 방어구가 _50%_ 증가합니다.
actors.hero.talent.water_wave.desc=_+1：_좌충우돌 돌진의 피해가 5% 증가하고, 돌진의 바닥 충격파에 적중당한 적이 _1턴 마비_됩니다.\n\n_+2：_좌충우돌 돌진의 피해가 10% 증가하고, 돌진의 바닥 충격파에 적중당한 적이 _2턴 마비_됩니다.
actors.hero.talent.wide_search.desc=_+1：_수색 범위가 _1칸_ 증가합니다.\n\n_+2：_수색 범위가 _2칸_ 증가합니다.\n\n_+3：_수색 범위가 _3칸_ 증가합니다.
actors.hero.talent.wide_search.meta_desc=_이 재능이 다른 영웅에게 획득될 경우_, +1/+2/+3 레벨에서 수색 범위가 1/2/3칸 증가합니다.
actors.hero.talent.wild_power.desc=_+1：_물리 공격 시 _1_의 추가 번개 피해를 입힙니다.\n\n_+2：_물리 공격 시 _2_의 추가 번개 피해를 입힙니다.\n\n_+3：_물리 공격 시 _3_의 추가 번개 피해를 입힙니다.
actors.hero.talent.xia.desc=_+1：_아이템 획득 속도가 _10%_ 증가합니다.\n\n_+2：_아이템 획득 속도가 _20%_ 증가합니다.\n\n_+3：_아이템 획득 속도가 _30%_ 증가합니다.\n\n_+4：_아이템 획득 속도가 _40%_ 증가합니다.
actors.hero.talent.you_scared_me.desc=_+1：_닌자가 주변에 적이 나타날 때, _1턴_의 극속을 얻습니다.\n\n_+2：_닌자가 주변에 적이 나타날 때, _2턴_의 극속을 얻습니다.
actors.hero.talent.yunying_meal.desc=_+1：_식사 시, _2턴_의 극속을 얻습니다.\n\n_+2：_식사 시, _4턴_의 극속을 얻습니다.\n\n_+3：_식사 시, _6턴_의 극속을 얻습니다.

_+2：_풀숲에 있을 때,守望者은 레벨의 _0~100%_에 해당하는 수피 효과를 얻으며, 이 효과는 매 턴마다 감소한다.

_+3：_풀숲에 있을 때,守望者은 레벨의 _0~150%_에 해당하는 수피 효과를 얻으며, 이 효과는 매 턴마다 감소한다.
actors.mobs.npcs.shopkeeper.talk_prison_ninja=DOMO, 닌자=SAN, 점장 DESU. 머나먼 동양의 나라에서 무슨 일로 여기까지 오셨습니까? 아니면 수십 년이 지나서야 여기에 갇힌 「배신자」를 처리하러 오신 겁니까? 어찌 되었든 내가 신경 쓸 일은 아니지. 내가 진짜 신경 쓰는 건 오직 골드뿐이니, 관심이 있다면 여기서 필요한 걸 골라보시지.
