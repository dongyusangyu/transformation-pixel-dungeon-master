actors.hero.spells.credulous.name=신앙 배반
actors.hero.spells.credulous.short_desc=일정 시간 동안 마법 면역을 얻습니다。
actors.hero.spells.credulous.desc=시전자가 잠시 마법에 대한 감각을 포기하여 _10턴 마법 면역_을 얻습니다。\n\n이 법술 시전 _1턴 소모_。
actors.hero.spells.credulous.desc_instant=이 법술은 +2 레벨에서 시전 _시간 소모 없음_。

actors.hero.talent.ravens_eye.title=까마귀의 눈
actors.hero.talent.ravens_eye.desc=_+1：_수사가 _이성 30_을 소모하여 아이템에 저주가 있는지 검사할 수 있습니다。\n\n_+2：_수사가 _이성 20_을 소모하여 아이템에 저주가 있는지 검사할 수 있습니다。
actors.hero.talent.ravens_eye.comment=
actors.hero.talent.ravens_eye.meta_desc=_이 재능이 다른 영웅에게 획득될 경우_, 영웅이 아이템을 검사할 수 있게 되지만 출혈이 발생합니다. +1에서 기본값 6의 출혈, +2에서 기본값 4의 출혈。
actors.hero.talent.ravens_eye.action=검사

actors.hero.talent.crystal_gunpowder.title=결정 화약
actors.hero.talent.crystal_gunpowder.desc=_+1：_수사가 연금 에너지 1을 가질 때마다 물리 공격이 _1의 추가 피해_를 입힙니다。\n\n_+2：_수사가 연금 에너지 1을 가질 때마다 물리 공격이 _2의 추가 피해_를 입힙니다。
actors.hero.talent.crystal_gunpowder.comment=이 재능을 통해 얻는 추가 피해 보너스는 _+1/+2_ 레벨에서 _2/4_를 초과할 수 없습니다。

actors.hero.talent.bulwark_greatshield.title=방벽 대방패
actors.hero.talent.bulwark_greatshield.desc=_+1：_수사가 막기를 가진 무기를 장비할 때, _10% 물리 피해 감소_를 얻습니다。\n\n_+2：_수사가 막기를 가진 무기를 장비할 때, _15% 물리 피해 감소_를 얻습니다。
actors.hero.talent.bulwark_greatshield.comment=막기를 가진 무기에는 레이피어, 팔 방패, 철퇴, 원형 방패, 가타나 및 대형 방패가 포함됩니다。

actors.hero.talent.whispering_meal.title=속삭임 식사
actors.hero.talent.whispering_meal.desc=_+1：_수사가 _1턴_만 소모하여 섭취하며(안정 팅크제 섭취는 턴 소모 없음), 시야 내 적에게 _2턴 공포_를 부여합니다。\n\n_+2：_수사가 _1턴_만 소모하여 섭취하며(안정 팅크제 섭취는 턴 소모 없음), 시야 내 적에게 _4턴 공포_를 부여합니다。
actors.hero.talent.whispering_meal.comment=

actors.hero.talent.liquid_barrier.title=액체 장벽
actors.hero.talent.liquid_barrier.desc=_+1：_수사가 물약, 마법 물약 또는 비밀 약을 마시거나 던질 때, _5턴_ 동안 정화 장벽을 얻습니다。\n\n_+2：_수사가 물약, 마법 물약 또는 비밀 약을 마시거나 던질 때, _10턴_ 동안 정화 장벽을 얻습니다。
actors.hero.talent.liquid_barrier.comment=힘의 물약, 경험의 물약 또는 위 물약들로 제련한 연금 아이템을 사용할 경우, 얻는 정화 보호막의 지속 시간이 두 배가 됩니다.\n\n생산량이 많은 연금 아이템(예: 폭발물 주머니)의 경우, 이 특성은 해당 아이템의 단일 생산 수량에 기반한 확률로 발동합니다.
actors.hero.talent.fast_reload.title=빠른 장전
actors.hero.talent.fast_reload.desc=_+1：_수사가 연금 분사기에 에너지를 장전할 때 _더 이상 시간을 소모하지 않습니다_。\n\n_+2：_+1의 효과에 더해, 수사가 연금 분사기에 에너지를 장전한 후 _1턴_의 비영(순간 이동)을 얻습니다。
actors.hero.talent.fast_reload.comment=
actors.hero.talent.fast_reload.meta_desc=_이 재능이 다른 영웅에게 획득될 경우_, 영웅이 액체 금속으로 투척 무기의 내구도를 수리할 때 비영 효과를 얻습니다. +1에서 1턴, +2에서 2턴。
actors.hero.talent.otherworld_bane.title=이계 마물 퇴치자
actors.hero.talent.otherworld_bane.desc=_+1：_수사가 _언데드 및 악마_ 속성의 적을 처치한 후, _2턴_의 투시를 얻습니다。\n\n_+2：_수사가 _언데드 및 악마_ 속성의 적을 처치한 후, _3턴_의 투시를 얻습니다。
actors.hero.talent.otherworld_bane.comment=
actors.hero.talent.bullseye.title=정확히 명중
actors.hero.talent.bullseye.desc=_+1：_수사가 적에게 표창 또는 약물 표창을 던질 때 _50% 추가 명중률_을 가지며 _3의 추가 피해_를 입힙니다。\n\n_+2：_수사가 적에게 표창 또는 약물 표창을 던질 때 _75% 추가 명중률_을 가지며 _5의 추가 피해_를 입힙니다。
actors.hero.talent.bullseye.comment=

actors.hero.talent.midas_touch.title=미다스의 손
actors.hero.talent.midas_touch.desc=_+1：_수사가 _액체 금속 20병_을 얻고, 액체 금속을 무작위 물약으로 전환할 수 있습니다。\n\n_+2：_수사가 _액체 금속 40병_을 얻고, 액체 금속을 무작위 물약으로 전환할 수 있습니다。\n\n_+3：_수사가 _액체 금속 60병_을 얻고, 액체 금속을 무작위 물약으로 전환할 수 있습니다。
actors.hero.talent.midas_touch.comment=액체 금속은 힘 물약으로 전환할 수 없으며, 물약 하나를 전환하는 데 항상 _액체 금속 20병_이 소모됩니다。\n\n이러한 업그레이드 또는 변태를 통해 직접 자원을 획득하는 재능은 _26회 발동 제한_(신사는 _39회_)을 공유합니다。
actors.hero.talent.human_glory.title=인간의 광휘
actors.hero.talent.human_glory.desc=_+1：_수사의 이성이 0이 되었을 때, 미덕을 얻을 확률이 25%에서 _30%_로 증가합니다。\n\n_+2：_수사의 이성이 0이 되었을 때, 미덕을 얻을 확률이 25%에서 _35%_로 증가합니다。\n\n_+3：_수사의 이성이 0이 되었을 때, 미덕을 얻을 확률이 25%에서 _40%_로 증가합니다。
actors.hero.talent.human_glory.comment=주의, 미덕 확률 증가는 고통 확률 감소를 의미합니다. 이 재능의 _+1/+2/+3_ 레벨에서 고통을 얻을 확률이 75%에서 _70/65/60%_로 감소합니다。
actors.hero.talent.human_glory.meta_desc=_이 재능이 다른 영웅에게 획득될 경우_, +1/+2/+3 레벨에서 영웅의 명중률과 회피율이 10/20/30% 증가합니다。

actors.hero.herosubclass.alchemist=연금술사
actors.hero.herosubclass.alchemist_short_desc=_연금술사_는 연금 시 더 낮은 연금 에너지 소모를 가지며, 더 강력한 연금 분사기를 사용합니다。
actors.hero.herosubclass.alchemist_desc=연금술사는 연금에 더 능숙합니다. 연금 에너지 소모가 필요한 연금 산물을 제작할 때, 필요한 연금 에너지 소모가 3 감소합니다(최소 1의 소모는 유지)。\n\n연금술사의 연금 분사기는 이제 일정한 마법 피해를 입힐 수 있으며, 더 넓은 분사 범위와 더 강력한 물약 장전 효과를 가집니다。\n\n_무작위 모드_가 활성화된 경우, 연금 분사기를 소지하지 않은 상태에서 이 전문화를 선택하면 연금 분사기 하나를 얻습니다。

actors.hero.talent.alchemy_shield.title=연금 장벽
actors.hero.talent.alchemy_shield.desc=_+1：_연금술사의 연금 에너지 소모 감소가 3에서 _4_로 증가하고, 연금 에너지를 소모할 때마다(분사기 장전 포함) _1중_ 연금 장벽을 얻습니다。\n\n_+2：_연금술사의 연금 에너지 소모 감소가 3에서 _5_로 증가하고, 연금 에너지를 소모할 때마다(분사기 장전 포함) _2중_ 연금 장벽을 얻습니다。\n\n_+3：_연금술사의 연금 에너지 소모 감소가 3에서 _6_으로 증가하고, 연금 에너지를 소모할 때마다(분사기 장전 포함) _3중_ 연금 장벽을 얻습니다。
actors.hero.talent.alchemy_shield.comment=연금 장벽은 이후 몇 회의 피격 피해를 현재 연금 에너지에 기반하여 감소시키며, 피격 시 1중씩 감소하고 최대 3중까지 중첩됩니다。
actors.hero.talent.close_blast.title=근거리 사격
actors.hero.talent.close_blast.desc=_+1：_연금술사의 연금 분사기가 가까운 목표일수록 더 높은 피해를 입히며, 최대 거리에서는 추가 피해가 없고, 1칸 가까워질 때마다 _10% 추가 피해_, 최대 _40% 추가 피해_。\n\n_+2：_연금술사의 연금 분사기가 가까운 목표일수록 더 높은 피해를 입히며, 최대 거리에서는 추가 피해가 없고, 1칸 가까워질 때마다 _15% 추가 피해_, 최대 _60% 추가 피해_。\n\n_+3：_연금술사의 연금 분사기가 가까운 목표일수록 더 높은 피해를 입히며, 최대 거리에서는 추가 피해가 없고, 1칸 가까워질 때마다 _20% 추가 피해_, 최대 _80% 추가 피해_。
actors.hero.talent.close_blast.comment=
actors.hero.talent.conservation.title=절약 풍토
actors.hero.talent.conservation.desc=_+1：_연금술사의 연금 분사기가 분사 시 _10% 확률_로 약액을 소모하지 않으며, 물약 장전 후 _30% 확률_로 물약을 소모하지 않습니다。\n\n_+2：_연금술사의 연금 분사기가 분사 시 _20% 확률_로 약액을 소모하지 않으며, 물약 장전 후 _45% 확률_로 물약을 소모하지 않습니다。\n\n_+3：_연금술사의 연금 분사기가 분사 시 _30% 확률_로 약액을 소모하지 않으며, 물약 장전 후 _60% 확률_로 물약을 소모하지 않습니다。
actors.hero.talent.conservation.comment=이 재능이 물약 장전 효과를 발동할 때, 분사기의 약액 잔량은 정상적으로 보충되며, 힘 물약은 항상 소모되지 않고 약액 잔량도 보충되지 않습니다。
actors.hero.talent$alchemyshield.name=연금 장벽
actors.hero.talent$alchemyshield.desc=연금 에너지로 구성된 장벽이 당신을 감싸 적의 공격 피해를 막아줍니다。\n\n연금 에너지를 소모할 때마다 일정 중첩의 연금 장벽이 형성되며, 최대 3중까지입니다. 연금 장벽의 보호 아래, 적의 물리 피해를 5 감소시키고, 현재 연금 에너지 1당 추가로 1 감소시켜 최대 20까지 감소시킵니다。\n\n현재 연금 에너지 기준으로, 각 중첩의 연금 장벽은 %1 물리 피해를 감소시킵니다。\n\n현재 %2 연금 장벽이 있으며, 피격 시 1중씩 소모됩니다。

actors.hero.herosubclass.pious=독실한 자
actors.hero.herosubclass.pious_short_desc=_독실한 자_는 의식 단검을 얻어 빠르게 사용하거나 이성을 회복/감소시키는 데 사용할 수 있습니다. 또한 기존의 모든 고통을 대체하는 새로운 고통을 얻습니다。
actors.hero.herosubclass.pious_desc=독실한 자는 의식 단검을 얻습니다. 의식 단검은 장비하지 않아도 바로 사용할 수 있습니다. 의식 단검으로 공격하면 영구적인 혈액 선물 효과가 발생하며, 이 효과가 있는 적이 생명력을 잃을 때 독실한 자에게 소량의 이성을 회복시킵니다. 또한 독실한 자가 일정 수의 적을 처치할 때마다 시간 소모 없이 필중 찌르기를 사용할 수 있습니다. 찌르기를 사용할 때, 적을 찌르면 많은 이성을 회복하고, 자신을 찌르면 많은 이성을 감소시킵니다。\n\n독실한 자는 이성이 0이 되었을 때 고통 또는 미덕을 얻습니다. 다른 점은 기존의 모든 고통을 대체하는 새로운 고통을 얻을 수 있다는 것입니다. 새로운 고통: 황홀경, 자신이 입히는 물리 피해와 공격 속도를 크게 향상시키지만 회피율이 크게 감소합니다。\n\n이 전문화는 의식 단검으로 찌르기를 사용할 수 있을 때 특수 능력을 가지며, 동시에 여러 특수 능력을 가질 때는 단축 기능을 길게 눌러 특수 능력을 전환할 수 있습니다. _무작위 모드_가 활성화된 경우, 이성 능력을 소유하지 않은 상태에서 이 전문화를 선택하면 이성 능력을 얻지만, 일부 아이템, 환경 등과의 상호작용에서만 일정 회복 및 감소 효과가 유지되며, 이를 연금 에너지로 전환할 수 없습니다。

actors.buffs.suffering$ecstasy.name=고통: 황홀경
actors.buffs.suffering$ecstasy.desc=광기여, 나의 오랜 벗이여!\n\n이 고통 기간 동안, 공격 속도 +50%%, 입히는 물리 피해 +30%%, 단 회피율 -50%%。\n\n이 고통은 %s턴 더 지속되며, 적을 처치하면 더 빨리 없앨 수 있습니다。\n\n이성이 0이 되면, 끝없는 광란 속에서 쇠약해져 죽습니다。

actors.hero.talent.never_compromise.title=불굴
actors.hero.talent.never_compromise.desc=_+1：_독실한 자가 _고통 또는 미덕 상태_에서 치명적인 피해를 받아도 직접 죽지 않고 _죽음 직전_ 효과를 얻으며, 고통 연장 또는 미덕 _50턴_ 감소가 발생합니다。\n\n_+2：_독실한 자가 _고통 또는 미덕 상태_에서 치명적인 피해를 받아도 직접 죽지 않고 _죽음 직전_ 효과를 얻으며, 고통 연장 또는 미덕 _40턴_ 감소가 발생합니다。\n\n_+3：_독실한 자가 _고통 또는 미덕 상태_에서 치명적인 피해를 받아도 직접 죽지 않고 _죽음 직전_ 효과를 얻으며, 고통 연장 또는 미덕 _30턴_ 감소가 발생합니다。
actors.hero.talent.never_compromise.comment=죽음 직전 기간 동안 고통 또는 미덕이 여전히 존재하면, 치명적인 피해를 받을 때마다 생명 1을 유지하고 고통 연장 또는 미덕 지속 시간을 감소시키지만, 고통 기간 중 이성이 0이 되어 발생하는 심부전 사망은 막을 수 없습니다. 고통 또는 미덕의 지속 시간이 종료되면 100턴 동안 중상(일부 속성 감소) 상태가 됩니다。
actors.hero.talent.rewind_time.title=시간 회귀
actors.hero.talent.rewind_time.desc=_+1：_독실한 자가 고통 중 이성이 20 미만일 때, 즉시 _이성 30_을 회복하고 기존의 공포 효과를 제거합니다。\n\n_+2：_독실한 자가 고통 중 이성이 20 미만일 때, 즉시 _이성 40_을 회복하고 기존의 공포 효과를 제거합니다。\n\n_+3：_독실한 자가 고통 중 이성이 20 미만일 때, 즉시 _이성 50_을 회복하고 기존의 공포 효과를 제거합니다。
actors.hero.talent.rewind_time.comment=이 재능에는 _50턴 재사용 대기시간_이 있습니다。
actors.hero.talent$rewindtimeused.name=시간 회귀-대기
actors.hero.talent$rewindtimeused.desc=방금 광기에서 겨우 벗어났습니다. 잠시 후에 이 재능을 다시 발동할 수 있습니다。\n\n잔여 대기 시간: %s턴
actors.hero.talent.bright_warrior.title=광명 전사
actors.hero.talent.bright_warrior.desc=_+1：_독실한 자가 미덕 중 적을 처치하여 연장할 수 있는 미덕의 지속 시간이 3턴에서 _6턴_으로 증가합니다。\n\n_+2：_독실한 자가 미덕 중 적을 처치하여 연장할 수 있는 미덕의 지속 시간이 3턴에서 _9턴_으로 증가합니다。\n\n_+3：_독실한 자가 미덕 중 적을 처치하여 연장할 수 있는 미덕의 지속 시간이 3턴에서 _12턴_으로 증가합니다。
actors.hero.talent.bright_warrior.comment=

actors.hero.talent$dyingwill.name=죽음 직전
actors.hero.talent$dyingwill.desc=당신의 생명은 마치 바람 앞의 촛불과 같습니다。\n\n다행히도 강인한 의지로 몇 번의 치명적인 피해를 견딜 수 있지만, 고통 또는 미덕의 지속 시간이 종료되면 장시간의 중상 상태에 빠집니다。\n\n고통 중 이성이 0이 되어 발생하는 심부전 사망은 이로 인해 막을 수 없습니다。
actors.hero.talent$dyingwill.get=강인한 의지가 당신을 죽음으로부터 거부했다!
actors.hero.talent$dyingwill.heavy_wound=중상
actors.hero.talent$dyingwill.heavy_wound_log=몸이 조금 견디기 힘들어집니다...
actors.hero.talent$heavywound.name=중상
actors.hero.talent$heavywound.desc=당신의 몸은 부서질 대로 부서졌습니다。\n\n중상 기간 동안, 입히는 물리 피해 -50%%, 명중률 및 회피율 -30%%。\n\n몸이 완전히 회복되기까지 %s턴이 더 필요합니다。

actors.hero.abilities.friar.concentratedpotion.name=농축 물약
actors.hero.abilities.friar.concentratedpotion.short_desc=수사가 연금 분사기에 _농축 물약_을 추가 장전하여 약액 잔량을 보충하고 다음 분사를 강화합니다。
actors.hero.abilities.friar.concentratedpotion.desc=수사가 그의 연금 분사기에 농축 물약을 추가 장전하여 약액 잔량 6을 보충하고 다음 분사 효과를 2레벨 향상시킵니다。\n\n농축 물약 장전은 1턴이 소모됩니다。
actors.hero.abilities.friar.concentratedpotion.no_spraygun=연금 분사기가 필요합니다。

actors.hero.talent.concentrated_essence.title=농축 정수
actors.hero.talent.concentrated_essence.desc=_+1：_수사가 연금 분사기에 농축 물약을 장전한 후, 다음 분사가 추가로 _하나의 다른 무작위 장전 효과_를 발동합니다。\n\n_+2：_수사가 연금 분사기에 농축 물약을 장전한 후, 다음 분사가 추가로 _두 가지 다른 무작위 장전 효과_를 발동합니다。\n\n_+3：_수사가 연금 분사기에 농축 물약을 장전한 후, 다음 분사가 추가로 _세 가지 다른 무작위 장전 효과_를 발동합니다。\n\n_+4：_수사가 연금 분사기에 농축 물약을 장전한 후, 다음 분사가 추가로 _네 가지 다른 무작위 장전 효과_를 발동합니다。
actors.hero.talent.concentrated_essence.comment=이 재능은 이미 화염 물약이 장전된 상태에서 서리 물약의 효과를 발동하지 않으며, 그 반대도 마찬가지입니다. 둘 다 장전되지 않은 상태에서는 여러 효과를 무작위로 발동할 때 둘 중 하나만 나타납니다。

actors.hero.talent.reagent_enhancement.title=약액 강화
actors.hero.talent.reagent_enhancement.desc=_+1：_수사가 연금 분사기에 농축 물약을 장전한 후, 다음 분사 효과가 _3레벨_ 향상됩니다。\n\n_+2：_수사가 연금 분사기에 농축 물약을 장전한 후, 다음 분사 효과가 _4레벨_ 향상됩니다。\n\n_+3：_수사가 연금 분사기에 농축 물약을 장전한 후, 다음 분사 효과가 _5레벨_ 향상됩니다。\n\n_+4：_수사가 연금 분사기에 농축 물약을 장전한 후, 다음 분사 효과가 _6레벨_ 향상됩니다。
actors.hero.talent.reagent_enhancement.comment=
actors.hero.talent.reuse_reagent.title=재활용
actors.hero.talent.reuse_reagent.desc=_+1：_수사가 약액 잔량이 6 이상인 상태에서 농축 물약을 장전하면, 해당 장전의 충전 소모가 _16%_ 감소합니다。\n\n_+2：_수사가 약액 잔량이 6 이상인 상태에서 농축 물약을 장전하면, 해당 장전의 충전 소모가 _30%_ 감소합니다。\n\n_+3：_수사가 약액 잔량이 6 이상인 상태에서 농축 물약을 장전하면, 해당 장전의 충전 소모가 _40%_ 감소합니다。\n\n_+4：_수사가 약액 잔량이 6 이상인 상태에서 농축 물약을 장전하면, 해당 장전의 충전 소모가 _50%_ 감소합니다。
actors.hero.talent.reuse_reagent.comment=

actors.hero.abilities.friar.holyprayer.name=성광 기도
actors.hero.abilities.friar.holyprayer.short_desc=수사가 _성광 기도_를 하여 자신과 동맹에게 강력한 성광 축복 효과를 부여합니다。
actors.hero.abilities.friar.holyprayer.desc=수사가 성광 기도를 하여 성광의 축복을 구하고, 자신과 동맹이 보호를 받기를 기원합니다. 성광 축복은 30턴 동안 지속됩니다。\n\n수사가 성광 축복을 받으면, 이미 미덕이 있다면 이를 50턴 연장하고, 기간 동안 추가로 50%의 명중률과 회피율을 얻습니다。\n\n동맹이 성광 축복을 받으면, 최대 생명력의 20%를 회복하고, 기간 동안 추가로 100%의 명중률과 회피율을 얻습니다。
actors.hero.abilities.friar.holyprayer.cast=빛 속에서, 우리가 승리를 거둘 수 있기를!

actors.hero.abilities.friar.holyprayer$holyprayerblessing.name=성광 축복
actors.hero.abilities.friar.holyprayer$holyprayerblessing.desc=길이 밝혀지고, 통로가 선명해졌습니다. 우리는 그것을 따라갈 힘만 있으면 됩니다。\n\n수사가 자신과 동맹을 위해 기도했으며, 이제 성광이 모두를 보호하고 있습니다. 성광 축복 기간 동안 수사의 명중률과 회피율이 50%% 증가하고, 동맹의 명중률과 회피율은 100%% 증가합니다。\n\n성광 축복은 %s턴 더 지속됩니다. 이 기세를 잡아 마지막 목표를 향해 전진하십시오!
actors.hero.abilities.friar.holyprayer$holyprayerblessing.desc_bane=길이 밝혀지고, 통로가 명확해졌으며, 우리는 그것을 따를 힘만 있으면 됩니다.\n\n수사가 자신과 아군을 위해 기도했으며, 이제 성광이 모두를 보호하고 있습니다. 성광 축복 동안 수사의 명중과 회피 능력치가 50% 상승하며, 아군의 명중과 회피 능력치는 100% 상승합니다.\n\n또한, 이 축복의 효과로 수사와 아군이 언데드와 악마 적에게 입히는 물리 피해가 %1s%% 증가합니다.\n\n성광 축복은 %2$s턴 더 지속됩니다. 이 기세를 잡아 마지막 종착점으로 나아가십시오!

actors.hero.talent.pious_faith.title=독실한 신앙
actors.hero.talent.pious_faith.desc=_+1：_수사가 성광 기도를 한 후 _이성 25_를 회복합니다。\n\n_+2：_수사가 성광 기도를 한 후 _이성 50_을 회복합니다。\n\n_+3：_수사가 성광 기도를 한 후 _이성 75_를 회복합니다。\n\n_+4：_수사가 성광 기도를 한 후 _이성 100_을 회복합니다。
actors.hero.talent.pious_faith.comment=이 재능의 초과 이성 회복은 동등한 양의 생명력 회복으로 전환됩니다。
actors.hero.talent.supreme_blessing.title=지고의 축복
actors.hero.talent.supreme_blessing.desc=_+1：_수사가 성광 기도를 한 후, 기존 미덕에 대한 연장 효과가 _75턴_으로 증가하고, 동맹에 대한 생명력 회복 효과가 최대 생명력의 _40%_로 증가합니다。\n\n_+2：_수사가 성광 기도를 한 후, 기존 미덕에 대한 연장 효과가 _100턴_으로 증가하고, 동맹에 대한 생명력 회복 효과가 최대 생명력의 _60%_로 증가합니다。\n\n_+3：_수사가 성광 기도를 한 후, 기존 미덕에 대한 연장 효과가 _125턴_으로 증가하고, 동맹에 대한 생명력 회복 효과가 최대 생명력의 _80%_로 증가합니다。\n\n_+4：_수사가 성광 기도를 한 후, 기존 미덕에 대한 연장 효과가 _150턴_으로 증가하고, 동맹에 대한 생명력 회복 효과가 최대 생명력의 _100%_로 증가합니다。
actors.hero.talent.supreme_blessing.comment=
actors.hero.talent.hatred_of_evil.title=이계 마물 증오
actors.hero.talent.hatred_of_evil.desc=_+1：_수사와 동맹이 성광 축복 기간 동안 _언데드 및 악마_ 속성의 적에게 입히는 물리 피해가 _30%_ 증가합니다。\n\n_+2：_수사와 동맹이 성광 축복 기간 동안 _언데드 및 악마_ 속성의 적에게 입히는 물리 피해가 _40%_ 증가합니다。\n\n_+3：_수사와 동맹이 성광 축복 기간 동안 _언데드 및 악마_ 속성의 적에게 입히는 물리 피해가 _50%_ 증가합니다。\n\n_+4：_수사와 동맹이 성광 축복 기간 동안 _언데드 및 악마_ 속성의 적에게 입히는 물리 피해가 _60%_ 증가합니다。
actors.hero.talent.hatred_of_evil.comment=

actors.hero.abilities.friar.reasondose.name=이성 주사제
actors.hero.abilities.friar.reasondose.short_desc=수사가 자신에게 _이성 주사제_를 주사하여 많은 이성을 회복하고 공포 효과를 해제합니다。
actors.hero.abilities.friar.reasondose.desc=수사가 자신에게 이성 주사제를 주사하여 이성 50을 회복하고 즉시 공포 효과를 해제합니다。\n\n주사는 시간을 소모하지 않습니다。
actors.hero.abilities.friar.reasondose.cast=고통이 순간적으로 완화됩니다...

actors.hero.talent.heart_dose.title=강심 주사제
actors.hero.talent.heart_dose.desc=_+1：_수사가 주사 후 _최대 생명력의 10%_ 생명도 회복합니다。\n\n_+2：_수사가 주사 후 _최대 생명력의 15%_ 생명도 회복합니다。\n\n_+3：_수사가 주사 후 _최대 생명력의 20%_ 생명도 회복합니다。\n\n_+4：_수사가 주사 후 _최대 생명력의 25%_ 생명도 회복합니다。
actors.hero.talent.heart_dose.comment=
actors.hero.talent.shield_dose.title=보호막 주사제
actors.hero.talent.shield_dose.desc=_+1：_수사가 주사 후 _20의 보호막_도 얻습니다。\n\n_+2：_수사가 주사 후 _30의 보호막_도 얻습니다。\n\n_+3：_수사가 주사 후 _40의 보호막_도 얻습니다。\n\n_+4：_수사가 주사 후 _50의 보호막_도 얻습니다。
actors.hero.talent.shield_dose.comment=
actors.hero.talent.calm_dose.title=진정 주사제
actors.hero.talent.calm_dose.desc=_+1：_수사가 주사 후 즉시 모든 약화 효과를 제거하고 _3턴 전면 정화_를 얻습니다。\n\n_+2：_수사가 주사 후 즉시 모든 약화 효과를 제거하고 _5턴 전면 정화_를 얻습니다。\n\n_+3：_수사가 주사 후 즉시 모든 약화 효과를 제거하고 _8턴 전면 정화_를 얻습니다。\n\n_+4：_수사가 주사 후 즉시 모든 약화 효과를 제거하고 _10턴 전면 정화_를 얻습니다。
actors.hero.talent.calm_dose.comment=

