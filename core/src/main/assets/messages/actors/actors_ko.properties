actors.mobs.npcs.blacksmith.intro_quest_princess=어이, 드워프! 맞아, 너야. 너는 인간과 좀 닮았지만, 그 드워프 특유의 냄새는 여전히 풍기고 있어.
actors.mobs.npcs.blacksmith.intro_quest_friar=...네 몸에서 무시무시한 냄새가 나지만, 나를 겁주기엔 아직 멀었어.
actors.mobs.npcs.blacksmith.intro_quest_start=쓸모없는 인간이 되고 싶지 않겠지, 그렇지? 마침 잘 됐다, 네게 할 일이 있다. 내가 옛 광산 위에 이 대장간을 지었어, 저기 아래로 내려가는 사다리가 보일 거야. 이 곡괭이를 가지고 가서 _암금석, 40개_만 캐 와. 아래 돌은 그렇게 단단하지 않으니, _힘만 좀 쓰면 벽도 부술 수 있을 거야_.\n\n뭐, 보답을 바란다고? 참 탐욕스럽군...\n\n좋아, 좋아, 내가 네 무기를 좀 단조해 줄 수 있어. 네가 얼마나 운이 좋은지 생각해 봐, 난 이 근처 유일한 대장장이라구.

뭐? 보답을 바란다고? 참 욕심 많네...

좋아, 좋아. 내가 대장질을 해줄 수 있어. 네가 얼마나 운 좋은지 생각해 봐. 이 근방에 대장장이는 나뿐이야.
actors.mobs.npcs.blacksmith.intro_quest_crystal=하지만 조심해, 광산은 너처럼 약골인 놈에겐 너무 위험해. 광산은 꽤 버려진 지 오래됐고, 수정이 많이 자라났어. 수정은 반짝이지만 너무 연약해서 가치가 없어. 게다가 마물들이 그걸 지키고 있어. 그 녀석들은 까다로우니까 _캐는 위치를 잘 골라_, 안 그러면 주의를 끌게 될 거야.

아래에는 _거대 수정_도 있어, 꽤 단단하지. 부수면 수정 성장 속도를 늦출 수 있을 거야. 그걸 해낸다면 추가 보상을 줄게.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=하지만 조심해, 광산은 너처럼 약골인 놈에겐 너무 위험해. 놀씨족 놈들도 암금석을 노리고 아래서 설치고 있어. 이 멍청한 놈들이 채굴하다가 토사 붕괴를 일으켰어. 네가 직접 길을 뚫어야 할 거야. _방금 무너져 내린 바위를 찾아봐_.

선동한 놀씨가 하나 있는데, 아마 _지복술사_ 같은 놈일 거야. 그놈을 해치우면 추가 보상을 주지. 하지만 반드시 반격할 거야.
actors.mobs.npcs.blacksmith.intro_quest_fungi=하지만 조심해, 광산은 너처럼 약골인 놈에겐 너무 위험해. 아래에 마법 버섯이 자라나고 있어. 버섯 파수꾼도 있는데, 너를 발견하면 혼내줄 거야. 하지만 다리가 없어서 쫓아오지는 못해. 살고 싶으면 _그들의 시야에 들어가지 마_.

_거대 버섯_을 해치우면 추가 보상을 주지. 하지만 까다로워. 벽 속에 숨은 균사와 연결되어 있어. 대부분의 균사를 제거해야 진짜 피해를 줄 수 있어.
actors.mobs.npcs.blacksmith.reminder=내 시간을 더 낭비할 셈이야? 광산 입구는 저기에 있어.
actors.mobs.npcs.blacksmith.reminder_crystal=암금석은 많을수록 좋아. 거대 수정도 부수는 게 좋고.
actors.mobs.npcs.blacksmith.reminder_gnoll=암금석은 많을수록 좋아. 놀씨 지복술사도 죽이는 게 좋고.
actors.mobs.npcs.blacksmith.reminder_fungi=암금석은 많을수록 좋아. 거대 버섯도 죽이는 게 좋고.
actors.mobs.npcs.blacksmith.lost_pick=농담하는 거지? 내 곡괭이는 어디 갔어?!
actors.mobs.npcs.blacksmith.quest_start_prompt=내려갈 준비가 됐어? 가방에 암금석 넣을 자리를 비워둬.

_딱 한 번만 내려보내 준다!_
actors.mobs.npcs.blacksmith.enter_yes=준비됐어
actors.mobs.npcs.blacksmith.enter_no=아직
actors.mobs.npcs.blacksmith.exit_warn_none=벌써 끝이야? 고작 그만큼 캤어! 최소 _40개_는 캘 수 있어.

_이 사다리만 올라가면 다시 내려갈 수 없다는 걸 명심해._
actors.mobs.npcs.blacksmith.exit_warn_low=벌써 끝이야? 캔 암금석이 별로 없어 보이는데. 최소 _40개_는 캘 수 있어.

_이 사다리만 올라가면 다시 내려갈 수 없다는 걸 명심해._
actors.mobs.npcs.blacksmith.exit_warn_med=끝이야? 좀 캐긴 했지만, 아래에 더 있을 거야. 최소 _40개_는 캘 수 있어.

_이 사다리만 올라가면 다시 내려갈 수 없다는 걸 명심해._
actors.mobs.npcs.blacksmith.exit_warn_high=끝이야? 꽤 많이 캔 것 같지만, 나에게는 많을수록 좋아. 최소 _40개_는 캘 수 있어.

_이 사다리만 올라가면 다시 내려갈 수 없다는 걸 명심해._
actors.mobs.npcs.blacksmith.exit_warn_full=끝이야? 꽤 많이 캤네. 하지만 아래에서 물건을 잃어버리지 않도록 해.

_이 사다리만 올라가면 다시 내려갈 수 없다는 걸 명심해._
actors.mobs.npcs.blacksmith.exit_warn_crystal=거대 수정이 아직 아래에 있어. 부수면 추가 보상을 줄게.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=놀씨 지복술사가 아직 아래에 있어. 죽이면 추가 보상을 줄게.
actors.mobs.npcs.blacksmith.exit_warn_fungi=거대 버섯이 아직 아래에 있어. 죽이면 추가 보상을 줄게.
actors.mobs.npcs.blacksmith.exit_yes=다 했어
actors.mobs.npcs.blacksmith.exit_no=아직
actors.mobs.npcs.blacksmith.get_lost=바빠. 꺼져!
actors.mobs.npcs.blacksmith.entrance_blocked=내려가는 길이 막혔어.
actors.mobs.npcs.blacksmith.cant_enter_old=이 지역은 이 게임에서 사용할 수 없습니다. 새 게임을 만들어 새로운 퀘스트를 시도하세요!
actors.mobs.npcs.blacksmith.def_verb=방어
actors.mobs.npcs.blacksmith.desc=이 트롤 대장장이는 다른 트롤과 똑같이 보인다: 키가 크고 호리호리하며, 피부 색깔과 질감이 돌과 같다. 이 트롤 대장장이는 체구에 비해 터무니없이 작은 망치를 들고 끊임없이 수선을 하고 있다.

##old blacksmith quest dialogue from pre-v2.2.0
actors.mobs.npcs.blacksmith.gold_1=이봐, 친구! 쓸모없는 쓰레기가 되고 싶지 않지? 그 곡괭이를 들고 _암금석 15개_만 캐와. 뭐? 보답을 바란다고? 참 욕심 많네...

좋아, 좋아. 돈은 없지만 대장질은 해줄 수 있어. 네가 얼마나 운 좋은지 생각해 봐. 이 근방에 대장장이는 나뿐이야.
actors.mobs.npcs.blacksmith.blood_1=이봐, 친구! 쓸모없는 쓰레기가 되고 싶지 않지? 그 곡괭이를 들고 _박쥐를 죽여_. 곡괭이에 피를 묻혀야 해. 뭐? 보답을 바란다고? 참 욕심 많네...

좋아, 좋아. 돈은 없지만 대장질은 해줄 수 있어. 네가 얼마나 운 좋은지 생각해 봐. 이 근방에 대장장이는 나뿐이야.
actors.mobs.npcs.blacksmith.gold_2=암금석. 15개. 진짜, 그게 그렇게 어렵냐?
actors.mobs.npcs.blacksmith.blood_2=곡괭이에 박쥐 피를 묻혀야 한다고 했어. 어서!
actors.mobs.npcs.blacksmith.completed=오, 드디어 왔군... 그래도 안 오는 것보단 낫지.

actors.mobs.npcs.ghost.name=슬픈 유령
actors.mobs.npcs.ghost.rat_1=안녕, %s... 나도 한때 너처럼 강하고 자신감에 차 있었지... 사악한 야수에게 죽기 전까지는... 복수를 완료하기 전엔 이곳을 떠날 수 없어... _썩은 쥐_를 죽여줘, 그놈이 내 목숨을 앗아갔어...

그놈은 이 층을 배회하고 있어... 사방에 오물을 퍼뜨리지... _주변의 악취 구름과 부식성 물기를 조심해. 그놈이 만드는 산성 액체는 물에 녹아..._
actors.mobs.npcs.gohst.rat_2=제발 도와줘... 그 혐오스러운 것을 죽여줘...

_물 근처에서 싸워... 그의 악취를 피해..._
actors.mobs.npcs.ghost.gnoll_1=안녕, %s... 나도 한때 너처럼 강하고 자신감에 차 있었지... 하지만 교활한 적에게 죽임을 당했어... 복수를 완료하기 전엔 이곳을 떠날 수 없어... _놀씨 계략가_를 죽여줘, 그놈이 내 목숨을 앗아갔어...

그놈은 다른 놀씨와 달라... 은신하고 투척 무기를 사용해... _독과 화염 투척검을 조심해, 최대한 가까이 붙어..._
actors.mobs.npcs.ghost.gnoll_2=제발 도와줘... 그 교활한 놈을 죽여줘...

_그놈한테 맞지 마... 최대한 가까이 붙어..._
actors.mobs.npcs.ghost.crab_1=안녕, %s... 나도 한때 너처럼 강하고 자신감에 차 있었지... 하지만 고대 생물에게 죽임을 당했어... 복수를 완료하기 전엔 이곳을 떠날 수 없어... _거대 집게게_를 죽여줘, 그놈이 내 목숨을 앗아갔어...

그놈은 오랜 세월을 견뎌냈어... 거대한 게 집게와 매우 두꺼운 등딱지를 가지고 있어... _집게를 조심해. 이 게를 기습 공격해야 해, 안 그러면 집게로 네 공격을 막을 거야..._
actors.mobs.npcs.ghost.crab_2=제발 도와줘... 그 갑각류를 죽여줘...

_녀석이 널 발견하면... 모든 공격을 막아낼 거야..._
actors.mobs.npcs.ghost.find_me=고마워... 나를 찾아와...
actors.mobs.npcs.ghost.desc=이 유령은 거의 보이지 않는다. 그것은 무정형의 희미한 빛과 슬픔에 잠긴 얼굴로 이루어진 것처럼 보인다.

actors.mobs.npcs.imp.name=야망에 찬 작은 악마
actors.mobs.npcs.imp.intro=모험가인가? 나는 모험가를 좋아해! 무언가를 죽여야 한다면, 그들은 항상 일을 잘 처리하지. 내 말이 맞지? 물론 현상금이 있다면 말이야. ;)
actors.mobs.npcs.imp.golems_1=어쨌든, 네가 _골렘_을 좀 죽여줬으면 해. 알다시피, 여기서 작은 장사를 시작하려고 하는데, 이 멍청한 골렘들이 내 장사를 망치고 있어! 이 돌멩이 덩어리랑은 대화가 통하지 않아, 정말! 그러니까 제발, _골렘 4마리_를 죽여줘. 보상은 네 거야.
actors.mobs.npcs.imp.monks_1=어쨌든, 네가 _승려_를 좀 죽여줬으면 해. 알다시피, 여기서 작은 장사를 시작하려고 하는데, 이 미친놈들은 아무것도 사지 않을 뿐만 아니라 다른 손님들까지 쫓아내고 있어. 그러니까 제발, _승려 5명_을 죽여줘. 보상은 네 거야.
actors.mobs.npcs.imp.golems_2=골렘 사냥은 어떻게 되어가고 있나? 골렘의 휘장을 가져오는 것만 잊지 마.
actors.mobs.npcs.imp.monks_2=오, 아직 살아있었구나! 네 실력이 그들보다 낫다는 걸 알고 있었어. ;) 승려의 휘장을 가져오는 것만 잊지 마.
actors.mobs.npcs.imp.cya=또 보자, %s!
actors.mobs.npcs.imp.hey=거기, 거기, %s!
actors.mobs.npcs.imp.desc=작은 악마는 하급 악마다. 강력한 힘도 마법적 재능도 없지만, 상당히 똑똑하고 사교적이다. 많은 작은 악마는 다른 악마가 없는 곳에서 사는 것을 좋아한다.

actors.mobs.npcs.impshopkeeper.name=야망에 찬 작은 악마
actors.mobs.npcs.impshopkeeper.greetings=안녕, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=%s, 무슨 짓을 한 거야? 장사나 하자고, 여기 오래 있고 싶지 않아!
actors.mobs.npcs.impshopkeeper.thief=널 믿을 수 있을 줄 알았는데!
actors.mobs.npcs.impshopkeeper.buyback=작은 악마가 쾌히 네 물건을 돌려주었다.
actors.mobs.npcs.impshopkeeper.desc=작은 악마가 악마의 전당 입구 앞에 작은 노점을 차렸다. 이곳에서 다정한 얼굴을 보는 것은 반갑지만, 상품의 가격표는 전혀 다정해 보이지 않는다.

actors.mobs.npcs.mirrorimage.name=환영
actors.mobs.npcs.mirrorimage.desc=이 환영은 너와 매우 닮았으며, 네가 현재 장비한 무기와 갑옷까지 동일하다.

환영은 적을 추적하여 환영 무기로 공격한다. 환영 무기의 사용 방식과 특성은 네 손에 든 것과 동일하지만, 피해량은 낮다. 환영은 생성 직후 거의 투명하지만 공격 시 모습을 드러낸다.

환영은 어느 정도 공격 능력이 있지만 그 자체는 매우 취약하여, 피해를 입으면 즉시 소멸한다.
actors.mobs.npcs.mirrorimage.discover_hint=특정 두루마리를 통해 이 유닛을 발견할 수 있습니다.

actors.mobs.npcs.npc.discover_hint=특정 지하 감옥 지역에서 이 유닛을 발견할 수 있습니다.

actors.mobs.npcs.dongyusangyu.name=동우상우
actors.mobs.npcs.dongyusangyu.desc=이 주황색 허니는 가방에 경로 표시와 함께 단정한 필체로 쓰인 보물 찾기 점수 기록부를 가지고 있다.
actors.mobs.npcs.dongyusangyu.hello=한번 해볼래? 보물 찾기 한 판?

actors.mobs.npcs.surfaceshopkeeper.name=상점 주인
actors.mobs.npcs.surfaceshopkeeper.desc=지상 상점을 운영하는 주인. 진열된 상품은 20층 가격으로, 조회 구매 상품은 25층 가격으로 판매한다.
actors.mobs.npcs.surfaceshopkeeper.thief=도둑, 도둑!
actors.mobs.npcs.surfaceshopkeeper.warn=조심해! 두 번은 경고하지 않는다.
actors.mobs.npcs.surfaceshopkeeper.flee=상점 주인이 문을 닫고 도망갔다!
actors.mobs.npcs.surfaceshopkeeper.sell=아이템 판매
actors.mobs.npcs.surfaceshopkeeper.query=조회 구매
actors.mobs.npcs.surfaceshopkeeper.raid=습격 모드
actors.mobs.npcs.surfaceshopkeeper.talk=대화
actors.mobs.npcs.surfaceshopkeeper.talk_text=일반 소모품의 정확한 이름을 알려줘. 중요 아이템이 아니라면 내가 팔 수도 있어.
actors.mobs.npcs.surfaceshopkeeper.raid_title=습격 의뢰
actors.mobs.npcs.surfaceshopkeeper.raid_body=입장료는 %1. 수정 열쇠를 찾아 표시된 대피실에 도착하여 성공적으로 대피해야 이번 판의 전리품을 가져갈 수 있습니다; 실패 시 이번 판의 모든 전리품을 잃고, 일반 소모품 1~2개를 무작위로 잃습니다. 두 번째 수정 열쇠를 가지고 대피하면 추가로 %2 얻습니다.

장내에서는 소장품과 마법 부여된 투척 무기가 등장하지만, 근접 무기나 갑옷은 추가로 떨어지지 않습니다.
actors.mobs.npcs.surfaceshopkeeper.raid_enter=지불하고 입장
actors.mobs.npcs.surfaceshopkeeper.raid_cancel=입장 안 함
actors.mobs.npcs.surfaceshopkeeper.raid_no_gold=습격 모드에 입장하려면 %d골드가 필요합니다.
actors.mobs.npcs.surfaceshopkeeper.raid_unavailable=지금은 습격 의뢰를 시작할 수 없습니다.
actors.mobs.npcs.surfaceshopkeeper.buyback=상점 주인이 마지못해 네 물건을 돌려주었다.
actors.mobs.npcs.surfaceshopkeeper.query_title=조회 구매
actors.mobs.npcs.surfaceshopkeeper.query_body=전체 아이템 이름을 입력하세요; 끝에 「x수량」을 추가할 수 있습니다. 예: 치유 물약 x3. 각 아이템은 최대 5개까지 조회 구매 가능합니다.
actors.mobs.npcs.surfaceshopkeeper.query_confirm=조회
actors.mobs.npcs.surfaceshopkeeper.query_cancel=취소
actors.mobs.npcs.surfaceshopkeeper.invalid_quantity=구매 수량이 유효하지 않습니다.
actors.mobs.npcs.surfaceshopkeeper.not_found=해당 아이템을 찾을 수 없거나 판매 가격이 없습니다.
actors.mobs.npcs.surfaceshopkeeper.limit_reached=각 아이템은 최대 %1 조회 구매 가능합니다; 이미 %2 구매했습니다.
actors.mobs.npcs.surfaceshopkeeper.query_offer=수량: %1
개당 가격: %2
총 가격: %3
구매 전 남은 한도: %4
actors.mobs.npcs.surfaceshopkeeper.buy=구매
actors.mobs.npcs.surfaceshopkeeper.not_enough_gold=골드가 부족합니다.

actors.mobs.npcs.prismaticimage.name=프리즈매틱 환영
actors.mobs.npcs.prismaticimage.desc=이 프리즈매틱하게 빛나는 환영은 너와 매우 닮았으며, 네가 현재 장비한 무기와 갑옷까지 동일하다.

프리즈매틱 수호자는 적을 추적하여 어그로를 끌고, 강화된 방어력과 생명력으로 화력을 분산시킨다. 환영처럼 공격적이지는 않지만 생명력이 더 높고, 네 방어구에 기반한 방어 보너스를 가진다.

환영의 생명력이 0이 되면 잠시 동안 존재를 유지하며, 그동안 치유될 수 있다. 주변에 적이 없으면 환영은 사라져 주인에게 귀속된다.
actors.mobs.npcs.prismaticimage.discover_hint=특정 두루마리를 통해 이 유닛을 발견할 수 있습니다.

actors.mobs.npcs.ratking.name=쥐왕
actors.mobs.npcs.ratking.not_sleeping=자고 있는 게 아니야!
actors.mobs.npcs.ratking.what_is_it=뭘 원하는 거야? 난 이런 사소한 일에 신경 쓸 시간이 없어. 내 왕국은 저절로 굴러가지 않는다고!
actors.mobs.npcs.ratking.confused=이... 여긴 어디지? 내 왕국이 나를 필요로 해!
actors.mobs.npcs.ratking.crown_clothes=옷 좀 입어! 왕족을 만날 때의 예의도 모르는 거야?!
actors.mobs.npcs.ratking.crown_desc=와, 그 왕관은 나를 위한 거야!? 내 왕관보다 더 반짝이고 예뻐 보이는데, 그럼 기꺼이 받아주마!

물론, 나 쥐왕이 그냥 받지는 않지. 대가로, 왕이 너에게 「영웅」이라는 칭호에 걸맞은 강력한 능력을 내려 주겠다! 어때? 받을래?
actors.mobs.npcs.ratking.crown_yes=물론이지!
actors.mobs.npcs.ratking.crown_info=듣고 싶어.
actors.mobs.npcs.ratking.crown_no=됐어...
actors.mobs.npcs.ratking.crown_thankyou=히히히히, 고마워! 나를 실망시키지 마, 내 위엄을 널리 알리거라!
actors.mobs.npcs.ratking.crown_fine=좋아! 어차피 그 반짝이는 왕관도 별로 탐나지 않았어...
actors.mobs.npcs.ratking.crown_after=새 옷은 잘 맞니? 정직 거래, 환불 불가!
actors.mobs.npcs.ratking.desc_crown=이 쥐는 보통 설치류보다 약간 크다. 드워프 왕의 왕관을 쓰고 있다.
actors.mobs.npcs.ratking.desc_birthday=이 쥐는 보통 설치류보다 약간 크다. 평소에 쓰는 왕관 대신 작은 초록색 파티 모자를 쓰고 있다. 쥐왕의 생일을 축하합니다!
actors.mobs.npcs.ratking.desc_winter=이 쥐는 보통 설치류보다 약간 크다. 평소에 쓰는 왕관 대신 작은 휴일 모자를 쓰고 있다. 즐거운 휴일 보내세요!
actors.mobs.npcs.ratking.desc=이 쥐는 보통 설치류보다 약간 크다. 작은 왕관을 쓰고 있다.
actors.mobs.npcs.ratking.discover_hint=특정 지하 감옥 지역의 끝에서 이 유닛을 발견할 수 있습니다.

actors.mobs.npcs.sheep.name=양
actors.mobs.npcs.sheep.baa!=매!
actors.mobs.npcs.sheep.baa?=매?
actors.mobs.npcs.sheep.baa.=매.
actors.mobs.npcs.sheep.baa...=매...
actors.mobs.npcs.sheep.def_verb=방어
actors.mobs.npcs.sheep.desc=마법 양이다. 왜 마법 양이라고 부르는지? 죽일 수 없기 때문이다. 그냥 서 있다가 사라질 때까지, 되새김질하며 너를 흘겨볼 뿐이다.
actors.mobs.npcs.sheep.discover_hint=특정 아이템이나 함정을 통해 이 유닛을 발견할 수 있습니다.

actors.mobs.npcs.shopkeeper.name=상점 주인
actors.mobs.npcs.shopkeeper.thief=도둑, 도둑!
actors.mobs.npcs.shopkeeper.warn=조심해! 두 번은 경고하지 않는다.
actors.mobs.npcs.shopkeeper.flee=상점 주인이 문을 닫고 도망갔다!
actors.mobs.npcs.shopkeeper.sell=판매할 아이템을 선택하세요
actors.mobs.npcs.shopkeeper.talk=대화
actors.mobs.npcs.shopkeeper.buyback=상점 주인이 마지못해 네 물건을 돌려주었다.
actors.mobs.npcs.shopkeeper.talk_prison_intro=네가 성공적으로 모험을 마칠 수 있는 모든 것이 여기 있어!
actors.mobs.npcs.shopkeeper.talk_prison_warrior=그 문장 꽤 흥미롭군, 보통은 하나로 되어 있는 법이지. 설마 네가 치욕을 당한 영웅이라도 된다거나, 다른 어떤 인물인 건가? 좋아, 네가 무슨 짓을 했든 내게는 상관없어. 오직 네 금화에만 관심이 있으니까.
actors.mobs.npcs.shopkeeper.talk_prison_mage=히히, 네 수배 전단지를 시내 어디선가 본 것 같아. 도망 중인 거지? 오? 무죄라고? 정말? 그래 그래... 진정해, 널 고발하는 것보다 더 할 일이 있어. 하지만 확실히 하기 위해 물건이라도 좀 사는 게 어때?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=도둑 길드에서 이 지역을 청소하라고 보낸 거야? 아니면 그냥 쇼핑 온 거야? 네가 여기까지 온 걸 보니 확실히 몬스터를 몇 마리 죽였나 본데, 그렇다고 내가 할인을 해줄 거라고 기대하지 마. 보호비는 충분히 냈지만, 네가 여기서 내 안전을 지켜준 걸 본 적은 없어.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=아가씨, 여기는 당신 같은 사람이 있을 곳이 아닌 것 같은데? 좁은 지하 감옥 복도는 시청이나 교외 숲만큼 넓지 않잖아? 헤헤, 오, 내 잔소리는 신경 쓰지 말고, 왜 물건을 좀 사지 그래?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=와우, 세상을 구하는 대영웅님이 아니신가! 또 다른 작은 마을을 구하려고 하는 거라면 행운을 빌어줄게. 여기 위기는 산적 패거리보다 훨씬 심각하니까. 물론, 나는 네가 누구보다 잘할 거라고 믿어. 하지만 내 가게 앞에서 죽지나 마.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=안녕하십니까, 각하. 이제는 「폐하」라고 불러야 할까요? 허허, 어쨌든 여기는 성인 같은 분이 오실 곳이 아닙니다. 만약 각하께서 「주님과 함께」계시다면 신도들의 마음이 아프겠지요. 하지만 지고한 권능을 가지신 몸, 속세의 재정이 부족하지는 않으실 테니 만일의 경우를 대비해 물건을 좀 사시는 게 어떨까요?
actors.mobs.npcs.shopkeeper.talk_prison_freeman=오, 이 선생님. 제 기억이 맞다면, 어느 비즈니스 저널에서 선생님의 초상화를 본 적이 있습니다. 아니면 저 지면에 그려진 유명한 부호와 너무 닮으셨다고 해야 할까요. 어쨌든, 선생님은 돈을 아끼실 분 같지 않으니, 여기서 물건을 좀 사시는 게 어떨까요? 제 사업 수완을 걸고 장담하는데, 이 모든 게 선생님이 살아남는 데 도움이 되는 좋은 물건들입니다.
actors.mobs.npcs.shopkeeper.talk_prison_slimegirl=어... 안녕? 어떤 몬스터도 나를 해칠 순 없지만, 네 등장에 꽤 놀랐어. 내 말을 알아듣는 것 같으니 이 물건들이 어때? 내 첫 번째 마물 손님이라는 걸 감안해서, 인간에게 파는 것보다 싸게 해줄게. 속임수는 없어.
actors.mobs.npcs.shopkeeper.talk_prison_dm400=어이, 쇳덩어리. 조심해! 내 물건을 건드리기나 하면... 네 같은 녀석이 어떻게 여기까지 왔는지는 모르겠지만, 내 물건을 보고 싶다면 조심히 다뤄야 해. 알겠어? 몰라도 상관없어. 어쨌든 뭐라도 부수면 네가 사는 거야.
actors.mobs.npcs.shopkeeper.talk_prison_princess=이제 겨우 살아남은 드워프 왕실의 일원이 드워프와 인간의 혼혈이라니, 참 아이러니하군. 나는 지상 드워프들의 원한에는 관심도 없고 참견하고 싶지도 않아. 네게 왕실 혈통이 있든 없든, 여기선 소용없어. 네가 아주 아주 많은 돈을 가지고 있지 않는 한 말이지.
actors.mobs.npcs.shopkeeper.talk_prison_friar=하, 여기서 너를 볼 줄은 정말 몰랐어. 네 눈은 좀 어때? 아직도 그 무시무시한 것들이 보이나? 물론 비꼬는 게 아니야. 진심으로 동정하는 마음에서 한 말이지... 하지만 여기서는 네가 시각 장애인이든 학문적 천재든 특별 혜택은 없어. 앞으로 살아남는 데 필요한 물건들을 잘 골라보게...
actors.mobs.npcs.shopkeeper.talk_caves=돈을 써야 오래 산다.

오, 저 트롤 대장장이를 보거든 내 안부를 전해줘. 그리고 이 바보에게 지난주에 나한테 산 망치 값을 아직 안 갚았다고 일러줘!
actors.mobs.npcs.shopkeeper.talk_city=내 물건들이 너를 안전하게 지켜줄 거야.

...그리고, 거기서 얼쩡거리지 마. 여기 몬스터들이 나에게 접근하지 못하게 하는 데 아주 오랜 시간이 걸렸어. 네가 문제를 다시 가져오지 않길 바란다!
actors.mobs.npcs.shopkeeper.talk_halls=어이, 저기! 악마 사냥꾼에게 특별 할인을 해주지!

오, 그리고 아래에서 조심해! 아래 악마들은 겁에 질려 있지 않아. 네가 죽으면 다시 소비하러 올 수 없으니까! ;)

그 악마들은 나와 같냐고? 희희, 아니야. 나는 별볼일 없는 하수부라 싸움도 못하고, 자유 의지도 보존하고 있어. 아래 악마들은 나보다 훨씬 강하고, 모두... 어... 어쨌든 노예가 되어 있어. 아래에서 조심해.
actors.mobs.npcs.shopkeeper.talk_ascent=네가 그 부적으로 무엇을 하려는지, 나는 상관하지 않아. 물건이나 사고 당장 떠나. 우리 둘 다 이곳을 떠나야 해!
actors.mobs.npcs.shopkeeper.desc=이 땅딸막한 녀석은 이런 지하 감옥보다는 어떤 대도시에서 장사를 하는 게 더 어울릴 것 같다. 상품들의 가격표가 그가 왜 여기서 장사를 좋아하는지 설명해준다.

actors.mobs.npcs.wandmaker.name=늙은 지팡이 장인
actors.mobs.npcs.wandmaker.intro_warrior=오, 안녕! 이 답답한 곳에서 북부 전사를 만나다니 정말 반갑군! 여기까지 오느라 먼 길을 왔겠구먼. 모험에 관심이 있다면, 네게 맡길 일이 하나 있네.
actors.mobs.npcs.wandmaker.intro_rogue=맙소사, 놀랐잖아! 여기 이렇게 오래 있었지만, 지금까지 내가 본 지상에서 내려온 제정신인 도둑은 너가 처음이야! 나 같은 낯선 사람을 도와줄 의향이 있다면, 아마 네가 도움을 줄 수 있는 임무가 하나 있네.
actors.mobs.npcs.wandmaker.intro_mage=오, 안녕 %s! 마법사 학원에서 꽤 난리를 피웠다고 들었어? 됐어, 상관없어. 어차피 나도 그 고지식한 완고한 놈들을 좋아하지 않거든. 네가 괜찮다면, 네가 도와줄 임무가 하나 있네.
actors.mobs.npcs.wandmaker.intro_huntress=아, 안녕 아가씨! 이 아래서 다정한 얼굴을 보다니 정말 반가운 일이야, 그렇지 않나? 아이고, 생각해보니, 전에 너를 어디선가 본 것 같기도 한데, 정확히 기억이... 오, 됐어, 신경 쓰지 마. 여기 모험을 왔다면, 네게 맡길 일이 하나 있단다.
actors.mobs.npcs.wandmaker.intro_duelist=오, 아가씨 안녕! 참 답답한 곳이지만, 이렇게 만나니 정말 반갑군! 늙은이를 도와줄 의향이 있다면, 작은 심부름을 하나 맡기고 싶네.
actors.mobs.npcs.wandmaker.intro_cleric=오, 안녕하십니까, 각하! 이렇게 답답한 곳에서 각하를 만나다니 정말 영광입니다! 방해하려는 뜻은 아니었으나, 한 가지 부탁드릴 일이 있습니다.
actors.mobs.npcs.wandmaker.intro_freeman=오, 안녕! 존경하는 선생님, 정말 당당해 보이시는군요! 어쨌든... 제가 곤란한 일에 부딪혔는데, 이 불쌍한 노인네를 도와주실 의향이 있으신지요.
actors.mobs.npcs.wandmaker.intro_slimegirl=오, 맙소사... 이 무서운 곳에서 처음으로 마물과 대화를 해보네. 다른 몬스터들처럼 나에게 덤벼들 줄 알았어. 어쨌든 내 말을 알아듣는 것 같으니, 나를 좀 도와줄 수 있겠니? 이곳에서 만날 수 있는 다른 제정신인 인간은 기대할 수 없어.
actors.mobs.npcs.wandmaker.intro_dm400=맙소사, 「사람」처럼 생긴 기계라니! 솔직히, 마법이 깃든 장치만이 어느 정도 지혜를 가질 수 있다고 생각하고 있었는데... 에헴, 철 선생님, 내 말을 알아들으신다면 이 늙은이를 좀 도와주십시오.
actors.mobs.npcs.wandmaker.intro_princess=오, 안녕하십니까! 이런 곳에서 당신을 만날 줄은 정말 몰랐습니다. 드워프들에게서 많은 신기한 마법을 배울 수 있었던 것은 당신들 덕분입니다... 본론으로 돌아가서, 지금 꽤 큰 곤란에 처해 있습니다. 부디 도움을 주십시오.
actors.mobs.npcs.wandmaker.intro_friar=오, 너구나. 저널에 나왔던 그 연금술 천재. 예전엔 그렇게 생기가 넘치더니, 이제는 네 정신 상태가 마치 무서운 정신술사에게 갈기갈기 찢긴 것 같구나... 미안, 내가 말을 너무 많이 했군. 어쨌든, 자비를 베풀어 내 부탁 하나만 들어다오... 알다시피, 우리는 같은 편이니, 내가 널 속이지 않을 거야.
actors.mobs.npcs.wandmaker.intro_1=

나는 지팡이를 만드는 데 필요한 희귀 재료를 찾으러 왔지만 길을 잃었고, 몸의 마법 방패도 서서히 약해지고 있어. 지금 당장 이곳을 떠나야 하지만, 빈손으로 나가고 싶지는 않아.
actors.mobs.npcs.wandmaker.intro_dust=나는 _시체 먼지_를 찾고 있어. 이런 곳에서 주로 발견되는 저주받은 특별한 재야. 바로 근처의 막힌 방 어딘가에 있을 거야. 분명 거기서 시체 먼지를 찾을 수 있을 거야. 하지만 조심해, 시체 먼지의 저주는 상당히 강력하니까 _최대한 빨리 가져와_. 내가 저주를 정화해 주마.
actors.mobs.npcs.wandmaker.intro_ember=나는 갓 태어난 불 정령에게서 얻을 수 있는 _원소 잔불_을 찾고 있어. 정령은 보통 통제할 수 없는 소환 의식에서 나타나지. 소환하려면 양초와 의식 장소만 찾으면 돼. 분히 그런 장소를 찾을 수 있을 거야. 또한, 정령과 싸울 때는 _근접전을 피하는 게 좋아_. _얼림 효과가 있는 아이템_이 필요할 거야. 갓 태어난 불 정령은 강력하고 난폭하지만 추위에는 약해.
actors.mobs.npcs.wandmaker.intro_berry=이전 교도관이 _썩은 딸기_를 키우고 있었는데, 씨앗을 하나 얻고 싶어. 지금쯤 그 식물은 통제 불능 상태일 테니 씨앗을 얻는 게 쉬운 일이 아니야. 정원이 이 근처에 있을 거야. 무사히 돌아오고 싶다면 _그 덩굴손에서 최대한 멀리 떨어져_. 불을 질러 썩은 딸기를 태우는 게 효과적으로 들리겠지만, 그러면 씨앗도 함께 타버리니 하지 마.
actors.mobs.npcs.wandmaker.intro_2=

나에게 가져다 준다면, 내가 정성껏 만든 지팡이를 보상으로 주겠다! 두 개를 가져왔으니 네가 마음에 드는 것을 골라라.
actors.mobs.npcs.wandmaker.reminder_dust=시체 먼지는 찾았나, %s? _장애물_을 찾아보게.
actors.mobs.npcs.wandmaker.reminder_ember=잔불은 찾았나, %s? _양초 4개_와 _의식 장소_를 찾아야 하네.
actors.mobs.npcs.wandmaker.reminder_berry=썩은 딸기 씨앗은 찾았나, %s? _식물로 가득 찬 방_에 있을 거야.
actors.mobs.npcs.wandmaker.def_verb=방어
actors.mobs.npcs.wandmaker.desc=이 정정하신 노신사는 표정이 다소 고민에 잠겨 있다. 그의 주변에는 마법 장벽의 보호가 있다.

###mobs
actors.mobs.acidic.name=산성 전갈
actors.mobs.acidic.desc=이 거대한 절지동물 악마는 근접전을 피하며, 원거리에서 적을 불구로 만드는 톱니바늘을 발사한다. 이 개체의 몸에서는 부식성 진흙이 떨어지고 있다.

actors.mobs.albino.name=백화 쥐
actors.mobs.albino.desc=순백의 털과 톱니 모양 이빨을 가진 희귀한 설치류다.
actors.mobs.albino.discover_hint=특정 지하 감옥 지역에서 우연히 이 적을 발견할 수 있습니다.

actors.mobs.armoredstatue.name=장갑 석상
actors.mobs.armoredstatue.desc=지하 감옥의 또 다른 조용히 서 있는 석상일 거라 생각했지만, 붉게 빛나는 눈이 그것을 드러냈다.

석상은 정교한 갑옷을 장비하고 있어 매우 단단해 보이며, 상대하기 어려울 것으로 보인다.
actors.mobs.armoredstatue.desc_arm_wep=석상 자체는 돌로 만들어졌지만, 장비한 _%1 _%2 진짜처럼 보인다.

actors.mobs.bandit.name=광란 도적
actors.mobs.bandit.desc=도둑 중의 엘리트로, 더 비싼 보라색 로브를 입고 있어 눈에 띈다. 도둑질 실력은 뛰어나지만, 동료들과 마찬가지로 이성 상실의 운명을 피할 수는 없었다.

광란 도적은 네 재산을 훔칠 뿐만 아니라, 일시적 실명, 불구, 중독 상태까지 유발한다! 하지만 다른 도둑보다 추가 전리품을 가지고 있을 가능성도 높다.

actors.mobs.bat.name=흡혈 박쥐
actors.mobs.bat.desc=이 민첩하고 강인한 동굴 천장 생물은 보기보다 훨씬 위험하다. 성공적인 공격마다 생명력을 회복하여, 자신보다 훨씬 큰 상대도 쓰러뜨릴 수 있다.

actors.mobs.bee.name=황금 벌
actors.mobs.bee.desc_honey=황금 벌은 몸집은 작지만, 자신의 집을 지키기 위해 최선을 다한다. 이 벌은 네가 달래서 너를 따르는 것 같다.
actors.mobs.bee.desc=황금 벌은 몸집은 작지만, 자신의 집을 지키기 위해 최선을 다한다. 이 벌은 매우 난폭하니 거리를 두는 것이 좋다.
actors.mobs.bee.discover_hint=특정 아이템을 통해 이 유닛을 발견할 수 있습니다.

actors.mobs.brute.name=늑골인 폭력배
actors.mobs.brute.enraged=격노
actors.mobs.brute.def_verb=방어
actors.mobs.brute.desc=야만인은 덩치가 가장 크고, 힘이 가장 강하며 생명력이 가장 질긴 자칼인간입니다. 치명상을 입으면 광폭화하여 일시적인 보호막과 극도로 높은 피해 보너스를 얻습니다.
actors.mobs.brute$bruterage.name=늑골인 광폭화
actors.mobs.brute$bruterage.desc=이 늑골인 폭력배는 죽음 직전이지만, 너를 저승으로 데려가려 한다!

시간이 지나거나 외부 피해를 받으면 보호막이 줄어들고, 보호막이 깨지면 폭력배는 죽는다. 하지만 이 단계에서 폭력배는 막대한 피해를 입힌다!

남은 보호막: %d

actors.mobs.causticslime.name=부식 슬라임
actors.mobs.causticslime.desc=이 슬라임은 아래에서 스며드는 어둠의 에너지에 완전히 침식된 것 같다. 본래의 초록색 광택을 잃었으며, 계속해서 부식성 진흙을 떨어뜨리고 있다.
actors.mobs.causticslime.discover_hint=특정 지하 감옥 지역에서 우연히 이 적을 발견할 수 있습니다.

actors.mobs.crab.name=하수도 게
actors.mobs.crab.desc=이 거대한 게는 하수도 생태계의 최상위 포식자다. 매우 빠르게 움직이며, 두꺼운 등딱지는 강한 타격도 견딜 수 있다.

actors.mobs.crystalguardian.name=수정 수호자
actors.mobs.crystalguardian.def_verb=방어
actors.mobs.crystalguardian.desc=이 거대한 수정 수호자는 눈에 빛이 비치지 않으면 석상과 다를 바 없어 보인다. 경화된 수정으로 이루어진 몸체 때문에 움직임은 둔하지만 매우 단단하다. _수정 동굴에서 잠들어 있는 그들을 방해하지 않는 것이 좋다_.

수정 수호자는 체구가 커서 좁은 지형에서는 매우 느리게 움직인다. 또한 너무 단단해서 완전히 죽일 수 없으며, 쓰러뜨려도 일시적으로 무력화될 뿐 곧 다시 돌아온다.
actors.mobs.crystalguardian.discover_hint=특정 퀘스트에서 이 적을 발견할 수 있습니다.

actors.mobs.crystalmimic.name=수정 모방 상자
actors.mobs.crystalmimic.ate=수정 모방 상자가 네 %s를 먹어치웠다!
actors.mobs.crystalmimic.escaped=수정 모방 상자가 도망쳤다!
actors.mobs.crystalmimic.desc=모방 상자는 자유자재로 외형을 바꾸는 마법 생물이다. 지하 감옥에서는 거의 항상 상자 형태로 나타나는데, 그게 방심한 모험가를 유인하기 좋기 때문이다.

수정 모방 상자는 친척들보다 더 교활해서, 물건을 훔치고 싸움을 피하려 한다. 발견되면 재빨리 도망치며, 공격으로 적을 밀어낼 수도 있다.

actors.mobs.crystalspire.name=수정 첨탑
actors.mobs.crystalspire.warning=두드리는 수정에서 전해지는 진동을 느꼈다. 계속 두드리면 분명 화를 불러일으킬 것이다...
actors.mobs.crystalspire.alert=수정의 진동이 점점 거세지며, 광산 전체에 울리는 굉음이 퍼져나간다!
actors.mobs.crystalspire.desc=이 거대한 첨탑은 매우 단단한 수정으로 이루어져 있으며, 광산의 모든 이상한 수정 생물들의 근원일 가능성이 높다. 일반 무기로는 피해를 줄 수 없으니, 곡괭이를 사용해서 부숴야 한다.

_파괴를 시작하기 전에, 치열한 전투를 대비해야 한다._ 이렇게 거대한 수정을 부수려면 꽤 시간이 걸리며, 방해받지 않기 어렵다. 첨탑 자체에도 방어 메커니즘이 있을 수 있다. _첨탑의 공격이 부하들에게 대항해 사용될 수도 있다._
actors.mobs.crystalspire.discover_hint=특정 퀘스트에서 이 적을 발견할 수 있습니다.

actors.mobs.crystalwisp.name=수정 영기
actors.mobs.crystalwisp.beam_kill=광선에 의해 사망...
actors.mobs.crystalwisp.desc=작고 성난 덩어리의 경화 수정이 공중에 떠서 밝게 빛나고 있다. 강하지는 않지만, 기회가 되면 광선을 발사하여 피해를 준다.

이 영기는 충분히 작아서 수정 가시 위를 쉽게 날아다닐 수 있지만, 발사하는 광선은 그렇지 않다.
actors.mobs.crystalwisp.discover_hint=특정 퀘스트에서 이 적을 발견할 수 있습니다.

actors.mobs.demonspawner.name=악마 피 둥지
actors.mobs.demonspawner.on_death=이곳의 악마 에너지가 피 둥지의 파괴와 함께 약해진 것 같다.
actors.mobs.demonspawner.desc=이 꿈틀거리는 드워프의 살덩어리는 이 지역에서 죽은 드워프들을 이용해 끊임없이 악마 찢개를 만들어내고 있다. 악마들은 적과 싸우기 위해 수단을 가리지 않는 것 같다.

악마 피 둥지는 매우 무서워 보이지만, 자체적으로 이동 능력이나 직접적인 방어 수단은 없다. 하지만 거대한 체적으로 인해 빠르게 파괴하기 어렵고, 위협을 받으면 악마 찢개 생산을 가속화한다.

_악마 피 둥지는 어떤 악마 에너지의 근원과 연결된 것 같다. 피 둥지를 파괴하면 그 근원을 약화시킬 수 있을지도 모른다._

actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=번개에 의해 사망...
actors.mobs.dm100.desc=DM-100은 드워프 「방어 기계」의 초기 모델로, 아래쪽 광산의 드워프 광부들을 보호하기 위해 설계되었다. 그러나 전격 위력이 부족하여 상층의 인간 도시로 보내졌다. 소장은 처음에 DM-100이 너무 잔인하다고 생각했지만, 수년간 방치된 끝에 결국 교도소에 사용되었다. 하지만 시간이 지나면서 죄수들이 통제 불능 상태가 되어 DM-100은 교도소의 필수품이 되었다.

actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=DM-200이 유독성 폐가스를 분사했다!
actors.mobs.dm200.desc=DM-200은 드워프가 개발한 2세대 "방위 기계"로, 원래 광산에서 드워프 광부와 아래 도성을 보호하기 위해 설계되었습니다. 1세대에 비해 상당히 크고 무거우며, 강력한 유압 해머로 공격하도록 개조되었습니다.\n\n비대한 덩치가 큰 약점입니다—좁은 문과 통로에 들어갈 수 없습니다. 유연성의 부족을 보완하기 위해 드워프는 또 다른 기능을 설계했습니다: DM-200은 멀리 있거나 닿을 수 없는 적에게 유독 가스를 분사할 수 있습니다.

비대한 체형은 큰 단점이다. 좁은 문과 통로를 통과할 수 없다. 기동성 부족을 보완하기 위해 드워프들은 또 다른 기능을 설계했다. DM-200은 멀리 떨어져 있거나 닿을 수 없는 적에게 유독성 폐가스를 분사할 수 있다.

actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=DM-201이 부식 유탄을 투척했다!
actors.mobs.dm201.desc=드워프들은 DM-200의 기동성 결함에 대한 실험을 진행했고, 이를 기반으로 완전히 고정된 DM 시리즈 기계를 설계 및 제작했다. DM-201은 개조된 DM-200으로, 초소형 포탑으로서 이동 능력이 전혀 없다. 그 대신 DM-201의 견고함과 공격 능력이 크게 향상되었다.

DM-201은 폐가스를 배출할 엔진이 없기 때문에, 드워프들은 부식 가스 유탄을 장착했다! 하지만 DM-201은 유탄 사용에 신중하며, 원거리에서 공격받을 때만 적에게 유탄을 투척한다.

actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=미 인 가 단 위 탐 지 !
actors.mobs.dm300.shield=DM-300이 지상 전선에서 전력을 흡수하여 보호막을 생성한다!
actors.mobs.dm300.charging=피 해 입 음 ! 에 너 지 타 가 동 !
actors.mobs.dm300.charging_hint=DM-300은 에너지 타워의 전원 공급을 받는 동안 피해를 입지 않습니다!
actors.mobs.dm300.supercharged=파 괴 ! 파 괴 ! 파 괴 !
actors.mobs.dm300.charge_lost=에 너 지 타 파 손 ! 로 컬 전 원 모 드 전 환 !
actors.mobs.dm300.pylons_destroyed=경 보 ! 전 기 망 고 장 감 지 !
actors.mobs.dm300.rankings_desc=DM-300에게 깔려 사망
actors.mobs.dm300.def_verb=방어
actors.mobs.dm300.defeated=심 각 한 손 상 ! 종 료 시 도 중-
actors.mobs.dm300.desc=DM-300은 드워프가 역사상 발명한 가장 강력한 "방위 기계"입니다. 이렇게 강력한 기계는 대량 생산이 극도로 어려워, 드워프들은 지하 도성의 입구를 지키기 위해 몇 대만 제작했습니다.\n\n유독 폐가스를 분사할 수 있는 통풍구와 공격 및 토석 파괴에 사용할 수 있는 고출력 드릴을 갖추고 있습니다. DM-300은 또한 전력망에 연결하여 힘을 더욱 강화할 수 있습니다.

유독성 폐가스를 분사하는 통풍구와 공격 및 토석 파괴에 사용되는 고출력 드릴을 갖추고 있다. DM-300은 전기망에도 연결되어 힘을 더욱 강화할 수 있다.
actors.mobs.dm300.desc_supercharged=DM-300은 전력이 가득 차 최대 출력으로 작동 중이다. 이 형태의 DM-300은 모든 피해를 면역하며, 이동 속도가 2배가 된다! 또한 드릴 출력이 _벽을 뚫을_ 정도로 강력해졌지만, 벽을 뚫을 때는 이동 속도가 훨씬 느리다.

과부하된 DM-300을 직접 공격하는 것은 무의미하지만, _근처에 에너지를 공급하는 장치가 있을 것이다_. 그것을 파괴하면 약화시킬 수 있을지도 모른다.

actors.mobs.dwarfking.name=드워프 왕
actors.mobs.dwarfking.notice=왕실 요새에 감히 침입하다니! 하늘 높은 줄 모르는 놈!
actors.mobs.dwarfking.notice1=어리석은 옛 왕이 너 같은 잔당을 남겨두다니! 좋다, 옛 왕이 어떻게 굴복했는지 알려주마!
actors.mobs.dwarfking.lifelink_1=목숨을 바쳐라, 노예들!
actors.mobs.dwarfking.lifelink_2=나의 대업을 위해, 영광스럽게 희생하라!
actors.mobs.dwarfking.teleport_1=너희, 이자를 잡아라!
actors.mobs.dwarfking.teleport_2=너희, 이자를 저지하라!
actors.mobs.dwarfking.wave_1=됐다! 나를 위해 부활하여 싸워라, 노예들!
actors.mobs.dwarfking.wave_2=계속 올라와라! 나의 강산을 위해 싸워라!
actors.mobs.dwarfking.wave_3=무능한 놈들! 빨리 이자를 처리하라고!
actors.mobs.dwarfking.enraged=네가 이길 수 있다고 생각하느냐, %s. 나 는 불 멸 이 다!
actors.mobs.dwarfking.losing=안 돼! 그럴 수는 없다... 네가 내 왕국 아래 무엇이 묻혀 있는지 알지도 못하면서...
actors.mobs.dwarfking.defeated=네가... 모든 것을 망칠 것이다...
actors.mobs.dwarfking.rankings_desc=드워프 왕 앞에 굴복
actors.mobs.dwarfking.desc=수년 전, 드워프 의회의 가장 강력한 마법사 중 한 명이 생사를 초월하는 비술을 꿰뚫어 보았다. 곧 그는 이 강력한 힘을 이용해 왕실과 의회 전체를 장악하고 타락시켰으며, 왕국의 모든 드워프에게 손아귀를 뻗쳤다. 이제 그는 드워프 왕국의 왕이 되어, 수많은 언데드 군대를 통솔하고 있다.

드워프 왕은 매우 공격적인 강적으로, 그의 언데드 군단을 이용해 침입자를 압도하려 한다.
actors.mobs.dwarfking$dkghoul.rankings_desc=드워프 왕 앞에 굴복
actors.mobs.dwarfking$dkmonk.rankings_desc=드워프 왕 앞에 굴복
actors.mobs.dwarfking$dkwarlock.rankings_desc=드워프 왕 앞에 굴복
actors.mobs.dwarfking$dkgolem.rankings_desc=드워프 왕 앞에 굴복

actors.mobs.ebonymimic.name=흑단 모방 상자
actors.mobs.ebonymimic.reveal=거기에 모방 상자가 있다!
actors.mobs.ebonymimic.hidden_name=수상한 윤곽
actors.mobs.ebonymimic.hidden_desc=무언가 있는 것 같지만, 거의 완전히 투명하다.
actors.mobs.ebonymimic.desc=모방 상자는 자유자재로 외형을 바꾸는 마법 생물이다. 지하 감옥에서는 거의 항상 상자 형태로 나타나는데, 그게 방심한 모험가를 유인하기 좋기 때문이다.

흑단 모방 상자는 은신 능력으로 거의 투명해진다. 모험가가 상호작용할 만한 것에 매복하여 기습 공격을 가한다. 또한 몸속에 전용 전리품을 가지고 있다. 위장을 간파하면 공방 능력은 일반 모방 상자와 다르지 않지만, 방심했다면 기습은 치명적일 수 있다.
actors.mobs.ebonymimic.discover_hint=특정 장신구를 통해 이 적을 발견할 수 있습니다.

actors.mobs.elemental$fireelemental.name=불 정령
actors.mobs.elemental$fireelemental.desc=정령은 일반적으로 통제 불능의 강력한 마법 의식에서 탄생하는 난폭한 생물이다. 정령 생물은 지능이 극도로 낮으며, 보통 특정 마법과 밀접하게 연관되어 있다.

불 정령은 불의 힘으로 공격하는 일반적인 정령 생물이다. 근접 공격으로 대상을 점화시킬 수 있으며, 때로는 원거리 적에게 불덩이를 발사하기도 한다.
actors.mobs.elemental$newbornfireelemental.name=갓 태어난 불 정령
actors.mobs.elemental$newbornfireelemental.charging=갓 태어난 정령이 에너지를 충전 중이다!
actors.mobs.elemental$newbornfireelemental.desc=정령은 일반적으로 통제 불능의 강력한 마법 의식에서 탄생하는 난폭한 생물이다. 정령 생물은 지능이 극도로 낮으며, 보통 특정 마법과 밀접하게 연관되어 있다.

이 불 정령은 막 소환되었지만, 마찬가지로 위험하다!
actors.mobs.elemental$newbornfireelemental.desc_boss=그 본질이 난폭한 소환물이기 때문에, 이 정령의 화염 공격은 1턴 충전 후 부정확한 불길을 분사하는 방식뿐이다.
actors.mobs.elemental$newbornfireelemental.desc_ally=이 정령은 수정 기둥에 의해 소환되었기에 불을 더 잘 제어한다. 원거리 공격은 할 수 없지만, 근접 공격으로 적을 점화할 수는 있다.
actors.mobs.elemental$newbornfireelemental.discover_hint=특정 퀘스트에서 이 적을 발견할 수 있습니다.
actors.mobs.elemental$frostelemental.name=서리 정령
actors.mobs.elemental$frostelemental.desc=정령은 일반적으로 통제 불능의 강력한 마법 의식에서 탄생하는 난폭한 생물이다. 정령 생물은 지능이 극도로 낮으며, 보통 특정 마법과 밀접하게 연관되어 있다.

서리 정령은 서리의 힘으로 적을 약화시키는 일반적인 정령 생물이다. 근접 공격과 드물게 사용하는 원거리 공격 모두 적을 동상에 빠뜨린다. 서리의 힘은 물 위의 적에게 더 효과적이다.
actors.mobs.elemental$shockelemental.name=번개 정령
actors.mobs.elemental$shockelemental.desc=정령은 일반적으로 통제 불능의 강력한 마법 의식에서 탄생하는 난폭한 생물이다. 정령 생물은 지능이 극도로 낮으며, 보통 특정 마법과 밀접하게 연관되어 있다.

번개 정령은 전기와 섬광으로 적을 교란하는 비교적 드문 정령 생물이다. 근접 시 주변 적에게 전기 아크를 방출하며, 물 위의 주요 대상에게 추가 피해를 준다. 때로는 원거리 적을 조준하여 실명시키는 강력한 섬광을 발사하기도 한다.
actors.mobs.elemental$chaoselemental.name=혼돈 정령
actors.mobs.elemental$chaoselemental.desc=정령은 일반적으로 통제 불능의 강력한 마법 의식에서 탄생하는 난폭한 생물이다. 정령 생물은 지능이 극도로 낮으며, 보통 특정 마법과 밀접하게 연관되어 있다.

혼돈 정령은 극히 희귀한 정령 생물이다. 특정 마법에 국한되지 않고, 공격을 통해 적에게 예측 불가능한 야생 마법을 퍼붓는다.

actors.mobs.eye.name=사악한 눈
actors.mobs.eye.deathgaze_kill=죽음의 응시에 의해 사망...
actors.mobs.eye.desc=사악한 눈은 악마 에너지로 가득 찬 떠다니는 구형 생물이다. 근접 능력도 있지만, 진정한 살기는 마법 속에 숨겨져 있다.

사악한 눈은 짧은 충전 후 _죽음의 응시_라는 파괴적인 에너지 광선을 발사한다. 그때 사악한 눈이 응시하는 모든 것은 막대한 피해를 입으며, 현명한 모험가라면 그 위력을 피할 것이다.

actors.mobs.fetidrat.name=악취 쥐
actors.mobs.fetidrat.desc=이 쥐는 보통 쥐와 매우 다르다. 기름진 검은 털과 썩은 피부는 전에 본 건강한 쥐와는 전혀 다르다. 연한 초록색 눈이 더욱 위협적으로 보이게 한다.

이 쥐 주변에는 끔찍한 악취가 감돌고 있으며, 가까이 갈수록 더욱 심해진다.

검은 진흙이 입에서 흘러나온다. 진흙은 바닥 타일을 부식시키지만, 물에 닿으면 녹는 것 같다.
actors.mobs.fetidrat.discover_hint=특정 퀘스트에서 이 적을 발견할 수 있습니다.

actors.mobs.fungalcore.name=버섯 균핵
actors.mobs.fungalcore.desc=이 거대한 버섯은 동굴 내 비정상적인 버섯 활동의 근원일 것이다.

actors.mobs.fungalsentry.name=버섯 파수꾼
actors.mobs.fungalsentry.desc=여기에 우뚝 선 키 큰 버섯은 동굴 전체의 더 큰 균사 네트워크의 방어성 결절이다.

이동할 수는 없지만, 시야에 들어오는 모든 물체를 정확하게 조준하여 독액을 분사한다. 독액 분사의 위력은 상당히 약하지만, _빠르게 중독을 누적시킨다_. 죽일 수는 있지만, 멀리 떨어져 있는 것이 가장 좋다.

actors.mobs.fungalspinner.name=균생 거미
actors.mobs.fungalspinner.desc=이 광산 거미는 기생 균류에 의해 조종당하는 것 같다. 게다가 균류는 숙주의 능력을 변형시켜, 거미줄과 맹독을 균류 성장으로 대체했다.

균생 거미는 거미줄 대신 포자를 분사한다. 포자는 균류를 퍼뜨릴 뿐만 아니라, 너를 그 자리에 묶어버릴 수도 있다. 이 거미는 독성은 없지만, 인접한 버섯 근처에서 높은 피해 저항력을 얻는다.

actors.mobs.ghoul.name=드워프 시체
actors.mobs.ghoul.desc=드워프 사회의 몰락과 새 왕의 독재로 인해, 미천하거나 새 왕에 저항한 드워프들은 좋은 끝을 맞지 못했다. 새 왕이 암흑 마법을 점점 더 능숙하게 다루면서, 이 드워프들은 그의 의지에 굴복하여 군대의 일개 병사로 전락했다.

개별 시체는 강하지 않지만, 항상 무리를 지어 돌아다니며 숫자가 많을수록 상대하기 어려워진다. _주변에 다른 동료가 있는 한, 쓰러진 시체는 몇 턴 후에 다시 일어난다._

actors.mobs.gnoll.name=늑골인 순찰자
actors.mobs.gnoll.desc=늑골인은 하이에나 모양의 인간형 생물이다. 하수구와 지하 감옥을 배회하며, 때때로 지상으로 올라가 공격을 시도한다. 늑골인 순찰자는 종족 중 가장 평범한 일원으로, 폭력배만큼 강하지도 않고 샤먼만큼 똑똑하지도 않다.

actors.mobs.gnollexile.name=늑골인 추방자
actors.mobs.gnollexile.desc=이 회색 털의 늑골인은 어깨에 눈에 띄는 표식이 찍혀 있어 추방되었음을 나타낸다. 늑골인은 보통 규율 위반이나 법률 위반으로 늑골인 사회에서 추방된다. 강함과 영리함은 추방자의 생존 기술이며, 이 개체는 지닌 창을 잘 다루는 것 같다.
actors.mobs.gnollexile.desc_passive=_늑골인 추방자는 현재 공격 의사가 없다._ 이곳의 다른 늑골인처럼 호전적으로 보이지 않으며, 아마도 너와 싸우는 것이 이득이 아니라고 판단한 것 같다. 목숨을 살려줄 수도 있지만, 그가 지닌 보따리에는 유용한 물건이 가득할지도 모른다...
actors.mobs.gnollexile.desc_aggro=_늑골인 추방자가 주변을 노려보며 경계하고 있다._ 결국 그가 공격을 결심하게 만든 무언가가 있는 것 같다. 그 창을 조심해!
actors.mobs.gnollexile.seen_passive=창을 든 늑골인이 경계하며 너를 바라보지만, 공격 의사는 없다.
actors.mobs.gnollexile.seen_aggro=창을 든 늑골인이 공격 준비를 하고 있다!

actors.mobs.gnollgeomancer.name=늑골인 지복술사
actors.mobs.gnollgeomancer.warning=지복술사가 곧 깨어난다. 만반의 준비를 갖추고 계속하라!
actors.mobs.gnollgeomancer.alert=지복술사가 깨어났다! 광산 전체의 구조가 그의 광란적인 비명과 함께 도약하며 변화한 것 같다!
actors.mobs.gnollgeomancer.rock_kill=날아온 암석 조각에 의해 사망...
actors.mobs.gnollgeomancer.rockfall_kill=낙석에 의해 사망...
actors.mobs.gnollgeomancer.desc=이 거구의 늙은 늑골인은 분명 이곳 늑골인의 우두머리이자, 이곳 흙 정령 마법의 근원이다. 늑골인 공병과 달리 지복술사는 흙 정령 마법에 능통하여 날아오는 암석이나 낙석에 다치지 않는다. 하지만 근접한 적을 직접 공격할 수는 없는 것 같다.
actors.mobs.gnollgeomancer.desc_armor=지복술사 주변에 암석 보호막이 감돌고 있다. _곡괭이로 근접해서 암석 보호막을 파괴해야 지복술사 본체에 피해를 줄 수 있다._
actors.mobs.gnollgeomancer.desc_armor_sapper=_옆에 있는 늑골인 공병이 지복술사의 암석 보호막을 강화하는 장치를 들고 있다. 지금의 지복술사는 모든 피해를 면역한다!_
actors.mobs.gnollgeomancer.desc_sleeping=이 거구의 늙은 늑골인 샤먼 주변에 암석이 감돌고 있어 마치 조각상처럼 보인다. 자세히 관찰해 보면, 이 암석들은 늙은 늑골인의 호흡에 따라 움직이는 유동형 보호막이다. 이 보호막 덕분에 어떤 피해도 받지 않고, 이 바위 투성이인 곳에서 편히 휴식할 수 있다.

손에 든 곡괭이로 그의 암석 보호막을 부술 수 있지만, _이 전투는 충분한 준비가 필요하다_. 지복술사는 분명 이곳 늑골인의 우두머리이자, 흙 정령 마법의 근원이다. _그에게 도전하기 전에 주변에 흩어져 있는 다른 늑골인을 먼저 처치하는 것이 좋다._
actors.mobs.gnollgeomancer.discover_hint=특정 퀘스트에서 이 적을 발견할 수 있습니다.

actors.mobs.gnollguard.name=늑골인 경비병
actors.mobs.gnollguard.def_verb=방어
actors.mobs.gnollguard.spear_warn=늑골인이 창끝으로 잔혹한 일격을 가했다!
actors.mobs.gnollguard.desc=이 크고 건장한 늑골인은 창과 방패를 다루지만, 투구는 쓰지 않았다. 이 경비병들은 폭력배로 승진하기 위해 훈련 중이며, 야수로부터 광산을 보호하기 위해 이곳에서 근무하고 있다.

늑골인 경비병은 몸집이 건장해서 한 손으로도 창을 휘두를 수 있지만, 솜씨는 그리 좋지 않다. _상당히 넓은 공간이 있어야 장거리 공격을 할 수 있다. 일단 가까이 붙으면 창이 제대로 휘둘러지지 않아 위력이 크게 줄어든다._
actors.mobs.gnollguard.desc_armor=_옆에 있는 늑골인 공병이 이 경비병에게 대지 갑옷을 부여하는 장치를 들고 있어, 받는 피해를 크게 줄인다._
actors.mobs.gnollguard.discover_hint=특정 퀘스트에서 이 적을 발견할 수 있습니다.

actors.mobs.gnollsapper.name=늑골인 공병
actors.mobs.gnollsapper.desc=이 늑골인은 작고 약하지만 영리하다. 밝은 색 털을 가지고 있으며, 각종 소도구가 가득 담긴 주머니를 차고 있다. 암금석 탐사와 채굴을 돕는 것 같으며, 늑골인 경비병의 보호를 받고 있다. 근접 전투는 가능하지만 공격력이 너무 약해서 늑골인 순찰자보다 낫지 않다.

직접 싸우는 것보다는, 휴대한 각종 장치로 주변 암석을 조종하여 공격하는 것을 선호한다. 도구를 사용해 바위를 던질 뿐, 흙 정령 마법을 익히지는 않았다. _그들의 공격을 이용해 그들이나 다른 경비병에게 역공을 가할 여러 방법이 있을 것이다._
actors.mobs.gnollsapper.discover_hint=특정 퀘스트에서 이 적을 발견할 수 있습니다.

actors.mobs.gnolltrickster.name=늑골인 계략가
actors.mobs.gnolltrickster.desc=늑골인의 기준으로도 이 생물은 매우 기괴하다. 허리를 구부정하게 하고, 은밀히 움직이며, 커다란 입을 벌려 사악한 미소를 짓고, 어깨에 걸친 주머니가 요람처럼 부풀어 있다. 눈동자에는 공포와 흥분이 뒤섞여 있다.

그의 주머니에는 대량의 조잡한 투척용 단검이 들어 있으며, 다양한 유해 물질이 발라져 있는 것 같다.
actors.mobs.gnolltrickster.discover_hint=특정 퀘스트에서 이 적을 발견할 수 있습니다.

actors.mobs.goldenmimic.name=황금 모방 상자
actors.mobs.goldenmimic.desc=모방 상자는 자유자재로 외형을 바꾸는 마법 생물이다. 지하 감옥에서는 거의 항상 상자 형태로 나타나는데, 그게 방심한 모험가를 유인하기 좋기 때문이다.

황금 모방 상자는 최고의 모험가를 유인하는 강력한 모방 상자다. 더 풍부한 보물을 가지고 있지만, 일반 모방 상자보다 훨씬 강력하다.

actors.mobs.golem.name=골렘
actors.mobs.golem.def_verb=방어
actors.mobs.golem.desc=골렘은 드워프들이 마법의 새로운 응용을 통해 기계 장비의 오랜 결함을 보완하려 시도한 산물이다. DM-300처럼 크고 무겁지는 않지만, 무시할 수 없는 파괴력을 지녔다.

골렘은 체구가 커서 통로를 통과할 수 없지만, 드워프들은 마법을 부여하여 이 점을 보완했다. 골렘은 방 사이를 순간 이동할 수 있으며, 닿을 수 없는 적을 멀리서 끌어당길 수 있다.

actors.mobs.goo.name=끈끈이
actors.mobs.goo.notice=끈-끈!
actors.mobs.goo.defeated=끈...끈...
actors.mobs.goo.!!!=!!!
actors.mobs.goo.pumpup=끈끈이가 계속해서 꿈틀거리고 있다!
actors.mobs.goo.enraged=격노
actors.mobs.goo.gluuurp=끈————!
actors.mobs.goo.rankings_desc=끈끈이에게 소화됨
actors.mobs.goo.desc=우리는 끈끈이에 대해 거의 알지 못한다. 그것은 생물체가 아니라, 하수구 표면에 모인 사악한 물질이 기본 지능을 얻어 생성된 실체일 가능성도 있다. 어쨌든, 암흑 마법이 이 생물을 만들어낸 것은 분명하다.

그 젤리 성질 덕분에 많은 암흑 에너지를 흡수했으며, 가까이 가기만 해도 한기가 느껴진다. 끈끈이가 이 에너지로 너를 공격한다면, 너는 오래 버티지 못할 것이다.

actors.mobs.greatcrab.name=거대 집게게
actors.mobs.greatcrab.noticed=거대 게가 거대한 집게로 이번 공격을 막아냈다.
actors.mobs.greatcrab.def_verb=방어
actors.mobs.greatcrab.desc=이 게는 하수도 게 중에서도 거대한 편이다. 파란 등딱지에는 균열과 따개비가 가득하여 오랜 세월을 증명한다. 느릿느릿 기어가며, 그 거대한 집게 때문에 균형을 유지하기 어려워 보인다.

이 게는 한쪽 집게밖에 없지만, 그 크기가 단점을 충분히 보완한다. 게는 위험을 감지하면 집게를 앞으로 들어 올려, 부서지지 않는 등딱지로 방어한다. 하지만 게는 인지하지 못한 공격이나 여러 적의 동시 공격은 막아낼 수 없다.
actors.mobs.greatcrab.discover_hint=특정 퀘스트에서 이 적을 발견할 수 있습니다.

actors.mobs.guard.name=감옥 경비병
actors.mobs.guard.scorpion=이리 와!
actors.mobs.guard.def_verb=방어
actors.mobs.guard.desc=이 경비병들은 한때 교도소의 관리자였지만, 지금은 그 죄수들과 다를 바 없다. 좀비처럼 비틀거리며, 무의미하게 이 지역에 속하지 않은 생물, 예를 들어 너를 찾아 헤맨다!

그의 허리에는 쇠사슬이 감겨 있으며, 아마도 그것으로 적을 앞으로 끌어당길지도 모른다.

actors.mobs.hermitcrab.name=소라게
actors.mobs.hermitcrab.def_verb=방어
actors.mobs.hermitcrab.desc=무슨 이유에서인지, 이 하수도 게가 부러진 통을 머리에 뒤집어쓰기로 결정했다! 추가 중량 때문에 이동 속도는 보통 수준으로 떨어졌지만, 방어력은 증가했다. 통 안에서 무언가 부딪히는 소리가 들리는 것 같다...

actors.mobs.mimic.name=모방 상자
actors.mobs.mimic.reveal=모방 상자다!
actors.mobs.mimic.hidden_hint=이 상자는 좀 수상해 보인다... 그냥 열어보는 것은 좋지 않은 것 같다.
actors.mobs.mimic.desc=모방 상자는 자유자재로 외형을 바꾸는 생물이다. 지하 감옥에서는 거의 항상 상자 형태로 나타나는데, 그게 방심한 모험가를 유인하기 좋기 때문이다.

모방 상자는 강한 공격력을 가지고 있지만, 보통 상자보다 더 많은 보물을 가지고 있는 경우가 많다.
actors.mobs.mimic.discover_hint=모든 지하 감옥 지역에서 이 적을 발견할 수 있습니다.

actors.mobs.necromancer.name=사령술사
actors.mobs.necromancer.desc=이 암흑 마법의 견습생들이 교도소로 대거 유입되었다. 여기가 그들의 사령술을 연마하기에 가장 좋은 장소이기 때문이다.

사령술사는 해골을 소환하고 강화하여 싸운다. 사령술사가 죽으면 그가 소환한 해골도 함께 소멸한다.
actors.mobs.necromancer$necroskeleton.name=사령술사의 해골
actors.mobs.necromancer$necroskeleton.desc=이 해골은 사령술사에 의해 소환되었다. 능력과 습성은 일반 해골과 같지만, 소환자가 죽으면 함께 소멸한다.

actors.mobs.mob.died=멀리서 무언가 죽는 소리가 희미하게 들린다.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=사인: %s
actors.mobs.mob.discover_hint=특정 지하 감옥 지역에서 이 적을 발견할 수 있습니다.

actors.mobs.monk.name=드워프 승려
actors.mobs.monk.def_verb=방어
actors.mobs.monk.parried=받아넘김
actors.mobs.monk.desc=이 승려들은 광신적인 신도로서, 모든 이족으로부터 왕을 지키기 위해 최선을 다합니다. 광신적인 신앙으로 인해 그들은 자신의 의지를 왕에게 바쳤고, 생각 없는 육체만이 도시를 배회하고 있습니다.\n\n드워프 무승은 갑옷도 무기도 착용하지 않고, 오직 맨손 격투 기술로 적을 물리칩니다. 집중한 무승은 반드시 한 번의 물리 공격을 막아내며, 반드시 명중하는 공격조차도 막아냅니다. 무승은 이동 중에 더 빨리 집중할 수 있으며, 전투 중에는 상대적으로 느립니다.

드워프 승려는 갑옷도 무기도 없이, 오직 맨손 격투 기술만으로 적을 물리친다. 정신을 집중한 승려는 반드시 한 번의 물리 공격을 받아넘기며, 심지어 반드시 명중해야 하는 공격도 받아넘긴다. 승려는 이동할 때 더 빨리 정신을 집중하고, 전투 중에는 상대적으로 느리다.
actors.mobs.monk$focus.name=정신 집중
actors.mobs.monk$focus.desc=이 승려는 완전히 대상의 모든 움직임에 집중하고 있으며, 대상의 다음 동작을 예측할 수 있는 것 같다.

정신 집중 상태의 캐릭터는 반드시 다음 물리 공격을 받아넘기며, 심지어 반드시 명중해야 하는 공격도 받아넘긴다. 공격을 받아넘기면 승려의 정신 집중이 소모되며, 다음 공격을 받아넘기기 위해 다시 정신을 집중해야 한다. 승려는 이동할 때 더 빨리 정신을 집중할 수 있다.

actors.mobs.phantompiranha.name=환영 피라냐
actors.mobs.phantompiranha.teleport_away=환영 피라냐가 순간 이동했다...
actors.mobs.phantompiranha.desc=환영 피라냐는 거대 피라냐의 희귀 변종으로, 기이한 반투명 몸체와 마법 능력을 가지고 있다. 공격을 받으면 순간 이동할 수 있어, 공격과 도피 모두에 이 능력을 사용한다!

상대하기는 어렵지만, 그 고기는 마력을 지녀 매우 귀중하게 여겨진다.

actors.mobs.piranha.name=거대 피라냐
actors.mobs.piranha.desc=이 육식성 물고기들은 물에 잠긴 저장고를 보호하기 위해 특별히 사육되었다. 물어뜯기는 치명적이므로, 정면 대결은 피하는 것이 좋다.
actors.mobs.piranha.discover_hint=모든 지하 감옥 지역에서 이 적을 발견할 수 있습니다.

actors.mobs.pylon.name=에너지 타워
actors.mobs.pylon.desc_inactive=지역 내 기계에 전력을 분배하는 에너지 타워다.

이 에너지 타워는 활성화되지 않아 현재 어떤 피해도 받지 않는다.
actors.mobs.pylon.desc_active=지역 내 기계에 전력을 분배하는 에너지 타워다. 지금 타워에 전력이 흐르고 있으니, 분명 DM-300의 과부하 상태를 지원하고 있을 것이다!

이때의 에너지 타워는 파괴될 수 있지만, 시계 방향으로 주변에 전기 아크를 방출한다. 두꺼운 금속 구조로 인해 빠르게 파괴되기는 어렵다.

actors.mobs.rat.name=설치류 쥐
actors.mobs.rat.desc=설치류 쥐는 공격적이지만, 여전히 하수도 주민 중에서는 약자다. 물어뜯기는 매우 귀찮지만, 엄청난 수가 모여야 생명의 위협이 된다.

actors.mobs.ripperdemon.name=악마 찢개
actors.mobs.ripperdemon.leap=악마 찢개가 덤벼들 준비를 하고 있다!
actors.mobs.ripperdemon.desc=이 무서운 생물은 악마가 이곳에 남아있는 많은 드워프 시체를 이용해 만든 것이다. 악마 찢개의 외형은 야윈 드워프 시체와 비슷하며, 몸은 불완전하지만 뼈 발톱은 매우 날카롭다.

악마 찢개는 내구성이 좋지 않지만, 여전히 민첩하고 치명적이다. 멀리서 달려와 덤벼들며, 뼈 발톱으로 목표에게 피 흘리는 상처를 낸다.

actors.mobs.rotheart.name=썩은 딸기 핵심
actors.mobs.rotheart.desc=썩은 딸기의 열매는 독특하다. 일반적인 열매는 썩어서 양분이 되지만, 썩은 딸기의 열매는 자라고 단단해져서 씨앗을 감싼다. 열매는 그 안에 자란 기관을 보호한다. 이 거대한 구체는 성숙한 썩은 딸기 식물의 핵심으로 간주된다.
actors.mobs.rotheart.discover_hint=특정 퀘스트에서 이 적을 발견할 수 있습니다.

actors.mobs.rotlasher.name=썩은 딸기 덩굴손
actors.mobs.rotlasher.desc=썩은 딸기 덩굴손은 성숙한 썩은 딸기 뿌리 계통의 일부이자 주요 방어 수단이다. 덩굴손은 시력이 없고 땅에 고정되어 움직일 수 없다. 하지만 주변에 위협이 나타나면, 잠시 대상을 감지한 후 맹공을 퍼붓는다. 주변에 적이 없으면 가만히 있어 주변 식생에 자신을 녹이려 한다.
actors.mobs.rotlasher.discover_hint=특정 퀘스트에서 이 적을 발견할 수 있습니다.

actors.mobs.scorpio.name=전갈
actors.mobs.scorpio.desc=이 거대한 절지동물 악마는 근접전을 피하며, 원거리에서 적을 불구로 만드는 톱니바늘을 발사하는 데 더 능숙하다.

actors.mobs.senior.name=승려 대사
actors.mobs.senior.desc=이 승려들은 광신적인 신도들로, 모든 이족으로부터 왕을 보호하는 데 모든 것을 바친다. 광적인 신앙심으로 그들은 자신의 의지를 왕에게 바쳤고, 생각 없는 껍데기만이 도시를 배회하고 있다.

이 승려는 깊은 격투 기술을 익혔으며, 일반 승려보다 이동 중에 더 빨리 정신을 집중할 수 있다. 정신을 집중한 승려는 반드시 한 번의 물리 공격을 받아넘기며, 심지어 반드시 명중해야 하는 공격도 받아넘긴다. 승려는 이동할 때 더 빨리 정신을 집중하고, 전투 중에는 상대적으로 느리다.

actors.mobs.shaman.name=늑골인 샤먼
actors.mobs.shaman.bolt_kill=마력 투사체에 의해 사망...
actors.mobs.shaman.desc=늑골인 샤먼은 대부분의 늑골인보다 지혜로우며, 전투 마법으로 힘의 부족을 보완한다. 늑골인 샤먼은 상대적으로 힘이 약하지만, 부족 내에서 높은 지위를 누린다.
actors.mobs.shaman$redshaman.spell_desc=붉은 가면을 쓴 샤먼은 마법으로 _네 공격력을 약화시킨다_.
actors.mobs.shaman$blueshaman.spell_desc=파란 가면을 쓴 샤먼은 마법으로 _네가 받는 피해를 증가시킨다_.
actors.mobs.shaman$purpleshaman.spell_desc=보라 가면을 쓴 샤먼은 마법으로 _네 명중률과 회피율을 감소시킨다_.

actors.mobs.armoredbrute.name=장갑 폭력배
actors.mobs.armoredbrute.desc=이 최정예 늑골인 폭력배들은 보통 강력한 갑옷을 장비하여 자신의 지위를 과시한다. 폭력배의 갑옷은 물리 방어력을 배가시키며, 강인한 의지는 죽음 직전의 광폭화 지속 시간을 크게 연장시킨다.

actors.mobs.skeleton.name=해골
actors.mobs.skeleton.explo_kill=튀어나온 뼈 조각에 의해 사망...
actors.mobs.skeleton.def_verb=방어
actors.mobs.skeleton.desc=해골은 불운한 모험가와 교도소 원주민의 시체가 지하 감옥 깊은 곳의 사악한 마력에 의해 깨어난 것이다. 해골이 파괴되면, 뼈가 파편으로 폭발한다. 튀어나온 뼈 조각은 인접한 모든 캐릭터에게 피해를 주며, 갑옷은 이 피해를 크게 줄여준다.

actors.mobs.slime.name=슬라임
actors.mobs.slime.def_verb=방어
actors.mobs.slime.desc=슬라임은 젤리 같은 외형과 액체 코어를 가진 기묘한 마법 생물이다. 도시의 하수도는 그들에게 충분한 물과 풍부한 영양분을 제공한다.

슬라임의 외부 젤리 막은 매우 강한 탄성을 가져, 어떤 단일 공격도 _6포인트 이상의 피해_를 주기 어렵다.

actors.mobs.snake.name=하수도 거대 뱀
actors.mobs.snake.hint=확인 버튼으로 뱀을 선택하여 물리치는 방법을 알아보세요.
actors.mobs.snake.desc=이 대형 뱀은 빠르게 미끄러져 공격을 회피할 수 있으므로 명중시키기 어렵다. 하지만 매복과 마법 공격은 그들을 기습할 수 있다.

뱀의 시야 밖에서 공격하면 그 공격은 매복 공격이 된다. 매복 방법 중 하나는 뱀이 너를 쫓을 때 문 뒤로 숨은 후, _뱀이 문으로 들어오는 순간 공격하는 것_이다.

actors.mobs.spectralnecromancer.name=유령 사령술사
actors.mobs.spectralnecromancer.desc=사령술사들은 보통 해골 소환에 집착하지만, 그중 어떤 개체는 더 아득하고 무형한 피조물을 부리는 것을 선호한다. 유령 사령술사는 원귀를 자신의 하수인으로 선택했다!

원귀의 개별 전투력은 해골보다 못할 수도 있지만, 이 유령 사령술사들은 하수인이 아무리 많아도 질리지 않는다!

actors.mobs.spinner.name=광산 거미
actors.mobs.spinner.desc=이 초록색 털을 가진 광산 거미는 정면 대결을 피하려 한다. 거미줄에 갇힌 먹잇감이 천천히 독에 중독되어 죽기를 기다리며 멀리 떨어져 있는 것을 선호한다. 또한 멀리 거미줄을 뿜어 적의 이동 경로를 차단할 수 있다.

actors.mobs.statue.name=살아있는 석상
actors.mobs.statue.def_verb=방어
actors.mobs.statue.desc=지하 감옥의 또 다른 조용히 서 있는 석상일 거라 생각했지만, 붉게 빛나는 눈이 그것을 드러냈다.
actors.mobs.statue.desc_weapon=석상 자체는 돌로 만들어졌지만, 장비한 _%s_는 진짜처럼 보인다.
actors.mobs.statue.discover_hint=모든 지하 감옥 지역에서 이 적을 발견할 수 있습니다.

levels.minigame.extraction.mobs.vaultarmoredstatue.name=금고 철위병
levels.minigame.extraction.mobs.vaultarmoredstatue.desc=이 장갑 구조체는 폐쇄된 금고를 지키기 위해 제작되었다. 일반 석상처럼 잠들어 있지 않고, 습격 시작과 동시에 깨어나 침입자를 적극적으로 수색한다.
levels.minigame.extraction.mobs.vaultarmoredstatue.desc_arm_wep=철위병은 _%1 손에 들고 _%2 입고 있다.

levels.minigame.extraction.mobs.veilbreakereye.name=파막 사악한 눈
levels.minigame.extraction.mobs.veilbreakereye.desc=이 사악한 눈은 은신자가 남긴 미세한 움직임을 포착할 수 있다. 은신 상태의 영웅이 시야 내에 있을 때, 매 턴마다 은신 장막을 찢으려 시도한다. 거리가 가까울수록 은신 해제 확률이 높아진다.
levels.minigame.extraction.mobs.veilbreakereye.reveal=파막 사악한 눈이 너를 포착했다. 숨었던 장막이 찢겨나갔다!

levels.minigame.extraction.mobs.chronosuccubus.name=시간 도둑 서큐버스
levels.minigame.extraction.mobs.chronosuccubus.desc=이 서큐버스는 감정뿐만 아니라 훔친 시간도 먹잇감으로 삼는다. 너가 그 시야 내에서 시간 정지 상태로 행동할 때, 그녀가 시간 정지를 즉시 붕괴시킬 수 있다. 남은 턴이 적을수록 성공 확률이 높아진다.
levels.minigame.extraction.mobs.chronosuccubus.break_time=시간 도둑 서큐버스가 네 마지막 정지 순간을 빼앗아갔다!

levels.minigame.extraction.mobs.deferredscorpio.name=지연 상처 전갈
levels.minigame.extraction.mobs.deferredscorpio.desc=이 전갈이 쏜 가시는 즉시 발병하는 상처를 남기고 즉시 적에게 피해를 입히며, 적은 피해의 근원을 극도로 찾기 어려워한다.

levels.minigame.extraction.mobs.raidkeycarrier.name=수정 열쇠 소지자
levels.minigame.extraction.mobs.raidkeycarrier.desc=이 적은 대피에 필요한 수정 열쇠를 가지고 있다. 처치하면 열쇠를 획득할 수 있다.

actors.mobs.succubus.name=서큐버스
actors.mobs.succubus.desc=서큐버스는 적의 정신을 조종하는 데 능숙한 변신 악마다. 이 개체는 고딕 양식의 창백한 인간형으로 변신했으며, 아마도 드워프 마법사를 유혹하기 위해서일까?

공격 시 서큐버스는 일시적으로 대상을 매혹하여 서큐버스 자신을 직접 공격하지 못하게 한다. 서큐버스는 매혹된 대상을 공격할 때 생명 정수를 흡수할 수 있다.

actors.mobs.swarm.name=파리 떼
actors.mobs.swarm.desc=치명적인 파리 떼가 분노하여 윙윙거리고 있다. 비마법 공격을 받을 때마다 두 개의 더 작지만 똑같이 위험한 파리 떼로 분열된다.

actors.mobs.tengu.name=텐구
actors.mobs.tengu.notice_gotcha=잡았다, %s!
actors.mobs.tengu.interesting=이 전투를 좀 더 재미있게 만들 시간이다...
actors.mobs.tengu.notice_have=네 목숨은 내 거다, %s!
actors.mobs.tengu.defeated=드디어... 해방됐다...
actors.mobs.tengu.rankings_desc=텐구에게 암살당함
actors.mobs.tengu.desc=유명한 수수께끼의 암살자로, 그 이름은 얼굴에 밀착된 가면에서 유래했다.

텐구의 손목과 무릎 아래에는 족쇄가 채워져 있지만, 그는 아주 오래전에 쇠사슬에서 벗어난 것 같다.

그는 함정, 기만적인 마법, 정확하고 치명적인 공격을 이용해, 그가 탈출하는 것을 막을 수 있는 유일한 존재, 바로 너를 제거할 것이다.

actors.mobs.tengu$bombability$bombblob.desc=여기에 과열된 연기가 소용돌이치고 있다. 조심해, 곧 폭발한다!
actors.mobs.tengu$bombability$bombitem.name=연기 폭탄
actors.mobs.tengu$bombability$bombitem.cant_pickup=바닥에 고정되어 있어, 옮길 수 없다!
actors.mobs.tengu$bombability$bombitem.desc=텐구가 여기 기이한 모양의, 뜨거운 연기를 계속해서 뿜어내는 폭탄을 던졌다. 똑딱거리고 있으며, 폭발 초읽기인 것 같다!

폭탄이 바닥에 박혀 있어, 주울 수 없다.

actors.mobs.tengu$fireability$fireblob.desc=텐구가 여기에 연기가 나기 시작한 미세한 가루를 뿌렸다. 곧 불타오를 것이다!

actors.mobs.tengu$shockerability$shockerblob.desc=여기에 전기가 모이고 있다. 이곳에 서 있는 모든 유닛은 다음 턴에 감전된다!
actors.mobs.tengu$shockerability$shockeritem.name=감전 장치
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=전기 방출이 너무 강해, 만질 수 없다!
actors.mobs.tengu$shockerability$shockeritem.desc=텐구가 여기 이상한 장치를 던졌다. DM-100의 부품으로 조립한 것 같다. 장치는 계속 주위로 전기 아크를 방출하고 있지만, 범위에는 규칙이 있는 것 같다.

이렇게 고밀도의 고압 전기 아크에 둘러싸여 있어, 주울 엄두가 나지 않는다.

actors.mobs.thief.name=광란 도둑
actors.mobs.thief.stole=도둑이 네 %s를 훔쳐갔다!
actors.mobs.thief.carries=

이 도둑은 _%s_를 가지고 있다. 분명 훔친 물건이다.
actors.mobs.thief.escapes=도둑이 네 %s를 가지고 도망쳤다!
actors.mobs.thief.desc=이 죄수들은 감방에서 탈출했지만, 감옥 자체를 탈출하지는 못했다. 시간이 지나면서 이 감옥은 그들의 남은 이성과 자유에 대한 갈망을 완전히 파괴했다. 이 광란 도둑과 강도들은 아주 오래전에 자신이 누구인지, 왜 도둑질을 하는지 완전히 잊어버렸다.

이 적들은 정면 대결보다는 네 재산을 훔쳐 도망가는 것을 선호한다. 잘 지켜봐야 한다. 그렇지 않으면 도난당한 물건을 다시는 보지 못할 수도 있다.

actors.mobs.tormentedspirit.name=저주받은 영혼
actors.mobs.tormentedspirit.desc=저주받은 영혼은 본성은 선하지만 저주에 시달리는 혼령이다. 저주가 지속되는 한, 그들은 더 강력한 원귀처럼 너를 공격할 것이다!

아마도 인접한 상태에서 축령의 두루마리를 사용하여 혼령의 저주를 정화할 수 있을 것이다. 저주가 정화되면, 그들은 반드시 네게 보답할 것이다...
actors.mobs.tormentedspirit.thank_you=고마워...

actors.mobs.warlock.name=드워프 마법사
actors.mobs.warlock.bolt_kill=어둠의 투사체에 의해 사망...
actors.mobs.warlock.desc=드워프들의 관심이 공학 건설에서 신비 학문으로 옮겨가면서, 마법사들이 도시에서 점차 권력을 잡았다. 그들은 원소 마법에서 시작했지만, 곧 악마학과 사령술을 연구하기 시작했다. 가장 강력한 마법사가 드워프 왕국의 왕권을 장악했고, 다른 마법사들이 암흑 마법을 계속 수행하려면 정신의 자유를 포기하고 그의 통제에 의지를 맡겨야 했다.

이 마법사들은 강력한 교란 마법을 가지고 있어, 장비의 강화 마법을 일시적으로 억제할 수 있다. 장비의 레벨이 높을수록 강등 마법의 영향을 더 심하게 받는다.

actors.mobs.wraith.name=원귀
actors.mobs.wraith.desc=원귀는 무덤에서 나온 복수에 굶주린 죄인의 영혼이다. 아득한 비실체이기 때문에 일반 무기로 맞히기 어렵다.
actors.mobs.wraith.discover_hint=모든 지하 감옥 지역에서 이 적을 발견할 수 있습니다.

actors.mobs.yogdzewa.name=Yog-Dzewa
actors.mobs.yogdzewa.notice=보 였 다
actors.mobs.yogdzewa.notice1=네 조물주에게로 오너라
actors.mobs.yogdzewa.darkness=어둠이 다가오고 있다...
actors.mobs.yogdzewa.hope=네 희망은 모두 헛된 것이다
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.rankings_desc=Yog-Dzewa에게 삼켜짐
actors.mobs.yogdzewa.desc=Yog-Dzewa는 고대 신이다. 자신의 힘을 인간 세계로 뻗쳐 그것을 삼키고, 자신의 끝없는 성장을 위한 영양분을 공급받는 거대한 괴물이다. 드워프들은 암흑 마법을 다루다가 이 거대한 공포의 주의를 끌었고, 그 이후로 그를 통제하여 외부를 침식하지 못하게 하려고 노력해 왔다.

이 고대 신은 마법과 혼돈으로 가득 찬 원시 차원에서 기원했으며, 그의 진정한 형태를 이 세계로 가져올 수 없다. 따라서 그는 자신의 화신을 만들고 악마들을 하수인으로 소환하여 명령을 수행하게 했다.

이 거대한 눈은 이 세계에서 고대 신의 힘의 초점이다. 눈 자체는 움직일 수 없지만, 강력한 마력 광선을 발사하고 다양한 악마 하수인을 소환하여 자신을 도울 수 있다.
actors.mobs.yogdzewa.desc_spawners=윗층에서 악마 에너지가 고대 신의 눈으로 흘러드는 것을 느낀다. 네가 위에 살아서 남긴 무언가가 고대 신에게 에너지를 되돌려주고 있다. _고대 신은 이 에너지를 사용하여 더 강력한 부하를 소환할 것이다!_
actors.mobs.yogdzewa$larva.name=고대 신 유충
actors.mobs.yogdzewa$larva.rankings_desc=Yog-Dzewa에게 삼켜짐
actors.mobs.yogdzewa$larva.desc=이 고대 신의 작은 피조물은 만들기 쉬운 단순한 생물이다. 개별 유충은 매우 약하지만, 빠르게 만들어질 수 있으며, 큰 숫자가 모이면 막기 어려워진다.
actors.mobs.yogdzewa$yogripper.rankings_desc=Yog-Dzewa에게 삼켜짐
actors.mobs.yogdzewa$yogeye.rankings_desc=Yog-Dzewa에게 삼켜짐
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Yog-Dzewa에게 삼켜짐

actors.mobs.yogfist.invuln_warn=주먹이 고대 신의 눈에 인접해 있을 때는 피해를 입을 수 없다!
actors.mobs.yogfist.rankings_desc=Yog-Dzewa에게 삼켜짐
actors.mobs.yogfist.desc=이 주먹은 고대 신 힘의 일부가 구현된 것이다. 이 주먹들은 고대 신의 힘과 상호 연결되어 있으며, 고대 신의 눈에 가까이 있을 때는 모든 피해를 면역한다.
actors.mobs.yogfist$burningfist.name=불타는 주먹
actors.mobs.yogfist$burningfist.desc=불타는 주먹은 혼돈의 뜨거운 마법으로 형성되었다. 이동할 때 주변 환경을 계속해서 점화시킨다. 또한 화염 에너지를 발사하여 마법 충격을 만들어 목표 지점을 맹렬한 불길로 뒤덮을 수 있다.

불타는 주먹이 환경을 점화시키는 능력은 물 근처에서 억제되지만, 그 열기가 너무 커서 주변의 물은 곧 증발해 버린다!
actors.mobs.yogfist$soiledfist.name=대지의 주먹
actors.mobs.yogfist$soiledfist.desc=대지의 주먹은 혼돈의 대지 마법으로 형성되었다. 이동할 때 주변에 계속해서 식물을 자라게 한다. 또한 정확한 대지 충격을 발사하여 대상을 빠르게 자라는 덩굴과 뿌리 사이에 가둘 수 있다!

대지의 주먹은 식물의 생명력에서 힘을 얻을 수 있으며, 주변의 식물 양에 따라 피해를 막아낼 수 있다!
actors.mobs.yogfist$rottingfist.name=부패의 주먹
actors.mobs.yogfist$rottingfist.desc=부패의 주먹은 살아있는 썩은 살덩어리로 형성되었다. 탑처럼 거대한 썩은 살덩어리 덩어리로, 근접전에서는 부식 진흙을 튀기고, 원거리 공격으로 독가스를 분사한다. 더 나쁜 것은, 부패의 주먹의 거대한 질량 때문에 공격을 받으면 출혈 상태에 들어갈 뿐, 직접 피해를 입지 않는다는 점이다.

부식 진흙은 물로 씻어낼 수 있지만, 부패의 주먹은 물을 흡수하여 스스로를 치유할 수도 있다! 게다가 출혈 중인 부패의 주먹에 피해를 입히면 출혈 상태가 새로고침될 뿐, 효과가加重되지는 않는다!
actors.mobs.yogfist$rustedfist.name=녹슨 주먹
actors.mobs.yogfist$rustedfist.desc=녹슨 주먹은 살아있는 금속 덩어리로 형성되었다. 탑처럼 거대한 살아있는 금속 덩어리로, 강력한 근접 능력과 원거리에서 대상을 불구로 만드는 능력을 가지고 있다. 거대한 질량 때문에, 녹슨 주먹이 받는 피해는 즉시 적용되지 않고 지연된다.

그럼에도 불구하고, 녹슨 주먹의 둔중한 특성 때문에 좁은 통로를 통과할 수 없다. 또한, 녹슨 주먹은 피해를 천천히 입지만, 지연 피해는 여러 번 공격을 받으면 계속 누적된다.
actors.mobs.yogfist$brightfist.name=광휘의 주먹
actors.mobs.yogfist$brightfist.teleport=광휘의 주먹이 너를 심하게 실명시키는 섬광과 함께 다른 곳으로 순간 이동했다!
actors.mobs.yogfist$brightfist.desc=광휘의 주먹은 순수한 빛 에너지로 형성되었다. 매 턴마다 강력하고 눈부신 광선을 발사한다! 이 광선은 막대한 피해를 입힐 뿐만 아니라, 일시적으로 너를 실명시킨다. 광휘의 주먹은 도망치기 위해 전장 전체를 뒤덮는 눈부신 섬광을 발산할 수도 있다!

광휘의 주먹은 근접전에서 특별한 능력이 없다.
actors.mobs.yogfist$darkfist.name=어둠의 주먹
actors.mobs.yogfist$darkfist.teleport=어둠의 주먹이 네 광원을 꺼뜨리는 칠흑 같은 어둠 속에서 다른 곳으로 순간 이동했다!
actors.mobs.yogfist$darkfist.desc=어둠의 주먹은 순수한 어둠의 에너지로 형성되었다. 매 턴마다 강력한 암흑 마법을 발사한다! 이 마법은 막대한 피해를 입힐 뿐만 아니라, 네 광원을 약화시킨다. 어둠의 주먹은 도망치기 위해 순간적으로 전장 전체를 칠흑 같은 어둠으로 뒤덮을 수 있다!

어둠의 주먹은 근접전에서 특별한 능력이 없다.

actors.char.kill=%s이(가) 너를 죽였다...
actors.char.defeat=%s을(를) 처치했다.
actors.char.def_verb=회피
actors.char.invulnerable=무적
actors.char.immune=면역

###新增天赋

actors.hero.talent.aquatic_recover.title=수령 회복
actors.hero.talent.aquatic_recover.desc=_+1：_물 속에서 _10턴_마다 _1체력_ 회복。\n\n_+2：_물 속에서 _5턴_마다 _1체력_ 회복。
actors.hero.talent.aquatic_recover.comment=영웅이 장시간 레벨 업을 하지 않으면 해당 재능이 점차 회복을 중단합니다。

actors.hero.talent.pump_attack.title=차지 공격
actors.hero.talent.pump_attack.desc=_+1：_근접 공격 시 _20% 확률_로 _2배 피해_。\n\n_+2：_근접 공격 시 _20% 확률_로 _3배 피해_。
actors.hero.talent.pump_attack.comment=
actors.hero.talent.pump_attack.glog=이 일격에 강력한 힘이 실려 배수의 피해를 입혔습니다。

actors.hero.talent.ooze_attack.title=진흙 부착
actors.hero.talent.ooze_attack.desc=_+1：_근접 공격 시 _50% 확률_로 _15턴 진흙_ 효과 및 _10 지연 피해_。\n\n_+2：_근접 공격 시 _75% 확률_로 _15턴 진흙_ 효과 및 _10 지연 피해_。
actors.hero.talent.ooze_attack.comment=

actors.hero.talent.surprise_throw.title=기습 투척
actors.hero.talent.surprise_throw.desc=해당 재능을 업그레이드하면 모든 투척 무기가 수리검 특성(이동 후 투척 시 턴 소모 없음)을 가지며, 피해도 일정량 증가하지만 정확도가 _50% 감소_합니다。\n\n_+1：_투척 무기 피해 _20% 증가_。\n\n_+2：_투척 무기 피해 _40% 증가_。
actors.hero.talent.surprise_throw.comment=해당 재능은 조준 시에만 수리검 특성이 발동되며, 영능궁 등 특수 투척 무기도 수리검 특성이 적용되지만 피해가 증가하지는 않습니다。\n\n「본질은 완력 강화로, 투척 시 반동을 이용해 이동하는 것입니다。」

actors.hero.talent.smoke_mask.title=연막 엄호
actors.hero.talent.smoke_mask.desc=_+1：_자신을 중심으로 _100 단위_의 _연막 가스_를 방출하는 특수 능력을 획득합니다。\n\n_+2：_자신을 중심으로 _150 단위_의 _연막 가스_를 방출하는 특수 능력을 획득합니다。
actors.hero.talent.smoke_mask.comment=해당 재능으로 얻는 특수 능력은 _5턴 쿨다운_이 있습니다。
actors.hero.talent$smokecooldown.name=연막 엄호-쿨다운
actors.hero.talent$smokecooldown.desc=방금 이 능력을 사용했습니다. 잠시 후에 다시 사용할 수 있습니다。\n\n남은 쿨다운: %s턴
actors.hero.talent$smokemask.name=연막 엄호
actors.hero.talent$smokemask.desc=이것은 텐구가 닌자 마을에서 배운 인술로, 왜 그와의 전투에서 사용하지 못했는지는 알 수 없습니다. 아마도 암흑 마법에 침식되어 대부분의 인술을 잊어버린 탓일 것입니다. 당신은 그것에 감사해야 합니다。\n\n연막을 방출하여 자신과 아군을 엄호하며, 방출 시 턴을 소모하지 않습니다。
actors.hero.talent$smokemask.action_name=연막 엄호

actors.hero.talent.rush.title=질주 무영
actors.hero.talent.rush.desc=_+1：_이동 속도 _50% 증가_。\n\n_+2：_이동 속도 _75% 증가_。
actors.hero.talent.rush.comment=

actors.hero.talent.overload_charge.title=충전 과부하
actors.hero.talent.overload_charge.desc=_+1：_지팡이 또는 유물 충전 효과_ 동안, 영웅의 이동 속도 _50% 증가_, 근접 공격 피해 _30% 증가_。\n\n_+2：_지팡이 또는 유물 충전 효과_ 동안, 영웅의 이동 속도 _75% 증가_, 근접 공격 피해 _50% 증가_。
actors.hero.talent.overload_charge.comment=「경고! 경고!」

actors.hero.talent.gas_spurt.title=독가스 분사
actors.hero.talent.gas_spurt.desc=_+1：_지팡이 또는 완드 시전 시 대상에게 소량의 _독가스_를 발사합니다。\n\n_+2：_지팡이 또는 완드 시전 시 대상에게 소량의 _산성 가스_를 발사합니다。
actors.hero.talent.gas_spurt.comment=해당 재능은 _5턴 쿨다운_이 있습니다。\n\n「이 마법 능력은 주로 드워프 광산 탐험가들이 통제 불능의 드워프 기계를 연구한 데서 비롯되었습니다。」
actors.hero.talent$gascooldown.name=독가스 분사-쿨다운
actors.hero.talent$gascooldown.desc=방금 이 재능을 사용했습니다. 잠시 후에 다시 사용할 수 있습니다。\n\n남은 쿨다운: %s턴

actors.hero.talent.king_protect.title=왕의 가호
actors.hero.talent.king_protect.desc=_+1：_피해를 받을 때 _75% 확률_로 피해를 _지연 피해_로 전환합니다。\n\n_+2：_피해를 받을 때 _반드시_ 피해를 _지연 피해_로 전환합니다。
actors.hero.talent.king_protect.comment=

actors.hero.talent.summon_follower.title=왕권 소환
actors.hero.talent.summon_follower.desc=_+1：_갑옷 기술 사용 시 _1명의 드워프 흑마법사 또는 드워프 수도승_을 소환하여 전투를 돕습니다。\n\n_+2：_갑옷 기술 사용 시 _2명의 드워프 흑마법사 또는 드워프 수도승_을 소환하여 전투를 돕습니다。
actors.hero.talent.summon_follower.comment=

actors.hero.talent.wolfish_gaze.title=독수리 시선
actors.hero.talent.wolfish_gaze.desc=_+1：_명중률이 원래의 _4배_로 증가합니다。\n\n_+2：_공격이 _반드시_ 명중합니다。
actors.hero.talent.wolfish_gaze.comment=

actors.hero.talent.fasting.title=전자 절식
actors.hero.talent.fasting.desc=_+1：_체력이 가득_일 때, 모든 행동의 포만감 소모 _1 감소_。\n\n_+2：_체력이 _70% 이상_일 때, 모든 행동의 포만감 소모 _1 감소_。
actors.hero.talent.fasting.comment=

actors.hero.talent.strong_attack.title=강력 공격
actors.hero.talent.strong_attack.desc=_+1：_근접 공격 시 적에게 _3턴 취약_ 부여。\n\n_+2：_근접 공격 시 적에게 _5턴 취약_ 부여。
actors.hero.talent.strong_attack.comment=해당 재능은 _5턴 쿨다운_이 있습니다。\n\n「변태의 첫 번째 재능이 늑대인간 주술사의 취약 독점을 깨뜨렸습니다。」
actors.hero.talent$stratkcooldown.name=강력 공격-쿨다운
actors.hero.talent$stratkcooldown.desc=방금 이 재능을 사용했습니다. 잠시 후에 다시 사용할 수 있습니다。\n\n남은 쿨다운: %s턴

actors.hero.talent.survival_volition.title=생존 의지
actors.hero.talent.survival_volition.desc=_+1：_체력이 _30% 미만_일 때 피격 시 _50% 피해 저항, 신속, 전면 정화 5턴_ 획득。\n\n_+2：_체력이 _30% 미만_일 때 피격 시 _50% 피해 저항, 신속, 전면 정화 7턴_ 획득。
actors.hero.talent.survival_volition.comment=해당 재능은 _10턴 쿨다운_이 있습니다。\n\n「히히, 나는 반드시 살아남을 거야。」
actors.hero.talent$survolcooldown.name=생존 의지-쿨다운
actors.hero.talent$survolcooldown.desc=방금 이 재능을 사용했습니다. 잠시 후에 다시 사용할 수 있습니다。\n\n남은 쿨다운: %s턴

actors.hero.talent.trap_master.title=함정 전문가
actors.hero.talent.trap_master.desc=_+1：_함정 수정 사용 시 _66% 확률_로 자체 회수。\n\n_+2：_함정 수정 사용 시 _75% 확률_로 자체 회수。\n\n_+3：_함정 수정 사용 시 _80% 확률_로 자체 회수。
actors.hero.talent.trap_master.comment=해당 재능 업그레이드 시 _함정 수정 1개_ 추가 획득。\n\n이러한 업그레이드 또는 변태를 통해 직접 자원을 획득하는 재능은 _26회 발동 제한_(신사는 _39회_)을 공유합니다。

actors.hero.talent.strong_throw.title=강력 투척
actors.hero.talent.strong_throw.desc=_+1：_근접 무기 투척 시 적에게 _무기 단계 x2_의 피해。\n\n_+2：_근접 무기 투척 시 적에게 _무기 단계 x4_의 피해。
actors.hero.talent.strong_throw.comment=「비검 부메랑!」

actors.hero.talent.counter_attack.title=반격
actors.hero.talent.counter_attack.desc=_+1：_근접 공격을 받을 때 _20% 확률_로 _영웅 레벨 x0.5의 반격_。\n\n_+2：_근접 공격을 받을 때 _35% 확률_로 _영웅 레벨 x0.5의 반격_。\n\n_+3：_근접 공격을 받을 때 _50% 확률_로 _영웅 레벨 x0.5의 반격_。
actors.hero.talent.counter_attack.comment=

actors.hero.talent.fear_incarnation.title=공포의 화신
actors.hero.talent.fear_incarnation.desc=_+1：_공포_ 상태의 적을 공격 시 _3 추가 피해_。\n\n_+2：_공포_ 상태의 적을 공격 시 _5 추가 피해_。
actors.hero.talent.fear_incarnation.comment=「적이 주저할 때 결정타를 날려라。」

actors.hero.talent.behest.title=유지 계승
actors.hero.talent.behest.desc=_+1：_아군이 죽을 때, 영웅에게 _5턴 호르몬 폭주_ 부여。\n\n_+2：_아군이 죽을 때, 영웅에게 _10턴 호르몬 폭주_ 부여。\n\n_+3：_아군이 죽을 때, 영웅에게 _15턴 호르몬 폭주_ 부여。
actors.hero.talent.behest.comment=해당 재능은 타락, 침몰 및 영웅을 위해 목숨을 바치는 적에게는 적용되지 않습니다。

actors.hero.talent.burning_curse.title=연소 저주
actors.hero.talent.burning_curse.desc=_+1：_지팡이 또는 완드로 _연소 상태_의 적을 공격 시 _2턴 불구_ 추가 부여。\n\n_+2：_지팡이 또는 완드로 _연소 상태_의 적을 공격 시 _2턴 불구_ 및 _2턴 실명_ 추가 부여。
actors.hero.talent.burning_curse.comment=「화염 마법 제1과: 불에 대한 경외심을 가져라。」

actors.hero.talent.invisibility_shadows.title=진형 그림자
actors.hero.talent.invisibility_shadows.desc=해당 재능 업그레이드 시, 암흑 망토, 투명 물약 등으로 그림자 은신 또는 투명 상태가 되면 _분신 1개_ 생성。\n\n_+1：_해당 재능 _10턴 쿨다운_。\n\n_+2：_해당 재능 _10턴 쿨다운_。
actors.hero.talent.invisibility_shadows.comment=「암흑 군단이 아닙니다。」
actors.hero.talent$invshacooldown.name=진형 그림자-쿨다운
actors.hero.talent$invshacooldown.desc=방금 이 재능을 사용했습니다. 잠시 후에 다시 사용할 수 있습니다。\n\n남은 쿨다운: %s턴

actors.hero.talent.justice_punish.title=정의의 응징
actors.hero.talent.justice_punish.desc=_+1：_물리 공격 시 _언데드 및 악마 속성_ 적에게 _20% 추가 피해_, 처치 시 _1턴 축복_ 획득。\n\n_+2：_물리 공격 시 _언데드 및 악마 속성_ 적에게 _30% 추가 피해_, 처치 시 _2턴 축복_ 획득。
actors.hero.talent.justice_punish.comment=_언데드 속성_ 적은 유령, 저주받은 영혼, 해골, 미친 도둑, 미친 강도, 교도관, 네크로맨서, 유령 마법사, 드워프 시체, 드워프 흑마법사, 드워프 수도승, 수도승 마스터, 드워프 왕, 대마법사 티무르 및 수도승 종사를 포함합니다。\n\n_악마 속성_ 적은 모방 상자, 황금 모방 상자, 수정 모방 상자, 흑단 모방 상자, 변태 모방 상자, 부패 쥐, 끈적이, 악마 피 둥지, 서큐버스, 사악한 눈, 전갈, 산성 전갈, 고대 신 유충, 불꽃/대지/부패/녹슨/광휘/암흑의 주먹, Yog-Dzewa, 나는/첸치/코른/슬라네쉬 신도 및 대악마를 포함합니다。\n\n악마 찢개는 _언데드와 악마 속성_을 모두 가지지만 해당 재능이 두 배로 적용되지는 않습니다。\n\n「나는 지옥의 끝까지 너희를 추적할 것이다。」

actors.hero.talent.overwhelming.title=산을 넘고 바다를 가르며
actors.hero.talent.overwhelming.desc=해당 재능 업그레이드 시, 영웅은 느린 공격 속도로부터 이점을 얻습니다。\n\n_+1：_공격 소요 시간이 1턴을 초과하는 부분의 _0.33배_를 피해에, _0.5배_를 명중률에 추가。\n\n_+2：_공격 소요 시간이 1턴을 초과하는 부분의 _0.66배_를 피해에, _1배_를 명중률에 추가。\n\n_+3：_공격 소요 시간이 1턴을 초과하는 부분의 _1배_를 피해에, _1.5배_를 명중률에 추가。
actors.hero.talent.overwhelming.comment=당근 던전의 강력한 힘!

actors.hero.talent.energy_conversion.title=동력 전환
actors.hero.talent.energy_conversion.desc=_+1：_유물, 지팡이, 갑옷 기술 및 무술의 충전 속도가 _이동 속도 x0.5배_가 되며, 원래 속도보다 낮아지지 않습니다。\n\n_+2：_유물, 지팡이, 갑옷 기술 및 무술의 충전 속도가 _이동 속도 x1배_가 되며, 원래 속도보다 낮아지지 않습니다。
actors.hero.talent.energy_conversion.comment=당근 던전의 강력한 힘!

actors.hero.talent.magic_recycling.title=마력 재활용
actors.hero.talent.magic_recycling.desc=_+1：_지팡이 또는 완드 시전 시 _10% 확률_로 충전 소모 없음。\n\n_+2：_지팡이 또는 완드 시전 시 _15% 확률_로 충전 소모 없음。\n\n_+3：_지팡이 또는 완드 시전 시 _20% 확률_로 충전 소모 없음。
actors.hero.talent.magic_recycling.comment=

actors.hero.talent.precious_experience.title=소중한 경험
actors.hero.talent.precious_experience.desc=_+1：_경험치 물약 또는 신의 계시 혼합물 섭취 시 _반 레벨_ 추가 경험치。\n\n_+2：_1의 효과에 추가로 _50턴 축복_ 효과 획득。
actors.hero.talent.precious_experience.comment=「이 경험치, 매우 소중하단다。」

actors.hero.talent.disturb_attack.title=교란 타격
actors.hero.talent.disturb_attack.desc=_+1：_물리 공격 시 _10% 확률_로 _3턴 기절_。\n\n_+2：_물리 공격 시 _20% 확률_로 _3턴 기절_。
actors.hero.talent.disturb_attack.comment=「사실 무기에 환각성 액체를 바른 것입니다。」

actors.hero.talent.gholl_witchcraft.title=늑대인간 주술
actors.hero.talent.gholl_witchcraft.desc=_+1：_화살 맞음_ 상태의 적 공격 시 _2턴 혼란_ 부여。\n\n_+2：_화살 맞음_ 상태의 적 공격 시 _3턴 혼란_ 부여。
actors.hero.talent.gholl_witchcraft.comment=「인간이 늑대인간 종족이 사용하는 주술을 서투르게 재현한 것입니다。」

actors.hero.talent.engineer_refit.title=엔지니어 개장
actors.hero.talent.engineer_refit.desc=_+1：_기계류_ 적 처치 시 _12.5% 확률_로 DM-100으로 개조하여 타락시킵니다。\n\n_+2：_기계류_ 적 처치 시 _25% 확률_로 DM-100으로 개조하여 타락시킵니다。
actors.hero.talent.engineer_refit.comment=DM-400(랜덤 모드에서 DM-400이 아닌 AT-400 및 AU-400 전문화 포함)이 해당 재능을 획득하면 드론 파괴 시에도 DM-100으로 개조되어 타락할 확률이 있습니다。\n\n_기계류_ 적은 살아있는 석상, 소환 수호자, 장갑 석상, DM-100, DM-200, DM-201, 에너지 타워, DM-300, 골렘 및 황금 골렘을 포함합니다。\n\n「당신은 기계 공학을 이해합니까?」

actors.hero.talent.weird_throw.title=기이한 투척
actors.hero.talent.weird_throw.desc=_+1：_투척 무기가 아닌 무기를 적에게 던질 때 _1턴 공포_ 부여。\n\n_+2：_투척 무기가 아닌 무기를 적에게 던질 때 _2턴 공포_ 부여。
actors.hero.talent.weird_throw.comment=「상대가 어떤 물건을 던질지 모른다는 것은 확실히 무서운 일입니다。」

actors.hero.talent.thrid_hand.title=제3의 손
actors.hero.talent.thrid_hand.desc=_+1：_10% 확률_로 아이템 구매 시 골드를 소모하지 않습니다。\n\n_+2：_20% 확률_로 아이템 구매 시 골드를 소모하지 않습니다。
actors.hero.talent.thrid_hand.comment=「한 끼 정도는 슬쩍해도 되지。」
actors.hero.talent.thrid_hand.steal=당신은 주인이 눈치채지 못한 사이에 이 상품을 집어들었습니다。

actors.hero.talent.water_attack.title=수중 공격
actors.hero.talent.water_attack.desc=_+1：_영웅이 물 속에서 _1 추가 피해_。\n\n_+2：_영웅이 물 속에서 _2 추가 피해_。
actors.hero.talent.water_attack.comment=「물좀 줘, 물좀。」

actors.hero.talent.more_chance.title=더 많은 기회
actors.hero.talent.more_chance.desc=_+1：_변태 두루마리 및 변태 수정 사용 시 _10% 확률_로 소모되지 않음。\n\n_+2：_변태 두루마리 및 변태 수정 사용 시 _20% 확률_로 소모되지 않음。
actors.hero.talent.more_chance.comment=「약속해, 끝까지 가보자。」

actors.hero.talent.amazing_eyesight.title=놀라운 시력
actors.hero.talent.amazing_eyesight.desc=_+1：_3칸 이상 거리_의 적에 대한 근접 피해 _35% 증가_, 명중률 _35% 증가_。\n\n_+2：_2칸 이상 거리_의 적에 대한 근접 피해 _35% 증가_, 명중률 _35% 증가_。
actors.hero.talent.amazing_eyesight.comment=「한 치 길이가 한 치 강함이다。」

actors.hero.talent.light_application.title=경갑 활용
actors.hero.talent.light_application.desc=_+1：_기본 회피 _5-갑옷 단계_ 증가。\n\n_+2：_1의 효과에 더해, 효과 _2배_。
actors.hero.talent.light_application.comment=방어구 미착용 시 무효。\n\n「사실은 유혹술입니다。」

actors.hero.talent.heavy_application.title=중갑 활용
actors.hero.talent.heavy_application.desc=_+1：_최대 방어구 _갑옷 단계_ 증가。\n\n_+2：_1의 효과에 더해, 효과 _2배_。
actors.hero.talent.heavy_application.comment=방어구 미착용 시 무효。\n\n「단지 책 한 권을 댄 것이 아닙니다。」

actors.hero.talent.bless_meal.title=축복 성찬
actors.hero.talent.bless_meal.desc=_+1：_섭취 시 _1턴_만 소모하며, _25턴 축복_ 효과 획득。\n\n_+2：_섭취 시 _1턴_만 소모하며, _35턴 축복_ 효과 획득。
actors.hero.talent.bless_meal.comment=「주님께서 우리에게 풍족함을 주심에 감사드립니다。」

actors.hero.talent.bomb_maniac.title=폭파 광신자
actors.hero.talent.bomb_maniac.desc=_+1：_폭탄_ 피해 _25% 증가_。\n\n_+2：_폭탄_ 피해 _50% 증가_。
actors.hero.talent.bomb_maniac.comment=해당 재능 업그레이드 시 _폭탄 1개_ 추가 획득。\n\n이 재능을 업그레이드하거나 변태하여 직접 자원을 획득하는 횟수는 제한이 없습니다。\n\n「예술은 폭발이다。」

actors.hero.talent.phantom_shooter.title=환영 사수
actors.hero.talent.phantom_shooter.desc=_+1：_투척 무기 사용 시 추가로 _1개의 환영 투척 무기_를 던져 _투척 무기 피해의 10%_ 피해。\n\n_+2：_투척 무기 사용 시 추가로 _1개의 환영 투척 무기_를 던져 _투척 무기 피해의 20%_ 피해。\n\n_+3：_투척 무기 사용 시 추가로 _1개의 환영 투척 무기_를 던져 _투척 무기 피해의 30%_ 피해。
actors.hero.talent.phantom_shooter.comment=

actors.hero.talent.wake_snake.title=초원의 뱀
actors.hero.talent.wake_snake.desc=_+1：_다른 생물이 높은 풀을 밟을 때 _10% 확률_로 타락한 거대 뱀 1마리 생성。\n\n_+2：_다른 생물이 높은 풀을 밟을 때 _20% 확률_로 타락한 거대 뱀 1마리 생성。
actors.hero.talent.wake_snake.comment=「뱀 공포증의 복음。」

actors.hero.talent.collection_gold.title=골드 실드
actors.hero.talent.collection_gold.desc=_+1：_골드를 획득할 때마다 _1 보호막_ 증가。\n\n_+2：_골드를 획득할 때마다 _2 보호막_ 증가。
actors.hero.talent.collection_gold.comment=「온몸에서 돈 냄새가 난다。」

actors.hero.talent.martial_train.title=무술 훈련
actors.hero.talent.martial_train.desc=해당 재능 업그레이드 시, 영웅은 무술을 사용할 수 있으며, 재능 레벨에 따라 소량의 무술 충전 상한을 가지며, 90턴마다 무술 충전 1회복。\n\n_+1：_무술 충전 상한 _2_。\n\n_+2：_무술 충전 상한 _3_。\n\n_+3：_무술 충전 상한 _4_。
actors.hero.talent.martial_train.comment=따라서 무술을 사용할 수 있는 영웅은 무술을 사용하여 재능 _맹렬 기운 보호막_, _집중 식사_, _무기 충전_, _목숨을 건 여세_ 및 _정밀 타격_의 일반 효과(호환 효과 아님)를 발동시킬 수 있습니다。\n\n영웅이 이미 무술을 사용할 수 있는 경우, _+1/+2/+3_ 레벨에서 _1/2/3_ 무술 충전 상한만 증가합니다。\n\n「노력은 배신하지 않는다。」

actors.hero.talent.thickened_armor.title=두꺼운 갑옷
actors.hero.talent.thickened_armor.desc=_+1：_방어구 제공 _최대 방어구 +1_。\n\n_+2：_방어구 제공 _최대 방어구 +2_。
actors.hero.talent.thickened_armor.comment=방어구 미착용 시 무효。\n\n「그냥 가슴에 책 한 권 댄 것뿐입니다。」

actors.hero.talent.powerful_calculations.title=완벽한 계산
actors.hero.talent.powerful_calculations.desc=_+1：_시야 밖에서 캐릭터가 죽을 때마다 영웅이 _1 체력_ 회복。\n\n_+2：_시야 밖에서 캐릭터가 죽을 때마다 영웅이 _2 체력_ 회복。
actors.hero.talent.powerful_calculations.comment=「네 다음 말은...」

actors.hero.talent.insert_bid.title=표적 판매
actors.hero.talent.insert_bid.desc=_+1：_화살 맞음_ 상태의 적 공격 시, 명중률 _20% 증가_。\n\n_+2：_화살 맞음_ 상태의 적 공격 시, 명중률 _40% 증가_。
actors.hero.talent.insert_bid.comment=「네가 고슴도치가 되어도 내가 맞출 수 없다고 생각하냐?」

actors.hero.talent.meal_shield.title=보호막 식사
actors.hero.talent.meal_shield.desc=_+1：_섭취 시 _4 보호막_ 회복。\n\n_+2：_섭취 시 _8 보호막_ 회복。
actors.hero.talent.meal_shield.comment=「배불러。」

actors.hero.talent.drop_resistant.title=낙하 저항
actors.hero.talent.drop_resistant.desc=_+1：_영웅이 심연에 떨어진 후 _불구_ 효과를 받지 않음。\n\n_+2：_영웅이 심연에 떨어진 후 _출혈 및 불구_ 효과를 받지 않음。
actors.hero.talent.drop_resistant.comment=「검은 피부의 작은 비행기, 단 824원!」

actors.hero.talent.strength_train.title=힘 훈련
actors.hero.talent.strength_train.desc=_+1：_효과 없음。\n\n_+2：_추가 _1 힘_ 획득。
actors.hero.talent.strength_train.comment=「원펀맨 훈련법 참고。」

actors.hero.talent.treat_meal.title=치료 식사
actors.hero.talent.treat_meal.desc=_+1：_섭취 시 _3 체력_ 천천히 회복。\n\n_+2：_섭취 시 _5 체력_ 천천히 회복。
actors.hero.talent.treat_meal.comment=「영양식。」

actors.hero.talent.cover_scar.title=온몸의 상처
actors.hero.talent.cover_scar.desc=_+1：_근접 공격 시 _기본값 1의 출혈_ 추가。\n\n_+2：_근접 공격 시 _기본값 2의 출혈_ 추가。
actors.hero.talent.cover_scar.comment=「단검을 그 가슴에 깊이 꽂아라。」

actors.hero.talent.nurtritious_meal.title=십전대보
actors.hero.talent.nurtritious_meal.desc=_+1：_섭취 시 _2 체력_ 회복 및 _2 보호막_ 제공。\n\n_+2：_섭취 시 _4 체력_ 회복 및 _4 보호막_ 제공。
actors.hero.talent.nurtritious_meal.comment=「영양식을 먹고 배불렀다。」

actors.hero.talent.rage_attack.title=분노 공격
actors.hero.talent.rage_attack.desc=_+1：_영웅이 입히는 물리 피해 및 받는 피해 _10% 증가_。\n\n_+2：_영웅이 입히는 물리 피해 및 받는 피해 _20% 증가_。\n\n_+3：_영웅이 입히는 물리 피해 및 받는 피해 _30% 증가_。
actors.hero.talent.rage_attack.comment=

actors.hero.talent.military_waterskin.title=군용 물주머니
actors.hero.talent.military_waterskin.desc=_+1：_물주머니가 _15 이슬_ 추가 수집 가능。\n\n_+2：_물주머니가 _30 이슬_ 추가 수집 가능。
actors.hero.talent.military_waterskin.comment=「큰 물주머니 하나。」

actors.hero.talent.jasmine_tea.title=자스민 차
actors.hero.talent.jasmine_tea.desc=_+1：_물주머니의 이슬을 마실 때 _3턴 축복_ 획득。\n\n_+2：_물주머니의 이슬을 마실 때 _5턴 축복_ 획득。
actors.hero.talent.jasmine_tea.comment=「느낌이... 홍차만 못해。」

actors.hero.talent.god_lefthand.title=신의 왼손
actors.hero.talent.god_lefthand.desc=_+1：_재능 _신의 오른손 +1_이 있어야 발동 가능。\n\n_+2：_재능 _신의 오른손 +2_이 있어야 발동 가능。
actors.hero.talent.god_lefthand.comment=「왼 주먹은 약해。」

actors.hero.talent.god_righthand.title=신의 오른손
actors.hero.talent.god_righthand.desc=_+1：_물리 공격 피해 _30% 증가_, 재능 _신의 왼손 +1_ 필요。\n\n_+2：_물리 공격 피해 _60% 증가_, 재능 _신의 왼손 +2_ 필요。
actors.hero.talent.god_righthand.comment=「오른 주먹은 강해。」

actors.hero.talent.gold_formation.title=골드 마법진
actors.hero.talent.gold_formation.desc=_+1：_영웅이 골드를 획득할 때, 가방에 골드가 _200 이상_이면 _자동으로 200 골드 소모_하여 주변에 _1회 하급 드롭_ 발생。\n\n_+2：_영웅이 골드를 획득할 때, 가방에 골드가 _1000 이상_이면 _자동으로 1000 골드 소모_하여 주변에 _1회 중급 드롭_ 발생。\n\n_+3：_영웅이 골드를 획득할 때, 가방에 골드가 _5000 이상_이면 _자동으로 5000 골드 소모_하여 주변에 _1회 상급 드롭_ 발생。
actors.hero.talent.gold_formation.comment=

actors.hero.talent.strengthen_chain.title=강화 사슬
actors.hero.talent.strengthen_chain.desc=_+1：_공허 사슬로 적을 끌어당길 때, 적에게 _10턴 불구_ 부여。\n\n_+2：_1의 효과에 더해, 공허 사슬로 적을 끌어당길 때 _턴 소모 없음_, 사용 시 충전 소모 _1 감소_(최소 소모는 0 아래로 내려가지 않으며 사용 시 충전 요구량은 변경되지 않음)。
actors.hero.talent.strengthen_chain.comment=「이리 오너라!」

actors.hero.talent.strengthen_chalice.title=강화 성배
actors.hero.talent.strengthen_chalice.desc=_+1：_축혈 성배의 자연 체력 회복 속도 증가 효과 _50% 향상_。\n\n_+2：_축혈 성배의 자연 체력 회복 속도 증가 효과 _100% 향상_。
actors.hero.talent.strengthen_chalice.comment=「힘, 일부를 되찾았다。」

actors.hero.talent.savage_physique.title=야만적인 체력
actors.hero.talent.savage_physique.desc=_+1：_최대 체력 _10 증가_。\n\n_+2：_최대 체력 _15 증가_。
actors.hero.talent.savage_physique.comment=「그 근육을 단련하고, 그 체력을 강화하라。」

actors.hero.talent.ice_breaking.title=빙파 작전
actors.hero.talent.ice_breaking.desc=_+1：_대상이 _동상_ 상태일 때, 물리 공격 시 _1 마법 피해_ 추가。\n\n_+2：_대상이 _동상_ 상태일 때, 물리 공격 시 _2 마법 피해_ 추가。
actors.hero.talent.ice_breaking.comment=해당 재능 업그레이드 시 재능 _극한 심냉 +3_의 효과가 강화됩니다。\n\n「와! 얼음!!!」

actors.hero.talent.burning_blood.title=불타는 피
actors.hero.talent.burning_blood.desc=_+1：_적이 죽을 때, 영웅이 _1 체력_ 회복。\n\n_+2：_적이 죽을 때, 영웅이 _2 체력_ 회복。
actors.hero.talent.burning_blood.comment=「더 이상 돼지 피를 빼지 마시오!」

actors.hero.talent.strength_greatest.title=힘은 삼군을 제압
actors.hero.talent.strength_greatest.desc=_+1：_투척 무기 _1 추가 피해_, 영능궁 _0~1 추가 피해_。\n\n_+2：_투척 무기 _2 추가 피해_, 영능궁 _0~2 추가 피해_。
actors.hero.talent.strength_greatest.comment=「화살이 단단한 돌을 꿰뚫고, 힘이 삼군을 제압한다!」

actors.hero.talent.accumulate_steadily.title=천천히 쌓아 올리며
actors.hero.talent.accumulate_steadily.desc=_+1：_효과 없음。\n\n_+2：_효과 없음。\n\n_+3：_공격 거리 +1_。
actors.hero.talent.accumulate_steadily.comment=

actors.hero.talent.get_up.title=침상 옆
actors.hero.talent.get_up.desc=_+1：_수면 중 피해를 받으면 _3턴 호르몬 폭주_ 획득。\n\n_+2：_수면 중 피해를 받으면 _5턴 호르몬 폭주_ 획득。
actors.hero.talent.get_up.comment=「지금 이 순간의 평화를 방해하는 자는 용서하지 않는다!」
actors.hero.talent$nosleep.name=잠자기
actors.hero.talent$nosleep.desc=잠시 눈을 붙입니다. 방해받으면 크게 화낼 것입니다。

actors.hero.talent.more_talent.title=더 많은 재능
actors.hero.talent.more_talent.desc=_+1：_변태 두루마리 사용 시 _50% 확률_로 _선택지 1개 증가_。\n\n_+2：_변태 두루마리 사용 시 _반드시_ _선택지 1개 증가_。
actors.hero.talent.more_talent.comment=「모든 길은 로마로 통한다。」

actors.hero.talent.giant_killer.title=거인 학살자
actors.hero.talent.giant_killer.desc=_+1：_거대_ 속성의 적에게 물리 공격 시 _35% 추가 피해_。\n\n_+2：_거대_ 속성의 적에게 물리 공격 시 _70% 추가 피해_。
actors.hero.talent.giant_killer.comment=_거대_ 속성 적은 DM-200, DM-201, DM-300, 골렘, 녹슨 주먹, 황금 골렘 및 거대 엘리트 적을 포함합니다。\n\n「그들을 모두 몰아내라!」

actors.hero.talent.want_all.title=모두 내 것
actors.hero.talent.want_all.desc=_+1：_수정 보물방 및 수정 통로방 _수정 열쇠 1개_ 추가 생성。\n\n_+2：_1의 효과에 더해, 수정 선택방 _수정 열쇠 1개_ 추가 생성。
actors.hero.talent.want_all.comment=수정 보물방은 장비 2개 중 1개 선택, 수정 통로방은 소모품 6개 중 3개 선택, 수정 선택방은 장비와 소모품 중 1개 선택。\n\n「애들만 선택하지, 나는 다 가진다。」\n「해골 열쇠: 텍스트를 입력하세요。」

actors.hero.talent.vegetarianism.title=채식주의
actors.hero.talent.vegetarianism.desc=_+1：_비육류 음식 섭취 시 _450턴 포만감_ 획득, 육류 음식 섭취 시 _포만감 회복량 50% 감소_。\n\n_+2：_비육류 음식 섭취 시 _450턴 포만감_ 및 _최대 체력 5%의 체력 회복_, 육류 음식 섭취 시 _포만감 회복량 50% 감소_。
actors.hero.talent.vegetarianism.comment=소형 식량, 지하 감옥 베리, 예비 식량, 안정 팅크제, 무미 과일 및 무미 과일 조각만 육류 설명이 없으므로 이 5가지 음식만 비육류 음식으로 간주됩니다。\n\n식사 제한 도전 활성화 시, 이 재능으로 얻는 포만감 효과는 _450턴_에서 _150턴_으로 감소합니다。\n\n「만약 고기를 먹어야 한다면...」\n「나는 고기를 먹는 것이 즐겁다고 느낀 적이 없습니다...」

actors.hero.talent.word_stun.title=율령 섬광
actors.hero.talent.word_stun.desc=_+1：_두루마리를 적에게 던질 때, _2턴 마비_ 부여。\n\n_+2：_두루마리를 적에게 던질 때, _3턴 마비_ 부여。
actors.hero.talent.word_stun.comment=해당 재능은 _10턴 쿨다운_이 있습니다。\n\n「단지 종이 한 장이 아니다。」
actors.hero.talent$wordstuncooldown.name=율령 섬광-쿨다운
actors.hero.talent$wordstuncooldown.desc=방금 이 재능을 사용했습니다. 잠시 후에 다시 사용할 수 있습니다。\n\n남은 쿨다운: %s턴

actors.hero.talent.novice_benefits.title=초보자 혜택
actors.hero.talent.novice_benefits.desc=_+1：_즉시 _변태 두루마리 1장_ 획득。\n\n_+2：_즉시 _변태 두루마리 1장_ 획득。
actors.hero.talent.novice_benefits.comment=이러한 업그레이드 또는 변태를 통해 직접 자원을 획득하는 재능은 _26회 발동 제한_(신사는 _39회_)을 공유합니다。\n\n「이건 네 가챠 보증이야。」

actors.hero.talent.double_trinkets.title=장신구 이중 장착
actors.hero.talent.double_trinkets.desc=_+1：_마력 촉매 1개_ 획득。\n\n_+2：_효과 없음。\n\n_+3：_효과 없음。
actors.hero.talent.double_trinkets.comment=동일한 장신구 효과는 중첩되지 않습니다。\n\n이러한 업그레이드 또는 변태를 통해 직접 자원을 획득하는 재능은 _26회 발동 제한_(신사는 _39회_)을 공유합니다。\n\n「부품과 이끼는 함께 가질 수 없습니다. 판정은 하나만 적용되니까요。」

actors.hero.talent.fishing_time.title=빈둥거리기
actors.hero.talent.fishing_time.desc=_+1：_물고기_ 적에게 피해 _30% 증가_。\n\n_+2：_1의 효과에 더해, _환영 피라냐의 순간 이동을 막고_, 물고기 방에서 _거대 피라냐 1마리 추가 생성_, 생성된 거대 피라냐는 부정적 재능 _육지 수영_의 영향을 받습니다。
actors.hero.talent.fishing_time.comment=_물고기_ 적은 거대 피라냐, 환영 피라냐, 거대 육지 피라냐 및 환영 육지 피라냐를 포함합니다。\n\n「이것은 빈둥거릴 때 생각해낸 재능입니다。」

actors.hero.talent.posion_dagger.title=맹독 단검
actors.hero.talent.posion_dagger.desc=_+1：_단검류_ 무기 공격 시 _2턴 중독_ 추가。\n\n_+2：_단검류_ 무기 공격 시 _4턴 중독_ 추가。
actors.hero.talent.posion_dagger.comment=_단검류_ 무기는 도적의 단검, 긴 단검, 암살의 검 및 독실한 신자의 의식용 단검을 포함합니다。\n\n「내 이 칼은 맹독을 바른 맹독검이란 말이야...」

actors.hero.talent.invincible_meal.title=무적 식사
actors.hero.talent.invincible_meal.desc=_+1：_섭취 시 _1턴 무적_ 획득。\n\n_+2：_섭취 시 _2턴 무적_ 획득。\n\n_+3：_섭취 시 _3턴 무적_ 획득。
actors.hero.talent.invincible_meal.comment=이 재능은 재능 _경험치 식사_, _구름 식사_ 및 _생일 선물_과 _100회 발동 제한_을 공유합니다。

actors.hero.talent.wellfed_meal.title=풍성한 식사
actors.hero.talent.wellfed_meal.desc=_+1：_영웅이 _포만_ 상태일 때, 적에게 _전체 피해 5% 증가_, _10% 피해 감소_ 획득。\n\n_+2：_영웅이 _포만_ 상태일 때, 적에게 _전체 피해 10% 증가_, _20% 피해 감소_ 획득。\n\n_+3：_영웅이 _포만_ 상태일 때, 적에게 _전체 피해 15% 증가_, _30% 피해 감소_ 획득。
actors.hero.talent.wellfed_meal.comment=

actors.hero.talent.shock_bomb.title=충격 폭발
actors.hero.talent.shock_bomb.desc=_+1：_폭탄 폭발 시 주변 9칸의 생물에게 _1턴 마비_。\n\n_+2：_폭탄 폭발 시 주변 9칸의 생물에게 _2턴 마비_。
actors.hero.talent.shock_bomb.comment=해당 재능 업그레이드 시 _폭탄 1개_ 추가 획득。\n\n이 재능을 업그레이드하거나 변태하여 직접 자원을 획득하는 횟수는 제한이 없습니다。\n\n「섬광탄。」

actors.hero.talent.illusion_feed.title=그림의 떡
actors.hero.talent.illusion_feed.desc=_+1：_즉시 _파이 1개_ 획득。\n\n_+2：_즉시 _파이 1개_ 획득。
actors.hero.talent.illusion_feed.comment=이러한 업그레이드 또는 변태를 통해 직접 자원을 획득하는 재능은 _26회 발동 제한_(신사는 _39회_)을 공유합니다。\n\n「당신은 마량의 붓을 가졌습니다。」

actors.hero.talent.heavy_burden.title=무거운 짐
actors.hero.talent.heavy_burden.desc=_+1：_게임 점수 x2_。\n\n_+2：_게임 점수 x3_。
actors.hero.talent.heavy_burden.comment=「점수 분야의 신。」

actors.hero.talent.attack_door.title=문 앞에서 무기 휘두르기
actors.hero.talent.attack_door.desc=_+1：_적이 열린 문 타일에 있을 때, 물리 공격 _1 추가 피해_。\n\n_+2：_적이 열린 문 타일에 있을 때, 물리 공격 _2 추가 피해_。
actors.hero.talent.attack_door.comment=「여기 조니다!」

actors.hero.talent.arrow_penetration.title=화살은 단단한 돌을 꿰뚫고
actors.hero.talent.arrow_penetration.desc=_+1：_모든 투척 무기가 _벽 관통_ 효과를 가지며, _8칸 거리 제한_。\n\n_+2：_모든 투척 무기가 _벽 관통_ 효과를 가지며, _12칸 거리 제한_。
actors.hero.talent.arrow_penetration.comment=영능궁 등 특수 투척 무기를 가진 영웅이 이 재능을 획득하면 특수 투척 무기도 이 재능의 효과를 받습니다。\n\n「비록 늙었으나, 화살은 여전히 날카롭다!」

actors.hero.talent.detox_damage.title=고통을 통한 해독
actors.hero.talent.detox_damage.desc=_+1：_피격 시 _25% 확률_로 _1턴 전면 정화 효과_ 획득, 전면 정화 효과 획득 후 _15% 확률_로 모든 약화 효과 제거。\n\n_+2：_피격 시 _50% 확률_로 _1턴 전면 정화 효과_ 획득, 전면 정화 효과 획득 후 _15% 확률_로 모든 약화 효과 제거。\n\n_+3：_피격 시 _75% 확률_로 _1턴 전면 정화 효과_ 획득, 전면 정화 효과 획득 후 _15% 확률_로 모든 약화 효과 제거。
actors.hero.talent.detox_damage.comment=

actors.hero.talent.returning_honor.title=영예를 안고 귀환
actors.hero.talent.returning_honor.desc=_+1：_적 사망 시 제공하는 경험치 _25% 증가_。\n\n_+2：_적 사망 시 제공하는 경험치 _50% 증가_。\n\n_+3：_적 사망 시 제공하는 경험치 _75% 증가_。
actors.hero.talent.returning_honor.comment=

actors.hero.talent.zhuojun_butcher.title=작군 푸줏간
actors.hero.talent.zhuojun_butcher.desc=_+1：_생물류_ 적 처치 시 _10% 확률_로 _신비한 고기 1개_ 추가 획득。\n\n_+2：_생물류_ 적 처치 시 _20% 확률_로 _신비한 고기 1개_ 추가 획득。
actors.hero.talent.zhuojun_butcher.comment=이 재능의 드롭은 영웅 레벨 제한의 영향을 받습니다。\n\n_생물류_ 적은 거대 피라냐, 환영 피라냐, 거대 육지 피라냐, 환영 육지 피라냐, 황금 벌, 설치류 쥐, 백화 쥐, 하수도 거대 뱀, 늑대인간 순찰, 하수도 게, 파리 떼, 슬라임, 흡혈 박쥐, 늑대인간 폭도, 중갑 폭도, 늑대인간 주술사 및 광산 거미 등 _속성이 없는_ 적만 포함합니다。\n\n「슬라임이 왜 고기를 떨어뜨리지?」\n「소화되지 않은 모험가일지도。」

actors.hero.talent.aid_stomach.title=위산의 위장
actors.hero.talent.aid_stomach.desc=_+1：_신비한 고기 섭취 시 _부정적 효과 없음_。\n\n_+2：_1의 효과에 더해, 신비한 고기 섭취 시 _33% 포만감_ 추가 회복。
actors.hero.talent.aid_stomach.comment=「피를 마시고 살을 씹어 먹어라。」

actors.hero.talent.weapon_make.title=무기 제작
actors.hero.talent.weapon_make.desc=_+1：_즉시 _제3지역에서 획득 가능한 무기 1개_ 획득。\n\n_+2：_즉시 _제4지역에서 획득 가능한 무기 1개_ 획득。\n\n_+3：_즉시 _제5지역에서 획득 가능한 무기 1개_ 획득。
actors.hero.talent.weapon_make.comment=이 재능으로 획득한 무기는 _즉시 감정되며 -2 힘 요구량_을 가집니다。이러한 업그레이드 또는 변태를 통해 직접 자원을 획득하는 재능은 _26회 발동 제한_(신사는 _39회_)을 공유합니다。

actors.hero.talent.secret_stash.title=비상금
actors.hero.talent.secret_stash.desc=_+1：_즉시 _1000 골드_ 획득。\n\n_+2：_즉시 _1000 골드_ 획득。\n\n_+3：_즉시 _1000 골드_ 획득。
actors.hero.talent.secret_stash.comment=이러한 업그레이드 또는 변태를 통해 직접 자원을 획득하는 재능은 _26회 발동 제한_(신사는 _39회_)을 공유합니다。

actors.hero.talent.earth_meal.title=대지의 식사
actors.hero.talent.earth_meal.desc=_+1：_섭취 시 매 턴 감소하는 _0~영웅 레벨 67%의 나무 껍질_ 획득。\n\n_+2：_섭취 시 매 턴 감소하는 _0~영웅 레벨 133%의 나무 껍질_ 획득。\n\n_+3：_섭취 시 매 턴 감소하는 _0~영웅 레벨 200%의 나무 껍질_ 획득。
actors.hero.talent.earth_meal.comment=

actors.hero.talent.eaten_slowly.title=천천히 씹어 먹기
actors.hero.talent.eaten_slowly.desc=_+1：_섭취 시 _10턴 추가 소모_, 음식 포만감 회복량 _30% 증가_。\n\n_+2：_섭취 시 _10턴 추가 소모_, 음식 포만감 회복량 _60% 증가_, 파이 섭취 시 _450턴 포만감_ 추가 획득。
actors.hero.talent.eaten_slowly.comment=이 재능은 풍요의 뿔에는 적용되지 않으며, 이 재능의 섭취 턴 연장은 모든 섭취 턴 단축 재능보다 우선 적용됩니다。\n\n식사 제한 도전 활성화 시, 이 재능으로 얻는 포만감 효과는 _450턴_에서 _150턴_으로 감소합니다。\n\n「식전의 번거로운 예절일 뿐。」

actors.hero.talent.invincible.title=무적
actors.hero.talent.invincible.desc=_+1：_적이 죽을 때, 영웅이 _2턴 호르몬 폭주_ 획득。\n\n_+2：_적이 죽을 때, 영웅이 _4턴 호르몬 폭주_ 획득。
actors.hero.talent.invincible.comment=「싸우면 싸울수록 강해진다。」

actors.hero.talent.yog_larva.title=유충 소환
actors.hero.talent.yog_larva.desc=_+1：_5 이상의 단일 피해를 받을 때 _고대 신 유충 1마리_ 소환하여 전투。\n\n_+2：_5 이상의 단일 피해를 받을 때 _고대 신 유충 2마리_ 소환하여 전투。\n\n_+3：_2의 효과에 더해, 고대 신 유충이 _50% 확률_로 엘리트화。
actors.hero.talent.yog_larva.comment=

actors.hero.talent.yog_fist.title=거대 주먹의 힘
actors.hero.talent.yog_fist.desc=해당 재능 업그레이드 시, 유물 사용 시 거대 주먹의 힘을 얻으며, 효과는 _5턴 지속_, _10턴 쿨다운_。\n\n_+1：_광휘와 암흑 주먹의 힘 획득, _40턴 발광_, 물리 공격 시 _5턴 실명_。\n\n_+2：_1의 효과에 더해, 불꽃 주먹의 힘 획득, _10턴 화염의 힘_。\n\n_+3：_1과 2의 효과에 더해, 대지 주먹의 힘 획득, 매 턴 감소하는 _0~영웅 레벨 50%의 나무 껍질_, 물리 공격 시 _5턴 속박_。
actors.hero.talent.yog_fist.comment=
actors.hero.talent$yogfistcooldown.name=거대 주먹의 힘-쿨다운
actors.hero.talent$yogfistcooldown.desc=방금 이 재능을 사용했습니다. 잠시 후에 다시 사용할 수 있습니다。\n\n남은 쿨다운: %s턴
actors.hero.talent$yogfistpower.name=거대 주먹의 힘
actors.hero.talent$yogfistpower.desc=당신은 잠시 동안 고대 신의 주먹 힘을 발휘할 수 있습니다。\n\n남은 시간: %s턴

actors.hero.talent.yog_ray.title=데스 레이
actors.hero.talent.yog_ray.desc=해당 재능 업그레이드 시, 지팡이로 대상에게 시전하면 데스 레이가 발사되며, _10턴 쿨다운_。\n\n_+1：_1발의 _10~60 피해_ 데스 레이 발사。\n\n_+2：_단일 대상 시전 시 최대 주변에 3발의 _10~70 피해_ 데스 레이 발사。\n\n_+3：_단일 대상 시전 시 최대 주변에 5발의 _10~80 피해_ 데스 레이 발사。
actors.hero.talent.yog_ray.comment=「드워프 왕은 어릴 적 이 에피소드를 보고 언데드 숭배를 깨우쳤다。」
actors.hero.talent$yograycooldown.name=데스 레이-쿨다운
actors.hero.talent$yograycooldown.desc=방금 이 재능을 사용했습니다. 잠시 후에 다시 사용할 수 있습니다。\n\n남은 쿨다운: %s턴

actors.hero.talent.afraid_death.title=도망치기
actors.hero.talent.afraid_death.desc=_+1：_체력이 _30% 미만_일 때, _이동 속도 30% 증가_, _물리 피해 50% 감소_。\n\n_+2：_체력이 _30% 미만_일 때, _이동 속도 40% 증가_, _물리 피해 40% 감소_。\n\n_+3：_체력이 _30% 미만_일 때, _이동 속도 50% 증가_, _물리 피해 30% 감소_。
actors.hero.talent.afraid_death.comment=

actors.hero.talent.pyromaniac.title=방화광
actors.hero.talent.pyromaniac.desc=_+1：_용의 불꽃 혼합물 3병_ 획득。\n\n_+2：_지옥불 마약 2병_ 획득。\n\n_+3：_용혈 비약 1병_ 획득。
actors.hero.talent.pyromaniac.comment=이러한 업그레이드 또는 변태를 통해 직접 자원을 획득하는 재능은 _26회 발동 제한_(신사는 _39회_)을 공유합니다。

actors.hero.talent.reverse_polarity.title=자비로운 하늘
actors.hero.talent.reverse_polarity.desc=해당 재능 업그레이드 시, 현재 체력이 적절히 조정됩니다。\n\n_+1：_현재 체력이 _1_로 조정됩니다。\n\n_+2：_현재 체력이 _최대 체력의 50%_로 조정됩니다。\n\n_+3：_현재 체력이 _최대 체력의 100%_로 조정됩니다。
actors.hero.talent.reverse_polarity.comment=「그 표정은 뭐야, 그 눈물은 뭐야, 네 눈물이 지구를 구할 수 있다고 생각해?」

actors.hero.talent.hero_name.title=영웅의 이름
actors.hero.talent.hero_name.desc=_+1：_레벨 업 시 _최대 체력 20%의 체력_ 추가 회복。\n\n_+2：_레벨 업 시 _최대 체력 40%의 체력_ 추가 회복。\n\n_+3：_레벨 업 시 _최대 체력 60%의 체력_ 추가 회복。
actors.hero.talent.hero_name.comment=

actors.hero.talent.sky_earth.title=천지의 힘
actors.hero.talent.sky_earth.desc=_+1：_영웅이 _부유, 속박 또는 식물 갑옷_ 상태일 때, 피해 _15% 증가_。\n\n_+2：_영웅이 _부유, 속박 또는 식물 갑옷_ 상태일 때, 피해 _30% 증가_。\n\n_+3：_영웅이 _부유, 속박 또는 식물 갑옷_ 상태일 때, 피해 _45% 증가_。
actors.hero.talent.sky_earth.comment=파수꾼이 지속 뿌리를 밟으면 식물 갑옷 효과 대신 나무 껍질 효과를 얻으므로 이 재능의 영향을 받지 않습니다。\n\n「하늘을 찌르는 분노에 산하가 갈라지고, 땅을 치는 일격에 하늘이 무너진다。」

actors.hero.talent.water_isfood.title=물로 배 채우기
actors.hero.talent.water_isfood.desc=_+1：_물약 섭취 시 _30 포만감_ 회복。\n\n_+2：_1의 효과에 더해, 물주머니의 이슬을 마실 때 _소모 이슬 양의 10배 포만감_ 회복。\n\n_+3：_1과 2의 효과에 더해, _섭취 효과를 발동_할 수 있습니다。
actors.hero.talent.water_isfood.comment=

actors.hero.talent.delicious_flying.title=맛있어서 날아감
actors.hero.talent.delicious_flying.desc=_+1：_섭취 시 _15턴 부유_ 획득。\n\n_+2：_섭취 시 _25턴 부유_ 획득。
actors.hero.talent.delicious_flying.comment=「밥 먹으면 날게 해줄게!」

actors.hero.talent.angel_stance.title=천사의 자세
actors.hero.talent.angel_stance.desc=_+1：_영웅이 _발광_ 상태일 때, 공격받으면 공격자에게 _30% 마법 반격_。\n\n_+2：_영웅이 _발광_ 상태일 때, 공격받으면 공격자에게 _40% 마법 반격_。\n\n_+3：_영웅이 _발광_ 상태일 때, 공격받으면 공격자에게 _50% 마법 반격_。
actors.hero.talent.angel_stance.comment=

actors.hero.talent.thorny_rose.title=가시 장미
actors.hero.talent.thorny_rose.desc=_+1：_영웅이 피격 시 공격자에게 _기본값 1의 출혈_ 부여。\n\n_+2：_1의 효과에 더해, 영웅이 피격 시 공격자에게 _1 피해_ 추가。
actors.hero.talent.thorny_rose.comment=「그녀는 아직도 너에게 답장하지 않았니?」

actors.hero.talent.hometown_cloud.title=고향의 구름
actors.hero.talent.hometown_cloud.desc=_+1：_귀환 시 이동 속도 _20% 증가_。\n\n_+2：_귀환 시 이동 속도 _40% 증가_。\n\n_+3：_귀환 시 이동 속도 _60% 증가_。
actors.hero.talent.hometown_cloud.comment=영웅의 가방에 Yendor 부적이 있으면 발동됩니다。

actors.hero.talent.deep_freeze.title=극한 심냉
actors.hero.talent.deep_freeze.desc=_+1：_서리 마법 부여가 있는 무기 피해 _20% 증가_。\n\n_+2：_1의 효과에 더해, 물리 공격 시 _3턴 동상_ 효과 부여 가능。\n\n_+3：_1과 2의 효과에 더해, _동상 또는 빙결_ 상태의 적에게 피해 _20% 증가_; 재능 _빙파 작전_을 보유하고 업그레이드했다면, 피해가 추가로 _50% 증가_。
actors.hero.talent.deep_freeze.comment=

actors.hero.talent.frenzied_attack.title=도우 천천히
actors.hero.talent.frenzied_attack.desc=_+1：_물리 공격 시 _25% 확률_로 _2턴 광란_。\n\n_+2：_물리 공격 시 _50% 확률_로 _2턴 광란_。
actors.hero.talent.frenzied_attack.comment=「도우를 휩쓸고, 진정한 나로 돌아가자。」

actors.hero.talent.wulei_zhengfa.title=오뢰 정법
actors.hero.talent.wulei_zhengfa.desc=_+1：_번개 지팡이 1개_ 획득, 영웅은 더 이상 번개 지팡이의 감전 피해를 받지 않고 _감전 피해의 20%만큼 체력 회복_。\n\n_+2：_1의 효과에 더해(자원 획득 제외), 번개 지팡이 시전 피해 _30% 증가_。
actors.hero.talent.wulei_zhengfa.comment=이러한 업그레이드 또는 변태를 통해 직접 자원을 획득하는 재능은 _26회 발동 제한_(신사는 _39회_)을 공유합니다。\n\n「전류를 높여라。」

actors.hero.talent.magic_girl.title=마법 소녀
actors.hero.talent.magic_girl.desc=_+1：_두루마리 사용 시 _30턴 위장_ 효과 획득, 위장 효과 중 _20% 지팡이 피해 증가_。\n\n_+2：_두루마리 사용 시 _45턴 위장_ 및 _10턴 발광_ 효과 획득, 위장 효과 중 _40% 지팡이 피해 증가_。
actors.hero.talent.magic_girl.comment=이 재능은 무질서 마법서를 읽어도 발동됩니다。\n\n「변신! 미소녀 '전사'!」

actors.hero.talent.wide_knowledge.title=해박한 지식
actors.hero.talent.wide_knowledge.desc=_+1：_아이템 획득 시 _즉시 저주 여부_ 확인。\n\n_+2：_아이템 획득 시 _즉시 감정_。\n\n_+3：_2의 효과에 더해, 획득한 아이템이 감정될 때 _3턴 지팡이 충전_ 획득。
actors.hero.talent.wide_knowledge.comment=

actors.hero.talent.gold_meal.title=밥 속의 금
actors.hero.talent.gold_meal.desc=_+1：_섭취 시 _25 골드_ 획득。\n\n_+2：_섭취 시 _35 골드_ 획득。
actors.hero.talent.gold_meal.comment=「네 이 음식은 겉이 금으로 됐니, 속이 금으로 됐니?」

actors.hero.talent.no_viewrape.title=관음하지 마세요
actors.hero.talent.no_viewrape.desc=_+1：_원거리 피해를 받을 때, 공격자에게 _1턴 실명_。\n\n_+2：_원거리 피해를 받을 때, 공격자에게 _2턴 실명_。\n\n_+3：_원거리 피해를 받을 때, 공격자에게 _3턴 실명_。
actors.hero.talent.no_viewrape.comment=「보라색 치마를 입은 드워프와 두꺼운 화장을 한 늑대인간은 누구야!?」

actors.hero.talent.water_ghost.title=물귀신
actors.hero.talent.water_ghost.desc=_+1：_적이 물 속에서 죽을 때, _20% 확률_로 유령 1마리 생성 및 _5턴 광란_ 획득。\n\n_+2：_적이 물 속에서 죽을 때, _20% 확률_로 타락한 유령 1마리 생성。
actors.hero.talent.water_ghost.comment=「시체 먼지의 물 탄 버전。」

actors.hero.talent.ash_ledger.title=잿빛 장부
actors.hero.talent.ash_ledger.desc=_+1：_적이 죽을 때, 영웅이 _2 보호막_ 획득。\n\n_+2：_적이 죽을 때, 영웅이 _4 보호막_ 획득。
actors.hero.talent.ash_ledger.comment=「혼을 빼앗는다。」

actors.hero.talent.secret_lighting.title=조명의 비밀
actors.hero.talent.secret_lighting.desc=_+1：_두루마리 읽기 시 _20턴 발광_ 획득。\n\n_+2：_두루마리 읽기 시 _40턴 발광_ 획득。
actors.hero.talent.secret_lighting.comment=이 재능은 무질서 마법서를 읽어도 발동됩니다。\n\n「악! 내 눈!」

actors.hero.talent.potential_1.title=잠재력 폭발
actors.hero.talent.potential_1.desc=_+1：_변태 두루마리 1장_ 획득。\n\n_+2：_효과 없음。
actors.hero.talent.potential_1.comment=이러한 업그레이드 또는 변태를 통해 직접 자원을 획득하는 재능은 _26회 발동 제한_(신사는 _39회_)을 공유합니다。

