actors.hero.talent.energy_absorption.comment=该талант的эффект判定在один切减伤之后。
actors.hero.talent.energy_absorption.meta_desc=_如果这个талант被其它геройполучает_，那么它会在+1时使герой至多承受макс. HP30%的урон，+2时使герой至多承受макс. HP20%的урон。
actors.hero.talent.slime_greenhouse.title=粘液温室
actors.hero.talent.slime_greenhouse.desc=_+1：_种子在девушка-слизь的体内发芽将_不再потребляетходов_。\n\n

_+2：_在+1的基础上，种子发芽能够восстановление_30сытость_。
actors.hero.talent.slime_greenhouse.comment=开启荒芜之地挑战后，升级该талант会使种子在体内发芽所需的ходов数从20_снижено至15_。
actors.hero.talent.slime_greenhouse.meta_desc=_如果这个талант被其它геройполучает_，那么它会在+1时允许герой食用种子以восстановление30сытость，+2时则在+1的基础上能够触发种子对应的植被эффект。

actors.hero.talent.original_monster.title=原生魔物
actors.hero.talent.original_monster.desc=_+1：_девушка-слизьполучает_草药疗养_эффект后提供的治疗量дополнительно_увеличено50%_。\n\n

