actors.hero.talent.water_regeneration.comment=
actors.hero.talent$slimemucuscooldown.name=粘液分裂
actors.hero.talent$slimemucuscooldown.desc=水灵史莱姆刚刚才分裂了一块史莱姆粘液，现在需要过一段时间才能够再次分裂粘液。此外，其在受到攻击时能够加快粘液的分裂。\n\n水灵史莱姆需要再过%s回合才能够分裂下一块粘液。
actors.mobs.npcs.slimemucus.name=史莱姆粘液
actors.mobs.npcs.slimemucus.desc=史莱姆粘液是从вода灵史莱姆体内分裂出去的один块粘液，在落地之后会吸附粘液下方的微биологический并膨胀，以被вода灵史莱姆吸收后восстановление更多的HP。当然，也可以被враг的атака摧毁。\n\n史莱姆粘液拥有10点HP，每ходов会失去1点。вода灵史莱姆可以在史莱姆粘液周围8格通过点击史莱姆粘液来将其吸收。吸收过程不会потребляетходов。\n\n史莱姆粘液会继承вода灵史莱姆один半的броня。
actors.mobs.npcs.slimemucus.absorb_title=史莱姆粘液
actors.mobs.npcs.slimemucus.absorb_body=这是从你身上分裂出去的один部分粘液，它看起来已经吸附了周围不少的养分。\n\n是否要吸收这块粘液？这能够восстановление你的жизнь。
actors.mobs.npcs.slimemucus.absorb_confirm=吸收
actors.mobs.npcs.slimemucus.absorb_cancel=取消
actors.mobs.npcs.slimemucus.discover_hint=你可通过某个герой专精的职业发现该单位。

actors.hero.herosubclass.darkslime=暗液史莱姆
actors.hero.herosubclass.darkslime_short_desc=_暗液史莱姆_会失去部分最大生命值，但可以免疫淤泥的腐蚀并向敌人溅射淤泥，同时还能够释放暗液钩爪。
actors.hero.herosubclass.darkslime_desc=暗液史莱姆吸收了地牢中邪恶的养分并获得黑暗的力量，这使她的最大生命值减少20%，但也使她免疫腐蚀淤泥。\n\n暗液史莱姆在攻击目标时有50%概率给予目标20回合的腐蚀淤泥效果，而在受到伤害时也会有15%的概率给予攻击者20回合的腐蚀淤泥效果(这一概率在受到远程攻击时翻倍)。\n\n暗液史莱姆每隔65回合便可释放一次暗液钩爪，可将视野内的一名敌人拉至身边并给予其3回合的缠绕效果。\n\n该专精在无需等待钩爪恢复时拥有一项特殊能力，同时拥有多项特殊能力时可长按快捷功能切换特殊能力。
actors.buffs.darkhook.name=Темно-жидкостный крючковый коготь
actors.buffs.darkhook.desc=Пришло время выбрать свою любимую добычу.\ n\ nКоготь темного крюка можно развязывать каждые 65 ходов, чтобы привлечь врага в поле зрения на свою сторону и запутать его на 3 хода.\ n\ nЭта способность ограничена 12 раундами.
actors.hero.talent$darkhookcooldown.name=钩爪恢复
actors.hero.talent$darkhookcooldown.desc=暗液史莱姆刚刚才释放了一次暗液钩爪，大力拉拽目标消耗了她不少体力，因此需要一段时间进行恢复。\n\n这一能力的恢复还需要%s回合。
actors.buffs.darkhook.cant_pull=Невозможно вытащить цель.
actors.buffs.darkhook.does_nothing=Это расстояние уже нельзя приблизить.
actors.buffs.darkhook.more_distance=Расстояние слишком далеко.
actors.hero.talent.potent_ooze.title=强效淤泥
actors.hero.talent.potent_ooze.desc=升级该талант后，角色站在вода中不再会直接清除腐蚀淤泥，而是因此дополнительноуменьшено持续时间。\n\n_+1：_在вода中时，_腐蚀淤泥_эффектдополнительноуменьшено_3ходов_。\n\n_+2：_在вода中时，_腐蚀淤泥_эффектдополнительноуменьшено_2ходов_。\n\n_+3：_在вода中时，_腐蚀淤泥_эффектдополнительноуменьшено_1ходов_。
actors.hero.talent.potent_ooze.comment=
actors.hero.talent.dark_gas.title=暗气释放
actors.hero.talent.dark_gas.desc=_+1：_暗液史莱姆受到攻击后会有_20%概率_释放少量_毒气气体_并获得_4回合净化屏障_效果。\n\n_+2：_暗液史莱姆受到攻击后会有_20%概率_释放少量_毒气或酸蚀气体_并获得_4回合净化屏障_效果。\n\n_+3：_暗液史莱姆受到攻击后会有_20%概率_释放少量_毒气、酸蚀或腐臭气体_并获得_4回合净化屏障_效果。
actors.hero.talent.dark_gas.comment=该天赋的三种气体都是单独有概率释放而非一次全部释放。
actors.hero.talent.dark_liquid.title=暗液缠身
actors.hero.talent.dark_liquid.desc=_+1：_暗液史莱姆使用暗液钩爪会额外给予目标_2回合缠绕_效果，总计5回合。\n\n_+2：_在+1的基础上，额外给予目标_20回合腐蚀淤泥_效果。\n\n_+3：_在+1和+2的基础上，在_缠绕状态_下死亡的敌人会为暗液史莱姆提供_8回合法杖充能和5回合神器充能_，同时还会_重置暗液钩爪的冷却时间_。
actors.hero.talent.dark_liquid.comment=该天赋在+3等级时将敌人拉下深渊不会重置暗液钩爪的冷却时间。

actors.hero.heroclass.slimegirl=Слизь мама
actors.hero.heroclass.slimegirl_desc_short=Slime Mama изначально носит IT000, который не может быть удален, но будет продолжать расти, в то же время имея возможность IT001.
actors.hero.heroclass.slimegirl_desc=Slime Maiden изначально носит IT000, доспехи слизи не могут быть удалены, но будут получать дополнительные уровни или даже шаги по мере повышения уровня Slime Maiden.\ n\ nSlime Maiden обладает меньшей силой, но имеет более высокий начальный срок службы и рост, а также может использовать IT001, который обычно занимает 1 ход.\ n\ nВ то же время Slime Maiden первоначально несет IT002, IT003, мешки с водой и бархатные мешки.\ n\ nSlime Maiden, как монстр, не обладает большими человеческими знаниями, поэтому единственными предметами, идентифицированными в начале, являются:\ nIT004 Свиток трансформации и Свиток идентификации
actors.hero.heroclass.slimegirl_unlock=_在一场游戏中击败粘咕_以解锁史莱姆娘。

actors.hero.abilities.slime.madslime.name=Дневник Берсерка
actors.hero.abilities.slime.madslime.self_target=Невозможно выбрать самостоятельно.
actors.hero.abilities.slime.madslime.no_target=Нет целей для поглощения.
actors.hero.abilities.slime.madslime.more_distance=Цель слишком далеко.
actors.hero.abilities.slime.madslime.strong_target=Вы не можете поглотить эту цель.
actors.hero.abilities.slime.madslime.eat=Цель вкусная, и вы чувствуете себя сильным.
actors.hero.abilities.slime.madslime.eat1=Вы чувствуете, как рана медленно заживает.
actors.hero.abilities.slime.madslime.eat2=Вы чувствуете, что у вас есть барьер, защищающий вас.
actors.hero.abilities.slime.madslime.short_desc=Слизняк понимает IT000, и ее бесконечного аппетита к еде достаточно, чтобы съесть одного из соседних врагов.
actors.hero.abilities.slime.madslime.desc=Слизняк полон аппетита, что позволяет ей пожирать одного из соседних врагов, чтобы вернуть сытость. Пожираемые враги получают много урона и погибают напрямую.\ n\ nСлизневая дева не может пожирать боссов, второстепенных боссов, элит и союзников.\ n\ nВосстановление базовой сытости: IT000 (влияет на сокращение диеты)
actors.hero.talent.no_pick.title=饥不择食
actors.hero.talent.no_pick.desc=_+1：_吞噬врагвосстановление的сытость_увеличено20%_。\n\n

_+2：_吞噬врагвосстановление的сытость_увеличено40%_。\n\n

_+3：_吞噬врагвосстановление的сытость_увеличено60%_。\n\n

_+4：_吞噬врагвосстановление的сытость_увеличено80%_。
actors.hero.talent.no_pick.comment=
actors.hero.talent.food_bonus.title=血色本性
actors.hero.talent.food_bonus.desc=_+1：_吞噬враг_能够触发进食特效_。\n\n

_+2：_在+1的基础上，吞噬враг后会以自身为中心появление_5x5область的决斗区域_。\n\n

_+3：_在+1和+2的基础上，吞噬враг后会получает_已损失HP25%的治疗_эффект。\n\n

_+4：_在+1，+2和+3的基础上，吞噬враг后会получает_макс. HP20%的щит_。
actors.hero.talent.food_bonus.comment=
actors.hero.talent.delicious_digestion.title=大快朵颐
actors.hero.talent.delicious_digestion.desc=_+1：_史莱姆娘在100%护甲充能使用狂史日记时，充能消耗_减少16%_。\n\n_+2：_史莱姆娘在100%护甲充能使用狂史日记时，充能消耗_减少30%_。\n\n_+3：_史莱姆娘在100%护甲充能使用狂史日记时，充能消耗_减少40%_。\n\n_+4：_史莱姆娘在100%护甲充能使用狂史日记时，充能消耗_减少50%_。
actors.hero.talent.delicious_digestion.comment=

actors.hero.abilities.slime.rapidwaterfall.name=Турбулентный водопад
actors.hero.abilities.slime.rapidwaterfall.short_desc=Slime Maiden отливает IT000, чтобы прилегающая территория была заполнена испаряющимся водяным паром, который может превратить прилегающую территорию в бассейн и повредить все ловушки.
actors.hero.abilities.slime.rapidwaterfall.desc=Slime Maiden способна генерировать испаряющийся водяной пар вокруг себя, превращая окружающую территорию в бассейн.\ n\ nОснова водяного пара: IT000
actors.hero.abilities.slime.rapidwaterfall$rapidwater.name=Турбулентный водопад
actors.hero.abilities.slime.rapidwaterfall$rapidwater.desc=Испарение водяного пара может превратить окружающую территорию в бассейн, а также повредить все ловушки.
actors.hero.talent.violent_storm.title=暴风骤雨
actors.hero.talent.violent_storm.desc=_+1：_生成的испаряющаяся вода气体单位_увеличено25%_。\n\n

_+2：_生成的испаряющаяся вода气体单位_увеличено50%_。\n\n

_+3：_生成的испаряющаяся вода气体单位_увеличено75%_。\n\n

_+4：_生成的испаряющаяся вода气体单位_увеличено100%_。
actors.hero.talent.violent_storm.comment=
actors.hero.talent.new_trap.title=浮底出新
actors.hero.talent.new_trap.desc=_+1：_使用Стремительный поток生成的испаряющаяся вода将陷阱损毁时，有_20%вероятностьпоявление1个кристалл-ловушка_。\n\n

_+2：_使用Стремительный поток生成的испаряющаяся вода将陷阱损毁时，有_40%вероятностьпоявление1个кристалл-ловушка_。\n\n

_+3：_使用Стремительный поток生成的испаряющаяся вода将陷阱损毁时，有_60%вероятностьпоявление1个кристалл-ловушка_。\n\n

_+4：_使用Стремительный поток生成的испаряющаяся вода将陷阱损毁时，有_80%вероятностьпоявление1个кристалл-ловушка_。
actors.hero.talent.new_trap.comment=每次使用Стремительный поток所получает的кристалл-ловушка最多为3个。
actors.hero.talent.holy_bath.title=圣浴勿扰
actors.hero.talent.holy_bath.desc=_+1：_враг身处Стремительный поток生成的испаряющаяся вода中时，会被朝着邻近的非вода体地块_击退1格_。\n\n

_+2：_враг身处Стремительный поток生成的испаряющаяся вода中时，会被朝着邻近的非вода体地块_击退2格_。\n\n

_+3：_враг身处Стремительный поток生成的испаряющаяся вода中时，会被朝着邻近的非вода体地块_击退3格_。\n\n

_+4：_враг身处Стремительный поток生成的испаряющаяся вода中时，会被朝着邻近的非вода体地块_击退4格_。
actors.hero.talent.holy_bath.comment=该талант的击退эффект无法将враг击落深渊。

actors.hero.abilities.slime.springspell.name=Пружинный массив Ян
actors.hero.abilities.slime.springspell.short_desc=Slime Maiden вызывает IT000, даруя исцеление травами себе и даже своим союзникам.
actors.hero.abilities.slime.springspell.desc=Слизняк может призвать Весенний массив Ян, чтобы обеспечить травяное исцеление для себя и даже своих союзников.\ n\ nБазовое количество исцеления: IT000
actors.hero.talent.potent_healing.title=强效疗养
actors.hero.talent.potent_healing.desc=_+1：_通过阳春法阵получает的_草药疗养_эффектувеличено至_30点_。\n\n

_+2：_通过阳春法阵получает的_草药疗养_эффектувеличено至_35点_。\n\n

_+3：_通过阳春法阵получает的_草药疗养_эффектувеличено至_40点_。\n\n

_+4：_通过阳春法阵получает的_草药疗养_эффектувеличено至_45点_。
actors.hero.talent.potent_healing.comment=
actors.hero.talent.efficient_healing.title=高效疗养
actors.hero.talent.efficient_healing.desc=_+1：_阳春法阵给予的_草药疗养_эффектувеличено至_每ходоввосстановление1.5点HP_。\n\n

_+2：_阳春法阵给予的_草药疗养_эффектувеличено至_每ходоввосстановление2点HP_。\n\n

_+3：_阳春法阵给予的_草药疗养_эффект变为_每ходоввосстановление2.5点HP_。\n\n

_+4：_阳春法阵给予的_草药疗养_эффект变为_每ходоввосстановление3点HP_。
actors.hero.talent.efficient_healing.comment=该талант不会影响草药疗养的总治疗量，只是увеличено治疗скорость。
actors.hero.talent.mass_healing.title=众效疗养
actors.hero.talent.mass_healing.desc=_+1：_阳春法阵激活时，девушка-слизь周围_3x3область_内的один名жизнь最少的союзник会получает等量的_草药疗养_эффект。\n\n

_+2：_阳春法阵激活时，девушка-слизь周围_5x5圆形область_内的один名жизнь最少的союзник会получает等量的_草药疗养_эффект。\n\n

_+3：_阳春法阵激活时，девушка-слизь周围_5x5область_内的один名жизнь最少的союзник会получает等量的_草药疗养_эффект。\n\n

_+4：_阳春法阵激活时，девушка-слизь周围_7x7圆形область_内的один名жизнь最少的союзник会получает等量的_草药疗养_эффект。
actors.hero.talent.mass_healing.comment=

actors.hero.talent.liquid_perception.title=液体感知
actors.hero.talent.liquid_perception.desc=_+1：_девушка-слизь饮用один瓶силазелье或опытзелье时，随机鉴定_1种зелье_。\n\n

_+2：_девушка-слизь饮用один瓶силазелье或опытзелье时，随机鉴定_1种зелье或1种свиток_。
actors.hero.talent.liquid_perception.comment=该талант在饮用以силазелье或опытзелье为原料制作的道具时也会生效。

actors.hero.talent.water_wave.title=вода波荡漾
actors.hero.talent.water_wave.desc=_+1：_атака位于вода中的враг时девушка-слизь将造成_1点дополнительноурон_。\n\n

_+2：_атака位于вода中的враг时девушка-слизь将造成_2点дополнительноурон_。
actors.hero.talent.water_wave.comment=

actors.hero.talent.natural_affinity.title=自然亲和
actors.hero.talent.natural_affinity.desc=_+1：_девушка-слизь的голод速率_снижено20%_。\n\n

_+2：_девушка-слизь的голод速率_снижено33%_。
actors.hero.talent.natural_affinity.comment=

actors.hero.talent.quality_absorption.title=优质吸收
actors.hero.talent.quality_absorption.desc=_+1：_девушка-слизь吸收росавосстановление的HPувеличено_2点_。\n\n

_+2：_девушка-слизь吸收росавосстановление的HPувеличено_3点_。
actors.hero.talent.quality_absorption.comment=该талант同样适用于饮用вода袋内的роса，但只会увеличеноодин次吸收的量。

actors.hero.talent.empowering_life.title=盈能жизнь
actors.hero.talent.empowering_life.desc=_+1：_девушка-слизь当前HP为满时，溢出的自然жизньвосстановление会转化为不会流失的щит，上限为_макс. HP的6.7%_，同时_заклинаниеуронувеличено10%_。\n\n

_+2：_девушка-слизь当前HP为满时，溢出的自然жизньвосстановление会转化为不会流失的щит，上限为_макс. HP的13.3%_，同时_заклинаниеуронувеличено20%_。\n\n

_+3：_девушка-слизь当前HP为满时，溢出的自然жизньвосстановление会转化为不会流失的щит，上限为_макс. HP的20%_，同时_заклинаниеуронувеличено30%_。
actors.hero.talent.empowering_life.comment=

actors.hero.talent.ninja_meal.title=ниндзя便当
actors.hero.talent.ninja_meal.desc=_+1：_进食会为ниндзя的коробка сюрикеноввосстановление_1点заряд_。\n\n

_+2：_进食会为ниндзя的коробка сюрикеноввосстановление_2点заряд_。
actors.hero.talent.ninja_meal.comment=如果背包内没有коробка сюрикенов，则该талант会在_+1/+2_уровень时提供_1/2ходов的заряд артефакта_(不能使丰饶之角对其本身заряд)。\n\n“充满肉馅的大腹口粮，他один口就吃了один个！”

actors.hero.talent.agile_attack.title=敏捷反击
actors.hero.talent.agile_attack.desc=_+1：_当忍者闪避了一次敌人的攻击时，他的下一次物理攻击将造成_3点额外伤害_。\n\n_+2：_当忍者闪避了一次敌人的攻击时，他的下一次物理攻击将造成_5点额外伤害_。
actors.hero.talent.agile_attack.comment=“南无三，如此精彩的闪躲回击combo，想必拥有忍者动态视力的诸位已经看得一清二楚了吧。”
actors.hero.talent$agileattack.name=敏捷反击
actors.hero.talent$agileattack.desc=忍者最近闪避了一次敌人的攻击，他对目标发动的下一次物理攻击将获得伤害加成。

actors.hero.talent.you_scared_me.title=吓我один跳
actors.hero.talent.you_scared_me.desc=_+1：_每当ниндзяуклонениеодин次атака且当前щит不足_4点_时，他получает_2点щит_。\n\n

_+2：_每当ниндзяуклонениеодин次атака且当前щит不足_6点_时，他получает_3点щит_。
actors.hero.talent.you_scared_me.comment=通过该талантполучает的щит在_+1/+2_уровень时不会超过_4/6点_。\n\n“风林火山，茶道，然后...风林火山。”

actors.hero.talent.yunying_meal.title=云隐один餐
actors.hero.talent.yunying_meal.desc=_+1：_ниндзя进食只花费1ходов，并получает_2ходов的невидимость_。\n\n

_+2：_ниндзя进食只花费1ходов，并получает_4ходов的невидимость_。
actors.hero.talent.yunying_meal.comment=该талант与талант_吃出опыт_、_无敌один餐_和_生日礼物_общий_100次ограничение срабатывания_。\n\n“aieeeeeee！ниндзя！这里怎么会有ниндзя？！”

actors.hero.talent.xia.title=秘术之霞
actors.hero.talent.xia.desc=_+1：_ниндзя阅读свиток或使用заклинание结晶后会получает_3ходов_的霞之步法(+50%уклонение)。\n\n

_+2：_ниндзя阅读свиток或使用заклинание结晶后会получает_5ходов_的霞之步法(+50%уклонение)。
actors.hero.talent.xia.comment=如果使用的是свиток улучшения、свиток трансмутации或须用前述свиток炼制的炼金物品，则получает的霞之步法эффект时长翻倍。\n\n对产量较高的炼金物品(如大多数结晶)，该талант会基于该物品的单次产出数量вероятность触发。\n\n该талант可以通过阅读无序魔典触发。\n\n“在很久以前，第один代精通忍术奥义的忍术大师利用один张свиток发明了один种奥义：霞之步法。”

actors.hero.talent$xiadef.name=霞之步法
actors.hero.talent$xiadef.desc=忍者在阅读卷轴后短暂参悟了一种奥义，这使他的身体变得轻盈灵动。\n\n此效果会使你的闪避提升50%%以更好地躲避敌人攻击。\n\n剩余回合数：%s回合

actors.hero.talent.quick_search.title=快速搜索
actors.hero.talent.quick_search.desc=_+1：_ниндзя搜索周围_只需花费1ходов_。\n\n

_+2：_在+1的基础上，ниндзя搜索周围_只会потребляет2倍的сытость_。
actors.hero.talent.quick_search.comment=注意，正常搜索时总是花费2ходов并потребляет3倍的сытость。\n\n“只有探索完周围的环境，才能够安心地休息和战斗。”

actors.hero.talent.ninja_social.title=忍者应酬
actors.hero.talent.ninja_social.desc=_+1：_ниндзя使用физическийоружие击杀враг后，接下来的_3次атака_точностьувеличено50%。\n\n

_+2：_ниндзя使用физическийоружие击杀враг后，接下来的_5次атака_точностьувеличено50%。
actors.hero.talent.ninja_social.comment=“南无три，何等精确的chop连打，实际好本领。”
actors.hero.talent$ninjasocial.name=忍者应酬
actors.hero.talent$ninjasocial.desc=接下来的若干次攻击中，忍者的精准提升50%%。\n\n剩余次数：%s

actors.hero.talent.feint.title=声东击西
actors.hero.talent.feint.desc=_+1：_ниндзя向空地扔出非оружие的物品时会将他обзор内的враг引到对应位置，_有20ходовперезарядка_。\n\n

_+2：_ниндзя向空地扔出非оружие的物品时会将他обзор内的враг引到对应位置，_有15ходовперезарядка_。
actors.hero.talent.feint.comment=该талант可以将沉睡的враг唤醒，通常情况下被吸引的враг每ходов都有50%вероятность将注意力转移到обзоробласть内的ниндзя或союзник身上。\n\n“耍我啊混账！”
actors.hero.talent$feintcooldown.name=声东击西-冷却
actors.hero.talent$feintcooldown.desc=你刚刚已经丢出了一个物品吸引敌人，短时间内再难通过制造声响引起它们的注意。\n\n剩余冷却：%s回合

actors.hero.talent.light_box.title=轻便忍具
actors.hero.talent.light_box.desc=_+1：_ниндзя不снаряжениекоробка сюрикенов也能使用其功能，但未снаряжение时коробка сюрикенов的скорость зарядки会降至_25%_。\n\n

_+2：_ниндзя不снаряжениекоробка сюрикенов也能使用其功能，但未снаряжение时коробка сюрикенов的скорость зарядки会降至_50%_。\n\n

_+3：_ниндзя不снаряжениекоробка сюрикенов也能使用其功能，但未снаряжение时коробка сюрикенов的скорость зарядки会降至_75%_。
actors.hero.talent.light_box.comment=如果背包内没有коробка сюрикенов，则该талант会在_+1/+2/+3_уровень时在使用артефакт后的4ходов内使所有метательное оружиеувеличено_1/2/3级_。

actors.hero.talent.qianfa_throwing.title=千发投掷
actors.hero.talent.qianfa_throwing.desc=_+1：_当ниндзя掷出метательное оружие或小小手里剑时，有_10%вероятность_造成3倍урон。\n\n

_+2：_当ниндзя掷出метательное оружие或小小手里剑时，有_20%вероятность_造成3倍урон。\n\n

_+3：_当ниндзя掷出метательное оружие或小小手里剑时，有_30%вероятность_造成3倍урон。
actors.hero.talent.qianfa_throwing.comment=若持有灵能弓等特殊метательное оружие的геройполучает该талант，则特殊метательное оружие也会享受该талант的加成。\n\n“Instruction  ・One：один百发手里剑干不掉的对手，不要想着用один发手里剑干掉，扔出один千发手里剑吧！”

actors.hero.heroclass.ninja=Ниндзя
actors.hero.heroclass.ninja_desc_short=Ниндзя могут использовать свой IT000 для борьбы и даже парализовать врагов. Он также владеет более отдаленным IT001 и более высоким IT002.
actors.hero.heroclass.ninja_desc=Ниндзя изначально несет IT000, который можно быстро извлечь из сундука и выпустить меч из маленькой руки, чтобы нанести удар или даже парализовать врага.\ n\ nНиндзя может взять IT001 с большего расстояния и переместить IT002.\ n\ nВ то же время, Ниндзя первоначально несет IT003, тканевую броню, водяные мешки и бархатные мешки.\ n\ nНиндзя первоначальные элементы идентификации включают:\ nIT004 Зелье ядовитого газа\ nIT005 Свиток преобразования, Свиток идентификации и Свиток телепортации
actors.hero.heroclass.ninja_unlock=_在一场游戏中击败天狗_以解锁忍者。
actors.hero.herosubclass.tatteki_ninja=铁炮忍者
actors.hero.herosubclass.tatteki_ninja_short_desc=_铁炮忍者_会获得一挺强力的铁炮，拥有极高的伤害和较长的发射间隔。
actors.hero.herosubclass.tatteki_ninja_desc=铁炮忍者会获得一挺铁炮，铁炮可被装备为副武器使用并能够共享主武器的等级。使用铁炮射击会造成极高的伤害，并且无论命中与否都会使视野内的敌人产生恐惧，只是每次射击都需要间隔30回合。\n\n铁炮忍者的铁炮精准极低并且不能用于伏击，但他可以通过掷出投掷武器或小小手里剑来给予敌人弹道修正效果，这使得受影响的目标必定会被铁炮击中。
actors.hero.talent.soko.title=早合
actors.hero.talent.soko.desc=_+1：_аркебузир-ниндзя装填铁炮所需时间_снижено4ходов_。\n\n

_+2：_аркебузир-ниндзя装填铁炮所需时间_снижено7ходов_。\n\n

_+3：_аркебузир-ниндзя装填铁炮所需时间_снижено10ходов_。
actors.hero.talent.soko.comment=“早合是东洋国家对火炮装填技术的重要革新，通过将单次射击所需的定量火药与弹丸预先封装于竹筒或纸包内，使用时直接倒入枪管，使铁炮手的射击效率从每分钟1~2发увеличено至4~5发。”
actors.hero.talent.kono_fukusa.title=钓野伏
actors.hero.talent.kono_fukusa.desc=_+1：_аркебузир-ниндзя对враг进行伏击或是физическийатака追击中的враг时，造成的урон_увеличено20%_。\n\n

_+2：_аркебузир-ниндзя对враг进行伏击或是физическийатака追击中的враг时，造成的урон_увеличено40%_。\n\n

_+3：_аркебузир-ниндзя对враг进行伏击或是физическийатака追击中的враг时，造成的урон_увеличено60%_。
actors.hero.talent.kono_fukusa.comment=“钓野伏是东洋战术家创造的战术，以诱敌深入后发动歼灭伏击为核心，曾在与北境国家联合阻击豺狼人的侵入时以少胜多。”
actors.hero.talent.kunikuchi.title=国崩炮
actors.hero.talent.kunikuchi.desc=_+1：_аркебузир-ниндзя可以为铁炮装填炸弹，使得之后的_1次射击_附带炸弹эффект。\n\n

_+2：_аркебузир-ниндзя可以为铁炮装填炸弹，使得之后的_3次射击_附带炸弹эффект。\n\n

_+3：_аркебузир-ниндзя可以为铁炮装填炸弹，使得之后的_5次射击_附带炸弹эффект。
actors.hero.talent.kunikuchi.comment=“国崩炮是один门口径很大的火炮，其发出的巨大声响远比其实际威力更能震慑враг(当然威力也不容小觑就是了)。”

actors.hero.herosubclass.ninja_master=忍术大师
actors.hero.herosubclass.ninja_master_short_desc=_忍术大师_会随时间获得忍术能量，可以消耗这一能量并根据地形的不同来释放各种忍术。
actors.hero.herosubclass.ninja_master_desc=忍术大师会根据地形的不同消耗忍术能量以释放各种忍术。忍术能量通常每40回合回复1点。\n\n普通地形：\n遁术-影遁：瞬间移动并使自身隐匿\n近身术-燕返：快速斩击并使敌人陷入混乱\n投掷术-影击：下次于对应地形投掷能够致残敌人并使其流血\n\n水地形：\n遁术-水遁：一定时间内在水上的移动速度翻倍\n近身术-流水斩：能从更远处斩击并使敌人感到寒冷\n投掷术-飞水投掷：下次于对应地形投掷能够将周围的水转移至对应落点\n\n草或余烬地形：\n遁术-草木复苏：在周围产生腐莓触手协助作战\n近身术-蔓縛：强力斩击并使敌人行动受限\n投掷术-百華乱散：下次于对应地形投掷能够触发一个随机的有害植物效果\n\n该专精在回复忍术能量时拥有一项特殊能力，同时拥有多项特殊能力时可长按快捷功能切换特殊能力。
actors.hero.talent.soul_hunting.title=灵魂狩猎
actors.hero.talent.soul_hunting.desc=_+1：_当有враг死亡时，忍术大师会получает_0.5点忍术能量_。\n\n

_+2：_当有враг死亡时，忍术大师会получает_1点忍术能量_。\n\n

_+3：_当有враг死亡时，忍术大师会получает_1.5点忍术能量_。
actors.hero.talent.soul_hunting.comment=
actors.hero.talent.use_environment.title=环境利用
actors.hero.talent.use_environment.desc=_+1：_忍术大师释放遁术可以吸收周围_3x3область的Огонь_并получает_3ходов的烈焰之力_。\n\n

_+2：_在+1的基础上，忍术大师释放遁术可以吸收周围_3x3область的致眩，麻痹，Токсичный газ等非Огонь，非Электрическое поле气体_并在下次使用投掷术时将这些气体_于цель位置释放_。\n\n

_+3：_在+1和+2的基础上，忍术大师释放遁术可以吸收周围_3x3область的Электрическое поле_并根据吸收量转化为_один定ходов的заряд посоха和заряд артефакта_。
actors.hero.talent.use_environment.comment=
actors.hero.talent.mind_water.title=心如止вода
actors.hero.talent.mind_water.desc=_+1：_忍术大师释放_近身术_所потребляет的忍术能量снижено1点。\n\n

_+2：_忍术大师释放_近身术和投掷术_所потребляет的忍术能量снижено1点。\n\n

_+3：_忍术大师释放_遁术，近身术和投掷术_所потребляет的忍术能量снижено1点。
actors.hero.talent.mind_water.comment=
actors.buffs.ninja_energy.name=Ninjutsu Energy
actors.buffs.ninja_energy.desc=Мастер ниндзюцу получает энергию ниндзюцу с течением времени, которая может потребляться и высвобождаться в зависимости от местности.\ n\ n Энергия ниндзюцу обычно восстанавливается на 1 очко каждые 40 ходов.\ n\ nТекущая энергия: %d/10
actors.buffs.ninja_energy.action=Ниндзюцу
actors.buffs.ninja_energy$watersmooth.name=Путешествуйте свободно
actors.buffs.ninja_energy$watersmooth.desc=Мастер ниндзюцу освобождает технику спасения от воды, удваивая скорость движения мастера ниндзюцу в воде во время этого эффекта.\ n\ nОсталось ходов: %s ходов
actors.buffs.ninja_energy$gas_storage.name=Газохранилище
actors.buffs.ninja_energy$gas_storage.desc=Мастер ниндзюцу хранит окружающий газ в теле, который может быть выпущен в целевое положение при следующем использовании метания.
actors.buffs.ninja_energy$throw_skill.name=Метание
actors.buffs.ninja_energy$throw_skill.desc=Мастер ниндзюцу накапливает в своих руках энергию ниндзюцу, которая выбрасывается вместе с метательным оружием и может иметь дополнительные эффекты.\ n\ nНа нормальной местности бросание переносит кровотечение и увечья в зависимости от урона метательного оружия.\ n\ nНа водной местности метание может перенести водную местность вокруг Мастера ниндзюцу в соответствующую точку приземления.\ n\ nНа траве или на углистой местности метание может вызвать случайный вредный эффект растительности.
actors.buffs.ninja_energy$ninjaability$transported.name_normal=Техника побега - побег из тени
actors.buffs.ninja_energy$ninjaability$transported.desc_normal=Потратьте 1 ход, чтобы мгновенно переместиться на 2 слота и получить невидимость на 5 ходов.
actors.buffs.ninja_energy$ninjaability$transported.more_distance=Расстояние слишком далеко для телепортации.
actors.buffs.ninja_energy$ninjaability$transported.name_water=Техника эвакуации - побег из воды
actors.buffs.ninja_energy$ninjaability$transported.desc_water=Получите легкость и удвойте скорость движения в воде на 8 ходов.
actors.buffs.ninja_energy$ninjaability$transported.name_grass=Техника эвакуации - Реанимация на траве
actors.buffs.ninja_energy$ninjaability$transported.desc_grass=Может производить от 1 до 3 тонущих щупалец малины.
actors.buffs.ninja_energy$ninjaability$transported.less=Недостаточно места для генерации щупалец.
actors.buffs.ninja_energy$ninjaability$taijutsu.name_normal=Техника ближнего боя - Ян Хуэй
actors.buffs.ninja_energy$ninjaability$taijutsu.desc_normal=Выполняет 2 косой удар 80% урона и оглушает на 5 ходов противника.
actors.buffs.ninja_energy$ninjaability$taijutsu.name_water=Переход в режим ближнего боя - разрез проточной воды
actors.buffs.ninja_energy$ninjaability$taijutsu.desc_water=Удары, нанесенные противникам, имеют дополнительную 1 дальность атаки и 5 раундов обморожения.
actors.buffs.ninja_energy$ninjaability$taijutsu.name_grass=Рукопашный бой - ползание
actors.buffs.ninja_energy$ninjaability$taijutsu.desc_grass=Наносит 1 косой удар с 125% урона на 5 ходов с помощью запутывания.
actors.buffs.ninja_energy$ninjaability$throw.name_normal=Бросок - Теневой удар
actors.buffs.ninja_energy$ninjaability$throw.desc_normal=Получите эффект метания, который вызывает кровотечение и нанесение увечий на основе урона от метательного оружия, который будет прикреплен к следующему броску на нормальной местности.
actors.buffs.ninja_energy$ninjaability$throw.name_water=Метание - Летающая вода
actors.buffs.ninja_energy$ninjaability$throw.desc_water=Получите эффект метания, чтобы следующий бросок на водной местности мог перенести водную местность вокруг мастера ниндзя в соответствующую точку приземления.
actors.buffs.ninja_energy$ninjaability$throw.name_grass=Метание - Байхуа разбросано
actors.buffs.ninja_energy$ninjaability$throw.desc_grass=Получите эффект бросания, чтобы следующий бросок на траву или угли мог вызвать случайный вредный эффект растения.
actors.buffs.ninja_energy$ninjaability$throw.hive_throw=Вы перешли в состояние броска.

actors.hero.abilities.ninja.decoy.name=Воин теней
actors.hero.abilities.ninja.decoy.short_desc=Ниндзя вызывает IT000, чтобы помочь в бою и принять смертельные атаки вместо ниндзя.
actors.hero.abilities.ninja.decoy.desc=Ниндзя вызывает Воина Теней, используя эту способность, чтобы направлять его действия, когда существует Воин Теней. Первоначально Теневой воин имеет только 40 HP и 10-15 атак.\ n\ nТеневой воин может помочь ниндзя в битве. Когда ниндзя подвергается смертельному нападению, Теневой воин получает много урона и умирает вместо ниндзя.
actors.hero.abilities.ninja.decoy.less=Не хватило места, чтобы призвать Воина Теней.
actors.hero.abilities.ninja.decoy$decoyman.name=Воин теней
actors.hero.abilities.ninja.decoy$decoyman.direct_defend=Подчиняйтесь диспетчеру.
actors.hero.abilities.ninja.decoy$decoyman.direct_follow=Клянусь следовать!
actors.hero.abilities.ninja.decoy$decoyman.direct_attack=Все войска атакуют!
actors.hero.abilities.ninja.decoy$decoyman.directed_wander=Ищите врага и уничтожьте его!
actors.hero.abilities.ninja.decoy$decoyman.desc=Воин-тень, сформированный тенями, поднимает руку и бросает ногу точно так же, как вы, и противнику трудно отличить вас от него.\ n\ nОн выглядит хрупким, и когда вы принимаете смертельный удар, он может принять этот удар на себя, но он понесет много урона и даже умрет прямо.
actors.hero.abilities.ninja.decoy$decoyman.die1=Вишня в моем родном городе снова цветет, но я не могу вернуться...
actors.hero.abilities.ninja.decoy$decoyman.die2=Пффф... эта сигарета... очень трудно курить...
actors.hero.abilities.ninja.decoy$decoyman.die3=Быть живым - это доказательство битвы...
actors.hero.abilities.ninja.decoy$decoyman.die4=Саюнара! (вспышка разбросана)
actors.hero.abilities.ninja.decoy$decoyman.discover_hint=Вы можете обнаружить этот отряд с помощью навыка героической брони.
actors.hero.abilities.ninja.decoy$shadowmark.name=Отметка тени
actors.hero.abilities.ninja.decoy$shadowmark.desc=Воин теней нанёс метку тени врагу.\ n\ nНанесённый враг получит больше урона от ниндзя и воинов теней.\ n\ nОсталось раундов: %s
actors.hero.talent.deversion.title=胧分身术
actors.hero.talent.deversion.desc=_+1：_影武者的最大生命值提升至_50点_，攻击提升至_20~25点_。\n\n_+2：_在+1的基础上，一次召唤能够产生_2个_影武者。\n\n_+3：_影武者的最大生命值提升至_60点_，攻击提升至_30~35点_。\n\n_+4：_在+3的基础上，一次召唤能够产生_3个_影武者。
actors.hero.talent.deversion.comment=
actors.hero.talent.shinkage.title=阴影之铠
actors.hero.talent.shinkage.desc=_+1：_影武者的броняувеличено至_1~5点_。\n\n

_+2：_在+1的基础上，影武者受到атака时会给予ниндзя_1ходов的гормональный всплеск_。\n\n

_+3：_影武者的броняувеличено至_2~10点_。\n\n

_+4：_在+3的基础上，影武者受到атака时会给予ниндзя_1.5ходов的гормональный всплеск_。
actors.hero.talent.shinkage.comment=
actors.hero.talent.allhunting.title=集群狩猎
actors.hero.talent.allhunting.desc=_+1：_影武者攻击敌人后会为其烙上_2回合的暗影印记_，被烙上印记的敌人受到来自忍者和影武者的伤害_提升15%_。\n\n_+2：_影武者攻击敌人后会为其烙上_4回合的暗影印记_，被烙上印记的敌人受到来自忍者和影武者的伤害_提升30%_。\n\n_+3：_影武者攻击敌人后会为其烙上_6回合的暗影印记_，被烙上印记的敌人受到来自忍者和影武者的伤害_提升45%_。\n\n_+4：_影武者攻击敌人后会为其烙上_8回合的暗影印记_，被烙上印记的敌人受到来自忍者和影武者的伤害_提升60%_。
actors.hero.talent.allhunting.comment=


actors.hero.abilities.ninja.onesword.name=Одно тронное лезвие
actors.hero.abilities.ninja.onesword.short_desc=Ниндзя использует Swordsman's Battle Ultimate: IT000, чтобы увеличить скорость передвижения, скорость атаки в ближнем бою и урон в ближнем бою на короткое время.
actors.hero.abilities.ninja.onesword.desc=Ниндзя разыгрывают Sword Sage's Battle Ultimate: Ichinotatana Sabre! Этот Ultimate длится 10 раундов.\ n\ nПосле кастинга Ultimate: First Blade ниндзя имеет двойную скорость движения и +50% к скорости атаки, а урон от ближнего боя увеличивается на 30%. Увеличивает урон в ближнем бою на дополнительные 20%, если оружие в руке - Угроза Угрозы или Меч Самурая.
actors.hero.abilities.ninja.onesword$oku_onesword.name=Ultimate: один нож
actors.hero.abilities.ninja.onesword$oku_onesword.desc=Самый мощный меч нового течения теперь используется ниндзя в их навыках ближнего боя, увеличивая скорость их движения, скорость атаки и урон от ближнего боя.\ n\ nОсталось раундов: %s
actors.hero.talent.offensive.title=攻势
actors.hero.talent.offensive.desc=_+1：_Секрет: Первый удар对атакаскорость与近战урон的加成由50%与30%увеличено至_62.5%_与_45%_。\n\n

_+2：_Секрет: Первый удар对атакаскорость与近战урон的加成由50%与30%увеличено至_75%_与_60%_。\n\n

_+3：_Секрет: Первый удар对атакаскорость与近战урон的加成由50%与30%увеличено至_87.5%_与_75%_。\n\n

_+4：_Секрет: Первый удар对атакаскорость与近战урон的加成由50%与30%увеличено至_100%_与_90%_。
actors.hero.talent.offensive.comment=“不敢暴虎，不敢冯河。”
actors.hero.talent.glimpse.title=один闪
actors.hero.talent.glimpse.desc=_+1：_Секрет: Первый удар对скорость передвижения的加成由100%увеличено至_137.5%_。\n\n

_+2：_Секрет: Первый удар对скорость передвижения的加成由100%увеличено至_175%_。\n\n

_+3：_Секрет: Первый удар对скорость передвижения的加成由100%увеличено至_212.5%_。\n\n

_+4：_Секрет: Первый удар对скорость передвижения的加成由100%увеличено至_250%_。
actors.hero.talent.glimpse.comment=“人知其один，莫知其他。”
actors.hero.talent.kill_continue.title=斩杀续势
actors.hero.talent.kill_continue.desc=_+1：_使用оружие ближнего боя击杀один名враг时，продление_1ходов_Секрет: Первый удар。\n\n

_+2：_使用оружие ближнего боя击杀один名враг时，продление_2ходов_Секрет: Первый удар。\n\n

_+3：_使用оружие ближнего боя击杀один名враг时，продление_3ходов_Секрет: Первый удар。\n\n

_+4：_使用оружие ближнего боя击杀один名враг时，продление_4ходов_Секрет: Первый удар。
actors.hero.talent.kill_continue.comment=“战战兢兢，如临深渊，如履薄冰。”

actors.hero.abilities.ninja.spiderjar.name=Плоский реактор Spider
actors.hero.abilities.ninja.spiderjar.short_desc=Ниндзя загрузил большое количество пороха в IT000, зажег его и выбросил, нанеся огромное количество взрывного урона после того, как свинец был сожжен.
actors.hero.abilities.ninja.spiderjar.desc=Древние котлы паука Тяньпин испускают аромат, который очаровывает существ и даже машины перед взрывом, что может привлечь врагов, которые не заснули, чтобы понюхать. Как правило, привлекаемые противники имеют 50% шанс обратить свое внимание на ниндзя или союзника в прямой видимости каждый ход.\ n\ nПосле взрыва древний котел паука Тяньмин наносит 20-40 ед. урона юнитам в области 3x3.
actors.hero.abilities.ninja.spiderjar$spider.name=Плоский реактор Spider
actors.hero.abilities.ninja.spiderjar$spider.desc=Драгоценный чайный набор, полный пороха, по-видимому, любимый артефакт какого-то большого человека, теперь наполняется динамитом и освещается ниндзя.\ n\ nЭтот чайный набор обладает очаровательным ароматом и продолжает привлекать врагов.
actors.hero.abilities.ninja.spiderjar$spider.ondeath=Вы зажгли порох и подарили всем замечательный пиротехнический дисплей вроде Matsu Eiko Show...
actors.hero.abilities.ninja.spiderjar$smallspider.name=Реактор Little Spider
actors.hero.abilities.ninja.spiderjar$smallspider.desc=После взрыва плоского паучьего котла внутри есть небольшой паучий котёл, который не был полностью взорван.\ n\ nЭтот чайный набор обладает очаровательным ароматом и великолепным эффектом кибер-светодиодного освещения, который может продолжать привлекать врагов.
actors.hero.talent.power_gunpowder.title=强效火药
actors.hero.talent.power_gunpowder.desc=_+1：_平蜘蛛釜爆炸造成的уронувеличено至_25~55点_。\n\n

_+2：_在+1的基础上，平蜘蛛釜的爆炸областьувеличено至_5x5_。\n\n

_+3：_平蜘蛛釜爆炸造成的уронувеличено至_30~70点_。\n\n

_+4：_在+3的基础上，平蜘蛛釜的爆炸областьувеличено至_7x7_。
actors.hero.talent.power_gunpowder.comment=
actors.hero.talent.tea_stains.title=特色茶垢
actors.hero.talent.tea_stains.desc=_+1：_平蜘蛛釜爆炸会附带_5ходов的горение_。\n\n

_+2：_平蜘蛛釜爆炸会附带_5ходов的горение或обморожение_。\n\n

_+3：_平蜘蛛釜爆炸会附带_5ходов的горение或обморожение_以及_3ходов的麻痹_。\n\n

_+4：_平蜘蛛釜爆炸会附带_8ходов的горение或обморожение_以及_3ходов的麻痹_。
actors.hero.talent.tea_stains.comment=
actors.hero.talent.firework.title=烟火表演
actors.hero.talent.firework.desc=_+1：_平蜘蛛釜爆炸后会留下один个小蜘蛛釜，可持续吸引未陷入沉睡的враг_10ходов_，随后появление3x3область的爆炸但不造成урон。\n\n

_+2：_平蜘蛛釜爆炸后会留下один个小蜘蛛釜，可持续吸引未陷入沉睡的враг_10ходов_，随后появление3x3область的爆炸造成_10~20点_урон。\n\n

_+3：_平蜘蛛釜爆炸后会留下один个小蜘蛛釜，可持续吸引未陷入沉睡的враг_15ходов_，随后появление3x3область的爆炸造成_10~20点_урон。\n\n

_+4：_平蜘蛛釜爆炸后会留下один个小蜘蛛釜，可持续吸引未陷入沉睡的враг_15ходов_，随后появление3x3область的爆炸造成_15~30点_урон。
actors.hero.talent.firework.comment=

actors.hero.heroclass.dm400=DM-400
actors.hero.heroclass.dm400_desc_short=DM-400 может использовать IT000 для производства дронов для помощи в бою, в то время как его физические атаки также будут иметь эффект боевых дронов IT001 на противника. У него также есть свойство IT002.
actors.hero.heroclass.dm400_desc=DM-400 изначально оснащен IT000, который может производить беспилотники для помощи в бою.\ n\ n DM-400 имеет атрибут IT001 и имеет низкий начальный срок службы и не вооружен, но невооруженная атака может вызвать IT002. Физическая атака DM-400 поражает врага и дает ему незакрепляемый эффект IT003 на 3 хода, который усиливает эффект некоторых боевых дронов на врага.\ n\ nВ то же время DM-400 изначально несет IT004, тканевую броню, водяные мешки и бархатные мешки.\ n\ nОсновные предметыDM-400:\ nIT005 Ледяное зелье мороза\ nIT006 Свиток трансформации, Свиток идентификации и Свиток заряда
actors.hero.heroclass.dm400_unlock=IT000 для разблокировки DM-400.

actors.hero.talent.mark_meal.title=меткаодин餐
actors.hero.talent.mark_meal.desc=_+1：_进食会为DM-400接下来对враг造成的3次физическийатака附带的метка приказа持续时间увеличено至_5ходов_。\n\n

_+2：_进食会为DM-400接下来对враг造成的3次физическийатака附带的метка приказа持续时间увеличено至_6ходов_。
actors.hero.talent.mark_meal.comment=“64 65 6C 69 63 6F 75 73.”
actors.hero.talent.mark_meal.meta_desc=_如果这个талант被其它геройполучает_，那么它会改为附带2/3ходов的оглушение。

actors.hero.talent.over_code.title=超算代码
actors.hero.talent.over_code.desc=_+1：_DM-400阅读один张свиток улучшения或свиток трансмутации时，随机鉴定_1种свиток_。\n\n

_+2：_DM-400阅读один张свиток улучшения或свиток трансмутации时，随机鉴定_1种свиток或1种зелье_。
actors.hero.talent.over_code.comment=该талант在阅读以свиток улучшения或свиток трансмутации为原料制作的道具时也会生效。\n\n“Decoding Files...”

actors.hero.talent$markmeal.name=标记打击
actors.hero.talent$markmeal.desc=DM-400接下来的数次物理攻击给予的指令标记效果延长。\n\n若其他英雄获得该效果，则接下来的数次物理攻击会给予目标一定回合的眩晕效果。\n\n剩余次数：%1$d

actors.hero.talent.tbm.title=定期维护
actors.hero.talent.tbm.desc=_+1：_DM-400每隔60ходов都会получает_3点щит_。\n\n

_+2：_DM-400每隔60ходов都会получает_5点щит_。
actors.hero.talent.tbm.comment=“Repairing Files...”

actors.hero.talent.target_targeting.title=цель针对
actors.hero.talent.target_targeting.desc=_+1：_атака带有_метка приказа_эффект的враг时DM-400将造成_1点дополнительноурон_。\n\n

_+2：_атака带有_метка приказа_эффект的враг时DM-400将造成_2点дополнительноурон_。
actors.hero.talent.target_targeting.comment=“Target Locked.”
actors.hero.talent.target_targeting.meta_desc=_如果这个талант被其它геройполучает_，那么它会改为对带有оглушениеэффект的враг生效。

actors.hero.talent.over_meal.title=进食超载
actors.hero.talent.over_meal.desc=_+1：_DM-400进食_只花费0.5ходов_。\n\n

_+2：_DM-400进食_不花费ходов_。
actors.hero.talent.over_meal.comment=“63 72 75 6E 63 68 79.”

actors.hero.talent.recover_charge.title=заряд回收
actors.hero.talent.recover_charge.desc=_+1：_当DM-400为指令集合工具录入свиток后会为指令集合工具восстановление_1点заряд_。\n\n

_+2：_当DM-400为指令集合工具录入свиток后会为指令集合工具восстановление_2点заряд_。
actors.hero.talent.recover_charge.comment=“Recycle.”
actors.hero.talent.recover_charge.meta_desc=_如果这个талант被其它геройполучает_，那么它会在+1时使герой阅读свиток或无序魔典后получает2ходов的заряд артефакта，+2时увеличено至4ходов。使用的是свиток улучшения、свиток трансмутации或须用前述свиток炼制的炼金物品并不会加强这одинэффект，而对产量较高的炼金物品(如大多数结晶)则会基于该物品的单次产出数量вероятность触发。

actors.hero.talent.body_reinforce.title=机身加固
actors.hero.talent.body_reinforce.desc=_+1：_DM-400生产的无人机会继承其_50%的护甲_。\n\n_+2：_DM-400生产的无人机会继承其_75%的护甲_。
actors.hero.talent.body_reinforce.comment=“铁甲400和它的铁甲军团。”
actors.hero.talent.body_reinforce.meta_desc=_如果这个天赋被其它英雄获得_，那么它会在+1时使英雄受到至少20点伤害时获得5%的伤害减免，+2时提升至受到至少10点伤害时获得10%的伤害减免。

actors.hero.talent.efficient_order.title=高效指令
actors.hero.talent.efficient_order.desc=_+1：_DM-400的所有союзник_скорость передвиженияувеличено30%_。\n\n

_+2：_DM-400的所有союзник_скорость передвиженияувеличено45%_。
actors.hero.talent.efficient_order.comment=“Go Work.”

actors.hero.talent.rocket_fist.title=火箭飞拳
actors.hero.talent.rocket_fist.desc=_+1：_DM-400的徒手атака有_60%вероятность击退цель1格_。\n\n

_+2：_DM-400的徒手атака有_60%вероятность击退цель2格_。
actors.hero.talent.rocket_fist.comment=若使用оружие ближнего боя进行атака，则击退вероятность_仅为30%_。\n\n“火箭拳——！！！”

actors.hero.talent.big_fist.title=重拳出击
actors.hero.talent.big_fist.desc=_+1：_DM-400的徒手攻击能够无视敌人的护甲，同时造成的伤害提升至_3~20点_。\n\n_+2：_DM-400的徒手攻击能够无视敌人的护甲，同时造成的伤害提升至_4~25点_。\n\n_+3：_DM-400的徒手攻击能够无视敌人的护甲，同时造成的伤害提升至_5~30点_。
actors.hero.talent.big_fist.comment=装备武力之戒会覆盖掉DM-400的徒手伤害而非直接叠加，但依然保留该天赋无视敌人护甲的效果。

actors.hero.talent.quick_tool.title=快捷工具
actors.hero.talent.quick_tool.desc=_+1：_DM-400不снаряжение指令集合工具也能使用其功能，但未снаряжение时工具的скорость зарядки会降至_25%_。\n\n

_+2：_DM-400不снаряжение指令集合工具也能使用其功能，但未снаряжение时工具的скорость зарядки会降至_50%_。\n\n

_+3：_DM-400不снаряжение指令集合工具也能使用其功能，但未снаряжение时工具的скорость зарядки会降至_75%_。
actors.hero.talent.quick_tool.comment=
actors.hero.talent.quick_tool.meta_desc=_如果这个талант被其它геройполучает_，那么它会在+1/+2/+3уровень时使所有союзникполучает10/20/30%的дополнительно减伤。

actors.hero.herosubclass.at400=AT-400
actors.hero.herosubclass.at400_short_desc=_AT-400_允许调用更多种类的战斗型无人机协助作战，庞大的无人机集群将更加有效地打击一切敌对目标。
actors.hero.herosubclass.at400_desc=AT-400在攻击被标记的敌人时物理伤害增加30%，并且现在能够录入更多卷轴以调用更多种类的战斗型无人机，这些无人机在战斗性能方面都更为优秀。\n\n闪光无人机(祛邪)：攻击敌人的同时还能够干扰敌人视线\n激光无人机(充能)：迸射强烈的激光射线灼烧敌人\n迷乱无人机(催眠)：攻击将有机会致眩甚至是击退敌人\n袭扰无人机(盛怒)：能够袭扰敌人甚至使其变得躁狂\n震慑无人机(恐惧)：通过火力压制震慑敌人\n混沌无人机(嬗变)：在一段时间后变化为任意辅助型无人机或是一些奇怪的东西\n\n若启用了_随机模式_，在未持有指令集合工具的情况下，选择该专精会获得一套指令集合工具。

actors.hero.talent.sustain_mark.title=持久метка
actors.hero.talent.sustain_mark.desc=_+1：_AT-400的физическийатака能够_дополнительно造成2ходовметка приказа_эффект。\n\n

_+2：_AT-400的физическийатака能够_дополнительно造成4ходовметка приказа_эффект。\n\n

_+3：_AT-400的физическийатака能够_дополнительно造成6ходовметка приказа_эффект。
actors.hero.talent.sustain_mark.comment=该талант可对袭扰дрон和震慑дрон生效。

actors.hero.talent.battle_upgrade.title=战斗升级
actors.hero.talent.battle_upgrade.desc=_+1：_AT-400生产的所有战斗型无人机造成的伤害提升_15%_，同时还会基于敌人的护甲进行额外提升，这一额外提升至多等效无视敌人_26.7%的护甲_。\n\n_+2：_AT-400生产的所有战斗型无人机造成的伤害提升_22.5%_，同时还会基于敌人的护甲进行额外提升，这一额外提升至多等效无视敌人_53.3%的护甲_。\n\n_+3：_AT-400生产的所有战斗型无人机造成的伤害提升_30%_，同时还会基于敌人的护甲进行额外提升，这一额外提升至多等效无视敌人_80%的护甲_。
actors.hero.talent.battle_upgrade.comment=该天赋不对僚机无人机生效。

actors.hero.talent.fly_drone.title=空中飞蚊
actors.hero.talent.fly_drone.desc=_+1：_AT-400生产的所有боевой дрон必定уклонение其遭到的_前2次атака_。\n\n

_+2：_AT-400生产的所有боевой дрон必定уклонение其遭到的_前3次атака_。\n\n

_+3：_AT-400生产的所有боевой дрон必定уклонение其遭到的_前4次атака_。
actors.hero.talent.fly_drone.comment=该талант不对僚机дрон、混沌дрон和вспомогательный дрон生效。

actors.hero.ally.attackdrone.name=Боевые дроны
actors.hero.ally.attackdrone.desc=Полностью боевые дроны.
actors.hero.ally.attackdrone$flashdrone.name=Flash Drone
actors.hero.ally.attackdrone$flashdrone.desc=Боевой беспилотник, выпущенный после того, как он был записан в IT000, хотя и был оснащен лазерным стволом, на самом деле стрелял лазерными лучами из «зрачка» для атаки противника. Так называемый лазерный ствол действует только как индикатор стрельбы.\ n\ nС 3 дальностями атаки атакующие противники с эффектом командной метки ослепят противника на 3 хода, а также нанесут дополнительно 5 магических урона врагам нежити и демона с эффектом командной метки.
actors.hero.ally.attackdrone$laserdrone.name=Лазерный дрон
actors.hero.ally.attackdrone$laserdrone.desc=Боевой беспилотник, выпущенный после входа в IT000, больше похож на большую подвесную лазерную пушку с точки зрения стиля, и фактический эффект действительно тот же. Его лазерный луч идеально подходит для «жарки мяса».\ n\ nАтаки дальнего боя наносят магический урон и имеют 50% шанс поджечь врагов на 3 раунда при атаке врага с эффектом Command Mark.
actors.hero.ally.attackdrone$anesthesiadrone.name=Запутанные дроны
actors.hero.ally.attackdrone$anesthesiadrone.desc=Две роботизированные руки на боевом дроне, произведенные после того, как он был записан в IT000, подключены к ударному устройству, которое, хотя и не достаточно, чтобы парализовать цель, также может вызвать у цели головокружение. Никто не хочет испытать шок от этого.\ n\ nАтака противника с эффектом Командной метки имеет 33% шанс ослепить противника на 3 раунда и дополнительный 50% шанс отбросить его на расстояние.
actors.hero.ally.attackdrone$raiddrone.name=Ударные дроны
actors.hero.ally.attackdrone$raiddrone.desc=Боевой беспилотник, выпущенный после выхода IT000, этот тип малого беспилотника имеет более высокую скорость полета и идеально подходит для преследования целей. Перед лицом большого количества притеснений со стороны «комаров» более устойчивые цели будут в бешенстве.\ n\ nС 2-кратной скоростью полета и 3 дальностями атаки существует 33% шанс дать эффект нештатной командной метки на 3 хода при атаке противников без эффекта командной метки и 17% шанс привести их в бешенство на 3 хода при атаке противников с эффектом командной метки.
actors.hero.ally.attackdrone$shockdrone.name=БПЛА DETER
actors.hero.ally.attackdrone$shockdrone.desc=Боевой беспилотник, выпущенный после записи IT000, был оснащен тяжелым снайперским стволом, позволяющим ему легко проникать в плоть и кровь цели. Когда такой беспилотник может быть массово произведен, может быть разумнее убежать.\ n\ nАтаки дальнего боя имеют 17% шанс дать не штабелирующую Командную метку на 3 хода при атаке противника без эффекта Командной метки и 33% шанс напугать их на 6 ходов при атаке противника с эффектом Командной метки.

actors.hero.ally.auxiliarydrone.name=Вспомогательные дроны
actors.hero.ally.auxiliarydrone.desc=Очные вспомогательные дроны.
actors.hero.ally.auxiliarydrone$scoutdrone.name=Разведывательные дроны
actors.hero.ally.auxiliarydrone$scoutdrone.desc=Вспомогательные беспилотники, произведенные после ввода IT000, в основном используются для разведывательных работ, а их «зрачки» будут постоянно сканировать окружающую местность и активные цели. Кроме того, это единственный аффилированный дрон, который делит с хозяином полное поле зрения.\ n\ nИзначальное поле зрения небольшое (расширяется по мере улучшения инструмента), но полное поле зрения делится с DM-400, и отмечается слабость всех противников в поле зрения, увеличивая получаемый отмеченным противником урон на 33% (не штабелируемый).
actors.hero.ally.auxiliarydrone$weaknessmark.name=Маркер слабости
actors.hero.ally.auxiliarydrone$weaknessmark.desc=Слабость противника отмечена разведывательным дроном.\ n\ nУ врагов в поле зрения разведывательного дрона слабости отмечаются постоянно, поэтому получаемый урон увеличивается на 33% %.\ n\ nОсталось ходов: %s ходов
actors.hero.ally.auxiliarydrone$mirrordrone.name=Светоотражающие дроны
actors.hero.ally.auxiliarydrone$mirrordrone.desc=Вспомогательный беспилотник, произведенный после ввода IT000, использует новый тип технологии визуализации, которая может отображать изображение пользователя, который может свободно перемещаться. Конечно, принцип этой технологии все еще волшебный.\ n\ nИзображение DM-400 генерируется вокруг вас время от времени, и обновление инструмента сократит время, необходимое для генерации изображения.
actors.hero.ally.auxiliarydrone$protectdrone.name=Защита дронов
actors.hero.ally.auxiliarydrone$protectdrone.desc=Вспомогательный дрон, созданный после входа в IT000, может создать невидимую оборонительную позицию вокруг хозяина и после уничтожения переместит атакующего в другое место. Считается, что он обеспечит вам чувство безопасности.\ n\ nКогда он будет существовать, он обеспечит дополнительные 1-3 очка брони для DM-400 и будет телепортировать врагов случайным образом в любое место после их уничтожения.
actors.hero.ally.auxiliarydrone$escortdrone.name=Дроны сопровождения
actors.hero.ally.auxiliarydrone$escortdrone.desc=Вспомогательный БПЛА, произведенный после входа в IT000, имеет возможность скрывать основные операции, обеспечивая безопасность разведочных работ. Только не знаю почему, цель трудно заметить даже при наличии дронов.\ n\ nУсугубляет обнаружение действий DM-400 врагами и делает DM-400 невидимым на 4 раунда время от времени.
actors.hero.ally.auxiliarydrone$bombdrone.name=Взрывные дроны
actors.hero.ally.auxiliarydrone$bombdrone.desc=Вспомогательный беспилотник, произведенный после ввода IT000, обладает большой смертоносной взрывной способностью и быстро приблизится к цели для совершения атаки смертника. Будьте уверены, взрыв, который он производит, не повредит мэйнфрейму и другим связанным дронам.\ n\ nС увеличенной в 2 раза скоростью полета он будет продолжать терять жизнь, когда вокруг него есть враг. После потери жизни или разрушения он произведет взрыв, который только навредит врагу.
actors.hero.ally.auxiliarydrone$chaosdrone.name=Дроны хаоса
actors.hero.ally.auxiliarydrone$chaosdrone.desc=Специальный БПЛА, произведенный после входа IT000, каким-то образом вокруг него вспыхнули какие-то черно-белые блоки неизвестного происхождения...\ n\ nНе происходит никакого эффекта, через промежуток времени согласно сменам специализации ДМ-400 на случайный вспомогательный или боевой БПЛА, конечно, это тоже может стать чем-то неожиданным... Средство апгрейда сократит время, необходимое для изменений.

actors.hero.herosubclass.au400=AU-400
actors.hero.herosubclass.au400_short_desc=_AU-400_允许调用更多种类的辅助型无人机协助作战，善用功能性强大的无人机可以有效提升生存能力。
actors.hero.herosubclass.au400_desc=AU-400受到被标记的敌人的物理攻击时拥有20%减伤，并且现在能够录入更多卷轴以调用更多种类的辅助型无人机，这些无人机在辅助性能方面都更为优秀。\n\n侦察无人机(鉴定)：用于侦察的同时还能够揭示敌人弱点\n映像无人机(镜像)：每隔一段时间产生一个你的镜像\n庇佑无人机(传送)：提升你的防御并能将危险的敌人转移\n护航无人机(探地)：能够掩蔽你的行踪以提升探索安全性\n爆破无人机(复仇)：通过自爆杀伤敌人\n混沌无人机(嬗变)：在一段时间后变化为任意战斗型无人机或是一些奇怪的东西\n\n若启用了_随机模式_，在未持有指令集合工具的情况下，选择该专精会获得一套指令集合工具。

actors.hero.talent.special_mark.title=特化метка
actors.hero.talent.special_mark.desc=_+1：_AU-400атака带有_метка приказа_эффект的враг时точностьувеличено_50%_并有_16.7%вероятность_给予其_3ходовмишень_эффект。\n\n

_+2：_AU-400атака带有_метка приказа_эффект的враг时точностьувеличено_75%_并有_33.3%вероятность_给予其_3ходовмишень_эффект。\n\n

_+3：_AU-400атака带有_метка приказа_эффект的враг时точностьувеличено_100%_并有_50%вероятность_给予其_3ходовмишень_эффект。
actors.hero.talent.special_mark.comment=

actors.hero.talent.assist_upgrade.title=辅助升级
actors.hero.talent.assist_upgrade.desc=_+1：_AU-400生产的所有辅助型无人机每架每隔_50回合_会为其提供_4点护盾_。\n\n_+2：_AU-400生产的所有辅助型无人机每架每隔_40回合_会为其提供_4点护盾_。\n\n_+3：_AU-400生产的所有辅助型无人机每架每隔_30回合_会为其提供_4点护盾_。
actors.hero.talent.assist_upgrade.comment=通过该天赋叠加的护盾不会超过最大生命值的一半。\n\n该天赋不对僚机无人机、混沌无人机和战斗型无人机生效。

actors.hero.talent.fast_cruise.title=快速巡航
actors.hero.talent.fast_cruise.desc=_+1：_AU-400生产的所有вспомогательный дрон每架每隔_80ходов_会为其提供_2ходов极速_。\n\n

_+2：_AU-400生产的所有вспомогательный дрон每架每隔_70ходов_会为其提供_2ходов极速_。\n\n

_+3：_AU-400生产的所有вспомогательный дрон每架每隔_60ходов_会为其提供_2ходов极速_。
actors.hero.talent.fast_cruise.comment=该талант不对僚机дрон、混沌дрон和боевой дрон生效。

actors.hero.abilities.dm400.routine.name=Плановое обслуживание
actors.hero.abilities.dm400.routine.short_desc=DM-400 выполняет IT000 на себе, что может улучшить его функции за короткий промежуток времени.
actors.hero.abilities.dm400.routine.desc=DM-400 проводит 4 раунда планового техобслуживания, во время которого получаемый урон снижается на 50%, а затем перегружается на 10 раундов.\ n\ n DM-400 имеет двойную скорость атаки и скорость передвижения во время перегрузки (дроны также пользуются этим бонусом), но получает на 50% больше урона.
actors.hero.abilities.dm400.routine$overload.name=Режим перегрузки
actors.hero.abilities.dm400.routine$overload.desc=Внимание! DM-400 и его аффилированные дроны перешли в режим перегрузки!\ n\ nВ то же время DM-400 и его аффилированные дроны удвоят скорость атаки и скорость передвижения, но в результате DM-400 получит больше урона.\ n\ nОсталось времени: %s ходов
actors.hero.talent.over_extend.title=超载продление
actors.hero.talent.over_extend.desc=_+1：_超载продление至_12ходов_。\n\n

_+2：_超载продление至_15ходов_。\n\n

_+3：_超载продление至_17ходов_。\n\n

_+4：_超载продление至_20ходов_。
actors.hero.talent.over_extend.comment=
actors.hero.talent.terror_mach.title=恐怖机器
actors.hero.talent.terror_mach.desc=_+1：_进入超载后，首次进入DM-400обзор内的враг会陷入_2ходов的страх_。\n\n

_+2：_进入超载后，首次进入DM-400обзор内的враг会陷入_4ходов的страх_。\n\n

_+3：_进入超载后，首次进入DM-400обзор内的враг会陷入_6ходов的страх_。\n\n

_+4：_进入超载后，首次进入DM-400обзор内的враг会陷入_8ходов的страх_。
actors.hero.talent.terror_mach.comment=每个враг只会因此受到один次страхэффект。
actors.hero.talent.strong_perserve.title=强效维护
actors.hero.talent.strong_perserve.desc=_+1：_维护完成后给予自身和所有дрон_макс. HP7.5%点щит_，同时超载期间自身受到的урон_снижено5%_。\n\n

_+2：_维护完成后给予自身和所有дрон_макс. HP10%点щит_，同时超载期间自身受到的урон_снижено10%_。\n\n

_+3：_维护完成后给予自身和所有дрон_макс. HP12.5%点щит_，同时超载期间自身受到的урон_снижено15%_。\n\n

_+4：_维护完成后给予自身和所有дрон_макс. HP15%点щит_，同时超载期间自身受到的урон_снижено20%_。
actors.hero.talent.strong_perserve.comment=

actors.hero.abilities.dm400.discharge_gas.name=Сброс выхлопных газов
actors.hero.abilities.dm400.discharge_gas.short_desc=DM-400 осуществляет IT000, выделяя вредные газы, накапливающиеся в организме.
actors.hero.abilities.dm400.discharge_gas.desc=DM-400 может изгнать накопленный выхлопной газ из организма на долгое время, распыляя кучу ядовитого газа на всех врагов в поле зрения, а также удаляя все свои собственные дебаффы.\ n\ nЕсли в поле зрения нет врагов, только удалите все свои собственные дебаффы, не выпуская ядовитый газ.\ n\ nОсновное количество выхлопных газов: IT000
actors.blobs.discharge_gas$dm400gas.name=Механические отработанные газы
actors.blobs.discharge_gas$dm400gas.desc=Здесь свернут участок зеленоватого механического выхлопа. DM-400 и его дроны игнорируют этот газовый эффект.
actors.hero.talent.over_time.title=长期积累
actors.hero.talent.over_time.desc=_+1：_每团喷射出去的Токсичный газ气体量увеличено_15%_。\n\n

_+2：_每团喷射出去的Токсичный газ气体量увеличено_30%_。\n\n

_+3：_每团喷射出去的Токсичный газ气体量увеличено_45%_。\n\n

_+4：_每团喷射出去的Токсичный газ气体量увеличено_60%_。
actors.hero.talent.over_time.comment=
actors.hero.talent.deadly_gas.title=致命气体
actors.hero.talent.deadly_gas.desc=_+1：_DM-400喷射出去的毒气_伤害+1_。\n\n_+2：_DM-400喷射出去的毒气_伤害+2_。\n\n_+3：_DM-400喷射出去的毒气_伤害+3_。\n\n_+4：_DM-400喷射出去的毒气_伤害+4_。
actors.hero.talent.deadly_gas.comment=
actors.hero.talent.discharge_happy.title=排气舒畅
actors.hero.talent.discharge_happy.desc=_+1：_DM-400在喷射Токсичный газ之后получает_2ходов极速_。\n\n

_+2：_DM-400在喷射Токсичный газ之后получает_4ходов极速_。\n\n

_+3：_DM-400在喷射Токсичный газ之后получает_6ходов极速_。\n\n

_+4：_DM-400在喷射Токсичный газ之后получает_8ходов极速_。
actors.hero.talent.discharge_happy.comment=

actors.hero.abilities.dm400.honeycomb.name=Сотовый кластер
actors.hero.abilities.dm400.honeycomb.short_desc=DM-400 запускает программу IT000, которая предоставляет бонус хозяину при уничтожении дрона.
actors.hero.abilities.dm400.honeycomb.desc=DM-400 запускает программу роя ульев. Каждый раз, когда дрон уничтожается на 20 ходов, он исцеляет DM-400 на 4% от его максимального здоровья и дает заряд артефакта на 2 хода.
actors.hero.abilities.dm400.honeycomb$honeycombbuff.name=Процедура кластера
actors.hero.abilities.dm400.honeycomb$honeycombbuff.desc=DM-400 выполняет эту процедуру, и аффилированные дроны будут обмениваться данными с мэйнфреймом.\ n\ nВо время выполнения процедуры все аффилированные дроны будут передавать данные мэйнфрейму в случае повреждения, чтобы поддерживать DM-400 в живых и ускорять генерацию новых дронов.\ n\ nКоличество оставшихся раундов: %s раундов
actors.hero.talent.process_extend.title=进程延续
actors.hero.talent.process_extend.desc=_+1：_集群程序启动期间，每有один架дрон被摧毁都会使程序的有效时间_продление0.5ходов_。\n\n

_+2：_集群程序启动期间，每有один架дрон被摧毁都会使程序的有效时间_продление1ходов_。\n\n

_+3：_集群程序启动期间，每有один架дрон被摧毁都会使程序的有效时间_продление1.5ходов_。\n\n

_+4：_集群程序启动期间，每有один架дрон被摧毁都会使程序的有效时间_продление2ходов_。
actors.hero.talent.process_extend.comment=
actors.hero.talent.glorious_dead.title=光荣牺牲
actors.hero.talent.glorious_dead.desc=_+1：_集群程序启动期间，每有один架дрон被摧毁都会为DM-400восстановление_макс. HP4.5%_的жизнь。\n\n

_+2：_集群程序启动期间，每有один架дрон被摧毁都会为DM-400восстановление_макс. HP5%_的жизнь。\n\n

_+3：_集群程序启动期间，每有один架дрон被摧毁都会为DM-400восстановление_макс. HP5.5%_的жизнь。\n\n

_+4：_集群程序启动期间，每有один架дрон被摧毁都会为DM-400восстановление_макс. HP6%_的жизнь。
actors.hero.talent.glorious_dead.comment=
actors.hero.talent.upon_wave.title=前赴后继
actors.hero.talent.upon_wave.desc=_+1：_集群程序启动期间，每有один架дрон被摧毁都会为DM-400给予_3ходовзаряд артефакта_。\n\n

_+2：_集群程序启动期间，每有один架дрон被摧毁都会为DM-400给予_4ходовзаряд артефакта_。\n\n

_+3：_集群程序启动期间，每有один架дрон被摧毁都会为DM-400给予_5ходовзаряд артефакта_。\n\n

_+4：_集群程序启动期间，每有один架дрон被摧毁都会为DM-400给予_6ходовзаряд артефакта_。
actors.hero.talent.upon_wave.comment=

actors.hero.abilities.freeman.salescontract.name=Акт купли-продажи
actors.hero.abilities.freeman.salescontract.short_desc=Джентльмен околдовал врага, чтобы подписать IT000, заставив врага подчиниться его службе на всю жизнь.
actors.hero.abilities.freeman.salescontract.desc=Джентльмен может использовать универсальный язык монстров, который он выучил из ниоткуда, чтобы убедить своего врага (конечно, это зависит в основном от силы короны) подписать с ним договор купли-продажи, что заставляет врага, который подписывает контракт, работать на него всю жизнь.\ n\ nКонечно, слова и трюки джентльмена явно не могут убедить всех, или монстры, боссы, мелкие боссы, элиты и союзники откажутся подписывать с ним контракт.
actors.hero.abilities.freeman.salescontract$saleself.name=Пожизненный солдат
actors.hero.abilities.freeman.salescontract$saleself.desc=Этот враг был продан джентльмену безоговорочно джентльменом и теперь работает на джентльмена.\ n\ nОчевидно, что враг, подписавший контракт, не может подписать контракт снова, и не может положить на него следующую жизнь?
actors.hero.abilities.freeman.salescontract$workerwraith.name=Призрак работника
actors.hero.abilities.freeman.salescontract$workerwraith.desc=С обиженным рабочим (монстром), замаскированным под дух обиды, хотя его тело мертво, он все равно должен работать на джентльмена в соответствии с содержанием контракта.\ n\ nБедняжка действительно будет работать на джентльмена в течение двух жизней.
actors.hero.abilities.freeman.salescontract.self_target=Невозможно выбрать самостоятельно.
actors.hero.abilities.freeman.salescontract.no_target=Нет целей для подписания контракта.
actors.hero.abilities.freeman.salescontract.more_distance=Цель слишком далеко.
actors.hero.abilities.freeman.salescontract.strong_target=Цель отказывается подписывать с вами контракт и испытывает к вам презрение.
actors.hero.talent.elite_recruit.title=элитный招聘
actors.hero.talent.elite_recruit.desc=_+1：_签订契约时，绅士会дополнительно花费_200монеты_给予契约враг随机один种элитныйэффект。\n\n

_+2：_签订契约时，绅士会дополнительно花费_150монеты_给予契约враг随机один种элитныйэффект。\n\n

_+3：_签订契约时，绅士会дополнительно花费_100монеты_给予契约враг随机один种элитныйэффект。\n\n

_+4：_签订契约时，绅士会дополнительно花费_50монеты_给予契约враг随机один种элитныйэффект。
actors.hero.talent.elite_recruit.comment=
actors.hero.talent.prim_accu.title=原始积累
actors.hero.talent.prim_accu.desc=_+1：_签订契约的врагфизическийатака其他враг时会给予绅士_10монеты_。\n\n

_+2：_签订契约的врагфизическийатака其他враг时会给予绅士_20монеты_。\n\n

_+3：_签订契约的врагфизическийатака其他враг时会给予绅士_30монеты_。\n\n

_+4：_签订契约的врагфизическийатака其他враг时会给予绅士_40монеты_。
actors.hero.talent.prim_accu.comment=
actors.hero.talent.soul_contract.title=灵魂契约
actors.hero.talent.soul_contract.desc=_+1：_签订契约的враг死亡后_会化作один个腐化的打工鬼_，而绅士则通过契约上无人在意的细节部分因此получает原本应是打工鬼的工伤补偿金共_100монеты_。\n\n

_+2：_在+1的基础上，打工鬼的腐化эффект变为_终生卖命_эффект。\n\n

_+3：_在+1和+2的基础上，打工鬼还会получает_随机один种элитный_эффект。\n\n

_+4：_在+1，+2和+3的基础上，打工鬼的_макс. HP与其前生(原契约враг)相当_。
actors.hero.talent.soul_contract.comment=

actors.mobs.transformmimic.name=蜕变мимик
actors.mobs.transformmimic.desc=мимик是один种能随意改变外形的магическийбиологический。在подземелье里它们几乎один直以宝箱形态出现，因为这样总能吸引疏于防备的冒险家。\n\n蜕变мимик是蜕变свиток受到某种邪恶сила化形而成的мимик。它们的攻防能力与普通мимик别无два致，只是总会装着蜕变свиток而不会有其他战利品。
actors.mobs.transformmimic.reveal=那里有один个мимик！
actors.mobs.transformmimic.hidden_name=紫色宝箱？
actors.mobs.transformmimic.hidden_desc=打开前你是看不见里面有什么的！\n\n这个紫色的宝箱看起来与常见的宝箱有很大差异，还是不要贸然打开为好。
actors.mobs.transformmimic.discover_hint=你可在开启特定挑战后在任何подземелье区域发现该враг。

actors.hero.heroclass.princess=Карликовая принцесса
actors.hero.heroclass.princess_desc_short=Карликовая принцесса несет IT000, который может хранить чары и гравюры. В то же время она также может потреблять несколько точек алхимической энергии для преобразования любого рунического камня IT001.
actors.hero.heroclass.princess_desc=Карликовая принцесса изначально несет IT000, который может хранить чары и гравюры, такие как оружие и доспехи, и действовать непосредственно на них.\ n\ nКарликовая принцесса может напрямую использовать любой рунный камень IT001, который требует 8 алхимической энергии.\ n\ nВ то же время, карликовая принцесса первоначально несет IT002, IT003, тканевые доспехи, водяные мешки и бархатные мешки.\ n\ nОткрывающиеся предметы идентификации карликовой принцессы:\ nIT004 Плавающее зелье\ nIT005 Свиток трансформации, Свиток идентификации и Свиток мести
actors.hero.heroclass.princess_unlock=_在一场游戏中击败矮人国王_以解锁矮人公主。
actors.hero.talent.enchant_meal.title=盛魔один餐
actors.hero.talent.enchant_meal.desc=_+1：_进食会使дварфийская принцессафизическийоружие上的чары或проклятие的触发вероятностьувеличено，使得之后的_3次атака_拥有1.33倍触发вероятность。\n\n

_+2：_进食会使дварфийская принцессафизическийоружие上的чары或проклятие的触发вероятностьувеличено，使得之后的_5次атака_拥有1.33倍触发вероятность。
actors.hero.talent.enchant_meal.comment=若снаряжение着的王储之戒拥有чары，则该талант也能够对徒手атака、本身不带有чары的оружие或метательное оружие生效。\n\n“我有没有告诉过你，吃的越饱，奥术能量就会越强？”
actors.hero.talent$enchantmeal.name=附魔强化
actors.hero.talent$enchantmeal.desc=你接下来的数次物理攻击触发附魔的概率提升。\n\n剩余次数：%1$d
actors.hero.talent.mana_sense.title=魔能感知
actors.hero.talent.mana_sense.desc=_+1：_дварфийская принцесса鉴定带有чары与гравировка的оружие与броня的скоростьувеличено至原来的_5倍_。\n\n

_+2：_дварфийская принцесса能在_снаряжение带有чары与гравировка的оружие与броня时_将其直接鉴定。
actors.hero.talent.mana_sense.comment=“就如我在课上常说的那样，你天生便对奥术能量有着最为敏锐的感知能力。”
actors.hero.talent.rune_blade.title=符文利刃
actors.hero.talent.rune_blade.desc=_+1：_дварфийская принцесса使用带有чары的физическийоружиеатака时将附带_1点магическийурон_。\n\n

_+2：_дварфийская принцесса使用带有чары的физическийоружиеатака时将附带_2点магическийурон_。
actors.hero.talent.rune_blade.comment=若снаряжение着的王储之戒拥有чары，则该талант也能够对徒手атака、本身不带有чары的оружие或метательное оружие生效。\n\n“过溢的奥术能量会化为实质的魔力。”
actors.hero.talent.arcane_shield.title=奥术护体
actors.hero.talent.arcane_shield.desc=_+1：_受到攻击时，若矮人公主装备着的护甲带有刻印，则立即获得_2点护盾_。\n\n_+2：_受到攻击时，若矮人公主装备着的护甲带有刻印，则立即获得_3点护盾_。
actors.hero.talent.arcane_shield.comment=该天赋_有20回合冷却_。\n\n若装备着的王储之戒拥有刻印，则该天赋也能够对无甲防御、本身不带有刻印的护甲生效。\n\n“过溢的奥术能量会保护你。”
actors.hero.talent$arcaneshieldcooldown.name=奥术护体-冷却
actors.hero.talent$arcaneshieldcooldown.desc=你刚刚发动过这个天赋，需要稍等才能再次发动。\n\n剩余冷却：%s回合
actors.hero.talent.royal_meal.title=皇家礼宴
actors.hero.talent.royal_meal.desc=_+1：_дварфийская принцесса进食只花费1ходов，并在进食后的10ходов内使王储之戒_увеличено1级_。\n\n

_+2：_дварфийская принцесса进食只花费1ходов，并在进食后的10ходов内使王储之戒_увеличено2级_。
actors.hero.talent.royal_meal.comment=如果背包内没有王储之戒，则该талант会在_+1/+2_уровень时使所有戒指在_5/10ходов_内увеличено1级。\n\n“高雅人士用餐。”
actors.hero.talent$royalmeal.name=皇家礼宴
actors.hero.talent$royalmeal.desc=矮人公主在进食后强化了她的王储之戒，使其获得额外等级。\n\n若背包内没有王储之戒，则该效果会改为使所有戒指获得额外等级。\n\n剩余回合数：%s回合
actors.hero.talent.rune_expert.title=符石专家
actors.hero.talent.rune_expert.desc=_+1：_дварфийская принцесса将任意符石转换为чары符石所需的алхимическая энергияпотребляет_уменьшено2点_。\n\n

_+2：_дварфийская принцесса将任意符石转换为чары符石所需的алхимическая энергияпотребляет_уменьшено4点_。
actors.hero.talent.rune_expert.comment=“宫廷чары师对你的教导仍记忆犹新，你对符石的转换已经像呼吸один样简单了。”
actors.hero.talent.rune_expert.meta_desc=_如果这个талант被其他геройполучает_，那么它会在+1/+2уровень时使свиток在炼金釜中分解得到的符石数量+1/+2。
actors.hero.talent.str_rune.title=强力符文
actors.hero.talent.str_rune.desc=_+1：_дварфийская принцесса使用чары符石时会在随机级别的基础上увеличеноодин个_普通级别_的选项。\n\n

_+2：_дварфийская принцесса使用чары符石时会在随机级别的基础上увеличеноодин个_稀有级别_的选项。\n\n

_+3：_дварфийская принцесса使用чары符石时会在随机级别的基础上увеличеноодин个_普通级别_和один个_稀有级别_的选项。
actors.hero.talent.str_rune.comment=
actors.hero.talent.more_ring.title=更多戒指
actors.hero.talent.more_ring.desc=_+1：_дварфийская принцесса可将_王储之戒_снаряжение在артефакт栏位上。\n\n

_+2：_дварфийская принцесса可将_任意戒指_снаряжение在артефакт栏位上。
actors.hero.talent.more_ring.comment=若该талант在生效后被蜕变，则会自动将已经снаряжение在артефакт栏位上的戒指取下。\n\n“真是个喜爱首饰的家伙。”
actors.hero.talent.more_ring.meta_desc=_如果这个талант被其他геройполучает_，那么它会在+1уровень时能够不потребляетходов的装卸任意戒指，在+2уровень时可将任意戒指снаряжение在артефакт栏位上。
actors.hero.talent.mana_wreath.title=魔能裹身
actors.hero.talent.mana_wreath.desc=_+1：_дварфийская принцесса使用带有чары的физическийоружие击杀враг后получает_每5ходов_衰减один次的0~10点奥术броня。\n\n

_+2：_дварфийская принцесса使用带有чары的физическийоружие击杀враг后получает_每10ходов_衰减один次的0~10点奥术броня。
actors.hero.talent.mana_wreath.comment=若снаряжение着的王储之戒拥有чары，则该талант也能够对徒手атака、本身不带有чары的оружие或метательное оружие生效。\n\n“过溢的奥术能量也可化作抵御магическийатака的奥术броня。”
actors.hero.talent.magic_arrow.title=锐利魔矢
actors.hero.talent.magic_arrow.desc=_+1：_дварфийская принцесса使用带有чары的метательное оружиеатака时，урон_увеличено15%_。\n\n

_+2：_дварфийская принцесса使用带有чары的метательное оружиеатака时，урон_увеличено30%_。
actors.hero.talent.magic_arrow.comment=若снаряжение着的王储之戒拥有чары，则该талант也能够对本身不带有чары的метательное оружие生效。\n\n若持有灵能弓等特殊метательное оружие的геройполучает该талант，则带有чары的特殊метательное оружие也会享受该талант的加成。\n\n“将奥术能量集中于箭矢之上，便会拥有更强的威力。”
actors.hero.talent.ring_bond.title=戒指联结
actors.hero.talent.ring_bond.desc=_+1：_若дварфийская принцесса背包内的其他戒指уровень低于王储之戒，则получает_1级дополнительноуровень_。\n\n

_+2：_若дварфийская принцесса背包内的其他戒指уровень低于王储之戒，则получает_2级дополнительноуровень_。\n\n

_+3：_若дварфийская принцесса背包内的其他戒指уровень低于王储之戒，则получает_3级дополнительноуровень_。
actors.hero.talent.ring_bond.comment=该талант提供的дополнительноуровень不会超出王储之戒的уровень。
actors.hero.talent.ring_bond.meta_desc=_如果这个талант被其他геройполучает_，那么它会在+1/+2/+3уровень时使多个相同戒指的联结эффектдополнительноувеличено1/2/3级。

actors.hero.herosubclass.runemage=符文法师
actors.hero.herosubclass.runemage_short_desc=_符文法师_在进行带有正面附魔的物理攻击后将为角色施加符文印记。符文印记可被法杖施法引爆并会根据附魔产生特殊的效果。
actors.hero.herosubclass.runemage_desc=符文法师在进行带有正面附魔的物理攻击后将为角色施加符文印记。施加的符文印记将会存储对应的附魔信息，存有的附魔数量即为对应的印记层数，这一印记会在受到法杖施法影响时引爆。\n\n符文法师在使用法杖引爆符文印记后，会对3x3范围的所有敌人造成印记层数x5的额外伤害，同时还会根据印记存储的附魔产生特殊的效果。

actors.buffs.runemark.name=Метка руны
actors.buffs.runemark.desc=Маг Рун уже запечатлел цель силой чар. Он производит взрыв при попадании заклинания, которое только наносит дополнительный магический урон врагам, не затрагивая Мага Рун или его союзников и не повреждая окружающую среду или объекты.\ n\ nЭта отметка будет оставаться до тех пор, пока заклинание не сработает или цель не умрет.\ n\ nДля отметки хранятся следующие чары:
actors.buffs.runemark$runesurge.name=Рунный всплеск
actors.buffs.runemark$runesurge.desc=Чары, вызванные Магом Рун в течение следующего периода времени, будут усилены.\ n\ nОсталось раундов: %s

actors.hero.talent.darkmark.title=黑暗印记
actors.hero.talent.darkmark.desc=_+1：_符文法师在施加符文印记的同时还会施加_3回合的幻惑_。\n\n_+2：_符文法师在施加符文印记的同时还会施加_3回合的幻惑和易伤_。\n\n_+3：_符文法师在施加符文印记的同时还会施加_3回合的幻惑、易伤和虚弱_。
actors.hero.talent.darkmark.comment=

actors.hero.talent.rune_blast.title=符文震爆
actors.hero.talent.rune_blast.desc=_+1：_符文маг施加的符文印记被引爆时会为所有посохвосстановление_印记этаж数x0.25点заряд_。\n\n

_+2：_在+1的基础上，符文маг施加的符文印记_可被引爆2次_，若第два次引爆使用了不同的посохзаклинание则_引爆урон+10_。\n\n

_+3：_在+1和+2的基础上，符文маг施加的符文印记_引爆областьувеличено至5x5_。
actors.hero.talent.rune_blast.comment=

actors.hero.talent.rune_surge.title=Рунный всплеск
actors.hero.talent.rune_surge.desc=_+1：_符文маг在引爆符文印记后的_10ходов_内，她的чарыэффектувеличено_33%_。\n\n

_+2：_符文маг在引爆符文印记后的_15ходов_内，她的чарыэффектувеличено_67%_。\n\n

_+3：_符文маг在引爆符文印记后的_20ходов_内，她的чарыэффектувеличено_100%_。
actors.hero.talent.rune_surge.comment=注意，该талант与奥术之戒的эффектодин样，仅会增幅оружиечары的原有эффект而不会增幅符文印记的引爆эффект。

actors.hero.herosubclass.combatmaster=格斗宗师
actors.hero.herosubclass.combatmaster_short_desc=_格斗宗师_的护甲刻印拥有额外的强力效果，同时还精通各种战斗姿态。
actors.hero.herosubclass.combatmaster_desc=格斗宗师能够更好的发挥护甲刻印的潜在力量，这赋予了她更多有关正面刻印的强力效果。格斗宗师同时还精通各种战斗姿态，这使她在近身战斗中会更具优势。\n\n格斗宗师一开始就会进入均衡姿态，在切换姿态时不会消耗回合，但在切换姿态后的6回合内再次切换姿态会因此陷入10回合的恍惚，并且期间无法再切换姿态。\n\n均衡姿态：小幅提升各项战斗能力与防御能力\n侵略姿态：提升各项战斗能力，但会削减一定的防御能力\n招架姿态：提升各项防御能力，但会削减一定的战斗能力\n\n该专精在可切换姿态时拥有一项特殊能力，同时拥有多项特殊能力时可长按快捷功能切换特殊能力。

actors.buffs.fightstance.balance_name=Жест равновесия
actors.buffs.fightstance.balance_desc=Боевой гроссмейстер находится в IT000. В этой позе ее боевые и оборонительные способности будут улучшены.
actors.buffs.fightstance.balance_desc1=Увеличивает урон от ближнего боя, защиту брони, точность и уклонение на 10%.
actors.buffs.fightstance.balance_desc2=Увеличивает урон от ближнего боя, защиту брони, точность и уклонение на 15%.
actors.buffs.fightstance.balance_desc3=Увеличивает урон от ближнего боя, защиту от брони, скорость атаки, скорость передвижения, точность и уклонение на 15%.
actors.buffs.fightstance.invasion_name=Агрессивный жест
actors.buffs.fightstance.invasion_desc=Боевой гроссмейстер находится в IT000, в этой позе ее боевые способности будут улучшены, но ее защитные способности будут уменьшены.
actors.buffs.fightstance.invasion_desc1=Увеличивает урон от ближнего боя на 20% и имеет 30% шанс выполнить вторую атаку (вторая атака обычно может вызвать чары на оружии), но уменьшает уклонение на 30%.
actors.buffs.fightstance.invasion_desc2=Увеличивает урон от ближнего боя на 30% и имеет 30% шанс выполнить вторую атаку (вторая атака обычно может вызвать чары на оружии), но уменьшает уклонение на 30%.
actors.buffs.fightstance.invasion_desc3=Увеличивает урон от ближнего боя на 30% и имеет 50% шанс выполнить вторую атаку (вторая атака обычно может вызвать чары на оружии), но уклоняется на 15%.
actors.buffs.fightstance.parry_name=Поза парирования
actors.buffs.fightstance.parry_desc=Боевой гроссмейстер находится в IT000, в этой позе ее различные оборонительные способности будут улучшены, но ее боевые способности будут уменьшены.
actors.buffs.fightstance.parry_desc1=Увеличивает защиту брони на 20% и получает заклинание каждые 30 ходов (этот эффект не суммируется и отменяется из-за переключения позы), но снижает собственную точность на 30%.
actors.buffs.fightstance.parry_desc2=Увеличивает защиту брони на 30% и получает заклинание каждые 30 ходов (этот эффект не суммируется и отменяется из-за переключения позы), но снижает собственную точность на 30%.
actors.buffs.fightstance.parry_desc3=Увеличивает защиту брони на 30% и получает заклинание каждые 20 ходов (этот эффект не суммируется и отменяется из-за переключения позы), но снижает точность на 15%.
actors.buffs.fightstance.duration=Боевой гроссмейстер поддерживал этот жест в течение %s хода (-ов).
actors.buffs.fightstance.action=Выберите позу, в которую вы хотите переключиться.
actors.buffs.fightstance$stabilize.name=Стабильная осанка
actors.buffs.fightstance$stabilize.desc=Вы только что переключили жесты один раз, поэтому лучше подождать, пока вы стабилизируетесь, прежде чем переключать жесты.\ n\ nПереключение жестов снова в следующий период времени займет больше времени, чтобы согласовать свой баланс, и вы не сможете переключать жесты снова.\ n\ nТакже вам нужно будет сделать %s оборотов, чтобы стабилизировать себя.
actors.buffs.fightstance$coordination.name=Координация жестов
actors.buffs.fightstance$coordination.desc=Вы только что совершили несколько постуральных переходов за короткий промежуток времени. Чтобы скоординировать баланс, потребуется некоторое время, прежде чем вы сможете снова менять позы.\ n\ nВам также потребуется потратить %s раундов, чтобы скоординировать баланс.
actors.buffs.fightstance$focus.name=Концентрат
actors.buffs.fightstance$focus.desc=Боевой гроссмейстер сосредоточен на всем, что ее окружает, и может предвидеть следующую атаку на нее. Находясь в состоянии концентрации, она наверняка будет парировать следующую входящую атаку.
actors.hero.talent.fluent.title=行云流вода
actors.hero.talent.fluent.desc=_+1：_мастер боевых искусств在短时间内进行多次切换стойка_不再会陷入恍惚_，但在10ходов内依旧不能切换стойка。\n\n

_+2：_在+1的基础上，мастер боевых искусств从均衡стойка切换至侵略стойка后会получает_5ходов极速_，而从均衡стойка切换至招架стойка后则会получает_20点щит_。\n\n

_+3：_在+1和+2的基础上，мастер боевых искусств从侵略стойка切换至均衡стойка后会получает_4ходовзаряд посоха_，而从招架стойка切换至均衡стойка后则会получает_4ходовзаряд артефакта_。
actors.hero.talent.fluent.comment=

actors.hero.talent.stance_mastery.title=стойка精通
actors.hero.talent.stance_mastery.desc=_+1：_мастер боевых искусств处于均衡стойка时，увеличено的各项能力эффект_увеличено5%_。\n\n

_+2：_在+1的基础上，мастер боевых искусств处于侵略стойка时的近战урон加成以及处于招架стойка时的бронязащита加成均_увеличено至30%_。\n\n

_+3：_在+1和+2的基础上，мастер боевых искусств处于均衡стойка时还会_увеличеноатакаскорость与скорость передвижения_，处于侵略стойка时的连击вероятность_увеличено至50%_，处于招架стойка时的凝神间隔_снижено至20ходов_，并且后两个стойка相应的负面影响均_снижено至15%_。
actors.hero.talent.stance_mastery.comment=

actors.hero.talent.inelement.title=游刃有余
actors.hero.talent.inelement.desc=_+1：_мастер боевых искусств处于任意стойка超过_20ходов_后，她的гравировкаэффектувеличено_33%_。\n\n

_+2：_мастер боевых искусств处于任意стойка超过_15ходов_后，她的гравировкаэффектувеличено_67%_。\n\n

_+3：_мастер боевых искусств处于任意стойка超过_10ходов_后，她的гравировкаэффектувеличено_100%_。
actors.hero.talent.inelement.comment=注意，该талант与奥术之戒的эффектодин样，仅会增幅бронягравировка的原有эффект而不会增幅мастер боевых искусств的дополнительноэффект。

actors.hero.abilities.princess.marchforward.name=Stride Meteor
actors.hero.abilities.princess.marchforward.short_desc=Карликовая принцесса IT000 продолжает маршировать, и каждый раз, когда она марширует, она будет становиться все быстрее и быстрее.
actors.hero.abilities.princess.marchforward.desc=Принцесса-карлик шагает вперед, увеличивая скорость своего движения на 50% и дополнительно на 5% за линию, максимум до 100%.\ n\ nЕсли Принцесса-карлик получает урон, этот эффект немедленно прерывается.
actors.hero.abilities.princess.marchforward$forward.name=Stride Meteor
actors.hero.abilities.princess.marchforward$forward.desc=Принцесса-карлик шагает вперед, увеличивая скорость передвижения на %1$s %% и дополнительно на 5% % за линию, до %2$s %%.\ n\ nЭтот эффект длится до тех пор, пока она не получит %3$d урона.
actors.hero.abilities.princess.marchforward.say=Это был план отсрочки!
actors.hero.talent.speedup.title=快马加鞭
actors.hero.talent.speedup.desc=_+1：_дварфийская принцесса的скорость передвижения加成及加成上限дополнительно_увеличено12.5%_。\n\n

_+2：_дварфийская принцесса的скорость передвижения加成及加成上限дополнительно_увеличено25%_。\n\n

_+3：_дварфийская принцесса的скорость передвижения加成及加成上限дополнительно_увеличено37.5%_。\n\n

_+4：_дварфийская принцесса的скорость передвижения加成及加成上限дополнительно_увеличено50%_。
actors.hero.talent.speedup.comment=

actors.hero.talent.run_attack.title=跑攻之法
actors.hero.talent.run_attack.desc=_+1：_дварфийская принцесса在这одинсостояние下的физическийатака有_7.5%вероятность_不потребляетходов。\n\n

_+2：_дварфийская принцесса在这одинсостояние下的физическийатака有_15%вероятность_不потребляетходов。\n\n

_+3：_дварфийская принцесса在这одинсостояние下的физическийатака有_22.5%вероятность_不потребляетходов。\n\n

_+4：_дварфийская принцесса在这одинсостояние下的физическийатака有_30%вероятность_不потребляетходов。
