actors.hero.herosubclass.waterslime=水灵史莱姆
actors.hero.herosubclass.waterslime_short_desc=_水灵史莱姆_拥有更高的最大生命值，并且在受到物理攻击后能够分裂出史莱姆粘液，将其吸收能够恢复一定生命。
actors.hero.herosubclass.waterslime_desc=水灵史莱姆会额外获得当前等级50%的最大生命值，同时她还拥有最大生命值1%的自然生命回复倍率(最少为1)。\n\n水灵史莱姆在受到物理攻击后会失去当前生命值10%的生命并在周围9x9的方形范围内随机分裂出一块史莱姆粘液，可以通过吸收这块粘液以恢复最大生命值10%的生命。\n\n分裂出史莱姆粘液时至少会消耗1点生命(不会导致水灵史莱姆死亡)，每次生成后都有30回合的冷却时间，受到攻击会减少1回合的冷却时间。
actors.hero.talent.water_body.title=вода灵之体
actors.hero.talent.water_body.desc=_+1：_вода灵史莱姆дополнительнополучает_当前уровень100%_的макс. HP。\n\n

_+2：_вода灵史莱姆дополнительнополучает_当前уровень150%_的макс. HP。\n\n

_+3：_вода灵史莱姆дополнительнополучает_当前уровень200%_的макс. HP。
actors.hero.talent.water_body.comment=
actors.hero.talent.water_revival.title=вода灵Восстановление
actors.hero.talent.water_revival.desc=_+1：_вода灵史莱姆吸收史莱姆粘液能够восстановление_макс. HP12.5%_的жизнь。\n\n

_+2：_вода灵史莱姆吸收史莱姆粘液能够восстановление_макс. HP15%_的жизнь。\n\n

_+3：_在+2的基础上，вода灵史莱姆分裂出史莱姆粘液仅потребляет_当前HP5%_的жизнь。
actors.hero.talent.water_revival.comment=
actors.hero.talent.water_regeneration.title=вода灵强愈
actors.hero.talent.water_regeneration.desc=_+1：_вода灵史莱姆会拥有_макс. HP1.17%_的自然жизньвосстановление倍率(最少为1)。\n\n

_+2：_вода灵史莱姆会拥有_макс. HP1.33%_的自然жизньвосстановление倍率(最少为1)。\n\n

