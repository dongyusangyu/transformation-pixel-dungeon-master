actors.hero.talent.parasitism.title=寄生
actors.hero.talent.parasitism.desc=_+0：_враг死亡后将有_20%вероятность生成1只личинка Древнего Бога_。\n\n

_+1：_враг死亡后将有_10%вероятность生成1只личинка Древнего Бога_。\n\n

_+2：_враг死亡后不Восстановление成личинка Древнего Бога。
