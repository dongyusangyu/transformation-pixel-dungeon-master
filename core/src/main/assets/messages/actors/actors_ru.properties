actors.hero.abilities.friar.reasondose.short_desc=Монах вколол себе IT000, чтобы восстановить здравомыслие и снять панический эффект.
actors.hero.abilities.friar.reasondose.desc=Монах вводит себе инъекцию здравомыслия, восстанавливая 50 здравомыслия и немедленно снимая панический эффект.\ n\ nИнъекция не занимает много времени.
actors.hero.abilities.friar.reasondose.cast=Боль снимается в одно мгновение...

