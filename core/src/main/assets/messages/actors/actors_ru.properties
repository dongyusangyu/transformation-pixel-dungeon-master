actors.hero.talent$gascooldown.desc=你刚刚发动过这个天赋，需要稍等才能再次发动。\n\n剩余冷却：%s回合

actors.hero.talent.king_protect.title=王之加护
actors.hero.talent.king_protect.desc=_+1：_受到урон时有_75%вероятность_将урон转化为_отложенный урон_。\n\n

_+2：_受到урон时_必定_将урон转化为_отложенный урон_。
actors.hero.talent.king_protect.comment=

actors.hero.talent.summon_follower.title=王权призыв
actors.hero.talent.summon_follower.desc=_+1：_使用бронянавык时_призыв1个дварф-чародей或дварф-монах_为你作战。\n\n

_+2：_使用бронянавык时_призыв2个дварф-чародей或дварф-монах_为你作战。
actors.hero.talent.summon_follower.comment=

