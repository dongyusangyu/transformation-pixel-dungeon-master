actors.hero.spells.credulous.name=信仰背弃
actors.hero.spells.credulous.short_desc=获得持续一段时间的魔法免疫。
actors.hero.spells.credulous.desc=施法者将短暂放弃对魔法的感知，因此获得_10回合魔法免疫_。\n\n该法术施法_消耗1回合_。
actors.hero.spells.credulous.desc_instant=该法术在+2等级时施法_不耗时_。

actors.hero.talent.ravens_eye.title=乌鸦之眼
actors.hero.talent.ravens_eye.desc=_+1：_монах可以потребляет_30点рассудок_以检视物品有无проклятие。\n\n

_+2：_монах可以потребляет_20点рассудок_以检视物品有无проклятие。
actors.hero.talent.ravens_eye.comment=
actors.hero.talent.ravens_eye.meta_desc=_如果这个талант被其他геройполучает_，那么它会允许герой对物品进行检视，代价是получаеткровотечение。+1时получает原始值为6的кровотечение，+2时получает原始值为4的кровотечение。
actors.hero.talent.ravens_eye.action=检视


actors.hero.talent.crystal_gunpowder.title=晶体火药
actors.hero.talent.crystal_gunpowder.desc=_+1：_修士每拥有1点炼金能量，他的物理攻击就造成_1点额外伤害_。\n\n_+2：_修士每拥有1点炼金能量，他的物理攻击就造成_2点额外伤害_。
actors.hero.talent.crystal_gunpowder.comment=通过该天赋获得的额外伤害加成在_+1/+2_等级时不会超过_2/4点_。
actors.hero.talent.bulwark_greatshield.title=防壁巨盾
actors.hero.talent.bulwark_greatshield.desc=_+1：_修士装备拥有格挡的武器时，获得_10%物理伤害减免_。\n\n_+2：_修士装备拥有格挡的武器时，获得_15%物理伤害减免_。
actors.hero.talent.bulwark_greatshield.comment=拥有格挡的武器包括刺剑、臂盾、铁头棍、圆盾、武士刀和巨型方盾。

actors.hero.talent.whispering_meal.title=呓语один餐
actors.hero.talent.whispering_meal.desc=_+1：_монах进食只花费1ходов(食用安魂酊剂不花费ходов)，并对обзор内的враг造成_2ходов的страх_。\n\n

_+2：_монах进食只花费1ходов(食用安魂酊剂不花费ходов)，并对обзор内的враг造成_4ходов的страх_。
actors.hero.talent.whispering_meal.comment=
actors.hero.talent.liquid_barrier.title=液蕴屏障
actors.hero.talent.liquid_barrier.desc=_+1：_当монах饮用或投掷один瓶зелье、魔药或秘药时，他会получает_5ходов_的барьер очищения。\n\n

_+2：_当монах饮用或投掷один瓶зелье、魔药或秘药时，他会получает_10ходов_的барьер очищения。
actors.hero.talent.liquid_barrier.comment=如果使用的是силазелье、опытзелье或须用前述зелье炼制的炼金物品，则получает的барьер очищенияэффект时长翻倍。\n\n对产量较高的炼金物品(如вода爆魔药)，该талант会基于该物品的单次产出数量вероятность触发。
actors.hero.talent.fast_reload.title=快速装填
actors.hero.talent.fast_reload.desc=_+1：_монах为алхимический распылитель装填能量_不再потребляет时间_。\n\n

_+2：_在+1的基础上，монах在为алхимический распылитель装填能量后会получает_1ходов_的Тень(瞬间移动)。
actors.hero.talent.fast_reload.comment=
actors.hero.talent.fast_reload.meta_desc=_如果这个талант被其他геройполучает_，那么它会在герой使用液金修复метательное оружие的耐久时получаетТеньэффект。+1时получает1ходов，+2时получает2ходов。
actors.hero.talent.otherworld_bane.title=异魔克星
actors.hero.talent.otherworld_bane.desc=_+1：_монах击杀_нежить和демонсвойство_的враг后，получает_2ходов_的ясновидение。\n\n

_+2：_монах击杀_нежить和демонсвойство_的враг后，получает_3ходов_的ясновидение。
actors.hero.talent.otherworld_bane.comment=
actors.hero.talent.bullseye.title=正中靶心
actors.hero.talent.bullseye.desc=_+1：_修士向敌人投掷飞镖或涂药飞镖时拥有_50%额外精准_并会造成_3点额外伤害_。\n\n_+2：_修士向敌人投掷飞镖或涂药飞镖时拥有_75%额外精准_并会造成_5点额外伤害_。
actors.hero.talent.bullseye.comment=

actors.hero.talent.midas_touch.title=点金之手
actors.hero.talent.midas_touch.desc=_+1：_монах会получает_20瓶液金_，并可将液金转化为随机зелье。\n\n

_+2：_монах会получает_40瓶液金_，并可将液金转化为随机зелье。\n\n

_+3：_монах会получает_60瓶液金_，并可将液金转化为随机зелье。
actors.hero.talent.midas_touch.comment=液金不能转化为силазелье，转化出один瓶зелье总是потребляет_20瓶液金_。\n\n此类通过升级或蜕变以直接获取相应资源的талантобщий_26次ограничение срабатывания_(绅士为_39次_)。
actors.hero.talent.human_glory.title=人之光辉
actors.hero.talent.human_glory.desc=_+1：_当монах的рассудокснижено至0时，получаетдобродетель的вероятность从25%увеличено至_30%_。\n\n

_+2：_当монах的рассудокснижено至0时，получаетдобродетель的вероятность从25%увеличено至_35%_。\n\n

_+3：_当монах的рассудокснижено至0时，получаетдобродетель的вероятность从25%увеличено至_40%_。
actors.hero.talent.human_glory.comment=注意，добродетельвероятностьувеличено也意味着折磨вероятностьснижено，该талант在_+1/+2/+3_уровень时получает折磨的вероятность从75%снижено至_70/65/60%_。
actors.hero.talent.human_glory.meta_desc=_如果这个талант被其他геройполучает_，那么它会在+1/+2/+3уровень时使герой的точность和уклонениеувеличено10/20/30%。

actors.hero.herosubclass.alchemist=Алхимик
actors.hero.herosubclass.alchemist_short_desc=IT000 имеет более низкое потребление энергии алхимией при алхимии и использует более мощные алхимические пистолеты-распылители.
actors.hero.herosubclass.alchemist_desc=Алхимики более искусны в алхимии. Когда он создает алхимический продукт, который потребляет алхимическую энергию, его требуемая стоимость алхимической энергии снижается на 3 очка (будет потрачено не менее 1 очка).\ n\ nАлхимический пистолет-распылитель алхимика теперь наносит определенное количество магического урона и имеет больший диапазон распыления и более сильный эффект сборки зелья.\ n\ nЕсли включен IT000, его выбор без алхимического пистолета-распылителя дает алхимический пистолет-распылитель.

actors.hero.talent.alchemy_shield.title=炼金屏障
actors.hero.talent.alchemy_shield.desc=_+1：_炼金师炼金时的炼金能量消耗从减少3点变为_减少4点_，并在每次消耗炼金能量(包括装填喷枪)后获得_1层炼金屏障_。\n\n_+2：_炼金师炼金时的炼金能量消耗从减少3点变为_减少5点_，并在每次消耗炼金能量(包括装填喷枪)后获得_2层炼金屏障_。\n\n_+3：_炼金师炼金时的炼金能量消耗从减少3点变为_减少6点_，并在每次消耗炼金能量(包括装填喷枪)后获得_3层炼金屏障_。
actors.hero.talent.alchemy_shield.comment=炼金屏障会使得接下来的数次受击伤害根据已有的炼金能量降低，每次受击减少1层，最多叠加3层。
actors.hero.talent.close_blast.title=近距轰击
actors.hero.talent.close_blast.desc=_+1：_炼金师的炼金喷枪对距离越近的目标造成的伤害越高，最远距离不造成额外伤害，在此基础上每接近1格就造成_10%额外伤害_，至多造成_40%额外伤害_。\n\n_+2：_炼金师的炼金喷枪对距离越近的目标造成的伤害越高，最远距离不造成额外伤害，在此基础上每接近1格就造成_15%额外伤害_，至多造成_60%额外伤害_。\n\n_+3：_炼金师的炼金喷枪对距离越近的目标造成的伤害越高，最远距离不造成额外伤害，在此基础上每接近1格就造成_20%额外伤害_，至多造成_80%额外伤害_。
actors.hero.talent.close_blast.comment=
actors.hero.talent.conservation.title=节约风气
actors.hero.talent.conservation.desc=_+1：_炼金师的炼金喷枪在喷射时会有_10%概率_不消耗药液，并且在装配药剂后还会有_30%概率_不消耗药剂。\n\n_+2：_炼金师的炼金喷枪在喷射时会有_20%概率_不消耗药液，并且在装配药剂后还会有_45%概率_不消耗药剂。\n\n_+3：_炼金师的炼金喷枪在喷射时会有_30%概率_不消耗药液，并且在装配药剂后还会有_60%概率_不消耗药剂。
actors.hero.talent.conservation.comment=该天赋在生效装配药剂的效果时，喷枪的药液余量仍会正常得到补充，而力量药剂则始终不消耗也不补充药液余量。
actors.hero.talent$alchemyshield.name=炼金屏障
actors.hero.talent$alchemyshield.desc=一层层由炼金能量构成的屏障环绕在你周围，为你阻挡来自敌人的攻击伤害。\n\n你每次消耗炼金能量就会形成一定层数的炼金屏障，最多不超过3层。在炼金屏障的保护下，你受到的任何来自敌人的物理伤害都会降低5点，并且当前每有1点炼金能量就额外降低1点，至多降低20点。\n\n以当前的炼金能量来看，你的每层炼金屏障都会降低%1$d点物理伤害。\n\n你现在还有%2$d层炼金屏障，每次受击都会消耗1层。

actors.hero.herosubclass.pious=虔信者
actors.hero.herosubclass.pious_short_desc=_虔信者_会获得一把仪式匕首，能快速使用并可用于回复或是减少部分理智。同时他会获得一个新的折磨以替代原先的所有折磨。
actors.hero.herosubclass.pious_desc=虔信者会获得一把仪式匕首，仪式匕首无需装备就能够直接使用。使用仪式匕首攻击会造成永久持续的血液礼品效果，拥有该效果的敌人在损失生命值时会为虔信者回复少量理智，并且每当虔信者击杀一定数量的敌人后就可以用其不消耗时间地进行一次必中的刺击。刺击时，选择刺向敌人会回复大量理智，而选择刺向自己则会减少大量理智。\n\n虔信者在理智降低至0时同样会获得折磨或是美德，不同的是，他能够获得一种新的折磨以替代原先的所有折磨。新折磨：狂喜，能够大幅提升自身造成的物理伤害以及攻击速度，代价是闪避属性大幅降低。\n\n该专精在仪式匕首可以刺击时拥有一项特殊能力，同时拥有多项特殊能力时可长按快捷功能切换特殊能力。若启用了_随机模式_，在未拥有理智能力的情况下，选择该专精会获得理智能力，但仅在与部分物品、环境等方面的互动保有一定的回复与减少效果，并且不可将之转化为炼金能量。

actors.buffs.suffering$ecstasy.name=Мучение: экстаз
actors.buffs.suffering$ecstasy.desc=Безумие, мой старый друг!\ n\ nВ течение этого испытания скорость вашей атаки увеличится на +50% %, а физический урон увеличится на +30% %, но вы увернетесь на -50% %.\ n\ nЭто испытание будет продолжаться еще %s раундов, и уничтожение врагов устранит это испытание быстрее.\ n\ nЕсли ваше здравомыслие вернется к нулю, вы умрете в бесконечном безумии.

actors.hero.talent.never_compromise.title=永不妥协
actors.hero.talent.never_compromise.desc=_+1：_虔信者处于_折磨或добродетельсостояние_时，受到致命урон不会直接死亡而是получает_濒死_эффект，同时会продление折磨或уменьшенодобродетель_50ходов_的持续时间。\n\n

_+2：_虔信者处于_折磨或добродетельсостояние_时，受到致命урон不会直接死亡而是получает_濒死_эффект，同时会продление折磨或уменьшенодобродетель_40ходов_的持续时间。\n\n

_+3：_虔信者处于_折磨或добродетельсостояние_时，受到致命урон不会直接死亡而是получает_濒死_эффект，同时会продление折磨或уменьшенодобродетель_30ходов_的持续时间。
actors.hero.talent.never_compromise.comment=濒死期间若折磨或добродетель依然存在，则每次受到致命урон都会сохранение1点жизнь并продление折磨或уменьшенодобродетель的持续时间，但仍会死于折磨期间рассудок归零导致的心力衰竭。在折磨或добродетель的持续时间结束后变为持续100ходов的重伤(部分свойствоснижено)。
actors.hero.talent.rewind_time.title=回溯时光
actors.hero.talent.rewind_time.desc=_+1：_虔信者在折磨期间的рассудок低于20点时，немедленновосстановление_30点рассудок_并清除已有的惊恐эффект。\n\n

_+2：_虔信者在折磨期间的рассудок低于20点时，немедленновосстановление_40点рассудок_并清除已有的惊恐эффект。\n\n

_+3：_虔信者在折磨期间的рассудок低于20点时，немедленновосстановление_50点рассудок_并清除已有的惊恐эффект。
actors.hero.talent.rewind_time.comment=该талант_有50ходовперезарядка_。
actors.hero.talent$rewindtimeused.name=回溯时光-冷却
actors.hero.talent$rewindtimeused.desc=你刚刚才从癫狂中得以喘息，需要过段时间才能再次触发该天赋。\n\n剩余冷却：%s回合
actors.hero.talent.bright_warrior.title=光明战士
actors.hero.talent.bright_warrior.desc=_+1：_虔信者在美德期间击杀敌人所能延长的美德的持续时间从3回合提升至_6回合_。\n\n_+2：_虔信者在美德期间击杀敌人所能延长的美德的持续时间从3回合提升至_9回合_。\n\n_+3：_虔信者在美德期间击杀敌人所能延长的美德的持续时间从3回合提升至_12回合_。
actors.hero.talent.bright_warrior.comment=

actors.hero.talent$dyingwill.name=濒死
actors.hero.talent$dyingwill.desc=你的生命已如风中残烛。\n\n好在强大的意志使你能够承受数次致命的伤害，但在折磨或美德的持续时间结束后，你会因此进入长时间的重伤状态。\n\n因折磨期间理智归零导致的心力衰竭死亡无法因此避免。
actors.hero.talent$dyingwill.get=强大的意志使你拒绝了死亡！
actors.hero.talent$dyingwill.heavy_wound=重伤
actors.hero.talent$dyingwill.heavy_wound_log=你感到有些不堪重负...
actors.hero.talent$heavywound.name=重伤
actors.hero.talent$heavywound.desc=你的身躯残破不堪。\n\n重伤期间，你造成的物理伤害-50%%，精准和闪避-30%%。\n\n距离身体完全恢复还需%s回合。

actors.hero.abilities.friar.concentratedpotion.name=Концентрированный агент
actors.hero.abilities.friar.concentratedpotion.short_desc=Культиватор может дополнительно оснастить распылитель алхимии IT000, пополняя баланс жидкости и укрепляя следующий распылитель.
actors.hero.abilities.friar.concentratedpotion.desc=Культиватор может оснастить свой алхимический пистолет-распылитель дополнительными концентрированными зельями, пополняя 6-точечный баланс жидкости и увеличивая эффект следующего спрея на 2 уровня.\ n\ nСборка концентрированного зелья занимает 1 ход.
actors.hero.abilities.friar.concentratedpotion.no_spraygun=Чтобы собрать концентрированное зелье, у вас должен быть пистолет-распылитель Alchemy.

actors.hero.talent.concentrated_essence.title=浓缩精华
actors.hero.talent.concentrated_essence.desc=_+1：_修士为炼金喷枪装配了浓缩药剂后，下一次喷射会额外触发_一种不同的随机装配效果_。\n\n_+2：_修士为炼金喷枪装配了浓缩药剂后，下一次喷射会额外触发_两种不同的随机装配效果_。\n\n_+3：_修士为炼金喷枪装配了浓缩药剂后，下一次喷射会额外触发_三种不同的随机装配效果_。\n\n_+4：_修士为炼金喷枪装配了浓缩药剂后，下一次喷射会额外触发_四种不同的随机装配效果_。
actors.hero.talent.concentrated_essence.comment=该天赋在已装配了液火药剂的情况下不会触发冰霜药剂的效果，反之亦然，两者都未装配则在随机多种效果时只会出现其中一种。
actors.hero.talent.reagent_enhancement.title=药液усиление
actors.hero.talent.reagent_enhancement.desc=_+1：_монах为алхимический распылитель装配了浓缩зелье后，下один次喷射эффект_увеличено3级_。\n\n

_+2：_монах为алхимический распылитель装配了浓缩зелье后，下один次喷射эффект_увеличено4级_。\n\n

_+3：_монах为алхимический распылитель装配了浓缩зелье后，下один次喷射эффект_увеличено5级_。\n\n

_+4：_монах为алхимический распылитель装配了浓缩зелье后，下один次喷射эффект_увеличено6级_。
actors.hero.talent.reagent_enhancement.comment=
actors.hero.talent.reuse_reagent.title=回收利用
actors.hero.talent.reuse_reagent.desc=_+1：_如果монах在药液余量高于6的情况下装配浓缩зелье，那么该次装配потребляет的заряд_уменьшено16%_。\n\n

_+2：_如果монах在药液余量高于6的情况下装配浓缩зелье，那么该次装配потребляет的заряд_уменьшено30%_。\n\n

_+3：_如果монах在药液余量高于6的情况下装配浓缩зелье，那么该次装配потребляет的заряд_уменьшено40%_。\n\n

_+4：_如果монах在药液余量高于6的情况下装配浓缩зелье，那么该次装配потребляет的заряд_уменьшено50%_。
