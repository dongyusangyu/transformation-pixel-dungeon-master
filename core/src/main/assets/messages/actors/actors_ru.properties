actors.hero.talent.holy_faith.title=圣光信仰
actors.hero.talent.holy_faith.desc=_+1：_геройполучает_свечение_эффект时，дополнительнополучает_5ходовблагословение和заряд посоха_。\n\n

_+2：_геройполучает_свечение_эффект时，дополнительнополучает_7ходовблагословение和заряд посоха_。\n\n

_+3：_геройполучает_свечение_эффект时，дополнительнополучает_9ходовблагословение、заряд посоха_和_4ходовзаряд артефакта_。
actors.hero.talent.holy_faith.comment=

actors.hero.talent.honey_fish.title=蜂蜜鱼缸
actors.hero.talent.honey_fish.desc=_+1：_扔出蜂蜜罐将原地появлениевода并生成один条гигантская пиранья代替金色蜜蜂，гигантская пиранья会получает_50ходовбешенство_。\n\n

_+2：_在+1的基础上，蜂蜜罐破碎位置дополнительно_触发один次вода爆魔药的эффект_。
actors.hero.talent.honey_fish.comment=通过该талантпоявление的гигантская пиранья也有可能被замена为фантомная пиранья，且都受负面талант_陆游_影响。\n\n“один个蓝色的不透明的鱼缸。”

actors.hero.talent.instant_refining.title=顷刻炼化
actors.hero.talent.instant_refining.desc=_+1：_当有враг死亡时，герой会有_40%вероятностьполучает1点алхимическая энергия_。\n\n

_+2：_当有враг死亡时，герой会有_60%вероятностьполучает1点алхимическая энергия_。
actors.hero.talent.instant_refining.comment=该талант的掉落同样受геройограничение уровня。\n\n“один把抓住，顷刻炼化。”

actors.hero.talent.changqi_bookstore.title=常启书室
actors.hero.talent.changqi_bookstore.desc=_+1：_阅读卷轴时有_30%概率获得1块随机符石_。\n\n_+2：_阅读卷轴时有_45%概率获得1块随机符石_。\n\n_+3：_阅读卷轴时有_60%概率获得1块随机符石_。
actors.hero.talent.changqi_bookstore.comment=该天赋不会获取附魔符石，可以通过阅读无序魔典触发，但获取资源的次数_限制为26次_(绅士为_39次_)且这一限制与大部分通过升级或蜕变以直接获取相应资源的天赋共享。

actors.hero.talent.ascension_curse.title=升天咒
actors.hero.talent.ascension_curse.desc=_+1：_圣典可以施放法术_升天咒_，消耗1点充能使自身_飘浮5回合_。\n\n_+2：_圣典可以施放法术_升天咒_，消耗1点充能使自身_飘浮8回合_。
actors.hero.talent.ascension_curse.comment=“飞起来！”

actors.hero.talent.divine_protection.title=神明庇佑
actors.hero.talent.divine_protection.desc=_+1：_Священная Книга可以施放заклинание_神明庇佑_，потребляет5点заряд使自身_无敌3ходов_。\n\n

_+2：_Священная Книга可以施放заклинание_神明庇佑_，потребляет5点заряд使自身_无敌5ходов_。
actors.hero.talent.divine_protection.comment=“我上头有人。”

actors.hero.talent.shepherd_intention.title=牧羊原旨
actors.hero.talent.shepherd_intention.desc=_+1：_Священная Книга可以施放заклинание_牧羊原旨_，потребляет3点заряд指定один处地点_появлениеодин小群магический绵羊_。\n\n

_+2：_Священная Книга可以施放заклинание_牧羊原旨_，потребляет3点заряд指定один处地点_появлениеодин群магический绵羊_。
actors.hero.talent.shepherd_intention.comment=“这些羊从何而来？”

actors.hero.talent.conversion_holy.title=圣法皈依
actors.hero.talent.conversion_holy.desc=_+1：_圣典可以施放法术_圣法皈依_，消耗5点充能_沉沦视野内的任意目标_。\n\n_+2：_在+1的基础上，给予目标_10回合赐福_。
actors.hero.talent.conversion_holy.comment=通过该法术沉沦的敌人不会产生掉落物。\n\n“加入神圣教会，加入神圣教会谢谢。”

actors.hero.talent.purifying_evil.title=净化邪恶
actors.hero.talent.purifying_evil.desc=_+1：_Священная Книга可以施放заклинание_净化邪恶_，потребляет3点заряд以_снятиецель身上的全部增益эффект_。\n\n

_+2：_在+1的基础上，还会_снятиецель身上的элитныйэффект_。\n\n

_+3：_在+1和+2的基础上，还能对_нежить和демонсвойство_的враг造成_20%героймакс. HP_的урон(对Bossэффект减半)。
actors.hero.talent.purifying_evil.comment=

actors.hero.talent.divine_storm.title=神力领域风暴
actors.hero.talent.divine_storm.desc=_+1：_Священная Книга可以施放заклинание_神力领域风暴_，потребляет3点заряд使цель位置появление_3x3область_，持续_10ходов_的Электрическое поле。\n\n

_+2：_Священная Книга可以施放заклинание_神力领域风暴_，потребляет3点заряд使цель位置появление_7x7область_，持续_20ходов_的Электрическое поле。\n\n

_+3：_在+2的基础上，还会появление_5x5область_，持续_5ходов_的Огонь。
actors.hero.talent.divine_storm.comment=

actors.hero.talent.genesis.title=创世纪
actors.hero.talent.genesis.desc=_+1：_Священная Книга可以施放заклинание_创世纪_，потребляет8点заряд_重置前两этаж的талант点_。\n\n

_+2：_Священная Книга可以施放заклинание_创世纪_，потребляет8点заряд_重置全部талант点_。
actors.hero.talent.genesis.comment=“于是один切开始倒转了。”

actors.hero.talent.indulgence.title=赎罪券
actors.hero.talent.indulgence.desc=_+1：_Священная Книга可以施放заклинание_赎罪券_，потребляет_200монеты_以восстановление1点заряд Священной Книги。\n\n

_+2：_Священная Книга可以施放заклинание_赎罪券_，потребляет_150монеты_以восстановление1点заряд Священной Книги。
actors.hero.talent.indulgence.comment=该заклинание对Священная Книга拓本не действует。\n\n“悔恨了。”

actors.hero.talent.silver_language.title=银光锐语
actors.hero.talent.silver_language.desc=_+1：_Священная Книга可以施放заклинание_银光锐语_，потребляет2点заряд给予цель_3ходовбешенство_。\n\n

_+2：_Священная Книга可以施放заклинание_银光锐语_，потребляет2点заряд给予цель_5ходовбешенство_。
actors.hero.talent.silver_language.comment=“谁能想到Священная Книга上还有如此粗鄙之语？”

actors.hero.talent.resurrection.title=复活术
actors.hero.talent.resurrection.desc=_+1：_Священная Книга可以施放заклинание_复活术_，потребляет8点заряд给予自身或союзник_5ходов死者苏生_эффект，在该эффект持续期间内死亡会立刻复活。\n\n

_+2：_Священная Книга可以施放заклинание_复活术_，потребляет8点заряд给予自身或союзник_10ходов死者苏生_эффект，在该эффект持续期间内死亡会立刻复活。\n\n

_+3：_Священная Книга可以施放заклинание_复活术_，потребляет8点заряд给予自身或союзник_10ходов死者苏生_эффект，在该эффект持续期间内死亡会立刻复活并получает_20ходовблагословение_эффект。
actors.hero.talent.resurrection.comment=该заклинание对союзник施放则复活时会是最佳состояние，对герой自身施放则复活时至多восстановление1点HP。

actors.hero.talent.bone_fire.title=蚀骨之火
actors.hero.talent.bone_fire.desc=_+0：_产生的_火焰不会自然熄灭_，角色受到火焰伤害时烧坏道具的_概率翻倍_。\n\n_+1：_产生的_火焰不会自然熄灭_。\n\n_+2：_产生的火焰会正常熄灭。
actors.hero.talent.bone_fire.comment=

actors.hero.talent.jump_face_silicone.title=跳脸硅胶
actors.hero.talent.jump_face_silicone.desc=_+0：_враг苏醒时получает_2ходовпузырь времени_。\n\n

_+1：_враг苏醒时получает_1ходовпузырь времени_。\n\n

_+2：_враг苏醒时不再получаетпузырь времени。
actors.hero.talent.jump_face_silicone.comment=“哇袄！”\n\n_霜晨_

actors.hero.talent.grass_mob.title=草木皆兵
actors.hero.talent.grass_mob.desc=_+0：_высокая трава被破坏时有_20%вероятность生成1只гнилое щупальце_。\n\n

_+1：_высокая трава被破坏时有_10%вероятность生成1只гнилое щупальце_。\n\n

_+2：_высокая трава被破坏时不Восстановление成гнилое щупальце。
actors.hero.talent.grass_mob.comment=

actors.hero.talent.disaster_curse.title=灾厄проклятие
actors.hero.talent.disaster_curse.desc=_+0：_враг对герой造成近战урон时有_50%вероятность给予1ходовзамедление和ослабление_。\n\n

_+1：_враг对герой造成近战урон时有_25%вероятность给予1ходовзамедление和ослабление_。\n\n

_+2：_враг对герой造成近战урон时不再给予замедление和ослабление。
actors.hero.talent.disaster_curse.comment=

actors.hero.talent.ashes_bow.title=灰烬之弓
actors.hero.talent.ashes_bow.desc=_+1：_投掷武器造成伤害时给予_1回合燃烧_。\n\n_+2：_投掷武器造成伤害时给予_2回合燃烧_。\n\n_+3：_投掷武器造成伤害时给予_3回合燃烧_。
actors.hero.talent.ashes_bow.comment=该天赋_有15回合冷却_。\n\n若持有灵能弓等特殊投掷武器的英雄获得该天赋，则特殊投掷武器也会享受该天赋的加成。
actors.hero.talent$ashesbowcooldown.name=灰烬之弓-冷却
actors.hero.talent$ashesbowcooldown.desc=你刚刚发动过这个天赋，需要稍等才能再次发动。\n\n剩余冷却：%s回合

actors.hero.talent.swift_church.title=速行蓟神教
actors.hero.talent.swift_church.desc=_+1：_получает_1根Восстановлениепосох_。\n\n

_+2：_在+1的基础上(不包括获取资源)，处于_пузырь временисостояние_下атака将会使пузырь времени_уменьшено5ходов_而不是немедленно结束пузырь времениэффект。\n\n

_+3：_处于_пузырь временисостояние_下атака将会使пузырь времени_уменьшено3ходов_而不是немедленно结束пузырь времениэффект。
actors.hero.talent.swift_church.comment=此类通过升级或蜕变以直接获取相应资源的талантобщий_26次ограничение срабатывания_(绅士为_39次_)。\n\n“有个恐怖紫衣女凑出无限четыреходов打败最后один区Boss，你知道她是谁。”\n\n_——学有所长_

actors.hero.talent.protect_curse.title=проклятие护体
actors.hero.talent.protect_curse.desc=_+1：_проклятие的оружие和броня会получает_1级дополнительноуровень_。\n\n

_+2：_проклятие的оружие和броня会получает_2级дополнительноуровень_。
actors.hero.talent.protect_curse.comment=“现在真的是咒多不压身了。”

actors.hero.talent.potential_energy.title=势能转换
actors.hero.talent.potential_energy.desc=_+1：_герой坠入深渊后不再получаетувечьеэффект，而是получает_3ходов极速_эффект。\n\n

_+2：_герой坠入深渊后不再получаетувечьеэффект，而是получает_5ходов极速_эффект。
actors.hero.talent.potential_energy.comment=“подземелье闪电战。”

actors.hero.talent.nirvana.title=涅槃
actors.hero.talent.nirvana.desc=_+1：_自身_горение_эффект结束后，получает_自身уровень/2的восстановление HP_。\n\n

_+2：_在+1的基础上，处于_горениесостояние_下атакавраг会施加_3ходовгорение_。
actors.hero.talent.nirvana.comment=“无惧蚀骨之火。”

actors.hero.talent.insinuation.title=含沙射影
actors.hero.talent.insinuation.desc=_+1：_对睡眠состояние下的биологическийзаклинание将дополнительно施加_3ходовотравление_эффект。\n\n

_+2：_对睡眠состояние下的биологическийзаклинание将дополнительно施加_5ходовотравление_эффект。
actors.hero.talent.insinuation.comment=“含沙射人影，虽病人不知。巧言构人罪，至死人不疑。”

actors.hero.talent.auto_pick.title=自动拾取
actors.hero.talent.auto_pick.desc=_+1：_拾取物品耗时降低为正常的_50%_。\n\n_+2：_拾取物品_不再耗时_。
actors.hero.talent.auto_pick.comment=“谁把我自动拾取开了？”

actors.hero.talent.hand_slip.title=手滑点错
actors.hero.talent.hand_slip.desc=_+0：_移动后的下одинходов受到的уронувеличено_50%_。\n\n

_+1：_移动后的下одинходов受到的уронувеличено_25%_。\n\n

_+2：_移动后不再увеличено受到的урон。
actors.hero.talent.hand_slip.comment=“这把稳了。”\n\n_彩玉_

actors.hero.talent.hand_destruction.title=溃决之手
actors.hero.talent.hand_destruction.desc=_+1：_физическийатака可以直接_秒杀_不具有死神抗性且HP_低于5%_的цель。\n\n

_+2：_физическийатака可以直接_秒杀_不具有死神抗性且HP_低于10%_的цель。\n\n

_+3：_физическийатака可以直接_秒杀_不具有死神抗性且HP_低于15%_的цель。
actors.hero.talent.hand_destruction.comment=

actors.hero.talent.predictive_lover.title=预知秘卷爱好者
actors.hero.talent.predictive_lover.desc=_+1：_阅读预知秘卷时_дополнительно鉴定1种物品_。\n\n

_+2：_阅读预知秘卷时_дополнительно鉴定2种物品_。
actors.hero.talent.predictive_lover.comment=该талант可以通过阅读无序魔典中的预知秘卷触发。\n\n“诸君，我喜欢戒指。”

actors.hero.talent.fire_ball.title=火球术
actors.hero.talent.fire_ball.desc=_+1：_对可燃地格заклинание时会在该地格释放_1单位的Огонь_。\n\n

_+2：_对可燃地格заклинание时会在该地格释放_2单位的Огонь_。
actors.hero.talent.fire_ball.comment=“这是...小焰浪吗？”

actors.hero.talent.flash_genius.title=灵光闪现
actors.hero.talent.flash_genius.desc=_+1：_使用камень восприятия成功鉴定物品时对楼этаж内враг施加_2ходовслепота和оглушение_。\n\n

_+2：_使用камень восприятия成功鉴定物品时对楼этаж内враг施加_3ходовслепота和оглушение_。
actors.hero.talent.flash_genius.comment=升级该талант会дополнительнополучает_1块камень восприятия_。\n\n此类通过升级或蜕变以直接获取相应资源的талантобщий_26次ограничение срабатывания_(绅士为_39次_)。\n\n“闪光弹。”

actors.hero.talent.witch_potion.title=女巫媚药
actors.hero.talent.witch_potion.desc=_+1：_投掷зелье时会对цель位置上的враг施加_15ходовочарование_。\n\n

_+2：_投掷зелье时会对цель位置上的враг施加_15ходовочарование和5ходовотравление_。
actors.hero.talent.witch_potion.comment=“平时苦涩味的咖啡，里面竟然放了媚药...”\n“最成熟的我，恋慕着美丽的小丑，幸福地坠入梦乡...”

actors.hero.talent.traitorous_spell.title=奸奇咒法
actors.hero.talent.traitorous_spell.desc=_+1：_Священная Книга可以施放заклинание_奸奇咒法_，потребляет_2点заряд_在指定位置释放проклятиепосохэффект。\n\n

_+2：_Священная Книга可以施放заклинание_奸奇咒法_，потребляет_1点заряд_在指定位置释放проклятиепосохэффект。
actors.hero.talent.traitorous_spell.comment=“这不像是记录在Священная Книга中的заклинание。”

actors.hero.talent.sprint_spell.title=神行术
actors.hero.talent.sprint_spell.desc=_+1：_Священная Книга可以施放заклинание_神行术_，потребляет2点зарядполучает_3ходов极速_。\n\n

_+2：_Священная Книга可以施放заклинание_神行术_，потребляет2点зарядполучает_5ходов极速_。
actors.hero.talent.sprint_spell.comment=“神速力。”

actors.hero.talent.focus_light.title=聚焦光线
actors.hero.talent.focus_light.desc=_+1：_Священная Книга可以施放заклинание_聚焦光线_，потребляет2点заряд发射один道高温射线造成_4~8_点урон并点燃路径和цель。\n\n

_+2：_Священная Книга可以施放заклинание_聚焦光线_，потребляет2点заряд发射один道高温射线造成_6~10_点урон并点燃路径和цель。
actors.hero.talent.focus_light.comment=“这是，高温射线枪。”

actors.hero.talent.zhuanyu_spell.title=转愈圣术
actors.hero.talent.zhuanyu_spell.desc=_+1：_Священная Книга可以施放заклинание_转愈圣术_，потребляет2点заряд将当前щит量以_50%_的转化效率转化为治疗эффект。\n\n

_+2：_Священная Книга可以施放заклинание_转愈圣术_，потребляет2点заряд将当前щит量以_75%_的转化效率转化为治疗эффект。\n\n

_+3：_Священная Книга可以施放заклинание_转愈圣术_，потребляет2点заряд将当前щит量以_100%_的转化效率转化为治疗эффект。
actors.hero.talent.zhuanyu_spell.comment=该заклинание的总治疗量不会超过героймакс. HP的один半。\n\n“弥补了Священная Книга只会给один堆щит而没有治疗эффект的缺陷。”

actors.hero.talent.thorn_whip.title=荆棘之鞭
actors.hero.talent.thorn_whip.desc=_+1：_Священная Книга可以施放заклинание_荆棘之鞭_，потребляет1点заряд拉近враг并造成_原始值为3的кровотечение_。\n\n

_+2：_Священная Книга可以施放заклинание_荆棘之鞭_，потребляет1点заряд拉近враг并造成_原始值为5的кровотечение_。
actors.hero.talent.thorn_whip.comment=“上帝之鞭。”

actors.hero.talent.strongest_shield.title=最强之盾
actors.hero.talent.strongest_shield.desc=_+1：_受到физическийатака时有_50%вероятность_дополнительно进行один次броня减免。\n\n

_+2：_在+1的基础上，受到заклинаниеатака也将有_50%вероятность_进行один次броня减免。
actors.hero.talent.strongest_shield.comment=

actors.hero.talent.combo_package.title=连击套餐
actors.hero.talent.combo_package.desc=_+1：_近战攻击每_命中6次_会触发一次进食特效。\n\n_+2：_近战攻击每_命中4次_会触发一次进食特效。
actors.hero.talent.combo_package.comment=通过该天赋触发进食特效获得的神器充能效果无法对丰饶之角进行充能。\n\n“没吃？吃我一拳！”\n\n_霜晨_
actors.hero.talent$combopackage.name=连击套餐
actors.hero.talent$combopackage.desc=不知为何，通过不断地连续殴打敌人，竟能让你感受到享受美食般的快感。\n\n通过近战连击一定次数能够触发进食特效。\n\n当前连击数：%1$d
actors.hero.talent.break_enemy_ranks.title=陷阵之志
actors.hero.talent.break_enemy_ranks.desc=_+1：_视野内每有一个敌人都会为英雄提供_0~3点护甲_。\n\n_+2：_视野内每有一个敌人都会为英雄提供_1~4点护甲_。
actors.hero.talent.break_enemy_ranks.comment=

actors.hero.talent.hunting_intuition.title=狩猎直觉
actors.hero.talent.hunting_intuition.desc=_+1：_ниндзя鉴定метательное оружие的скоростьувеличено为原来的_3倍_。\n\n

_+2：_ниндзя能在_使用метательное оружие命中враг时_将其немедленно鉴定。
actors.hero.talent.hunting_intuition.comment=“如果不能熟练地使用метательное оружие，那还能称为ниндзя吗？”

actors.hero.talent.revelation.title=天启
actors.hero.talent.revelation.desc=_+1：_Священная Книга可以施放заклинание_天启_，потребляет1点зарядполучает_3ходов的天启_，使自身已有的_正面талантэффектуровень+1_。\n\n

_+2：_Священная Книга可以施放заклинание_天启_，потребляет1点зарядполучает_5ходов的天启_，使自身已有的_正面талантэффектуровень+1_。
actors.hero.talent.revelation.comment=талантэффектуровень不会超过限制уровень。\n\n“талант弱化？不值один提。”

actors.hero.talent.holy_grenade.title=神圣手雷
actors.hero.talent.holy_grenade.desc=_+1：_Священная Книга可以施放заклинание_святая граната_，потребляет2点заряд对цель_3x3область_的враг造成_15~30_点урон。\n\n

_+2：_Священная Книга可以施放заклинание_святая граната_，потребляет2点заряд对цель_3x3область_的враг造成_20~40_点урон。\n\n

_+3：_Священная Книга可以施放заклинание_святая граната_，потребляет2点заряд对цель_5x5область_的враг造成_20~40_点урон。
actors.hero.talent.holy_grenade.comment=святая граната必定对_нежить和демонсвойство_的враг造成最大урон。\n\n“哈~利路亚~”

actors.hero.talent.blade_star.title=刀刃阶梯
actors.hero.talent.blade_star.desc=_+1：_圣典可以施放法术_刀刃阶梯_，消耗3点充能以创造_3x3范围_，持续10回合的刀刃区域。\n\n_+2：_圣典可以施放法术_刀刃阶梯_，消耗3点充能以创造_5x5范围_，持续10回合的刀刃区域。\n\n_+3：_圣典可以施放法术_刀刃阶梯_，消耗3点充能以创造_7x7范围_，持续10回合的刀刃区域。
actors.hero.talent.blade_star.comment=刀刃区域每回合会对敌人造成4~8点无视护甲的伤害并给予3回合残废。

actors.hero.talent.sacred_blade.title=黄金回旋
actors.hero.talent.sacred_blade.desc=_+1：_Священная Книга可以施放заклинание_黄金回旋_，потребляет1点заряд对цель造成_基于оружие ближнего боя的магическийурон_。\n\n

_+2：_在+1的基础上，对_нежить和демонсвойство_的враг必定造成最大урон。\n\n

_+3：_在+1和+2的基础上，对_нежить和демонсвойство_的враг造成的урондополнительно_увеличено30%_。
actors.hero.talent.sacred_blade.comment=“并不是某个铁球。”

actors.hero.talent.equipment_bless.title=装备赐福
actors.hero.talent.equipment_bless.desc=_+1：_Священная Книга可以施放заклинание_снаряжениеблагословение_，потребляет3点зарядполучает_50ходов的снаряжениеблагословение_，使所有оружие和доспехиполучает_1级дополнительноуровень_。\n\n

_+2：_Священная Книга可以施放заклинание_снаряжениеблагословение_，потребляет3点зарядполучает_50ходов的снаряжениеблагословение_，使所有оружие和доспехиполучает_2级дополнительноуровень_。
actors.hero.talent.equipment_bless.comment=“神造之物。”

actors.hero.talent.hotlight.title=灼热强光
actors.hero.talent.hotlight.desc=_+1：_Священная Книга可以施放заклинание_灼热强光_，потребляет_3点заряд_对обзор内非герой及союзникцель造成_3ходовслепота_，并对_нежить和демонсвойство_的враг造成_3ходовгорение_。\n\n

_+2：_Священная Книга可以施放заклинание_灼热强光_，потребляет_2点заряд_对обзор内非герой及союзникцель造成_3ходовслепота_，并对_нежить和демонсвойство_的враг造成_3ходовгорение_。
actors.hero.talent.hotlight.comment=“投掷闪光弹！”

actors.hero.talent.healattack.title=圣愈один击
actors.hero.talent.healattack.desc=_+1：_физическийатакаполучает圣辉的враг会восстановление_3点жизнь_。\n\n

_+2：_физическийатакаполучает圣辉的враг会восстановление_геройуровень30%的жизнь_。
actors.hero.talent.healattack.comment=“愿主保佑你(bonk——)。”

actors.hero.talent.eat_mind.title=食人心智
actors.hero.talent.eat_mind.desc=_+1：_每通过посох或жезл造成1点магическийурон就会_восстановление0.2сытость_。\n\n

_+2：_每通过посох或жезл造成1点магическийурон就会_восстановление0.3сытость_。
actors.hero.talent.eat_mind.comment=“见微知著，食人心智。”\n\n_霜晨_

actors.hero.talent.disabliity_posion.title=致残毒云
actors.hero.talent.disabliity_posion.desc=_+1：_酸蚀посохзаклинаниепоявление的腐蚀酸雾_起始уронувеличено2点_并дополнительно_увеличено30%的气体量_。\n\n

_+2：_在+1的基础上，处于腐蚀酸雾内的враг会持续получает_1ходовувечье_。\n\n

_+3：_在+1和+2的基础上，处于腐蚀酸雾内的враг会持续получает_1ходовослабление和恍惚_。
actors.hero.talent.disabliity_posion.comment=

actors.hero.talent.light_crop.title=雷雨发庄稼
actors.hero.talent.light_crop.desc=_+1：_在Электрическое поле中，普通空地会_长草_，余烬和草会_长出высокая трава_。\n\n

_+2：_在+1的基础上，使用雷霆посохзаклинание时，会对заклинание位置_施加该талант+1的长草_эффект。
actors.hero.talent.light_crop.comment=“N2+O2放电появление2NO。”\n“2NO+O2появление2NO2。”\n“3NO2+H2Oпоявление2HNO3+NO。”

actors.hero.talent.devil_flame.title=恶魔之焰
actors.hero.talent.devil_flame.desc=_+1：_焰浪法杖施法时，如果_原充能消耗3点_，则_充能消耗-1_。\n\n_+2：_焰浪法杖施法时，如果_原充能消耗2点及以上_，则_充能消耗-1_。\n\n_+3：_在+2的基础上，焰浪法杖施法伤害提升_20%_，并且火焰滞留的时间_延长1回合_。
actors.hero.talent.devil_flame.comment=该天赋减少的充能消耗不会影响焰浪法杖施法时造成的伤害，仍依据原充能消耗进行计算。

actors.hero.talent.fast_break.title=积蓄опыт
actors.hero.talent.fast_break.desc=_+1：_враг掉落опыт与战利品的_最大уровень+2_。\n\n

_+2：_враг掉落опыт与战利品的_最大уровень+3_。
actors.hero.talent.fast_break.comment=“财富...分身甲...幽妹...我还能再刷...”

actors.hero.talent.crazy_dancer.title=疯狂舞者
actors.hero.talent.crazy_dancer.desc=_+1：_当英雄闪避了敌人的物理伤害时，敌人会因此_狂乱2回合_。\n\n_+2：_当英雄闪避了敌人的物理伤害时，敌人会因此_狂乱3回合_。
actors.hero.talent.crazy_dancer.comment=“你们不要再打啦！”

actors.hero.talent.throwing_recycling.title=投掷回收
actors.hero.talent.throwing_recycling.desc=_+1：_физическийатака_处于попадание стрелысостояние_的враг有_25%вероятность_可以将враг身上的метательное оружие取回。\n\n

_+2：_физическийатака_处于попадание стрелысостояние_的враг有_50%вероятность_可以将враг身上的метательное оружие取回。\n\n

_+3：_физическийатака_处于попадание стрелысостояние_的враг有_75%вероятность_可以将враг身上的метательное оружие取回。
actors.hero.talent.throwing_recycling.comment=“理论上的飞斧无限连。”

actors.hero.talent.falsehood_power.title=虚假之力
actors.hero.talent.falsehood_power.desc=_+1：_сила_-1_，снаряжение超力的оружие或броня计算сила惩罚时会_снижено3点сила惩罚_。\n\n

_+2：_сила_-1_，снаряжение超力的оружие或броня计算сила惩罚时会_снижено4点сила惩罚_。
actors.hero.talent.falsehood_power.comment=“虚假的сила，却比真实的更为强大。”

actors.hero.talent.flame_incarnation.title=炎烬化身
actors.hero.talent.flame_incarnation.desc=_+1：_击杀处于_горениесостояние_的враг后，有_10%вероятностьпризыв1个огненный элементаль_为你作战。\n\n

_+2：_击杀处于_горениесостояние_的враг后，有_20%вероятностьпризыв1个огненный элементаль_为你作战。\n\n

_+3：_击杀处于_горениесостояние_的враг后，有_30%вероятностьпризыв1个огненный элементаль_为你作战。
actors.hero.talent.flame_incarnation.comment=该талантпоявление的огненный элементальсвойство受楼этаж影响。

actors.hero.talent.marksman.title=魔弹射手
actors.hero.talent.marksman.desc=_+1：_因魔弹посохзаклинание而увеличеноуровень的посох在下次заклинание时_不потребляетзаряд_。\n\n

_+2：_在+1的基础上，魔弹посох_заклинаниеурон+3_。
actors.hero.talent.marksman.comment=该талант不потребляетзаряд的特性对魔弹посох本身не действует。\n\n“你说豌豆射手是什么意思？”

actors.hero.talent.spider_sense.title=蜘蛛感应
actors.hero.talent.spider_sense.desc=_+1：_герой受到обзор外的атака会получает_1ходовпузырь времени_。\n\n

_+2：_герой受到обзор外的атака会получает_2ходовпузырь времени_。
actors.hero.talent.spider_sense.comment=“彼得один激灵。”

actors.hero.talent.no_more_mob.title=NO集群
actors.hero.talent.no_more_mob.desc=_+1：_обзор外熟睡的враг在挑战集群智能生效时，有_50%вероятность_不被惊醒。\n\n

_+2：_在+1的基础上，因此被惊醒的враг会进入_游荡состояние_而非定位герой。
actors.hero.talent.no_more_mob.comment=“我再也不开3级集群了。”

actors.hero.talent.kebi.title=刻笔   ・布莱恩特
actors.hero.talent.kebi.desc=_+1：_магическое перо现在还可以_为оружие给予чары_。\n\n

_+2：_在+1的基础上，магическое перо_给予强力чары/гравировка的вероятностьувеличено_。
actors.hero.talent.kebi.comment=“布莱恩特是个小有成就的чары师，他创造了许多强大的чары与гравировка。只可惜这位чары师在один次关于парениегравировка的演示中不幸坠亡，此后关于这одингравировка的研究也因此被禁止了。”

actors.hero.talent.ice_meal.title=冰能один餐
actors.hero.talent.ice_meal.desc=_+1：_进食只花费1ходов，并получает_2ходов的寒霜之力_。\n\n

_+2：_进食只花费1ходов，并получает_4ходов的寒霜之力_。\n\n

_+3：_在+2的基础上，进食会对герой周围的биологический造成_10ходовЗамерзание_。
actors.hero.talent.ice_meal.comment=

actors.hero.talent.more_favors.title=更多人情
actors.hero.talent.more_favors.desc=_+1：_巨魔铁匠任务每块暗金提供的人情_увеличено25_。\n\n

_+2：_巨魔铁匠任务每块暗金提供的人情_увеличено50_，同时人情上限从3000_увеличено至4000_。
actors.hero.talent.more_favors.comment=“嘴臭但人好。”

actors.hero.talent.hardware_elements.title=пять金元素
actors.hero.talent.hardware_elements.desc=_+1：_元素余烬在炼制唤魔晶柱时不会被потребляет，但是炼制所需的_алхимическая энергияпотребляетувеличено至20_。\n\n

_+2：_元素余烬在炼制唤魔晶柱时不会被потребляет，但是炼制所需的_алхимическая энергияпотребляетувеличено至15_。\n\n

_+3：_元素余烬在炼制唤魔晶柱时不会被потребляет，炼制所需的_алхимическая энергияпотребляет不再увеличено_。
actors.hero.talent.hardware_elements.comment=“获取无尽的能源也是炼金术的目的之один。”

actors.hero.talent.static_light.title=静滞电流
actors.hero.talent.static_light.desc=_+1：заклинаниеурон+1_，使用посох或жезлзаклинаниеатакавраг时дополнительно给予_造成урон5%ходов的麻痹_。\n\n_+2：заклинаниеурон+2_，使用посох或жезлзаклинаниеатакавраг时дополнительно给予_造成урон7.5%ходов的麻痹_。
actors.hero.talent.static_light.comment=该талант给予的麻痹ходов数向下取整。\n\n“这是走向雷电法王的один小步。”

actors.hero.talent.miracle_alchemy.title=奇迹炼金
actors.hero.talent.miracle_alchemy.desc=_+1：_炼金时有_20%вероятность_дополнительно炼制出1份炼金产物。\n\n

_+2：_炼金时有_40%вероятность_дополнительно炼制出1份炼金产物。
actors.hero.talent.miracle_alchemy.comment=该талант对饰物、炖肉、熟无味果、肌肉记忆合剂、注魔秘卷、所有炸弹、液金、Священная Книга拓本、根骨秘药、注魔菱晶和蜕变结晶的炼制不会生效。\n\n“炼金本身就是один种奇迹，我爱炼金。”

actors.hero.talent.hungry_ghost.title=饿鬼道
actors.hero.talent.hungry_ghost.desc=_+0：_受到голодурон时会_появлениеодин个призрак_，受到призракатака会_уменьшено5点сытость_。\n\n

_+1：_受到голодурон时会_появлениеодин个призрак_。\n\n

_+2：_受到голодурон时不再появлениепризрак。
actors.hero.talent.hungry_ghost.comment=

actors.hero.talent.unable_rest.title=无法安息
actors.hero.talent.unable_rest.desc=_+0：нежить和демонсвойство_враг受到致死урон时会сохранение_1点жизнь_并получает_макс. HP50%点щит_。\n\n_+1：нежить和демонсвойство_враг受到致死урон时会сохранение_1点жизнь_。\n\n

_+2：_нежить和демонсвойствовраг受到致死урон能够直接去见上帝。
actors.hero.talent.unable_rest.comment=该талант不会对原本就拥有复活能力的враг(如矮人尸群)以及Bossвраг生效。

actors.hero.talent.cursedman.title=被诅咒者
actors.hero.talent.cursedman.desc=_+0：_对物品使用_升级卷轴、注魔秘卷、附魔符石或奥术刻笔_将导致物品被诅咒。\n\n_+1：_对物品使用_附魔符石或奥术刻笔_将导致物品被诅咒。\n\n_+2：_对物品使用升级卷轴、注魔秘卷、附魔符石或奥术刻笔不再会导致物品被诅咒。
actors.hero.talent.cursedman.comment=

actors.hero.talent.usury.title=高利贷
actors.hero.talent.usury.desc=_+0：_可能会получает1000монеты？总之герой之后每下одинэтаж就会扣除_200монеты_的利息。\n\n

_+1：_利息снижено至_150монеты_。\n\n

_+2：_不再会扣除利息。
actors.hero.talent.usury.comment=
actors.hero.talent.usury.nomoney=想不到吧！店主把你的贷款私吞了один部分！
actors.hero.talent.usury.principal=这是店主给你申请的高利贷。
actors.hero.talent.usury.interest=每этаж支付利息：%dмонеты。

actors.hero.talent.armed_uprising.title=极恶中队
actors.hero.talent.armed_uprising.desc=_+1：_盟友的物理攻击会同步英雄拥有的大部分_物攻特效_。\n\n_+2：_在+1的基础上，盟友的物理攻击还会同步英雄拥有的大部分_物攻增伤_。
actors.hero.talent.armed_uprising.comment=该天赋的同步效果主要取决于英雄拥有的天赋乃至英雄自身的特性。\n\n“全军 出击！”

actors.hero.talent.dungeon_hero.title=подземельегерой
actors.hero.talent.dungeon_hero.desc=_+1：_首次与任务NPC和各个区域的商人交互时，получает_2个低级掉落_。\n\n

_+2：_首次与任务NPC和各个区域的商人交互时，получает_2个中级掉落_。
actors.hero.talent.dungeon_hero.comment=“不接受绿宝石或是物品交易。”

actors.hero.talent.exp_solid.title=опыт固化
actors.hero.talent.exp_solid.desc=_+1：_снижено_1级геройуровень_并получает_1瓶опытзелье_。\n\n

_+2：_снижено_2级геройуровень_并получает_2瓶опытзелье_。
actors.hero.talent.exp_solid.comment=该талант在资源获取次数达到上限后进行升级仍可сниженогеройуровень，此类通过升级或蜕变以直接获取相应资源的талантобщий_26次ограничение срабатывания_(绅士为_39次_)。\n\n“我变弱了？不，我变强了(戴上财富之戒)。”

actors.hero.talent.wealth_statue.title=财富石像
actors.hero.talent.wealth_statue.desc=_+1：_活化石像和装甲石像死亡时会掉落один个_2级的随机戒指_，而призыв守卫死亡时则会掉落один个_1级的随机戒指_。\n\n

_+2：_活化石像和装甲石像死亡时会掉落один个_3级的随机戒指_，而призыв守卫死亡时则会掉落один个_2级的随机戒指_。\n\n

_+3：_活化石像和装甲石像死亡时会掉落один个_4级的随机戒指_，而призыв守卫死亡时则会掉落один个_3级的随机戒指_。
actors.hero.talent.wealth_statue.comment=该талантполучает的戒指会是未鉴定состояние，同时该талант获取资源的次数_限制为26次_(绅士为_39次_)且这один限制与大部分通过升级或蜕变以直接获取相应资源的талантобщий。

actors.hero.talent.sweet_sleep.title=美梦长眠
actors.hero.talent.sweet_sleep.desc=_+1：_伏击时造成_30%的дополнительноурон_。\n\n

_+2：_伏击时造成_40%的дополнительноурон_。
actors.hero.talent.sweet_sleep.comment=“死不可怕，死是凉爽的夏夜，可供人无忧的安眠。”

actors.hero.talent.light_shock.title=光明震慑
actors.hero.talent.light_shock.desc=_+1：_получает_1根棱光посох_，棱光посохзаклинание造成слепота的同时还会造成_посохуровень50%ходов的увечье_，若заклинание前цель已有слепота则再行заклинание仍会造成увечье。\n\n

_+2：_在+1的基础上(不包括获取资源)，棱光посохзаклинание造成слепота或对слепотацельзаклинание时，уронувеличено_30%_。
actors.hero.talent.light_shock.comment=此类通过升级或蜕变以直接获取相应资源的талантобщий_26次ограничение срабатывания_(绅士为_39次_)。\n\n“手执威光，便是为了扫尽世间恶行。”

actors.hero.talent.boozy.title=嗜酒如命
actors.hero.talent.boozy.desc=_+1：_饮用药剂会额外获得_5点生命恢复_和每回合衰减一次的_0~5点树肤_。\n\n_+2：_饮用药剂会额外获得_10点生命恢复_和每回合衰减一次的_0~10点树肤_。
actors.hero.talent.boozy.comment=“药剂如美酒，越老越香醇。”

actors.hero.talent.shadow_killer.title=阴影杀手
actors.hero.talent.shadow_killer.desc=_+1：_通过伏击получает的_урон修正увеличено至75%_并дополнительно造成_敌方броня100%_的урон。\n\n

_+2：_通过伏击получает的_урон修正увеличено至100%_并дополнительно造成_敌方броня150%_的урон。
actors.hero.talent.shadow_killer.comment=

actors.hero.talent.kill_spree.title=杀戮盛宴
actors.hero.talent.kill_spree.desc=_+1：_герой通过физическийатака杀死враг将получает_врагмакс. HP5%的восстановление HP_和_2ходов的заряд артефакта_。\n\n

_+2：_герой通过физическийатака杀死враг将получает_врагмакс. HP7.5%的восстановление HP_和_3ходов的заряд артефакта_。
actors.hero.talent.kill_spree.comment=

actors.hero.talent.seaofpeople.title=人潮汹涌
actors.hero.talent.seaofpeople.desc=_+1：_обзор内每有один个враг，скорость передвижения_увеличено30%_。\n\n

_+2：_обзор内每有один个враг，скорость передвижения_увеличено45%_。
actors.hero.talent.seaofpeople.comment=

actors.hero.talent.phantom_step.title=幻影迷步
actors.hero.talent.phantom_step.desc=_+1：_解除невидимость或影遁后，получает_3ходов极速_和_1ходов幻影迷步_(必定уклонение所有атака)。\n\n

_+2：_解除невидимость或影遁后，получает_5ходов极速_和_2ходов幻影迷步_(必定уклонение所有атака)。
actors.hero.talent.phantom_step.comment=该талант在_+1/+2_уровень时，若герой已有不低于_6/10ходов_的极速эффект，则无法通过该талант进один步увеличено极速эффект的持续时间。\n\n来自_重构подземелье_的全新сила！
actors.hero.talent$phantomstep.name=幻影迷步
actors.hero.talent$phantomstep.desc=每一位盗贼公会成员向往的至高境界，那便是掌握这一能力。\n\n在这一效果的影响下，你将闪避任何物理或魔法攻击。\n\n效果剩余时长：%s回合

actors.hero.talent.steam_bean.title=吉列豆蒸
actors.hero.talent.steam_bean.desc=_+0：_对враг进行的首次физическийатака会使герой陷入_8ходов的恍惚_。\n\n

_+1：_对враг进行的首次физическийатака会使герой陷入_4ходов的恍惚_。\n\n

_+2：_физическийатакавраг不再使герой陷入恍惚。
actors.hero.talent.steam_bean.comment=

actors.hero.talent.alchemy_accident.title=炼金事故
actors.hero.talent.alchemy_accident.desc=_+0：_炼制炼金产物会有_20%概率_以英雄为中心产生一次爆炸。\n\n_+1：_炼制炼金产物会有_10%概率_以英雄为中心产生一次爆炸。\n\n_+2：_炼金现在变得安全。
actors.hero.talent.alchemy_accident.comment=

actors.hero.talent.shell_cry.title=晶化躯壳
actors.hero.talent.shell_cry.desc=_+0：_герой的броня会随HPснижено而снижено，至多снижено_100%_。\n\n

_+1：_герой的броня会随HPснижено而снижено，至多снижено_50%_。\n\n

_+2：_герой的броня不再随HPснижено而снижено。
actors.hero.talent.shell_cry.comment=

actors.hero.talent.mal_curse.title=恶毒проклятие
actors.hero.talent.mal_curse.desc=_+0：_проклятие的снаряжение会_снижено2级_。\n\n

_+1：_проклятие的снаряжение会_снижено1级_。\n\n

_+2：_проклятие不再影响снаряжениеуровень。
actors.hero.talent.mal_curse.comment=该талант能使снаряжениеуровеньснижено至负数уровень。\n\n来自_原版像素подземелье_的强大проклятие！

actors.hero.talent.thunder_strike.title=雷霆打击
actors.hero.talent.thunder_strike.desc=升级该талант后，физическийатака会附带урон为_造成урон50%_的电弧(герой和союзник不会受到电弧урон)，电弧可以链接与атакацель相邻的биологический(不会链接атака方)，若атакацель在вода中、герой拥有_посох或заряд артефактаэффект_则链接距离+1。\n\n_+1：_电弧_只对后续链接враг_造成урон。\n\n_+2：_电弧_会对所有链接враг_造成урон。
actors.hero.talent.thunder_strike.comment=“我说DM-300也是故障机器人有没有懂的？”

actors.hero.talent.directional_collapse.title=定向塌方
actors.hero.talent.directional_collapse.desc=_+1：_法杖或魔杖_每施法4次_就会在施法目标周围产生大量落石，造成_10~20_点无视护甲的伤害和_3回合麻痹_。\n\n_+2：_法杖或魔杖_每施法3次_就会在施法目标周围产生大量落石，造成_10~20_点无视护甲的伤害和_3回合麻痹_。
actors.hero.talent.directional_collapse.comment=该天赋产生的落石不会对英雄和盟友造成伤害和麻痹。
actors.hero.talent$directionalcollapse.name=定向塌方
actors.hero.talent$directionalcollapse.desc=从DM-300的高功率钻头上碎裂掉落的金属碎片似乎与其他从金属残骸处搜刮得到的邪能碎片略有不同，仅是在你手指触碰的一瞬便迅速消散了。尽管不知道这意味着什么，但你能感觉到背包内的法杖变得更强了一些。\n\n每施法%s次就会触发一次定向塌方，使得施法目标周围产生大量落石，造成10~20点无视护甲的伤害和3回合麻痹。幸运的是，这些落石对你和你的盟友无效。\n\n当前施法次数：%s

#新法术
actors.hero.spells.ascension_curse.name=升天咒
actors.hero.spells.ascension_curse.short_desc=使施法者获得飘浮效果。
actors.hero.spells.ascension_curse.desc=施法者念动咒文使自身短时间内变得更加轻盈，因此能够飘浮_%1$d回合_。\n\n该法术施法_消耗1回合_。

actors.hero.spells.divine_protection.name=神明庇佑
actors.hero.spells.divine_protection.short_desc=使施法者无敌一小段时间。
actors.hero.spells.divine_protection.desc=施法者通过圣典的力量祈求神明的庇佑，在得到回应后自身将无敌_%1$d回合_。\n\n该法术施法_消耗1回合_。

actors.hero.spells.shepherd_intention.name=牧羊原旨
actors.hero.spells.shepherd_intention.short_desc=能使指定地点产生一群魔法绵羊。
actors.hero.spells.shepherd_intention.desc=施法者将借助圣典凝聚体内流动的魔力，而后可在指定位置召唤...一群魔法绵羊？好吧，至少它们是杀不死的。\n\n该法术施法_消耗1回合_。

actors.hero.spells.conversion_holy.name=圣法皈依
actors.hero.spells.conversion_holy.short_desc=能够沉沦一个目标。
actors.hero.spells.conversion_holy.no_target=没有目标可以被沉沦。
actors.hero.spells.conversion_holy.desc=施法者能够展示圣典神力，使目标皈依神圣教，成为施法者忠心的仆从。\n\n通过该法术沉沦的敌人不会产生掉落物。\n\n该法术施法_消耗1回合_。

actors.hero.spells.purifying_evil.name=净化邪恶
actors.hero.spells.purifying_evil.short_desc=能够净化一个目标。
actors.hero.spells.purifying_evil.no_target=没有目标可以被净化。
actors.hero.spells.purifying_evil.desc=施法者通过圣典中巨大的神圣力量以净化敌人，消除其身上的增益，甚至能够消除精英效果并对亡灵和恶魔属性敌人造成伤害。\n\n该法术施法_消耗1回合_。

actors.hero.spells.divine_storm.name=神力领域风暴
actors.hero.spells.divine_storm.short_desc=能够产生强大的神力领域审判敌人。
actors.hero.spells.divine_storm.desc=施法者以圣典为引，产生强大的神力领域麻痹甚至灼烧敌人。\n\n该法术施法_消耗1回合_。

actors.hero.spells.genesis.name=创世纪
actors.hero.spells.genesis.short_desc=重置自身天赋能力。
actors.hero.spells.genesis.desc=施法者将像上帝创造世界一样，重塑自身。\n\n该法术施法_消耗1回合_。

actors.hero.spells.indulgence.name=赎罪券
actors.hero.spells.indulgence.short_desc=消耗金币回复圣典充能。
actors.hero.spells.indulgence.desc=施法者会消耗_%1$d金币_，洗清自己身上的罪孽，恢复圣典充能。\n\n该法术施法_消耗1回合_。\n\n该法术对圣典拓本无效。
actors.hero.spells.indulgence.no_tome=没有圣典，你的忏悔毫无意义。

actors.hero.spells.silver_language.name=银光锐语
actors.hero.spells.silver_language.short_desc=使目标狂乱一小段时间。
actors.hero.spells.silver_language.no_target=没有目标会因此狂乱。
actors.hero.spells.silver_language.desc=施法者对目标大声念诵了几段圣典上写着的词句，使其当场破防，狂乱_%1$d回合_。\n\n该法术施法_消耗1回合_。

actors.hero.spells.resurrection.name=复活术
actors.hero.spells.resurrection.short_desc=目标在短时间内死亡会使其复活。
actors.hero.spells.resurrection.no_target=无法对该目标施加法术。
actors.hero.spells.resurrection.desc=施法者借助圣典伟力，可对自身或盟友施加强大的复活术，若短时间内死亡，则可以复活。\n\n该法术施法_消耗1回合_。
actors.hero.spells.resurrection$resurrection.name=死者苏生
actors.hero.spells.resurrection$resurrection.desc=这个角色在死亡后就会复活！\n\n受此效果影响的盟友在该效果持续期间内死亡就会以最佳状态复活。\n\n如果受此效果影响的是英雄，则英雄在该效果持续期间内死亡也会复活，但至多保留1点生命。\n\n剩余回合数：%s

actors.hero.spells.traitorous_spell.name=奸奇咒法
actors.hero.spells.traitorous_spell.short_desc=释放诅咒法杖效果。
actors.hero.spells.traitorous_spell.desc=施法者通过使用奸奇神选的咒术，对目标施加随机诅咒效果。\n\n该法术施法_消耗1回合_。

actors.hero.spells.sprint_spell.name=神行术
actors.hero.spells.sprint_spell.short_desc=给予自身极速效果。
actors.hero.spells.sprint_spell.desc=施法者可以通过释放法咒以获得像是神行太保戴宗一样日行千里的速度，这将为自身施加_%1$d回合极速_。\n\n该法术施法_消耗1回合_。

actors.hero.spells.focus_light.name=聚焦光线
actors.hero.spells.focus_light.short_desc=发射一道高温射线，灼烧一切。
actors.hero.spells.focus_light.desc=施法者能够发射一道高温射线造成_%1$d~%2$d点伤害_并点燃路径和目标。\n\n该法术施法_消耗1回合_。

actors.hero.spells.zhuanyu_spell.name=转愈圣术
actors.hero.spells.zhuanyu_spell.short_desc=将护盾转化为治疗量。
actors.hero.spells.zhuanyu_spell.desc=将施法者身上的护盾以_%d%%_的比例转化为治疗效果，其中的治疗总量不会超过最大生命值的一半。\n\n该法术施法_消耗1回合_。

actors.hero.spells.thorn_whip.name=荆棘之鞭
actors.hero.spells.thorn_whip.short_desc=拉近目标并施加流血。
actors.hero.spells.thorn_whip.no_target=没有目标可以拉近或者该目标无法拉近。
actors.hero.spells.thorn_whip.more_distance=Расстояние слишком далеко.
actors.hero.spells.thorn_whip.desc=施法者手中将浮现一条带刺金鞭，能够将目标拉近并附加_原始值为%1$d的流血_。\n\n该法术的距离限制为_12格_。\n\n该法术施法_消耗1回合_。

actors.hero.spells.revelation.name=天启
actors.hero.spells.revelation.short_desc=使自身已有的正面天赋等级提升。
actors.hero.spells.revelation.desc=施法者将得到上天的启发，获得_%1$d回合天启_，使自身已有的_正面天赋效果等级+1_。\n\n天赋效果等级不会超过限制等级。\n\n该法术施法_不耗时_。
actors.hero.spells.revelation$revelationbuff.name=天启
actors.hero.spells.revelation$revelationbuff.desc=你感觉自己得到了上天的启发，所有已有的正面天赋效果等级+1。\n\n剩余回合数：%s回合

actors.hero.spells.holy_grenade.name=神圣手雷
actors.hero.spells.holy_grenade.short_desc=产生爆炸，杀伤敌人。
actors.hero.spells.holy_grenade.desc=施法者扔出一个能量光团，瞬间在光团落点_%1$dx%1$d_范围造成_%2$d~%3$d点伤害_，亡灵和恶魔目标必定承受最大伤害。\n\n该法术施法_消耗1回合_。

actors.hero.spells.blade_star.name=刀刃阶梯
actors.hero.spells.blade_star.short_desc=创造刀刃区域，伤害并致残敌人。
actors.hero.spells.blade_star.desc=施法者将圣光实体化为刀刃，形成一片_%1$dx%1$d_范围的刀刃区域，在这个区域内的敌人会持续受到_4~8点伤害_并获得_3回合的残废_效果。该区域可以维持_10回合_。\n\n该法术施法_消耗1回合_。
actors.hero.spells.blade_star.invalid_target=无法在该位置生成刀刃区域。
actors.hero.spells.blade_star$blade_stair.name=刀刃区域
actors.hero.spells.blade_star$blade_stair.desc=此处已经化为刀刃区域。刀刃区域会持续伤害并减速敌人。

actors.hero.spells.sacred_blade.name=黄金回旋
actors.hero.spells.sacred_blade.short_desc=丢出一把由圣光凝聚而成的回旋镖，对目标造成魔法伤害。
actors.hero.spells.sacred_blade.desc=施法者将丢出一把由圣光凝聚而成的回旋镖，对目标造成_基于手中武器的魔法伤害_，其中亡灵和恶魔目标会受到额外伤害加成。\n\n该法术施法_消耗1回合_。

actors.hero.spells.equipment_bless.name=装备赐福
actors.hero.spells.equipment_bless.short_desc=强化所有武器和防具。
actors.hero.spells.equipment_bless.desc=施法者可对所有武器和防具进行赐福，使其等级得到临时提升。\n\n该法术施法_消耗1回合_。
actors.hero.spells.equipment_bless$blessbuff.name=装备赐福
actors.hero.spells.equipment_bless$blessbuff.desc=你感觉身上的装备已经得到了赐福。\n\n该效果持续时间内，所有武器和防具的等级将获得临时提升。\n\n剩余回合数：%s回合

actors.hero.spells.hotlight.name=灼热强光
actors.hero.spells.hotlight.short_desc=释放强光，致盲敌人。
actors.hero.spells.hotlight.desc=施法者释放出灼热的强光，使视野内的所有敌人_失明3回合_，同时会直接点燃亡灵和恶魔敌人。\n\n该法术施法_消耗1回合_。


actors.hero.heroclass.freeman=Джентльмен
actors.hero.heroclass.freeman_desc_short=Джентльмен IT000, изначально неся уникальный IT001.
actors.hero.heroclass.freeman_desc=У джентльмена изначально есть IT000, из которого он может приобретать специальные предметы или способности.\ n\ nУ джентльмена нет специальной боевой подготовки и очень мало боевых способностей, но у него есть IT001.\ n\ nВ то же время у джентльмена изначально есть IT002, IT003, тканевые доспехи, водяные мешки и бархатные мешки.\ n\ n Стартовые предметы джентльмена:\ nIT004 зелья опыта\ nIT005 Свитки трансформации, свитки идентификации и свитки трансмутации
actors.hero.heroclass.freeman_unlock=_使用一张蜕变卷轴蜕变天赋_以解锁绅士。
actors.hero.herosubclass.freeman=Джентльмен
actors.hero.herosubclass.freeman_short_desc=_绅士_无法从天狗的面具中得到更多力量，但他依然拥有更多潜力可待激发。
actors.hero.herosubclass.freeman_desc=绅士在戴上天狗的面具后未能从中得到太多力量，但在面具瓦解后他会额外得到一张蜕变卷轴。\n\n此外，绅士仍有更多潜力可待激发。


actors.blobs.pheromone.desc=Существует феромоновый газ, который сбивает героя с толку и укрепляет союзников последователей дьявола.
actors.mobs.chaosdisciples$succboss.name=色孽信徒
actors.mobs.chaosdisciples$succboss.desc=色孽信徒曾经是один个魅魔，小демон的朋友，为了帮助小демон实现其野心，谋求强大сила，成为混沌之神的色孽信徒。\n\n色孽信徒拥有призыв大量魅魔为自己作战的能力，不过好在这种能力只能隔один段时间发动。除此以外，它还能释放费洛蒙气体，能够解除敌方单位对герой的沉沦或卖命эффект并赋予其治疗和гормональный всплеск，同时还会使герой及其союзник陷入очарование。
actors.mobs.chaosdisciples$summoncooldown.name=魅魔призыв-перезарядка
actors.mobs.chaosdisciples$summoncooldown.desc=色孽信徒刚刚призыв了魅魔，过один会儿才能再次发动。\n\n剩余перезарядка：%sходов
actors.mobs.chaosdisciples$scorpioboss.name=纳垢信徒
actors.mobs.chaosdisciples$scorpioboss.desc=纳垢信徒曾经是один个巨蝎，小демон的朋友，为了帮助小демон实现其野心，谋求强大сила，成为混沌之神的纳垢信徒。\n\n纳垢信徒擅长传播瘟疫，会向周围传播致命的病Токсичный газ体。除此以外，其拥有强大的защита，无论是физический还是магический都很难урон到他，而且还能够反弹远程физическийурон，不过它_似乎更容易受到某种元素урон_。
actors.mobs.chaosdisciples$scorpioboss.fire=火！火！好热啊！
actors.mobs.chaosdisciples$eyeboss.name=奸奇信徒
actors.mobs.chaosdisciples$eyeboss.desc=奸奇信徒曾经是один个邪眼，小демон的朋友，为了帮助小демон实现其野心，谋求强大сила，成为混沌之神的奸奇信徒。\n\n奸奇信徒是один个狡猾的家伙，每隔один段时间便能像古神один样发射致命的激光。除此之外，它还能释放恐怖的黑магический以扰乱герой的心智，且在受到атака后还会进行随机传送。
actors.mobs.chaosdisciples$ripperboss.name=恐虐信徒
actors.mobs.chaosdisciples$ripperboss.desc=恐虐信徒曾经是один个撕裂者，小демон的朋友，为了帮助小демон实现其野心，谋求强大сила，成为混沌之神的恐虐信徒。\n\n恐虐信徒是один个好战的家伙，擅长近战атака，会在近战和受击时получает增益和连击эффект，进один步加强它那恐怖的移动力和атака频率，死在其手下的герой有56个之多。
actors.mobs.chaosdisciples$ripperboss.combo=恐虐信徒当前连击数为%d
actors.mobs.chaosdisciples$ripperboss.combotime=，剩余连击时间为%sходов。

actors.mobs.npcs.greatimp.name=小демон？
actors.mobs.npcs.greatimp.newyear=新年快乐！你问我为什么在这？这不重要，快去拿护符吧！
actors.mobs.npcs.greatimp.hello=惊喜！你问我为什么在这？这不重要，快去拿护符吧！
actors.mobs.npcs.greatimp.amulet=取得护符了？那赶紧回家和家人团圆один起过春节吧！
#fix9：文案更改
actors.mobs.npcs.greatimp.warning=看来还是被你发现了，我来到这儿其实是为了夺取古神Yog-Dzewa的剩余сила以统领所有демон军团，接着我就会统治这个подземелье，进而开始征服整个世界！你是要在此阻拦我作无谓的抵抗，还是乖乖离开好享受自己剩余的人生？
actors.mobs.npcs.greatimp.yes=阻止他！
actors.mobs.npcs.greatimp.no=与我无瓜
actors.mobs.npcs.greatimp.time=兄弟们上，为我争取时间！
actors.mobs.npcs.greatimp.desc=不知道为什么，小демон会来到这个地方。
actors.mobs.npcs.greatimp.die=谢谢你们为我争取的时间，现在，我已战无不胜！
actors.mobs.npcs.greatimp.nothing=......

actors.mobs.greatdemon.name=大демон
actors.mobs.greatdemon.desc=刚吸收完古神сила的小демон，长出了更长的демон角、胡须和翅膀...已经不能叫其小демон了，应该称其为大демон。\n\n大демон拥有强壮的身体，每隔один段时间就能抵御并反弹特定的атака，由于其缺乏战斗магический的知识，难以施展各类магический，但其近战能力相当彪悍，而且还能призыв其他低阶демон辅助作战。
actors.mobs.greatdemon.die=这сила，怎么这么不堪один击，来日方长！
actors.mobs.greatdemon.throw=来试试我的朗基努斯之枪！
actors.mobs.greatdemon.melee=吃我один记демон斩！
actors.mobs.greatdemon.summon=听从我的号召，демон们！
actors.mobs.greatdemon.defence=皮肤硬化！无论刀枪，都难伤我分毫！
actors.mobs.greatdemon.haste=大демон快速扇动демон之翼，以极快的скорость飞行。
actors.mobs.greatdemon.magic=魔力防护，启动！
actors.mobs.greatdemon.missiles=магический结界，帮我反射所有的弓箭利矢！
actors.mobs.greatdemon$summoncooldown.name=демонпризыв-перезарядка
actors.mobs.greatdemon$summoncooldown.desc=大демон刚刚призыв了2只低阶демон，得过один段时间才能再次发动。\n\n剩余перезарядка：%sходов
actors.mobs.greatdemon$hastecooldown.name=魔翼加速-перезарядка
actors.mobs.greatdemon$hastecooldown.desc=大демон刚刚猛烈煽动魔翼получает加速эффект，现在需要舒缓один下。\n\n剩余перезарядка：%sходов
actors.mobs.greatdemon$magiccooldown.name=магическийзащита-перезарядка
actors.mobs.greatdemon$magiccooldown.desc=магическийзащита只能维持один段时间，得过один段时间才能再次发动。\n\n剩余перезарядка：%sходов
actors.mobs.greatdemon$meleescooldown.name=荆棘皮肤-перезарядка
actors.mobs.greatdemon$meleescooldown.desc=荆棘皮肤只能维持один段时间，得过один段时间才能再次发动。\n\n剩余перезарядка：%sходов
actors.mobs.greatdemon$missilescooldown.name=远矢反弹-перезарядка
actors.mobs.greatdemon$missilescooldown.desc=远矢反弹只能维持один段时间，得过один段时间才能再次发动。\n\n剩余перезарядка：%sходов
actors.mobs.greatdemon$throwcooldown.name=朗基努斯之枪-перезарядка
actors.mobs.greatdemon$throwcooldown.desc=朗基努斯之枪刚被大демон掷出过，得过один段时间才能再次发动。\n\n剩余перезарядка：%sходов
actors.mobs.greatdemon$meleesdefence.name=荆棘皮肤
actors.mobs.greatdemon$meleesdefence.desc=在один段时间内能大幅уменьшено近战受到的урон，并会将部分урон反弹给атака者。\n\n剩余ходов数：%sходов
actors.mobs.greatdemon$missilesdefence.name=远矢反弹
actors.mobs.greatdemon$missilesdefence.desc=在один段时间内能完全иммунитетметательное оружие的урон，并会以магический的形式反击给атака者。\n\n剩余ходов数：%sходов

actors.mobs.landpiranha.name=гигантский陆地пиранья
actors.mobs.landpiranha.desc=гигантская пиранья因为奇异的магическийсила，长出双脚并能在空气中呼吸，也许削弱某个талант的сила就能让其восстановление原状。
actors.mobs.landpiranha.discover_hint=你可在拥有某个负面талант后在任何подземелье区域发现该враг。
actors.mobs.phantomlandpiranha.name=幻影陆地пиранья
actors.mobs.phantomlandpiranha.desc=幻影陆地пиранья是фантомная пиранья被奇异магический扭曲的один个罕见变种，具有诡异的半透明身体和магический能力。它能够在受到атака时传送，依此能力进可攻、退可逃！\n\n虽然很难对付，但它们的肉也因具有魔力而备受珍视。
actors.mobs.phantomlandpiranha.discover_hint=你可在拥有某个负面талант后在任何подземелье区域发现该враг。
actors.mobs.teststatue.name=测试石像
actors.mobs.teststatue.desc=不知道谁摆在这的石像，看样子很抗揍，你都忍不住去揍他。

actors.mobs.goldboss$monkmaster.name=武僧宗师
actors.mobs.goldboss$monkmaster.desc=武僧宗师是矮人武道登峰造极之人，没人见识过其能力上限在哪。\n\n无论武僧宗师的对手有多快，武僧宗师总是比他的对手更快。武僧宗师厌恶卑鄙的伎俩，最好不要激怒他。
actors.mobs.goldboss$monkmaster.missileweapon=奶奶滴，玩阴的是吧，那就来吧！

actors.mobs.goldboss$goldelemental.name=黄金元素
actors.mobs.goldboss$goldelemental.desc=黄金元素是магазин店主根据矮人国王遗留的元素灵体之法призыв出来的元素биологический。\n\n黄金元素能够自己运用元素灵体之法призыв其他元素биологический，并且还能够抽取герой的财富为己所用，甚至是凭空创造财富。
actors.mobs.goldboss$goldelemental.steal=黄金元素从你的身上抽取了300монеты。
actors.mobs.goldboss$goldelemental.give=黄金元素在你的背包内凭空创造了400монеты。
actors.mobs.goldboss$goldgolem.name=黄金魔像
actors.mobs.goldboss$goldgolem.desc=黄金魔像是经магазин店主之手改造的魔像，通体由黄金打造，远比普通的魔像更具威压。\n\n黄金魔像相较于普通的魔像，虽失去了传送能力，但拥有更强的攻防свойство，还能够瞬间释放用于麻痹биологический的高压Электрическое поле，甚至能够瞬间碾压магическийбиологический。
actors.mobs.goldboss$goldgolem.electricity=能量外溢，释放。
actors.mobs.goldboss$electricitycooldown.name=释放Электрическое поле-перезарядка
actors.mobs.goldboss$electricitycooldown.desc=黄金魔像刚刚释放了Электрическое поле，один段时间后才能再次释放。\n\n剩余перезарядка：%sходов

actors.mobs.goldboss$thymor.name=大魔导师提穆尔
actors.mobs.goldboss$thymor.desc=提穆尔是один名杰出的дварф-чародей，曾与武僧宗师合作，试图推翻矮人国王的统治，在见识到Yog-Dzewa带领的демон军团的可怕后，最终归顺于矮人国王，один直在前线和демон战斗。如今的他在矮人国王死后与店主达成了合作，试图抢夺你的Yendor护符借此复兴早已腐朽的矮人都城。\n\n提穆尔擅长使用黑магический和大область的проклятие禁术，有人曾目睹他瞬间消灭庞大的демон军团。
actors.mobs.goldboss$thymor.curse=歪比歪比，歪比巴卜。
actors.mobs.goldboss$thymor.cursedo=叽里咕噜，释放！
actors.mobs.goldboss$thymor.bolt_kill=你被提穆尔的强力黑магический杀死了...
actors.mobs.goldboss$sheepcursecooldown.name=大область死亡法咒-перезарядка
actors.mobs.goldboss$sheepcursecooldown.desc=死亡法咒能够瞬间使敌对биологический死亡，但是геройиммунитет这одинэффект。\n\n剩余перезарядка：%sходов
actors.buffs.mostdegrade.name=Проклятие супердеградации
actors.buffs.mostdegrade.desc=Мощная темная магия пожирает свиток улучшения и впрыскивает магическую силу вашего снаряжения!\ n\ nПониженное снаряжение будет считаться ниже своего первоначального уровня. IT000. Описания предметов также меняются в зависимости от эффектов понижения в должности.\ n\ nОднако понижение в должности не влияет на требования к мощности снаряжения, зарядов персонала, прочности оружия и артефактов.\ n\ nВоздействия от снятия Оставшаяся продолжительность: %s раундов\ n\ nВоздействия от снятия, применяемые Тимуром, не только более мощные, но и не могут быть рассеяны с помощью свитков экзорцизма.


actors.mobs.npcs.shopboss.name=店主？
actors.mobs.npcs.shopboss.hello=宝藏，монеты，嘿嘿(流口вода)，不枉我这один程。
actors.mobs.npcs.shopboss.warning=什么？你也想抢走我的财宝吗？别以为拿到了所谓的护符就了不起了，识相的话现在赶紧滚开，反正这护符迟早会是我的(阴笑)。
actors.mobs.npcs.shopboss.yes=有钱当然是один起分享了
actors.mobs.npcs.shopboss.no=与我无瓜
actors.mobs.npcs.shopboss.desc=貌似店主也尾随你到达了此处，现在正不停地东张西望，似乎在寻找什么。

actors.mobs.greatshoper.name=店主
actors.mobs.greatshoper.desc=有один段时间没见到的магазин店主，已经和之前判若两人了，从表情和神态中尽显其贪婪与欣喜的嘴脸，其中还包含对你的敌意。\n\n店主利用矮人图书馆里的秘术将自己改造成万法不侵的состояние，而将豪掷千金作为自己的атака手段，还联合了残存的矮人强者加入自己的利益集团。
actors.mobs.greatshoper$goldcurse.name=黄金проклятие
actors.mobs.greatshoper$goldcurse.desc=黄金проклятие是矮人遗留的禁术之один，这是один种强力且只有击杀施咒者才能够结束的проклятие。但是магазин店主自作主张，胡乱修改了这один禁术的名字。\n\n在黄金проклятие的影响下，герой每ходов会损失10枚монеты，如果монеты数量低于100，则每ходов会损失5点жизнь，其他союзник则为每ходов损失5点жизнь。\n\n黄金проклятие会将其他来源的урон转化为отложенный урон，使中咒者难以豁免。
actors.mobs.greatshoper.gold_kill=你被монеты砸死了...
actors.mobs.greatshoper.no_damage=没用的，有此魔力щит，你难以伤我分毫。
actors.mobs.greatshoper.summon=黄金元素，武僧宗师，替我拦住此人！
actors.mobs.greatshoper.summon1=两个废物！提穆尔，保护好我。
actors.mobs.greatshoper.phase4=提穆尔也不能阻挡你吗？那么，让你跟这些财宝陪葬吧！
actors.mobs.greatshoper.die=财宝！我的财宝！

#新精英强敌描述
actors.buffs.championenemy$corrosion.name=Поврежденная элита
actors.buffs.championenemy$corrosion.desc=Скорость атаки в ближнем бою +100% с эффектом коррозионного ила, распыляющего коррозионный ил после смерти
actors.buffs.championenemy$haste.name=Swift Elite
actors.buffs.championenemy$haste.desc=Скорость атаки в ближнем бою +100%, скорость передвижения +50%.
actors.buffs.championenemy$holy.name=Священная элита
actors.buffs.championenemy$holy.desc=Полученный урон -25%. Возрождается с 25% от макс. здоровья после смерти и получает Непобедимость на 5 ходов. Потеряет атрибуты Святой Элиты после возрождения.
actors.buffs.championenemy$transform.name=Transformation Elite
actors.buffs.championenemy$transform.desc=Полученный урон -25%. Возрождайте случайных врагов с 33% от их максимального здоровья после смерти. Потеряйте преобразованные элитные атрибуты и получите 1 случайный элитный атрибут.

actors.mobs.warriorboss.name=воин？
actors.mobs.warriorboss.desc=邪恶的古神擅于掌握他人内心深处的欲望，并以此诱导他们走上黑暗之途，而воин...现在的他希望吞下один切所见的биологический。\n\nвоин？擅长运用狂воин和角斗士的战斗技巧，甚至还能够使用英勇之跃。\n\n在他准备один跃而起之前，或许有什么办法能够_转移他的注意力_，比如..._食物_？
actors.mobs.warriorboss$berserk.name=愤怒
actors.mobs.warriorboss$berserk.angered_desc=воин？所受的伤势程度会增强他的атака力。воин？受到физическийурон时会积攒怒气，赋予他更强的атака力。\n\n怒气会随时间减淡。воин？HP越低，怒气留存的时间越长。\n\n当前怒气：_%.0f%%_\n_+%.0f%%_урон
actors.mobs.warriorboss$combo.name=连击
actors.mobs.warriorboss$combo.desc=воин？在连续打击对手的过程中渐入佳境，每次атака命中都会увеличено1点连击数，但长时间不进行атака会将连击数归零。\n\n到达один定连击数时воин？会激活招架，получает巨量щит并必定уклонение下次受到的атака。激活招架后会重置连击数。\n\n当前的连击数：%1$d\n\n连击将在%2$sходов后丢失。
actors.mobs.warriorboss.eat=这食物真是美味啊。
actors.mobs.warriorboss.def=我也是很灵活的！
actors.mobs.warriorboss.wantjump=可恶，欺负我腿短是吧？！
actors.mobs.warriorboss.wantfood=食物，美味的食物！
actors.mobs.warriorboss.leap=肉蛋葱鸡！
actors.mobs.warriorboss.defeated=还有...很多美食没吃...
actors.mobs.warriorboss.wake=什么？开饭了？
actors.mobs.warriorboss.kill=你被воин？的肉蛋葱鸡压成了肉饼...

actors.mobs.rogueboss.name=вор？
actors.mobs.rogueboss.desc=邪恶的古神善于掌握他人内心深处的欲望，并以此诱导他们走上黑暗之途，而вор...此刻的他正拿着天狗面具为赏金任务的完成而欣喜若狂，看来牢房尽头的天狗就是被他杀死的。\n\nвор？擅长从暗影中发动致命伏击，而在到了于他不利的情况时则会利用其敏捷的步伐快速远离враг并以掷出手里剑作为атака手段。\n\n在他潜入暗影中时，你将无法对他进行近战атака，但未必不能_尝试使用远程手段атака他_。
actors.mobs.rogueboss.notice=哈哈，又один个猎物上钩了!
actors.mobs.rogueboss.invisibility=试着抓住我吧！
actors.mobs.rogueboss.execute=吃我один刀！

actors.mobs.huntressboss.name=охотница？
actors.mobs.huntressboss.desc=古神的腐化将охотница的狩猎本能磨砺成了冷酷的执念。她受到的单次урон不会超过30点；当猎物离开обзор时，她会循着最后的位置主动追踪；完全贴近цель后，她会站稳近战，其余距离则使用弓箭或寻找掩体。处于狙击手阶段时，她的每次普通射击都会完全无视броня，每完成три次普通射击还会瞄准один发贯风箭。жизнь降至один半后，她会转为守望者：普通箭矢不再无视броня，但可能为цель施加有害植物эффект。她的обзор可以穿透草丛，并能踩踏植物来получает短暂的守望者增益。
actors.mobs.huntressboss.discover_hint=你可在某个подземелье区域的结末发现该首领。
actors.mobs.huntressboss.gale_aim=风已经记住了你的落点。
actors.mobs.huntressboss.warden=那就让整座竞技场生根吧！
actors.mobs.huntressboss.defeated=这场狩猎……到此为止。
actors.mobs.huntressboss.boon_blindweed=致盲草，遮蔽我的身形。
actors.mobs.huntressboss.boon_earthroot=地缚根，稳固我的步伐。
actors.mobs.huntressboss.boon_fadeleaf=消逝草，打乱这场追猎。
actors.mobs.huntressboss.boon_firebloom=Огонь花，点燃我的箭矢。
actors.mobs.huntressboss.boon_icecap=冰冠花，Замерзание我的箭矢。
actors.mobs.huntressboss.boon_mageroyal=皇血草，净化我的身躯。
actors.mobs.huntressboss.boon_sorrowmoss=断肠苔，淬毒我的箭矢。
actors.mobs.huntressboss.boon_starflower=星陨花，指引我的准星。
actors.mobs.huntressboss.boon_stormvine=风暴藤，托起我的脚步。
actors.mobs.huntressboss.boon_sungrass=阳春草，愈合我的伤口。
actors.mobs.huntressboss.boon_swiftthistle=速行蓟，加快这场追猎。

actors.mobs.huntressboss$distractinghawk.name=干扰飞鹰
actors.mobs.huntressboss$distractinghawk.desc=охотница？召来牵制猎物的脆弱灵体飞鹰。它的利爪只能造成1点урон，但每次命中都会短暂使цельслепота并увечье。
actors.mobs.huntressboss$distractinghawk.discover_hint=你可在охотница？的首领战中遭遇该враг。

actors.mobs.huntressboss$huntresstentacle.name=竞技场触手
actors.mobs.huntressboss$huntresstentacle.desc=охотница？进入守望者阶段后唤醒的弱小触手。它会堵塞道路，并抽打靠近的цель，对玩家形成持续牵制。
actors.mobs.huntressboss$huntresstentacle.discover_hint=你可在охотница？的守望者阶段遭遇该враг。
actors.mobs.rogueboss.angered=可恶...既然如此...
actors.mobs.rogueboss.enraged=激怒
actors.mobs.rogueboss.momentum=现在还能跟上我的步伐吗？
actors.mobs.rogueboss.momentum-recovery=诶呦我去，累死我了...
actors.mobs.rogueboss.kill=你被вор？的阴招捉弄至死...
actors.mobs.rogueboss.rankings_desc=你被вор？的阴招捉弄至死...
actors.mobs.rogueboss.spkill=你被вор？斩杀了...
actors.mobs.rogueboss.executeninja=вор？：“ниндзя啊，莫怪我卑鄙...”
actors.mobs.rogueboss.defeated=竟然会...比天狗还强...
actors.mobs.rogueboss$absoluteinvisibility.name=影遁
actors.mobs.rogueboss$absoluteinvisibility.spname=准备阶段
actors.mobs.rogueboss$absoluteinvisibility.desc=вор？正使用他身上的暗影斗篷进入невидимостьсостояние。\n\n在此состояние下，你无法对вор？直接进行近战атака，但其在受到远程атака后会немедленно解除невидимость。\n\n当前жизнь高于макс. HP的один半时，невидимостьсостояние下的вор？会进入准备阶段以在10ходов后对你进行斩杀。而在当前жизнь低于макс. HP的один半后，невидимостьсостояние下的вор？的逸动эффект持续时间不会自然снижено。\n\n影遁эффект剩余时长：%sходов
actors.mobs.rogueboss$absoluteinvisibility.spdesc=вор？正耐心等待着，准备从暗影中给出致命один击。\n\n在进行约莫10ходов的准备后，вор？会瞬间冲刺到你身边斩杀你，这один击是无法被躲过且尤为致命的！所幸你的任何远程атака都会打断他使他退出准备阶段。\n\nвор？已经准备了%sходов。
actors.mobs.rogueboss$momentumtime.name=逸动
actors.mobs.rogueboss$momentumtime.spname=восстановление
actors.mobs.rogueboss$momentumtime.desc=вор？正处于逸动состояние，在此期间他会以两倍速进行移动，并拥有更高的уклонение、точностьсвойство与更高的урон加成。\n\n所幸вор？每次受到урон都会уменьшено3ходов逸动состояние的持续时间，在逸动состояние结束后，他会需要休息один段时间才能再进入逸动состояние。\n\nэффект剩余时长：%sходов
actors.mobs.rogueboss$momentumtime.spdesc=вор？刚刚结束了逸动состояние，现在他需要休息один段时间，在此期间他会受到更高的урон。\n\n不过不要大意，вор？在休息的同时仍会积蓄动量，在完全восстановление后就会再次进入逸动состояние。\n\nвор？还需要休息%sходов。
actors.mobs.rogueboss$shadowrogue.name=暗影映像
actors.mobs.rogueboss$shadowrogue.desc=один具无形暗影塑造出的вор？复制体，它один动不动双目空空，烟雾般的黑暗在周围缓缓升腾。\n\n它虽说不上是个完美的复制体，但也是个合格的杀手。вор？在情急之下将它призыв了出来用以拖住你的脚步，而此刻的它正用空洞的双眼紧盯着你...实在令人胆颤。
actors.mobs.rogueboss$shadowrogue.discover_hint=你可在开启特定挑战后在某个подземелье区域发现该враг。


