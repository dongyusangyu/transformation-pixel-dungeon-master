actors.hero.talent.seed_recycling.comment=该талант不影响腐莓之种的正常掉落。\n\n“轮回更替之际，万物蒙受滋养。”\n\n_霜晨_

actors.hero.talent.hedonism.title=享乐主义
actors.hero.talent.hedonism.desc=_+1：_若自身不处于_голод或сильный голодсостояние_，造成的_урондополнительноувеличено2点_，在所有增伤талант前生效。\n\n

_+2：_若自身不处于_голод或сильный голодсостояние_，造成的_урондополнительноувеличено4点_，在所有增伤талант前生效。
actors.hero.talent.hedonism.comment=“逸один时，误один世，逸久逸久罢已零！”

actors.hero.talent.beyond_limit.title=超越极限
actors.hero.talent.beyond_limit.desc=_+1：_升级时获得_20回合极速和激素涌动_。\n\n_+2：_升级时获得_40回合极速和激素涌动_。\n\n_+3：_升级时获得_60回合极速和激素涌动_。
actors.hero.talent.beyond_limit.comment=

