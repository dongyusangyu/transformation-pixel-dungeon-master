actors.hero.talent.cicada_dance.title=空蝉幻舞
actors.hero.talent.cicada_dance.desc=_+1：_英雄通过物理攻击杀死敌人会获得_2回合隐形_。\n\n_+2：_英雄通过物理攻击杀死敌人会获得_3回合隐形_。\n\n_+3：_英雄通过物理攻击杀死敌人会获得_4回合隐形_。
actors.hero.talent.cicada_dance.comment=

actors.hero.talent.chocolate_coins.title=金币巧克力
actors.hero.talent.chocolate_coins.desc=_+1：_当触发饥饿掉血时，如果背包内金币高于75，则_消耗37金币_阻止此次掉血。\n\n_+2：_当触发饥饿掉血时，如果背包内金币高于50，则_消耗25金币_阻止此次掉血。
actors.hero.talent.chocolate_coins.comment=“兴许是某个魔法师的恶趣味，总之这些金币是可以食用的。”

actors.hero.talent.ghost_gift.title=白幽馈赠
