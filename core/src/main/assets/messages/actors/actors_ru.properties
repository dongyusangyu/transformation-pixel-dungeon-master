actors.hero.talent.quantum_hacking.title=量子骇入
actors.hero.talent.quantum_hacking.desc=_+1：_使用посох或жезлзаклинание命中цель后，给予цель_1ходовоглушение_。\n\n

_+2：_使用посох或жезлзаклинание命中цель后，给予цель_2ходовоглушение_。
