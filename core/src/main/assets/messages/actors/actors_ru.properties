actors.hero.abilities.friar.holyprayer.name=Молитва о святом свете
actors.hero.abilities.friar.holyprayer.short_desc=Культиватор проводит IT000, чтобы применить мощные эффекты благословения святого света к себе и своим союзникам.
actors.hero.abilities.friar.holyprayer.desc=Совершенствующийся молился о святом свете и молился о святом свете, чтобы благословить себя и своих союзников. Благословение Света длится 30 раундов.\ n\ nПосле получения Благословения Света Монах продлит его на 50 раундов, если уже есть добродетель, и в течение этого времени он получит дополнительную 50% точность и уклонение.\ n\ nПосле получения Благословения Света союзники получат 20% от своего максимального здоровья, в течение которого они получат дополнительную 100% точность и уклонение.
actors.hero.abilities.friar.holyprayer.cast=В свете, пусть мы победим!

actors.hero.abilities.friar.holyprayer$holyprayerblessing.name=Благословение Святым Светом
actors.hero.abilities.friar.holyprayer$holyprayerblessing.desc=Путь освещен, проход чист, нам нужно только достаточно силы, чтобы следовать за ним.\ n\ nМонахи молились за себя и своих союзников, и теперь Свет защищает всех. Во время Святого Благословения атрибуты точности и уклонения монаха увеличиваются на 50% %, в то время как атрибуты точности и уклонения союзников увеличиваются на 100% %.\ n\ nСвятое Благословение будет продолжаться еще %s раундов, чтобы захватить этот импульс и продвинуться к конечному пункту назначения!
actors.hero.abilities.friar.holyprayer$holyprayerblessing.desc_bane=Путь освещен, проход чист, нам нужно только достаточно силы, чтобы следовать за ним.\ n\ nМонахи молились за себя и своих союзников, и теперь Свет защищает всех. Во время благословения света атрибуты точности и уклонения монахов увеличиваются на 50% %, в то время как атрибуты точности и уклонения союзников увеличиваются на 100% %.\ n\ nКроме того, с этим бонусом благословения монахи и союзники наносят на %1s %% больше физического урона некротическим и демоническим врагам.\ n\ n Благословение света также длится %2$s раундов, захватывая импульс и продвигаясь к конечному пункту назначения!

actors.hero.talent.pious_faith.title=虔诚信仰
actors.hero.talent.pious_faith.desc=_+1：_монах在进行молитва света后会восстановление_25点рассудок_。\n\n

_+2：_монах在进行молитва света后会восстановление_50点рассудок_。\n\n

