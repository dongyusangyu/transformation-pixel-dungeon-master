actors.hero.talent.aid_stomach.comment=“茹毛饮血，生吞活剥。”

actors.hero.talent.weapon_make.title=оружие制造
actors.hero.talent.weapon_make.desc=_+1：_немедленнополучает_1件第три区域能够获取的оружие_。\n\n

_+2：_немедленнополучает_1件第четыре区域能够获取的оружие_。\n\n

_+3：_немедленнополучает_1件第пять区域能够获取的оружие_。
actors.hero.talent.weapon_make.comment=该талантполучает的оружие_会немедленно鉴定且-2сила需求_，此类通过升级或蜕变以直接获取相应资源的талантобщий_26次ограничение срабатывания_(绅士为_39次_)。

actors.hero.talent.secret_stash.title=私房钱
actors.hero.talent.secret_stash.desc=_+1：_немедленнополучает_1000монеты_。\n\n

_+2：_немедленнополучает_1000монеты_。\n\n

_+3：_немедленнополучает_1000монеты_。
actors.hero.talent.secret_stash.comment=此类通过升级或蜕变以直接获取相应资源的талантобщий_26次ограничение срабатывания_(绅士为_39次_)。

actors.hero.talent.earth_meal.title=大地один餐
actors.hero.talent.earth_meal.desc=_+1：_进食получает每ходов衰减один次的_0~геройуровень67%点树肤_。\n\n

_+2：_进食получает每ходов衰减один次的_0~геройуровень133%点树肤_。\n\n

_+3：_进食получает每ходов衰减один次的_0~геройуровень200%点树肤_。
actors.hero.talent.earth_meal.comment=

actors.hero.talent.eaten_slowly.title=细嚼慢咽
actors.hero.talent.eaten_slowly.desc=_+1：_进食_дополнительно花费10ходов_，食物восстановлениесытостьувеличено_30%_。\n\n

_+2：_进食_дополнительно花费10ходов_，食物восстановлениесытостьувеличено_60%_，食用馅饼дополнительнополучает_450ходов饱腹_。
actors.hero.talent.eaten_slowly.comment=该талант对丰饶之角не действует，且该талантпродление进食ходов的优先级会高于один切缩短进食ходов的талант。\n\n开启缩餐节食挑战后，通过该талантполучает的饱腹эффект从450ходов_снижено至150ходов_。\n\n“餐前的繁文冗节而已。”

actors.hero.talent.invincible.title=所向披靡
actors.hero.talent.invincible.desc=_+1：_当有враг死亡时，геройполучает_2ходовгормональный всплеск_。\n\n

_+2：_当有враг死亡时，геройполучает_4ходовгормональный всплеск_。
actors.hero.talent.invincible.comment=“愈战愈勇。”

actors.hero.talent.yog_larva.title=幼虫呼唤
actors.hero.talent.yog_larva.desc=_+1：_受到单次5点以上урон时_призыв1只личинка Древнего Бога_为你作战。\n\n

_+2：_受到单次5点以上урон时_призыв2只личинка Древнего Бога_为你作战。\n\n

_+3：_在+2的基础上，личинка Древнего Бога有_50%вероятность_элитный статус。
actors.hero.talent.yog_larva.comment=

actors.hero.talent.yog_fist.title=巨拳之力
actors.hero.talent.yog_fist.desc=升级该талант后，使用артефакт会получает巨拳之力，该эффект_持续5ходов_，_有20ходовперезарядка_。\n\n_+1：_получает辉暗之拳的сила，получает_40ходовсвечение_，同时физическийатака会造成_5ходовслепота_。\n\n_+2：_在+1的基础上，получаетгорение之拳的сила，получает_10ходов烈焰之力_。\n\n_+3：_在+1和+2的基础上，получает大地之拳的сила，получает每ходов衰减один次的_0~геройуровень50%点树肤_，同时физическийатака会造成_5ходов缠绕_。
actors.hero.talent.yog_fist.comment=
actors.hero.talent$yogfistcooldown.name=巨拳之力-冷却
actors.hero.talent$yogfistcooldown.desc=你刚刚发动过这个天赋，需要稍等才能再次发动。\n\n剩余冷却：%s回合
actors.hero.talent$yogfistpower.name=巨拳之力
actors.hero.talent$yogfistpower.desc=你将在短时间内激发出古神之拳的力量。\n\n剩余时长：%s回合


actors.hero.talent.yog_ray.title=死亡射线
actors.hero.talent.yog_ray.desc=升级该талант后，使用посох对цельзаклинание时会释放死亡射线，_有20ходовперезарядка_。\n\n_+1：_射出_1道40~60点урон_的死亡射线。\n\n_+2：_对单个цельзаклинание最多在其周围射出_3道40~70点урон_的死亡射线。\n\n_+3：_对单个цельзаклинание最多在其周围射出_5道40~80点урон_的死亡射线。
actors.hero.talent.yog_ray.comment=“矮人国王小时候看这集觉醒了死灵崇拜。”
actors.hero.talent$yograycooldown.name=死亡射线-冷却
actors.hero.talent$yograycooldown.desc=你刚刚发动过这个天赋，需要稍等才能再次发动。\n\n剩余冷却：%s回合

actors.hero.talent.afraid_death.title=脚底抹油
actors.hero.talent.afraid_death.desc=_+1：_在_生命值低于30%_时，_移动速度增加30%_，造成的_物理伤害下降50%_。\n\n_+2：_在_生命值低于30%_时，_移动速度增加40%_，造成的_物理伤害下降40%_。\n\n_+3：_在_生命值低于30%_时，_移动速度增加50%_，造成的_物理伤害下降30%_。
actors.hero.talent.afraid_death.comment=

actors.hero.talent.pyromaniac.title=纵火狂
actors.hero.talent.pyromaniac.desc=_+1：_получает_3瓶火龙吐息合剂_。\n\n

_+2：_получает_2瓶Инферно魔药_。\n\n

_+3：_получает_1瓶龙血秘药_。
actors.hero.talent.pyromaniac.comment=此类通过升级或蜕变以直接获取相应资源的талантобщий_26次ограничение срабатывания_(绅士为_39次_)。

actors.hero.talent.reverse_polarity.title=天有撅人之好
actors.hero.talent.reverse_polarity.desc=升级该талант后，当前HP会进行相应的调整。\n\n_+1：_当前HP调整为_1点_。\n\n_+2：_当前HP调整为_макс. HP的50%_。\n\n_+3：_当前HP调整为_макс. HP的100%_。
actors.hero.talent.reverse_polarity.comment=“你那副表情是怎么回事，你那眼泪是怎么回事，你的眼泪可以拯救地球吗？”

actors.hero.talent.hero_name.title=герой之名
actors.hero.talent.hero_name.desc=_+1：_升级时дополнительновосстановление_макс. HP20%的жизнь_。\n\n

_+2：_升级时дополнительновосстановление_макс. HP40%的жизнь_。\n\n

_+3：_升级时дополнительновосстановление_макс. HP60%的жизнь_。
actors.hero.talent.hero_name.comment=

actors.hero.talent.sky_earth.title=天地之力
actors.hero.talent.sky_earth.desc=_+1：_герой处于_парение、缠绕或植被бронясостояние_时，уронувеличено_15%_。\n\n

_+2：_герой处于_парение、缠绕或植被бронясостояние_时，уронувеличено_30%_。\n\n

_+3：_герой处于_парение、缠绕或植被бронясостояние_时，уронувеличено_45%_。
actors.hero.talent.sky_earth.comment=注意，守望者踩上地缚根后不再получает植被броняэффект而是树肤эффект，因此不受该талант影响。\n\n“凌天один怒山河裂，俯地один击晴空崩。”

actors.hero.talent.water_isfood.title=以вода代食
actors.hero.talent.water_isfood.desc=_+1：_饮用зелье时восстановление_30сытость_。\n\n

_+2：_在+1的基础上，饮用вода袋里的роса时восстановление_10倍росапотребляет数的сытость_。\n\n

_+3：_在+1和+2的基础上，_能够触发进食特效_。
actors.hero.talent.water_isfood.comment=

actors.hero.talent.delicious_flying.title=好吃到飞
actors.hero.talent.delicious_flying.desc=_+1：_进食获得_15回合飘浮_。\n\n_+2：_进食获得_25回合飘浮_。
actors.hero.talent.delicious_flying.comment=“吃饭我让你飞起来！”

actors.hero.talent.angel_stance.title=天使姿态
actors.hero.talent.angel_stance.desc=_+1：_英雄处于_发光状态_时，受到攻击会对攻击者造成_30%的魔法反击_。\n\n_+2：_英雄处于_发光状态_时，受到攻击会对攻击者造成_40%的魔法反击_。\n\n_+3：_英雄处于_发光状态_时，受到攻击会对攻击者造成_50%的魔法反击_。
actors.hero.talent.angel_stance.comment=

actors.hero.talent.thorny_rose.title=带刺玫瑰
actors.hero.talent.thorny_rose.desc=_+1：_герой受击时会对атака者施加_原始值为1的кровотечение_。\n\n

_+2：_在+1的基础上，герой受击时还会对атака者造成_1点урон_。
actors.hero.talent.thorny_rose.comment=“她还是没回你吗？”

actors.hero.talent.hometown_cloud.title=故乡的云
actors.hero.talent.hometown_cloud.desc=_+1：_返程时的скорость передвижения_увеличено20%_。\n\n

_+2：_返程时的скорость передвижения_увеличено40%_。\n\n

_+3：_返程时的скорость передвижения_увеличено60%_。
actors.hero.talent.hometown_cloud.comment=герой背包中有Yendor护符就会生效。

actors.hero.talent.deep_freeze.title=极度深寒
actors.hero.talent.deep_freeze.desc=_+1：_拥有寒霜附魔的武器造成的伤害_提升20%_。\n\n_+2：_在+1的基础上，物理攻击可以造成_3回合冻伤_效果。\n\n_+3：_在+1和+2的基础上，对处于_冻伤或冻结状态_的敌人造成的伤害_提升20%_；如果拥有并升级了天赋_破冰行动_，造成的伤害再额外_提升50%_。
actors.hero.talent.deep_freeze.comment=

actors.hero.talent.frenzied_attack.title=道友且慢
actors.hero.talent.frenzied_attack.desc=_+1：_физическийатака有_25%вероятность_造成_2ходовбешенство_。\n\n

_+2：_физическийатака有_50%вероятность_造成_2ходовбешенство_。
actors.hero.talent.frenzied_attack.comment=“横扫道友，做回自己。”

actors.hero.talent.wulei_zhengfa.title=пять雷正法
actors.hero.talent.wulei_zhengfa.desc=_+1：_получает_1根雷霆посох_，герой不再受到雷霆посох的电击урон而是因此_восстановление电击урон20%的жизнь_。\n\n

_+2：_在+1的基础上(不包括获取资源)，雷霆посохзаклинаниеуронувеличено_30%_。
actors.hero.talent.wulei_zhengfa.comment=此类通过升级或蜕变以直接获取相应资源的талантобщий_26次ограничение срабатывания_(绅士为_39次_)。\n\n“加大电量。”

actors.hero.talent.magic_girl.title=马猴烧酒
actors.hero.talent.magic_girl.desc=_+1：_使用свитокполучает_30ходовмаскировка_эффект，在маскировкаэффект下получает_20%посох增伤_。\n\n

_+2：_使用свитокполучает_45ходовмаскировка_和_10ходовсвечение_эффект，在маскировкаэффект下получает_40%посох增伤_。
actors.hero.talent.magic_girl.comment=该талант可以通过阅读无序魔典触发。\n\n“变身！美少女‘воин’！”

actors.hero.talent.wide_knowledge.title=知识渊博
actors.hero.talent.wide_knowledge.desc=_+1：_捡到物品_немедленно了解_其是否有проклятие。\n\n

_+2：_捡到物品_немедленно鉴定_该物品。\n\n

_+3：_在+2的基础上，捡到的物品被鉴定时получает_3ходовзаряд посоха_。
actors.hero.talent.wide_knowledge.comment=

actors.hero.talent.gold_meal.title=饭里藏金
