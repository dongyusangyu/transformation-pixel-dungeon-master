actors.hero.talent.personal_attack.comment=升级该талант会дополнительнополучает_1张盛怒свиток_，同时该талант可以通过阅读无序魔典中的盛怒свиток触发。\n\n此类通过升级或蜕变以直接获取相应资源的талантобщий_26次ограничение срабатывания_(绅士为_39次_)。\n\n“你吼那么大声干嘛。”

actors.hero.talent.shoot_satellite.title=击落卫星
actors.hero.talent.shoot_satellite.desc=_+1：_对处于_飞行состояние_的враг的урон_увеличено20%_。\n\n

_+2：_对处于_飞行состояние_的враг的урон_увеличено30%_。
