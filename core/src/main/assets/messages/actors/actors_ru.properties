actors.hero.talent.abyssal_gaze.desc=_+1：_解离法杖施法穿透生物或固体地形获得的伤害穿透修正效果_提升至2倍_。\n\n_+2：_在+1的基础上，解离法杖施法伤害提升_20%_。
