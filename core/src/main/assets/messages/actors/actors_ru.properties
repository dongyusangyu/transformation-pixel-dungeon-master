actors.hero.talent.dump_truck.comment=_гигантскийсвойство_враг包括DM-200、DM-201、DM-300、魔像、锈蚀之拳、黄金魔像和гигантскийэлитныйвраг。\n\n“直接给你три卡车安排！”

actors.hero.talent.burnout_champion.title=糊人总冠军
