_+2：_进食получает_35монеты_。
actors.hero.talent.gold_meal.comment=“你这口粮是外皮是金子做的还是肉馅是金子做的？”

actors.hero.talent.no_viewrape.title=不要视奸
actors.hero.talent.no_viewrape.desc=_+1：_受到远程урон时，对атака方给予_1ходовслепота_。\n\n

_+2：_受到远程урон时，对атака方给予_2ходовслепота_。\n\n

_+3：_受到远程урон时，对атака方给予_3ходовслепота_。
actors.hero.talent.no_viewrape.comment=“那个穿紫色短裙的矮人和画着浓妆的豺狼是谁！？”

actors.hero.talent.water_ghost.title=вода鬼索命
actors.hero.talent.water_ghost.desc=_+1：_враг于вода中死亡时，有_20%вероятностьпоявление1个призрак_并получает_5ходовбешенство_。\n\n

_+2：_враг于вода中死亡时，有_20%вероятностьпоявление1个腐化призрак_。
