actors.hero.talent.delay_tactic.title=缓兵之计
actors.hero.talent.delay_tactic.desc=_+1：_矮人公主需要_受到2次伤害_才会中断该效果，若受到的伤害来自攻击方则会给予攻击方_2回合迟缓_。\n\n_+2：_矮人公主需要_受到2次伤害_才会中断该效果，若受到的伤害来自攻击方则会给予攻击方_4回合迟缓_。\n\n_+3：_矮人公主需要_受到3次伤害_才会中断该效果，若受到的伤害来自攻击方则会给予攻击方_6回合迟缓_。\n\n_+4：_矮人公主需要_受到3次伤害_才会中断该效果，若受到的伤害来自攻击方则会给予攻击方_8回合迟缓_。
actors.hero.talent.delay_tactic.comment=

actors.hero.abilities.princess.taboomagic.name=Заклинания табу
actors.hero.abilities.princess.taboomagic.short_desc=Карликовая Принцесса может развязать IT000, нанося массивные дебаффы врагам.
actors.hero.abilities.princess.taboomagic.desc=Принцесса-карлик может развязать запрещенные заклинания, найденные в Библиотеке карликов, нанося чрезвычайно злобные проклятия врагам за массивные дебаффы.\ n\ nДополнительные цели для заклинаний не включают ее саму и ее союзников, а враги, выбранные этим заклинанием, получат иллюзию, уязвимость и слабость на срок до 10 ходов. Это заклинание может взорвать Метки Рун, применяемые Магами Рун.
actors.hero.abilities.princess.taboomagic.no_target=Текущее положение не имеет подходящей цели лечения.
actors.hero.abilities.princess.taboomagic.say=Медленно, тихо, вот так жизнь превратилась в пыль.
actors.hero.abilities.princess.taboomagic.say1=Смерть замедлилась до - непредсказуема, не в силах убежать.
actors.hero.abilities.princess.taboomagic.say2=Нельзя ожидать, что разум выдержит такой удар.
actors.hero.abilities.princess.taboomagic.say3=Без сознания, задыхаясь, пересекая грань здравомыслия и впадая в безграничное безумие!

actors.hero.abilities.princess.taboomagic.prompt=Выберите цель высвобождения запрещенного заклинания

actors.hero.talent.element_curse.title=元素проклятие
actors.hero.talent.element_curse.desc=_+1：_禁忌заклинание还会施加_4ходов的горение或8ходов的обморожение_。\n\n

_+2：_在+1的基础上，还会施加_5ходов的缠绕_。\n\n

_+3：_禁忌заклинание还会施加_8ходов的горение或16ходов的обморожение_。\n\n

_+4：_在+3的基础上，还会施加_10ходов的缠绕_。
actors.hero.talent.element_curse.comment=
actors.hero.talent.afflicted_illness.title=病痛缠身
actors.hero.talent.afflicted_illness.desc=_+1：_禁忌法术还会施加_4回合的中毒和原始值为4的流血_。\n\n_+2：_在+1的基础上，还会施加_5回合的残废_。\n\n_+3：_禁忌法术还会施加_8回合的中毒和原始值为8的流血_。\n\n_+4：_在+3的基础上，还会施加_10回合的残废_。
actors.hero.talent.afflicted_illness.comment=
actors.hero.talent.spread_pain.title=散播苦痛
actors.hero.talent.spread_pain.desc=_+1：_дварфийская принцесса在100%заряд брони释放禁忌заклинание时，заклинание的影响область扩大至以选取цель为中心的_3x3область_。\n\n

_+2：_дварфийская принцесса在100%заряд брони释放禁忌заклинание时，заклинание的影响область扩大至以选取цель为中心的_5x5область_。\n\n

_+3：_дварфийская принцесса在100%заряд брони释放禁忌заклинание时，заклинание的影响область扩大至以选取цель为中心的_7x7область_。\n\n

_+4：_дварфийская принцесса在100%заряд брони释放禁忌заклинание时，заклинание的影响область扩大至以选取цель为中心的_9x9область_。
actors.hero.talent.spread_pain.comment=герой或союзник处于这одинобласть时不受影响。

actors.hero.abilities.princess.kingblade.name=Королевский клинок
actors.hero.abilities.princess.kingblade.short_desc=Карликовая Принцесса помахала IT000, нанеся сильный удар по врагу и затруднив ему отпор.
actors.hero.abilities.princess.kingblade.desc=Принцесса-карлик может выполнить обычную атаку с гарантированным попаданием в ближайшего врага, этот удар имеет бонус к урону 50%.\ n\ nЕсли враг, который получает этот удар, не мертв, он будет разоружен на 8 ходов. Если враг умрет, все враги в поле зрения Принцессы-карлика будут разоружены на 4 хода. Разоруженные враги не могут нанести никакого физического урона принцессе-карлику и ее союзникам, а враги-боссы сопротивляются этому эффекту.
actors.hero.abilities.princess.kingblade.no_target=Вам нужно выбрать соседнюю цель.
actors.hero.abilities.princess.kingblade.say1="Шаг вниз!"
actors.hero.abilities.princess.kingblade.say2=Снятие с охраны
actors.hero.abilities.princess.kingblade$disarm.name=Снятие с охраны
actors.hero.abilities.princess.kingblade$disarm.desc=Этот враг был разоружен вами.\ n\ nРазоруженный враг будет продолжать атаковать в течение этого времени, но не сможет нанести никакого физического урона вам и вашим союзникам, в то время как враги-боссы будут по-прежнему наносить 50% % физического урона.\ n\ nПродолжительность разоружения: %s раундов
actors.hero.talent.king_gaze.title=王之怒目
actors.hero.talent.king_gaze.desc=_+1：_在挥下君王之刃的同时，дварфийская принцесса会получает_2ходов的ясновидение_并使обзор内的врагнемедленнополучает_4ходов的разоружение_。\n\n

_+2：_在挥下君王之刃的同时，дварфийская принцесса会получает_4ходов的ясновидение_并使обзор内的врагнемедленнополучает_4ходов的разоружение_。\n\n

_+3：_在挥下君王之刃的同时，дварфийская принцесса会получает_6ходов的ясновидение_并使обзор内的врагнемедленнополучает_4ходов的разоружение_。\n\n

_+4：_在挥下君王之刃的同时，дварфийская принцесса会получает_8ходов的ясновидение_并使обзор内的врагнемедленнополучает_4ходов的разоружение_。
actors.hero.talent.king_gaze.comment=
actors.hero.talent.king_power.title=王之сила
actors.hero.talent.king_power.desc=_+1：_дварфийская принцесса这один击получает的урон加成увеличено至_62.5%_。\n\n

_+2：_дварфийская принцесса这один击получает的урон加成увеличено至_75%_。\n\n

_+3：_дварфийская принцесса这один击получает的урон加成увеличено至_87.5%_。\n\n

_+4：_дварфийская принцесса这один击получает的урон加成увеличено至_100%_。
actors.hero.talent.king_power.comment=
actors.hero.talent.king_might.title=王之威能
actors.hero.talent.king_might.desc=_+1：_若дварфийская принцесса的这один击杀死了враг，则会返还_5%заряд брони_。\n\n

_+2：_若дварфийская принцесса的这один击杀死了враг，则会返还_10%заряд брони_。\n\n

_+3：_若дварфийская принцесса的这один击杀死了враг，则会返还_15%заряд брони_。\n\n

_+4：_若дварфийская принцесса的这один击杀死了враг，则会返还_20%заряд брони_。
actors.hero.talent.king_might.comment=


actors.hero.heroclass.friar=Монах
actors.hero.heroclass.friar_desc_short=Для опрыскивания монахи могут использовать сборочные зелья IT000. Монах способен на IT001, а его IT002 после его здравомыслия исчерпан.
actors.hero.heroclass.friar_desc=Монах изначально несет IT000, который может быть собран с зельями для распыления.\ n\ n Монах способен на IT001. Монах также может потерять рассудок при исследовании подземелья и, когда его разум исчерпан, его IT002.\ n\ nВ то же время, у монаха изначально есть IT003, тканевые доспехи, водяные мешки и бархатные мешки.\ n\ nИзначальные предметы идентификации монаха:\ nIT004 Зелье скорости\ nIT005 Свиток трансформации, Свиток идентификации и Свиток страха
actors.hero.heroclass.friar_unlock=_在一场游戏中击败Yog-Dzewa_以解锁修士。
actors.buffs.reason.name=Разум
actors.buffs.reason.desc_full=Ваше сознание очень ясное, по крайней мере, на данный момент.\ n\ n
actors.buffs.reason.desc_half=Вы чувствуете головокружение, но это не влияет на действие.\ n\ n
actors.buffs.reason.desc_quarter=Голова болит, дыхание затрудняется.\ n\ n
actors.buffs.reason.desc_zero=Ты на грани безумия!\ n\ n
actors.buffs.reason.desc_simple=Столкновение с грозным врагом, попадание в смертельную ловушку или попадание в ловушку голода во время изучения подземелья поглотит ваше редкое здравомыслие. Когда ваш разум исчерпается, ваше сердце будет проверено, и первым придет психическая пытка? Или благородные качества, которые могут быть вдохновлены только в отчаянной ситуации? Никто не знает.\ n\ nКонечно, все не так неудобно. При алхимии или загрузке алхимического пистолета-распылителя вы можете преобразовать необходимую алхимическую энергию ценой потери части вашего здравомыслия. Потребляйте 5 единиц здравомыслия на каждый 1 преобразованную алхимическую энергию.\ n\ nЗдравомыслие обычно не восстанавливается с течением времени, в основном путем убийства врагов, обнаружения скрытых секретов и еды.\ n\ nТекущее здравомыслие: %s/100
actors.buffs.reason.half=Чувствуешь головокружение, но ничего страшного.
actors.buffs.reason.quarter=Вы чувствуете, что ваша голова треснула, и ваш разум блуждает.
actors.buffs.reason.zero=Ты на грани безумия!
actors.buffs.reason.kaoyan=Твой разум проверяется...
actors.buffs.reason.energize_name=Уточнить энергию
actors.buffs.reason.energize_desc=Вы можете усовершенствовать определенные предметы для преобразования в определенную алхимическую энергию, включая зелья, свитки, семена, руны и другие предметы, связанные с алхимией.\ n\ nВы также можете использовать часть своего здравомыслия для преобразования в необходимую алхимическую энергию, обычно потребляя 5 здравомыслия на каждый 1 преобразованную алхимическую энергию.\ n\ nТекущее здравомыслие: %s/100
actors.buffs.reason.energize_item=Выберите элементы для уточнения
actors.buffs.reason.energize_1=Преобразование 5 баллов здравомыслия в 1 балл энергии
actors.buffs.reason.die=Вы умерли от сердечной недостаточности...
actors.buffs.reason.rankings_desc=Умер от: сердечной недостаточности
actors.buffs.suffering.name=Пытка
actors.buffs.suffering.desc=Получите %s!
actors.buffs.suffering$fear.name=Мучение: страх
actors.buffs.suffering$fear.desc=Трусость и трусость, наконец, захватили свою добычу.\ n\ nВаше уклонение составляет +50% %, но физический урон во время этого мучения составляет -25% %.\ n\ nЕсли вам не повезло, что вас поразил враг, есть 30% % шанс уменьшить ваше здравомыслие еще на 5 очков.\ n\ nЭта мука длится %s раундов, и убийство врага быстрее устранит эту муку.\ n\ nЕсли здравомыслие вернется к нулю, вы умрете от болезненных мучений.
actors.buffs.suffering$paranoia.name=Мучение: паранойя
actors.buffs.suffering$paranoia.desc=Иногда люди могут утонуть в безумии, но это случается слишком редко...\ n\ nВ течение этого испытания скорость вашей атаки увеличится на 20% %, но ваша точность составит -20% %.\ n\ nЕсли вы пропустите свою атаку, будет 30% % шанс уменьшить ваше здравомыслие еще на 5 очков.\ n\ nЭто испытание продлится %s раундов, и уничтожение врагов устранит это испытание быстрее.\ n\ nЕсли ваше здравомыслие вернется к нулю, вы умрете в мучительном испытании.
actors.buffs.suffering$despair.name=Мучение: Отчаяние
actors.buffs.suffering$despair.desc=В этом аду нет надежды, даже проблеска надежды.\ n\ nВ течение этого испытания вы двигаетесь на +20% %, но не можете уклониться от атак.\ n\ nЭто испытание будет продолжаться еще %s раундов, а убийство врагов быстрее устранит это испытание.\ n\ nЕсли здравомыслие вернется к нулю, вы умрете в мучительном испытании.
actors.buffs.virtue.name=Достоинство
actors.buffs.virtue.desc=Получите %s!
actors.buffs.virtue$firm.name=Добродетель: Твердость
actors.buffs.virtue$firm.desc=Многие люди впадут в страх и хаос, но не этот человек, не в этот момент!\ n\ nВ течение этого периода добродетели вы получите щит с 25% от вашего максимального здоровья, который не будет потерян спонтанно, и восстановление пролитой жизни также будет преобразовано в щит, который не будет потерян спонтанно.\ n\ nМало того, что каждый раз, когда вы убиваете врага, есть 25% % шанс восстановить еще 6 здравомыслия.\ n\ nЭта добродетель также будет длиться в течение %s раундов, и убийство врага эффективно продлит эту добродетель.\ n\ nЕсли здравомыслие вернется к нулю, вы немедленно восстановите 100 здравомыслия, но потеряете свою добродетель.
actors.buffs.virtue$inspire.name=Добродетель: uplifting
actors.buffs.virtue$inspire.desc=Бесконечные страдания также могут породить надежду и вдохнуть жизненную силу!\ n\ nПоощрение этой добродетели вернет ваше здравомыслие в его лучшее состояние.\ n\ nМало того, что каждый раз, когда вы убиваете врага во время этой добродетели, у вас есть 25% % шанс восстановить дополнительные 10% % от вашего максимального здоровья.\ n\ nЭта добродетель также длится %s раундов, и убийство врага эффективно продлит эту добродетель.\ n\ nЕсли здравомыслие вернется к нулю, вы немедленно восстановите 100 очков здравомыслия, но в результате вы потеряете добродетель.
actors.buffs.virtue$fearless.name=Добродетель: Бесстрашный
actors.buffs.virtue$fearless.desc=Только в самом темном отчаянии внезапная храбрость может пролить свой самый яркий свет.\ n\ nСкорость вашего движения увеличивается на 50% % во время этой добродетели.\ n\ nБолее того, вы не будете бояться темноты и больше не будете затронуты последствиями паники.\ n\ nЭта добродетель также длится %s раундов, и убийство врагов может эффективно продлить эту добродетель.\ n\ nЕсли здравомыслие вернется к нулю, вы немедленно восстановите 100 очков здравомыслия, но потеряете свою добродетель.


actors.buffs.panic.name=Паника
actors.buffs.panic.desc=Увядающие ужасы поглощают душу!\ n\ nАтаки нежити и демонических врагов не только напрямую поглощают ваше здравомыслие, но и могут погрузить вас в страх, как никогда раньше. Уменьшает здравомыслие на 1-2 за ход во время паники.\ n\ nВам также нужно будет потратить еще %s ходов на удаление страха...
actors.buffs.panic.get=Ты так напугана, как никогда раньше!

actors.hero.talent.tranquil_tincture.title=安魂酊剂
actors.hero.talent.tranquil_tincture.desc=_+1：_монах在探索后续几этажподземелье时，可以于магазин中购买_2瓶安魂酊剂_。\n\n

_+2：_монах在探索后续几этажподземелье时，可以于магазин中购买_3瓶安魂酊剂_。
actors.hero.talent.tranquil_tincture.comment=安魂酊剂可快速食用，能восстановление少量сытость、解除惊恐эффект，并为монахвосстановление50点рассудок。

actors.buffs.erodingsoul.name=Инвазия костной эрозии
actors.buffs.erodingsoul.desc=Магия коррупции частично разрушает душу существа, даже если оно не повреждено.\ n\ nСущество, пострадавшее от этого эффекта, имеет 20% шанс стать Проклятием коррупции после смерти, увеличивая шанс на 5% для каждого существующего эффекта дебаффа (не включая сам эффект).\ n\ nЕсли существо испорчено или обречено перед смертью, этот эффект сохраняется и становится Проклятием коррупции сразу после полной смерти.\ n\ nЭтот эффект сохраняется бесконечно до конца его жизни.

actors.hero.talent.eroding_soul.title=Инвазия костной эрозии
actors.hero.talent.eroding_soul.desc=_+1：_получает_1根腐化посох_，腐化посохзаклинаниедополнительно造成永久的_蚀骨侵魂_эффект(对_нежитьсвойство_врагне действует)。\n\n

_+2：_在+1的基础上(不包括获取资源)，腐化посохзаклинание有_50%вероятность_дополнительно施加один个减益。
actors.hero.talent.eroding_soul.comment=получает蚀骨侵魂эффект的биологический在死亡后有_20%+已有减益数量x5%вероятность_化作腐化призрак，若该биологический已被腐化或定命，则这одинэффект会被сохранение直到该биологический彻底死亡后使其直接化作腐化призрак。\n\n此类通过升级或蜕变以直接获取相应资源的талантобщий_26次ограничение срабатывания_(绅士为_39次_)。

actors.hero.talent.credulous.title=信仰背弃
actors.hero.talent.credulous.desc=_+1：_圣典可以施放法术_信仰背弃_，消耗1点充能获得_10回合魔法免疫_。\n\n_+2：_在+1的基础上，该法术施法_不耗时_。
actors.hero.talent.credulous.comment=“背信者，当受罚。”

actors.hero.talent.penetrating_cast.title=突贯
actors.hero.talent.penetrating_cast.desc=_+1：_可直接造成урон的посох或жезлзаклинание会снятиевраг拥有的所有减益эффект，每снятиеодин个减益эффект此次заклинаниеуронувеличено_10%_。\n\n

_+2：_可直接造成урон的посох或жезлзаклинание会снятиевраг拥有的所有减益эффект，每снятиеодин个减益эффект此次заклинаниеуронувеличено_20%_。
actors.hero.talent.penetrating_cast.comment=“将盘踞在враг体表的魔力один并击穿，余下的冲击便会更深地刺入血肉。”

actors.hero.talent.bountiful_enhancement.title=丰饶强化
actors.hero.talent.bountiful_enhancement.desc=_+1：_食用丰饶之角中的食物会获得_5回合丰饶贮存_效果。\n\n_+2：_在+1的基础上，丰饶之角每点充能回复的饱食度增加_20点_。\n\n_+3：_丰饶之角每点充能回复的饱食度增加_30点_。
actors.hero.talent.bountiful_enhancement.comment=丰饶贮存效果结束时会_触发一次进食特效_，短时间内多次食用丰饶之角中的食物不会增加丰饶贮存效果结束时进食特效的触发次数。\n\n“丰饶并不只意味着更多的食物，也意味着每次进食带来的精神上的富足。”
actors.hero.talent$delayedsatisfaction.name=丰饶贮存
actors.hero.talent$delayedsatisfaction.desc=食用丰饶之角中的食物为你带来了精神上的富足，其中的魔力会使你在%s回合后再触发一次进食特效。

actors.hero.talent.ice_hell.title=寒冰地狱
actors.hero.talent.ice_hell.desc=_+1：_冰霜посохзаклинаниеатака处于_обморожениесостояние_的враг时_不再具有урон衰减_。\n\n

_+2：_在+1的基础上，冰霜посохзаклинаниеатака处于_Замерзаниесостояние_的враг时造成_посохуровеньx4_点магическийурон。\n\n

_+3：_在+1和+2的基础上，冰霜посохзаклинание有_50%вероятность_在цель位置появление_3x3область_，持续_10ходов_的寒气。
actors.hero.talent.ice_hell.comment=“寒冷不再只是缓慢地夺走温度，而是将整片空间化为Замерзаниеодин切жизнь的地狱。”

actors.hero.talent.boss_talent_slot_1.title=空白天赋
actors.hero.talent.boss_talent_slot_1.desc=早在下到这座地牢的时候你便隐隐觉得有哪里不对，直到现在你才发现，一些你原本拥有的天赋被抹去了，只余下一片空白...\n\n好在，只要战胜这座地牢深处的强大敌人，你就会获得更为强大的力量。总而言之，现在唯有继续前进这一个选择。\n\n阅读_5层_Boss掉落的升华秘卷即可使该天赋升华为对应的Boss天赋并为1层天赋提供一个额外天赋点，在此之前该天赋不可被升级也不可被蜕变。
actors.hero.talent.boss_talent_slot_1.comment=
