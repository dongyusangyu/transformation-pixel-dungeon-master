actors.hero.talent.overload_charge.title=заряд超载
actors.hero.talent.overload_charge.desc=_+1：посох或заряд артефактаэффект_期间，герой的скорость передвижения_увеличено50%_，近战атакаурон_увеличено30%_。\n\n_+2：посох或заряд артефактаэффект_期间，герой的скорость передвижения_увеличено75%_，近战атакаурон_увеличено50%_。
actors.hero.talent.overload_charge.comment=“警告！警告！”

actors.hero.talent.gas_spurt.title=Токсичный газ喷射
actors.hero.talent.gas_spurt.desc=_+1：_посох或жезлзаклинание时会向цель发射少量的_Токсичный газ气体_。\n\n

_+2：_посох或жезлзаклинание时会向цель发射少量的_酸蚀气体_。
actors.hero.talent.gas_spurt.comment=该талант_有15ходовперезарядка_。\n\n“这одинмагический能力主要源于矮人矿井探险者们对失控矮人механический的研究。”
