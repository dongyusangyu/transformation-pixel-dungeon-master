actors.hero.talent.wolfish_gaze.desc=_+1：_точностьувеличено至原先的_4倍_。\n\n

_+2：_атака_必定_命中。
actors.hero.talent.wolfish_gaze.comment=

actors.hero.talent.fasting.title=电子养胃
actors.hero.talent.fasting.desc=_+1：满HP_时，任何行动появление的сытостьпотребляет-1。\n\n_+2：HP高于80%_时，任何行动появление的сытостьпотребляет-1。
actors.hero.talent.fasting.comment=

actors.hero.talent.strong_attack.title=强力进攻
actors.hero.talent.strong_attack.desc=_+1：_近战атакавраг施加_3ходовуязвимость_。\n\n

_+2：_近战атакавраг施加_5ходовуязвимость_。
actors.hero.talent.strong_attack.comment=该талант_有15ходовперезарядка_。\n\n“蜕变的第один个талант就打破了豺狼术士对于уязвимость的垄断。”
actors.hero.talent$stratkcooldown.name=强力进攻-冷却
actors.hero.talent$stratkcooldown.desc=你刚刚发动过这个天赋，需要稍等才能再次发动。\n\n剩余冷却：%s回合

actors.hero.talent.survival_volition.title=求生意志
actors.hero.talent.survival_volition.desc=_+1：HP低于30%时_受击получает_50%урон抗性、极速、全面净化2ходов_。\n\n_+2：HP低于30%时_受击получает_50%урон抗性、极速、全面净化3ходов_。
actors.hero.talent.survival_volition.comment=该талант_有80ходовперезарядка_。\n\n“嘻嘻，我один定要活下去。”
actors.hero.talent$survolcooldown.name=求生意志-冷却
actors.hero.talent$survolcooldown.desc=你刚刚发动过这个天赋，需要稍等才能再次发动。\n\n剩余冷却：%s回合

actors.hero.talent.trap_master.title=陷阱专家
actors.hero.talent.trap_master.desc=_+1：_使用кристалл-ловушка时有_66%вероятность回收自身_。\n\n

_+2：_使用кристалл-ловушка时有_75%вероятность回收自身_。\n\n

_+3：_使用кристалл-ловушка时有_80%вероятность回收自身_。
actors.hero.talent.trap_master.comment=升级该талант会дополнительнополучает_1个кристалл-ловушка_。\n\n此类通过升级或蜕变以直接获取相应资源的талантобщий_26次ограничение срабатывания_(绅士为_39次_)。

actors.hero.talent.strong_throw.title=强力投掷
actors.hero.talent.strong_throw.desc=_+1：_投掷оружие ближнего боя时对враг造成_2倍оружие阶数_的урон。\n\n

_+2：_投掷оружие ближнего боя时对враг造成_4倍оружие阶数_的урон。
actors.hero.talent.strong_throw.comment=“飞剑回旋镖！”

actors.hero.talent.counter_attack.title=反戈一击
actors.hero.talent.counter_attack.desc=_+1：_受到近战攻击时有_20%概率_造成_英雄等级0.5倍的反击_。\n\n_+2：_受到近战攻击时有_35%概率_造成_英雄等级0.5倍的反击_。\n\n_+3：_受到近战攻击时有_50%概率_造成_英雄等级0.5倍的反击_。
actors.hero.talent.counter_attack.comment=

actors.hero.talent.fear_incarnation.title=страх化身
actors.hero.talent.fear_incarnation.desc=_+1：_атака处于_страхсостояние_的врагдополнительно造成_3点урон_。\n\n

_+2：_атака处于_страхсостояние_的врагдополнительно造成_5点урон_。
actors.hero.talent.fear_incarnation.comment=“在враг胆怯之时给予迎头痛击。”

actors.hero.talent.behest.title=继承遗志
actors.hero.talent.behest.desc=_+1：_当盟友死亡时，给予英雄_5回合激素涌动_。\n\n_+2：_当盟友死亡时，给予英雄_10回合激素涌动_。\n\n_+3：_当盟友死亡时，给予英雄_15回合激素涌动_。
actors.hero.talent.behest.comment=该天赋不会对被腐化、沉沦以及为你卖命的敌人生效。

actors.hero.talent.burning_curse.title=燃咒
actors.hero.talent.burning_curse.desc=_+1：_使用法杖或魔杖施法攻击处于_燃烧状态_的敌人将额外造成_2回合残废_。\n\n_+2：_使用法杖或魔杖施法攻击处于_燃烧状态_的敌人将额外造成_2回合残废_和_2回合失明_。
actors.hero.talent.burning_curse.comment=“火焰魔法第一课：对火焰保持敬畏。”

actors.hero.talent.invisibility_shadows.title=掠阵之影
actors.hero.talent.invisibility_shadows.desc=升级该талант后，герой通过暗影斗篷、невидимостьзелье等方式получает影遁或невидимость时会_появление1个иллюзия_。\n\n_+1：_该талант_有40ходовперезарядка_。\n\n_+2：_该талант_有30ходовперезарядка_。
actors.hero.talent.invisibility_shadows.comment=“并不是暗影军团。”
actors.hero.talent$invshacooldown.name=掠阵之影-冷却
actors.hero.talent$invshacooldown.desc=你刚刚发动过这个天赋，需要稍等才能再次发动。\n\n剩余冷却：%s回合

actors.hero.talent.justice_punish.title=正义惩戒
#fix9：恶魔属性敌人补充生效对象(四小只和大恶魔)
actors.hero.talent.justice_punish.desc=_+1：_физическийатака_нежить和демонсвойство_врагдополнительно造成_20%урон_，击杀他们получает_1ходовблагословение_。\n\n

_+2：_физическийатака_нежить和демонсвойство_врагдополнительно造成_30%урон_，击杀他们получает_2ходовблагословение_。
actors.hero.talent.justice_punish.comment=_нежитьсвойство_враг包括призрак、咒缚灵、骷髅、疯狂小偷、疯狂强盗、监狱守卫、死灵маг、幽魂маг、矮人尸群、дварф-чародей、дварф-монах、武僧大师、矮人国王、大魔导师提穆尔和武僧宗师。\n\n_демонсвойство_враг包括мимик、黄金мимик、вода晶мимик、黑檀мимик、蜕变мимик、腐臭老鼠、粘咕、демон血巢、魅魔、邪眼、巨蝎、酸液巨蝎、личинка Древнего Бога、горение/大地/腐烂/锈蚀/辉耀/暗影之拳、Yog-Dzewa、纳垢/奸奇/恐虐/色孽信徒和大демон。\n\nдемон撕裂者同时拥有_нежить和демонсвойство_但该талант不会因此双倍生效。\n\n“我会追杀你们，直到地狱的尽头。”

actors.hero.talent.overwhelming.title=排山倒海
actors.hero.talent.overwhelming.desc=升级该талант后，герой能从较慢的атакаскорость中получает增益。\n\n_+1：_атака耗时超出1ходов的部分将以_0.33倍_加成到урон并以_0.5倍_加成到точность。\n\n_+2：_атака耗时超出1ходов的部分将以_0.66倍_加成到урон并以_1倍_加成到точность。\n\n_+2：_атака耗时超出1ходов的部分将以_1倍_加成到урон并以_1.5倍_加成到точность。
actors.hero.talent.overwhelming.comment=来自_萝卜подземелье_的强大сила！


actors.hero.talent.energy_conversion.title=动能转换
actors.hero.talent.energy_conversion.desc=_+1：_артефакт、посох、бронянавык和武技的скорость зарядки变为_скорость передвижения的0.5倍_，不会低于原速率。\n\n

_+2：_артефакт、посох、бронянавык和武技的скорость зарядки变为_скорость передвижения的1倍_，不会低于原速率。
actors.hero.talent.energy_conversion.comment=来自_萝卜подземелье_的强大сила！

actors.hero.talent.magic_recycling.title=魔力回收
actors.hero.talent.magic_recycling.desc=_+1：_使用посох或жезлзаклинание时有_10%вероятность_不потребляетзаряд。\n\n

_+2：_使用посох或жезлзаклинание时有_15%вероятность_不потребляетзаряд。\n\n

_+3：_使用посох或жезлзаклинание时有_20%вероятность_不потребляетзаряд。
actors.hero.talent.magic_recycling.comment=

actors.hero.talent.precious_experience.title=宝贵опыт
actors.hero.talent.precious_experience.desc=_+1：_饮用опытзелье或神意启发合剂дополнительнополучает_半级опыт_。\n\n

_+2：_在+1的基础上，дополнительнополучает_50ходовблагословение_эффект。
actors.hero.talent.precious_experience.comment=“这опыт啊，десять分的宝贵。”

actors.hero.talent.disturb_attack.title=扰乱打击
actors.hero.talent.disturb_attack.desc=_+1：_физическийатакавраг有_10%вероятность_造成_3ходовоглушение_。\n\n

_+2：_физическийатакавраг有_20%вероятность_造成_3ходовоглушение_。
actors.hero.talent.disturb_attack.comment=“其实是往оружие上涂抹了致幻性液体。”

actors.hero.talent.gholl_witchcraft.title=豺狼巫术
actors.hero.talent.gholl_witchcraft.desc=_+1：_атака处于_попадание стрелысостояние_的враг造成_2ходовзамешательство_。\n\n

_+2：_атака处于_попадание стрелысостояние_的враг造成_3ходовзамешательство_。
actors.hero.talent.gholl_witchcraft.comment=“人类对豺狼人один族所使用的巫术的拙劣复现。”

actors.hero.talent.engineer_refit.title=工程技师
actors.hero.talent.engineer_refit.desc=_+1：_击杀_механический类_враг有_12.5%вероятность_将其改装成DM-100并腐化。\n\n

_+2：_击杀_механический类_враг有_25%вероятность_将其改装成DM-100并腐化。
actors.hero.talent.engineer_refit.comment=若DM-400(包括随机模式中非DM-400的AT-400和AU-400专精)получает该талант，则дрон损毁时也将有вероятность被改装成DM-100并腐化。\n\n_механический类_враг包括活化石像、призыв守卫、装甲石像、DM-100、DM-200、DM-201、能源塔、DM-300、魔像和黄金魔像。\n\n“你懂механический工程吗？”

actors.hero.talent.weird_throw.title=诡异投掷
actors.hero.talent.weird_throw.desc=_+1：_将非метательное оружие的оружие掷向враг会造成_1ходовстрах_。\n\n

_+2：_将非метательное оружие的оружие掷向враг会造成_2ходовстрах_。
actors.hero.talent.weird_throw.comment=“不知道对方会扔出什么玩意儿来的确是件可怕的事情。”

actors.hero.talent.thrid_hand.title=第три只手
actors.hero.talent.thrid_hand.desc=_+1：_有_10%вероятность_购买物品不потребляетмонеты。\n\n

_+2：_有_20%вероятность_购买物品不потребляетмонеты。
actors.hero.talent.thrid_hand.comment=“我就顺包口粮。”
actors.hero.talent.thrid_hand.steal=你趁老板不注意，拾走了这件商品。

actors.hero.talent.water_attack.title=вода性атака
actors.hero.talent.water_attack.desc=_+1：_герой在вода中会дополнительно造成_1点урон_。\n\n

_+2：_герой在вода中会дополнительно造成_2点урон_。
actors.hero.talent.water_attack.comment=“快来вода，快来вода。”

actors.hero.talent.more_chance.title=更多机会
actors.hero.talent.more_chance.desc=_+1：_使用蜕变свиток和蜕变结晶有_10%вероятность不потребляет_。\n\n

_+2：_使用蜕变свиток和蜕变结晶有_20%вероятность不потребляет_。
actors.hero.talent.more_chance.comment=“答应我，赌下去。”

actors.hero.talent.amazing_eyesight.title=眼力惊人
actors.hero.talent.amazing_eyesight.desc=_+1：_对_3格及以外距离_的敌人的近战伤害提升_35%_，精准增加_35%_。\n\n_+2：_对_2格及以外距离_的敌人的近战伤害提升_35%_，精准增加_35%_。
actors.hero.talent.amazing_eyesight.comment=“一寸长一寸强。”

actors.hero.talent.light_application.title=轻甲运用
actors.hero.talent.light_application.desc=_+1：_基础уклонениеувеличено_5-броня阶数_。\n\n

_+2：_在+1的基础上，эффект_翻倍_。
actors.hero.talent.light_application.comment=不穿доспехине действует。\n\n“其实是色诱术。”

actors.hero.talent.heavy_application.title=重甲运用
actors.hero.talent.heavy_application.desc=_+1：_最大броняувеличено_броня阶数_。\n\n

_+2：_在+1的基础上，эффект_翻倍_。
actors.hero.talent.heavy_application.comment=不穿доспехине действует。\n\n“不仅仅是垫了один本书。”

actors.hero.talent.bless_meal.title=赐福圣餐
actors.hero.talent.bless_meal.desc=_+1：_进食只花费1回合，并获得_25回合赐福_效果。\n\n_+2：_进食只花费1回合，并获得_35回合赐福_效果。
actors.hero.talent.bless_meal.comment=“感谢主赐予我们温饱。”

actors.hero.talent.bomb_maniac.title=爆破狂魔
actors.hero.talent.bomb_maniac.desc=_+1：_炸弹_伤害提升25%_。\n\n_+2：_炸弹_伤害提升50%_。
actors.hero.talent.bomb_maniac.comment=升级该天赋会额外获得_1个炸弹_。\n\n通过升级或蜕变该天赋以直接获取资源的次数不受限制。\n\n“艺术就是爆炸。”

actors.hero.talent.phantom_shooter.title=幻影射手
actors.hero.talent.phantom_shooter.desc=_+1：_使用метательное оружие时дополнительно投掷1个幻影метательное оружие造成_10%的метательное оружиеурон_。\n\n

_+2：_使用метательное оружие时дополнительно投掷1个幻影метательное оружие造成_20%的метательное оружиеурон_。\n\n

_+3：_使用метательное оружие时дополнительно投掷1个幻影метательное оружие造成_30%的метательное оружиеурон_。
actors.hero.talent.phantom_shooter.comment=

actors.hero.talent.wake_snake.title=打草惊蛇
actors.hero.talent.wake_snake.desc=_+1：_其他биологический踩высокая трава有_10%вероятностьпоявление1只гнилая гигантская змея_。\n\n

_+2：_其他биологический踩высокая трава有_20%вероятностьпоявление1只гнилая гигантская змея_。
actors.hero.talent.wake_snake.comment=“蛇страх症的福音。”

actors.hero.talent.collection_gold.title=金币护盾
actors.hero.talent.collection_gold.desc=_+1：_每当捡起金币时增加_1点护盾_。\n\n_+2：_每当捡起金币时增加_2点护盾_。
actors.hero.talent.collection_gold.comment=“满身铜臭。”

actors.hero.talent.martial_train.title=武技训练
actors.hero.talent.martial_train.desc=升级该талант后，герой能够使用武技，拥有少量随талантуровеньувеличено的武技заряд上限，并且每90ходоввосстановление1点武技заряд。\n\n_+1：_武技заряд上限为_2点_。\n\n_+2：_武技заряд上限为_3点_。\n\n_+3：_武技заряд上限为_4点_。
actors.hero.talent.martial_train.comment=因此能够使用武技的герой可以通过使用武技以触发талант_烈气щит_、_专注один餐_、_оружиезаряд_、_夺命余势_和_точность打击_的常规эффект而非兼容эффект。\n\n若герой本就能使用武技，则在_+1/+2/+3_уровень时仅会увеличено_1/2/3点_武技заряд上限。\n\n“功夫不负有心人。”

actors.hero.talent.thickened_armor.title=加厚броня
actors.hero.talent.thickened_armor.desc=_+1：_доспехи提供的_最高броня+1_。\n\n

_+2：_доспехи提供的_最高броня+2_。
actors.hero.talent.thickened_armor.comment=不穿доспехине действует。\n\n“只是往胸口垫了本书。”

actors.hero.talent.powerful_calculations.title=算无遗策
