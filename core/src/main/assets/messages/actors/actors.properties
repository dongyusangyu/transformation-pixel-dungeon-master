actors.hero.talent.potential_4.desc=_+1: _Get _1 Transformation Scroll_.\n\n_+2: _No effect.\n\nThis kind of talent sharing that directly obtains corresponding resources through upgrading or transformation has a limit of 26 triggers (for gentlemen, 39 times).
actors.hero.talent.potential_5.title=Potential 5
actors.hero.talent.potential_5.desc=_+1: _Get _1 Transformation Scroll_.\n\n_+2: _No effect.\n\nThis kind of talent sharing that directly obtains corresponding resources through upgrading or transformation has a limit of 26 triggers (for gentlemen, 39 times).
actors.hero.talent.potential_6.title=Potential 6
actors.hero.talent.potential_6.desc=_+1: _Get _1 Transformation Scroll_.\n\n_+2: _Get _1 Transformation Scroll_.\n\n_+3: _No effect.\n\nThis kind of talent sharing that directly obtains corresponding resources through upgrading or transformation has a limit of 26 triggers (for gentlemen, 39 times).
actors.hero.talent.potential_7.title=Potential 7
actors.hero.talent.potential_7.desc=_+1: _Get _1 Transformation Scroll_.\n\n_+2: _Get _1 Transformation Scroll_.\n\n_+3: _No effect.\n\nThis kind of talent sharing that directly obtains corresponding resources through upgrading or transformation has a limit of 26 triggers (for gentlemen, 39 times).
actors.hero.talent.potential_8.title=Potential 8
actors.hero.talent.potential_8.desc=_+1: _Get _1 Transformation Scroll_.\n\n_+2: _Get _1 Transformation Scroll_.\n\n_+3: _No effect.\n\nThis kind of talent sharing that directly obtains corresponding resources through upgrading or transformation has a limit of 26 triggers (for gentlemen, 39 times).
actors.hero.talent.potential_9.title=Potential 9
actors.hero.talent.potential_9.desc=_+1: _Get _1 Transformation Scroll_.\n\n_+2: _Get _1 Transformation Scroll_.\n\n_+3: _No effect.\n\nThis kind of talent sharing that directly obtains corresponding resources through upgrading or transformation has a limit of 26 triggers (for gentlemen, 39 times).
actors.hero.talent.abyssal_gaze.title=Abyssal Gaze
actors.hero.talent.abyssal_gaze.desc=_+1: _The Disintegration Staff's _damage penetration modifier is increased by 2x_.\n\n_+2: _On the basis of +1, the Disintegration Staff's _damage is increased by 20%_.\n\nTalent type: _Spell Damage_.\n\n"When you stare into the abyss, the abyss stares into you."
actors.hero.talent.moronity.title=Folly
actors.hero.talent.moronity.desc=_+1: _Casting a spell with a staff or wand will _randomly cause illusion, vulnerability or weakness for 1 round_.\n\n_+2: _Casting a spell with a staff or wand will _randomly cause illusion, vulnerability or weakness for 2 turns_.\n\n_+3: _Casting a spell with a staff or wand will _randomly cause illusion, vulnerability or weakness for 3 rounds_.\n\nTalent type: _Spell Damage_.\n\nThis talent randomly applies one of three debuffs instead of applying them all at once.
actors.hero.talent.journey_nature.title=Journey Nature
actors.hero.talent.journey_nature.desc=_+1: _The probability of dropping Nature's Foot Seeds is increased by 50%_.\n\n_+2: _On the basis of +1, the root charge consumption is reduced by 50%_ (_the charge threshold when used is not changed_).\n\nTalent type: _spell_.\n\n"Shoes worn by a huntress."
actors.hero.talent.love_backstab.title=Love Backstab
actors.hero.talent.love_backstab.desc=_+1: _Increases damage by _15%_ to units that are _charmed_.\n\n_+2: _Damage increased by _30%_ against units in _Charmed_ state.\n\n_+3: _Damage increased by _45%_ against units that are _charmed_.\n\nTalent type: _physical attack type_.\n\n"The first sword you strike in prison is to kill the person you want first."
actors.hero.talent.concept_grid.title=Concept Grid
actors.hero.talent.concept_grid.desc=_+1: _Damage -1_ caused by non-hunger damage and delayed damage, calculated after all damage reduction.\n\n_+2: _Damage -2_ caused by non-hunger damage and delayed damage, calculated after all damage reduction.\n\n_+3: _Damage -3_ caused by non-hunger damage and delayed damage, calculated after all damage reduction.\n\nTalent type: _auxiliary_.
actors.hero.talent.abacus.title=Abacus
actors.hero.talent.abacus.desc=_+1: _Physical attack_50% probability_Increase _2 points to superimpose shield_.\n\n_+2: _Physical attack_75% probability_Increase _2 points to superimpose shield_.\n\n_+3: _Physical attack_must_increase_2 points to superimpose shield_.\n\nTalent type: _physical attack type_.
actors.hero.talent.time_sand.title=Time Sand
actors.hero.talent.time_sand.desc=_+1:_The turns you can skip when the time hourglass is stagnant are _double_.\n\n_+2: On the basis of +1, the time hourglass freezes the surrounding area for _turn +1_ (consuming the first point of charge does not increase the number of turns).\n\n_+3: _On the basis of +1 and +2, the charging speed of the Time Hourglass is increased by _20%_.\n\nTalent type: _spell_.\n\n"THE WORLD!!!"
actors.hero.talent.damaged_core.title=Damaged Core
actors.hero.talent.damaged_core.desc=_+1: _Physical attacks come with _1 point of magic damage_.\n\n_+2: _Physical attacks come with _2 points of magic damage_.\n\nTalent type: _Spell Damage_.\n\n"The best chicken pot in the world!"
actors.hero.talent.read_profitable.title=Read Profitable
actors.hero.talent.read_profitable.desc=After upgrading this talent, you will receive _1 type of buff_ randomly each time you read the scroll.\n\n_+1: _Random buffs include _5 turns of total purification, floating, or extreme speed_.\n\n_+2: _In addition to +1, it also includes _5 turns of invisibility_.\n\n_+3: _In addition to +1 and +2, it also includes restoring _12.5% ​​of maximum health_.\n\nTalent type: _Special effects_.\n\nThis talent can be triggered by reading the Grimoire of Disorder.
actors.hero.talent.strength_cloak.title=Strength Cloak
actors.hero.talent.strength_cloak.desc=_+1: _Each point of charge of Shadow Cloak will grant _1 additional round of photo escape_.\n\n_+2: _Each point of charge of Shadow Cloak will grant _1.5 additional turns of photo escape_.\n\n_+3:_Each point of charge of the Shadow Cloak will grant _2 additional turns of photo escape_, and the charging speed of the Shadow Cloak will be increased by _20%_.\n\nTalent type: _spell_.
actors.hero.talent.anesthesia.title=Anesthesia
actors.hero.talent.anesthesia.desc=_+1: _Drink the potion to gain _5 shield points_ to resist the next damage.\n\n_+2: _Drink the potion to gain _8 shield points_ to resist the next damage.\n\nTalent type: _Special effects_.\n\n"Tincture Ketones."
actors.hero.talent.wanling_potion.title=Wanling Potion
actors.hero.talent.wanling_potion.desc=_+1:_Drink the potion to obtain _2 turns of comprehensive purification_.\n\n_+2: _Drink the potion to obtain _3 turns of comprehensive purification_.\n\n_+3:_Drink the potion to obtain _4 turns of comprehensive purification_ and clear all current debuffs on the hero.\n\nTalent type: _Special effects_.\n\n"It's not the panacea some king wants."
actors.hero.talent.active_muscles.title=Active Muscles
actors.hero.talent.active_muscles.desc=_+1: _Gain _2 points of temporary strength_ when leveling up.\n\n_+2: _Gain _4 points of temporary strength_ when leveling up.\n\n_+3: _Gain _6 points of temporary strength_ when leveling up.\n\nTalent type: _auxiliary_.\n\nThis effect lasts for 400 turns.
actors.hero.talent.sea_wind.title=Sea Wind
actors.hero.talent.sea_wind.desc=_+1: _The hero's movement speed increases by _20%_ in the water.\n\n_+2: _The hero's movement speed increases by _40%_ in the water.\n\n_+3: _The hero's movement speed increases by _60%_ in the water.\n\nTalent type: _auxiliary_.\n\n"The wind is blowing and the clouds are flying."\n\n_radish goo_
actors.hero.talent.endless_meal.title=Endless Meal
actors.hero.talent.endless_meal.desc=_+1: _Eat to get _2 turn time bubbles_.\n\n_+2: _Eat to get _4 turn time bubbles_.\n\n_+3: _Eat to get _6-turn time bubble_.\n\nTalent type: _Special effects_.
actors.hero.talent.experience_meal.title=Experience Meal
actors.hero.talent.experience_meal.desc=_+1: _Eat to gain _2 experience points_.\n\n_+2: _Gain _3 experience points_ from eating.\n\nTalent type: _Resource type_.\n\nThis talent is shared with the talents _Kumogakure's Meal_, _Invincible Meal_ and _Birthday Gift_ with a 100 trigger limit_.\n\n"Eat every bite, eat every bite, eat every bite, eat every bite..."
actors.hero.talent.birthday_gift.title=Birthday Gift
actors.hero.talent.birthday_gift.desc=_+1: _Eating has a _17% chance of getting _1 low-level drop_.\n\n_+2: _Eating has a _33% chance of getting _1 low-level drop_.\n\n_+3: _Eating has a _50% chance of getting _1 low-level drop_.\n\nTalent type: _Resource type_.\n\nThis talent is shared with the talents _Eat Experience_, _Cloud Hidden Meal_ and _Invincible Meal_ with a 100 trigger limit_.\n\n"Happy Birthday!"
actors.hero.talent.collect_plants.title=Collect Plants
actors.hero.talent.collect_plants.desc=_+1: _Get _3 random seeds_.\n\n_+2: _Get _4 random seeds_.\n\n_+3: _Get _5 random seeds_ and _1 tasteless fruit_.\n\nTalent type: _Resource type_.\n\nThis kind of talent sharing that directly obtains corresponding resources through upgrading or transformation has a limit of 26 triggers (for gentlemen, 39 times).\n\nThis talent does not grant you rotberry seeds.
actors.hero.talent.sharp_head.title=Sharp Head
actors.hero.talent.sharp_head.desc=_+1: _Strength_+3_, accuracy _down by 17%_.\n\n_+2: _Strength_+6_, accuracy _down 33%_.\n\n_+3: _Strength_+9_, accuracy _dropped by 50%_.\n\nTalent type: _Other types_.\n\n"Then let me ask you."
actors.hero.talent.strength_armband.title=Strength Armband
actors.hero.talent.strength_armband.desc=_+1:_The Thief's Armband charging speed is increased by _20%_.\n\n_+2: _On the basis of +1, the _effective time of the debuff effect given by the Thief Armband is extended by 30%_.\n\n_+3: _On the basis of +1 and +2, stealing from the enemy will give you _3 turns of hormone surge_, and stealing from the store will reduce _1 point_ of charge consumption (_does not change the stealing success rate and the charge threshold when used_, at least 1 charge point will be consumed).\n\nTalent type: _spell_.
actors.hero.talent.strength_book.title=Strength Book
actors.hero.talent.strength_book.desc=_+1: _Reading the disordered grimoire will trigger the combat/non-combat scroll effect based on whether there are enemies within the field of view.\n\n_+2: _On the basis of +1, the charging speed of the Grimoire of Disorder is increased by _20%_.\n\nTalent type: _spell_.\n\nLike the disordered crystals, _combat_ scrolls include Mirror/Charge/Teleport/Hypnosis/Rage/Revenge/Fear scrolls, while _Non-combat_scrolls include Identify/Dispel/Charge/Teleport/Hypnosis/Earth-penetrating scrolls.\n\n"This is the real Grimoire of Disorder."
actors.hero.talent.eternal_curse.title=Eternal Curse
actors.hero.talent.eternal_curse.desc=_+0: _At least _2 Evil Dispelling Scrolls_ are required to remove the curse.\n\n_+1: _Only one Scroll of Exorcism is needed to remove the curse, but _the curse enchantment/marking_ will still be retained.\n\n_+2: _Only 1 Quxie is needed to completely remove the curse.\n\nTalent type: _Limited to 1_.\n\n"If you curse too much, you won't be overwhelmed."\n\n_Curse from DM-216_
actors.hero.talent.eternal_curse.unremove=There are not enough exorcisms to remove the curse.
actors.hero.talent.eater.title=Eater
actors.hero.talent.eater.desc=_+0: _Hunger speed increased by _30%_.\n\n_+1: _Hunger speed increased by _15%_.\n\n_+2:_Hunger speed does not increase.\n\nTalent type: _Limited to 2_.\n\n"A full belly with thunderous and spicy taste"\nFull belly, thunderous and spicy\nLei Lei is full and beaten.\nEat and drink until you are full and full and thunderous\nThere is a game that gets richer the more you play it\nIt's the dungeon transformation elite\nNo one here wants to teach you\nNo matter how you play, it's all dungeon express\nI imprisoned everyone for being active.\nChoose a Fasun and sit in jail\nYou said you are a senior prison critic\nIf you are too picky, you will be beaten like a bad pen.\nI'm just full and my stomach is pounding.\nCan you send me a cornucopia horn to eat?\nThe people from the upper level are here to fight the evil spirits."
actors.hero.talent.fate_decision.title=Fate Decision
actors.hero.talent.fate_decision.desc=_+0: _Transformation_Option-2_.\n\n_+1: _Transformation_Option-1_.\n\n_+2: _Transformation options remain unchanged.\n\nTalent type: _Limited to 1_.\n\n"This is destiny."\n\n_Anger from DM-216 about not being able to roll his left and right hands_
actors.hero.talent.endless_malice.title=Endless Malice
actors.hero.talent.endless_malice.desc=_+0: _Every time you pick up an item, there is a 40% chance of deducting 10% of your maximum health.\n\n_+1: _Every time you pick up an item, there is a _30% chance of deducting _5%_ of your maximum health.\n\n_+2:_Living will no longer be deducted from picking up items.\n\nTalent type: _General type_.\n\n"You can feel the malice these objects hold for their new owners."\n\n_Maliciousness from DM-216_
actors.hero.talent.endless_malice.kill=You're killed by deliberate game design...
actors.hero.talent.endless_malice.rankings_desc=Death by: Deliberate Game Design
actors.hero.talent.feeble.title=Feeble
actors.hero.talent.feeble.desc=_+0: _Physical damage_reduced by 20%_.\n\n_+1: _Physical damage_reduced by 10%_.\n\n_+2:_Physical damage is not reduced.\n\nTalent type: _Limited to 3_.\n\n"Miscellaneous Fish - Miscellaneous Fish Attack"
actors.hero.talent.malnutrition.title=Malnutrition
actors.hero.talent.malnutrition.desc=_+0: In the state of extreme hunger, you will gain _10 turns of illusion and weakness_ every time your blood is deducted due to hunger.\n\n_+1: In the state of extreme hunger, you will gain _10 turns of weakness_ every time your blood is deducted due to hunger.\n\n_+2: _No additional debuffs will be gained while in extreme hunger state.\n\nTalent type: _Limited to 2_.\n\n"Treatment Recipe: KFC Family Bucket x1\nTotal cost: 50. "
actors.hero.talent.shortsighted.title=Shortsighted
actors.hero.talent.shortsighted.desc=_+0: _Visual field_reduced by 40%_.\n\n_+1: _Visual field_reduced by 20%_.\n\n_+2: _Visual field is no longer reduced.\n\nTalent type: _General type_.
actors.hero.talent.bat_serum.title=Bat Serum
actors.hero.talent.bat_serum.desc=_+0: _The enemy will gain _40% blood-stealing effect_ when causing damage in melee combat.\n\n_+1: _The enemy will gain _20% blood-stealing effect_ when causing damage in melee combat.\n\n_+2:_Enemies no longer receive additional lifestealing effects.\n\nTalent type: _Limited to 3_.\n\n"Aspirations are hungry and the meat of heroes is eaten, and people who are thirsty for laughter and talk are full of blood."
actors.hero.talent.myopia.title=Myopia
actors.hero.talent.myopia.desc=_+0: _Accuracy_reduced by 40%_.\n\n_+1: _Accuracy_reduced by 20%_.\n\n_+2: _Accuracy is no longer reduced.\n\nTalent type: _Limited to 4_.
actors.hero.talent.land_swimming.title=Land Swimming
actors.hero.talent.land_swimming.desc=_+0: _Giant Piranha and Phantom Piranha are replaced by Giant Land Piranha and Phantom Land Piranha respectively, with the same attributes as before replacement.\n\n_+1:_The movement speed of Giant Land Piranha and Phantom Land Piranha is reduced by 50%.\n\n_+2:_Giant Piranha and Phantom Piranha are no longer replaced by Giant Land Piranha and Phantom Land Piranha. Giant Land Piranha and Phantom Land Piranha on the shore will die directly.\n\nTalent type: _General type_.\n\n"The Master said when he was on the river, the dead are like this."\n\n_——Ke Ze said on the upper edge of the river that people killed by piranhas here are as endless as the river water_
actors.hero.talent.jiulongla_coffin.title=Nine Dragons Pull Coffin
actors.hero.talent.jiulongla_coffin.desc=_+0: _Reduce the hero's maximum health by _40%_.\n\n_+1: _Reduce the hero's maximum health by 20%_.\n\n_+2: _No longer reduces the hero's maximum health.\n\nTalent type: _Limited to 4_.\n\n"The bad news came from the dungeon circle. The dungeon hero warrior brother overeated and was full of food at level 30. In the end, he was shot to death by the ancient god's laser and ascended to the meat pie planet."
actors.hero.talent.cowboy.title=Cowboy
actors.hero.talent.cowboy.desc=_+0: _There is a _30% probability_ of being replaced by _stone_ when purchasing an item.\n\n_+1: _There is a _15% chance_ of being replaced by _stone_ when purchasing an item.\n\n_+2:_Purchased items are no longer replaced with stone.\n\nTalent type: _General type_.\n\nNote that packages (scroll tubes, potion slings, and magic tube pouches) are also included.\n\n"All legitimate proceeds from this project will be used to purchase food rations."\n\n_——If you are hungry, you may be hungry_
actors.hero.talent.mamba_out.title=Mamba Out
actors.hero.talent.mamba_out.desc=_+0: _Additional _50%_ of maximum health will be gained when falling. _Delayed damage_.\n\n_+1: _Additional _25%_ of maximum health will be gained to _delay damage_ when falling.\n\n_+2: _Falling will no longer cause additional delayed damage.\n\nTalent type: _Limited to 1_.\n\n"Slow down! I'll kill that person! Mambaot!"
actors.hero.talent.explosion_meal.title=Explosion Meal
actors.hero.talent.explosion_meal.desc=_+0: _Eating has a _20% probability_ of exploding.\n\n_+1: _Eating has a _10% probability_ of exploding.\n\n_+2:_Eating no longer explodes.\n\nTalent type: _General type_.\n\n"You are the Jade Faced Grenadier King."\n\n_——If not_
actors.hero.talent.handon_ground.title=Hand On Ground
actors.hero.talent.handon_ground.desc=_+0: _When the _floating state_ is released, the _original value is 20% of the current health value bleed_ effect.\n\n_+1: _When the _floating state_ is released, the _original value is 10% of the current health value bleed_ effect.\n\n_+2:_Cancel the floating state and no longer bleed.\n\nTalent type: _Limited to 1_.\n\n"Be careful when landing..."\n"It works wonders when paired with delicious food."\n\n_——If not_
actors.hero.talent.chill_water.title=Chill Water
actors.hero.talent.chill_water.desc=_+0: _There is a _30% chance of _obtaining _frostbite_ effect when drinking dew drops and potions.\n\n_+1: _When drinking dew, there is a _15% chance of _obtaining _frostbite_ effect, and drinking potion will no longer cause frostbite.\n\n_+2:_Drinking dew and potions no longer causes frostbite.\n\nTalent type: _Limited to 2_.\n\n"If you are unlucky, your teeth will get clogged if you drink water."\n\n_"But it won't have any impact on the game"——Ke Ze's whisper_
actors.hero.talent.life_sport.title=Life Sport
actors.hero.talent.life_sport.desc=_+0: _Waiting will take _2 points of damage_.\n\n_+1: _Waiting will take _1 damage_.\n\n_+2:_Waiting no longer takes damage.\n\nTalent type: _Limited to 4_.\n\nLong pressing and waiting to enter sleep only takes effect once.
actors.hero.talent.life_sport.kill=More exercise is good for physical and mental health...
actors.hero.talent.life_sport.rankings_desc=Died: too lazy
actors.hero.talent.weaken_chalice.title=Weaken Chalice
actors.hero.talent.weaken_chalice.desc=_+0: _Holy Grail upgrade cost_increased by 100%_.\n\n_+1: _Holy Grail upgrade cost_increased by 50%_.\n\n_+2: _The Holy Grail upgrade no longer costs extra.\n\nTalent type: _Limited to 3_.\n\n"The Holy Grail is just a trophy, it's useless, right brother?"
actors.hero.talent.extreme_casting.title=Extreme Casting
actors.hero.talent.extreme_casting.desc=_+1: _Stands and wands charge _10% slower_ but _cast damage increased by 20%_.\n\n_+2: _Stands and wands recharge _20% slower_ but _cast damage increased by 40%_.\n\n_+3: _Stands and wands recharge _30% slower_ but _cast damage increased by 60%_.\n\nTalent type: _Spell Damage_.\n\n"Explosion!"\n\n_Frost Morning_
actors.hero.talent.precise_shot.title=Precise Shot
actors.hero.talent.precise_shot.desc=_+1: _There is a _10%_ accuracy bonus and damage increase when using thrown weapons to attack enemies _three blocks_ away.\n\n_+2: _There is a _20%_ accuracy bonus and damage increase when using thrown weapons to attack enemies _three blocks_ away.\n\n_+3: _There is a _30%_ accuracy bonus and damage increase when using thrown weapons against enemies _three blocks_ away.\n\nTalent type: _physical attack type_.\n\nIf a hero holding a special throwing weapon such as a psychic bow obtains this talent, the special throwing weapon will also enjoy the bonus of this talent.
actors.hero.talent.exploration_intuition.title=Exploration Intuition
actors.hero.talent.exploration_intuition.desc=_+1: _Your passive detection of hidden doors and hidden traps is _increased by 50%_.\n\n_+2: _Your passive detection of hidden doors and hidden traps is _increased by 100%_.\n\nTalent type: _auxiliary_.\n\n"let me see!"
actors.hero.talent.fudi_chouxin.title=Fudi Chouxin
actors.hero.talent.fudi_chouxin.desc=_+1: _Physical attacks have a _25% chance of causing _2 turns of weakness_.\n\n_+2: _Physical attacks have a _50% chance of causing _2 turns of weakness_.\n\nTalent type: _physical attack type_.\n\n"Neutralize."
actors.hero.talent.poison_inbody.title=Poison Inbody
actors.hero.talent.poison_inbody.desc=_+1: _For each debuff it has, physical attack damage increases by 10%_.\n\n_+2: _For each debuff you have_, physical attack damage increases by 20%_.\n\nTalent type: _physical attack type_.\n\n"Still a good hero?"
actors.hero.talent.treasure_sense.title=Treasure Sense
actors.hero.talent.treasure_sense.desc=_+1: _Whenever you enter a new floor, there is a _17% chance of knowing the location of all items.\n\n_+2: _Whenever you enter a new floor, there is a _33% chance of knowing the location of all items.\n\n_+3: _Whenever you enter a new floor, there is a _50% chance of knowing_ the locations of all items.\n\nTalent type: _Resource type_.\n\n"I saw you."
actors.hero.talent.seed_recycling.title=Seed Recycling
actors.hero.talent.seed_recycling.desc=_+1: _A plant has a _20% probability_ of dropping its seeds after being trampled.\n\n_+2: _A plant has a _40% chance_ of dropping its seeds after being trampled.\n\nTalent type: _Resource type_.\n\nThis talent does not affect the normal drop of Rotberry Seed.\n\n"When reincarnation changes, all things are nourished."\n\n_Frost Morning_
actors.hero.talent.hedonism.title=Hedonism
actors.hero.talent.hedonism.desc=_+1: _If you are not in a _hungry or extremely hungry state_, the _damage caused will be increased by an additional 2 points_, taking effect before all damage-increasing talents.\n\n_+2: _If you are not in a _hungry or extremely hungry state_, the _damage caused will be increased by an additional 4 points_, taking effect before all damage-increasing talents.\n\nTalent type: _physical attack type_.\n\n"A moment of relief will lead to a lifetime of loss; if you escape for a long time, it will be zero!"
actors.hero.talent.beyond_limit.title=Beyond Limit
actors.hero.talent.beyond_limit.desc=_+1: _Get _20 turns of extreme speed and hormone surge_ when upgrading.\n\n_+2: _Get _40 turns of extreme speed and hormone surge_ when upgrading.\n\n_+3: _Get _60 turns of extreme speed and hormone surge_ when upgrading.\n\nTalent type: _auxiliary_.
actors.hero.talent.healthy_food.title=Healthy Food
actors.hero.talent.healthy_food.desc=_+1: _Eat to get _2 turns of comprehensive purification_.\n\n_+2: _Eat to obtain _3 turns of comprehensive purification_.\n\n_+3: _Eat to gain _4 turns of comprehensive purification_.\n\nTalent type: _Special effects_.\n\n"After doing this, you will be a good man again."
actors.hero.talent.mental_collapse.title=Mental Collapse
actors.hero.talent.mental_collapse.desc=_+0: _Physical attacking enemies have a _20% chance of receiving _50% damage in return_.\n\n_+1: _Physical attacking enemies have a _10% chance of receiving _50% damage in return_.\n\n_+2:_Physical attacks no longer cause damage in return.\n\nTalent type: _Limited to 3_.\n\n"Who killed me?"\n\n"And who did I kill?"
actors.hero.talent.unavoidable.title=Unavoidable
actors.hero.talent.unavoidable.desc=_+0: _Minimum damage taken is _10%_ of maximum health.\n\n_+1: _Minimum damage taken is _5%_ of maximum health.\n\n_+2: _No longer has minimum damage limit.\n\nTalent type: _Limited to 3_.
actors.hero.talent.parasitism.title=Parasitism
actors.hero.talent.parasitism.desc=_+0: _After the enemy dies, there will be a _20% chance of spawning an Ancient God Larva_.\n\n_+1: _After the enemy dies, there will be a _10% chance of spawning an Ancient God Larva_.\n\n_+2:_Old God larvae no longer spawn after the enemy dies.\n\nTalent type: _General type_.\n\nAncient God Larvae generated through this negative talent are still affected by this negative talent.\n\n"The dungeon is so dirty...it's normal to have some parasites (choosing parasites in the sewers can greatly increase the game experience)."\n\n_The ultimate malice from Ke Ze_
actors.hero.talent.dump_truck.title=Dump Truck
actors.hero.talent.dump_truck.desc=_+0: _Enemies with _giant attributes_ have their damage increased by 100%_ and their speed increased by 100%_.\n\n_+1: _Enemies with _giant attributes_ have their damage increased by 50%_ and their speed increased by 50%_.\n\n_+2:_Enemies with giant attributes no longer have increased damage and speed.\n\nTalent type: _Limited to 4_.\n\n_Giant attribute_ Enemies include DM-200, DM-201, DM-300, Golem, Rusty Fist, Golden Golem and giant elite enemies.\n\n"I will arrange three trucks directly for you!"
actors.hero.talent.burnout_champion.title=Burnout Champion
actors.hero.talent.burnout_champion.desc=_+0: _Movement has a _4% chance of obtaining _3 turns of burning_ effect.\n\n_+1: _Movement has a _2% chance of obtaining _3 turns of burning_ effect.\n\n_+2:_Movement no longer has a chance of spontaneous combustion.\n\nTalent type: _Limited to 1_.\n\n"This is the Los Angeles at four in the morning that Kobe wished to see."
actors.hero.talent.photophoby.title=Photophobia
actors.hero.talent.photophoby.desc=_+0: _Accuracy and damage are reduced by 40%_ while in _glow state_.\n\n_+1: _Accuracy and damage are reduced by 20%_ while in _glow state_.\n\n_+2:_Accuracy and damage no longer decrease while glowing.\n\nTalent type: _Limited to 4_.
actors.hero.talent.outcontrol_magic.title=Out Of Control Magic
actors.hero.talent.outcontrol_magic.desc=_+0: _There is a _40% chance_ of exploding yourself when casting a spell with a staff or wand.\n\n_+1: _There is a _20% chance_ of exploding yourself when casting a spell with a staff or wand.\n\n_+2:_Casting spells with a staff or wand no longer causes you to explode.\n\nTalent type: _General type_.\n\n"Louise's magic."
actors.hero.talent.winter_swimming.title=Winter Swimming
actors.hero.talent.winter_swimming.desc=_+0: _Heroes moving in water have a _10% chance of getting _3 turns of frostbite_ effect.\n\n_+1: _Heroes moving in water have a _5% chance of getting _3 turns of frostbite_ effect.\n\n_+2:_Heroes no longer receive frostbite when moving in water.\n\nTalent type: _Limited to 4_.\n\n"A more harmless talent for fooling people."\n\n_——If not_
actors.hero.talent.fire_wood.title=Fire Wood
actors.hero.talent.fire_wood.desc=_+0: _When attacking an enemy, there is a _10% chance of charming both sides for 10 turns and igniting both sides for 3 turns_.\n\n_+1: _When attacking an enemy, there is a _5% chance of charming both sides for 10 turns and igniting both sides for 3 turns_.\n\n_+2:_ Attacking the enemy no longer causes both parties to gain passionate love.\n\nTalent type: _Limited to 3_.\n\n"We spiraled all night until we were submerged in the flames."\n\n_The child who chooses dry wood will have his transformation scroll burned - otherwise he will laugh_
actors.hero.talent.be_inconstant.title=Be Inconstant
actors.hero.talent.be_inconstant.desc=_+0: _When picking up a weapon, there is a _20% chance_ that it will be equipped immediately.\n\n_+1: _When picking up a weapon, there is a _10% chance_ that it will be equipped immediately.\n\n_+2:_Weapons picked up are not immediately equipped.\n\nTalent type: _General type_.
actors.hero.talent.unbear_hunger.title=Unbear Hunger
actors.hero.talent.unbear_hunger.desc=_+0: _Hunger damage taken _increased by 100%_.\n\n_+1: _Hunger damage taken _increased by 50%_.\n\n_+2: _Hunger damage taken is no longer increased.\n\nTalent type: _Limited to 2_.
actors.hero.talent.vip_meal.title=Vip Meal
actors.hero.talent.vip_meal.desc=_+0: _Eating consumes _20%_ of the current gold coins.\n\n_+1: _Eating consumes _10%_ of the current gold coins.\n\n_+2:_Eating no longer consumes gold coins.\n\nTalent type: _Limited to 2_.\n\n"Heroes have three major desires: the desire to eat, the desire to explore, and the desire to search for treasures."
actors.hero.talent.fast_die.title=Fast Die
actors.hero.talent.fast_die.desc=_+0: _Every time you load a file, your life will be reduced by 40% of your maximum health.\n\n_+1: _Every time you load a file, your life will be reduced by 20% of your maximum health.\n\n_+2:_Loading files no longer reduces life.\n\nTalent type: _Limited to 4_.\n\nThis talent will not cause the hero to die, but will retain at most 1 life point.\n\nNote that after obtaining the Yendor Amulet in the game, when entering the interface to choose to end the game, a file load will be automatically performed, resulting in a reduction in life.\n\n"So I ended this archive with my own hands!"\n"You are a person, all you can think about is playing other games!"
actors.hero.talent.wash_hand.title=Wash Hand
actors.hero.talent.wash_hand.desc=_+0: _When collecting dew drops, there is a _20% chance of being poisoned for 3 rounds_.\n\n_+1: _When collecting dew drops, there is a _10% chance of being poisoned for 3 rounds_.\n\n_+2:_No longer poisoned by collecting dew.\n\nTalent type: _Limited to 2_.\n\n"Why is tap water so dirty, but apples washed in tap water can be eaten directly?"\n\n_——The whiteboard talent provided by Ke Ze kindly_
actors.hero.talent.thorns_sprang.title=Thorns Sprang
actors.hero.talent.thorns_sprang.desc=_+0: _Trampling on tall grass has a _20% chance of causing _original 1 bleeding_.\n\n_+1: _Trampling on tall grass has a _10% chance of causing _original 1 bleeding_.\n\n_+2:_No more bleeding when stepping on tall grass.\n\nTalent type: _Limited to 2_.\n\n"The consequences of walking through grass without shoes."\n\n_——The thoughtful whiteboard talent_
actors.hero.talent.fullpassion.title=Fullpassion
actors.hero.talent.fullpassion.desc=_+0: _All Mimics' sneak attack damage is increased by 60%_, and their movement speed is _2x_ normal.\n\n_+1: _All Mimics' sneak attack damage is increased by 30%_, and their movement speed is _1.5 times the normal_.\n\n_+2:_The sneak attack damage and movement speed of all Mimics return to normal.\n\nTalent type: _Limited to 1_.\n\n"Who dares to play with teeth now?"\n\n_Passion from DM-216_
actors.hero.talent.fullfighting.title=Fullfighting
actors.hero.talent.fullfighting.desc=_+0: _Killing an enemy has a _60% chance of awakening the entire layer of enemies.\n\n_+1: _Killing an enemy has a _30% chance of awakening the entire layer of enemies.\n\n_+2:_Killing an enemy will no longer wake up the entire layer of enemies.\n\nTalent type: _General type_.
actors.hero.talent.phaseclaw.title=Phaseclaw
actors.hero.talent.phaseclaw.desc=_+0: _The enemy's attack distance is +1_, and there is a _10% probability of causing vulnerability for 3 rounds_ when attacking.\n\n_+1: _Enemy_attack range +1_.\n\n_+2:_Enemy attack distance is no longer increased.\n\nTalent type: _Limited to 3_.
actors.hero.talent.backfired.title=Backfired
actors.hero.talent.backfired.desc=_+1:_Drink liquid fire potion to gain _5 turns of fire power_.\n\n_+2: _Drink liquid fire potion to gain _8 turns of fire power_.\n\nTalent type: _Special effects_.\n\n"When it's cold, you should drink hot drinks!"\n\n_Frost Morning_
actors.hero.talent.goldofbook.title=Goldofbook
actors.hero.talent.goldofbook.desc=_+1: _Read the scroll to get _50 gold coins_.\n\n_+2: _Read the scroll to get _100 gold coins_.\n\nTalent type: _Resource type_.\n\nThis talent can be triggered by reading the Grimoire of Disorder.\n\n"I thought 'The book has its own golden house' was an inspirational phrase..."
actors.hero.talent.extreme_reaction.title=Extreme Reaction
actors.hero.talent.extreme_reaction.desc=_+1: _Get _1 round of hormone surge_ when dodging the enemy's physical attack.\n\n_+2: _Get _2 turns of hormone surge_ when dodging the enemy's physical attack.\n\n_+3: _Get _3 turns of hormone surge_ when dodging enemy physical attacks.\n\nTalent type: _auxiliary_.\n\nWhen the hero's current hormone surge effect lasts longer than 5 turns, this talent will stop adding the hormone surge effect to it.
actors.hero.talent.deep_fear.title=Deep Fear
actors.hero.talent.deep_fear.desc=_+0: _As the floor goes deeper, the hero's maximum health will be reduced by _3x the maximum number of floors reached_.\n\n_+1: _As the floor goes deeper, the hero's maximum health will be reduced by _2x the maximum number of floors reached_.\n\n_+2: _No longer reduces the hero's maximum health as the floor goes deeper.\n\nTalent type: _General type_.\n\n"If you are a hero, go to the 100th floor! (There is not actually 100 floors)"\n\n_Fear Implanted by DM-216_
actors.hero.talent.no_door.title=No Door
actors.hero.talent.no_door.desc=_+0: _Probability x2_ that a normal door is replaced by a hidden door.\n\n_+1: _Probability x1.5_ that a normal door is replaced by a hidden door.\n\n_+2: _No longer increases the chance of a normal door being replaced by a hidden door.\n\nTalent type: _General type_.
actors.hero.talent.updraft.title=Updraft
actors.hero.talent.updraft.desc=_+0: _Get _the same amount of turns of floating_ when burning, and _get _the same amount of turns of burning_ when floating.\n\n_+1: _The same amount of turns of floating will be obtained when burning. The same amount of burning will no longer be obtained when floating.\n\n_+2:_Both burning and floating will no longer obtain the corresponding effects for the same amount of turns.\n\nTalent type: _Limited to 1_.\n\nThe floating and burning obtained through this negative talent will not continue to have corresponding effects due to this negative talent.\n\n"If the levitation in the dungeon is jet magic..."
actors.hero.talent.quantum_hacking.title=Quantum Hacking
actors.hero.talent.quantum_hacking.desc=_+1: _After using a staff or wand to cast a spell and hit the target, the target will be stunned for _1 round_.\n\n_+2: _After using a staff or wand to cast a spell and hit the target, the target will be stunned for _2 turns_.\n\nTalent type: _Spell Damage_.\n\n"For a long time, research on magic stagnated until people tried to use magic to invade the brains of living things."
actors.hero.talent.cicada_dance.title=Cicada Dance
actors.hero.talent.cicada_dance.desc=_+1: _Heroes who kill enemies through physical attacks will gain _2 turns of invisibility_.\n\n_+2: _Heroes who kill enemies through physical attacks will gain _3 turns of invisibility_.\n\n_+3: _Heroes who kill enemies through physical attacks will gain _4 turns of invisibility_.\n\nTalent type: _physical attack type_.
actors.hero.talent.chocolate_coins.title=Chocolate Coins
actors.hero.talent.chocolate_coins.desc=_+1:_When hunger blood loss is triggered, if the gold coins in the backpack are greater than 75, then 37 gold coins will be consumed to prevent this blood loss.\n\n_+2:_When hunger blood loss is triggered, if the gold coins in the backpack are greater than 50, 25 gold coins will be consumed to prevent this blood loss.\n\nTalent type: _Other types_.\n\n"Maybe it's a certain magician's bad taste. Anyway, these gold coins are edible."
actors.hero.talent.ghost_gift.title=Ghost Gift
actors.hero.talent.ghost_gift.desc=_+1: _After selecting the armor reward of Sad Ghost, there is a _75% probability_ of getting the weapon reward at the same time.\n\n_+2: _After selecting the armor bonus of Sad Ghost, _must_ get the weapon reward at the same time.\n\nTalent type: _Resource type_.\n\nThis talent will not take effect if you select a weapon bonus.\n\n"Youmei, you are my best friend."
actors.hero.talent.personal_attack.title=Personal Attack
actors.hero.talent.personal_attack.desc=_+1:_When reading the Scroll of Rage, the affected enemies will be vulnerable to damage for 5 turns.\n\n_+2:_When reading the Scroll of Rage, the affected enemies will be _vulnerable for 5 turns_ and _weakened for 5 turns_.\n\nTalent type: _Special effects_.\n\nUpgrading this talent will give you an additional Scroll of Rage. At the same time, this talent can be triggered by reading the Scroll of Rage in the Grimoire of Discord.\n\nThis kind of talent sharing that directly obtains corresponding resources through upgrading or transformation has a limit of 26 triggers (for gentlemen, 39 times).\n\n"Why are you shouting so loudly?"
actors.hero.talent.shoot_satellite.title=Shoot Satellite
actors.hero.talent.shoot_satellite.desc=_+1: _Increases damage to enemies in _flying state_ by 20%_.\n\n_+2: _Increases damage by 30%_ to enemies in _flying state_.\n\nTalent type: _Other types_.\n\nIf a thrown stone is used to cause damage to a flying enemy, the damage is doubled.\n\nEnemies that are normally in the "flying state" include golden bees, wraiths, cursed spirits, swarms of flies, new fire elements, vampire bats, crystal clusters, fire elements, frost elements, electric elements, chaos elements, evil eyes, big demons and gold elements. You can also cause any enemy to obtain the "floating" effect to trigger this talent.\n\n"The love story in the dungeon: "The warrior grandfather used three +20 polarized stones to crush the ancient god."
actors.hero.talent.holy_faith.title=Holy Faith
actors.hero.talent.holy_faith.desc=_+1: _When the hero obtains the _glow_ effect, he will receive an additional _5-turn blessing and staff charge_.\n\n_+2: _When the hero obtains the _glow_ effect, he will receive an additional _7-turn blessing and staff charge_.\n\n_+3: _When the hero obtains the _Glow_ effect, he will receive an additional _9 turns of blessing, _staff charge_ and _4 turns of artifact charge_.\n\nTalent type: _auxiliary_.
actors.hero.talent.honey_fish.title=Honey Fish
actors.hero.talent.honey_fish.desc=_+1: _Throwing the honey jar will generate water on the spot and generate a giant piranha instead of the golden bee. The giant piranha will get _50 turns of frenzy_.\n\n_+2: _On the basis of +1, the broken position of the honey jar will additionally trigger the effect of a water explosion potion_.\n\nTalent type: _Other types_.\n\nThe giant piranha generated through this talent may also be replaced by a phantom piranha, and both are affected by the negative talent _Luyou_.\n\n"A blue opaque fish tank."
actors.hero.talent.instant_refining.title=Instant Refining
actors.hero.talent.instant_refining.desc=_+1: _When an enemy dies, the hero has a _40% chance of gaining 1 point of alchemical energy_.\n\n_+2: _When an enemy dies, the hero has a _60% chance of gaining 1 point of alchemical energy_.\n\nTalent type: _Resource type_.\n\nThe drop of this talent is also limited by the hero level.\n\n"Grab it and refine it instantly."
actors.hero.talent.changqi_bookstore.title=Changqi Bookstore
actors.hero.talent.changqi_bookstore.desc=_+1: _When reading the scroll, there is a _30% probability of getting 1 random runestone_.\n\n_+2: _When reading the scroll, there is a _45% probability of getting 1 random runestone_.\n\n_+3: _When reading the scroll, there is a _60% probability of getting 1 random runestone_.\n\nTalent type: _Resource type_.\n\nThis talent does not obtain enchanted runestones and can be triggered by reading disordered grimoires, but the number of resources obtained is limited to 26 times (39 times for gentlemen), and this limit is shared with most talents that directly obtain corresponding resources through upgrading or transformation.
actors.hero.talent.ascension_curse.title=Ascension Curse
actors.hero.talent.ascension_curse.desc=_+1: _Holy Scripture can cast the spell _Ascension Spell_, which consumes 1 point of charge to make itself _levitate for 5 turns_.\n\n_+2: _Holy Scripture can cast the spell _Ascension Spell_, which consumes 1 point of charge to make itself _levitate for 8 turns_.\n\nTalent type: _spell_.\n\n"Fly!"
actors.hero.talent.divine_protection.title=Divine Protection
actors.hero.talent.divine_protection.desc=_+1: _Sacred Code can cast the spell _God's Blessing_, which consumes 5 points of charge to make itself _invincible for 3 turns_.\n\n_+2: _Sacred Code can cast the spell _God's Blessing_, which consumes 5 points of charge to make itself _invincible for 5 turns_.\n\nTalent type: _spell_.\n\n"There's someone above me."
actors.hero.talent.shepherd_intention.title=Shepherd Intention
actors.hero.talent.shepherd_intention.desc=_+1: _The Holy Code can cast the spell _Shepherd's Purpose_, which consumes 3 charge points to specify a location to _generate a small group of magical sheep_.\n\n_+2: _The Holy Code can cast the spell _Shepherd's Purpose_, which consumes 3 points of charge to specify a location to _generate a group of magic sheep_.\n\nTalent type: _spell_.\n\n"Where do these sheep come from?"
actors.hero.talent.conversion_holy.title=Conversion Holy
actors.hero.talent.conversion_holy.desc=_+1: _Holy Scripture can cast the spell _Sacred Law Conversion_, which consumes 5 points of charge to _sink any target within sight_.\n\n_+2: _On the basis of sinking the target, grant the target _10 turns of blessing_.\n\nTalent type: _spell_.\n\nEnemies sunk by this spell will not drop anything.\n\n"Join the Holy Church, join the Holy Church, thank you."
actors.hero.talent.purifying_evil.title=Purifying Evil
actors.hero.talent.purifying_evil.desc=_+1: _The Codex can cast the spell _Purify Evil_, which consumes 3 charges to _remove all buffs_ from the target.\n\n_+2: _On the basis of +1, it will also _remove the elite effect_ on the target.\n\n_+3: _On the basis of +1 and +2, it can also cause _20% of the hero's maximum health_ damage to enemies with _undead and demon attributes_ (the effect on Boss is halved).\n\nTalent type: _spell_.
actors.hero.talent.divine_storm.title=Divine Storm
actors.hero.talent.divine_storm.desc=_+1: _Holy Codex can cast the spell _Divine Domain Storm_, which consumes 3 points of charge to generate a _3x3 range_ electric field at the target location that lasts _10 turns_.\n\n_+2: _Holy Codex can cast the spell _Divine Domain Storm_, which consumes 3 charge points to generate an electric field in the target location with a _7x7 range_ and lasts for _20 turns_.\n\n_+3: _On the basis of +2, a _5x5 range_ of flames lasting _5 rounds_ will also be produced.\n\nTalent type: _spell_.
actors.hero.talent.genesis.title=Genesis
actors.hero.talent.genesis.desc=_+1: _The Codex can cast the spell _Genesis_, which consumes 8 charge points and _resets the first two levels of talent points_.\n\n_+2: _The Codex can cast the spell _Genesis_, which consumes 8 charge points and _resets all talent points_.\n\nTalent type: _spell_.\n\n"So everything started to turn upside down."
actors.hero.talent.indulgence.title=Indulgence
actors.hero.talent.indulgence.desc=_+1: _The Codex can cast the spell _Indulgence_, which costs _200 gold coins_ to restore 1 point of Codex charge.\n\n_+2: _The Codex can cast the spell _Indulgence_, which costs _150 gold coins_ to restore 1 point of Codex charge.\n\nTalent type: _spell_.\n\nThis spell has no effect on sacred rubbings.\n\n"I regret it."
actors.hero.talent.silver_language.title=Silver Language
actors.hero.talent.silver_language.desc=_+1: _Holy Scripture can cast the spell _Silver Whisper_, which consumes 2 points of charge to give the target _3 turns of frenzy_.\n\n_+2: _Holy Scripture can cast the spell _Silver Whisper_, which consumes 2 points of charge to give the target _5 turns of frenzy_.\n\nTalent type: _spell_.\n\n"Who would have thought that there are such vulgar words in the holy scriptures?"
actors.hero.talent.resurrection.title=Resurrection
actors.hero.talent.resurrection.desc=_+1: _Holy Scripture can cast the spell _Resurrection_, which consumes 8 points of charge to give itself or allies the _5-turn resurrection of the dead_ effect. Those who die during the duration of this effect will be immediately resurrected.\n\n_+2: _Holy Scripture can cast the spell _Resurrection_, which consumes 8 points of charge to give itself or allies the _10-round resurrection of the dead_ effect. Those who die during the duration of this effect will be immediately resurrected.\n\n_+3: _Holy Scripture can cast the spell _Resurrection_, which consumes 8 charge points to give itself or allies the _10-turn resurrection of the dead_ effect. During the duration of this effect, those who die will be resurrected immediately and receive the _20-turn blessing_ effect.\n\nTalent type: _spell_.\n\nIf this spell is cast on an ally, it will be in its best state when resurrected. If cast on the hero himself, he will be restored to at most 1 health point when resurrected.
actors.hero.talent.bone_fire.title=Bone Fire
actors.hero.talent.bone_fire.desc=_+0: _The generated flames will not naturally extinguish_, and the _probability of burning items when the character is damaged by fire is doubled_.\n\n_+1: _The resulting flame will not go out naturally_.\n\n_+2: _The resulting flame will extinguish normally.\n\nTalent type: _Limited to 4_.
actors.hero.talent.jump_face_silicone.title=Jump Face Silicone
actors.hero.talent.jump_face_silicone.desc=_+0: _The enemy gains _2-turn time bubble_ when it wakes up.\n\n_+1: _The enemy gains _1 turn time bubble_ when it wakes up.\n\n_+2:_Enemies no longer receive time bubbles when they wake up.\n\nTalent type: _General type_.\n\n"Wow!"\n\n_Frost Morning_
actors.hero.talent.grass_mob.title=Grass Mob
actors.hero.talent.grass_mob.desc=_+0: _When tall grass is destroyed, there is a _20% chance of spawning a rotberry tentacle_.\n\n_+1: _When tall grass is destroyed, there is a _10% chance of spawning a rotberry tentacle_.\n\n_+2:_Tall grass no longer spawns rotberry tentacles when destroyed.\n\nTalent type: _Limited to 2_.
actors.hero.talent.disaster_curse.title=Disaster Curse
actors.hero.talent.disaster_curse.desc=_+0: _When the enemy causes melee damage to the hero, there is a _50% probability of being slowed and weakened for 1 round_.\n\n_+1: _When the enemy causes melee damage to the hero, there is a _25% chance of being slowed and weakened for 1 round_.\n\n_+2:_Enemies no longer grant Slow and Weakness when dealing melee damage to the hero.\n\nTalent type: _Limited to 3_.
actors.hero.talent.ashes_bow.title=Ashes Bow
actors.hero.talent.ashes_bow.desc=_+1: _Gives _1 turn of burning_ when a thrown weapon deals damage.\n\n_+2: _Gives _2 turns of burning_ when a thrown weapon deals damage.\n\n_+3: _Gives _3 turns of burning_ when dealing damage with a thrown weapon.\n\nTalent type: _physical attack type_.\n\nThis talent has a 15-turn cooldown.\n\nIf a hero holding a special throwing weapon such as a psychic bow obtains this talent, the special throwing weapon will also enjoy the bonus of this talent.
actors.hero.talent$ashesbowcooldown.name=Ashes Bow Cooldown
actors.hero.talent$ashesbowcooldown.desc=You have just activated this talent, you need to wait a moment before you can activate it again.\n\nRemaining cooldown: __PH0__ turns
actors.hero.talent.swift_church.title=Swift Church
actors.hero.talent.swift_church.desc=_+1: _Get _1 Regeneration Staff_.\n\n_+2: _On the basis of +1, attacking while in _time bubble state_ will reduce the time bubble by 5 turns instead of immediately ending the time bubble effect.\n\n_+3: Attacking while in the _time bubble state_ will reduce the time bubble by 3 turns instead of immediately ending the time bubble effect.\n\nTalent type: _Spell Damage_.\n\nThis kind of talent sharing that directly obtains corresponding resources through upgrading or transformation has a limit of 26 triggers (for gentlemen, 39 times).\n\n"The terrifying purple-clad woman used infinite four turns to defeat the boss in the last area. Do you know who it is?"\n\n_——Learning is good_
actors.hero.talent.protect_curse.title=Protect Curse
actors.hero.talent.protect_curse.desc=_+1: _Cursed weapons and armor gain _1 additional level_.\n\n_+2: _Cursed weapons and armor gain _2 additional levels_.\n\nTalent type: _auxiliary_.\n\n"Now I really can't bear the curse anymore."
actors.hero.talent.potential_energy.title=Potential Energy
actors.hero.talent.potential_energy.desc=_+1: _After falling, you will gain the _3-round speed_ effect, and you will no longer get the disability effect.\n\n_+2: _After falling down, you will gain the _5-round speed_ effect, and you will no longer get the disability effect.\n\nTalent type: _auxiliary_.\n\n"Dungeon Blitz."
actors.hero.talent.nirvana.title=Nirvana
actors.hero.talent.nirvana.desc=_+1: After the _self_burning_ effect ends, gain _self level/2 life recovery_.\n\n_+2: _On the basis of +1, attacking an enemy while in _burning state_ will inflict _3 turns of burning_.\n\nTalent type: _auxiliary_.\n\n"Don't be afraid of the bone-gnawing fire."
actors.hero.talent.insinuation.title=Insinuation
actors.hero.talent.insinuation.desc=_+1: _Casting a spell on a sleeping creature will apply an additional _3 turns of poison_.\n\n_+2: _Casting a spell on a sleeping creature will inflict an additional _5 turns of poison_.\n\nTalent type: _Spell Damage_.\n\n"Though the patient does not know it when he makes insinuations about people. It is a crime to use clever words to confuse people, and even the person who dies will not doubt it."
actors.hero.talent.auto_pick.title=Auto Pick
actors.hero.talent.auto_pick.desc=_+1: _The time taken to pick up items is reduced to _50%_ of normal.\n\n_+2: _It no longer takes time_ to pick up items.\n\nTalent type: _auxiliary_.\n\n"Who turned off my automatic pickup?"
actors.hero.talent.hand_slip.title=Hand Slip
actors.hero.talent.hand_slip.desc=_+0: _The damage received in the next turn after moving is increased by _50%_.\n\n_+1: _The damage received in the next turn after moving is increased by _25%_.\n\n_+2: _No longer increases damage taken after moving.\n\nTalent type: _Limited to 1_.\n\n"It's safe."\n\n_Caiyu_
actors.hero.talent.hand_destruction.title=Hand Destruction
actors.hero.talent.hand_destruction.desc=_+1:_Physical attacks can directly _instantly kill_ targets that do not have death resistance and whose health value is _less than 5%_.\n\n_+2:_Physical attacks can directly _instantly kill_ targets that do not have death resistance and whose health value is _less than 10%_.\n\n_+3:_Physical attacks can directly _instantly kill_ targets that do not have death resistance and whose health value is _less than 15%_.\n\nTalent type: _physical attack type_.
actors.hero.talent.predictive_lover.title=Predictive Lover
actors.hero.talent.predictive_lover.desc=_+1: _When reading the secret scroll of foresight, _identify 1 additional item_.\n\n_+2: _When reading the secret scroll of foresight, _identify 2 additional items_.\n\nTalent type: _Resource type_.\n\nThis talent can be triggered by reading the Tome of Precognition in the Grimoire of Disorder.\n\n"Gentlemen, I like rings."
actors.hero.talent.fire_ball.title=Fire Ball
actors.hero.talent.fire_ball.desc=_+1: _When casting a spell on a flammable block, _1 unit of fire_ will be released on that block.\n\n_+2: _When casting a spell on a flammable block, _2 units of fire_ will be released on that block.\n\nTalent type: _Spell Damage_.\n\n"Is this...Homura?"
actors.hero.talent.flash_genius.title=Flash Genius
actors.hero.talent.flash_genius.desc=_+1: _When the perception runestone is used to successfully identify an item, enemies on the floor will be blinded and stunned for 2 rounds_.\n\n_+2: _When the perception runestone is used to successfully identify an item, enemies on the floor will be blinded and stunned for 3 rounds_.\n\nTalent type: _Special effects_.\n\nUpgrading this talent will grant you an additional _1 Perception Runestone_.\n\nThis kind of talent sharing that directly obtains corresponding resources through upgrading or transformation has a limit of 26 triggers (for gentlemen, 39 times).\n\n"Flash bomb."
actors.hero.talent.witch_potion.title=Witch Potion
actors.hero.talent.witch_potion.desc=_+1: _When throwing the potion, it will apply _15 turns of charm_ to the enemy at the target location.\n\n_+2: _When throwing the potion, it will apply _15 turns of charm and 5 turns of poison_ to the enemy at the target location.\n\nTalent type: _Special effects_.\n\n"Coffee that usually tastes bitter actually contains love potions..."\n"The most mature me, I am in love with the beautiful clown, and fall into sleep happily..."
actors.hero.talent.traitorous_spell.title=Traitorous Spell
actors.hero.talent.traitorous_spell.desc=_+1: _The Codex can cast the spell _Tzeentch's Conjuration_, which consumes _2 charge points_ to release the cursed staff effect at the specified location.\n\n_+2: _The Codex can cast the spell _Tzeentch's Conjuration_, which consumes _1 point of charge_ to release the cursed staff effect at the specified location.\n\nTalent type: _spell_.\n\n"This is not like a spell recorded in the Holy Scriptures."
actors.hero.talent.sprint_spell.title=Sprint Spell
actors.hero.talent.sprint_spell.desc=_+1: _Holy Codex can cast the spell _Magic Movement_, which consumes 2 charge points to gain _3-turn speed_.\n\n_+2: _Sacred Code can cast the spell _Spell of Magic_, which consumes 2 points of charge to gain _5-turn speed_.\n\nTalent type: _spell_.\n\n"The Speed ​​Force."
actors.hero.talent.focus_light.title=Focus Light
actors.hero.talent.focus_light.desc=_+1: _The Codex can cast the spell _Focused Light_, which consumes 2 charges to launch a high-temperature ray that causes _4~8_ points of damage and ignites the path and target.\n\n_+2: _The Codex can cast the spell _Focused Light_, which consumes 2 charges to launch a high-temperature ray that causes _6~10_ points of damage and ignites the path and target.\n\nTalent type: _spell_.\n\n"This is a high-temperature ray gun."
actors.hero.talent.zhuanyu_spell.title=Edict Spell
actors.hero.talent.zhuanyu_spell.desc=_+1: _Holy Scripture can cast the spell _Holy Healing_, which consumes 2 charge points to convert the current shield amount into a healing effect with a conversion efficiency of _50%_.\n\n_+2: _Holy Scripture can cast the spell _Holy Healing_, which consumes 2 charge points to convert the current shield amount into a healing effect with a conversion efficiency of _75%_.\n\n_+3: _Holy Scripture can cast the spell _Sacred Magic of Healing_, which consumes 2 points of charge to convert the current shield amount into a healing effect with a conversion efficiency of _100%_.\n\nTalent type: _spell_.\n\nThe spell's total healing amount will not exceed half of the hero's maximum health.\n\n"It makes up for the shortcoming that the Holy Code only gives a bunch of shields but has no healing effect."
actors.hero.talent.thorn_whip.title=Thorn Whip
actors.hero.talent.thorn_whip.desc=_+1: _The Codex can cast the spell _Whip of Thorns_, which consumes 1 charge to bring the enemy closer and cause _original 3 bleed_.\n\n_+2: _The Codex can cast the spell _Whip of Thorns_, which consumes 1 charge to bring the enemy closer and cause _original value of 5 bleed_.\n\nTalent type: _spell_.\n\n"The Scourge of God."
actors.hero.talent.strongest_shield.title=Strongest Shield
actors.hero.talent.strongest_shield.desc=_+1: _When receiving a physical attack, there is a _50% probability_ of an additional armor reduction.\n\n_+2: On the basis of +1, there will be a _50% probability_ of armor reduction when receiving a spell attack.
actors.hero.talent.combo_package.title=Combo Package
actors.hero.talent.combo_package.desc=_+1: _Melee attacks will trigger a feeding effect for every _6 hits_.\n\n_+2: _Melee attacks will trigger a feeding effect for every _4 hits_.\n\nThe artifact charging effect obtained by triggering the feeding effect through this talent cannot charge the Horn of Plenty.\n\n"Didn't eat? Punch me!"\n\n_Frost Morning_
actors.hero.talent$combopackage.name=Combo Package
actors.hero.talent$combopackage.desc=Somehow, by continuously beating the enemy, you can feel the pleasure of enjoying a delicious meal.\n\nThe eating special effect can be triggered by melee combos for a certain number of times.\n\nCurrent combo count: __PH0__.
actors.hero.talent.break_enemy_ranks.title=Break Enemy Ranks
actors.hero.talent.break_enemy_ranks.desc=_+1: _Every enemy within sight will provide _0~3 points of armor_ to the hero.\n\n_+2: _Every enemy within sight will provide _1~4 points of armor_ to the hero.
actors.hero.talent.hunting_intuition.title=Hunting Intuition
actors.hero.talent.hunting_intuition.desc=_+1:_The speed of Ninja's identification of thrown weapons is increased to _3 times_.\n\n_+2:_Ninjas can instantly identify enemies when they hit them with a thrown weapon.\n\nTalent type: _auxiliary_.\n\n"If you can't use throwing weapons skillfully, can you still be called a ninja?"
actors.hero.talent.revelation.title=Revelation
actors.hero.talent.revelation.desc=_+1: _Holy Scripture can cast the spell _Apocalypse_, which consumes 1 charge point to obtain _3 turns of Apocalypse_, which increases the _positive talent effect level +1_ it already has.\n\n_+2: _Sacred Code can cast the spell _Apocalypse_, which consumes 1 charge point to obtain _5-turn Apocalypse_, which increases the _positive talent effect level +1_ it already has.\n\nTalent type: _spell_.\n\nThe talent effect level will not exceed the limit level.\n\n"Weakened talent? Not worth mentioning."
actors.hero.talent.holy_grenade.title=Holy Grenade
actors.hero.talent.holy_grenade.desc=_+1: _Holy Codex can cast the spell _Holy Grenade_, which consumes 2 charge points to cause _15~30_ points of damage to enemies in the target _3x3 range_.\n\n_+2: _Holy Codex can cast the spell _Holy Grenade_, which consumes 2 charge points to cause _20~40_ points of damage to enemies in the target _3x3 range_.\n\n_+3: _Holy Scripture can cast the spell _Holy Grenade_, which consumes 2 charge points to cause _20~40_ points of damage to enemies in the target _5x5 range_.\n\nTalent type: _spell_.\n\nHoly grenades are guaranteed to cause maximum damage to _undead and demonic_ enemies.\n\n"Ha~Hallelujah~"
actors.hero.talent.blade_star.title=Blade Star
actors.hero.talent.blade_star.desc=_+1: _The Codex can cast the spell _Blade Ladder_, which costs 3 charges to create a _3x3 area_ of blades that lasts for 10 turns.\n\n_+2: _The Codex can cast the spell _Blade Ladder_, which costs 3 charges to create a _5x5 area_ of blades that lasts for 10 turns.\n\n_+3: _The Codex can cast the spell _Blade Ladder_, which consumes 3 charges to create a _7x7 area_ of blades that lasts for 10 turns.\n\nTalent type: _spell_.\n\nThe blade area will cause 4~8 points of physical damage that ignores armor to the enemy every round and will be disabled for 3 turns.
actors.hero.talent.sacred_blade.title=Sacred Blade
actors.hero.talent.sacred_blade.desc=_+1: _The Codex can cast the spell _Golden Spin_, which consumes 1 charge to cause _magic damage based on melee weapons_ to the target.\n\n_+2: _On the basis of +1, it will definitely cause maximum damage to enemies with _undead and demon attributes_.\n\n_+3: _On the basis of +1 and +2, the damage caused to enemies with _undead and demon attributes_ is increased by an additional 30%_.\n\nTalent type: _spell_.\n\n"It's not some iron ball."
actors.hero.talent.equipment_bless.title=Equipment Bless
actors.hero.talent.equipment_bless.desc=_+1: _Sacred Scripture can cast the spell _Equipment Blessing_, which consumes 3 charge points to obtain _50-turn equipment blessing_, giving all weapons and armor an _1 extra level_.\n\n_+2: _Sacred Scripture can cast the spell _Equipment Blessing_, which consumes 3 charge points to obtain _50-turn Equipment Blessing_, giving all weapons and armor an _2 additional levels_.\n\nTalent type: _spell_.\n\n"God's creation."
actors.hero.talent.hotlight.title=Hotlight
actors.hero.talent.hotlight.desc=_+1: _The Codex can cast the spell _Seering Light_, which consumes _3 charge points_ to cause _3 turns of blindness_ to non-heroes and allies within the field of vision, and _3 turns of burning_ to enemies with _undead and demon attributes_.\n\n_+2: _The Codex can cast the spell _Seering Light_, which consumes _2 charge points_ to cause _3 turns of blindness_ to non-heroes and allies within the field of vision, and _3 turns of burning_ to enemies with _undead and demon attributes_.\n\nTalent type: _spell_.\n\n"Throw a flashbang!"
actors.hero.talent.healattack.title=Healattack
actors.hero.talent.healattack.desc=_+1: _Enemies that receive the Holy Glory from physical attacks will recover _3 points of life_.\n\n_+2: _Enemies that gain Holy Glory from physical attacks will recover _30% of the hero's level health_.\n\nTalent type: _spell_.\n\n"May the Lord bless you (bonk——)."
actors.hero.talent.eat_mind.title=Eat Mind
actors.hero.talent.eat_mind.desc=_+1: _Recover 0.2 satiety_ for every 1 point of magic damage dealt by a staff or wand.\n\n_+2: _Recover 0.3 satiety_ for every 1 point of magic damage dealt by a staff or wand.\n\nTalent type: _Spell Damage_.\n\n"Knowing the smallest details can eat people's minds."\n\n_Frost Morning_
actors.hero.talent.disabliity_posion.title=Disabliity Poison
actors.hero.talent.disabliity_posion.desc=_+1: _The Acid Staff's _initial acid mist damage is increased by 2 points_ and the gas volume is increased by an additional 30%_.\n\n_+2: _On the basis of +1, cause _1 round of disability_ to the target in the acid mist.\n\n_+3: _On the basis of +1 and +2, it will cause _1 round of weakness and stun_ to the target in the acid mist.\n\nTalent type: _Spell Damage_.
actors.hero.talent.light_crop.title=Light Crop
actors.hero.talent.light_crop.desc=_+1:_In an electric field, regular clearings will _grow grass_, and embers and grass will _grow tall grass_.\n\n_+2: _When using the Thunder Staff to cast a spell, the +1 long grass effect of this talent will be applied to the casting location.\n\nTalent type: _Spell Damage_.\n\n"N2+O2 discharge produces 2NO."\n"2NO+O2 produces 2NO2."\n"3NO2+H2O produces 2HNO3+NO."
actors.hero.talent.devil_flame.title=Devil Flame
actors.hero.talent.devil_flame.desc=_+1:_When the Flame Wave Staff casts a spell, if _the original charge consumes 3 points_, then _the charge consumes -1_.\n\n_+2: _When the Flame Wave Staff casts a spell, if _the original charge consumes 2 points or more_, then _the charge consumes -1_.\n\n_+3: _On the basis of +2, the damage of the Flame Wave Staff is _increased by 20%_, and the flame retention time is _extended by 1 turn_.\n\nTalent type: _Spell Damage_.\n\nThe reduced charge cost of this talent will not affect the damage caused by the Flame Wave Staff when casting, and is still calculated based on the original charge cost.
actors.hero.talent.fast_break.title=Fast Break
actors.hero.talent.fast_break.desc=_+1: _Maximum level +2_ for enemies that drop experience and loot.\n\n_+2: _Maximum level +3_ for enemies that drop experience and loot.\n\nTalent type: _Resource type_.\n\n"Wealth...Clone Armor...Youmei...I can still brush it..."
actors.hero.talent.crazy_dancer.title=Crazy Dancer
actors.hero.talent.crazy_dancer.desc=_+1: _When dodging enemy damage, make the enemy _Frenzy for 2 turns_.\n\n_+2: _When dodging enemy damage, make the enemy _Frenzy for 3 turns_.\n\nTalent type: _auxiliary_.\n\n"Stop fighting!"
actors.hero.talent.throwing_recycling.title=Throwing Recycling
actors.hero.talent.throwing_recycling.desc=_+1: _Physical attack_The enemy in the hit state_has a _25% probability_ of retrieving the thrown weapon on the enemy.\n\n_+2: _Physical attack_The enemy in the hit state_has a _50% probability_ of retrieving the thrown weapon on the enemy.\n\n_+3: _Physical attack_The enemy in the hit state_has a _75% probability_ of retrieving the thrown weapon on the enemy.\n\nTalent type: _physical attack type_.\n\n"Theoretically unlimited chains of throwing axes."
actors.hero.talent.falsehood_power.title=Falsehood Power
actors.hero.talent.falsehood_power.desc=_+1: _Strength_-1_, equipped with super-strength weapons or armor, the strength penalty will be reduced by 3 points when calculating the strength penalty.\n\n_+2: _Strength_-1_, equipped with a super-strength weapon or armor, the strength penalty will be reduced by 4 points when calculating the strength penalty.\n\nTalent type: _auxiliary_.\n\n"The power of falsehood is more powerful than the truth."
actors.hero.talent.flame_incarnation.title=Flame Incarnation
actors.hero.talent.flame_incarnation.desc=_+1: _After killing an enemy in _burning state_, there is a _10% probability of summoning a Sinking Flame Elemental_.\n\n_+2: _After killing an enemy in _burning state_, there is a _20% probability of summoning 1 Sinking Flame Elemental_.\n\n_+3: _After killing an enemy in _burning state_, there is a _30% probability of summoning 1 Sinking Flame Elemental_.\n\nTalent type: _Special effects_.\n\nThe fire elemental attribute generated by this talent is affected by the floor.
actors.hero.talent.marksman.title=Marksman
actors.hero.talent.marksman.desc=_+1: _A wand whose level is temporarily increased by a magic bullet wand's spellcasting _does not consume a charge_ the next time it is cast.\n\n_+2: _On the basis of +1, Magic Bullet Staff _casting damage +3_.\n\nTalent type: _Spell Damage_.\n\nThe talent's non-charging feature has no effect on the Magic Bullet Wand itself.\n\n"What do you mean peashooter?"
actors.hero.talent.spider_sense.title=Spider Sense
actors.hero.talent.spider_sense.desc=_+1: _The hero will receive _1 turn time bubble_ when attacked from outside the field of vision.\n\n_+2: _The hero will receive _2-turn time bubble_ when attacked from outside the field of vision.\n\nTalent type: _auxiliary_.\n\n"Peter was excited."
actors.hero.talent.no_more_mob.title=No More Mob
actors.hero.talent.no_more_mob.desc=_+1: _Enemies sleeping outside the field of view have a _50% probability_ of not being awakened when challenging the swarm intelligence is in effect.\n\n_+2:_On top of +1, so awakened enemies will enter a _loitering state_ instead of locating the hero.\n\nTalent type: _Other types_.\n\n"I will never open a level 3 cluster again."
actors.hero.talent.kebi.title=Kebi
actors.hero.talent.kebi.desc=_+1:_奥术刻笔现在还可以_为武器给予附魔_.\n\n_+2:_在+1的基础上,奥术刻笔_给予强力附魔/刻印的概率提升_.\n\nTalent type: _Resource type_.\n\n"Bryant was an accomplished enchanter. He created many powerful enchantments and engravings. Unfortunately, this enchanter unfortunately fell to his death during a demonstration on floating engravings. Since then, research on this engraving has been banned."
actors.hero.talent.ice_meal.title=Ice Meal
actors.hero.talent.ice_meal.desc=_+1: _Eating only takes 1 turn, and you gain _2 turns of frost power_.\n\n_+2: _Eating only takes 1 turn, and you gain _4 turns of frost power_.\n\n_+3: _On top of +2, eating will _freeze enemies_ adjacent to the player.\n\nTalent type: _Special effects_.
actors.hero.talent.more_favors.title=More Favors
actors.hero.talent.more_favors.desc=_+1: _The favors provided by the Troll Blacksmith quest for each piece of Unique Gold are increased by 25_.\n\n_+2:_The favors provided by each piece of dark gold in the Troll Blacksmith quest are increased by 50_, and the upper limit of favors is increased from 3000_ to 4000_.\n\nTalent type: _Resource type_.\n\n"You have a bad mouth but a nice person."
actors.hero.talent.hardware_elements.title=Hardware Elements
actors.hero.talent.hardware_elements.desc=_+1: _Elemental embers will not be consumed when refining the Summoning Crystal Pillar, but the _alchemical energy consumption required for refining is increased to 20_.\n\n_+2: _Elemental embers will not be consumed when refining the Demon Summoning Crystal Pillar, but the _alchemical energy consumption required for refining is increased to 15_.\n\n_+3: _Elemental embers will not be consumed when refining the Demon Summoning Crystal Pillar, and the _alchemical energy consumption required for refining will no longer increase_.\n\nTalent type: _Resource type_.\n\n"Obtaining endless energy is also one of the purposes of alchemy."
actors.hero.talent.static_light.title=Static Light
actors.hero.talent.static_light.desc=_+1: Spellcasting damage +1_, when using a staff or wand to cast a spell to attack the enemy, it will additionally give _paralysis that causes 5% of the damage for the round_.\n\n_+2: Casting damage +2_, when using a staff or wand to cast a spell to attack the enemy, it will additionally give _paralysis that causes 7.5% of the damage for the round_.\n\nTalent type: _Spell Damage_.\n\nThe number of turns of paralysis granted by this talent is rounded down.\n\n"This is a small step towards the Thunder King."
actors.hero.talent.miracle_alchemy.title=Miracle Alchemy
actors.hero.talent.miracle_alchemy.desc=_+1: _There is a _20% probability_ of refining an additional alchemical product during alchemy.\n\n_+2: _There is a _40% probability_ of refining an additional alchemical product during alchemy.\n\nTalent type: _Resource type_.\n\nThis talent will not take effect on the refining of accessories, stewed meat, ripe tasteless fruit, muscle memory mixture, magic-infused secret scrolls, all bombs, liquid gold, sacred rubbings, root bone elixirs, magic-infused rhomboids and transformation crystals.\n\n"Alchemy itself is a miracle. I love alchemy."
actors.hero.talent.hungry_ghost.title=Hungry Ghost
actors.hero.talent.hungry_ghost.desc=_+0: _When taking damage from hunger, a wraith will be generated_, and being attacked by a wraith will _reduce 5 points of satiety_.\n\n_+1: _A wraith_ will be _generated_ when taking damage from hunger.\n\n_+2: _No longer spawn wraiths when taking damage from hunger.\n\nTalent type: _Limited to 5_.
actors.hero.talent.unable_rest.title=Unable Rest
actors.hero.talent.unable_rest.desc=_+0: Undead and Demonic Attributes_When the enemy receives fatal damage, it will retain _1 HP_ and gain _50% of its maximum HP as a shield_.\n\n_+1: Undead and Demonic Attributes_The enemy will retain _1 point of life_ when receiving fatal damage.\n\n_+2:_Undead and demonic enemies can go directly to see God after receiving fatal damage.\n\nTalent type: _Limited to 5_.\n\nThis talent will not take effect on enemies that already have the ability to resurrect (such as dwarf corpses) and boss enemies.
actors.hero.talent.cursedman.title=Cursedman
actors.hero.talent.cursedman.desc=_+0: _Using _ an upgrade scroll, an enchanted scroll, an enchanted runestone or an arcane pen_ on an item will cause the item to be cursed.\n\n_+1: _Using _enchanted runestones or arcane stylus_ on an item will cause the item to be cursed.\n\n_+2:_Using an upgrade scroll, enchanted scroll, enchanted runestone or arcane pen on an item will no longer cause the item to be cursed.\n\nTalent type: _Limited to 5_.
actors.hero.talent.usury.title=Usury
actors.hero.talent.usury.desc=_+0: _Maybe get 1000 gold coins? In short, the interest of _200 gold coins_ will be deducted for each level the hero moves to.\n\n_+1: _Interest reduced to _150 gold coins_.\n\n_+2: _Interest will no longer be deducted.\n\nTalent type: _Limited to 5_.
actors.hero.talent.usury.nomoney=Unexpectedly! The store owner pocketed part of your loan!
actors.hero.talent.usury.principal=This is a usury loan that the shop owner applies to you.
actors.hero.talent.usury.interest=Interest paid at each level: __PH0__ gold coins.
actors.hero.talent.armed_uprising.title=Armed Uprising
actors.hero.talent.armed_uprising.desc=_+1: _Allies' physical attacks will synchronize most of the _physical attack effects_ owned by the hero.\n\n_+2: _On the basis of +1, the ally's physical attack will also synchronize most of the _physical attack damage increase_ owned by the hero.\n\nTalent type: _physical attack type_.\n\nThe synchronization effect of this talent mainly depends on the talent possessed by the hero and even the characteristics of the hero itself.\n\n"The whole army attacks!"
actors.hero.talent.dungeon_hero.title=Dungeon Hero
actors.hero.talent.dungeon_hero.desc=_+1: _When you interact with the mission NPC and merchants in each area for the first time, you will get _2 low-level drops_.\n\n_+2: _When you interact with the mission NPC and merchants in each area for the first time, you will get _2 intermediate drops_.\n\nTalent type: _Resource type_.\n\n"No trading of emeralds or items will be accepted."
actors.hero.talent.exp_solid.title=Exp Solid
actors.hero.talent.exp_solid.desc=_+1: _Reduce _one hero level_ and obtain _1 bottle of experience potion_.\n\n_+2: _Reduce _the hero level by 2_ and obtain _2 bottles of experience potion_.\n\nTalent type: _resource_.\n\nThis talent can still reduce the hero's level by upgrading after the number of resource acquisition times reaches the upper limit. Such talents that directly obtain corresponding resources through upgrading or transformation share a 26-time trigger limit (for gentlemen, 39 times).\n\n"I've become weaker? No, I've become stronger (wearing the Ring of Wealth)."
actors.hero.talent.wealth_statue.title=Wealth Statue
actors.hero.talent.wealth_statue.desc=_+1:_Living stone statues and armored stone statues will drop a _level 2 random ring_ when they die, while summoned guards will drop a _level 1 random ring_ when they die.\n\n_+2:_Living stone statues and armored stone statues will drop a _level 3 random ring_ when they die, while summoned guards will drop a _level 2 random ring_ when they die.\n\n_+3:_Living stone statues and armored stone statues will drop a _level 4 random ring_ when they die, while summoned guards will drop a _level 3 random ring_ when they die.\n\nTalent type: _Resource type_.\n\nThe ring obtained by this talent will be in an unidentified state, and the number of times this talent can obtain resources is limited to 26 times (for Gentlemen, it is 39 times). This limit is shared with most talents that directly obtain corresponding resources through upgrading or transformation.
actors.hero.talent.sweet_sleep.title=Sweet Sleep
actors.hero.talent.sweet_sleep.desc=_+1: _30% extra damage_ when ambushed.\n\n_+2: _Inflicts _40% extra damage_ when ambushed.\n\nTalent type: _physical attack type_.\n\n"Death is not scary. Death is a cool summer night where people can sleep without worries."
actors.hero.talent.light_shock.title=Light Shock
actors.hero.talent.light_shock.desc=_+1: _Obtain _1 Prismatic Staff_. When the Prismatic Staff casts a spell that causes blindness, it will also cause _disablement for 50% of the staff's level_. If the target is already blind before casting, casting the spell again will still cause disability.\n\n_+2: _Based on +1, Prismatic Staff's damage is increased by _30%_.\n\nTalent type: _Spell Damage_.\n\n"Holding the mighty light in your hand is to sweep away evil deeds in the world."
actors.hero.talent.boozy.title=Boozy

actors.mobs.tboss.pestilenceknight.name=Pestilence Knight
actors.mobs.tboss.pestilenceknight.desc=Behind the ivory beak waits no physician, but Pestilence disciplined into purpose. It patiently infects the arena and studies every attempt at recovery; the purifier may offer a brief reprieve.
actors.mobs.tboss.pestilenceknight.notice=The diagnosis begins.
actors.mobs.tboss.pestilenceknight.defeated=The final prescription... is silence.
actors.mobs.tboss.pestilenceknight.plague_flask=Plague Flask! The marked ground will erupt when the warning ends.
actors.mobs.tboss.pestilenceknight.quarantine=Quarantine Line! Leave the contaminated band.
actors.mobs.tboss.pestilenceknight.pale_charge=Pale Charge! Clear the marked path.
actors.mobs.tboss.pestilenceknight.doom_procession=Doom Procession! The plague advances in three waves.
actors.mobs.tboss.pestilenceknight.prescription_yellow=Yellow Prescription: weakness and infection.
actors.mobs.tboss.pestilenceknight.prescription_red=Red Prescription: hemorrhage.
actors.mobs.tboss.pestilenceknight.prescription_purple=Purple Prescription: disorientation.
actors.mobs.tboss.pestilenceknight.diagnosis_mild=Terminal Diagnosis: poison.
actors.mobs.tboss.pestilenceknight.diagnosis_severe=Terminal Diagnosis: weakness and vulnerability.
actors.mobs.tboss.pestilenceknight.diagnosis_critical=Terminal Diagnosis: critical trauma and suppressed healing.
actors.mobs.tboss.pestilenceknight.harvest=Harvest! I am invulnerable while gathering the miasma.
actors.mobs.tboss.pestilenceknight.phase_outbreak=The harvest restores %d health. Outbreak phase begins!
actors.mobs.tboss.pestilenceknight.phase_terminal=The harvest restores %d health. Terminal phase begins!
actors.mobs.tboss.pestilenceknight.tenacity=unshaken
actors.mobs.tboss.pestilenceknight.discover_hint=Challenge the rotating boss floor of the high tower.

actors.mobs.tboss.deathknight.name=Death Knight
actors.mobs.tboss.deathknight.desc=Beneath an ivory death mask stands a warrior who has made battle into a funeral rite. Its blade always follows a vivid omen, and each broken layer of armor makes the next rite more violent.
actors.mobs.tboss.deathknight.notice=Raise your guard. Death has entered the ring.
actors.mobs.tboss.deathknight.defeated=At last... a worthy final stroke.
actors.mobs.tboss.deathknight.line=Severing Line! Leave the red corridor.
actors.mobs.tboss.deathknight.cone=Grave Arc! Break beyond the fan.
actors.mobs.tboss.deathknight.cross=Fourfold Ruin! Escape the crossing blades.
actors.mobs.tboss.deathknight.ring=Blood Ring! Bleeding awaits within the marked circle.
actors.mobs.tboss.deathknight.soul_line=Soul Pursuit! Clear the white landing point.
actors.mobs.tboss.deathknight.execution=Execution Field! Read the bands—or endure the blow.
actors.mobs.tboss.deathknight.phase_break=The first form is spent. Now I break your formation.
actors.mobs.tboss.deathknight.phase_duel=Armor is a crutch. Face Death without restraint.
actors.mobs.tboss.deathknight.rearm=The interrupted stroke is armed again.
actors.mobs.tboss.deathknight.discover_hint=Challenge it on a rotating high-tower boss floor.
actors.mobs.tboss.deathknight.cover_break=The arena itself is breaking. Hiding will only delay death.

actors.buffs.tboss.infection.name=infection
actors.buffs.tboss.infection.desc=Each stack reduces incoming healing by 8%. Infection loses one stack every 10 turns, and a purifier removes it completely. Severe infection also brings weakness, hexes, vulnerability, and direct plague damage.\n\nCurrent stacks: %d.
actors.buffs.tboss.infection.rupture=PLAGUE BURST! -25 HP
actors.buffs.tboss.infection.rupture_log=Infection reached 5 stacks: Plague Burst deals 25 damage, applies vulnerability, and falls back to 3 stacks.
actors.buffs.tboss.postplaguefatigue.name=post-plague fatigue
actors.buffs.tboss.postplaguefatigue.desc=Your body survived the plague, but movement and attacks are 10% slower and natural regeneration is halved.
actors.buffs.tboss.terminalhealingpenalty.name=terminal prognosis
actors.buffs.tboss.terminalhealingpenalty.desc=Healing received is reduced by 25% for a short time.

actors.blobs.tboss.incubatingmiasma.name=incubating miasma
actors.blobs.tboss.incubatingmiasma.desc=A murky olive plague hangs here. It is a real gas cloud: water, purifying incense, and cleansing effects can disperse it.
actors.blobs.tboss.outbreakmiasma.name=outbreak miasma
actors.blobs.tboss.outbreakmiasma.desc=A vivid sickly-green plague churns here and tries to spread. Water, purifying incense, and cleansing effects can disperse it.
actors.blobs.tboss.palemiasma.name=pale miasma
actors.blobs.tboss.palemiasma.desc=A cold pale-violet plague lingers here. It decays slowly, but water, purifying incense, and cleansing effects can disperse it.
actors.blobs.tboss.purifyingincense.name=purifying incense
actors.hero.talent.boozy.desc=_+1:_Drinking the potion will give you an additional _5 points of life recovery_ and _0~5 points of tree skin_ that decay once every round.\n\n_+2:_Drinking the potion will give you an additional _10 points of life recovery_ and _0~10 points of tree skin_ that decay once every round.\n\nTalent type: _Special effects_.\n\n"Medicine is like fine wine, the older it gets, the better it becomes."
actors.hero.talent.shadow_killer.title=Shadow Killer
actors.hero.talent.shadow_killer.desc=_+1: _Damage modifier gained from Ambush is increased to 75%_ and additional damage dealt is _100%_ of enemy armor.\n\n_+2: _Damage modifier gained from Ambush is increased to 100%_ and additional damage dealt is _150%_ of enemy armor.
actors.hero.talent.kill_spree.title=Kill Spree
actors.hero.talent.kill_spree.desc=_+1: _When the hero kills the enemy through physical attacks, he will receive _5% of the enemy's maximum health recovery_and _2 turns of artifact charging_.\n\n_+2: _When the hero kills the enemy through physical attacks, he will receive _7.5% of the enemy's maximum health recovery_ and _3 turns of artifact charging_.
actors.hero.talent.seaofpeople.title=Seaofpeople
actors.hero.talent.seaofpeople.desc=_+1: _For each enemy within sight, movement speed _increases by 30%_.\n\n_+2: _For each enemy within sight, movement speed _increases by 45%_.
actors.hero.talent.phantom_step.title=Phantom Step
actors.hero.talent.phantom_step.desc=_+1:_After dispelling invisibility or shadow escape, gain _3 turns of extreme speed_ and _1 turn of Phantom Step_ (must dodge all attacks).\n\n_+2:_After dispelling invisibility or shadow escape, gain _5 turns of extreme speed_ and _2 turns of Phantom Step_ (must dodge all attacks).\n\nNew powers from _Reconstructed Dungeon_!
actors.hero.talent$phantomstep.name=Phantomstep
actors.hero.talent$phantomstep.desc=The highest state that every member of the Thieves Guild aspires to is to master this ability.\n\nWhile under the influence of this effect, you dodge any physical or magical attacks.\n\nRemaining duration of effect: __PH0__ turns
actors.hero.talent.steam_bean.title=Steam Bean
actors.hero.talent.steam_bean.desc=_+0: _The first physical attack against an enemy causes the hero to fall into a _Trance for 8 turns_.\n\n_+1: _The first physical attack against an enemy causes the hero to fall into a stupor for 4 turns_.\n\n_+2:_Physically attacking enemies no longer stuns the hero.\n\nTalent type: _Limited to 5_.
actors.hero.talent.alchemy_accident.title=Alchemy Accident
actors.hero.talent.alchemy_accident.desc=_+0: _The refining alchemy product will have a _20% probability_ to produce an explosion centered on the hero.\n\n_+1: _The refining alchemy product will have a _10% probability_ to produce an explosion centered on the hero.\n\n_+2:_Alchemy is now safe.\n\nTalent type: _Limited to 5_.
actors.hero.talent.shell_cry.title=Shell Cry
actors.hero.talent.shell_cry.desc=_+0:_The hero's armor will decrease as health decreases, up to _100%_.\n\n_+1:_The hero's armor will decrease as health decreases, up to _50%_.\n\n_+2:_The hero's armor no longer decreases as health decreases.\n\nTalent type: _Limited to 5_.
actors.hero.talent.mal_curse.title=Mal Curse
actors.hero.talent.mal_curse.desc=_+0: _Cursed equipment will be _reduced by 2 levels_.\n\n_+1: _Cursed equipment will be _reduced by 1 level_.\n\n_+2:_Curse no longer affects equipment level.\n\nTalent type: _Limited to 5_.\n\nThis talent can reduce the equipment level to a negative number.\n\nA powerful curse from _Original Pixel Dungeon_!
actors.hero.talent.thunder_strike.title=Thunder Strike
actors.hero.talent.thunder_strike.desc=After upgrading this talent, physical attacks will be accompanied by arcs that cause 50% damage (the hero and allies will not be harmed by the arc). The arc can link creatures adjacent to the attack target (it will not link the attacker). If the attack target is in water and the hero has a staff or artifact charging effect, the link distance will be +1.\n\n_+1: _Arc_only causes damage to subsequent linked enemies_.\n\n_+2: _Arc_ will cause damage to all linked enemies_.\n\n"Do you understand that DM-300 is also a malfunctioning robot?"
actors.hero.talent.directional_collapse.title=Directional Collapse
actors.hero.talent.directional_collapse.desc=_+1: Every time the staff or wand casts a spell 4 times, a large number of falling rocks will be generated around the casting target, causing _10~20_ points of damage that ignores armor and _3 turns of paralysis_.\n\n_+2: Every time the staff or wand casts a spell 3 times, a large number of falling rocks will be generated around the casting target, causing _10~20_ points of damage that ignores armor and _3 turns of paralysis_.\n\nThe falling rocks generated by this talent will not damage or paralyze heroes and allies.
actors.hero.talent$directionalcollapse.name=Directional Collapse
actors.hero.talent$directionalcollapse.desc=The metal shards shattered from the DM-300's high-powered drill seem slightly different from other fel shards looted from metal debris, dissipating as quickly as your fingers touch them. Although you didn't know what it meant, you could feel the staff in your backpack getting a little stronger.\n\nEvery time the spell is cast __PH0__, a directional collapse will be triggered, causing a large amount of falling rocks around the cast target, causing 10~20 points of damage that ignores armor and 3 turns of paralysis. Fortunately, these falling rocks have no effect on you and your allies.\n\nCurrent number of spell casts: __PH0__
actors.hero.talent$resilientarmor.name=Resilientarmor
actors.hero.talent$resilientarmor.desc=You feel like your body has become more flexible, even the armor on your body.\n\nYou will gain 0~3 points of additional armor to withstand the next __PH0__ hits.
actors.hero.talent.resilient_meal.title=Resilient Meal
actors.hero.talent.resilient_meal.desc=_+1: _Eating will provide 0~3 points of extra armor to Slime Girl to resist the next _3 hits_.\n\n_+2_: Eating will provide 0~3 points of extra armor to the slime girl to resist the next _5 hits_.\n\nTalent type: _Special effects_.
actors.hero.talent.liquid_armor.title=Liquid Armor
actors.hero.talent.liquid_armor.desc=_+1:_The Slime Girl's armor provides _minimum armor +1_.\n\n_+2:_The Slime Girl's armor provides _minimum armor +2_.\n\nTalent type: _auxiliary_.
actors.hero.talent.tough_meal.title=Tough Meal
actors.hero.talent.tough_meal.desc=_+1: _Eating will provide the Slime Girl with _10% of the lost health value of herbal healing_ effect, with a minimum of _3 points_ and a maximum of _15 points_.\n\n_+2: _Eating will provide the Slime Girl with an herbal healing effect of 15% of her lost health, with a minimum of _5 points_ and a maximum of _25 points_.\n\nTalent type: _Special effects_.
actors.hero.talent.energy_absorption.title=Energy Absorption
actors.hero.talent.energy_absorption.desc=_+1:_The maximum damage suffered by the slime girl will not exceed _16.7%_ of the maximum health.\n\n_+2: _The maximum damage suffered by the slime girl will not exceed _12.5%_ of the maximum health.\n\nTalent type: _auxiliary_.\n\nThe effect of this talent is determined after all damage reduction.
actors.hero.talent.energy_absorption.meta_desc=_If this talent is obtained by another hero_, then it will cause the hero to suffer damage of up to 30% of the maximum health at +1, and at +2, it will cause the hero to take damage at most 20% of the maximum health.
actors.hero.talent.slime_greenhouse.title=Slime Greenhouse
actors.hero.talent.slime_greenhouse.desc=_+1: _Seeds germinating in Slime Girl's body will _no longer consume turns_.\n\n_+2: _On the basis of +1, seed germination can restore _30 satiety_.\n\nTalent type: _Special effects_.\n\nAfter opening the Wasteland Challenge, upgrading this talent will reduce the number of turns required for seeds to germinate in the body from 20_ to 15_.
actors.hero.talent.slime_greenhouse.meta_desc=_If this talent is obtained by other heroes_, then it will allow the hero to eat seeds to restore 30 satiety at +1, and at +2, it will trigger the vegetation effect corresponding to the seeds on the basis of +1.
actors.hero.talent.original_monster.title=Original Monster
actors.hero.talent.original_monster.desc=_+1: _The amount of healing provided after obtaining the _herbal healing_ effect is increased by an additional 50%_.\n\n_+2_: On the basis of +1, when having the effect of _herbal healing_, the slime girl will also gain _33% elemental resistance_.\n\n_+3_: On the basis of +1 and +2, Slime Girl will not lose the effect of herbal healing when moving.\n\nTalent type: _auxiliary_.
actors.hero.talent.water_body.title=Water Body
actors.hero.talent.water_body.desc=_+1:_Water Slime gains additional _100%_ of its current level's maximum health.\n\n_+2:_The water slime gains an additional _150%_ of its current level's maximum health.\n\n_+3:_The water slime gains an additional _200%_ of its current level's maximum health.
actors.hero.talent.water_revival.title=Water Revival
actors.hero.talent.water_revival.desc=_+1:_Water Slime absorbs slime slime and can restore _12.5%_ of its maximum health.\n\n_+2:_Water Slime absorbs slime slime and can restore _15%_ of its maximum health.\n\n_+3:_On the basis of +2, the water slime splits into slime slime which consumes only _5%_ of the current health value.
actors.hero.talent.water_regeneration.title=Water Regeneration
actors.hero.talent.water_regeneration.desc=_+1:_The water slime will have a natural recovery rate of _max HP 1.17%_ (minimum 1).\n\n_+2:_Water Slime will have a natural recovery multiplier of _max HP 1.33%_ (minimum 1).\n\n_+3:_The water slime will have a natural recovery rate of _1.5%_ of its maximum health (minimum 1).
actors.hero.talent$slimemucuscooldown.name=Slime Mucus Cooldown
actors.hero.talent$slimemucuscooldown.desc=Watery Slime just split a piece of slime slime, and it will take some time before it can split the slime again. Additionally, it speeds up the breakdown of mucus when attacked.\n\nThe watery slime needs another __PH0__ turn before it can split the next piece of slime.
actors.hero.talent$darkhookcooldown.name=Darkhook Cooldown
actors.hero.talent$darkhookcooldown.desc=The Dark Liquid Slime had just released her Dark Liquid Hook, and pulling the target vigorously consumed a lot of her energy, so it would take some time to recover.\n\nRestoration of this ability requires __PH0__ turns.
actors.hero.talent.potent_ooze.title=Potent Ooze
actors.hero.talent.potent_ooze.desc=After upgrading this talent, the water body can no longer completely clean the corrosive sludge, but the duration will be additionally reduced.\n\n_+1: _When in water, the _corrosive sludge_ effect is reduced by an additional _3 turns_.\n\n_+2: _When in water, the _corrosive sludge_ effect is reduced by an additional _2 turns_.\n\n_+3: _When in water, the _corrosive sludge_ effect is reduced by an additional _1 turn_.
actors.hero.talent.dark_gas.title=Dark Gas
actors.hero.talent.dark_gas.desc=_+1:_After being attacked, Dark Liquid Slime will have a _20% probability_ of releasing a small amount of _toxic gas_ and gain a _4-turn purification barrier_ effect.\n\n_+2: _After being attacked, Dark Liquid Slime will have a _20% probability_ to release a small amount of _poison gas or acid gas_ and gain a _4-turn purification barrier_ effect.\n\n_+3: _After being attacked, Dark Liquid Slime will have a _20% probability_ to release a small amount of _poison gas, acid corrosion or putrid gas_ and gain a _4-turn purification barrier_ effect.\n\nThe three gases of this talent have a probability of being released individually rather than all at once.
actors.hero.talent.dark_liquid.title=Dark Liquid
actors.hero.talent.dark_liquid.desc=_+1: _Dark Liquid Slime's use of Dark Liquid Hook will give the target an additional _2 turns of entangle_ effect, for a total of 5 turns.\n\n_+2: _On the basis of +1, the target will be given an additional _corrosive sludge_ effect for 20 turns.\n\n_+3: _On the basis of +1 and +2, enemies that die in the entangled state will provide _8 turns of staff charge and 5 turns of artifact charge_ to Dark Liquid Slime, and will also _reset the cooldown time of Dark Liquid Claw_.\n\nPulling an enemy into the abyss at +3 levels with this talent will not reset the cooldown of Dark Liquid Hook.
actors.hero.talent.no_pick.title=No Pick
actors.hero.talent.no_pick.desc=_+1: _The satiety restored by devouring enemies is increased by 20%_.\n\n_+2: _The satiety restored by devouring enemies is increased by 40%_.\n\n_+3: _The satiety restored by devouring enemies is increased by 60%_.\n\n_+4: _The satiety restored by devouring enemies is increased by 80%_.
actors.hero.talent.food_bonus.title=Food Bonus
actors.hero.talent.food_bonus.desc=_+1: _Swallowing enemies_can trigger eating special effects_.\n\n_+2: _On the basis of +1, after devouring the enemy, a _5x5 range duel area_ will be generated centered on itself.\n\n_+3: On the basis of +1 and +2, after devouring the enemy, you will gain a healing effect of 25% of the lost health.\n\n_+4: _On the basis of +1, +2 and +3, after devouring the enemy, you will gain _a shield of 20% of the maximum health_.
actors.hero.talent.delicious_digestion.title=Delicious Digestion
actors.hero.talent.delicious_digestion.desc=_+1:_When Slime Girl uses Kuangshi Diary with 100% armor charge, the charge consumption is reduced by 16%_.\n\n_+2:_When Slime Girl uses Kuangshi Diary with 100% armor charge, the charge consumption will be reduced by 30%_.\n\n_+3:_When Slime Girl uses Kuangshi Diary with 100% armor charge, the charge consumption is reduced by 40%_.\n\n_+4:_When Slime Girl uses Kuangshi Diary with 100% armor charge, the charge consumption will be reduced by 50%_.
actors.hero.talent.violent_storm.title=Violent Storm
actors.hero.talent.violent_storm.desc=_+1: _The units of transpirational water vapor gas generated are increased by 25%_.\n\n_+2: _The units of transpired water vapor gas generated are increased by 50%_.\n\n_+3: _The units of transpirational water vapor gas generated are increased by 75%_.\n\n_+4: _The units of transpirational water vapor gas generated are increased by 100%_.
actors.hero.talent.new_trap.title=New Trap
actors.hero.talent.new_trap.desc=_+1: _When using the transpiration water vapor generated by the turbulent waterfall to destroy the trap, there is a _20% probability of generating a trap crystal pillar_.\n\n_+2: _When using the transpiration water vapor generated by the turbulent waterfall to destroy the trap, there is a _40% probability of generating a trap crystal pillar_.\n\n_+3: _When using the transpiration water vapor generated by the turbulent waterfall to destroy the trap, there is a _60% probability of generating a trap crystal pillar_.\n\n_+4: _When using the transpiration water vapor generated by the turbulent waterfall to destroy the trap, there is an _80% probability of generating a trap crystal pillar_.\n\nThe maximum number of trap crystal pillars obtained each time you use Turbulent Waterfall is 3.
actors.hero.talent.holy_bath.title=Holy Bath
actors.hero.talent.holy_bath.desc=_+1: _When the enemy is in the steaming water vapor generated by the turbulent waterfall, he will be _repelled 1 square_ towards the adjacent non-water body of land.\n\n_+2: _When the enemy is in the steaming water vapor generated by the turbulent waterfall, he will be _repelled 2 blocks_ towards the adjacent non-water body of land.\n\n_+3: _When the enemy is in the steaming water vapor generated by the turbulent waterfall, he will be _repelled 3 blocks_ towards the adjacent non-water body of land.\n\n_+4: _When the enemy is in the steaming water vapor generated by the turbulent waterfall, he will be _repelled 4 blocks_ towards the adjacent non-water land.\n\nThe knockback effect of this talent cannot knock enemies off cliffs.
actors.hero.talent.potent_healing.title=Potent Healing
actors.hero.talent.potent_healing.desc=_+1: _The effect of _herbal healing_ obtained through the Yangchun Array is increased to _30 points_.\n\n_+2: _The effect of _herbal recuperation_ obtained through the Yangchun Array is increased to _35 points_.\n\n_+3: _The effect of _herbal healing_ obtained through the Yangchun Array is increased to _40 points_.\n\n_+4: _The effect of _herbal healing_ obtained through the Yangchun Array is increased to _45 points_.
actors.hero.talent.efficient_healing.title=Efficient Healing
actors.hero.talent.efficient_healing.desc=_+1: _The effect of _herbal recuperation_ given by the Yangchun Array is increased to _recover 1.5 health points per round_.\n\n_+2: _The effect of _herbal recuperation_ given by the Yangchun Array is increased to _recover 2 health points per round_.\n\n_+3: _The effect of _herbal recuperation_ given by the Yangchun Array becomes _recover 2.5 health points per round_.\n\n_+4: _The effect of _herbal recuperation_ given by the Yangchun Array becomes _recover 3 points of health per round_.\n\nThis talent does not affect the total healing amount of the Herbal Retreat, but only increases the healing speed.
actors.hero.talent.mass_healing.title=Mass Healing
actors.hero.talent.mass_healing.desc=_+1:_When the Yang Spring Array is activated, an ally with the least health within a _3x3 range_ around the Slime Girl will receive the same amount of _herbal healing_ effect.\n\n_+2:_When Yangchun Array is activated, an ally with the least health within a _5x5 circular range_ around Slime Girl will receive the same amount of _herbal healing_ effect.\n\n_+3:_When Yangchun Array is activated, an ally with the lowest health within _5x5 range_ around Slime Girl will receive the same amount of _herbal healing_ effect.\n\n_+4:_When Yangchun Array is activated, an ally with the least health within a _7x7 circular range_ around Slime Girl will receive the same amount of _herbal healing_ effect.
actors.hero.talent.liquid_perception.title=Liquid Perception
actors.hero.talent.liquid_perception.desc=_+1:_When the slime girl drinks a bottle of strength potion or experience potion, _1 potion_ will be randomly identified.\n\n_+2:_When the slime girl drinks a bottle of strength potion or experience potion, _1 potion or 1 scroll_ will be randomly identified.\n\nTalent type: _Resource type_.\n\nThis talent will also take effect when drinking items made from strength potions or experience potions.
actors.hero.talent.water_wave.title=Water Wave
actors.hero.talent.water_wave.desc=_+1: _Slime Girl will cause _1 extra point of damage_ when attacking an enemy in water.\n\n_+2: _Slime Girl will cause _2 extra points of damage_ when attacking an enemy in water.\n\nTalent type: _physical attack type_.
actors.hero.talent.natural_affinity.title=Natural Affinity
actors.hero.talent.natural_affinity.desc=_+1:_Slime Girl's hunger rate is reduced by 20%_.\n\n_+2: _Slime Girl's hunger rate is _reduced by 33%_.\n\nTalent type: _auxiliary_.
actors.hero.talent.quality_absorption.title=Quality Absorption
actors.hero.talent.quality_absorption.desc=_+1:_Slime Girl absorbs dewdrops and recovers _+2_ health.\n\n_+2:_Slime Girl absorbs dewdrops and recovers health _+3_.\n\nTalent type: _auxiliary_.\n\nThis talent also applies to dewdrops in water bags.
actors.hero.talent.empowering_life.title=Empowering Life
actors.hero.talent.empowering_life.desc=_+1:_When the slime girl's current health is full, the overflowing natural recovery will be converted into a shield that will not be lost, with an upper limit of _6.7%_ of the maximum health, and _casting damage will be increased by 10%_.\n\n_+2:_When the slime girl's current health is full, the overflowing natural recovery will be converted into a shield that will not be lost, with an upper limit of _13.3%_ of the maximum health, and _casting damage will be increased by 20%_.\n\n_+3:_When the slime girl's current health is full, the overflowing natural recovery will be converted into a shield that will not be lost, with an upper limit of _20%_ of the maximum health, and _casting damage will be increased by 30%_.\n\nTalent type: _Spell Damage_.
actors.hero.talent.ninja_meal.title=Ninja Meal
actors.hero.talent.ninja_meal.desc=_+1: _Eating will restore _1 charge_ to the ninja's shuriken box.\n\n_+2: _Eating will restore _2 points of charge_ to the ninja's shuriken box.\n\nTalent type: _Special effects_.\n\nIf there is no Shuriken Box in the backpack, this talent will provide _1/2 turn of Artifact Charge_ at _+1/+2_ levels (it cannot cause the Horn of Plenty to charge itself).\n\n"He ate a big belly ration filled with meat fillings in one bite!"
actors.hero.talent.agile_attack.title=Agile Attack
actors.hero.talent.agile_attack.desc=_+1:_When the ninja dodges an enemy attack, his next physical attack will deal _3 additional points of damage_.\n\n_+2:_When the ninja dodges an enemy attack, his next physical attack will deal _5 extra points of damage_.\n\nTalent type: _physical attack type_.\n\n"Namu-san, such a wonderful dodge and counter-attack combo, everyone with ninja dynamic vision must have seen it clearly."
actors.hero.talent$agileattack.name=Agile Attack
actors.hero.talent$agileattack.desc=The Ninja has recently dodged an enemy attack, and his next physical attack against the target will gain bonus damage.
actors.hero.talent.you_scared_me.title=You Scared Me
actors.hero.talent.you_scared_me.desc=_+1:_Whenever a ninja dodges an attack and his current shield is less than _4 points_, he gains _2 shield points_.\n\n_+2:_Whenever a ninja dodges an attack and his current shield is less than _6 points_, he gains _3 shield points_.\n\nTalent type: _auxiliary_.\n\nThe shield gained through this talent will not exceed _4/6 points_ at _+1/+2_ levels.\n\n"Feng Lin Shan, tea ceremony, and then... Feng Lin Shan."
actors.hero.talent.yunying_meal.title=Yunying Meal
actors.hero.talent.yunying_meal.desc=_+1: _The ninja only spends 1 turn eating and gains _2 turns of invisibility_.\n\n_+2: _The ninja spends only 1 turn eating and gains _4 turns of invisibility_.\n\nTalent type: _Special effects_.\n\nThis talent is shared with the talents _Eat Experience_, _Invincible Meal_ and _Birthday Gift_ with a 100 trigger limit_.\n\n"aieeeeeee! Ninja! Why are there ninjas here?!"
actors.hero.talent.xia.title=Xia
actors.hero.talent.xia.desc=_+1:_After reading the scroll or using the spell crystal, the ninja will gain _3 turns_ of Kasumi's Footwork (+50% dodge).\n\n_+2:_After reading the scroll or using the spell crystal, the ninja will gain _5 turns_ of Kasumi's Footwork (+50% dodge).\n\nTalent type: _Special effects_.\n\nIf you use an upgrade scroll, a transmutation scroll, or an alchemical item that must be refined with the aforementioned scrolls, the duration of the Xayah Step effect will be doubled.\n\nFor alchemical items with a high yield (such as most crystals), this talent will be triggered based on the probability of the item being produced in a single time.\n\nThis talent can be triggered by reading the Grimoire of Disorder.\n\n"A long time ago, the first generation of ninjutsu masters who were proficient in the secrets of ninjutsu used a scroll to invent a secret: Kasumi's Footwork."
actors.hero.talent$xiadef.name=Xiadef
actors.hero.talent$xiadef.desc=After reading the scroll, the ninja briefly understood a secret, which made his body become light and agile.\n\nThis effect increases your dodge by 50__PH0__ to better avoid enemy attacks.\n\nNumber of turns remaining: __PH0__ turns
actors.hero.talent.quick_search.title=Quick Search
actors.hero.talent.quick_search.desc=_+1: _It only takes 1 turn_ for the ninja to search around.\n\n_+2: _On the basis of +1, the ninja's search around will only consume 2 times the satiety_.\n\nTalent type: _auxiliary_.\n\nNote that normal search always takes 2 turns and consumes 3 times the satiety.\n\n"Only after exploring the surrounding environment can you rest and fight with peace of mind."
actors.hero.talent.ninja_social.title=Ninja Social
actors.hero.talent.ninja_social.desc=_+1:_After a ninja kills an enemy with a physical weapon, the accuracy of the next _3 attacks_ will be increased by 50%.\n\n_+2:_After a ninja kills an enemy with a physical weapon, the accuracy of the next _5 attacks_ will be increased by 50%.\n\nTalent type: _physical attack type_.\n\n"Nan Wusan, what a precise chop combo, really a good skill."
actors.hero.talent$ninjasocial.name=Ninja Social
actors.hero.talent$ninjasocial.desc=For the next several attacks, the ninja's accuracy increases by 50__PH0__.\n\nRemaining times: __PH0__
actors.hero.talent.feint.title=Feint
actors.hero.talent.feint.desc=_+1: _When a ninja throws non-weapon items into the open space, it will lead enemies within his field of vision to the corresponding location, _with a 20-turn cooldown_.\n\n_+2: _When a ninja throws non-weapon items into the open space, it will lead enemies within his field of vision to the corresponding location, _15 turns of cooldown_.\n\nTalent type: _Special effects_.\n\nThis talent can awaken sleeping enemies. Normally, the attracted enemies have a 50% chance of turning their attention to ninjas or allies within sight every round.\n\n"You're playing tricks on me, you bastard!"
actors.hero.talent$feintcooldown.name=Feint Cooldown
actors.hero.talent$feintcooldown.desc=You have just thrown an object to attract the enemy. It will be difficult to attract their attention by making noise in a short period of time.\n\nRemaining cooldown: __PH0__ turns
actors.hero.talent.light_box.title=Light Box
actors.hero.talent.light_box.desc=_+1:_The ninja can use its function without equipping the shuriken box, but the charging rate of the shuriken box will be reduced to _25%_ when not equipped.\n\n_+2:_The ninja can use its function without equipping the shuriken box, but the charging rate of the shuriken box will be reduced to _50%_ when not equipped.\n\n_+3:_Ninjas can use the Shuriken Box without equipping it, but the charging rate of the Shuriken Box will be reduced to _75%_ when not equipped.\n\nTalent type: _auxiliary_.\n\nIf there is no shuriken box in the backpack, this talent will increase all thrown weapons by _1/2/3_ levels for 4 turns after using the artifact at _+1/+2/+3_ levels.
actors.hero.talent.qianfa_throwing.title=Hidden Weapon Throwing
actors.hero.talent.qianfa_throwing.desc=_+1:_When a ninja throws a throwing weapon or a small shuriken, there is a _10% chance_ of causing 3 times the damage.\n\n_+2:_When a ninja throws a throwing weapon or a small shuriken, there is a _20% chance_ of causing 3 times the damage.\n\n_+3: _When a ninja throws a throwing weapon or a small shuriken, there is a _30% chance_ of causing 3 times the damage.\n\nTalent type: _physical attack type_.\n\nIf a hero holding a special throwing weapon such as a psychic bow obtains this talent, the special throwing weapon will also enjoy the bonus of this talent.\n\n"Instruction・One: If you can't kill an opponent with a hundred shurikens, don't think about killing them with one shuriken, just throw a thousand shurikens!"
actors.hero.talent.soko.title=Soko
actors.hero.talent.soko.desc=_+1:_The time required for the Iron Cannon Ninja to reload the Iron Cannon is reduced by 4 turns_.\n\n_+2:_The time required for the Iron Cannon Ninja to reload the Iron Cannon is reduced by 7 turns_.\n\n_+3:_The time required for the Iron Cannon Ninja to reload the Iron Cannon is reduced by 10 turns_.\n\n"Hayago is an important innovation in artillery loading technology in the Eastern countries. By pre-packaging a certain amount of gunpowder and projectiles required for a single shot in a bamboo tube or paper bag, and pouring it directly into the barrel during use, the iron gunner's shooting efficiency is increased from 1 to 2 turns per minute to 4 to 5 turns."
actors.hero.talent.kono_fukusa.title=Kono Fukusa
actors.hero.talent.kono_fukusa.desc=_+1:_When the Iron Cannon Ninja ambush an enemy or physically attack an enemy in pursuit, the damage caused will be increased by 20%_.\n\n_+2: _When the Iron Cannon Ninja ambush an enemy or physically attack an enemy in pursuit, the damage caused _increases by 40%_.\n\n_+3:_When the Iron Cannon Ninja ambushes an enemy or attacks an enemy in pursuit with a physical attack, the damage caused _increases by 60%_.\n\n"Diao Ye Ambush is a tactic created by Oriental tacticians. It focuses on luring the enemy deep and then launching an annihilation ambush. It was once used to defeat more with less when joining forces with the northern countries to block the invasion of jackals."
actors.hero.talent.kunikuchi.title=Kunikuchi
actors.hero.talent.kunikuchi.desc=_+1:_The Iron Cannon Ninja can load bombs into the Iron Cannon, so that the next _1 shot_ will have a bomb effect.\n\n_+2:_The iron cannon ninja can load the iron cannon with bombs, so that the next _3 shots_ will have bomb effects.\n\n_+3:_The Iron Cannon Ninja can load bombs into the Iron Cannon, so that the next _5 shots_ will have bomb effects.\n\n"The Guobeng Cannon is a large-caliber artillery piece. The loud noise it makes can scare the enemy far more than its actual power (of course, its power should not be underestimated)."
actors.hero.talent.soul_hunting.title=Soul Hunting
actors.hero.talent.soul_hunting.desc=_+1:_When an enemy dies, the Ninjutsu Master will gain _0.5 Ninjutsu Energy_.\n\n_+2:_When an enemy dies, the ninjutsu master will gain _1 point of ninjutsu energy_.\n\n_+3:_When an enemy dies, the Ninjutsu Master will gain _1.5 Ninjutsu Energy_.
actors.hero.talent.use_environment.title=Use Environment
actors.hero.talent.use_environment.desc=_+1:_The ninjutsu master releases the escape technique to absorb _3x3 flames_ around him and gain _3 turns of flame power_.\n\n_+2: _On the basis of +1, the Ninjutsu master can absorb _3x3 surrounding non-fire and non-electric field gases such as dazzling, paralyzing, poisonous gas, etc. when releasing the escape technique, and release these gases at the target location the next time he uses the throwing technique.\n\n_+3:_On the basis of +1 and +2, the ninjutsu master's escape technique can absorb the surrounding _3x3 electric field_ and convert it into _a certain round of staff charge and artifact charge_ based on the amount of absorption.
actors.hero.talent.mind_water.title=Mind Water
actors.hero.talent.mind_water.desc=_+1: _The ninjutsu master releases _close-up technique_ and the ninjutsu energy consumed_-1_.\n\n_+2: _The ninjutsu master releases the _throwing technique_ and the ninjutsu energy consumed_-1_.\n\n_+3:_The Ninjutsu energy consumed by the Ninjutsu master releasing the Escape Technique_-1_.
actors.hero.talent.deversion.title=Deversion
actors.hero.talent.deversion.desc=_+1:_The shadow warrior's maximum health is increased to _50 points_, and the attack is increased to _20~25 points_.\n\n_+2: _On the basis of +1, a summon can produce _2_ Shadow Warriors.\n\n_+3:_The shadow warrior's maximum health is increased to _60 points_, and the attack is increased to _30~35 points_.\n\n_+4: _On the basis of +3, a summon can produce _3_ Shadow Warriors.
actors.hero.talent.shinkage.title=Shinkage
actors.hero.talent.shinkage.desc=_+1:_The Shadow Warrior's armor is increased to _1~5 points_.\n\n_+2: _On the basis of +1, the Kagemusha will give the ninja _1 round of hormone surge_ when attacked.\n\n_+3:_The Shadow Warrior's armor is increased to _2~10 points_.\n\n_+4: _On the basis of +3, the Kagemusha will give the ninja _1.5 turns of hormone surge_ when attacked.
actors.hero.talent.allhunting.title=Allhunting
actors.hero.talent.allhunting.desc=_+1: _After the Kagemusha attacks the enemy, it will be branded with a shadow mark for 2 turns_. The marked enemy will take 15% more damage from ninjas and Kagemusha.\n\n_+2: _After the Kagemusha attacks the enemy, it will be branded with a shadow mark for 4 turns_. The marked enemy will take 30% more damage from ninjas and Kagemusha.\n\n_+3: _After the Kagemusha attacks the enemy, it will be branded with a shadow mark for 6 turns_. The marked enemy will take 45% more damage from ninjas and Kagemusha.\n\n_+4: _After the Kagemusha attacks the enemy, it will be branded with a shadow mark for 8 turns_. The marked enemy will take 60% more damage from ninjas and Kagemusha.
actors.hero.talent.offensive.title=Offensive
actors.hero.talent.offensive.desc=_+1: _Secret Truth: Ichintachi's attack speed and melee damage bonuses are increased from 50% and 30% to _62.5%_ and _45%_.\n\n_+2:_Secret Truth: Ichintachi's attack speed and melee damage bonuses are increased from 50% and 30% to _75%_ and _60%_.\n\n_+3: _Secret meaning: Ichintachi's bonus to attack speed and melee damage is increased from 50% and 30% to _87.5%_ and _75%_.\n\n_+4: _Secret Truth: The attack speed and melee damage bonus of the Ichitachi sword are increased from 50% and 30% to _100%_ and _90%_.\n\n"Don't dare to violent tiger, don't dare to Feng He."
actors.hero.talent.glimpse.title=Glimpse
actors.hero.talent.glimpse.desc=_+1:_Secret meaning: The bonus of Ichintachi's movement speed is increased from 100% to _137.5%_.\n\n_+2:_Secret meaning: The bonus of Ichintachi's movement speed is increased from 100% to _175%_.\n\n_+3:_Secret meaning: The bonus of Ichintachi's movement speed is increased from 100% to _212.5%_.\n\n_+4:_Secret meaning: The bonus of Ichintachi's movement speed is increased from 100% to _250%_.\n\n"People know one thing, but they don't know the other."
actors.hero.talent.kill_continue.title=Kill Continue
actors.hero.talent.kill_continue.desc=_+1: _When killing an enemy with a melee weapon, extend _1 turn_ Secret Art: Ichi no Tachi.\n\n_+2: _When killing an enemy with a melee weapon, extend _2 turns_ Secret Art: Ichi no Tachi.\n\n_+3: _When killing an enemy with a melee weapon, extend _3 turns_ Secret Art: Ichi no Tachi.\n\n_+4: _When killing an enemy with a melee weapon, extend _4 rounds_ Secret Art: Ichino Taito.\n\n"Fighting with fear is like facing an abyss or walking on thin ice."
actors.hero.talent.power_gunpowder.title=Power Gunpowder
actors.hero.talent.power_gunpowder.desc=_+1: _The damage caused by the explosion of the flat spider cauldron is increased to _25~55 points_.\n\n_+2:_On the basis of +1, the explosion range of the Flat Spider Cauldron is increased to _5x5_.\n\n_+3: _The damage caused by the explosion of the flat spider cauldron is increased to _30~70 points_.\n\n_+4:_On the basis of +3, the explosion range of the Flat Spider Cauldron is increased to _7x7_.
actors.hero.talent.tea_stains.title=Tea Stains
actors.hero.talent.tea_stains.desc=_+1: _The explosion of the flat spider cauldron will cause _5 turns of burning_.\n\n_+2: _The explosion of the flat spider cauldron will cause _5 turns of burning or frostbite_.\n\n_+3: _The Spider Cauldron explosion will cause _5 turns of burning or frostbite_ and _3 turns of paralysis_.\n\n_+4: _The Spider Cauldron explosion will cause _8 turns of burning or frostbite_ and _3 turns of paralysis_.
actors.hero.talent.firework.title=Firework
actors.hero.talent.firework.desc=_+1: _After the Spider Cauldron explodes, a small Spider Cauldron will be left behind, which can continue to attract enemies that are not asleep for _10 rounds_, and then produce a 3x3 area explosion but cause no damage.\n\n_+2: _After the explosion of the flat spider cauldron, a small spider cauldron will be left behind, which can continue to attract enemies that are not asleep for _10 rounds_, and then produce a 3x3 range explosion causing _10~20_ points of damage.\n\n_+3: _After the explosion of the flat spider cauldron, a small spider cauldron will be left behind, which can continue to attract enemies that are not asleep for _15 rounds_, and then produce a 3x3 range explosion causing _10~20_ points of damage.\n\n_+4: _After the flat spider cauldron explodes, a small spider cauldron will be left behind, which can continue to attract enemies that are not asleep for _15 rounds_, and then produce a 3x3 range explosion causing _15~30_ points of damage.
actors.hero.talent.mark_meal.title=Mark Meal
actors.hero.talent.mark_meal.desc=_+1: _Eating will increase the duration of the command mark attached to the next 3 physical attacks DM-400 will cause to the enemy to _5 turns_.\n\n_+2: _Eating will increase the duration of the command mark attached to the next 3 physical attacks DM-400 will cause to the enemy to _6 turns_.\n\nTalent type: _Special effects_.\n\n"64 65 6C 69 63 6F 75 73."
actors.hero.talent.mark_meal.meta_desc=_If this talent is acquired by another hero_, it will instead be stun for 2/3 turns.
actors.hero.talent.over_code.title=Over Code
actors.hero.talent.over_code.desc=_+1: _DM-400 randomly identifies _1 type of scroll_ when reading an upgrade scroll or transmutation scroll.\n\n_+2: _DM-400 When reading an upgrade scroll or transmutation scroll, _1 type of scroll or 1 type of potion_ is randomly identified.\n\nTalent type: _Resource type_.\n\nThis talent will also take effect when reading items made from upgrade scrolls or transmutation scrolls.\n\n"Decoding Files..."
actors.hero.talent$markmeal.name=Marked Meal
actors.hero.talent$markmeal.desc=The command mark effect given by DM-400 for the next several physical attacks is extended.\n\nIf other heroes obtain this effect, the next few physical attacks will give the target a stun effect for a certain round.\n\nRemaining times: __PH0__
actors.hero.talent.tbm.title=TBM
actors.hero.talent.tbm.desc=_+1: _DM-400 will gain _3 shield points_ every 60 turns.\n\n_+2: _DM-400 will gain _5 shield points_ every 60 turns.\n\nTalent type: _auxiliary_.\n\n"Repairing Files..."
actors.hero.talent.target_targeting.title=Target Targeting
actors.hero.talent.target_targeting.desc=_+1: _DM-400 will cause _1 additional point of damage_ when attacking an enemy with the _Command Mark_ effect.\n\n_+2: _DM-400 will cause _2 additional points of damage_ when attacking an enemy with the _Command Mark_ effect.\n\nTalent type: _physical attack type_.\n\n"Target Locked."
actors.hero.talent.target_targeting.meta_desc=_If this talent is acquired by another hero_, it will instead work on enemies with the stun effect.
actors.hero.talent.over_meal.title=Over Meal
actors.hero.talent.over_meal.desc=_+1: _DM-400 eating_only takes 0.5 turns_.\n\n_+2: _DM-400 to eat_no turns_ spent.\n\nTalent type: _Special effects_.\n\n"63 72 75 6E 63 68 79."
actors.hero.talent.recover_charge.title=Recover Charge
actors.hero.talent.recover_charge.desc=_+1:_When DM-400 enters a scroll for the command collection tool, it will restore _1 point of charge_ to the command collection tool.\n\n_+2:_When DM-400 enters a scroll for the command collection tool, it will restore _2 points of charge_ to the command collection tool.\n\nTalent type: _Special effects_.\n\n"Recycle."
actors.hero.talent.recover_charge.meta_desc=_If this talent is obtained by another hero_, then it will allow the hero to gain 2 turns of artifact charge after reading the scroll or disordered grime at +1, and increase to 4 turns at +2. Using upgrade scrolls, transmutation scrolls, or alchemical items that must be refined with the aforementioned scrolls will not enhance this effect. Alchemy items with higher yields (such as most crystals) will be triggered based on the probability of a single output of the item.
actors.hero.talent.body_reinforce.title=Body Reinforce
actors.hero.talent.body_reinforce.desc=_+1: _Drones spawned by the DM-400 inherit _50% of its armor_.\n\n_+2: _Drones spawned by the DM-400 inherit _75% of its armor_.\n\nTalent type: _auxiliary_.\n\n"The Panzer 400 and its Panzer Legion."
actors.hero.talent.body_reinforce.meta_desc=_If this talent is acquired by another hero_, then it will give the hero 5% damage reduction at +1, increasing to 10% at +2.
actors.hero.talent.efficient_order.title=Efficient Order
actors.hero.talent.efficient_order.desc=_+1: _All allies of DM-400 have _30% increased movement speed_.\n\n_+2: _All allies of DM-400 move 45% faster.\n\nTalent type: _auxiliary_.\n\n"Go to work."
actors.hero.talent.rocket_fist.title=Rocket Fist
actors.hero.talent.rocket_fist.desc=_+1: _DM-400's unarmed attack has a _60% probability of knocking the target back 1 square_.\n\n_+2: _DM-400's unarmed attack has a _60% probability of knocking the target back 2 squares_.\n\nTalent type: _physical attack type_.\n\nIf attacking with a melee weapon, the knockback probability is only 30%.\n\n"Rocket Punch——!!!"
actors.hero.talent.big_fist.title=Big Fist
actors.hero.talent.big_fist.desc=_+1: _DM-400's unarmed attack can ignore the enemy's armor, and the damage caused is increased to _3~20 points_.\n\n_+2: _DM-400's unarmed attack can ignore the enemy's armor, and the damage caused is increased to _4~25 points_.\n\n_+3: _DM-400's unarmed attack can ignore the enemy's armor, and the damage caused is increased to _5~30 points_.\n\nTalent type: _physical attack type_.\n\nEquipping the Ring of Martial Power will cover the unarmed damage of DM-400 instead of directly superimposing it, but it will still retain the effect of this talent to ignore enemy armor.
actors.hero.talent.quick_tool.title=Quick Tool
actors.hero.talent.quick_tool.desc=_+1: _DM-400 can use its functions without equipping the Command Collection Tool, but the recharging rate of the tool will be reduced to _25%_ when not equipped.\n\n_+2: _DM-400 can use its function without equipping the Command Collection Tool, but the charging rate of the tool will be reduced to _50%_ when not equipped.\n\n_+3: _DM-400 can use its functions without equipping the Command Collection Tool, but the recharging rate of the tool will be reduced to _75%_ when not equipped.\n\nTalent type: _auxiliary_.
actors.hero.talent.quick_tool.meta_desc=_If this talent is acquired by another hero_, it will grant all allies an additional 10/20/30% damage reduction at +1/+2/+3 levels.
actors.hero.talent.sustain_mark.title=Sustain Mark
actors.hero.talent.sustain_mark.desc=_+1: _AT-400's physical attack can cause an additional 2 turns of command mark_effect.\n\n_+2: _AT-400's physical attack can cause an additional 4 turns of command mark_effect.\n\n_+3: _AT-400's physical attack can cause an additional 6 turns of command mark_effect.\n\nThis talent is effective against harassing drones and stunning drones.
actors.hero.talent.battle_upgrade.title=Battle Upgrade
actors.hero.talent.battle_upgrade.desc=_+1: _The damage caused by all combat drones produced by AT-400 is increased by _15%_, and there will also be an additional increase based on the enemy's armor. This additional increase is equivalent to ignoring the enemy's armor by up to _26.7%_.\n\n_+2: _The damage caused by all combat drones produced by AT-400 is increased by _22.5%_, and there will also be an additional increase based on the enemy's armor. This additional increase is equivalent to ignoring the enemy's armor by up to _53.3%_.\n\n_+3: _The damage caused by all combat drones produced by AT-400 is increased by _30%_, and there will also be an additional increase based on the enemy's armor. This additional increase is equivalent to ignoring the enemy's _80% armor_ at most.
actors.hero.talent.fly_drone.title=Fly Drone
actors.hero.talent.fly_drone.desc=_+1: _All combat drones produced by AT-400 must dodge the _first 2 attacks_ they receive.\n\n_+2: _All combat drones produced by AT-400 must dodge the _first 3 attacks_ they receive.\n\n_+3: _All combat drones produced by AT-400 must dodge the _first 4 attacks_ they receive.\n\nThis talent does not apply to pre-change Chaos Drones.
actors.hero.talent.special_mark.title=Special Mark
actors.hero.talent.special_mark.desc=_+1: _AU-400's accuracy is increased by _50%_ when attacking an enemy with the _command mark_ effect, and there is a _16.7% chance of giving it the _3-round target_ effect.\n\n_+2: _AU-400's accuracy is increased by _75%_ when attacking an enemy with the _Command Mark_ effect, and there is a _33.3% chance of _giving it the _3-round target_ effect.\n\n_+3: _AU-400's accuracy is increased by _100%_ when attacking an enemy with the _Command Mark_ effect, and there is a _50% chance of _giving it the _3-round target_ effect.
actors.hero.talent.assist_upgrade.title=Assist Upgrade
actors.hero.talent.assist_upgrade.desc=_+1: _All auxiliary drones produced by AU-400 will provide _4 shield points_ every _50 turns_.\n\n_+2: _All auxiliary drones produced by AU-400 will provide _4 shield points_ every _40 turns_.\n\n_+3: _All auxiliary drones produced by AU-400 will provide _4 shield points_ every _30 turns_.\n\nThe shield stacked by this talent will not exceed half of your maximum health.\n\nThis talent does not apply to pre-change Chaos Drones.
actors.hero.talent.fast_cruise.title=Fast Cruise
actors.hero.talent.fast_cruise.desc=_+1: _All auxiliary drones produced by AU-400 will provide _2 turns of extreme speed_ every _80 turns_.\n\n_+2: _All auxiliary drones produced by AU-400 will provide _2 turns of extreme speed_ every _70 turns_.\n\n_+3: _All auxiliary drones produced by AU-400 will provide _2 turns of extreme speed_ every _60 turns_.\n\nThis talent does not apply to pre-change Chaos Drones.
actors.hero.talent.over_extend.title=Over Extend
actors.hero.talent.over_extend.desc=_+1: _Overload is extended to _12 turns_.\n\n_+2: _Overload is extended to _15 turns_.\n\n_+3: _Overload is extended to _17 turns_.\n\n_+4: _Overload is extended to _20 turns_.
actors.hero.talent.terror_mach.title=Terror Mach
actors.hero.talent.terror_mach.desc=_+1: _After entering overload, the enemy that enters DM-400's field of vision for the first time will fall into _2 turns of fear_.\n\n_+2: _After entering overload, the enemy that enters DM-400's field of vision for the first time will fall into _4 turns of fear_.\n\n_+3:_After entering overload, the enemy that enters DM-400's field of vision for the first time will fall into _6 turns of fear_.\n\n_+4: _After entering overload, the enemy that enters DM-400's field of vision for the first time will fall into _8 turns of fear_.\n\nEach enemy will only be affected by the fear effect once.
actors.hero.talent.strong_perserve.title=Strong Perserve
actors.hero.talent.strong_perserve.desc=_+1: _After the maintenance is completed, _7.5% of the maximum health point shield will be given to itself and all drones_. At the same time, the damage received by itself during overload will be reduced by 5%_.\n\n_+2: _After the maintenance is completed, _10% of the maximum health points of the maximum health points will be given to yourself and all drones as shields_. At the same time, the damage you receive during the overload period will be reduced by 10%_.\n\n_+3: _After the maintenance is completed, _12.5% ​​of the maximum health points of the shield will be given to itself and all drones_, and at the same time, the damage received by itself during overload will be _reduced by 15%_.\n\n_+4: _After the maintenance is completed, _15% of the maximum health points of the maximum health points will be given to yourself and all drones as shields_. At the same time, the damage you receive during overload will be _reduceed by 20%_.
actors.hero.talent.over_time.title=Over Time
actors.hero.talent.over_time.desc=_+1:_The amount of poisonous gas ejected by each group is increased by _15%_.\n\n_+2:_The amount of poisonous gas ejected by each group is increased by _30%_.\n\n_+3:_The amount of poisonous gas ejected by each group is increased by _45%_.\n\n_+4:_The amount of poisonous gas ejected by each group is increased by _60%_.
actors.hero.talent.deadly_gas.title=Deadly Gas
actors.hero.talent.deadly_gas.desc=_+1: _The poison gas sprayed by DM-400 _damage +1_.\n\n_+2: _The poison gas sprayed by DM-400 _damage +2_.\n\n_+3: _The poison gas sprayed by DM-400 _damage +3_.\n\n_+4: _The poisonous gas sprayed by DM-400 _damage +4_.
actors.hero.talent.discharge_happy.title=Discharge Happy
actors.hero.talent.discharge_happy.desc=_+1: _DM-400 gains _2 turns of extreme speed_ after spraying poison gas.\n\n_+2: _DM-400 gains _4 turns of extreme speed_ after spraying poison gas.\n\n_+3: _DM-400 gains _6-turn extreme speed_ after spraying poison gas.\n\n_+4: _DM-400 gains _8 turns of extreme speed_ after spraying poison gas.
actors.hero.talent.process_extend.title=Process Extend
actors.hero.talent.process_extend.desc=_+1:_During the startup of the cluster program, each drone destroyed will extend the effective time of the program by 0.5 rounds_.\n\n_+2:_During the startup of the cluster program, each drone destroyed will extend the effective time of the program by 1 round_.\n\n_+3:_During the startup of the cluster program, each drone destroyed will _extend the effective time of the program by 1.5 rounds_.\n\n_+4:_During the startup of the cluster program, each drone destroyed will _extend the effective time of the program by 2 rounds_.
actors.hero.talent.glorious_dead.title=Glorious Dead
actors.hero.talent.glorious_dead.desc=_+1:_During the startup of the cluster program, each drone destroyed will restore _4.5%_ of maximum health to DM-400.\n\n_+2:_During the startup of the cluster program, each drone destroyed will restore _5%_ of maximum health to DM-400.\n\n_+3:_During the startup of the cluster program, each drone destroyed will restore _5.5%_ of maximum health to DM-400.\n\n_+4:_During the startup of the cluster program, each drone destroyed will restore _6%_ of maximum health to DM-400.
actors.hero.talent.upon_wave.title=Upon Wave
actors.hero.talent.upon_wave.desc=_+1:_During the startup of the cluster program, each drone destroyed will give DM-400 _3 turns of artifact charge_.\n\n_+2:_During the startup of the cluster program, every time a drone is destroyed, DM-400 will be given _4 turns of artifact charge_.\n\n_+3:_During the startup of the cluster program, every time a drone is destroyed, DM-400 will be given _5 turns of artifact charge_.\n\n_+4:_During the startup of the cluster program, every time a drone is destroyed, DM-400 will be given _6 turns of artifact charge_.
actors.hero.talent.elite_recruit.title=Elite Recruit
actors.hero.talent.elite_recruit.desc=_+1:_When signing a contract, the gentleman will spend an additional _200 gold coins_ to give the contracted enemy a random elite effect.\n\n_+2:_When signing a contract, the gentleman will spend an additional _150 gold coins_ to give the contracted enemy a random elite effect.\n\n_+3:_When signing a contract, the gentleman will spend an additional _100 gold coins_ to give the contracted enemy a random elite effect.\n\n_+4:_When signing a contract, the gentleman will spend an additional _50 gold coins_ to give the contracted enemy a random elite effect.
actors.hero.talent.prim_accu.title=Prim Accu
actors.hero.talent.prim_accu.desc=_+1: _The enemy who signed the contract will give the gentleman _10 gold coins_ when he physically attacks other enemies.\n\n_+2: _The enemy who signed the contract will give the gentleman _20 gold coins_ when he physically attacks other enemies.\n\n_+3: _Enemies who have signed a contract will give the gentleman _30 gold coins_ when they physically attack other enemies.\n\n_+4: _Enemies who have signed a contract will give the gentleman _40 gold coins_ when they physically attack other enemies.
actors.hero.talent.soul_contract.title=Soul Contract
actors.hero.talent.soul_contract.desc=_+1: After the enemy who signed the contract dies, he will turn into a corrupted working ghost, and the gentleman will receive a total of 100 gold coins as the work-related injury compensation that was originally supposed to be paid to the working ghost through the details in the contract that no one cares about.\n\n_+2: On the basis of +1, the corruption effect of the working ghost becomes the effect of "working hard for life".\n\n_+3: _On the basis of +2, the working ghost will also get a _random elite_ effect.\n\n_+4: _On the basis of +3, the working ghost's _maximum health value is equivalent to its previous life (original contracted enemy)_.
actors.hero.talent.enchant_meal.title=Enchant Meal
actors.hero.talent.enchant_meal.desc=_+1: Eating will increase the triggering probability of the enchantment or curse on the dwarf princess's physical weapon, making the next _3 attacks_ have a 1.33 times triggering probability.\n\n_+2: Eating will increase the triggering probability of the enchantment or curse on the dwarf princess's physical weapon, making the next _5 attacks_ have a 1.33 times triggering probability.\n\nTalent type: _Special effects_.\n\nIf the equipped Crown Prince's Ring is enchanted, this talent will also work on unarmed attacks, non-enchanted weapons, or thrown weapons.\n\n"Did I tell you that the fuller you eat, the stronger your arcane energy becomes?"
actors.hero.talent$enchantmeal.name=Enchantmeal
actors.hero.talent$enchantmeal.desc=Your next few physical attacks have an increased chance of triggering the enchantment.\n\nRemaining times: __PH0__
actors.hero.talent.mana_sense.title=Mana Sense
actors.hero.talent.mana_sense.desc=_+1:_The dwarf princess's ability to identify enchanted and engraved weapons and armor is increased to _5 times_ the original speed.\n\n_+2: _The Dwarf Princess can directly identify _enchanted and engraved weapons and armor when they are equipped.\n\nTalent type: _auxiliary_.\n\n"As I often say in class, you are born with the most acute perception of arcane energy."
actors.hero.talent.rune_blade.title=Rune Blade
actors.hero.talent.rune_blade.desc=_+1: _When the dwarf princess attacks with an enchanted physical weapon, it will cause _1 point of magic damage_.\n\n_+2: _When the dwarf princess attacks with an enchanted physical weapon, it will cause _2 points of magic damage_.\n\nTalent type: _Spell Damage_.\n\nIf the equipped Crown Prince's Ring is enchanted, this talent will also work on unarmed attacks, non-enchanted weapons, or thrown weapons.\n\n"The overflowing arcane energy will turn into substantial magic power."
actors.hero.talent.arcane_shield.title=Arcane Shield
actors.hero.talent.arcane_shield.desc=_+1:_When attacked, if the armor equipped by the dwarf princess has an engraving, she will immediately gain _2 shield points_.\n\n_+2:_When attacked, if the armor equipped by the dwarf princess has an engraving, she will immediately gain _3 shield points_.\n\nTalent type: _auxiliary_.\n\nThis talent has a 20-turn cooldown.\n\nIf the equipped Crown Prince's Ring has an engraving, this talent can also take effect on armor that has no armor defense and does not have an engraving.\n\n"The overflow of arcane energy will protect you."
actors.hero.talent$arcaneshieldcooldown.name=Arcane Shield Cooldown
actors.hero.talent$arcaneshieldcooldown.desc=You have just activated this talent, you need to wait a moment before you can activate it again.\n\nRemaining cooldown: __PH0__ turns
actors.hero.talent.royal_meal.title=Royal Meal
actors.hero.talent.royal_meal.desc=_+1:_The dwarf princess only spends 1 turn eating, and the Crown Prince's Ring will be _upgraded by 1 level_ within 10 turns after eating.\n\n_+2:_The dwarf princess only spends 1 turn eating, and the Crown Prince's Ring will be _upgraded by 2 levels_ within 10 turns after eating.\n\nTalent type: _Special effects_.\n\nIf there is no Crown Prince's Ring in the backpack, this talent will increase all rings by 1 level within _5/10 turns_ at _+1/+2_ level.\n\n"Dine for classy people."
actors.hero.talent$royalmeal.name=Royal Meal
actors.hero.talent$royalmeal.desc=The Dwarf Princess strengthens her Crown Prince's Ring after eating, giving it additional levels.\n\nIf there is no Crown Prince's Ring in the backpack, this effect will instead cause all rings to gain additional levels.\n\nNumber of turns remaining: __PH0__ turns
actors.hero.talent.rune_expert.title=Rune Expert
actors.hero.talent.rune_expert.desc=_+1:_The alchemical energy consumption required by the dwarf princess to convert any runestones into enchanted runestones is reduced by 2 points_.\n\n_+2:_The alchemical energy consumption required by the dwarf princess to convert any runestones into enchanted runestones is reduced by 4 points_.\n\nTalent type: _Resource type_.\n\n"The palace enchanter still remembers your teachings, and your transformation of runestones is as simple as breathing."
actors.hero.talent.rune_expert.meta_desc=_If this talent is obtained by another hero_, then it will increase the number of runestones obtained by dissolving the scroll in the alchemical cauldron by +1/+2 at +1/+2 levels.
actors.hero.talent.str_rune.title=Str Rune
actors.hero.talent.str_rune.desc=_+1:_When the dwarf princess uses enchanted runestones, a _common level_ option will be added to the random level.\n\n_+2:_When the dwarf princess uses enchanted runestones, a _rare level_ option will be added to the random level.\n\n_+3:_When the dwarf princess uses enchanted runestones, a _common level_ and a _rare level_ option will be added to the random level.\n\nTalent type: _Resource type_.
actors.hero.talent.more_ring.title=More Ring
actors.hero.talent.more_ring.desc=_+1:_The dwarf princess can equip the _Crown Prince's Ring_ in the artifact slot.\n\n_+2:_The dwarf princess can equip _any ring_ in the artifact slot.\n\nTalent type: _auxiliary_.\n\nIf this talent is transformed after taking effect, the ring that is already equipped in the artifact slot will be automatically removed.\n\n"What a guy who loves jewelry."
actors.hero.talent.more_ring.meta_desc=_If this talent is obtained by other heroes_, then it will be able to equip and unload any ring without consuming turns at +1 level, and at +2 level, any ring can be equipped in the artifact slot.
actors.hero.talent.mana_wreath.title=Mana Wreath
actors.hero.talent.mana_wreath.desc=_+1:_After the dwarf princess kills the enemy with an enchanted physical weapon, she will receive 0~10 points of arcane armor that decays every 5 turns.\n\n_+2:_After the dwarf princess kills the enemy with an enchanted physical weapon, she will receive 0~10 points of arcane armor that decays every 10 turns.\n\nTalent type: _auxiliary_.\n\nIf the equipped Crown Prince's Ring is enchanted, this talent will also work on unarmed attacks, non-enchanted weapons, or thrown weapons.\n\n"Excessive arcane energy can also be turned into arcane armor that resists magic attacks."
actors.hero.talent.magic_arrow.title=Magic Arrow
actors.hero.talent.magic_arrow.desc=_+1:_When the dwarf princess attacks with an enchanted throwing weapon, the damage is increased by 15%_.\n\n_+2:_When the dwarf princess attacks with an enchanted throwing weapon, the damage is increased by 30%_.\n\nTalent type: _physical attack type_.\n\nIf the equipped Crown Prince's Ring is enchanted, this talent will also work on throwing weapons that are not enchanted.\n\nIf a hero holding a special throwing weapon such as a psychic bow obtains this talent, the special throwing weapon with enchantment will also enjoy the bonus of this talent.\n\n"Concentrate the arcane energy on the arrow, and it will have greater power."
actors.hero.talent.ring_bond.title=Ring Bond
actors.hero.talent.ring_bond.desc=_+1: _If the dwarf princess is equipped with other rings of a lower level than the Crown Prince's Ring, she will gain _1 additional level_.\n\n_+2: _If the dwarf princess is equipped with other rings of a lower level than the Crown Prince's Ring, she will gain _2 additional levels_.\n\n_+3: _If the dwarf princess is equipped with other rings of a lower level than the Crown Prince's Ring, she will gain _3 additional levels_.\n\nTalent type: _auxiliary_.\n\nThis talent does not provide additional levels beyond the level of the Crown Prince's Ring.
actors.hero.talent.ring_bond.meta_desc=_If this talent is acquired by another hero_, then it will increase the bonding effect of multiple identical rings by an additional 1/2/3 levels at +1/+2/+3 levels.
actors.hero.talent.darkmark.title=Darkmark
actors.hero.talent.darkmark.desc=_+1: _The Rune Mage will also apply _3 turns of illusion_ while applying the rune mark.\n\n_+2:_The Rune Mage will also apply _3 turns of illusion and vulnerability_ while applying the rune mark.\n\n_+3:_The Rune Mage will also apply _3 turns of illusion, vulnerability, and weakness_ while applying the rune mark.
actors.hero.talent.rune_blast.title=Rune Blast
actors.hero.talent.rune_blast.desc=_+1: _When the rune mark applied by the Rune Mage is detonated, it will restore _mark layer x 0.25 charge points_ to all staffs.\n\n_+2: _On the basis of +1, the rune mark applied by the Rune Mage _can be detonated 2 times_. If a different staff is used for the second detonation, the detonation damage +10_.\n\n_+3: _On the basis of +1 and +2, the detonation range of the rune mark exerted by the Rune Mage is increased to 5x5_.
actors.hero.talent.rune_surge.title=Rune Surge
actors.hero.talent.rune_surge.desc=_+1: _The Rune Mage's enchantment effect increases by _33%_ within _10 turns_ after detonating the rune mark.\n\n_+2:_The Rune Mage's enchantment effect is increased by _67%_ within _15 turns_ after detonating the rune mark.\n\n_+3:_For _20 turns_ after the Rune Mage detonates the rune mark, her enchantment effect is increased by _100%_.\n\nNote that this talent has the same effect as the Arcane Ring. It only increases the original effect of the weapon enchantment but does not increase the detonation effect of the rune mark.
actors.hero.talent.fluent.title=Fluent
actors.hero.talent.fluent.desc=_+1: _The fighting master will no longer fall into a trance if he switches postures multiple times in a short period of time, but he still cannot switch postures within 10 turns.\n\n_+2: _On the basis of +1, the fighting master will gain _5-round speed_ after switching from the balanced posture to the aggressive posture, and will gain _20 shield points_ after switching from the balanced posture to the parrying posture.\n\n_+3: _On the basis of +1 and +2, the Fighting Master will receive _4 turns of staff charge_ after switching from the aggressive posture to the balanced posture, and will receive _4 turns of artifact charge_ after switching from the parrying posture to the balanced posture.
actors.hero.talent.stance_mastery.title=Stance Mastery
actors.hero.talent.stance_mastery.desc=_+1:_When the fighting master is in a balanced posture, the effects of various improved abilities are increased by 5%_.\n\n_+2: On the basis of +1, the melee damage bonus when the fighting master is in the aggressive posture and the armor defense bonus when in the parrying posture are both increased to 30%_.\n\n_+3: _On the basis of +1 and +2, the fighting master will also _increase attack speed and movement speed_ when in the balanced posture, the combo probability when in the aggressive posture will be _increased to 50%_, and the concentration interval when in the parrying posture will be reduced to 20 rounds_, and the corresponding negative effects of the latter two postures will be reduced to 15%_.
actors.hero.talent.inelement.title=Inelement
actors.hero.talent.inelement.desc=_+1:_After the fighting master is in any posture for more than _20 turns_, her engraving effect is increased by _33%_.\n\n_+2:_After the fighting master is in any posture for more than _15 rounds_, her engraving effect is increased by _67%_.\n\n_+3:_After the fighting master is in any posture for more than _10 rounds_, her marking effect is increased by _100%_.\n\nNote that this talent has the same effect as Arcane Ring. It will only increase the original effect of Armor Mark and will not increase the additional effect of Fighting Master.
actors.hero.talent.speedup.title=Speedup
actors.hero.talent.speedup.desc=_+1:_The dwarf princess's movement speed bonus and maximum bonus limit are increased by an additional 12.5%_.\n\n_+2: _The dwarf princess's movement speed bonus and bonus limit are increased by an additional 25%_.\n\n_+3: _The dwarf princess' movement speed bonus and bonus limit are increased by an additional 37.5%_.\n\n_+4:_The dwarf princess's movement speed bonus and bonus limit are increased by an additional 50%_.
actors.hero.talent.run_attack.title=Run Attack
actors.hero.talent.run_attack.desc=_+1:_The dwarf princess's physical attack in this state has a _7.5% probability_ without consuming a turn.\n\n_+2:_The dwarf princess's physical attack in this state has a _15% probability_of not consuming a turn.\n\n_+3:_The dwarf princess's physical attack in this state has a _22.5% probability_ without consuming a turn.\n\n_+4:_The dwarf princess's physical attack in this state has a _30% probability_of not consuming a turn.
actors.hero.talent.delay_tactic.title=Delay Tactic
actors.hero.talent.delay_tactic.desc=_+1: _The dwarf princess needs to _receive damage 2 times_ before this effect will be interrupted. If the damage received comes from the attacker, the attacker will be given _2 turns of slowness_.\n\n_+2: _The dwarf princess needs to _receive damage 2 times_ before this effect will be interrupted. If the damage received comes from the attacker, the attacker will be given _4 turns of slowness_.\n\n_+3: _The dwarf princess needs to _receive damage 3 times_ before this effect will be interrupted. If the damage received comes from the attacker, the attacker will be given _6 turns of slowness_.\n\n_+4: _The dwarf princess needs to _receive damage 3 times_ before this effect will be interrupted. If the damage received comes from the attacker, the attacker will be given _8 turns of slowness_.
actors.hero.talent.element_curse.title=Element Curse
actors.hero.talent.element_curse.desc=_+1: _Forbidden spells also inflict _burning for 4 turns or frostbite for 8 turns_.\n\n_+2: _In addition to +1, _5 turns of entanglement_ will also be applied.\n\n_+3: _Forbidden spells also inflict _8 turns of burning or 16 turns of frostbite_.\n\n_+4: _In addition to +3, _10 turns of entanglement_ will also be applied.
actors.hero.talent.afflicted_illness.title=Afflicted Illness
actors.hero.talent.afflicted_illness.desc=_+1: _Forbidden spells also inflict _4 turns of poison and a raw value of 4 bleed_.\n\n_+2: _In addition to +1, _5 turns of disability_ will also be applied.\n\n_+3: _Forbidden spells also inflict _8 turns of poison and a raw value of 8 bleed_.\n\n_+4: _In addition to +3, _10 turns of disability_ will also be applied.
actors.hero.talent.spread_pain.title=Spread Pain
actors.hero.talent.spread_pain.desc=_+1:_When the dwarf princess releases a forbidden spell with 100% armor charge, the spell's area of ​​influence is expanded to a _3x3 range_ centered on the selected target.\n\n_+2:_When the dwarf princess releases a forbidden spell with 100% armor charge, the spell's area of ​​influence is expanded to a _5x5 range_ centered on the selected target.\n\n_+3:_When the Dwarf Princess releases a forbidden spell with 100% armor charge, the spell's area of ​​influence is expanded to a _7x7 range_ centered on the selected target.\n\n_+4:_When the Dwarf Princess releases a forbidden spell with 100% armor charge, the spell's area of ​​influence is expanded to a _9x9 range_ centered on the selected target.\n\nHeroes or allies are not affected while in this range.
actors.hero.talent.king_gaze.title=King Gaze
actors.hero.talent.king_gaze.desc=_+1:_While wielding the King's Blade, the dwarf princess will gain _2 turns of psychic vision_ and enemies within sight will immediately gain _4 turns of disarm_.\n\n_+2:_While wielding the King's Blade, the dwarf princess will gain _4 turns of psychic vision_ and enemies within sight will immediately gain _4 turns of disarm_.\n\n_+3:_While wielding the King's Blade, the dwarf princess will gain _6 turns of psychic vision_ and enemies within sight will immediately gain _4 turns of disarm_.\n\n_+4:_While wielding the King's Blade, the dwarf princess will gain _8 turns of psychic vision_ and enemies within sight will immediately gain _4 turns of disarm_.
actors.hero.talent.king_power.title=King Power
actors.hero.talent.king_power.desc=_+1:_The damage bonus received by the dwarf princess from this attack is increased to _62.5%_.\n\n_+2:_The damage bonus received by the dwarf princess from this attack is increased to _75%_.\n\n_+3:_The damage bonus received by the dwarf princess from this attack is increased to _87.5%_.\n\n_+4:_The damage bonus received by the dwarf princess from this attack is increased to _100%_.
actors.hero.talent.king_might.title=King Might
actors.hero.talent.king_might.desc=_+1: _If the dwarf princess kills the enemy with this blow, _5% of the armor charge_ will be returned.\n\n_+2: _If the dwarf princess kills the enemy with this blow, _10% of the armor charge_ will be returned.\n\n_+3: _If the dwarf princess kills the enemy with this blow, _15% of the armor charge_ will be returned.\n\n_+4: _If the dwarf princess kills the enemy with this blow, _20% of the armor charge_ will be returned.

levels.minigame.extraction.overburden.name=raid overburden
levels.minigame.extraction.overburden.desc=Loot weight is suppressing speed supplied by equipment. Each occupied inventory slot retains two-thirds of the remaining equipment speed bonus; bags and the waterskin do not count.\n\nOccupied slots: %d\nEquipment speed bonus retained: %d%%
levels.minigame.extraction.extractionraidrun.session_name=extraction contract
levels.minigame.extraction.extractionraidrun.session_desc=This contract records the current extraction run. Use its action to abandon the raid; doing so applies the same half-hardcore loss as dying.
levels.minigame.extraction.extractionraidrun.missing_key=The extraction mechanism does not respond. You still need a crystal key.
levels.minigame.extraction.extractionraidrun.extract_title=Extraction point
levels.minigame.extraction.extractionraidrun.extract_body=The mechanism recognizes %d crystal key(s). Extract now and secure this run's loot?
levels.minigame.extraction.extractionraidrun.extract=Extract
levels.minigame.extraction.extractionraidrun.continue_raid=Keep searching
levels.minigame.extraction.extractionraidrun.success=Extraction successful. All raid loot is now secured.
levels.minigame.extraction.extractionraidrun.success_bonus=Extraction successful. The spare crystal key was exchanged for %d gold.
levels.minigame.extraction.extractionraidrun.failure=Extraction failed: %1$d stack(s) of raid loot and %2$d ordinary consumable(s) were lost.
levels.minigame.extraction.extractionraidrun.abandon_action=Abandon extraction raid
levels.minigame.extraction.extractionraidrun.abandon_title=Abandon raid?
levels.minigame.extraction.extractionraidrun.abandon_body=Leaving without using the extraction point forfeits every tagged item from this run and randomly consumes 1-2 ordinary supplies.
levels.minigame.extraction.extractionraidrun.abandon=Accept the loss
actors.mobs.npcs.dungeondoctor.name=dungeon doctor
actors.mobs.npcs.dungeondoctor.desc=A learned old scholar who studies knowledge gathered from across the dungeon. He invites adventurers to test what they know.

actors.mobs.tmobs.mechanicalfist.name=mechanical fist
actors.mobs.tmobs.mechanicalfist.desc=This towering dwarven automaton has long since slipped its makers' control. Its massive shell turns aside most blows, while each heavy punch scatters anything in its path.
actors.mobs.tmobs.mechanicalfist.discover_hint=Search the negative floors of the tower.

actors.mobs.tmobs.mimiccrocodile.name=mimic crocodile
actors.mobs.tmobs.mimiccrocodile.desc=This upright crocodilian hunter stalks the tower beneath a nearly transparent veil. It reveals itself only for a brutal bite, leaving maimed and bleeding prey behind.
actors.mobs.tmobs.mimiccrocodile.discover_hint=Search the negative floors of the tower.

actors.mobs.tmobs.obscura.name=the obscura
actors.mobs.tmobs.obscura.desc=A cold and hazy radiance coils around this serpentine horror. Once it notices prey, the light gathers into a wild dread that refuses to remain dead.
actors.mobs.tmobs.obscura.discover_hint=Search the negative floors of the tower.

actors.mobs.tmobs.wilddread.name=wild dread
actors.mobs.tmobs.wilddread.desc=A phantom shaped from an obscura's dim light. Its uneven blows are difficult to read, and each defeat seems only temporary while its source endures.

actors.mobs.tmobs.alienatedprismaticguard.name=alienated prismatic guard
actors.mobs.tmobs.alienatedprismaticguard.desc=An unknown power has twisted this prismatic guard beyond recognition. It reflects a warrior's whole battle guise, then sheds crooked copies from the stolen image.

actors.mobs.tmobs.twistedmirror.name=twisted mirror
actors.mobs.tmobs.twistedmirror.desc=A crooked reflection split from an alienated prismatic guard. It carries the weapon of the image it stole, and even allies may mistake it for the original.

actors.mobs.tmobs.soulcollector.name=soul collector
actors.mobs.tmobs.soulcollector.desc=This frail necromancer flees instead of fighting. Yet nothing that dies beneath its gaze rests quietly, and the abandoned souls soon return with terrible weight.
actors.mobs.tmobs.soulcollector.discover_hint=Search the negative floors of the tower.

actors.mobs.tmobs.powerfulwraith.name=powerful wraith
actors.mobs.tmobs.powerfulwraith.desc=A soul returned in a denser and more violent form. It moves with unnatural haste, and even fresh wounds slowly close around its spectral body.

actors.mobs.tmobs.heavycrabification.name=heavy crabification
actors.mobs.tmobs.heavycrabification.desc=An apex predator from the tower's depths. Its enormous claws shelter it from a chosen foe, but leave its flanks exposed; in peace, each molt restores its battered shell.
actors.mobs.tmobs.heavycrabification.def_verb=blocked
actors.mobs.tmobs.heavycrabification.molt=molted
actors.mobs.tmobs.heavycrabification.discover_hint=Search the negative floors of the tower.

actors.mobs.tmobs.marshslime.name=marsh slime
actors.mobs.tmobs.marshslime.desc=A vast creature shaped by ages in hostile wetlands. The first wound teaches its mutable body how never to suffer the same kind of harm again.
actors.mobs.tmobs.marshslime.not_adapted=It has not adapted to a damage type yet.
actors.mobs.tmobs.marshslime.immune_to=It is currently immune to %s.
actors.mobs.tmobs.marshslime.physical_damage=physical damage
actors.mobs.tmobs.marshslime.magical_damage=magical damage
actors.mobs.tmobs.marshslime.immune=immune
actors.mobs.tmobs.marshslime.discover_hint=Search the negative floors of the tower.
actors.mobs.tmobs.runespinner.name=rune spinner
actors.mobs.tmobs.runespinner.desc=This warped experiment spins fragile webs heavy with sinister magic. Its venomous bite stirs cursed glyphs, and sometimes leaves a new curse scratched into armor.
