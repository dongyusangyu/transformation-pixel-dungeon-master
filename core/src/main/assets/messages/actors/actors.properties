actors.mobs.hermitcrab.name=hermit crab
actors.mobs.hermitcrab.def_verb=blocked
actors.mobs.hermitcrab.desc=For some reason, this sewer crab decided to wear a broken barrel on its head! The extra weight slows it to normal speed, but also gives it more defense. You think you hear something rattling inside the barrel...
actors.mobs.mimic.discover_hint=You can find this enemy in any dungeon region.
