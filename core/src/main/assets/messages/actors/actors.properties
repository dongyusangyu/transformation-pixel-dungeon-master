actors.char.invulnerable=invulnerable
actors.char.immune=immune
actors.buffs.ascensionchallenge.weaken_info_no_kills=If you defeat enemies, the amulet's curse will weaken!
actors.buffs.gravitychaostracker.name=gravity chaos
actors.buffs.gravitychaostracker.desc_intro=Every few turns, all units on the current floor are hurled in a random direction.
actors.buffs.gravitychaostracker.desc_positive=You and your allies seem to be immune to this, however.
actors.buffs.gravitychaostracker.desc_duration=There is no telling how long gravity chaos will last, but it will not continue forever.
actors.buffs.hunger.dmhungry=low power
actors.buffs.hunger.dmstarving=power depleted
actors.buffs.hunger.ondmhungry=Current power is low.
actors.buffs.hunger.ondmstarving=Current power is depleted!
actors.buffs.hunger.desc_intro_dmhungry=Your current power is low, though fortunately the remaining power can still keep your frame running normally for a while.
actors.buffs.hunger.desc_intro_dmstarving=Your current power is critically low, and has begun to threaten normal frame operation.
actors.buffs.hunger.dmdesc=\n\nExploring the dungeon continuously drains your power. The more time you spend, the lower your power becomes. Once your power begins to run out, normal frame operation is threatened, health regeneration stops, and health slowly decreases.\n\nCharging is difficult in the dungeon, but your internal miniature thermochemical conversion system can efficiently turn food into electrical power. Of course, food is limited too, so learning to use it wisely is important!
actors.buffs.lifelink.ondeath=You died from shared damage through life link...
actors.buffs.wellfed.dmname=power saturated
actors.buffs.wellfed.dmdesc=Your current power is saturated.\n\nWhile power is saturated, it will not decrease for a long period of time, and you will recover extra health as time passes.\n\nTurns remaining: %d
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=You can discover this unit through a certain hero armor ability.
actors.hero.abilities.rogue.shadowclone$shadowally.directed_wander=Your image is patrolling the area.
