actors.hero.spells.ascension_curse.name=Ascension Curse
actors.hero.spells.ascension_curse.short_desc=Causes the caster to levitate.
actors.hero.spells.ascension_curse.desc=The caster recites an incantation, making themself lighter for a short time and allowing them to levitate for _%1$d turns_.\n\nThis spell _takes 1 turn_ to cast.
actors.hero.spells.divine_protection.name=Divine Protection
actors.hero.spells.divine_protection.short_desc=Makes the caster invulnerable briefly.
actors.hero.spells.divine_protection.desc=The caster seeks divine protection through the tome's power. If answered, they become invulnerable for _%1$d turns_.\n\nThis spell _takes 1 turn_ to cast.
actors.hero.spells.shepherd_intention.name=Shepherd's Intent
actors.hero.spells.shepherd_intention.short_desc=Creates a flock of magical sheep at a chosen location.
actors.hero.spells.shepherd_intention.desc=The caster uses the tome to condense magic flowing within them, then summons... a flock of magical sheep? Well, at least they cannot be killed.\n\nThis spell _takes 1 turn_ to cast.
actors.hero.spells.conversion_holy.name=Holy Conversion
actors.hero.spells.conversion_holy.short_desc=Can convert a target into a fallen follower.
actors.hero.spells.conversion_holy.no_target=There is no target that can be converted.
actors.hero.spells.conversion_holy.desc=The caster displays the divine power of the tome, converting the target to the Holy Church and making them a loyal servant.\n\nEnemies converted by this spell do not drop items.\n\nThis spell _takes 1 turn_ to cast.
actors.hero.spells.purifying_evil.name=Purify Evil
actors.hero.spells.purifying_evil.short_desc=Can purify a target.
actors.hero.spells.purifying_evil.no_target=There is no target that can be purified.
actors.hero.spells.purifying_evil.desc=The caster uses the great holy power within the tome to purify an enemy, removing its buffs, even stripping elite effects and damaging undead and demonic enemies.\n\nThis spell _takes 1 turn_ to cast.
actors.hero.spells.divine_storm.name=Divine Field Storm
actors.hero.spells.divine_storm.short_desc=Creates a powerful divine field to judge enemies.
actors.hero.spells.divine_storm.desc=With the tome as a focus, the caster creates a powerful divine field that paralyzes and may even burn enemies.\n\nThis spell _takes 1 turn_ to cast.
actors.hero.spells.genesis.name=Genesis
actors.hero.spells.genesis.short_desc=Resets the caster's talent abilities.
actors.hero.spells.genesis.desc=The caster reshapes themself, as God once shaped the world.\n\nThis spell _takes 1 turn_ to cast.
actors.hero.spells.indulgence.name=Indulgence
actors.hero.spells.indulgence.short_desc=Spends gold to restore tome charge.
actors.hero.spells.indulgence.desc=The caster spends _%1$d gold_, washing away their sins and restoring tome charge.\n\nThis spell _takes 1 turn_ to cast.\n\nThis spell has no effect on holy tome rubbings.
actors.hero.spells.indulgence.no_tome=Without a holy tome, your repentance is meaningless.
actors.hero.spells.silver_language.name=Silver-Tongued Radiance
actors.hero.spells.silver_language.short_desc=Causes a target to go amok briefly.
actors.hero.spells.silver_language.no_target=No target will go amok from this.
actors.hero.spells.silver_language.desc=The caster loudly recites several passages from the tome at the target, breaking its composure on the spot and making it amok for _%1$d turns_.\n\nThis spell _takes 1 turn_ to cast.
actors.hero.spells.resurrection.name=Resurrection
actors.hero.spells.resurrection.short_desc=A target that dies shortly afterward will revive.
actors.hero.spells.resurrection.no_target=This spell cannot be applied to that target.
actors.hero.spells.resurrection.desc=With the tome's great power, the caster can apply a powerful resurrection spell to themself or an ally. If the target dies shortly afterward, they revive.\n\nThis spell _takes 1 turn_ to cast.
actors.hero.spells.resurrection$resurrection.name=life after death
actors.hero.spells.resurrection$resurrection.desc=This character will revive after death!\n\nAllies affected by this effect will revive in their best condition if they die while it lasts.\n\nIf the affected character is the hero, the hero will also revive if they die while it lasts, but will keep at most 1 health.\n\nTurns remaining: %s
actors.hero.spells.traitorous_spell.name=Tzeentchian Spell
actors.hero.spells.traitorous_spell.short_desc=Releases a cursed wand effect.
actors.hero.spells.traitorous_spell.desc=The caster uses a spell of Tzeentch's chosen to inflict a random curse effect on the target.\n\nThis spell _takes 1 turn_ to cast.
actors.hero.spells.sprint_spell.name=Divine Stride
actors.hero.spells.sprint_spell.short_desc=Grants haste to the caster.
actors.hero.spells.sprint_spell.desc=The caster releases a spell to gain the legendary speed of Dai Zong, who could travel a thousand li in a day. This grants _%1$d turns of haste_.\n\nThis spell _takes 1 turn_ to cast.
actors.hero.spells.focus_light.name=Focused Ray
actors.hero.spells.focus_light.short_desc=Fires a high-temperature ray, burning everything.
actors.hero.spells.focus_light.desc=The caster fires a high-temperature ray that deals _%1$d-%2$d damage_ and ignites the path and target.\n\nThis spell _takes 1 turn_ to cast.
actors.hero.spells.zhuanyu_spell.name=Shield-to-Heal
actors.hero.spells.zhuanyu_spell.short_desc=Converts shielding into healing.
actors.hero.spells.zhuanyu_spell.desc=Converts the caster's shielding into healing at _%d%%_ efficiency. The total healing cannot exceed half of max health.\n\nThis spell _takes 1 turn_ to cast.
actors.hero.spells.thorn_whip.name=Thorn Whip
actors.hero.spells.thorn_whip.short_desc=Pulls a target closer and inflicts bleeding.
actors.hero.spells.thorn_whip.no_target=There is no target that can be pulled, or that target cannot be pulled.
actors.hero.spells.thorn_whip.more_distance=The target is too far away to reach.
actors.hero.spells.thorn_whip.desc=A barbed golden whip appears in the caster's hand. It can pull a target closer and inflict bleeding with a _base value of %1$d_.\n\nThis spell has a range limit of _12 tiles_.\n\nThis spell _takes 1 turn_ to cast.
actors.hero.spells.revelation.name=Revelation
actors.hero.spells.revelation.short_desc=Raises the level of existing positive talents.
actors.hero.spells.revelation.desc=The caster receives inspiration from the heavens, gaining _%1$d turns of revelation_, which increases the effect level of existing _positive talents by +1_.\n\nTalent effect levels cannot exceed their limit.\n\nThis spell _takes no time_ to cast.
actors.hero.spells.revelation$revelationbuff.name=revelation
actors.hero.spells.revelation$revelationbuff.desc=You feel inspired by the heavens. All existing positive talent effect levels are increased by +1.\n\nTurns remaining: %s
actors.hero.spells.holy_grenade.name=Holy Grenade
actors.hero.spells.holy_grenade.short_desc=Creates an explosion to damage enemies.
actors.hero.spells.holy_grenade.desc=The caster throws a mass of light energy, instantly dealing _%2$d-%3$d damage_ in a _%1$dx%1$d_ area at the landing point. Undead and demon targets always take maximum damage.\n\nThis spell _takes 1 turn_ to cast.
actors.hero.spells.blade_star.name=Blade Stair
actors.hero.spells.blade_star.short_desc=Creates a blade zone that damages and cripples enemies.
actors.hero.spells.blade_star.desc=The caster materializes holy light into blades, forming a _%1$dx%1$d_ blade zone. Enemies in this area continuously take _4-8 damage_ and are _crippled for 3 turns_. The zone lasts _10 turns_.\n\nThis spell _takes 1 turn_ to cast.
actors.hero.spells.blade_star.invalid_target=A blade zone cannot be created there.
actors.hero.spells.blade_star$blade_stair.name=blade zone
actors.hero.spells.blade_star$blade_stair.desc=This place has become a blade zone. Blade zones continuously damage and slow enemies.
actors.hero.spells.sacred_blade.name=Golden Spin
actors.hero.spells.sacred_blade.short_desc=Throws a boomerang condensed from holy light, dealing magical damage to the target.
actors.hero.spells.sacred_blade.desc=The caster throws a boomerang condensed from holy light, dealing _magical damage based on the weapon in hand_ to the target. Undead and demon targets take extra damage.\n\nThis spell _takes 1 turn_ to cast.
actors.hero.spells.equipment_bless.name=Equipment Blessing
actors.hero.spells.equipment_bless.short_desc=Empowers all weapons and armor.
actors.hero.spells.equipment_bless.desc=The caster can bless all weapons and armor, temporarily raising their levels.\n\nThis spell _takes 1 turn_ to cast.
actors.hero.spells.equipment_bless$blessbuff.name=equipment blessing
actors.hero.spells.equipment_bless$blessbuff.desc=You feel that your equipment has been blessed.\n\nWhile this effect lasts, all weapons and armor gain temporary levels.\n\nTurns remaining: %s
actors.hero.spells.hotlight.name=Searing Light
actors.hero.spells.hotlight.short_desc=Releases bright light, blinding enemies.
actors.hero.spells.hotlight.desc=The caster instantly releases searing bright light, _blinding all visible enemies for 3 turns_ and igniting undead and demon targets.\n\nThis spell _takes 1 turn_ to cast.
actors.hero.heroclass.freeman=gentleman
actors.hero.heroclass.freeman_desc_short=The gentleman _has more potential to awaken_, and starts with a unique _briefcase_.
actors.hero.heroclass.freeman_desc=The gentleman starts with a _unique briefcase_ containing useful goods.\n\nThe gentleman has no specialized combat training and only limited combat ability, but he _has limitless potential to awaken_.\n\nThe gentleman also starts with _a walking stick_, _a lucky silver coin_, cloth armor, a waterskin, and a velvet pouch.\n\nThe gentleman starts knowing these items:\n_-_Potion of Experience\n_-_Scrolls of Metamorphosis, Identify, and Transmutation
actors.hero.heroclass.freeman_unlock=_Metamorphose a talent with a scroll of metamorphosis_ to unlock the gentleman.
actors.hero.herosubclass.freeman=gentleman
actors.hero.herosubclass.freeman_short_desc=The _gentleman_ cannot gain more power from Tengu's mask, but he still has more potential waiting to be awakened.
actors.hero.herosubclass.freeman_desc=After putting on Tengu's mask, the gentleman fails to gain much power from it, but when the mask crumbles he gains an extra scroll of metamorphosis.\n\nIn addition, the gentleman still has more potential waiting to be awakened.
actors.blobs.pheromone.desc=A pheromone gas is lingering here, confusing the hero and empowering the Slaanesh disciple's allies.
actors.mobs.chaosdisciples$succboss.name=Slaanesh disciple
actors.mobs.chaosdisciples$succboss.desc=The Slaanesh disciple was once a succubus, and a friend of the imp. To help the imp realize its ambitions and seek greater power, it became a disciple of the Chaos God Slaanesh.\n\nThe Slaanesh disciple can summon large numbers of succubi to fight for it, though fortunately this ability can only be used every so often. It can also release pheromone gas, removing fallen or hired-for-life effects from enemy units and granting them healing and adrenaline, while also charming the hero and their allies.
actors.mobs.chaosdisciples$summoncooldown.name=succubus summoning cooldown
actors.mobs.chaosdisciples$summoncooldown.desc=The Slaanesh disciple has just summoned succubi, and must wait before using that ability again.\n\nCooldown remaining: %s turns
actors.mobs.chaosdisciples$scorpioboss.name=Nurgle disciple
actors.mobs.chaosdisciples$scorpioboss.desc=The Nurgle disciple was once a scorpio, and a friend of the imp. To help the imp realize its ambitions and seek greater power, it became a disciple of the Chaos God Nurgle.\n\nThe Nurgle disciple excels at spreading plague, releasing deadly viral gas around itself. It also has powerful defenses, making it difficult to harm with either physical or magical attacks, and can reflect ranged physical damage. However, it _seems more vulnerable to a certain elemental damage_.
actors.mobs.chaosdisciples$scorpioboss.fire=Fire! Fire! Too hot!
actors.mobs.chaosdisciples$eyeboss.name=Tzeentch disciple
actors.mobs.chaosdisciples$eyeboss.desc=The Tzeentch disciple was once an evil eye, and a friend of the imp. To help the imp realize its ambitions and seek greater power, it became a disciple of the Chaos God Tzeentch.\n\nThe Tzeentch disciple is cunning, and can fire deadly lasers like the Old God every so often. It can also release terrifying dark magic to disturb the hero's mind, and teleports randomly after being attacked.
actors.mobs.chaosdisciples$ripperboss.name=Khorne disciple
actors.mobs.chaosdisciples$ripperboss.desc=The Khorne disciple was once a ripper, and a friend of the imp. To help the imp realize its ambitions and seek greater power, it became a disciple of the Chaos God Khorne.\n\nThe Khorne disciple is belligerent and skilled in melee attacks. It gains buffs and combo effects in melee and when struck, further strengthening its frightening mobility and attack frequency. As many as 56 heroes have died by its hand.
actors.mobs.chaosdisciples$ripperboss.combo=The Khorne disciple's current combo is %d
actors.mobs.chaosdisciples$ripperboss.combotime=, combo time remaining: %s.
actors.mobs.npcs.greatimp.name=imp?
actors.mobs.npcs.greatimp.newyear=Happy New Year! Why am I here? That doesn't matter. Go get the amulet!
actors.mobs.npcs.greatimp.hello=Surprise! Why am I here? That doesn't matter. Go get the amulet!
actors.mobs.npcs.greatimp.amulet=Got the amulet? Then hurry home and reunite with your family for the Lunar New Year!
actors.mobs.npcs.greatimp.warning=Looks like you found me out after all. I came here to seize the remaining power of the Old God Yog-Dzewa so I can command all demon legions. Then I will rule this dungeon, and after that begin conquering the entire world! Will you stop me here with futile resistance, or obediently leave and enjoy the rest of your life?
actors.mobs.npcs.greatimp.yes=Stop him!
actors.mobs.npcs.greatimp.no=None of my business
actors.mobs.npcs.greatimp.time=Brothers, get in there and buy me time!
actors.mobs.npcs.greatimp.desc=For some reason, the imp has come to this place.
actors.mobs.npcs.greatimp.die=Thank you for buying me time. Now, I am invincible!
actors.mobs.npcs.greatimp.nothing=......
actors.mobs.greatdemon.name=great demon
actors.mobs.greatdemon.desc=The imp has just absorbed the Old God's power, growing longer horns, a beard, and wings... it can no longer be called an imp. It should be called a great demon.\n\nThe great demon has a powerful body, and can periodically resist and reflect certain attacks. Because it lacks knowledge of battle magic, it struggles to cast many kinds of spells, but its melee ability is quite fierce, and it can summon lesser demons to assist in battle.
actors.mobs.greatdemon.die=How can this power be so fragile? This isn't over!
actors.mobs.greatdemon.throw=Try my Spear of Longinus!
actors.mobs.greatdemon.melee=Take my demon slash!
actors.mobs.greatdemon.summon=Answer my call, demons!
actors.mobs.greatdemon.defence=Hardened skin! Neither blade nor spear can wound me!
actors.mobs.greatdemon.haste=The great demon beats its demonic wings rapidly, flying at extreme speed.
actors.mobs.greatdemon.magic=Magical protection, activate!
actors.mobs.greatdemon.missiles=Magic barrier, reflect every arrow and bolt for me!
actors.mobs.greatdemon$summoncooldown.name=demon summoning cooldown
actors.mobs.greatdemon$summoncooldown.desc=The great demon has just summoned 2 lesser demons, and must wait before using that ability again.\n\nCooldown remaining: %s turns
actors.mobs.greatdemon$hastecooldown.name=demonic wing acceleration cooldown
actors.mobs.greatdemon$hastecooldown.desc=The great demon just beat its demonic wings fiercely to accelerate, and now needs to ease them.\n\nCooldown remaining: %s turns
actors.mobs.greatdemon$magiccooldown.name=magic defense cooldown
actors.mobs.greatdemon$magiccooldown.desc=Magic defense can only last for a time, and must wait before activating again.\n\nCooldown remaining: %s turns
actors.mobs.greatdemon$meleescooldown.name=thornskin cooldown
actors.mobs.greatdemon$meleescooldown.desc=Thornskin can only last for a time, and must wait before activating again.\n\nCooldown remaining: %s turns
actors.mobs.greatdemon$missilescooldown.name=far-arrow reflection cooldown
actors.mobs.greatdemon$missilescooldown.desc=Far-arrow reflection can only last for a time, and must wait before activating again.\n\nCooldown remaining: %s turns
actors.mobs.greatdemon$throwcooldown.name=Spear of Longinus cooldown
actors.mobs.greatdemon$throwcooldown.desc=The Spear of Longinus was just thrown by the great demon, and must wait before being used again.\n\nCooldown remaining: %s turns
actors.mobs.greatdemon$meleesdefence.name=thornskin
actors.mobs.greatdemon$meleesdefence.desc=Greatly reduces melee damage taken for a time, and reflects part of the damage back to the attacker.\n\nTurns remaining: %s
actors.mobs.greatdemon$missilesdefence.name=far-arrow reflection
actors.mobs.greatdemon$missilesdefence.desc=Completely ignores ranged physical damage for a time, and counters the attacker with magic.\n\nTurns remaining: %s
actors.mobs.landpiranha.name=giant land piranha
actors.mobs.landpiranha.desc=Due to strange magical power, this giant piranha has grown legs and can breathe air. Perhaps weakening a certain talent's power could restore it to normal.
actors.mobs.landpiranha.discover_hint=You can find this enemy in any dungeon region after having a certain negative talent.
actors.mobs.phantomlandpiranha.name=phantom land piranha
actors.mobs.phantomlandpiranha.desc=The phantom land piranha is a rare variant of a phantom piranha twisted by strange magic, with an eerie translucent body and magical abilities. It can teleport when attacked, using that ability both to advance and retreat!\n\nThough difficult to deal with, its meat is highly prized for its magic.
actors.mobs.phantomlandpiranha.discover_hint=You can find this enemy in any dungeon region after having a certain negative talent.
actors.mobs.teststatue.name=test statue
actors.mobs.teststatue.desc=Who knows who put this statue here. It looks extremely punchable, and you can hardly resist hitting it.
actors.mobs.goldboss$monkmaster.name=grandmaster monk
actors.mobs.goldboss$monkmaster.desc=The grandmaster monk is a dwarf who has reached the peak of martial arts. No one has ever seen the upper limit of his abilities.\n\nNo matter how fast his opponent is, the grandmaster monk is always faster. He despises underhanded tricks, so it is best not to anger him.
actors.mobs.goldboss$monkmaster.missileweapon=So that's how it is, playing dirty? Fine then!
actors.mobs.goldboss$goldelemental.name=golden elemental
actors.mobs.goldboss$goldelemental.desc=The golden elemental is an elemental creature summoned by the shopkeeper using elemental spirit arts left behind by the Dwarf King.\n\nThe golden elemental can use elemental spirit arts itself to summon other elementals, and can draw on the hero's wealth for its own use, even creating wealth from nothing.
actors.mobs.goldboss$goldelemental.steal=The golden elemental drew 300 gold from you.
actors.mobs.goldboss$goldelemental.give=The golden elemental created 400 gold in your backpack from nothing.
actors.mobs.goldboss$goldgolem.name=golden golem
actors.mobs.goldboss$goldgolem.desc=The golden golem is a golem modified by the shopkeeper, made entirely of gold and far more imposing than an ordinary golem.\n\nCompared to an ordinary golem, the golden golem has lost teleportation, but has stronger attack and defense, can instantly release a high-voltage electric field to paralyze creatures, and can even crush magical creatures instantly.
actors.mobs.goldboss$goldgolem.electricity=Energy overflow. Release.
actors.mobs.goldboss$electricitycooldown.name=electric field release cooldown
actors.mobs.goldboss$electricitycooldown.desc=The golden golem has just released an electric field, and must wait before releasing one again.\n\nCooldown remaining: %s turns
actors.mobs.goldboss$thymor.name=Archmage Thymor
actors.mobs.goldboss$thymor.desc=Thymor is an outstanding dwarven warlock. He once cooperated with the grandmaster monk in an attempt to overthrow the Dwarf King, but after witnessing the horror of Yog-Dzewa's demon legions, he ultimately submitted to the Dwarf King and fought demons on the front lines. Now, after the Dwarf King's death, he has partnered with the shopkeeper, trying to seize your Amulet of Yendor to restore the long-decayed dwarven metropolis.\n\nThymor excels at dark magic and large-scale forbidden curses. Some once witnessed him annihilate a vast demon army in an instant.
actors.mobs.goldboss$thymor.curse=Wubba lubba, dub-dub.
actors.mobs.goldboss$thymor.cursedo=Jibber jabber, release!
actors.mobs.goldboss$thymor.bolt_kill=You were killed by Thymor's powerful dark magic...
actors.mobs.goldboss$sheepcursecooldown.name=wide-area death spell cooldown
actors.mobs.goldboss$sheepcursecooldown.desc=The death spell can instantly kill hostile creatures, but the hero is immune to this effect.\n\nCooldown remaining: %s turns
actors.buffs.mostdegrade.name=overwhelming degradation curse
actors.buffs.mostdegrade.desc=Powerful dark magic is devouring the magic that scrolls of upgrade have infused into your equipment!\n\nWhile degraded, equipment is treated as lower level than it truly is. _No matter its original level, the equipment is reduced to level 0_. Item descriptions will change to reflect the effects of degradation.\n\nHowever, degradation does not affect strength requirements, wand charges, thrown weapon durability, or artifacts.\n\nTurns of degradation remaining: %s\n\nDegradation inflicted by Thymor is not only stronger, but also cannot be removed with a scroll of remove curse.
actors.mobs.npcs.shopboss.name=shopkeeper?
actors.mobs.npcs.shopboss.hello=Treasure, gold, heheh... worth the trip.
actors.mobs.npcs.shopboss.warning=What? You want to steal my treasure too? Don't think that so-called amulet makes you special. If you know what's good for you, get lost now. That amulet will be mine sooner or later anyway.
actors.mobs.npcs.shopboss.yes=Money is best shared, of course
actors.mobs.npcs.shopboss.no=None of my business
actors.mobs.npcs.shopboss.desc=It seems the shopkeeper followed you here too. He is constantly looking around, as though searching for something.
actors.mobs.greatshoper.name=shopkeeper
actors.mobs.greatshoper.desc=The shopkeeper you have not seen for some time is now almost unrecognizable. His expression and bearing show greed and delight, mixed with hostility toward you.\n\nThe shopkeeper used secret arts from the dwarven library to transform himself into a state resistant to all magic, uses lavish spending as his means of attack, and has recruited the remaining dwarven powers into his interest group.
actors.mobs.greatshoper$goldcurse.name=golden curse
actors.mobs.greatshoper$goldcurse.desc=The golden curse is one of the forbidden arts left by the dwarves, a powerful curse that can only end when the caster is killed. The shopkeeper, however, arbitrarily renamed this forbidden art.\n\nUnder the golden curse, the hero loses 10 gold each turn. If they have less than 100 gold, they lose 5 health each turn instead. Other allies lose 5 health each turn.\n\nThe golden curse converts damage from other sources into delayed damage, making it difficult for the cursed to escape.
actors.mobs.greatshoper.gold_kill=You were crushed to death by gold...
actors.mobs.greatshoper.no_damage=Useless. With this magical shield, you can scarcely harm me.
actors.mobs.greatshoper.summon=Golden elemental, grandmaster monk, stop this intruder for me!
actors.mobs.greatshoper.summon1=Useless, both of you! Thymor, protect me.
actors.mobs.greatshoper.phase4=Even Thymor cannot stop you? Then be buried with these treasures!
actors.mobs.greatshoper.die=Treasure! My treasure!
actors.buffs.championenemy$corrosion.name=corrosive champion
actors.buffs.championenemy$corrosion.desc=Corrosive champions have +100% melee attack speed and apply corrosive ooze with melee attacks. On death, they splash corrosive ooze around themselves.
actors.buffs.championenemy$haste.name=swift champion
actors.buffs.championenemy$haste.desc=Swift champions have +100% melee attack speed and +50% movement speed.
actors.buffs.championenemy$holy.name=holy champion
actors.buffs.championenemy$holy.desc=Holy champions take 25% less damage, revive at 25% max health after death, and gain 5 turns of invulnerability. They lose the holy champion property after reviving.
actors.buffs.championenemy$transform.name=transforming champion
actors.buffs.championenemy$transform.desc=Transforming champions take 25% less damage, then revive as a random enemy from the current region at 33% max health after death. They lose the transforming champion property after reviving and gain one random champion property.
actors.mobs.warriorboss.name=warrior?
actors.mobs.warriorboss.desc=The wicked Old God is skilled at grasping the deepest desires in others' hearts, using them to lead people down a path of darkness. As for the warrior... right now, he wants to swallow every creature he sees.\n\nWarrior? is skilled with the Berserker's and Gladiator's combat techniques, and can even use heroic leap.\n\nBefore he prepares to leap, perhaps there is some way to _distract him_, such as... _food_?
actors.mobs.warriorboss$berserk.name=anger
actors.mobs.warriorboss$berserk.angered_desc=The severity of Warrior?'s injuries strengthens his attacks. As Warrior? takes physical damage, he builds rage, granting him stronger attacks.\n\nRage fades over time. The lower Warrior?'s health, the longer rage lasts.\n\nCurrent rage: _%.0f%%_\n_+%.0f%%_ damage
actors.mobs.warriorboss$combo.name=combo
actors.mobs.warriorboss$combo.desc=Warrior? builds momentum through repeated strikes. Each successful hit increases combo by 1, but going too long without attacking resets combo to 0.\n\nAt certain combo counts, Warrior? activates parry, gaining massive shielding and guaranteed evasion against the next attack. Activating parry resets combo.\n\nCurrent combo: %1$d\n\nCombo will be lost in %2$s turns.
actors.mobs.warriorboss.eat=This food is delicious.
actors.mobs.warriorboss.def=I'm flexible too!
actors.mobs.warriorboss.wantjump=Damn it, mocking my short legs?!
actors.mobs.warriorboss.wantfood=Food, delicious food!
actors.mobs.warriorboss.leap=Meat, egg, scallion, chicken!
actors.mobs.warriorboss.defeated=There was... so much food left to eat...
actors.mobs.warriorboss.wake=What? Is it time to eat?
actors.mobs.warriorboss.kill=You were flattened into a meat patty by Warrior?'s meat-egg-scallion-chicken leap...
actors.mobs.rogueboss.name=rogue?
actors.mobs.rogueboss.desc=The wicked Old God is skilled at grasping the deepest desires in others' hearts, using them to lead people down a path of darkness. As for the rogue... right now, he is holding Tengu's mask, ecstatic at completing a bounty. It seems the Tengu at the end of the cellblock was killed by him.\n\nRogue? excels at launching deadly ambushes from the shadows. When the situation turns against him, he uses agile footwork to quickly distance himself from enemies and attacks by throwing shuriken.\n\nWhile he is hidden in shadow, you cannot melee attack him directly, but perhaps you can still _try attacking him from range_.
actors.mobs.rogueboss.notice=Haha, another mark took the bait!
actors.mobs.rogueboss.invisibility=Try to catch me!
actors.mobs.rogueboss.execute=Take this blade!

actors.mobs.huntressboss.name=huntress?
actors.mobs.huntressboss.desc=The Old God's corruption has sharpened the huntress's instincts into a merciless obsession. No single hit can deal more than 30 damage to her. Her normal bow range is 6 tiles; a living, unblinded hawk can relay prey within 4 tiles when the huntress is also unblinded and has a clear shot. Otherwise, lost prey makes her hunt toward its last known position. Her ordinary rhythm alternates shooting with a deliberate move for cover. The first time prey stays adjacent she fights in melee as a warning; continued contact makes her deterministically vault away once her escape is ready.\n\nAs a sniper, her 6-14 damage ordinary arrows completely ignore armor. After five effective ordinary actions she spends a full action fixing the direction of a Gale Arrow, fires along that unchanged line on her next action, then spends another full action lowering her bow.\n\nBelow half health she becomes a warden. Her 10-16 damage ordinary arrows respect armor. After three effective actions she marks a reachable plant, then has five natural-hunt actions to claim it. During this hunt she moves at double speed, makes remote ordinary shots in 75% of the usual delay, and each such arrow has a 25% chance to apply one of Nature's Wrath's five harmful plants. If another creature or the environment takes the marked plant first, she loses its trail and gives up an action before resuming the hunt. A plant she claims ends the natural hunt and grants that plant's specific boon. She sees through grass. One hawk joins at the opening and a second joins only when she changes phase; blindness prevents either hunter from acquiring a new relay. Once every 20 turns, burning is removed and has an even chance to grant Fire Imbue; during that cooldown she receives burning normally.
actors.mobs.huntressboss.discover_hint=You can find this boss at the end of a certain dungeon region.
actors.mobs.huntressboss.gale_aim=The wind has already marked your path.
actors.mobs.huntressboss.gale_recover=The huntress lowers her bow to recover from the shot.
actors.mobs.huntressboss.contact_warning=Too close. Stay there, and I will make space myself.
actors.mobs.huntressboss.plant_marked=That growth is mine.
actors.mobs.huntressboss.nature_hunt=The trail quickens beneath my feet!
actors.mobs.huntressboss.lost_track=The trail is broken... I must find another.
actors.mobs.huntressboss.warden=Then let the whole arena take root!
actors.mobs.huntressboss.defeated=The hunt... ends here.
actors.mobs.huntressboss.boon_blindweed=Blindweed, hide me.
actors.mobs.huntressboss.boon_earthroot=Earthroot, harden my stance.
actors.mobs.huntressboss.boon_fadeleaf=Fadeleaf, scatter the hunt.
actors.mobs.huntressboss.boon_firebloom=Firebloom, kindle my arrows.
actors.mobs.huntressboss.boon_icecap=Icecap, chill my arrows.
actors.mobs.huntressboss.boon_mageroyal=Mageroyal, cleanse me.
actors.mobs.huntressboss.boon_sorrowmoss=Sorrowmoss, poison my arrows.
actors.mobs.huntressboss.boon_starflower=Starflower, guide my aim.
actors.mobs.huntressboss.boon_stormvine=Stormvine, lift my step.
actors.mobs.huntressboss.boon_sungrass=Sungrass, mend my wounds.
actors.mobs.huntressboss.boon_swiftthistle=Swiftthistle, quicken the chase.

actors.mobs.huntressboss$distractinghawk.name=distracting hawk
actors.mobs.huntressboss$distractinghawk.desc=A frail spirit hawk summoned to harass the huntress's prey. Its talons deal only 1 damage, but every hit briefly blinds and cripples its target.
actors.mobs.huntressboss$distractinghawk.discover_hint=You can encounter this enemy during the huntress boss battle.

actors.mobs.huntressboss$huntresstentacle.name=arena tendril
actors.mobs.huntressboss$huntresstentacle.desc=A weak but stubborn tendril awakened during the huntress boss's warden phase. It blocks paths and lashes nearby targets to keep them pinned down.
actors.mobs.huntressboss$huntresstentacle.discover_hint=You can encounter this enemy during the huntress boss's warden phase.
actors.mobs.rogueboss.angered=Damn it... in that case...
actors.mobs.rogueboss.enraged=enraged
actors.mobs.rogueboss.momentum=Can you still keep up with me?
actors.mobs.rogueboss.momentum-recovery=Oof, I'm exhausted...
actors.mobs.rogueboss.kill=You were tricked to death by Rogue?'s dirty moves...
actors.mobs.rogueboss.rankings_desc=You were tricked to death by Rogue?'s dirty moves...
actors.mobs.rogueboss.spkill=You were executed by Rogue?...
actors.mobs.rogueboss.executeninja=Rogue?: "Ninja, don't blame me for fighting dirty..."
actors.mobs.rogueboss.defeated=How could you be... stronger than Tengu...
actors.mobs.rogueboss$absoluteinvisibility.name=shadowmeld
actors.mobs.rogueboss$absoluteinvisibility.spname=preparation
actors.mobs.rogueboss$absoluteinvisibility.desc=Rogue? is using the cloak of shadows on him to become invisible.\n\nIn this state, you cannot directly melee attack Rogue?, but he immediately loses invisibility after taking a ranged attack.\n\nWhen above half max health, invisible Rogue? enters preparation and will execute you after 10 turns. Once below half max health, Rogue?'s momentum duration will no longer naturally decrease while invisible.\n\nShadowmeld remaining: %s turns
actors.mobs.rogueboss$absoluteinvisibility.spdesc=Rogue? is waiting patiently, preparing to strike a fatal blow from the shadows.\n\nAfter about 10 turns of preparation, Rogue? will instantly dash beside you and execute you. This strike cannot be dodged and is especially deadly! Fortunately, any ranged attack from you will interrupt him and end his preparation.\n\nRogue? has prepared for %s turns.
actors.mobs.rogueboss$momentumtime.name=momentum
actors.mobs.rogueboss$momentumtime.spname=recovering
actors.mobs.rogueboss$momentumtime.desc=Rogue? is in a momentum state. During this time he moves at double speed and has higher evasion, accuracy, and damage bonus.\n\nFortunately, every time Rogue? takes damage, his momentum duration is reduced by 3 turns. After momentum ends, he must rest for a while before entering it again.\n\nTurns remaining: %s
actors.mobs.rogueboss$momentumtime.spdesc=Rogue? has just ended his momentum state and needs to rest for a while. During this time he takes increased damage.\n\nDo not get careless, however. Rogue? is still building momentum while resting, and will enter momentum again once fully recovered.\n\nRogue? still needs to rest for %s turns.
actors.mobs.rogueboss$shadowrogue.name=shadow image
actors.mobs.rogueboss$shadowrogue.desc=A copy of Rogue? shaped from intangible shadow. It stands motionless with empty eyes as smoke-like darkness slowly rises around it.\n\nIt may not be a perfect copy, but it is a capable killer. Rogue? summoned it in desperation to hold you back, and now it is staring at you with hollow eyes... truly unsettling.
actors.mobs.rogueboss$shadowrogue.discover_hint=You can find this enemy in a certain dungeon region after enabling a specific challenge.
actors.hero.herosubclass.waterslime=water slime
actors.hero.herosubclass.waterslime_short_desc=The _water slime_ has higher max health, and can split off slime mucus after taking physical attacks. Absorbing it restores some health.
actors.hero.herosubclass.waterslime_desc=The water slime gains extra max health equal to 50% of her current level, and also has natural regeneration equal to 1% of max health, at least 1.\n\nAfter taking a physical attack, the water slime loses 10% of current health and randomly splits off a piece of slime mucus within a 9x9 square around her. Absorbing this mucus restores health equal to 10% of max health.\n\nSplitting off slime mucus costs at least 1 health, but cannot kill the water slime. Each generation has a 30-turn cooldown, and taking attacks reduces the cooldown by 1 turn.
actors.mobs.npcs.slimemucus.name=slime mucus
actors.mobs.npcs.slimemucus.desc=Slime mucus is a piece split off from the water slime. After landing, it absorbs microorganisms beneath it and swells, allowing the water slime to recover more health when absorbing it. Of course, it can also be destroyed by enemy attacks.\n\nSlime mucus has 10 health and loses 1 each turn. The water slime can absorb slime mucus by clicking it from within 8 surrounding tiles. Absorbing it takes no time.\n\nSlime mucus inherits half of the water slime's armor.
actors.mobs.npcs.slimemucus.absorb_title=Slime Mucus
actors.mobs.npcs.slimemucus.absorb_body=This is a piece of mucus split off from you. It looks like it has absorbed quite a few nutrients from nearby.\n\nDo you want to absorb this mucus? It can restore your health.
actors.mobs.npcs.slimemucus.absorb_confirm=Absorb
actors.mobs.npcs.slimemucus.absorb_cancel=Cancel
actors.mobs.npcs.slimemucus.discover_hint=You can discover this unit through a certain hero subclass.
actors.hero.herosubclass.darkslime=dark slime
actors.hero.herosubclass.darkslime_short_desc=The _dark slime_ loses some max health, but becomes immune to corrosive ooze, splashes ooze at enemies, and can release dark ooze hook.
actors.hero.herosubclass.darkslime_desc=The dark slime has absorbed wicked nutrients from the dungeon and gained dark power. This reduces her max health by 20%, but also makes her immune to corrosive ooze.\n\nWhen the dark slime attacks a target, she has a 50% chance to inflict 20 turns of corrosive ooze. When damaged, she also has a 15% chance to inflict 20 turns of corrosive ooze on the attacker, doubled against ranged attacks.\n\nEvery 65 turns, the dark slime can release dark ooze hook, pulling one visible enemy beside her and rooting it for 3 turns.
actors.buffs.darkhook.name=dark ooze hook
actors.buffs.darkhook.desc=Time to choose your favorite prey.\n\nEvery 65 turns, you can release dark ooze hook, pulling one visible enemy beside you and rooting it for 3 turns.\n\nThis ability has a range limit of 12 tiles.
actors.buffs.darkhook.cant_pull=Cannot pull the target.
actors.buffs.darkhook.does_nothing=The target cannot be pulled any closer from this distance.
actors.buffs.darkhook.more_distance=The target is too far away to reach.
actors.hero.heroclass.slimegirl=slime girl
actors.hero.heroclass.slimegirl_desc_short=The slime girl starts wearing _slime armor_ that cannot be removed but continually grows, and can also _sprout seeds inside her body_.
actors.hero.heroclass.slimegirl_desc=The slime girl starts wearing _unique slime armor_. Slime armor cannot be removed, but gains extra levels and may even increase in tier as the slime girl levels up.\n\nThe slime girl has lower strength, but higher starting health and growth. She can also _let seeds sprout inside her body to produce their corresponding vegetation effects_, which usually takes 1 turn.\n\nThe slime girl also starts with _a conqueror's spear_, _two slime balls_, a waterskin, and a velvet pouch.\n\nAs a monster, the slime girl does not have much human knowledge, so she only starts knowing these items:\n_-_Scrolls of Metamorphosis and Identify
actors.hero.heroclass.slimegirl_unlock=_Defeat Goo in a game_ to unlock the slime girl.
actors.hero.abilities.slime.madslime.name=Mad Slime Diary
actors.hero.abilities.slime.madslime.self_target=Cannot target yourself.
actors.hero.abilities.slime.madslime.no_target=There is no target to devour.
actors.hero.abilities.slime.madslime.more_distance=The target is too far away.
actors.hero.abilities.slime.madslime.strong_target=You cannot devour that target.
actors.hero.abilities.slime.madslime.eat=The target is delicious. You feel full of power.
actors.hero.abilities.slime.madslime.eat1=You feel your wounds slowly healing.
actors.hero.abilities.slime.madslime.eat2=You feel as though a barrier is protecting you.
actors.hero.abilities.slime.madslime.short_desc=The slime girl understands _Mad Slime Diary_, and her endless desire to eat is enough to devour an adjacent enemy whole.
actors.hero.abilities.slime.madslime.desc=The slime girl is filled with hunger, allowing her to devour an adjacent enemy and restore satiety. Devoured enemies take massive damage and die instantly.\n\nThe slime girl cannot devour neutral, elite, miniboss, or boss characters.\n\nBase satiety restored: _250_ (affected by the On Diet challenge)
actors.hero.abilities.slime.rapidwaterfall.name=Rapid Waterfall
actors.hero.abilities.slime.rapidwaterfall.short_desc=The slime girl uses _Rapid Waterfall_, surrounding herself with steaming water vapor that can turn nearby areas into pools and destroy all traps.
actors.hero.abilities.slime.rapidwaterfall.desc=The slime girl can create steaming water vapor centered on herself, turning nearby areas into pools.\n\nBase water vapor: _45_
actors.hero.abilities.slime.rapidwaterfall$rapidwater.name=rapid waterfall
actors.hero.abilities.slime.rapidwaterfall$rapidwater.desc=Steaming water vapor, able to turn nearby areas into pools and destroy all traps.
actors.hero.abilities.slime.springspell.name=Spring Circle
actors.hero.abilities.slime.springspell.short_desc=The slime girl calls on _Spring Circle_, granting herbal healing to herself and even her allies.
actors.hero.abilities.slime.springspell.desc=The slime girl can call on Spring Circle, granting herbal healing to herself and even her allies.\n\nBase healing: _25_
actors.hero.heroclass.ninja=ninja
actors.hero.heroclass.ninja_desc_short=The ninja can use his _shuriken box_ to strike and even disrupt enemies. He also has longer _detection range_ and greater _stealth_.
actors.hero.heroclass.ninja_desc=The ninja starts with a _unique shuriken box_, from which he can quickly draw and throw tiny shuriken to strike and even disrupt enemies.\n\nThe ninja can _detect secrets and traps_ from farther away, and his actions are _harder for enemies to notice_.\n\nThe ninja also starts with _a wakizashi_, cloth armor, a waterskin, and a velvet pouch.\n\nThe ninja starts knowing these items:\n_-_Potion of Toxic Gas\n_-_Scrolls of Metamorphosis, Identify, and Teleportation
actors.hero.heroclass.ninja_unlock=_Defeat Tengu in a game_ to unlock the ninja.
actors.hero.herosubclass.tatteki_ninja=firearm ninja
actors.hero.herosubclass.tatteki_ninja_short_desc=The _firearm ninja_ gains a powerful tanegashima, with extremely high damage and a long firing interval.
actors.hero.herosubclass.tatteki_ninja_desc=The firearm ninja gains a tanegashima, which can be equipped as a side weapon and share the main weapon's level. Firing the tanegashima deals extremely high damage and frightens all visible enemies whether it hits or not, but each shot requires a 30-turn interval.\n\nThe firearm ninja's tanegashima has extremely poor accuracy and cannot be used for ambushes, but he can give enemies trajectory correction by throwing thrown weapons or tiny shuriken. Affected targets are guaranteed to be hit by the tanegashima.
actors.hero.herosubclass.ninja_master=ninjutsu master
actors.hero.herosubclass.ninja_master_short_desc=The _ninjutsu master_ gains ninjutsu energy over time, and can spend it to release various ninjutsu depending on terrain.
actors.hero.herosubclass.ninja_master_desc=The ninjutsu master spends ninjutsu energy to release different ninjutsu depending on terrain. Ninjutsu energy usually recovers by 1 every 40 turns.\n\nNormal terrain:\nEscape Art - Shadowmeld: teleport instantly and become hidden\nTaijutsu - Swallow Return: slash quickly and daze the enemy\nThrowing Art - Shadow Strike: the next throw on the corresponding terrain cripples and bleeds the enemy\n\nWater terrain:\nEscape Art - Water Escape: double movement speed on water for a time\nTaijutsu - Flowing Water Slash: slash from farther away and chill the enemy\nThrowing Art - Flying Water Throw: the next throw on the corresponding terrain transfers nearby water to the landing point\n\nTall grass/dry grass/grass/ember terrain:\nEscape Art - Verdant Revival: create rot lashers nearby to assist in battle\nTaijutsu - Vine Bind: slash powerfully and restrict the enemy's movement\nThrowing Art - Hundred Flowers Scatter: the next throw on the corresponding terrain triggers a random harmful plant effect
actors.buffs.ninja_energy.name=ninjutsu energy
actors.buffs.ninja_energy.desc=The ninjutsu master gains ninjutsu energy over time, and can spend it to release various ninjutsu depending on terrain.\n\nNinjutsu energy usually recovers by 1 every 40 turns.\n\nCurrent energy: %d/10
actors.buffs.ninja_energy.action=Ninjutsu
actors.buffs.ninja_energy$watersmooth.name=flowing freely
actors.buffs.ninja_energy$watersmooth.desc=The ninjutsu master has released water escape. While this effect lasts, the ninjutsu master's movement speed in water is doubled.\n\nTurns remaining: %s
actors.buffs.ninja_energy$gas_storage.name=gas storage
actors.buffs.ninja_energy$gas_storage.desc=The ninjutsu master stores nearby gases inside their body, and can release them at the target location the next time they use a throwing art.
actors.buffs.ninja_energy$throw_skill.name=throwing art
actors.buffs.ninja_energy$throw_skill.desc=The ninjutsu master gathers ninjutsu energy in their hand. This energy is thrown together with a thrown weapon and can produce additional effects.\n\nOn normal terrain, the throw inflicts bleeding and cripple based on the thrown weapon's damage.\n\nOn water terrain, the throw transfers water terrain around the ninjutsu master to the landing point.\n\nOn tall grass/dry grass/grass/ember terrain, the throw triggers a random harmful plant effect.
actors.buffs.ninja_energy$ninjaability$transported.name_normal=Escape Art - Shadowmeld
actors.buffs.ninja_energy$ninjaability$transported.desc_normal=Spend one turn to teleport up to 2 tiles away and gain 5 turns of invisibility.
actors.buffs.ninja_energy$ninjaability$transported.more_distance=Too far away to teleport.
actors.buffs.ninja_energy$ninjaability$transported.name_water=Escape Art - Water Escape
actors.buffs.ninja_energy$ninjaability$transported.desc_water=Gain flowing freely, doubling movement speed in water for 8 turns.
actors.buffs.ninja_energy$ninjaability$transported.name_grass=Escape Art - Verdant Revival
actors.buffs.ninja_energy$ninjaability$transported.desc_grass=Can create 1-3 fallen rot lashers nearby.
actors.buffs.ninja_energy$ninjaability$transported.less=There is not enough space to create lashers.
actors.buffs.ninja_energy$ninjaability$taijutsu.name_normal=Taijutsu - Swallow Return
actors.buffs.ninja_energy$ninjaability$taijutsu.desc_normal=Slash the enemy twice for 80% damage each and inflict 5 turns of daze.
actors.buffs.ninja_energy$ninjaability$taijutsu.name_water=Taijutsu - Flowing Water Slash
actors.buffs.ninja_energy$ninjaability$taijutsu.desc_water=Slash the enemy with 1 extra tile of reach and inflict 5 turns of frostbite.
actors.buffs.ninja_energy$ninjaability$taijutsu.name_grass=Taijutsu - Vine Bind
actors.buffs.ninja_energy$ninjaability$taijutsu.desc_grass=Slash the enemy once for 125% damage and inflict 5 turns of root.
actors.buffs.ninja_energy$ninjaability$throw.name_normal=Throwing Art - Shadow Strike
actors.buffs.ninja_energy$ninjaability$throw.desc_normal=Gain throwing art, causing your next throw on normal terrain to inflict bleeding and cripple based on thrown weapon damage.
actors.buffs.ninja_energy$ninjaability$throw.name_water=Throwing Art - Flying Water Throw
actors.buffs.ninja_energy$ninjaability$throw.desc_water=Gain throwing art, causing your next throw on water terrain to transfer water terrain around the ninjutsu master to the landing point.
actors.buffs.ninja_energy$ninjaability$throw.name_grass=Throwing Art - Hundred Flowers Scatter
actors.buffs.ninja_energy$ninjaability$throw.desc_grass=Gain throwing art, causing your next throw on tall grass/dry grass/grass/ember terrain to trigger a random harmful plant effect.
actors.buffs.ninja_energy$ninjaability$throw.hive_throw=You have entered a throwing art state.
actors.hero.abilities.ninja.decoy.name=shadow warrior
actors.hero.abilities.ninja.decoy.short_desc=The ninja summons a _shadow warrior_ to assist in battle and take fatal attacks in his place.
actors.hero.abilities.ninja.decoy.desc=The ninja summons a shadow warrior. While it exists, using this ability directs its actions. The shadow warrior initially has only 40 health and 10-15 attack.\n\nThe shadow warrior can assist the ninja in battle. When the ninja suffers a fatal attack, the shadow warrior takes massive damage in his place and dies.
actors.hero.abilities.ninja.decoy.less=There is not enough space to summon a shadow warrior.
actors.hero.abilities.ninja.decoy$decoyman.name=shadow warrior
actors.hero.abilities.ninja.decoy$decoyman.direct_defend=At your command.
actors.hero.abilities.ninja.decoy$decoyman.direct_follow=I follow to the death!
actors.hero.abilities.ninja.decoy$decoyman.direct_attack=All forces, attack!
actors.hero.abilities.ninja.decoy$decoyman.directed_wander=Seek enemies and destroy them!
actors.hero.abilities.ninja.decoy$decoyman.desc=A shadow warrior shaped from darkness. Its every movement is exactly like yours, making it hard for enemies to tell you apart.\n\nIt looks fragile. When you suffer a fatal blow, it can take that blow for you, but this deals tremendous damage to it and may kill it outright.
actors.hero.abilities.ninja.decoy$decoyman.die1=The cherry blossoms in my homeland have bloomed again. A pity I cannot return...
actors.hero.abilities.ninja.decoy$decoyman.die2=Hah... this smoke... tastes awful...
actors.hero.abilities.ninja.decoy$decoyman.die3=To live is itself proof of battle...
actors.hero.abilities.ninja.decoy$decoyman.die4=Sayonara! (scattered in an explosion)
actors.hero.abilities.ninja.decoy$decoyman.discover_hint=You can discover this unit through a certain hero armor ability.
actors.hero.abilities.ninja.decoy$shadowmark.name=shadow mark
actors.hero.abilities.ninja.decoy$shadowmark.desc=The shadow warrior has branded this enemy with a shadow mark.\n\nMarked enemies take more damage from the ninja and the shadow warrior.\n\nTurns remaining: %s
actors.hero.abilities.ninja.onesword.name=First Sword
actors.hero.abilities.ninja.onesword.short_desc=The ninja performs the sword saint's secret art, _First Sword_, increasing movement speed, melee attack speed, and melee damage for a short time.
actors.hero.abilities.ninja.onesword.desc=The ninja performs the sword saint's secret art: First Sword! This secret art lasts 10 turns.\n\nAfter performing First Sword, the ninja has double movement speed, +50% attack speed, and +30% melee damage. If the weapon in hand is a wakizashi or katana, melee damage increases by an additional 20%.
actors.hero.abilities.ninja.onesword$oku_onesword.name=Secret Art: First Sword
actors.hero.abilities.ninja.onesword$oku_onesword.desc=The strongest sword secret of Shinkage-ryu, now applied by the ninja to close combat, increasing movement speed, attack speed, and melee damage.\n\nTurns remaining: %s
actors.hero.abilities.ninja.spiderjar.name=Hiragumo Kettle
actors.hero.abilities.ninja.spiderjar.short_desc=The ninja packs a large amount of gunpowder into the _Hiragumo Kettle_, lights it, and throws it, causing massive explosive damage when the fuse burns down.
actors.hero.abilities.ninja.spiderjar.desc=Before it explodes, the ancient Tenmyo Hiragumo Kettle releases a fragrance intoxicating to creatures and even machines, attracting enemies that are not asleep to smell it. Normally, attracted enemies have a 50% chance each turn to shift attention to the ninja or an ally within vision.\n\nAfter exploding, the ancient Tenmyo Hiragumo Kettle deals 20-40 damage to units in a 3x3 area.
actors.hero.abilities.ninja.spiderjar$spider.name=Hiragumo Kettle
actors.hero.abilities.ninja.spiderjar$spider.desc=A precious tea utensil filled with gunpowder, seemingly once the favorite object of some important figure. Now the ninja has packed it with explosives and lit the fuse.\n\nThis tea utensil gives off a captivating fragrance, continually attracting enemies.
actors.hero.abilities.ninja.spiderjar$spider.ondeath=Like Matsunaga Hisahide, you lit the gunpowder and gave everyone a splendid fireworks show...
actors.hero.abilities.ninja.spiderjar$smallspider.name=small spider kettle
actors.hero.abilities.ninja.spiderjar$smallspider.desc=After the Hiragumo Kettle exploded, there was still a small spider kettle inside that did not fully detonate.\n\nThis tea utensil gives off a captivating fragrance and comes with flashy cyber LED lighting, continually attracting enemies.
actors.hero.heroclass.dm400=DM-400
actors.hero.heroclass.dm400_desc_short=DM-400 can use the _instruction toolkit_ to produce drones that assist in battle, and its physical attacks _enhance_ combat drones' effects on enemies. It also has the _inorganic_ property.
actors.hero.heroclass.dm400_desc=DM-400 starts with a _unique instruction toolkit_, which can produce drones to assist in battle.\n\nDM-400 has the _inorganic_ property, starts with low health and no weapon, but unarmed attacks deal _1-8 damage_. When DM-400's physical attacks hit enemies, they inflict 3 turns of non-stacking _instruction mark_, which enhances some combat drones' effects on enemies.\n\nDM-400 also starts with _two scrap gears_, cloth armor, a waterskin, and a velvet pouch.\n\nDM-400 starts knowing these items:\n_-_Potion of Frost\n_-_Scrolls of Metamorphosis, Identify, and Recharging
actors.hero.heroclass.dm400_unlock=_Defeat DM-300 in a game_ to unlock DM-400.
actors.hero.herosubclass.at400=AT-400
actors.hero.herosubclass.at400_short_desc=_AT-400_ can call on more kinds of combat drones to assist in battle. A vast drone cluster strikes all hostile targets more effectively.
actors.hero.herosubclass.at400_desc=AT-400 deals 30% more physical damage when attacking marked enemies, and can now input more scrolls to call on more kinds of combat drones. These drones are all superior in combat performance.\n\nFlash drone (remove curse): attacks enemies while disrupting their vision\nLaser drone (recharging): bursts intense laser rays to burn enemies\nDazing drone (lullaby): attacks have a chance to daze or even knock enemies back\nRaiding drone (rage): harasses enemies and can even drive them amok\nShock drone (terror): suppresses enemies with firepower\nChaos drone (transmutation): after a time, transforms into any support drone or something strange
actors.hero.ally.attackdrone.name=combat drone
actors.hero.ally.attackdrone.desc=A drone dedicated to combat.
actors.hero.ally.attackdrone$flashdrone.name=flash drone
actors.hero.ally.attackdrone$flashdrone.desc=A combat drone produced after inputting a _scroll of remove curse_. Though fitted with a laser barrel, it actually fires laser rays at enemies from its "pupil". The so-called laser barrel merely serves as a firing indicator light.\n\nHas 3 tiles of attack range. When attacking enemies with instruction mark, it blinds them for 3 turns, and also deals 5 extra magical damage to undead and demon enemies with instruction mark.
actors.hero.ally.attackdrone$laserdrone.name=laser drone
actors.hero.ally.attackdrone$laserdrone.desc=A combat drone produced after inputting a _scroll of recharging_. Its design looks more like a large floating laser cannon, and in practice that is exactly what it is. Its laser would be quite suitable for "barbecue".\n\nAttacks from range and deals magical damage. When attacking enemies with instruction mark, it has a 50% chance to ignite them for 3 turns.
actors.hero.ally.attackdrone$anesthesiadrone.name=dazing drone
actors.hero.ally.attackdrone$anesthesiadrone.desc=A combat drone produced after inputting a _scroll of lullaby_. Its two mechanical arms are connected to shock devices. Though not enough to paralyze a target, they still leave it dizzy. Surely no one wants to experience being shocked by it.\n\nWhen attacking enemies with instruction mark, it has a 33% chance to daze them for 3 turns and an additional 50% chance to knock them back one tile.
actors.hero.ally.attackdrone$raiddrone.name=raiding drone
actors.hero.ally.attackdrone$raiddrone.desc=A combat drone produced after inputting a _scroll of rage_. This small drone model has faster flight speed, making it ideal for harassing targets. Faced with a swarm of "insects", even the most patient target will be driven mad.\n\nHas 2x flying speed and 3 tiles of attack range. When attacking enemies without instruction mark, it has a 33% chance to inflict a non-stacking 3-turn instruction mark. When attacking enemies with instruction mark, it has a 17% chance to make them amok for 3 turns.
actors.hero.ally.attackdrone$shockdrone.name=shock drone
actors.hero.ally.attackdrone$shockdrone.desc=A combat drone produced after inputting a _scroll of terror_. It is fitted with a heavy sniper barrel, allowing it to pierce a target's flesh with ease. When drones like this can be mass-produced, running may be the wiser choice.\n\nAttacks from range. When attacking enemies without instruction mark, it has a 17% chance to inflict a non-stacking 3-turn instruction mark. When attacking enemies with instruction mark, it has a 33% chance to terrify them for 6 turns.
actors.hero.ally.auxiliarydrone.name=support drone
actors.hero.ally.auxiliarydrone.desc=A drone dedicated to support.
actors.hero.ally.auxiliarydrone$scoutdrone.name=scout drone
actors.hero.ally.auxiliarydrone$scoutdrone.desc=A support drone produced after inputting a _scroll of identify_. It mainly performs reconnaissance work, and its "pupil" constantly scans nearby terrain and moving targets. In addition, it is the only attached drone that shares full vision with the host.\n\nIts initial vision range is small, but expands as the toolkit is upgraded. It shares full vision with DM-400 and marks weaknesses on all visible enemies, causing marked enemies to take 33% more damage. This does not stack.
actors.hero.ally.auxiliarydrone$weaknessmark.name=weakness mark
actors.hero.ally.auxiliarydrone$weaknessmark.desc=This enemy's weakness has been marked by a scout drone.\n\nEnemies within the scout drone's vision have their weaknesses continuously marked, and therefore take 33%% more damage.\n\nTurns remaining: %s
actors.hero.ally.auxiliarydrone$mirrordrone.name=image drone
actors.hero.ally.auxiliarydrone$mirrordrone.desc=A support drone produced after inputting a _scroll of mirror image_. It uses new image technology to project a freely moving image of the user. Of course, the principle behind this technology is still magic.\n\nEvery so often, it creates one DM-400 mirror image nearby. Upgrading the toolkit reduces the time needed to create images.
actors.hero.ally.auxiliarydrone$protectdrone.name=protection drone
actors.hero.ally.auxiliarydrone$protectdrone.desc=A support drone produced after inputting a _scroll of teleportation_. It creates an invisible defensive field around the host, and teleports the attacker elsewhere when destroyed. Surely it will make you feel perfectly safe.\n\nWhile present, it gives DM-400 an extra 1-3 armor. When destroyed by an enemy, it randomly teleports that enemy elsewhere.
actors.hero.ally.auxiliarydrone$escortdrone.name=escort drone
actors.hero.ally.auxiliarydrone$escortdrone.desc=A support drone produced after inputting a _scroll of magic mapping_. It can conceal the host's movements, providing safety for exploration. For some reason, targets even struggle to notice the drone itself.\n\nMakes DM-400's actions harder for enemies to notice, and every so often makes DM-400 invisible for 4 turns.
actors.hero.ally.auxiliarydrone$bombdrone.name=bomber drone
actors.hero.ally.auxiliarydrone$bombdrone.desc=A support drone produced after inputting a _scroll of retribution_. It has powerful explosive capability and quickly approaches targets for suicide attacks. Do not worry, the explosions it creates do not harm the host or other attached drones.\n\nHas 2x flying speed. When an enemy is within 1 tile, it continuously loses health. When its health runs out or it is destroyed, it creates an explosion that only harms enemies.
actors.hero.ally.auxiliarydrone$chaosdrone.name=chaos drone
actors.hero.ally.auxiliarydrone$chaosdrone.desc=A special drone produced after inputting a _scroll of transmutation_. For some reason, black and white blocks of unknown origin flicker around it...\n\nIt has no effect. After a time, it transforms into a random support or combat drone depending on DM-400's subclass, though it may also become something unexpected... Upgrading the toolkit reduces the time needed to transform.
actors.hero.herosubclass.au400=AU-400
actors.hero.herosubclass.au400_short_desc=_AU-400_ can call on more kinds of support drones to assist in battle. Making good use of powerful utility drones can greatly improve survivability.
actors.hero.herosubclass.au400_desc=AU-400 takes 20% less physical attack damage from marked enemies, and can now input more scrolls to call on more kinds of support drones. These drones are all superior in support performance.\n\nScout drone (identify): scouts and reveals enemy weaknesses\nImage drone (mirror image): periodically creates an image of you\nProtection drone (teleportation): improves your defense and moves dangerous enemies away\nEscort drone (magic mapping): conceals your traces for safer exploration\nBomber drone (retribution): damages enemies by self-destructing\nChaos drone (transmutation): after a time, transforms into any combat drone or something strange
actors.hero.abilities.dm400.routine.name=Routine Maintenance
actors.hero.abilities.dm400.routine.short_desc=DM-400 performs _Routine Maintenance_ on itself, improving its functions for a short time.
actors.hero.abilities.dm400.routine.desc=DM-400 spends 4 turns performing routine maintenance on itself, taking 50% less damage during this time, then enters 10 turns of overload.\n\nWhile overloaded, DM-400 has double attack speed and movement speed, and drones also benefit from this bonus, but DM-400 takes 50% more damage.
actors.hero.abilities.dm400.routine$overload.name=overload mode
actors.hero.abilities.dm400.routine$overload.desc=Warning! DM-400 and its attached drones have entered overload mode!\n\nDuring this time, DM-400 and its drones have doubled attack speed and movement speed, but DM-400 also takes increased damage.\n\nTurns remaining: %s
actors.hero.abilities.dm400.discharge_gas.name=Exhaust Discharge
actors.hero.abilities.dm400.discharge_gas.short_desc=DM-400 performs _Exhaust Discharge_, releasing harmful gases accumulated inside its body.
actors.hero.abilities.dm400.discharge_gas.desc=DM-400 can discharge exhaust accumulated inside its body over a long period, spraying toxic gas at all visible enemies while also clearing all of its own debuffs.\n\nIf there are no visible enemies, it only clears its own debuffs and does not release toxic gas.\n\nBase exhaust amount: _50_
actors.blobs.discharge_gas$dm400gas.name=mechanical exhaust
actors.blobs.discharge_gas$dm400gas.desc=Greenish mechanical exhaust is swirling here. DM-400 and its drones ignore this gas's effects.
actors.hero.abilities.dm400.honeycomb.name=Hive Cluster
actors.hero.abilities.dm400.honeycomb.short_desc=DM-400 starts the _Hive Cluster_ program, granting bonuses to the host whenever a drone is destroyed.
actors.hero.abilities.dm400.honeycomb.desc=DM-400 starts the hive cluster program. For 20 turns, whenever a drone is destroyed, DM-400 restores 4% of max health and gains 2 turns of artifact recharging.
actors.hero.abilities.dm400.honeycomb$honeycombbuff.name=cluster program
actors.hero.abilities.dm400.honeycomb$honeycombbuff.desc=DM-400 is executing this program, and attached drones are sharing data with the host.\n\nWhile the program is running, every attached drone transfers data to the host when destroyed, helping maintain DM-400's survival state and accelerate production of new drones.\n\nTurns remaining: %s
actors.hero.abilities.freeman.salescontract.name=Indenture Contract
actors.hero.abilities.freeman.salescontract.short_desc=The gentleman beguiles an enemy into signing an _Indenture Contract_, making them serve him for life.
actors.hero.abilities.freeman.salescontract.desc=The gentleman can use a common monster language he learned from unknown sources, admittedly mostly relying on the crown's power, to convince an enemy to sign an indenture contract. This makes the contracted enemy serve him for life.\n\nOf course, the gentleman's rhetoric cannot persuade everyone or every monster. Neutral, elite, miniboss, and boss characters will refuse to sign with him.
actors.hero.abilities.freeman.salescontract$saleself.name=life service
actors.hero.abilities.freeman.salescontract$saleself.desc=This enemy was thoroughly talked into unconditionally selling themself to the gentleman, and now serves him.\n\nEnemies that have already signed a contract obviously cannot sign another one. After all, you cannot mortgage the next life too, can you?
actors.hero.abilities.freeman.salescontract$workerwraith.name=worker wraith
actors.hero.abilities.freeman.salescontract$workerwraith.desc=A worker, or monster, who died suddenly full of resentment and became a wraith. Though its body is dead, it must still serve the gentleman according to the contract.\n\nPoor thing, it really has to work two lifetimes for the gentleman.
actors.hero.abilities.freeman.salescontract.self_target=Cannot target yourself.
actors.hero.abilities.freeman.salescontract.no_target=There is no target that can sign a contract.
actors.hero.abilities.freeman.salescontract.more_distance=The target is too far away.
actors.hero.abilities.freeman.salescontract.strong_target=The target refuses to sign a contract with you and looks at you with contempt.
actors.mobs.transformmimic.name=metamorphosis mimic
actors.mobs.transformmimic.desc=Mimics are magical creatures that can freely change shape. In the dungeon they almost always appear as chests, because that reliably attracts careless adventurers.\n\nMetamorphosis mimics are mimics formed when scrolls of metamorphosis are shaped by some wicked power. Their attack and defense are no different from ordinary mimics, but they always contain a scroll of metamorphosis and no other loot.
actors.mobs.transformmimic.reveal=There is a mimic there!
actors.mobs.transformmimic.hidden_name=purple chest?
actors.mobs.transformmimic.hidden_desc=You cannot see what is inside before opening it!\n\nThis purple chest looks very different from common chests. It would be best not to open it recklessly.
actors.mobs.transformmimic.discover_hint=You can find this enemy in any dungeon region after enabling a specific challenge.
actors.hero.heroclass.princess=dwarven princess
actors.hero.heroclass.princess_desc_short=The dwarven princess carries a _crown prince's ring_ that can store enchantments and glyphs, and can spend alchemical energy to _convert any runestone into a stone of enchantment_.
actors.hero.heroclass.princess_desc=The dwarven princess starts with a _unique crown prince's ring_, which can store enchantments and glyphs like weapons and armor and apply them directly to both.\n\nThe dwarven princess can directly _convert any runestone into a stone of enchantment_, costing 8 alchemical energy.\n\nThe dwarven princess also starts with _a bracer shield_, _a runestone strand_, cloth armor, a waterskin, and a velvet pouch.\n\nThe dwarven princess starts knowing these items:\n_-_Potion of Levitation\n_-_Scrolls of Metamorphosis, Identify, and Retribution
actors.hero.heroclass.princess_unlock=_Defeat the Dwarf King in a game_ to unlock the dwarven princess.
actors.hero.herosubclass.runemage=runesage
actors.hero.herosubclass.runemage_short_desc=After making physical attacks with positive enchantments, the _runesage_ applies rune marks to characters. Rune marks can be detonated by wand casts and produce special effects based on the enchantment.
actors.hero.herosubclass.runemage_desc=After making physical attacks with positive enchantments, the runesage applies rune marks to characters. Applied rune marks store the corresponding enchantment information, and the number of stored enchantments is the mark's stack count. The mark detonates when affected by a wand cast.\n\nAfter the runesage detonates a rune mark with a wand, all enemies in a 3x3 area take extra damage equal to mark stacks x5, and special effects occur based on the enchantments stored in the mark.
actors.buffs.runemark.name=rune mark
actors.buffs.runemark.desc=The runesage has branded this target with a mark using the power of enchantment. When struck by a spell, it will explode. This explosion only deals extra magical damage to enemies, does not affect the runesage or allies, and does not destroy any terrain or items.\n\nThis mark remains until detonated by a spell or until the target dies.\n\nThe mark has stored the following enchantments:
actors.buffs.runemark$runesurge.name=rune surge
actors.buffs.runemark$runesurge.desc=The enchantment effects triggered by the runesage will be enhanced for a short time.\n\nTurns remaining: %s
actors.hero.herosubclass.combatmaster=martial master
actors.hero.herosubclass.combatmaster_short_desc=The _martial master_'s armor glyphs have additional powerful effects, and she is also skilled in various combat stances.
actors.hero.herosubclass.combatmaster_desc=The martial master can better draw out the potential power of armor glyphs, granting her more powerful effects related to positive glyphs. She is also skilled in various combat stances, giving her an advantage in close combat.\n\nThe martial master starts in balanced stance. Switching stances takes no time, but switching again within 6 turns after a switch causes 10 turns of vertigo, during which she cannot switch stances again.\n\nBalanced stance: slightly improves combat and defensive abilities\nAggressive stance: improves combat abilities, but reduces defensive abilities\nParry stance: improves defensive abilities, but reduces combat abilities
actors.buffs.fightstance.balance_name=balanced stance
actors.buffs.fightstance.balance_desc=The martial master is in _balanced stance_. In this stance, her combat and defensive abilities are both improved somewhat.
actors.buffs.fightstance.balance_desc1=Increases melee damage, armor defense, accuracy, and evasion by 10%.
actors.buffs.fightstance.balance_desc2=Increases melee damage, armor defense, accuracy, and evasion by 15%.
actors.buffs.fightstance.balance_desc3=Increases melee damage, armor defense, attack speed, movement speed, accuracy, and evasion by 15%.
actors.buffs.fightstance.invasion_name=aggressive stance
actors.buffs.fightstance.invasion_desc=The martial master is in _aggressive stance_. In this stance, her combat abilities are improved, but her defensive abilities are reduced.
actors.buffs.fightstance.invasion_desc1=Increases melee damage by 20% and has a 30% chance to perform a double attack, with the second hit able to trigger weapon enchantments normally, but reduces evasion by 30%.
actors.buffs.fightstance.invasion_desc2=Increases melee damage by 30% and has a 30% chance to perform a double attack, with the second hit able to trigger weapon enchantments normally, but reduces evasion by 30%.
actors.buffs.fightstance.invasion_desc3=Increases melee damage by 30% and has a 50% chance to perform a double attack, with the second hit able to trigger weapon enchantments normally, but reduces evasion by 15%.
actors.buffs.fightstance.parry_name=parry stance
actors.buffs.fightstance.parry_desc=The martial master is in _parry stance_. In this stance, her defensive abilities are improved, but her combat abilities are reduced.
actors.buffs.fightstance.parry_desc1=Increases armor defense by 20% and gains focus every 30 turns. This effect does not stack and is cancelled by stance switching, but reduces accuracy by 30%.
actors.buffs.fightstance.parry_desc2=Increases armor defense by 30% and gains focus every 30 turns. This effect does not stack and is cancelled by stance switching, but reduces accuracy by 30%.
actors.buffs.fightstance.parry_desc3=Increases armor defense by 30% and gains focus every 20 turns. This effect does not stack and is cancelled by stance switching, but reduces accuracy by 15%.
actors.buffs.fightstance.duration=The martial master has maintained this stance for %s turns.
actors.buffs.fightstance.action=Choose the stance you want to switch to.
actors.buffs.fightstance$stabilize.name=stance stabilization
actors.buffs.fightstance$stabilize.desc=You have just switched stances. It would be best to wait until you stabilize before deciding whether to switch again.\n\nSwitching stances again during this time will require extra time to coordinate your balance, preventing further stance changes.\n\nYou need %s more turns to stabilize.
actors.buffs.fightstance$coordination.name=stance coordination
actors.buffs.fightstance$coordination.desc=You switched stances multiple times in a short period. To coordinate your balance, you need to wait before switching stances again.\n\nYou need %s more turns to coordinate your balance.
actors.buffs.fightstance$focus.name=focus
actors.buffs.fightstance$focus.desc=The martial master is focused on everything around her, and can anticipate the next attack against her. While focused, she will certainly parry the next incoming attack.
actors.hero.abilities.princess.marchforward.name=March Forward
actors.hero.abilities.princess.marchforward.short_desc=The dwarven princess _marches forward_, moving continuously and growing faster with each step.
actors.hero.abilities.princess.marchforward.desc=The dwarven princess marches forward continuously, gaining 50% movement speed. Each further step increases this by another 5%, up to 100%.\n\nWhen the dwarven princess takes damage, this effect immediately ends.
actors.hero.abilities.princess.marchforward$forward.name=march forward
actors.hero.abilities.princess.marchforward$forward.desc=The dwarven princess is marching forward, increasing movement speed by %1$s%%. Each further step increases this by another 5%%, up to %2$s%%.\n\nThis effect lasts until she takes damage %3$d times.
actors.hero.abilities.princess.marchforward.say=That was only a delaying tactic!
actors.hero.abilities.princess.taboomagic.name=Forbidden Spell
actors.hero.abilities.princess.taboomagic.short_desc=The dwarven princess can cast a _Forbidden Spell_, inflicting many debuffs on enemies.
actors.hero.abilities.princess.taboomagic.desc=The dwarven princess can cast a forbidden spell recorded in the dwarven library, placing a vicious curse on an enemy and inflicting many debuffs.\n\nThis spell cannot target herself or allies. Enemies targeted by it receive 10 turns of vertigo, vulnerability, and weakness. This spell can detonate rune marks applied by the runesage.
actors.hero.abilities.princess.taboomagic.no_target=There is no suitable target for the forbidden spell at this location.
actors.hero.abilities.princess.taboomagic.say=Slowly, gently, this is how a life is taken.
actors.hero.abilities.princess.taboomagic.say1=Death waits... unexpected, inescapable.
actors.hero.abilities.princess.taboomagic.say2=A mind cannot be expected to withstand such an assault.
actors.hero.abilities.princess.taboomagic.say3=Reeling, gasping, taken over the edge into madness!
actors.hero.abilities.princess.taboomagic.prompt=Choose a target for the forbidden spell
actors.hero.abilities.princess.kingblade.name=King's Blade
actors.hero.abilities.princess.kingblade.short_desc=The dwarven princess swings down the _King's Blade_, heavily damaging an enemy and making it difficult for them to retaliate.
actors.hero.abilities.princess.kingblade.desc=The dwarven princess can make a guaranteed-hit normal attack against an adjacent enemy. This strike has a 50% damage bonus.\n\nIf the enemy survives, it is disarmed for 8 turns. If the enemy dies, all visible enemies are disarmed for 4 turns. Disarmed enemies cannot deal any physical damage to the dwarven princess or her allies, while boss enemies resist this effect.
actors.hero.abilities.princess.kingblade.no_target=You need to choose an adjacent target.
actors.hero.abilities.princess.kingblade.say1=Stand down!
actors.hero.abilities.princess.kingblade.say2=Disarm.
actors.hero.abilities.princess.kingblade$disarm.name=disarmed
actors.hero.abilities.princess.kingblade$disarm.desc=This enemy has been disarmed by you.\n\nDisarmed enemies will still attack, but cannot deal any physical damage to you or allies. Boss enemies still deal 50%% physical damage.\n\nDisarm duration: %s turns
actors.hero.heroclass.friar=friar
actors.hero.heroclass.friar_desc_short=The friar can load potions into an _alchemy sprayer_ and spray them. The friar can _spend sanity to convert it into alchemical energy_, and once sanity runs out, their _mind will be tested_.
actors.hero.heroclass.friar_desc=The friar starts with a _unique alchemy sprayer_, which can be loaded with potions and sprayed.\n\nThe friar can _spend some sanity to convert it into alchemical energy_. While exploring deeper into the dungeon, the friar may also lose sanity. Once sanity runs out, their _mind will be tested_.\n\nThe friar also starts with _a leather whip_, cloth armor, a waterskin, and a velvet pouch.\n\nThe friar starts knowing these items:\n_-_Potion of Haste\n_-_Scrolls of Metamorphosis, Identify, and Terror
actors.hero.heroclass.friar_unlock=_Defeat Yog-Dzewa in a game_ to unlock the friar.
actors.buffs.reason.name=sanity
actors.buffs.reason.desc_full=Your mind is very clear, at least for now.\n\n
actors.buffs.reason.desc_half=You feel a little dizzy, but it does not affect your actions.\n\n
actors.buffs.reason.desc_quarter=Your head is splitting, and breathing has become difficult.\n\n
actors.buffs.reason.desc_zero=You are on the edge of madness!\n\n
actors.buffs.reason.desc_simple=While exploring the dungeon, facing terrifying enemies, stepping into deadly traps, or falling into hunger will wear away your limited sanity. Once your sanity is exhausted, your mind will be tested. Will mental torment arrive first, or noble qualities that only awaken in desperation? No one knows.\n\nOf course, this is not all inconvenience. When performing alchemy or loading the alchemy sprayer, you can convert the needed alchemical energy from nothing at the cost of some sanity. Each point of alchemical energy converted costs 5 sanity.\n\nSanity usually does not recover over time. Its main sources of recovery are killing enemies, discovering hidden secrets, and eating.\n\nCurrent sanity: _%s_/100
actors.buffs.reason.half=You feel a little dizzy, but it is no great problem.
actors.buffs.reason.quarter=Your head is splitting, and your sanity wavers.
actors.buffs.reason.zero=You are on the edge of madness!
actors.buffs.reason.kaoyan=Your mind is being tested...
actors.buffs.reason.energize_name=Extract Energy
actors.buffs.reason.energize_desc=You can refine certain items to convert them into alchemical energy, including potions, scrolls, seeds, runestones, and other alchemy-related items.\n\nYou can also spend some sanity to convert it into the alchemical energy you need. Usually, each point of alchemical energy converted costs 5 sanity.\n\nCurrent sanity: _%s_/100
actors.buffs.reason.energize_item=Choose an item to refine
actors.buffs.reason.energize_1=Spend 5 sanity to convert into 1 energy
actors.buffs.reason.die=You died of mental collapse...
actors.blobs.reason.rankings_desc=Mental collapse
actors.buffs.suffering.name=suffering
actors.buffs.suffering.desc=Gained suffering: %s
actors.buffs.suffering$fear.name=suffering: fear
actors.buffs.suffering$fear.desc=Cowardice and timidity have finally seized their prey.\n\nDuring this suffering, your evasion is increased by 50%%, but physical damage dealt is reduced by 25%%.\n\nIf you are unfortunately hit by an enemy, there is also a 30%% chance to lose an additional 5 sanity.\n\nThis suffering lasts 300 turns. Killing enemies removes it faster.\n\nTurns remaining: %s
actors.buffs.suffering$paranoia.name=suffering: paranoia
actors.buffs.suffering$paranoia.desc=Sometimes madness brings sudden enlightenment, but such moments are far too rare...\n\nDuring this suffering, your attack speed is increased by 20%%, but accuracy is reduced by 20%%.\n\nIf your attack misses, there is also a 30%% chance to lose an additional 5 sanity.\n\nThis suffering lasts 300 turns. Killing enemies removes it faster.\n\nTurns remaining: %s
actors.buffs.suffering$despair.name=suffering: despair
actors.buffs.suffering$despair.desc=There is no hope in this hell, not even the smallest shred of it.\n\nDuring this suffering, your movement speed is increased by 20%%, but you cannot dodge any attacks.\n\nThis suffering lasts 300 turns. Killing enemies removes it faster.\n\nTurns remaining: %s
actors.buffs.panic.name=panic
actors.buffs.panic.desc=Withering panic devours the mind!\n\nAttacks from undead and demon enemies not only directly wear down your sanity, but may also plunge you into unprecedented fear. While panicking, you lose 1-2 sanity each turn.\n\nYou still need %s turns to dispel this fear...
actors.buffs.panic.get=You feel unprecedented fear!

# Custom talent text translated from actors_zh.properties
actors.hero.talent.aquatic_recover.title=Aquatic Recover
actors.hero.talent.aquatic_recover.desc=_+1: _Recover _1 life_ every _10 turns_ in water.\n\n_+2: _Recover _1 life_ every _5 turns_ in water.\n\nIf the hero does not level up for a long time, this talent will gradually stop recovering.
actors.hero.talent.pump_attack.title=Pump Attack
actors.hero.talent.pump_attack.desc=_+1: _Melee attacks have a _20% chance of causing _2x damage_.\n\n_+2: _Melee attacks have a _20% chance of _causing _3x damage_.
actors.hero.talent.pump_attack.glog=This blow accumulates a lot of power and causes multiple damage.
actors.hero.talent.ooze_attack.title=Ooze Attack
actors.hero.talent.ooze_attack.desc=_+1: _Melee attacks have a _50% probability_ of causing _15 turns of sludge_effect and _10 points of delayed damage_.\n\n_+2: _Melee attacks have a _75% chance of causing _15 turns of sludge_effect and _10 points of delayed damage_.
actors.hero.talent.surprise_throw.title=Surprise Throw
actors.hero.talent.surprise_throw.desc=_+1: _Throwing a thrown weapon at the target after moving does not consume turns and causes an additional _20% damage_, but the accuracy is reduced by _50%_.\n\n_+2: _On the basis of +1, the damage increase is increased from 20% to _40%_.\n\nThis talent only takes effect when aiming at the target, and special throwing weapons such as psionic bows also take effect, but the damage will not be increased.\n\n"The essence is to build wrist strength and move through the recoil when throwing."
actors.hero.talent.smoke_mask.title=Smoke Mask
actors.hero.talent.smoke_mask.desc=_+1: _Acquire a special ability that can release _100 units_ of _smoke gas_ centered on itself.\n\n_+2: _Acquire a special ability that can release _150 units_ of _smoke gas_ centered on itself.\n\nThe special ability obtained by this talent has a 25-round cooldown.
actors.hero.talent$smokecooldown.name=Smoke Cooldown
actors.hero.talent$smokecooldown.desc=You have just activated this ability and need to wait before you can activate it again.\n\nRemaining cooldown: __PH0__ turns
actors.hero.talent$smokemask.name=Smoke Mask
actors.hero.talent$smokemask.desc=This is the ninjutsu Tengu learned in the ninja village, but for some reason he failed to use it in the battle with him. Perhaps he forgot most of his ninjutsu due to being corrupted by dark magic. You should be grateful for this.\n\nYou can release smoke to cover yourself and your allies without expending a turn.
actors.hero.talent$smokemask.action_name=Smoke Mask
actors.hero.talent.rush.title=Rush
actors.hero.talent.rush.desc=_+1: Movement speed increased by 50%_.\n\n_+2: Movement speed increased by 75%_.
actors.hero.talent.overload_charge.title=Overload Charge
actors.hero.talent.overload_charge.desc=_+1: During the charging effect of the staff or artifact_, the hero's movement speed is increased by 50%_, and the melee attack damage is increased by 30%_.\n\n_+2: During the charging effect of the staff or artifact, the hero's movement speed is increased by 75%, and the melee attack damage is increased by 50%.\n\nTalent type: _Special effects_.\n\n"Warning! Warning!"
actors.hero.talent.gas_spurt.title=Gas Spurt
actors.hero.talent.gas_spurt.desc=_+1: _A staff or wand that casts a spell emits a small amount of _poisonous gas_ at the target.\n\n_+2: _A staff or wand that casts a spell will emit a small amount of _acidic gas_ at the target.\n\nThis talent has a 15-turn cooldown.\n\nTalent type: _Spell Damage_.\n\n"This magical ability originated primarily from the dwarven mine explorers' research into out-of-control dwarven machinery."

actors.hero.talent.boss_talent_slot_1.title=Boss talent slot
actors.hero.talent.boss_talent_slot_1.desc=This slot is reserved for a boss talent.\n\nAfter reading the matching _scroll of sublimation_, this blank slot will be replaced with the boss talent you choose.\n\nThis blank slot cannot be upgraded or metamorphed.

actors.hero.talent.boss_talent_slot_2.title=Boss talent slot
actors.hero.talent.boss_talent_slot_2.desc=This slot is reserved for a boss talent.\n\nAfter reading the matching _scroll of sublimation_, this blank slot will be replaced with the boss talent you choose.\n\nThis blank slot cannot be upgraded or metamorphed.

actors.hero.talent.boss_talent_slot_3.title=Boss talent slot
actors.hero.talent.boss_talent_slot_3.desc=This slot is reserved for a boss talent.\n\nAfter reading the matching _scroll of sublimation_, this blank slot will be replaced with the boss talent you choose.\n\nThis blank slot cannot be upgraded or metamorphed.

actors.hero.talent.boss_talent_slot_4.title=Boss talent slot
actors.hero.talent.boss_talent_slot_4.desc=This slot is reserved for a boss talent.\n\nAfter reading the matching _scroll of sublimation_, this blank slot will be replaced with the boss talent you choose.\n\nThis blank slot cannot be upgraded or metamorphed.

actors.hero.talent.boss_talent_slot_5.title=Boss talent slot
actors.hero.talent.boss_talent_slot_5.desc=This slot is reserved for a boss talent.\n\nAfter reading the matching _scroll of sublimation_, this blank slot will be replaced with the boss talent you choose.\n\nThis blank slot cannot be upgraded or metamorphed.
actors.hero.talent$gascooldown.name=Gas Cooldown
actors.hero.talent$gascooldown.desc=You have just activated this talent, you need to wait a moment before you can activate it again.\n\nRemaining cooldown: __PH0__ turns
actors.hero.talent.king_protect.title=King Protect
actors.hero.talent.king_protect.desc=_+1: _When receiving damage, there is a _75% probability_ of converting the damage into _delayed damage_.\n\n_+2: _When taking damage_must_convert the damage into _delayed damage_.
actors.hero.talent.summon_follower.title=Summon Follower
actors.hero.talent.summon_follower.desc=_+1: _Use the Armor skill to _summon up to 1 Sink Warlock or Sink Monk_.\n\n_+2: _Use the Armor skill to summon up to 2 Sink Warlocks or Sink Monks_.
actors.hero.talent.wolfish_gaze.title=Wolfish Gaze
actors.hero.talent.wolfish_gaze.desc=_+1: _Accuracy increased to _4 times_ the original.\n\n_+2: _Attack_must_hit.
actors.hero.talent.fasting.title=Fasting
actors.hero.talent.fasting.desc=_+1: When the health is full_, the satiety consumption caused by any action is -1.\n\n_+2: When the health value is higher than 80%_, the satiety consumption caused by any action is -1.
actors.hero.talent.strong_attack.title=Strong Attack
actors.hero.talent.strong_attack.desc=_+1: _Melee attacking enemies will inflict _vulnerability for 3 turns_.\n\n_+2: _Melee attacking enemies will inflict _vulnerability for 5 turns_.\n\nTalent type: _physical attack type_.\n\nThis talent has a 15-turn cooldown.\n\n"The first talent of transformation breaks the Jackal Warlock's monopoly on vulnerability."
actors.hero.talent$stratkcooldown.name=Strong Attack Cooldown
actors.hero.talent$stratkcooldown.desc=You have just activated this talent, you need to wait a moment before you can activate it again.\n\nRemaining cooldown: __PH0__ turns
actors.hero.talent.survival_volition.title=Survival Volition
actors.hero.talent.survival_volition.desc=_+1: When the health value is lower than 30%, _50% damage resistance, extreme speed, and comprehensive purification for 2 turns_ will be obtained after being hit.\n\n_+2: When the health value is lower than 30%, _50% damage resistance, extreme speed, and comprehensive purification for 3 rounds_ will be obtained after being hit.\n\nTalent type: _Special effects_.\n\nThis talent has an 80-turn cooldown.\n\n"Hehe, I must survive."
actors.hero.talent$survolcooldown.name=Survival Volition Cooldown
actors.hero.talent$survolcooldown.desc=You have just activated this talent, you need to wait a moment before you can activate it again.\n\nRemaining cooldown: __PH0__ turns
actors.hero.talent.trap_master.title=Trap Master
actors.hero.talent.trap_master.desc=_+1: _When using the trap crystal pillar, there is a _66% probability of recovering itself_.\n\n_+2: _When using a trap crystal pillar, there is a _75% probability of recovering itself_.\n\n_+3: _When using a trap crystal pillar, there is an _80% probability of recovering itself_.\n\nTalent type: _Resource type_.\n\nUpgrading this talent will give you an additional _1 Trap Crystal Pillar_.\n\nThis kind of talent sharing that directly obtains corresponding resources through upgrading or transformation has a limit of 26 triggers (for gentlemen, 39 times).
actors.hero.talent.strong_throw.title=Strong Throw
actors.hero.talent.strong_throw.desc=_+1: _Throwing a melee weapon causes _2 times the weapon level_ damage to the enemy.\n\n_+2: _Throwing a melee weapon causes _4 times the weapon level_ damage to the enemy.\n\nTalent type: _physical attack type_.\n\n"Flying Sword Boomerang!"
actors.hero.talent.counter_attack.title=Counter Attack
actors.hero.talent.counter_attack.desc=_+1: _When receiving a melee attack, there is a _20% chance of causing a counterattack 0.5 times the hero level_.\n\n_+2: _When receiving a melee attack, there is a _35% chance of causing a counterattack 0.5 times the hero level_.\n\n_+3: _When receiving a melee attack, there is a _50% chance of causing a counterattack 0.5 times the hero level_.\n\nTalent type: _physical attack type_.
actors.hero.talent.fear_incarnation.title=Fear Incarnation
actors.hero.talent.fear_incarnation.desc=_+1: _Attack an enemy in _fear state_ to cause an additional _3 points of damage_.\n\n_+2: _Attack an enemy in _fear state_ to cause an additional _5 points of damage_.\n\nTalent type: _physical attack type_.\n\n"Hit the enemy head-on when they are timid."
actors.hero.talent.behest.title=Behest
actors.hero.talent.behest.desc=_+1: _When an ally dies, grant the hero _5 turns of Hormone Surge_.\n\n_+2: _When an ally dies, grant the hero _10 turns of Hormone Surge_.\n\n_+3: _When an ally dies, grant the hero _15 turns of Hormone Surge_.\n\nTalent type: _auxiliary_.\n\nThis talent does not work on corrupted, corrupted, or enemies that have sacrificed their lives for you.
actors.hero.talent.burning_curse.title=Burning Curse
actors.hero.talent.burning_curse.desc=_+1: _Using a staff or wand to cast a spell to attack an enemy in a _burning state_ will cause an additional _2 turns of disability_.\n\n_+2: _Using a staff or wand to cast spells against an enemy in a _burning state_ will cause an additional _2 turns of maiming_ and _2 turns of blindness_.\n\nTalent type: _Spell Damage_.\n\n"Lesson 1 of Fire Magic: Be respectful of fire."
actors.hero.talent.invisibility_shadows.title=Invisibility Shadows
actors.hero.talent.invisibility_shadows.desc=After upgrading this talent, a mirror image will be generated when the hero obtains shadow escape or invisibility through shadow cloak, invisibility potion, etc.\n\n_+1: _This talent _has a 40-turn cooldown_.\n\n_+2: _This talent _has a 30-turn cooldown_.\n\nTalent type: _Resource type_.\n\n"It's not the Shadow Army."
actors.hero.talent$invshacooldown.name=Invisible Shadow Cooldown
actors.hero.talent$invshacooldown.desc=You have just activated this talent, you need to wait a moment before you can activate it again.\n\nRemaining cooldown: __PH0__ turns
actors.hero.talent.justice_punish.title=Justice Punish
actors.hero.talent.justice_punish.desc=_+1:_Physical Attack_Undead and Demonic Attributes_Enemies deal an additional _20% damage_, kill them to get _1 turn of blessing_.\n\n_+2:_Physical Attack_Undead and Demonic Attributes_Enemies deal an additional _30% damage_, kill them to get _2 turns of blessing_.\n\nTalent type: _physical attack type_.\n\n_Undead attributes_Enemies include wraiths, cursed spirits, skeletons, crazy thieves, crazy bandits, prison guards, necromancers, ghost wizards, dwarf corpses, dwarf warlocks, dwarf monks, monk masters, dwarf kings, grand magister Timur and monk masters.\n\n_Demon Attributes_ Enemies include Mimics, Gold Mimics, Crystal Mimics, Ebony Mimics, Metamorph Mimics, Rotten Rats, Googu, Demon Bloodhive, Succubi, Evil Eyes, Scorpions, Acid Scorpions, Elder God Larvae, Burn/Earth/Rot/Rust/Glory/Shadowfists, Yog-Dzewa, Nurgle/Tzeentch/Khorne/Slaanesh Disciples, and Archdaemons.\n\nDemonic Ripper has both undead and demonic properties, but this talent does not double as a result.\n\n"I will hunt you to the end of hell."
actors.hero.talent.overwhelming.title=Overwhelming
actors.hero.talent.overwhelming.desc=After upgrading this talent, the hero can benefit from a slower attack speed.\n\n_+1: _The part of the attack that takes more than 1 turn will be _0.33x_ added to the damage and _0.5x_ added to the accuracy.\n\n_+2: _The part of the attack that takes more than 1 turn will be _0.66x_ added to the damage and _1x_ added to the accuracy.\n\n_+2: _The part of the attack that takes more than 1 turn will be _1x_ added to the damage and _1.5x_ added to the accuracy.\n\nTalent type: _physical attack type_.\n\nPowerful power from _Carrot Dungeon_!
actors.hero.talent.energy_conversion.title=Energy Conversion
actors.hero.talent.energy_conversion.desc=_+1: _Artifacts, staffs, armor skills, and martial arts charges become _0.5 times the movement speed_, and will not be lower than the original rate.\n\n_+2: _Artifacts, staffs, armor skills, and martial skill charges become _1.0 times the movement speed_, and will not be lower than the original rate.\n\nPowerful power from _Carrot Dungeon_!
actors.hero.talent.magic_recycling.title=Magic Recycling
actors.hero.talent.magic_recycling.desc=_+1: _There is a _10% chance of casting a spell with a staff or wand without consuming a charge.\n\n_+2: _15% chance to cast a spell with a staff or wand without consuming a charge.\n\n_+3: _There is a _20% chance of casting a spell with a staff or wand without consuming a charge.\n\nTalent type: _Spell Damage_.
actors.hero.talent.precious_experience.title=Precious Experience
actors.hero.talent.precious_experience.desc=_+1: _Drinking experience potion or divine inspiration mixture to gain an additional _half-level experience_.\n\n_+2: _On the basis of +1, additional _50 turns of blessing_ effect will be obtained.\n\nTalent type: _Resource type_.\n\n"This experience is very valuable."
actors.hero.talent.disturb_attack.title=Disturb Attack
actors.hero.talent.disturb_attack.desc=_+1: _Physical attack on the enemy has a _10% probability of causing _3 turns of stun_.\n\n_+2: _Physical attack on the enemy has a _20% probability of causing _3 turns of stun_.\n\nTalent type: _physical attack type_.\n\n"Actually, hallucinogenic liquid was applied to the weapon."
actors.hero.talent.gholl_witchcraft.title=Gholl Witchcraft
actors.hero.talent.gholl_witchcraft.desc=_+1: _Attack the enemy in the _hit state_ to cause _1 round of illusion_.\n\n_+2: _Attack the enemy in _hit state_ to cause _2 turns of illusion_.\n\nTalent type: _physical attack type_.\n\n"A poor reproduction of the witchcraft used by the Gnolls by humans."
actors.hero.talent.engineer_refit.title=Engineer Refit
actors.hero.talent.engineer_refit.desc=_+1: _Killing a _mechanical_ enemy has a _12.5% ​​probability_ of being modified into DM-100 and corrupted.\n\n_+2: _Killing a _mechanical_ enemy has a _25% probability_ of being modified into DM-100 and corrupted.\n\nTalent type: _Other types_.\n\nIf DM-400 obtains this talent, there is a chance that the drone will be modified into DM-100 and become corrupted when it is damaged.\n\n_Mechanical_Enemies include living stone statues, summoned guards, armored stone statues, DM-100, DM-200, DM-201, energy towers, DM-300, golems and golden golems.\n\n"Do you know anything about mechanical engineering?"
actors.hero.talent.weird_throw.title=Weird Throw
actors.hero.talent.weird_throw.desc=_+1: _Throwing a non-thrown weapon at an enemy causes _1 turn of fear_.\n\n_+2: _Throwing a non-thrown weapon at an enemy causes _2 turns of fear_.\n\nTalent type: _physical attack type_.\n\n"It's scary not knowing what the other side is going to throw at you."
actors.hero.talent.thrid_hand.title=Third Hand
actors.hero.talent.thrid_hand.desc=_+1: _There is a _10% probability_ of purchasing items without consuming gold coins.\n\n_+2: _There is a _20% probability_ of purchasing items without consuming gold coins.\n\nTalent type: _Resource type_.\n\n"I'll just pack the rations."
actors.hero.talent.thrid_hand.steal=You picked up this item while the boss wasn't paying attention.
actors.hero.talent.water_attack.title=Water Attack
actors.hero.talent.water_attack.desc=_+1: _The hero will deal _1 additional point of damage_ while in water.\n\n_+2: _The hero will deal _2 additional points of damage_ while in water.\n\nTalent type: _physical attack type_.\n\n"Come on water, come on water."
actors.hero.talent.more_chance.title=More Chance
actors.hero.talent.more_chance.desc=_+1: _Using transformation scrolls and transformation crystals has a _10% chance of not being consumed_.\n\n_+2: _Using transformation scrolls and transformation crystals has a _20% chance of not being consumed_.\n\nTalent type: _Resource type_.\n\n"Promise me, keep betting."
actors.hero.talent.amazing_eyesight.title=Amazing Eyesight
actors.hero.talent.amazing_eyesight.desc=_+1: _Melee damage to enemies _3 blocks and beyond_ is increased by _35%_, and accuracy is increased by _35%_.\n\n_+2: _Melee damage to enemies _2 blocks and beyond_ is increased by _35%_, and accuracy is increased by _35%_.\n\nTalent type: _physical attack type_.\n\n"Every inch is stronger."
actors.hero.talent.light_application.title=Light Application
actors.hero.talent.light_application.desc=_+1: _Basic dodge increased by _5-armor level_.\n\n_+2: _On the basis of +1, the effect is _double_.\n\nTalent type: _auxiliary_.\n\nInvalid without armor.\n\n"It's actually a seduction technique."
actors.hero.talent.heavy_application.title=Heavy Application
actors.hero.talent.heavy_application.desc=_+1: _Maximum armor increased by _armor level_.\n\n_+2: _On the basis of +1, the effect is _double_.\n\nTalent type: _auxiliary_.\n\nInvalid without armor.\n\n"It's not just a pad of book."
actors.hero.talent.bless_meal.title=Bless Meal
actors.hero.talent.bless_meal.desc=_+1: _Eating only takes 1 turn, and obtains the _25-turn blessing_ effect.\n\n_+2: _Eating only takes 1 turn, and gets _35 turns of blessing_ effect.\n\nTalent type: _Special effects_.\n\n"Thank you Lord for giving us food and clothing."
actors.hero.talent.bomb_maniac.title=Bomb Maniac
actors.hero.talent.bomb_maniac.desc=_+1: _Bomb_damage increased by 25%_.\n\n_+2: _Bomb_damage increased by 50%_.\n\nTalent type: _auxiliary_.\n\nUpgrading this talent will grant you an additional _1 bomb_.\n\nThere is no limit to the number of times you can directly obtain resources by upgrading or transforming this talent.\n\n"Art is explosion."
actors.hero.talent.phantom_shooter.title=Phantom Shooter
actors.hero.talent.phantom_shooter.desc=_+1: _When using a thrown weapon, an additional phantom thrown weapon is thrown, causing _10% of thrown weapon damage_.\n\n_+2: _When using a thrown weapon, an additional phantom thrown weapon is thrown, causing _20% of thrown weapon damage_.\n\n_+3: _When using a thrown weapon, an additional phantom thrown weapon is thrown, causing _30% of thrown weapon damage_.\n\nTalent type: _physical attack type_.
actors.hero.talent.wake_snake.title=Wake Snake
actors.hero.talent.wake_snake.desc=_+1: _Other creatures stepping on tall grass have a _10% chance of spawning a corrupted giant snake_.\n\n_+2: _Other creatures stepping on tall grass have a _20% chance of spawning a corrupted giant snake_.\n\nTalent type: _Other types_.\n\n"Good news for snake phobias."
actors.hero.talent.collection_gold.title=Collection Gold
actors.hero.talent.collection_gold.desc=_+1: _Add _1 shield_ whenever a gold coin is picked up.\n\n_+2: _Add _2 shield points_ whenever a gold coin is picked up.\n\nTalent type: _Special effects_.\n\n"Full of copper odor."
actors.hero.talent.martial_train.title=Martial Train
actors.hero.talent.martial_train.desc=_+1:_ Heroes without weapon abilities gain access to them with a charge cap of _2_.\n\n_+2:_ Heroes without weapon abilities gain access to them with a charge cap of _3_.\n\n_+3:_ Heroes without weapon abilities gain access to them with a charge cap of _4_.\n\nWhen this talent is the hero's only source of weapon abilities, one charge regenerates every _90 turns_.\n\nIf the hero can already use weapon abilities, this talent only increases the charge cap by _1/2/3_ at _+1/+2/+3_.
actors.hero.talent.thickened_armor.title=Thickened Armor
actors.hero.talent.thickened_armor.desc=_+1: _Maximum armor provided by armor +1_.\n\n_+2: _Maximum armor provided by armor +2_.\n\nInvalid without armor.\n\nTalent type: _auxiliary_.\n\n"I just put a book on my chest."
actors.hero.talent.powerful_calculations.title=Powerful Calculations
actors.hero.talent.powerful_calculations.desc=_+1: _Whenever a character dies out of sight, the hero will regain _1 life_.\n\n_+2: _Whenever a character dies out of sight, the hero will regain _2 HP_.\n\nTalent type: _Special effects_.\n\n"Your next sentence is..."
actors.hero.talent.insert_bid.title=Insert Bid
actors.hero.talent.insert_bid.desc=_+1: _Accuracy against enemies in the _hit state_ is increased by 20%_.\n\n_+2: _Accuracy against enemies in the _hit state_ is increased by 40%_.\n\nTalent type: _Special effects_.\n\n"You're like a hedgehog, do you think I can't hit you?"
actors.hero.talent.meal_shield.title=Meal Shield
actors.hero.talent.meal_shield.desc=_+1: _Eating restores _4 shield points_.\n\n_+2: _Eating restores _8 shield points_.\n\nTalent type: _Special effects_.\n\n"I'm full."
actors.hero.talent.drop_resistant.title=Drop Resistant
actors.hero.talent.drop_resistant.desc=_+1: _Fall_no longer crippled_.\n\n_+2: _Fall_No more bleeding and maiming_.\n\nTalent type: _auxiliary_.\n\n"Little black plane, only 824 yuan!"
actors.hero.talent.strength_train.title=Strength Train
actors.hero.talent.strength_train.desc=_+1: _No effect.\n\n_+2: _Gain an additional _1 point of Strength_.\n\nTalent type: _auxiliary_.\n\n"Refer to the One Punch Man training method."
actors.hero.talent.treat_meal.title=Treat Meal
actors.hero.talent.treat_meal.desc=_+1: _Eating slowly restores _3 points of life_.\n\n_+2: _Eating slowly restores _5 points of life_.\n\nTalent type: _Special effects_.\n\n"Nutritious meals."
actors.hero.talent.cover_scar.title=Cover Scar
actors.hero.talent.cover_scar.desc=_+1: _Melee attacks will inflict _original 1 bleed_.\n\n_+2: _Melee attacks will inflict _original 2 bleed_.\n\nTalent type: _physical attack type_.\n\n"Put the dagger hard into its chest."
actors.hero.talent.nurtritious_meal.title=Nutritious Meal
actors.hero.talent.nurtritious_meal.desc=_+1: _Eating restores _2 health_ and provides _2 shields_.\n\n_+2: _Eating restores _4 health_ and provides _4 shields_.\n\nTalent type: _Special effects_.\n\n"Eat nutritious meals until you are full."
actors.hero.talent.rage_attack.title=Rage Attack
actors.hero.talent.rage_attack.desc=_+1: _The physical attack caused by the hero and the damage received _increase by 10%_.\n\n_+2: _The physical attack caused by the hero and the damage received _increase by 20%_.\n\n_+3: _The physical attack caused by the hero and the damage received are increased by 30%_.\n\nTalent type: _physical attack type_.
actors.hero.talent.military_waterskin.title=Military Waterskin
actors.hero.talent.military_waterskin.desc=_+1: _The water bag can collect an additional _15 dew points_.\n\n_+2: _The water bag can collect an additional _30 dew points_.\n\nTalent type: _Resource type_.\n\n"This is the big water bag."
actors.hero.talent.jasmine_tea.title=Jasmine Tea
actors.hero.talent.jasmine_tea.desc=_+1: _The dewdrops in the drinking water bag will receive _3 turns of blessing_.\n\n_+2: _The dewdrops in the drinking water bag will receive _5 turns of blessing_.\n\nTalent type: _Special effects_.\n\n"It feels...not as good as iced tea."
actors.hero.talent.god_lefthand.title=God Lefthand
actors.hero.talent.god_lefthand.desc=_+1: _The talent _Right Hand of God +1_ can only take effect when you have this talent +1.\n\n_+2: _The talent _Right Hand of God +2_ can only take effect when you have this talent +2.\n\nTalent type: _auxiliary_.\n\n"The left fist didn't hurt."
actors.hero.talent.god_righthand.title=God Righthand
actors.hero.talent.god_righthand.desc=_+1: _Physical attack damage increased by _30%_, it can only take effect if you have the talent _Left Hand of God +1_.\n\n_+2: _Physical attack damage increased by _60%_, it can only take effect if you have the talent _Left Hand of God +2_.\n\nTalent type: _auxiliary_.\n\n"The right fist does high damage."
actors.hero.talent.gold_formation.title=Gold Formation
actors.hero.talent.gold_formation.desc=_+1: _When the hero picks up gold coins, if the gold coins in the backpack are higher than 500, _500 gold coins will be automatically consumed and _1 low-level drop_ will be triggered next to it.\n\n_+2: _When the hero picks up gold coins, if the gold coins in the backpack are higher than 1000, _1000 gold coins will be automatically consumed and _1 intermediate drop_ will be triggered next to it.\n\n_+3: _When the hero picks up gold coins, if the gold coins in the backpack are higher than 2000, _2000 gold coins will be automatically consumed and _1 advanced drop_ will be triggered next to it.\n\nTalent type: _Resource type_.
actors.hero.talent.strengthen_chain.title=Strengthen Chain
actors.hero.talent.strengthen_chain.desc=_+1: _When Void Chain pulls the enemy closer, give the enemy _10 turns of disability_.\n\n_+2: _On the basis of +1, it no longer consumes turns to bring the enemy closer, Void Chain _charge consumption -1_ (the minimum consumption per time is not less than 1 point of charge, this talent _does not change the charge threshold_ when used).\n\nTalent type: _spell_.\n\n"Come here!"
actors.hero.talent.strengthen_chalice.title=Strengthen Chalice
actors.hero.talent.strengthen_chalice.desc=_+1: _The life recovery effect given by the Blood Accumulation Holy Grail is enhanced by 50%_.\n\n_+2: _The life recovery effect given by the Blood Accumulation Holy Grail is enhanced by 100%_.\n\nTalent type: _spell_.\n\n"The power has been regained."
actors.hero.talent.savage_physique.title=Savage Physique
actors.hero.talent.savage_physique.desc=_+1: _The maximum health value is increased by _10 points_.\n\n_+2: _The maximum health value is increased by _15 points_.\n\nTalent type: _auxiliary_.\n\n"Strengthen your muscles and bones, strengthen your body and skin."
actors.hero.talent.ice_breaking.title=Ice Breaking
actors.hero.talent.ice_breaking.desc=_+1: _When the target is _Frostbite_, physical attacks cause an additional _1 point of magic damage_.\n\n_+2: _When the target is _Frostbite_, physical attacks cause an additional _2 points of magic damage_.\n\nTalent type: _Spell Damage_.\n\nThis talent can enhance the effect of the talent _Extreme Cold +3_.\n\n"I'm super! Ice!!!"
actors.hero.talent.burning_blood.title=Burning Blood
actors.hero.talent.burning_blood.desc=_+1: _When an enemy dies, the hero regains _1 life_.\n\n_+2: _When an enemy dies, the hero regains _2 points of life_.\n\nTalent type: _auxiliary_.\n\n"Stop draining the pig's blood, okay?"
actors.hero.talent.strength_greatest.title=Strength Greatest
actors.hero.talent.strength_greatest.desc=_+1: _Thrown weapons cause an additional _1 point of damage_, and psychic bows cause an additional _0~1 point of damage_.\n\n_+2: _Thrown weapons cause an additional _2 points of damage_, and psychic bows cause an additional _0~2 points of damage_.\n\nTalent type: _physical attack type_.\n\n"The arrow passes through the solid stone, and the three armies are strong!"
actors.hero.talent.accumulate_steadily.title=Accumulate Steadily
actors.hero.talent.accumulate_steadily.desc=_+1: _No effect.\n\n_+2: _No effect.\n\n_+3: Attack distance +1_.\n\nTalent type: _physical attack type_.
actors.hero.talent.get_up.title=Get Up
actors.hero.talent.get_up.desc=_+1: _Taking damage while sleeping will grant _3 turns of Hormone Surge_.\n\n_+2: _Taking damage while sleeping will grant _5 turns of Hormone Surge_.\n\nTalent type: _Special effects_.\n\n"Never allow the peace of this moment to be disturbed!"
actors.hero.talent$nosleep.name=Nosleep
actors.hero.talent$nosleep.desc=After taking a nap, he will get angry if he is disturbed.
actors.hero.talent.more_talent.title=More Talent
actors.hero.talent.more_talent.desc=_+1: _When using the Transformation Scroll, there is a _50% chance of _adding _1 optional_ option.\n\n_+2: _When using the Scroll of Transformation, _one option_must be added.\n\nTalent type: _Resource type_.\n\n"All roads lead to Rome."
actors.hero.talent.giant_killer.title=Giant Killer
actors.hero.talent.giant_killer.desc=_+1: _Physical attacks against enemies with _giant attribute_ will cause an additional _35% damage_.\n\n_+2: _Physical attacks against enemies with _giant attribute_ will cause an additional _70% damage_.\n\nTalent type: _physical attack type_.\n\n_Giant attribute_ Enemies include DM-200, DM-201, DM-300, Golem, Rusty Fist, Golden Golem and giant elite enemies.\n\n"Drive them all out!"
actors.hero.talent.want_all.title=Want All
actors.hero.talent.want_all.desc=_+1: _Crystal treasure room and crystal road room generate _1 more crystal key_.\n\n_+2: _On the basis of +1, the crystal selection room generates _1 more crystal key_.\n\nTalent type: _Resource type_.\n\nThe crystal treasure room allows you to choose one of two pieces of equipment, the crystal road room allows you to choose three of six consumables, and the crystal selection room allows you to choose one of equipment and consumables.\n\n"Children make choices, I want them all."\n"Skull Key: Please enter text."
actors.hero.talent.vegetarianism.title=Vegetarianism
actors.hero.talent.vegetarianism.desc=_+1:_Eating non-meat food will gain the _satisfaction effect_, and eating meat food will _restore satiety by 30%_.\n\n_+2: _Eating non-meat food will gain _satisfaction effect and restore a small amount of life_, and consuming meat food will _restore satiety by 30%_.\n\nTalent type: _Special effects_.\n\nOnly berries, tasteless fruits, tasteless fruit pieces, small rations, and spare rations do not have meat descriptions, so only these five types of food are considered non-meat foods.\n\n"If you must eat meat, Wattasi!"\n"I've never felt happy eating meat..."
actors.hero.talent.word_stun.title=Word Stun
actors.hero.talent.word_stun.desc=_+1: _When throwing a scroll at an enemy, grant _2 turns of paralysis_.\n\n_+2: _When throwing a scroll at an enemy, grant _3 turns of paralysis_.\n\nTalent type: _Special effects_.\n\nThis talent has a 50-round cooldown.\n\n"It's not just a piece of paper."
actors.hero.talent$wordstuncooldown.name=Word Stun Cooldown
actors.hero.talent$wordstuncooldown.desc=You have just activated this talent, you need to wait a moment before you can activate it again.\n\nRemaining cooldown: __PH0__ turns
actors.hero.talent.novice_benefits.title=Novice Benefits
actors.hero.talent.novice_benefits.desc=_+1: _Get _1 Transformation Scroll_ immediately.\n\n_+2: _Get _1 Transformation Scroll_ immediately.\n\nTalent type: _Resource type_.\n\nThis kind of talent sharing that directly obtains corresponding resources through upgrading or transformation has a limit of 26 triggers (for gentlemen, 39 times).\n\n"This is your card draw guarantee."
actors.hero.talent.double_trinkets.title=Double Trinkets
actors.hero.talent.double_trinkets.desc=_+1: _Get _1 Magic Catalyst_.\n\n_+2: _No effect.\n\n_+3: _No effect.\n\nTalent type: _Resource type_.\n\nThis kind of talent sharing that directly obtains corresponding resources through upgrading or transformation has a limit of 26 triggers (for gentlemen, 39 times).\n\nNote that the effects of the same ornaments will not overlap.\n\n"Components and moss cannot have both, because only one of the judgments takes effect."
actors.hero.talent.fishing_time.title=Fishing Time
actors.hero.talent.fishing_time.desc=_+1: _Increases damage to _fish_enemies by _30%_.\n\n_+2: _On the basis of +1, it can _prevent the phantom piranha from teleporting_, and _add a giant piranha to be generated_ in the pool room. The generated giant piranha will be affected by the negative talent _Land Travel_.\n\nTalent type: _Other types_.\n\n_Fish_ Enemies include Giant Piranha, Phantom Piranha, Giant Land Piranha and Phantom Land Piranha.\n\n"This is a talent that I came up with when I was fishing."
actors.hero.talent.posion_dagger.title=Poison Dagger
actors.hero.talent.posion_dagger.desc=_+1: Dagger-type weapons cause additional _2 turns of poisoning_ in melee combat.\n\n_+2: Dagger-type weapons cause additional _4 turns of poisoning_ in melee combat.\n\nTalent type: _physical attack type_.\n\n_Dagger_ Weapons include Rogue's Dagger, Longdagger, and Assassin's Blade.\n\n"This knife of mine is a poisonous blade coated with poison (lick)..."
actors.hero.talent.invincible_meal.title=Invincible Meal
actors.hero.talent.invincible_meal.desc=_+1: _Eat to gain _2 turns of invincibility_.\n\n_+2: _Eat to gain _3 turns of invincibility_.\n\n_+3: _Eat to gain _4 turns invincibility_.\n\nTalent type: _Special effects_.\n\nThis talent is shared with the talents _Eat Experience_, _Yunyin's Meal_ and _Birthday Gift_ with a 100 trigger limit_.
actors.hero.talent.wellfed_meal.title=Wellfed Meal
actors.hero.talent.wellfed_meal.desc=_+1: _When the hero is in _full state_, the total damage dealt to the enemy is increased by 15%_, and _10% damage reduction_ is obtained.\n\n_+2: _When the hero is in the _full state_, the total damage to the enemy is increased by 30%_, and _20% damage reduction_ is obtained.\n\n_+3: _When the hero is in the _full state_, the total damage dealt to the enemy is increased by 45%_, and _30% damage reduction_ is obtained.\n\nTalent type: _physical attack type_.
actors.hero.talent.shock_bomb.title=Shock Bomb
actors.hero.talent.shock_bomb.desc=_+1: _When the bomb explodes, it will cause _1 round of paralysis_ to the creatures in the surrounding 9 blocks.\n\n_+2: _When the bomb explodes, it will cause _2 turns of paralysis_ to the creatures in the surrounding 9 blocks.\n\nTalent type: _Special effects_.\n\nUpgrading this talent will grant you an additional _1 bomb_.\n\nThere is no limit to the number of times you can directly obtain resources by upgrading or transforming this talent.\n\n"Shock bomb."
actors.hero.talent.illusion_feed.title=Illusion Feed
actors.hero.talent.illusion_feed.desc=_+1: _Get _1 pie_ immediately.\n\n_+2: _Get _1 pie_ immediately.\n\nTalent type: _Resource type_.\n\nThis kind of talent sharing that directly obtains corresponding resources through upgrading or transformation has a limit of 26 triggers (for gentlemen, 39 times).\n\n"You are the magic pen Ma Liang."
actors.hero.talent.heavy_burden.title=Heavy Burden
actors.hero.talent.heavy_burden.desc=_+1: _Game Score_x2_.\n\n_+2: _Game Score_x3_.\n\nTalent type: _auxiliary_.\n\n"Become a great master in the field of earning points."
actors.hero.talent.attack_door.title=Attack Door
actors.hero.talent.attack_door.desc=_+1:_When the enemy's grid is an open door, physical attacks will cause an additional _1 point of damage_.\n\n_+2:_When the enemy's grid is an open door, physical attacks will cause an additional _2 points of damage_.\n\nTalent type: _physical attack type_.\n\n"Here is Johnny~"
actors.hero.talent.arrow_penetration.title=Arrow Penetration
actors.hero.talent.arrow_penetration.desc=_+1: _All thrown weapons have the effect of _penetrating walls_, which has an _8-block distance limit_.\n\n_+2: _All thrown weapons have the effect of _penetrating walls_, which has a _12-block distance limit_.\n\nTalent type: _physical attack type_.\n\nIf a hero holding a special throwing weapon such as a psychic bow obtains this talent, the special throwing weapon will also enjoy the bonus of this talent.\n\n"Although I am old, my arrows are still sharp!"
actors.hero.talent.detox_damage.title=Detox Damage
actors.hero.talent.detox_damage.desc=_+1: _When hit, there is a _25% probability_ of obtaining a _1-round comprehensive purification effect_. After obtaining a comprehensive purification effect, there is a _15% probability_ of clearing all debuff effects.\n\n_+2: _When hit, there is a _50% probability_ of obtaining a _1-round comprehensive purification effect_. After obtaining the comprehensive purification effect, there is a _15% probability_ of clearing all debuff effects.\n\n_+3: _When hit, there is a _75% probability_ of obtaining a _1-round comprehensive purification effect_. After obtaining the comprehensive purification effect, there is a _15% probability_ of clearing all debuff effects.\n\nTalent type: _Special effects_.
actors.hero.talent.returning_honor.title=Returning Honor
actors.hero.talent.returning_honor.desc=_+1: _The experience given after the enemy dies is increased by 25%_.\n\n_+2: _The experience given after the enemy dies is increased by 50%_.\n\n_+3: _The experience given after the enemy dies is increased by 75%_.\n\nTalent type: _Resource type_.
actors.hero.talent.zhuojun_butcher.title=Zhuojun Butcher
actors.hero.talent.zhuojun_butcher.desc=_+1: _Kill_biological_enemies_10% probability of getting _an extra piece of mysterious meat_.\n\n_+2: _Kill_biological_enemies_20% probability of _getting _an extra piece of mysterious meat_.\n\nTalent type: _Resource type_.\n\nThe drop of this talent is also limited by the hero level.\n\n_Biological_ enemies only include giant piranha, phantom piranha, giant land piranha, phantom land piranha, golden bee, rodent mouse, albino rat, sewer snake, jackal patrol, sewer crab, fly swarm, slime, vampire bat, jackal thug, heavily armored thug, jackal shaman and mine spider and other enemies without any attributes.\n\n"Why do slimes lose flesh?"\n"Maybe it's an adventurer who hasn't digested it yet."
actors.hero.talent.aid_stomach.title=Aid Stomach
actors.hero.talent.aid_stomach.desc=_+1: _No negative effects_ from eating mysterious meat.\n\n_+2: _On the basis of +1, eating mysterious meat will restore an additional _33% satiety_.\n\nTalent type: _Special effects_.\n\n"Ruth hair and drink blood, eat them alive."
actors.hero.talent.weapon_make.title=Weapon Make
actors.hero.talent.weapon_make.desc=_+1: _Immediately obtain _1 weapon that can be obtained in the third area_.\n\n_+2: _Immediately obtain _1 weapon that can be obtained in the fourth area_.\n\n_+3: _Immediately obtain _1 weapon that can be obtained in the fifth area_.\n\nTalent type: _Resource type_.\n\nThe weapons obtained by this talent will be immediately identified and require -2 strength. Such talents that directly obtain corresponding resources through upgrading or transformation share a 26-time trigger limit (for gentlemen, 39 times).
actors.hero.talent.secret_stash.title=Secret Stash
actors.hero.talent.secret_stash.desc=_+1: _Get _1000 gold coins immediately_.\n\n_+2: _Get _1000 gold coins immediately_.\n\n_+3: _Get _1000 gold coins immediately_.\n\nTalent type: _Resource type_.\n\nThis kind of talent sharing that directly obtains corresponding resources through upgrading or transformation has a limit of 26 triggers (for gentlemen, 39 times).
actors.hero.talent.earth_meal.title=Earth Meal
actors.hero.talent.earth_meal.desc=_+1: _Eating to gain _0~67% of the hero level tree skin_ points that decay once every round.\n\n_+2: _Eating to gain _0~133% of the hero level tree skin_ points that decay once every round.\n\n_+3: _Eating to obtain _0~200% of the hero level tree skin_ points that decay once every round.\n\nTalent type: _Special effects_.
actors.hero.talent.eaten_slowly.title=Eaten Slowly
actors.hero.talent.eaten_slowly.desc=_+1: _Eating_spends an additional 10 turns_, and the satiety level restored by food increases by _30%_.\n\n_+2: _Eating_spends an additional 10 turns_, the satiety level restored by food increases by _60%_, and eating pies will gain an additional _satisfaction_ effect.\n\nTalent type: _Special effects_.\n\nThis talent is ineffective against the Horn of Plenty, and the priority of this talent to extend the feeding round will be higher than any talent that shortens the feeding round.\n\n"It's just pre-dinner red tape."
actors.hero.talent.invincible.title=Invincible
actors.hero.talent.invincible.desc=_+1:_When an enemy dies, the hero gets _2 turns of hormone surge_.\n\n_+2:_When an enemy dies, the hero gets _4 turns of Hormone Surge_.\n\nTalent type: _Special effects_.\n\n"The more you fight, the braver you become."
actors.hero.talent.yog_larva.title=YOG Larva
actors.hero.talent.yog_larva.desc=_+1: _When you receive more than 5 points of damage in a single time, _Summon 1 Ancient God Larva_ to fight for you.\n\n_+2:_When you receive more than 5 points of damage in a single time,_Summon 2 Ancient God Larvae_to fight for you.\n\n_+3: _On the basis of +2, the Ancient God Larva has a _50% probability_ of becoming elite.
actors.hero.talent.yog_fist.title=YOG Fist
actors.hero.talent.yog_fist.desc=After upgrading this talent, you will gain the power of the giant fist when using the artifact. This effect lasts for 5 turns and has a 20-round cooldown.\n\n_+1: _Acquire the power of the Fist of Radiance and Darkness, gain _40 turns of glow_, and physical attacks will cause _5 turns of blindness_.\n\n_+2: _On the basis of +1, gain the power of Burning Fist and gain _10 turns of flaming power_.\n\n_+3: _On the basis of +1 and +2, gain the power of the Earth Fist, gain _0~50% of the hero level points of tree skin_ that decay once every round, and physical attacks will cause _5 turns of entanglement_.
actors.hero.talent$yogfistcooldown.name=YOG Fist Cooldown
actors.hero.talent$yogfistcooldown.desc=You have just activated this talent, you need to wait a moment before you can activate it again.\n\nRemaining cooldown: __PH0__ turns
actors.hero.talent$yogfistpower.name=YOG Fistpower
actors.hero.talent$yogfistpower.desc=You will unleash the power of the Fist of the Ancient God in a short time.\n\nRemaining time: __PH0__ turns
actors.hero.talent.yog_ray.title=YOG Ray
actors.hero.talent.yog_ray.desc=After upgrading this talent, using the staff to cast a spell on the target will release a death ray, which has a 20-round cooldown.\n\n_+1: _Ejects _1 death ray with 40~60 damage_.\n\n_+2: Casting a spell on a single target will emit up to _3 death rays of 40~70 damage_ around it.\n\n_+3: Casting a spell on a single target will emit up to _5 death rays of 40~80 damage_ around it.\n\n"The Dwarf King awakened to the cult of the dead after watching this episode as a child."
actors.hero.talent$yograycooldown.name=Death Ray Cooldown
actors.hero.talent$yograycooldown.desc=You have just activated this talent, you need to wait a moment before you can activate it again.\n\nRemaining cooldown: __PH0__ turns
actors.hero.talent.afraid_death.title=Afraid Death
actors.hero.talent.afraid_death.desc=_+1: _When _health is lower than 30%_, _movement speed increases by 30%_, and _physical damage caused decreases by 50%_.\n\n_+2: _When _health is below 30%_, _movement speed increases by 40%_, and _physical damage caused decreases by 40%_.\n\n_+3: _When _health is below 30%_, _movement speed increases by 50%_, and _physical damage caused decreases by 30%_.\n\nTalent type: _auxiliary_.
actors.hero.talent.pyromaniac.title=Pyromaniac
actors.hero.talent.pyromaniac.desc=_+1: _Obtain _3 bottles of Fire Dragon Breath Mixture_.\n\n_+2: _Obtain _2 bottles of Infernal Potion_.\n\n_+3: _Obtain _1 bottle of dragon blood secret medicine_.\n\nTalent type: _Resource type_.\n\nThis kind of talent sharing that directly obtains corresponding resources through upgrading or transformation has a limit of 26 triggers (for gentlemen, 39 times).
actors.hero.talent.reverse_polarity.title=Reverse Polarity
actors.hero.talent.reverse_polarity.desc=_+1: _Reduce health to _1 point_ when upgrading this talent.\n\n_+2: _Adjust health to _50%_ when upgrading this talent.\n\n_+3:_Restore health to _100%_ when upgrading this talent.\n\nTalent type: _Special effects_.\n\n"What's with that expression of yours, what's with those tears of yours, can your tears save the earth?"
actors.hero.talent.hero_name.title=Hero Name
actors.hero.talent.hero_name.desc=_+1: _Recover _20% extra health_ when upgrading.\n\n_+2: _Recover an additional _40% of health_ when upgrading.\n\n_+3: _Recover an additional _60% of health_ when upgrading.\n\nTalent type: _auxiliary_.
actors.hero.talent.sky_earth.title=Sky Earth
actors.hero.talent.sky_earth.desc=_+1: _When the hero is in _floating, entangled or vegetation armor state_, the damage is increased by _15%_.\n\n_+2: _When the hero is in _floating, entangled or vegetation armor state_, the damage is increased by _30%_.\n\n_+3: _When the hero is in _floating, entangled or vegetation armor state_, the damage is increased by _45%_.\n\nTalent type: _physical attack type_.\n\nNote that after the Warden steps on the Earthbound Root, he no longer gains the vegetation armor effect but the tree skin effect, so he is not affected by this talent.\n\n"The mountains and rivers split when Lingtian became angry, and the clear sky collapsed when he leaned down to the ground."
actors.hero.talent.water_isfood.title=Water Isfood
actors.hero.talent.water_isfood.desc=_+1: _Recover _30 satiety_ when drinking the potion.\n\n_+2: _On the basis of +1, drinking dewdrops in the bag will restore _10 times the satiety level of the dewdrop consumption_.\n\n_+3: _On the basis of +1 and +2, _can trigger eating special effects_.\n\nTalent type: _Special effects_.
actors.hero.talent.delicious_flying.title=Delicious Flying
actors.hero.talent.delicious_flying.desc=_+1: _Eat to gain _15 turns of floating_.\n\n_+2: _Eat to gain _25 turns of floating_.\n\nTalent type: _Special effects_.\n\n"I'll let you fly when you eat!"
actors.hero.talent.angel_stance.title=Angel Stance
actors.hero.talent.angel_stance.desc=_+1: _When the hero is in _glow state_, being attacked will cause _30% magic counterattack_ to the attacker.\n\n_+2: _When the hero is in _glow state_, being attacked will cause _40% magic counterattack_ to the attacker.\n\n_+3: _When the hero is in _glow state_, being attacked will cause _50% magic counterattack_ to the attacker.\n\nTalent type: _Spell Damage_.
actors.hero.talent.thorny_rose.title=Thorny Rose
actors.hero.talent.thorny_rose.desc=_+1: _When the hero is hit, he will apply _original 1 bleed_ to the attacker.\n\n_+2: _On the basis of +1, the hero will also cause _1 point of damage_ to the attacker when hit.\n\nTalent type: _Special effects_.\n\n"She still hasn't replied to you?"
actors.hero.talent.hometown_cloud.title=Hometown Cloud
actors.hero.talent.hometown_cloud.desc=_+1: _Movement speed increases by 20%_ when returning.\n\n_+2: _Movement speed increased by 40%_ when returning.\n\n_+3: _Movement speed increased by 60%_ when returning.\n\nTalent type: _auxiliary_.\n\nIt will take effect if the Yendor Talisman is in the hero's backpack.
actors.hero.talent.deep_freeze.title=Deep Freeze
actors.hero.talent.deep_freeze.desc=_+1: _Weapons with frost enchantment will _increase damage by 20%_.\n\n_+2:_On the basis of +1, physical attacks can cause _frostbite_ effect.\n\n_+3: _On the basis of +1 and +2, it will cause an additional 20% damage_ to enemies in a frostbitten or frozen state. If it has the talent _Ice Breaking Action, it will cause an additional 50% damage_.\n\nTalent type: _physical attack type_.
actors.hero.talent.frenzied_attack.title=Frenzied Attack
actors.hero.talent.frenzied_attack.desc=_+1: _Physical attacks have a _25% chance of causing _2 turns of frenzy_.\n\n_+2: _Physical attacks have a _50% chance of causing _2 turns of frenzy_.\n\nTalent type: _physical attack type_.\n\n"Sweep away fellow Taoists and be yourself."
actors.hero.talent.wulei_zhengfa.title=Wulei Zhengfa
actors.hero.talent.wulei_zhengfa.desc=_+1: _Acquire _1 Thunder Staff_, the hero will no longer be damaged by the electric shock of the Thunder Staff but will _recover a small amount of life_.\n\n_+2: _On the basis of +1, the damage of the Thunder Staff is increased by _30%_.\n\nTalent type: _Spell Damage_.\n\nThis kind of talent sharing that directly obtains corresponding resources through upgrading or transformation has a limit of 26 triggers (for gentlemen, 39 times).\n\n"Increase the power."
actors.hero.talent.magic_girl.title=Magic Girl
actors.hero.talent.magic_girl.desc=_+1: _Use the scroll to obtain _30 turns of camouflage_ effect, and gain _20% staff damage increase_ under the camouflage effect.\n\n_+2: _Use the scroll to obtain _45 turns of camouflage_ and _10 turns of luminous_ effects, and gain _40% staff damage increase_ under the camouflage effect.\n\nTalent type: _Spell Damage_.\n\nThis talent can be triggered by reading the Grimoire of Disorder.\n\n"Transformation! Beautiful girl 'Soldier'!"
actors.hero.talent.wide_knowledge.title=Wide Knowledge
actors.hero.talent.wide_knowledge.desc=_+1: _When you pick up an item, you will immediately know if it is cursed.\n\n_+2: _Pick up the item_Identify_the item immediately.\n\n_+3: _On the basis of +2, _3 turns of staff recharging_ will be obtained when the picked up items are identified.\n\nTalent type: _auxiliary_.
actors.hero.talent.gold_meal.title=Gold Meal
actors.hero.talent.gold_meal.desc=_+1: _Eat and get _25 gold coins_.\n\n_+2: _Eat and get _35 gold coins_.\n\nTalent type: _Resource type_.\n\n"Is your ration made of gold on the outside or is the meat filling made of gold?"
actors.hero.talent.no_viewrape.title=No Staring
actors.hero.talent.no_viewrape.desc=_+1: _When receiving remote damage, the attacker will be blinded for 1 round_.\n\n_+2: _When receiving remote damage, the attacker will be blinded for 2 turns_.\n\n_+3:_When receiving remote damage, the attacker will be blinded for 3 turns_.\n\nTalent type: _Special effects_.\n\n"Who is the dwarf in the purple skirt and the jackal with heavy makeup!?"
actors.hero.talent.water_ghost.title=Water Ghost
actors.hero.talent.water_ghost.desc=_+1: _When the enemy dies in the water, there is a _20% chance of spawning a wraith_ and gaining _5 turns of frenzy_.\n\n_+2: _When the enemy dies in the water, there is a _20% probability of generating a corrupted wraith_.\n\nTalent type: _Other types_.\n\n"Corpse dust replacement water-injected version."
actors.hero.talent.ash_ledger.title=Ash Ledger
actors.hero.talent.ash_ledger.desc=_+1:_When an enemy dies, the hero will gain _2 shield points_.\n\n_+2:_When an enemy dies, the hero will gain _4 shield points_.\n\nTalent type: _Special effects_.\n\n"Seize the soul."
actors.hero.talent.secret_lighting.title=Secret Lighting
actors.hero.talent.secret_lighting.desc=_+1: _Read the scroll to get _20 turns of glow_.\n\n_+2: _Read the scroll to gain _40 turns of glow_.\n\nTalent type: _Special effects_.\n\nThis talent can be triggered by reading the Grimoire of Disorder.\n\n"Quah! My eyes!"
actors.hero.talent.potential_1.title=Potential 1
actors.hero.talent.potential_1.desc=_+1: _Get _1 Transformation Scroll_.\n\n_+2: _No effect.\n\nThis kind of talent sharing that directly obtains corresponding resources through upgrading or transformation has a limit of 26 triggers (for gentlemen, 39 times).
actors.hero.talent.potential_2.title=Potential 2
actors.hero.talent.potential_2.desc=_+1: _Get _1 Transformation Scroll_.\n\n_+2: _No effect.\n\nThis kind of talent sharing that directly obtains corresponding resources through upgrading or transformation has a limit of 26 triggers (for gentlemen, 39 times).
actors.hero.talent.potential_3.title=Potential 3
actors.hero.talent.potential_3.desc=_+1: _Get _1 Transformation Scroll_.\n\n_+2: _No effect.\n\nThis kind of talent sharing that directly obtains corresponding resources through upgrading or transformation has a limit of 26 triggers (for gentlemen, 39 times).
