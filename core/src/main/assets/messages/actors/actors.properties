actors.mobs.gnollexile.name=gnoll exile
actors.mobs.gnollexile.desc=This gray-furred gnoll has a conspicuous mark tattooed on its shoulder, showing that it has been exiled. Gnolls are usually exiled from their society for ignoring discipline or breaking laws. Strength and cunning are an exile's tools for survival, and this one seems skilled with the spear it carries.
actors.mobs.gnollexile.desc_passive=_The gnoll exile currently has no intention to attack._ It does not seem as aggressive as the other gnolls here. Perhaps it believes fighting you is not worth the cost. You can choose to spare it, though the bundle it carries may be full of useful items...
actors.mobs.gnollexile.desc_aggro=_The gnoll exile is looking around hungrily for a fight._ It seems something finally convinced it to attack. Watch that spear!
actors.mobs.gnollexile.seen_passive=The spear-carrying gnoll watches you warily, but has no intention to attack.
actors.mobs.gnollexile.seen_aggro=The spear-carrying gnoll is preparing to attack!
actors.mobs.gnollgeomancer.discover_hint=You can find this enemy during a certain quest.
