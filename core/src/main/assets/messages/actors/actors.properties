actors.mobs.crystalwisp.discover_hint=You can find this enemy during a certain quest.
actors.mobs.dwarfking.notice1=That foolish old king even left behind remnants such as you! Very well, I shall show you how the old king submitted!
actors.mobs.ebonymimic.discover_hint=You can discover this enemy through a certain trinket.
