actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=You can discover this unit through a certain hero armor ability.
actors.hero.abilities.cleric.trinity.skeletonkey_use=Trinity will spend _%2$s charge_ to use this artifact's insert effect.
actors.hero.abilities.cleric.trinity.cloakofshadows_use=Trinity will spend _%2$s charge_ to gain this artifact's invisibility effect for _%1$d_ turns.
actors.hero.abilities.cleric.trinity.capeofthorns_use=Trinity will spend _%2$s charge_ to gain this artifact's thorns effect for _%1$d_ turns.
actors.hero.abilities.cleric.trinity.lloydsbeacon_use=Trinity will spend _%2$s charge_ to use this artifact's teleportation effect.
actors.hero.abilities.cleric.trinity.shuriken_box_use=Trinity will spend _%2$s charge_ to use this artifact's effect and throw a _level %1$d_ tiny shuriken.
actors.hero.abilities.cleric.trinity.instructiontool_use=Trinity will spend _%2$s charge_ to use this artifact and produce a wingman drone with _%1$d/10_ of the hero's max health.
actors.hero.abilities.cleric.powerofmany$lightally.directed_wander=Your ally is patrolling the area.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=You can discover this unit through a certain hero armor ability.
actors.hero.spells.holyweapon.runemark=When the _Runesage_ detonates a mark containing holy enchantment, they gain some blessing.
actors.hero.hero.key_distracted=You failed to open the lock. You'll have to try again.
actors.hero.talent.runic_transference.title=Runic Transference
actors.hero.talent.light_reading.meta_desc=_If this talent is obtained by another hero_, it increases all wand charge speed by 7/13/20% at +1/+2/+3.
actors.mobs.npcs.blacksmith.intro_quest_freeman=Hey, human! You look like you can carry yourself.
actors.mobs.npcs.blacksmith.intro_quest_slimegirl=Hey, monster! You look like you might actually be useful.
actors.mobs.npcs.blacksmith.intro_quest_ninja=Hey, human! You look pretty mysterious.
actors.mobs.npcs.blacksmith.intro_quest_dm400=Hey... oh, another iron scrap heap.
actors.mobs.npcs.blacksmith.intro_quest_princess=Hey, gnome! Yes, you. You may be part human, but I can still smell that special gnome stink on you.
actors.mobs.npcs.mirrorimage.discover_hint=You can discover this unit through a certain scroll.
actors.mobs.npcs.npc.discover_hint=You can find this unit in a certain dungeon region.
actors.mobs.npcs.dongyusangyu.name=Dongyusangyu
actors.mobs.npcs.dongyusangyu.desc=This orange Hanny keeps a pouch of route markers and a neat ledger of treasure-hunt scores.
actors.mobs.npcs.dongyusangyu.hello=Care to test your luck on a treasure hunt?
actors.mobs.npcs.surfaceshopkeeper.name=shopkeeper
actors.mobs.npcs.surfaceshopkeeper.desc=A merchant who runs the surface shop. The goods on the shelves are priced as they would be on floor 20, and queried goods are priced as they would be on floor 25.
actors.mobs.npcs.surfaceshopkeeper.thief=Thief, thief!
actors.mobs.npcs.surfaceshopkeeper.warn=Watch it! I won't warn you again.
actors.mobs.npcs.surfaceshopkeeper.flee=The shopkeeper flees!
actors.mobs.npcs.surfaceshopkeeper.sell=Sell an item
actors.mobs.npcs.surfaceshopkeeper.query=Query an item
actors.mobs.npcs.surfaceshopkeeper.raid=Enter extraction raid
actors.mobs.npcs.surfaceshopkeeper.talk=Talk
actors.mobs.npcs.surfaceshopkeeper.talk_text=Tell me the name of an ordinary consumable and I may be able to sell it to you.
actors.mobs.npcs.surfaceshopkeeper.raid_title=Extraction raid
actors.mobs.npcs.surfaceshopkeeper.raid_body=Entry costs %1$d gold. Find a crystal key and reach the marked extraction room. You keep tagged loot only after extracting; failure loses all raid loot and 1-2 ordinary consumables. A second crystal key pays a %2$d-gold bonus.\n\nThe raid contains treasures and enchanted thrown weapons, but no loose melee weapons or armor.
actors.mobs.npcs.surfaceshopkeeper.raid_enter=Pay and enter
actors.mobs.npcs.surfaceshopkeeper.raid_cancel=Not now
actors.mobs.npcs.surfaceshopkeeper.raid_no_gold=You need %d gold to enter.
actors.mobs.npcs.surfaceshopkeeper.raid_unavailable=The extraction route is not available right now.
actors.mobs.npcs.surfaceshopkeeper.buyback=The shopkeeper reluctantly returns your item.
actors.mobs.npcs.surfaceshopkeeper.query_title=Query purchase
actors.mobs.npcs.surfaceshopkeeper.query_body=Enter the exact item name. Add “xN” at the end to choose a quantity, for example: potion of healing x3. Each item can be queried at most 5 times.
actors.mobs.npcs.surfaceshopkeeper.query_confirm=Search
actors.mobs.npcs.surfaceshopkeeper.query_cancel=Cancel
actors.mobs.npcs.surfaceshopkeeper.invalid_quantity=That is not a valid quantity.
actors.mobs.npcs.surfaceshopkeeper.not_found=That item cannot be queried or has no sale price.
actors.mobs.npcs.surfaceshopkeeper.limit_reached=Each item has a query-purchase limit of %1$d; you have already bought %2$d.
actors.mobs.npcs.surfaceshopkeeper.query_offer=Quantity: %1$d\nUnit price: %2$d gold\nTotal: %3$d gold\nRemaining before purchase: %4$d
actors.mobs.npcs.surfaceshopkeeper.buy=Buy
actors.mobs.npcs.surfaceshopkeeper.not_enough_gold=You do not have enough gold.
actors.mobs.npcs.prismaticimage.discover_hint=You can discover this unit through a certain scroll.
actors.mobs.npcs.ratking.discover_hint=You can find this unit at the end of a certain dungeon region.
actors.mobs.npcs.sheep.discover_hint=You can discover this unit through a certain item or trap.
actors.mobs.npcs.shopkeeper.talk_prison_freeman=Oh, sir, if I remember correctly, I once saw your portrait in some business journal. Or rather, you look exactly like a certain famous gentleman of wealth drawn there. In any case, you don't look like someone who pinches pennies. How about buying something from me? I guarantee, on my business sense, that these are all fine goods that can help you survive.
actors.mobs.npcs.shopkeeper.talk_prison_slimegirl=Uh... hello? Even though no monster can hurt me, your arrival really did give me a fright. Since you can understand me, why not take a look at these things? Since you're my first monster customer, I promise I'll sell to you cheaper than I sell to humans. Honest business, fair to all ages.
actors.mobs.npcs.shopkeeper.talk_prison_ninja=DOMO, Ninja-san. Shopkeeper desu. What brings you here from that distant eastern land? Or have you finally decided, after decades, to deal with the "traitor" imprisoned here? Either way, none of that concerns me. What I truly care about is gold, so if you're interested, have a look and see what you need.
actors.mobs.npcs.shopkeeper.talk_prison_dm400=Hey, tin can, watch it! I'm afraid you'll knock my wares over... I don't know why something like you came here, but if you want to see what I have, handle everything gently, understood? If not, that's fine too. Just know that if you break anything, you'll have to buy it.
actors.mobs.npcs.shopkeeper.talk_prison_princess=One of the few surviving members of the dwarven royal family is actually a half-dwarf, half-human. How ironic. I don't care about, and don't want to meddle in, all the misery and grudges of you surface dwarves. Royal blood means nothing here unless... you have a great, great deal of money.
actors.mobs.npcs.wandmaker.intro_freeman=Oh, hello! Esteemed sir, you look truly distinguished! In any case... I have encountered a bit of trouble. Would you be willing to help a poor old man like me?
actors.mobs.npcs.wandmaker.intro_slimegirl=Oh dear... I think this is the first time I've spoken to a monster in this dreadful place. I nearly thought you would lunge at me like the others. In any case, since you can understand me, could you help me with a small matter? I can't exactly count on meeting any other sane humans here.
actors.mobs.npcs.wandmaker.intro_ninja=DOMO, Ninja-san. Phyllis desu. As you can see, I am troubled by a difficult matter. If possible, I would like you to help me with a small favor.
actors.mobs.npcs.wandmaker.intro_dm400=Good heavens, a... machine "man"! To be honest, I always thought only magic-infused devices could possess any intelligence... ahem, Mr. Iron, since you can understand me, I hope you can help this old fellow.
actors.mobs.npcs.wandmaker.intro_princess=Oh, greetings! I never expected to meet you in a place like this. Thanks to your people's patronage, I learned quite a few novel spells from the dwarves... but to the point, I have run into no small trouble, and hope you will lend me your aid.
actors.mobs.albino.discover_hint=You may happen to find this enemy in a certain dungeon region.
