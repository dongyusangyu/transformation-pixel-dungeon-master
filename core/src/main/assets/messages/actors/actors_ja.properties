actors.hero.talent.explosion_meal.title=爆食
actors.hero.talent.explosion_meal.desc=_+0：_食事時_20%確率_で爆発。\n\n_+1：_食事時_10%確率_で爆発。\n\n_+2：_食事で爆発なし。
