actors.hero.talent.hedonism.desc=_+1：_空腹/極度空腹状態_でない場合、_ダメージ追加+2_、全増傷才能より先に適用。\n\n_+2：_空腹/極度空腹状態_でない場合、_ダメージ追加+4_、全増傷才能より先に適用。
