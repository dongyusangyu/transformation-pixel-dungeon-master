###blobs
actors.blobs.blizzard.name=吹雪
actors.blobs.blizzard.desc=ここで吹雪が吹き荒れている。

actors.blobs.confusiongas.name=混乱ガス
actors.blobs.confusiongas.desc=ここには混乱ガスが立ち込めている。

actors.blobs.electricity.name=電撃フィールド
actors.blobs.electricity.desc=火花がこの電撃フィールドの中でパチパチと弾けている。
actors.blobs.electricity.rankings_desc=感電死
actors.blobs.electricity.ondeath=あなたは感電死した…

actors.blobs.fire.name=炎
actors.blobs.fire.desc=炎の塊がここで猛威を振るっている。

actors.blobs.foliage.name=落ち葉
actors.blobs.foliage.desc=光の柱が地下庭園の闇を切り裂いている。

actors.blobs.freezing.name=氷結
actors.blobs.freezing.desc=ここの空気は身を切るように冷たく、異常だ。

actors.blobs.goowarn.name=闇のエネルギー
actors.blobs.goowarn.desc=闇のエネルギーがここでうごめいている。

actors.blobs.inferno.name=業火
actors.blobs.inferno.desc=業火がここで猛威を振るっている。

actors.blobs.paralyticgas.name=麻痺ガス
actors.blobs.paralyticgas.desc=ここには麻痺ガスが立ち込めている。

actors.blobs.regrowth.name=草木再生

actors.blobs.sacrificialfire.name=生贄の火
actors.blobs.sacrificialfire.desc=これは生贄の火を宿した祭壇だ。ここで命を落とした生物はすべて、地下牢の亡霊への生贄となる。\n\n十分な生贄を捧げれば、報いがあるかもしれない？
actors.blobs.sacrificialfire.worthy=炎はあなたの生贄を飲み込み、さらに激しく燃え盛る。
actors.blobs.sacrificialfire.unworthy=炎はあなたの生贄を飲み込んだが、何の変化もない。
actors.blobs.sacrificialfire.reward=炎が突然燃え上がり、やがて消え去り、褒賞を残した！

actors.blobs.smokescreen.name=煙幕
actors.blobs.smokescreen.desc=ここには濃密な黒煙が立ち込めている。

actors.blobs.stenchgas.name=悪臭ガス
actors.blobs.stenchgas.desc=ここには腐敗した悪臭が立ち込めている。

actors.blobs.stormcloud.name=嵐雲
actors.blobs.stormcloud.desc=ここには渦巻く水蒸気が立ち込めている。

actors.blobs.toxicgas.name=毒ガス
actors.blobs.toxicgas.desc=ここには緑色に光る毒ガスが立ち込めている。
actors.blobs.toxicgas.rankings_desc=窒息死
actors.blobs.toxicgas.ondeath=あなたは毒ガスに中毒死した…

actors.blobs.corrosivegas.name=腐食性の酸霧
actors.blobs.corrosivegas.desc=ここには致命的な腐食性の酸の霧が立ち込めている。

actors.blobs.waterofawareness.name=気づきの泉
actors.blobs.waterofawareness.procced=一口すすると、知識が頭の中に流れ込んでくるのを感じる。
actors.blobs.waterofawareness.desc=知識の力がこの井戸の水から溢れ出ている。井戸の水を飲むと、装備中の全アイテムを鑑定し、バッグ内の全アイテムの呪いを探知し、このフロアの全アイテムの位置を明らかにする。

actors.blobs.waterofhealth.name=生命の泉
actors.blobs.waterofhealth.procced=一口すすると、すぐにすべての傷が癒えたように感じる。
actors.blobs.waterofhealth.desc=生命の力がこの井戸の水から溢れ出ている。井戸の水を飲むと、傷を治療し、空腹を癒し、装備中の全アイテムの呪いを浄化する。

actors.blobs.web.name=クモの巣
actors.blobs.web.desc=ここではすべてが厚いクモの巣に覆われている。クモの巣に触れたり投げつけられたものはそれを壊すが、その場に固定されてしまう。



###buffs
actors.buffs.swiftthistle$timebubble.name=タイムバブル
actors.buffs.swiftthistle$timebubble.desc=時間の流れを加速させる気泡だ。\n\n気泡の中で瞬間的に複数の行動を取ることができるが、攻撃や魔法の詠唱はこの効果を中断させる。\n\n残り時間：%sターン

actors.buffs.timekeepershourglass$timestasis.name=時間停止
actors.buffs.timekeepershourglass$timestasis.desc=自身の時間を完全に停止させる。周囲の時間は流れ続ける。停止中は行動できないが、外界の影響もほぼ受けない。\n\n残り時間：%sターン

actors.buffs.timekeepershourglass$timefreeze.name=時間凍結
actors.buffs.timekeepershourglass$timefreeze.desc=外界の時間が凍結された。今なら一瞬で任意の行動を完了できる。この状態は、自ら解除するか砂時計のチャージが切れるまで持続する。攻撃や魔法の使用も効果を解除する。\n\n次のチャージ消費まで：%sターン

actors.buffs.adrenaline.name=アドレナリン
actors.buffs.adrenaline.desc=アドレナリンによる純粋な潜在能力の爆発。移動速度と攻撃速度を向上させる。\n\nアドレナリンにより、移動速度2倍、攻撃速度1.5倍を得る。\n\nアドレナリン持続時間：%sターン

actors.buffs.adrenalinesurge.name=筋力増強
actors.buffs.adrenalinesurge.desc=強力な力だが、残念ながら永続的ではない。\n\n筋力ボーナス：+%d\n効果減衰まで：%sターン

actors.buffs.amok.name=狂乱
actors.buffs.amok.desc=狂乱は対象を極度の怒りと混乱状態に陥れる。\n\n狂乱状態の生物は味方か敵かを問わず、近づく者すべてを攻撃する。\n\n狂乱効果の残り時間：%sターン

actors.buffs.arcanearmor.name=魔力の鎧
actors.buffs.arcanearmor.desc=薄い障壁があなたを包み込み、一定の魔法ダメージを防ぐ。\n\n現在の魔法防御：0~%d\n\n魔力の鎧の減衰まで：%sターン

actors.buffs.artifactrecharge.name=アーティファクト充填
actors.buffs.artifactrecharge.desc=魔力が体内を駆け巡り、手にしたアーティファクトの充填速度が向上する。\n\nアーティファクトごとに影響は異なるが、充填速度は大幅に上昇する。\n\nアーティファクト充填の残り時間：%sターン

actors.buffs.ascensionchallenge.name=アミュレットの呪い
actors.buffs.ascensionchallenge.desc=なぜか古の神はアミュレットを通じてこの世界への影響力を持ち続けている。神はこれを利用して、君の帰還を阻もうとしている！\n\n古の神はその力で敵をより多く、より強力にし、地下牢全体を危険な場所に変えた！幸い、神が強化した敵を倒すことでその力を弱めることができる。放置すれば神の力はますます強まるばかりだ。
actors.buffs.ascensionchallenge.desc_clear=アミュレットから放たれていた闇のエネルギーは最大限に弱められた。
actors.buffs.ascensionchallenge.desc_beckon=アミュレットが_遠くの敵を呼び寄せ_、君の位置を知らせている。
actors.buffs.ascensionchallenge.desc_haste=アミュレットが_遠くの敵を加速させ_、より速く接近させている！
actors.buffs.ascensionchallenge.desc_slow=アミュレットが_君を減速させ_、すべての加速効果を妨害している！
actors.buffs.ascensionchallenge.desc_damage=アミュレットに渦巻く闇のエネルギーが極めて強大になり、_直接ダメージを与えている_。
actors.buffs.ascensionchallenge.beckon=アミュレットが遠くの敵を呼び寄せ始めた。
actors.buffs.ascensionchallenge.haste=アミュレットが周囲の敵の移動速度を上げ始めた！
actors.buffs.ascensionchallenge.slow=背中のアミュレットが千鈞の重さに感じられる！
actors.buffs.ascensionchallenge.damage=アミュレットが闇のエネルギーを放ち始めた。灼けるように熱い！
actors.buffs.ascensionchallenge.weaken_info_no_kills=敵を倒せば、アミュレットの呪いは弱まる。
actors.buffs.ascensionchallenge.weaken_info=敵を倒してアミュレットの呪いを弱めよ！
actors.buffs.ascensionchallenge.weaken=アミュレットの呪いがゆっくりと消えていくのを感じる。
actors.buffs.ascensionchallenge.break=一息つくと、傷が癒え始めるのを感じる！
actors.buffs.ascensionchallenge.almost=古の神のアミュレットへの支配が弱まっているのを感じる。勝利の曙光が目の前にある。
actors.buffs.ascensionchallenge.on_kill=闇のエネルギーが君を飲み込んだ…

actors.buffs.barkskin.name=樹皮の肌
actors.buffs.barkskin.desc=皮膚が硬化し、樹皮のように荒く頑丈になった。\n\n硬化した皮膚は防御力を高め、物理攻撃をよりよく防ぐ。\n\n現在の追加防御力：0~%d\n効果減衰まで：%sターン\n\n複数の発生源から樹皮効果を得ても、最も強い効果のみが有効になる。

actors.buffs.barrier.name=魔力障壁
actors.buffs.barrier.desc=すべてのダメージを防ぐエネルギーの障壁。\n\n魔力障壁のエネルギーが残っている限り、受けるあらゆるダメージを完全に防ぐ。このエネルギーは時間とともに徐々に減衰する。\n\n残りバリアエネルギー：%d

actors.buffs.berserk.angered=憤怒
actors.buffs.berserk.berserk=バーサーク
actors.buffs.berserk.exhausted=疲労
actors.buffs.berserk.recovering=回復中
actors.buffs.berserk.angered_desc=バーサーカーは負傷の度合いに応じて攻撃力が増加する。物理ダメージを受けると怒りが蓄積し、攻撃力が強化される。鎧で防いだダメージも怒りに変わる。\n\n怒りは時間とともに減少する。バーサーカーのHPが低いほど、怒りの持続時間は長くなる。\n\n怒りが100%%に達するとバーサーク状態になり、紋章の最大バリアの2倍のバリアを獲得する。発動時のHPが低いほどバリア値は高くなり、最大で紋章の最大バリアの6倍まで上昇する。このバリアは時間とともに減衰し、バリアが尽きるとバーサーカーは休息を余儀なくされ、その後再び怒りを蓄積できるようになる。\n\n現在の怒り：_%.0f%%_\n_+%.0f%%_ダメージ
actors.buffs.berserk.berserk_desc=恐怖と不安は消え去り、残ったのは怒りだけだ。この状態のバーサーカーは無比の力を発揮し、_追加で50%のダメージを与え、追加のバリアを獲得する。_\n\nこの追加バリアはバーサーカーの紋章の最大バリアの2倍に相当し、発動時のHPが低いほどバリア値は高くなり、最大で6倍まで上昇する。バリアが0になるとバーサーク状態は終了する。\n\nバーサーク終了後、バーサーカーは休息を必要とし、その後再び怒りを蓄積できるようになる。
actors.buffs.berserk.recovering_desc=内なる潜在能力には限りがある。バーサーカーは十分に休息しなければ、再び怒りを解放できない。\n\n回復状態のバーサーカーは負傷から怒りを蓄積できない。
actors.buffs.berserk.recovering_desc_turns=回復に必要なターン数：%d
actors.buffs.berserk.recovering_desc_levels=回復に必要なレベル：%.2f
actors.buffs.berserk.rankings_desc=暴走死
actors.buffs.berserk.action_name=バーサーク
actors.buffs.berserk.no_seal=バーサークに入るには破損した紋章が必要だ！

actors.buffs.bleeding.name=出血
actors.buffs.bleeding.ondeath=あなたは出血多量で死んだ…
actors.buffs.bleeding.heromsg=出血している！
actors.buffs.bleeding.rankings_desc=出血死
actors.buffs.bleeding.desc=傷口から大量の血液が不安になるほど溢れ出ている。\n\n出血は毎ターンダメージを与える。ダメージ値は毎ターンランダムに減少し、やがて出血は止まる。\n\n現在の出血ダメージ：%d

actors.buffs.bless.name=祝福
actors.buffs.bless.desc=集中力が溢れ出している。これは神からの贈り物だと言う者もいる。\n\n祝福状態は命中率と回避率を15%%向上させ、戦闘を有利に進める。\n\n祝福効果の残り時間：%sターン

actors.buffs.blindness.name=盲目
actors.buffs.blindness.heromsg=目が見えなくなった！
actors.buffs.blindness.desc=盲目により周囲のすべてが闇に包まれる。\n\n盲目時は視界が1マスに制限され、遠隔攻撃はほぼ無力になり、遠くの敵を見失いやすくなる。また、盲目の英雄は巻物や書物を読めない。\n\n盲目効果の残り時間：%sターン

actors.buffs.buff.heromsg=

actors.buffs.burning.name=燃焼
actors.buffs.burning.heromsg=火がついた！
actors.buffs.burning.burnsup=%sは焼け落ちた！
actors.buffs.burning.ondeath=あなたは焼死した…
actors.buffs.burning.rankings_desc=焼死
actors.buffs.burning.desc=炎に飲まれるほど苦しいものはない。\n\n炎は毎ターンダメージを与え続け、液体で消されるか自然に消え去るまで続く。水の中に入るか、薬瓶を割って水しぶきを上げることでも消火できる。\n\nさらに、炎は触れた可燃性の地形や物体すべてに燃え移る。\n\n燃焼効果の残り時間：%sターン

actors.buffs.championenemy.warn=%s体の強敵の気配を感じる！
actors.buffs.championenemy$blazing.name=炎の精鋭
actors.buffs.championenemy$blazing.desc=炎の精鋭は近接ダメージが25%増加し、攻撃対象を炎上させ、炎に免疫で、死亡時に周囲を燃やす。ただし、炎は水上には広がらない。
actors.buffs.championenemy$projecting.name=索敵の精鋭
actors.buffs.championenemy$projecting.desc=索敵の精鋭は近接ダメージが25%増加し、近接攻撃範囲が2マス追加される。
actors.buffs.championenemy$antimagic.name=対魔法の精鋭
actors.buffs.championenemy$antimagic.desc=対魔法の精鋭は被ダメージを50%軽減し、すべての魔法効果を完全に無効化する。
actors.buffs.championenemy$giant.name=巨大精鋭
actors.buffs.championenemy$giant.desc=巨大精鋭は被ダメージを80%軽減し、近接攻撃範囲が2マス追加されるが、狭い空間に入ることはできない。
actors.buffs.championenemy$blessed.name=祝福された精鋭
actors.buffs.championenemy$blessed.desc=祝福された精鋭は命中率と回避率が4倍になる。
actors.buffs.championenemy$growing.name=成長する精鋭
actors.buffs.championenemy$growing.desc=成長する精鋭は安定して増加する命中率、回避率、物理ダメージ、被ダメージ軽減を得る。\n\n現在の命中率/回避率/ダメージボーナス：%1$d%%\n現在の被ダメージ軽減：%2$d%%
actors.buffs.championenemy$randomminiboss.name=ミニボス
actors.buffs.championenemy$randomminiboss.desc=古の神が地下牢の邪悪な生物を無作為に祝福し、より強力で恐ろしいものに変えた。\n\nこの効果を持つ敵は、現在のフロアに応じて全ステータスが上昇し、より倒しにくくなる。その代わり、より豪華な戦利品をドロップする。

actors.buffs.charm.name=魅了
actors.buffs.charm.heromsg=魅了された！
actors.buffs.charm.cant_attack=対象の敵に魅了されているため、攻撃できない。
actors.buffs.charm.desc=魅了は、敵対する二者を一時的に互いに魅了させる支配系魔法だ。\n\n魅了されたユニットは魅了の施術者を直接攻撃できなくなるが、他の敵を攻撃することはできる。ダメージを受けると魅了されたユニットは正気に戻り、魅了状態の残り時間が減少する。\n\n魅了効果の残り時間：%sターン

actors.buffs.chill.name=凍傷
actors.buffs.chill.freezes=%sが凍りついた！
actors.buffs.chill.desc=完全には凍っていないが、非常に冷たい。\n\n凍傷状態の対象はすべての動作が遅くなり、減速の度合いは残り時間に依存する。最も深刻な場合は鈍化効果と同等になる。\n\n凍傷効果の残り時間：%1$sターン\n現在の速度減少：%2$s%%

actors.buffs.combo.name=コンボ
actors.buffs.combo.action_name=コンボ
actors.buffs.combo.combo=%dコンボ！
actors.buffs.combo.bad_target=目標は攻撃範囲内の敵でなければならない。
actors.buffs.combo.prompt=攻撃目標を選択
actors.buffs.combo.desc=剣闘士が敵に命中すると戦闘の勢いを蓄積する。攻撃が命中するたびにコンボが1増加するが、長期間攻撃しないとコンボ数はリセットされる。剣闘士がコンボを蓄積している間、破損した紋章が提供するバリアは減衰しない。\nコンボを蓄積することで、必中コンボ技を発動できる！コンボ数が2、4、6、8、10に達すると、それぞれ異なるコンボ技が発動可能になる。一部のコンボ技はコンボ数をリセットするが、リセットしないものもある。各コンボ技は1回のコンボ中に1度しか使用できない。\n\n現在のコンボ：%1$d\n\nコンボリセットまでの残りターン：%2$s
actors.buffs.combo$combomove.clobber.name=衝撃
actors.buffs.combo$combomove.clobber.desc=敵を2マス吹き飛ばすが、ダメージは与えず、奈落に落とすこともできない。コンボ数+1。
actors.buffs.combo$combomove.clobber.empower_desc=敵を_3マス吹き飛ばし、スタンを与え、奈落に落とすこともできる_が、ダメージは与えない。コンボ数+1。
actors.buffs.combo$combomove.slam.name=強打
actors.buffs.combo$combomove.slam.desc=自身の防御力の%d%%(コンボ数x20%%)の追加ダメージを与える。使用後コンボ数をリセット。
actors.buffs.combo$combomove.slam.empower_desc=_最大%1$dマスまで跳躍して目標に接近し_、自身の防御力の%2$d%%(コンボ数x20%%)の追加ダメージを与える。使用後コンボ数をリセット。
actors.buffs.combo$combomove.parry.name=パリィ
actors.buffs.combo$combomove.parry.desc=使用後、次のターンに受ける最初の攻撃をパリィし、即座に反撃する。パリィが発動しなかった場合、コンボ数をリセット。
actors.buffs.combo$combomove.parry.empower_desc=使用後、次のターンに受ける_すべての攻撃_をパリィし、即座に反撃する。パリィが発動しなかった場合、コンボ数をリセット。
actors.buffs.combo$combomove.crush.name=薙ぎ払い
actors.buffs.combo$combomove.crush.desc=主要目標に%d%%(コンボ数x25%%)のダメージを与え、7x7範囲内の他の敵には半分のダメージ。使用後コンボ数をリセット。
actors.buffs.combo$combomove.crush.empower_desc=_最大%1$dマスまで跳躍して目標に接近し_、主要目標に%2$d%%(コンボ数x25%%)のダメージを与え、7x7範囲内の他の敵には半分のダメージ。使用後コンボ数をリセット。
actors.buffs.combo$combomove.fury.name=怒涛
actors.buffs.combo$combomove.fury.desc=コンボ数1につき1体の敵を攻撃し、毎回60%のダメージを与え、武器エンチャントを発動できる。使用後コンボ数をリセット。
actors.buffs.combo$combomove.fury.empower_desc=_最大%dマスまで跳躍して目標に接近し_、現在のコンボ数に応じて同数の攻撃を敵に繰り出し、毎回60%%のダメージを与えエンチャント効果を発動できる。使用後コンボ数をリセット。

actors.buffs.corruption.name=腐敗
actors.buffs.corruption.desc=腐敗魔法は生物の生命本質に侵入し、その本性を歪める。\n\n腐敗した生物は味方を攻撃し、元の敵を無視するようになる。腐敗効果はダメージも与え、対象をゆっくりと死に至らしめる。\n\n腐敗は永続的であり、死によってのみ解かれる。

actors.buffs.cripple.name=足止め
actors.buffs.cripple.heromsg=足が不自由になった！
actors.buffs.cripple.desc=足の骨がおかしな折れ方をしているのは確かだ。\n\n足止め状態では移動速度が半減し、1マス移動するのに通常の1ターンではなく2ターンを消費する。\n\n足止め効果の残り時間：%sターン

actors.buffs.daze.name=朦朧
actors.buffs.daze.heromsg=目が回る！
actors.buffs.daze.desc=耳鳴りがし、視界がぼやけ、戦闘が非常に困難になる。\n\n朦朧状態では、命中率と回避率が50%%減少し、攻撃を当てるのも避けるのも難しくなる。\n\n残りターン数：%s

actors.buffs.degrade.name=劣化
actors.buffs.degrade.heromsg=装備が一時的に弱体化された！
actors.buffs.degrade.desc=強力な闇の魔法が、アップグレードスクロールが装備に注いだ魔力を食らっている！\n\n劣化状態の装備は本来のレベルより低いものとして扱われる。_レベル3を超えるアップグレードは、そのたびに深刻な反動を受ける。_アイテムの説明文も劣化の影響に応じて変化する。\n\nただし、劣化は装備の必要筋力、杖のチャージ、投擲武器の耐久度、アーティファクトには影響しない。\n\n劣化効果の残り時間：%sターン\n\nアップグレードスクロールまたは祛邪のスクロールを使用すると、この闇の魔法を即座に祓うことができる。

actors.buffs.doom.name=死の宣告
actors.buffs.doom.desc=宇宙全体があなたを死なせようとしているように思えるとき、戦い続けることに何の意味があるのか？\n\n死の宣告を受けたキャラクターは、受けるすべてのダメージが17%増加する。\n\n死の宣告は永続的であり、死によってのみ解かれる。

actors.buffs.dread.name=恐慌
actors.buffs.dread.desc=恐怖が対象をこの地下牢から逃げ出そうと駆り立てている！\n\n恐慌状態の生物は敵から素早く逃げ出し、敵の視界から外れると即座に地下牢のどこかへ消え去る。逃げた敵はアイテムをドロップせず、英雄に半分の経験値のみを与える。ダメージによる痛みで正気に戻る。\n\n恐慌効果の残り時間：%dターン

actors.buffs.drowsy.name=眠気
actors.buffs.drowsy.desc=魔法の力により対象は意識を保つのが難しくなり、数ターン後に魔法の眠りに落ちる。\n\n英雄の場合、眠るはずのターンにHPが満タンか、その過程でダメージを受けると、魔法の眠りは発動しない。\n\n眠りまでに必要なターン数：%sターン

actors.buffs.earthimbue.name=大地の力
actors.buffs.earthimbue.desc=大地の力が注ぎ込まれた！\n\nこの効果が続く間、すべての物理攻撃が敵の足元の地面を変化させ、しばらくの間足止め状態にする。\n\n大地の力の残り時間：%sターン

actors.buffs.enhancedrings.name=指輪強化
actors.buffs.enhancedrings.desc=ローグがアーティファクトを使用する際に指輪を強化し、+1のアップグレードを得た。\n\n残りターン数：%s

actors.buffs.fireimbue.name=炎の力
actors.buffs.fireimbue.desc=炎の力が注ぎ込まれた！\n\nすべての物理攻撃が敵を燃焼させる可能性を持つ。同時に炎に対して完全な免疫を得る。\n\n炎の力の残り時間：%sターン

actors.buffs.foresight.name=危険予知
actors.buffs.foresight.desc=なぜか、脳内に周囲の地形が映し出されている。\n\n危険予知状態の間、周囲の広範囲のマスが明らかになり、隠し扉や罠も含まれる。\n\n危険予知効果の残り時間：%sターン

actors.buffs.frost.name=凍結
actors.buffs.frost.freezes=%sが凍りついた！
actors.buffs.frost.desc=氷像にするのとは違い、この穏やかな凍結は対象を氷で包み込むだけだ。\n\n凍結効果は麻痺に似ており、対象を行動不能にする。麻痺と異なり、凍結は対象がダメージを受けると氷が割れて即座に解除される。\n\n残りの凍結効果時間：%sターン

actors.buffs.frostimbue.name=霜の力
actors.buffs.frostimbue.desc=霜の力が注ぎ込まれた！\n\nすべての物理攻撃が敵に凍傷効果を蓄積する。同時に寒冷に対して完全な免疫を得る。\n\n霜の力の残り時間：%sターン

actors.buffs.fury.name=怒り
actors.buffs.fury.heromsg=激怒状態に陥った！
actors.buffs.fury.desc=激怒している。敵は明らかにそのような君を好まない。\n\n激しい怒りが体内で燃え盛り、物理攻撃ダメージが50%%増加する。\n\nHPが上限の50%%を下回っている限り、この効果は持続する。

actors.buffs.blobimmunity.name=浄化の障壁
actors.buffs.blobimmunity.desc=奇妙なエネルギーが周囲を包み込み、有害な環境効果から守っている。\n\n浄化の障壁が続く間、すべての負の環境効果を無効化する。\n\n免疫効果の残り時間：%sターン

actors.buffs.gravitychaostracker.name=重力混乱
actors.buffs.gravitychaostracker.desc_intro=数ターンごとに、現在のフロアの全ユニットがランダムな方向に投げ飛ばされる。
actors.buffs.gravitychaostracker.desc_positive=しかし、君とその味方はこれに免疫のようだ。
actors.buffs.gravitychaostracker.desc_duration=重力混乱がいつまで続くかはわからないが、永久に続くことはない。

actors.buffs.greaterhaste.name=飛影
actors.buffs.greaterhaste.desc=驚異的な速度により、すべてが静止しているかのように見える。\n\n飛影の効果中、移動はターンを消費しないが、他の行動の速度はそのまま。1マス移動するごとに飛影の効果が1ターン消費される。\n\n飛影の残りターン数：%dターン

actors.buffs.haste.name=高速
actors.buffs.haste.desc=強力なエネルギーが両脚の筋肉に流れ込み、驚異的な速度で移動できる！\n\n高速状態では移動速度が2倍になるが、他の行動速度は変わらない。\n\n高速効果の残り時間：%sターン

actors.buffs.healing.name=治癒
actors.buffs.healing.desc=治癒の魔力が傷を癒し始める。\n\nHPが毎ターン安定して回復し、治癒効果が終わるまで続く。回復量は時間とともに徐々に減少する。\n\n次のターンの回復量：%d\n\n残り回復量：%d。

actors.buffs.herodisguise.name=へん装
actors.buffs.herodisguise.desc=魔法があなたの外見を変えた！この効果は完全に装飾的なものだが、それでも不思議な感覚だ。\n\nへん装効果の残り時間：%sターン

actors.buffs.hex.name=幻惑
actors.buffs.hex.heromsg=あなたの精神が魔法に干渉された！
actors.buffs.hex.desc=集中力を乱す暗黒魔法。標的は方向を正確に判断できなくなる。\n\n幻惑状態は標的の命中率と回避率を20%%低下させ、戦闘で不利な立場に追い込む。\n\n幻惑効果の残り時間：%sターン

actors.buffs.holdfast.name=不動如山
actors.buffs.holdfast.desc=戦士がその場を守り、防御力が%1$d～%2$d上昇し、連撃と盾のノックバック速度が%3$d%%減速する。移動するまで持続。

actors.buffs.hunger.hungry=空腹
actors.buffs.hunger.dmhungry=バッテリー低下
actors.buffs.hunger.starving=極度の飢餓
actors.buffs.hunger.dmstarving=バッテリー不足
actors.buffs.hunger.onhungry=お腹がすいてきた。
actors.buffs.hunger.onstarving=腹ペコだ！
actors.buffs.hunger.ondmhungry=現在のバッテリーが低めです。
actors.buffs.hunger.ondmstarving=現在のバッテリーが不足しています。
actors.buffs.hunger.ondeath=あなたは餓死した…
actors.buffs.hunger.cursedhorn=食事中に呪われた角が食べ物のエネルギーを一部盗んでいった。
actors.buffs.hunger.rankings_desc=餓死
actors.buffs.hunger.desc_intro_hungry=お腹が食べ物を求めているのがわかるが、まだそれほど深刻ではない。
actors.buffs.hunger.desc_intro_starving=飢餓が命の危険にまで及んでいる。
actors.buffs.hunger.desc_intro_dmhungry=バッテリー残量が低いが、まだしばらくは正常に動作を続けられる。
actors.buffs.hunger.desc_intro_dmstarving=バッテリーが深刻に不足しており、機体の正常な動作に支障をきたし始めている。
actors.buffs.hunger.desc=\n\n空腹はダンジョンで時間を過ごすごとにゆっくりと蓄積され、耐え難くなるまで続く。極度の飢餓状態ではHPの回復が停止し、ゆっくりと減少し始める。\n\n食料を計画的に使うことが重要！十分なHPがあるなら、もっとお腹がすいてから食べる方が効果的。適切なタイミングで食料を最大限活用しよう！
actors.buffs.hunger.dmdesc=\n\nダンジョンの探索中は常にバッテリーが消耗され、時間が経つほど残量は減っていく。バッテリーが不足し始めると機体の正常動作に支障をきたし、HPの回復が停止してゆっくりと減少し始める。\n\nダンジョンでは充電が難しいが、体内のマイクロ熱化学変換システムが食料を効率的に電力に変換する。ただし食料にも限りがあるので、賢く使おう！

actors.buffs.invisibility.name=隐身
actors.buffs.invisibility.desc=あなたは周囲の地形と完全に同化し、視認できなくなる。\n\n隐身中は敵に追跡されたり攻撃されたりしない。ほとんどの物理攻撃や魔法（巻物や魔杖など）は即座に隐身を解除する。\n\n隐身効果の残り時間：%sターン

actors.buffs.invulnerability.name=無敵
actors.buffs.invulnerability.desc=このユニットは金剛不壊の力に満たされ、短時間の無敵効果を得た。\n\n残りターン数：%sターン

actors.buffs.levitation.name=浮遊
actors.buffs.levitation.desc=魔力があなたを地面から持ち上げ、身軽な気分にさせる。\n\n浮遊中のキャラクターは静かに移動でき、地面を基準とするすべての効果を無視する。トラップは作動せず、火は水で消されず、植物は踏まれず、根は絡まず、深淵を越えられる。ただし効果終了時にはこれらの効果はすべて失われる。\n\n浮遊効果の残り時間：%sターン

actors.buffs.lifelink.name=生命連結
actors.buffs.lifelink.ondeath=あなたは生命連結によるダメージ共有で死亡した…
actors.buffs.lifelink.desc=このユニットの生命力が近くの別のユニットと結びついている。両者は受けるすべてのダメージを共有する。\n\nこのユニットがダメージを受けるたび、半分のダメージが生命連結したユニットに移転される。\n\n生命連結の残りターン数：%s

actors.buffs.light.name=発光
actors.buffs.light.desc=最も暗いダンジョンでも、身近に安定した光源があると安心できるものだ。\n\n光は闇を払い、周囲の暗闇を無視して適切な視野範囲を得られる。\n\n発光効果の残り時間：%sターン

actors.buffs.lockedfloor.name=背水の陣
actors.buffs.lockedfloor.desc=現在のフロアが完全に封鎖され、ここを離れられない。\n\n封鎖中は空腹にならず、極度の飢餓でHPが減少することもない。また、ボスと戦闘中でなければ、すべての自動回復が停止する。\n\nさらに、フロア封鎖中に無祝福の再生の十字架で復活した場合、封鎖効果はリセットされる。\n\nフロアのボスを倒して封鎖を解除せよ。

actors.buffs.lostinventory.name=遺失行李
actors.buffs.lostinventory.desc=あなたの行李がダンジョンのどこかに遺失された！\n行李を取り戻すまでは、ほとんどのアイテムを拾ったり使用したりできない。

actors.buffs.magicalsight.name=魔能透視
actors.buffs.magicalsight.desc=なぜか目を閉じても心で周囲のすべてを察知できる。\n\n魔能透視状態では、壁や地形を透かして視認でき、視界半径も12マスに拡大する。\n\n魔能透視の残り時間：%sターン

actors.buffs.magicalsleep.name=魔法睡眠
actors.buffs.magicalsleep.toohealthy=あなたは非常に健康なので、強い眠気に耐えた。
actors.buffs.magicalsleep.fallasleep=あなたは深い魔法の眠りに落ちた。
actors.buffs.magicalsleep.wakeup=目覚めると、全身が清々しく健康になった気分だ。
actors.buffs.magicalsleep.desc=標的は深い魔法の眠りに陥り、自然には目覚めない。\n\n魔法睡眠は通常の睡眠とほぼ同じだが、ダメージを受けると目を覚ます。\n\n英雄とその味方にとって、魔法睡眠には回復効果があり、眠っている間に傷を素早く癒す。

actors.buffs.magicimmune.name=魔法免疫
actors.buffs.magicimmune.desc=いかなる魔法もあなたには効かない。完全に魔法を免疫する。\n\n魔法免疫状態では、すべての魔法効果（有益・有害を問わず）があなたに影響を与えない。これには呪い、エンチャント、刻印、魔杖、巻物、指輪、神器などが含まれる。ただし英雄の鎧の能力は十分に強力で、この効果の影響を受けずに正常に機能する。\n\n魔法免疫の残り時間：%sターン

actors.buffs.mindvision.name=霊視
actors.buffs.mindvision.desc=頭の中でこのフロアのすべての生物を何らかの形で視認できる。非常に奇妙な感覚だ。\n\n霊視効果が持続している間、このフロアの全生物が視界内に映る。霊視で見た生物も視界内の標的として扱われ、多くの魔法効果の影響を受ける。\n\n霊視効果の残り時間：%sターン

actors.buffs.momentum.momentum=運動量蓄積
actors.buffs.momentum.running=疾走
actors.buffs.momentum.resting=回復
actors.buffs.momentum.action_name=疾走
actors.buffs.momentum.momentum_desc=移動中、疾行者は徐々に運動量を蓄積する。疾行者は運動量を消費して疾走状態を発動できる。\n\n運動量1につき疾走2ターンを維持可能。最大10ポイントまで蓄積できる。疾行者が移動を停止すると運動量は急速に消散する。\n\n現在の運動量：%d
actors.buffs.momentum.running_desc=移動中、疾行者は徐々に運動量を蓄積する。疾行者は運動量を消費して疾走状態を発動できる。\n\n疾走状態中、疾行者は2倍の速度で移動し、レベルに応じた追加の回避率を得る。\n\n効果残り時間：%dターン
actors.buffs.momentum.resting_desc=移動中、疾行者は徐々に運動量を蓄積する。疾行者は運動量を消費して疾走状態を発動できる。\n\n疾行者は体力を回復してからでないと、再び運動量を蓄積できない。\n\nあと%dターンの休息が必要。

actors.buffs.monkenergy.name=内力
actors.buffs.monkenergy.action=武功
actors.buffs.monkenergy.desc=武僧が敵を倒すたびに、様々な武功を繰り出すための内力が得られる。ほとんどの敵を倒すと1ポイントの内力が得られ、時間経過で内力が失われることはない。\n\n現在の内力：%1$d/%2$d
actors.buffs.monkenergy.desc_cooldown=武僧は先ほど武功を使用したばかりで、再使用まで待機が必要だ。\n\n残りクールダウン時間：%dターン
actors.buffs.monkenergy$monkability$flurry.name=空振
actors.buffs.monkenergy$monkability$flurry.desc=ターン消費なしの2回攻撃。毎回%1$d～%2$dのダメージを与え、防御力を無視する。この武功は連続使用できない。
actors.buffs.monkenergy$monkability$flurry.empower_desc=ターン消費なしの2回攻撃。毎回%1$d～%2$dのダメージを与え、_武器のエンチャントを発動_し、防御力を無視する。武僧が直前に敵に命中していた場合、この武功は連続使用できない。
actors.buffs.monkenergy$monkability$focus.name=凝神
actors.buffs.monkenergy$monkability$focus.desc=武僧が1ターン消費して凝神状態に入り、次に受ける攻撃を受け流す。
actors.buffs.monkenergy$monkability$focus.empower_desc=武僧が_即座に凝神状態に入り_、次に受ける攻撃を受け流す。
actors.buffs.monkenergy$monkability$focus$focusbuff.name=凝神
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=武僧は周囲のすべてに集中し、次に自分に向けられる攻撃を予測できる。凝神状態中は、次に受ける攻撃を確実に受け流す。
actors.buffs.monkenergy$monkability$dash.name=登雲
actors.buffs.monkenergy$monkability$dash.prompt=場所を選択
actors.buffs.monkenergy$monkability$dash.desc=最大6マス先の位置へ即座に突進する。この武功は危険な地形を越えられるが、敵や堅固な壁は通過できない。
actors.buffs.monkenergy$monkability$dash.empower_desc=最大_8マス_先の位置へ即座に突進する。この武功は危険な地形を越えられるが、敵や堅固な壁は通過できない。
actors.buffs.monkenergy$monkability$dragonkick.name=盤龍
actors.buffs.monkenergy$monkability$dragonkick.desc=致命的な蹴りを放ち、%1$d～%2$dのダメージを与え、防御力を無視し、敵をノックバックさせる。さらにノックバック距離と等しいターン数の麻痺を付与する。
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=致命的な蹴りを放ち、_%1$d～%2$dのダメージ_を与え、防御力を無視し、_近くの全標的_をノックバックさせる。さらにノックバック距離と等しいターン数の麻痺を付与する。
actors.buffs.monkenergy$monkability$meditate.name=冥想
actors.buffs.monkenergy$monkability$meditate.desc=武僧が3ターン消費して内力を巡らせ、ほとんどの負の効果を体外に追い出し、8ターンの間、魔杖と神器が充填される。
actors.buffs.monkenergy$monkability$meditate.empower_desc=武僧が3ターン消費して内力を巡らせ、ほとんどの負の効果を体外に追い出し、8ターンの間、魔杖と神器が充填される。_冥想中は10%のダメージ耐性を得て、最大HPの20%をゆっくり回復する。_

actors.buffs.ooze.name=腐蝕泥
actors.buffs.ooze.heromsg=泥があなたの身体を腐蝕している。洗い流せ！
actors.buffs.ooze.ondeath=あなたは完全に溶かされた…
actors.buffs.ooze.rankings_desc=溶解
actors.buffs.ooze.desc=この粘着性の酸性泥があなたの骨肉にまとわりつき、ゆっくりと腐蝕・溶解する。\n\n腐蝕泥は対象に持続ダメージを与えるが、水ですぐに洗い流せる。\n\n腐蝕泥の残り時間：%sターン

actors.buffs.paralysis.name=麻痺
actors.buffs.paralysis.heromsg=あなたは麻痺した！
actors.buffs.paralysis.out=麻痺から解放
actors.buffs.paralysis.desc=最悪なのは何もできなくなることだ。\n\n麻痺は標的のすべての行動を封じ、効果が切れるまで待機させる。ダメージを受けると麻痺から回復しやすくなる。\n\n麻痺効果の残り時間：%sターン

actors.buffs.physicalempower.name=体能増幅
actors.buffs.physicalempower.desc=あなたの攻撃が強化された。次の数回の物理攻撃が命中時に追加ダメージを与える。\n\n追加ダメージ：%1$d\n残り回数：%2$d

actors.buffs.pincushion.name=矢傷
actors.buffs.pincushion.desc=あなたがこのキャラクターに命中させた投擲武器が刺さったままだ。倒せば投擲武器が地面に落ちる。\n\n刺さったアイテム：

actors.buffs.poison.name=中毒
actors.buffs.poison.heromsg=あなたは毒にやられた！
actors.buffs.poison.ondeath=あなたは毒で死んだ…
actors.buffs.poison.rankings_desc=毒死
actors.buffs.poison.desc=毒が全身に回り、ゆっくりと各臓器を蝕む。\n\n毒の毎ターンのダメージは残りターン数に比例する。\n\n中毒効果の残り時間：%sターン

actors.buffs.preparation.name=準備段階
actors.buffs.preparation.action_name=蓄意打撃
actors.buffs.preparation.desc=アサシンは暗闇から致命的一撃を与えるべく、辛抱強く待機している。
actors.buffs.preparation.desc_dmg=彼の次の攻撃は_%1$d%%の追加ダメージ_を与え、HPが_%2$d%%_未満の通常の敵を即死させる。ボスの場合はHPが_%3$d%%_未満で即死。
actors.buffs.preparation.desc_dmg_likely=この一撃は高ダメージが出やすい。
actors.buffs.preparation.desc_blink=最大%dマスまで瞬間的に敵に接近して攻撃できる。
actors.buffs.preparation.desc_invis_time=アサシンは_%d_ターンの間、隐身状態にある。
actors.buffs.preparation.desc_invis_next=この攻撃は_%d_ターン後にさらに強化される。
actors.buffs.preparation.prompt=攻撃目標を選択：\n最大接近距離：%dマス
actors.buffs.preparation.no_target=ここには攻撃可能な目標がいない。
actors.buffs.preparation.out_of_reach=目標までの距離が届かない。
actors.buffs.preparation.assassinated=暗殺

actors.buffs.prismaticguard.name=虹光守衛
actors.buffs.prismaticguard.desc=現在見えない虹光の守衛に守られている。敵が現れると守衛が姿を現し、あなたのために戦う。\n\n守衛が未発動の間は、受けたダメージを徐々に回復する。\n\n現在のHP：%d/%d
actors.buffs.prismaticguard.desc_many=この虹光の幻影は万物一心によって強化されている。残りターン数：%d

actors.buffs.recharging.name=充填
actors.buffs.recharging.desc=魔力が体内を駆け巡り、魔杖と魔法の武器の充填速度が向上する。\n\nこの効果は通常の充填速度に加えて、毎ターン追加で0.25ポイントの魔杖充填を得る。\n\n充填効果の残り時間：%sターン

actors.buffs.revealedarea.name=領域揭露
actors.buffs.revealedarea.desc=ダンジョンの一部領域の視界が揭露され、このフロアのどこにいてもその領域を一望できる。\n\n効果残り時間：%sターン

actors.buffs.revealedchar.name=既揭露
actors.buffs.revealedchar.desc=このユニットは揭露されており、どこにいても可視状態になる。\n\n効果残り時間：%sターン

actors.buffs.roots.name=絡みつき
actors.buffs.roots.heromsg=もう動けない！
actors.buffs.roots.desc=何らかの根（自然または魔法によるもの）が足に絡みつき、地面に縫い止めている。\n\n根は標的を現在の場所に拘束し、移動やほとんどの移動スキルを不能にする。その他の行動（テレポート効果を含む）は妨げられない。\n\n絡みつき効果の残り時間：%sターン

actors.buffs.scrollempower.name=巻物賦能
actors.buffs.scrollempower.desc=魔法使いが巻物を読む際に生じるエネルギーが、一時的に魔杖を強化する！\n\n魔杖強化：%1$dレベル\n残り有効施法回数：%2$d

actors.buffs.shadows.name=暗影融合
actors.buffs.shadows.desc=あなたは周囲の影と一体化し、隐身状態になるとともに代謝が緩やかになる。\n\n隐身中は敵に追跡されたり攻撃されたりしない。ほとんどの物理攻撃や魔法（巻物や魔杖など）は即座に隐身を解除する。また、暗影融合状態では満腹度の消費速度が低下する。\n\n暗影融合状態は、影から離れるか敵と直接接触するまで持続する。

actors.buffs.slow.name=遅鈍
actors.buffs.slow.desc=減速魔法が標的の時間の流れに影響を与え、標的の目にはすべてが高速で動いているように見える。\n\n遅鈍状態のキャラクターはすべての行動に通常の2倍の時間を要する。\n\n遅鈍効果の残り時間：%sターン

actors.buffs.snipersmark.name=狙撃標記
actors.buffs.snipersmark.action_name_snapshot=速射
actors.buffs.snipersmark.action_name_volley=連射
actors.buffs.snipersmark.action_name_sniper=狙殺
actors.buffs.snipersmark.desc=狙撃手は最後に射撃した標的に集中している。彼女は霊能弓で特殊攻撃を繰り出せ、攻撃方法は弓の強化方式によって決まる。\n\n未強化の弓は_速射_を繰り出せ、低ダメージだがターンを消費しない射撃を行う。\n\n速度強化された弓は3本の_連射_を繰り出せる。各矢のダメージは低いが、エンチャント効果は発動する。連射は1ターン消費する。\n\nダメージ強化された弓は_狙殺_を繰り出せる。この矢は必中で、標的との距離に応じて追加ダメージを与える。狙殺は1ターン消費する。\n\n効果残り時間：%sターン

actors.buffs.soulmark.name=霊魂標記
actors.buffs.soulmark.desc=術士は標的の霊魂を貫いた。標的が物理ダメージを受けると術士のHPが回復する。\n\n霊魂標記の残り時間：%sターン

actors.buffs.stamina.name=体力充実
actors.buffs.stamina.desc=体内に無限の精力が湧き、より速く移動できる。\n\n体力充実状態では移動速度が50%%向上するが、他の行動の所要時間には影響しない。\n\n体力充実の残り時間：%sターン

actors.buffs.vulnerable.name=易傷
actors.buffs.vulnerable.heromsg=外からのダメージがより痛烈に感じられる！
actors.buffs.vulnerable.desc=易傷魔法は標的が受ける、防御力で軽減された後の物理ダメージを33%%増加させる。\n\n易傷効果の残り時間：%sターン

actors.buffs.terror.name=恐怖
actors.buffs.terror.desc=恐怖は敵を制御不能な恐慌に陥れる操作系魔法だ。\n\n恐怖状態のキャラクターは敵から遠ざかり、できるだけ多くのドアや壁を隔てようとする。ただし痛みの刺激は恐怖の持続時間を短縮する。\n\n恐怖効果の残り時間：%s

actors.buffs.toxicimbue.name=毒素之力
actors.buffs.toxicimbue.desc=あなたは毒素の力を注入された。\n\n移動時に毒気が身体から噴出し、敵にダメージを与える。持続期間中および効果終了後数ターンの間、毒気と中毒効果を完全に免疫する。\n\n毒素之力の残り時間：%sターン

actors.buffs.corrosion.name=酸蝕
actors.buffs.corrosion.heromsg=強酸に溶かされている！
actors.buffs.corrosion.ondeath=あなたは完全に溶かされた…
actors.buffs.corrosion.rankings_desc=溶解
actors.buffs.corrosion.desc=強酸が驚異的な速度で血肉、金属、骨を腐蝕する。\n\n標的が腐蝕されている時間が長いほど、酸蝕ダメージは高くなる。\n\n酸蝕効果残り時間：%1$sターン\n現在の酸蝕ダメージ：%2$d

actors.buffs.vertigo.name=目眩
actors.buffs.vertigo.desc=世界全体が回転しているなら、直進するのは非常に困難だ。\n\n目眩効果が続く間、標的の移動は意図した方向ではなく、ランダムな方向に行われる。\n\n目眩効果の残り時間：%sターン

actors.buffs.wandempower.name=盈能魔杖
actors.buffs.wandempower.desc=あなたのダメージ系魔杖が強化された。次の数回の攻撃が追加ダメージを与える。\n\n追加ダメージ：%1$d\n残り攻撃回数：%2$d

actors.buffs.weakness.name=虚弱
actors.buffs.weakness.heromsg=力が抜けていくのを感じる！
actors.buffs.weakness.desc=装備が急に重く感じられる。\n\n虚弱魔法はキャラクターの筋力を弱め、与ダメージを33%%減少させる。\n\n虚弱効果の残り時間：%sターン

actors.buffs.wellfed.name=飽腹
actors.buffs.wellfed.dmname=バッテリー満充填
actors.buffs.wellfed.desc=非常に満腹だと感じる。\n\n飽腹状態では満腹度が消費されず、時間経過とともに追加のHPを回復する。\n\n状態残り時間：%dターン
actors.buffs.wellfed.dmdesc=現在のバッテリーは満充填だ。\n\nバッテリー満充填時は長時間バッテリーが低下せず、時間経過とともに追加のHPを回復する。\n\n残り時間：%dターン



###hero

##abilities
actors.hero.abilities.armorability.self_target=自分自身を狙うことはできない。
actors.hero.abilities.armorability.no_target=ここには目標が何もいない。
actors.hero.abilities.armorability.prompt=能力を解放する位置を選択
actors.hero.abilities.armorability.cost=充填消費：_%d_

actors.hero.abilities.warrior.heroicleap.name=英雄之跳躍
actors.hero.abilities.warrior.heroicleap.prompt=飛び移る場所を選択
actors.hero.abilities.warrior.heroicleap.short_desc=戦士は指定地点へ_英雄之跳躍_を使用し、すべての敵や危険な地形を飛び越える。
actors.hero.abilities.warrior.heroicleap.desc=戦士は指定地点へ跳躍し、経路上のすべての敵や危険な地形を飛び越える。ただし壁やその他の実体地形は越えられない。
actors.hero.abilities.warrior.shockwave.name=震地衝撃
actors.hero.abilities.warrior.shockwave.short_desc=戦士が大地を強く打ち、扇形範囲に_震地衝撃_を放つ。衝撃波に巻き込まれた敵はダメージを受け、虚弱状態になる。
actors.hero.abilities.warrior.shockwave.desc=戦士が大地を強く打って衝撃波を発生させ、前方60度扇形・5マス範囲の領域を震動させる。\n\n衝撃波に命中した敵は5ターンの虚弱状態になり、3～10のダメージを受ける。戦士の筋力が10を超えるごとに、ダメージが1～2追加される。
actors.hero.abilities.warrior.endure.name=辛苦堅忍
actors.hero.abilities.warrior.endure$enduretracker.name=辛苦之怒
actors.hero.abilities.warrior.endure$enduretracker.desc=戦士は耐えた元のダメージを怒りに変え、大量の追加ダメージを敵に浴びせる。\n\n追加ダメージ：%1$d\n残り攻撃回数：%2$d
actors.hero.abilities.warrior.endure.short_desc=戦士は_辛苦堅忍_で数ターンの間、大幅にダメージを軽減する。その後、耐えた元のダメージに応じて追加ダメージを与える。
actors.hero.abilities.warrior.endure.desc=戦士はまず5ターンの間、受けるすべてのダメージを半減する。この軽減効果は他の軽減計算より優先される。\n\nその後、10ターン以内の次の攻撃が追加ダメージを与える。追加ダメージは忍耐期間中に受けた元のダメージの半分に等しい。\n\n戦士が連撃状態なら、この能力は連撃時間を3ターン補填する。

actors.hero.abilities.mage.elementalblast.name=元素風暴
actors.hero.abilities.mage.elementalblast.no_staff=魔杖なしではこの能力は使用できない。
actors.hero.abilities.mage.elementalblast.short_desc=魔法使いが魔杖から_元素風暴_を解放し、自身を中心とした広範囲の円形領域を巻き込む。注入された魔杖の種類によって異なる効果を発揮する。
actors.hero.abilities.mage.elementalblast.desc=魔法使いが嵐のような魔力を解放し、半径4の円形範囲を巻き込み、範囲内の標的に15～25のダメージを与える。元素風暴が発動する追加効果は、魔杖に注入された魔法によって変化する。
actors.hero.abilities.mage.elementalblast.generic_desc=元素風暴が発動する効果は、魔杖を標的に直接使用した場合と類似している。
actors.hero.abilities.mage.wildmagic.name=野生魔法
actors.hero.abilities.mage.wildmagic.no_wands=使用可能な魔杖がない！
actors.hero.abilities.mage.wildmagic.short_desc=魔法使いが魔杖から_野生魔法_を導き出し、1ターンで指定目標にそれらの魔杖をランダムに複数回解放する。
actors.hero.abilities.mage.wildmagic.desc=魔法使いが魔杖の魔力を導き出し、1ターンで魔杖を最大4回ランダムに解放する。この能力は魔法使いの魔杖を解放しない。\n\nこの能力で魔杖を使用する際、魔杖はレベル+1（最大13）として扱われる。この能力で魔法を解放する際の充填消費は半分で、各魔杖から最大2回までランダムに解放される。
actors.hero.abilities.mage.warpbeacon.name=空間標
actors.hero.abilities.mage.warpbeacon.depths=他のフロアへはテレポートできない。
actors.hero.abilities.mage.warpbeacon.locked_floor=フロアが封鎖されているため、離れられない。
actors.hero.abilities.mage.warpbeacon.too_far=その位置は遠すぎる！
actors.hero.abilities.mage.warpbeacon.invalid_beacon=そこに標を設置できない。
actors.hero.abilities.mage.warpbeacon.window_desc=標は現在%d階に設置されている。
actors.hero.abilities.mage.warpbeacon.window_tele=標の位置に戻る
actors.hero.abilities.mage.warpbeacon.window_clear=標を消去
actors.hero.abilities.mage.warpbeacon.window_cancel=取消
actors.hero.abilities.mage.warpbeacon.short_desc=魔法使いが現在地に_空間標_を設置し、瞬間的にその位置へテレポートできる。
actors.hero.abilities.mage.warpbeacon.desc=魔法使いがいつでも戻れる標を設置した。標の設置には3ターンかかるが、テレポート自体は時間を消費しない。\n\n魔法使いは初期状態では他のフロアへテレポートできず、施錠された部屋などの到達不能な領域に標を設置できない。戻る際に目標地点に敵がいる場合は、弾き飛ばす。

actors.hero.abilities.rogue.smokebomb.name=煙幕爆発
actors.hero.abilities.rogue.smokebomb.fov=視野範囲内の空マスにしか跳べない。
actors.hero.abilities.rogue.smokebomb.prompt=跳ぶ位置を選択
actors.hero.abilities.rogue.smokebomb$ninjalog.name=木塀分身
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=なぜか敵はこれを盗賊本人だと信じてやまない。
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=特定の英雄鎧スキルでこのユニットを発見できます。
actors.hero.abilities.rogue.smokebomb.short_desc=盗賊がその場で_煙幕爆発_を起こして閃現し、元いた場所の周囲の敵を盲目にします。
actors.hero.abilities.rogue.smokebomb.desc=盗賊がその場で煙幕爆発を起こし、最大6マス閃現します。閃現は敵や危険な地形を無視しますが、壁などの実体地形には阻まれます。\n\n盗賊の元いた位置に隣接する敵は3ターン盲目状態になります。
actors.hero.abilities.rogue.deathmark.name=死の刻印
actors.hero.abilities.rogue.deathmark.ally_target=敵のみに刻印を付けられます
actors.hero.abilities.rogue.deathmark.short_desc=盗賊が選んだ敵に_死の刻印_を付与します。刻印された敵は追加ダメージを受けますが、刻印中は死亡しません。
actors.hero.abilities.rogue.deathmark.desc=盗賊が選んだ敵に刻印を付け、25%の追加ダメージを受けさせます。刻印は時間を消費せず、4ターン持続します。\n\n刻印された敵は追加ダメージを受けますが、刻印中は死亡しません。刻印終了時にHPが0の敵は即座に死亡します。
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=死の刻印
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=この刻印された敵は25%%の追加ダメージを受けますが、刻印中は死亡しません。\n\n刻印残り時間：%sターン
actors.hero.abilities.rogue.shadowclone.name=影の分身
actors.hero.abilities.rogue.shadowclone.short_desc=盗賊が_影の分身_を召喚し、自身の戦闘を支援させます。
actors.hero.abilities.rogue.shadowclone.desc=盗賊が影の分身を召喚し、指示して戦わせることができます。分身への指示はチャージを消費しません。\n\n分身はHP80、近接ダメージ10〜20、装甲なしです。特定の才能発動後、これらのステータスは本体の武器と鎧による強化を受けられます。
actors.hero.abilities.rogue.shadowclone$shadowally.name=影の分身
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=あなたの分身がその位置へ移動しました。
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=あなたの分身があなたに追随しています。
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=あなたの分身が攻撃を開始しました！
actors.hero.abilities.rogue.shadowclone$shadowally.directed_wander=あなたの分身が周囲を巡回しています。
actors.hero.abilities.rogue.shadowclone$shadowally.desc=不定形の影から作られた盗賊の複製体。微動だにせず、虚ろな目で、煙のような闇が周囲を漂っています。\n\n完全な複製とは言えませんが、有能な戦闘要員であり、特定の才能により本体の装備から恩恵を受けることができます。
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=特定の英雄鎧スキルでこのユニットを発見できます。

actors.hero.abilities.huntress.spectralblades.name=霊魂の刃
actors.hero.abilities.huntress.spectralblades.short_desc=ハンターが目標に_霊魂の刃_を投げ、装備中の近接武器に応じたダメージを与えます。
actors.hero.abilities.huntress.spectralblades.desc=ハンターが敵に霊能の刃を投げつけ、近接武器による遠隔攻撃のように機能します。この攻撃はエンチャントを含むすべての近接攻撃効果を保持します。
actors.hero.abilities.huntress.naturespower.name=自然の力
actors.hero.abilities.huntress.naturespower.short_desc=ハンターが_自然の力_の加護を呼び出し、短時間移動速度と霊能弓の射撃速度を上昇させます。
actors.hero.abilities.huntress.naturespower.desc=ハンターと彼女の弓に自然の力が宿りました！この効果は8ターン持続します。\n\n自然の力の下、ハンターは2倍の移動速度と33%の霊能弓射撃速度を得ます。この効果はスナイパー専精の追撃には影響しません。
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=自然の力
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=ハンターが一時的に自然の力を得て、移動速度と霊能弓射撃速度が上昇しています。\n\n残りターン数：%s
actors.hero.abilities.huntress.spirithawk.name=霊能鷹
actors.hero.abilities.huntress.spirithawk.no_space=あなたの近くに召喚可能な空きスペースがありません。
actors.hero.abilities.huntress.spirithawk.short_desc=ハンターが_霊能鷹_の使い魔を召喚し、偵察を補助し敵の注意を引きつけます。
actors.hero.abilities.huntress.spirithawk.desc=ハンターが霊能鷹を召喚します。鷹が存在する間、この能力を使用して指示を与えられます。鷹は100ターン存在し、指示はチャージを消費しません。\n\n霊能鷹は脆弱で攻撃力に欠けますが、素早い移動、機敏な回避、正確な攻撃がこれらの欠点を補います。鷹はハンターと視界を共有し、炎や毒ガスなどの環境効果を無効化します。鷹はハンターの指示があった時のみ攻撃を開始します。
actors.hero.abilities.huntress.spirithawk$hawkally.name=霊能鷹
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=あなたの鷹がその位置へ移動しました。
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=あなたの鷹があなたに追随しています。
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=あなたの鷹が攻撃を開始しました！
actors.hero.abilities.huntress.spirithawk$hawkally.directed_wander=あなたの鷹が周囲を巡回しています。
actors.hero.abilities.huntress.spirithawk$hawkally.desc=ハンターが召喚した霊能鷹。全身から明るく空虚な青い光を放ち、絶えず周囲の環境を探っています。\n\n鷹は武力闘争には適しませんが、その速度と視野により、効率的な偵察と危険な囮任務をこなすことができます。
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=残りターン数：%dターン
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=鷹は次の%d回の攻撃を確実に回避します。
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=特定の英雄鎧スキルでこのユニットを発見できます。

actors.hero.abilities.duelist.challenge.name=果たし合い
actors.hero.abilities.duelist.challenge.prompt=果たし合いを仕掛ける敵を選択
actors.hero.abilities.duelist.challenge.already_dueling=同時に複数の果たし合いを行うことはできません。
actors.hero.abilities.duelist.challenge.ally_target=敵にのみ果たし合いを仕掛けられます。
actors.hero.abilities.duelist.challenge.unreachable_target=接近不可能な目標は選択できません。
actors.hero.abilities.duelist.challenge.distant_target=その敵は遠すぎて果たし合いを仕掛けられません。
actors.hero.abilities.duelist.challenge.short_desc=決闘者が近くの敵に_果たし合い_を仕掛け、短時間他のすべての敵の時間を停止します。
actors.hero.abilities.duelist.challenge.desc=決闘者が近くの敵に果たし合いを仕掛けます。選ばれた敵は強制的に応戦し、他の敵は一時的に時が止まります。\n\n決闘者は5マス以内で接近可能な敵にのみ果たし合いを仕掛けられます。以下のいずれかの条件で果たし合いは終了します：10ターン経過、敵の死亡、または決闘者と敵の距離が6マスを超えた場合。\n\n時が止まった敵は無敵状態です。決闘者の味方はこの能力で時を止められません。同様に、頭目に使用した場合、その手下も時を止められません。
actors.hero.abilities.duelist.challenge$duelparticipant.name=決闘中
actors.hero.abilities.duelist.challenge$duelparticipant.desc=このキャラクターは決闘中です。決闘の両者およびその味方や手下は通常通り行動できますが、他のキャラクターの時間は凍結され行動できません。\n\n以下の条件で決闘は終了します：決闘が一定時間を超えた場合、決闘者の一方が死亡した場合、決闘者同士の距離が6マスを超えた場合。\n\n残りターン数：%d
actors.hero.abilities.duelist.elementalstrike.name=エレメンタルストライク
actors.hero.abilities.duelist.elementalstrike.short_desc=決闘者が_エレメンタルストライク_を放ち、所持武器のエンチャントに基づく効果を扇形範囲に付与します。
actors.hero.abilities.duelist.elementalstrike.desc=決闘者が敵1体または地点1つを打撃し、必中の通常攻撃を行い、65度角4マス半径の扇形範囲に魔法効果を生み出します。魔法の具体的効果は決闘者のメインウェポンのエンチャントに依存します。
actors.hero.abilities.duelist.elementalstrike.generic_desc=エンチャントのないエレメンタルストライクは、小さな魔力爆発を引き起こし、範囲内の全敵に6〜12のダメージを与えます。
actors.hero.abilities.duelist.feint.name=フェイント
actors.hero.abilities.duelist.feint.prompt=突進する位置を選択
actors.hero.abilities.duelist.feint.too_far=その位置はあなたに隣接していません。
actors.hero.abilities.duelist.feint.bad_location=その位置には移動できません。
actors.hero.abilities.duelist.feint.short_desc=決闘者が_フェイント_を放ち、攻撃を装って隣接位置に突進します。敵に残像を攻撃させ、隙を露呈させます。
actors.hero.abilities.duelist.feint.desc=決闘者が攻撃を装って隣接位置に突進し、元の位置に残像を残します。決闘者を攻撃していた敵は残像を攻撃します。\n\n残像を攻撃した敵は混乱し、本来の次の行動がキャンセルされ、伏撃可能になります。

actors.hero.abilities.cleric.ascendedform.name=超凡昇天
actors.hero.abilities.cleric.ascendedform.short_desc=クレリックが_超凡昇天_し、神格化状態に入り、新たな魔法、攻撃範囲、バリアを獲得します。
actors.hero.abilities.cleric.ascendedform.desc=クレリックが神聖エネルギーを解放し、10ターン持続する神格化状態に入ります。この形態では、クレリックは新たな魔法を放ち、攻撃範囲+2マス、バリア30を獲得します。また、聖典チャージを1消費して魔法を唱える度に、クレリックはバリアを10獲得します。\n\n超凡昇天およびその魔法で得たバリアは自然減少しませんが、超凡昇天終了時に即座に消失します。再使用することで超凡昇天の持続時間をリセットできます。
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=超凡昇天
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=神聖エネルギーがクレリックの周囲を流れています。神格化状態では、クレリックは神聖エネルギーにより攻撃範囲+2マスを得て、聖典チャージを1消費するごとにバリア10を獲得します。さらに、超凡昇天に関連する才能で解放された魔法を唱えられます。\n\n超凡昇天およびその魔法で得たバリアは自然減少しませんが、超凡昇天終了時に即座に消失します。\n\n現在のバリア値：%1$d\n残りターン数：%2$d
actors.hero.abilities.cleric.trinity.name=三位一体
actors.hero.abilities.cleric.trinity.no_imbue=三位一体は現在いずれの部位の効果群も獲得していません。部位魔法を使用して効果群を獲得してください。
actors.hero.abilities.cleric.trinity.no_duplicate=三位一体は既に装備している装備の効果を複製できません！
actors.hero.abilities.cleric.trinity.ench_glyph_use=三位一体は_%2$sチャージ_を消費して、そのエンチャントまたはグリフの効果を_%1$dターン_獲得します。
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=三位一体は_%2$sチャージ_を消費して、その_強力な_エンチャントまたはグリフの効果を_%1$dターン_獲得します。
actors.hero.abilities.cleric.trinity.wand_use=三位一体は_%2$sチャージ_を消費して、その杖の_%1$dレベル_の効果を使用します。
actors.hero.abilities.cleric.trinity.wand_multi_use=三位一体は_%2$sチャージ_を消費して、その_複数チャージ_杖の_%1$dレベル_の効果を使用します。
actors.hero.abilities.cleric.trinity.thrown_use=三位一体は_%2$sチャージ_を消費して、その投擲武器の_%1$dレベル_の効果を使用します。
actors.hero.abilities.cleric.trinity.ring_use=三位一体は_%2$sチャージ_を消費して、_%1$dレベル_のその指輪の効果を_20ターン_獲得します。
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=三位一体は_%2$sチャージ_を消費して、その神器の遠隔錬金効果を使用します。
actors.hero.abilities.cleric.trinity.chaliceofblood_use=三位一体は_%2$sチャージ_を消費して、その神器の_%1$dレベル_の受動的HP回復効果を20ターン獲得します。
actors.hero.abilities.cleric.trinity.driedrose_use=三位一体は_%2$sチャージ_を消費して、その神器で_%1$dレベル_の幽霊HPを持つ友好的な腐敗怨霊を召喚する効果を使用します。
actors.hero.abilities.cleric.trinity.etherealchains_use=三位一体は_%2$sチャージ_を消費して、その神器の_%1$dマス_範囲の鎖を放つ効果を使用します。
actors.hero.abilities.cleric.trinity.hornofplenty_use=三位一体は_%2$sチャージ_を消費して、その神器の一口食べる効果を使用します。
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=三位一体は_%2$sチャージ_を消費して、その神器の_%1$dレベル_の敵からの盗難効果を使用します。
actors.hero.abilities.cleric.trinity.sandalsofnature_use=三位一体は_%2$sチャージ_を消費して、その神器のランダム有害種子を植える効果を使用します。
actors.hero.abilities.cleric.trinity.talismanofforesight_use=三位一体は_%2$sチャージ_を消費して、その神器の_%1$dレベル_の探知効果を使用します。
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=三位一体は_%2$sチャージ_を消費して、その神器の_%1$d_ターン持続する時間凍結効果を獲得します。
actors.hero.abilities.cleric.trinity.unstablespellbook_use=三位一体は_%2$sチャージ_を消費して、その神器の_%1$d/10_追加消費なしで巻物を使用する確率のランダムロール効果を使用します。
actors.hero.abilities.cleric.trinity.skeletonkey_use=三位一体は_%2$sチャージ_を消費して、その神器の挿入効果を使用します。
actors.hero.abilities.cleric.trinity.cloakofshadows_use=三位一体は_%2$sチャージ_を消費して、その神器の_%1$d_ターン持続する隐身効果を獲得します。
actors.hero.abilities.cleric.trinity.capeofthorns_use=三位一体は_%2$sチャージ_を消費して、その神器の_%1$d_ターン持続する茨効果を獲得します。
actors.hero.abilities.cleric.trinity.lloydsbeacon_use=三位一体は_%2$sチャージ_を消費して、その神器の転送効果を使用します。
actors.hero.abilities.cleric.trinity.shuriken_box_use=三位一体は_%2$sチャージ_を消費して、その神器から_%1$dレベル_の小型手裏剣を投げる効果を使用します。
actors.hero.abilities.cleric.trinity.instructiontool_use=三位一体は_%2$sチャージ_を消費して、その神器で_%1$d/10_の英雄最大HPを持つゴーレム無人機を生成する効果を使用します。
actors.hero.abilities.cleric.trinity.cost=この鎧スキルのチャージ消費は不定ですが、通常は_%d_です。
actors.hero.abilities.cleric.trinity.short_desc=クレリックが_三位一体_の鎧スキルを獲得し、神力で万物を統べ、新たな魔法を使用して鑑定済み装備を選択し幻影化します。
actors.hero.abilities.cleric.trinity.desc=クレリックが_三位一体_の鎧スキルを獲得し、3種の新たな魔法を使用して様々なアイテム効果を選択・使用します。各部位魔法はクレリックがそのゲーム内で鑑定済みの異なる種類の装備効果を幻影化することに特化しています：_体の部位_（武器と鎧）、_知の部位_（杖と投擲武器）、_霊の部位_（指輪と神器）。\n\n各部位魔法は同時に1つの効果のみ幻影化でき、クレリックは三位一体使用時にどの部位魔法の効果を使用するか選択できます。三位一体は既に装備している装備の効果を複製できません。
actors.hero.abilities.cleric.trinity$wndusetrinity.text=三位一体が使用する部位魔法を選択してください。異なる部位の効果は同時に有効化できます。
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_体の部位：%s_
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_知の部位：%s_
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_霊の部位：%s_
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=三位一体が幻影化するアイテム効果を選択してください。確認前に追加情報が表示されます。
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=体の部位効果を選択
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=知の部位効果を選択
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=霊の部位効果を選択
actors.hero.abilities.cleric.powerofmany.name=万象一心
actors.hero.abilities.cleric.powerofmany.prompt_default=味方または位置を選択
actors.hero.abilities.cleric.powerofmany.prompt_ally=聖天の誓約者を指揮
actors.hero.abilities.cleric.powerofmany.ally_exists=既に強化された味方が存在します。
actors.hero.abilities.cleric.powerofmany.no_vision=視界外の位置を目標にできません。
actors.hero.abilities.cleric.powerofmany.only_allies=味方のみ強化できます。
actors.hero.abilities.cleric.powerofmany.short_desc=クレリックが_万象一心_を導き、既存の味方を強化するか、エネルギーを槍に凝集して新たな誓約者を創造します。
actors.hero.abilities.cleric.powerofmany.desc=クレリックが_万象一心_を導き、既存の味方を強化するか、エネルギーを槍に凝集して100ターン持続する新たな誓約者を創造します。クレリックが空き位置にこの鎧スキルを放つと新たな誓約者が創造されます。\n\n万象一心で強化されると、任意の味方が25%のダメージボーナスと25%のダメージ軽減を得て、クレリックと視界を共有します。鎧スキル使用時、味方はさらに25のバリアを獲得します。\n\nクレリックは強化された味方にのみ使用可能な3種の新たな魔法も獲得します。万象一心はこれらの魔法が効果中でも終了しません。
actors.hero.abilities.cleric.powerofmany$powerbuff.name=万象一心
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=この味方は万象一心により強化され、25%%のダメージボーナスと25%%のダメージ軽減を得ています。味方はクレリックと視界を共有し、万象一心の呪文の恩恵を受けられます。\n\n虹の衛などの味方が消散しても、万象一心の効果は持続しますが、効果時間は依然としてカウントダウンされます。\n\n残りターン数：%s
actors.hero.abilities.cleric.powerofmany$lightally.name=聖天の誓約者
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=あなたの味方がその位置へ移動しました。
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=あなたの味方があなたに追随しています。
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=あなたの味方が攻撃を開始しました！
actors.hero.abilities.cleric.powerofmany$lightally.directed_wander=あなたの味方が周囲を巡回しています。
actors.hero.abilities.cleric.powerofmany$lightally.desc=クレリックの探索仲間のクローンで、全身が凝縮された聖光でできています。聖天の誓約者は別の英雄の外見を持ちますが、その特殊能力は一切有していません。この味方の万象一心効果が存在する限り、味方は持続します。\n\nこの味方はチャージを消費せず、万象一心の鎧スキルを再度使用することで指示を与えられます。
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=特定の英雄鎧スキルでこのユニットを発見できます。


actors.hero.abilities.ratmogrify.name=鼠化術
actors.hero.abilities.ratmogrify.cant_transform=この目標は鼠化できません！
actors.hero.abilities.ratmogrify.too_strong=この敵は強力すぎて鼠化術が効きません！
actors.hero.abilities.ratmogrify.short_desc=_鼠化術_を放ち、目標の敵を変形させます！敵は一時的に全ての特殊能力を失った鼠になります。
actors.hero.abilities.ratmogrify.desc=敵を6ターンの間鼠に変えられます！ただし、Boss、味方、および鼠そのものを変形することはできません。\n\n鼠化された敵は元のステータス値を引き継ぎますが、全ての特殊能力を失います。
actors.hero.abilities.ratmogrify$transmograt.name=鼠化%s
actors.hero.abilities.ratmogrify$transmograt.desc=この敵は鼠に変えられました。私にとっては、すべて良いことだ！――鼠王
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=死亡原因：鼠化された敵


##Cleric Spells
actors.hero.spells.auraofprotection.name=守護霊光
actors.hero.spells.auraofprotection.short_desc=聖騎士と近くの味方の防御を強化します。
actors.hero.spells.auraofprotection.desc=聖騎士が保護エネルギーを放射し、自身の周囲に_20ターン_持続する守護霊光を形成します。聖騎士の_2マス_範囲内の任意の味方（聖騎士自身を含む）は、_%1$d%%_のダメージ軽減と_%2$d%%_の聖騎士鎧グリフ強化を獲得します。\n\nこのダメージ軽減は他の軽減効果（鎧など）より優先されます。グリフ強化は常に有効ですが、あるユニット（聖騎士自身や虹の衛など）が既に聖騎士のグリフから効果を得ている場合、この魔法で再度効果を得ることはできません。\n\nこの魔法の詠唱は_2ターン_消費します。
actors.hero.spells.auraofprotection$aurabuff.name=守護霊光
actors.hero.spells.auraofprotection$aurabuff.desc=聖騎士が自身の周囲に保護エネルギーを放射しています。\n\n近くの任意の味方（聖騎士自身を含む）はダメージ軽減と聖騎士鎧グリフ強化を得ます。\n\n残りターン数：%s

actors.hero.spells.beamingray.name=光霊召喚
actors.hero.spells.beamingray.no_space=そこにはあなたの味方が現れるスペースがありません。
actors.hero.spells.beamingray.out_of_range=その位置は範囲外です。
actors.hero.spells.beamingray.short_desc=味方を転送し、ダメージボーナスを得させます。
actors.hero.spells.beamingray.desc=クレリックが味方の力を導き、味方を特定の位置に転送できる光線とします。光線が敵に当たると、転送光線は味方を敵の近くに転送し、その敵を攻撃目標とします。\n\n転送光線の最大範囲は_%1$dマス_で、万象一心の_4マス_範囲内の最も近い敵に対するダメージボーナスを_%2$d%%_に引き上げ、_10ターン_持続します。この魔法は通常移動できない味方も転送できますが、その場合は転送光線の範囲が減衰します。\n\nこの魔法の詠唱は_2ターン_消費します。
actors.hero.spells.beamingray$beamingrayboost.name=光霊召喚
actors.hero.spells.beamingray$beamingrayboost.desc=この味方は最近光霊召喚の転送光線で転送され、転送後の最も近い敵に対するダメージボーナスを得ています。万象一心はこの強化の効果期間中は終了しません。\n\n残りターン数：%s

actors.hero.spells.blessspell.name=神聖祝福
actors.hero.spells.blessspell.short_desc=術者に祝福とバリアを付与し、他のユニットに祝福と治療を付与します。
actors.hero.spells.blessspell.desc=術者が自身または視界内の1ユニットに神聖祝福を付与します。\n\n神聖祝福が術者自身を目標とする場合、効果はより弱く、_%1$dターンの祝福_と_%2$dのバリア_を得ます。\n\n神聖祝福が他のユニットを目標とする場合、効果はより強く、_%3$dターンの祝福_と_%4$dの治療_を得ます。過剰治療はバリアに変換されます。\n\nこの魔法の詠唱は対象に関わらず_2ターン_消費します。

actors.hero.spells.bodyform.name=体の部位
actors.hero.spells.bodyform.short_desc=三位一体にエンチャントまたはグリフを選択します。
actors.hero.spells.bodyform.desc=クレリックがそのゲーム内で鑑定済みのエンチャントまたはグリフを1つ選択し、三位一体にその効果を幻影化させます。\n\n三位一体使用時、クレリックは選択したエンチャントまたはグリフの効果を_%dターン_得ます。この一時的なエンチャントまたはグリフは、本来のエンチャントまたはグリフが持つべき全ての効果を有します。\n\nこの魔法は三位一体が現在幻影化している体の部位の効果をリセットします。\n\nこの魔法の詠唱は_時間を消費しません_。
actors.hero.spells.bodyform$bodyformbuff.name=体の部位
actors.hero.spells.bodyform$bodyformbuff.desc=部位魔法「体の部位」により、エンチャントまたはグリフの効果を得ています。あたかもそれを現在の武器または鎧に装備しているかのようです。\n\n注意：体の部位は既に装備している装備の効果を複製できません。\n\n現在の効果：%1$s\n\n残りターン数：%2$s

actors.hero.spells.cleanse.name=神聖浄化
actors.hero.spells.cleanse.short_desc=デバフを除去しバリアを得ます。
actors.hero.spells.cleanse.desc=術者が自身と視界内の味方の全てのデバフ効果を除去します。その後、影響を受けた全てのユニットは_%1$dターン_のデバフ免疫と_%2$dのバリア_を得ます。\n\nこの魔法の詠唱は_2ターン_消費します。

actors.hero.spells.clericspell.prompt=目標を選択
actors.hero.spells.clericspell.no_target=そこには何も目標がありません。
actors.hero.spells.clericspell.invalid_target=その位置を目標にできません。
actors.hero.spells.clericspell.invalid_enemy=その敵を目標にできません。
actors.hero.spells.clericspell.charge_cost=チャージ消費：%d

actors.hero.spells.divinesense.name=神聖感知
actors.hero.spells.divinesense.short_desc=短時間広範囲の霊視感知を得ます。
actors.hero.spells.divinesense.desc=術者が感知を周囲の環境に集中させ、_50ターン_持続する_%dマス_範囲の霊視感知を得ます。\n\nこの魔法の詠唱は_時間を消費しません_。
actors.hero.spells.divinesense$divinesensetracker.name=神聖感知
actors.hero.spells.divinesense$divinesensetracker.desc=このユニットは一時的に霊視感知で周囲の他の生物を見ることができます。\n\n残りターン数：%s

actors.hero.spells.divineintervention.name=神聖介入
actors.hero.spells.divineintervention.short_desc=クレリックと味方のバリアを大幅に強化します。
actors.hero.spells.divineintervention.desc=クレリックが聖典を介して自身と味方に無敵の神力を注入し、全員のバリアを_%1$d_に引き上げ、超凡昇天を_%2$dターン_延長します。この魔法の比類なき防御力は、その非常に高いチャージ消費に見合ったものです。\n\n超凡昇天が提供する他のバリアと同様、このバリアは自然減少しませんが、超凡昇天終了時に即座に消失します。\n\nこの魔法の詠唱は_2ターン_消費します。

actors.hero.spells.flash.name=天国の階段
actors.hero.spells.flash.prompt=位置を選択
actors.hero.spells.flash.short_desc=近くの位置へ転送します。
actors.hero.spells.flash.desc=クレリックが近くの位置に超凡昇天の神力を使って転送します。天国の階段は範囲内の占有されていない探索済み領域であればどこへでもクレリックを転送できます。同じ超凡昇天中、この魔法を使用するたびにより多くの聖典チャージを消費します。\n\nこの魔法の詠唱は_2ターン_消費します。

actors.hero.spells.guidinglight.name=導きの光
actors.hero.spells.guidinglight.short_desc=遠距離魔法の必中ダメージを与えます。
actors.hero.spells.guidinglight.desc=術者が魔力の光矢を発射して目標を攻撃し、_2〜8ダメージ_を与え聖輝を付与します。聖輝が付与された敵への次の非超威力の物理攻撃は必ず命中します。\n\nこの魔法の詠唱は_2ターン_消費します。
actors.hero.spells.guidinglight.desc_priest=_祈祭師がこの魔法を放つと効果が強化されます。_ 50ターン毎の初回詠唱は聖典チャージを消費せず、聖輝は放射光、杖、他のユニット、敵に直接作用する神器で消費できます。この方法で聖輝を使用すると、_祈祭師レベル+5_に等しい追加魔法ダメージを与えます。
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=導きの光
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=祈祭師は50ターン毎に導きの光を無料で1回詠唱できます。\n\n残りターン数：%s
actors.hero.spells.guidinglight$illuminated.name=聖輝
actors.hero.spells.guidinglight$illuminated.desc=このユニットは導きの光に撃たれて聖輝を得ています。聖輝の明るさは周囲を照らすほどではありませんが、その魔力によりクレリックの敵への攻撃が命中しやすくなります。
actors.hero.spells.guidinglight$illuminated.desc_priest=祈祭師は放射光、杖の詠唱、味方の攻撃、または一部の神器効果で聖輝を消費できます。この方法で聖輝を使用すると、祈祭師レベル+5に等しい追加魔法ダメージを与えます。
actors.hero.spells.guidinglight$illuminated.desc_generic=他の英雄でも灼熱の光の才能で敵に追加ダメージを与えられますが、そこから精度ボーナスを得ることはできません。

actors.hero.spells.hallowedground.name=神聖領域
actors.hero.spells.hallowedground.prompt=位置を選択
actors.hero.spells.hallowedground.short_desc=味方を治療し、敵を減速させ、範囲内に植物を拡散します。
actors.hero.spells.hallowedground.desc=祈祭師がその神聖魔法を周囲の地面に集め、_%1$dx%1$d_範囲、_20ターン_持続する神聖領域を創造します。\n\n詠唱時、魔法は全味方を_15_回復し（無傷の味方と祈祭師はバリアを得ます）、短時間敵を絡め取り、低草を拡散します。\n\n神聖領域は毎ターン味方を_1_回復し（無傷の味方と祈祭師はバリアを得ます）、敵を脆弱にし、ランダムに高草を生成します。\n\n神聖領域は炎で破壊されます。また、受動的回復効果が無効化されているか、祈祭師が長期間経験値を獲得していない場合、神聖領域は枯草しか生成しません。\n\nこの魔法の詠唱は_2ターン_消費します。
actors.hero.spells.hallowedground$hallowedterrain.desc=ここは神聖領域と化しています。神聖領域は敵を減速させ、味方を治療し、植物を拡散します。

actors.hero.spells.holyintuition.name=神聖予知
actors.hero.spells.holyintuition.prompt=アイテムを選択
actors.hero.spells.holyintuition.cursed=このアイテムには悪意に満ちた魔力が潜んでいると感じます。
actors.hero.spells.holyintuition.uncursed=このアイテムは呪われていません。
actors.hero.spells.holyintuition.short_desc=アイテムが呪われているかどうかを鑑定します。
actors.hero.spells.holyintuition.desc=術者が感知を1つのアイテムに集中させ、装備せずともその呪いの有無を判断できます。\n\nこの魔法の詠唱は_2ターン_消費します。

actors.hero.spells.holylance.name=聖槍
actors.hero.spells.holylance.short_desc=高威力の遠距離魔法ダメージを与えます。
actors.hero.spells.holylance.desc=祈祭師が大量のエネルギーを致死的な投擲用聖槍に凝集します。聖槍は_%1$d〜%2$dダメージ_を与え、アンデッドとデーモン目標には常に最大ダメージを与えます。\n\nこの魔法のチャージ消費は非常に高く、さらに_30ターンのクールダウン_があります。\n\nこの魔法の詠唱は_2ターン_消費します。
actors.hero.spells.holylance$lancecooldown.name=聖槍-クールダウン
actors.hero.spells.holylance$lancecooldown.desc=祈祭師が最近聖槍を放ったため、再使用までに時間を要します。\n\n残りターン数：%s

actors.hero.spells.holyward.name=神聖鎧
actors.hero.spells.holyward.glyph_name=神聖%s
actors.hero.spells.holyward.glyph_desc=このグリフは鎧が防御できるダメージ量をわずかに増加させます。
actors.hero.spells.holyward.short_desc=一時的にグリフを上書きして鎧の防御を強化します。
actors.hero.spells.holyward.desc=術者が着用中の鎧に神聖グリフを付与し、鎧の防御を_1_増加させます。この魔法の詠唱は時間を消費しません。\n\nこのグリフは_50ターン_持続し、持続時間中は鎧の既存の正面グリフを上書きします。術者は鎧を着用していなくても神聖グリフの効果を発動できます。\n\nこの魔法の詠唱は_時間を消費しません_。
actors.hero.spells.holyward.desc_paladin=_聖騎士がこの魔法を放つと効果が強化されます。_ 神聖鎧の追加ダメージ防御が_3_に上昇し、既存のエンチャントを上書きしなくなります。さらに、神聖鎧が有効な間に他の魔法を唱える際に消費したチャージ1毎に、魔法効果が_10ターン_延長されます。
actors.hero.spells.holyward$holyarmbuff.name=神聖鎧
actors.hero.spells.holyward$holyarmbuff.desc=術者が着用中の鎧に神聖グリフを付与し、既存のグリフを一時的に上書きして鎧の防御を1増加させています。\n\n残りターン数：%s
actors.hero.spells.holyward$holyarmbuff.desc_paladin=聖騎士がその身に纏う鎧に神聖な刻印を授け、鎧に追加で_%d点_のダメージ軽減を付与しました。\n\n神聖鎧が有効な状態で他の魔法を唱える際に消費するチャージ1点につき、魔法効果が10ターン延長されます。\n\n残りターン数：%s

actors.hero.spells.holyweapon.name=神聖武器
actors.hero.spells.holyweapon.ench_name=神聖%s
actors.hero.spells.holyweapon.ench_desc=神聖武器で攻撃された敵は追加の魔法ダメージを受けます。
actors.hero.spells.holyweapon.short_desc=一時的に既存のエンチャントを上書きして武器を強化します。
actors.hero.spells.holyweapon.desc=術者が手にした武器に神聖なエンチャントを付与し、武器が敵を攻撃するたびに追加で_2点の魔法ダメージ_を与えます。この魔法の詠唱は瞬時です。\n\nこのエンチャントは_50ターン_持続し、持続時間中は武器に既存のポジティブなエンチャントをすべて上書きします。素手での攻撃でも神聖エンチャントの効果が発動します。\n\nこの魔法の詠唱は_瞬時_です。
actors.hero.spells.holyweapon.desc_paladin=_聖騎士_がこの魔法を唱えると効果がさらに強力になります。神聖武器の追加魔法ダメージが_6点_に上昇し、既存のエンチャントを上書きしなくなります。代わりに神聖武器が有効な状態で他の魔法を唱える際に使用するチャージ1点につき、魔法効果が10ターン延長されます。
actors.hero.spells.holyweapon.runemark=_ルーンメイジ_が神聖エンチャントが付与された刻印を起爆すると、一定の報酬を得られます。
actors.hero.spells.holyweapon$holywepbuff.name=神聖武器
actors.hero.spells.holyweapon$holywepbuff.desc=術者が手にした武器に神聖なエンチャントを付与し、一時的に既存のエンチャントをすべて上書きして、武器の攻撃ごとに追加で2点の魔法ダメージを与えます。\n\n残りターン数：%s
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=パラディンが手にした武器に神聖なエンチャントを付与し、攻撃ごとに追加で6点の魔法ダメージを与えます。\n\n神聖武器が有効な状態で他の魔法を唱える際に消費するチャージ1点につき、10ターンの魔法効果が延長されます。\n\n残りターン数：%s

actors.hero.spells.judgement.name=終末天啓
actors.hero.spells.judgement.short_desc=視野内のすべての敵にダメージを与えます。
actors.hero.spells.judgement.desc=牧師が蒼穹を引き裂き、聖光の名のもとに視野内のすべての敵を審判します。この魔法は_%1$d～%2$d点のダメージ_を与えることに加え、牧師が超凡昇天に達してから（または前回の終末天啓の詠唱以来）の追加の詠唱1回につき、_33%%_の追加ダメージを与えます。\n\n現在の終末天啓は_%3$d～%4$d点のダメージ_を与えます。\n\nこの魔法の詠唱は_2ターン_を消費します。

actors.hero.spells.layonhands.name=聖癒の触れ
actors.hero.spells.layonhands.short_desc=即座に近くの1ユニットを治療するか、聖騎士にバリアを付与します。
actors.hero.spells.layonhands.desc=聖騎士が両手で神聖なエネルギーを導き出し、触れた任意のユニットを治療または保護します。\n\n聖騎士はこの魔法を唱えて近くの任意のユニットに_%1$d点の治療_を与えるか、自身に_%1$d点のバリア_を付与できます。この魔法の超過治療はバリアに変換されます。\n\nこの魔法は瞬時に唱えられ、重ねがけも可能ですが、3回分の詠唱値を超えるバリアを瞬時に付与することはできません。\n\nこの魔法の詠唱は_瞬時_です。

actors.hero.spells.lifelinkspell.name=血色の絆
actors.hero.spells.lifelinkspell.short_desc=仲間と被ダメージを共有し、ダメージ軽減を付与します。
actors.hero.spells.lifelinkspell.desc=牧師が自身と強化された仲間との間の生命の繋がりを強化します。この強化版の生命の繋がりは_%1$dターン_持続し、英雄とその仲間が受けるあらゆるダメージを共有し、万物一心のダメージ軽減を_%2$d%%_に引き上げます。注意：ダメージ共有の優先度は鎧より低いですが、万物一心のダメージ軽減よりは高いです。\n\n生命の繋がり効果が有効な間、どちらか一方に対して4階以下の増益型牧師魔法を唱えると、両方に効果が及びます。\n\nこの魔法の詠唱は_2ターン_を消費します。
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=血色の絆
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=牧師が最近この仲間に血色の絆を唱え、生命の繋がりを確立しました。\n\n生命の繋がりの通常効果に加えて、このユニットはダメージ軽減を獲得し、任意の増益型牧師魔法を牧師とこの仲間に唱えると両方に効果が及び、万物一心はこの効果が有効な間は終了しません。\n\n残りターン数：%s

actors.hero.spells.mindform.name=智の位格
actors.hero.spells.mindform.short_desc=三位一体のために魔杖または投射武器を選択します。
actors.hero.spells.mindform.desc=牧師がこのゲームで既に鑑定済みの魔杖または投射武器を1つ選択し、三位一体にその効果を幻化させます。\n\n三位一体を使用する際、牧師は選択したアイテムの_%dレベル_の効果で1回攻撃します。この攻撃はそのアイテムを通常使用した際に発動するすべての効果を発動します。\n\nこの魔法は三位一体に既存の任意の智の位格効果を更新します。\n\nこの魔法の詠唱は_瞬時_です。

actors.hero.spells.mnemonicprayer.name=祈願詩篇
actors.hero.spells.mnemonicprayer.short_desc=仲間/敵の増益/減益効果を延長し、聖輝を再付与します。
actors.hero.spells.mnemonicprayer.desc=祭司が特定の対象のすべての増益または減益効果を_%1$dターン_延長する経文を唱えます。増益効果は仲間（祭司自身を含む）に対してより長く持続し、減益効果は敵に対してより長く持続します。\n\n祈願詩篇は特定の対象の増益または減益効果を一度だけ延長でき、鎧スキル由来の増益効果は延長できません。\n\nこの魔法の詠唱は_瞬時_です。

actors.hero.spells.radiance.name=破暁輻射
actors.hero.spells.radiance.short_desc=視野内の敵に聖輝を発動・付与し、一時的に気絶させます。
actors.hero.spells.radiance.desc=祭司が全身から聖光を放ち、視野内のすべての敵を_3ターン_気絶させます。敵が既に聖輝を得ている場合、この魔法は聖輝の追加ダメージを発動し、その後に聖輝を付与します。このフロアの視界が暗い場合、この魔法はさらに祭司を_100ターン_発光させます。\n\nこの魔法の詠唱は_2ターン_を消費します。

actors.hero.spells.recallinscription.name=巻蔵呪言
actors.hero.spells.recallinscription.short_desc=直近で使用した符文石または巻物の効果を再使用します。
actors.hero.spells.recallinscription.desc=術者が神聖魔法を用いて直近で使用したルーンを複製し、_%sターン_以内に使用した巻物または符文石の魔法効果を再び発動します。\n\n巻蔵呪言は昇級巻物、変異巻物、昇華秘巻の効果を再度発動することはできません。チャージ消費は直近で使用したアイテムによって変動します：符文石2チャージ、巻物3チャージ、秘巻4チャージ。変異巻物または変異/昇級巻物に対応する符文石/秘巻の効果を発動する際、チャージ消費はさらに倍増します。\n\nこの魔法の詠唱は_2ターン_を消費します。
actors.hero.spells.recallinscription$useditemtracker.name=最近使用したルーン
actors.hero.spells.recallinscription$useditemtracker.desc=術者が最近、巻蔵呪言の魔法効果に対応したアイテムを1つ使用しました。魔法を唱えることでアイテムの効果を再び発動できます。\n\n使用したアイテム：%1$s\n\n残りターン数：%2$s

actors.hero.spells.shieldoflight.name=神聖盾
actors.hero.spells.shieldoflight.short_desc=単一の対象にのみ有効な一時的な鎧を獲得します。
actors.hero.spells.shieldoflight.desc=術者が自身と敵との間に1枚の薄い聖なる盾を作り出し、その敵に対する鎧の防御を_5ターン_の間_%1$d～%2$d点_増加させます。\n\nこの魔法の詠唱は_瞬時_ですが、同時に複数の対象に使用することはできません。
actors.hero.spells.shieldoflight$shieldoflighttracker.name=神聖盾
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=このユニットと敵の間に薄い聖なる盾が立ちはだかっています。聖盾の強度は攻撃を完全に防ぐほどではありませんが、軽減することはできます。\n\n残りターン数：%s

actors.hero.spells.spiritform.name=霊の位格
actors.hero.spells.spiritform.short_desc=三位一体のために指輪または神器を選択します。
actors.hero.spells.spiritform.desc=牧師がこのゲームで既に鑑定済みの指輪または神器（神聖法典を除く）を1つ選択し、三位一体にその効果を幻化させます。\n\n選択したアイテムが指輪の場合、三位一体は選択した指輪の_%1$dレベル_の効果を_20ターン_獲得します。\n\n選択したアイテムが神器の場合、三位一体は選択した神器の_%2$dレベル_の効果を複製します。三位一体が神器を使用する際の具体的な効果と鎧チャージの消費は神器によって異なります。\n\nこの魔法は三位一体に既に幻化されている任意の霊の位格効果を更新します。\n\nこの魔法の詠唱は_瞬時_です。
actors.hero.spells.spiritform$spiritformbuff.name=霊の位格
actors.hero.spells.spiritform$spiritformbuff.desc=位格魔法「霊の位格」により、あなたはアイテムを装備欄に装備したかのような効果を得ています。\n\n注意：霊の位格はあなたが既に装備している装備の効果を複製することはできません。\n\n現在の効果：%1$s\n\n残りターン数：%2$s

actors.hero.spells.smite.name=至聖斬撃
actors.hero.spells.smite.short_desc=追加ダメージとエンチャント強化を伴う必中の攻撃です。
actors.hero.spells.smite.desc=聖騎士が致死的な近接攻撃に正義の力を込めます。\n\n通常の近接ダメージに加えて、至聖斬撃は超越的な攻撃を必中とし、_300%%_のエンチャント強化を付加し、_%1$d～%2$d点の追加魔法ダメージ_を与えます。\n\n至聖斬撃の追加魔法ダメージは聖騎士のレベルに応じて成長し、悪魔やアンデッドの敵に対しては常に最大の追加魔法ダメージを与えます。\n\nこの魔法の詠唱は_2ターン_を消費します。

actors.hero.spells.stasis.name=星界投射
actors.hero.spells.stasis.short_desc=仲間を地牢から移動させ、その状態を停滞させます。
actors.hero.spells.stasis.desc=牧師が仲間との繋がりを自身に集中させ、仲間を一時的に牧師の体内の一種の停滞したエネルギーに変えます。仲間は最大_%dターン_停滞状態になり、停滞状態の間、そのすべてのポジティブ効果は時間の影響を受けません。\n\n魔法効果が自然に終了すると仲間は牧師の近くに現れます。牧師は消費なしで即座にこの魔法を再度唱えて効果を早期終了させることもできます。星界投射は移動できない仲間も移動させられますが、フロアをまたいで移動させることはできません。\n\nこの魔法の詠唱は_2ターン_を消費します。
actors.hero.spells.stasis$stasisbuff.name=星界投射
actors.hero.spells.stasis$stasisbuff.left_behind=移動できない仲間が後方に取り残されました。
actors.hero.spells.stasis$stasisbuff.desc=牧師が現在仲間を星界投射で停滞状態にしています。この仲間は万物一心を含むすべてのポジティブ効果が停滞し、魔法効果終了時に牧師の近くに再び出現します。この魔法効果は星界投射を再度唱えることで早期終了させることもできます。\n\n停滞中の仲間：%1$s\n残りターン数：%2$s

actors.hero.spells.sunray.name=陽炎射線
actors.hero.spells.sunray.short_desc=遠距離魔法ダメージを与え、対象を1回盲目にします。
actors.hero.spells.sunray.desc=術者が対象に向けて盲目光線を発射し、_%1$d～%2$d点のダメージ_を与え、_%3$dターン_の間対象を盲目にします。陽炎射線はアンデッドと悪魔の対象に必ず最大ダメージを与えます。\n\nこの魔法で命中した敵は視覚を調整し、光線による再びの盲目を防ぎます。しかし、この魔法で盲目にされた後に再びこの魔法で命中された場合、圧倒的な強光により麻痺状態となり、盲目にはなりません。\n\nこの魔法の詠唱は_2ターン_を消費します。

actors.hero.spells.walloflight.name=神聖障壁
actors.hero.spells.walloflight.short_desc=敵を阻む障壁を作り出します。
actors.hero.spells.walloflight.desc=聖騎士が聖光を凝集して壁とし、自身の面前に_1マス_の厚さ、_%1$dマス_の幅、_20ターン_持続する神聖障壁を作り出します。\n\n神聖障壁は視界を遮らないことを除けば通常の壁と変わりません。障壁が作られた際、障壁に閉じ込められた敵は短時間気絶し、条件が許せばノックバックされます。障壁に閉じ込められたものは取り出すことができます。\n\n神聖障壁は8方向に設置できます。既に障壁が存在する場合、この魔法は無料で再度使用して即座に障壁を解除できます。\n\nこの魔法の詠唱は_2ターン_を消費します。
actors.hero.spells.walloflight.early_end=神聖障壁を解除しました。
actors.hero.spells.walloflight$lightwall.desc=神聖障壁がこの場所の通路を塞いでいます。

##main hero
actors.hero.hero.name=あなた
actors.hero.hero.leave=今はまだ去れません。地牢の奥に眠る名利があなたを呼んでいます！
actors.hero.hero.level_up=レベルアップ！
actors.hero.hero.new_level=レベルアップ！精度、回避、最大HPが上昇しました！
actors.hero.hero.new_talent=タレントポイント+1！
actors.hero.hero.unspent=まだ未使用のタレントポイントがあります！
actors.hero.hero.level_cap=これ以上強くなることはできませんが、経験値があなたに力を与えます！
actors.hero.hero.you_now_have=%sを獲得しました。
actors.hero.hero.you_cant_have=%sを持ち運べません。
actors.hero.hero.locked_chest=箱は施錠されており、対応する鍵を持っていません。
actors.hero.hero.locked_door=対応する鍵を持っていません。
actors.hero.hero.noticed_smth=何かに気づきました。
actors.hero.hero.wait=...
actors.hero.hero.search=探索
actors.hero.hero.search_distracted=集中できず、周囲の異常を探るのに苦労しています。
actors.hero.hero.key_distracted=この錠を開けられませんでした。もう一度試してみてください。
actors.hero.hero.pain_resist=痛みで眠気を抑えています。
actors.hero.hero.revive=再生の十字章が砕け、蘇生のエネルギーが放出されました！

##classes
actors.hero.heroclass.warrior=戦士
actors.hero.heroclass.warrior_desc_short=戦士は彼の_破損の紋章_でバリアを生成し、追加のダメージを軽減します。紋章は鎧の間を移行でき、_1レベルの昇級_を持ち運べます。
actors.hero.heroclass.warrior_desc=戦士は初期装備として_独自の破損の紋章_を1つ所持しています。紋章が付着した鎧を装備すると、時間とともにHPの上にバリア値を生成します。紋章は鎧の間を移行でき、1レベルの昇級を持ち運べます。\n\n戦士はより高い筋力値を持ち、_より重い装備をより楽に扱えます_。\n\nまた、戦士は初期装備として_1振の錆びた短剣_、_3個の投石_、布の鎧、水筒、ナップザックを所持しています。\n\n戦士の初期鑑定アイテム：\n_-_治療薬\n_-_変異の巻物、鑑定の巻物、憤怒の巻物
actors.hero.heroclass.warrior_unlock=戦士は初期からアンロックされています。

actors.hero.heroclass.mage=魔法使い
actors.hero.heroclass.mage_desc_short=魔法使いは奥術の専門家で、初期装備として魔杖より強力な_魔杖_を持っています。魔杖には魔法使いが見つけた_任意の魔杖_を注入できます。
actors.hero.heroclass.mage_desc=魔法使いは初期装備として_独自の魔杖_を1本所持しています。この魔杖の自動チャージ速度は通常の魔杖より著しく速く、_1点_の追加最大チャージを持ちます。魔法使いは地牢で見つけた様々な魔杖をこの魔杖に注入できます。\n\nまた、魔法使いは初期装備として魔杖に注入済みの_魔力弾の魔杖_を1本、布の鎧、水筒、ナップザックを所持しています。\n\n魔法使いの初期鑑定アイテム：\n_-_火炎薬\n_-_変異の巻物、鑑定の巻物、昇級の巻物
actors.hero.heroclass.mage_unlock=_昇級の巻物を使って1つのアイテムを強化_することで魔法使いをアンロックします。

actors.hero.heroclass.rogue=盗賊
actors.hero.heroclass.rogue_desc_short=盗賊は_暗影の闘篷_を使って敵を回避したり奇襲したりできます。また、より遠くから_秘密や罠を探知_し、_フロアの出口の位置を即座に把握_します。
actors.hero.heroclass.rogue_desc=盗賊は初期装備として_独自の暗影の闘篷_を1着所持しています。羽織ることでいつでも隠身できます。\n\n盗賊はより遠くから_秘密や罠を探知_し、_フロアの出口の位置を即座に把握_します。\n\nまた、盗賊は初期装備として_1振の短刀_、_3本の飛刀_、布の鎧、水筒、ナップザックを所持しています。\n\n盗賊の初期鑑定アイテム：\n_-_隠身薬\n_-_変異の巻物、鑑定の巻物、探地の巻物
actors.hero.heroclass.rogue_unlock=_1ゲーム中に10回の不意打ち_を行うことで盗賊をアンロックします。

actors.hero.heroclass.huntress=女狩人
actors.hero.heroclass.huntress_desc_short=女狩人は投射武器を得意とし、無限に射撃可能な_霊能弓_を持っています。女狩人は_高草を踏みつぶすことなく_通り抜けられます。
actors.hero.heroclass.huntress_desc=女狩人は初期装備として_独自の霊能弓_を1張所持しており、無限に魔法の矢を射ることができます。\n\n女狩人は_高草を踏みつぶすことなく_通り抜けられます。\n\nまた、女狩人は初期装備として_1対の長銃手袋_、布の鎧、水筒、ナップザックを所持しています。\n\n女狩人の初期鑑定アイテム：\n_-_霊視薬\n_-_変異の巻物、鑑定の巻物、催眠の巻物
actors.hero.heroclass.huntress_unlock=_1ゲーム中に投射武器で10回敵を命中_させることで女狩人をアンロックします。

actors.hero.heroclass.duelist=決闘者
actors.hero.heroclass.duelist_desc_short=決闘者は武器の達人で、武器を使って_独自の武技_を繰り出せます。繰り出される武技は_武器によって異なります_。
actors.hero.heroclass.duelist_desc=決闘者は初期装備として_独自の刺剣_を1振所持しており、時間とともに自然にチャージされる特殊な武技を持っています。\n\n決闘者は地牢内の任意の武器を手にした際に_異なる武技_を使用できます。\n\nまた、決闘者は初期装備として_2本の飛刺_、布の鎧、水筒、ナップザックを所持しています。\n\n決闘者の初期鑑定アイテム：\n_-_筋力薬\n_-_変異の巻物、鑑定の巻物、鏡像の巻物
actors.hero.heroclass.duelist_unlock=_筋力が要求値に達した状態で2階以上の武器を装備_することで決闘者をアンロックします。

actors.hero.heroclass.cleric=牧師
actors.hero.heroclass.cleric_desc_short=牧師は_独自の神聖法典_を用いて神聖魔法を導く神聖な術者です。タレントを通じて_魔法を習得・昇級_できます。
actors.hero.heroclass.cleric_desc=牧師は初期装備として_独自の神聖法典_を1冊所持しており、様々な魔法を唱えられます。\n\n牧師のタレントのほとんどは_魔法の習得または昇級_に特化しています。\n\nまた、牧師は初期装備として_1本の権杖_、布の鎧、水筒、ナップザックを所持しています。\n\n牧師の初期鑑定アイテム：\n_-_浄化薬\n_-_変異の巻物、鑑定の巻物、祓邪の巻物
actors.hero.heroclass.cleric_unlock=_呪われた装備を完全に浄化_することで牧師をアンロックします。

actors.hero.herosubclass.berserker=狂戦士
actors.hero.herosubclass.berserker_short_desc=_狂戦士_はダメージを受けると怒気を蓄積し、怒気は狂戦士の攻撃力を高め、100%に達すると発動して追加のバリアを獲得できます。
actors.hero.herosubclass.berserker_desc=狂戦士は物理ダメージを受けると怒気を得ます（鎧で防いだダメージも含みます）！怒気は時間とともに安定して減少しますが、狂戦士のHPが低い時は減少が遅くなります。\n\n怒気により狂戦士は最大20%の追加ダメージを与えられます。怒気が満タンになると、狂戦士は狂暴化してバーストバリアを獲得し、狂戦士にバリアが残っている限り怒気は減少しません。バリアは狂戦士の鎧レベルの上昇に伴って増加し、HPが低い時にはバリアが大幅に強化されます。狂暴化後、狂戦士はしばらくの休息が必要です。\n\nこの専門は100%怒気時に1つの特殊能力を持ち、複数の特殊能力を持つ場合はショートカットを長押しして切り替えられます。_ランダムモード_が有効で破損の紋章を所持していない場合、この専門を選択すると破損の紋章を1つ獲得します。
actors.hero.herosubclass.gladiator=剣闘士
actors.hero.herosubclass.gladiator_short_desc=_剣闘士_は攻撃が成功するたびに連撃数を蓄積します。剣闘士は連撃数を消費して特殊戦技を使用できます。
actors.hero.herosubclass.gladiator_desc=剣闘士が近接武器または投射武器で目標に命中するたびに、連撃を1蓄積します。剣闘士が2ターン以内（撃殺後は5ターン以内）に目標に命中できなかった場合、連撃はリセットされます。\n\n連撃が蓄積されるにつれ、剣闘士は一連の必中の連撃戦技を使用できます：\n2連撃：敵をノックバック、連撃維持\n4連撃：鎧に基づくダメージ\n6連撃：受け流し攻撃、連撃維持\n8連撃：目標と周囲の敵を攻撃\n10連撃：連撃1回ごとに1回攻撃\n\nこの専門は連撃蓄積時に1つの特殊能力を持ち、複数の特殊能力を持つ場合はショートカットを長押しして切り替えられます。_ランダムモード_が有効で破損の紋章を所持していない場合、この専門を選択すると破損の紋章を1つ獲得します。
actors.hero.herosubclass.battlemage=戦闘魔法使い
actors.hero.herosubclass.battlemage_short_desc=_戦闘魔法使い_は魔杖で近接攻撃する際に追加の魔法効果を伴います。これらの効果は魔杖に注入された魔杖の種類によって異なります。
actors.hero.herosubclass.battlemage_desc=戦闘魔法使いが魔杖で近接攻撃する際、エンチャントに似た追加効果が発生します。効果は魔杖に注入された魔杖の種類によって異なり、各種類で異なります。魔杖での近接攻撃はさらに0.5チャージを回復します。\n\n_ランダムモード_が有効で魔法使いの魔杖を所持していない場合、この専門を選択するとランダムな魔杖が注入された魔法使いの魔杖を1本獲得します。
actors.hero.herosubclass.warlock=術士
actors.hero.herosubclass.warlock_short_desc=_術士_は魔杖使用時に確率で敵の霊魂をマークします。術士がマークされた敵に物理ダメージを与えるたびに、自身のHPを回復します。
actors.hero.herosubclass.warlock_desc=術士がキャラクターに魔杖を使用する際、確率で霊魂マークを付与します。霊魂マークの付与確率と持続時間は魔杖のレベルに応じて上昇します。\n\n術士がマークされた敵を攻撃する際、5ダメージごとに1HPを回復します。この効果は物理攻撃にのみ有効で、魔杖の魔法ダメージには無効です！
actors.hero.herosubclass.assassin=刺客
actors.hero.herosubclass.assassin_short_desc=隠身時、_刺客_は致死的な一撃を準備します。待つ時間が長いほど、その一撃の威力は強まります。
actors.hero.herosubclass.assassin_desc=刺客は隠身時に強力な一撃を準備します。準備時間が長いほど、次の攻撃はより致命的になります。準備段階は最大_4ターン_累積できます。\n\n十分に準備した後、刺客の次の攻撃は追加ダメージを与え、目標にブリンクし、十分に弱った敵を即座に斬殺することさえできます。\n\nこの専門は隠身時に1つの特殊能力を持ち、複数の特殊能力を持つ場合はショートカットを長押しして切り替えられます。_ランダムモード_が有効で暗影の闘篷を所持していない場合、この専門を選択すると暗影の闘篷を1着獲得します。
actors.hero.herosubclass.freerunner=疾行者
actors.hero.herosubclass.freerunner_short_desc=_疾行者_は走行中に動量を蓄積します。動量は疾走効果を発動するために使用でき、短時間の速度と回避ボーナスを得られます。
actors.hero.herosubclass.freerunner_desc=疾行者は走行中に動量を蓄積します。移動1回につき1動量を獲得し、最大_10動量_まで蓄積できます。移動しないと動量は急速に減少します。動量は疾走状態を発動するために使用でき、1動量につき2ターンの疾走を得られます。\n\n疾走状態の疾行者は2倍の速度で走行し、レベルに比例した追加回避を獲得します。疾走状態終了後、疾行者はしばらく休息して動量を再蓄積する必要があります。\n\nこの専門は動量蓄積時に1つの特殊能力を持ち、複数の特殊能力を持つ場合はショートカットを長押しして切り替えられます。
actors.hero.herosubclass.sniper=狙撃手
actors.hero.herosubclass.sniper_short_desc=_狙撃手_の遠隔攻撃は鎧を貫通します。投射武器で目標に命中させた後、狙撃手は霊能弓で特殊な追撃を行えます。
actors.hero.herosubclass.sniper_desc=狙撃手は遠隔戦闘の達人で、彼女の遠隔攻撃は敵の鎧を無視します。投射武器で敵に命中させた後、女狩人は目標に狙撃マークを付与し、霊能弓でその敵に追撃を行えます。追撃の形態は弓の強化方式によって異なります。\n\n未強化の弓はダメージがやや低い速射の矢を放ちますが、射撃は瞬時です。速度強化の弓は3本の矢を連射し、各矢のダメージは低いもののエンチャントを発動でき、射撃に1ターンを要します。ダメージ強化の弓は必中の狙撃の矢を放ち、距離に基づく追加ダメージを与え、射撃に2ターンを要します。\n\nこの専門は狙撃マーク付与時に1つの特殊能力を持ち、複数の特殊能力を持つ場合はショートカットを長押しして切り替えられます。_ランダムモード_が有効で霊能弓を所持していない場合、この専門を選択すると霊能弓を1張獲得します。
actors.hero.herosubclass.warden=守護者
actors.hero.herosubclass.warden_short_desc=_守護者_は高草を透視でき、植物を植えたり踏んだりする際に追加効果を得られます。
actors.hero.herosubclass.warden_desc=守護者は自然の力と強力に繋がっており、植物に関する様々な能力を付与されています。守護者は高草と枯草を透視できます。\n\n守護者が植えた種の周囲には草が生え、植物を踏むと本来の効果に代わり追加効果を得られ、すべての植物が彼女に完全に無害になります。\n\n_ランダムモード_が有効で高草を通り抜ける際にまだ高草を踏みつけてしまう場合、この専門を選択すると高草を踏まなくなります。
actors.hero.herosubclass.champion=勇者
actors.hero.herosubclass.champion_short_desc=_勇者_は二刀流が可能で、より多くの武技チャージを持っています。彼女は主武器で通常攻撃を行いますが、自在に主・副武器を切り替え、両方の武器の武技を駆使できます。
actors.hero.herosubclass.champion_desc=勇者は近接武器を巧みに操り、主武器に加えて副武器をもう1つ装備できます。勇者は主武器で通常攻撃を行いますが、瞬時に主・副武器を切り替え、両方の武器の武技を使用することもできます。\n\n彼女はさらに_2点_の武技チャージ上限を持ち、武技チャージ回復速度が50%向上します。\n\nこの専門は主・副武器の切り替えが可能な時に1つの特殊能力を持ち、複数の特殊能力を持つ場合はショートカットを長押しして切り替えられます。_ランダムモード_が有効で武技を使用できない場合、この専門を選択すると武技の使用に習熟します。
actors.hero.herosubclass.monk=武僧
actors.hero.herosubclass.monk_short_desc=_武僧_は戦闘中に内力（チャクラ）を蓄積でき、これらの内力は様々な武術（アビリティ）の発動に使用できます。
actors.hero.herosubclass.monk_desc=武僧の武術の造詣は非常に深遠です。彼女は敵を撃破するたびに内力（チャクラ）を蓄積し、様々な防御的および機能的な能力の発動に使用します。内力は時間とともに減少しませんが、武僧のレベルに基づく保存上限があります。\n\n1内力：高速連打、目標を連続攻撃\n2内力：精神集中、次の被弾を回避\n3内力：瞬間移動、近くの位置に突進\n4内力：蓄力飛踢、周囲の敵をノックバック\n5内力：状態解除、魔杖・神器をチャージ\n\nこの専門は内力蓄積時に1つの特殊能力を持ち、複数の特殊能力を持つ場合はショートカットを長押しして切り替えられます。
actors.hero.herosubclass.priest=祭司
actors.hero.herosubclass.priest_short_desc=_祭司_は新たな遠距離魔法と強化版の神導の光を獲得します。
actors.hero.herosubclass.priest_desc=祭司は一連の新たに昇級した魔法を獲得し、主に遠距離攻撃と魔法アイテムとの互換性を重視します。\n\n祭司は50ターンごとに_神導の光_を無料で1回唱えられ、目標の敵に聖輝を付与し、仲間・魔杖・一部の神器で聖輝を消費して祭司のレベル×5に等しい追加ダメージを与えられます。\n\n祭司はさらに魔法_破暁輻射_を獲得し、_2チャージ_を消費して暗黒を駆散し、視野内のすべての敵に聖輝を発動・付与し、短時間気絶させます。\n\n_ランダムモード_が有効で神聖法典を所持していない場合、この専門を選択すると神聖法典を1冊獲得します。
actors.hero.herosubclass.paladin=聖騎士
actors.hero.herosubclass.paladin_short_desc=_聖騎士_は新たな近接魔法と強化版の神聖武器・神聖鎧を獲得します。
actors.hero.herosubclass.paladin_desc=聖騎士は一連の新たに昇級した魔法を獲得し、主に近接攻撃と武器・鎧との互換性を重視します。\n\n聖騎士の魔法_神聖武器_と_神聖鎧_の攻防ボーナスが大幅に強化され、既存のエンチャントと刻印を上書きしなくなり、他の魔法を唱えることでその持続時間を延長できるようになります。\n\n聖騎士はさらに魔法_至聖斬撃_を獲得し、追加ダメージとエンチャント強度を伴う必中の近接攻撃を行います。\n\n_ランダムモード_が有効で神聖法典を所持していない場合、この専門を選択すると神聖法典を1冊獲得します。

##talents
actors.hero.talent$provokedangertracker.name=被挑発怒火
actors.hero.talent$provokedangertracker.desc=戦士がバリアを失った直後です。次の物理攻撃が追加ダメージを与えます。\n\n残りターン数：%s
actors.hero.talent$lingeringmagictracker.name=波動余威
actors.hero.talent$lingeringmagictracker.desc=魔法使いが魔杖または魔法杖を使用した直後です。次の物理攻撃が追加ダメージを与えます。\n\n残りターン数：%s
actors.hero.talent$followupstriketracker.name=追打
actors.hero.talent$followupstriketracker.desc=女狩人が最近投射武器で攻撃を行いました。同じ目標への次の近接攻撃がダメージボーナスを得ます。\n\n残りターン数：%s
actors.hero.talent$patientstriketracker.name=沈穩一撃
actors.hero.talent$patientstriketracker.desc=決闘者が1ターン待機した直後です。次の近接攻撃が追加ダメージを与えます。
actors.hero.talent$improvisedprojectilecooldown.name=即興投射-クールダウン
actors.hero.talent$improvisedprojectilecooldown.desc=このタレントを発動したばかりです。しばらく待つと再び発動できます。\n\n残りクールダウン：%sターン
actors.hero.talent$rejuvenatingstepscooldown.name=復春歩-クールダウン
actors.hero.talent$rejuvenatingstepscooldown.desc=このタレントを発動したばかりです。しばらく待つと再び発動できます。\n\n残りクールダウン：%sターン
actors.hero.talent$seershotcooldown.name=探地の矢-クールダウン
actors.hero.talent$seershotcooldown.desc=このタレントを発動したばかりです。しばらく待つと再び発動できます。\n\n残りクールダウン：%sターン
actors.hero.talent$aggressivebarriercooldown.name=烈気バリア-クールダウン
actors.hero.talent$aggressivebarriercooldown.desc=このタレントを発動したばかりです。しばらく待つと再び発動できます。\n\n残りクールダウン：%sターン
actors.hero.talent$liquidagilacctracker.name=液体機敏
actors.hero.talent$liquidagilacctracker.desc=決闘者の次の通常近接攻撃が追加の精度を得ます。\n\n残りターン数：%s
actors.hero.talent$lethalhastecooldown.name=奪命余勢-クールダウン
actors.hero.talent$lethalhastecooldown.desc=このタレントを発動したばかりです。しばらく待つと再び発動できます。\n\n残りクールダウン：%sターン
actors.hero.talent$swiftequipcooldown.name=迅速装備-クールダウン
actors.hero.talent$swiftequipcooldown.desc=このタレントを発動したばかりです。しばらく待つと再び発動できます。\n\n残りクールダウン：%sターン
actors.hero.talent$preciseassaulttracker.name=精密打撃
actors.hero.talent$preciseassaulttracker.desc=決闘者の次の通常近接攻撃が精度ボーナスを得ます。\n\n残りターン数：%s
actors.hero.talent$deadlyfollowuptracker.name=奪命追撃
actors.hero.talent$deadlyfollowuptracker.desc=決闘者が最近投射武器で敵に命中させました。同じ目標への近接攻撃がダメージボーナスを得ます。\n\n残りターン数：%s
actors.hero.talent$combinedlethalityabilitytracker.executed=処刑
actors.hero.talent$satiatedspellstracker.name=施法バリア
actors.hero.talent$satiatedspellstracker.desc=牧師の次の魔法詠唱が少量のバリアを提供します。
actors.hero.talent$searinglightcooldown.name=灼熱の光
actors.hero.talent$searinglightcooldown.desc=このタレントを発動したばかりです。しばらく待つと再び発動できます。\n\n残りクールダウン：%sターン

#warrior
actors.hero.talent.type=タレントタイプ：_%s_。
actors.hero.talent.hearty_meal.title=豊盛な食事
actors.hero.talent.hearty_meal.desc=_+1：_ 戦士がHP33%以下の時に食事をすると_4HP_回復します。\n\n_+2：_ 戦士がHP33%以下の時に食事をすると_6HP_回復します。
actors.hero.talent.hearty_meal.comment=「この一口を食らえば、まだまだやれる。」
actors.hero.talent.veterans_intuition.title=老兵の直感
actors.hero.talent.veterans_intuition.desc=_+1：_戦士の武器鑑定速度が元の_1.75倍_に上昇し、鎧の鑑定速度が元の_2.5倍_に上昇します。\n\n_+2：_戦士の武器鑑定速度が元の_2.5倍_に上昇し、_鎧を装備する際に_直接鑑定できるようになります。
actors.hero.talent.veterans_intuition.comment=「これは北の戦場で得た経験だ。」
actors.hero.talent.provoked_anger.title=被挑発怒火
actors.hero.talent.provoked_anger.desc=_+1：_戦士が獲得した任意のバリア効果がダメージで破壊された時、次の物理攻撃が_3点の追加ダメージ_を与えます。\n\n_+2：_戦士が獲得した任意のバリア効果がダメージで破壊された時、次の物理攻撃が_5点の追加ダメージ_を与えます。
actors.hero.talent.provoked_anger.comment=「北の勇士に挑む者は皆、眠りについた。」
actors.hero.talent.iron_will.title=鋼鉄意志
actors.hero.talent.iron_will.desc=_+1：_戦士の紋章が提供するバリアが1点上昇します。\n\n_+2：_戦士の紋章が提供するバリアが2点上昇します。
actors.hero.talent.iron_will.comment=「鋼鉄はかくして鍛えられる。」
actors.hero.talent.iron_will.meta_desc=_このタレントが他の英雄によって獲得された場合、4または6点の最大バリア版の戦士の破損の紋章効果を提供します。_

actors.hero.talent.iron_stomach.title=鋼鉄の胃
actors.hero.talent.iron_stomach.desc=_+1：_戦士の食事が_1ターン_のみで完了し、食事中_75%のダメージ耐性_を得ます。\n\n_+2：_戦士の食事が_1ターン_のみで完了し、食事中_100%のダメージ耐性_を得ます。
actors.hero.talent.iron_stomach.comment=「戦時中、食事時の停戦は双方の戦士の暗黙の了解だ。」
actors.hero.talent.liquid_willpower.title=液体意志
actors.hero.talent.liquid_willpower.desc=_+1：_戦士が薬・魔法薬・秘薬を飲用または投擲した時、最大HPの_5%_のバリアを獲得します。\n\n_+2：_戦士が薬・魔法薬・秘薬を飲用または投擲した時、最大HPの_10%_のバリアを獲得します。
actors.hero.talent.liquid_willpower.comment=筋力薬・経験薬または前述の薬から錬成された錬金アイテムを使用した場合、獲得するバリア量が倍増します。\n\n生成量の多い錬金アイテム（例：水爆魔法薬）の場合、このタレントはそのアイテムの単回生成量に基づき確率で発動します。\n\n「一瓶の烈酒が戦士の闘志を奮い立たせる。もちろん薬でも構わない。」
actors.hero.talent.runic_transference.title=刻印転移
actors.hero.talent.runic_transference.desc=_+1：_戦士の破損の紋章は1レベルの昇級と同様に_通常の刻印_を持ち運べます。\n\n_+2：_戦士の破損の紋章は1レベルの昇級と同様に_通常・強力または呪いの刻印_を持ち運べます。
actors.hero.talent.runic_transference.comment=破損の紋章は、鎧に紋章が付着している時に刻まれた刻印のみを持ち運べます。\n\n「そこに刻まれているのは刻印だけではない。戦士がかつて刻んだ栄光もだ。」
actors.hero.talent.runic_transference.meta_desc=_このタレントが他の英雄によって獲得された場合、鎧の刻印が昇級の巻物で確実に消去されなくなる上限レベルが上昇します。タレント+1時、鎧は16から刻印が消去される可能性があります（元は14）。タレント+2時は17（元は14）です。18では依然として確実に消去されます。_
actors.hero.talent.lethal_momentum.title=手起刀落
actors.hero.talent.lethal_momentum.desc=_+1：_戦士が物理武器で敵を撃殺した際、_67%の確率_でターン数を消費しません。\n\n_+2：_戦士が物理武器で敵を撃殺した際、_100%の確率_でターン数を消費しません。
actors.hero.talent.lethal_momentum.comment=「戦血流れ！」
actors.hero.talent.improvised_projectiles.title=即興投射
actors.hero.talent.improvised_projectiles.desc=_+1：_戦士が非投擲武器のアイテムを敵に投げつけると、_2ターン_の盲目効果を与える。\n\n_+2：_戦士が非投擲武器のアイテムを敵に投げつけると、_3ターン_の盲目効果を与える。
actors.hero.talent.improvised_projectiles.comment=この天赋は_10ターンのクールダウン_がある。\n\n「戦士は退屈すると手にした物を投げて遊んでいたが、いつしかそれを正確に敵の目に命中させる能力を身につけた。」

actors.hero.talent.hold_fast.title=不動如山
actors.hero.talent.hold_fast.desc=_+1：_戦士が待機中、_1~2の装甲_を獲得し、コンボとシールドの減衰速度を_50%_低下させる。移動するまで持続。\n\n_+2：_戦士が待機中、_2~4の装甲_を獲得し、コンボとシールドの減衰速度を_75%_低下させる。移動するまで持続。\n\n_+3：_戦士が待機中、_3~6の装甲_を獲得し、コンボとシールドの減衰速度を_100%_低下させる。移動するまで持続。
actors.hero.talent.hold_fast.comment=
actors.hero.talent.strongman.title=怪力無双
actors.hero.talent.strongman.desc=_+1：_戦士の筋力が_8%_上昇（切り捨て）。\n\n_+2：_戦士の筋力が_13%_上昇（切り捨て）。\n\n_+3：_戦士の筋力が_18%_上昇（切り捨て）。
actors.hero.talent.strongman.comment=

actors.hero.talent.endless_rage.title=無限の怒り
actors.hero.talent.endless_rage.desc=_+1：_狂戦士の怒り上限が_116%_に上昇。\n\n_+2：_狂戦士の怒り上限が_133%_に上昇。\n\n_+3：_狂戦士の怒り上限が_150%_に上昇。
actors.hero.talent.endless_rage.comment=怒り値が100%を超えると、超過1%ごとにシールドが1%上昇し、狂暴化のクールダウンが1%減少する。ただし、ダメージ上昇効果は50%を超えない。
actors.hero.talent.deathless_fury.title=不滅の猛撃
actors.hero.talent.deathless_fury.desc=_+1：_狂戦士が死亡寸前で怒り値が100%以上の時、自動的に狂暴化する。発動後は_3英雄レベル_のクールダウンが必要。\n\n_+2：_狂戦士が死亡寸前で怒り値が100%以上の時、自動的に狂暴化する。発動後は_2英雄レベル_のクールダウンが必要。\n\n_+3：_狂戦士が死亡寸前で怒り値が100%以上の時、自動的に狂暴化する。発動後は_1英雄レベル_のクールダウンが必要。
actors.hero.talent.deathless_fury.comment=注意：狂暴化終了時に狂戦士のHPが0の場合、死亡する。
actors.hero.talent.enraged_catalyst.title=怒りの魔導
actors.hero.talent.enraged_catalyst.desc=_+1：_狂戦士の怒りが多いほど、武器のエンチャントまたは呪いの発動確率が上昇し、100%の怒りで最大効果に達する。発動確率が_1.15倍_に上昇。\n\n_+2：_狂戦士の怒りが多いほど、武器のエンチャントまたは呪いの発動確率が上昇し、100%の怒りで最大効果に達する。発動確率が_1.30倍_に上昇。\n\n_+3：_狂戦士の怒りが多いほど、武器のエンチャントまたは呪いの発動確率が上昇し、100%の怒りで最大効果に達する。発動確率が_1.45倍_に上昇。
actors.hero.talent.enraged_catalyst.comment=

actors.hero.talent.cleave.title=連戦の熱意
actors.hero.talent.cleave.desc=_+1：_剣闘士が敵を倒すと、_30ターン_内の次の攻撃がコンボ数を引き継ぐ。\n\n_+2：_剣闘士が敵を倒すと、_45ターン_内の次の攻撃がコンボ数を引き継ぐ。\n\n_+3：_剣闘士が敵を倒すと、_60ターン_内の次の攻撃がコンボ数を引き継ぐ。
actors.hero.talent.cleave.comment=
actors.hero.talent.lethal_defense.title=戦いで養う
actors.hero.talent.lethal_defense.desc=_+1：_剣闘士がコンボ戦技で敵を倒すと、破損した紋章シールドの_33%_を回復。\n\n_+2：_剣闘士がコンボ戦技で敵を倒すと、破損した紋章シールドの_67%_を回復。\n\n_+3：_剣闘士がコンボ戦技で敵を倒すと、破損した紋章シールドの_100%_を回復。
actors.hero.talent.lethal_defense.comment=
actors.hero.talent.enhanced_combo.title=戦技強化
actors.hero.talent.enhanced_combo.desc=_+1：_剣闘士のコンボ数が7以上の時、衝撃のノックバック距離が_増加し眩暈を付与_、敵を奈落に落とせる。\n\n_+2：_1に加え、剣闘士のコンボ数が9以上の時、パリイ反撃が_1ターン内の複数回攻撃_に有効。\n\n_+3：_1と2に加え、剣闘士が衝撃、薙ぎ払い、豪雨を使用時、_コンボ数3_のマスを飛び越えて敵に接近可能。
actors.hero.talent.enhanced_combo.comment=

actors.hero.talent.body_slam.title=ボディスラム
actors.hero.talent.body_slam.desc=_+1：_戦士の勇躍着地時、隣接する全敵に_1~4+25%装甲_のダメージ。\n\n_+2：_戦士の勇躍着地時、隣接する全敵に_2~8+50%装甲_のダメージ。\n\n_+3：_戦士の勇躍着地時、隣接する全敵に_3~12+75%装甲_のダメージ。\n\n_+4：_戦士の勇躍着地時、隣接する全敵に_4~16+100%装甲_のダメージ。
actors.hero.talent.body_slam.comment=
actors.hero.talent.impact_wave.title=堕天一撃
actors.hero.talent.impact_wave.desc=_+1：_戦士の勇躍着地時、隣接する全敵を_2マス_ノックバック、_25%_の確率で5ターンの被ダメージ増加を付与。\n\n_+2：_戦士の勇躍着地時、隣接する全敵を_3マス_ノックバック、_50%_の確率で5ターンの被ダメージ増加を付与。\n\n_+3：_戦士の勇躍着地時、隣接する全敵を_4マス_ノックバック、_75%_の確率で5ターンの被ダメージ増加を付与。\n\n_+4：_戦士の勇躍着地時、隣接する全敵を_5マス_ノックバック、_100%_の確率で5ターンの被ダメージ増加を付与。
actors.hero.talent.impact_wave.comment=
actors.hero.talent.double_jump.title=二段跳び
actors.hero.talent.double_jump.desc=_+1：_戦士が勇躍使用後、3ターン以内の次の使用チャージ消費が_16%_減少。\n\n_+2：_戦士が勇躍使用後、3ターン以内の次の使用チャージ消費が_30%_減少。\n\n_+3：_戦士が勇躍使用後、3ターン以内の次の使用チャージ消費が_40%_減少。\n\n_+4：_戦士が勇躍使用後、3ターン以内の次の使用チャージ消費が_50%_減少。
actors.hero.talent.double_jump.comment=

actors.hero.talent.expanding_wave.title=広域衝撃
actors.hero.talent.expanding_wave.desc=_+1：_震地衝撃の射程が5マスから_6マス_に拡大、角度が60度から_75度_に拡張。\n\n_+2：_震地衝撃の射程が5マスから_7マス_に拡大、角度が60度から_90度_に拡張。\n\n_+3：_震地衝撃の射程が5マスから_8マス_に拡大、角度が60度から_105度_に拡張。\n\n_+4：_震地衝撃の射程が5マスから_9マス_に拡大、角度が60度から_120度_に拡張。
actors.hero.talent.expanding_wave.comment=
actors.hero.talent.striking_wave.title=複合震波
actors.hero.talent.striking_wave.desc=_+1：_震地衝撃使用時、_30%_の確率でエンチャントとコンボ等の攻撃効果が発動。\n\n_+2：_震地衝撃使用時、_60%_の確率でエンチャントとコンボ等の攻撃効果が発動。\n\n_+3：_震地衝撃使用時、_90%_の確率でエンチャントとコンボ等の攻撃効果が発動。\n\n_+4：_震地衝撃使用時、_100%_の確率でエンチャントとコンボ等の攻撃効果が発動し、更に_20%のエンチャント強化_を獲得。
actors.hero.talent.striking_wave.comment=
actors.hero.talent.shock_force.title=強力衝撃
actors.hero.talent.shock_force.desc=_+1：_震地衝撃のダメージが_20%_増加、_25%_の確率で目標を残廃ではなく気絶させる。\n\n_+2：_震地衝撃のダメージが_40%_増加、_50%_の確率で目標を残廃ではなく気絶させる。\n\n_+3：_震地衝撃のダメージが_60%_増加、_75%_の確率で目標を残廃ではなく気絶させる。\n\n_+4：_震地衝撃のダメージが_80%_増加、_100%_の確率で目標を残廃ではなく気絶させる。
actors.hero.talent.shock_force.comment=

actors.hero.talent.sustained_retribution.title=持続反撃
actors.hero.talent.sustained_retribution.desc=_+1：_反撃が一回の追加ダメージ100%の攻撃から、_2回_の追加ダメージ_115%_の攻撃に変化。\n\n_+2：_反撃が一回の追加ダメージ100%の攻撃から、_3回_の追加ダメージ_130%_の攻撃に変化。\n\n_+3：_反撃が一回の追加ダメージ100%の攻撃から、_4回_の追加ダメージ_145%_の攻撃に変化。\n\n_+4：_反撃が一回の追加ダメージ100%の攻撃から、_5回_の追加ダメージ_160%_の攻撃に変化。
actors.hero.talent.sustained_retribution.comment=
actors.hero.talent.shrug_it_off.title=痛覚閾値
actors.hero.talent.shrug_it_off.desc=_+1：_戦士の苦痛堅忍中の被ダメージ軽減が50%から_60%_に上昇。\n\n_+2：_戦士の苦痛堅忍中の被ダメージ軽減が50%から_68%_に上昇。\n\n_+3：_戦士の苦痛堅忍中の被ダメージ軽減が50%から_74%_に上昇。\n\n_+4：_戦士の苦痛堅忍中の被ダメージ軽減が50%から_80%_に上昇。
actors.hero.talent.shrug_it_off.comment=
actors.hero.talent.even_the_odds.title=形勢逆転
actors.hero.talent.even_the_odds.desc=_+1：_戦士が苦痛堅忍終了時、周囲2マス内の敵1体につき_5%_の追加ダメージ。\n\n_+2：_戦士が苦痛堅忍終了時、周囲2マス内の敵1体につき_10%_の追加ダメージ。\n\n_+3：_戦士が苦痛堅忍終了時、周囲2マス内の敵1体につき_15%_の追加ダメージ。\n\n_+4：_戦士が苦痛堅忍終了時、周囲2マス内の敵1体につき_20%_の追加ダメージ。
actors.hero.talent.even_the_odds.comment=

#mage
actors.hero.talent.empowering_meal.title=活力の食事
actors.hero.talent.empowering_meal.desc=_+1：_食事により、魔術師の次の2回の杖ダメージが_2点_増加。\n\n_+2：_食事により、魔術師の次の3回の杖ダメージが_3点_増加。
actors.hero.talent.empowering_meal.comment=「食事の直後、体内の魔力が沸き立つのを感じるだろう。」
actors.hero.talent.scholars_intuition.title=学者の直感
actors.hero.talent.scholars_intuition.desc=_+1：_魔術師の杖鑑定速度が元の_3倍_に上昇。\n\n_+2：_魔術師は_杖使用時_に直接鑑定できる。
actors.hero.talent.scholars_intuition.comment=「これらは魔術師学院で既に教わったものだ。」
actors.hero.talent.lingering_magic.title=残滓の魔力
actors.hero.talent.lingering_magic.desc=_+1：_魔術師が魔杖または杖で魔法を唱えた後、次の物理攻撃が_1~2点_の追加ダメージを与える。\n\n_+2：_魔術師が魔杖または杖で魔法を唱えた後、次の物理攻撃が_2点_の追加ダメージを与える。
actors.hero.talent.lingering_magic.comment=「本質は、施法後に手にわずかに残った魔力である。」
actors.hero.talent.backup_barrier.title=予備障壁
actors.hero.talent.backup_barrier.desc=_+1：_魔術師が魔杖の最後のチャージを放つ度、_3_のシールドを獲得。\n\n_+2：_魔術師が魔杖の最後のチャージを放つ度、_5_のシールドを獲得。
actors.hero.talent.backup_barrier.comment=「最後の波紋。」
actors.hero.talent.backup_barrier.meta_desc=_この天赋が他の英雄に獲得された場合_、最もレベルの高い杖によって発動する。

actors.hero.talent.energizing_meal.title=充能の食事
actors.hero.talent.energizing_meal.desc=_+1：_魔術師の食事が3ターンで完了し、_5ターン_の杖充能を獲得。\n\n_+2：_魔術師の食事が3ターンで完了し、_8ターン_の杖充能を獲得。
actors.hero.talent.energizing_meal.comment=「食事はより豊かな魔力をもたらす。」
actors.hero.talent.inscribed_power.title=巻物の秘能
actors.hero.talent.inscribed_power.desc=_+1：_魔術師が巻物を読むか魔法結晶を使用後、次の_2回の杖魔法_が2レベル上昇。\n\n_+2：_魔術師が巻物を読むか魔法結晶を使用後、次の_3回の杖魔法_が2レベル上昇。
actors.hero.talent.inscribed_power.comment=強化巻物、変成巻物、またはこれらを用いて錬成した錬金アイテムを使用した場合、杖の強化魔法発動回数が倍になる。\n\n生産量の多い錬金アイテム（ほとんどの結晶など）の場合、この天赋はそのアイテムの単回生産数に基づいて確率で発動する。\n\nこの天赋は無秩序魔導書を読むことでも発動する。\n\n「巻物に刻まれた符文自体に大量の魔力が宿っている。」
actors.hero.talent.wand_preservation.title=杖の回収
actors.hero.talent.wand_preservation.desc=_+1：_魔術師が新しい杖を魔杖に注入する時、以前注入した杖を0レベルの状態で回収する。_但し、この回収は1回のみ可能。_\n\n_+2：_魔術師が新しい杖を魔杖に注入する時、以前注入した杖を0レベルの状態で回収する。_この回収は繰り返し可能だが、1英雄レベルのクールダウンが発生。_
actors.hero.talent.wand_preservation.comment=「高価な杖は常に人気だ。」
actors.hero.talent.wand_preservation.meta_desc=_この天赋が他の英雄に獲得された場合_、錬金釜で杖が秘術樹脂に変換される量が増加する。+1では変換量+1、+2では+2。
actors.hero.talent.arcane_vision.title=秘術感知
actors.hero.talent.arcane_vision.desc=_+1：_魔術師が敵に魔法を唱えると、_10ターン_の間、彼らの視覚感知を得る。\n\n_+2：_魔術師が敵に魔法を唱えると、_15ターン_の間、彼らの視覚感知を得る。
actors.hero.talent.arcane_vision.comment=「敵に付着した魔力により、その位置を感知できる。」
actors.hero.talent.shield_battery.title=蓄能盾
actors.hero.talent.shield_battery.desc=_+1：_魔術師は自身を対象に魔法を唱え、杖のチャージ1ポイントを_4%最大HP_のシールドに変換する。\n\n_+2：_魔術師は自身を対象に魔法を唱え、杖のチャージ1ポイントを_6%最大HP_のシールドに変換する。
actors.hero.talent.shield_battery.comment=「応急処置。」

actors.hero.talent.desperate_power.title=窮地の力
actors.hero.talent.desperate_power.desc=_+1：_魔術師の杖と魔杖の最後のチャージ使用時、魔法効果が_1レベル_追加で上昇。\n\n_+2：_魔術師の杖と魔杖の最後のチャージ使用時、魔法効果が_2レベル_追加で上昇。\n\n_+3：_魔術師の杖と魔杖の最後のチャージ使用時、魔法効果が_3レベル_追加で上昇。
actors.hero.talent.desperate_power.comment=
actors.hero.talent.ally_warp.title=位置転換
actors.hero.talent.ally_warp.desc=_+1：_魔術師は_2マス_範囲内の味方を選択し、瞬時に位置を交換する。\n\n_+2：_魔術師は_4マス_範囲内の味方を選択し、瞬時に位置を交換する。\n\n_+3：_魔術師は_6マス_範囲内の味方を選択し、瞬時に位置を交換する。
actors.hero.talent.ally_warp.comment=魔術師は移動不能な味方と位置を交換できない。\n\nDM-400（ランダムモードの非DM-400のAT-400およびAU-400専精を含む）がこの天赋を獲得した場合、_+1/+2/+3_レベルで_2/4/6マス_範囲内の隣接しないドローンをクリックして交換または指揮できる。

actors.hero.talent.empowered_strike.title=蓄能打撃
actors.hero.talent.empowered_strike.desc=_+1：_戦闘魔術師が魔杖で魔法を唱えた後、魔杖の初回近接攻撃が_16%_の追加ダメージを与え、追加効果の強度が_50%_上昇。\n\n_+2：_戦闘魔術師が魔杖で魔法を唱えた後、魔杖の初回近接攻撃が_33%_の追加ダメージを与え、追加効果の強度が_100%_上昇。\n\n_+3：_戦闘魔術師が魔杖で魔法を唱えた後、魔杖の初回近接攻撃が_50%_の追加ダメージを与え、追加効果の強度が_150%_上昇。
actors.hero.talent.empowered_strike.comment=
actors.hero.talent.mystical_charge.title=充能秘術
actors.hero.talent.mystical_charge.desc=_+1：_戦闘魔術師が魔杖で敵に近接攻撃を命中させると、_0.5ターン_分の神器充能効果を得る。\n\n_+2：_戦闘魔術師が魔杖で敵に近接攻撃を命中させると、_1ターン_分の神器充能効果を得る。\n\n_+3：_戦闘魔術師が魔杖で敵に近接攻撃を命中させると、_1.5ターン_分の神器充能効果を得る。
actors.hero.talent.mystical_charge.comment=
actors.hero.talent.excess_charge.title=余剰障壁
actors.hero.talent.excess_charge.desc=_+1：_戦闘魔術師の魔杖が満充能時、アップグレード1レベルにつき、次回の魔杖魔法使用時に_0.67_のシールドを獲得。\n\n_+2：_戦闘魔術師の魔杖が満充能時、アップグレード1レベルにつき、次回の魔杖魔法使用時に_1.33_のシールドを獲得。\n\n_+3：_戦闘魔術師の魔杖が満充能時、アップグレード1レベルにつき、次回の魔杖魔法使用時に_2_のシールドを獲得。
actors.hero.talent.excess_charge.comment=

actors.hero.talent.soul_siphon.title=魂の分配
actors.hero.talent.soul_siphon.desc=_+1：_他のユニットが与える物理ダメージが_13%_の効率で術士の魂の標識を発動する。\n\n_+2：_他のユニットが与える物理ダメージが_27%_の効率で術士の魂の標識を発動する。\n\n_+3：_他のユニットが与える物理ダメージが_40%_の効率で術士の魂の標識を発動する。
actors.hero.talent.soul_siphon.comment=
actors.hero.talent.soul_eater.title=魂喰い秘法
actors.hero.talent.soul_eater.desc=_+1：_魂の標識が付いたユニットが受ける物理ダメージ1ポイントにつき_0.33_の満腹度を提供。標識付きの敵が死亡時、術士は_10%_の確率で食事効果を発動。\n\n_+2：_魂の標識が付いたユニットが受ける物理ダメージ1ポイントにつき_0.67_の満腹度を提供。標識付きの敵が死亡時、術士は_20%_の確率で食事効果を発動。\n\n_+3：_魂の標識が付いたユニットが受ける物理ダメージ1ポイントにつき_1_の満腹度を提供。標識付きの敵が死亡時、術士は_30%_の確率で食事効果を発動。
actors.hero.talent.soul_eater.comment=
actors.hero.talent.necromancers_minions.title=怨霊の手下
actors.hero.talent.necromancers_minions.desc=_+1：_魂の標識が付いた敵が死亡時、術士は_13%_の確率で腐敗した怨霊として召喚する。\n\n_+2：_魂の標識が付いた敵が死亡時、術士は_27%_の確率で腐敗した怨霊として召喚する。\n\n_+3：_魂の標識が付いた敵が死亡時、術士は_40%_の確率で腐敗した怨霊として召喚する。
actors.hero.talent.necromancers_minions.comment=

actors.hero.talent.blast_radius.title=広域打撃
actors.hero.talent.blast_radius.desc=_+1：_元素嵐の半径が4マスから_5マス_に拡大。\n\n_+2：_元素嵐の半径が4マスから_6マス_に拡大。\n\n_+3：_元素嵐の半径が4マスから_7マス_に拡大。\n\n_+4：_元素嵐の半径が4マスから_8マス_に拡大。
actors.hero.talent.blast_radius.comment=
actors.hero.talent.elemental_power.title=元素の力
actors.hero.talent.elemental_power.desc=_+1：_元素嵐の威力が_25%_上昇。\n\n_+2：_元素嵐の威力が_50%_上昇。\n\n_+3：_元素嵐の威力が_75%_上昇。\n\n_+4：_元素嵐の威力が_100%_上昇。
actors.hero.talent.elemental_power.comment=
actors.hero.talent.reactive_barrier.title=反応障壁
actors.hero.talent.reactive_barrier.desc=_+1：_元素嵐の影響を受けたキャラクター1体につき、魔術師が_2.5_のシールドを獲得。最大8体まで計算。\n\n_+2：_元素嵐の影響を受けたキャラクター1体につき、魔術師が_5_のシールドを獲得。最大8体まで計算。\n\n_+3：_元素嵐の影響を受けたキャラクター1体につき、魔術師が_7.5_のシールドを獲得。最大8体まで計算。\n\n_+4：_元素嵐の影響を受けたキャラクター1体につき、魔術師が_10_のシールドを獲得。最大8体まで計算。
actors.hero.talent.reactive_barrier.comment=

actors.hero.talent.wild_power.title=荒ぶる魔力
actors.hero.talent.wild_power.desc=_+1：_狂野魔法発動時、杖が追加で_2または3_レベル高いものと見なされ、最大_+4_まで上昇可能。\n\n_+2：_狂野魔法発動時、杖が追加で_3_レベル高いものと見なされ、最大_+5_まで上昇可能。\n\n_+3：_狂野魔法発動時、杖が追加で_3または4_レベル高いものと見なされ、最大_+6_まで上昇可能。\n\n_+4：_狂野魔法発動時、杖が追加で_4_レベル高いものと見なされ、最大_+7_まで上昇可能。
actors.hero.talent.wild_power.comment=
actors.hero.talent.fire_everything.title=魔力放出
actors.hero.talent.fire_everything.desc=_+1：_狂野魔法の杖放出回数が4回から_5回_に増加。各杖は_25%_の確率で3回まで放出可能。\n\n_+2：_狂野魔法の杖放出回数が4回から_6回_に増加。各杖は_50%_の確率で3回まで放出可能。\n\n_+3：_狂野魔法の杖放出回数が4回から_7回_に増加。各杖は_75%_の確率で3回まで放出可能。\n\n_+4：_狂野魔法の杖放出回数が4回から_8回_に増加。各杖は_100%_の確率で3回まで放出可能。
actors.hero.talent.fire_everything.comment=
actors.hero.talent.conserved_magic.title=省エネ魔法
actors.hero.talent.conserved_magic.desc=_+1：_狂野魔法の杖1回放出あたりのチャージ消費が0.5から_0.33_に低下。狂野魔法が_25%_の確率で時間を消費しない。\n\n_+2：_狂野魔法の杖1回放出あたりのチャージ消費が0.5から_0.225_に低下。狂野魔法が_50%_の確率で時間を消費しない。\n\n_+3：_狂野魔法の杖1回放出あたりのチャージ消費が0.5から_0.15_に低下。狂野魔法が_75%_の確率で時間を消費しない。\n\n_+4：_狂野魔法の杖1回放出あたりのチャージ消費が0.5から_0.1_に低下。狂野魔法が_100%_の確率で時間を消費しない。
actors.hero.talent.conserved_magic.comment=

actors.hero.talent.telefrag.title=テレフラグ
actors.hero.talent.telefrag.desc=_+1：_魔術師が帰還標的に転送し他のキャラクターと衝突した時、_10~15_のダメージを与えるが、自身も_5_のダメージを受ける。\n\n_+2：_魔術師が帰還標的に転送し他のキャラクターと衝突した時、_20~30_のダメージを与えるが、自身も_10_のダメージを受ける。\n\n_+3：_魔術師が帰還標的に転送し他のキャラクターと衝突した時、_30~45_のダメージを与えるが、自身も_15_のダメージを受ける。\n\n_+4：_魔術師が帰還標的に転送し他のキャラクターと衝突した時、_40~60_のダメージを与えるが、自身も_20_のダメージを受ける。
actors.hero.talent.telefrag.comment=英雄は自身のダメージでは死亡せず、このダメージは魔法抵抗効果で軽減可能。
actors.hero.talent.remote_beacon.title=遠方標識
actors.hero.talent.remote_beacon.desc=_+1：_魔術師は_4マス_以内の任意の場所に標識を設置できる。\n\n_+2：_魔術師は_8マス_以内の任意の場所に標識を設置できる。\n\n_+3：_魔術師は_12マス_以内の任意の場所に標識を設置できる。\n\n_+4：_魔術師は_16マス_以内の任意の場所に標識を設置できる。
actors.hero.talent.remote_beacon.comment=魔術師は到達不能な場所に標識を設置できない。
actors.hero.talent.longrange_warp.title=長距離転送
actors.hero.talent.longrange_warp.desc=_+1：_魔術師は階層を跨いで転送できるが、_150%_のチャージを消費する。\n\n_+2：_魔術師は階層を跨いで転送できるが、_117%_のチャージを消費する。\n\n_+3：_魔術師は階層を跨いで転送でき、_83%_のチャージのみ消費する。\n\n_+4：_魔術師は階層を跨いで転送でき、_50%_のチャージのみ消費する。
actors.hero.talent.longrange_warp.comment=魔術師はこの能力で封鎖された階層を離れることはできない。

#rogue
actors.hero.talent.cached_rations.title=予備食料
actors.hero.talent.cached_rations.desc=_+1：_盗賊が後続の階層を探索中、箱の中から_2袋_の予備食料を見つけ出せる。\n\n_+2：_盗賊が後続の階層を探索中、箱の中から_3袋_の予備食料を見つけ出せる。
actors.hero.talent.cached_rations.comment=予備食料は即座に食べられ、中程度の満腹度を回復、2のHPを回復し、暗影外套のチャージを1回復する。\n\n「盗賊ギルドがギルドメンバーに提供する物資支援。」
actors.hero.talent.thiefs_intuition.title=盗人の直感
actors.hero.talent.thiefs_intuition.desc=_+1：_盗賊の指輪鑑定速度が元の_2倍_に上昇。_指輪装備時_に種類を鑑定可能。\n\n_+2：_盗賊は_指輪装備時_に直接鑑定でき、_指輪拾得時_に種類を鑑定可能。
actors.hero.talent.thiefs_intuition.comment=「盗賊ギルドで仕入れた『宝石鑑定手帳』でこれらの宝石を見たことがある。」
actors.hero.talent.sucker_punch.title=不意打ち
actors.hero.talent.sucker_punch.desc=_+1：_初めて敵に不意打ちを仕掛けた時、盗賊は_1~2_の追加ダメージを与える。\n\n_+2：_初めて敵に不意打ちを仕掛けた時、盗賊は_2_の追加ダメージを与える。
actors.hero.talent.sucker_punch.comment=「不意打ちは盗賊ギルドメンバー全員の必修科目だ。」
actors.hero.talent.protective_shadows.title=暗影の庇護
actors.hero.talent.protective_shadows.desc=_+1：_盗賊が隠身中、_2ターン_毎に1のシールドを獲得。最大_3_まで蓄積。\n\n_+2：_盗賊が隠身中、_1ターン_毎に1のシールドを獲得。最大_5_まで蓄積。
actors.hero.talent.protective_shadows.comment=「暗黒に生き、光明に仕える。」

actors.hero.talent.mystical_meal.title=秘術の祭食
actors.hero.talent.mystical_meal.desc=_+1：_盗賊の食事が2ターンで完了（予備食料はターン消費なし）。_3ターン_の神器充能を獲得。\n\n_+2：_盗賊の食事が2ターンで完了（予備食料はターン消費なし）。_5ターン_の神器充能を獲得。
actors.hero.talent.mystical_meal.comment=この天赋は豊穣の角笛に充能できない。\n\n「冒険者たちの魔法アイテム使用需要を満たすため、食品店では魔法使いを雇い、食品に微量の…魔力を加えているのだ。」
actors.hero.talent.inscribed_stealth.title=巻物の隠身
actors.hero.talent.inscribed_stealth.desc=_+1：_盗賊が巻物を読むか魔法結晶を使用後、_3ターン_の隠身を獲得。\n\n_+2：_盗賊が巻物を読むか魔法結晶を使用後、_5ターン_の隠身を獲得。
actors.hero.talent.inscribed_stealth.comment=強化巻物、変成巻物、またはこれらを用いて錬成した錬金アイテムを使用した場合、隠身効果の持続時間が倍になる。\n\n生産量の多い錬金アイテム（ほとんどの結晶など）の場合、この天赋はそのアイテムの単回生産数に基づいて確率で発動する。\n\nこの天赋は無秩序魔導書を読むことでも発動する。\n\n「盗賊は暗闇の中で人に言えない秘密を読み漁ることに慣れている。」
actors.hero.talent.wide_search.title=広域探索
actors.hero.talent.wide_search.desc=_+1：_盗賊の探索範囲が方形5x5から_円形7x7_に拡大。\n\n_+2：_盗賊の探索範囲が方形5x5から_方形7x7_に拡大。
actors.hero.talent.wide_search.comment=「目が届く限り、隠れる場所はない。」
actors.hero.talent.wide_search.meta_desc=_この天赋が他の英雄に獲得された場合_、+1では探索範囲が5x5の円形に、+2では5x5の方形に拡大する。
actors.hero.talent.silent_steps.title=無音歩法
actors.hero.talent.silent_steps.desc=_+1：_盗賊は_3マス以上離れた敵_を目覚めさせない。\n\n_+2：_盗賊は_隣接していない敵_を目覚めさせない。
actors.hero.talent.silent_steps.comment=「しーっ。」
actors.hero.talent.rogues_foresight.title=盗賊の直感
actors.hero.talent.rogues_foresight.desc=_+1：_盗賊が隠し部屋のある新階層に入った時、_75%_の確率で察知する。\n\n_+2：_盗賊が隠し部屋のある新階層に入った時、_100%_の確率で察知する。
actors.hero.talent.rogues_foresight.comment=「ようやく見つけた。」

actors.hero.talent.light_cloak.title=軽量外套
actors.hero.talent.light_cloak.desc=_+1：_盗賊は暗影外套を装備しなくてもその機能を使用できるが、未装備時の外套充能速度が_25%_に低下。\n\n_+2：_盗賊は暗影外套を装備しなくてもその機能を使用できるが、未装備時の外套充能速度が_50%_に低下。\n\n_+3：_盗賊は暗影外套を装備しなくてもその機能を使用できるが、未装備時の外套充能速度が_75%_に低下。
actors.hero.talent.light_cloak.comment=
actors.hero.talent.light_cloak.meta_desc=_この天赋が他の英雄に獲得された場合_、+1/+2/+3レベルで全神器の充能速度が7%/13%/20%上昇する。
actors.hero.talent.enhanced_rings.title=指輪強化
actors.hero.talent.enhanced_rings.desc=_+1：_神器使用後の_3ターン_、盗賊の全指輪が1レベル上昇。\n\n_+2：_神器使用後の_6ターン_、盗賊の全指輪が1レベル上昇。\n\n_+3：_神器使用後の_9ターン_、盗賊の全指輪が1レベル上昇。
actors.hero.talent.enhanced_rings.comment=

actors.hero.talent.enhanced_lethality.title=急所攻撃
actors.hero.talent.enhanced_lethality.desc=_+1：_暗殺者の各段階準備で敵を即死させられるHP閾値が3/10/20/50%から_4/13/27/67%_に上昇。\n\n_+2：_暗殺者の各段階準備で敵を即死させられるHP閾値が3/10/20/50%から_5/17/33/83%_に上昇。\n\n_+3：_暗殺者の各段階準備で敵を即死させられるHP閾値が3/10/20/50%から_6/20/40/100%_に上昇。
actors.hero.talent.enhanced_lethality.comment=
actors.hero.talent.assassins_reach.title=超距離追跡
actors.hero.talent.assassins_reach.desc=_+1：_暗殺者の各段階準備の瞬間移動距離が1/2/3/4マスから_1/3/4/6マス_に延長。\n\n_+2：_暗殺者の各段階準備の瞬間移動距離が1/2/3/4マスから_2/4/6/8マス_に延長。\n\n_+3：_暗殺者の各段階準備の瞬間移動距離が1/2/3/4マスから_2/5/7/10マス_に延長。
actors.hero.talent.assassins_reach.comment=この瞬間移動は危険な地形や敵を越えられるが、壁などの堅固な地形は透過できない。
actors.hero.talent.bounty_hunter.title=賞金稼ぎ
actors.hero.talent.bounty_hunter.desc=_+1：_暗殺者がスキルで倒した敵は、準備段階のレベルに応じて戦利品ドロップ確率が_2/4/8/16%_上昇。\n\n_+2：_暗殺者がスキルで倒した敵は、準備段階のレベルに応じて戦利品ドロップ確率が_4/8/16/32%_上昇。\n\n_+3：_暗殺者がスキルで倒した敵は、準備段階のレベルに応じて戦利品ドロップ確率が_6/12/24/48%_上昇。
actors.hero.talent.bounty_hunter.comment=

actors.hero.talent.evasive_armor.title=霊猿の護り
actors.hero.talent.evasive_armor.desc=_+1：_逸動状態時、鎧の筋力要求値を超えた筋力1ポイントにつき疾行者が_1_の回避を追加獲得。\n\n_+2：_逸動状態時、鎧の筋力要求値を超えた筋力1ポイントにつき疾行者が_2_の回避を追加獲得。\n\n_+3：_逸動状態時、鎧の筋力要求値を超えた筋力1ポイントにつき疾行者が_3_の回避を追加獲得。
actors.hero.talent.evasive_armor.comment=
actors.hero.talent.projectile_momentum.title=高速投射
actors.hero.talent.projectile_momentum.desc=_+1：_逸動状態時、疾行者の投擲武器が追加で_50%_の精度と_5%_のダメージを得る。\n\n_+2：_逸動状態時、疾行者の投擲武器が追加で_100%_の精度と_10%_のダメージを得る。\n\n_+3：_逸動状態時、疾行者の投擲武器が追加で_150%_の精度と_15%_のダメージを得る。
actors.hero.talent.projectile_momentum.comment=
actors.hero.talent.speedy_stealth.title=無人領域
actors.hero.talent.speedy_stealth.desc=_+1：_疾行者が隠身中、毎ターン_2_の運動量を獲得。\n\n_+2：_1に加え、疾行者が隠身中、逸動効果の持続ターン数が_減少しない_。\n\n_+3：_1と2に加え、疾行者が隠身中、逸動状態か否かに関わらず、移動速度が_倍になる_。
actors.hero.talent.speedy_stealth.comment=

actors.hero.talent.hasty_retreat.title=かくれんぼ
actors.hero.talent.hasty_retreat.desc=_+1：_盗賊が瞬間移動後、_1ターン_の極速と隠身を獲得。\n\n_+2：_盗賊が瞬間移動後、_2ターン_の極速と隠身を獲得。\n\n_+3：_盗賊が瞬間移動後、_3ターン_の極速と隠身を獲得。\n\n_+4：_盗賊が瞬間移動後、_4ターン_の極速と隠身を獲得。
actors.hero.talent.hasty_retreat.comment=
actors.hero.talent.body_replacement.title=身代わり
actors.hero.talent.body_replacement.desc=_+1：_瞬間移動時、盗賊はHP_20_と装甲_1~3_の身代わり木杭を残す。\n\n_+2：_瞬間移動時、盗賊はHP_40_と装甲_2~6_の身代わり木杭を残す。\n\n_+3：_瞬間移動時、盗賊はHP_60_と装甲_3~9_の身代わり木杭を残す。\n\n_+4：_瞬間移動時、盗賊はHP_80_と装甲_4~12_の身代わり木杭を残す。
actors.hero.talent.body_replacement.comment=同時に存在できる身代わり木杭は1つのみ。
actors.hero.talent.shadow_step.title=煙幕潜行
actors.hero.talent.shadow_step.desc=_+1：_盗賊が隠身中、煙幕爆発を瞬時に発動でき、充能消費が_16%_減少。隠身中の煙幕爆発は敵を盲目にせず、他の天赋も発動しない。\n\n_+2：_盗賊が隠身中、煙幕爆発を瞬時に発動でき、充能消費が_30%_減少。隠身中の煙幕爆発は敵を盲目にせず、他の天赋も発動しない。\n\n_+3：_盗賊が隠身中、煙幕爆発を瞬時に発動でき、充能消費が_41%_減少。隠身中の煙幕爆発は敵を盲目にせず、他の天赋も発動しない。\n\n_+4：_盗賊が隠身中、煙幕爆発を瞬時に発動でき、充能消費が_50%_減少。隠身中の煙幕爆発は敵を盲目にせず、他の天赋も発動しない。
actors.hero.talent.shadow_step.comment=

actors.hero.talent.fear_the_reaper.title=恐怖の蔓延
actors.hero.talent.fear_the_reaper.desc=_+1：_死神の刻印を持つ敵はHPが低下した時、_残廃_効果を得る。\n\n_+2：_死神の刻印を持つ敵はHPが低下した時、_残廃と恐怖_効果を得る。\n\n_+3：_死神の刻印を持つ敵はHPが低下した時、_残廃と恐怖_効果を得る。周囲1マス内の他の敵も_残廃_効果を得る。\n\n_+4：_死神の刻印を持つ敵はHPが低下した時、_残廃と恐怖_効果を得る。周囲1マス内の他の敵も_残廃と恐怖_効果を得る。
actors.hero.talent.fear_the_reaper.comment=
actors.hero.talent.deathly_durability.title=死神の外套
actors.hero.talent.deathly_durability.desc=_+1：_死神の刻印で死亡した敵は、刻印時のHPの_13%_のシールドを盗賊に与える。\n\n_+2：_死神の刻印で死亡した敵は、刻印時のHPの_25%_のシールドを盗賊に与える。\n\n_+3：_死神の刻印で死亡した敵は、刻印時のHPの_38%_のシールドを盗賊に与える。\n\n_+4：_死神の刻印で死亡した敵は、刻印時のHPの_50%_のシールドを盗賊に与える。
actors.hero.talent.deathly_durability.comment=
actors.hero.talent.double_mark.title=二重マーク
actors.hero.talent.double_mark.desc=_+1：_ターゲットをマークした直後に別のターゲットをマークする際、マークのチャージ消費が_30%_減少。\n\n_+2：_ターゲットをマークした直後に別のターゲットをマークする際、マークのチャージ消費が_50%_減少。\n\n_+3：_ターゲットをマークした直後に別のターゲットをマークする際、マークのチャージ消費が_65%_減少。\n\n_+4：_ターゲットをマークした直後に別のターゲットをマークする際、マークのチャージ消費が_75%_減少。
actors.hero.talent.double_mark.comment=

actors.hero.talent.shadow_blade.title=影の刃
actors.hero.talent.shadow_blade.desc=_+1：_暗影の分身は本体の毎ターンのダメージの_8%_を獲得し、_25%_の確率で本体の武器のエンチャントを使用。\n\n_+2：_暗影の分身は本体の毎ターンのダメージの_16%_を獲得し、_50%_の確率で本体の武器のエンチャントを使用。\n\n_+3：_暗影の分身は本体の毎ターンのダメージの_24%_を獲得し、_75%_の確率で本体の武器のエンチャントを使用。\n\n_+4：_暗影の分身は本体の毎ターンのダメージの_32%_を獲得し、_100%_の確率で本体の武器のエンチャントを使用。
actors.hero.talent.shadow_blade.comment=
actors.hero.talent.cloned_armor.title=影の鎧
actors.hero.talent.cloned_armor.desc=_+1：_暗影の分身は本体の防具値の_12%_を獲得し、_25%_の確率で本体の防具の刻印を使用。\n\n_+2：_暗影の分身は本体の防具値の_24%_を獲得し、_50%_の確率で本体の防具の刻印を使用。\n\n_+3：_暗影の分身は本体の防具値の_36%_を獲得し、_75%_の確率で本体の防具の刻印を使用。\n\n_+4：_暗影の分身は本体の防具値の_48%_を獲得し、_100%_の確率で本体の防具の刻印を使用。
actors.hero.talent.cloned_armor.comment=
actors.hero.talent.perfect_copy.title=完全コピー
actors.hero.talent.perfect_copy.desc=_+1：_暗影の分身は本体の最大HPの_10%_を追加で獲得し、盗賊は_1マス_以内の分身と瞬時に位置を交換できる。\n\n_+2：_暗影の分身は本体の最大HPの_20%_を追加で獲得し、盗賊は_2マス_以内の分身と瞬時に位置を交換できる。\n\n_+3：_暗影の分身は本体の最大HPの_30%_を追加で獲得し、盗賊は_3マス_以内の分身と瞬時に位置を交換できる。\n\n_+4：_暗影の分身は本体の最大HPの_40%_を追加で獲得し、盗賊は_4マス_以内の分身と瞬時に位置を交換できる。
actors.hero.talent.perfect_copy.comment=

#huntress
actors.hero.talent.natures_bounty.title=自然の恵み
actors.hero.talent.natures_bounty.desc=_+1：_ハントレスが後続の階層を探索する際、背の高い草むらから隠された_4個のベリー_を見つけられる。\n\n_+2：_ハントレスが後続の階層を探索する際、背の高い草むらから隠された_6個のベリー_を見つけられる。
actors.hero.talent.natures_bounty.comment=ベリーは素早く食べられ、少量の満腹度を回復し、実用的な種を1粒食べ出せることもある。\n\n「大自然の恵みに感謝します。」
actors.hero.talent.survivalists_intuition.title=サバイバルの直感
actors.hero.talent.survivalists_intuition.desc=_+1：_ハントレスが装備を鑑定する速度が元の_1.75倍_に上昇。\n\n_+2：_ハントレスが装備を鑑定する速度が元の_2.5倍_に上昇。
actors.hero.talent.survivalists_intuition.comment=「生き延びるために、これらの装備の情報を素早く得る必要がある。」
actors.hero.talent.followup_strike.title=追撃
actors.hero.talent.followup_strike.desc=_+1：_ハントレスが弓やその他の投擲武器で敵を命中させた時、その敵への次の近接攻撃が_2点_の追加ダメージを与える。\n\n_+2：_ハントレスが弓やその他の投擲武器で敵を命中させた時、その敵への次の近接攻撃が_3点_の追加ダメージを与える。
actors.hero.talent.followup_strike.comment=「傷ついた敵を容赦なく叩き、息継ぎの暇すら与えない。」
actors.hero.talent.natures_aid.title=自然の加勢
actors.hero.talent.natures_aid.desc=_+1：_視野内の植物の効果が発動した時、ハントレスは_毎ターン_減衰する0〜2のバークスキンを獲得。\n\n_+2：_視野内の植物の効果が発動した時、ハントレスは_毎ターン_減衰する0〜2のバークスキンを獲得。
actors.hero.talent.natures_aid.comment=「自然の神からの祝福、それがいかに微かであっても。」

actors.hero.talent.invigorating_meal.title=活力の食事
actors.hero.talent.invigorating_meal.desc=_+1：_ハントレスの食事は1ターンのみ消費（ベリーはターンを消費せず）、_1ターン_のヘイストを獲得。\n\n_+2：_ハントレスの食事は1ターンのみ消費（ベリーはターンを消費せず）、_2ターン_のヘイストを獲得。
actors.hero.talent.invigorating_meal.comment=「ハントレスは身軽だが、走り回るには腹ごしらえが必要だ。」
actors.hero.talent.liquid_nature.title=液体の自然
actors.hero.talent.liquid_nature.desc=_+1：_ハントレスが薬剤、魔薬、秘薬を飲むか投擲した時、周囲に_最大3マス_の背の高い草が生え、周囲の敵は_1ターン_絡みつかれる。\n\n_+2：_ハントレスが薬剤、魔薬、秘薬を飲むか投擲した時、周囲に_最大5マス_の背の高い草が生え、周囲の敵は_2ターン_絡みつかれる。
actors.hero.talent.liquid_nature.comment=使用したのが力の薬剤、経験の薬剤、または前述の薬剤から錬成された錬金品の場合、草の成長量と絡みつきの持続時間が両方とも倍になる。\n\n生産量の多い錬金品（水爆魔薬など）の場合、この天賦はその品物の作成個数に基づいて確率で発動する。\n\n「ハントレスは薬剤中の薬草成分を再利用し、再生力を活性化できるのだ。」
actors.hero.talent.rejuvenating_steps.title=再生の歩み
actors.hero.talent.rejuvenating_steps.desc=_+1：_ハントレスが低い草や残り火を踏むと、それらは背の高い草に再生し、即座に踏みつけられる。この天賦には_10ターン_のクールダウンがある。\n\n_+2：_ハントレスが低い草や残り火を踏むと、それらは背の高い草に再生し、即座に踏みつけられる。この天賦には_5ターン_のクールダウンがある。
actors.hero.talent.rejuvenating_steps.comment=パッシブ回復効果が無効化されているか、英雄が長期間経験値を獲得していない場合、この天賦は枯れ草のみを生成する。\n\n「足を踏み入れる先、万物が競い咲く。」
actors.hero.talent.heightened_senses.title=鋭敏な感覚
actors.hero.talent.heightened_senses.desc=_+1：_ハントレスは自身の周囲_4マス_以内の_全てのユニットの_霊視を得る。\n\n_+2：_ハントレスは自身の周囲_6マス_以内の_全てのユニットの_霊視を得る。
actors.hero.talent.heightened_senses.comment=「狩人の直感。」
actors.hero.talent.durable_projectiles.title=矢弾の手入れ
actors.hero.talent.durable_projectiles.desc=_+1：_ハントレスが手にした投擲武器の耐久度が_50%増加_。\n\n_+2：_ハントレスが手にした投擲武器の耐久度が_75%増加_。
actors.hero.talent.durable_projectiles.comment=「優れた狩人は自らの武器を手入れする術を心得ている。」

actors.hero.talent.point_blank.title=至近射撃
actors.hero.talent.point_blank.desc=_+1：_ハントレスが近接距離で投擲武器または霊能弓を使用する時、精度補正が-50%から_-25%_に上昇。\n\n_+2：_ハントレスが近接距離で投擲武器または霊能弓を使用する時、精度補正が-50%から_通常精度_に上昇。\n\n_+3：_ハントレスが近接距離で投擲武器または霊能弓を使用する時、精度補正が-50%から_+25%_に上昇。
actors.hero.talent.point_blank.comment=注意：近接距離以外で投擲武器または霊能弓を使用する場合、常に50%の精度補正ボーナスを得る。
actors.hero.talent.seer_shot.title=探地の矢
actors.hero.talent.seer_shot.desc=_+1：_ハントレスが矢を地面に命中させた時、着弾点周辺_3x3_の視野を提供、_5ターン_持続。\n\n_+2：_ハントレスが矢を地面に命中させた時、着弾点周辺_3x3_の視野を提供、_10ターン_持続。\n\n_+3：_ハントレスが矢を地面に命中させた時、着弾点周辺_3x3_の視野を提供、_15ターン_持続。
actors.hero.talent.seer_shot.comment=この天賦には_10ターン_のクールダウン_がある。
actors.hero.talent.seer_shot.meta_desc=_この天賦が他の英雄によって獲得された場合、任意の投擲武器によって発動可能になる。

actors.hero.talent.farsight.title=鷲眼遠視
actors.hero.talent.farsight.desc=_+1：_狙撃手の視野範囲が_25%拡大_。\n\n_+2：_狙撃手の視野範囲が_50%拡大_。\n\n_+3：_狙撃手の視野範囲が_75%拡大_。
actors.hero.talent.farsight.comment=
actors.hero.talent.shared_enchantment.title=連動エンチャント
actors.hero.talent.shared_enchantment.desc=_+1：_投擲武器が_3%の確率_で狙撃手の霊能弓のエンチャントを継承。\n\n_+2：_投擲武器が_7%の確率_で狙撃手の霊能弓のエンチャントを継承。\n\n_+3：_投擲武器が_100%の確率_で狙撃手の霊能弓のエンチャントを継承。
actors.hero.talent.shared_enchantment.comment=投擲武器がどのようなエンチャントを持っていても、霊能弓のエンチャントは正常に発動する。
actors.hero.talent.shared_upgrades.title=連動強化
#fix9：この天賦を多くの人が理解できていないと感じたため、ハイライト表示と注釈を追加
actors.hero.talent.shared_upgrades.desc=_+1：_狙撃手が_強化済み_の投擲武器で攻撃する時、投擲武器の_レベル毎_に_1ターン_の狙撃マーク持続時間と投擲武器_段階数×2.5%_の特殊攻撃ダメージが増加。\n\n_+2：_狙撃手が_強化済み_の投擲武器で攻撃する時、投擲武器の_レベル毎_に_2ターン_の狙撃マーク持続時間と投擲武器_段階数×5%_の特殊攻撃ダメージが増加。\n\n_+3：_狙撃手が_強化済み_の投擲武器で攻撃する時、投擲武器の_レベル毎_に_3ターン_の狙撃マーク持続時間と投擲武器_段階数×7.5%_の特殊攻撃ダメージが増加。
actors.hero.talent.shared_upgrades.comment=神射の戒の効果は全ての投擲武器のダメージを対応するレベルのダメージと等しくするものであり、_強化済み_の投擲武器とはみなされない。したがって神射の戒の投擲武器への強化はこの天賦と何ら連動しない。

actors.hero.talent.durable_tips.title=持続薬液
actors.hero.talent.durable_tips.desc=_+1：_守護者の塗薬ダーツの耐久度が_2倍_。\n\n_+2：_守護者の塗薬ダーツの耐久度が_3倍_。\n\n_+3：_守護者の塗薬ダーツの耐久度が_4倍_。
actors.hero.talent.durable_tips.comment=
actors.hero.talent.barkskin.title=樹皮堅甲
actors.hero.talent.barkskin.desc=_+1：_草むらにいる時、守護者は自身のレベルの_0~50%_に相当するバークスキン効果を得る。効果は毎ターン減衰。\n\n_+2：_草むらにいる時、守護者は自身のレベルの_0~100%_に相当するバークスキン効果を得る。効果は毎ターン減衰。\n\n_+3：_草むらにいる時、守護者は自身のレベルの_0~150%_に相当するバークスキン効果を得る。効果は毎ターン減衰。
actors.hero.talent.barkskin.comment=
actors.hero.talent.shielding_dew.title=雫水護体
actors.hero.talent.shielding_dew.desc=_+1：_守護者のHPが満タンの時、雫珠を拾うことで守護者にバリアを提供、上限は守護者の最大HPの_20%_。\n\n_+2：_守護者のHPが満タンの時、雫珠を拾うことで守護者にバリアを提供、上限は守護者の最大HPの_40%_。\n\n_+3：_守護者のHPが満タンの時、雫珠を拾うことで守護者にバリアを提供、上限は守護者の最大HPの_60%_。
actors.hero.talent.shielding_dew.comment=

actors.hero.talent.fan_of_blades.title=千葉の刀扇
actors.hero.talent.fan_of_blades.desc=_+1：_霊魂の飛刃は最大_1体_の追加ターゲットを命中させ、50%のダメージを与える。ターゲットは視野内かつ元のターゲットと_30度_の扇形内にいる必要がある。\n\n_+2：_霊魂の飛刃は最大_2体_の追加ターゲットを命中させ、50%のダメージを与える。ターゲットは視野内かつ元のターゲットと_60度_の扇形内にいる必要がある。\n\n_+3：_霊魂の飛刃は最大_3体_の追加ターゲットを命中させ、50%のダメージを与える。ターゲットは視野内かつ元のターゲットと_90度_の扇形内にいる必要がある。\n\n_+4：_霊魂の飛刃は最大_4体_の追加ターゲットを命中させ、50%のダメージを与える。ターゲットは視野内かつ元のターゲットと_120度_の扇形内にいる必要がある。
actors.hero.talent.fan_of_blades.comment=
actors.hero.talent.projecting_blades.title=索敵飛刃
actors.hero.talent.projecting_blades.desc=_+1：_霊魂の飛刃の精度が_25%_上昇、最大_2マス_の堅固な地形_を貫通。\n\n_+2：_霊魂の飛刃の精度が_50%_上昇、最大_4マス_の堅固な地形_を貫通。\n\n_+3：_霊魂の飛刃の精度が_75%_上昇、最大_6マス_の堅固な地形_を貫通。\n\n_+4：_霊魂の飛刃の精度が_100%_上昇、最大_8マス_の堅固な地形_を貫通。
actors.hero.talent.projecting_blades.comment=
actors.hero.talent.spirit_blades.title=霊能飛刃
actors.hero.talent.spirit_blades.desc=_+1：_霊魂の飛刃が_30%_の確率で追加で霊能弓のエンチャントを使用。\n\n_+2：_霊魂の飛刃が_60%_の確率で追加で霊能弓のエンチャントを使用。\n\n_+3：_霊魂の飛刃が_90%_の確率で追加で霊能弓のエンチャントを使用。\n\n_+4：_霊魂の飛刃が_100%_の確率で追加で霊能弓のエンチャントを使用し、各種エンチャントが_10%のエンチャント強化_を得る。
actors.hero.talent.spirit_blades.comment=

actors.hero.talent.growing_power.title=盛壮の力
actors.hero.talent.growing_power.desc=_+1：_自然の力の射撃速度と移動速度へのボーナスが33%と100%から_38%_と_125%_に上昇。\n\n_+2：_自然の力の射撃速度と移動速度へのボーナスが33%と100%から_42%_と_150%_に上昇。\n\n_+3：_自然の力の射撃速度と移動速度へのボーナスが33%と100%から_46%_と_175%_に上昇。\n\n_+4：_自然の力の射撃速度と移動速度へのボーナスが33%と100%から_50%_と_200%_に上昇。
actors.hero.talent.growing_power.comment=
actors.hero.talent.natures_wrath.title=自然の怒り
actors.hero.talent.natures_wrath.desc=_+1：_自然の力の加護下で、霊能弓の射撃が_8%_の確率_でランダムな有害植物効果を発動。\n\n_+2：_自然の力の加護下で、霊能弓の射撃が_17%_の確率_でランダムな有害植物効果を発動。\n\n_+3：_自然の力の加護下で、霊能弓の射撃が_25%_の確率_でランダムな有害植物効果を発動。\n\n_+4：_自然の力の加護下で、霊能弓の射撃が_33%_の確率_でランダムな有害植物効果を発動。
actors.hero.talent.natures_wrath.comment=発動する可能性のある植物：盲目草、烈火花、氷冠花、断腸苔、風暴蔦。
actors.hero.talent.wild_momentum.title=自然の飛矢
actors.hero.talent.wild_momentum.desc=_+1：_霊能弓で敵を射殺した時、自然の力を_1ターン_延長、最大_2ターン_延長。\n\n_+2：_霊能弓で敵を射殺した時、自然の力を_2ターン_延長、最大_4ターン_延長。\n\n_+3：_霊能弓で敵を射殺した時、自然の力を_3ターン_延長、最大_6ターン_延長。\n\n_+4：_霊能弓で敵を射殺した時、自然の力を_4ターン_延長、最大_8ターン_延長。
actors.hero.talent.wild_momentum.comment=

actors.hero.talent.eagle_eye.title=鷲の瞳
actors.hero.talent.eagle_eye.desc=_+1：_飛鷹の視野範囲が6マスから_7マス_に拡大。\n\n_+2：_飛鷹の視野範囲が6マスから_8マス_に拡大。\n\n_+3：_飛鷹の視野範囲が6マスから_9マス_に拡大し、_2マス_の霊視を得る。\n\n_+4：_飛鷹の視野範囲が6マスから_10マス_に拡大し、_3マス_の霊視を得る。
actors.hero.talent.eagle_eye.comment=
actors.hero.talent.go_for_the_eyes.title=目潰しの爪
actors.hero.talent.go_for_the_eyes.desc=_+1：_飛鷹が攻撃時に敵の目を狙い、_2ターン_盲目にする。\n\n_+2：_飛鷹が攻撃時に敵の目を狙い、_5ターン_盲目にする。\n\n_+3：_飛鷹が攻撃時に敵の目を狙い、_5ターン_盲目にし、追加で_2ターン_の虚弱を与える。\n\n_+4：_飛鷹が攻撃時に敵の目を狙い、_5ターン_盲目にし、追加で_5ターン_の虚弱を与える。
actors.hero.talent.go_for_the_eyes.comment=
actors.hero.talent.swift_spirit.title=疾風の霊
actors.hero.talent.swift_spirit.desc=_+1：_飛鷹の移動速度が毎ターン2マスから_2.5マス_に向上、被弾時の最初の_2回_の攻撃_を必ず回避。\n\n_+2：_飛鷹の移動速度が毎ターン2マスから_3マス_に向上、被弾時の最初の_4回_の攻撃_を必ず回避。\n\n_+3：_飛鷹の移動速度が毎ターン2マスから_3.5マス_に向上、被弾時の最初の_6回_の攻撃_を必ず回避。\n\n_+4：_飛鷹の移動速度が毎ターン2マスから_4マス_に向上、被弾時の最初の_8回_の攻撃_を必ず回避。
actors.hero.talent.swift_spirit.comment=

#duelist
actors.hero.talent.strengthening_meal.title=強健の食事
actors.hero.talent.strengthening_meal.desc=_+1：_食事により、デュエリストの次の_2回_の物理攻撃_が敵に与えるダメージに3点追加。\n\n_+2：_食事により、デュエリストの次の_3回_の物理攻撃_が敵に与えるダメージに3点追加。
actors.hero.talent.strengthening_meal.comment=「腹を満たしてこそ、戦う力が湧く。」
actors.hero.talent.adventurers_intuition.title=冒険者の直感
actors.hero.talent.adventurers_intuition.desc=_+1：_デュエリストが武器を鑑定する速度が元の_2.5倍_に、防具を鑑定する速度が元の_1.75倍_に上昇。\n\n_+2：_デュエリストが_武器を装備する時_に_直接鑑定でき、防具を鑑定する速度が元の_2.5倍_に上昇。
actors.hero.talent.adventurers_intuition.comment=「百般の武具、すべてに精通す。」
actors.hero.talent.patient_strike.title=沈着の一撃
actors.hero.talent.patient_strike.desc=_+1：_デュエリストが近接攻撃の前に待機した場合、その攻撃は_1~2点_の追加ダメージを与える。\n\n_+2：_デュエリストが近接攻撃の前に待機した場合、その攻撃は_2点_の追加ダメージを与える。
actors.hero.talent.patient_strike.comment=「気を丹田に沈め、拳は迅雷の如し。」
actors.hero.talent.aggressive_barrier.title=烈気の盾
actors.hero.talent.aggressive_barrier.desc=_+1：_デュエリストのHPが最大HPの50%以下の時、武技を使用すると_3点_のバリア_を得る。\n\n_+2：_デュエリストのHPが最大HPの50%以下の時、武技を使用すると_5点_のバリア_を得る。
actors.hero.talent.aggressive_barrier.comment=「これこそ、絶境にある勇士が奮い起こす力である。」
actors.hero.talent.aggressive_barrier.meta_desc=_この天賦が他の英雄によって獲得された場合、武技を使用できない状況では、低HP時に近接攻撃を使用することでこのバリアを得る。この時、この天賦には50ターンのクールダウンが生じる。

actors.hero.talent.focused_meal.title=集中の食事
actors.hero.talent.focused_meal.desc=_+1：_デュエリストの食事は1ターンのみ消費し、_0.67_の武技チャージ_を得る。\n\n_+2：_デュエリストの食事は1ターンのみ消費し、_1_の武技チャージ_を得る。
actors.hero.talent.focused_meal.comment=「たとえ百般の武芸を誇ろうとも、飯を食わねば話にならぬ。」
actors.hero.talent.focused_meal.meta_desc=_この天賦が他の英雄によって獲得された場合、武技を使用できない状況では、+1レベル時は英雄の次の物理攻撃に英雄のレベル/3の追加ダメージ、+2レベル時は英雄のレベル/2の追加ダメージを与える。
actors.hero.talent.liquid_agility.title=液体の機敏
actors.hero.talent.liquid_agility.desc=_+1：_デュエリストが薬剤、魔薬、秘薬を飲むか投擲している間、_4倍_の回避_を得て、_1ターン_以内の次の近接攻撃が_3倍_の精度_を得る。\n\n_+2：_デュエリストが薬剤、魔薬、秘薬を飲むか投擲している間、_無制限回避_を得て、_1ターン_以内の次の近接攻撃が_無制限精度_を得る。
actors.hero.talent.liquid_agility.comment=使用したのが力の薬剤、経験の薬剤、または前述の薬剤から錬成された錬金品の場合、回避ボーナスは追加で1ターン持続し、精度ボーナスは追加で1回の攻撃持続する。\n\n生産量の多い錬金品（水爆魔薬など）の場合、この天賦はその品物の単回生産個数に基づいて確率で発動する。\n\n「これはすべて薬剤中に含まれる微量の酒精成分と、デュエリストがかつて醉拳を学んだことに由来する。」
actors.hero.talent.weapon_recharging.title=武器の再充填
actors.hero.talent.weapon_recharging.desc=_+1：_デュエリストが法杖または神器のチャージ状態にある時、_15ターン_毎に1の武技チャージを回復。\n\n_+2：_デュエリストが法杖または神器のチャージ状態にある時、_10ターン_毎に1の武技チャージを回復。
actors.hero.talent.weapon_recharging.comment=「魔法も武技の一部となり得る。」
actors.hero.talent.weapon_recharging.meta_desc=_この天賦が他の英雄によって獲得された場合、武技を使用できずかつ何らかのチャージ状態にある場合、+1時に追加で5%の近接ダメージ、+2時に追加で7.5%の近接ダメージを与える。
actors.hero.talent.lethal_haste.title=致命的残勢
actors.hero.talent.lethal_haste.desc=_+1：_デュエリストが武技で敵を倒した後、_3ターン_の飛翔（瞬間移動）を得る。\n\n_+2：_デュエリストが武技で敵を倒した後、_5ターン_の飛翔（瞬間移動）を得る。
actors.hero.talent.lethal_haste.comment=「借り道失礼。」
actors.hero.talent.lethal_haste.meta_desc=_この天賦が他の英雄によって獲得された場合、武技を使用できない状況では、この天賦は通常の武器攻撃で発動可能だが、100ターンのクールダウンが生じる。
actors.hero.talent.swift_equip.title=迅速装備
actors.hero.talent.swift_equip.desc=_+1：_デュエリストは20ターン毎に_一回_装備中の武器_を瞬時に交換できる。\n\n_+2：_デュエリストは20ターン毎に_二回_装備中の武器_を瞬時に交換できる。
actors.hero.talent.swift_equip.comment=未装備の武器をクイックスロットに置き、この天賦がクールダウン中でない時にクイックスロットの未装備武器をクリックすると瞬時に装備できる。\n\n「習うより慣れよ。」

actors.hero.talent.precise_assault.title=精密打撃
actors.hero.talent.precise_assault.desc=_+1：_デュエリストが武技を使用した後、_1ターン_以内の次の近接攻撃が_2倍_の精度_を得る。\n\n_+2：_デュエリストが武技を使用した後、_1ターン_以内の次の近接攻撃が_5倍_の精度_を得る。\n\n_+3：_デュエリストが武技を使用した後、_1ターン_以内の次の近接攻撃が_無制限精度_を得る。
actors.hero.talent.precise_assault.comment=
actors.hero.talent.precise_assault.meta_desc=_この天賦が他の英雄によって獲得された場合、武技を使用できない状況では、+1/+2/+3レベルで近接精度が10/20/30%上昇する。
actors.hero.talent.deadly_followup.title=致命的追撃
actors.hero.talent.deadly_followup.desc=_+1：_デュエリストが投擲武器で敵を命中させた後、_1ターン_以内にその敵へ与える近接ダメージが_10%_増加。\n\n_+2：_デュエリストが投擲武器で敵を命中させた後、_1ターン_以内にその敵へ与える近接ダメージが_20%_増加。\n\n_+3：_デュエリストが投擲武器で敵を命中させた後、_1ターン_以内にその敵へ与える近接ダメージが_30%_増加。
actors.hero.talent.deadly_followup.comment=

actors.hero.talent.varied_charge.title=異技チャージ
actors.hero.talent.varied_charge.desc=_+1：_勇者がそれぞれ異なる2種類の武技を使用した時、即座に_0.17_の武技チャージ_を得る。2つの武技の使用間隔に制限はない。\n\n_+2：_勇者がそれぞれ異なる2種類の武技を使用した時、即座に_0.33_の武技チャージ_を得る。2つの武技の使用間隔に制限はない。\n\n_+3：_勇者がそれぞれ異なる2種類の武技を使用した時、即座に_0.5_の武技チャージ_を得る。2つの武技の使用間隔に制限はない。
actors.hero.talent.varied_charge.comment=
actors.hero.talent.twin_upgrades.title=双子強化
actors.hero.talent.twin_upgrades.desc=_+1：_勇者が二刀流している武器のうち、一方のレベルが低く段階数がもう一方より_2段階_以上_低い場合、その武器のレベルをもう一方と同等に引き上げる。\n\n_+2：_勇者が二刀流している武器のうち、一方のレベルが低く段階数がもう一方より_1段階_以上_低い場合、その武器のレベルをもう一方と同等に引き上げる。\n\n_+3：_勇者が二刀流している武器のうち、一方のレベルが低く段階数が_もう一方より高くない_場合、その武器のレベルをもう一方と同等に引き上げる。
actors.hero.talent.twin_upgrades.comment=
actors.hero.talent.combined_lethality.title=複合致死
actors.hero.talent.combined_lethality.desc=_+1：_勇者が一方の武器の武技を使用した直後に異なる近接武器で攻撃した場合、その攻撃は_HPが3%未満_の非Boss敵を処刑する。\n\n_+2：_勇者が一方の武器の武技を使用した直後に異なる近接武器で攻撃した場合、その攻撃は_HPが7%未満_の非Boss敵を処刑する。\n\n_+3：_勇者が一方の武器の武技を使用した直後に異なる近接武器で攻撃した場合、その攻撃は_HPが10%未満_の非Boss敵を処刑する。
actors.hero.talent.combined_lethality.comment=この攻撃は通常の近接武器攻撃でも、武技の一部であってもよい。

actors.hero.talent.unencumbered_spirit.title=無縛の魂
actors.hero.talent.unencumbered_spirit.desc=_+1：_装備品1つにつき_3段階以下_の装備を使用する毎に、武僧の獲得する内力が_+50%_。\n\n_+2：_装備品1つにつき_2段階以下_の装備を使用する毎に、武僧の獲得する内力が_+75%_。1段階装備の収益は不変。\n\n_+3：_装備品1つにつき_1段階_の装備を使用する毎に、武僧の獲得する内力が_+100%_。0、1段階装備の収益は不変。また、布の鎧と鉄釘手袋を無料で1つずつ獲得する。
actors.hero.talent.unencumbered_spirit.comment=注意：素手または武力の戒での攻撃時、この天賦に収益はない。
actors.hero.talent.monastic_vigor.title=道心明然
actors.hero.talent.monastic_vigor.desc=_+1：_武僧が_100%_の内力_を持つ場合、各武術が突破状態を得る。\n\n_+2：_武僧が_80%_の内力_を持つ場合、各武術が突破状態を得る。\n\n_+3：_武僧が_60%_の内力_を持つ場合、各武術が突破状態を得る。
actors.hero.talent.monastic_vigor.comment=突破状態時：\n-空振が武器のエンチャントを使用。\n-凝神がターンを消費しない。\n-登雲の突進距離+4。\n-盤龍の与ダメージ+50%、近くの全ての敵をノックバックおよびスタン。\n-冥思が最大HPの20%を徐々に回復し、80%のダメージ耐性を提供。
actors.hero.talent.combined_energy.title=陰陽調和
actors.hero.talent.combined_energy.desc=_+1：_武僧が_1ターン_以内に武技と_4+_内力消費_の武術をそれぞれ1回使用した場合、_1_内力_を回復。\n\n_+2：_武僧が_1ターン_以内に武技と_3+_内力消費_の武術をそれぞれ1回使用した場合、_2_内力_を回復。\n\n_+3：_武僧が_1ターン_以内に武技と_2+_内力消費_の武術をそれぞれ1回使用した場合、_3_内力_を回復。
actors.hero.talent.combined_energy.comment=

actors.hero.talent.close_the_gap.title=間合いの超越
actors.hero.talent.close_the_gap.desc=_+1：_決闘を開始する時、デュエリストはターゲットに向かって_最大2マス_まで_瞬間移動。\n\n_+2：_決闘を開始する時、デュエリストはターゲットに向かって_最大3マス_まで_瞬間移動。\n\n_+3：_決闘を開始する時、デュエリストはターゲットに向かって_最大4マス_まで_瞬間移動。\n\n_+4：_決闘を開始する時、デュエリストはターゲットに向かって_最大5マス_まで_瞬間移動。
actors.hero.talent.close_the_gap.comment=この瞬間移動は危険な地形や敵を越えられるが、壁などの堅固な地形は貫通できない。瞬間移動距離は決闘開始距離の判定にも含まれる。
actors.hero.talent.invigorating_victory.title=凱旋再生
actors.hero.talent.invigorating_victory.desc=_+1：_デュエリストが決闘終了前に目標を倒した場合、決闘中に受けたダメージの_5+30%_のHPを回復。\n\n_+2：_デュエリストが決闘終了前に目標を倒した場合、決闘中に受けたダメージの_10+50%_のHPを回復。\n\n_+3：_デュエリストが決闘終了前に目標を倒した場合、決闘中に受けたダメージの_15+65%_のHPを回復。\n\n_+4：_デュエリストが決闘終了前に目標を倒した場合、決闘中に受けたダメージの_20+75%_のHPを回復。
actors.hero.talent.invigorating_victory.comment=
actors.hero.talent.elimination_match.title=連続淘汰
actors.hero.talent.elimination_match.desc=_+1：_デュエリストが決闘終了後_1ターン_以内に再び決闘を開始した場合、その決闘のチャージ消費が_16%減少_。\n\n_+2：_デュエリストが決闘終了後_1ターン_以内に再び決闘を開始した場合、その決闘のチャージ消費が_30%減少_。\n\n_+3：_デュエリストが決闘終了後_1ターン_以内に再び決闘を開始した場合、その決闘のチャージ消費が_40%減少_。\n\n_+4：_デュエリストが決闘終了後_1ターン_以内に再び決闘を開始した場合、その決闘のチャージ消費が_50%減少_。
actors.hero.talent.elimination_match.comment=

actors.hero.talent.elemental_reach.title=元素延長
actors.hero.talent.elemental_reach.desc=_+1：_元素打撃の効果範囲が4マスから_5マス_に拡大、拡散角度が65度から_75度_に拡張。\n\n_+2：_元素打撃の効果範囲が4マスから_6マス_に拡大、拡散角度が65度から_85度_に拡張。\n\n_+3：_元素打撃の効果範囲が4マスから_7マス_に拡大、拡散角度が65度から_95度_に拡張。\n\n_+4：_元素打撃の効果範囲が4マスから_8マス_に拡大、拡散角度が65度から_105度_に拡張。
actors.hero.talent.elemental_reach.comment=
actors.hero.talent.striking_force.title=強力打撃
actors.hero.talent.striking_force.desc=_+1：_元素打撃の効果強度が_30%_上昇。\n\n_+2：_元素打撃の効果強度が_60%_上昇。\n\n_+3：_元素打撃の効果強度が_90%_上昇。\n\n_+4：_元素打撃の効果強度が_120%_上昇。
actors.hero.talent.striking_force.comment=
actors.hero.talent.directed_power.title=エネルギー誘導
actors.hero.talent.directed_power.desc=_+1：_元素打撃の効果範囲内の敵1体毎に、メインターゲットへの直接攻撃が_+30%エンチャント強度_を得る。\n\n_+2：_元素打撃の効果範囲内の敵1体毎に、メインターゲットへの直接攻撃が_+60%エンチャント強度_を得る。\n\n_+3：_元素打撃の効果範囲内の敵1体毎に、メインターゲットへの直接攻撃が_+90%エンチャント強度_を得る。\n\n_+4：_元素打撃の効果範囲内の敵1体毎に、メインターゲットへの直接攻撃が_+120%エンチャント強度_を得る。
actors.hero.talent.directed_power.comment=

actors.hero.talent.feigned_retreat.title=偽装撤退
actors.hero.talent.feigned_retreat.desc=_+1：_敵がデュエリストの残像を攻撃した場合、デュエリストは_2ターン_のヘイストを得る。\n\n_+2：_敵がデュエリストの残像を攻撃した場合、デュエリストは_4ターン_のヘイストを得る。\n\n_+3：_敵がデュエリストの残像を攻撃した場合、デュエリストは_6ターン_のヘイストを得る。\n\n_+4：_敵がデュエリストの残像を攻撃した場合、デュエリストは_8ターン_のヘイストを得る。
actors.hero.talent.feigned_retreat.comment=
actors.hero.talent.expose_weakness.title=弱点看破
actors.hero.talent.expose_weakness.desc=_+1：_デュエリストの残像を攻撃した敵は_2ターン_の脆弱と被ダメージ増加を得る。\n\n_+2：_デュエリストの残像を攻撃した敵は_4ターン_の脆弱と被ダメージ増加を得る。\n\n_+3：_デュエリストの残像を攻撃した敵は_6ターン_の脆弱と被ダメージ増加を得る。\n\n_+4：_デュエリストの残像を攻撃した敵は_8ターン_の脆弱と被ダメージ増加を得る。
actors.hero.talent.expose_weakness.comment=
actors.hero.talent.counter_ability.title=武技反撃
actors.hero.talent.counter_ability.desc=_+1：_デュエリストが残像への攻撃を受けてから3ターン以内に武技を使用した場合、即座に_0.38_の武技チャージ_を回復。\n\n_+2：_デュエリストが残像への攻撃を受けてから3ターン以内に武技を使用した場合、即座に_0.77_の武技チャージ_を回復。\n\n_+3：_デュエリストが残像への攻撃を受けてから3ターン以内に武技を使用した場合、即座に_1.13_の武技チャージ_を回復。\n\n_+4：_デュエリストが残像への攻撃を受けてから3ターン以内に武技を使用した場合、即座に_1.5_の武技チャージ_を回復。
actors.hero.talent.counter_ability.comment=

#cleric
actors.hero.talent.satiated_spells.title=聖餐の祈り
actors.hero.talent.satiated_spells.desc=_+1：_食事により、牧師が次に魔法を唱える時、_3_のバリア_を得る。\n\n_+2：_食事により、牧師が次に魔法を唱える時、_5_のバリア_を得る。
actors.hero.talent.satiated_spells.comment=「これは『最後の晩餐』の再演を防ぐためである。」
actors.hero.talent.holy_intuition.title=聖なる予知
actors.hero.talent.holy_intuition.desc=_+1：_聖典が魔法_聖なる予知_を放つことができ、_3_チャージ_を消費してアイテムの呪いの有無を明らかにする。\n\n_+2：_聖典が魔法_聖なる予知_を放つことができ、_2_チャージ_を消費してアイテムの呪いの有無を明らかにする。
actors.hero.talent.holy_intuition.comment=「あなたの言葉は私の足の灯、私の道の光です。」
actors.hero.talent.searing_light.title=灼熱の光
actors.hero.talent.searing_light.desc=_+1：_牧師が_導きの光_で聖輝を付与された敵への物理攻撃に_3_の追加ダメージ_を与える。\n\n_+2：_牧師が_導きの光_で聖輝を付与された敵への物理攻撃に_5_の追加ダメージ_を与える。
actors.hero.talent.searing_light.comment=「光は闇の中に輝いている。闇はこれに打ち勝たなかった。」
actors.hero.talent.shield_of_light.title=聖なる盾
actors.hero.talent.shield_of_light.desc=_+1：_聖典が魔法_聖なる盾_を放つことができ、3チャージを消費して即座に単一ターゲットのみに有効な_2ターン_持続の_2~4_のバリア_を得る。\n\n_+2：_聖典が魔法_聖なる盾_を放つことができ、3チャージを消費して即座に単一ターゲットのみに有効な_2ターン_持続の_3~6_のバリア_を得る。
actors.hero.talent.shield_of_light.comment=「恐れるな、私があなたと共にいるからだ。驚くな、私があなたの神だからだ。私はあなたを強くし、あなたを助け、私の義の右手であなたを支える。」

actors.hero.talent.enlightening_meal.title=啓蒙の聖餐
actors.hero.talent.enlightening_meal.desc=_+1：_牧師の食事は1ターンのみ消費し、_0.67_の聖典チャージ_を得る。\n\n_+2：_牧師の食事は1ターンのみ消費し、_1_の聖典チャージ_を得る。
actors.hero.talent.enlightening_meal.comment=バッグ内に聖典がない場合、この天賦は_+1/+2_レベルで_2/3ターン_の法杖チャージと神器チャージ_を提供する（豊穣の角は自身をチャージできない）。\n\n「実際、『最後の晩餐』は既に起こった。この聖典を携えるのは、悲劇を二度と繰り返さないためである。」
actors.hero.talent.recall_inscription.title=巻蔵の呪言
actors.hero.talent.recall_inscription.refunded=アイテムは返却されました。
actors.hero.talent.recall_inscription.desc=_+1：_聖典が魔法_巻蔵の呪言_を放つことができ、_10ターン_以内に最後に使用したルーン石または巻物の効果を再度発動する。\n\n_+2：_聖典が魔法_巻蔵の呪言_を放つことができ、_300ターン_以内に最後に使用したルーン石または巻物の効果を再度発動する。
actors.hero.talent.recall_inscription.comment=巻蔵の呪言は強化の巻物、変容の巻物、昇華の秘巻の効果を再度発動できない。チャージ消費は最後に使用したアイテムに応じて変化する：ルーン石2チャージ、巻物4チャージ、秘巻6チャージ。変容の巻物または変容/強化の巻物のルーン石/秘巻効果を発動する場合、チャージ消費はさらに倍になる。\n\n「この『再び』とは、揺り動かされるもの、すなわち造られたものが取り除かれ、揺り動かされないものが残ることを指している。」
actors.hero.talent.sunray.title=陽炎射線
actors.hero.talent.sunray.desc=_+1：_聖典が魔法_陽炎射線_を放つことができ、3チャージを消費して_4~8_ダメージを与え、目標を_4ターン_盲目_にする。\n\n_+2：_聖典が魔法_陽炎射線_を放つことができ、3チャージを消費して_6~12_ダメージを与え、目標を_6ターン_盲目_にする。
actors.hero.talent.sunray.comment=陽炎射線は目標を1度だけ盲目にできるが、目標が既に陽炎射線で盲目の場合は麻痺に変わる。陽炎射線は_亡霊と悪魔属性_の敵に必ず最大ダメージを与える。\n\n「しかし、私の名を畏れるあなたがたには、義の太陽が昇る。その翼には癒しがある。あなたがたは牛舎の子牛のように跳ね回り出て行く。あなたがたは悪人を踏みつける。私が定めた日に、彼らはあなたがたの足の裏の塵となる。」
actors.hero.talent.divine_sense.title=聖なる感覚
actors.hero.talent.divine_sense.desc=_+1：_聖典が魔法_聖なる感覚_を放つことができ、2チャージを消費して50ターン持続、_8マス範囲_の霊視を得る。\n\n_+2：_聖典が魔法_聖なる感覚_を放つことができ、2チャージを消費して50ターン持続、_12マス範囲_の霊視を得る。
actors.hero.talent.divine_sense.comment=「主は人の道を見つめ、その歩みのすべてを顧みられる。悪を行う者を隠す暗黒も陰翳もない。」
#actors.hero.talent.divine_sense.meta_desc=_濡傛灉杩欎釜澶╄祴琚叾瀹冭嫳闆勮幏寰梍锛岄偅涔堝畠浼氬湪+1/+2绛夌骇鏃朵娇鑻遍泟鍦ㄤ娇鐢ㄦ硶鏉栨垨绁炲櫒鍚庤幏寰?/5鏍煎唴鐨勭伒瑙嗘劅鐭ャ€?
actors.hero.talent.bless.title=神聖なる祝福
actors.hero.talent.bless.desc=_+1：_聖典からスペル『神聖なる祝福』を割り当てる。1チャージ消費で自身は_6ターンの祝福（シールド10点）_を得、他のユニットは_10ターンの祝福（治療10点）_を得る。\n\n_+2：_聖典からスペル『神聖なる祝福』を割り当てる。1チャージ消費で自身は_10ターンの祝福（シールド15点）_を得、他のユニットは_15ターンの祝福（治療15点）_を得る。
actors.hero.talent.bless.comment=このスペルの治療が溢れた場合、シールドに変換される。\n\n「神は日頭であり、盾であり、恩恵と栄光を授ける。正直に行う者によいものを否むことはない。」
#actors.hero.talent.bless.meta_desc=_濡傛灉杩欎釜澶╄祴琚叾瀹冭嫳闆勮幏寰梍锛岄偅涔堝畠浼氬湪+1/+2绛夌骇鏃舵彁鍗囪嫳闆勫拰鎵€鏈夌洘鍙?%/5%鐨勭簿鍑嗗拰闂伩銆?

actors.hero.talent.cleanse.title=神聖なる浄化
actors.hero.talent.cleanse.desc=_+1：_聖典からスペル『神聖なる浄化』を割り当てる。1チャージ消費で自身と周囲の全てのアライのデバフを即時除去し、全員が_10点のシールド_を得る。\n\n_+2：_聖典からスペル『神聖なる浄化』を割り当てる。1チャージ消費で自身と周囲の全てのアライのデバフを即時除去し、全員が_20点のシールド_と_3ターンのデバフ免疫_を得る。\n\n_+3：_聖典からスペル『神聖なる浄化』を割り当てる。1チャージ消費で自身と周囲の全てのアライのデバフを即時除去し、全員が_30点のシールド_と_5ターンのデバフ免疫_を得る。
actors.hero.talent.cleanse.comment=
#actors.hero.talent.cleanse.meta_desc=_濡傛灉杩欎釜澶╄祴琚叾瀹冭嫳闆勮幏寰梍锛岄偅涔堝畠浼氬湪+1/+2/+3绛夌骇鏃舵湁10/20/30%鐨勬鐜囦娇鑻遍泟鍦ㄤ娇鐢ㄦ硶鏉栨垨绁炲櫒鍚庡噣鍖栬嫳闆勬墍鏈夌殑鍑忕泭鏁堟灉銆?
actors.hero.talent.light_reading.title=軽量読書
actors.hero.talent.light_reading.desc=_+1：_聖典を装備していなくてもクレリックはその機能を使えるが、装備時のチャージ速度は_25%_に低下する。\n\n_+2：_聖典を装備していなくてもクレリックはその機能を使えるが、装備時のチャージ速度は_50%_に低下する。\n\n_+3：_聖典を装備していなくてもクレリックはその機能を使えるが、装備時のチャージ速度は_75%_に低下する。
actors.hero.talent.light_reading.comment=
actors.hero.talent.light_reading.meta_desc=_この天賦が他のヒーローによって得られた場合_、+1/+2/+3レベルで全てのスタッフのチャージ速度が10/13/20%向上する。\n
actors.hero.talent.holy_lance.title=聖なる標槍
actors.hero.talent.holy_lance.desc=_+1：_プリーストがスペル『聖なる標槍』を割り当てる。1チャージ消費で命を奪う_30〜55点のダメージ_を与える。\n\n_+2：_プリーストがスペル『聖なる標槍』を割り当てる。1チャージ消費で命を奪う_45〜83点のダメージ_を与える。\n\n_+3：_プリーストがスペル『聖なる標槍』を割り当てる。1チャージ消費で命を奪う_60〜110点のダメージ_を与える。
actors.hero.talent.holy_lance.comment=聖槍は、亡灵や悪魔属性の敵に対して必ず最大ダメージを与える。聖槍には30ターンのクールダウンがあり、その後再度割り当てられる。
actors.hero.talent.hallowed_ground.title=神聖なる領域
actors.hero.talent.hallowed_ground.desc=_+1：_プリーストがスペル『神聖なる領域』を割り当てる。1チャージ消費で_3×3の範囲_に、10ターン続く聖領域を創造する。\n\n_+2：_プリーストがスペル『神聖なる領域』を割り当てる。1チャージ消費で_5×5の範囲_に、10ターン続く聖領域を創造する。\n\n_+3：_プリーストがスペル『神聖なる領域』を割り当てる。1チャージ消費で_7×7の範囲_に、10ターン続く聖領域を創造する。
actors.hero.talent.hallowed_ground.comment=スペルを割り当てると、即座にアライのHPを5点回復し、敵を短時間絡り、低い草を張り演べる。その後、聖領域は緩緩とアライを治療し、敵をダメージし、高い草を任意に生やす。聖領域はプリーストにシールドを提供する（治療ではない）。聖領域は炎によって破壊される。
actors.hero.talent.mnemonic_prayer.title=祈願の詩篇
actors.hero.talent.mnemonic_prayer.desc=_+1：_プリーストがスペル『祈願の詩篇』を割り当てる。1チャージ消費で、アライ・敵のバフ・デバフを_3ターン_延長する。\n\n_+2：_プリーストがスペル『祈願の詩篇』を割り当てる。1チャージ消費で、アライ・敵のバフ・デバフを_4ターン_延長する。\n\n_+3：_プリーストがスペル『祈願の詩篇』を割り当てる。1チャージ消費で、アライ・敵のバフ・デバフを_5ターン_延長する。
actors.hero.talent.mnemonic_prayer.comment=祈願の詩篇は、目標のバフまたはデバフを一度だけ延長できる。また、アーマースキルによるバフは延長できない。\n
actors.hero.talent.lay_on_hands.title=聖療の触れ
actors.hero.talent.lay_on_hands.desc=_+1：_パラディンがスペル『聖療の触れ』を割り当てる。1チャージ消費で近くのユニットを_15点回復_するか、パラディンが_15点のシールド_を得る。\n\n_+2：_パラディンがスペル『聖療の触れ』を割り当てる。1チャージ消費で近くのユニットを_20点回復_するか、パラディンが_20点のシールド_を得る。\n\n_+3：_パラディンがスペル『聖療の触れ』を割り当てる。1チャージ消費で近くのユニットを_25点回復_するか、パラディンが_25点のシールド_を得る。
actors.hero.talent.lay_on_hands.comment=このスペルの治療が溢れた場合、シールドに変換される。聖療は繰り返し割り当てられるが、三回分を超えるシールドを一度に与えることはできない。
actors.hero.talent.aura_of_protection.title=守護の光輝
actors.hero.talent.aura_of_protection.desc=_+1：_パラディンがスペル『守護の光輝』を割り当てる。1チャージ消費でパラディンから2グリッド内の全アライが_20%ダメージ減免_と、パラディンのアーマーの_50%刻印強化_を得る。\n\n_+2：_パラディンがスペル『守護の光輝』を割り当てる。1チャージ消費でパラディンから2グリッド内の全アライが_30%ダメージ減免_と、パラディンのアーマーの_75%刻印強化_を得る。\n\n_+3：_パラディンがスペル『守護の光輝』を割り当てる。1チャージ消費でパラディンから2グリッド内の全アライが_40%ダメージ減免_と、パラディンのアーマーの_100%刻印強化_を得る。
actors.hero.talent.aura_of_protection.comment=
actors.hero.talent.wall_of_light.title=神聖なる屏障
actors.hero.talent.wall_of_light.desc=_+1：_パラディンがスペル『神聖なる屏障』を割り当てる。1チャージ消費でパラディンの前に、10ターン続き、_3グリッドの幅_で敵を退ける坚固な壁を創造する。\n\n_+2：_パラディンがスペル『神聖なる屏障』を割り当てる。1チャージ消費でパラディンの前に、10ターン続き、_5グリッドの幅_で敵を退ける坚固な壁を創造する。\n\n_+3：_パラディンがスペル『神聖なる屏障』を割り当てる。1チャージ消費でパラディンの前に、10ターン続き、_7グリッドの幅_で敵を退ける坚固な壁を創造する。
actors.hero.talent.wall_of_light.comment=神聖なる屏障は八方向に配置でき、一度に一面だけ存在できる。\n
actors.hero.talent.divine_intervention.title=神聖なる干渉
actors.hero.talent.divine_intervention.desc=_+1：_超凡昇天発動時、クレリックがスペル『神聖なる干渉』を割り当てる。クレリックと全アライのシールドが_150点_に強化され、超凡昇天が_3ターン_延長する。\n\n_+2：_超凡昇天発動時、クレリックがスペル『神聖なる干渉』を割り当てる。クレリックと全アライのシールドが_200点_に強化され、超凡昇天が_4ターン_延長する。\n\n_+3：_超凡昇天発動時、クレリックがスペル『神聖なる干渉』を割り当てる。クレリックと全アライのシールドが_250点_に強化され、超凡昇天が_5ターン_延長する。\n\n_+4：_超凡昇天発動時、クレリックがスペル『神聖なる干渉』を割り当てる。クレリックと全アライのシールドが_300点_に強化され、超凡昇天が_6ターン_延長する。
actors.hero.talent.divine_intervention.comment=神聖なる干渉は3点の聖典チャージを消費し、同じ超凡昇天中に一度しか割り当てられない。
actors.hero.talent.judgement.title=終末の天啓
actors.hero.talent.judgement.desc=_+1：_超凡昇天発動時、クレリックがスペル『終末の天啓』を割り当てる。視界内の全ての敵に_10〜20点のダメージ_を与える。\n\n_+2：_超凡昇天発動時、クレリックがスペル『終末の天啓』を割り当てる。視界内の全ての敵に_15〜30点のダメージ_を与える。\n\n_+3：_超凡昇天発動時、クレリックがスペル『終末の天啓』を割り当てる。視界内の全ての敵に_20〜40点のダメージ_を与える。\n\n_+4：_超凡昇天発動時、クレリックがスペル『終末の天啓』を割り当てる。視界内の全ての敵に_25〜50点のダメージ_を与える。
actors.hero.talent.judgement.comment=終末の天啓は2点の聖典チャージを消費する。クレリックが超凡昇天に入ってから、または前回の終末の天啓からの毎回のスペルが、追加で33%のダメージを与える。
actors.hero.talent.flash.title=天堂の階段
actors.hero.talent.flash.desc=_+1：_超凡昇天発動時、クレリックがスペル『天堂の階段』を割り当てる。最大_3グリッド_先へ移動する。\n\n_+2：_超凡昇天発動時、クレリックがスペル『天堂の階段』を割り当てる。最大_4グリッド_先へ移動する。\n\n_+3：_超凡昇天発動時、クレリックがスペル『天堂の階段』を割り当てる。最大_5グリッド_先へ移動する。\n\n_+4：_超凡昇天発動時、クレリックがスペル『天堂の階段』を割り当てる。最大_6グリッド_先へ移動する。
actors.hero.talent.flash.comment=天堂の階段は初回2点の聖典チャージを消費し、同じ超凡昇天中に割り当てるたびにチャージ消費が+1される。\n
actors.hero.talent.body_form.title=体の位格
actors.hero.talent.body_form.desc=この天賦をアンロックすると、クレリックがスペル『体の位格』を割り当てられるようになる。1チャージ消費で、三位一体がこのゲームで鑑定したエンチャントまたは刻印を幻化する。\n\n_+1：_三位一体使用時、クレリックは選んだエンチャントまたは刻印の効果を_20ターン_得る。\n\n_+2：_三位一体使用時、クレリックは選んだエンチャントまたは刻印の効果を_27ターン_得る。\n\n_+3：_三位一体使用時、クレリックは選んだエンチャントまたは刻印の効果を_33ターン_得る。\n\n_+4：_三位一体使用時、クレリックは選んだエンチャントまたは刻印の効果を_40ターン_得る。
actors.hero.talent.body_form.comment=三位一体は一度に一つの体の位格効果しか幻化できない。まれで強力なエンチャントや刻印を選んだ場合、三位一体のアーマーチャージ消費が高くなる。
actors.hero.talent.mind_form.title=智の位格
actors.hero.talent.mind_form.desc=この天賦をアンロックすると、クレリックがスペル『智の位格』を割り当てられるようになる。1チャージ消費で、三位一体がこのゲームで使用したスタッフまたは投武を幻化する。\n\n_+1：_三位一体使用時、クレリックは選んだスタッフまたは投武の_3レベル_効果を使う。\n\n_+2：_三位一体使用時、クレリックは選んだスタッフまたは投武の_4レベル_効果を使う。\n\n_+3：_三位一体使用時、クレリックは選んだスタッフまたは投武の_5レベル_効果を使う。\n\n_+4：_三位一体使用時、クレリックは選んだスタッフまたは投武の_6レベル_効果を使う。
actors.hero.talent.mind_form.comment=三位一体は一度に一つの智の位格効果しか幻化できない。
actors.hero.talent.spirit_form.title=魂の位格
actors.hero.talent.spirit_form.desc=この天賦をアンロックすると、クレリックがスペル『魂の位格』を割り当てられるようになる。1チャージ消費で、三位一体がこのゲームで鑑定した指輪または神器（聖典除く）を幻化する。\n\n_+1：_三位一体使用時、クレリックは選んだ指輪の_1レベル_効果を20ターン得るか、選んだ神器の_4レベル_効果を使う。\n\n_+2：_三位一体使用時、クレリックは選んだ指輪の_2レベル_効果を20ターン得るか、選んだ神器の_6レベル_効果を使う。\n\n_+3：_三位一体使用時、クレリックは選んだ指輪の_3レベル_効果を20ターン得るか、選んだ神器の_8レベル_効果を使う。\n\n_+4：_三位一体使用時、クレリックは選んだ指輪の_4レベル_効果を20ターン得るか、選んだ神器の_10レベル_効果を使う。
actors.hero.talent.spirit_form.comment=三位一体は一度に一つの魂の位格効果しか幻化できない。三位一体で神器を使用した場合、効果とアーマーチャージ消費は神器によって異なる。\n
actors.hero.talent.beaming_ray.title=光霊召喚
actors.hero.talent.beaming_ray.desc=この天賦をアンロックすると、クレリックがスペル『光霊召喚』を割り当てられるようになる。1チャージ消費で強化アライが伝送ビームを発射する。ビームは壁を貫通し、アライを指定位置へ送る。その位置に敵がいれば、アライは敵の近くに現れて攻撃目標にする。通常移動できないアライも送れるが、その場合ビームの範囲が半減する。\n\n_+1：_伝送ビームの最大範囲が_4グリッド_になり、万物一心が最近の敵に与えるダメージ加成が_35%_に上昇し、10ターン続く。\n\n_+2：_伝送ビームの最大範囲が_8グリッド_になり、万物一心が最近の敵に与えるダメージ加成が_40%_に上昇し、10ターン続く。\n\n_+3：_伝送ビームの最大範囲が_12グリッド_になり、万物一心が最近の敵に与えるダメージ加成が_45%_に上昇し、10ターン続く。\n\n_+4：_伝送ビームの最大範囲が_16グリッド_になり、万物一心が最近の敵に与えるダメージ加成が_50%_に上昇し、10ターン続く。
actors.hero.talent.beaming_ray.comment=
actors.hero.talent.life_link.title=血の絆
actors.hero.talent.life_link.desc=この天賦をアンロックすると、クレリックがスペル『血の絆』を割り当てられるようになる。1チャージ消費で、クレリックと強化アライの間に生命の絆を結ぶ。これにより、クレリックとアライは受けたダメージを共有し、レベル3以下のバフ型クレリックスペルが両方に効果を及ぼす。\n\n_+1：_生命の絆が_10ターン_続き、万物一心のダメージ減免が_35%_に上昇する。\n\n_+2：_生命の絆が_13ターン_続き、万物一心のダメージ減免が_40%_に上昇する。\n\n_+3：_生命の絆が_17ターン_続き、万物一心のダメージ減免が_45%_に上昇する。\n\n_+4：_生命の絆が_20ターン_続き、万物一心のダメージ減免が_50%_に上昇する。
actors.hero.talent.life_link.comment=
actors.hero.talent.stasis.title=星界投射
actors.hero.talent.stasis.desc=この天賦をアンロックすると、クレリックがスペル『星界投射』を割り当てられるようになる。1チャージ消費で強化アライをステーシス状態にする。アライは一時的に地牢から移され、万物一心を含む全てのバフの残り時間を保持する。効果終了時、アライはあなたの近くに再び現れる。このスペルは消費なしで即時に再割り当てでき、効果を早めに終了させられる。移動できないアライにも効くが、階層を越えて移動させることはできない。\n\n_+1：_ステーシス状態は最大_60ターン_続く。\n\n_+2：_ステーシス状態は最大_90ターン_続く。\n\n_+3：_ステーシス状態は最大_120ターン_続く。\n\n_+4：_ステーシス状態は最大_150ターン_続く。
actors.hero.talent.stasis.comment=アライがステーシス状態のとき、クレリックは光霊召喚で再び召べたり、血の絆で効果を早めに与えたりできる。ただし、ステーシス中のアライは血の絆の効果を受けられない。\n\n
#universal
actors.hero.talent.heroic_energy.title=勇気のエネルギー
actors.hero.talent.heroic_energy.rat_title=陰の勇気
actors.hero.talent.heroic_energy.desc=_+1：_ヒーローアーマー能力のチャージ消費が_12%減少_する。\n\n_+2：_ヒーローアーマー能力のチャージ消費が_23%減少_する。\n\n_+3：_ヒーローアーマー能力のチャージ消費が_32%減少_する。\n\n_+4：_ヒーローアーマー能力のチャージ消費が_40%減少_する。
