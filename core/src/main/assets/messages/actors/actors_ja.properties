actors.hero.talent.boss_talent_slot_3.desc=この地下牢に降りた時からどこかおかしいと感じていた。今になって、本来持っていたタレントの一部が消され、空白だけが残っていることに気づいた...\n\n幸い、この地下牢の深部の強力な敵に打ち勝てば、より強力な力を得られる。要するに、今は進み続けるしかない。\n\n_15階_のBossが落とす昇華の秘巻を読むと、このタレントが対応するBossタレントに昇華し、2階層タレントに追加のタレントポイントを1つ提供する。それまではこのタレントはレベルアップも変異も不可。
