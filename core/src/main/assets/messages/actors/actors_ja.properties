actors.hero.talent.bat_serum.desc=_+0：_敵の近接ダメージ時_40%吸血効果_獲得。\n\n_+1：_敵の近接ダメージ時_20%吸血効果_獲得。\n\n_+2：_敵の追加吸血効果なし。
actors.hero.talent.bat_serum.comment=「壮士飢えて英雄の肉を食らひ、笑談に渇して血袋の血を飲む。」
