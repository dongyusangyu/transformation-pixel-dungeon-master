actors.mobs.npcs.blacksmith.name=トロルの鍛冶屋
actors.mobs.npcs.blacksmith.intro_quest_warrior=えっへん、人間！思ったより強くないか？
actors.mobs.npcs.blacksmith.intro_quest_mage=えっへん、人間！思ったより頭がいいじゃないか？
actors.mobs.npcs.blacksmith.intro_quest_rogue=えっへん、人間！思ったよりこそこそしいじゃないか？
actors.mobs.npcs.blacksmith.intro_quest_huntress=えっへん、人間！思ったより敏捷じゃないか？
actors.mobs.npcs.blacksmith.intro_quest_duelist=えっへん、人間！思ったより勇猛じゃないか？
actors.mobs.npcs.blacksmith.intro_quest_cleric=えっへん、人間！思ったより真面目じゃないか？
#fix9锛氳ˉ鍏呭法榄斿缁呭＋鐨勫舰瀹?
actors.mobs.npcs.blacksmith.intro_quest_freeman=えっへん、人間！思ったより回ってるじゃないか？
actors.mobs.npcs.blacksmith.intro_quest_slimegirl=えっへん、魔物！お前って意外と使えるんじゃないか？
actors.mobs.npcs.blacksmith.intro_quest_ninja=えっへん、人間！お前、なんか神秘的だな！
actors.mobs.npcs.blacksmith.intro_quest_dm400=う…、また鉄くずか？
actors.mobs.npcs.blacksmith.intro_quest_princess=えっへん、ドワーフ！そうだ、お前だ。人間と交わっているが、そのドワーフ特有の臭さはわかるぜ！
actors.mobs.npcs.blacksmith.intro_quest_friar=…お前には恐ろしい匂いがあるが、私を驚かせるにはまだまだ遠いな。
actors.mobs.npcs.blacksmith.intro_quest_start=無用な廃物でいたくないだろ？ちょうどいい、こちらで頑張ってもらうぜ。古い鉱井の上に鍛冶屋を立てたんだ、段階はあちらだ。このツルハシを持って、_ダークトルム鉱石を40個_採ってくれ。下の石はあまり硬くない、_少し力を入れれば壁さえ鑿って取れる_。\n\nなに、応えて欲しいと？またげなやつめ…\n\nよいそうだ、鏨を打ってやるぜ。お前はよく運を持っている、私はこの近くで唯一の鍛冶屋だ！
actors.mobs.npcs.blacksmith.intro_quest_crystal=ただし気をつけろ。この鉱井はお前のような弱者には危険すぎる。廃棄されてから久しく、クリスタルが生えている。キラキラだが脆すぎて価値はない。ただし、魔物が守っている。結構メンドイので、_採鉱位置に気をつけろ_。よりないと魔物の目を向けることになる。\n\n下には_巨大クリスタル_があって、それなりに固い。これを取り除くには戦うしかない。敲せばクリスタルの成長を遅らせるだろう。それができたら、もう少し報酬を出すぜ。
actors.mobs.npcs.blacksmith.intro_quest_gnoll=ただし気をつけろ。この鉱井はお前のような弱者には危険すぎる。一群のグノールがダークトルムを目指して、下で悪さをしている。アホどいつも、採鉱中に崩壊を引き起こしやがった。お前は自分で道を開けるしかない、_崩れたばかりの岩を探せ_。\n\n一匹のグノールが先立ってやってきている。おそらく_グノールシャーマン_だろう。こいつを倒せば、もう少し報酬を出すぜ。ただし、彼は定まったものだ。
actors.mobs.npcs.blacksmith.intro_quest_fungi=ただし気をつけろ。この鉱井はお前のような弱者には危険すぎる。下である種の魔茸が生えている。あつつまりの中にはマッシュルームもいる。目をつけられると悪さするが、腔がないので追うことはできない。生きて帰りたかったら_彼らの視界に入るな_。\n\n_巨大マッシュルーム_を倒せたら、もう少し報酬を出すぜ。ただし、彼は結構メンドイで、壁に隠れたエサーの細茎と繋がっている。大部分の細茎を斃さなければ、本当のダメージを与えられない。
actors.mobs.npcs.blacksmith.reminder=また私の時間を無駄にするのか？鉱井の入り口はそこだ。
actors.mobs.npcs.blacksmith.reminder_crystal=ダークトルムはあるだけ多いほうがいい。できれば巨大クリスタルも取り除くといいな。
actors.mobs.npcs.blacksmith.reminder_gnoll=ダークトルムはあるだけ多いほうがいい。できればグノールシャーマンも殺すといいな。
actors.mobs.npcs.blacksmith.reminder_fungi=ダークトルムはあるだけ多いほうがいい。できれば巨大マッシュルームも殺すといいな。
actors.mobs.npcs.blacksmith.lost_pick=まさか、私のツルハシはどこへ！？
actors.mobs.npcs.blacksmith.quest_start_prompt=准备はいいか？バッグにダークトルムを入れる余地を残しておけよ。\n\n_下れるのは一度だけだ！_
actors.mobs.npcs.blacksmith.enter_yes=准备できた
actors.mobs.npcs.blacksmith.enter_no=まだだ
actors.mobs.npcs.blacksmith.exit_warn_none=それだけか？たった数個しか採っていない！どうしても_40個_は採れるだろう。\n\n_よく思え、この段階を上れば二度と下れないぞ。_
actors.mobs.npcs.blacksmith.exit_warn_low=それだけか？あまり採れていないようだ。どうしても_40個_は採れるはずだ。\n\n_よく思え、この段階を上れば二度と下れないぞ。_
actors.mobs.npcs.blacksmith.exit_warn_med=終わったか？数個採っているが、下にはまだまだあるはずだ。どうしても_40個_は採れる。\n\n_よく思え、この段階を上れば二度と下れないぞ。_
actors.mobs.npcs.blacksmith.exit_warn_high=終わったか？かなり採っているが、私にとってはまだまだ多いほうがいい。どうしても_40個_は採れる。\n\n_よく思え、この段階を上れば二度と下れないぞ。_
actors.mobs.npcs.blacksmith.exit_warn_full=終わったか？かなり採ったが、下で何か喪わないようにな。\n\n_よく思え、この段階を上れば二度と下れないぞ。_
actors.mobs.npcs.blacksmith.exit_warn_crystal=巨大クリスタルがまだ下にいる。取り除ければ、少し報酬を追加するぜ。
actors.mobs.npcs.blacksmith.exit_warn_gnoll=グノールシャーマンがまだ下にいる。殺せれば、少し報酬を追加するぜ。
actors.mobs.npcs.blacksmith.exit_warn_fungi=巨大マッシュルームがまだ下にいる。殺せれば、少し報酬を追加するぜ。
actors.mobs.npcs.blacksmith.exit_yes=やったぜ
actors.mobs.npcs.blacksmith.exit_no=まだだ
actors.mobs.npcs.blacksmith.get_lost=忙しいんだ。どけ！
actors.mobs.npcs.blacksmith.entrance_blocked=下への道が堵塞されている。
actors.mobs.npcs.blacksmith.cant_enter_old=このエリアは現在のプレイでは利用できません。新しいプレイを始めて、新しいクエストを試してください。
actors.mobs.npcs.blacksmith.def_verb=披き
actors.mobs.npcs.blacksmith.desc=このトロルの鍛冶屋は他のトロルと同じく、高くて細く、肌色と肌理が石のようである。このトロルの鍛冶屋は、体形に見合わない小さなハンマーを持ち、繰り返し修理をしている。\n
##old blacksmith quest dialogue from pre-v2.2.0
actors.mobs.npcs.blacksmith.gold_1=えい、おい！無用な廃物でいたくないだろ？そのツルハシを持って、_ダークトルム鉱石を15個_採ってくれ。なに、応えて欲しいと？またげなやつめ…\nよいそうだ、鏨を打ってやるぜ。お前はよく運を持っている、私はこの近くで唯一の鍛冶屋だ！
actors.mobs.npcs.blacksmith.blood_1=えい、おい！無用な廃物でいたくないだろ？そのツルハシを使って_蝙蝠を殺せ_、ツルハシの先に血がつく。なに、応えて欲しいと？またげなやつめ…\n\nよいそうだ、鏨を打ってやるぜ。お前はよく運を持っている、私はこの近くで唯一の鍛冶屋だ！
actors.mobs.npcs.blacksmith.gold_2=ダークトルム鉱石が15個。本当に、そんなに難しいのか？
actors.mobs.npcs.blacksmith.blood_2=ツルハシに蝙蝠の血が必要だと言っただろう。どけ！
actors.mobs.npcs.blacksmith.completed=おう、やっと帰ってきたか…まあいい、帰らないよりました。\n
actors.mobs.npcs.ghost.name=悲しみの幽霊
actors.mobs.npcs.ghost.rat_1=こんにちは、%s…いつか、私もお前のように強く、自信に満ちていた…しかし、悪魔のような野獣に殺された…私はここを離れない…復讐を果さなければ…_腐臭ネズミ_を殺せ、私の生命を奪ったものだ…\n\n彼はこの階層を潜回っている…四方に汚らしを広げて…_機れの雲と腐食性の噛めつきに気をつけろ、彼が生み出す酸性粘液は水に溶ける…_
actors.mobs.npcs.ghost.rat_2=私を助けてくれ…あの厄悪な存在を殺してくれ…\n\n_水の近くで戦え…彼の悪臭を避けろ…_
actors.mobs.npcs.ghost.gnoll_1=こんにちは、%s…いつか、私もお前のように強く、自信に満ちていた…しかし、ことなる敵に殺された…私はここを離れない…復讐を果さなければ…_グノール詐術師_を殺せ、私の生命を奪ったものだ…\n\n彼は他のグノールとは違う…潜伏し、投武を使う…_毒の鏢と火鏢に気をつけろ、できるだけ近づけ…_
actors.mobs.npcs.ghost.gnoll_2=私を助けてくれ…あのことなる奥手を殺してくれ…\n\n_彼に攻撃させるな…近くに居れ、近くほどいい…_
actors.mobs.npcs.ghost.crab_1=こんにちは、%s…いつか、私もお前のように強く、自信に満ちていた…しかし、古代の生物に殺された…私はここを離れない…復讐を果さなければ…_巨鋏蟹_を殺せ、私の生命を奪ったものだ…\n\n彼は数多の歳月を経てきた…巨大な鋏と非常に厚い甲殻を持つ…_鋏に気をつけろ、偷袭するしかない。さもないと鋏で攻撃を披かれる…_
actors.mobs.npcs.ghost.crab_2=私を助けてくれ…あの甲殻類を殺してくれ…\n\n_彼がお前を発見すれば、あらゆる攻撃を披いてくる…_
actors.mobs.npcs.ghost.find_me=ありがとう…私を探してくれ…
actors.mobs.npcs.ghost.desc=この幽霊はほとんど不可視である。形のない暗い光斑と悲しんだ顔で構成されている。\n
actors.mobs.npcs.imp.name=野心まんまんな小悪魔
actors.mobs.npcs.imp.intro=あなたは冒険家か？冒険家は大好きだ！何か殺す必要があれば、彼らいつもやってくれる、そうだろ？もちろん、報酬があればな！
actors.mobs.npcs.imp.golems_1=とにかく、_ゴーレム_を数匹殺してほしい。ここで小さなビジネスを始めたいが、このゴーレムのバカたちがビジネスを台無しにする！話を通じないグラナイトのアホどいつめだ。でもうマッピエ！たのむ、殺してくれ…_もくゴーレム4個_だ、報酬はあなたのものだ。
actors.mobs.npcs.imp.monks_1=とにかく、_僧侶_を数人殺してほしい。ここで小さなビジネスを始めたいが、このクレイジーな盛りは何も買わない上に、他の顧客を跑させてしまう。でもうマッピエ！たのむ、殺してくれ…_もく僧侶5人_だ、報酬はあなたのものだ。
actors.mobs.npcs.imp.golems_2=ゴーレム狩りはどうだ？エンブレムを持ち帰るのを忘れるなよ。
actors.mobs.npcs.imp.monks_2=おっ、まだ生きていたか！お前の功夫は彼らよりもっと上手だと思っていたぜ。僧侶のエンブレムを持ち帰るのを忘れるなよ。
actors.mobs.npcs.imp.cya=また会おう、%s。
actors.mobs.npcs.imp.hey=喂喂喂、%s！
actors.mobs.npcs.imp.desc=小悪魔は一種の低等悪魔である。強い力も魔法天賦もないが、相当聪明而且善于交际。多くの小悪魔は他の悪魔が存在しない場所に住むのが好きである。\n
actors.mobs.npcs.impshopkeeper.name=野心まんまんな小悪魔
actors.mobs.npcs.impshopkeeper.greetings=こんにちは、%s。
actors.mobs.npcs.impshopkeeper.greetings_ascent=%s、何をしたんだ？商売をしたいなら早くしろ、ここに長居はしたくない！
actors.mobs.npcs.impshopkeeper.thief=お前を信頼できると思ったのに…
actors.mobs.npcs.impshopkeeper.buyback=小悪魔は爽快にあなたの物品を返還した。
actors.mobs.npcs.impshopkeeper.desc=小悪魔は悪魔大厅の入り口の前に小さな店を出している。ここで友好的な顔を見られるのはなかなか良いが、商品の値段は全然友好的ではない。\n
actors.mobs.npcs.mirrorimage.name=鏡像
actors.mobs.npcs.mirrorimage.desc=この幻像はあなたと非常によく似ており、現在の武器とアーマーを装備している。\n\n鏡像は敵を猟し、鏡像武器で攻撃する。鏡像武器の使用方式と特性はあなたの手の中のものと同じだが、ダメージは低い。鏡像は生成時にほとんど隐形だが、攻撃後に顕形する。\n\n鏡像には一定の攻撃能力があるが、本体は非常に脆く、ダメージを受けると瞬間に消散する。
actors.mobs.npcs.mirrorimage.discover_hint=あなたは某巻物でこのユニットを発見できる。\n
actors.mobs.npcs.npc.discover_hint=あなたは某地牢区域でこのユニットを発見できる。\n
actors.mobs.npcs.dongyusangyu.name=東隅桑楡
actors.mobs.npcs.dongyusangyu.desc=この橙色のハニーは常に一袋の路线标记を持ち、还有一本字迹工整の宝探し積分簿を持っている。
actors.mobs.npcs.dongyusangyu.hello=運試しに、宝探しを一局やってみないか？\n
actors.mobs.npcs.surfaceshopkeeper.name=店主
actors.mobs.npcs.surfaceshopkeeper.desc=運営地表商店の店主。貨架商品は第10層の価格で出售し、查询购买の商品は第15層の価格で出售する。
actors.mobs.npcs.surfaceshopkeeper.thief=こそどろ、こそどろ！
actors.mobs.npcs.surfaceshopkeeper.warn=小心！二度目は警告しないぞ。
actors.mobs.npcs.surfaceshopkeeper.flee=店主が閉店して逃跑した！
actors.mobs.npcs.surfaceshopkeeper.sell=道具を出售
actors.mobs.npcs.surfaceshopkeeper.query=查询購入
actors.mobs.npcs.surfaceshopkeeper.raid=搜打撤に入る
actors.mobs.npcs.surfaceshopkeeper.talk=交谈
actors.mobs.npcs.surfaceshopkeeper.talk_text=普通消耗品の正確な名称を教えてくれ。重要物品でなければ、売ってやれるかもしれない。
actors.mobs.npcs.surfaceshopkeeper.raid_title=搜打撤委託
actors.mobs.npcs.surfaceshopkeeper.raid_body=入場費は%1$dゴールド。クリスタルキーを見つけて标记された撤离部屋に到着し、成功撤离してこそ本局の戦利品を持ち帰れる。失敗すると全ての本局戦利品を失い、随机で1〜3個の普通消耗品を損なう。二つ目のクリスタルキーを持って撤离すると、追加で%2$dゴールドを得る。\n\n場内には蔵品と附魔投掷武器が出現するが、近战武器やアーマーは追加で散落しない。
actors.mobs.npcs.surfaceshopkeeper.raid_enter=支払いして進入
actors.mobs.npcs.surfaceshopkeeper.raid_cancel=暂不進入
actors.mobs.npcs.surfaceshopkeeper.raid_no_gold=搜打撤に進入するには%dゴールドが必要。
actors.mobs.npcs.surfaceshopkeeper.raid_unavailable=現在、搜打撤委託を開始できない。
actors.mobs.npcs.surfaceshopkeeper.buyback=店主は不承不承にあなたの物品を返還した。
actors.mobs.npcs.surfaceshopkeeper.query_title=查询購入
actors.mobs.npcs.surfaceshopkeeper.query_body=完全な道具名称を入力。末尾に「x数量」を追加可能。例：治療薬剤x3。每种道具は最大1個まで查询購入できる。
actors.mobs.npcs.surfaceshopkeeper.query_confirm=查询
actors.mobs.npcs.surfaceshopkeeper.query_cancel=取消
actors.mobs.npcs.surfaceshopkeeper.invalid_quantity=購入数量が無効。
actors.mobs.npcs.surfaceshopkeeper.not_found=その道具を查询できない、またはその道具に售价がない。
actors.mobs.npcs.surfaceshopkeeper.limit_reached=每种道具は最大%1$d個まで查询購入できる。あなたは既に%2$d個購入している。
actors.mobs.npcs.surfaceshopkeeper.query_offer=数量：%1$d\n単価：%2$dゴールド\n総価：%3$dゴールド\n購入前剩余額度：%4$d
actors.mobs.npcs.surfaceshopkeeper.buy=購入
actors.mobs.npcs.surfaceshopkeeper.not_enough_gold=あなたのゴールドが不足している。\n
actors.mobs.npcs.prismaticimage.name=虹光幻像
actors.mobs.npcs.prismaticimage.desc=この虹光に闪烁いている幻像はあなたと非常によく似ており、現在の武器とアーマーを装備している。\n\n虹光守卫は敵を追撃し、仇恨を引きつけ、強化された防御力と生命値で火力を分担する。镜像のように攻撃的ではないが、生命値が高く、あなたのアーマーに基づく防御バフを持つ。\n\n幻像の生命が0になると、一定時間存在を保ち、その間仍能被治愈。周囲に敵がいなくなると、幻像は消散して主人に依附する。
actors.mobs.npcs.prismaticimage.discover_hint=あなたは某巻物でこのユニットを発見できる。\n
actors.mobs.npcs.ratking.name=鼠王
actors.mobs.npcs.ratking.not_sleeping=寝てなんかいないぞ！
actors.mobs.npcs.ratking.what_is_it=何をしようというんだ？こんな破事にかまっている暇はない。我が王国は自分で运转してはいかない。
actors.mobs.npcs.ratking.confused=こ…ここはどこだ？我が王国が私を必要としている！
actors.mobs.npcs.ratking.crown_clothes=服を着ろ！皇室との礼儀もわからんのか！
actors.mobs.npcs.ratking.crown_desc=わあ、その王冠は本王にくれるのか！？私の王冠よりずっと輝いている。では好意で受け取ってやろう！\n\nもちろん、堂堂たる鼠王がただで貰うわけにはいかない。代わりに、本王は「英雄」に相応しい強大な能力を授けてやろう！どうだ、要るか？
actors.mobs.npcs.ratking.crown_yes=もちろん！
actors.mobs.npcs.ratking.crown_info=詳しく聞こう。
actors.mobs.npcs.ratking.crown_no=やっぱり止す…
actors.mobs.npcs.ratking.crown_thankyou=へへへへ、ありがとう！本王を失望させるなよ、我が威名を宣伝して来い！
actors.mobs.npcs.ratking.crown_fine=よし！別にあの輝く王冠はあまり欲しくなかったしな…
actors.mobs.npcs.ratking.crown_after=新しい服は着心地がいいか？誠信交易、返品不可！
actors.mobs.npcs.ratking.desc_crown=この鼠は普通の啮齿小老鼠より少し大きい。ドワーフ国王の王冠をかぶっている。
actors.mobs.npcs.ratking.desc_birthday=この鼠は普通の啮齿小老鼠より少し大きい。緑色のパーティハットをかぶっており、常の王冠ではない。祝鼠王誕生日快乐！
actors.mobs.npcs.ratking.desc_winter=この鼠は普通の啮齿小老鼠より少し大きい。小さなホリデーハットをかぶっており、常の王冠ではない。ホリデー快乐！
actors.mobs.npcs.ratking.desc=この鼠は普通の啮齿小老鼠より少し大きい。小さな王冠をかぶっている。
actors.mobs.npcs.ratking.discover_hint=あなたは某地牢区域の结末でこのユニットを発見できる。\n
actors.mobs.npcs.sheep.name=羊
actors.mobs.npcs.sheep.baa!=メェ！
actors.mobs.npcs.sheep.baa?=メェ？
actors.mobs.npcs.sheep.baa.=メェ。
actors.mobs.npcs.sheep.baa...=メェ…
actors.mobs.npcs.sheep.def_verb=披き
actors.mobs.npcs.sheep.desc=これは魔法の羊だ。なぜ魔法の羊と呼ばれるのか？殺せないからだ。ただそこに立って消えるまで、反芻しながら白目をむくことしかできない。
actors.mobs.npcs.sheep.discover_hint=あなたは某物品或陷阱でこのユニットを発見できる。\n
actors.mobs.npcs.shopkeeper.name=店主
actors.mobs.npcs.shopkeeper.thief=泥棒、泥棒！
actors.mobs.npcs.shopkeeper.warn=気をつけろ！二度は警告しないぞ。
actors.mobs.npcs.shopkeeper.flee=店主が店を閉めて逃げた！
actors.mobs.npcs.shopkeeper.sell=売りたいアイテムを選べ
actors.mobs.npcs.shopkeeper.talk=話す
actors.mobs.npcs.shopkeeper.buyback=店主はしぶしぶあなたのアイテムを買い戻した。
actors.mobs.npcs.shopkeeper.talk_prison_intro=冒険を成功させるために必要なものはすべてここにある！
actors.mobs.npcs.shopkeeper.talk_prison_warrior=そのタトゥー、面白いな。普通は一揃いだ。まさか不名誉を負った英雄か何かってわけじゃないよな？まあいい、君が何をしようと俺の知ったことじゃない。興味があるのはお前の金だけだ。
actors.mobs.npcs.shopkeeper.talk_prison_mage=へへ、君の手配書を街のどこかで見かけた気がする。逃亡中か？おや？無実だって？本当か？まあまあ…リラックスしな、通報するよりやるべきことがあるんでね。でも、そのためにはちょっと買い物してもらう必要があるかもな？
actors.mobs.npcs.shopkeeper.talk_prison_rogue=盗賊ギルドがこのエリアを掃除するために派遣したのか？違う？ただの買い物客？ここまで来れるってことは確かに何体かモンスターを倒したんだろうが、だからって割引は期待するなよ。保護費はたっぷり払ってるが、君たちがここで俺を守ってるようには思えないな。
actors.mobs.npcs.shopkeeper.talk_prison_huntress=お嬢さん、ここはあなたのいるべき場所じゃないと思うがね。狭い地下牢の市場は、街の大広間や郊外の森みたいに広々としてはないもんだ。へへ、おっと、この無神経な口は気にしないでくれ。何か買っていきな？
actors.mobs.npcs.shopkeeper.talk_prison_duelist=うわっ、天下を渡り歩く大英雄じゃないか！また小さな町を救おうってんなら、幸運を祈るしかないな。なんせここの危険は盗賊団なんかよりずっと厄介だからな。もちろん、誰よりもうまくやると信じてるよ。ただ、俺の店の前で死なないでくれよ。
actors.mobs.npcs.shopkeeper.talk_prison_cleric=こんにちは、あなた様。もはや「陛下」とお呼びすべきでしょうか？はは、いずれにせよ、ここは聖人たるあなたが来る場所じゃありませんよ。もしあなたも「主のもとへ」旅立ってしまったら、信者たちが心を痛めるでしょう。ですがあなたの至高の権能をもってすれば、世俗の金には困らないはず。何か買って万が一に備えてはいかがですか？
#fix9：文案修正
actors.mobs.npcs.shopkeeper.talk_prison_freeman=おや、この紳士、確か商業誌であなたの写真を見たような…いや、ある有名な大物と見た目がそっくりだ。とにかく、あなたはケチな人には見えない。ここで何か買っていきませんか？私の商才に賭けて保証します、どれも生き残るのに役立つ良い品ばかりですよ。
actors.mobs.npcs.shopkeeper.talk_prison_slimegirl=え…こんにちは？どんなモンスターも私を傷つけられないが、あなたが来たのには本当に驚いたよ。俺の言葉がわかるなら、この品々を見てみなよ。俺にとって初めてのモンスターのお客様ってことで、人間に売るより安くしとくぜ、確かに。
actors.mobs.npcs.shopkeeper.talk_prison_ninja=DOMO、忍者＝SAN、店主＝DESU。遠い東の国からここに何の用だ？それとも数十年経って、ようやくここに閉じ込められた「反逆者」を始末しに来たのか？まあいい、そんなことは俺の知ったことじゃない。俺が本当に気にするのは金だけだ。興味があるなら、何か必要なものがあるか見ていきな。
actors.mobs.npcs.shopkeeper.talk_prison_dm400=おい、鉄くず、気をつけろよ！俺の商品を壊すんじゃないぞ…なぜお前みたいなやつがここに来たのかは知らねえが、何か見たいなら優しく扱え、わかったか？わからなくても構わない。何か壊したら買い取ってもらうからな。
actors.mobs.npcs.shopkeeper.talk_prison_princess=今や数少ない生き残りのドワーフ王族の一員がドワーフと人間の混血とは皮肉なものだ。俺はお前たち地上のドワーフの苦難には興味も関心もない。たとえお前にどんな王族の血筋があろうと、ここでは虚しいものだ。ただし…たくさん金を持っているなら別だがな。
actors.mobs.npcs.shopkeeper.talk_prison_friar=はっ、まさかこんな場所で会うとはな。お前の目はどうした？まだあの恐ろしいものが見えるのか？もちろん嘲笑しているわけじゃない、心から同情してるんだ…だが、ここではお前が盲目の学者の天才だからって特別扱いはしないぞ。生き延びるために必要なものをしっかり選べ。
actors.mobs.npcs.shopkeeper.talk_caves=金を使えば、長く生きられる。\n\nおっと、あの巨人の鉄鍛冶を見かけたら、よろしく伝えてくれ。ついでに、あのバカに言っておいてくれ、先週俺から買ったハンマーの金をまだ払ってないってな。
actors.mobs.npcs.shopkeeper.talk_city=俺の商品は君の安全を保証する。\n\n…それと、ここでうろうろするのはやめてくれ。ここのモンスターを遠ざけるのにすごく時間をかけたんだ。君に面倒を引き寄せてほしくないんだ。
actors.mobs.npcs.shopkeeper.talk_halls=おい、そこの君！魔物ハンターには特別割引だ！\n\nああ、それと、下は気をつけろ！下の魔物はただの飾りじゃない。死んだら戻ってきて買い物できなくなるからな！)\n\nあの魔物たちはみんな俺みたいなのかって？へへ、違うさ。俺はただの小物で、大した戦闘力はないし、自由意志も保ってる。下の連中はもっと凶暴で、奴隷状態だ…えーっと…とにかく、下では気をつけろよ。
actors.mobs.npcs.shopkeeper.talk_ascent=そのお守りで何をするつもりか知らねえが、俺は関わりたくない。何か買ったらさっさと立ち去ろう。お互い身を隠すべきだ。
actors.mobs.npcs.shopkeeper.desc=このずんぐりした男は、こんな地下牢より大都市で商売してる方が似合いそうだ。商品の値段を見れば、なぜ彼がここで商売したがるのかわかるというものだ。

actors.mobs.npcs.wandmaker.name=老杖師
actors.mobs.npcs.wandmaker.intro_warrior=おや、こんにちは！この陰鬱な場所で北方の戦士に会えるとは驚きだ！ここまで遠くから来たんだろう。冒険に十分な興味があるなら、ちょっとした仕事を頼みたいんだが。
actors.mobs.npcs.wandmaker.intro_rogue=なんてこった、驚かせないでくれよ！こんな場所で長いことここにいるが、君は初めて会った理性的な盗人だ。つまり地表から来たんだろう！よそ者の俺を助けてくれる気があるなら、手伝ってもらえる仕事があるんだが。
actors.mobs.npcs.wandmaker.intro_mage=おや、こんにちは%s！君が魔法学院でかなりの騒動を起こしたって聞いたよ？まあいい、関係ないさ。俺もああいう古臭い堅物どもは好きじゃない。よかったら、手伝ってほしい仕事があるんだ。
actors.mobs.npcs.wandmaker.intro_huntress=ああ、こんにちはお嬢さん！こんな地下で親しみやすい顔に会えるなんて本当に嬉しいよ、そう思わないか？おや、そういえば、どこかで君を見かけたことがある気がするんだが、思い出せない…ああいいや、気にしないでくれ。冒険に来たなら、ちょっとした仕事を頼めるんだが。
actors.mobs.npcs.wandmaker.intro_duelist=おや、お嬢さんこんにちは！なんと陰鬱な場所だ、なんと素敵な偶然だろう！年寄りの手助けに興味があるなら、ちょっとした仕事を任せたいんだが。
actors.mobs.npcs.wandmaker.intro_cleric=おや、あなた様こんにちは！かくも陰鬱な地であなたにお会いできるとは、何よりの喜びです。お邪魔するつもりはありませんが、ひとつお願いがありまして。
#fix9：文案修正
actors.mobs.npcs.wandmaker.intro_freeman=おや、こんにちは！尊敬すべき紳士、あなたは本当に器が大きそうだ！とにかく…こちらでちょっとしたトラブルに巻き込まれていまして、こんなかわいそうな老人を助けていただけませんか。
actors.mobs.npcs.wandmaker.intro_slimegirl=おや、なんてこった…この恐ろしい場所でモンスターと話すのは初めてだよ。他のモンスターみたいに飛びかかってくるかと思った。とにかく、俺の言葉がわかるなら、ちょっとした手伝いをお願いできるか？こんな場所で他に理性的な人間に出会えるとは思えないしな。
actors.mobs.npcs.wandmaker.intro_ninja=DOMO、忍者＝SAN、フィリス＝DESU。見ての通り、ある厄介なことで悩んでいるんだ。よかったら手伝ってほしい。
actors.mobs.npcs.wandmaker.intro_dm400=なんてこった、まさか…機械の「人間」！実を言うと、魔法を吹き込まれた装置だけがある程度の知性を持てると思っていたんだが…ゴホン、この鉄の紳士よ、俺の言葉がわかるなら、この年寄りの手伝いをしてほしいんだ。
actors.mobs.npcs.wandmaker.intro_princess=おや、こんにちは！まさかこんな場所でお会いできるとは。あなた方のご厚意のおかげで、ドワーフから多くの新しい魔法を学びました…本題ですが、ちょっとした厄介事に直面していまして、どうかお力をお貸しください。
actors.mobs.npcs.wandmaker.intro_friar=おや、君か、かつて誌面を飾ったあの錬金術の天才か。あれほど輝いていたのに、今ではまるで恐ろしい心霊術師に心をかき乱されたかのような有様だな…すまない、言い過ぎた。今はどうか慈悲の心を持って、ちょっとした用事を手伝ってほしい…わかってるだろう、我々は同類だ。君を騙したりはしないさ。
actors.mobs.npcs.wandmaker.intro_1=\n\n私はここで杖を作るための希少な素材を探しているんだが、道に迷ってしまった上に、魔法のシールドも徐々に弱まっている。すぐにでもここを離れなければならないが、手ぶらで帰りたくないんだ。
actors.mobs.npcs.wandmaker.intro_dust=探しているのは_一握りの尸塵_だ。これは通常こんな場所で見つかる、呪われた特別な骨灰だ。近くのどこか壁で仕切られた部屋にあるはずだ。きっと君なら尸塵をいくらか見つけられるはずだ。ただし気をつけろ、尸塵にかけられた呪いはかなり強力だ。_できるだけ早く持ち帰ってくれ_、私が浄化してやろう。
actors.mobs.npcs.wandmaker.intro_ember=探しているのは、新生の火焔元素から得られる_元素の余燼_だ。元素生物は通常、制御不能になった召喚儀式に現れる。つまり、召喚するには蝋燭と儀式場を見つければいい。そんな場所はきっと見つかるはずだ。それと、戦う時は_奴と近接格闘_したくはないだろう。_凍結効果のあるアイテム_がいくつか必要になるかもしれない。新生の火焔元素は強力で狂暴だが、寒さには弱い。
actors.mobs.npcs.wandmaker.intro_berry=この監獄の元獄長が_腐蝕苺_を一本育てていたんだ。その種が一粒欲しい。今ではこの植物は制御不能に育っているかもしれない。だから種を手に入れるのは容易じゃない。苺のある庭園はこの近くのはずだ。無傷で戻りたいなら、_触手から遠く離れる_ことだ。火をつけて腐蝕苺を焼き払うのは有効に聞こえるが、やめておけ。焼けば種も燃えてしまう。
actors.mobs.npcs.wandmaker.intro_2=\n\nもし持ってきてくれたなら、私が丹精込めて作った杖の一本をお礼に差し出そう！二本持ってきたから、好きな方を選べ。
actors.mobs.npcs.wandmaker.reminder_dust=尸塵はどうだ%s？_障害物_を探してみろ。
actors.mobs.npcs.wandmaker.reminder_ember=余燼はどうだ%s？_四本の蝋燭_と_儀式場_を見つける必要がある。
actors.mobs.npcs.wandmaker.reminder_berry=腐蝕苺の種はどうだ%s？_植物で満ちた部屋_の中にあるはずだ。
actors.mobs.npcs.wandmaker.def_verb=回避
actors.mobs.npcs.wandmaker.desc=この神経質そうな老紳士は、どこか困った表情をしている。彼の周囲には魔法のバリアが張り巡らされている。


###mobs
actors.mobs.acidic.name=酸液巨蠍
actors.mobs.acidic.desc=この巨大な節足系魔物は近接戦を避け、遠くから致死性の鋸歯棘を放つのを得意とする。この個体の体からは腐食性の泥が滴り落ちている。

actors.mobs.albino.name=白化鼠
actors.mobs.albino.desc=純白の毛皮と鋸歯状の歯を持つ、珍しい齧歯類の小獣。
actors.mobs.albino.discover_hint=いずれかの監獄エリアで偶然この敵を発見できる。

actors.mobs.armoredstatue.name=装甲石像
actors.mobs.armoredstatue.desc=地下牢にまた一体、静かに佇む石像かと思いきや、赤く光る眼がそれを裏切っていた。\n\n石像は精良な装甲を身にまとい、かなり堅牢そうだ。手強そうだ。
actors.mobs.armoredstatue.desc_arm_wep=像自体は石製だが、装備している_%1$s_と_%2$s_は本物のようだ。

actors.mobs.bandit.name=狂乱強盗
actors.mobs.bandit.desc=盗賊の中でも精鋭。より高価な紫の長衣を身にまとっているのが特徴だ。盗みの腕前は一流だが、それでも同業者と同じく理性を失う運命からは逃れられない。\n\n狂乱強盗は財布を盗むだけでなく、一時的な盲目・衰弱・毒までも与えてくる！ただし他の盗賊より余計な戦利品を持っている可能性も高い。

actors.mobs.bat.name=吸血蝙蝠
actors.mobs.bat.desc=この敏捷でしなやかな洞窟天井の生物は、見た目よりずっと恐ろしい。攻撃が成功するたびに生命を回復し、自分よりはるかに大きな敵をも打ち負かす。

actors.mobs.bee.name=金色蜜蜂
actors.mobs.bee.desc_honey=金色蜜蜂は体は小さいが、全力で巣を守る。この蜜蜂は君に手懐けられていて、付いて来る気があるようだ。
actors.mobs.bee.desc=金色蜜蜂は体は小さいが、全力で巣を守る。この蜜蜂は非常に攻撃的だ。距離を保ったほうがいい。
actors.mobs.bee.discover_hint=何らかの道具を通じてこのユニットを発見できる。

actors.mobs.brute.name=豺狼暴徒
actors.mobs.brute.enraged=激昂
actors.mobs.brute.def_verb=格闘
actors.mobs.brute.desc=暴徒は最も体格が大きく、力が強く、生命力が高い豺狼人種だ。致命的な傷を受けると狂戦士化し、一時的に防御力と極めて高い攻撃力を得る。
actors.mobs.brute$bruterage.name=豺狼狂乱
actors.mobs.brute$bruterage.desc=この豺狼暴徒はもはや死の淵にあるが、道連れにしようとしている！\n\n時間の経過と外部からのダメージで防御値は減少する。防御が破れた時が暴徒の命尽きる時だ。ただしこの間、暴徒は甚大なダメージを与える。\n\n残り防御値：%d

actors.mobs.causticslime.name=腐蝕スライム
actors.mobs.causticslime.desc=このスライムは下層から染み出す暗黒エネルギーに完全に浸食されてしまったようだ。本来の緑色の光沢を失い、腐食性の泥を絶えず滴らせている。
actors.mobs.causticslime.discover_hint=いずれかの監獄エリアで偶然この敵を発見できる。

actors.mobs.crab.name=下水道蟹
actors.mobs.crab.desc=これらの巨大な蟹は下水道の食物連鎖の頂点に君臨する。動作は非常に素早く、厚い甲羅は重い打撃にも耐える。

actors.mobs.crystalguardian.name=水晶守護者
actors.mobs.crystalguardian.def_verb=防御
actors.mobs.crystalguardian.desc=この巨大な水晶守護者は、目に明るい光が宿っていなければ、彫刻とほとんど見分けがつかない。硬化水晶でできた体は動きづらいが、非常に堅固だ。水晶の洞窟で彼らを眠らせておくのが一番だ。\n\n水晶守護者は体が大きいため、狭い場所では移動速度が非常に遅くなる。また非常に頑丈で、完全に殺すことはできない。倒された後も一時的に機能を失うだけで、やがて復活する。
actors.mobs.crystalguardian.discover_hint=いずれかの任務でこの敵を発見できる。

actors.mobs.crystalmimic.name=水晶宝箱怪
actors.mobs.crystalmimic.ate=水晶宝箱怪があなたの%sを食べた！
actors.mobs.crystalmimic.escaped=水晶宝箱怪が逃げた！
actors.mobs.crystalmimic.desc=宝箱怪は自由に姿を変える魔法生物だ。地下牢ではほとんどの場合、宝箱の姿で現れる。警戒心の薄い冒険者を引き寄せやすいからだ。\n\n水晶宝箱怪は同種よりも狡猾で、アイテムを盗んでは戦いを避けようとする。見つかると素早く逃走し、その攻撃で敵を移動させることもできる。

actors.mobs.crystalspire.name=水晶尖塔
actors.mobs.crystalspire.warning=打ち付ける水晶から振動が伝わってくる。このまま叩き続ければ、ろくなことにならない…。
actors.mobs.crystalspire.alert=水晶の振動がますます激しくなり、轟音が坑道全体に響き渡る！
actors.mobs.crystalspire.desc=この巨大な尖塔は無比の堅さを誇る水晶でできており、坑道内の奇妙な水晶生物すべての根源かもしれない。通常の武器では傷をつけられないので、ツルハシで破壊する必要がある。\n\n_解体を始めるなら、激戦に備えよ。_これほど巨大な水晶を解体するにはかなりの時間がかかり、妨害されずに済むとは限らない。尖塔自体にも防御機構があるかもしれない。_尖塔の攻撃を利用して、その牙に対抗できるかもしれない。_
actors.mobs.crystalspire.discover_hint=いずれかの任務でこの敵を発見できる。

actors.mobs.crystalwisp.name=水晶ウィスプ
actors.mobs.crystalwisp.beam_kill=あなたは光線で死んだ…
actors.mobs.crystalwisp.desc=怒りに満ちた小さな硬化水晶のかけらが空中に浮かび、明るい光を放っている。それほど強くはないが、隙あれば光線を放って攻撃してくる。\n\nこのウィスプは非常に小さいため、水晶の尖った先端を軽々と飛び越えられるが、放つ光線はそうはいかない。
actors.mobs.crystalwisp.discover_hint=いずれかの任務でこの敵を発見できる。

actors.mobs.demonspawner.name=魔物血巣
actors.mobs.demonspawner.on_death=この場所の魔物エネルギーは血巣の破壊とともに弱まったようだ。
actors.mobs.demonspawner.desc=この脈動する肉塊は、このエリアで無惨に死んだドワーフの残骸を糧に、絶えず魔物の亀裂者を生み出している。魔物たちは敵を倒すためには手段を選ばないようだ。\n\n魔物血巣は非常に恐ろしい見た目だが、それ自体に移動能力や直接的な防御手段はない。ただしその巨体は素早く破壊することを難しくし、脅威を感じると亀裂者の生成を加速する。\n\n_魔物血巣は何らかの魔物エネルギーの源と繋がっているようだ。血巣を破壊すれば、その源を弱体化できるかもしれない。_

actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=あなたは電撃で死んだ…
actors.mobs.dm100.desc=DM-100はドワーフの「防衛機械」の初期機種で、下層坑道のドワーフ鉱夫を保護するために設計された。しかし電撃の威力が不足していたため、後に上層の人間の都市に送られた。元々の典獄長はDM-100は残酷すぎると考えていたが、長年の放置を経て、最終的には監獄で使用されることとなった。しかし時が経つにつれ囚人はますます制御困難になり、DM-100は監獄の必需品となった。

actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=DM-200が有毒廃ガスを噴射した！
actors.mobs.dm200.desc=DM-200はドワーフが開発した第二世代の「防衛機械」で、当初は坑道のドワーフ鉱夫と下部都市を守るために使われていた。初代に比べてかなり頑丈で重厚になり、強力な油圧ハンマーでの攻撃に改良された。\n\n肥大化した体格が彼らの大きな欠点だ。狭い扉や通路には入れない。この機動性の欠如を補うため、ドワーフは別の機能を設計した。DM-200は遠くの、あるいは届かない位置の敵に有毒廃ガスを噴射できるのだ。

actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=DM-201が酸腐性榴弾を投げた！
actors.mobs.dm201.desc=ドワーフはかつてDM-200の機動性の欠点を補う実験を行い、これに基づいて完全に固定されたDMシリーズの機械を設計製造した。DM-201はDM-200の改造型で、見張り台として完全に移動能力を持たない。その代わりにDM-201の堅牢性と攻撃力は大幅に向上した。\n\nDM-201には廃ガス排出用のエンジンがないため、ドワーフは彼らに酸腐性ガス榴弾を装備させた！ただしDM-201は榴弾の使用には慎重で、遠方からの攻撃を受けた時にのみ敵に榴弾を投擲する。

actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=排・出・機・能・停・止！
actors.mobs.dm300.shield=DM-300が地表導線から電力を吸収し、防御シールドを生成！
actors.mobs.dm300.charging=攻・撃・不・可！ エ ネ ル ギ ー 補 給 中
actors.mobs.dm300.charging_hint=DM-300はエネルギータワーの給電中はダメージを受けない！
actors.mobs.dm300.supercharged=全・破・壊！全 破 壊！全 破 壊！
actors.mobs.dm300.charge_lost=エ ネ ル ギ ー 喪 失！ 自 立 電 源 モ ー ド に 移 行
actors.mobs.dm300.pylons_destroyed=警 告！ 電 源 異 常 を 検 出
actors.mobs.dm300.rankings_desc=DM-300に押し潰されて死亡
actors.mobs.dm300.def_verb=防御
actors.mobs.dm300.defeated=致・命・的・損・傷！ シ ャ ッ ト ダ ウ ン
actors.mobs.dm300.desc=DM-300はドワーフ史上最も強力な「防衛機械」だ。これほど強力な機械は量産が困難なため、ドワーフたちは地下都市の入り口を守るため、数台しか製造しなかった。\n\n強力な毒廃ガスを噴射する通気口と、攻撃と岩石破壊に使える高効率ドリルを備えている。DM-300はさらに電力網に接続することで、さらなる強化が可能だ。
actors.mobs.dm300.desc_supercharged=DM-300は電力充満、全力稼働中。この状態のDM-300はあらゆるダメージを無効化し、移動速度が2倍になる！さらにドリルの出力は_壁を掘り抜く_に十分だが、壁を掘る時の移動速度はかなり遅くなる。\n\n過負荷状態のDM-300を直接攻撃するのは無意味だが、_この近くには必ずエネルギーを供給する装置があるはずだ_。破壊すれば、奴を弱体化させられるかもしれない。

actors.mobs.dwarfking.name=ドワーフ国王
actors.mobs.dwarfking.notice=よくも王家の重地に踏み入ったな！無知とは恐れを知らぬものだ！
actors.mobs.dwarfking.notice1=愚かな旧王がお前のような残党を残していたとはな！よかろう、旧王がどのように屈服したかを思い知らせてやろう！
actors.mobs.dwarfking.lifelink_1=我が身を捧げよ、下僕たちよ！
actors.mobs.dwarfking.lifelink_2=我が大業のため、栄光ある犠牲となれ！
actors.mobs.dwarfking.teleport_1=奴らめ、この者を捕らえよ！
actors.mobs.dwarfking.teleport_2=奴らめ、この者を引き止めよ！
actors.mobs.dwarfking.wave_1=もうよい！朕の復活のために戦え、奴隷ども！
actors.mobs.dwarfking.wave_2=続け！朕の天下のために戦え！
actors.mobs.dwarfking.wave_3=役立たずめ！朕が命じる、速やかにこの者を始末せよ！
actors.mobs.dwarfking.enraged=逃げられると思うなよ、%s。朕 自 ら 相手をしてやろう！
actors.mobs.dwarfking.losing=ならぬ…なぜこのようなことに…お前は朕の王国の下に何が眠っているか知らぬのだ…
actors.mobs.dwarfking.defeated=お前は…全てを滅ぼすのだ…
actors.mobs.dwarfking.rankings_desc=ドワーフ国王の御前に屈した
actors.mobs.dwarfking.desc=遠い昔、ドワーフ議会で最も強力な魔導師の一人が、生死を超越する秘術を悟った。すぐに彼はその強大な力を借りて、王宮と議会全体を掌握・腐敗させ、魔力を王国のすべてのドワーフにまで伸ばした。今や彼はドワーフ国王となり、膨大な数の死霊軍団を統べている。\n\nドワーフ国王は非常に攻撃的な強敵であり、手下の死霊軍団を利用して侵入者を圧倒しようとする。
actors.mobs.dwarfking$dkghoul.rankings_desc=ドワーフ国王の御前に屈した
actors.mobs.dwarfking$dkmonk.rankings_desc=ドワーフ国王の御前に屈した
actors.mobs.dwarfking$dkwarlock.rankings_desc=ドワーフ国王の御前に屈した
actors.mobs.dwarfking$dkgolem.rankings_desc=ドワーフ国王の御前に屈した

actors.mobs.ebonymimic.name=黒檀宝箱怪
actors.mobs.ebonymimic.reveal=そこに宝箱怪がいる！
actors.mobs.ebonymimic.hidden_name=怪しい影
actors.mobs.ebonymimic.hidden_desc=そこに何かがあるようだが、ほとんど完全に透明だ。
actors.mobs.ebonymimic.desc=宝箱怪は自由に姿を変える魔法生物だ。地下牢ではほとんどの場合、宝箱の姿で現れる。警戒心の薄い冒険者を引き寄せるのにうってつけだからだ。\n\n黒檀宝箱怪はその隠蔽能力により、ほとんど姿を消す。冒険者が触れそうな物の上に擬態し、不意を突く。同時に体内には専用の戦利品を含んでいる。擬態を見破られれば、攻防能力は通常の宝箱怪と変わらない。しかし油断すれば、その不意討ちは致命傷になり得る。
actors.mobs.ebonymimic.discover_hint=何らかの装飾品を通じてこの敵を発見できる。

actors.mobs.elemental$fireelemental.name=火焔元素
actors.mobs.elemental$fireelemental.desc=元素は狂暴な生物の一種で、通常は制御不能な強力な魔法儀式から生まれる。元素生物の知能は極めて低く、特定の魔法と密接に関連している。\n\n火焔元素は火焔の力を借りて攻撃する一般的な元素生物だ。近接攻撃は目標を燃やし、時には遠くの目標に火焔の矢を放つ。
actors.mobs.elemental$newbornfireelemental.name=新生火焔元素
actors.mobs.elemental$newbornfireelemental.charging=新生元素がエネルギーを充填している！
actors.mobs.elemental$newbornfireelemental.desc=元素は狂暴な生物の一種で、通常は制御不能な強力な魔法儀式から生まれる。元素生物の知能は極めて低く、特定の魔法と密接に関連している。\n\nこの火焔元素は召喚されたばかりだが、同じく危険だ。
actors.mobs.elemental$newbornfireelemental.desc_boss=その本質は狂暴な召喚物であるため、この元素の火攻めは1ターンのチャージを経て、不正確な火炎の波を放つだけだ。
actors.mobs.elemental$newbornfireelemental.desc_ally=この元素は晶柱から召喚されたため、火焔の制御に優れている。遠距離攻撃はできないが、近接攻撃で敵を燃やせる。
actors.mobs.elemental$newbornfireelemental.discover_hint=いずれかの任務でこの敵を発見できる。
actors.mobs.elemental$frostelemental.name=氷霜元素
actors.mobs.elemental$frostelemental.desc=元素は狂暴な生物の一種で、通常は制御不能な強力な魔法儀式から生まれる。元素生物の知能は極めて低く、特定の魔法と密接に関連している。\n\n氷霜元素は氷霜の力を借りて敵を弱体化させる一般的な元素生物だ。近接攻撃と、あまり使われない遠隔攻撃はどちらも敵を凍結状態にする。その氷霜の力は水上の敵に対してより効果的だ。
actors.mobs.elemental$shockelemental.name=電光元素
actors.mobs.elemental$shockelemental.desc=元素は狂暴な生物の一種で、通常は制御不能な強力な魔法儀式から生まれる。元素生物の知能は極めて低く、特定の魔法と密接に関連している。\n\n電光元素は電撃と閃光で敵を撹乱する、比較的珍しい元素生物だ。近接戦では周囲の敵に電弧を放ち、水上の主目標には追加ダメージを与える。また遠くの敵に照準を合わせて盲目効果のある強烈な閃光を放つこともある。
actors.mobs.elemental$chaoselemental.name=混沌元素
actors.mobs.elemental$chaoselemental.desc=元素は狂暴な生物の一種で、通常は制御不能な強力な魔法儀式から生まれる。元素生物の知能は極めて低く、特定の魔法と密接に関連している。\n\n混沌元素は極めて希少な元素生物だ。特定の魔法に限定されず、攻撃を通じて敵に変幻自在の野性魔法を浴びせる。

actors.mobs.eye.name=邪眼
actors.mobs.eye.deathgaze_kill=あなたは死の凝視で死んだ…
actors.mobs.eye.desc=邪眼は魔物エネルギーに満ちた浮遊球体の生物だ。近接戦闘能力を持つが、真の殺し技はその魔法に秘められている。\n\n邪眼は短いチャージの後、_死の凝視_という壊滅的なエネルギー光線を放つ。その時、邪眼が見つめるすべてのものは甚大なダメージを受け、賢明な冒険者はその刃先を避けるものだ。

actors.mobs.fetidrat.name=腐臭鼠
actors.mobs.fetidrat.desc=この鼠は様子がおかしい。脂ぎった黒い毛と腐爛した皮膚は、今まで見てきた健康な鼠とはまったく違う。薄緑色の眼がさらに威圧感を増している。\n\nこの鼠の周囲には恐ろしい悪臭が漂い、近づくといっそう強烈になる。\n\n黒い泥が口から流れ出ている。泥は煉瓦を腐食させるが、水に当たると溶けるようだ。
actors.mobs.fetidrat.discover_hint=いずれかの任務でこの敵を発見できる。

actors.mobs.fungalcore.name=真菌核
actors.mobs.fungalcore.desc=この途方もなく巨大な菌類こそ、洞窟内の異常な真菌活性の源であろう。

actors.mobs.fungalsentry.name=真菌歩哨
actors.mobs.fungalsentry.desc=ここにそびえ立つ背の高い菌類は、洞窟全体のより大きな菌糸ネットワークの防御節点だ。\n\n移動はできないが、視界に入るあらゆる物体に正確に毒液を噴射する。毒液の勢いは弱いが、_毒量は素早く蓄積される_。殺すことはできるが、遠くに避難するのが最善だ。

actors.mobs.fungalspinner.name=菌生蜘蛛
actors.mobs.fungalspinner.desc=この坑道蜘蛛は寄生真菌に操られているようだ。真菌は宿主の能力を変え、本来の蜘蛛の巣と猛毒を真菌の成長に置き換えた。\n\n菌生蜘蛛は蜘蛛の巣ではなく胞子を吐く。胞子は真菌を拡散させるだけでなく、あなたをその場に絡め取ることもある。この蜘蛛は毒を持たないが、近くに菌類がある時は高いダメージ耐性を得る。

actors.mobs.ghoul.name=ドワーフ屍群
actors.mobs.ghoul.desc=ドワーフ社会の崩壊と新王の専横により、軽んじられた者や新王に反抗したドワーフは悲惨な末路を辿った。新王の暗黒魔法の掌握が熟練するにつれ、これらのドワーフもその意思に屈し、大軍の中の一枚の駒と成り果てた。\n\n屍鬼単体の戦闘力は高くないが、常に群れをなして徘徊し、数が増えるほど手強くなる。_周囲に同類がいる限り、倒された屍鬼も数ターン後に再び起き上がる_。

actors.mobs.gnoll.name=豺狼巡察
actors.mobs.gnoll.desc=豺狼人はハイエナに似た人型生物だ。下水道や監獄を徘徊し、時折地表への侵攻を試みる。豺狼巡察は種族内で最も一般的な構成員で、暴徒ほどの強さもなく、魔術師ほどの賢さもない。

actors.mobs.gnollexile.name=豺狼流謫者
actors.mobs.gnollexile.desc=この灰色の豺狼人は肩に目立つ烙印を押されており、追放された証とされている。豺狼人は通常、掟を無視したり法律に反したりすることで社会から追放される。強さと賢さが流謫者の生存の鍵であり、この個体は持っている長槍を巧みに扱うようだ。
actors.mobs.gnollexile.desc_passive=_豺狼流謫者は現在攻撃意図はない。_ここの他の豺狼人のように好戦的ではなさそうで、あなたと戦うのは得策ではないと考えているのかもしれない。見逃すこともできるが、彼が持っている包みには役立つ品物が詰まっているかもしれない。
actors.mobs.gnollexile.desc_aggro=_豺狼流謫者が虎視眈々と周囲を見回している。_どうやら決心して攻撃に出ることにしたようだ。あの長槍に気をつけろ！
actors.mobs.gnollexile.seen_passive=槍を持った豺狼人が警戒してあなたを見ているが、攻撃意図はない。
actors.mobs.gnollexile.seen_aggro=槍を持った豺狼人が攻撃の構えを見せている。

actors.mobs.gnollgeomancer.name=豺狼地卜師
actors.mobs.gnollgeomancer.warning=地卜師が目覚めようとしている。準備が万全であることを確認してから進め！
actors.mobs.gnollgeomancer.alert=地卜師が目覚めた！坑道全体の構造が、その狂気の叫びと共に変化したようだ！
actors.mobs.gnollgeomancer.rock_kill=あなたは飛来した岩塊で死んだ…
actors.mobs.gnollgeomancer.rockfall_kill=あなたは落石で死んだ…
actors.mobs.gnollgeomancer.desc=この体格の良い老豺狼人は、この地の豺狼人の長であり、土霊魔法の根源でもある。豺狼工兵とは異なり、地卜師は土霊魔法に精通しているため、飛来する岩石や落石では傷つかない。ただし、近接した敵を直接攻撃する手段はおそらくない。
actors.mobs.gnollgeomancer.desc_armor=地卜師の周囲には岩石の防御シールドが巡らされている。_ツルハシで近接攻撃し、岩のシールドを破壊しなければ、地卜師本体にダメージを与えられない。_
actors.mobs.gnollgeomancer.desc_armor_sapper=_傍らの豺狼工兵が地卜師の岩のシールドを強化できる装置を保持している。現在地卜師はあらゆるダメージを無効化している！_
actors.mobs.gnollgeomancer.desc_sleeping=この体格の良い豺狼人は周囲を岩石で包み、まるで彫像のようだ。しかしよく見ると、この岩石は老豺狼人の呼吸に合わせて流動するシールドであることがわかる。この防御によりいかなるダメージも受けないため、乱石の中で悠然と休息している。\n\n手にしたツルハシなら彼の岩石シールドを打ち砕けるだろう。ただし_この戦いは十分な準備をして臨め_。地卜師はこの地の豺狼人の長であり、土霊魔法の根源でもある。_彼に挑む前に、周囲に散らばる他の豺狼人を先に倒すのがよい。_
actors.mobs.gnollgeomancer.discover_hint=いずれかの任務でこの敵を発見できる。

actors.mobs.gnollguard.name=豺狼守衛
actors.mobs.gnollguard.def_verb=防御
actors.mobs.gnollguard.spear_warn=豺狼人が槍先で残忍な一撃を放った！
actors.mobs.gnollguard.desc=この背が高く頑健な豺狼人は長槍と盾を操るが、兜は被っていない。これらの守衛は暴徒への昇格を目指して訓練しており、坑道を野獣から守るためにここで勤務している。\n\n豺狼守衛は屈強で片手で長槍を振り回せるが、その腕前はあまり良くない。_かなり広い空間が必要で、ようやく長距離攻撃が可能になる。_肉迫されると長槍は振りづらくなり、威力は大幅に減退する。
actors.mobs.gnollguard.desc_armor=_傍らの豺狼工兵がこの守衛に大地の鎧を付与できる装置を保持しており、被ダメージを大幅に軽減している。_
actors.mobs.gnollguard.discover_hint=いずれかの任務でこの敵を発見できる。

actors.mobs.gnollsapper.name=豺狼工兵
actors.mobs.gnollsapper.desc=この豺狼人は小柄で虚弱だが賢い。薄い色の毛を持ち、様々な小道具の詰まった鞄を携えている。彼らはここで暗金鉱の探査と採掘を補助しており、豺狼守衛が護衛として付いている。近接戦闘も可能だが、攻撃力は豺狼巡察にも劣る。\n\n直接の格闘より、豺狼工兵は携帯する各種装置で周囲の岩石を操って攻撃するのを好む。彼らは土霊魔法を習得しておらず、道具で岩石を投げているに過ぎない。_彼らの攻撃を利用して彼らや他の守衛に反撃する方法はたくさんあるはずだ。_
actors.mobs.gnollsapper.discover_hint=いずれかの任務でこの敵を発見できる。

actors.mobs.gnolltrickster.name=豺狼謀術師
actors.mobs.gnolltrickster.desc=豺狼人の基準で見ても、この生き物は非常に異質だ。腰をかがめて怪しげに歩き回り、大きく口を開けて邪悪な笑みを浮かべ、肩に掛けた鞄は鈴なりに膨らんでいる。その瞳孔には恐怖と興奮が入り混じっている。\n\n彼の鞄には粗末に作られた大量の飛び道具が詰まっており、様々な有害物質が塗布されているようだ。
actors.mobs.gnolltrickster.discover_hint=いずれかの任務でこの敵を発見できる。

actors.mobs.goldenmimic.name=黄金宝箱怪
actors.mobs.goldenmimic.desc=黄金の宝箱怪は、自由に姿を変える魔法生物です。ダンジョンではほとんどの場合宝箱の姿で現れ、油断した冒険者を引き寄せます。\n\n黄金の宝箱怪は、一流の冒険者を誘引しようとする強力な宝箱怪です。より豊かな財宝を持ちますが、普通の宝箱怪よりも強力です。

actors.mobs.golem.name=ゴーレム
actors.mobs.golem.def_verb=ガード
actors.mobs.golem.desc=ゴーレムはドワーフが機械装置の長年の欠点を補うために、魔法の新たな応用を試みた産物です。DM-300ほど巨大ではありませんが、侮れない破壊力を持っています。\n\nゴーレムは体が大きすぎて通路を通れませんが、ドワーフは魔法を付与してこれを補っています——ゴーレムは部屋間をテレポートし、遠くの届かない敵を引き寄せることができます。

actors.mobs.goo.name=グー
actors.mobs.goo.notice=グ？ググッ！
actors.mobs.goo.defeated=グ..グ..
actors.mobs.goo.!!!=!!!
actors.mobs.goo.pumpup=グーが激しく脈動している！
actors.mobs.goo.enraged=激怒
actors.mobs.goo.gluuurp=グゥゥゥゥッ！
actors.mobs.goo.rankings_desc=グーに消化された
actors.mobs.goo.desc=私たちはグーについてほとんど知らない。それはおそらく生物ですらなく、下水道の表面に集まった邪悪な物質が基本的な知能を得て実体化したものだ。いずれにせよ、暗黒魔法がこの生物を生み出したことは明らかだ。\n\nそのゼリー状の性質により多くの暗黒エネルギーを吸収しており、近づくだけで寒気を感じる。もしグーがこのエネルギーを使って攻撃してきたら、長くは持たないだろう。

actors.mobs.greatcrab.name=巨大ガニ
actors.mobs.greatcrab.noticed=巨大ガニが巨大なハサミで攻撃をガードした。
actors.mobs.greatcrab.def_verb=ガード
actors.mobs.greatcrab.desc=この蟹は下水道のゴミの中で最も強大な存在と言える。青い甲羅には傷やフジツボがびっしりと付いており、長い年月を物語っている。動きは遅く、巨大なハサミのせいでバランスを保つのも難しい。\n\nこの蟹は片方のハサミしか残っていないが、その大きさが十分にそれを補っている。危険を察知するとハサミを前に掲げ、堅牢な甲羅で防御する。ただし、気づかれない攻撃や複数の敵からの同時攻撃は防げない。
actors.mobs.greatcrab.discover_hint=この敵は特定のクエストで出現します。

actors.mobs.guard.name=監獄守衛
actors.mobs.guard.scorpion=こっちに来い！
actors.mobs.guard.def_verb=ガード
actors.mobs.guard.desc=これらの守衛はかつて監獄の管理者だったが、今では囚人たちと何ら変わらない。彼らのよろめく歩き方はまるで屍のようで、この区域に属さない生物——例えば君を——無造作に探し回っている。\n\n腰には鉄鎖を巻いており、それを使って敵を引き寄せるかもしれない。

actors.mobs.hermitcrab.name=ヤドカニ
actors.mobs.hermitcrab.def_verb=ガード
actors.mobs.hermitcrab.desc=何らかの理由で、この下水道の蟹は頭に壊れたバケツをかぶることに決めた！余分な重量のせいで移動速度は標準並みに落ちたが、防御力は向上した。バケツの中で何かがぶつかる音が聞こえる…

actors.mobs.mimic.name=宝箱怪
actors.mobs.mimic.reveal=宝箱怪だ！
actors.mobs.mimic.hidden_hint=この宝箱はどこかおかしい…直接開けるのは得策ではなさそうだ。
actors.mobs.mimic.desc=宝箱怪は自由に姿を変える生物です。ダンジョンではほとんどの場合宝箱の姿で現れ、油断した冒険者を引き寄せます。\n\n宝箱怪は高い攻撃力を持ちますが、通常の宝箱よりも多くの財宝を持っていることも多いです。
actors.mobs.mimic.discover_hint=この敵はあらゆるダンジョン区域に出現します。

actors.mobs.necromancer.name=ネクロマンサー
actors.mobs.necromancer.desc=これらの暗黒魔法の学徒たちは監獄に大量に流れ込んでいる。ここが死霊術を磨くのに最適な場所だからだ。\n\nネクロマンサーはスケルトンを召喚し強化して戦う。ネクロマンサーが倒されると、召喚されたスケルトンも消滅する。
actors.mobs.necromancer$necroskeleton.name=ネクロマンサーのスケルトン
actors.mobs.necromancer$necroskeleton.desc=このスケルトンはネクロマンサーに召喚されたものだ。能力と性質は普通のスケルトンと同じだが、召喚者が倒されると共に消滅する。

actors.mobs.mob.died=遠くで何かが死んだ音がかすかに聞こえた。
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=%sに倒れた
actors.mobs.mob.discover_hint=この敵は特定のダンジョン区域に出現します。

actors.mobs.monk.name=ドワーフ武僧
actors.mobs.monk.def_verb=ガード
actors.mobs.monk.parried=パリイ
actors.mobs.monk.desc=これらの僧侶はすべて狂信的な信徒であり、全力を尽くして異種族から王の安全を守っている。狂信的な信仰により、彼らは自らの意志を王に委ね、思考を失った抜け殻が街を彷徨っている。\n\nドワーフ武僧は鎧も武器も身に着けず、素手の格闘術のみで敵に立ち向かう。集中状態の武僧は必ず次の物理攻撃をパリイする。移動中はより早く集中できるが、戦闘中は比較的遅い。
actors.mobs.monk$focus.name=集中
actors.mobs.monk$focus.desc=この武僧は標的の一挙一動に完全に集中しており、次の動作を予測できているようだ。\n\n集中状態のキャラクターは必ず次の物理攻撃をパリイする。パリイすると武僧の集中は消費され、次の攻撃をパリイするには再び集中する必要がある。武僧は移動中により早く集中できる。

actors.mobs.phantompiranha.name=幻影ピラニア
actors.mobs.phantompiranha.teleport_away=幻影ピラニアがテレポートした…
actors.mobs.phantompiranha.desc=幻影ピラニアは巨大ピラニアの珍しい変種で、不気味な半透明の体と魔法能力を持つ。攻撃を受けるとテレポートでき、この能力により攻守ともに自在だ！\n\n倒すのは難しいが、魔力を持つその肉は珍重されている。

actors.mobs.piranha.name=巨大ピラニア
actors.mobs.piranha.desc=これらの肉食魚は水没した保管庫を守るために特別に飼育されている。その噛みつきは致命的であり、正面からの対決は避けるべきだ。
actors.mobs.piranha.discover_hint=この敵はあらゆるダンジョン区域に出現します。

actors.mobs.pylon.name=エネルギータワー
actors.mobs.pylon.desc_inactive=これは区域内の機械に電力を分配するためのエネルギータワーだ。\n\nこのエネルギータワーは起動しておらず、現在はダメージを受け付けない。
actors.mobs.pylon.desc_active=これは区域内の機械に電力を分配するためのエネルギータワーだ。現在エネルギーが高まっており、DM-300の過負荷状態を支えているに違いない！\n\nこの時のエネルギータワーは破壊可能だが、時計回りに周囲に電撃を放つ。厚い金属構造により素早く破壊することは難しい。

actors.mobs.rat.name=啮歯ラット
actors.mobs.rat.desc=啮歯ラットは攻撃的だが、下水道の住人の中では弱者だ。噛みつきは煩わしいが、数が膨大でなければ生命の危険はない。

actors.mobs.ripperdemon.name=デーモンリッパー
actors.mobs.ripperdemon.leap=デーモンリッパーが飛びかかろうとしている！
actors.mobs.ripperdemon.desc=この恐ろしい生物は、悪魔がここに残された多数のドワーフの死体から作り出したものだ。デーモンリッパーは痩せ細ったドワーフ屍鬼に似た外見で、体は欠損しているが骨の爪は異常に鋭い。\n\nデーモンリッパーは打たれ強いとは言えないが、それでも素早く致命的だ。遠くから飛びかかり、骨の爪で標的に出血の傷を刻む。

actors.mobs.rotheart.name=腐花の核
actors.mobs.rotheart.desc=腐花の果実は他とは異なる。通常の果実は腐敗して養分となるが、腐花の果実は成長し、硬化し、種子を包み込む。果実は内部の器官を保護する。この巨大な球体は成熟した腐花植物の核と見なされる。
actors.mobs.rotheart.discover_hint=この敵は特定のクエストで出現します。

actors.mobs.rotlasher.name=腐花の触手
actors.mobs.rotlasher.desc=腐花触手は成熟した腐花の根系の一部であり、主要な自己防衛手段である。触手は視力を持たず、土に固定されて移動できない。しかし周囲に脅威が現れると、まず標的を感知するのに少し時間をかけ、その後猛攻を仕掛ける。近くに敵がいないときは静止し、周囲の植生に溶け込もうとする。
actors.mobs.rotlasher.discover_hint=この敵は特定のクエストで出現します。

actors.mobs.scorpio.name=巨大蝎
actors.mobs.scorpio.desc=この巨大な節足悪魔生物は接近戦を選ばず、遠距離から致命的な鋸歯状の棘針を発射するのが得意だ。

actors.mobs.senior.name=武僧大師
actors.mobs.senior.desc=これらの僧侶はすべて狂信的な信徒であり、全力を尽くして異種族から王の安全を守っている。狂信的な信仰により、彼らは自らの意志を王に委ね、思考を失った抜け殻が街を彷徨っている。\n\nこの武僧は高度な格闘技を習得しており、通常の武僧よりも移動中に早く集中できる。集中状態の武僧は必ず次の物理攻撃をパリイする。武僧は移動中により早く集中できるが、戦闘中は比較的遅い。

actors.mobs.shaman.name=ハイエナシャーマン
actors.mobs.shaman.bolt_kill=魔力弾で死んだ…
actors.mobs.shaman.desc=ハイエナシャーマンはほとんどのハイエナ人より賢く、戦闘魔法で力の不足を補う。ハイエナシャーマンの力は比較的弱いが、部族内では高い地位にある。
actors.mobs.shaman$redshaman.spell_desc=赤い仮面をつけたシャーマンは魔法であなたの_攻撃力を弱体化_する。
actors.mobs.shaman$blueshaman.spell_desc=青い仮面をつけたシャーマンは魔法であなたの_被ダメージを増加_させる。
actors.mobs.shaman$purpleshaman.spell_desc=紫の仮面をつけたシャーマンは魔法であなたの_命中率と回避を低下_させる。

actors.mobs.armoredbrute.name=装甲ブルート
actors.mobs.armoredbrute.desc=これらの最上位のハイエナ暴徒は、強力な装甲で身分を示す。暴徒の鎧は物理防御力を倍増させ、強固な意志により瀕死時の狂暴時間を大幅に延長する。

actors.mobs.skeleton.name=スケルトン
actors.mobs.skeleton.explo_kill=飛び散った骨片で死んだ…
actors.mobs.skeleton.def_verb=ガード
actors.mobs.skeleton.desc=スケルトンは倒れた冒険者と監獄の元住人の屍であり、ダンジョン深部の邪悪な魔力の影響で蘇った。スケルトンが破壊されると、骨は破片となって爆発する。飛び散った骨片は近くの全キャラクターにダメージを与え、鎧はこのダメージを大幅に軽減する。

actors.mobs.slime.name=スライム
actors.mobs.slime.def_verb=ガード
actors.mobs.slime.desc=スライムはゼリー状の外皮と液状の内核を持つ奇妙な魔法生物だ。都市の下水道は彼らに十分な水源と豊富な養分を提供している。\n\nスライムの外層のゼリー膜は非常に弾力性があり、どの単発攻撃も_6ポイントを超えるダメージ_を与えることができない。

actors.mobs.snake.name=下水道大蛇
actors.mobs.snake.hint=検査ボタンをクリックしてから蛇を選択し、倒し方を確認してみよう。
actors.mobs.snake.desc=これらの大型の蛇は高速で滑走して攻撃を回避するため、命中させるのが非常に難しい。しかし、伏撃と魔法攻撃は彼らを不意打ちできる。\n\n蛇の視界外から攻撃すると、それは伏撃となる。伏撃の方法の一つは、蛇が追いかけてきた時に扉の陰に隠れ、_蛇が扉を通る瞬間に攻撃する_ことだ。

actors.mobs.spectralnecromancer.name=スペクトルネクロマンサー
actors.mobs.spectralnecromancer.desc=ネクロマンサーは通常スケルトンの召喚に夢中だが、中にはより幽玄で無形の存在を召喚することを好む個体もいる。幽魂法師たちは怨霊をその手先として選んだのだ！\n\n怨霊の個体戦闘力はスケルトンに劣るかもしれないが、この幽霊魔法使いたちは何人手下を召喚しても飽き足らない！

actors.mobs.spinner.name=鉱山蜘蛛
actors.mobs.spinner.desc=この緑の毛を持つ鉱山蜘蛛は正面戦闘を避けようとする。遠くに留まり、巣に絡まった獲物がゆっくりと毒牙から分泌される猛毒で死ぬのを待つ方が好きだ。また遠くへ向けて糸を噴射し、敵の進行経路を妨害することもできる。

actors.mobs.statue.name=生ける石像
actors.mobs.statue.def_verb=ガード
actors.mobs.statue.desc=ダンジョンにあるただの静かな石像だと思ったが、赤く光る目が正体を露呈している。
actors.mobs.statue.desc_weapon=像自体は石造りだが、装備している_%s_は本物のようだ。
actors.mobs.statue.discover_hint=この敵はあらゆるダンジョン区域に出現します。

levels.minigame.extraction.mobs.vaultarmoredstatue.name=金庫鉄衛
levels.minigame.extraction.mobs.vaultarmoredstatue.desc=この武装構築体は封印された秘密金庫を守るために作られた。普通の石像のように休眠しておらず、略奪が始まるとすでに目覚めており、侵入者を能動的に捜索する。
levels.minigame.extraction.mobs.vaultarmoredstatue.desc_arm_wep=鉄衛は_%1$s_を手に、_%2$s_を身に着けている。

levels.minigame.extraction.mobs.veilbreakereye.name=破幕の邪眼
levels.minigame.extraction.mobs.veilbreakereye.desc=この邪眼は隠密が残す微細な乱れを捕捉できる。隠れた英雄がその視界内にいる間、毎ターン隠蔽幕を破ろうと試みる。距離が近いほど、看破確率が高くなる。
levels.minigame.extraction.mobs.veilbreakereye.reveal=破幕の邪眼が君を捕捉した！隠れていた幕が破られた！

levels.minigame.extraction.mobs.chronosuccubus.name=時喰いサキュバス
levels.minigame.extraction.mobs.chronosuccubus.desc=この種のサキュバスは感情だけでなく、盗まれた時間も喰らう。君がその視界内で時止めを使って行動すると、彼女は時止めを即座に崩壊させるかもしれない。残りターン数が少ないほど、成功率が高くなる。
levels.minigame.extraction.mobs.chronosuccubus.break_time=時喰いサキュバスが君の最後の停止時間を奪い去った！

levels.minigame.extraction.mobs.deferredscorpio.name=遅延魔蝎
levels.minigame.extraction.mobs.deferredscorpio.desc=この魔蝎が放つ棘刺は即座に創口を残し、ただちに敵にダメージを与える。そして敵はそのダメージ源を極めて発見しにくい。

levels.minigame.extraction.mobs.raidkeycarrier.name=水晶鍵保持者
levels.minigame.extraction.mobs.raidkeycarrier.desc=この敵は離脱に必要な水晶の鍵を所持している。倒せば鍵を入手できる。

actors.mobs.succubus.name=サキュバス
actors.mobs.succubus.desc=サキュバスは敵の精神を操ることに長けた変形悪魔だ。この個体はゴシック風の蒼白い人型に化けており、おそらくドワーフの術士を誘引するためだろう。\n\n攻撃時に、サキュバスは一時的に標的を魅了し、サキュバス自身への直接攻撃を不能にする。魅了された標的に攻撃する際、サキュバスはその生命力を吸収できる。

actors.mobs.swarm.name=蝿の群れ
actors.mobs.swarm.desc=致命的な飛蝿の群れが怒りに満ちてブンブンと鳴いている。非魔法攻撃は毎回、より小さいが同様に危険な二つの群れに分裂させる。

actors.mobs.tengu.name=テング
actors.mobs.tengu.notice_gotcha=捕まえたぞ、%s！
actors.mobs.tengu.interesting=そろそろこの戦いをもっと面白くしよう…
actors.mobs.tengu.notice_have=お前の命はもらった、%s！
actors.mobs.tengu.defeated=ようやく…解放された…
actors.mobs.tengu.rankings_desc=テングに暗殺された
actors.mobs.tengu.desc=有名な神秘の暗殺者で、その名は顔にぴったりと貼りついた仮面に由来する。\n\nテングの手首と膝下には枷がついているが、彼はとっくに鎖の束縛から逃れているようだ。\n\n彼は罠、騙しの魔法、正確無比な致命攻撃を駆使して、唯一彼の脱出を阻む者——君を——排除するだろう。

actors.mobs.tengu$bombability$bombblob.desc=ここには過熱した煙が渦巻いている。爆発に注意！
actors.mobs.tengu$bombability$bombitem.name=煙塵爆弾
actors.mobs.tengu$bombability$bombitem.cant_pickup=地面に固定されていて、動かせない！
actors.mobs.tengu$bombability$bombitem.desc=テングがここに奇妙な形の、熱い濃煙を吐き出す爆弾を投げた。滴答と音を立てており、爆発のカウントダウンのようだ！\n\n爆弾は地面にめり込んでいて、拾うことはできない。

actors.mobs.tengu$fireability$fireblob.desc=テングが煙を上げ始めた細かな粉末をまいた。燃え出すぞ！

actors.mobs.tengu$shockerability$shockerblob.desc=ここに電気エネルギーが蓄積されている。立っているユニットは次のターンに電撃を受ける！
actors.mobs.tengu$shockerability$shockeritem.name=電撃装置
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=放電が強すぎて触れない！
actors.mobs.tengu$shockerability$shockeritem.desc=テングがここに奇妙な装置を投げた。DM-100の部品を組み合わせて作ったようだ。装置は周囲に持続的に電撃を放っているが、範囲には規則性があるようだ。\n\nこれほど密集した高圧電撃に囲まれているため、拾うことはできない。

actors.mobs.thief.name=狂った泥棒
actors.mobs.thief.stole=泥棒が%sを盗んでいった！
actors.mobs.thief.carries=\n\nこの泥棒は_%s_を所持している。明らかに盗んだものだ。
actors.mobs.thief.escapes=泥棒が%sを持って逃げた！
actors.mobs.thief.desc=これらの囚人は牢房を逃げ出したが、この監獄からは逃げ出せなかった。時が経つにつれ、この監獄は彼らの残った理性と自由への憧れを完全に打ち砕いた。これらの狂った泥棒と強盗は、ずっと昔に自分が誰で、なぜ盗むのかを完全に忘れている。\n\nこれらの敵は正面からの戦闘よりも、君の財物を盗んで逃走することを好む。しっかり目を離さないように。さもないと、盗まれた物とは二度と会えなくなるかもしれない。

actors.mobs.tormentedspirit.name=呪霊
actors.mobs.tormentedspirit.desc=呪霊は本来善良だが呪いに苛まれる魂だ。呪いが続く限り、彼らはより強力な怨霊のように君を攻撃する。\n\n近接時に払邪の巻物を使って霊の呪いを浄化できるかもしれない。呪いが浄化されれば、必ず報いてくれるだろう…
actors.mobs.tormentedspirit.thank_you=ありがとう…

actors.mobs.warlock.name=ドワーフ術士
actors.mobs.warlock.bolt_kill=影の弾丸で死んだ…
actors.mobs.warlock.desc=ドワーフの関心が工学建築からオカルト学術へと移るにつれ、術士たちが街で権力を握るようになった。彼らは元素魔法から始めたが、すぐに悪魔学と死霊術の研究を始めた。最強の術士はドワーフ王国の王権を掌握しており、他の術士が暗黒魔法の練習を続けたければ、精神の自由を放棄し、意志を彼の支配下に委ねなければならない。\n\nこれらの術士は強力な妨害魔法を持ち、装備の強化魔力を一時的に抑圧できる。装備のレベルが高いほど、減退魔法の影響が深刻になる。

actors.mobs.wraith.name=怨霊
actors.mobs.wraith.desc=怨霊は墓穴からの復讐に渇く罪人の魂だ。幽玄な非実体であるため、通常の武器では命中させにくい。
actors.mobs.wraith.discover_hint=この敵はあらゆるダンジョン区域に出現します。

actors.mobs.yogdzewa.name=Yog-Dzewa
actors.mobs.yogdzewa.notice=見　つ　け　た
actors.mobs.yogdzewa.notice1=逃　げ　ら　れ　な　い
actors.mobs.yogdzewa.darkness=闇が迫っている…
actors.mobs.yogdzewa.hope=希　望　の　幻　影
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.rankings_desc=Yog-Dzewaに飲み込まれた
actors.mobs.yogdzewa.desc=Yog-Dzewaは古代の神であり、その力を凡人界に伸ばし、それらを飲み込んで自身の無限の成長のための養分とする巨大な怪物だ。ドワーフは暗黒魔法を弄んでいたときにこの巨影の注意を引き、それ以来ずっとこの神を制御して外界への侵食を防ごうとしている。\n\nこの古神は原始的で魔法と混沌に満ちた次元に起源を持ち、神の真の姿をこの世界に持ち込むことはできない。そのため、神は自身の化身を創り出し、悪魔たちを従者として召喚し、その命令を遂行させている。\n\nこの巨大な目は古神がこの世界における力の焦点だ。この目自体は移動できないが、神は強力な魔力光線を放ち、様々な悪魔の手下を召喚して助けとすることができる。
actors.mobs.yogdzewa.desc_spawners=悪魔のエネルギーが上層から古神の目へと流れ込んでいるのを感じる。上で生き残った何かが古神にエネルギーを送り続けている。_古神はこのエネルギーを使ってさらに強力な手下を召喚するだろう！_
actors.mobs.yogdzewa$larva.name=古神の幼虫
actors.mobs.yogdzewa$larva.rankings_desc=Yog-Dzewaに飲み込まれた
actors.mobs.yogdzewa$larva.desc=これらの古神の小さな創造物は、容易に作り出せる簡素な生物だ。単体の幼虫は非常に脆弱だが、素早く大量に作り出され、数が多くなると手に負えなくなる。
actors.mobs.yogdzewa$yogripper.rankings_desc=Yog-Dzewaに飲み込まれた
actors.mobs.yogdzewa$yogeye.rankings_desc=Yog-Dzewaに飲み込まれた
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Yog-Dzewaに飲み込まれた

actors.mobs.yogfist.invuln_warn=拳が古神の目に近づいている間はダメージを受けられない！
actors.mobs.yogfist.rankings_desc=Yog-Dzewaに飲み込まれた
actors.mobs.yogfist.desc=この拳は古神の力の一部の具現化だ。これらの拳は古神の力と相互に連絡しており、古神の目に近づくと受けるすべてのダメージを無効化する。
actors.mobs.yogfist$burningfist.name=燃焼の拳
actors.mobs.yogfist$burningfist.desc=燃焼の拳は混沌の灼熱魔法から形成されている。移動中は周囲の環境に絶えず引火する。また火炎エネルギーを発射して魔法の衝撃波を形成し、標的を猛火の中に陥れる。\n\n燃焼の拳の環境への引火能力は水辺では抑制されるが、熱量が大きすぎて周囲の水はすぐに蒸発してしまう。
actors.mobs.yogfist$soiledfist.name=大地の拳
actors.mobs.yogfist$soiledfist.desc=大地の拳は混沌の大地魔法から形成されている。移動中は周囲に絶えず植物を生やす。また精密な大地の衝撃を放ち、標的を急速に成長する蔓と根の間に閉じ込める。\n\n大地の拳は植物の生命力から力を得ており、周囲の植生の量に応じてダメージを吸収できる。
actors.mobs.yogfist$rottingfist.name=腐敗の拳
actors.mobs.yogfist$rottingfist.desc=腐敗の拳は生きた腐肉の塊から形成されている。高塔のように巨大な腐敗した血肉の塊で、近接戦では腐泥を噴出し、遠距離攻撃では毒ガスを噴射する。さらに悪いことに、腐敗の拳の巨大な質量により、攻撃を受けても流血状態になるだけで、直接ダメージを受けない。\n\n腐泥は水で洗い流せるが、腐敗の拳は水を吸収して自己回復することもできる！さらに、流血中に腐敗の拳にダメージを与えても、流血状態が更新されるだけで効果は累積しない！
actors.mobs.yogfist$rustedfist.name=錆の拳
actors.mobs.yogfist$rustedfist.desc=錆の拳は活性金属の塊から形成されている。高塔のように巨大な活性金属で、強力な近接戦闘能力を持ち、遠距離から標的を麻痺させる能力もある。その巨大な質量のため、錆の拳が受けるダメージはすべて遅延され、即座には作用しない。\n\nとはいえ、錆の拳の不器用な性質により、狭い通路を通ることはできない。また、錆の拳はゆっくりとしかダメージを受けないが、遅延ダメージは複数回の攻撃を受けると累積していく。
actors.mobs.yogfist$brightfist.name=輝耀の拳
actors.mobs.yogfist$brightfist.teleport=輝耀の拳が重度の失明をもたらす閃光と共に別の場所へテレポートした！
actors.mobs.yogfist$brightfist.desc=輝耀の拳は純粋な光のエネルギーから形成されている。毎ターン強力な灼熱の光線を放つ！これらの光線は多大なダメージを与えるだけでなく、一時的に失明させる。輝耀の拳は逃走のためにフィールド全体を覆う目もくらむ閃光を放つこともできる！\n\n輝耀の拳は近接戦闘では特別な能力を持たない。
actors.mobs.yogfist$darkfist.name=暗影の拳
actors.mobs.yogfist$darkfist.teleport=暗影の拳が光源をかき消す暗黒の中へテレポートした！
actors.mobs.yogfist$darkfist.desc=暗影の拳は純粋な闇のエネルギーから形成されている。毎ターン強力な暗黒魔法を放つ！これらの魔法は多大なダメージを与えるだけでなく、光源を弱体化させる。暗影の拳は逃走のために一瞬でフィールド全体を暗黒に陥れることもできる！\n\n暗影の拳は近接戦闘では特別な能力を持たない。


