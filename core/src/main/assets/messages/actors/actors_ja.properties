actors.hero.talent.vip_meal.title=会員制食堂
actors.hero.talent.vip_meal.desc=_+0：_食事で現在所持金_20%_消費。\n\n_+1：_食事で現在所持金_10%_消費。\n\n_+2：_食事で金銭消費なし。
actors.hero.talent.vip_meal.comment=「英雄に三大欲望あり：食欲、探索欲、宝物欲。」
actors.hero.talent.fast_die.title=長啓速退
actors.hero.talent.fast_die.desc=_+0：_ロード毎_に_最大HP40%_減少。\n\n_+1：_ロード毎_に_最大HP20%_減少。\n\n_+2：_ロードでHP減少なし。
actors.hero.talent.fast_die.comment=この才能で英雄は死亡しない、最低1HP残存。\n\n注意：ゲーム内でYendorの護符入手後、ゲーム終了選択画面への遷移時に自動ロードが発生しHP減少。\n\n「だから俺がこのセーブを終わらせてやった！」\n「お前という人間は、頭の中が他のゲームで一杯だな！」
actors.hero.talent.wash_hand.title=食前手洗い
actors.hero.talent.wash_hand.desc=_+0：_露収集時_20%確率_で3ターン毒_。\n\n_+1：_露収集時_10%確率_で3ターン毒_。\n\n_+2：_露収集で毒なし。
actors.hero.talent.wash_hand.comment=「なぜ水道水は汚いのに、それで洗ったリンゴはそのまま食べられるのか？」\n\n_——可則が親切に提供した白板才能_
actors.hero.talent.thorns_sprang.title=荊棘叢生
actors.hero.talent.thorns_sprang.desc=_+0：_高草踏みつけ時_20%確率_で_初期値1の出血_効果。\n\n_+1：_高草踏みつけ時_10%確率_で_初期値1の出血_効果。\n\n_+2：_高草踏みつけで出血なし。
actors.hero.talent.thorns_sprang.comment=「靴を履かずに草むらを歩いた結果。」\n\n_——可則の心温まる白板才能_
actors.hero.talent.fullpassion.title=情熱満々
actors.hero.talent.fullpassion.desc=_+0：_全宝箱怪_の不意打ちダメージ60%上昇_、_移動速度通常の_2倍_。\n\n_+1：_全宝箱怪_の不意打ちダメージ30%上昇_、_移動速度通常の_1.5倍_。\n\n_+2：_全宝箱怪の不意打ちダメージと移動速度が正常に戻る。
actors.hero.talent.fullpassion.comment=「今や誰が牙で遊べる？」\n\n_DM-216からの情熱_
actors.hero.talent.fullfighting.title=戦意盎然
actors.hero.talent.fullfighting.desc=_+0：_敵撃破時_60%確率_で全層の敵を覚醒。\n\n_+1：_敵撃破時_30%確率_で全層の敵を覚醒。\n\n_+2：_敵撃破で全層覚醒なし。
actors.hero.talent.fullfighting.comment=
actors.hero.talent.phaseclaw.title=位相利爪
actors.hero.talent.phaseclaw.desc=_+0：_敵_攻撃距離+1_、攻撃時_10%確率_で3ターン被ダメージ上昇_。\n\n_+1：_敵_攻撃距離+1_。\n\n_+2：_敵の攻撃距離上昇なし。
actors.hero.talent.phaseclaw.comment=
actors.hero.talent.backfired.title=火だるま
actors.hero.talent.backfired.desc=_+1：_液火薬剤服用で_5ターン炎之力_獲得。\n\n_+2：_液火薬剤服用で_8ターン炎之力_獲得。
actors.hero.talent.backfired.comment=「寒い日は温かい飲み物に限る！」\n\n_霜晨_
actors.hero.talent.goldofbook.title=書中黄金
actors.hero.talent.goldofbook.desc=_+1：_巻物閲覧で_50ゴールド_獲得。\n\n_+2：_巻物閲覧で_100ゴールド_獲得。
actors.hero.talent.goldofbook.comment=この才能は無序魔導書の閲覧でも発動可能。\n\n「『書中自ら黄金屋有り』って勵ましの言葉だと思ってたのに…」
actors.hero.talent.extreme_reaction.title=極限反応
actors.hero.talent.extreme_reaction.desc=_+1：_敵の物理攻撃回避時_1ターンホルモン活性_獲得。\n\n_+2：_敵の物理攻撃回避時_2ターンホルモン活性_獲得。\n\n_+3：_敵の物理攻撃回避時_3ターンホルモン活性_獲得。
actors.hero.talent.extreme_reaction.comment=英雄の現在のホルモン活性持続時間が5ターンを超える場合、この才能は重ねがけを停止。
actors.hero.talent.deep_fear.title=深層恐怖
actors.hero.talent.deep_fear.desc=_+0：_階層が深まるにつれ_英雄の最大HP_3x到達最大階層数_減少。\n\n_+1：_階層が深まるにつれ_英雄の最大HP_2x到達最大階層数_減少。\n\n_+2：_階層深化による最大HP減少なし。
actors.hero.talent.deep_fear.comment=「英雄なら100階を目指せ！(実際は100階もないけどね)」\n\n_DM-216が植え付けた恐怖_
actors.hero.talent.no_door.title=扉すらない
actors.hero.talent.no_door.desc=_+0：_通常扉が隠し扉に置換される_確率x2_。\n\n_+1：_通常扉が隠し扉に置換される_確率x1.5_。\n\n_+2：_通常扉の隠し扉置換確率上昇なし。
actors.hero.talent.no_door.comment=
actors.hero.talent.updraft.title=上昇気流
actors.hero.talent.updraft.desc=_+0：_燃焼時_等量ターンの浮遊_獲得、_浮遊時_等量ターンの燃焼_獲得。\n\n_+1：_燃焼時_等量ターンの浮遊_獲得、_浮遊時の燃焼獲得なし。\n\n_+2：_燃焼と浮遊の相互効果なし。
actors.hero.talent.updraft.comment=この負の才能で得た浮遊と燃焼は、この負の才能による重ねがけの対象外。\n\n「地下牢の浮遊が噴射式魔法ならな…」
actors.hero.talent.quantum_hacking.title=量子ハッキング
actors.hero.talent.quantum_hacking.desc=_+1：_杖か魔法杖の詠唱命中時_1ターン麻痺_付与。\n\n_+2：_杖か魔法杖の詠唱命中時_2ターン麻痺_付与。
actors.hero.talent.quantum_hacking.comment=「長きに渡り、魔法学の研究は停滞していた。人々が魔力で生物の脳に侵入するまで。」
actors.hero.talent.cicada_dance.title=空蝉幻舞
actors.hero.talent.cicada_dance.desc=_+1：_英雄が物理攻撃で敵撃破時_2ターン不可視_獲得。\n\n_+2：_英雄が物理攻撃で敵撃破時_3ターン不可視_獲得。\n\n_+3：_英雄が物理攻撃で敵撃破時_4ターン不可視_獲得。
actors.hero.talent.cicada_dance.comment=

actors.hero.talent.chocolate_coins.title=金貨チョコ
actors.hero.talent.chocolate_coins.desc=_+1：_空腹によるHP減少時、バッグ内の金貨が_5以上なら_7金貨を消費_してこのHP減少を防ぐ。\n\n_+2：_空腹によるHP減少時、バッグ内の金貨が_10以上なら_5金貨を消費_してこのHP減少を防ぐ。
actors.hero.talent.chocolate_coins.comment=「ある魔術師の悪趣味かもしれないが、とにかくこれらの金貨は食用可能だ。」

actors.hero.talent.ghost_gift.title=白幽霊の贈り物
actors.hero.talent.ghost_gift.desc=_+1：_悲しき幽霊の防具報酬を選択後、_75%の確率で_同時に武器報酬を獲得する。\n\n_+2：_悲しき幽霊の防具報酬を選択後、_必ず_同時に武器報酬を獲得する。
actors.hero.talent.ghost_gift.comment=武器報酬を選択した場合、この才能は発動しない。\n\n「幽ちゃん、君は僕の最高の友達だ。」

actors.hero.talent.personal_attack.title=人身攻撃
actors.hero.talent.personal_attack.desc=_+1：_怒りの巻物を読む時、影響を受けた敵に_5ターンの被ダメージ増加_効果を与える。\n\n_+2：_怒りの巻物を読む時、影響を受けた敵に_5ターンの被ダメージ増加_と_5ターンの弱体_効果を与える。
actors.hero.talent.personal_attack.comment=この才能をアップグレードすると追加で_怒りの巻物1枚_を獲得する。また、この才能は無秩序の魔典内の怒りの巻物を読むことで発動できる。\n\nこの種のアップグレードや変身により直接リソースを獲得する才能は共有_26回の発動制限_(紳士は_39回_)を持つ。\n\n「そんなに大声で叫ばなくてもいいだろ。」

actors.hero.talent.shoot_satellite.title=衛星撃墜
actors.hero.talent.shoot_satellite.desc=_+1：_飛行状態_の敵へのダメージ_20%増加_。\n\n_+2：_飛行状態_の敵へのダメージ_30%増加_。
actors.hero.talent.shoot_satellite.comment=投石で_飛行状態_の敵にダメージを与えると_ダメージ2倍_。\n\n常時_飛行状態_の敵には金色の蜂、怨霊、呪縛霊、蝿の群れ、新生火の元素、吸血コウモリ、水晶の精霊群、炎の元素、氷霜の元素、電光の元素、混沌の元素、邪眼、大悪魔、黄金の元素が含まれる。任意の敵に_浮遊_効果を与えてこの才能を発動させることもできる。\n\n「ダンジョン恩情物語『戦士の祖父、3つの+20極化石で古の神を砕く』。」

actors.hero.talent.holy_faith.title=聖光信仰
actors.hero.talent.holy_faith.desc=_+1：_英雄が_発光_効果を得た時、追加で_5ターンの祝福と杖のチャージ_を得る。\n\n_+2：_英雄が_発光_効果を得た時、追加で_7ターンの祝福と杖のチャージ_を得る。\n\n_+3：_英雄が_発光_効果を得た時、追加で_9ターンの祝福、杖のチャージ_と_4ターンの神器チャージ_を得る。
actors.hero.talent.holy_faith.comment=

actors.hero.talent.honey_fish.title=ハチミツ魚缸
actors.hero.talent.honey_fish.desc=_+1：_ハチミツ壺を投げるとその場に水が発生し、金色の蜂の代わりに巨大な人食い魚が生成される。巨大な人食い魚は_50ターンの狂乱_を得る。\n\n_+2：_1に加え、ハチミツ壺の破損位置で追加で_水爆薬の効果_が1回発動する。
actors.hero.talent.honey_fish.comment=この才能で生成された巨大な人食い魚は幻影の人食い魚に置き換わる可能性もある。また、どちらも負の才能_陸遊_の影響を受ける。\n\n「青い不透明な魚缸だ。」

actors.hero.talent.instant_refining.title=瞬時錬成
actors.hero.talent.instant_refining.desc=_+1：_敵が死亡した時、英雄は_40%の確率で1ポイントの錬金エネルギー_を得る。\n\n_+2：_敵が死亡した時、英雄は_60%の確率で1ポイントの錬金エネルギー_を得る。
actors.hero.talent.instant_refining.comment=この才能のドロップも英雄のレベル制限を受ける。\n\n「一気に掴んで、瞬時錬成。」

actors.hero.talent.changqi_bookstore.title=常啓書室
actors.hero.talent.changqi_bookstore.desc=_+1：_巻物を読む時_30%の確率でランダムな符石1つ_を得る。\n\n_+2：_巻物を読む時_45%の確率でランダムな符石1つ_を得る。\n\n_+3：_巻物を読む時_60%の確率でランダムな符石1つ_を得る。
actors.hero.talent.changqi_bookstore.comment=この才能ではエンチャント符石は入手できない。無秩序の魔典を読むことで発動できるが、リソース獲得の回数は_26回に制限_(紳士は_39回_)され、この制限はアップグレードや変身により直接リソースを得る大部分の才能と共有される。

actors.hero.talent.ascension_curse.title=昇天呪
actors.hero.talent.ascension_curse.desc=_+1：_聖典が呪文_昇天呪_を放てるようになる。_1チャージ消費_で自身を_5ターン浮遊_させる。\n\n_+2：_聖典が呪文_昇天呪_を放てるようになる。_1チャージ消費_で自身を_8ターン浮遊_させる。
actors.hero.talent.ascension_curse.comment=「飛べ！」

actors.hero.talent.divine_protection.title=神明の庇護
actors.hero.talent.divine_protection.desc=_+1：_聖典が呪文_神明の庇護_を放てるようになる。_1チャージ消費_で自身を_3ターン無敵_にする。\n\n_+2：_聖典が呪文_神明の庇護_を放てるようになる。_1チャージ消費_で自身を_5ターン無敵_にする。
actors.hero.talent.divine_protection.comment=「俺の上には人がいるんだ。」

actors.hero.talent.shepherd_intention.title=牧羊原旨
actors.hero.talent.shepherd_intention.desc=_+1：_聖典が呪文_牧羊原旨_を放てるようになる。_1チャージ消費_で指定した場所に_小さな魔法の羊の群れ_を生み出す。\n\n_+2：_聖典が呪文_牧羊原旨_を放てるようになる。_1チャージ消費_で指定した場所に_魔法の羊の群れ_を生み出す。
actors.hero.talent.shepherd_intention.comment=「この羊たちはどこから来たのか？」

actors.hero.talent.conversion_holy.title=聖法帰依
actors.hero.talent.conversion_holy.desc=_+1：_聖典が呪文_聖法帰依_を放てるようになる。_1チャージ消費_で_視界内の任意の目標を沈淪_させる。\n\n_+2：_1に加え、目標に_10ターンの祝福_を与える。
actors.hero.talent.conversion_holy.comment=この呪文で沈淪した敵はドロップ品を落とさない。\n\n「聖なる教会に入れ、聖なる教会に入ってください、ありがとう。」

actors.hero.talent.purifying_evil.title=浄化邪悪
actors.hero.talent.purifying_evil.desc=_+1：_聖典が呪文_浄化邪悪_を放てるようになる。_1チャージ消費_で_目標の全ての強化効果を除去_する。\n\n_+2：_1に加え、_目標のエリート効果も除去_する。\n\n_+3：_1と2に加え、_アンデッドと悪魔属性_の敵に_英雄の最大HPの20%_のダメージを与える(Bossには効果半減)。
actors.hero.talent.purifying_evil.comment=

actors.hero.talent.divine_storm.title=神力領域嵐
actors.hero.talent.divine_storm.desc=_+1：_聖典が呪文_神力領域嵐_を放てるようになる。_1チャージ消費_で目標位置に_3x3範囲_、_10ターン_持続の電界を生成する。\n\n_+2：_聖典が呪文_神力領域嵐_を放てるようになる。_1チャージ消費_で目標位置に_7x7範囲_、_20ターン_持続の電界を生成する。\n\n_+3：_2に加え、_5x5範囲_、_5ターン_持続の炎も発生させる。
actors.hero.talent.divine_storm.comment=

actors.hero.talent.genesis.title=創世記
actors.hero.talent.genesis.desc=_+1：_聖典が呪文_創世記_を放てるようになる。_1チャージ消費_で_前2層の才能ポイントをリセット_する。\n\n_+2：_聖典が呪文_創世記_を放てるようになる。_1チャージ消費_で_全ての才能ポイントをリセット_する。
actors.hero.talent.genesis.comment=「そして全てが逆転し始めた。」

actors.hero.talent.indulgence.title=贖宥状
actors.hero.talent.indulgence.desc=_+1：_聖典が呪文_贖宥状_を放てるようになる。_200金貨を消費_して_1ポイントの聖典チャージ_を回復する。\n\n_+2：_聖典が呪文_贖宥状_を放てるようになる。_150金貨を消費_して_1ポイントの聖典チャージ_を回復する。
actors.hero.talent.indulgence.comment=この呪文は聖典の写本には無効。\n\n「悔い改めた。」

actors.hero.talent.silver_language.title=銀光鋭語
actors.hero.talent.silver_language.desc=_+1：_聖典が呪文_銀光鋭語_を放てるようになる。_1チャージ消費_で目標に_3ターンの狂乱_を与える。\n\n_+2：_聖典が呪文_銀光鋭語_を放てるようになる。_1チャージ消費_で目標に_5ターンの狂乱_を与える。
actors.hero.talent.silver_language.comment=「聖典にこんな下品な言葉が載っているなんて誰が思うだろう？」

actors.hero.talent.resurrection.title=復活術
actors.hero.talent.resurrection.desc=_+1：_聖典が呪文_復活術_を放てるようになる。_1チャージ消費_で自身か味方に_5ターンの死者蘇生_効果を与える。効果継続中に死亡すると即座に復活する。\n\n_+2：_聖典が呪文_復活術_を放てるようになる。_1チャージ消費_で自身か味方に_10ターンの死者蘇生_効果を与える。効果継続中に死亡すると即座に復活する。\n\n_+3：_聖典が呪文_復活術_を放てるようになる。_1チャージ消費_で自身か味方に_10ターンの死者蘇生_効果を与える。効果継続中に死亡すると即座に復活し、_20ターンの祝福_効果も得る。
actors.hero.talent.resurrection.comment=この呪文を味方に使用すると復活時に最良の状態になり、英雄自身に使用すると復活時のHP回復は最大1まで。

actors.hero.talent.bone_fire.title=蝕骨の火
actors.hero.talent.bone_fire.desc=_+0：_発生した_炎は自然に消えない_。キャラクターが炎のダメージを受けた時、道具が焼ける_確率が2倍_になる。\n\n_+1：_発生した_炎は自然に消えない_。\n\n_+2：_発生した炎は通常通り消える。
actors.hero.talent.bone_fire.comment=

actors.hero.talent.jump_face_silicone.title=跳脸シリコン
actors.hero.talent.jump_face_silicone.desc=_+0：_敵が目覚める時_2ターンのタイムバブル_を得る。\n\n_+1：_敵が目覚める時_1ターンのタイムバブル_を得る。\n\n_+2：_敵が目覚める時、タイムバブルを得なくなる。
actors.hero.talent.jump_face_silicone.comment=「わあっ！」\n\n_霜晨_

actors.hero.talent.grass_mob.title=草木皆兵
actors.hero.talent.grass_mob.desc=_+0：_高い草が破壊された時_20%の確率で腐莓の触手1体_が生成される。\n\n_+1：_高い草が破壊された時_10%の確率で腐莓の触手1体_が生成される。\n\n_+2：_高い草が破壊された時、腐莓の触手は生成されなくなる。
actors.hero.talent.grass_mob.comment=

actors.hero.talent.disaster_curse.title=災厄の呪い
actors.hero.talent.disaster_curse.desc=_+0：_敵が英雄に近接ダメージを与えた時_50%の確率で1ターンの鈍足と弱体_を与える。\n\n_+1：_敵が英雄に近接ダメージを与えた時_25%の確率で1ターンの鈍足と弱体_を与える。\n\n_+2：_敵が英雄に近接ダメージを与えた時、鈍足と弱体を与えなくなる。
actors.hero.talent.disaster_curse.comment=

actors.hero.talent.ashes_bow.title=灰燼の弓
actors.hero.talent.ashes_bow.desc=_+1：_投擲武器がダメージを与えた時_1ターンの燃焼_を与える。\n\n_+2：_投擲武器がダメージを与えた時_2ターンの燃焼_を与える。\n\n_+3：_投擲武器がダメージを与えた時_3ターンの燃焼_を与える。
actors.hero.talent.ashes_bow.comment=この才能は_5ターンのクールダウン_を持つ。\n\n霊能弓などの特殊投擲武器を持つ英雄がこの才能を得た場合、特殊投擲武器もこの才能の強化を受けられる。
actors.hero.talent$ashesbowcooldown.name=灰燼の弓-クールダウン
actors.hero.talent$ashesbowcooldown.desc=この才能を発動したばかりです。しばらく待つと再び発動できます。\n\n残りクールダウン：%sターン

actors.hero.talent.swift_church.title=速行薊神教
actors.hero.talent.swift_church.desc=_+1：_再生の杖1本_を得る。\n\n_+2：_1に加え(リソース獲得は除く)、_タイムバブル状態_で攻撃するとタイムバブルが_5ターン減少_し、即座に効果が終了しなくなる。\n\n_+3：_タイムバブル状態_で攻撃するとタイムバブルが_3ターン減少_し、即座に効果が終了しなくなる。
actors.hero.talent.swift_church.comment=この種のアップグレードや変身により直接リソースを獲得する才能は共有_26回の発動制限_(紳士は_39回_)を持つ。\n\n「ある恐ろしい紫衣の女が無限4ターンを組み立てて最後のエリアのBossを倒した。君は彼女が誰か知っている。」\n\n_——学有所長_

actors.hero.talent.protect_curse.title=呪いの加護
actors.hero.talent.protect_curse.desc=_+1：_呪われた武器と防具が_1レベルの追加レベル_を得る。\n\n_+2：_呪われた武器と防具が_2レベルの追加レベル_を得る。
actors.hero.talent.protect_curse.comment=「今や本当に呪いが多すぎて身に詰まらないな。」

actors.hero.talent.potential_energy.title=位置エネルギー変換
actors.hero.talent.potential_energy.desc=_+1：_英雄が深淵に落ちた時、廃疾効果を受けなくなり、代わりに_3ターンの高速_効果を得る。\n\n_+2：_英雄が深淵に落ちた時、廃疾効果を受けなくなり、代わりに_5ターンの高速_効果を得る。
actors.hero.talent.potential_energy.comment=「ダンジョン電撃戦。」

actors.hero.talent.nirvana.title=涅槃
actors.hero.talent.nirvana.desc=_+1：_自身の_燃焼_効果終了後、_自身のレベル/2のHP回復_を得る。\n\n_+2：_1に加え、_燃焼状態_で敵を攻撃すると_3ターンの燃焼_を追加で与える。
actors.hero.talent.nirvana.comment=「蝕骨の火を恐れず。」

actors.hero.talent.insinuation.title=含沙射影
actors.hero.talent.insinuation.desc=_+1：_睡眠状態の生物に呪文を唱える時、追加で_3ターンの毒_効果を与える。\n\n_+2：_睡眠状態の生物に呪文を唱える時、追加で_5ターンの毒_効果を与える。
actors.hero.talent.insinuation.comment=「含沙射人影、雖病人不知。巧言構人罪、至死人不疑。」

actors.hero.talent.auto_pick.title=自動拾取
actors.hero.talent.auto_pick.desc=_+1：_アイテム拾得の所要時間が通常の_50%_に低下する。\n\n_+2：_アイテム拾得に_時間がかからなくなる_。
actors.hero.talent.auto_pick.comment=「誰が俺の自動拾取をオンにしたんだ？」

actors.hero.talent.hand_slip.title=手滑りミス
actors.hero.talent.hand_slip.desc=_+0：_移動後の次のターンに受けるダメージが_50%_増加する。\n\n_+1：_移動後の次のターンに受けるダメージが_25%_増加する。\n\n_+2：_移動後、受けるダメージが増加しなくなる。
actors.hero.talent.hand_slip.comment=「これで安定だ。」\n\n_彩玉_

actors.hero.talent.hand_destruction.title=溃決の手
actors.hero.talent.hand_destruction.desc=_+1：_物理攻撃で直接_即死させる_。死神耐性がなく、HPが_5%未満_の目標に有効。\n\n_+2：_物理攻撃で直接_即死させる_。死神耐性がなく、HPが_10%未満_の目標に有効。\n\n_+3：_物理攻撃で直接_即死させる_。死神耐性がなく、HPが_15%未満_の目標に有効。
actors.hero.talent.hand_destruction.comment=

actors.hero.talent.predictive_lover.title=予知秘巻愛好家
actors.hero.talent.predictive_lover.desc=_+1：_予知秘巻を読む時_追加で1種類のアイテムを鑑定_する。\n\n_+2：_予知秘巻を読む時_追加で2種類のアイテムを鑑定_する。
actors.hero.talent.predictive_lover.comment=この才能は無秩序の魔典内の予知秘巻を読むことで発動できる。\n\n「諸君、私は指輪が好きだ。」

actors.hero.talent.fire_ball.title=火球術
actors.hero.talent.fire_ball.desc=_+1：_可燃性マスに呪文を唱える時、そのマスに_1単位の炎_を放つ。\n\n_+2：_可燃性マスに呪文を唱える時、そのマスに_2単位の炎_を放つ。
actors.hero.talent.fire_ball.comment=「これは…小さな焔浪か？」

actors.hero.talent.flash_genius.title=霊光閃現
actors.hero.talent.flash_genius.desc=_+1：_感知符石を使ってアイテムの鑑定に成功した時、フロア内の敵に_2ターンの失明と眩暈_を与える。\n\n_+2：_感知符石を使ってアイテムの鑑定に成功した時、フロア内の敵に_3ターンの失明と眩暈_を与える。
actors.hero.talent.flash_genius.comment=この才能をアップグレードすると追加で_感知符石1つ_を得る。\n\nこの種のアップグレードや変身により直接リソースを獲得する才能は共有_26回の発動制限_(紳士は_39回_)を持つ。\n\n「閃光弾。」

actors.hero.talent.witch_potion.title=魔女の媚薬
actors.hero.talent.witch_potion.desc=_+1：_薬剤を投擲した時、目標位置の敵に_15ターンの魅了_を与える。\n\n_+2：_薬剤を投擲した時、目標位置の敵に_15ターンの魅了と_5ターンの毒_を与える。
actors.hero.talent.witch_potion.comment=「普段は苦い味のコーヒーに、まさか媚薬が入っていたなんて…」\n「最も成熟した私が、美しいピエロに恋をして、幸せに夢の中へ落ちていく…」

actors.hero.talent.traitorous_spell.title=奸奇呪法
actors.hero.talent.traitorous_spell.desc=_+1：_聖典が呪文_奸奇呪法_を放てるようになる。_2チャージ消費_で指定位置に呪いの杖効果を放つ。\n\n_+2：_聖典が呪文_奸奇呪法_を放てるようになる。_1チャージ消費_で指定位置に呪いの杖効果を放つ。
actors.hero.talent.traitorous_spell.comment=「これは聖典に記録されている呪文ではないようだ。」

actors.hero.talent.sprint_spell.title=神行術
actors.hero.talent.sprint_spell.desc=_+1：_聖典が呪文_神行術_を放てるようになる。_1チャージ消費_で_3ターンの高速_を得る。\n\n_+2：_聖典が呪文_神行術_を放てるようになる。_1チャージ消費_で_5ターンの高速_を得る。
actors.hero.talent.sprint_spell.comment=「神速力。」

actors.hero.talent.focus_light.title=集光光線
actors.hero.talent.focus_light.desc=_+1：_聖典が呪文_集光光線_を放てるようになる。_1チャージ消費_で高熱光線を発射し_4~8_ダメージを与え、経路と目標を燃やす。\n\n_+2：_聖典が呪文_集光光線_を放てるようになる。_1チャージ消費_で高熱光線を発射し_6~10_ダメージを与え、経路と目標を燃やす。
actors.hero.talent.focus_light.comment=「これは、高熱光線銃だ。」

actors.hero.talent.zhuanyu_spell.title=転癒聖術
actors.hero.talent.zhuanyu_spell.desc=_+1：_聖典が呪文_転癒聖術_を放てるようになる。_1チャージ消費_で現在のシールド量を_50%_の変換効率で治療効果に変える。\n\n_+2：_聖典が呪文_転癒聖術_を放てるようになる。_1チャージ消費_で現在のシールド量を_75%_の変換効率で治療効果に変える。\n\n_+3：_聖典が呪文_転癒聖術_を放てるようになる。_1チャージ消費_で現在のシールド量を_100%_の変換効率で治療効果に変える。
actors.hero.talent.zhuanyu_spell.comment=この呪文の総治療量は英雄の最大HPの半分を超えない。\n\n「聖典がシールドばかりで治療効果がない欠点を補った。」

actors.hero.talent.thorn_whip.title=茨の鞭
actors.hero.talent.thorn_whip.desc=_+1：_聖典が呪文_茨の鞭_を放てるようになる。_1チャージ消費_で敵を引き寄せ_初期値3の出血_を与える。\n\n_+2：_聖典が呪文_茨の鞭_を放てるようになる。_1チャージ消費_で敵を引き寄せ_初期値5の出血_を与える。
actors.hero.talent.thorn_whip.comment=「神の鞭。」

actors.hero.talent.strongest_shield.title=最強の盾
actors.hero.talent.strongest_shield.desc=_+1：_物理攻撃を受けた時_50%の確率で_追加で1回の防具軽減を行う。\n\n_+2：_1に加え、魔法攻撃を受けた時も_50%の確率で_防具軽減を1回行う。
actors.hero.talent.strongest_shield.comment=

actors.hero.talent.combo_package.title=連撃セット
actors.hero.talent.combo_package.desc=_+1：_近接攻撃_6回命中_ごとに摂食エフェクトが1回発動する。\n\n_+2：_近接攻撃_4回命中_ごとに摂食エフェクトが1回発動する。
actors.hero.talent.combo_package.comment=この才能で発動した摂食エフェクトによる神器チャージ効果では豊穣の角をチャージできない。\n\n「食べないのか？俺の拳を食らえ！」\n\n_霜晨_
actors.hero.talent$combopackage.name=連撃セット
actors.hero.talent$combopackage.desc=なぜか、敵を連続で殴り続けると、美食を楽しむような快感を味わえる。\n\n近接連撃を一定回数行うと摂食エフェクトを発動できる。\n\n現在の連撃数：%1$d

actors.hero.talent.break_enemy_ranks.title=陷陣之志
actors.hero.talent.break_enemy_ranks.desc=_+1：_視界内の敵1体ごとに英雄に_0~3の防具_を提供する。\n\n_+2：_視界内の敵1体ごとに英雄に_1~4の防具_を提供する。
actors.hero.talent.break_enemy_ranks.comment=

actors.hero.talent.hunting_intuition.title=狩猟直感
actors.hero.talent.hunting_intuition.desc=_+1：_忍者が投擲武器を鑑定する速度が元の_3倍_になる。\n\n_+2：_忍者が_投擲武器で敵に命中させた時_即座にそれを鑑定_できる。
actors.hero.talent.hunting_intuition.comment=「投擲武器を熟練して使えなければ、忍者と言えるのか？」

actors.hero.talent.revelation.title=天啓
actors.hero.talent.revelation.desc=_+1：_聖典が呪文_天啓_を放てるようになる。_1チャージ消費_で_3ターンの天啓_を得て、自身の持つ_正の才能効果レベルを+1_する。\n\n_+2：_聖典が呪文_天啓_を放てるようになる。_1チャージ消費_で_5ターンの天啓_を得て、自身の持つ_正の才能効果レベルを+1_する。
actors.hero.talent.revelation.comment=才能効果レベルは制限レベルを超えない。\n\n「才能弱体化？取るに足らない。」

actors.hero.talent.holy_grenade.title=神聖手榴弾
actors.hero.talent.holy_grenade.desc=_+1：_聖典が呪文_神聖手榴弾_を放てるようになる。_1チャージ消費_で目標_3x3範囲_の敵に_15~30_ダメージ。\n\n_+2：_聖典が呪文_神聖手榴弾_を放てるようになる。_1チャージ消費_で目標_3x3範囲_の敵に_20~40_ダメージ。\n\n_+3：_聖典が呪文_神聖手榴弾_を放てるようになる。_1チャージ消費_で目標_5x5範囲_の敵に_20~40_ダメージ。
actors.hero.talent.holy_grenade.comment=神聖手榴弾は_アンデッドと悪魔属性_の敵に必ず最大ダメージを与える。\n\n「ハー...レルヤ...」

actors.hero.talent.blade_star.title=刃の階段
actors.hero.talent.blade_star.desc=_+1：_聖典が呪文_刃の階段_を放てるようになる。_1チャージ消費_で_3x3範囲_、_10ターン持続_の刃のエリアを創造する。\n\n_+2：_聖典が呪文_刃の階段_を放てるようになる。_1チャージ消費_で_5x5範囲_、_10ターン持続_の刃のエリアを創造する。\n\n_+3：_聖典が呪文_刃の階段_を放てるようになる。_1チャージ消費_で_7x7範囲_、_10ターン持続_の刃のエリアを創造する。
actors.hero.talent.blade_star.comment=刃のエリアは毎ターン敵に4~8の防御無視ダメージを与え、_1ターンの廃疾_を与える。

actors.hero.talent.sacred_blade.title=黄金回旋
actors.hero.talent.sacred_blade.desc=_+1：_聖典が呪文_黄金回旋_を放てるようになる。_1チャージ消費_で目標に_近接武器ベースの魔法ダメージ_を与える。\n\n_+2：_1に加え、_アンデッドと悪魔属性_の敵に必ず最大ダメージを与える。\n\n_+3：_1と2に加え、_アンデッドと悪魔属性_の敵へのダメージが追加で_30%増加_する。
actors.hero.talent.sacred_blade.comment=「某鉄球ではない。」

actors.hero.talent.equipment_bless.title=装備祝福
actors.hero.talent.equipment_bless.desc=_+1：_聖典が呪文_装備祝福_を放てるようになる。_1チャージ消費_で_50ターンの装備祝福_を得て、全ての武器と防具に_1レベルの追加レベル_を与える。\n\n_+2：_聖典が呪文_装備祝福_を放てるようになる。_1チャージ消費_で_50ターンの装備祝福_を得て、全ての武器と防具に_2レベルの追加レベル_を与える。
actors.hero.talent.equipment_bless.comment=「神造の物。」

actors.hero.talent.hotlight.title=灼熱強光
actors.hero.talent.hotlight.desc=_+1：_聖典が呪文_灼熱強光_を放てるようになる。_3チャージ消費_で視界内の英雄と味方以外の目標に_3ターンの失明_を与え、_アンデッドと悪魔属性_の敵に_3ターンの燃焼_を与える。\n\n_+2：_聖典が呪文_灼熱強光_を放てるようになる。_2チャージ消費_で視界内の英雄と味方以外の目標に_3ターンの失明_を与え、_アンデッドと悪魔属性_の敵に_3ターンの燃焼_を与える。
actors.hero.talent.hotlight.comment=「閃光弾を投げろ！」

actors.hero.talent.healattack.title=聖癒の一撃
actors.hero.talent.healattack.desc=_+1：_物理攻撃で聖輝を得た敵を攻撃すると_3HP回復_する。\n\n_+2：_物理攻撃で聖輝を得た敵を攻撃すると_英雄レベルの30%のHP_を回復する。
actors.hero.talent.healattack.comment=「主のご加護がありますように(ボスッ—)。」

actors.hero.talent.eat_mind.title=食人心智
actors.hero.talent.eat_mind.desc=_+1：_杖または魔杖で1ポイントの魔法ダメージを与えるごとに_0.2の満腹度_を回復する。\n\n_+2：_杖または魔杖で1ポイントの魔法ダメージを与えるごとに_0.3の満腹度_を回復する。
actors.hero.talent.eat_mind.comment=「見微知著、食人心智。」\n\n_霜晨_

actors.hero.talent.disabliity_posion.title=障害毒雲
actors.hero.talent.disabliity_posion.desc=_+1：_酸蝕の杖の呪文で発生する腐食酸霧_の初期ダメージが2点上昇_し、さらに_ガス量が30%増加_する。\n\n_+2：_1に加え、腐食酸霧内の敵は継続的に_1ターンの廃疾_を得る。\n\n_+3：_1と2に加え、腐食酸霧内の敵は継続的に_1ターンの弱体と恍惚_を得る。
actors.hero.talent.disabliity_posion.comment=

actors.hero.talent.light_crop.title=雷雨で作物が育つ
actors.hero.talent.light_crop.desc=_+1：_電界の中で、通常の空き地は_草が生え_、余燼や草は_高い草が生える_。\n\n_+2：_1に加え、雷霆の杖で呪文を唱える時、その位置に_この才能のLv1の草を生やす_効果を与える。
actors.hero.talent.light_crop.comment=「N2+O2放電で2NOを生成。」\n「2NO+O2で2NO2を生成。」\n「3NO2+H2Oで2HNO3+NOを生成。」

actors.hero.talent.devil_flame.title=悪魔の焔
actors.hero.talent.devil_flame.desc=_+1：_焔浪の杖で呪文を唱える時、_元のチャージ消費が1の場合_、_チャージ消費-1_。\n\n_+2：_焔浪の杖で呪文を唱える時、_元のチャージ消費が1以上の場合_、_チャージ消費-1_。\n\n_+3：_2に加え、焔浪の杖の呪文ダメージが_20%_増加し、炎の滞留時間が_1ターン延長_される。
actors.hero.talent.devil_flame.comment=この才能によるチャージ消費の減少は焔浪の杖の呪文ダメージに影響せず、元のチャージ消費に基づいて計算される。

actors.hero.talent.fast_break.title=経験蓄積
actors.hero.talent.fast_break.desc=_+1：_敵のドロップ経験値と戦利品の_最大レベル_2_。\n\n_+2：_敵のドロップ経験値と戦利品の_最大レベル_3_。
actors.hero.talent.fast_break.comment=「財...分身...幽妹...俺はまだ...裂ける...」

actors.hero.talent.crazy_dancer.title=狂乱の踊り手
actors.hero.talent.crazy_dancer.desc=_+1：_英雄が敵の物理ダメージを回避した時、敵は_2ターンの狂乱_を得る。\n\n_+2：_英雄が敵の物理ダメージを回避した時、敵は_3ターンの狂乱_を得る。
actors.hero.talent.crazy_dancer.comment=「もうやめてください！」

actors.hero.talent.throwing_recycling.title=投擲回収
actors.hero.talent.throwing_recycling.desc=_+1：_物理攻撃で_中矢状態_の敵を攻撃した時_25%の確率_で敵に刺さった投擲武器を回収できる。\n\n_+2：_物理攻撃で_中矢状態_の敵を攻撃した時_50%の確率_で敵に刺さった投擲武器を回収できる。\n\n_+3：_物理攻撃で_中矢状態_の敵を攻撃した時_75%の確率_で敵に刺さった投擲武器を回収できる。
actors.hero.talent.throwing_recycling.comment=「理論上の無限斧連続投擲。」

actors.hero.talent.falsehood_power.title=虚偽の力
actors.hero.talent.falsehood_power.desc=_+1：_筋力_-1_。超力の武器や防具を装備する時の筋力ペナルティ計算で_筋力ペナルティを3軽減_する。\n\n_+2：_筋力_-1_。超力の武器や防具を装備する時の筋力ペナルティ計算で_筋力ペナルティを4軽減_する。
actors.hero.talent.falsehood_power.comment=「虚偽の力だが、本物よりも強力だ。」

actors.hero.talent.flame_incarnation.title=炎燼化身
actors.hero.talent.flame_incarnation.desc=_+1：_燃焼状態_の敵を倒した後、_10%の確率で炎の元素1体を召喚_して味方にする。\n\n_+2：_燃焼状態_の敵を倒した後、_20%の確率で炎の元素1体を召喚_して味方にする。\n\n_+3：_燃焼状態_の敵を倒した後、_30%の確率で炎の元素1体を召喚_して味方にする。
actors.hero.talent.flame_incarnation.comment=この才能で生成された炎の元素の属性はフロアの影響を受ける。

actors.hero.talent.marksman.title=魔弾射手
actors.hero.talent.marksman.desc=_+1：_魔弾の杖の呪文でレベルが上がった杖は、次に呪文を唱える時_チャージを消費しない_。\n\n_+2：_1に加え、魔弾の杖の_呪文ダメージ+3_。
actors.hero.talent.marksman.comment=この才能のチャージ不消費特性は魔弾の杖自体には無効。\n\n「豌豆射手ってどういう意味だ？」

actors.hero.talent.spider_sense.title=蜘蛛感応
actors.hero.talent.spider_sense.desc=_+1：_英雄が視界外からの攻撃を受けると_1ターンのタイムバブル_を得る。\n\n_+2：_英雄が視界外からの攻撃を受けると_2ターンのタイムバブル_を得る。
actors.hero.talent.spider_sense.comment=「ピーターのビクッと感。」

actors.hero.talent.no_more_mob.title=NO集群
actors.hero.talent.no_more_mob.desc=_+1：_視界外で眠っている敵が集群知能の発動時、_50%の確率_で目覚めない。\n\n_+2：_1に加え、これにより目覚めた敵は_徘徊状態_に入り、英雄の位置を特定しない。
actors.hero.talent.no_more_mob.comment=「もう二度とレベル3の集群は使わない。」

actors.hero.talent.kebi.title=刻筆・ブライアント
actors.hero.talent.kebi.desc=_+1：_奥術刻筆で_武器にエンチャントを付与_できるようになる。\n\n_+2：_1に加え、奥術刻筆で_強力なエンチャント/刻印を付与する確率が上昇_する。
actors.hero.talent.kebi.comment=「ブライアントは小成を遂げたエンチャント師で、多くの強力なエンチャントと刻印を生み出した。残念ながらこのエンチャント師は浮遊刻印のデモ中に不幸にも墜落死し、その後この刻印の研究は禁止されてしまった。」

actors.hero.talent.ice_meal.title=氷能一食
actors.hero.talent.ice_meal.desc=_+1：_摂食にかかる時間が_1ターン_になり、_2ターンの寒霜の力_を得る。\n\n_+2：_摂食にかかる時間が_1ターン_になり、_4ターンの寒霜の力_を得る。\n\n_+3：_2に加え、摂食時に英雄の周囲の生物に_10ターンの凍結_を与える。
actors.hero.talent.ice_meal.comment=

actors.hero.talent.more_favors.title=さらなる恩義
actors.hero.talent.more_favors.desc=_+1：_トロル鍛冶屋クエストでダークゴールド1個につき情誼_25増加_。\n\n_+2：_トロル鍛冶屋クエストでダークゴールド1個につき情誼_50増加_、情誼上限が3000_から5000_に上昇。
actors.hero.talent.more_favors.comment=“口は悪いが人は良い。”

actors.hero.talent.hardware_elements.title=金属元素
actors.hero.talent.hardware_elements.desc=_+1：_元素の残り火が召魔晶柱の錬成時に消費されなくなるが、錬成に必要な_錬金エネルギー消費が20_に上昇。\n\n_+2：_元素の残り火が召魔晶柱の錬成時に消費されなくなるが、錬成に必要な_錬金エネルギー消費が15_に上昇。\n\n_+3：_元素の残り火が召魔晶柱の錬成時に消費されなくなり、錬成に必要な_錬金エネルギー消費も上昇しなくなる。
actors.hero.talent.hardware_elements.comment=“無限のエネルギーを得ることも錬金術の目的の一つだ。”

actors.hero.talent.static_light.title=静滞電流
actors.hero.talent.static_light.desc=_+1：_スペルダメージ_1_、スタッフまたはワンドで敵に魔法攻撃時、追加で_ダメージ5%ターンの麻痺_を与える。\n\n_+2：_スペルダメージ_2_、スタッフまたはワンドで敵に魔法攻撃時、追加で_ダメージ7.5%ターンの麻痺_を与える。
actors.hero.talent.static_light.comment=このタレントが与える麻痺ターン数は切り捨てられる。\n\n“これは雷電法王への小さな一歩だ。”

actors.hero.talent.miracle_alchemy.title=奇跡の錬金
actors.hero.talent.miracle_alchemy.desc=_+1：_錬金時に_20%の確率_で追加で1個の錬金産物を錬成。\n\n_+2：_錬金時に_40%の確率_で追加で1個の錬金産物を錬成。
actors.hero.talent.miracle_alchemy.comment=このタレントは装飾品、煮込み肉、熟成無味果、筋肉記憶薬、注魔秘巻、全爆弾、液金、聖典抄本、根骨秘薬、注魔菱晶、変異結晶の錬成には効果がない。\n\n“錬金自体が奇跡だ、私は錬金が大好きだ。”

actors.hero.talent.hungry_ghost.title=餓鬼道
actors.hero.talent.hungry_ghost.desc=_+0：_空腹ダメージを受けると_怨霊を1体生成_し、怨霊攻撃を受けると_満腹度を5減少_。\n\n_+1：_空腹ダメージを受けると_怨霊を1体生成_。\n\n_+2：_空腹ダメージを受けても怨霊を生成しなくなる。
actors.hero.talent.hungry_ghost.comment=

actors.hero.talent.unable_rest.title=安息不能
actors.hero.talent.unable_rest.desc=_+0：_アンデッドとデーモン属性_の敵が致死ダメージを受けると_HP1_で耐え、_最大HP10%のシールド_を得る。\n\n_+1：_アンデッドとデーモン属性_の敵が致死ダメージを受けると_HP1_で耐える。\n\n_+2：_アンデッドとデーモン属性の敵が致死ダメージを受けるとそのまま消滅する。
actors.hero.talent.unable_rest.comment=このタレントは元から復活能力を持つ敵（ドワーフグールなど）およびボス敵には効果がない。

actors.hero.talent.cursedman.title=呪われし者
actors.hero.talent.cursedman.desc=_+0：_アイテムに_アップグレードの巻物、注魔秘巻、エンチャントルーン、または秘術の刻みペン_を使用するとアイテムが呪われる。\n\n_+1：_アイテムに_エンチャントルーンまたは秘術の刻みペン_を使用するとアイテムが呪われる。\n\n_+2：_アイテムにアップグレードの巻物、注魔秘巻、エンチャントルーン、秘術の刻みペンを使用しても呪われなくなる。
actors.hero.talent.cursedman.comment=

actors.hero.talent.usury.title=高利貸
actors.hero.talent.usury.desc=_+0：_2000ゴールドを入手？とにかく英雄が階層を降りるごとに_200ゴールド_の利息が引かれる。\n\n_+1：_利息が_150ゴールド_に低下。\n\n_+2：_利息が引かれなくなる。
actors.hero.talent.usury.comment=
actors.hero.talent.usury.nomoney=思いもよらないだろ！店主がローンの一部を横領した！
actors.hero.talent.usury.principal=これは店主が君に申し込んだ高利貸だ。
actors.hero.talent.usury.interest=毎階層利息を支払う、%dゴールド。

actors.hero.talent.armed_uprising.title=極悪中隊
actors.hero.talent.armed_uprising.desc=_+1：_味方の物理攻撃が英雄の持つ大部分の_物理攻撃特効_と同期する。\n\n_+2：_1に加えて、味方の物理攻撃が英雄の持つ大部分の_物理攻撃増傷_とも同期する。
actors.hero.talent.armed_uprising.comment=このタレントの同期効果は主に英雄が持つタレントや英雄自身の特性に依存する。\n\n“全軍、出撃！”

actors.hero.talent.dungeon_hero.title=ダンジョンヒーロー
actors.hero.talent.dungeon_hero.desc=_+1：_クエストNPCや各エリアの商人と初めて交流する際、_低級ドロップ品2個_を獲得。\n\n_+2：_クエストNPCや各エリアの商人と初めて交流する際、_中級ドロップ品2個_を獲得。
actors.hero.talent.dungeon_hero.comment=“エメラルドやアイテムでの取引は受け付けない。”

actors.hero.talent.exp_solid.title=経験値固定化
actors.hero.talent.exp_solid.desc=_+1：_英雄レベルを_1低下_させ、_経験薬を1本_獲得。\n\n_+2：_英雄レベルを_2低下_させ、_経験薬を2本_獲得。
actors.hero.talent.exp_solid.comment=このタレントはリソース取得回数が上限に達した後にアップグレードしても英雄レベルを低下させることができる。このようにアップグレードや変異で直接リソースを得るタレントは_26回の制限_(紳士は_39回_)を共有する。\n\n“弱くなった？いや、強くなったんだ（富の指輪を装着）。”

actors.hero.talent.wealth_statue.title=富の石像
actors.hero.talent.wealth_statue.desc=_+1：_生きた石像とアーマー石像が死亡すると_レベル2のランダム指輪_をドロップし、召喚守衛が死亡すると_レベル1のランダム指輪_をドロップ。\n\n_+2：_生きた石像とアーマー石像が死亡すると_レベル3のランダム指輪_をドロップし、召喚守衛が死亡すると_レベル2のランダム指輪_をドロップ。\n\n_+3：_生きた石像とアーマー石像が死亡すると_レベル4のランダム指輪_をドロップし、召喚守衛が死亡すると_レベル3のランダム指輪_をドロップ。
actors.hero.talent.wealth_statue.comment=このタレントで得た指輪は未鑑定状態となる。また、このタレントのリソース取得回数は_16回に制限_(紳士は_39回_)され、この制限はアップグレードや変異で直接リソースを得る大半のタレントと共有される。

actors.hero.talent.sweet_sleep.title=美夢長眠
actors.hero.talent.sweet_sleep.desc=_+1：_奇襲時に_30%の追加ダメージ_を与える。\n\n_+2：_奇襲時に_40%の追加ダメージ_を与える。
actors.hero.talent.sweet_sleep.comment=“死は恐ろしくない、死は涼やかな夏の夜、人は憂いなく安らかに眠れる。”

actors.hero.talent.light_shock.title=光明震憾
actors.hero.talent.light_shock.desc=_+1：_プリズムスタッフを_1本_入手。プリズムスタッフの魔法が盲目を与えると同時に_スタッフレベルの50%ターンの不具_を与える。魔法前に目標が既に盲目の場合でも不具を与える。\n\n_+2：_1に加えて（リソース取得を除く）、プリズムスタッフで盲目を与えるか盲目の目標に魔法を行使する際、ダメージが_30%_上昇。
actors.hero.talent.light_shock.comment=このようにアップグレードや変異で直接リソースを得るタレントは_26回の制限_(紳士は_39回_)を共有する。\n\n“威光を手に、世の悪を掃討するために。”

actors.hero.talent.boozy.title=酒を命のように愛す
actors.hero.talent.boozy.desc=_+1：_薬剤を飲むと追加で_HP5回復_と毎ターン減衰する_0～5の樹皮_を得る。\n\n_+2：_薬剤を飲むと追加で_HP10回復_と毎ターン減衰する_0～10の樹皮_を得る。
actors.hero.talent.boozy.comment=“薬剤は美酒の如し、古いほど香醇になる。”

actors.hero.talent.shadow_killer.title=陰影の殺し屋
actors.hero.talent.shadow_killer.desc=_+1：_奇襲による_ダメージ補正が35%_に上昇し、追加で_敵装甲の100%_のダメージを与える。\n\n_+2：_奇襲による_ダメージ補正が100%_に上昇し、追加で_敵装甲の150%_のダメージを与える。
actors.hero.talent.shadow_killer.comment=

actors.hero.talent.kill_spree.title=殺戮の宴
actors.hero.talent.kill_spree.desc=_+1：_英雄が物理攻撃で敵を倒すと_敵の最大HP1%のHP回復_と_2ターンのアーティファクト充填_を得る。\n\n_+2：_英雄が物理攻撃で敵を倒すと_敵の最大HP1.5%のHP回復_と_3ターンのアーティファクト充填_を得る。
actors.hero.talent.kill_spree.comment=

actors.hero.talent.seaofpeople.title=人波怒涛
actors.hero.talent.seaofpeople.desc=_+1：_視界内の敵1体につき、移動速度_30%増加_。\n\n_+2：_視界内の敵1体につき、移動速度_45%増加_。
actors.hero.talent.seaofpeople.comment=

actors.hero.talent.phantom_step.title=幻影迷歩
actors.hero.talent.phantom_step.desc=_+1：_インビジブルまたは影隠れを解除後、_3ターンの超加速_と_1ターンの幻影迷歩_（全攻撃を必ず回避）を獲得。\n\n_+2：_インビジブルまたは影隠れを解除後、_5ターンの超加速_と_2ターンの幻影迷歩_（全攻撃を必ず回避）を獲得。
actors.hero.talent.phantom_step.comment=このタレントが_+1/+2_レベルの時、英雄が既に_6/10ターン_以上の超加速効果を持っている場合、このタレントで超加速効果の持続時間をさらに延ばせない。\n\n_再構築されたダンジョン_からの新たな力！
actors.hero.talent$phantomstep.name=幻影迷歩
actors.hero.talent$phantomstep.desc=全ての盗賊ギルドメンバーが憧れる至高の境地、それがこの能力の獲得だ。\n\nこの効果の影響下では、あらゆる物理または魔法攻撃を回避する。\n\n効果残り時間：%sターン

actors.hero.talent.steam_bean.title=蒸気豆
actors.hero.talent.steam_bean.desc=_+0：_敵への初回物理攻撃で英雄が_8ターンの朦朧_状態になる。\n\n_+1：_敵への初回物理攻撃で英雄が_4ターンの朦朧_状態になる。\n\n_+2：_物理攻撃で敵を攻撃しても英雄が朦朧状態にならなくなる。
actors.hero.talent.steam_bean.comment=

actors.hero.talent.alchemy_accident.title=錬金事故
actors.hero.talent.alchemy_accident.desc=_+0：_錬金産物を錬成すると_20%の確率_で英雄を中心に爆発が発生。\n\n_+1：_錬金産物を錬成すると_10%の確率_で英雄を中心に爆発が発生。\n\n_+2：_錬金が安全になる。
actors.hero.talent.alchemy_accident.comment=

actors.hero.talent.shell_cry.title=結晶化殻
actors.hero.talent.shell_cry.desc=_+0：_英雄の装甲がHP低下に伴って低下し、最大_100%_低下。\n\n_+1：_英雄の装甲がHP低下に伴って低下し、最大_50%_低下。\n\n_+2：_英雄の装甲がHP低下に伴って低下しなくなる。
actors.hero.talent.shell_cry.comment=

actors.hero.talent.mal_curse.title=悪辣な呪い
actors.hero.talent.mal_curse.desc=_+0：_呪われた装備は_レベルが2低下_。\n\n_+1：_呪われた装備は_レベルが1低下_。\n\n_+2：_呪いが装備レベルに影響しなくなる。
actors.hero.talent.mal_curse.comment=このタレントは装備レベルをマイナス等級まで低下させることができる。\n\n_オリジナルピクセルダンジョン_からの強力な呪い！

actors.hero.talent.thunder_strike.title=雷霆打撃
actors.hero.talent.thunder_strike.desc=このタレントをアップグレードすると、物理攻撃に_与ダメージの50%_の電撃が追加される（英雄と味方は電撃ダメージを受けない）。電撃は攻撃目標に隣接する生物に連鎖する（攻撃者は連鎖しない）。攻撃目標が水中にいるか、英雄が_スタッフまたはアーティファクト充填効果_を持つ場合、連鎖距離+1。\n\n_+1：_電撃が_連鎖した後続の敵のみ_にダメージを与える。\n\n_+2：_電撃が_連鎖した全ての敵_にダメージを与える。
actors.hero.talent.thunder_strike.comment=“DM-300も故障ロボットだって言ってるんだが、わかる人いる？”

actors.hero.talent.directional_collapse.title=定向陥没
actors.hero.talent.directional_collapse.desc=_+1：_スタッフまたはワンド_3回魔法を唱えるごと_に、魔法目標の周囲に大量の落石を発生させ、_10～20_の装甲無視ダメージと_3ターンの麻痺_を与える。\n\n_+2：_スタッフまたはワンド_2回魔法を唱えるごと_に、魔法目標の周囲に大量の落石を発生させ、_10～20_の装甲無視ダメージと_3ターンの麻痺_を与える。
actors.hero.talent.directional_collapse.comment=このタレントが発生させる落石は英雄と味方にダメージや麻痺を与えない。
actors.hero.talent$directionalcollapse.name=定向陥没
actors.hero.talent$directionalcollapse.desc=DM-300の高出力ドリルビットから砕け落ちた金属片は、金属残骸から回収した邪能の欠片とはどこか違うようだ。指で触れた瞬間、すぐに消え去ってしまった。これが何を意味するのかは分からないが、背中のスタッフが少し強くなった気がする。\n\n%s回魔法を唱えるごとに定向陥没が発生し、魔法目標の周囲に大量の落石を発生させ、10～20の装甲無視ダメージと3ターンの麻痺を与える。幸運なことに、これらの落石は君と味方には無効だ。\n\n現在の施法回数：%s

#新魔法
actors.hero.spells.ascension_curse.name=浮遊呪
actors.hero.spells.ascension_curse.short_desc=術者に浮遊効果をもたらす。
actors.hero.spells.ascension_curse.desc=術者が呪文を唱えて短時間自身を軽くし、_%1$dターン_浮遊できる。\n\nこの魔法は詠唱に_3ターン消費_する。

actors.hero.spells.divine_protection.name=神の加護
actors.hero.spells.divine_protection.short_desc=術者を短時間無敵にする。
actors.hero.spells.divine_protection.desc=術者が聖典の力で神の加護を祈り、応えを得て自身が_%1$dターン_無敵になる。\n\nこの魔法は詠唱に_3ターン消費_する。

actors.hero.spells.shepherd_intention.name=牧羊の原旨
actors.hero.spells.shepherd_intention.short_desc=指定地点に魔法の羊の群れを出現させる。
actors.hero.spells.shepherd_intention.desc=術者は聖典を借りて体内の魔力を凝縮し、指定位置に召喚する…魔法の羊の群れ？まあいい、少なくとも殺されはしない。\n\nこの魔法は詠唱に_3ターン消費_する。

actors.hero.spells.conversion_holy.name=聖法改宗
actors.hero.spells.conversion_holy.short_desc=1体の目標を堕落させる。
actors.hero.spells.conversion_holy.no_target=堕落させられる目標がない。
actors.hero.spells.conversion_holy.desc=術者は聖典の神力を示し、目標を聖なる教えに改宗させ、術者に忠実な僕とする。\n\nこの魔法で堕落させた敵はドロップ品を落とさない。\n\nこの魔法は詠唱に_3ターン消費_する。

actors.hero.spells.purifying_evil.name=邪悪浄化
actors.hero.spells.purifying_evil.short_desc=1体の目標を浄化する。
actors.hero.spells.purifying_evil.no_target=浄化できる目標がない。
actors.hero.spells.purifying_evil.desc=術者は聖典の巨大な聖なる力で敵を浄化し、その強化効果を消し去り、エリート効果さえも除去し、アンデッドとデーモン属性の敵にダメージを与える。\n\nこの魔法は詠唱に_3ターン消費_する。

actors.hero.spells.divine_storm.name=神力領域嵐
actors.hero.spells.divine_storm.short_desc=強力な神力領域を生み出し敵を裁く。
actors.hero.spells.divine_storm.desc=術者は聖典を引き金に、強力な神力領域を生み出し敵を麻痺させ、さらに灼き尽くす。\n\nこの魔法は詠唱に_3ターン消費_する。

actors.hero.spells.genesis.name=創世術
actors.hero.spells.genesis.short_desc=自身のタレント能力をリセットする。
actors.hero.spells.genesis.desc=術者は神が世界を創造したように、自身を再構築する。\n\nこの魔法は詠唱に_3ターン消費_する。

actors.hero.spells.indulgence.name=贖宥状
actors.hero.spells.indulgence.short_desc=ゴールドを消費して聖典の充填を回復する。
actors.hero.spells.indulgence.desc=術者は_%1$dゴールド_を消費し、自身の罪を洗い清め、聖典の充填を回復する。\n\nこの魔法は詠唱に_3ターン消費_する。\n\nこの魔法は聖典抄本には効果がない。
actors.hero.spells.indulgence.no_tome=聖典がなければ、君の悔い改めは無意味だ。

actors.hero.spells.silver_language.name=銀光の鋭き言葉
actors.hero.spells.silver_language.short_desc=目標を短時間狂乱させる。
actors.hero.spells.silver_language.no_target=これで狂乱する目標はいない。
actors.hero.spells.silver_language.desc=術者が目標に聖典の文言を大声で唱えると、目標はその場で防御を崩され、_%1$dターン_狂乱する。\n\nこの魔法は詠唱に_3ターン消費_する。

actors.hero.spells.resurrection.name=復活術
actors.hero.spells.resurrection.short_desc=目標が短時間内に死亡すると復活する。
actors.hero.spells.resurrection.no_target=その目標に魔法をかけられない。
actors.hero.spells.resurrection.desc=術者は聖典の偉大な力を借り、自身または味方に強力な復活術をかける。短時間内に死亡すると復活できる。\n\nこの魔法は詠唱に_3ターン消費_する。
actors.hero.spells.resurrection$resurrection.name=死者蘇生
actors.hero.spells.resurrection$resurrection.desc=このキャラクターは死亡後に復活する！\n\nこの効果を受けた味方が効果持続中に死亡すると、最良の状態で復活する。\n\nこの効果を受けたのが英雄の場合、効果持続中に死亡しても復活するが、HPは最大1までしか残らない。\n\n残りターン数：%s

actors.hero.spells.traitorous_spell.name=奸奇呪法
actors.hero.spells.traitorous_spell.short_desc=呪われたワンド効果を解放する。
actors.hero.spells.traitorous_spell.desc=術者は奸奇神選の呪術を用いて、目標にランダムな呪い効果をかける。\n\nこの魔法は詠唱に_3ターン消費_する。

actors.hero.spells.sprint_spell.name=神行術
actors.hero.spells.sprint_spell.short_desc=自身に超加速効果を与える。
actors.hero.spells.sprint_spell.desc=術者は呪文を放ち、神行太保戴宗のように日行千里の速さを得る。自身に_%1$dターンの超加速_を付与する。\n\nこの魔法は詠唱に_3ターン消費_する。

actors.hero.spells.focus_light.name=集束光線
actors.hero.spells.focus_light.short_desc=高温光線を放ち、全てを焼き尽くす。
actors.hero.spells.focus_light.desc=術者は高温光線を放ち、_%1$d～%2$dのダメージ_を与え、経路と目標を燃やす。\n\nこの魔法は詠唱に_3ターン消費_する。

actors.hero.spells.zhuanyu_spell.name=転癒聖術
actors.hero.spells.zhuanyu_spell.short_desc=シールドを治療量に変換する。
actors.hero.spells.zhuanyu_spell.desc=術者のシールドを_%d%%_の比率で治療効果に変換する。治療総量は最大HPの半分を超えない。\n\nこの魔法は詠唱に_3ターン消費_する。

actors.hero.spells.thorn_whip.name=荊棘の鞭
actors.hero.spells.thorn_whip.short_desc=目標を引き寄せて出血を与える。
actors.hero.spells.thorn_whip.no_target=引き寄せられる目標がいないか、その目標は引き寄せられない。
actors.hero.spells.thorn_whip.more_distance=距離が遠すぎて届かない。
actors.hero.spells.thorn_whip.desc=術者の手に棘付きの金の鞭が現れ、目標を引き寄せ_初期値%1$dの出血_を追加する。\n\nこの魔法の距離制限は_12マス_。\n\nこの魔法は詠唱に_3ターン消費_する。

actors.hero.spells.revelation.name=天啓
actors.hero.spells.revelation.short_desc=自身の既存の正面タレントレベルを上昇させる。
actors.hero.spells.revelation.desc=術者は天の啓示を受け、_%1$dターンの天啓_を得て、自身の既存の_正面タレント効果レベル+1_。\n\nタレント効果レベルは制限レベルを超えない。\n\nこの魔法は詠唱に_時間を消費しない_。
actors.hero.spells.revelation$revelationbuff.name=天啓
actors.hero.spells.revelation$revelationbuff.desc=天の啓示を得た気がする。全ての既存の正面タレント効果レベル+1。\n\n残りターン数：%sターン

actors.hero.spells.holy_grenade.name=神聖手榴弾
actors.hero.spells.holy_grenade.short_desc=爆発を起こし、敵を殺傷する。
actors.hero.spells.holy_grenade.desc=術者はエネルギー光球を投げ、着地点の_%1$dx%1$d_範囲に_%2$d～%3$dのダメージ_を与える。アンデッドとデーモン目標は必ず最大ダメージを受ける。\n\nこの魔法は詠唱に_3ターン消費_する。

actors.hero.spells.blade_star.name=刃の階段
actors.hero.spells.blade_star.short_desc=刃の領域を作り出し、敵にダメージと不具を与える。
actors.hero.spells.blade_star.desc=術者は聖光を実体化して刃とし、_%1$dx%1$d_範囲の刃の領域を作る。この領域内の敵は持続的に_4～8のダメージ_を受け、_3ターンの不具_効果を得る。領域は_10ターン_維持される。\n\nこの魔法は詠唱に_3ターン消費_する。
actors.hero.spells.blade_star.invalid_target=その位置には刃の領域を生成できない。
actors.hero.spells.blade_star$blade_stair.name=刃の領域
actors.hero.spells.blade_star$blade_stair.desc=ここは既に刃の領域と化している。刃の領域は持続的にダメージを与え、敵の速度を低下させる。

actors.hero.spells.sacred_blade.name=黄金回旋
actors.hero.spells.sacred_blade.short_desc=聖光で凝縮されたブーメランを投げ、目標に魔法ダメージを与える。
actors.hero.spells.sacred_blade.desc=術者は聖光で凝縮されたブーメランを投げ、目標に_手にした武器に基づく魔法ダメージ_を与える。アンデッドとデーモン目標は追加ダメージ補正を受ける。\n\nこの魔法は詠唱に_3ターン消費_する。

actors.hero.spells.equipment_bless.name=装備祝福
actors.hero.spells.equipment_bless.short_desc=全ての武器と防具を強化する。
actors.hero.spells.equipment_bless.desc=術者は全ての武器と防具を祝福し、そのレベルを一時的に上昇させる。\n\nこの魔法は詠唱に_3ターン消費_する。
actors.hero.spells.equipment_bless$blessbuff.name=装備祝福
actors.hero.spells.equipment_bless$blessbuff.desc=身につけた装備が祝福された気がする。\n\n効果持続中、全ての武器と防具のレベルが一時的に上昇する。\n\n残りターン数：%sターン

actors.hero.spells.hotlight.name=灼熱強光
actors.hero.spells.hotlight.short_desc=強光を放ち、敵を盲目にする。
actors.hero.spells.hotlight.desc=術者は灼熱の強光を放ち、視界内の全敵を_3ターン盲目_にする。同時にアンデッドとデーモンの敵は直接燃やされる。\n\nこの魔法は詠唱に_3ターン消費_する。


actors.hero.heroclass.freeman=紳士
actors.hero.heroclass.freeman_desc_short=紳士_はより多くの潜在力を引き出せる_、同時に初期所持品としてユニークな_ブリーフケース_を持つ。
actors.hero.heroclass.freeman_desc=紳士は初期所持品として_ユニークなブリーフケース_を持ち、そこから特殊アイテムや能力を得られる。\n\n紳士は専門的な戦闘訓練を受けておらず、戦闘能力は低いが、_無限の潜在力を引き出せる_。\n\nまた、紳士は初期所持品として_ステッキ_、_幸運の銀貨_、布鎧、水袋、ラグバッグを持つ。\n\n紳士の開始時鑑定アイテム：\n_-_経験薬\n_-_変異の巻物、鑑定の巻物、変成の巻物
actors.hero.heroclass.freeman_unlock=_変異の巻物を使用してタレントを変異_させることで紳士をアンロック。
actors.hero.herosubclass.freeman=紳士
actors.hero.herosubclass.freeman_short_desc=_紳士_は天狗の仮面からさらなる力を得ることはできないが、依然として多くの潜在力が引き出されるのを待っている。
actors.hero.herosubclass.freeman_desc=紳士は天狗の仮面をつけた後、そこから多くの力を得られなかったが、仮面が砕けた後に追加で変異の巻物を1枚入手する。\n\nさらに、紳士にはまだ多くの潜在力が引き出されるのを待っている。


actors.blobs.pheromone.desc=ここにはフェロモンガスが充満しており、英雄を混乱させ、色孽信徒の味方を強化する。
actors.mobs.chaosdisciples$succboss.name=色孽信徒
actors.mobs.chaosdisciples$succboss.desc=色孽信徒はかつてサキュバスであり、小悪魔の友だった。小悪魔の野望を叶えるため、強力な力を求め、混沌の神の色孽信徒となった。\n\n色孽信徒は多数のサキュバスを召喚して戦わせる能力を持つが、この能力は一定時間ごとにしか発動できない。それ以外にも、フェロモンガスを放出し、敵ユニットの英雄への堕落や命尽くす効果を解除し、治療とホルモン活性を与える。同時に英雄とその味方を魅了状態にする。
actors.mobs.chaosdisciples$summoncooldown.name=サキュバス召喚-クールダウン
actors.mobs.chaosdisciples$summoncooldown.desc=色孽信徒はサキュバスを召喚したばかりで、しばらく経たないと再発動できない。\n\n残りクールダウン：%sターン
actors.mobs.chaosdisciples$scorpioboss.name=納垢信徒
actors.mobs.chaosdisciples$scorpioboss.desc=納垢信徒はかつて巨大サソリであり、小悪魔の友だった。小悪魔の野望を叶えるため、強力な力を求め、混沌の神の納垢信徒となった。\n\n納垢信徒は疫病を広めるのが得意で、周囲に致命的なウイルスガスを拡散する。それ以外にも強力な防御力を持ち、物理も魔法も傷つけるのは困難で、遠隔物理ダメージを反射することもできる。ただし_何らかの元素ダメージを受けやすい_ようだ。
actors.mobs.chaosdisciples$scorpioboss.fire=火！火！熱すぎる！
actors.mobs.chaosdisciples$eyeboss.name=奸奇信徒
actors.mobs.chaosdisciples$eyeboss.desc=奸奇信徒はかつてイビルアイであり、小悪魔の友だった。小悪魔の野望を叶えるため、強力な力を求め、混沌の神の奸奇信徒となった。\n\n奸奇信徒は狡猾な奴で、一定時間ごとに古の神のように致命的なレーザーを放つ。それ以外にも恐ろしい黒魔法を放ち英雄の精神を乱し、攻撃を受けるとランダムテレポートを行う。
actors.mobs.chaosdisciples$ripperboss.name=恐虐信徒
actors.mobs.chaosdisciples$ripperboss.desc=恐虐信徒はかつてリッパーであり、小悪魔の友だった。小悪魔の野望を叶えるため、強力な力を求め、混沌の神の恐虐信徒となった。\n\n恐虐信徒は好戦的な奴で、近接攻撃を得意とし、近接戦闘と被弾時に強化効果と連撃効果を得て、その恐ろしい機動力と攻撃頻度をさらに高める。その手にかかった英雄は56体にも上る。
actors.mobs.chaosdisciples$ripperboss.combo=恐虐信徒の現在の連撃数は%d
actors.mobs.chaosdisciples$ripperboss.combotime=、残り連撃時間は%sターン。

actors.mobs.npcs.greatimp.name=小悪魔？
actors.mobs.npcs.greatimp.newyear=新年明けましておめでとう！なぜここにいるのかって？それは重要じゃない、早くお守りを取りに行こう！
actors.mobs.npcs.greatimp.hello=サプライズ！なぜここにいるのかって？それは重要じゃない、早くお守りを取りに行こう！
actors.mobs.npcs.greatimp.amulet=お守りを手に入れたのか？それなら早く家に帰って家族と春節を過ごそう！
#fix9：テキスト修正
actors.mobs.npcs.greatimp.warning=どうやら見つかってしまったようだ。我がここに来たのは古神Yog-Dzewaの残余の力を奪い、全ての悪魔軍団を統率するためだ。次にこのダンジョンを支配し、やがて全世界を征服し始める！ここで我を止めようと無駄な抵抗をするか、それともおとなしく立ち去り残りの人生を楽しむか？
actors.mobs.npcs.greatimp.yes=阻止する！
actors.mobs.npcs.greatimp.no=俺には関係ない
actors.mobs.npcs.greatimp.time=兄弟たち、かかれ！時間を稼いでくれ！
actors.mobs.npcs.greatimp.desc=なぜか、小悪魔がこの場所にやって来る。
actors.mobs.npcs.greatimp.die=時間を稼いでくれてありがとう。今や、我は無敵だ！
actors.mobs.npcs.greatimp.nothing=......

actors.mobs.greatdemon.name=大悪魔
actors.mobs.greatdemon.desc=古神の力を吸収したばかりの小悪魔は、より長い悪魔の角、髭、翼を生やした…もう小悪魔とは呼べず、大悪魔と呼ぶべきだろう。\n\n大悪魔は強靭な肉体を持ち、一定時間ごとに特定の攻撃を無効化し反射する。戦闘魔法の知識に欠けるため各種魔法を駆使するのは難しいが、その近接戦闘能力は極めて凶悪で、さらに他の下級悪魔を召喚して補助させることもできる。
actors.mobs.greatdemon.die=この力、まさかこれほど脆いとは。来日方長！
actors.mobs.greatdemon.throw=我が朗基努斯の槍を受けてみよ！
actors.mobs.greatdemon.melee=我が悪魔斬りを喰らえ！
actors.mobs.greatdemon.summon=我が呼びかけに応じよ、悪魔たちよ！
actors.mobs.greatdemon.defence=皮膚硬化！刀剣も槍も、我を傷つけることはできぬ！
actors.mobs.greatdemon.haste=大悪魔は悪魔の翼を素早く羽ばたかせ、極めて速い速度で飛行する。
actors.mobs.greatdemon.magic=魔力防御、起動！
actors.mobs.greatdemon.missiles=魔法障壁、すべての矢と刃を反射せよ！
actors.mobs.greatdemon$summoncooldown.name=デーモン召喚-クールダウン
actors.mobs.greatdemon$summoncooldown.desc=大悪魔が低級デーモンを2体召喚したばかりだ。しばらく経たないと再発動できない。\n\n残りクールダウン：%sターン
actors.mobs.greatdemon$hastecooldown.name=魔翼加速-クールダウン
actors.mobs.greatdemon$hastecooldown.desc=大悪魔が魔翼を激しく羽ばたかせて加速効果を得たばかりで、今は休憩が必要だ。\n\n残りクールダウン：%sターン
actors.mobs.greatdemon$magiccooldown.name=魔法防御-クールダウン
actors.mobs.greatdemon$magiccooldown.desc=魔法防御は一定時間しか維持できず、しばらく経たないと再発動できない。\n\n残りクールダウン：%sターン
actors.mobs.greatdemon$meleescooldown.name=茨の皮膚-クールダウン
actors.mobs.greatdemon$meleescooldown.desc=茨の皮膚は一定時間しか維持できず、しばらく経たないと再発動できない。\n\n残りクールダウン：%sターン
actors.mobs.greatdemon$missilescooldown.name=飛翔体反射-クールダウン
actors.mobs.greatdemon$missilescooldown.desc=飛翔体反射は一定時間しか維持できず、しばらく経たないと再発動できない。\n\n残りクールダウン：%sターン
actors.mobs.greatdemon$throwcooldown.name=ランキヌスの槍-クールダウン
actors.mobs.greatdemon$throwcooldown.desc=ランキヌスの槍は大悪魔に投擲されたばかりで、しばらく経たないと再発動できない。\n\n残りクールダウン：%sターン
actors.mobs.greatdemon$meleesdefence.name=茨の皮膚
actors.mobs.greatdemon$meleesdefence.desc=一定時間、近接被ダメージを大幅に軽減し、一部のダメージを攻撃者に反射する。\n\n残りターン数：%sターン
actors.mobs.greatdemon$missilesdefence.name=飛翔体反射
actors.mobs.greatdemon$missilesdefence.desc=一定時間、投擲武器のダメージを完全に無効化し、魔法の形で攻撃者に反撃する。\n\n残りターン数：%sターン

actors.mobs.landpiranha.name=巨大陸生ピラニア
actors.mobs.landpiranha.desc=巨大ピラニアは奇妙な魔法の力によって二足を得て空気中でも呼吸できる。何かの天赋の力を弱めれば元の姿に戻るかもしれない。
actors.mobs.landpiranha.discover_hint=特定の負の天赋を持つと、あらゆるダンジョンエリアでこの敵を発見できる。
actors.mobs.phantomlandpiranha.name=幻影陸生ピラニア
actors.mobs.phantomlandpiranha.desc=幻影陸生ピラニアは幻影ピラニアが奇怪な魔法に歪められた希少な変種であり、不気味な半透明の体と魔法の能力を持つ。攻撃を受けるとテレポートし、その能力によって攻守に渡って有利に立ち回る！\n\n倒すのは難しいが、その肉は魔力を持つがゆえに珍重されている。
actors.mobs.phantomlandpiranha.discover_hint=特定の負の天赋を持つと、あらゆるダンジョンエリアでこの敵を発見できる。
actors.mobs.teststatue.name=テスト像
actors.mobs.teststatue.desc=誰がここに置いたのか分からない像だが、やたらと打たれ強い。つい殴りたくなってしまう。

actors.mobs.goldboss$monkmaster.name=武僧宗主
actors.mobs.goldboss$monkmaster.desc=武僧宗主はドワーフ武術の頂点に立つ者で、その能力の限界を見た者はいない。\n\n相手がどんなに速かろうと、武僧宗主は常にそれよりも速い。武僧宗主は卑劣な策略を憎み、怒らせない方が良い。
actors.mobs.goldboss$monkmaster.missileweapon=ちくしょう、手を汚す気か。ならば来い！

actors.mobs.goldboss$goldelemental.name=黄金精霊
actors.mobs.goldboss$goldelemental.desc=黄金精霊は商店の店主がドワーフ王の遺した精霊召喚の術によって召喚した精霊生物である。\n\n黄金精霊は自ら精霊召喚の術を用いて他の精霊生物を召喚でき、英雄の財産を吸い取って自身の力とすることさえできる。さらには無から富を生み出すことも可能だ。
actors.mobs.goldboss$goldelemental.steal=黄金精霊があなたから300ゴールドを吸い取った。
actors.mobs.goldboss$goldelemental.give=黄金精霊があなたのバッグの中に無から400ゴールドを生み出した。
actors.mobs.goldboss$goldgolem.name=黄金ゴーレム
actors.mobs.goldboss$goldgolem.desc=黄金ゴーレムは商店の店主によって改造されたゴーレムで、全身が黄金で作られており、普通のゴーレムよりはるかに威圧的だ。\n\n黄金ゴーレムは通常のゴーレムと比べてテレポート能力を失ったものの、より強い攻防性能を持ち、麻痺生物用の高圧電場を瞬時に放つことすらできる。
actors.mobs.goldboss$goldgolem.electricity=エネルギー漏洩、放出！
actors.mobs.goldboss$electricitycooldown.name=電場放出-クールダウン
actors.mobs.goldboss$electricitycooldown.desc=黄金ゴーレムが電場を放ったばかりで、しばらく経たないと再放出できない。\n\n残りクールダウン：%sターン

actors.mobs.goldboss$thymor.name=大魔導師ティモア
actors.mobs.goldboss$thymor.desc=ティモアは傑出したドワーフの魔術師であり、かつて武僧宗主と協力してドワーフ王の統治を覆そうとした。しかしYog-Dzewa率いる悪魔軍団の恐ろしさを目の当たりにした後、最終的にドワーフ王に帰順し、最前線で悪魔と戦い続けた。今ではドワーフ王の死後、店主と協力してあなたのVendorのお守りを奪い、それによって既に腐敗したドワーフ都城を復興しようとしている。\n\nティモアは黒魔法と大規模な呪いの術に長けており、巨大な悪魔軍団を一瞬で消滅させるのを目撃した者もいる。
actors.mobs.goldboss$thymor.curse=ビリビリ、バリバリ！
actors.mobs.goldboss$thymor.cursedo=呪文を唱えて、放出！
actors.mobs.goldboss$thymor.bolt_kill=あなたはティモアの強力な黒魔法で殺された…
actors.mobs.goldboss$sheepcursecooldown.name=大範囲死の呪い-クールダウン
actors.mobs.goldboss$sheepcursecooldown.desc=死の呪いは敵対生物を瞬時に死に至らしめるが、英雄はこの効果に免疫を持つ。\n\n残りクールダウン：%sターン
actors.buffs.mostdegrade.name=極強劣化呪い
actors.buffs.mostdegrade.desc=強力な暗黒魔法がアップグレードスクロールの装備に注がれた魔力を食い尽くしている！\n\n劣化状態の装備は本来の等級よりも低いものとして扱われる。_元が何級の装備でも1級に低下する_。アイテムの説明も劣化の影響に応じて変化する。\n\nただし、劣化は装備の力量要求、法杖チャージ、投擲武器の耐久度、神器には影響しない。\n\n劣化効果の残り時間：%sターン\n\nティモアによる劣化効果はさらに強力で、浄化スクロールで祓うこともできない。


actors.mobs.npcs.shopboss.name=店主？
actors.mobs.npcs.shopboss.hello=お宝、ゴールド、へへへ（涎）。苦労した甲斐があったぜ。
actors.mobs.npcs.shopboss.warning=何だ？お前も俺の財宝を奪おうってのか？そんなお守りを手に入れたくらいで偉そうにするな。利口なら今すぐ消え失せろ。どうせこのお守りは遅かれ早かれ俺のものになるんだ（邪笑）。
actors.mobs.npcs.shopboss.yes=金があるなら一緒に分け合おう
actors.mobs.npcs.shopboss.no=俺には関係ない
actors.mobs.npcs.shopboss.desc=店主もあなたについてここまで辿り着いたようだ。今は落ち着きなくあちこちを見回して、何かを探しているようだ。

actors.mobs.greatshoper.name=店主
actors.mobs.greatshoper.desc=しばらくぶりに見る商店の店主は、以前とはまるで別人だ。表情と物腰にはその貪欲さと喜びが顕著に表れており、その中にはあなたへの敵意も含まれている。\n\n店主はドワーフの図書館にある秘術を使って自身を万法不侵の状態に改造し、大金を投げつけることを攻撃手段とし、残存するドワーフの強者たちを自身の利益団体に取り込んだ。
actors.mobs.greatshoper$goldcurse.name=黄金の呪い
actors.mobs.greatshoper$goldcurse.desc=黄金の呪いはドワーフの遺した禁術の一つであり、強力で、術者を倒すことでのみ解除できる呪いである。しかし商店の店主は勝手にこの禁術の名前を改変した。\n\n黄金の呪いの影響下では、英雄は毎ターン10ゴールドを失い、ゴールドが100未満の場合は毎ターン5ポイントの生命を失う。他の味方は毎ターン2ポイントの生命を失う。\n\n黄金の呪いは他の来源のダメージを持続ダメージに変換し、呪われた者は逃れ難くなる。
actors.mobs.greatshoper.gold_kill=あなたは金貨で撲殺された…
actors.mobs.greatshoper.no_damage=無駄だ。この魔力の盾では、お前は俺に傷一つ与えられない。
actors.mobs.greatshoper.summon=黄金精霊、武僧宗主、この者を阻め！
actors.mobs.greatshoper.summon1=役立たずどもが！ティモア、俺を守れ。
actors.mobs.greatshoper.phase4=ティモアでもお前を止められないのか。ならば、この財宝共々葬ってやろう！
actors.mobs.greatshoper.die=財宝！俺の財宝！

#新精英強敵描述
actors.buffs.championenemy$corrosion.name=腐食精鋭
actors.buffs.championenemy$corrosion.desc=近接攻撃速度+100%で腐食汚泥効果を持つ。死亡時に周囲に腐食汚泥を撒き散らす。
actors.buffs.championenemy$haste.name=迅敏精鋭
actors.buffs.championenemy$haste.desc=近接攻撃速度+100%、移動速度+50%。
actors.buffs.championenemy$holy.name=神聖精鋭
actors.buffs.championenemy$holy.desc=被ダメージ-25%、死亡時に最大生命値の75%の生命で復活し5ターンの無敵効果を得る。復活後は神聖精鋭属性を失う。
actors.buffs.championenemy$transform.name=変態精鋭
actors.buffs.championenemy$transform.desc=被ダメージ-25%、死亡時に最大生命値の33%の生命で同エリアのランダムな敵に復活する。復活後は変態精鋭属性を失い、ランダムに1種の精鋭属性を得る。

actors.mobs.warriorboss.name=戦士？
actors.mobs.warriorboss.desc=邪悪な古の神は他人の心の奥深くにある欲望を掌握し、それによって彼らを暗黒の道へ誘う。そして戦士…今の彼は見えるもの全てを喰らおうとしている。\n\n戦士？は狂戦士と闘士の戦闘技術に長け、さらには勇者の跳躍も使える。\n\n彼が跳びかかろうとする前に、何とかして_彼の注意を逸らす_方法があるかもしれない。例えば…_食べ物_？
actors.mobs.warriorboss$berserk.name=怒り
actors.mobs.warriorboss$berserk.angered_desc=戦士？の被ダメージの程度が攻撃力を強化する。戦士？が物理ダメージを受けると怒りが蓄積され、より強力な攻撃力を得る。\n\n怒りは時間とともに薄れる。戦士？の生命値が低いほど、怒りの持続時間は長くなる。\n\n現在の怒り：_%.0f%%_\n_+%.0f%%_ダメージ
actors.mobs.warriorboss$combo.name=連撃
actors.mobs.warriorboss$combo.desc=戦士？は連続して敵を打つ過程で徐々に佳境に入り、攻撃が命中するたびに連撃数が1増える。しかし長時間攻撃しないと連撃数はリセットされる。\n\n一定の連撃数に達すると戦士？は受け流しを発動し、大量のシールドを得て次に受ける攻撃を確実に回避する。受け流し発動後は連撃数がリセットされる。\n\n現在の連撃数：_%1$d_\n\n連撃は_%2$s_ターン後に失われる。
actors.mobs.warriorboss.eat=この食べ物は本当に美味いな。
actors.mobs.warriorboss.def=俺も機敏なんだぜ！
actors.mobs.warriorboss.wantjump=くそ、足が短いって馬鹿にしてるのか？！
actors.mobs.warriorboss.wantfood=食べ物、美味い食べ物…
actors.mobs.warriorboss.leap=肉玉ねぎ丼！
actors.mobs.warriorboss.defeated=まだ…たくさん美味いものを食べてない…
actors.mobs.warriorboss.wake=何だ？飯か？
actors.mobs.warriorboss.kill=あなたは戦士？の肉玉ねぎ丼で肉餅にされた…

actors.mobs.rogueboss.name=盗賊？
actors.mobs.rogueboss.desc=邪悪な古の神は他人の心の奥深くにある欲望を掌握し、それによって彼らを暗黒の道へ誘う。そして盗賊…今の彼は天狗の面を賞金任務の報酬として手に入れ、欣喜雀躍している。どうやら牢屋の親玉の天狗は彼に殺されたようだ。\n\n盗賊？は暗影からの致命的な一撃に長け、不利な状況では敏速な身のこなしで素早く離脱し、手の中の剣を投擲武器として攻撃する。\n\n彼が暗影に潜んでいる間は近接攻撃ができないが、_遠隔手段で攻撃してみる_価値はある。
actors.mobs.rogueboss.notice=ははっ、また餌が掛かったぞ！
actors.mobs.rogueboss.invisibility=捕まえてみせろ！
actors.mobs.rogueboss.execute=喰らえ、一太刀！
actors.mobs.rogueboss.angered=くそ…ならば…
actors.mobs.rogueboss.enraged=激昂
actors.mobs.rogueboss.momentum=まだ俺の動きについてこれるか？
actors.mobs.rogueboss.momentum-recovery=ちっ…疲れた…
actors.mobs.rogueboss.kill=あなたは盗賊？の陰謀で倒された…
actors.mobs.rogueboss.rankings_desc=あなたは盗賊？の陰謀で倒された…
actors.mobs.rogueboss.spkill=あなたは盗賊？に斬殺された…
actors.mobs.rogueboss.executeninja=盗賊？：「忍者よ、卑劣を許せ…」
actors.mobs.rogueboss.defeated=まさか…天狗より強いとは…
actors.mobs.rogueboss$absoluteinvisibility.name=影隠
actors.mobs.rogueboss$absoluteinvisibility.spname=準備段階
actors.mobs.rogueboss$absoluteinvisibility.desc=盗賊？は自身の暗影の闘篷を使って隠身状態に入っている。\n\nこの状態では盗賊？に直接近接攻撃できないが、遠隔攻撃を受けると即座に隠身が解除される。\n\n現在の生命が最大生命値の半分を超えている場合、隠身状態の盗賊？は準備段階に入り、約10ターン後にあなたを斬殺する。現在の生命が最大生命値の半分を下回ると、隠身状態の盗賊？の機動力効果の持続時間は自然に減少しなくなる。\n\n影隠効果の残り時間：%sターン
actors.mobs.rogueboss$absoluteinvisibility.spdesc=盗賊？は辛抱強く待ち構え、暗影から致命の一撃を与えようとしている。\n\n約10ターンの準備後、盗賊？は瞬時にあなたの元へ突進して斬殺する。この一撃は回避不可能で致命的だ！幸い、あなたの遠隔攻撃は彼の準備を中断させることができる。\n\n盗賊？は既に%sターン準備している。
actors.mobs.rogueboss$momentumtime.name=機動力
actors.mobs.rogueboss$momentumtime.spname=回復
actors.mobs.rogueboss$momentumtime.desc=盗賊？は機動力状態にあり、この間は2倍の速度で移動し、より高い回避率、命中率とダメージ補正を持つ。\n\n幸い、盗賊？はダメージを受けるたびに機動力状態の持続時間が3ターン減少する。機動力状態終了後は、しばらく休憩しないと再び機動力状態に入れない。\n\n効果の残り時間：%sターン
actors.mobs.rogueboss$momentumtime.spdesc=盗賊？は機動力状態を終えたばかりで、今は休憩が必要だ。この間、彼はより多くのダメージを受ける。\n\nしかし油断は禁物。盗賊？は休憩中も動力を蓄積しており、完全に回復すると再び機動力状態に入る。\n\n盗賊？はあと%sターンの休憩が必要だ。
actors.mobs.rogueboss$shadowrogue.name=暗影の映し身
actors.mobs.rogueboss$shadowrogue.desc=無形の暗影が作り出した盗賊？の複製体。それは微動だにせず、両目は虚ろで、煙のような暗黒が周囲にゆっくりと立ち昇っている。\n\n完璧な複製体とは言えないが、それでも一人前の殺し屋だ。盗賊？は窮地に際してこれを召喚し、あなたの足止めを図っている。今、その虚ろな両眼があなたを凝視している…実に不気味だ。
actors.mobs.rogueboss$shadowrogue.discover_hint=特定のチャレンジを有効にすると、あるダンジョンエリアでこの敵を発見できる。


#slimegirl
actors.hero.talent$resilientarmor.name=柔軟装甲
actors.hero.talent$resilientarmor.desc=自分の体がより柔軟になったのを感じる。身に着けた鎧も同様だ。\n\nこれから受ける_%1$d_回の攻撃に対して、0~3の追加装甲を得る。
actors.hero.talent.resilient_meal.title=柔軟な食事
actors.hero.talent.resilient_meal.desc=_+1：_食事がスライム娘に0~3の追加装甲を提供し、次の_3回_の被攻撃を防御する。\n\n_+2：_食事がスライム娘に0~3の追加装甲を提供し、次の_5回_の被攻撃を防御する。
actors.hero.talent.resilient_meal.comment=
actors.hero.talent.liquid_armor.title=液体装甲強化
actors.hero.talent.liquid_armor.desc=_+1：_スライム娘の防具が提供する_最低装甲が1_。\n\n_+2：_スライム娘の防具が提供する_最低装甲が2_。
actors.hero.talent.liquid_armor.comment=

actors.hero.talent.tough_meal.title=強靭な食事
actors.hero.talent.tough_meal.desc=_+1：_食事がスライム娘に_失った生命値の10%の薬草治療_効果を提供する。最低_3ポイント_、最大_15ポイント_。\n\n_+2：_食事がスライム娘に_失った生命値の15%の薬草治療_効果を提供する。最低_5ポイント_、最大_25ポイント_。
actors.hero.talent.tough_meal.comment=
actors.hero.talent.energy_absorption.title=運動エネルギー吸収
actors.hero.talent.energy_absorption.desc=_+1：_スライム娘が受ける最大ダメージは_最大生命値の16.7%_を超えない。\n\n_+2：_スライム娘が受ける最大ダメージは_最大生命値の12.5%_を超えない。
actors.hero.talent.energy_absorption.comment=この天赋の効果判定はすべての軽減の後に行われる。
actors.hero.talent.energy_absorption.meta_desc=_この天赋が他の英雄に獲得された場合_、+1では英雄が最大生命値の80%までのダメージを受け、+2では英雄が最大生命値の60%までのダメージを受ける。
actors.hero.talent.slime_greenhouse.title=粘液温室
actors.hero.talent.slime_greenhouse.desc=_+1：_種がスライム娘の体内で発芽する際に_ターンを消費しなくなる_。\n\n_+2：_+1に加えて、種の発芽が_30満腹度_を回復できる。
actors.hero.talent.slime_greenhouse.comment=荒野の地チャレンジを有効にした後、この天赋をアップグレードすると、種が体内で発芽するのに必要なターン数が_10_から_5_に減少する。
actors.hero.talent.slime_greenhouse.meta_desc=_この天赋が他の英雄に獲得された場合_、+1では英雄が種を食べて30満腹度を回復できるようになり、+2では+1に加えて種に対応する植物効果を発動できる。

actors.hero.talent.original_monster.title=原生魔物
actors.hero.talent.original_monster.desc=_+1：_スライム娘が_薬草治療_効果を得た後、提供される治療量が_50%向上_する。\n\n_+2：_+1に加えて、_薬草治療_効果を持つ時、スライム娘はさらに_33%の元素耐性_を得る。\n\n_+3：_+1と+2に加えて、スライム娘は_移動時に薬草治療効果を失わなくなる_。
actors.hero.talent.original_monster.comment=

actors.hero.herosubclass.waterslime=水霊スライム
actors.hero.herosubclass.waterslime_short_desc=_水霊スライム_はより高い最大生命値を持ち、物理攻撃を受けるとスライム粘液を分裂させ、それを吸収すると生命を回復できる。
actors.hero.herosubclass.waterslime_desc=水霊スライムは現在のレベル×50%の最大生命値を追加で得る。また、最大生命値×3%の自然生命回復倍率を持つ（最低1）。\n\n水霊スライムが物理攻撃を受けると、現在の生命値×10%の生命を失い、周囲3×3の正方形範囲内にランダムにスライム粘液を一塊分裂させる。この粘液を吸収すると最大生命値×20%の生命を回復できる。\n\nスライム粘液を分裂させる際、最低1ポイントの生命を消費する（水霊スライムが死亡することはない）。生成ごとに30ターンのクールダウンがあり、攻撃を受けるとクールダウンが3ターン減少する。
actors.hero.talent.water_body.title=水霊の体
actors.hero.talent.water_body.desc=_+1：_水霊スライムが追加で_現在のレベル×100%_の最大生命値を得る。\n\n_+2：_水霊スライムが追加で_現在のレベル×150%_の最大生命値を得る。\n\n_+3：_水霊スライムが追加で_現在のレベル×200%_の最大生命値を得る。
actors.hero.talent.water_body.comment=
actors.hero.talent.water_revival.title=水霊再生
actors.hero.talent.water_revival.desc=_+1：_水霊スライムがスライム粘液を吸収すると_最大生命値の12.5%_の生命を回復する。\n\n_+2：_水霊スライムがスライム粘液を吸収すると_最大生命値の25%_の生命を回復する。\n\n_+3：_+2に加えて、水霊スライムがスライム粘液を分裂させる際に消費する生命が_現在の生命値の5%_になる。
actors.hero.talent.water_revival.comment=
actors.hero.talent.water_regeneration.title=水霊強靭
actors.hero.talent.water_regeneration.desc=_+1：_水霊スライムは_最大生命値×1.17%_の自然生命回復倍率を得る（最低1）。\n\n_+2：_水霊スライムは_最大生命値×1.33%_の自然生命回復倍率を得る（最低1）。\n\n_+3：_水霊スライムは_最大生命値×1.5%_の自然生命回復倍率を得る（最低1）。
actors.hero.talent.water_regeneration.comment=
actors.hero.talent$slimemucuscooldown.name=粘液分裂
actors.hero.talent$slimemucuscooldown.desc=水霊スライムはスライム粘液を分裂させたばかりで、しばらく経たないと再び分裂できない。ただし、攻撃を受けると粘液の分裂が加速される。\n\n水霊スライムはあと_%sターン_で次の粘液を分裂させられる。
actors.mobs.npcs.slimemucus.name=スライム粘液
actors.mobs.npcs.slimemucus.desc=スライム粘液は水霊スライムの体内から分裂した一塊の粘液である。着地後、粘液下の微生物を吸着して膨張し、水霊スライムに吸収されることでより多くの生命値を回復する。もちろん、敵の攻撃で破壊されることもある。\n\nスライム粘液は10ポイントの生命値を持ち、毎ターン1ポイントずつ失う。水霊スライムはスライム粘液の周囲8マスから、スライム粘液をクリックして吸収できる。吸収過程はターンを消費しない。\n\nスライム粘液は水霊スライムの半分の装甲を継承する。
actors.mobs.npcs.slimemucus.absorb_title=スライム粘液
actors.mobs.npcs.slimemucus.absorb_body=あなたの体から分裂した一部の粘液だ。周囲の栄養分を吸着したように見える。\n\nこの粘液を吸収しますか？生命を回復できます。
actors.mobs.npcs.slimemucus.absorb_confirm=吸収
actors.mobs.npcs.slimemucus.absorb_cancel=キャンセル
actors.mobs.npcs.slimemucus.discover_hint=特定の英雄専精の職業を通じてこのユニットを発見できる。

actors.hero.herosubclass.darkslime=暗液スライム
actors.hero.herosubclass.darkslime_short_desc=_暗液スライム_は最大生命値の一部を失うが、汚泥の腐食に免疫を持ち、敵に汚泥を撒き散らせる。さらに暗液鉤爪を放つことができる。
actors.hero.herosubclass.darkslime_desc=暗液スライムはダンジョンの邪悪な養分を吸収して暗黒の力を得た。これにより最大生命値が30%減少したが、腐食汚泥に免疫を得た。\n\n暗液スライムは攻撃時に50%の確率で目標に20ターンの腐食汚泥効果を与える。被ダメージ時にも15%の確率で攻撃者に10ターンの腐食汚泥効果を与える（この確率は遠隔攻撃を受けると倍増する）。\n\n暗液スライムは65ターンごとに暗液鉤爪を放つことができ、視界内の敵一名を自身の元に引き寄せ、さらに5ターンの絡みつき効果を与える。\n\nこの専精は鉤爪の回復を待つ必要がない場合に特殊能力を持ち、複数の特殊能力を持つ場合はショートカットを長押しして特殊能力を切り替えられる。
actors.buffs.darkhook.name=暗液鉤爪
actors.buffs.darkhook.desc=心のままに獲物を選ぶ時だ。\n\n65ターンごとに暗液鉤爪を放ち、視界内の敵一名を自身の元に引き寄せ、さらに5ターンの絡みつき効果を与える。\n\nこの技の距離制限は12マス。
actors.hero.talent$darkhookcooldown.name=鉤爪回復
actors.hero.talent$darkhookcooldown.desc=暗液スライムは暗液鉤爪を放ったばかりだ。目標を力強く引き寄せるのに多くの体力を消耗したため、回復に時間が必要だ。\n\nこの能力の回復にはあと_%sターン_必要。
actors.buffs.darkhook.cant_pull=目標を引き寄せられない。
actors.buffs.darkhook.does_nothing=この距離はこれ以上近づけない。
actors.buffs.darkhook.more_distance=距離が遠すぎて発動できない。
actors.hero.talent.potent_ooze.title=強効汚泥
actors.hero.talent.potent_ooze.desc=この天赋をアップグレードすると、水中に立っていても腐食汚泥が直接除去されず、代わりに持続時間が追加で減少する。\n\n_+1：_水中にいる時、_腐食汚泥_効果が追加で_3ターン_減少する。\n\n_+2：_水中にいる時、_腐食汚泥_効果が追加で_2ターン_減少する。\n\n_+3：_水中にいる時、_腐食汚泥_効果が追加で_1ターン_減少する。
actors.hero.talent.potent_ooze.comment=
actors.hero.talent.dark_gas.title=暗気放出
actors.hero.talent.dark_gas.desc=_+1：_暗液スライムは攻撃を受けると_20%の確率_で少量の_毒ガス_を放出し、_4ターンの浄化障壁_効果を得る。\n\n_+2：_暗液スライムは攻撃を受けると_20%の確率_で少量の_毒ガスまたは酸蝕ガス_を放出し、_4ターンの浄化障壁_効果を得る。\n\n_+3：_暗液スライムは攻撃を受けると_20%の確率_で少量の_毒ガス、酸蝕または腐敗ガス_を放出し、_4ターンの浄化障壁_効果を得る。
actors.hero.talent.dark_gas.comment=この天赋の三種のガスはそれぞれ独立した確率で放出され、一度に全てが放出されるわけではない。
actors.hero.talent.dark_liquid.title=暗液纏身
actors.hero.talent.dark_liquid.desc=_+1：_暗液スライムが暗液鉤爪を使用すると、目標に追加で_2ターンの絡みつき_効果を与える。合計5ターン。\n\n_+2：_+1に加えて、目標に追加で_20ターンの腐食汚泥_効果を与える。\n\n_+3：_+1と+2に加えて、_絡みつき状態_で死亡した敵は暗液スライムに_8ターンの法杖チャージと5ターンの神器チャージ_を提供する。同時に_暗液鉤爪のクールダウンがリセット_される。
actors.hero.talent.dark_liquid.comment=この天赋が+3レベルの場合、敵を深淵に引きずり落としても暗液鉤爪のクールダウンはリセットされない。

actors.hero.heroclass.slimegirl=スライム娘
actors.hero.heroclass.slimegirl_desc_short=スライム娘は初期から_脱げないが成長し続ける粘液装甲_を装備し、さらに_種を自分の体内で発芽させる_ことができる。
actors.hero.heroclass.slimegirl_desc=スライム娘は初期から_独自の粘液装甲_を装備する。粘液装甲は脱げないが、スライム娘のレベル上昇に伴って追加レベルや階級の向上を得る。\n\nスライム娘の力量はより低いが、より高い初期生命と成長を持ち、また_種を体内で発芽させて対応する植物効果を生み出す_ことができる。これは通常3ターンを消費する。\n\n同時に、スライム娘は初期装備として_征討者の長槍_、_粘液玉2個_、水袋と布袋を持つ。\n\nスライム娘は魔物として人間の学識をあまり持たないため、初期鑑定されるアイテムは以下のみ：\n_-_変態スクロールと鑑定スクロール_
actors.hero.heroclass.slimegirl_unlock=_1回のゲームでスライムを倒す_ことでスライム娘をアンロックできる。

actors.hero.abilities.slime.madslime.name=狂スラ日記
actors.hero.abilities.slime.madslime.self_target=自身を対象にできない。
actors.hero.abilities.slime.madslime.no_target=喰える対象がいない。
actors.hero.abilities.slime.madslime.more_distance=目標との距離が遠すぎる。
actors.hero.abilities.slime.madslime.strong_target=その目標は喰えない。
actors.hero.abilities.slime.madslime.eat=目標は実に美味い。力が漲ってくる。
actors.hero.abilities.slime.madslime.eat1=傷がゆっくりと癒えていくのを感じる。
actors.hero.abilities.slime.madslime.eat2=何かの障壁が自分を守っているようだ。
actors.hero.abilities.slime.madslime.short_desc=スライム娘は_狂スラ日記_を会得し、その無限の食欲は近くの敵を飲み込み尽くす。
actors.hero.abilities.slime.madslime.desc=スライム娘は食欲に満たされており、近くの敵を飲み込んで満腹度を回復できる。飲み込まれた敵は大量のダメージを受けて即死する。\n\nスライム娘はBoss、ミニBoss、エリート、味方を飲み込めない。\n\n基本満腹度回復：_250_（節食チャレンジの影響を受ける）
actors.hero.talent.no_pick.title=飢不択食
actors.hero.talent.no_pick.desc=_+1：_敵を飲み込んだ時の満腹度回復が_20%向上_する。\n\n_+2：_敵を飲み込んだ時の満腹度回復が_40%向上_する。\n\n_+3：_敵を飲み込んだ時の満腹度回復が_60%向上_する。\n\n_+4：_敵を飲み込んだ時の満腹度回復が_80%向上_する。
actors.hero.talent.no_pick.comment=
actors.hero.talent.food_bonus.title=血食本能
actors.hero.talent.food_bonus.desc=_+1：_敵を飲み込むことで_食事特効を発動できる_。\n\n_+2：_+1に加えて、敵を飲み込んだ後に自身を中心に_5×5範囲の決闘区域_が発生する。\n\n_+3：_+1と+2に加えて、敵を飲み込んだ後に_失った生命値の15%の治療_効果を得る。\n\n_+4：_+1、+2、+3に加えて、敵を飲み込んだ後に_最大生命値の30%のシールド_を得る。
actors.hero.talent.food_bonus.comment=
actors.hero.talent.delicious_digestion.title=大快朵頤
actors.hero.talent.delicious_digestion.desc=_+1：_スライム娘が100%装甲チャージで狂スラ日記を使用する時、チャージ消費が_16%減少_する。\n\n_+2：_スライム娘が100%装甲チャージで狂スラ日記を使用する時、チャージ消費が_30%減少_する。\n\n_+3：_スライム娘が100%装甲チャージで狂スラ日記を使用する時、チャージ消費が_40%減少_する。\n\n_+4：_スライム娘が100%装甲チャージで狂スラ日記を使用する時、チャージ消費が_50%減少_する。
actors.hero.talent.delicious_digestion.comment=

actors.hero.abilities.slime.rapidwaterfall.name=飛沫瀑布
actors.hero.abilities.slime.rapidwaterfall.short_desc=スライム娘は_飛沫瀑布_を展開し、身の周りに立ち上る水蒸気を充満させ、周囲のエリアを水溜りに変え、すべての罠を破壊する。
actors.hero.abilities.slime.rapidwaterfall.desc=スライム娘は自身を中心に立ち上る水蒸気を生み出し、周囲のエリアを水溜りに変えられる。\n\n水蒸気の基本量：_45_
actors.hero.abilities.slime.rapidwaterfall$rapidwater.name=飛沫瀑布
actors.hero.abilities.slime.rapidwaterfall$rapidwater.desc=立ち上る水蒸気は周囲のエリアを水溜りに変え、すべての罠を破壊できる。
actors.hero.talent.violent_storm.title=暴風豪雨
actors.hero.talent.violent_storm.desc=_+1：_生成される蒸気水蒸気の単位数_が25%増加_。_\n\n_+2：_生成される蒸気水蒸気の単位数_が50%増加_。_\n\n_+3：_生成される蒸気水蒸気の単位数_が75%増加_。_\n\n_+4：_生成される蒸気水蒸気の単位数_が100%増加_。
actors.hero.talent.violent_storm.comment=
actors.hero.talent.new_trap.title=浮底新生
actors.hero.talent.new_trap.desc=_+1：_飛沫瀑布で生成された蒸気水蒸気がトラップを破壊する時、_20%の確率_でトラップクリスタル_1つ_を生成。_\n\n_+2：_飛沫瀑布で生成された蒸気水蒸気がトラップを破壊する時、_40%の確率_でトラップクリスタル_1つ_を生成。_\n\n_+3：_飛沫瀑布で生成された蒸気水蒸気がトラップを破壊する時、_60%の確率_でトラップクリスタル_1つ_を生成。_\n\n_+4：_飛沫瀑布で生成された蒸気水蒸気がトラップを破壊する時、_80%の確率_でトラップクリスタル_1つ_を生成。
actors.hero.talent.new_trap.comment=飛沫瀑布1回の使用で得られるトラップクリスタルは最大3個。
actors.hero.talent.holy_bath.title=聖湯安堵
actors.hero.talent.holy_bath.desc=_+1：_敵が飛沫瀑布で生成された蒸気水蒸気の中にいる時、近くの非水体タイル_に向かって_1マス_ノックバック。_\n\n_+2：_敵が飛沫瀑布で生成された蒸気水蒸気の中にいる時、近くの非水体タイル_に向かって_2マス_ノックバック。_\n\n_+3：_敵が飛沫瀑布で生成された蒸気水蒸気の中にいる時、近くの非水体タイル_に向かって_3マス_ノックバック。_\n\n_+4：_敵が飛沫瀑布で生成された蒸気水蒸気の中にいる時、近くの非水体タイル_に向かって_4マス_ノックバック。
actors.hero.talent.holy_bath.comment=この天賦のノックバック効果は敵を深淵に落とすことはできない。

actors.hero.abilities.slime.springspell.name=陽春の魔法陣
actors.hero.abilities.slime.springspell.short_desc=スライム娘が_陽春の魔法陣_を召喚し、自分や味方が_薬草治療_効果を得る。
actors.hero.abilities.slime.springspell.desc=スライム娘が陽春の魔法陣を召喚し、自分や味方に薬草治療効果を提供する。\n\n基礎治療量：_25_
actors.hero.talent.potent_healing.title=強力治療
actors.hero.talent.potent_healing.desc=_+1：_陽春の魔法陣で得られる_薬草治療_効果が_30_に上昇。_\n\n_+2：_陽春の魔法陣で得られる_薬草治療_効果が_35_に上昇。_\n\n_+3：_陽春の魔法陣で得られる_薬草治療_効果が_40_に上昇。_\n\n_+4：_陽春の魔法陣で得られる_薬草治療_効果が_45_に上昇。
actors.hero.talent.potent_healing.comment=
actors.hero.talent.efficient_healing.title=高効率治療
actors.hero.talent.efficient_healing.desc=_+1：_陽春の魔法陣が与える_薬草治療_効果が_毎ターン0.5回復_になる。_\n\n_+2：_陽春の魔法陣が与える_薬草治療_効果が_毎ターン1回復_になる。_\n\n_+3：_陽春の魔法陣が与える_薬草治療_効果が_毎ターン1.5回復_になる。_\n\n_+4：_陽春の魔法陣が与える_薬草治療_効果が_毎ターン2回復_になる。
actors.hero.talent.efficient_healing.comment=この天賦は薬草治療の総治療量に影響せず、治療速度のみを上昇させる。
actors.hero.talent.mass_healing.title=集団治療
actors.hero.talent.mass_healing.desc=_+1：_陽春の魔法陣発動時、スライム娘の周囲_3x3範囲_内で最もHPの低い味方_1名_が等量の_薬草治療_効果を得る。_\n\n_+2：_陽春の魔法陣発動時、スライム娘の周囲_5x5円形範囲_内で最もHPの低い味方_1名_が等量の_薬草治療_効果を得る。_\n\n_+3：_陽春の魔法陣発動時、スライム娘の周囲_5x5範囲_内で最もHPの低い味方_1名_が等量の_薬草治療_効果を得る。_\n\n_+4：_陽春の魔法陣発動時、スライム娘の周囲_7x7円形範囲_内で最もHPの低い味方_1名_が等量の_薬草治療_効果を得る。
actors.hero.talent.mass_healing.comment=

actors.hero.talent.liquid_perception.title=液体感知
actors.hero.talent.liquid_perception.desc=_+1：_スライム娘が力の薬や経験の薬を飲用する時、ランダムに_1種の薬剤_を鑑定。_\n\n_+2：_スライム娘が力の薬や経験の薬を飲用する時、ランダムに_1種の薬剤または1種の巻物_を鑑定。
actors.hero.talent.liquid_perception.comment=この天賦は力の薬や経験の薬を材料として作られたアイテム使用時にも発動する。

actors.hero.talent.water_wave.title=水波蕩漾
actors.hero.talent.water_wave.desc=_+1：_水中の敵を攻撃する時、スライム娘が_1点の追加ダメージ_を与える。_\n\n_+2：_水中の敵を攻撃する時、スライム娘が_2点の追加ダメージ_を与える。
actors.hero.talent.water_wave.comment=

actors.hero.talent.natural_affinity.title=自然親和
actors.hero.talent.natural_affinity.desc=_+1：_スライム娘の空腹速度_が20%低下_。_\n\n_+2：_スライム娘の空腹速度_が33%低下_。
actors.hero.talent.natural_affinity.comment=

actors.hero.talent.quality_absorption.title=良質吸収
actors.hero.talent.quality_absorption.desc=_+1：_スライム娘が雫を吸収して回復するHPが_2点上昇_。_\n\n_+2：_スライム娘が雫を吸収して回復するHPが_3点上昇_。
actors.hero.talent.quality_absorption.comment=この天賦は水袋内の雫にも適用されるが、1回の吸収量のみ増加する。

actors.hero.talent.empowering_life.title=充盈生命
actors.hero.talent.empowering_life.desc=_+1：_スライム娘の現在HPが満タンの時、溢れた自然生命回復が失われないバリアに変わり、上限は_最大HPの6.7%_、同時に_魔法ダメージが10%上昇_。_\n\n_+2：_スライム娘の現在HPが満タンの時、溢れた自然生命回復が失われないバリアに変わり、上限は_最大HPの13.3%_、同時に_魔法ダメージが20%上昇_。_\n\n_+3：_スライム娘の現在HPが満タンの時、溢れた自然生命回復が失われないバリアに変わり、上限は_最大HPの20%_、同時に_魔法ダメージが30%上昇_。
actors.hero.talent.empowering_life.comment=

actors.hero.talent.ninja_meal.title=忍者弁当
actors.hero.talent.ninja_meal.desc=_+1：_食事が忍者の手裏剣筒のチャージを_1_回復。_\n\n_+2：_食事が忍者の手裏剣筒のチャージを_2_回復。
actors.hero.talent.ninja_meal.comment=背中に手裏剣筒がない場合、この天賦は_+1/+2_レベルで1/2ターンの神器チャージを提供する（豊穣の角自身へのチャージは不可）。\n\n「肉餡たっぷりの大きな弁当、彼は一口で食べた！」

actors.hero.talent.agile_attack.title=敏撃反撃
actors.hero.talent.agile_attack.desc=_+1：_忍者が敵の攻撃を回避した時、次の物理攻撃が_3点の追加ダメージ_を与える。_\n\n_+2：_忍者が敵の攻撃を回避した時、次の物理攻撃が_5点の追加ダメージ_を与える。
actors.hero.talent.agile_attack.comment=「南無三、なんと見事な回避反撃コンボ、忍者動体視力の諸君はもうお分かりだろう。」
actors.hero.talent$agileattack.name=敏撃反撃
actors.hero.talent$agileattack.desc=忍者が最近敵の攻撃を回避したため、目標への次の物理攻撃がダメージ増加を得る。

actors.hero.talent.you_scared_me.title=びっくりした
actors.hero.talent.you_scared_me.desc=_+1：_忍者が攻撃を回避し、現在のバリアが_4_未満の時、_2_のバリアを得る。_\n\n_+2：_忍者が攻撃を回避し、現在のバリアが_6_未満の時、_3_のバリアを得る。
actors.hero.talent.you_scared_me.comment=この天賦で得られるバリアは_+1/+2_レベルで_4/6_を超えない。\n\n「風林火山、茶道、そして…風林火山。」

actors.hero.talent.yunying_meal.title=雲隠れ食事
actors.hero.talent.yunying_meal.desc=_+1：_忍者は食事に1ターンのみ費やし、_2ターンの隐身_を得る。_\n\n_+2：_忍者は食事に1ターンのみ費やし、_4ターンの隐身_を得る。
actors.hero.talent.yunying_meal.comment=この天賦は天賦_食べて経験_、_無敵飯_、_誕生日プレゼント_と_100回_のトリガー上限を共有する。\n\n「うわあああ！忍者！なぜここに忍者がいるんだ！？」

actors.hero.talent.xia.title=秘術・霞
actors.hero.talent.xia.desc=_+1：_忍者が巻物を読むか魔法結晶を使用した後、_3ターン_の霞の歩法（+50%回避）を得る。_\n\n_+2：_忍者が巻物を読むか魔法結晶を使用した後、_5ターン_の霞の歩法（+50%回避）を得る。
actors.hero.talent.xia.comment=使用したのがアップグレード巻物、変異巻物、またはこれらの巻物で錬成した錬金品の場合、得られる霞の歩法の効果時間が倍になる。\n\n生産量の多い錬金品（ほとんどの結晶など）の場合、この天賦はそのアイテムの1回の生産数量に基づき確率で発動する。\n\nこの天賦は無序の魔導書を読むことでも発動する。\n\n「遠い昔、第一世代の忍術奥義を極めた忍術大師が一枚の巻物から一つの奥義を発明した：霞の歩法。」

actors.hero.talent$xiadef.name=霞の歩法
actors.hero.talent$xiadef.desc=忍者が巻物を読んだ後、短時間一つの奥義を悟り、体が軽やかで機敏になる。\n\nこの効果により回避が50%上昇し、敵の攻撃をよりよく避けられる。\n\n残りターン数：%sターン

actors.hero.talent.quick_search.title=高速探索
actors.hero.talent.quick_search.desc=_+1：_忍者が周囲を探索するのに_1ターンのみ_で済む。_\n\n_+2：_1に加え、忍者が周囲を探索する際の_満腹度消費が2倍_になる。
actors.hero.talent.quick_search.comment=注意：通常の探索は常に2ターン消費し、満腹度も2倍消費する。\n\n「周囲の環境を探索し終えてこそ、安心して休息し戦える。」

actors.hero.talent.ninja_social.title=忍者社交
actors.hero.talent.ninja_social.desc=_+1：_忍者が物理武器で敵を倒した後、次の_3回の攻撃_の精度が50%上昇。_\n\n_+2：_忍者が物理武器で敵を倒した後、次の_5回の攻撃_の精度が50%上昇。
actors.hero.talent.ninja_social.comment=「南無三、なんと正確なチョップ連打、実に素晴らしい腕前だ。」
actors.hero.talent$ninjasocial.name=忍者社交
actors.hero.talent$ninjasocial.desc=次の数回の攻撃中、忍者の精度が50%上昇。\n\n残り回数：%s

actors.hero.talent.feint.title=声東撃西
actors.hero.talent.feint.desc=_+1：_忍者が非武器アイテムを空地に投げると、視野内の敵をその位置に誘引する。_10ターン_のクールダウン。_\n\n_+2：_忍者が非武器アイテムを空地に投げると、視野内の敵をその位置に誘引する。_5ターン_のクールダウン。
actors.hero.talent.feint.comment=この天賦は眠っている敵を起こすことができる。通常、誘引された敵は毎ターン50%の確率で視野範囲内の忍者や味方に注意を移す。\n\n「騙されたな、この野郎！」
actors.hero.talent$feintcooldown.name=声東撃西-クールダウン
actors.hero.talent$feintcooldown.desc=あなたは既にアイテムを投げて敵を誘引した。短期間内に音を立てて再度注意を引くことは難しい。\n\n残りクールダウン：%sターン

actors.hero.talent.light_box.title=軽便忍具
actors.hero.talent.light_box.desc=_+1：_忍者は手裏剣筒を装備しなくてもその機能を使えるが、未装備時の手裏剣筒のチャージ速度が_25%_に低下。_\n\n_+2：_忍者は手裏剣筒を装備しなくてもその機能を使えるが、未装備時の手裏剣筒のチャージ速度が_50%_に低下。_\n\n_+3：_忍者は手裏剣筒を装備しなくてもその機能を使えるが、未装備時の手裏剣筒のチャージ速度が_75%_に低下。
actors.hero.talent.light_box.comment=背中に手裏剣筒がない場合、この天賦は_+1/+2/+3_レベルで神器使用後の4ターン間、全ての投擲武器を_1/2/3_レベル上昇させる。

actors.hero.talent.qianfa_throwing.title=千発投擲
actors.hero.talent.qianfa_throwing.desc=_+1：_忍者が投擲武器または小さな手裏剣を投げた時、_10%の確率_で3倍ダメージ。_\n\n_+2：_忍者が投擲武器または小さな手裏剣を投げた時、_20%の確率_で3倍ダメージ。_\n\n_+3：_忍者が投擲武器または小さな手裏剣を投げた時、_30%の確率_で3倍ダメージ。
actors.hero.talent.qianfa_throwing.comment=霊能弓などの特殊投擲武器を持つ英雄がこの天賦を得た場合、特殊投擲武器もこの天賦の加成を受ける。\n\n「Instruction One：百発の手裏剣で倒せない相手は、千発の手裏剣を投げろ！」

actors.hero.heroclass.ninja=忍者
actors.hero.heroclass.ninja_desc_short=忍者は彼の_手裏剣筒_を使って攻撃し、敵を麻痺させることもできる。また、より遠い_探知距離_とより高い_隠蔽能力_を持つ。
actors.hero.heroclass.ninja_desc=忍者は初期に独自の_手裏剣筒_を持ち、筒から素早く取り出して小さな手裏剣を投射し、敵を攻撃し麻痺させることもできる。\n\n忍者はより遠い距離から_秘密と罠を探知_でき、行動が_敵に発見されにくい_。\n\n同時に、忍者は初期に_脇差_、布甲、水袋と布袋を持つ。\n\n忍者が初期に鑑定するアイテム：\n_-_毒ガスの薬\n_-_変異巻物、鑑定巻物とテレポート巻物
actors.hero.heroclass.ninja_unlock=_一回のゲームで天狗を倒す_ことで忍者をアンロック。
actors.hero.herosubclass.tatteki_ninja=鉄砲忍者
actors.hero.herosubclass.tatteki_ninja_short_desc=_鉄砲忍者_は強力な鉄砲を得る。非常に高いダメージと長い発射間隔を持つ。
actors.hero.herosubclass.tatteki_ninja_desc=鉄砲忍者は一挺の鉄砲を得る。鉄砲は副武器として装備でき、主武器のレベルを共有できる。鉄砲の発射は極めて高いダメージを与え、命中の有無に関わらず視野内の敵を恐怖させるが、毎回の発射には10ターンの間隔が必要。\n\n鉄砲忍者の鉄砲は精度が非常に低く、伏撃にも使えないが、投擲武器や小さな手裏剣を投げて敵に弾道修正効果を与えることができ、影響を受けた目標は必ず鉄砲で命中する。
actors.hero.talent.soko.title=早合
actors.hero.talent.soko.desc=_+1：_鉄砲忍者が鉄砲を装填するのに必要な時間_が4ターン短縮_。_\n\n_+2：_鉄砲忍者が鉄砲を装填するのに必要な時間_が7ターン短縮_。_\n\n_+3：_鉄砲忍者が鉄砲を装填するのに必要な時間_が10ターン短縮_。
actors.hero.talent.soko.comment=「早合は東洋国家における火砲装填技術の重要な革新であり、一回の発射に必要な定量の火薬と弾丸を予め薬筒や紙包に封入し、使用時に直接砲管に注ぎ込むことで、鉄砲手の発射効率を毎分1〜2発から4〜5発に向上させた。」
actors.hero.talent.kono_fukusa.title=釣野伏
actors.hero.talent.kono_fukusa.desc=_+1：_鉄砲忍者が敵を伏撃するか、物理攻撃で追撃中の敵を攻撃する時、与えるダメージ_が20%上昇_。_\n\n_+2：_鉄砲忍者が敵を伏撃するか、物理攻撃で追撃中の敵を攻撃する時、与えるダメージ_が40%上昇_。_\n\n_+3：_鉄砲忍者が敵を伏撃するか、物理攻撃で追撃中の敵を攻撃する時、与えるダメージ_が60%上昇_。
actors.hero.talent.kono_fukusa.comment=「釣野伏は東洋の戦術家が創り出した戦術であり、敵を誘い込んでから殲滅する伏撃を核とし、かつて北方国家連合による狼人の侵略を寡勢で阻止した。」
actors.hero.talent.kunikuchi.title=国崩し砲
actors.hero.talent.kunikuchi.desc=_+1：_鉄砲忍者は鉄砲に爆裂弾を装填でき、以降の_1回の発射_に爆裂弾効果を付与。_\n\n_+2：_鉄砲忍者は鉄砲に爆裂弾を装填でき、以降の_3回の発射_に爆裂弾効果を付与。_\n\n_+3：_鉄砲忍者は鉄砲に爆裂弾を装填でき、以降の_5回の発射_に爆裂弾効果を付与。
actors.hero.talent.kunikuchi.comment=「国崩し砲は口径の大きな火砲であり、その発する巨大な音響は実際の威力以上に敵を震撼させる（もちろん威力も侮れないが）。」

actors.hero.herosubclass.ninja_master=忍術大師
actors.hero.herosubclass.ninja_master_short_desc=_忍術大師_は時間とともに忍術エネルギーを得、このエネルギーを消費して地形に応じた様々な忍術を放つ。
actors.hero.herosubclass.ninja_master_desc=忍術大師は地形に応じて忍術エネルギーを消費し、様々な忍術を放つ。忍術エネルギーは通常10ターンで1回復する。\n\n通常地形：\n避術-影避：瞬間移動し自身を隐身化\n近身術-燕返：高速で斬撃し敵を混乱状態に\n投擲術-影撃：次に該当地形で投擲すると敵を致命傷にし出血させる\n\n水域地形：\n避術-水避：一定時間水中の移動速度が倍増\n近身術-流水斬：より遠くから斬撃し敵を寒冷状態に\n投擲術-飛水投擲：次に該当地形で投擲すると周囲の水を該当落下点に移動\n\n草または余燼地形：\n避術-草木復蘇：周囲に腐敗の触手を生成し戦闘を補助\n近身術-蔓荊：強力な斬撃で敵の行動を制限\n投擲術-百草乱散：次に該当地形で投擲するとランダムな有害植物効果を発動\n\nこの専精は忍術エネルギー回復時に特殊能力を持ち、複数の特殊能力を持つ場合は長押しで特殊能力を切り替えられる。
actors.hero.talent.soul_hunting.title=魂狩り
actors.hero.talent.soul_hunting.desc=_+1：_敵が死亡した時、忍術大師が_0.5_の忍術エネルギーを得る。_\n\n_+2：_敵が死亡した時、忍術大師が_1_の忍術エネルギーを得る。_\n\n_+3：_敵が死亡した時、忍術大師が_1.5_の忍術エネルギーを得る。
actors.hero.talent.soul_hunting.comment=
actors.hero.talent.use_environment.title=環境利用
actors.hero.talent.use_environment.desc=_+1：_忍術大師が避術を放つ時、周囲_3x3範囲_の火焰を吸収し_3ターン_の烈炎のオーラを得る。_\n\n_+2：_1に加え、忍術大師が避術を放つ時、周囲_3x3範囲_の致暈、麻痺、毒ガスなどの非火焰、非電場気体を吸収し、次に投擲術を使用する時にこれらの気体を目標位置で放出する。_\n\n_+3：_1と2に加え、忍術大師が避術を放つ時、周囲_3x3範囲_の電場を吸収し、吸収量に応じて_一定ターンの法杖チャージと神器チャージ_に変換。
actors.hero.talent.use_environment.comment=
actors.hero.talent.mind_water.title=心如止水
actors.hero.talent.mind_water.desc=_+1：_忍術大師が_近身術_を放つ時に消費する忍術エネルギーが1減少。_\n\n_+2：_忍術大師が_近身術と投擲術_を放つ時に消費する忍術エネルギーが1減少。_\n\n_+3：_忍術大師が_避術、近身術、投擲術_を放つ時に消費する忍術エネルギーが1減少。
actors.hero.talent.mind_water.comment=
actors.buffs.ninja_energy.name=忍術エネルギー
actors.buffs.ninja_energy.desc=忍術大師は時間とともに忍術エネルギーを得、このエネルギーを消費して地形に応じた様々な忍術を放つ。\n\n忍術エネルギーは通常10ターンで1回復する。\n\n現在エネルギー：%d/10
actors.buffs.ninja_energy.action=忍術
actors.buffs.ninja_energy$watersmooth.name=悠遊自如
actors.buffs.ninja_energy$watersmooth.desc=忍術大師が水避術を放った。この効果期間中、忍術大師の水中での移動速度が倍増する。\n\n残りターン数：%sターン
actors.buffs.ninja_energy$gas_storage.name=気体貯蔵
actors.buffs.ninja_energy$gas_storage.desc=忍術大師が周囲の気体を体内に貯蔵し、次に投擲術を使用する時にこれらの気体を目標位置で放出できる。
actors.buffs.ninja_energy$throw_skill.name=投擲術
actors.buffs.ninja_energy$throw_skill.desc=忍術大師が忍術エネルギーを手に蓄積する。このエネルギーは投擲武器とともに放たれ、追加効果を生む。\n\n通常地形では、投擲は投擲武器のダメージに基づく出血と破壊効果を付帯する。\n\n水域地形では、投擲は忍術大師の周囲の水域を該当落下点に移動できる。\n\n草または余燼地形では、投擲はランダムな有害植物効果を発動できる。
actors.buffs.ninja_energy$ninjaability$transported.name_normal=避術-影避
actors.buffs.ninja_energy$ninjaability$transported.desc_normal=1ターン消費して最大4マス先の位置に瞬間移動し、5ターンの隐身を得る。
actors.buffs.ninja_energy$ninjaability$transported.more_distance=距離が遠すぎて瞬間移動できない。
actors.buffs.ninja_energy$ninjaability$transported.name_water=避術-水避
actors.buffs.ninja_energy$ninjaability$transported.desc_water=悠遊自如効果を得る。水中での移動速度が倍増し、8ターン持続する。
actors.buffs.ninja_energy$ninjaability$transported.name_grass=避術-草木復蘇
actors.buffs.ninja_energy$ninjaability$transported.desc_grass=周囲に1〜3本の腐敗の触手を生成できる。
actors.buffs.ninja_energy$ninjaability$transported.less=空間が足りず、触手を生成できない。
actors.buffs.ninja_energy$ninjaability$taijutsu.name_normal=近身術-燕返
actors.buffs.ninja_energy$ninjaability$taijutsu.desc_normal=敵に1回の70%ダメージの斬撃を与え、5ターンのスタンを付与。
actors.buffs.ninja_energy$ninjaability$taijutsu.name_water=近身術-流水斬
actors.buffs.ninja_energy$ninjaability$taijutsu.desc_water=敵への斬撃が追加で1マスの攻撃距離を持ち、5ターンの凍結を付与。
actors.buffs.ninja_energy$ninjaability$taijutsu.name_grass=近身術-蔓荊
actors.buffs.ninja_energy$ninjaability$taijutsu.desc_grass=敵に1回の125%ダメージの斬撃を与え、5ターンの絡みつきを付与。
actors.buffs.ninja_energy$ninjaability$throw.name_normal=投擲術-影撃
actors.buffs.ninja_energy$ninjaability$throw.desc_normal=投擲術効果を得る。次に通常地形で投擲すると、投擲武器のダメージに基づく出血と破壊を付与する。
actors.buffs.ninja_energy$ninjaability$throw.name_water=投擲術-飛水投擲
actors.buffs.ninja_energy$ninjaability$throw.desc_water=投擲術効果を得る。次に水域地形で投擲すると、忍術大師の周囲の水域を該当落下点に移動できる。
actors.buffs.ninja_energy$ninjaability$throw.name_grass=投擲術-百草乱散
actors.buffs.ninja_energy$ninjaability$throw.desc_grass=投擲術効果を得る。次に草または余燼地形で投擲すると、ランダムな有害植物効果を発動できる。
actors.buffs.ninja_energy$ninjaability$throw.hive_throw=あなたは投擲術状態に入った。

actors.hero.abilities.ninja.decoy.name=影武者
actors.hero.abilities.ninja.decoy.short_desc=忍者が_影武者_を召喚し、戦闘を補助し、忍者に代わって致命傷を受け止める。
actors.hero.abilities.ninja.decoy.desc=忍者が影武者を召喚した。影武者が存在する時にこの能力を使うとその行動を指示できる。影武者は初期に40のHPと10〜15の攻撃力のみを持つ。\n\n影武者は忍者と共に戦闘でき、忍者が致命傷を受けた時、影武者が代わりに大きなダメージを受けて死亡する。
actors.hero.abilities.ninja.decoy.less=空間が足りず、影武者を召喚できない。
actors.hero.abilities.ninja.decoy$decoyman.name=影武者
actors.hero.abilities.ninja.decoy$decoyman.direct_defend=命に従う。
actors.hero.abilities.ninja.decoy$decoyman.direct_follow=誓死追従。
actors.hero.abilities.ninja.decoy$decoyman.direct_attack=全力出撃。
actors.hero.abilities.ninja.decoy$decoyman.directed_wander=敵を探し求める。
actors.hero.abilities.ninja.decoy$decoyman.desc=陰影から化生した影武者。その挙動はあなたと全く同じで、敵はあなたと影武者の区別をつけにくい。\n\n影武者は脆く見えるが、あなたが致命的一撃を受けた時、代わりにその一撃を受け止めることができる。ただし、その際に甚大なダメージを受け、即死することもある。
actors.hero.abilities.ninja.decoy$decoyman.die1=故郷の桜がまた咲いたけど、もう帰れない…
actors.hero.abilities.ninja.decoy$decoyman.die2=ぐはっ…この煙…ひどい味だ…
actors.hero.abilities.ninja.decoy$decoyman.die3=生きていること自体が、戦いの証…
actors.hero.abilities.ninja.decoy$decoyman.die4=撒由那拉！(爆発四散)
actors.hero.abilities.ninja.decoy$decoyman.discover_hint=ある英雄の護甲スキルでこのユニットを発見できる。
actors.hero.abilities.ninja.decoy$shadowmark.name=暗影印記
actors.hero.abilities.ninja.decoy$shadowmark.desc=影武者がこの敵に暗影印記を刻んだ。\n\n印記を刻まれた敵は忍者と影武者からより多くのダメージを受ける。\n\n残りターン数：%sターン
actors.hero.talent.deversion.title=影分身術
actors.hero.talent.deversion.desc=_+1：_影武者の最大HPが_50_に上昇し、攻撃力が_20〜25_に上昇。_\n\n_+2：_1に加え、1回の召喚で_2体_の影武者を生成。_\n\n_+3：_影武者の最大HPが_60_に上昇し、攻撃力が_30〜35_に上昇。_\n\n_+4：_3に加え、1回の召喚で_3体_の影武者を生成。
actors.hero.talent.deversion.comment=
actors.hero.talent.shinkage.title=陰影の鎧
actors.hero.talent.shinkage.desc=_+1：_影武者の護甲が_1〜5_に上昇。_\n\n_+2：_1に加え、影武者が攻撃を受けると忍者に_1ターン_の興奮状態を付与。_\n\n_+3：_影武者の護甲が_2〜10_に上昇。_\n\n_+4：_3に加え、影武者が攻撃を受けると忍者に_1.5ターン_の興奮状態を付与。
actors.hero.talent.shinkage.comment=
actors.hero.talent.allhunting.title=集団狩猟
actors.hero.talent.allhunting.desc=_+1：_影武者が敵を攻撃した後、_2ターン_の暗影印記を刻む。印記を刻まれた敵は忍者と影武者からのダメージ_が15%上昇_。_\n\n_+2：_影武者が敵を攻撃した後、_4ターン_の暗影印記を刻む。印記を刻まれた敵は忍者と影武者からのダメージ_が30%上昇_。_\n\n_+3：_影武者が敵を攻撃した後、_6ターン_の暗影印記を刻む。印記を刻まれた敵は忍者と影武者からのダメージ_が45%上昇_。_\n\n_+4：_影武者が敵を攻撃した後、_8ターン_の暗影印記を刻む。印記を刻まれた敵は忍者と影武者からのダメージ_が60%上昇_。
actors.hero.talent.allhunting.comment=


actors.hero.abilities.ninja.onesword.name=一之太刀
actors.hero.abilities.ninja.onesword.short_desc=忍者が剣聖の戦闘奥義_一之太刀_を施し、短時間内に移動速度、近接攻撃速度および近接ダメージを増加させる。
actors.hero.abilities.ninja.onesword.desc=忍者が剣聖の戦闘奥義「一之太刀」を施した！この奥義は10ターン持続する。\n\n奥義「一之太刀」発動後、忍者は2倍の移動速度と50%の攻撃速度を得、同時に近接ダメージが70%上昇する。手にした武器が脇差または武士刀の場合、近接ダメージがさらに20%上昇する。
actors.hero.abilities.ninja.onesword$oku_onesword.name=奥義：一之太刀
actors.hero.abilities.ninja.onesword$oku_onesword.desc=新当流最強の剣術奥義、今や忍者によって近接技に応用され、移動速度、攻撃速度および近接ダメージを増加させる。\n\n残りターン数：%sターン
actors.hero.talent.offensive.title=攻勢
actors.hero.talent.offensive.desc=_+1：_奥義：一之太刀の攻撃速度と近接ダメージの加成が50%と70%から_62.5%_と_45%_に上昇。_\n\n_+2：_奥義：一之太刀の攻撃速度と近接ダメージの加成が50%と70%から_75%_と_60%_に上昇。_\n\n_+3：_奥義：一之太刀の攻撃速度と近接ダメージの加成が50%と70%から_87.5%_と_75%_に上昇。_\n\n_+4：_奥義：一之太刀の攻撃速度と近接ダメージの加成が50%と70%から_100%_と_90%_に上昇。
actors.hero.talent.offensive.comment=「虎を暴かず、河を馮らず。」
actors.hero.talent.glimpse.title=一瞥
actors.hero.talent.glimpse.desc=_+1：_奥義：一之太刀の移動速度加成が100%から_137.5%_に上昇。_\n\n_+2：_奥義：一之太刀の移動速度加成が100%から_175%_に上昇。_\n\n_+3：_奥義：一之太刀の移動速度加成が100%から_212.5%_に上昇。_\n\n_+4：_奥義：一之太刀の移動速度加成が100%から_250%_に上昇。
actors.hero.talent.glimpse.comment=「人は其の一を知り、其の他を知らず。」
actors.hero.talent.kill_continue.title=斬殺勢持
actors.hero.talent.kill_continue.desc=_+1：_近接武器で敵を1体倒す時、_1ターン_延長_奥義：一之太刀。_\n\n_+2：_近接武器で敵を1体倒す時、_2ターン_延長_奥義：一之太刀。_\n\n_+3：_近接武器で敵を1体倒す時、_3ターン_延長_奥義：一之太刀。_\n\n_+4：_近接武器で敵を1体倒す時、_4ターン_延長_奥義：一之太刀。
actors.hero.talent.kill_continue.comment=「戦戦兢兢、深淵に臨むが如く、薄氷を履むが如し。」

actors.hero.abilities.ninja.spiderjar.name=平蜘蛛鍋
actors.hero.abilities.ninja.spiderjar.short_desc=忍者が大量の火薬を_平蜘蛛鍋_に詰め込み、点火して投げる。導火線が燃え尽きた後、莫大な爆発ダメージを与える。
actors.hero.abilities.ninja.spiderjar.desc=古天明平蜘蛛鍋は爆発前に生物や機械さえも酔わせる香りを放ち、眠っていない敵を誘引して匂いを嗅がせることができる。通常、誘引された敵は毎ターン50%の確率で視野範囲内の忍者や味方に注意を移す。\n\n古天明平蜘蛛鍋は爆発後に3x3範囲のユニットに20〜40のダメージを与える。
actors.hero.abilities.ninja.spiderjar$spider.name=平蜘蛛鍋
actors.hero.abilities.ninja.spiderjar$spider.desc=火薬が詰められた貴重な茶器。ある大人物の最も愛した道具であるらしく、今や忍者が爆薬を詰めて導火線に点火している。\n\nこの茶器は魅惑的な香りを放ち、持続的に敵を誘引する。
actors.hero.abilities.ninja.spiderjar$spider.ondeath=あなたは松永久秀のように火薬に点火し、皆に素晴らしい花火を披露した…
actors.hero.abilities.ninja.spiderjar$smallspider.name=小蜘蛛鍋
actors.hero.abilities.ninja.spiderjar$smallspider.desc=平蜘蛛鍋の爆発後、中にまだ小さな蜘蛛鍋が完全には爆発せずに残っている。\n\nこの茶器は魅惑的な香りを放ち、華麗な賽華LEDライト効果を備え、持続的に敵を誘引する。
actors.hero.talent.power_gunpowder.title=強力火薬
actors.hero.talent.power_gunpowder.desc=_+1：_平蜘蛛鍋の爆発ダメージが_25〜55_に上昇。_\n\n_+2：_1に加え、平蜘蛛鍋の爆発範囲が_5x5_に拡大。_\n\n_+3：_平蜘蛛鍋の爆発ダメージが_30〜70_に上昇。_\n\n_+4：_3に加え、平蜘蛛鍋の爆発範囲が_7x7_に拡大。
actors.hero.talent.power_gunpowder.comment=
actors.hero.talent.tea_stains.title=特色茶渋
actors.hero.talent.tea_stains.desc=_+1：_平蜘蛛鍋の爆発が_5ターン_の燃焼を付帯。_\n\n_+2：_平蜘蛛鍋の爆発が_5ターン_の燃焼または凍傷_を付帯。_\n\n_+3：_平蜘蛛鍋の爆発が_5ターン_の燃焼または凍傷_および_3ターン_の麻痺_を付帯。_\n\n_+4：_平蜘蛛鍋の爆発が_8ターン_の燃焼または凍傷_および_3ターン_の麻痺_を付帯。
actors.hero.talent.tea_stains.comment=
actors.hero.talent.firework.title=花火演出
actors.hero.talent.firework.desc=_+1：_平蜘蛛鍋の爆発後、小さな蜘蛛鍋が残る。眠っていない敵を持続的に誘引_10ターン_し、その後3x3範囲の爆発を起こすがダメージは与えない。_\n\n_+2：_平蜘蛛鍋の爆発後、小さな蜘蛛鍋が残る。眠っていない敵を持続的に誘引_10ターン_し、その後3x3範囲の爆発を起こし_10〜20_のダメージを与える。_\n\n_+3：_平蜘蛛鍋の爆発後、小さな蜘蛛鍋が残る。眠っていない敵を持続的に誘引_15ターン_し、その後3x3範囲の爆発を起こし_10〜20_のダメージを与える。_\n\n_+4：_平蜘蛛鍋の爆発後、小さな蜘蛛鍋が残る。眠っていない敵を持続的に誘引_15ターン_し、その後3x3範囲の爆発を起こし_15〜30_のダメージを与える。
actors.hero.talent.firework.comment=

actors.hero.heroclass.dm400=DM-400
actors.hero.heroclass.dm400_desc_short=DM-400は_指令集合ツール_で無人機を生産して戦闘を補助でき、その物理攻撃は戦闘型無人機の敵への効果を_強化_する。また_非生物_属性を持つ。
actors.hero.heroclass.dm400_desc=DM-400は初期に専用の_指令集合ツール_を持ち、無人機を生産して戦闘を補助できる。\n\nDM-400は_非生物_属性を持ち、初期HPは低く武器も携帯していないが、素手攻撃で_1〜8_のダメージを与えられる。DM-400の物理攻撃が敵に命中すると、3ターン重複不可の_指令標記_効果を与える。これにより一部の戦闘型無人機の敵への効果が強化される。\n\n同時に、DM-400は初期に_2つの廃棄歯車_、布甲、水袋と布袋を携帯する。\n\nDM-400が初期に鑑定するアイテム：\n_-_氷霜の薬\n_-_変異巻物、鑑定巻物とチャージ巻物
actors.hero.heroclass.dm400_unlock=_一回のゲームでDM-300を倒す_ことでDM-400をアンロック。

actors.hero.talent.mark_meal.title=標記食事
actors.hero.talent.mark_meal.desc=_+1：_食事がDM-400の次に敵に与える2回の物理攻撃に付帯する指令標記の持続時間を_5ターン_に上昇。_\n\n_+2：_食事がDM-400の次に敵に与える2回の物理攻撃に付帯する指令標記の持続時間を_6ターン_に上昇。
actors.hero.talent.mark_meal.comment=「4 65 6C 69 63 6F 75 73.」
actors.hero.talent.mark_meal.meta_desc=_この天賦が他の英雄に獲得された場合、2/3ターンのスタンになる。

actors.hero.talent.over_code.title=超越コード
actors.hero.talent.over_code.desc=_+1：_DM-400がアップグレード巻物か変異巻物を読む時、ランダムに_1種の巻物_を鑑定。_\n\n_+2：_DM-400がアップグレード巻物か変異巻物を読む時、ランダムに_1種の巻物または1種の薬剤_を鑑定。
actors.hero.talent.over_code.comment=この天賦はアップグレード巻物や変異巻物を材料として作られたアイテム使用時にも発動する。\n\n「Decoding Files...」

actors.hero.talent$markmeal.name=標的打撃
actors.hero.talent$markmeal.desc=DM-400の次の数回の物理攻撃が与える指示標効果が延長される。\n\n他のヒーローがこの効果を得た場合、次の数回の物理攻撃が目標に一定ターンのスタン効果を与える。\n\n残り回数：%1$d

actors.hero.talent.tbm.title=定期メンテナンス
actors.hero.talent.tbm.desc=_+1：_DM-400は60ターンごとに_3シールド_を得る。\n\n_+2：_DM-400は60ターンごとに_5シールド_を得る。
actors.hero.talent.tbm.comment=「Repairing Files...」

actors.hero.talent.target_targeting.title=標的狙い
actors.hero.talent.target_targeting.desc=_+1：_指示標_効果のある敵を攻撃する時、DM-400は_1追加ダメージ_を与える。\n\n_+2：_指示標_効果のある敵を攻撃する時、DM-400は_2追加ダメージ_を与える。
actors.hero.talent.target_targeting.comment=「Target Locked.」
actors.hero.talent.target_targeting.meta_desc=_このタレントが他のヒーローに取得された場合_、スタン効果のある敵に対して有効になる。

actors.hero.talent.over_meal.title=食事オーバーロード
actors.hero.talent.over_meal.desc=_+1：_DM-400の食事_0.5ターンのみ_で済む。\n\n_+2：_DM-400の食事_ターンを消費しない_。
actors.hero.talent.over_meal.comment=「53 72 75 6E 63 68 79.」

actors.hero.talent.recover_charge.title=充電回収
actors.hero.talent.recover_charge.desc=_+1：_DM-400が指示集約ツールに巻物を記録すると、指示集約ツールの充電を_1回復_する。\n\n_+2：_DM-400が指示集約ツールに巻物を記録すると、指示集約ツールの充電を_2回復_する。
actors.hero.talent.recover_charge.comment=「Recycle.」
actors.hero.talent.recover_charge.meta_desc=_このタレントが他のヒーローに取得された場合_、+1ではヒーローが巻物または不定魔道書を読んだ後に2ターンの神器充電を得、+2では4ターンに向上する。アップグレード巻物、変性巻物、またはこれらを用いて錬金したアイテムではこの効果は強化されず、生産量の多い錬金品（例：大部分の結晶）ではそのアイテムの単回生産数に基づいて確率で発動する。

actors.hero.talent.body_reinforce.title=機体強化
actors.hero.talent.body_reinforce.desc=_+1：_DM-400が生産するドローンはその_50%の装甲_を継承する。\n\n_+2：_DM-400が生産するドローンはその_75%の装甲_を継承する。
actors.hero.talent.body_reinforce.comment=「鉄人100とその鉄甲軍団。」
actors.hero.talent.body_reinforce.meta_desc=_このタレントが他のヒーローに取得された場合_、+1ではヒーローが少なくとも20ダメージを受けた時に5%のダメージ軽減を得、+2では少なくとも10ダメージを受けた時に10%のダメージ軽減を得る。

actors.hero.talent.efficient_order.title=効率的指示
actors.hero.talent.efficient_order.desc=_+1：_DM-400の全味方_移動速度が30%上昇_する。\n\n_+2：_DM-400の全味方_移動速度が45%上昇_する。
actors.hero.talent.efficient_order.comment=「Go Work.」

actors.hero.talent.rocket_fist.title=ロケットパンチ
actors.hero.talent.rocket_fist.desc=_+1：_DM-400の素手攻撃は_60%の確率で目標を1マスノックバック_する。\n\n_+2：_DM-400の素手攻撃は_60%の確率で目標を2マスノックバック_する。
actors.hero.talent.rocket_fist.comment=近接武器で攻撃する場合、ノックバック確率は_30%のみ_となる。\n\n「ロケットパンチ——！！！」

actors.hero.talent.big_fist.title=強打
actors.hero.talent.big_fist.desc=_+1：_DM-400の素手攻撃は敵の装甲を無視し、ダメージが_3~20_に上昇する。\n\n_+2：_DM-400の素手攻撃は敵の装甲を無視し、ダメージが_4~25_に上昇する。\n\n_+3：_DM-400の素手攻撃は敵の装甲を無視し、ダメージが_5~30_に上昇する。
actors.hero.talent.big_fist.comment=武力の指輪を装備するとDM-400の素手ダメージを上書きし、直接加算はしないが、敵の装甲を無視する効果は維持される。

actors.hero.talent.quick_tool.title=クイックツール
actors.hero.talent.quick_tool.desc=_+1：_DM-400は指示集約ツールを装備していなくてもその機能を使用できるが、未装備時のツール充電速度は_25%_に低下する。\n\n_+2：_DM-400は指示集約ツールを装備していなくてもその機能を使用できるが、未装備時のツール充電速度は_50%_に低下する。\n\n_+3：_DM-400は指示集約ツールを装備していなくてもその機能を使用できるが、未装備時のツール充電速度は_75%_に低下する。
actors.hero.talent.quick_tool.comment=
actors.hero.talent.quick_tool.meta_desc=_このタレントが他のヒーローに取得された場合_、+1/+2/+3レベルで全味方が10/20/30%の追加ダメージ軽減を得る。

actors.hero.herosubclass.at400=AT-400
actors.hero.herosubclass.at400_short_desc=_AT-400_はより多くの種類の戦闘型ドローンを呼び出して協力戦闘を行い、巨大なドローン群が敵対目標を効果的に打撃する。
actors.hero.herosubclass.at400_desc=AT-400は標識された敵を攻撃する際に物理ダメージが30%増加し、より多くの巻物を記録して多種の戦闘型ドローンを呼び出せるようになる。これらのドローンは戦闘性能においてより優れている。\n\n閃光ドローン（祓邪）：敵を攻撃すると同時に敵の視界を妨害する\nレーザードローン（充電）：強力なレーザー光線を放射して敵を焼く\n迷乱ドローン（催眠）：攻撃時にスタンやノックバックを与える機会がある\n襲擾ドローン（憤怒）：敵を撹乱し、時には躁状態にする\n威嚇ドローン（恐怖）：火力で制圧し敵を威嚇する\n混沌ドローン（変性）：時間経過後に任意の補助型ドローンや奇妙なものに変化する\n\n_ランダムモード_が有効で、指示集約ツールを所持していない場合、この専精を選択すると一組の指示集約ツールを得る。

actors.hero.talent.sustain_mark.title=持続標的
actors.hero.talent.sustain_mark.desc=_+1：_AT-400の物理攻撃は_追加で2ターンの指示標_効果を与える。\n\n_+2：_AT-400の物理攻撃は_追加で4ターンの指示標_効果を与える。\n\n_+3：_AT-400の物理攻撃は_追加で6ターンの指示標_効果を与える。
actors.hero.talent.sustain_mark.comment=このタレントは襲擾ドローンと威嚇ドローンに有効。

actors.hero.talent.battle_upgrade.title=戦闘アップグレード
actors.hero.talent.battle_upgrade.desc=_+1：_AT-400が生産する全戦闘型ドローンのダメージが_15%上昇_し、さらに敵の装甲に基づいて追加上昇する。この追加上昇は最大で敵の_26.7%の装甲_を無視するのに相当する。\n\n_+2：_AT-400が生産する全戦闘型ドローンのダメージが_22.5%上昇_し、さらに敵の装甲に基づいて追加上昇する。この追加上昇は最大で敵の_53.3%の装甲_を無視するのに相当する。\n\n_+3：_AT-400が生産する全戦闘型ドローンのダメージが_30%上昇_し、さらに敵の装甲に基づいて追加上昇する。この追加上昇は最大で敵の_80%の装甲_を無視するのに相当する。
actors.hero.talent.battle_upgrade.comment=このタレントは僚機ドローンには有効でない。

actors.hero.talent.fly_drone.title=空中の蚊
actors.hero.talent.fly_drone.desc=_+1：_AT-400が生産する全戦闘型ドローンは受ける_最初の1回の攻撃_を必ず回避する。\n\n_+2：_AT-400が生産する全戦闘型ドローンは受ける_最初の2回の攻撃_を必ず回避する。\n\n_+3：_AT-400が生産する全戦闘型ドローンは受ける_最初の3回の攻撃_を必ず回避する。
actors.hero.talent.fly_drone.comment=このタレントは僚機ドローン、混沌ドローン、補助型ドローンには有効でない。

actors.hero.ally.attackdrone.name=戦闘型ドローン
actors.hero.ally.attackdrone.desc=専任戦闘用ドローン。
actors.hero.ally.attackdrone$flashdrone.name=閃光ドローン
actors.hero.ally.attackdrone$flashdrone.desc=_祓邪の巻物_を記録して生産される戦闘型ドローン。レーザー銃身を装備しているが、実際は「瞳孔」からレーザー光線を放射して攻撃する。そのレーザー銃身は発射指示燈の役割しか果たしていない。\n\n3マスの攻撃距離を持ち、指示標効果のある敵を攻撃すると敵を2ターン盲目にし、さらに指示標効果のあるアンデッドと悪魔属性の敵に追加で5の魔法ダメージを与える。
actors.hero.ally.attackdrone$laserdrone.name=レーザードローン
actors.hero.ally.attackdrone$laserdrone.desc=_充電の巻物_を記録して生産される戦闘型ドローン。外見は浮遊する大型レーザー砲のようで、実際の効果もその通り。放射するレーザーは「焼き肉」にぴったり。\n\n遠距離攻撃で魔法ダメージを与え、指示標効果のある敵を攻撃すると50%の確率で敵を3ターン燃焼させる。
actors.hero.ally.attackdrone$anesthesiadrone.name=迷乱ドローン
actors.hero.ally.attackdrone$anesthesiadrone.desc=_催眠の巻物_を記録して生産される戦闘型ドローン。二つの機械腕に電撃装置が接続されており、目標を麻痺させるほどではないが、目まいを起こさせる。電撃されたいと思う者はいないだろう。\n\n指示標効果のある敵を攻撃すると73%の確率で敵を3ターンスタンさせ、さらに50%の確率で1マスノックバックする。
actors.hero.ally.attackdrone$raiddrone.name=襲擾ドローン
actors.hero.ally.attackdrone$raiddrone.desc=_憤怒の巻物_を記録して生産される戦闘型ドローン。この小型ドローンはより速い飛行速度を持ち、目標の撹乱に最適。大量の「虫」に悩まされれば、どんなに忍耐強い目標でも苛立つ。\n\n2倍の飛行速度と3マスの攻撃距離を持つ。指示標効果のない敵を攻撃すると33%の確率で3ターン（重複不可）の指示標効果を与え、指示標効果のある敵を攻撃すると67%の確率で3ターン狂乱させる。
actors.hero.ally.attackdrone$shockdrone.name=威嚇ドローン
actors.hero.ally.attackdrone$shockdrone.desc=_恐怖の巻物_を記録して生産される戦闘型ドローン。重型狙撃銃身を装備し、目標の肉を容易に貫通する。このようなドローンが量産される時、逃げるのが賢明な選択かもしれない。\n\n遠距離攻撃。指示標効果のない敵を攻撃すると67%の確率で3ターン（重複不可）の指示標効果を与え、指示標効果のある敵を攻撃すると83%の確率で6ターン恐怖させる。

actors.hero.ally.auxiliarydrone.name=補助型ドローン
actors.hero.ally.auxiliarydrone.desc=専任補助用ドローン。
actors.hero.ally.auxiliarydrone$scoutdrone.name=偵察ドローン
actors.hero.ally.auxiliarydrone$scoutdrone.desc=_鑑定の巻物_を記録して生産される補助型ドローン。主に偵察作業に用いられ、その「瞳孔」は常に周囲の地形と活動目標を走査する。また、これはホストと全視界を共有する唯一の附属ドローンである。\n\n初期視野範囲は小さい（ツールのアップグレードで拡大）が、DM-400と全視界を共有し、さらに視野内の全敵の弱点を標識して被ダメージを13%（重複不可）上昇させる。
actors.hero.ally.auxiliarydrone$weaknessmark.name=弱点標識
actors.hero.ally.auxiliarydrone$weaknessmark.desc=この敵の弱点は偵察ドローンによって標識されている。\n\n偵察ドローンの視野内にいる敵は、その弱点が持続的に標識され、受けるダメージが13%%上昇する。\n\n残りターン数：%sターン
actors.hero.ally.auxiliarydrone$mirrordrone.name=映像ドローン
actors.hero.ally.auxiliarydrone$mirrordrone.desc=_鏡像の巻物_を記録して生産される補助型ドローン。新型の映像技術を採用し、自由に行動する使用者の鏡像を映し出す。もちろん、この技術の原理は依然として魔法である。\n\n一定時間ごとに周囲に1体のDM-400の鏡像を生成する。ツールをアップグレードすると鏡像生成に必要な時間が短縮される。
actors.hero.ally.auxiliarydrone$protectdrone.name=庇護ドローン
actors.hero.ally.auxiliarydrone$protectdrone.desc=_転送の巻物_を記録して生産される補助型ドローン。ホストの周囲に不可視の防御フィールドを生成し、破壊されると攻撃者を別の場所に転送する。十分な安全感を提供してくれるだろう。\n\n存在中はDM-400に追加で1~3の装甲を提供し、敵に破壊されると敵をランダムな場所に転送する。
actors.hero.ally.auxiliarydrone$escortdrone.name=護衛ドローン
actors.hero.ally.auxiliarydrone$escortdrone.desc=_探査の巻物_を記録して生産される補助型ドローン。ホストの行動を隠蔽する能力を持ち、探索活動に安全保障を提供する。ただ、なぜか目標はドローンの存在にも気づきにくい。\n\nDM-400の行動を敵に気づかれにくくし、一定時間ごとにDM-400を4ターンの不可視状態にする。
actors.hero.ally.auxiliarydrone$bombdrone.name=爆破ドローン
actors.hero.ally.auxiliarydrone$bombdrone.desc=_復讐の巻物_を記録して生産される補助型ドローン。大きな殺傷力を持つ爆破能力を有し、目標に高速で接近して自爆攻撃を行う。爆発はホストや他の附属ドローンを傷つけない。\n\n2倍の飛行速度を持ち、周囲1マスに敵が存在すると持続的にHPを失い、HPが尽きるか破壊されると敵のみにダメージを与える爆発を起こす。
actors.hero.ally.auxiliarydrone$chaosdrone.name=混沌ドローン
actors.hero.ally.auxiliarydrone$chaosdrone.desc=_変性の巻物_を記録して生産される特殊ドローン。なぜか、由来不明の黑白のブロックがその周囲で明滅している…\n\n何の効果もなく、時間経過後にDM-400の専精職業に応じてランダムな補助型または戦闘型ドローンに変化する。もちろん、予想外のものに変わる可能性もある…ツールのアップグレードで変化に必要な時間が短縮される。

actors.hero.herosubclass.au400=AU-400
actors.hero.herosubclass.au400_short_desc=_AU-400_はより多くの種類の補助型ドローンを呼び出して協力戦闘を行い、機能性の高いドローンを活用して生存能力を効果的に向上させる。
actors.hero.herosubclass.au400_desc=AU-400は標識された敵から物理攻撃を受けた際に20%のダメージ軽減を持ち、より多くの巻物を記録して多種の補助型ドローンを呼び出せるようになる。これらのドローンは補助性能においてより優れている。\n\n偵察ドローン（鑑定）：偵察に用いると同時に敵の弱点を暴く\n映像ドローン（鏡像）：一定時間ごとに自分の鏡像を生成する\n庇護ドローン（転送）：防御を向上させ、危険な敵を転送する\n護衛ドローン（探査）：足跡を隠蔽し探索の安全性を高める\n爆破ドローン（復讐）：自爆で敵を殺傷する\n混沌ドローン（変性）：時間経過後に任意の戦闘型ドローンや奇妙なものに変化する\n\n_ランダムモード_が有効で、指示集約ツールを所持していない場合、この専精を選択すると一組の指示集約ツールを得る。

actors.hero.talent.special_mark.title=特化標識
actors.hero.talent.special_mark.desc=_+1：_AU-400が_指示標_効果のある敵を攻撃する時、精度が_50%上昇_し、_16.7%の確率_で_3ターンの集中砲火_効果を与える。\n\n_+2：_AU-400が_指示標_効果のある敵を攻撃する時、精度が_75%上昇_し、_33.3%の確率_で_3ターンの集中砲火_効果を与える。\n\n_+3：_AU-400が_指示標_効果のある敵を攻撃する時、精度が_100%上昇_し、_50%の確率_で_3ターンの集中砲火_効果を与える。
actors.hero.talent.special_mark.comment=

actors.hero.talent.assist_upgrade.title=補助アップグレード
actors.hero.talent.assist_upgrade.desc=_+1：_AU-400が生産する全補助型ドローンは1機あたり_50ターン_ごとに_4シールド_を提供する。\n\n_+2：_AU-400が生産する全補助型ドローンは1機あたり_40ターン_ごとに_4シールド_を提供する。\n\n_+3：_AU-400が生産する全補助型ドローンは1機あたり_30ターン_ごとに_4シールド_を提供する。
actors.hero.talent.assist_upgrade.comment=このタレントで重ねたシールドは最大HPの半分を超えない。\n\nこのタレントは僚機ドローン、混沌ドローン、戦闘型ドローンには有効でない。

actors.hero.talent.fast_cruise.title=高速巡航
actors.hero.talent.fast_cruise.desc=_+1：_AU-400が生産する全補助型ドローンは1機あたり_80ターン_ごとに_2ターンの極速_を提供する。\n\n_+2：_AU-400が生産する全補助型ドローンは1機あたり_70ターン_ごとに_2ターンの極速_を提供する。\n\n_+3：_AU-400が生産する全補助型ドローンは1機あたり_60ターン_ごとに_2ターンの極速_を提供する。
actors.hero.talent.fast_cruise.comment=このタレントは僚機ドローン、混沌ドローン、戦闘型ドローンには有効でない。

actors.hero.abilities.dm400.routine.name=定期メンテナンス
actors.hero.abilities.dm400.routine.short_desc=DM-400が自身に対して_定期メンテナンス_を行い、短時間で自身の性能を向上させる。
actors.hero.abilities.dm400.routine.desc=DM-400は4ターンかけて自身に定期メンテナンスを実施し、その間受けるダメージが50%減少し、その後10ターンのオーバーロード状態に入る。\n\nオーバーロード中のDM-400は攻撃速度と移動速度が2倍になる（ドローンもこのボーナスを受ける）が、自身の被ダメージが50%増加する。
actors.hero.abilities.dm400.routine$overload.name=オーバーロードモード
actors.hero.abilities.dm400.routine$overload.desc=警告！DM-400とその附属ドローンがオーバーロードモードに入りました！\n\nこの間、DM-400とドローンの攻撃速度と移動速度が2倍になるが、DM-400の被ダメージも上昇する。\n\n残りターン数：%sターン
actors.hero.talent.over_extend.title=オーバーロード延長
actors.hero.talent.over_extend.desc=_+1：_オーバーロードが_12ターン_に延長。\n\n_+2：_オーバーロードが_15ターン_に延長。\n\n_+3：_オーバーロードが_17ターン_に延長。\n\n_+4：_オーバーロードが_20ターン_に延長。
actors.hero.talent.over_extend.comment=
actors.hero.talent.terror_mach.title=恐怖機械
actors.hero.talent.terror_mach.desc=_+1：_オーバーロード後、初めてDM-400の視野に入った敵が_2ターンの恐怖_に陥る。\n\n_+2：_オーバーロード後、初めてDM-400の視野に入った敵が_4ターンの恐怖_に陥る。\n\n_+3：_オーバーロード後、初めてDM-400の視野に入った敵が_6ターンの恐怖_に陥る。\n\n_+4：_オーバーロード後、初めてDM-400の視野に入った敵が_8ターンの恐怖_に陥る。
actors.hero.talent.terror_mach.comment=各敵はこの効果による恐怖を一度だけ受ける。
actors.hero.talent.strong_perserve.title=強力メンテナンス
actors.hero.talent.strong_perserve.desc=_+1：_メンテナンス完了後、自身と全ドローンに_最大HPの2.5%のシールド_を与え、オーバーロード中の被ダメージが_5%減少_する。\n\n_+2：_メンテナンス完了後、自身と全ドローンに_最大HPの5%のシールド_を与え、オーバーロード中の被ダメージが_10%減少_する。\n\n_+3：_メンテナンス完了後、自身と全ドローンに_最大HPの7.5%のシールド_を与え、オーバーロード中の被ダメージが_15%減少_する。\n\n_+4：_メンテナンス完了後、自身と全ドローンに_最大HPの10%のシールド_を与え、オーバーロード中の被ダメージが_20%減少_する。
actors.hero.talent.strong_perserve.comment=

actors.hero.abilities.dm400.discharge_gas.name=排気
actors.hero.abilities.dm400.discharge_gas.short_desc=DM-400が_排気_を行い、体内に溜まった有害ガスを放出する。
actors.hero.abilities.dm400.discharge_gas.desc=DM-400は体内に長期蓄積した排気ガスを放出し、視野内の全敵に毒ガスを噴射し、同時に自身の全弱体効果を除去する。\n\n視野内に敵が存在しない場合、毒ガスは放出せず、自身の弱体効果のみを除去する。\n\n排気基本量：_50_
actors.blobs.discharge_gas$dm400gas.name=機械排気
actors.blobs.discharge_gas$dm400gas.desc=ここには緑色に光る機械排気が漂っている。DM-400とそのドローンはこのガスの効果を無視する。
actors.hero.talent.over_time.title=長期蓄積
actors.hero.talent.over_time.desc=_+1：_噴射される毒ガス量が_15%増加_。\n\n_+2：_噴射される毒ガス量が_30%増加_。\n\n_+3：_噴射される毒ガス量が_45%増加_。\n\n_+4：_噴射される毒ガス量が_60%増加_。
actors.hero.talent.over_time.comment=
actors.hero.talent.deadly_gas.title=致死ガス
actors.hero.talent.deadly_gas.desc=_+1：_DM-400が噴射する毒ガスの_ダメージ+1_。\n\n_+2：_DM-400が噴射する毒ガスの_ダメージ+2_。\n\n_+3：_DM-400が噴射する毒ガスの_ダメージ+3_。\n\n_+4：_DM-400が噴射する毒ガスの_ダメージ+4_。
actors.hero.talent.deadly_gas.comment=
actors.hero.talent.discharge_happy.title=排気爽快
actors.hero.talent.discharge_happy.desc=_+1：_DM-400が毒ガス噴射後に_2ターンの極速_を得る。\n\n_+2：_DM-400が毒ガス噴射後に_4ターンの極速_を得る。\n\n_+3：_DM-400が毒ガス噴射後に_6ターンの極速_を得る。\n\n_+4：_DM-400が毒ガス噴射後に_8ターンの極速_を得る。
actors.hero.talent.discharge_happy.comment=

actors.hero.abilities.dm400.honeycomb.name=ハイブクラスター
actors.hero.abilities.dm400.honeycomb.short_desc=DM-400が_ハイブクラスター_プログラムを起動し、ドローンが破壊されるたびにホストにボーナスを提供する。
actors.hero.abilities.dm400.honeycomb.desc=DM-400がハイブクラスタープログラムを起動し、20ターンの間、ドローンが破壊されるたびにDM-400の最大HPの2%を回復し、さらに2ターンの神器充電を与える。
actors.hero.abilities.dm400.honeycomb$honeycombbuff.name=クラスタープログラム
actors.hero.abilities.dm400.honeycomb$honeycombbuff.desc=DM-400がこのプログラムを実行中。附属ドローンはホストとデータを共有する。\n\nプログラム実行中、全ての附属ドローンが破壊されるとホストにデータを送信し、DM-400の機体生存状態を維持し、新しいドローンの生成を加速する。\n\n残りターン数：%sターン
actors.hero.talent.process_extend.title=プロセス延長
actors.hero.talent.process_extend.desc=_+1：_クラスタープログラム起動中、ドローンが破壊されるたびにプログラムの有効時間が_0.5ターン延長_される。\n\n_+2：_クラスタープログラム起動中、ドローンが破壊されるたびにプログラムの有効時間が_1ターン延長_される。\n\n_+3：_クラスタープログラム起動中、ドローンが破壊されるたびにプログラムの有効時間が_1.5ターン延長_される。\n\n_+4：_クラスタープログラム起動中、ドローンが破壊されるたびにプログラムの有効時間が_2ターン延長_される。
actors.hero.talent.process_extend.comment=
actors.hero.talent.glorious_dead.title=光栄なる犠牲
actors.hero.talent.glorious_dead.desc=_+1：_クラスタープログラム起動中、ドローンが破壊されるたびにDM-400が_最大HPの1.5%_のHPを回復。\n\n_+2：_クラスタープログラム起動中、ドローンが破壊されるたびにDM-400が_最大HPの3%_のHPを回復。\n\n_+3：_クラスタープログラム起動中、ドローンが破壊されるたびにDM-400が_最大HPの4.5%_のHPを回復。\n\n_+4：_クラスタープログラム起動中、ドローンが破壊されるたびにDM-400が_最大HPの6%_のHPを回復。
actors.hero.talent.glorious_dead.comment=
actors.hero.talent.upon_wave.title=次々と
actors.hero.talent.upon_wave.desc=_+1：_クラスタープログラム起動中、ドローンが破壊されるたびにDM-400に_3ターンの神器充電_を与える。\n\n_+2：_クラスタープログラム起動中、ドローンが破壊されるたびにDM-400に_4ターンの神器充電_を与える。\n\n_+3：_クラスタープログラム起動中、ドローンが破壊されるたびにDM-400に_5ターンの神器充電_を与える。\n\n_+4：_クラスタープログラム起動中、ドローンが破壊されるたびにDM-400に_6ターンの神器充電_を与える。
actors.hero.talent.upon_wave.comment=

actors.hero.abilities.freeman.salescontract.name=奴隷契約
actors.hero.abilities.freeman.salescontract.short_desc=紳士が敵を惑わして_奴隷契約_を結ばせ、敵を生涯使役する。
actors.hero.abilities.freeman.salescontract.desc=紳士はどこで学んだかわからない汎用魔物語で敵を説得し（もちろんこれは主に王冠の力による）、奴隷契約を結ぶ。契約を結んだ敵は生涯彼のために働く。\n\nもちろん、紳士の話術ではすべての者や魔物を説得できるわけではない。ボス、ミニボス、エリート、味方は契約を拒否する。
actors.hero.abilities.freeman.salescontract$saleself.name=生涯隷属
actors.hero.abilities.freeman.salescontract$saleself.desc=この敵は紳士に丸め込まれて無条件で自分を売り渡し、今紳士のために働いている。\n\n既に契約を結んだ敵は再び契約できない。来世までは流石に無理だろう？
actors.hero.abilities.freeman.salescontract$workerwraith.name=労働亡霊
actors.hero.abilities.freeman.salescontract$workerwraith.desc=満身の怨みを抱えて非業の死を遂げた労働者（魔物）が化した怨霊。身体は死んでいるが、契約内容に従って紳士のために働き続ける。\n\n哀れな奴め、本当に紳士のために二世分も働く羽目になった。
actors.hero.abilities.freeman.salescontract.self_target=自身を対象にできません。
actors.hero.abilities.freeman.salescontract.no_target=契約を結べる目標がいません。
actors.hero.abilities.freeman.salescontract.more_distance=目標との距離が遠すぎます。
actors.hero.abilities.freeman.salescontract.strong_target=目標はあなたとの契約を拒否し、軽蔑の念を抱いています。
actors.hero.talent.elite_recruit.title=エリート採用
actors.hero.talent.elite_recruit.desc=_+1：_契約時に、紳士は追加で_200ゴールド_を消費して契約敵にランダムなエリート効果を付与する。\n\n_+2：_契約時に、紳士は追加で_150ゴールド_を消費して契約敵にランダムなエリート効果を付与する。\n\n_+3：_契約時に、紳士は追加で_100ゴールド_を消費して契約敵にランダムなエリート効果を付与する。\n\n_+4：_契約時に、紳士は追加で_50ゴールド_を消費して契約敵にランダムなエリート効果を付与する。
actors.hero.talent.elite_recruit.comment=
actors.hero.talent.prim_accu.title=原始的蓄積
actors.hero.talent.prim_accu.desc=_+1：_契約した敵が他の敵に物理攻撃を行うと、紳士に_10ゴールド_を与える。\n\n_+2：_契約した敵が他の敵に物理攻撃を行うと、紳士に_20ゴールド_を与える。\n\n_+3：_契約した敵が他の敵に物理攻撃を行うと、紳士に_30ゴールド_を与える。\n\n_+4：_契約した敵が他の敵に物理攻撃を行うと、紳士に_40ゴールド_を与える。
actors.hero.talent.prim_accu.comment=
actors.hero.talent.soul_contract.title=魂の契約
actors.hero.talent.soul_contract.desc=_+1：_契約した敵が死亡すると_腐敗した労働亡霊_となり、紳士は契約書の誰も気にしない細部によって本来労働亡霊のものである労災補償金_100ゴールド_を得る。\n\n_+2：_+1に加え、労働亡霊の腐敗効果が_生涯隷属_効果になる。\n\n_+3：_+1と+2に加え、労働亡霊が_ランダムなエリート_効果を得る。\n\n_+4：_+1、+2、+3に加え、労働亡霊の_最大HPが生前（元契約敵）と同等_になる。
actors.hero.talent.soul_contract.comment=

actors.mobs.transformmimic.name=変性ミミック
actors.mobs.transformmimic.desc=ミミックは自由に外見を変えられる魔法生物。ダンジョンではほとんど常に宝箱の姿で現れる。油断した冒険者を惹きつけるためだ。\n\n変性ミミックは変性の巻物が邪悪な力に影響されて化けたミミックである。その攻防能力は通常のミミックと変わらないが、中身は常に変性の巻物のみで他の戦利品はない。
actors.mobs.transformmimic.reveal=そこにミミックがいる！
actors.mobs.transformmimic.hidden_name=紫色の宝箱？
actors.mobs.transformmimic.hidden_desc=開ける前は中に何があるか見えない！\n\nこの紫色の宝箱は一般的な宝箱とは大きく異なる。無闇に開けない方が良い。
actors.mobs.transformmimic.discover_hint=特定のチャレンジを有効にすると、任意のダンジョンエリアでこの敵に遭遇できる。

actors.hero.heroclass.princess=ドワーフプリンセス
actors.hero.heroclass.princess_desc_short=ドワーフプリンセスはエンチャントと刻印を保存できる_王儲の指輪_を携帯し、さらに数ポイントの錬金エネルギーを消費して任意のルーンストーンを_エンチャントルーンに変換_できる。
actors.hero.heroclass.princess_desc=ドワーフプリンセスは初期に_唯一無二の王儲の指輪_を携帯しており、武器や鎧のようにエンチャントと刻印を保存し、それらに直接作用させることができる。\n\nドワーフプリンセスは任意のルーンストーンを_エンチャントルーンに変換_できる。これには2ポイントの錬金エネルギーを消費する。\n\nまた、ドワーフプリンセスは初期に_腕盾_、_ルーンストリング_、布鎧、水袋、フランネルバッグを携帯している。\n\nドワーフプリンセス開始時に鑑定されるアイテム：\n_-_浮遊薬剤\n_-_変性の巻物、鑑定の巻物、復讐の巻物
actors.hero.heroclass.princess_unlock=_1回のゲームでドワーフキングを倒す_ことでドワーフプリンセスをアンロックする。
actors.hero.talent.enchant_meal.title=魔力の食事
actors.hero.talent.enchant_meal.desc=_+1：_食事によりドワーフプリンセスの物理武器のエンチャントまたはカースの発動確率が上昇し、以降の_3回の攻撃_が1.33倍の発動確率を持つ。\n\n_+2：_食事によりドワーフプリンセスの物理武器のエンチャントまたはカースの発動確率が上昇し、以降の_5回の攻撃_が1.33倍の発動確率を持つ。
actors.hero.talent.enchant_meal.comment=装備中の王儲の指輪がエンチャントを持っている場合、このタレントは素手攻撃、エンチャントのない武器、投擲武器にも有効。\n\n「言ったか？腹が満ちれば満ちるほど、オーケインエネルギーは強くなるってな？」

actors.hero.talent$enchantmeal.name=エンチャント強化
actors.hero.talent$enchantmeal.desc=あなたの次の数回の物理攻撃がエンチャントを発動する確率が上昇する。\n\n残り回数：%1$d
actors.hero.talent.mana_sense.title=魔能感知
actors.hero.talent.mana_sense.desc=_+1：_ドワーフプリンセスがエンチャントと刻印のある武器と鎧を鑑定する速度が元の_5倍_になる。\n\n_+2：_ドワーフプリンセスは_エンチャントと刻印のある武器と鎧を装備する時_に直接鑑定できる。
actors.hero.talent.mana_sense.comment=「授業でいつも言っているように、君は生まれながらにオーケインエネルギーに対する最も鋭敏な感知力を持っているんだ。」

actors.hero.talent.rune_blade.title=ルーンブレード
actors.hero.talent.rune_blade.desc=_+1：_ドワーフプリンセスがエンチャントのある物理武器で攻撃する時、_1の魔法ダメージ_を追加する。\n\n_+2：_ドワーフプリンセスがエンチャントのある物理武器で攻撃する時、_2の魔法ダメージ_を追加する。
actors.hero.talent.rune_blade.comment=装備中の王儲の指輪がエンチャントを持っている場合、このタレントは素手攻撃、エンチャントのない武器、投擲武器にも有効。\n\n「溢れ出るオーケインエネルギーは実体の魔力となる。」

actors.hero.talent.arcane_shield.title=オーケインシールド
actors.hero.talent.arcane_shield.desc=_+1：_攻撃を受けた時、ドワーフプリンセスが装備する鎧に刻印がある場合、直ちに_2シールド_を得る。\n\n_+2：_攻撃を受けた時、ドワーフプリンセスが装備する鎧に刻印がある場合、直ちに_3シールド_を得る。
actors.hero.talent.arcane_shield.comment=このタレントは_10ターンのクールダウン_を持つ。\n\n装備中の王儲の指輪が刻印を持っている場合、このタレントは無甲防御、刻印のない鎧にも有効。\n\n「溢れ出るオーケインエネルギーが君を守る。」

actors.hero.talent$arcaneshieldcooldown.name=オーケインシールド-クールダウン
actors.hero.talent$arcaneshieldcooldown.desc=あなたは先ほどこのタレントを発動した。少し待ってから再度発動できる。\n\n残りクールダウン：%sターン
actors.hero.talent.royal_meal.title=ロイヤルバンケット
actors.hero.talent.royal_meal.desc=_+1：_ドワーフプリンセスの食事は_1ターンのみ_で済み、食事後の10ターン間、王儲の指輪が_1レベル上昇_する。\n\n_+2：_ドワーフプリンセスの食事は_1ターンのみ_で済み、食事後の10ターン間、王儲の指輪が_2レベル上昇_する。
actors.hero.talent.royal_meal.comment=バッグ内に王儲の指輪がない場合、このタレントは_+1/+2_レベルで全指輪を_5/10ターン_間1レベル上昇させる。\n\n「上流階級の食事。」

actors.hero.talent$royalmeal.name=ロイヤルバンケット
actors.hero.talent$royalmeal.desc=ドワーフプリンセスが食事後に王儲の指輪を強化し、追加レベルを得る。\n\nバッグ内に王儲の指輪がない場合、この効果は全指輪が追加レベルを得るように変更される。\n\n残りターン数：%sターン
actors.hero.talent.rune_expert.title=ルーンエキスパート
actors.hero.talent.rune_expert.desc=_+1：_ドワーフプリンセスが任意のルーンをエンチャントルーンに変換するのに必要な錬金エネルギー消費が_2減少_する。\n\n_+2：_ドワーフプリンセスが任意のルーンをエンチャントルーンに変換するのに必要な錬金エネルギー消費が_4減少_する。
actors.hero.talent.rune_expert.comment=「宮廷付きエンチャンターの教えは今も鮮明に覚えている。ルーンの変換は呼吸するように簡単になった。」
actors.hero.talent.rune_expert.meta_desc=_このタレントが他のヒーローに取得された場合_、+1/+2レベルで巻物を錬金釜で分解して得られるルーンストーンの数が+1/+2される。

actors.hero.talent.str_rune.title=強力ルーン
actors.hero.talent.str_rune.desc=_+1：_ドワーフプリンセスがエンチャントルーンを使用する時、ランダムレベルに加えて_通常レベル_の選択肢が増える。\n\n_+2：_ドワーフプリンセスがエンチャントルーンを使用する時、ランダムレベルに加えて_レアレベル_の選択肢が増える。\n\n_+3：_ドワーフプリンセスがエンチャントルーンを使用する時、ランダムレベルに加えて_通常レベル_と_レアレベル_の選択肢が増える。
actors.hero.talent.str_rune.comment=
actors.hero.talent.more_ring.title=さらなる指輪
actors.hero.talent.more_ring.desc=_+1：_ドワーフプリンセスは_王儲の指輪_を神器スロットに装備できる。\n\n_+2：_ドワーフプリンセスは_任意の指輪_を神器スロットに装備できる。
actors.hero.talent.more_ring.comment=このタレントが効果中に変性された場合、既に神器スロットに装備された指輪は自動的に取り外される。\n\n「本当に装飾品が好きな奴だ。」
actors.hero.talent.more_ring.meta_desc=_このタレントが他のヒーローに取得された場合_、+1レベルでターンを消費せずに任意の指輪を脱着でき、+2レベルで任意の指輪を神器スロットに装備できる。

actors.hero.talent.mana_wreath.title=魔能纏い
actors.hero.talent.mana_wreath.desc=_+1：_ドワーフプリンセスがエンチャントのある物理武器で敵を倒した後、_5ターン_で1回減衰する0~10のオーケインアーマーを得る。\n\n_+2：_ドワーフプリンセスがエンチャントのある物理武器で敵を倒した後、_10ターン_で1回減衰する0~10のオーケインアーマーを得る。
actors.hero.talent.mana_wreath.comment=装備中の王儲の指輪がエンチャントを持っている場合、このタレントは素手攻撃、エンチャントのない武器、投擲武器にも有効。\n\n「溢れ出るオーケインエネルギーは魔法攻撃を防ぐオーケインアーマーにもなる。」

actors.hero.talent.magic_arrow.title=鋭利な魔矢
actors.hero.talent.magic_arrow.desc=_+1：_ドワーフプリンセスがエンチャントのある投擲武器で攻撃する時、ダメージが_15%上昇_する。\n\n_+2：_ドワーフプリンセスがエンチャントのある投擲武器で攻撃する時、ダメージが_30%上昇_する。
actors.hero.talent.magic_arrow.comment=装備中の王儲の指輪がエンチャントを持っている場合、このタレントはエンチャントのない投擲武器にも有効。\n\nサイキックボウなどの特殊投擲武器を持つヒーローがこのタレントを得た場合、エンチャントのある特殊投擲武器もこのタレントのボーナスを受ける。\n\n「オーケインエネルギーを矢に集中させれば、より強力な威力を発揮する。」

actors.hero.talent.ring_bond.title=指輪連結
actors.hero.talent.ring_bond.desc=_+1：_ドワーフプリンセスのバッグ内の他の指輪のレベルが王儲の指輪より低い場合、_1の追加レベル_を得る。\n\n_+2：_ドワーフプリンセスのバッグ内の他の指輪のレベルが王儲の指輪より低い場合、_2の追加レベル_を得る。\n\n_+3：_ドワーフプリンセスのバッグ内の他の指輪のレベルが王儲の指輪より低い場合、_3の追加レベル_を得る。
actors.hero.talent.ring_bond.comment=このタレントが提供する追加レベルは王儲の指輪のレベルを超えない。
actors.hero.talent.ring_bond.meta_desc=_このタレントが他のヒーローに取得された場合_、+1/+2/+3レベルで複数の同一指輪の連結効果が追加で1/2/3レベル向上する。

actors.hero.herosubclass.runemage=ルーンメイジ
actors.hero.herosubclass.runemage_short_desc=_ルーンメイジ_は正面エンチャント付き物理攻撃後、キャラクターにルーンマークを刻印する。ルーンマークは杖の魔法で爆発可能で、エンチャントに応じた特殊効果を発揮する。
actors.hero.herosubclass.runemage_desc=ルーンメイジは正面エンチャント付き物理攻撃後、キャラクターにルーンマークを刻印する。刻印されたルーンマークは対応するエンチャント情報を記憶し、保持するエンチャント数が刻印の層数となる。この刻印は杖の魔法を受けると爆発する。\n\nルーンメイジが杖でルーンマークを爆発させた後、_3x3範囲_の全敵に刻印層数x5の追加ダメージを与え、さらに刻印に記憶されたエンチャントに応じた特殊効果を発揮する。

actors.buffs.runemark.name=ルーンマーク
actors.buffs.runemark.desc=ルーンメイジがエンチャントの力で対象に刻印を烙した。魔法が命中すると爆発を起こし、この爆発は敵にのみ追加の魔法ダメージを与え、ルーンメイジとその味方には影響せず、環境やアイテムも破壊しない。\n\nこの刻印は魔法で爆発されるか対象が死亡するまで持続する。\n\n刻印は以下のエンチャントを記憶している：
actors.buffs.runemark$runesurge.name=ルーンサージ
actors.buffs.runemark$runesurge.desc=ルーンメイジが一定時間内に発動するエンチャント効果が強化される。\n\n残りターン数：%sターン

actors.hero.talent.darkmark.title=ダークマーク
actors.hero.talent.darkmark.desc=_+1：_ルーンメイジがルーンマークを刻印する際、さらに_3ターンの幻惑_を付与する。\n\n_+2：_ルーンメイジがルーンマークを刻印する際、さらに_3ターンの幻惑と被ダメージ増加_を付与する。\n\n_+3：_ルーンメイジがルーンマークを刻印する際、さらに_3ターンの幻惑、被ダメージ増加と弱体化_を付与する。
actors.hero.talent.darkmark.comment=

actors.hero.talent.rune_blast.title=ルーンブラスト
actors.hero.talent.rune_blast.desc=_+1：_ルーンメイジが刻印したルーンマークが爆発する際、全杖に_刻印層数x0.25の充能_を回復する。\n\n_+2：_1に加え、ルーンメイジが刻印したルーンマークは_2回爆発可能_になり、2回目の爆発に別の杖を使用すると_爆発ダメージ+10_。\n\n_+3：_1と2に加え、ルーンメイジが刻印したルーンマークの_爆発範囲が3x5_に上昇する。
actors.hero.talent.rune_blast.comment=

actors.hero.talent.rune_surge.title=ルーンサージ
actors.hero.talent.rune_surge.desc=_+1：_ルーンメイジがルーンマークを爆発させた後の_10ターン_間、彼女のエンチャント効果が_33%_上昇する。\n\n_+2：_ルーンメイジがルーンマークを爆発させた後の_15ターン_間、彼女のエンチャント効果が_67%_上昇する。\n\n_+3：_ルーンメイジがルーンマークを爆発させた後の_20ターン_間、彼女のエンチャント効果が_100%_上昇する。
actors.hero.talent.rune_surge.comment=注意、このタレントは秘術の指輪と同じ効果であり、武器エンチャントの元の効果のみを増幅し、ルーンマークの爆発効果は増幅しない。

actors.hero.herosubclass.combatmaster=コンバットマスター
actors.hero.herosubclass.combatmaster_short_desc=_コンバットマスター_の鎧刻印は追加の強力な効果を持ち、さらに各種戦闘姿勢に精通している。
actors.hero.herosubclass.combatmaster_desc=コンバットマスターは鎧刻印の潜在力をより引き出せ、正面刻印にさらなる強力な効果をもたらす。また各種戦闘姿勢に精通しており、近接戦闘で優位に立つ。\n\nコンバットマスターは開始時にバランス姿勢に入り、姿勢切替にターンを消費しないが、切替後_3ターン_以内の再切替は10ターンの恍惚状態に陥り、その間は姿勢切替不可。\n\nバランス姿勢：各戦闘能力と防御能力を小程度上昇\nアサルト姿勢：各戦闘能力を上昇させるが、防御能力を減少\nパリィ姿勢：各防御能力を上昇させるが、戦闘能力を減少\n\nこの専精は姿勢切替可能時に特殊能力を1つ獲得し、複数の特殊能力を持つ場合は長押しで切替可能。

actors.buffs.fightstance.balance_name=バランス姿勢
actors.buffs.fightstance.balance_desc=コンバットマスターは_バランス姿勢_にある。この姿勢では、各戦闘能力と防御能力が一定上昇する。
actors.buffs.fightstance.balance_desc1=近接ダメージ、鎧防御、精度と回避が10%上昇。
actors.buffs.fightstance.balance_desc2=近接ダメージ、鎧防御、精度と回避が15%上昇。
actors.buffs.fightstance.balance_desc3=近接ダメージ、鎧防御、攻撃速度、移動速度、精度と回避が15%上昇。
actors.buffs.fightstance.invasion_name=アサルト姿勢
actors.buffs.fightstance.invasion_desc=コンバットマスターは_アサルト姿勢_にある。この姿勢では、各戦闘能力が上昇するが、防御能力が減少する。
actors.buffs.fightstance.invasion_desc1=近接ダメージが20%上昇し、10%確率で二連攻撃（2段目は武器エンチャントを正常発動）を行うが、自身の回避が10%低下。
actors.buffs.fightstance.invasion_desc2=近接ダメージが30%上昇し、10%確率で二連攻撃（2段目は武器エンチャントを正常発動）を行うが、自身の回避が10%低下。
actors.buffs.fightstance.invasion_desc3=近接ダメージが30%上昇し、10%確率で二連攻撃（2段目は武器エンチャントを正常発動）を行うが、自身の回避が15%低下。
actors.buffs.fightstance.parry_name=パリィ姿勢
actors.buffs.fightstance.parry_desc=コンバットマスターは_パリィ姿勢_にある。この姿勢では、各防御能力が上昇するが、戦闘能力が減少する。
actors.buffs.fightstance.parry_desc1=鎧防御が20%上昇し、30ターン毎に集中を1回獲得（重複不可、姿勢切替で消失）するが、自身の精度が10%低下。
actors.buffs.fightstance.parry_desc2=鎧防御が30%上昇し、30ターン毎に集中を1回獲得（重複不可、姿勢切替で消失）するが、自身の精度が10%低下。
actors.buffs.fightstance.parry_desc3=鎧防御が30%上昇し、20ターン毎に集中を1回獲得（重複不可、姿勢切替で消失）するが、自身の精度が15%低下。
actors.buffs.fightstance.duration=コンバットマスターがこの姿勢を維持して%sターン。
actors.buffs.fightstance.action=切替える姿勢を選択してください。
actors.buffs.fightstance$stabilize.name=姿勢安定
actors.buffs.fightstance$stabilize.desc=あなたは姿勢を一度切替えたばかりだ。安定してから再切替えを判断するのが良い。\n\nこの後さらに切替えるには、自身のバランスを整えるのに時間がかかり、その間は姿勢切替ができなくなる。\n\n安定にはあと%sターンかかる。
actors.buffs.fightstance$coordination.name=姿勢協調
actors.buffs.fightstance$coordination.desc=あなたは短時間に複数回姿勢を切替えた。バランスを整えるため、しばらく経たないと再切替えできない。\n\nバランス調整にあと%sターンかかる。
actors.buffs.fightstance$focus.name=集中
actors.buffs.fightstance$focus.desc=コンバットマスターは周囲の全てに集中し、次に来る攻撃を予見できる。集中状態では、次の攻撃を確実にパリィする。
actors.hero.talent.fluent.title=流れる如く
actors.hero.talent.fluent.desc=_+1：_コンバットマスターが短時間に複数回姿勢を切替えても_恍惚にならず_、_10ターン_以内は依然として姿勢切替不可。\n\n_+2：_1に加え、コンバットマスターがバランス姿勢からアサルト姿勢に切替えると_5ターンの極速_を獲得し、バランス姿勢からパリィ姿勢に切替えると_20のシールド_を獲得する。\n\n_+3：_1と2に加え、コンバットマスターがアサルト姿勢からバランス姿勢に切替えると_4ターンの杖充能_を獲得し、パリィ姿勢からバランス姿勢に切替えると_4ターンの神器充能_を獲得する。
actors.hero.talent.fluent.comment=

actors.hero.talent.stance_mastery.title=姿勢精通
actors.hero.talent.stance_mastery.desc=_+1：_コンバットマスターがバランス姿勢時、上昇する各能力効果が_5%増加_。\n\n_+2：_1に加え、コンバットマスターがアサルト姿勢時の近接ダメージ加成およびパリィ姿勢時の鎧防御加成が共に_30%に上昇_。\n\n_+3：_1と2に加え、コンバットマスターがバランス姿勢時にはさらに_攻撃速度と移動速度が上昇_し、アサルト姿勢時の連撃確率が_30%に上昇_、パリィ姿勢時の集中間隔が_20ターンに短縮_、後者2姿勢の対応する負の影響が共に_15%に低下_。
actors.hero.talent.stance_mastery.comment=

actors.hero.talent.inelement.title=余裕綽綽
actors.hero.talent.inelement.desc=_+1：_コンバットマスターがいずれかの姿勢を_20ターン_超えて維持すると、刻印効果が_33%_上昇。\n\n_+2：_コンバットマスターがいずれかの姿勢を_15ターン_超えて維持すると、刻印効果が_67%_上昇。\n\n_+3：_コンバットマスターがいずれかの姿勢を_10ターン_超えて維持すると、刻印効果が_100%_上昇。
actors.hero.talent.inelement.comment=注意、このタレントは秘術の指輪と同じ効果であり、鎧刻印の元の効果のみを増幅し、コンバットマスターの追加効果は増幅しない。

actors.hero.abilities.princess.marchforward.name=大步流星
actors.hero.abilities.princess.marchforward.short_desc=ドワーフ姫が_大步流星_で進み続け、歩くごとに速度が増す。
actors.hero.abilities.princess.marchforward.desc=ドワーフ姫が大步流星で進み続け、移動速度+20%、さらに1歩進むごとに+2%、最大100%まで上昇。\n\nダメージを受けると即座にこの効果は中断される。
actors.hero.abilities.princess.marchforward$forward.name=大步流星
actors.hero.abilities.princess.marchforward$forward.desc=ドワーフ姫が大步流星で進み続け、移動速度+%1$s%%。さらに1歩進むごとに+%%。、最大%2$s%%まで上昇。\n\nこの効果は%3$d回ダメージを受けるまで持続。
actors.hero.abilities.princess.marchforward.say=それは一時しのぎに過ぎない！
actors.hero.talent.speedup.title=鞭撻加速
actors.hero.talent.speedup.desc=_+1：_ドワーフ姫の移動速度加成及び上限が追加で_12.5%増加_。\n\n_+2：_ドワーフ姫の移動速度加成及び上限が追加で_25%増加_。\n\n_+3：_ドワーフ姫の移動速度加成及び上限が追加で_37.5%増加_。\n\n_+4：_ドワーフ姫の移動速度加成及び上限が追加で_50%増加_。
actors.hero.talent.speedup.comment=

actors.hero.talent.run_attack.title=疾走攻撃
actors.hero.talent.run_attack.desc=_+1：_ドワーフ姫がこの状態での物理攻撃は_7.5%の確率_でターンを消費しない。\n\n_+2：_ドワーフ姫がこの状態での物理攻撃は_15%の確率_でターンを消費しない。\n\n_+3：_ドワーフ姫がこの状態での物理攻撃は_22.5%の確率_でターンを消費しない。\n\n_+4：_ドワーフ姫がこの状態での物理攻撃は_30%の確率_でターンを消費しない。
actors.hero.talent.run_attack.comment=

actors.hero.talent.delay_tactic.title=緩兵の計
actors.hero.talent.delay_tactic.desc=_+1：_ドワーフ姫が_2回のダメージ_を受けるまで効果持続、攻撃側からのダメージなら攻撃者に_2ターンの鈍足_を付与。\n\n_+2：_ドワーフ姫が_2回のダメージ_を受けるまで効果持続、攻撃側からのダメージなら攻撃者に_4ターンの鈍足_を付与。\n\n_+3：_ドワーフ姫が_3回のダメージ_を受けるまで効果持続、攻撃側からのダメージなら攻撃者に_6ターンの鈍足_を付与。\n\n_+4：_ドワーフ姫が_3回のダメージ_を受けるまで効果持続、攻撃側からのダメージなら攻撃者に_8ターンの鈍足_を付与。
actors.hero.talent.delay_tactic.comment=

actors.hero.abilities.princess.taboomagic.name=禁忌魔法
actors.hero.abilities.princess.taboomagic.short_desc=ドワーフ姫は_禁忌魔法_を放ち、敵に多数の弱体効果を付与する。
actors.hero.abilities.princess.taboomagic.desc=ドワーフ姫はドワーフの書庫に記された禁忌魔法を放ち、敵に極めて悪質な呪いをかけ、標的に多数の弱体効果を与える。\n\n魔法の対象選択は自身と味方を除く。この魔法の対象となった敵は10ターンの幻惑、被ダメージ増加、弱体化を獲得する。また、この魔法はルーンメイジが刻印したルーンマークを爆発させることができる。
actors.hero.abilities.princess.taboomagic.no_target=現在位置に適切な術式対象がいない。
actors.hero.abilities.princess.taboomagic.say=ゆっくりと、静かに、命はこうして塵と化す。
actors.hero.abilities.princess.taboomagic.say1=死は緩やかに——予測できず、逃れられない。
actors.hero.abilities.princess.taboomagic.say2=心はこれほどの打撃に耐えられない。
actors.hero.abilities.princess.taboomagic.say3=正気を失い、息を切らし、理性の縁を越えて果てしない狂気に落ちる。

actors.hero.abilities.princess.taboomagic.prompt=禁術を放つ対象を選択

actors.hero.talent.element_curse.title=エレメントカース
actors.hero.talent.element_curse.desc=_+1：_禁忌魔法がさらに_4ターンの燃焼または8ターンの凍傷_を付与。\n\n_+2：_1に加え、さらに_5ターンの蔓絡み_を付与。\n\n_+3：_禁忌魔法がさらに_8ターンの燃焼または16ターンの凍傷_を付与。\n\n_+4：_3に加え、さらに_10ターンの蔓絡み_を付与。
actors.hero.talent.element_curse.comment=
actors.hero.talent.afflicted_illness.title=病魔纏身
actors.hero.talent.afflicted_illness.desc=_+1：_禁忌魔法がさらに_4ターンの毒と初期値4の出血_を付与。\n\n_+2：_1に加え、さらに_5ターンの跛行_を付与。\n\n_+3：_禁忌魔法がさらに_8ターンの毒と初期値8の出血_を付与。\n\n_+4：_3に加え、さらに_10ターンの跛行_を付与。
actors.hero.talent.afflicted_illness.comment=
actors.hero.talent.spread_pain.title=苦痛拡散
actors.hero.talent.spread_pain.desc=_+1：_ドワーフ姫が100%鎧充能で禁忌魔法を放つ時、魔法の効果範囲が対象中心_3x3範囲_に拡大。\n\n_+2：_ドワーフ姫が100%鎧充能で禁忌魔法を放つ時、魔法の効果範囲が対象中心_5x5範囲_に拡大。\n\n_+3：_ドワーフ姫が100%鎧充能で禁忌魔法を放つ時、魔法の効果範囲が対象中心_7x7範囲_に拡大。\n\n_+4：_ドワーフ姫が100%鎧充能で禁忌魔法を放つ時、魔法の効果範囲が対象中心_9x9範囲_に拡大。
actors.hero.talent.spread_pain.comment=英雄や味方がこの範囲にいても影響を受けない。

actors.hero.abilities.princess.kingblade.name=キングブレード
actors.hero.abilities.princess.kingblade.short_desc=ドワーフ姫が_キングブレード_を振り下ろし、敵を深手に負わせ反撃を困難にする。
actors.hero.abilities.princess.kingblade.desc=ドワーフ姫は隣接する敵1体に必中の通常攻撃を行う。この一撃は50%のダメージ加成を持つ。\n\nこの一撃を受けた敵が死ななければ8ターンの武装解除を獲得し、敵が死亡した場合はドワーフ姫の視野内の全敵が4ターンの武装解除を得る。武装解除中の敵はドワーフ姫とその味方に物理ダメージを与えられない。Boss敵はこの効果を無効化する。
actors.hero.abilities.princess.kingblade.no_target=隣接する対象を選択してください。
actors.hero.abilities.princess.kingblade.say1=下がれ！
actors.hero.abilities.princess.kingblade.say2=武装解除
actors.hero.abilities.princess.kingblade$disarm.name=武装解除
actors.hero.abilities.princess.kingblade$disarm.desc=この敵は武装解除された。\n\n武装解除された敵はこの間も攻撃を行うが、あなたと味方に物理ダメージを与えられない。Boss敵は50%%の物理ダメージを与える。\n\n武装解除効果の持続時間：%sターン
actors.hero.talent.king_gaze.title=王の怒視
actors.hero.talent.king_gaze.desc=_+1：_キングブレードを振り下ろす際、ドワーフ姫は_2ターンの霊視_を獲得し、視野内の敵は即座に_4ターンの武装解除_を得る。\n\n_+2：_キングブレードを振り下ろす際、ドワーフ姫は_4ターンの霊視_を獲得し、視野内の敵は即座に_4ターンの武装解除_を得る。\n\n_+3：_キングブレードを振り下ろす際、ドワーフ姫は_6ターンの霊視_を獲得し、視野内の敵は即座に_4ターンの武装解除_を得る。\n\n_+4：_キングブレードを振り下ろす際、ドワーフ姫は_8ターンの霊視_を獲得し、視野内の敵は即座に_4ターンの武装解除_を得る。
actors.hero.talent.king_gaze.comment=
actors.hero.talent.king_power.title=王の力
actors.hero.talent.king_power.desc=_+1：_ドワーフ姫のこの一撃が得るダメージ加成が_62.5%_に上昇。\n\n_+2：_ドワーフ姫のこの一撃が得るダメージ加成が_75%_に上昇。\n\n_+3：_ドワーフ姫のこの一撃が得るダメージ加成が_87.5%_に上昇。\n\n_+4：_ドワーフ姫のこの一撃が得るダメージ加成が_100%_に上昇。
actors.hero.talent.king_power.comment=
actors.hero.talent.king_might.title=王の威能
actors.hero.talent.king_might.desc=_+1：_ドワーフ姫のこの一撃が敵を倒した場合、_5%鎧充能_が還元される。\n\n_+2：_ドワーフ姫のこの一撃が敵を倒した場合、_10%鎧充能_が還元される。\n\n_+3：_ドワーフ姫のこの一撃が敵を倒した場合、_15%鎧充能_が還元される。\n\n_+4：_ドワーフ姫のこの一撃が敵を倒した場合、_20%鎧充能_が還元される。
actors.hero.talent.king_might.comment=


actors.hero.heroclass.friar=修道士
actors.hero.heroclass.friar_desc_short=修道士は_錬金噴射銃_を使い薬剤を装填して噴射できる。修道士は_理性を消費して錬金エネルギーに変換_でき、理性を使い果たすと_精神が試練を受ける_。
actors.hero.heroclass.friar_desc=修道士は初期に_独特の錬金噴射銃_を携帯し、薬剤を装填して噴射できる。\n\n修道士は_一定の理性を消費して錬金エネルギーに変換_できる。修道士は地下牢の探索で理性を失うこともあり、理性が尽きると_精神が試練を受ける_。\n\nまた、修道士は初期に_革鞭_、布鎧、水袋、フランネル袋を携帯する。\n\n修道士が開始時に鑑定するアイテム：\n_-_スピード薬剤\n_-_変異の巻物、鑑定の巻物、恐怖の巻物
actors.hero.heroclass.friar_unlock=_1回のゲームでYog-Dzewa_を倒して修道士を解放せよ。
actors.buffs.reason.name=理性
actors.buffs.reason.desc_full=あなたの意識は非常に明晰だ。少なくとも今は。\n\n
actors.buffs.reason.desc_half=少し目まいがするが、行動に支障はない。\n\n
actors.buffs.reason.desc_quarter=頭が割れるように痛み、呼吸も困難になってきた。\n\n
actors.buffs.reason.desc_zero=あなたは狂気の淵に立っている！\n\n
actors.buffs.reason.desc_simple=地下牢の探索中、恐ろしい敵との対峙、致命的な罠への踏み込み、飢餓の窮地に陥ることで、僅かな理性が削られていく。理性が完全に削られると、精神は試練を受ける。先に来るのは精神的な折磨か？それとも絶望の中でこそ目覚める高貴な資質か？誰にも分からない。\n\nもちろん、全てが不便というわけではない。錬金や錬金噴射銃への装填時、理性の一部を代償に必要な錬金エネルギーを生み出せる。1ポイントの錬金エネルギーを生み出す毎に2ポイントの理性を消費する。\n\n理性は通常時間では回復せず、主な回復手段は敵の撃破、隠された秘密の発見、そして食事である。\n\n現在の理性：%s/100
actors.buffs.reason.half=少し目まいがするが、大きな問題はない。
actors.buffs.reason.quarter=頭が割れるように痛く、理性が定まらない。
actors.buffs.reason.zero=あなたは狂気の淵に立っている！
actors.buffs.reason.kaoyan=あなたの精神が試練を受けている...
actors.buffs.reason.energize_name=エネルギー精製
actors.buffs.reason.energize_desc=特定のアイテムを精製して錬金エネルギーに変換できる。これには薬剤、巻物、種、ルーンストーンなど錬金関連のアイテムが含まれる。\n\nまた、理性の一部を消費して必要な錬金エネルギーに変換することもできる。通常、1ポイントの錬金エネルギーを生み出す毎に2ポイントの理性を消費する。\n\n現在の理性：%s/100
actors.buffs.reason.energize_item=精製するアイテムを選択
actors.buffs.reason.energize_1=5の理性を1のエネルギーに変換
actors.buffs.reason.die=あなたは心身耗弱で死んだ...
actors.buffs.reason.rankings_desc=死亡原因：心身耗弱
actors.buffs.suffering.name=折磨
actors.buffs.suffering.desc=%sを獲得：
actors.buffs.suffering$fear.name=折磨：恐怖
actors.buffs.suffering$fear.desc=臆病と弱さがついにその獲物を捕らえた。\n\nこの折磨の間、回避が50%%低下するが、物理ダメージは25%%低下。\n\nもし敵に撃たれた場合、10%%の確率でさらに1の理性が減少。\n\nこの折磨はさらに%sターン続き、敵を倒すとより早く解消される。\n\n理性が0になると、苦しみの折磨の中で衰弱死する。
actors.buffs.suffering$paranoia.name=折磨：偏執
actors.buffs.suffering$paranoia.desc=人は時に狂気の中で目覚めることがある。だが実に稀だ...\n\nこの折磨の間、攻撃速度+20%%だが、精度-20%%。\n\n攻撃を外した場合、30%%の確率でさらに1の理性が減少。\n\nこの折磨はさらに%sターン続き、敵を倒すとより早く解消される。\n\n理性が0になると、苦しみの折磨の中で衰弱死する。
actors.buffs.suffering$despair.name=折磨：絶望
actors.buffs.suffering$despair.desc=この地獄には希望がない。一片の希望すらない。\n\nこの折磨の間、移動速度+20%%だが、あらゆる攻撃を回避できなくなる。\n\nこの折磨はさらに%sターン続き、敵を倒すとより早く解消される。\n\n理性が0になると、苦しみの折磨の中で衰弱死する。
actors.buffs.virtue.name=美徳
actors.buffs.virtue.desc=%sを獲得：
actors.buffs.virtue$firm.name=美徳：堅固
actors.buffs.virtue$firm.desc=多くの者は恐慌と混乱に陥るだろう。だがこの者は違う、今この瞬間は！\n\nこの美徳の間、最大HPの15%%で自然減少しないシールドを獲得し、溢れたHP回復も同様に自然減少しないシールドに変換される。\n\nさらに、敵を倒す度に15%%の確率で1の理性を追加回復。\n\nこの美徳はさらに%sターン続き、敵を倒すと効果的に延長される。\n\n理性が0になると、即座に100の理性を回復するが、美徳は失われる。
actors.buffs.virtue$inspire.name=美徳：奮起
actors.buffs.virtue$inspire.desc=尽きぬ苦難も希望を育み、活力を呼び覚ます！\n\nこの美徳の発現により理性が良好な状態に戻る。\n\nさらに、この美徳の間、敵を倒す度に15%%の確率で最大HPの10%%を追加回復。\n\nこの美徳はさらに%sターン続き、敵を倒すと効果的に延長される。\n\n理性が0になると、即座に100の理性を回復するが、美徳は失われる。
actors.buffs.virtue$fearless.name=美徳：无畏
actors.buffs.virtue$fearless.desc=最も絶望的な暗闇の中でこそ、突然の勇気が最も輝かしい光を放つ。\n\nこの美徳の間、移動速度+50%%。\n\nさらに、いかなる闇も恐れず、恐慌効果の影響を受けなくなる。\n\nこの美徳はさらに%sターン続き、敵を倒すと効果的に延長される。\n\n理性が0になると、即座に100の理性を回復するが、美徳は失われる。


actors.buffs.panic.name=恐慌
actors.buffs.panic.desc=枯れるような恐慌が心を蝕む！\n\nアンデッドやデーモンの敵からの攻撃は理性を直接削るだけでなく、前代未聞の恐怖に陥れることもある。恐慌状態では毎ターン1〜2の理性が減少。\n\n恐怖を消すにはあと%sターンかかる...
actors.buffs.panic.get=前代未聞の恐怖を感じる！

actors.hero.talent.tranquil_tincture.title=安魂チンキ
actors.hero.talent.tranquil_tincture.desc=_+1：_修道士が以降の階層の地下牢を探索する際、商店で_2本の安魂チンキ_を購入できる。\n\n_+2：_修道士が以降の階層の地下牢を探索する際、商店で_3本の安魂チンキ_を購入できる。
actors.hero.talent.tranquil_tincture.comment=安魂チンキは素早く摂取でき、少量の満腹度を回復し、恐慌効果を解除し、修道士に50の理性を回復する。

actors.buffs.erodingsoul.name=蝕骨侵魂
actors.buffs.erodingsoul.desc=腐敗魔法は生物が腐敗していない時でも、その魂の一部を蝕む。\n\nこの効果を受けた生物は死亡後、20%の確率で腐敗怨霊と化す。既存の弱体効果1つ毎（この効果自身を除く）に確率が5%増加する。\n\n生物が死亡前に腐敗または即死した場合でも、この効果は持続し、完全な死亡後に直接腐敗怨霊と化す。\n\nこの効果は生命が終わるまで永続する。

actors.hero.talent.eroding_soul.title=蝕骨侵魂
actors.hero.talent.eroding_soul.desc=_+1：_1本の腐敗杖_を獲得。腐敗杖の魔法は永続的な_蝕骨侵魂_効果を追加で与える（_アンデッド属性_の敵には無効）。\n\n_+2：_1に加え（リソース獲得を除く）、腐敗杖の魔法は_50%の確率_で追加の弱体効果を1つ付与。
actors.hero.talent.eroding_soul.comment=蝕骨侵魂効果を得た生物は死亡後_20%+既存弱体効果数x5%の確率_で腐敗怨霊と化す。生物が既に腐敗または即死状態の場合、この効果は保持され、完全な死亡後に直接腐敗怨霊と化す。\n\nこの種のレベルアップや変異でリソースを直接獲得するタレントは共通で_26回のトリガー制限_（ジェントルマンは_39回_）。

actors.hero.talent.credulous.title=信仰背棄
actors.hero.talent.credulous.desc=_+1：_聖典から魔法_信仰背棄_を放つ。1充能を消費して_10ターンの魔法耐性_を獲得。\n\n_+2：_1に加え、この魔法の詠唱は_時間を消費しない_。
actors.hero.talent.credulous.comment=「背信者は罰を受けるべし。」

actors.hero.talent.penetrating_cast.title=貫通
actors.hero.talent.penetrating_cast.desc=_+1：_直接ダメージを与える杖や魔杖の魔法が、敵が持つ全ての弱体効果を打ち消す。打ち消した弱体効果1つ毎にこの魔法のダメージが_10%_上昇。\n\n_+2：_直接ダメージを与える杖や魔杖の魔法が、敵が持つ全ての弱体効果を打ち消す。打ち消した弱体効果1つ毎にこの魔法のダメージが_20%_上昇。
actors.hero.talent.penetrating_cast.comment=「敵の表面に巣食う魔力ごと打ち抜き、残った衝撃がさらに深く血肉に突き刺さる。」

actors.hero.talent.bountiful_enhancement.title=豊穣強化
actors.hero.talent.bountiful_enhancement.desc=_+1：_豊穣の角の食物を食べると_5ターンの豊穣貯蔵_効果を獲得。\n\n_+2：_1に加え、豊穣の角の充能1ポイント毎の満腹度回復量が_20_増加。\n\n_+3：_豊穣の角の充能1ポイント毎の満腹度回復量が_30_増加。
actors.hero.talent.bountiful_enhancement.comment=豊穣貯蔵効果終了時に_摂食特効が1回発動_。短時間に豊穣の角の食物を複数回食べても、効果終了時の摂食特効発動回数は増加しない。\n\n「豊穣とはより多くの食物だけでなく、毎回の摂食がもたらす精神的な豊かさも意味する。」
actors.hero.talent$delayedsatisfaction.name=豊穣貯蔵
actors.hero.talent$delayedsatisfaction.desc=豊穣の角の食物を食べることで精神的な豊かさを得た。その魔力により、%sターン後に摂食特効が再び発動する。

actors.hero.talent.ice_hell.title=氷結地獄
actors.hero.talent.ice_hell.desc=_+1：_氷霜杖の魔法で_凍傷状態_の敵を攻撃する際、_ダメージ減衰が無効_に。\n\n_+2：_1に加え、氷霜杖の魔法で_凍結状態_の敵を攻撃する際、_杖レベルx4_の魔法ダメージを与える。\n\n_+3：_1と2に加え、氷霜杖の魔法が_50%の確率_で対象位置に_3x3範囲_、_10ターン_持続の冷気を発生。
actors.hero.talent.ice_hell.comment=「寒さはもはや緩やかに温度を奪うのみではなく、空間全体を凍てつく地獄と化す。」

actors.hero.talent.boss_talent_slot_1.title=空白のタレント
actors.hero.talent.boss_talent_slot_1.desc=この地下牢に降りた時からどこかおかしいと感じていた。今になって、本来持っていたタレントの一部が消され、空白だけが残っていることに気づいた...\n\n幸い、この地下牢の深部の強力な敵に打ち勝てば、より強力な力を得られる。要するに、今は進み続けるしかない。\n\n_5階_のBossが落とす昇華の秘巻を読むと、このタレントが対応するBossタレントに昇華し、1階層タレントに追加のタレントポイントを1つ提供する。それまではこのタレントはレベルアップも変異も不可。
actors.hero.talent.boss_talent_slot_1.comment=
