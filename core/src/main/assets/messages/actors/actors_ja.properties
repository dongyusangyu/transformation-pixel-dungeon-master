actors.hero.talent.chill_water.comment=「運が悪いと水でも歯が沁みる。」\n\n_「でもゲームに大した影響はないけどね」——可則の囁き_
actors.hero.talent.life_sport.title=生命は運動に在り
#fix9：コメント補完
actors.hero.talent.life_sport.desc=_+0：_待機で_2ダメージ_受ける。\n\n_+1：_待機で_1ダメージ_受ける。\n\n_+2：_待機でダメージなし。
