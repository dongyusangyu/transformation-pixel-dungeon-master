actors.hero.talent.dump_truck.comment=_巨大型態_の敵はDM-200、DM-201、DM-300、ゴーレム、錆拳、黄金ゴーレム、巨大精鋭敵を含む。\n\n「直に三台のダンプカーを手配してやる！」
