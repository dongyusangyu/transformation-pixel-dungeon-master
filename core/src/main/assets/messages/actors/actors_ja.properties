actors.hero.abilities.cleric.trinity.max_drone=現在10機のドローンが生成済みで、最大生産上限に達している。三位一体でも生産できない。
levels.minigame.extraction.overburden.name=捜索撤収-重量超過
levels.minigame.extraction.overburden.desc=戦利品の重量が装備による移動速度上昇を阻害している。占有されているバッグ枠1つにつき、残りの装備速度上昇は3分の2で保持される。バッグコンテナと水袋は重量に計上されない。\n\n占有バッグ枠：%d\n装備速度上昇保持：%d%%
levels.minigame.extraction.extractionraidrun.session_name=捜索撤収ミッション
levels.minigame.extraction.extractionraidrun.session_desc=このミッションは現在の捜索撤収対局を記録している。これを使用して自らゲームを放棄できるが、死亡時と同様のセミハードコア損失が発生する。
levels.minigame.extraction.extractionraidrun.missing_key=撤退装置は何も反応しない。まだ水晶の鍵が必要だ。
levels.minigame.extraction.extractionraidrun.extract_title=撤退地点
levels.minigame.extraction.extractionraidrun.extract_body=撤退装置が%d本の水晶の鍵を認識した。今すぐ撤退して、このゲームの戦利品を確保するか？
levels.minigame.extraction.extractionraidrun.extract=即時撤退
levels.minigame.extraction.extractionraidrun.continue_raid=捜索続行
levels.minigame.extraction.extractionraidrun.success=撤退成功。このゲームで獲得した戦利品は安全物品に変換された。
levels.minigame.extraction.extractionraidrun.success_bonus=撤退成功。余剰の水晶の鍵が%dゴールドに換金された。
levels.minigame.extraction.extractionraidrun.failure=撤退失敗：%1$dセットの戦利品と%2$d個の通常消耗品を失った。
