actors.hero.spells.credulous.name=信仰背棄
actors.hero.spells.credulous.short_desc=一定時間、魔法耐性を獲得。
actors.hero.spells.credulous.desc=術者は一時的に魔法の感覚を放棄し、_10ターンの魔法耐性_を獲得する。\n\nこの魔法の詠唱は_1ターン消費_。
actors.hero.spells.credulous.desc_instant=この魔法は+2レベル時、詠唱が_時間を消費しない_。

actors.hero.talent.ravens_eye.title=鴉の目
actors.hero.talent.ravens_eye.desc=_+1：_修道士は_30の理性_を消費してアイテムの呪いの有無を検査できる。\n\n_+2：_修道士は_20の理性_を消費してアイテムの呪いの有無を検査できる。
actors.hero.talent.ravens_eye.comment=
actors.hero.talent.ravens_eye.meta_desc=_このタレントが他の英雄に獲得された場合_、英雄はアイテムを検査できるようになるが、代償として出血を獲得する。+1時は初期値6の出血、+2時は初期値4の出血。
actors.hero.talent.ravens_eye.action=検査


actors.hero.talent.crystal_gunpowder.title=結晶火薬
actors.hero.talent.crystal_gunpowder.desc=_+1：_修道士が1ポイントの錬金エネルギーを持つ毎に、物理攻撃が_1の追加ダメージ_を与える。\n\n_+2：_修道士が1ポイントの錬金エネルギーを持つ毎に、物理攻撃が_2の追加ダメージ_を与える。
actors.hero.talent.crystal_gunpowder.comment=このタレントで得られる追加ダメージ加成は_+1/+2_レベル時、_2/4_を超えない。
actors.hero.talent.bulwark_greatshield.title=防壁巨盾
actors.hero.talent.bulwark_greatshield.desc=_+1：_修道士がガードを持つ武器を装備時、_10%の物理ダメージ軽減_を獲得。\n\n_+2：_修道士がガードを持つ武器を装備時、_15%の物理ダメージ軽減_を獲得。
actors.hero.talent.bulwark_greatshield.comment=ガードを持つ武器には、レイピア、腕盾、鉄頭棍、円盾、武士刀、巨盾が含まれる。

actors.hero.talent.whispering_meal.title=囈語の食事
actors.hero.talent.whispering_meal.desc=_+1：_修道士の食事は_1ターン_のみ消費（安魂チンキの摂取はターン消費なし）、視野内の敵に_2ターンの恐怖_を与える。\n\n_+2：_修道士の食事は_1ターン_のみ消費（安魂チンキの摂取はターン消費なし）、視野内の敵に_4ターンの恐怖_を与える。
actors.hero.talent.whispering_meal.comment=
actors.hero.talent.liquid_barrier.title=液蘊屏障
actors.hero.talent.liquid_barrier.desc=_+1：_修道士が薬剤、魔薬、秘薬を飲用または投擲すると、_5ターン_の浄化屏障を獲得。\n\n_+2：_修道士が薬剤、魔薬、秘薬を飲用または投擲すると、_10ターン_の浄化屏障を獲得。
actors.hero.talent.liquid_barrier.comment=使用したのが力の薬剤、経験の薬剤、または前述の薬剤で錬成された錬金アイテムの場合、獲得する浄化屏障効果の持続時間が2倍になる。\n\n生産量の多い錬金アイテム（例：水爆魔薬）の場合、このタレントはそのアイテムの単回生産数量に基づいて確率発動する。
actors.hero.talent.fast_reload.title=高速装填
actors.hero.talent.fast_reload.desc=_+1：_修道士が錬金噴射銃にエネルギーを装填する際、_時間を消費しなくなる_。\n\n_+2：_1に加え、修道士が錬金噴射銃にエネルギーを装填した後、_1ターン_の飛行（瞬間移動）を獲得。
actors.hero.talent.fast_reload.comment=
actors.hero.talent.fast_reload.meta_desc=_このタレントが他の英雄に獲得された場合_、英雄が液体金属で投擲武器の耐久度を修復する際に飛影効果を得る。+1時は%dターン、+2時は%dターン。
actors.hero.talent.otherworld_bane.title=異魔キラー
actors.hero.talent.otherworld_bane.desc=_+1：_修道士が_アンデッドと悪魔属性_の敵を倒した後、_2ターン_の霊視を得る。\n\n_+2：_修道士が_アンデッドと悪魔属性_の敵を倒した後、_3ターン_の霊視を得る。
actors.hero.talent.otherworld_bane.comment=
actors.hero.talent.bullseye.title=ど真ん中
actors.hero.talent.bullseye.desc=_+1：_修道士が敵に手裏剣または塗薬手裏剣を投擲する際_50%の追加精度_を持ち、_3の追加ダメージ_を与える。\n\n_+2：_修道士が敵に手裏剣または塗薬手裏剣を投擲する際_75%の追加精度_を持ち、_5の追加ダメージ_を与える。
actors.hero.talent.bullseye.comment=

actors.hero.talent.midas_touch.title=錬金の手
actors.hero.talent.midas_touch.desc=_+1：_修道士は_液体金属20本_を獲得し、液体金属をランダムな薬剤に変換できる。\n\n_+2：_修道士は_液体金属40本_を獲得し、液体金属をランダムな薬剤に変換できる。\n\n_+3：_修道士は_液体金属60本_を獲得し、液体金属をランダムな薬剤に変換できる。
actors.hero.talent.midas_touch.comment=液体金属は筋力薬剤に変換できない。1本の薬剤を変換する際には常に_液体金属20本_を消費する。\n\nこの種の昇格または変異により直接リソースを取得するタレントは_26回のトリガー制限_を共有する（紳士は_39回_）。
actors.hero.talent.human_glory.title=人間の輝き
actors.hero.talent.human_glory.desc=_+1：_修道士の正気度が2以下になった時、美徳を得る確率が25%から_30%_に上昇する。\n\n_+2：_修道士の正気度が2以下になった時、美徳を得る確率が25%から_35%_に上昇する。\n\n_+3：_修道士の正気度が2以下になった時、美徳を得る確率が25%から_40%_に上昇する。
actors.hero.talent.human_glory.comment=注意：美徳確率の上昇は苦悩確率の低下も意味する。このタレントが_+1/+2/+3_レベルの時、苦悩を得る確率は75%から_70/65/60%_に低下する。
actors.hero.talent.human_glory.meta_desc=_このタレントが他の英雄に獲得された場合_、+1/+2/+3レベルで英雄の精度と回避が10/20/30%上昇する。

actors.hero.herosubclass.alchemist=錬金術師
actors.hero.herosubclass.alchemist_short_desc=_錬金術師_は錬金時の錬金エネルギー消費が少なく、より強力な錬金スプレーガンを使用する。
actors.hero.herosubclass.alchemist_desc=錬金術師は錬金に秀でている。錬金エネルギーを消費して錬金アイテムを作成する際、必要な錬金エネルギー消費が3ポイント減少する（最低1ポイントは消費）。\n\n錬金術師の錬金スプレーガンは一定の魔法ダメージを与え、より広い射程とより強力な薬剤装着効果を持つ。\n\n_ランダムモード_が有効で、錬金スプレーガンを所持していない場合、この専門を選択すると錬金スプレーガンを入手する。

actors.hero.talent.alchemy_shield.title=錬金バリア
actors.hero.talent.alchemy_shield.desc=_+1：_錬金術師の錬金時のエネルギー消費が3減少から_4減少_に変わり、錬金エネルギー消費毎（スプレーガン装填含む）に_1層の錬金バリア_を得る。\n\n_+2：_錬金術師の錬金時のエネルギー消費が3減少から_5減少_に変わり、錬金エネルギー消費毎（スプレーガン装填含む）に_2層の錬金バリア_を得る。\n\n_+3：_錬金術師の錬金時のエネルギー消費が3減少から_6減少_に変わり、錬金エネルギー消費毎（スプレーガン装填含む）に_3層の錬金バリア_を得る。
actors.hero.talent.alchemy_shield.comment=錬金バリアは、以降の被ダメージを現在の錬金エネルギーに応じて減少させる。被弾毎に1層減少し、最大3層まで重複する。
actors.hero.talent.close_blast.title=至近爆撃
actors.hero.talent.close_blast.desc=_+1：_錬金術師の錬金スプレーガンは、目標までの距離が近いほどダメージが高くなる。最遠距離では追加ダメージなし、1マス近付く毎に_10%の追加ダメージ_、最大_40%の追加ダメージ_。\n\n_+2：_錬金術師の錬金スプレーガンは、目標までの距離が近いほどダメージが高くなる。最遠距離では追加ダメージなし、1マス近付く毎に_15%の追加ダメージ_、最大_60%の追加ダメージ_。\n\n_+3：_錬金術師の錬金スプレーガンは、目標までの距離が近いほどダメージが高くなる。最遠距離では追加ダメージなし、1マス近付く毎に_20%の追加ダメージ_、最大_80%の追加ダメージ_。
actors.hero.talent.close_blast.comment=
actors.hero.talent.conservation.title=節約の精神
actors.hero.talent.conservation.desc=_+1：_錬金術師の錬金スプレーガンが噴射する際_10%の確率_で薬液を消費せず、薬剤装着後には更に_30%の確率_で薬剤を消費しない。\n\n_+2：_錬金術師の錬金スプレーガンが噴射する際_20%の確率_で薬液を消費せず、薬剤装着後には更に_45%の確率_で薬剤を消費しない。\n\n_+3：_錬金術師の錬金スプレーガンが噴射する際_30%の確率_で薬液を消費せず、薬剤装着後には更に_60%の確率_で薬剤を消費しない。
actors.hero.talent.conservation.comment=このタレントが薬剤装着効果を発動する際、スプレーガンの薬液残量は通常通り補充される。筋力薬剤は常に薬液残量を消費も補充もしない。
actors.hero.talent$alchemyshield.name=錬金バリア
actors.hero.talent$alchemyshield.desc=錬金エネルギーで構成されたバリアがあなたの周囲を包み、敵からの攻撃ダメージを防ぐ。\n\n錬金エネルギーを消費する毎に一定層数の錬金バリアが形成され、最大3層まで。錬金バリアの保護下では、敵からの物理ダメージが5ポイント減少し、さらに現在の錬金エネルギー1毎に1ポイント追加で減少、最大20ポイントまで減少する。\n\n現在の錬金エネルギーに基づき、各層の錬金バリアは%1$dの物理ダメージを減少させる。\n\n現在%2$d層の錬金バリアを有しており、被弾毎に1層消費する。

actors.hero.herosubclass.pious=敬虔者
actors.hero.herosubclass.pious_short_desc=_敬虔者_は儀式用ダガーを入手する。素早く使用でき、正気度の回復または減少に用いられる。同時に、既存の全ての苦悩を置き換える新たな苦悩を得る。
actors.hero.herosubclass.pious_desc=敬虔者は儀式用ダガーを入手する。儀式用ダガーは装備不要で直接使用できる。儀式用ダガーで攻撃すると永続的な血液の贈り物効果を付与し、この効果を持つ敵がHPを失う度に敬虔者の正気度を少量回復する。また、敬虔者が一定数の敵を倒す毎に、時間を消費せずに必中の刺突を1回行える。刺突時、敵を刺せば大量の正気度を回復し、自身を刺せば大量の正気度を減少させる。\n\n敬虔者は正気度が2以下になると苦悩または美徳を得る。異なる点は、既存の全ての苦悩を置き換える新たな苦悩を得られることである。新たな苦悩：エクスタシー。自身の物理ダメージと攻撃速度を大幅に上昇させるが、回避が大幅に低下する。\n\nこの専門は儀式用ダガーが刺突可能な時に1つの特殊能力を持つ。複数の特殊能力を同時に持つ場合は、ショートカットを長押しして切替可能。_ランダムモード_が有効で正気度能力を未所持の場合、この専門を選択すると正気度能力を得るが、一部のアイテムや環境との相互作用において限定的な回復と減少効果のみを持ち、錬金エネルギーに変換することはできない。

actors.buffs.suffering$ecstasy.name=苦悩：エクスタシー
actors.buffs.suffering$ecstasy.desc=狂気よ、旧友よ！\n\nこの苦悩の間、攻撃速度+50%%、物理ダメージ+30%%、回避-50%%。\n\nこの苦悩は%sターン持続し、敵を倒すことでより早く解除できる。\n\n正気度がゼロになると、無限の狂気の中で衰弱死する。

actors.hero.talent.never_compromise.title=妥協なき者
actors.hero.talent.never_compromise.desc=_+1：_敬虔者が_苦悩または美徳状態_の時、致命的ダメージを受けても即死せず_瀕死_効果を得る。同時に苦悩の持続時間を延長、または美徳を_50ターン_減少させる。\n\n_+2：_敬虔者が_苦悩または美徳状態_の時、致命的ダメージを受けても即死せず_瀕死_効果を得る。同時に苦悩の持続時間を延長、または美徳を_40ターン_減少させる。\n\n_+3：_敬虔者が_苦悩または美徳状態_の時、致命的ダメージを受けても即死せず_瀕死_効果を得る。同時に苦悩の持続時間を延長、または美徳を_30ターン_減少させる。
actors.hero.talent.never_compromise.comment=瀕死中に苦悩または美徳が依然として存在する場合、致命的ダメージを受ける度にHPを1残して耐え、苦悩の持続時間を延長または美徳を減少させる。ただし、苦悩中に正気度がゼロになることで生じる心不全による死亡は回避できない。苦悩または美徳の持続時間終了後、_100ターン_持続する重傷状態になる（一部属性低下）。
actors.hero.talent.rewind_time.title=時の巻き戻し
actors.hero.talent.rewind_time.desc=_+1：_敬虔者が苦悩中の正気度が10未満になった時、即座に_30正気度_を回復し、既存の恐慌効果を除去する。\n\n_+2：_敬虔者が苦悩中の正気度が10未満になった時、即座に_40正気度_を回復し、既存の恐慌効果を除去する。\n\n_+3：_敬虔者が苦悩中の正気度が10未満になった時、即座に_50正気度_を回復し、既存の恐慌効果を除去する。
actors.hero.talent.rewind_time.comment=このタレントは_20ターンのクールダウン_がある。
actors.hero.talent$rewindtimeused.name=時の巻き戻し-クールダウン
actors.hero.talent$rewindtimeused.desc=狂気からようやく息をついたばかりだ。再びこのタレントを発動するにはしばらく時間が必要だ。\n\n残りクールダウン：%sターン
actors.hero.talent.bright_warrior.title=光の戦士
actors.hero.talent.bright_warrior.desc=_+1：_敬虔者が美徳中に敵を倒すことで延長できる美徳の持続時間が3ターンから_6ターン_に上昇する。\n\n_+2：_敬虔者が美徳中に敵を倒すことで延長できる美徳の持続時間が3ターンから_9ターン_に上昇する。\n\n_+3：_敬虔者が美徳中に敵を倒すことで延長できる美徳の持続時間が3ターンから_12ターン_に上昇する。
actors.hero.talent.bright_warrior.comment=

actors.hero.talent$dyingwill.name=瀕死
actors.hero.talent$dyingwill.desc=あなたの命は風前の灯だ。\n\n強靭な意志により数回の致命的ダメージに耐えられるが、苦悩または美徳の持続時間終了後、長時間の重傷状態に陥る。\n\n苦悩中に正気度がゼロになることで生じる心不全による死亡は、これによっても回避できない。
actors.hero.talent$dyingwill.get=強靭な意志が死を拒絶した！
actors.hero.talent$dyingwill.heavy_wound=重傷
actors.hero.talent$dyingwill.heavy_wound_log=耐え難い重傷を負った…
actors.hero.talent$heavywound.name=重傷
actors.hero.talent$heavywound.desc=あなたの身体は満身創痍だ。\n\n重傷中、あなたの物理ダメージ-50%%、精度と回避-30%%。\n\n完全に回復するまであと%sターン。

actors.hero.abilities.friar.concentratedpotion.name=濃縮薬剤
actors.hero.abilities.friar.concentratedpotion.short_desc=修道士は錬金スプレーガンに_濃縮薬剤_を追加装着でき、薬液残量を補充すると同時に次の噴射を強化する。
actors.hero.abilities.friar.concentratedpotion.desc=修道士は錬金スプレーガンに濃縮薬剤を追加装着できる。薬液残量を6ポイント補充し、次の噴射効果を1段階強化する。\n\n濃縮薬剤の装着には2ターンを要する。
actors.hero.abilities.friar.concentratedpotion.no_spraygun=濃縮薬剤を装着するには錬金スプレーガンが必要だ。

actors.hero.talent.concentrated_essence.title=濃縮エッセンス
actors.hero.talent.concentrated_essence.desc=_+1：_修道士が錬金スプレーガンに濃縮薬剤を装着した後、次の噴射で追加で_1種類の異なるランダム装着効果_が発動する。\n\n_+2：_修道士が錬金スプレーガンに濃縮薬剤を装着した後、次の噴射で追加で_2種類の異なるランダム装着効果_が発動する。\n\n_+3：_修道士が錬金スプレーガンに濃縮薬剤を装着した後、次の噴射で追加で_3種類の異なるランダム装着効果_が発動する。\n\n_+4：_修道士が錬金スプレーガンに濃縮薬剤を装着した後、次の噴射で追加で_4種類の異なるランダム装着効果_が発動する。
actors.hero.talent.concentrated_essence.comment=このタレントは液火薬剤が既に装着されている場合、氷霜薬剤の効果を発動しない。その逆も同様。両方未装着の場合、ランダムな複数効果の中から1種類のみ出現する。
actors.hero.talent.reagent_enhancement.title=薬液強化
actors.hero.talent.reagent_enhancement.desc=_+1：_修道士が錬金スプレーガンに濃縮薬剤を装着した後、次の噴射効果が_3段階強化_される。\n\n_+2：_修道士が錬金スプレーガンに濃縮薬剤を装着した後、次の噴射効果が_4段階強化_される。\n\n_+3：_修道士が錬金スプレーガンに濃縮薬剤を装着した後、次の噴射効果が_5段階強化_される。\n\n_+4：_修道士が錬金スプレーガンに濃縮薬剤を装着した後、次の噴射効果が_6段階強化_される。
actors.hero.talent.reagent_enhancement.comment=
actors.hero.talent.reuse_reagent.title=リサイクル
actors.hero.talent.reuse_reagent.desc=_+1：_修道士が薬液残量が50%を超えている状態で濃縮薬剤を装着する場合、その装着に消費されるチャージが_16%減少_する。\n\n_+2：_修道士が薬液残量が50%を超えている状態で濃縮薬剤を装着する場合、その装着に消費されるチャージが_30%減少_する。\n\n_+3：_修道士が薬液残量が50%を超えている状態で濃縮薬剤を装着する場合、その装着に消費されるチャージが_40%減少_する。\n\n_+4：_修道士が薬液残量が50%を超えている状態で濃縮薬剤を装着する場合、その装着に消費されるチャージが_50%減少_する。
actors.hero.talent.reuse_reagent.comment=



actors.hero.abilities.friar.holyprayer.name=聖光の祈り
actors.hero.abilities.friar.holyprayer.short_desc=修道士は_聖光の祈り_を行い、自身と味方に強力な聖光の祝福効果を付与する。
actors.hero.abilities.friar.holyprayer.desc=修道士は聖光の祈りを行い、聖光の祝福を請い、自身と味方の加護を求める。聖光の祝福は30ターン持続する。\n\n修道士が聖光の祝福を得た時、既に美徳を有している場合はそれを10ターン延長し、期間中追加で50%の精度と回避を得る。\n\n味方が聖光の祝福を得た時、最大HPの30%を回復し、期間中追加で100%の精度と回避を得る。
actors.hero.abilities.friar.holyprayer.cast=光の中にあれ、我らの勝利を願う！

actors.hero.abilities.friar.holyprayer$holyprayerblessing.name=聖光の祝福
actors.hero.abilities.friar.holyprayer$holyprayerblessing.desc=道は照らされ、道筋は明らかになった。我々はその力に従えばよい。\n\n修道士が自身と味方のために祈りを捧げ、今や聖光は全ての人を加護している。聖光の祝福の間、修道士の精度と回避は50%%上昇し、味方の精度と回避は100%%上昇する。\n\n聖光の祝福はあと%sターン持続する。この勢いを掴み、最終地点へと進め！
actors.hero.abilities.friar.holyprayer$holyprayerblessing.desc_bane=道は照らされ、道筋は明らかになった。我々はその力に従えばよい。\n\n修道士が自身と味方のために祈りを捧げ、今や聖光は全ての人を加護している。聖光の祝福の間、修道士の精度と回避は50%%上昇し、味方の精度と回避は100%%上昇する。\n\nさらに、この祝福の恩恵により、修道士と味方がアンデッドと悪魔の敵に与える物理ダメージが%1$s%%上昇する。\n\n聖光の祝福はあと%2$sターン持続する。この勢いを掴み、最終地点へと進め！

actors.hero.talent.pious_faith.title=敬虔な信仰
actors.hero.talent.pious_faith.desc=_+1：_修道士が聖光の祈りを行った後_25正気度_を回復する。\n\n_+2：_修道士が聖光の祈りを行った後_50正気度_を回復する。\n\n_+3：_修道士が聖光の祈りを行った後_75正気度_を回復する。\n\n_+4：_修道士が聖光の祈りを行った後_100正気度_を回復する。
actors.hero.talent.pious_faith.comment=このタレントによる超過正気度回復は、等量のHP回復に変換される。
actors.hero.talent.supreme_blessing.title=至高の祝福
actors.hero.talent.supreme_blessing.desc=_+1：_修道士が聖光の祈りを行った後、既存の美徳の延長効果が_75ターン_に、味方のHP回復効果が最大HPの_40%_に上昇する。\n\n_+2：_修道士が聖光の祈りを行った後、既存の美徳の延長効果が_100ターン_に、味方のHP回復効果が最大HPの_60%_に上昇する。\n\n_+3：_修道士が聖光の祈りを行った後、既存の美徳の延長効果が_125ターン_に、味方のHP回復効果が最大HPの_80%_に上昇する。\n\n_+4：_修道士が聖光の祈りを行った後、既存の美徳の延長効果が_150ターン_に、味方のHP回復効果が最大HPの_100%_に上昇する。
actors.hero.talent.supreme_blessing.comment=
actors.hero.talent.hatred_of_evil.title=異魔への憎悪
actors.hero.talent.hatred_of_evil.desc=_+1：_修道士と味方が聖光の祝福中に_アンデッドと悪魔属性_の敵に与える物理ダメージが_30%上昇_する。\n\n_+2：_修道士と味方が聖光の祝福中に_アンデッドと悪魔属性_の敵に与える物理ダメージが_40%上昇_する。\n\n_+3：_修道士と味方が聖光の祝福中に_アンデッドと悪魔属性_の敵に与える物理ダメージが_50%上昇_する。\n\n_+4：_修道士と味方が聖光の祝福中に_アンデッドと悪魔属性_の敵に与える物理ダメージが_60%上昇_する。
actors.hero.talent.hatred_of_evil.comment=

actors.hero.abilities.friar.reasondose.name=正気度注射薬
actors.hero.abilities.friar.reasondose.short_desc=修道士は自身に_正気度注射薬_を注射し、大量の正気度を回復し恐慌効果を解除する。
actors.hero.abilities.friar.reasondose.desc=修道士は自身に正気度注射薬を注射し、50正気度を回復し、即座に恐慌効果を解除する。\n\n注射薬の使用は時間を消費しない。
actors.hero.abilities.friar.reasondose.cast=痛みが一瞬で和らいだ…

actors.hero.talent.heart_dose.title=強心注射薬
actors.hero.talent.heart_dose.desc=_+1：_修道士は注射後さらに_最大HPの10%_を回復する。\n\n_+2：_修道士は注射後さらに_最大HPの15%_を回復する。\n\n_+3：_修道士は注射後さらに_最大HPの20%_を回復する。\n\n_+4：_修道士は注射後さらに_最大HPの25%_を回復する。
actors.hero.talent.heart_dose.comment=
actors.hero.talent.shield_dose.title=シールド注射薬
actors.hero.talent.shield_dose.desc=_+1：_修道士は注射後さらに_20シールド_を得る。\n\n_+2：_修道士は注射後さらに_30シールド_を得る。\n\n_+3：_修道士は注射後さらに_40シールド_を得る。\n\n_+4：_修道士は注射後さらに_50シールド_を得る。
actors.hero.talent.shield_dose.comment=
actors.hero.talent.calm_dose.title=鎮静注射薬
actors.hero.talent.calm_dose.desc=_+1：_修道士は注射後さらに自身の全ての弱体効果を即座に除去し_3ターンの完全浄化_を得る。\n\n_+2：_修道士は注射後さらに自身の全ての弱体効果を即座に除去し_5ターンの完全浄化_を得る。\n\n_+3：_修道士は注射後さらに自身の全ての弱体効果を即座に除去し_8ターンの完全浄化_を得る。\n\n_+4：_修道士は注射後さらに自身の全ての弱体効果を即座に除去し_10ターンの完全浄化_を得る。
