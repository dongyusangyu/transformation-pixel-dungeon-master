actors.hero.talent.myopia.comment=
actors.hero.talent.land_swimming.title=陸上水泳
actors.hero.talent.land_swimming.desc=_+0：_巨大ピラニアと幻影ピラニアが_陸上ピラニアと陸上幻影ピラニア_に置換、属性は同じ。\n\n_+1：_陸上ピラニアと陸上幻影ピラニアの移動速度50%低下。\n\n_+2：_巨大ピラニアと幻影ピラニアの置換なし、陸上の陸上ピラニアと陸上幻影ピラニアは即死。
actors.hero.talent.land_swimming.comment=「川の上に曰く、逝く者は斯くの如き夫。」\n\n_——可則が川の上流で言った、ここでピラニアに噛まれた者は川の水の如く尽きることなく_
actors.hero.talent.jiulongla_coffin.title=九龍拉棺
actors.hero.talent.jiulongla_coffin.desc=_+0：_英雄の最大HP_40%減少_。\n\n_+1：_英雄の最大HP_20%減少_。\n\n_+2：_英雄の最大HP減少なし。
actors.hero.talent.jiulongla_coffin.comment=「地下牢から凶報が、地下牢英雄戦士が過食、Lv30で腹一杯、最後に古神レーザーで撃ち抜かれ飛昇、全肉大餅星へ。」
actors.hero.talent.cowboy.title=悪徳商人
#fix9：コメント補完
actors.hero.talent.cowboy.desc=_+0：_アイテム購入時_30%確率_で_投石_に置換。\n\n_+1：_アイテム購入時_15%確率_で_投石_に置換。\n\n_+2：_購入アイテムの投石置換なし。
actors.hero.talent.cowboy.comment=注意：包装(巻物筒、薬剤ホルダー、魔法筒袋)も含む。\n\n「本プロジェクトの合法利益は全て食料購入に充てられます。」\n\n_——飢えた可則_
actors.hero.talent.mamba_out.title=牢大に敬礼
actors.hero.talent.mamba_out.desc=_+0：_英雄奈落落下時_最大HP10%_の_遅延ダメージ_追加獲得。\n\n_+1：_英雄奈落落下時_最大HP15%_の_遅延ダメージ_追加獲得。\n\n_+2：_英雄奈落落下時の遅延ダメージ追加なし。
