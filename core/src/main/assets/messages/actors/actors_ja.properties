actors.hero.talent.abyssal_gaze.title=深淵の凝視
actors.hero.talent.abyssal_gaze.desc=_+1：_分解の杖の魔法が生物または固体地形を貫通して得るダメージ貫通修正効果_が_2倍_に向上。\n\n_+2：_1に加えて、分解の杖の魔法ダメージが_20%_増加。
actors.hero.talent.abyssal_gaze.comment=「深淵を凝視する時、深淵もまた君を凝視している。」

actors.hero.talent.moronity.title=痴愚
actors.hero.talent.moronity.desc=_+1：_杖またはワンドの魔法が_ランダムで1ターンの幻惑、被ダメージ増加、または弱体_を与える。\n\n_+2：_杖またはワンドの魔法が_ランダムで2ターンの幻惑、被ダメージ増加、または弱体_を与える。\n\n_+3：_杖またはワンドの魔法が_ランダムで3ターンの幻惑、被ダメージ増加、または弱体_を与える。
actors.hero.talent.moronity.comment=このタレントは3種の弱体効果のうち1つをランダムで付与するもので、全てを同時に付与するわけではない。

actors.hero.talent.journey_nature.title=自然の旅
actors.hero.talent.journey_nature.desc=_+1：_自然の靴の種ドロップ確率上昇効果_が50%向上_。\n\n_+2：_1に加えて、自然の靴の根付きによる充填消費が_50%低下_（使用時の充填必要量は変わらない）。
actors.hero.talent.journey_nature.comment=「狩人が履いている靴。」

actors.hero.talent.love_backstab.title=愛の背刺
actors.hero.talent.love_backstab.desc=_+1：_魅了状態_のユニットへのダメージが_15%_増加。\n\n_+2：_魅了状態_のユニットへのダメージが_30%_増加。\n\n_+3：_魅了状態_のユニットへのダメージが_45%_増加。
actors.hero.talent.love_backstab.comment=「牢屋での一番の一撃、まずは心の恋人を斬る。」

actors.hero.talent.concept_grid.title=概念ブロック
actors.hero.talent.concept_grid.desc=_+1：_非飢餓ダメージ、遅延ダメージによる_被ダメージ-1_、全ての軽減後に計算。\n\n_+2：_非飢餓ダメージ、遅延ダメージによる_被ダメージ-2_、全ての軽減後に計算。\n\n_+3：_非飢餓ダメージ、遅延ダメージによる_被ダメージ-3_、全ての軽減後に計算。
actors.hero.talent.concept_grid.comment=

actors.hero.talent.abacus.title=算盤
actors.hero.talent.abacus.desc=_+1：_物理攻撃_50%確率_で_2の重複可能シールド_を追加。\n\n_+2：_物理攻撃_75%確率_で_2の重複可能シールド_を追加。\n\n_+3：_物理攻撃_必ず_2の重複可能シールド_を追加。
actors.hero.talent.abacus.comment=

actors.hero.talent.time_sand.title=時の砂
actors.hero.talent.time_sand.desc=_+1：_時砂時計が自分がスキップできるターン_が_2倍_に。\n\n_+2：_1に加えて、時砂時計の充填1つにつき周囲の凍結持続時間が_1ターン増加_（最初の充填消費時はターン増加なし）。\n\n_+3：_1と2に加えて、時砂時計の充填速度が_20%_向上。
actors.hero.talent.time_sand.comment=「THE WORLD!!!」

actors.hero.talent.damaged_core.title=破損した核
actors.hero.talent.damaged_core.desc=_+1：_物理攻撃に_1魔法ダメージ_が追加。\n\n_+2：_物理攻撃に_2魔法ダメージ_が追加。
actors.hero.talent.damaged_core.comment=「鶏煲（チキンポット）が天下無双！」

actors.hero.talent.read_profitable.title=開巻有益
actors.hero.talent.read_profitable.desc=このタレントを升級後、巻物を読むたびにランダムで_1種の強化_を獲得。\n\n_+1：_ランダムな強化には_5ターン全面浄化、浮遊、または超速_が含まれる。\n\n_+2：_1に加えて、_5ターン透明_も含まれる。\n\n_+3：_1と2に加えて、さらに_最大HP2.5%のHP回復_も含まれる。
actors.hero.talent.read_profitable.comment=このタレントは混沌の魔導書を読むことで発動可能。

actors.hero.talent.strength_cloak.title=強化マント
actors.hero.talent.strength_cloak.desc=_+1：_影のマントの充填1つにつき追加で_1ターン影隠れ_を付与。\n\n_+2：_影のマントの充填1つにつき追加で_1.5ターン影隠れ_を付与。\n\n_+3：_影のマントの充填1つにつき追加で_2ターン影隠れ_を付与、さらに充填速度が_20%_向上。
actors.hero.talent.strength_cloak.comment=

actors.hero.talent.anesthesia.title=麻酔チンキ
actors.hero.talent.anesthesia.desc=_+1：_薬剤服用で_5シールド_獲得、次に受けるダメージを防ぐ。\n\n_+2：_薬剤服用で_8シールド_獲得、次に受けるダメージを防ぐ。
actors.hero.talent.anesthesia.comment=「麻酔チンキ。」
actors.hero.talent.wanling_potion.title=万霊薬水
actors.hero.talent.wanling_potion.desc=_+1：_薬剤服用で_2ターン全面浄化_。\n\n_+2：_薬剤服用で_3ターン全面浄化_。\n\n_+3：_薬剤服用で_4ターン全面浄化_、英雄の全減益効果を除去。
actors.hero.talent.wanling_potion.comment=「某クズ王が欲しがってた万霊薬ってわけじゃないよ。」
actors.hero.talent.active_muscles.title=筋肉活性
actors.hero.talent.active_muscles.desc=_+1：_レベルアップ時_2一時的筋力_獲得。\n\n_+2：_レベルアップ時_4一時的筋力_獲得。\n\n_+3：_レベルアップ時_6一時的筋力_獲得。
actors.hero.talent.active_muscles.comment=効果_400ターン持続_。
actors.hero.talent.sea_wind.title=四海乗風
actors.hero.talent.sea_wind.desc=_+1：_英雄の水中移動速度_+20%_。\n\n_+2：_英雄の水中移動速度_+40%_。\n\n_+3：_英雄の水中移動速度_+60%_。
actors.hero.talent.sea_wind.comment=「大風起り雲飛揚す。」\n\n_蘿蔔咕_
actors.hero.talent.endless_meal.title=余韻無限
actors.hero.talent.endless_meal.desc=_+1：_食事で_2ターン时间泡_獲得。\n\n_+2：_食事で_4ターン时间泡_獲得。\n\n_+3：_食事で_6ターン时间泡_獲得。
actors.hero.talent.endless_meal.comment=
actors.hero.talent.experience_meal.title=食べて経験値
actors.hero.talent.experience_meal.desc=_+1：_食事で_2経験値_獲得。\n\n_+2：_食事で_3経験値_獲得。
actors.hero.talent.experience_meal.comment=この才能は_雲隠一餐_、_無敵一餐_、_誕生日プレゼント_と_100回発動制限_を共有。\n\n「一堀を食い一堀を食い一堀を食い一堀を…」
actors.hero.talent.birthday_gift.title=誕生日プレゼント
actors.hero.talent.birthday_gift.desc=_+1：_食事時に_17%確率_で_1回低級ドロップ_獲得。\n\n_+2：_食事時に_33%確率_で_1回低級ドロップ_獲得。\n\n_+3：_食事時に_50%確率_で_1回低級ドロップ_獲得。
actors.hero.talent.birthday_gift.comment=この才能は_食べて経験値_、_雲隠一餐_、_無敵一餐_と_100回発動制限_を共有。\n\n「Happy Birthday!」
actors.hero.talent.collect_plants.title=植物収集
actors.hero.talent.collect_plants.desc=_+1：_ランダム種子_3個_獲得。\n\n_+2：_ランダム種子_4個_獲得。\n\n_+3：_ランダム種子_5個_と_無味果_1個_獲得。
actors.hero.talent.collect_plants.comment=レベルアップや変態で直接リソースを得る才能は_26回発動制限_を共有(紳士は_39回_)。\n\nこの才能では腐莓の種は入手不可。
actors.hero.talent.sharp_head.title=頭頂尖り
actors.hero.talent.sharp_head.desc=_+1：_筋力_+3_、精度_17%低下_。\n\n_+2：_筋力_+6_、精度_33%低下_。\n\n_+3：_筋力_+9_、精度_50%低下_。
actors.hero.talent.sharp_head.comment=「じゃあ聞くけどさ。」
actors.hero.talent.strength_armband.title=強化腕章
actors.hero.talent.strength_armband.desc=_+1：_神偷腕章のチャージ速度_20%上昇_。\n\n_+2：_1に加え、神偷腕章が敵から奪う減益効果の持続時間_30%上昇_。\n\n_+3：_1と2に加え、神偷腕章の敵盗取で英雄に_3ターンホルモン活性_、商品盗取のチャージ消費_1減少_(最低1、成功率と使用時チャージ要求は不変)。
actors.hero.talent.strength_armband.comment=
actors.hero.talent.strength_book.title=強化魔導書
#fix9：コメント補完
actors.hero.talent.strength_book.desc=_+1：_無序魔導書の閲覧時に_視界内の敵有無_で_戦闘系/非戦闘系_巻物効果発動。\n\n_+2：_1に加え、無序魔導書のチャージ速度_20%上昇_。
actors.hero.talent.strength_book.comment=無序結晶と同様、_戦闘系_巻物は鏡像/チャージ/転送/催眠/激怒/復讐/恐怖巻物、_非戦闘系_巻物は鑑定/祓邪/チャージ/転送/催眠/探地巻物を含む。\n\n「これこそ真の無序魔導書だ。」
actors.hero.talent.eternal_curse.title=永遠の呪い
actors.hero.talent.eternal_curse.desc=_+0：_祓邪巻物_最低2枚_必要。\n\n_+1：_祓邪巻物_1枚_で除去可能だが_呪い付着/刻印_残留。\n\n_+2：_祓邪巻物_1枚_で完全除去。
actors.hero.talent.eternal_curse.comment=「呪いは多けりゃ身を压さない。」\n\n_DM-216からの呪い_
actors.hero.talent.eternal_curse.unremove=祓邪の数が足りず、呪いを除去できません。
actors.hero.talent.eater.title=食いしん坊
actors.hero.talent.eater.desc=_+0：_空腹速度_30%上昇_。\n\n_+1：_空腹速度_15%上昇_。\n\n_+2：_空腹速度変わらず。
actors.hero.talent.eater.comment=「聞いて聞いて聞いて聞いて聞いて聞いて聞いて聞いてお腹空いたんだってば。」
actors.hero.talent.fate_decision.title=命運の選択
actors.hero.talent.fate_decision.desc=_+0：_変態_選択肢-2_。\n\n_+1：_変態_選択肢-1_。\n\n_+2：_変態選択肢変わらず。
actors.hero.talent.fate_decision.comment=「これが運命だ。」\n\n_DM-216が左右ロールできない憤りから_
actors.hero.talent.endless_malice.title=無限の悪意
actors.hero.talent.endless_malice.desc=_+0：_アイテム拾得時_40%確率_で_最大HP40%_減少。\n\n_+1：_アイテム拾得時_30%確率_で_最大HP5%_減少。\n\n_+2：_アイテム拾得でHP減少なし。
