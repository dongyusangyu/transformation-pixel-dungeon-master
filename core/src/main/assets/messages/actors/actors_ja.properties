#新規タレント


actors.hero.talent.aquatic_recover.title=水中回復
actors.hero.talent.aquatic_recover.desc=_+1：\n水中で_10ターン_ごとに_1HP_回復_\。\n\n_+2：\n水中で_5ターン_ごとに_1HP_回復_\。
actors.hero.talent.aquatic_recover.comment=ヒーローが長期間レベルアップしない場合、このタレントは徐々に回復を停止します。

actors.hero.talent.pump_attack.title=溜め攻撃
actors.hero.talent.pump_attack.desc=_+1：\n近接攻撃に_20%の確率_で_2倍ダメージ_\。\n\n_+2：\n近接攻撃に_20%の確率_で_3倍ダメージ_\。
actors.hero.talent.pump_attack.comment=
actors.hero.talent.pump_attack.glog=この一撃は非常に強い力を蓄積し、倍率ダメージを与えた

actors.hero.talent.ooze_attack.title=泥付着
actors.hero.talent.ooze_attack.desc=_+1：\n近接攻撃に_50%の確率_で_15ターンの泥_効果と_10の遅延ダメージ_\。\n\n_+2：\n近接攻撃に_75%の確率_で_15ターンの泥_効果と_10の遅延ダメージ_\。
actors.hero.talent.ooze_attack.comment=

actors.hero.talent.surprise_throw.title=奇襲投擲
actors.hero.talent.surprise_throw.desc=このタレントをアップグレードすると、すべての投擲武器が手裏剣の特性（移動後の投擲がターンを消費しない）を得て、与えるダメージも一定量増加するが、命中率は_50%低下_する。\n\n_+1：\n投擲武器ダメージ_20%増加_\。\n\n_+2：\n投擲武器ダメージ_40%増加_\。
actors.hero.talent.surprise_throw.comment=このタレントの手裏剣特性は標的に照準を合わせている時のみ発動する。霊能弓などの特殊投擲武器もこのタレントの手裏剣特性は発動するが、ダメージは増加しない。\n\n「本質は腕力の強化であり、投擲時の反動で移動する。」


actors.hero.talent.smoke_mask.title=煙幕
actors.hero.talent.smoke_mask.desc=_+1：\n自身を中心に_100単位_の_煙幕ガス_を放出する特殊能力を得る_\。\n\n_+2：\n自身を中心に_150単位_の_煙幕ガス_を放出する特殊能力を得る_\。
actors.hero.talent.smoke_mask.comment=このタレントで得た特殊能力は_5ターンのクールダウン_がある。
actors.hero.talent$smokecooldown.name=煙幕-クールダウン
actors.hero.talent$smokecooldown.desc=この能力を使ったばかりで、再使用には少し待つ必要がある。\n\n残りクールダウン：%sターン
actors.hero.talent$smokemask.name=煙幕
actors.hero.talent$smokemask.desc=これは天狗が忍者村で学んだ忍術であり、彼との戦闘で使われなかったのは、暗黒魔法に侵されたために大半の忍術を忘れてしまったからだろう。君はそれを喜ぶべきだ。\n\n自分と味方を煙幕で覆うことができる。発動時にターンは消費しない。
actors.hero.talent$smokemask.action_name=煙幕

actors.hero.talent.rush.title=疾風迅雷
actors.hero.talent.rush.desc=_+1：_移動速度_が50%上昇_。\n\n_+2：_移動速度_が75%上昇_。
actors.hero.talent.rush.comment=

actors.hero.talent.overload_charge.title=チャージ過負荷
actors.hero.talent.overload_charge.desc=_+1：_ワンドまたはアーティファクトのチャージ効果_中、ヒーローの移動速度_が50%上昇_、近接攻撃ダメージ_が30%上昇_。\n\n_+2：_ワンドまたはアーティファクトのチャージ効果_中、ヒーローの移動速度_が75%上昇_、近接攻撃ダメージ_が50%上昇_。
actors.hero.talent.overload_charge.comment=「警告！警告！」

actors.hero.talent.gas_spurt.title=毒ガス噴射
actors.hero.talent.gas_spurt.desc=_+1：_ワンドまたは杖で魔法を放つ時、目標に向けて少量の_毒ガス_を発射する_。\n\n_+2：_ワンドまたは杖で魔法を放つ時、目標に向けて少量の_酸ガス_を発射する_。
actors.hero.talent.gas_spurt.comment=このタレントは_5ターンのクールダウン_がある_。\n\n「この魔法能力は主にドワーフ鉱山の探検者たちによる暴走ドワーフ機械の研究に由来する。」
actors.hero.talent$gascooldown.name=毒ガス噴射-クールダウン
actors.hero.talent$gascooldown.desc=このタレントを使用したばかりです。しばらく待つと再使用できます。\n\n残りクールダウン：%sターン

actors.hero.talent.king_protect.title=王の加護
actors.hero.talent.king_protect.desc=_+1：_ダメージを受けた時_75%の確率で_ダメージを_持続ダメージ_に変換する_。\n\n_+2：_ダメージを受けた時_必ず_ダメージを_持続ダメージ_に変換する_。
actors.hero.talent.king_protect.comment=

actors.hero.talent.summon_follower.title=王権召喚
actors.hero.talent.summon_follower.desc=_+1：_アーマースキル使用時_ドワーフの術士またはドワーフの武僧を1体_召喚して戦わせる_。\n\n_+2：_アーマースキル使用時_ドワーフの術士またはドワーフの武僧を2体_召喚して戦わせる_。
actors.hero.talent.summon_follower.comment=

actors.hero.talent.wolfish_gaze.title=鷹視狼顧
actors.hero.talent.wolfish_gaze.desc=_+1：_命中精度が元の_4倍_に上昇_。\n\n_+2：_攻撃_が_必中_になる_。
actors.hero.talent.wolfish_gaze.comment=

actors.hero.talent.fasting.title=電子養胃
actors.hero.talent.fasting.desc=_+1：HP満タン_時、任意の行動で発生する満腹度消費_が1_。\n\n_+2：HPが80%以上_時、任意の行動で発生する満腹度消費_が1_。
actors.hero.talent.fasting.comment=

actors.hero.talent.strong_attack.title=強力進攻
actors.hero.talent.strong_attack.desc=_+1：_近接攻撃で敵に_3ターンの脆弱_を付与_。\n\n_+2：_近接攻撃で敵に_5ターンの脆弱_を付与_。
actors.hero.talent.strong_attack.comment=このタレントは_5ターンのクールダウン_がある_。\n\n「変身最初のタレントは、すでにジャッカルウィザードによる脆弱の独占を打破した。」
actors.hero.talent$stratkcooldown.name=強力進攻-クールダウン
actors.hero.talent$stratkcooldown.desc=このタレントを使用したばかりです。しばらく待つと再使用できます。\n\n残りクールダウン：%sターン

actors.hero.talent.survival_volition.title=生存意志
actors.hero.talent.survival_volition.desc=_+1：HPが40%未満_時、被撃で_50%ダメージ耐性、超速度、全面浄化を4ターン_獲得_。\n\n_+2：HPが40%未満_時、被撃で_50%ダメージ耐性、超速度、全面浄化を4ターン_獲得_。
actors.hero.talent.survival_volition.comment=このタレントは_10ターンのクールダウン_がある_。\n\n「へへ、絶対に生き延びてやる。」
actors.hero.talent$survolcooldown.name=生存意志-クールダウン
actors.hero.talent$survolcooldown.desc=このタレントを使用したばかりです。しばらく待つと再使用できます。\n\n残りクールダウン：%sターン

actors.hero.talent.trap_master.title=罠の専門家
actors.hero.talent.trap_master.desc=_+1：_罠の結晶柱使用時_66%の確率で自身に回収_。\n\n_+2：_罠の結晶柱使用時_75%の確率で自身に回収_。\n\n_+3：_罠の結晶柱使用時_80%の確率で自身に回収_。
actors.hero.talent.trap_master.comment=このタレントをアップグレードすると追加で_罠の結晶柱を1個_獲得_。\n\nこのようにアップグレードまたは変身でリソースを直接獲得するタレントは共有で_26回のトリガー制限_(紳士は_39回_)がある_。

actors.hero.talent.strong_throw.title=強力投擲
actors.hero.talent.strong_throw.desc=_+1：_近接武器を投擲した時、敵に_武器階数の2倍_のダメージを与える_。\n\n_+2：_近接武器を投擲した時、敵に_武器階数の4倍_のダメージを与える_。
actors.hero.talent.strong_throw.comment=「飛剣ブーメラン！」

actors.hero.talent.counter_attack.title=反撃の一撃
actors.hero.talent.counter_attack.desc=_+1：_近接攻撃を受けた時_20%の確率で_ヒーローレベル0.5倍の反撃_を与える_。\n\n_+2：_近接攻撃を受けた時_35%の確率で_ヒーローレベル0.5倍の反撃_を与える_。\n\n_+3：_近接攻撃を受けた時_50%の確率で_ヒーローレベル0.5倍の反撃_を与える_。
actors.hero.talent.counter_attack.comment=

actors.hero.talent.fear_incarnation.title=恐怖の化身
actors.hero.talent.fear_incarnation.desc=_+1：_恐怖_状態_の敵を攻撃時、追加で_3ダメージ_を与える_。\n\n_+2：_恐怖_状態_の敵を攻撃時、追加で_5ダメージ_を与える_。
actors.hero.talent.fear_incarnation.comment=「敵が怯んでいる隙に痛烈な一撃を。」

actors.hero.talent.behest.title=遺志の継承
actors.hero.talent.behest.desc=_+1：_味方が死亡した時、ヒーローに_5ターンのホルモン活性_を付与_。\n\n_+2：_味方が死亡した時、ヒーローに_10ターンのホルモン活性_を付与_。\n\n_+3：_味方が死亡した時、ヒーローに_15ターンのホルモン活性_を付与_。
actors.hero.talent.behest.comment=このタレントは腐化、沈淪、および身代わりになる敵には効果がない。

actors.hero.talent.burning_curse.title=燃焼呪文
actors.hero.talent.burning_curse.desc=_+1：_ワンドまたは杖で_燃焼_状態_の敵を攻撃時、追加で_2ターンの衰弱_を与える_。\n\n_+2：_ワンドまたは杖で_燃焼_状態_の敵を攻撃時、追加で_2ターンの衰弱_と_2ターンの盲目_を与える_。
actors.hero.talent.burning_curse.comment=「火の魔法第一課：炎に畏敬の念を抱け。」

actors.hero.talent.invisibility_shadows.title=掠陣の影
actors.hero.talent.invisibility_shadows.desc=このタレントをアップグレードすると、ヒーローが暗影のクローク、透明化薬などで影遁または透明化を獲得した時、_分身を1体生成_する_。\n\n_+1：_このタレントは_10ターンのクールダウン_がある_。\n\n_+2：_このタレントは_10ターンのクールダウン_がある_。
actors.hero.talent.invisibility_shadows.comment=「暗影軍団ってわけじゃない。」
actors.hero.talent$invshacooldown.name=掠陣の影-クールダウン
actors.hero.talent$invshacooldown.desc=このタレントを使用したばかりです。しばらく待つと再使用できます。\n\n残りクールダウン：%sターン

actors.hero.talent.justice_punish.title=正義の懲戒
#fix9：悪魔属性の敵対象補充（四小と大悪魔）
actors.hero.talent.justice_punish.desc=_+1：_物理攻撃で_アンデッドと悪魔属性_の敵に追加で_20%ダメージ_、撃破時_1ターンの祝福_を獲得_。\n\n_+2：_物理攻撃で_アンデッドと悪魔属性_の敵に追加で_30%ダメージ_、撃破時_2ターンの祝福_を獲得_。
actors.hero.talent.justice_punish.comment=_アンデッド属性_の敵には、怨霊、呪縛霊、ガイコツ、狂ったスリ、狂った強盗、監獄の守衛、ネクロマンサー、幽霊魔導師、ドワーフ屍群、ドワーフ術士、ドワーフ武僧、武僧大師、ドワーフ王、大魔導師ティムール、武僧宗師が含まれる。\n\n_悪魔属性_の敵には、宝箱怪、黄金宝箱怪、水晶宝箱怪、黒檀宝箱怪、変身宝箱怪、腐臭ネズミ、粘液グー、悪魔の血巣、サキュバス、邪眼、巨大サソリ、酸液巨大サソリ、古神の幼虫、燃焼/大地/腐食/錆輝/暗影の拳、ヨグ＝ズェワ、ナーグル/奸奇/恐虐/色孽の信徒、大悪魔が含まれる。\n\n悪魔の裂き手は_アンデッドと悪魔属性_を同時に持つが、このタレントが二重に効果を発揮することはない。\n\n「地獄の果てまでも追い詰めてやる。」

actors.hero.talent.overwhelming.title=排山倒海
actors.hero.talent.overwhelming.desc=このタレントをアップグレードすると、ヒーローは遅い攻撃速度から恩恵を得られる。\n\n_+1：_攻撃の消費時間が1ターンを超えた部分は_0.33倍_でダメージに加算され、_0.5倍_で命中精度に加算される_。\n\n_+2：_攻撃の消費時間が1ターンを超えた部分は_0.66倍_でダメージに加算され、_1倍_で命中精度に加算される_。\n\n_+2：_攻撃の消費時間が1ターンを超えた部分は_1倍_でダメージに加算され、_1.5倍_で命中精度に加算される_。
actors.hero.talent.overwhelming.comment=_大根ダンジョン_からの強力な力！

actors.hero.talent.energy_conversion.title=エネルギー変換
actors.hero.talent.energy_conversion.desc=_+1：_アーティファクト、ワンド、アーマースキル、武技のチャージ速度が_移動速度の0.5倍_になる、元の速度を下回らない_。\n\n_+2：_アーティファクト、ワンド、アーマースキル、武技のチャージ速度が_移動速度の1倍_になる、元の速度を下回らない_。
actors.hero.talent.energy_conversion.comment=_大根ダンジョン_からの強力な力！

actors.hero.talent.magic_recycling.title=魔力回収
actors.hero.talent.magic_recycling.desc=_+1：_ワンドまたは杖で魔法を放つ時_10%の確率で_チャージを消費しない_。\n\n_+2：_ワンドまたは杖で魔法を放つ時_15%の確率で_チャージを消費しない_。\n\n_+3：_ワンドまたは杖で魔法を放つ時_20%の確率で_チャージを消費しない_。
actors.hero.talent.magic_recycling.comment=

actors.hero.talent.precious_experience.title=貴重な経験
actors.hero.talent.precious_experience.desc=_+1：_経験薬または神意啓発の合剤を使用時_追加で_半レベルの経験値_を獲得_。\n\n_+2：_1に加えて、追加で_50ターンの祝福_効果を獲得_。
actors.hero.talent.precious_experience.comment=「この経験値、とても貴重だよ。」

actors.hero.talent.disturb_attack.title=撹乱打撃
actors.hero.talent.disturb_attack.desc=_+1：_物理攻撃で敵に_10%の確率で_3ターンのスタン_を与える_。\n\n_+2：_物理攻撃で敵に_20%の確率で_3ターンのスタン_を与える_。
actors.hero.talent.disturb_attack.comment=「実は武器に幻覚性の液体を塗ってるんだ。」

actors.hero.talent.gholl_witchcraft.title=ジャッカルウィッチクラフト
actors.hero.talent.gholl_witchcraft.desc=_+1：_射撃状態_の敵を攻撃時_2ターンの混乱_を与える_。\n\n_+2：_射撃状態_の敵を攻撃時_3ターンの混乱_を与える_。
actors.hero.talent.gholl_witchcraft.comment=「人間によるジャッカル人族の巫術の拙劣な再現。」

actors.hero.talent.engineer_refit.title=エンジニア技師
actors.hero.talent.engineer_refit.desc=_+1：_機械類_の敵を撃破時_12.5%の確率で_DM-100に改装し腐化させる_。\n\n_+2：_機械類_の敵を撃破時_25%の確率で_DM-100に改装し腐化させる_。
actors.hero.talent.engineer_refit.comment=DM-400（ランダムモードでDM-400以外のAT-400とAU-400専精を含む）がこのタレントを獲得した場合、ドローン破壊時にも確率でDM-100に改装され腐化する。\n\n_機械類_の敵には、生きた石像、召喚守衛、装甲石像、DM-100、DM-200、DM-201、エネルギータワー、DM-300、ゴーレム、黄金ゴーレムが含まれる。\n\n「機械工学わかる？」

actors.hero.talent.weird_throw.title=怪異投擲
actors.hero.talent.weird_throw.desc=_+1：_投擲武器ではない武器を敵に投げると_1ターンの恐怖_を与える_。\n\n_+2：_投擲武器ではない武器を敵に投げると_2ターンの恐怖_を与える_。
actors.hero.talent.weird_throw.comment=「相手が何を投げてくるか分からないのは確かに怖いことだ。」

actors.hero.talent.thrid_hand.title=第三の手
actors.hero.talent.thrid_hand.desc=_+1：_10%の確率で_アイテム購入時にゴールドを消費しない_。\n\n_+2：_20%の確率で_アイテム購入時にゴールドを消費しない_。
actors.hero.talent.thrid_hand.comment=「ついでに拝借しただけさ。」
actors.hero.talent.thrid_hand.steal=店主の隙を見て、この商品をくすねた。

actors.hero.talent.water_attack.title=水中攻撃
actors.hero.talent.water_attack.desc=_+1：_水中にいる時、追加で_1ダメージ_を与える_。\n\n_+2：_水中にいる時、追加で_2ダメージ_を与える_。
actors.hero.talent.water_attack.comment=「水よ来い、水よ来い。」

actors.hero.talent.more_chance.title=さらなる機会
actors.hero.talent.more_chance.desc=_+1：_変身の巻物と変身の結晶使用時_10%の確率で消費しない_。\n\n_+2：_変身の巻物と変身の結晶使用時_20%の確率で消費しない_。
actors.hero.talent.more_chance.comment=「約束してくれ、賭け続けると。」

actors.hero.talent.amazing_eyesight.title=驚異の視力
actors.hero.talent.amazing_eyesight.desc=_+1：_3マス以上の距離_の敵への近接ダメージが_35%上昇_、命中精度_35%上昇_。\n\n_+2：_2マス以上の距離_の敵への近接ダメージが_35%上昇_、命中精度_35%上昇_。
actors.hero.talent.amazing_eyesight.comment=「一寸長ければ一寸強い。」

actors.hero.talent.light_application.title=軽甲運用
actors.hero.talent.light_application.desc=_+1：_基礎回避が_5-アーマー階級_増加_。\n\n_+2：_1に加えて、効果_が_倍増_。
actors.hero.talent.light_application.comment=防具未装着時は無効。\n\n「実は色仕掛け。」

actors.hero.talent.heavy_application.title=重甲運用
actors.hero.talent.heavy_application.desc=_+1：_最大アーマーが_アーマー階級_増加_。\n\n_+2：_1に加えて、効果_が_倍増_。
actors.hero.talent.heavy_application.comment=防具未装着時は無効。\n\n「本を一枚挟んだだけじゃない。」

actors.hero.talent.bless_meal.title=祝福の聖餐
actors.hero.talent.bless_meal.desc=_+1：_食事にかかるのは_1ターン_、さらに_25ターンの祝福_効果を獲得_。\n\n_+2：_食事にかかるのは_1ターン_、さらに_35ターンの祝福_効果を獲得_。
actors.hero.talent.bless_meal.comment=「主よ、温飽を賜り感謝します。」

actors.hero.talent.bomb_maniac.title=爆破マニア
actors.hero.talent.bomb_maniac.desc=_+1：_爆弾_のダメージが25%上昇_。\n\n_+2：_爆弾_のダメージが50%上昇_。
actors.hero.talent.bomb_maniac.comment=このタレントをアップグレードすると追加で_爆弾を1個_獲得_。\n\nアップグレードまたは変身によるリソース直接取得の回数に制限はない。\n\n「芸術は爆発だ。」

actors.hero.talent.phantom_shooter.title=幻影射手
actors.hero.talent.phantom_shooter.desc=_+1：_投擲武器使用時、追加で_1体の幻影投擲武器を投擲し_10%の投擲武器ダメージ_を与える_。\n\n_+2：_投擲武器使用時、追加で_1体の幻影投擲武器を投擲し_20%の投擲武器ダメージ_を与える_。\n\n_+3：_投擲武器使用時、追加で_1体の幻影投擲武器を投擲し_30%の投擲武器ダメージ_を与える_。
actors.hero.talent.phantom_shooter.comment=

actors.hero.talent.wake_snake.title=藪蛇
actors.hero.talent.wake_snake.desc=_+1：_他の生物が草むらを踏むと_10%の確率で腐化した大蛇が1体_出現_。\n\n_+2：_他の生物が草むらを踏むと_20%の確率で腐化した大蛇が1体_出現_。
actors.hero.talent.wake_snake.comment=「蛇恐怖症の福音。」

actors.hero.talent.collection_gold.title=ゴールドシールド
actors.hero.talent.collection_gold.desc=_+1：_ゴールドを拾う度に_1ポイントのシールド_を獲得_。\n\n_+2：_ゴールドを拾う度に_2ポイントのシールド_を獲得_。
actors.hero.talent.collection_gold.comment=「銭の臭いがプンプンする。」

actors.hero.talent.martial_train.title=武技訓練
actors.hero.talent.martial_train.desc=このタレントをアップグレードすると、ヒーローは武技を使用可能になり、タレントレベルに応じた少量の武技チャージ上限を持ち、90ターン毎に1ポイントの武技チャージを回復する。\n\n_+1：_武技チャージ上限_2ポイント_。\n\n_+2：_武技チャージ上限_3ポイント_。\n\n_+3：_武技チャージ上限_4ポイント_。
actors.hero.talent.martial_train.comment=そのため武技を使用可能なヒーローは、武技を使用することでタレント_烈気シールド_、_专注の一食_、_武器チャージ_、_奪命の余勢_、_精密打撃_の通常効果（非互換効果）を発動できる。\n\nヒーローが元から武技を使用できる場合、_+1/+2/+3_レベル時は武技チャージ上限が_1/2/3ポイント_上昇するのみ。\n\n「努力は人を裏切らない。」

actors.hero.talent.thickened_armor.title=増厚装甲
actors.hero.talent.thickened_armor.desc=_+1：_防具が提供する_最大アーマー_が+1_。\n\n_+2：_防具が提供する_最大アーマー_が+2_。
actors.hero.talent.thickened_armor.comment=防具未装着時は無効。\n\n「ただ胸に本を挟んだだけさ。」

actors.hero.talent.powerful_calculations.title=完全無欠の計略
actors.hero.talent.powerful_calculations.desc=_+1：_キャラクターが視界外で死亡する度に、ヒーローは_1HP_を回復_。\n\n_+2：_キャラクターが視界外で死亡する度に、ヒーローは_2HP_を回復_。
actors.hero.talent.powerful_calculations.comment=「次のセリフは…」

actors.hero.talent.insert_bid.title=標を挿し首を売る
actors.hero.talent.insert_bid.desc=_+1：_射撃_状態_の敵を攻撃時、命中精度_20%上昇_。\n\n_+2：_射撃_状態_の敵を攻撃時、命中精度_40%上昇_。
actors.hero.talent.insert_bid.comment=「ハリネズミになってるのに、まだ当たらないと思うのか？」

actors.hero.talent.meal_shield.title=シールドの一食
actors.hero.talent.meal_shield.desc=_+1：_食事で_4ポイントのシールド_を回復_。\n\n_+2：_食事で_8ポイントのシールド_を回復_。
actors.hero.talent.meal_shield.comment=「食い過ぎた。」

actors.hero.talent.drop_resistant.title=落下耐性
actors.hero.talent.drop_resistant.desc=_+1：_ヒーローが奈落に落ちても_衰弱効果_を受けなくなる_。\n\n_+2：_ヒーローが奈落に落ちても_出血と衰弱効果_を受けなくなる_。
actors.hero.talent.drop_resistant.comment=「小型黒人飛行機、たったの824元！」

actors.hero.talent.strength_train.title=筋力トレーニング
actors.hero.talent.strength_train.desc=_+1：_効果なし_。\n\n_+2：_追加で_1ポイントの筋力_を獲得_。
actors.hero.talent.strength_train.comment=「ワンパンマン式トレーニング法参照。」

actors.hero.talent.treat_meal.title=治療の一食
actors.hero.talent.treat_meal.desc=_+1：_食事でゆっくりと_3HP_を回復_。\n\n_+2：_食事でゆっくりと_5HP_を回復_。
actors.hero.talent.treat_meal.comment=「栄養食。」

actors.hero.talent.cover_scar.title=全身傷痕
actors.hero.talent.cover_scar.desc=_+1：_近接攻撃に_初期値1の出血_が付与_。\n\n_+2：_近接攻撃に_初期値2の出血_が付与_。
actors.hero.talent.cover_scar.comment=「短剣を力強くその胸に突き刺せ。」

actors.hero.talent.nurtritious_meal.title=十全大補
actors.hero.talent.nurtritious_meal.desc=_+1：_食事で_2HPを回復_し_2ポイントのシールド_を獲得_。\n\n_+2：_食事で_4HPを回復_し_4ポイントのシールド_を獲得_。
actors.hero.talent.nurtritious_meal.comment=「栄養食を食べ過ぎて満腹だ。」

actors.hero.talent.rage_attack.title=暴怒攻撃
actors.hero.talent.rage_attack.desc=_+1：_ヒーローの与える物理ダメージと受けるダメージ_が10%上昇_。\n\n_+2：_ヒーローの与える物理ダメージと受けるダメージ_が20%上昇_。\n\n_+3：_ヒーローの与える物理ダメージと受けるダメージ_が30%上昇_。
actors.hero.talent.rage_attack.comment=

actors.hero.talent.military_waterskin.title=軍用水袋
actors.hero.talent.military_waterskin.desc=_+1：_水袋で追加で_15ポイントの露_を収集可能_。\n\n_+2：_水袋で追加で_30ポイントの露_を収集可能_。
actors.hero.talent.military_waterskin.comment=「大水袋はこの辺で。」

actors.hero.talent.jasmine_tea.title=ジャスミン茶
actors.hero.talent.jasmine_tea.desc=_+1：_水袋の露を飲むと_3ターンの祝福_を獲得_。\n\n_+2：_水袋の露を飲むと_5ターンの祝福_を獲得_。
actors.hero.talent.jasmine_tea.comment=「なんか…アイスティーには敵わないな。」

actors.hero.talent.god_lefthand.title=神の左手
actors.hero.talent.god_lefthand.desc=_+1：_このタレント+1を所持している時、タレント_神の右手+1_が効果を発揮する_。\n\n_+2：_このタレント+2を所持している時、タレント_神の右手+2_が効果を発揮する_。
actors.hero.talent.god_lefthand.comment=「左拳はダメージが出ない。」

actors.hero.talent.god_righthand.title=神の右手
actors.hero.talent.god_righthand.desc=_+1：_物理攻撃のダメージ_30%増加_、タレント_神の左手+1_を所持している時のみ効果を発揮_。\n\n_+2：_物理攻撃のダメージ_60%増加_、タレント_神の左手+2_を所持している時のみ効果を発揮_。
actors.hero.talent.god_righthand.comment=「右拳はダメージが高い。」

actors.hero.talent.gold_formation.title=ゴールド魔法陣
actors.hero.talent.gold_formation.desc=_+1：_ヒーローがゴールドを拾った時、バッグ内のゴールドが_200を超えると_自動で_200ゴールド消費_し、隣に_1回の低級ドロップ_を発生_。\n\n_+2：_ヒーローがゴールドを拾った時、バッグ内のゴールドが_1000を超えると_自動で_1000ゴールド消費_し、隣に_1回の中級ドロップ_を発生_。\n\n_+3：_ヒーローがゴールドを拾った時、バッグ内のゴールドが_5000を超えると_自動で_5000ゴールド消費_し、隣に_1回の高級ドロップ_を発生_。
actors.hero.talent.gold_formation.comment=

actors.hero.talent.strengthen_chain.title=強化鎖
actors.hero.talent.strengthen_chain.desc=_+1：_虚空の鎖で敵を引き寄せた時、敵に_10ターンの衰弱_を与える_。\n\n_+2：_1に加えて、虚空の鎖で敵を引き寄せる_ターンを消費しなくなり_、使用毎のチャージ消費が_1低下_(最低消費は_1を下回らず、使用時のチャージ要求は変わらない_)_。
actors.hero.talent.strengthen_chain.comment=「こっちに来い！」

actors.hero.talent.strengthen_chalice.title=強化聖杯
actors.hero.talent.strengthen_chalice.desc=_+1：_蓄血聖杯による自然HP回復速度の上昇効果_が50%向上_。\n\n_+2：_蓄血聖杯による自然HP回復速度の上昇効果_が100%向上_。
actors.hero.talent.strengthen_chalice.comment=「力の一部を取り戻した。」

actors.hero.talent.savage_physique.title=野蛮な体魄
actors.hero.talent.savage_physique.desc=_+1：_HP上限_が10上昇_。\n\n_+2：_HP上限_が15上昇_。
actors.hero.talent.savage_physique.comment=「筋骨を労し、体膚を壮にす。」

actors.hero.talent.ice_breaking.title=氷破行動
actors.hero.talent.ice_breaking.desc=_+1：_目標が_凍傷_状態_の時、物理攻撃で追加で_1の魔法ダメージ_を与える_。\n\n_+2：_目標が_凍傷_状態_の時、物理攻撃で追加で_2の魔法ダメージ_を与える_。
actors.hero.talent.ice_breaking.comment=このタレントをアップグレードすると、タレント_極度深冷+3_の効果が強化される。\n\n「俺ツエー！氷！！！ 」

actors.hero.talent.burning_blood.title=燃焼の血
actors.hero.talent.burning_blood.desc=_+1：_敵が死亡した時、ヒーローは_1HP_を回復_。\n\n_+2：_敵が死亡した時、ヒーローは_2HP_を回復_。
actors.hero.talent.burning_blood.comment=「豚の血を抜くのはやめてくれないか？」

actors.hero.talent.strength_greatest.title=三軍を冠する勁
actors.hero.talent.strength_greatest.desc=_+1：_投擲武器が追加で_1ダメージ_、霊能弓が追加で_0~1ダメージ_を与える_。\n\n_+2：_投擲武器が追加で_2ダメージ_、霊能弓が追加で_0~2ダメージ_を与える_。
actors.hero.talent.strength_greatest.comment=「矢は堅石を貫き、勁は三軍を冠す！」

actors.hero.talent.accumulate_steadily.title=厚積薄発
actors.hero.talent.accumulate_steadily.desc=_+1：_効果なし_。\n\n_+2：_効果なし_。\n\n_+3：攻撃距離_+1_。
actors.hero.talent.accumulate_steadily.comment=

actors.hero.talent.get_up.title=臥榻の側
actors.hero.talent.get_up.desc=_+1：_睡眠中にダメージを受けると_3ターンのホルモン活性_を獲得_。\n\n_+2：_睡眠中にダメージを受けると_5ターンのホルモン活性_を獲得_。
actors.hero.talent.get_up.comment=「この安らぎを乱すことは決して許さない！」
actors.hero.talent$nosleep.name=睡眠
actors.hero.talent$nosleep.desc=しばしの昼寝、邪魔をされると大激怒する。

actors.hero.talent.more_talent.title=さらに多くのタレント
actors.hero.talent.more_talent.desc=_+1：_変身の巻物使用時_50%の確率で_選択肢が_1つ増加_。\n\n_+2：_変身の巻物使用時_必ず_選択肢が_1つ増加_。
actors.hero.talent.more_talent.comment=「すべての道はローマに通ず。」

actors.hero.talent.giant_killer.title=巨人殺し
actors.hero.talent.giant_killer.desc=_+1：_物理攻撃で_巨大型_の敵に追加で_35%ダメージ_。\n\n_+2：_物理攻撃で_巨大型_の敵に追加で_70%ダメージ_。
actors.hero.talent.giant_killer.comment=_巨大型_の敵には、DM-200、DM-201、DM-300、ゴーレム、錆輝の拳、黄金ゴーレム、巨大エリート敵が含まれる。\n\n「奴らを、全て追い払え！」

actors.hero.talent.want_all.title=全部欲しい
actors.hero.talent.want_all.desc=_+1：_水晶宝物庫と水晶通路の部屋で_水晶の鍵が_1本_多く生成_。\n\n_+2：_1に加えて、水晶選択の部屋で_水晶の鍵が_1本_多く生成_。
actors.hero.talent.want_all.comment=水晶宝物庫は装備品2択、水晶通路の部屋は消耗品6種から3つ選択、水晶選択の部屋は装備品と消耗品の2択。\n\n「ガキは選択をするんだ、俺は全部欲しい。」\n「ガイコツの鍵：テキストを入力してください。」


actors.hero.talent.vegetarianism.title=長期菜食
actors.hero.talent.vegetarianism.desc=_+1：_非肉類食品を食べると_450ターン満腹_を獲得、肉類食品を食べると_満腹度回復が50%低下_。\n\n_+2：_非肉類食品を食べると_450ターン満腹_と_最大HP25%の回復_を獲得、肉類食品を食べると_満腹度回復が50%低下_。
actors.hero.talent.vegetarianism.comment=小パック食料、ダンジョンベリー、予備食料、安霊チンキ、無味果実、無味果実ブロックのみ肉類の説明がないため、これらのみが非肉類食品となります。\n\n縮食チャレンジ有効時、このタレントで得られる満腹効果は_350ターン_から_50ターン_に低下。\n\n「どうしても肉を食べたいって？ふざけんな！」\n「肉を食べて嬉しいと思ったことは一度もない…」

actors.hero.talent.word_stun.title=律令震撼
actors.hero.talent.word_stun.desc=_+1：_巻物を敵に投げた時、_2ターン麻痺_を与える。\n\n_+2：_巻物を敵に投げた時、_3ターン麻痺_を与える。
actors.hero.talent.word_stun.comment=このタレントは_10ターン冷却_。\n\n「ただの紙切れじゃないぞ。」
actors.hero.talent$wordstuncooldown.name=律令震撼-冷却
actors.hero.talent$wordstuncooldown.desc=このタレントを発動したばかりです。しばらく待ってから再度発動できます。\n\n残り冷却：_%sターン

actors.hero.talent.novice_benefits.title=初心者特典
actors.hero.talent.novice_benefits.desc=_+1：_直ちに_変成の巻物を1枚_獲得。\n\n_+2：_直ちに_変成の巻物を1枚_獲得。
actors.hero.talent.novice_benefits.comment=この種のタレント（升級や変成で直接リソースを得るもの）は共有_26回_のトリガー制限あり（紳士は_39回_）。\n\n「これが君のガチャの天井だ。」

actors.hero.talent.double_trinkets.title=二重装飾品
actors.hero.talent.double_trinkets.desc=_+1：_魔能触媒を1つ_獲得。\n\n_+2：_効果なし。\n\n_+3：_効果なし。
actors.hero.talent.double_trinkets.comment=注意：同じ装飾品の効果は重複しません。\n\nこの種のタレント（升級や変成で直接リソースを得るもの）は共有_26回_のトリガー制限あり（紳士は_39回_）。\n\n「部品と苔は両方得られない。判定は一つだけ有効だからだ。」

actors.hero.talent.fishing_time.title=サボり時間
actors.hero.talent.fishing_time.desc=_+1：_魚類_の敵へのダメージが_30%_増加。\n\n_+2：_1に加えて、_幻影ピラニアのテレポートを阻止_し、水槽部屋に_巨大ピラニアの生成を1体追加_。生成された巨大ピラニアは負のタレント_陸遊_の影響を受ける。
actors.hero.talent.fishing_time.comment=_魚類_の敵には巨大ピラニア、幻影ピラニア、巨大陸上ピラニア、幻影陸上ピラニアが含まれる。\n\n「サボってる時に思いついたタレントだ。」

actors.hero.talent.posion_dagger.title=毒塗りダガー
actors.hero.talent.posion_dagger.desc=_+1：_ダガー類_武器攻撃が追加で_2ターン毒_を与える。\n\n_+2：_ダガー類_武器攻撃が追加で_4ターン毒_を与える。
actors.hero.talent.posion_dagger.comment=_ダガー類_武器には盗賊のダガー、ロングダガー、暗殺の刃、敬虔者の儀式ダガーが含まれる。\n\n「こいつは毒たっぷり塗った毒刃(ダガー)だぜ…？」

actors.hero.talent.invincible_meal.title=無敵の一食
actors.hero.talent.invincible_meal.desc=_+1：_食事で_1ターン無敵_を獲得。\n\n_+2：_食事で_2ターン無敵_を獲得。\n\n_+3：_食事で_3ターン無敵_を獲得。
actors.hero.talent.invincible_meal.comment=このタレントは_食べて経験_、_雲隠れの一食_、_誕生日プレゼント_と共有_100回_のトリガー制限を持つ。

actors.hero.talent.wellfed_meal.title=満腹精兵
actors.hero.talent.wellfed_meal.desc=_+1：_英雄が_満腹状態_の時、敵への_全ダメージが5%増加_し、_10%ダメージ軽減_を得る。\n\n_+2：_英雄が_満腹状態_の時、敵への_全ダメージが10%増加_し、_20%ダメージ軽減_を得る。\n\n_+3：_英雄が_満腹状態_の時、敵への_全ダメージが15%増加_し、_30%ダメージ軽減_を得る。
actors.hero.talent.wellfed_meal.comment=

actors.hero.talent.shock_bomb.title=震撼爆発
actors.hero.talent.shock_bomb.desc=_+1：_爆弾爆発時、周囲9マスの生物に_1ターン麻痺_を与える。\n\n_+2：_爆弾爆発時、周囲9マスの生物に_2ターン麻痺_を与える。
actors.hero.talent.shock_bomb.comment=このタレントを升級すると追加で_爆弾1個_を獲得。\n\nこのタレントを升級や変成で直接リソースを得る回数に制限はない。\n\n「震撼弾。」

actors.hero.talent.illusion_feed.title=絵餅空腹
actors.hero.talent.illusion_feed.desc=_+1：_直ちに_パイを1つ_獲得。\n\n_+2：_直ちに_パイを1つ_獲得。
actors.hero.talent.illusion_feed.comment=この種のタレント（升級や変成で直接リソースを得るもの）は共有_26回_のトリガー制限あり（紳士は_39回_）。\n\n「君は神筆馬良だな。」

actors.hero.talent.heavy_burden.title=重荷を背負って
actors.hero.talent.heavy_burden.desc=_+1：_ゲームスコア_x2_。\n\n_+2：_ゲームスコア_x3_。
actors.hero.talent.heavy_burden.comment=「スコア稼ぎの神。」

actors.hero.talent.attack_door.title=門前で斧を振るう
actors.hero.talent.attack_door.desc=_+1：_敵が開いた扉のマスにいる時、物理攻撃が追加で_1ダメージ_。\n\n_+2：_敵が開いた扉のマスにいる時、物理攻撃が追加で_2ダメージ_。
actors.hero.talent.attack_door.comment=「Here is Johnny~」

actors.hero.talent.arrow_penetration.title=矢は堅石を貫く
actors.hero.talent.arrow_penetration.desc=_+1：_全ての投擲武器が_壁貫通_効果を持つ、効果は_8マス距離制限_。\n\n_+2：_全ての投擲武器が_壁貫通_効果を持つ、効果は_12マス距離制限_。
actors.hero.talent.arrow_penetration.comment=サイキックボウなどの特殊投擲武器を持つ英雄がこのタレントを得ると、特殊投擲武器にもボーナスが適用される。\n\n「老いてなお、矢は鋭し！」

actors.hero.talent.detox_damage.title=痛みで毒を排す
actors.hero.talent.detox_damage.desc=_+1：_被撃時_25%確率_で_1ターン全面浄化_を獲得。全面浄化後、_15%確率_で全ての弱体効果を除去。\n\n_+2：_被撃時_50%確率_で_1ターン全面浄化_を獲得。全面浄化後、_15%確率_で全ての弱体効果を除去。\n\n_+3：_被撃時_75%確率_で_1ターン全面浄化_を獲得。全面浄化後、_15%確率_で全ての弱体効果を除去。
actors.hero.talent.detox_damage.comment=

actors.hero.talent.returning_honor.title=名誉を携えて帰還
actors.hero.talent.returning_honor.desc=_+1：_敵死亡時に得られる経験値_が25%増加_。\n\n_+2：_敵死亡時に得られる経験値_が50%増加_。\n\n_+3：_敵死亡時に得られる経験値_が75%増加_。
actors.hero.talent.returning_honor.comment=

#fix9：名前を元の投稿「涿郡の屠殺人」に変更
actors.hero.talent.zhuojun_butcher.title=涿郡の屠殺人
#fix9：効果対象を追加・巨大陸上ピラニア
actors.hero.talent.zhuojun_butcher.desc=_+1：_生物類_の敵を倒すと_10%確率_で追加で_神秘の肉1個_を獲得。\n\n_+2：_生物類_の敵を倒すと_20%確率_で追加で_神秘の肉1個_を獲得。
actors.hero.talent.zhuojun_butcher.comment=このタレントのドロップは英雄のレベル制限の影響を受ける。\n\n_生物類_の敵には巨大ピラニア、幻影ピラニア、巨大陸上ピラニア、幻影陸上ピラニア、金色の蜂、齧歯小隊、白化ネズミ、下水道の大蛇、ジャッカル巡視、下水道のカニ、蝿の群れ、スライム、吸血コウモリ、ジャッカル兇徒、重甲兇徒、ジャッカルシャーマン、鉱山蜘蛛など_属性なし_の敵が含まれる。\n\n「スライムがなぜ肉を落とすんだ？」\n「まだ消化し終わってない冒険者かもしれないな。」

actors.hero.talent.aid_stomach.title=胃は強酸
actors.hero.talent.aid_stomach.desc=_+1：_神秘の肉を食べても_負の効果なし_。\n\n_+2：_1に加えて、神秘の肉を食べると追加で_33%満腹度_を回復。
actors.hero.talent.aid_stomach.comment=「毛も血もそのまま、生で丸呑み。」

actors.hero.talent.weapon_make.title=武器製造
actors.hero.talent.weapon_make.desc=_+1：_直ちに_第3エリアで入手可能な武器1つ_を獲得。\n\n_+2：_直ちに_第4エリアで入手可能な武器1つ_を獲得。\n\n_+3：_直ちに_第5エリアで入手可能な武器1つ_を獲得。
actors.hero.talent.weapon_make.comment=このタレントで得た武器は_即座に鑑定され、必要筋力-2_。この種のタレント（升級や変成で直接リソースを得るもの）は共有_26回_のトリガー制限あり（紳士は_39回_）。

actors.hero.talent.secret_stash.title=秘密のへそくり
actors.hero.talent.secret_stash.desc=_+1：_直ちに_1000ゴールド_を獲得。\n\n_+2：_直ちに_1000ゴールド_を獲得。\n\n_+3：_直ちに_1000ゴールド_を獲得。
actors.hero.talent.secret_stash.comment=この種のタレント（升級や変成で直接リソースを得るもの）は共有_26回_のトリガー制限あり（紳士は_39回_）。

actors.hero.talent.earth_meal.title=大地の一食
actors.hero.talent.earth_meal.desc=_+1：_食事で毎ターン減衰する_0~英雄レベル67%の樹皮_を獲得。\n\n_+2：_食事で毎ターン減衰する_0~英雄レベル133%の樹皮_を獲得。\n\n_+3：_食事で毎ターン減衰する_0~英雄レベル200%の樹皮_を獲得。
actors.hero.talent.earth_meal.comment=

actors.hero.talent.eaten_slowly.title=よく噛んでゆっくり飲む
actors.hero.talent.eaten_slowly.desc=_+1：_食事に_追加で10ターン消費_、食べ物の満腹度回復が_30%_増加。\n\n_+2：_食事に_追加で10ターン消費_、食べ物の満腹度回復が_60%_増加、パイを食べると追加で_450ターン満腹_を獲得。
actors.hero.talent.eaten_slowly.comment=このタレントは豊穣の角には無効。また、食事ターンを延長するこのタレントの優先度は、食事ターンを短縮する全てのタレントより高い。\n\n縮食チャレンジ有効時、このタレントで得られる満腹効果は_350ターン_から_50ターン_に低下。\n\n「食前の形式的な儀式に過ぎない。」

actors.hero.talent.invincible.title=向かうところ敵なし
actors.hero.talent.invincible.desc=_+1：_敵が死亡した時、英雄は_2ターン激昂_を獲得。\n\n_+2：_敵が死亡した時、英雄は_4ターン激昂_を獲得。
actors.hero.talent.invincible.comment=「戦うほどに勇む。」

actors.hero.talent.yog_larva.title=幼生の呼び声
actors.hero.talent.yog_larva.desc=_+1：_単発5以上のダメージを受けた時_古神の幼生を1体召喚_して戦わせる。\n\n_+2：_単発5以上のダメージを受けた時_古神の幼生を2体召喚_して戦わせる。\n\n_+3：_2に加えて、古神の幼生が_50%確率_でエリート化。
actors.hero.talent.yog_larva.comment=

actors.hero.talent.yog_fist.title=巨拳の力
actors.hero.talent.yog_fist.desc=このタレントを升級後、神器を使用すると巨拳の力を獲得、効果は_5ターン継続_、_10ターン冷却_。\n\n_+1：_輝暗の拳の力を獲得、_40ターン発光_、同時に物理攻撃が_5ターン盲目_を与える。\n\n_+2：_1に加えて、燃焼の拳の力を獲得、_10ターン烈焰の力_を獲得。\n\n_+3：_1と2に加えて、大地の拳の力を獲得、毎ターン減衰する_0~英雄レベル50%の樹皮_、同時に物理攻撃が_5ターン絡みつき_を与える。
actors.hero.talent.yog_fist.comment=
actors.hero.talent$yogfistcooldown.name=巨拳の力-冷却
actors.hero.talent$yogfistcooldown.desc=このタレントを発動したばかりです。しばらく待ってから再度発動できます。\n\n残り冷却：_%sターン
actors.hero.talent$yogfistpower.name=巨拳の力
actors.hero.talent$yogfistpower.desc=短時間、古神の拳の力を引き出します。\n\n残り時間：_%sターン

actors.hero.talent.yog_ray.title=死の光線
actors.hero.talent.yog_ray.desc=このタレントを升級後、杖で目標に魔法を放つと死の光線を放出、_10ターン冷却_。\n\n_+1：_1本の死の光線_（10~60ダメージ）_を放つ。\n\n_+2：_単一目標に魔法を放つ時、最大で周囲に_3本の死の光線_（10~70ダメージ）_を放つ。\n\n_+3：_単一目標に魔法を放つ時、最大で周囲に_5本の死の光線_（10~80ダメージ）_を放つ。
actors.hero.talent.yog_ray.comment=「ドワーフ王は子供の頃これを見てネクロマンシーに目覚めた。」
actors.hero.talent$yograycooldown.name=死の光線-冷却
actors.hero.talent$yograycooldown.desc=このタレントを発動したばかりです。しばらく待ってから再度発動できます。\n\n残り冷却：_%sターン

actors.hero.talent.afraid_death.title=逃げ足に油
actors.hero.talent.afraid_death.desc=_+1：_HPが30%未満_の時、_移動速度が30%増加_、_物理ダメージが50%低下_。\n\n_+2：_HPが30%未満_の時、_移動速度が40%増加_、_物理ダメージが40%低下_。\n\n_+3：_HPが30%未満_の時、_移動速度が50%増加_、_物理ダメージが30%低下_。
actors.hero.talent.afraid_death.comment=

actors.hero.talent.pyromaniac.title=放火狂
actors.hero.talent.pyromaniac.desc=_+1：_火龍の吐息薬を3本_獲得。\n\n_+2：_煉獄の魔薬を2本_獲得。\n\n_+3：_龍血の秘薬を1本_獲得。
actors.hero.talent.pyromaniac.comment=この種のタレント（升級や変成で直接リソースを得るもの）は共有_26回_のトリガー制限あり（紳士は_39回_）。

actors.hero.talent.reverse_polarity.title=天は人の尻を好む
actors.hero.talent.reverse_polarity.desc=このタレントを升級後、現在のHPが対応する値に調整される。\n\n_+1：_現在のHPが_1_に調整される。\n\n_+2：_現在のHPが_最大HPの50%_に調整される。\n\n_+3：_現在のHPが_最大HPの100%_に調整される。
actors.hero.talent.reverse_polarity.comment=「その表情はどうした、その涙はどうした、その涙で地球を救えるのか？」

actors.hero.talent.hero_name.title=英雄の名
actors.hero.talent.hero_name.desc=_+1：_升級時、追加で_最大HP30%のHP_を回復。\n\n_+2：_升級時、追加で_最大HP30%のHP_を回復。\n\n_+3：_升級時、追加で_最大HP30%のHP_を回復。
actors.hero.talent.hero_name.comment=

actors.hero.talent.sky_earth.title=天地の力
actors.hero.talent.sky_earth.desc=_+1：_英雄が_浮遊、絡みつき、または植生鎧状態_の時、ダメージが_15%_増加。\n\n_+2：_英雄が_浮遊、絡みつき、または植生鎧状態_の時、ダメージが_30%_増加。\n\n_+3：_英雄が_浮遊、絡みつき、または植生鎧状態_の時、ダメージが_45%_増加。
actors.hero.talent.sky_earth.comment=注意：監視者が地縛の根を踏むと植生鎧効果ではなく樹皮効果になるため、このタレントの影響を受けない。\n\n「天を衝く怒りで山河裂け、地を払う一撃で大空崩れる。」

actors.hero.talent.water_isfood.title=水を食に代える
actors.hero.talent.water_isfood.desc=_+1：_薬剤を飲むと_30満腹度_を回復。\n\n_+2：_1に加えて、水袋の露を飲むと_露消費量の10倍の満腹度_を回復。\n\n_+3：_1と2に加えて、_食事時特效を発動可能_。
actors.hero.talent.water_isfood.comment=

actors.hero.talent.delicious_flying.title=美味しすぎて飛ぶ
actors.hero.talent.delicious_flying.desc=_+1：_食事で_15ターン浮遊_を獲得。\n\n_+2：_食事で_25ターン浮遊_を獲得。
actors.hero.talent.delicious_flying.comment=「飯を食わせて飛ばせてやる！」

actors.hero.talent.angel_stance.title=天使の姿勢
actors.hero.talent.angel_stance.desc=_+1：_英雄が_発光状態_の時、攻撃を受けると攻撃者に_30%の魔法反撃_を与える。\n\n_+2：_英雄が_発光状態_の時、攻撃を受けると攻撃者に_40%の魔法反撃_を与える。\n\n_+3：_英雄が_発光状態_の時、攻撃を受けると攻撃者に_50%の魔法反撃_を与える。
actors.hero.talent.angel_stance.comment=

actors.hero.talent.thorny_rose.title=棘ある薔薇
actors.hero.talent.thorny_rose.desc=_+1：_英雄が被撃時、攻撃者に_初期値1の出血_を付与。\n\n_+2：_1に加えて、英雄が被撃時、攻撃者に_1ダメージ_も与える。
actors.hero.talent.thorny_rose.comment=「彼女はまだ君に返事をしてないのか？」

actors.hero.talent.hometown_cloud.title=故郷の雲
actors.hero.talent.hometown_cloud.desc=_+1：_帰路の移動速度_が20%向上_。\n\n_+2：_帰路の移動速度_が40%向上_。\n\n_+3：_帰路の移動速度_が60%向上_。
actors.hero.talent.hometown_cloud.comment=英雄のバッグにYendorのお守りがあれば発動。

actors.hero.talent.deep_freeze.title=極度の深寒
actors.hero.talent.deep_freeze.desc=_+1：_氷霜エンチャントを持つ武器のダメージ_が20%増加_。\n\n_+2：_1に加えて、物理攻撃が_3ターン凍傷_効果を与えられる。\n\n_+3：_1と2に加えて、_凍傷または凍結状態_の敵へのダメージ_が20%増加_；タレント_氷破行動_を所持・升級している場合、ダメージがさらに_50%増加_。
actors.hero.talent.deep_freeze.comment=

actors.hero.talent.frenzied_attack.title=道友よ待て
actors.hero.talent.frenzied_attack.desc=_+1：_物理攻撃が_25%確率_で_2ターン狂乱_を与える。\n\n_+2：_物理攻撃が_50%確率_で_2ターン狂乱_を与える。
actors.hero.talent.frenzied_attack.comment=「道友を薙ぎ払い、己に還る。」

actors.hero.talent.wulei_zhengfa.title=五雷正法
actors.hero.talent.wulei_zhengfa.desc=_+1：_雷霆の杖を1本_獲得。英雄は雷霆の杖の電撃ダメージを受けなくなり、代わりに_電撃ダメージの20%のHP_を回復。\n\n_+2：_1に加えて（リソース取得は含まず）、雷霆の杖の魔法ダメージが_30%_増加。
actors.hero.talent.wulei_zhengfa.comment=この種のタレント（升級や変成で直接リソースを得るもの）は共有_26回_のトリガー制限あり（紳士は_39回_）。\n\n「電流増量。」

actors.hero.talent.magic_girl.title=魔法少女
actors.hero.talent.magic_girl.desc=_+1：_巻物を使用すると_30ターン偽装_効果を獲得、偽装効果中は_20%の杖ダメージ増加_。\n\n_+2：_巻物を使用すると_45ターン偽装_と_10ターン発光_効果を獲得、偽装効果中は_40%の杖ダメージ増加_。
actors.hero.talent.magic_girl.comment=このタレントは混沌の魔導書を読むことで発動可能。\n\n「変身！美少女『戦士』！」

actors.hero.talent.wide_knowledge.title=知識は淵博
actors.hero.talent.wide_knowledge.desc=_+1：_アイテムを拾うと_即座に_呪いの有無を判別。\n\n_+2：_アイテムを拾うと_即座に鑑定_。\n\n_+3：_2に加えて、拾ったアイテムが鑑定されると_3ターン杖充填_を獲得。
actors.hero.talent.wide_knowledge.comment=

actors.hero.talent.gold_meal.title=飯に金を隠す
actors.hero.talent.gold_meal.desc=_+1：_食事で_25ゴールド_を獲得。\n\n_+2：_食事で_35ゴールド_を獲得。
actors.hero.talent.gold_meal.comment=「その食料、皮は金でできてるのか？それとも肉餡が金でできてるのか？」

actors.hero.talent.no_viewrape.title=視姦するな
actors.hero.talent.no_viewrape.desc=_+1：_遠距離ダメージを受けた時、攻撃者に_1ターン盲目_を与える。\n\n_+2：_遠距離ダメージを受けた時、攻撃者に_2ターン盲目_を与える。\n\n_+3：_遠距離ダメージを受けた時、攻撃者に_3ターン盲目_を与える。
actors.hero.talent.no_viewrape.comment=「その紫のスカートを履いたドワーフと、濃い化粧のジャッカルは誰だ！？」

actors.hero.talent.water_ghost.title=水鬼の命乞い
actors.hero.talent.water_ghost.desc=_+1：_敵が水中で死亡した時、_20%確率_で1体の怨霊_を生成し、_5ターン狂乱_を獲得。\n\n_+2：_敵が水中で死亡した時、_20%確率_で1体の腐化怨霊_を生成。
actors.hero.talent.water_ghost.comment=「屍塵の水増し版。」

actors.hero.talent.ash_ledger.title=灰の台帳
actors.hero.talent.ash_ledger.desc=_+1：_敵が死亡した時、英雄は_2シールド_を獲得。\n\n_+2：_敵が死亡した時、英雄は_4シールド_を獲得。
actors.hero.talent.ash_ledger.comment=「魂を奪い魄を捕らえる。」

actors.hero.talent.secret_lighting.title=照明の秘術
actors.hero.talent.secret_lighting.desc=_+1：_巻物を読むと_20ターン発光_を獲得。\n\n_+2：_巻物を読むと_40ターン発光_を獲得。
actors.hero.talent.secret_lighting.comment=このタレントは混沌の魔導書を読むことで発動可能。\n\n「ぎゃあ！目が！」

actors.hero.talent.potential_1.title=潜在能力解放
actors.hero.talent.potential_1.desc=_+1：_変成の巻物を1枚_獲得。\n\n_+2：_効果なし。
actors.hero.talent.potential_1.comment=この種のタレント（升級や変成で直接リソースを得るもの）は共有_26回_のトリガー制限あり（紳士は_39回_）。

