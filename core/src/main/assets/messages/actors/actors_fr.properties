###blobs
actors.blobs.blizzard.name=Tempête de neige
actors.blobs.blizzard.desc=Un blizzard souffle ici.

actors.blobs.confusiongas.name=Gaz étourdissant
actors.blobs.confusiongas.desc=Un nuage de gaz étourdissant flotte ici.

actors.blobs.electricity.name=Champ électrique
actors.blobs.electricity.desc=Des étincelles crépitent dans ce champ électrique.
actors.blobs.electricity.rankings_desc=Électrocuté
actors.blobs.electricity.ondeath=Vous êtes mort électrocuté...

actors.blobs.fire.name=Feu
actors.blobs.fire.desc=Des flammes font rage ici.

actors.blobs.foliage.name=Feuillage
actors.blobs.foliage.desc=Des rayons de lumière percent l'obscurité du jardin souterrain.

actors.blobs.freezing.name=Givre
actors.blobs.freezing.desc=L'air ici est étrangement froid et glacial.

actors.blobs.goowarn.name=Énergie sombre
actors.blobs.goowarn.desc=Une énergie sombre bouillonne ici.

actors.blobs.inferno.name=Enfer
actors.blobs.inferno.desc=Les flammes de l'enfer font rage ici.

actors.blobs.paralyticgas.name=Gaz paralysant
actors.blobs.paralyticgas.desc=Un nuage de gaz paralysant flotte ici.

actors.blobs.regrowth.name=Régénération végétale

actors.blobs.sacrificialfire.name=Feu sacrificiel
actors.blobs.sacrificialfire.desc=C'est un autel portant le feu sacrificiel. Les créatures qui y périssent deviennent des offrandes aux âmes du donjon.\n\nPeut-être qu'assez de sacrifices apporteront une récompense ?
actors.blobs.sacrificialfire.worthy=La flamme dévore votre offrande et brûle encore plus fort.
actors.blobs.sacrificialfire.unworthy=La flamme dévore votre offrande, mais rien ne change.
actors.blobs.sacrificialfire.reward=La flamme jaillit soudain puis s'éteint, laissant une récompense !

actors.blobs.smokescreen.name=Écran de fumée
actors.blobs.smokescreen.desc=Une épaisse fumée noire tourbillonne ici.

actors.blobs.stenchgas.name=Gaz puant
actors.blobs.stenchgas.desc=Une odeur nauséabonde de putréfaction flotte ici.

actors.blobs.stormcloud.name=Tempête
actors.blobs.stormcloud.desc=Des nuages d'orage tourbillonnent ici.

actors.blobs.toxicgas.name=Gaz toxique
actors.blobs.toxicgas.desc=Un nuage de gaz toxique verdâtre flotte ici.
actors.blobs.toxicgas.rankings_desc=Asphyxié
actors.blobs.toxicgas.ondeath=Vous êtes mort empoisonné par le gaz...

actors.blobs.corrosivegas.name=Brouillard corrosif
actors.blobs.corrosivegas.desc=Un nuage mortel de brouillard corrosif flotte ici.

actors.blobs.waterofawareness.name=Eau de la Conscience
actors.blobs.waterofawareness.procced=En en buvant une gorgée, vous sentez la connaissance envahir votre esprit.
actors.blobs.waterofawareness.desc=Le pouvoir de la connaissance émane de l'eau de ce puits. Boire l'eau du puits identifiera tous les objets équipés, détectera les malédictions dans votre sac et révélera l'emplacement de tous les objets de l'étage.

actors.blobs.waterofhealth.name=Eau de la Vie
actors.blobs.waterofhealth.procced=Après une gorgée, vous sentez toutes vos blessures guérir.
actors.blobs.waterofhealth.desc=La force de la vie émane de l'eau de ce puits. Boire l'eau du puits soigne les blessures, calme la faim et purifie tous les objets équipés de leurs malédictions.

actors.blobs.web.name=Toile d'araignée
actors.blobs.web.desc=Tout ici est recouvert d'épaisses toiles d'araignée. Tout ce qui touche ou est lancé sur la toile la brisera, mais sera aussi immobilisé sur place.




###buffs
actors.buffs.swiftthistle$timebubble.name=Bulle temporelle
actors.buffs.swiftthistle$timebubble.desc=Une bulle qui accélère le temps.\n\nVous pouvez effectuer plusieurs actions en un instant dans la bulle, mais attaquer ou lancer un sort interrompt l'effet.\n\nTemps restant : %s tours

actors.buffs.timekeepershourglass$timestasis.name=Arrêt temporel
actors.buffs.timekeepershourglass$timestasis.desc=Vous figez complètement votre propre temps, tandis que le temps autour de vous continue de s'écouler. Pendant l'arrêt, vous ne pouvez pas agir, mais vous êtes presque insensible aux influences extérieures.\n\nTemps restant : %s tours

actors.buffs.timekeepershourglass$timefreeze.name=Gel temporel
actors.buffs.timekeepershourglass$timefreeze.desc=Le temps extérieur a été gelé, vous pouvez maintenant agir en un instant. Cet état persiste jusqu'à ce que vous l'annuliez ou que votre sablier soit à court de charge. Attaquer ou utiliser la magie annule aussi cet effet.\n\nProchaine consommation de charge dans : %s tours

actors.buffs.adrenaline.name=Montée d'adrénaline
actors.buffs.adrenaline.desc=Une pure poussée de potentiel apportée par l'adrénaline. La montée d'adrénaline augmente la vitesse de déplacement et d'attaque d'un personnage.\n\nL'adrénaline permet au personnage d'avoir 2 fois la vitesse de déplacement et 1,5 fois la vitesse d'attaque.\n\nDurée de l'adrénaline : %s tours

actors.buffs.adrenalinesurge.name=Surge de force
actors.buffs.adrenalinesurge.desc=Une vague de puissance intense, mais malheureusement pas permanente.\n\nBonus de force : +%d\nTemps restant avant la dissipation : %s tours

actors.buffs.amok.name=Frénésie
actors.buffs.amok.desc=La frénésie plonge la cible dans un état de rage et de chaos extrêmes.\n\nLes créatures en frénésie attaquent indistinctement quiconque s'approche d'elles, allié ou ennemi.\n\nTemps restant de la frénésie : %s tours

actors.buffs.arcanearmor.name=Armure arcanique
actors.buffs.arcanearmor.desc=Une fine couche de bouclier vous entoure, capable d'absorber une partie des dégâts magiques.\n\nVotre armure magique actuelle : 0~%d\n\nTemps restant avant dissipation : %s tours

actors.buffs.artifactrecharge.name=Recharge d'artefact
actors.buffs.artifactrecharge.desc=L'énergie magique circule en vous, augmentant le taux de recharge des artefacts dans vos mains.\n\nChaque artefact est affecté différemment, mais leurs taux de recharge sont tous grandement améliorés.\n\nTemps restant de recharge d'artefact : %s tours

actors.buffs.ascensionchallenge.name=Malédiction du talisman
actors.buffs.ascensionchallenge.desc=L'ancien dieu parvient encore à maintenir son influence sur ce monde par le biais du talisman, et il l'utilise pour vous empêcher de revenir à la surface !\n\nL'ancien dieu utilise le pouvoir du talisman pour rendre vos ennemis plus nombreux et plus puissants, et tout le donjon devient plus dangereux ! Heureusement, vous pouvez affaiblir son pouvoir en vainquant les ennemis qu'il a renforcés. Les ignorer ne fera qu'accroître la puissance de l'ancien dieu.
actors.buffs.ascensionchallenge.desc_clear=L'énergie sombre émanant du talisman a maintenant été affaiblie au maximum.
actors.buffs.ascensionchallenge.desc_beckon=Le talisman _appelle les ennemis au loin_, leur signalant votre position.
actors.buffs.ascensionchallenge.desc_haste=Le talisman _accélère les ennemis au loin_, leur permettant de vous rejoindre plus vite !
actors.buffs.ascensionchallenge.desc_slow=Le talisman _vous ralentit_ et bloque tout effet de vitesse !
actors.buffs.ascensionchallenge.desc_damage=L'énergie sombre qui agite le talisman est extrêmement puissante, elle _vous inflige directement des dégâts_ !
actors.buffs.ascensionchallenge.beckon=Le talisman commence à appeler les ennemis au loin.
actors.buffs.ascensionchallenge.haste=Le talisman commence à accélérer les ennemis environnants !
actors.buffs.ascensionchallenge.slow=Le talisman dans votre sac pèse soudainement une tonne !
actors.buffs.ascensionchallenge.damage=Le talisman commence à libérer de l'énergie sombre. Cette chose est insupportablement brûlante !
actors.buffs.ascensionchallenge.weaken_info_no_kills=Si vous vainquez des ennemis, la malédiction du talisman sera affaiblie.
actors.buffs.ascensionchallenge.weaken_info=Vous devez vaincre des ennemis pour affaiblir la malédiction du talisman !
actors.buffs.ascensionchallenge.weaken=Vous sentez la malédiction sur le talisman reculer lentement.
actors.buffs.ascensionchallenge.break=Vous reprenez votre souffle et sentez vos blessures commencer à guérir !
actors.buffs.ascensionchallenge.almost=Vous sentez le contrôle de l'ancien dieu sur le talisman s'affaiblir, la lueur de la victoire est devant vous !
actors.buffs.ascensionchallenge.on_kill=L'énergie sombre vous dévore...

actors.buffs.barkskin.name=Écorce
actors.buffs.barkskin.desc=Votre peau durcit, devenant rugueuse et solide comme l'écorce.\n\nLa peau durcie augmente votre armure, vous permettant de mieux résister aux attaques physiques.\n\nAugmentation actuelle de l'armure : 0~%d\nTemps restant avant dissipation : %s tours\n\nLorsque plusieurs effets d'écorce sont obtenus de différentes sources, seul le plus puissant est actif.

actors.buffs.barrier.name=Barrière arcanique
actors.buffs.barrier.desc=Une barrière d'énergie qui peut absorber tous les dégâts.\n\nTant que l'énergie de la barrière arcanique existe, elle absorbera complètement tous les dégâts subis par l'unité. Cette énergie diminue progressivement avec le temps.\n\nÉnergie du bouclier restante : %d

actors.buffs.berserk.angered=En colère
actors.buffs.berserk.berserk=Berserker
actors.buffs.berserk.exhausted=Épuisé
actors.buffs.berserk.recovering=Récupération
actors.buffs.berserk.angered_desc=Les blessures subies par le berserker augmentent sa puissance d'attaque. Le berserker accumule de la rage lorsqu'il subit des dégâts physiques, ce qui lui confère une plus grande puissance d'attaque. Les dégâts absorbés par l'armure accumulent aussi de la rage.\n\nLa rage diminue avec le temps. Plus la vie du berserker est basse, plus la rage persiste longtemps.\n\nLorsque la rage atteint 100%%, le berserker peut devenir berserk, obtenant un bouclier équivalant à 2 fois l'armure maximale du sceau. Plus la vie est basse au moment de l'activation, plus le bouclier est élevé, jusqu'à 6 fois l'armure maximale du sceau. Ce bouclier diminue avec le temps, et une fois épuisé, le berserker doit se reposer un moment avant de pouvoir accumuler de la rage à nouveau.\n\nRage actuelle : _%.0f%%_\n_+%.0f%%_ dégâts
actors.buffs.berserk.action_speed=_+%.0f%%_ vitesse d'attaque
actors.buffs.berserk.berserk_desc=La peur et l'anxiété se sont dissipées, il ne reste que la rage. Dans cet état, le berserker devient extrêmement puissant, _infligeant 50%% de dégâts supplémentaires_ et obtenant un bouclier additionnel.\n\nCe bouclier supplémentaire équivaut à 2 fois l'armure maximale du sceau du berserker. Plus la vie est basse au moment de l'activation, plus le bouclier est élevé, jusqu'à 6 fois l'armure maximale du sceau. Quand ce bouclier tombe à 0, l'état berserk prend fin.\n\nAprès la fin du berserk, le berserker doit se reposer avant de pouvoir recommencer à accumuler de la rage.
actors.buffs.berserk.recovering_desc=Le potentiel intérieur est limité. Le berserker doit se reposer suffisamment pour pouvoir libérer à nouveau sa rage.\n\nEn état de récupération, le berserker ne peut pas accumuler de rage par la douleur.
actors.buffs.berserk.recovering_desc_turns=Tours de récupération nécessaires : %d
actors.buffs.berserk.recovering_desc_levels=Niveaux de récupération nécessaires : %.2f
actors.buffs.berserk.rankings_desc=Mort en furie
actors.buffs.berserk.action_name=Berserk
actors.buffs.berserk.no_seal=Vous avez besoin d'un sceau brisé pour entrer en berserk !

actors.buffs.bleeding.name=Saignement
actors.buffs.bleeding.ondeath=Vous êtes mort d'une perte de sang excessive...
actors.buffs.bleeding.heromsg=Vous saignez !
actors.buffs.bleeding.rankings_desc=Mort par hémorragie
actors.buffs.bleeding.desc=La blessure laisse échapper un flot de sang inquiétant.\n\nLe saignement inflige des dégâts chaque tour. Les dégâts diminuent aléatoirement chaque tour jusqu'à ce que l'hémorragie s'arrête.\n\nDégâts de saignement actuels : %d

actors.buffs.bless.name=Bénédiction
actors.buffs.bless.desc=Votre concentration est décuplée, certains disent que c'est un don divin.\n\nLa bénédiction augmente votre précision et votre esquive de 15%% , rendant le béni invincible au combat.\n\nTemps restant de la bénédiction : %s tours

actors.buffs.blindness.name=Cécité
actors.buffs.blindness.heromsg=Vous êtes aveuglé !
actors.buffs.blindness.desc=La cécité plonge tout ce qui vous entoure dans les ténèbres.\n\nQuand on est aveugle, la portée de vue est réduite à une case, rendant les attaques à distance presque inutiles et faisant facilement perdre la trace des ennemis lointains. De plus, un héros aveugle ne peut pas lire les parchemins ou les livres.\n\nTemps restant de la cécité : %s tours

actors.buffs.buff.heromsg=

actors.buffs.burning.name=Brûlure
actors.buffs.burning.heromsg=Vous êtes en feu !
actors.buffs.burning.burnsup=%s a été consumé par les flammes !
actors.buffs.burning.ondeath=Vous avez brûlé vif...
actors.buffs.burning.rankings_desc=Calciné
actors.buffs.burning.desc=Rien n'est plus douloureux que d'être englouti par les flammes.\n\nLe feu inflige des dégâts chaque tour jusqu'à ce qu'il soit éteint par un liquide ou qu'il se dissipe de lui-même. Le feu s'éteint quand vous entrez dans l'eau ; briser une potion produit le même effet.\n\nDe plus, le feu enflamme tout terrain ou objet inflammable qu'il touche.\n\nTemps restant de la brûlure : %s tours

actors.buffs.championenemy.warn=Vous sentez la présence de %s ennemis d'élite.
actors.buffs.championenemy$blazing.name=Ennemi d'élite embrasé
actors.buffs.championenemy$blazing.desc=L'ennemi d'élite embrasé inflige 25%% de dégâts de mêlée supplémentaires, enflamme sa cible, est immunisé au feu et enflamme les environs à sa mort. Cependant, son feu ne peut pas se propager sur l'eau.
actors.buffs.championenemy$projecting.name=Ennemi d'élite projects
actors.buffs.championenemy$projecting.desc=L'ennemi d'élite projecteur inflige 25%% de dégâts de mêlée supplémentaires et a une portée d'attaque de mêlée augmentée d'1 case.
actors.buffs.championenemy$antimagic.name=Ennemi d'élite antimagique
actors.buffs.championenemy$antimagic.desc=L'ennemi d'élite antimagique bénéficie de 50%% de réduction de dégâts et est complètement immunisé à tous les effets magiques.
actors.buffs.championenemy$giant.name=Ennemi d'élite géant
actors.buffs.championenemy$giant.desc=L'ennemi d'élite géant bénéficie de 80%% de réduction de dégâts et d'1 case de portée d'attaque de mêlée supplémentaire, mais ne peut pas entrer dans les espaces étroits.
actors.buffs.championenemy$blessed.name=Ennemi d'élite béni
actors.buffs.championenemy$blessed.desc=L'ennemi d'élite béni a 4 fois plus de précision et d'esquive.
actors.buffs.championenemy$growing.name=Ennemi d'élite grandissant
actors.buffs.championenemy$growing.desc=L'ennemi d'élite grandissant gagne régulièrement en précision, esquive, dégâts physiques et réduction de dégâts.\n\nBonus actuel de précision/esquive/dégâts : %1$d%%\nRéduction de dégâts actuelle : %2$d%%
actors.buffs.championenemy$randomminiboss.name=Mini-boss
actors.buffs.championenemy$randomminiboss.desc=L'ancien dieu a béni au hasard une créature maléfique du donjon, la rendant plus puissante et terrifiante.\n\nLes ennemis avec cet effet voient leurs statistiques augmenter en fonction de l'étage actuel, les rendant plus difficiles à vaincre. En contrepartie, ces ennemis laissent tomber un butin plus riche.

actors.buffs.charm.name=Charme
actors.buffs.charm.heromsg=Vous êtes charmé !
actors.buffs.charm.cant_attack=Vous êtes charmé par l'ennemi ciblé, vous ne pouvez donc pas l'attaquer.
actors.buffs.charm.desc=Le charme est une magie de contrôle qui fait tomber temporairement deux ennemis mutuellement amoureux.\n\nLes unités charmées ne peuvent pas attaquer directement celui qui les a charmées, mais peuvent toujours attaquer d'autres ennemis. La douleur réveille l'unité charmée, réduisant la durée du charme.\n\nTemps restant du charme : %s tours

actors.buffs.chill.name=Refroidissement
actors.buffs.chill.freezes=%s est gelé !
actors.buffs.chill.desc=Pas encore complètement gelé, mais déjà très froid.\n\nToutes les actions de la cible refroidie sont plus lentes. Le degré de ralentissement dépend du temps de refroidissement restant. Le refroidissement le plus sévère équivaut à un effet de lenteur.\n\nTemps restant du refroidissement : %1$s tours\nRéduction de vitesse actuelle : %2$s%%

actors.buffs.combo.name=Combo
actors.buffs.combo.action_name=Combo
actors.buffs.combo.combo=Combo x%d !
actors.buffs.combo.bad_target=Votre cible doit être un ennemi à portée d'attaque.
actors.buffs.combo.prompt=Choisissez une cible d'attaque
actors.buffs.combo.desc=Le gladiateur accumule de l'élan combatif quand il touche un adversaire. Chaque attaque qui touche augmente le compteur de combo de 1, mais sans attaque pendant un certain temps, le compteur retombe à zéro. Tant que le gladiateur accumule des combos, l'armure fournie par son sceau brisé ne diminue pas.\n\nAccumuler des combos permet d'activer des techniques de combo à coup sûr ! Quand le compteur atteint 2, 4, 6, 8 et 10, différentes techniques de combo sont disponibles. Certaines techniques réinitialisent le compteur, d'autres non, mais chaque technique ne peut être utilisée qu'une fois par combo.\n\nCombo actuel : %1$d\n\nTours avant réinitialisation : %2$s
actors.buffs.combo.focus_desc=_+%1$d_ dégâts physiques\n_+%2$s%%_ précision
actors.buffs.combo.mastery_desc=La maîtrise des techniques de combat leur permet de consommer le nombre de combos correspondant au lieu de réinitialiser tous les combos, et permet d'utiliser plusieurs fois le choc et la parade dans un même combo.
actors.buffs.combo$combomove.clobber.name=Charge
actors.buffs.combo$combomove.clobber.desc=Repousse un ennemi de 2 cases sans lui infliger de dégâts, et sans pouvoir le faire tomber dans un gouffre. Augmente le compteur de combo de 1.
actors.buffs.combo$combomove.clobber.empower_desc=Repousse un ennemi de 3 cases, lui inflige _étourdissement_, et peut le faire tomber dans un gouffre_ sans lui infliger de dégâts. Augmente le compteur de combo de 1.
actors.buffs.combo$combomove.slam.name=Frappe
actors.buffs.combo$combomove.slam.desc=Inflige des dégâts équivalant à %d%% de votre défense (combo x20%%). Réinitialise le compteur de combo après utilisation.
actors.buffs.combo$combomove.slam.empower_desc=_Saute jusqu'à %1$d cases pour atteindre la cible_ et lui inflige des dégâts équivalant à %2$d%% de votre défense (combo x20%%). Réinitialise le compteur de combo après utilisation.
actors.buffs.combo$combomove.parry.name=Parade
actors.buffs.combo$combomove.parry.desc=Après utilisation, pare la première attaque subie dans le prochain tour et contre-attaque immédiatement. Si la parade n'est pas déclenchée, le compteur de combo est réinitialisé.
actors.buffs.combo$combomove.parry.empower_desc=Après utilisation, pare _toutes les attaques_ subies dans le prochain tour et contre-attaque immédiatement. Si la parade n'est pas déclenchée, le compteur de combo est réinitialisé.
actors.buffs.combo$combomove.crush.name=Balayage
actors.buffs.combo$combomove.crush.desc=Inflige %d%% de dégâts (combo x25%%) à la cible principale et la moitié des dégâts aux autres ennemis dans un rayon de 7x7. Réinitialise le compteur de combo après utilisation.
actors.buffs.combo$combomove.crush.empower_desc=_Saute jusqu'à %1$d cases pour atteindre la cible_, inflige %2$d%% de dégâts (combo x25%%) à la cible principale et la moitié aux autres ennemis dans un rayon de 7x7. Réinitialise le compteur de combo après utilisation.
actors.buffs.combo$combomove.fury.name=Déluge
actors.buffs.combo$combomove.fury.desc=Pour chaque point de combo, vous attaquez un ennemi une fois. Chaque attaque inflige 60%% de dégâts et peut déclencher les enchantements d'arme. Réinitialise le compteur de combo après utilisation.
actors.buffs.combo$combomove.fury.empower_desc=_Saute jusqu'à %d cases pour atteindre la cible_ et déclenchez autant d'attaques que votre compteur de combo actuel, chaque attaque infligeant 60%% de dégâts et pouvant déclencher des enchantements. Réinitialise le compteur de combo après utilisation.
actors.buffs.combo$combomove.clobber.mastery_desc=Repousse un ennemi de 2 cases sans infliger de dégâts, et ne peut pas le faire tomber dans l'abîme. Rend 1 point de combo.
actors.buffs.combo$combomove.clobber.mastery_empower_desc=Repousse un ennemi _de 3 cases, l'étourdit et peut le faire tomber dans l'abîme_, sans infliger de dégâts. Rend 1 point de combo.
actors.buffs.combo$combomove.slam.mastery_desc=Inflige des dégâts supplémentaires équivalant à %1$d%% de ta défense (combo actuel x20%%).
actors.buffs.combo$combomove.slam.mastery_empower_desc=_Saute jusqu'à %1$d cases pour t'approcher de la cible_ et inflige des dégâts supplémentaires équivalant à %2$d%% de ta défense (combo actuel x20%%).
actors.buffs.combo$combomove.parry.mastery_desc=Après utilisation, pare la première attaque subie au tour suivant et contre-attaque immédiatement. Si la parade n'est pas déclenchée, le combo est quand même consumé.
actors.buffs.combo$combomove.parry.mastery_empower_desc=Après utilisation, pare _toutes les attaques_ subies au tour suivant et contre-attaque immédiatement. Si la parade n'est pas déclenchée, le combo est quand même consumé.
actors.buffs.combo$combomove.crush.mastery_desc=Inflige %1$d%% de dégâts (combo actuel x25%%) à la cible principale, et la moitié des dégâts aux autres ennemis dans un rayon de 7x7.
actors.buffs.combo$combomove.crush.mastery_empower_desc=_Saute jusqu'à %1$d cases pour t'approcher de la cible_, inflige %2$d%% de dégâts (combo actuel x25%%) à la cible principale, et la moitié des dégâts aux autres ennemis dans un rayon de 7x7.
actors.buffs.combo$combomove.fury.mastery_desc=Attaque un ennemi une fois par point de combo, chaque attaque inflige 60% de dégâts et peut déclencher l'enchantement de l'arme.
actors.buffs.combo$combomove.fury.mastery_empower_desc=_Saute jusqu'à %d cases pour t'approcher de la cible_ et attaque l'ennemi autant de fois que ton combo actuel, chaque attaque infligeant 60%% de dégâts et pouvant déclencher des enchantements.

actors.buffs.corruption.name=Corruption
actors.buffs.corruption.desc=La magie de corruption envahit l'essence vitale d'une créature, tordant sa nature.\n\nLes créatures corrompues attaquent leurs anciens alliés et ignorent leurs ennemis d'antan. La corruption est également dommageable, conduisant lentement sa cible à la mort.\n\nLa corruption est permanente et ne se dissipe qu'à la mort.

actors.buffs.cripple.name=Estropié
actors.buffs.cripple.heromsg=Vous êtes estropié !
actors.buffs.cripple.desc=Vous êtes bien sûr que vos jambes ne devraient pas se plier comme ça.\n\nEstropié réduit la vitesse de déplacement de moitié ; se déplacer d'une case coûte deux tours au lieu d'un.\n\nTemps restant : %s tours

actors.buffs.daze.name=Étourdi
actors.buffs.daze.heromsg=Vous avez la tête qui tourne !
actors.buffs.daze.desc=Un bourdonnement dans les oreilles, une vision floue, le combat devient très difficile.\n\nEn état d'étourdissement, la précision et l'esquive sont réduites de 50%%, rendant les touches et les esquives bien plus difficiles.\n\nTours restants : %s

actors.buffs.degrade.name=Dégradation
actors.buffs.degrade.heromsg=Votre équipement a été temporairement affaibli !
actors.buffs.degrade.desc=Une puissante magie noire dévore la puissance que les parchemins d'amélioration ont infusée dans votre équipement !\n\nEn état de dégradation, l'équipement est considéré comme étant d'un niveau inférieur à son niveau réel. Chaque niveau au-delà de 3 subit une pénalité croissante. La description de l'objet change également en fonction de l'effet de dégradation.\n\nCependant, la dégradation n'affecte pas les prérequis de force de l'équipement, la charge des baguettes, la durabilité des armes de jet ou les artefacts.\n\nTemps restant de la dégradation : %s tours\n\nUtiliser un parchemin d'amélioration ou d'exorcisme dissipe immédiatement cette magie noire.

actors.buffs.doom.name=Condamnation
actors.buffs.doom.desc=Quand l'univers entier semble vouloir votre perte, à quoi bon continuer à lutter ?\n\nUn personnage condamné subit 17%% de dégâts supplémentaires de toutes les sources.\n\nLa condamnation est permanente et ne se dissipe qu'à la mort.

actors.buffs.dread.name=Terreur panique
actors.buffs.dread.desc=Une peur terrifiante pousse la cible à tenter de fuir le donjon.\n\nLes créatures en terreur panique fuient rapidement leurs ennemis et disparaissent dans le donjon dès qu'elles sortent de leur champ de vision. Les ennemis qui fuient ne laissent pas tomber d'objets et ne donnent que la moitié de l'expérience. La douleur des dégâts les aidera à se calmer.\n\nTemps restant de la terreur : %d tours

actors.buffs.drowsy.name=Somnolence
actors.buffs.drowsy.desc=Une force magique rend la cible incapable de rester éveillée. Après quelques tours, la cible tombera dans un sommeil magique.\n\nPour le héros, si la vie est pleine au tour où il devrait s'endormir, ou s'il subit des dégâts pendant ce processus, le sommeil magique ne prend pas effet.\n\nTours avant l'endormissement : %s tours

actors.buffs.earthimbue.name=Force de la Terre
actors.buffs.earthimbue.desc=Vous êtes imprégné de la force de la terre.\n\nJusqu'à la fin de l'effet, toutes vos attaques physiques modifieront le sol sous les pieds de vos ennemis, les estropiant pour un temps.\n\nTemps restant de la Force de la Terre : %s tours

actors.buffs.enhancedrings.name=Anneaux renforcés
actors.buffs.enhancedrings.desc=Le voleur a renforcé ses anneaux en utilisant l'artefact, leur donnant +1 niveau.\n\nTours restants : %s

actors.buffs.fireimbue.name=Force du Brasier
actors.buffs.fireimbue.desc=Vous êtes imprégné de la force des flammes.\n\nToutes les attaques physiques ont une chance d'enflammer l'ennemi. En même temps, vous êtes complètement immunisé au feu.\n\nTemps restant de la Force du Brasier : %s tours

actors.buffs.foresight.name=Préscience du danger
actors.buffs.foresight.desc=Pour une raison inconnue, votre esprit projette une carte du terrain environnant.\n\nTant que la préscience du danger est active, une large zone autour de vous sera révélée, y compris les portes cachées et les pièges.\n\nTemps restant de la préscience : %s tours

actors.buffs.frost.name=Gel
actors.buffs.frost.freezes=%s est gelé !
actors.buffs.frost.desc=À ne pas confondre avec une statue de glace, ce gel modéré enveloppe simplement la cible dans de la glace.\n\nL'effet de gel est similaire à la paralysie : la cible ne peut pas agir. Contrairement à la paralysie, le gel disparaît immédiatement quand la cible subit des dégâts, car la glace se brise.\n\nTemps restant du gel : %s tours

actors.buffs.frostimbue.name=Force du Givre
actors.buffs.frostimbue.desc=Vous êtes imprégné de la force du givre.\n\nToutes les attaques physiques accumulent un effet de refroidissement sur l'ennemi. En même temps, vous êtes complètement immunisé au froid.\n\nTemps restant de la Force du Givre : %s tours

actors.buffs.fury.name=Rage
actors.buffs.fury.heromsg=Vous êtes enragé !
actors.buffs.fury.desc=Vous êtes très en colère, et il est clair que vos ennemis ne vous aiment pas comme ça.\n\nUne rage brûlante fait rage en vous, augmentant vos dégâts d'attaque physique de 50%%.\n\nTant que votre vie reste en dessous de 50%% de son maximum, cet effet persiste.

actors.buffs.blobimmunity.name=Bouclier purificateur
actors.buffs.blobimmunity.desc=Une étrange énergie vous entoure, vous protégeant des effets environnementaux nocifs.\n\nTant que le bouclier purificateur est actif, vous êtes immunisé contre tous les effets environnementaux négatifs.\n\nTemps restant de l'immunité : %s tours

actors.buffs.gravitychaostracker.name=Chaos gravitationnel
actors.buffs.gravitychaostracker.desc_intro=Tous les quelques tours, toutes les unités de l'étage seront projetées dans une direction aléatoire.
actors.buffs.gravitychaostracker.desc_positive=Cependant, vous et vos alliés semblez y être immunisés.
actors.buffs.gravitychaostracker.desc_duration=On ne sait pas combien de temps le chaos gravitationnel va durer, mais il ne sera pas permanent.

actors.buffs.greaterhaste.name=Ombre filante
actors.buffs.greaterhaste.desc=Une vitesse si prodigieuse que tout semble s'arrêter.\n\nSous l'effet d'Ombre filante, les déplacements ne consomment aucun tour, mais les autres actions suivent leur cours normal. Chaque case parcourue consomme un tour d'Ombre filante.\n\nTours d'Ombre filante restants : %d tours

actors.buffs.haste.name=Célérité
actors.buffs.haste.desc=Une puissante énergie imprègne les muscles de vos jambes, vous permettant de vous déplacer à une vitesse incroyable.\n\nEn état de célérité, vous avez 2 fois la vitesse de déplacement, mais les autres actions restent à leur vitesse normale.\n\nTemps restant de la célérité : %s tours

actors.buffs.healing.name=Soin
actors.buffs.healing.desc=Une force curative fait se refermer vos blessures.\n\nVotre vie se régénère progressivement chaque tour jusqu'à la fin de l'effet. La quantité de soin diminue avec le temps.\n\nSoin au prochain tour : %d\n\nSoin total restant : %d

actors.buffs.herodisguise.name=Déguisement
actors.buffs.herodisguise.desc=La magie illusoire a changé votre apparence ! Bien que purement décoratif, cet effet est tout de même étrange.\n\nTemps restant du déguisement : %s tours

actors.buffs.hex.name=Malédiction
actors.buffs.hex.heromsg=Votre esprit est perturbé par la magie !
actors.buffs.hex.desc=Une magie noire qui perturbe la concentration, empêchant la cible de juger correctement des directions.\n\nL'état de malédiction réduit la précision et l'esquive de la cible de 20%%, la rendant plus vulnérable au combat.\n\nTemps restant de la malédiction : %s tours

actors.buffs.holdfast.name=Inébranlable
actors.buffs.holdfast.desc=Le guerrier tient sa position, gagnant %1$d~%2$d points d'armure et réduisant le ralentissement des combos et des boucliers de %3$d%%, jusqu'à ce qu'il bouge.

actors.buffs.hunger.hungry=Affamé
actors.buffs.hunger.dmhungry=Batterie faible
actors.buffs.hunger.starving=Extrêmement affamé
actors.buffs.hunger.dmstarving=Batterie épuisée
actors.buffs.hunger.onhungry=Vous avez un peu faim.
actors.buffs.hunger.onstarving=Vous êtes mort de faim !
actors.buffs.hunger.ondmhungry=Batterie actuellement faible.
actors.buffs.hunger.ondmstarving=Batterie actuellement insuffisante.
actors.buffs.hunger.ondeath=Vous êtes mort de faim...
actors.buffs.hunger.cursedhorn=Le cor maudit a volé une partie de l'énergie de votre nourriture pendant que vous mangiez.
actors.buffs.hunger.rankings_desc=Mort de faim
actors.buffs.hunger.desc_intro_hungry=Vous sentez votre estomac réclamer de la nourriture, mais ce n'est pas encore grave.
actors.buffs.hunger.desc_intro_starving=Votre faim est devenue mortelle.
actors.buffs.hunger.desc_intro_dmhungry=Votre batterie est faible, mais il en reste assez pour maintenir votre corps en fonctionnement normal encore un moment.
actors.buffs.hunger.desc_intro_dmstarving=Votre batterie est sérieusement insuffisante, menaçant le fonctionnement normal de votre organisme.
actors.buffs.hunger.desc=\n\nLa faim s'accumule lentement à mesure que vous passez du temps dans le donjon, jusqu'à devenir insupportable. Quand vous êtes extrêmement affamé, votre vie cesse de se régénérer et commence même à diminuer lentement.\n\nGérer votre nourriture est crucial ! Si vous avez assez de vie pour supporter la faim, attendez d'avoir plus faim pour manger. Une bonne gestion rend la nourriture bien plus efficace !
actors.buffs.hunger.dmdesc=\n\nExplorer le donjon consomme constamment votre batterie. Plus vous passez de temps, plus la batterie baisse. Quand la batterie devient insuffisante, le fonctionnement normal de votre organisme est menacé : votre vie cesse de se régénérer et commence à diminuer lentement.\n\nBien qu'il soit difficile de se recharger dans le donjon, votre système de conversion thermo-chimique miniature peut transformer la nourriture en électricité avec un rendement élevé. Bien sûr, la nourriture est aussi limitée, alors apprenez à l'utiliser sagement !

actors.buffs.invisibility.name=Invisibilité
actors.buffs.invisibility.desc=Vous ne faites plus qu'un avec le terrain environnant, devenant impossible à voir.\n\nQuand vous êtes invisible, les ennemis ne peuvent pas vous traquer ou vous attaquer. La plupart des attaques physiques et de la magie (comme les parchemins et les baguettes) dissiperont immédiatement l'invisibilité.\n\nTemps restant de l'invisibilité : %s tours

actors.buffs.invulnerability.name=Invulnérabilité
actors.buffs.invulnerability.desc=Cette unité est imprégnée d'une force d'invincibilité, obtenant un effet d'invulnérabilité temporaire.\n\nTours restants : %s tours

actors.buffs.levitation.name=Lévitation
actors.buffs.levitation.desc=Une force magique vous soulève du sol, vous faisant sentir léger comme une plume.\n\nUn personnage en lévitation peut se déplacer silencieusement et ignore tous les effets basés sur le sol. Les pièges ne se déclenchent pas, le feu ne s'éteint pas dans l'eau, la végétation n'est pas piétinée, les racines ne peuvent pas vous entraver, et les gouffres peuvent être franchis. Attention, quand l'effet se termine, ces avantages disparaissent !\n\nTemps restant de la lévitation : %s tours

actors.buffs.lifelink.name=Lien de vie
actors.buffs.lifelink.ondeath=Vous êtes mort à cause des dégâts partagés par le lien de vie...
actors.buffs.lifelink.desc=La force vitale de cette unité est liée à une autre unité proche. Les deux partagent tous les dégâts subis.\n\nChaque fois que cette unité est blessée, la moitié des dégâts est transférée à l'unité à laquelle elle est liée.\n\nTours restants du lien de vie : %s

actors.buffs.light.name=Lueur
actors.buffs.light.desc=Même dans les donjons les plus sombres, avoir une source de lumière stable près de soi est toujours réconfortant.\n\nLa lumière dissipe les ténèbres, vous permettant d'ignorer l'obscurité ambiante et d'avoir une portée de vue raisonnable.\n\nTemps restant de la lueur : %s tours

actors.buffs.lockedfloor.name=Piégé
actors.buffs.lockedfloor.desc=L'étage actuel est complètement verrouillé, vous ne pouvez pas partir.\n\nPendant le verrouillage, vous n'aurez pas plus faim et ne perdrez pas de vie à cause de la famine extrême. De plus, si vous n'êtes pas en combat contre le boss, toutes les régénérations passives sont suspendues.\n\nPar ailleurs, si vous êtes ressuscité par un bâton de renaissance non béni pendant que l'étage est verrouillé, l'effet de verrouillage sera réinitialisé.\n\nTuez le boss de l'étage pour lever le verrouillage.

actors.buffs.lostinventory.name=Inventaire perdu
actors.buffs.lostinventory.desc=Votre sac a été perdu quelque part dans le donjon !\nTant que vous n'aurez pas retrouvé votre sac, vous ne pourrez ramasser ou utiliser la plupart des objets.

actors.buffs.magicalsight.name=Vision magique
actors.buffs.magicalsight.desc=Pour une raison inconnue, même les yeux fermés, vous pouvez percevoir tout ce qui se passe autour de vous par l'esprit.\n\nQuand la vision magique est active, votre champ de vision traverse les murs et le terrain, et son rayon s'étend jusqu'à 12 cases.\n\nTemps restant de la vision magique : %s tours

actors.buffs.magicalsleep.name=Sommeil magique
actors.buffs.magicalsleep.toohealthy=Vous êtes en pleine forme, vous résistez donc à cette forte envie de dormir.
actors.buffs.magicalsleep.fallasleep=Vous sombrez profondément dans le sommeil magique.
actors.buffs.magicalsleep.wakeup=Vous vous réveillez frais et dispos, en pleine forme.
actors.buffs.magicalsleep.desc=La cible est plongée dans un sommeil magique profond et ne se réveillera pas naturellement.\n\nLe sommeil magique est fondamentalement identique au sommeil normal, mais seule une blessure réveillera la cible.\n\nPour le héros et ses alliés, le sommeil magique a des effets réparateurs, leur permettant de guérir rapidement pendant leur sommeil.

actors.buffs.magicimmune.name=Immunité magique
actors.buffs.magicimmune.desc=Aucune magie ne peut vous atteindre, vous êtes complètement immunisé à la magie.\n\nEn état d'immunité magique, tous les effets magiques, qu'ils soient bénéfiques ou nocifs, ne peuvent pas vous affecter, y compris mais sans s'y limiter : malédictions, enchantements, gravures, baguettes, parchemins, anneaux, artefacts, etc. Cependant, la capacité de l'armure du héros est assez puissante pour ne pas être affectée par cet effet et fonctionne normalement.\n\nTemps restant de l'immunité magique : %s tours

actors.buffs.mindvision.name=Vision mentale
actors.buffs.mindvision.desc=Vous pouvez voir toutes les créatures de l'étage d'une certaine manière dans votre esprit. Cette sensation est très étrange.\n\nTant que la vision mentale persiste, toutes les créatures de l'étage apparaissent dans votre champ de vision. Les créatures vues par vision mentale sont considérées comme des cibles dans votre champ de vision et peuvent être affectées par de nombreux effets magiques.\n\nTemps restant de la vision mentale : %s tours

actors.buffs.momentum.momentum=Élan accumulé
actors.buffs.momentum.running=En course
actors.buffs.momentum.resting=Repos
actors.buffs.momentum.action_name=Course
actors.buffs.momentum.momentum_desc=En se déplaçant, le coureur accumule progressivement de l'élan. Le coureur peut dépenser cet élan pour activer l'état de course.\n\nChaque point d'élan permet deux tours de course, avec un maximum de 10 points. L'élan se dissipe rapidement quand le coureur s'arrête.\n\nÉlan actuel : %d
actors.buffs.momentum.running_desc=En se déplaçant, le coureur accumule progressivement de l'élan. Le coureur peut dépenser cet élan pour activer l'état de course.\n\nEn état de course, le coureur se déplace à double vitesse et gagne de l'esquive supplémentaire basée sur son niveau.\n\nTemps restant : %d tours
actors.buffs.momentum.resting_desc=En se déplaçant, le coureur accumule progressivement de l'élan. Le coureur peut dépenser cet élan pour activer l'état de course.\n\nLe coureur a besoin de se reposer pour retrouver son souffle avant de pouvoir réaccumuler de l'élan.\n\nRepos nécessaire : %d tours.

actors.buffs.monkenergy.name=Énergie interne
actors.buffs.monkenergy.action=Art martial
actors.buffs.monkenergy.desc=Chaque fois que la moine vainc un ennemi, elle gagne de l'énergie interne utilisable pour déployer divers arts martiaux. Vaincre la plupart des ennemis ne donne qu'1 point d'énergie, et la moine ne perd pas d'énergie avec le temps.\n\nÉnergie actuelle : %1$d/%2$d
actors.buffs.monkenergy.desc_cooldown=La moine vient d'utiliser un art martial, elle doit attendre avant d'en utiliser un autre.\n\nTemps de recharge restant : %d tours
actors.buffs.monkenergy$monkability$flurry.name=Rafale de coups
actors.buffs.monkenergy$monkability$flurry.desc=Deux attaques ne consommant pas de tour, infligeant %1$d~%2$d points de dégâts chacune et ignorant l'armure. Cet art martial ne peut pas être utilisé deux fois de suite.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Deux attaques ne consommant pas de tour, infligeant %1$d~%2$d points de dégâts chacune, _peuvent déclencher l'enchantement de l'arme_ et ignorent l'armure. Si la moine vient de toucher un ennemi, cet art martial ne peut pas être utilisé deux fois de suite.
actors.buffs.monkenergy$monkability$focus.name=Concentration
actors.buffs.monkenergy$monkability$focus.desc=La moine passe un tour à entrer en état de concentration, parant la prochaine attaque reçue.
actors.buffs.monkenergy$monkability$focus.empower_desc=La moine _entre immédiatement en état de concentration_, parant la prochaine attaque reçue.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=Concentration
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=La moine est concentrée sur tout ce qui l'entoure, capable d'anticiper la prochaine attaque portée contre elle. En état de concentration, elle parera à coup sûr la prochaine attaque.
actors.buffs.monkenergy$monkability$dash.name=Nuage volant
actors.buffs.monkenergy$monkability$dash.prompt=Choisissez un emplacement
actors.buffs.monkenergy$monkability$dash.desc=Foncez immédiatement vers un emplacement à %d cases maximum. Cet art martial peut franchir les terrains dangereux mais pas traverser les ennemis ou les murs solides.
actors.buffs.monkenergy$monkability$dash.empower_desc=Foncez immédiatement vers un emplacement à _8 cases_ maximum. Cet art martial peut franchir les terrains dangereux mais pas traverser les ennemis ou les murs solides.
actors.buffs.monkenergy$monkability$dragonkick.name=Coup du dragon
actors.buffs.monkenergy$monkability$dragonkick.desc=Un coup de pied dévastateur infligeant %1$d~%2$d points de dégâts, ignorant l'armure, repoussant l'ennemi et lui infligeant une paralysie d'autant de tours que la distance de repoussement.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=Un coup de pied dévastateur infligeant _%1$d~%2$d points de dégâts_, ignorant l'armure, repoussant _toutes les cibles adjacentes_ et leur infligeant une paralysie d'autant de tours que la distance de repoussement.
actors.buffs.monkenergy$monkability$meditate.name=Méditation
actors.buffs.monkenergy$monkability$meditate.desc=La moine passe 2 tours à faire circuler son énergie interne, expulsant la plupart des effets négatifs et obtenant 8 tours de recharge pour les baguettes et artefacts.
actors.buffs.monkenergy$monkability$meditate.empower_desc=La moine passe 2 tours à faire circuler son énergie interne, expulsant la plupart des effets négatifs et obtenant 8 tours de recharge pour les baguettes et artefacts. Pendant la méditation, elle gagne aussi 10%% de résistance aux dégâts et régénère lentement 20%% de sa vie perdue.

actors.buffs.ooze.name=Mucus corrosif
actors.buffs.ooze.heromsg=Le mucus corrompt votre corps. Lavez-vous !
actors.buffs.ooze.ondeath=Vous avez été complètement dissous...
actors.buffs.ooze.rankings_desc=Dissous
actors.buffs.ooze.desc=Cette boue acide visqueuse adhère à vos os et à votre chair, les corrodant et les dissolvant lentement.\n\nLe mucus corrosif inflige des dégâts continus à la victime, mais peut être immédiatement lavé dans l'eau.\n\nTemps restant du mucus : %s tours

actors.buffs.paralysis.name=Paralysie
actors.buffs.paralysis.heromsg=Vous êtes paralysé !
actors.buffs.paralysis.out=Paralysie dissipée
actors.buffs.paralysis.desc=Le pire, c'est de ne rien pouvoir faire du tout.\n\nLa paralysie empêche toute action de la cible, la forçant à attendre que l'effet se dissipe. La douleur des blessures peut aider la cible à se libérer de la paralysie.\n\nTemps restant de la paralysie : %s tours

actors.buffs.physicalempower.name=Renforcement physique
actors.buffs.physicalempower.desc=Vos attaques sont renforcées. Les prochaines attaques physiques qui touchent un ennemi infligeront des dégâts supplémentaires.\n\nDégâts supplémentaires : %1$d\nTentatives restantes : %2$d

actors.buffs.pincushion.name=Empalé
actors.buffs.pincushion.desc=Les armes de jet que vous avez lancées sur ce personnage sont fichées dans son corps. Quand il sera vaincu, ces armes tomberont par terre.\n\nObjets fichés :

actors.buffs.poison.name=Empoisonné
actors.buffs.poison.heromsg=Vous êtes empoisonné !
actors.buffs.poison.ondeath=Vous êtes mort empoisonné...
actors.buffs.poison.rankings_desc=Mort par poison
actors.buffs.poison.desc=Le poison se répand dans tout le corps, endommageant lentement chaque organe.\n\nLes dégâts du poison chaque tour sont proportionnels au nombre de tours restants.\n\nTemps restant de l'empoisonnement : %s tours

actors.buffs.preparation.name=Phase de préparation
actors.buffs.preparation.action_name=Frappe sournoise
actors.buffs.preparation.desc=Le assassin attend patiemment dans l'ombre, prêt à porter un coup fatal.
actors.buffs.preparation.desc_dmg=Sa prochaine attaque infligera _%1$d%% de dégâts supplémentaires_ et exécutera les ennemis normaux ayant moins de _%2$d%%_ de vie, ou les boss ayant moins de _%3$d%%_ de vie.
actors.buffs.preparation.desc_dmg_likely=Ce coup a aussi plus de chances d'infliger des dégâts élevés.
actors.buffs.preparation.desc_blink=Il peut se téléporter instantanément sur l'ennemi pour l'attaquer, avec une portée de charge maximale de %d cases.
actors.buffs.preparation.desc_invis_time=L'assassin est déjà invisible depuis _%d_ tours.
actors.buffs.preparation.desc_invis_next=Ce coup deviendra plus puissant dans _%d_ tours.
actors.buffs.preparation.prompt=Choisissez une cible à attaquer.\nPortée de charge maximale : %d cases
actors.buffs.preparation.no_target=Il n'y a pas de cible attaquable ici.
actors.buffs.preparation.out_of_reach=Vous ne pouvez pas charger jusqu'à la cible.
actors.buffs.preparation.assassinated=Assassiné

actors.buffs.prismaticguard.name=Gardien prismatique
actors.buffs.prismaticguard.desc=Vous êtes protégé par un gardien prismatique actuellement invisible. Quand un ennemi apparaît, le gardien prismatique se matérialise et combat pour vous.\n\nQuand le gardien prismatique n'est pas actif, il régénère lentement tous ses dégâts subis.\n\nVie actuelle : %d/%d
actors.buffs.prismaticguard.desc_many=Cette image prismatique a été renforcée par l'Unité. Tours restants : %d

actors.buffs.recharging.name=Recharge
actors.buffs.recharging.desc=L'énergie magique circule en vous, accélérant la recharge de vos baguettes et artefacts.\n\nCet effet vous donne 0,25 point de charge supplémentaire par tour, en plus du taux de recharge normal.\n\nTemps restant de la recharge : %s tours

actors.buffs.revealedarea.name=Zone révélée
actors.buffs.revealedarea.desc=Révèle une zone du donjon dans votre champ de vision, où que vous soyez sur cet étage.\n\nTemps restant : %s tours

actors.buffs.revealedchar.name=Révélé
actors.buffs.revealedchar.desc=Cette unité a été révélée et sera visible où qu'elle soit.\n\nTemps restant : %s tours.

actors.buffs.roots.name=Enracinement
actors.buffs.roots.heromsg=Vous ne pouvez plus bouger !
actors.buffs.roots.desc=Des racines (naturelles ou magiques) se sont enroulées autour de vos pieds, vous clouant au sol.\n\nL'enracinement emprisonne la cible dans sa zone actuelle, l'empêchant de bouger ou d'utiliser la plupart des compétences de déplacement. Les autres actions ne sont pas affectées, y compris les effets de téléportation.\n\nTemps restant de l'enracinement : %s tours

actors.buffs.scrollempower.name=Autonomisation des parchemins
actors.buffs.scrollempower.desc=L'énergie générée par le mage lors de la lecture des parchemins renforce temporairement ses baguettes !\n\nRenforcement de baguette : +%1$d\nTentatives de sort restantes : %2$d

actors.buffs.shadows.name=Fusion d'ombre
actors.buffs.shadows.desc=Vous ne faites plus qu'un avec les ombres environnantes, devenant invisible et ralentissant votre métabolisme.\n\nQuand vous êtes invisible, les ennemis ne peuvent pas vous traquer ou vous attaquer. La plupart des attaques physiques et de la magie (comme les parchemins et les baguettes) dissiperont immédiatement l'invisibilité. De plus, quand vous êtes en état de fusion d'ombre, votre satiété diminue plus lentement.\n\nLa fusion d'ombre persiste jusqu'à ce que vous quittiez l'ombre ou entriez en contact direct avec un ennemi.

actors.buffs.slow.name=Lenteur
actors.buffs.slow.desc=La magie de ralentissement affecte le flux temporel de la cible : à ses yeux, tout semble se déplacer à toute vitesse.\n\nUn personnage ralenti met deux fois plus de temps pour effectuer toutes ses actions.\n\nTemps restant de la lenteur : %s tours

actors.buffs.snipersmark.name=Marque du sniper
actors.buffs.snipersmark.action_name_snapshot=Tir rapide
actors.buffs.snipersmark.action_name_volley=Rafale
actors.buffs.snipersmark.action_name_sniper=Tir de sniper
actors.buffs.snipersmark.desc=La sniper se concentre sur sa dernière cible touchée. Elle peut effectuer une attaque spéciale avec son arc, selon le type de renforcement de l'arc.\n\nUn arc non renforcé peut utiliser _Tir rapide_, un tir à faible dégâts mais ne consommant pas de tour.\n\nUn arc renforcé en vitesse peut utiliser une _Rafale_ de trois flèches. Chaque flèche inflige peu de dégâts mais peut encore déclencher des enchantements. La rafale consomme 2 tours.\n\nUn arc renforcé en dégâts peut utiliser _Tir de sniper_. Cette flèche touche à coup sûr et inflige des dégâts supplémentaires selon la distance de la cible. Le tir de sniper consomme 2 tours.\n\nTemps restant : %s tours

actors.buffs.soulmark.name=Marque des âmes
actors.buffs.soulmark.desc=Le warlock a transpercé l'âme de la cible. Quand elle subit des dégâts physiques, elle soigne le warlock.\n\nTemps restant de la marque des âmes : %s tours

actors.buffs.stamina.name=Endurance débordante
actors.buffs.stamina.desc=Vous ressentez une énergie débordante, vous permettant de vous déplacer plus vite.\n\nQuand vous êtes en état d'endurance débordante, votre vitesse de déplacement augmente de 50%%, mais cet effet n'affecte pas la durée des autres actions.\n\nTemps restant de l'endurance : %s tours

actors.buffs.vulnerable.name=Vulnérable
actors.buffs.vulnerable.heromsg=Les dégâts extérieurs vous semblent encore plus douloureux !
actors.buffs.vulnerable.desc=La magie de vulnérabilité augmente de 33%% tous les dégâts physiques reçus par la cible après réduction de l'armure.\n\nTemps restant de la vulnérabilité : %s tours

actors.buffs.terror.name=Terreur
actors.buffs.terror.desc=La terreur est une magie de contrôle qui plonge l'ennemi dans une panique incontrôlable.\n\nLes personnages terrifiés fuient leurs ennemis, essayant de mettre autant de portes et de murs que possible entre eux. Cependant, la douleur des blessures réduit la durée de la terreur.\n\nTemps restant de la terreur : %s

actors.buffs.toxicimbue.name=Force du Poison
actors.buffs.toxicimbue.desc=Vous êtes imprégné de la force du poison.\n\nQuand vous vous déplacez, du gaz toxique s'échappe de votre corps, blessant vos ennemis. Pendant la durée de l'effet, et même quelques tours après sa fin, vous êtes immunisé au gaz toxique et à l'empoisonnement.\n\nTemps restant de la Force du Poison : %s tours

actors.buffs.corrosion.name=Corrosion
actors.buffs.corrosion.heromsg=Vous êtes en train d'être dissous par un acide puissant !
actors.buffs.corrosion.ondeath=Vous avez été complètement dissous...
actors.buffs.corrosion.rankings_desc=Dissous
actors.buffs.corrosion.desc=Un acide puissant corrompt la chair, le métal et les os à une vitesse alarmante.\n\nPlus la cible est exposée longtemps à la corrosion, plus les dégâts sont élevés.\n\nTemps restant de la corrosion : %1$s tours\nDégâts de corrosion actuels : %2$d

actors.buffs.vertigo.name=Vertige
actors.buffs.vertigo.desc=Quand le monde entier tourne, marcher en ligne droite devient très difficile.\n\nQuand l'effet de vertige persiste, les déplacements de la cible vont dans une direction aléatoire au lieu de la direction souhaitée.\n\nTemps restant du vertige : %s tours

actors.buffs.wandempower.name=Baguette surchargée
actors.buffs.wandempower.desc=Vos baguettes de dégâts ont été renforcées. Les prochaines attaques infligeront des dégâts supplémentaires.\n\nDégâts supplémentaires : %1$d\nTentatives restantes : %2$d

actors.buffs.weakness.name=Faiblesse
actors.buffs.weakness.heromsg=Vous sentez votre force vous échapper !
actors.buffs.weakness.desc=Vous sentez votre équipement soudainement plus lourd.\n\nLa magie de faiblesse affaiblit la force physique du personnage, réduisant ses dégâts de 33%%.\n\nTemps restant de la faiblesse : %s tours

actors.buffs.wellfed.name=Repu
actors.buffs.wellfed.dmname=Batterie pleine
actors.buffs.wellfed.desc=Vous vous sentez très rassasié.\n\nEn état de satiété, votre satiété ne diminue pas et vous regagnez de la vie supplémentaire au fil du temps.\n\nTemps restant : %d tours
actors.buffs.wellfed.dmdesc=Votre batterie est pleine.\n\nQuand la batterie est pleine, elle ne baissera pas pendant un certain temps et vous regagnerez de la vie supplémentaire au fil du temps.\n\nTemps restant : %d tours



