actors.hero.abilities.huntress.spirithawk.short_desc=La Chasseresse invoque un _Faucon Spirituel_ pour explorer et attirer les ennemis.
actors.hero.abilities.huntress.spirithawk.desc=Invoque un faucon spirituel (100 tours, commandes gratuites). Fragile mais rapide, agile et précis. Partage la vision, immunisé au feu/poison. N'attaque que sur ordre.
