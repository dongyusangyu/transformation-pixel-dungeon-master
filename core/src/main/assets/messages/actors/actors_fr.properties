levels.minigame.extraction.overburden.name=Charge d'extraction
levels.minigame.extraction.overburden.desc=Le poids du butin réduit le bonus de vitesse conféré par l'équipement. Chaque emplacement de sac occupé ne conserve que les deux tiers du bonus de vitesse restant ; les conteneurs de sac et les gourdes ne sont pas comptés.\n\nEmplacements occupés : %d\nBonus de vitesse conservé : %d%%
levels.minigame.extraction.extractionraidrun.session_name=Contrat d'extraction
levels.minigame.extraction.extractionraidrun.session_desc=Ce contrat enregistre la session d'extraction en cours. Vous pouvez l'utiliser pour abandonner la partie, mais cela déclenchera les mêmes pertes semi-hardcore qu'une mort.
levels.minigame.extraction.extractionraidrun.missing_key=Le dispositif d'extraction ne répond pas. Vous avez besoin d'une clé de cristal supplémentaire.
levels.minigame.extraction.extractionraidrun.extract_title=Point d'extraction
levels.minigame.extraction.extractionraidrun.extract_body=Le dispositif d'extraction détecte %d clés de cristal. Évacuer maintenant et conserver le butin de cette session ?
levels.minigame.extraction.extractionraidrun.extract=Évacuer immédiatement
levels.minigame.extraction.extractionraidrun.continue_raid=Continuer la recherche
levels.minigame.extraction.extractionraidrun.success=Extraction réussie, le butin obtenu lors de cette session a été converti en objets sécurisés.
levels.minigame.extraction.extractionraidrun.success_bonus=Extraction réussie, les clés de cristal excédentaires ont été échangées contre %d pièces d'or.
levels.minigame.extraction.extractionraidrun.failure=Échec de l'extraction : %1$d lots de butin et %2$d consommables ordinaires ont été perdus.
levels.minigame.extraction.extractionraidrun.abandon_action=Abandonner l'extraction
levels.minigame.extraction.extractionraidrun.abandon_title=Abandonner cette session ?
levels.minigame.extraction.extractionraidrun.abandon_body=Ne pas quitter par le point d'extraction vous fera perdre tous les objets marqués de cette session, ainsi que 1 à 2 consommables ordinaires au hasard.
levels.minigame.extraction.extractionraidrun.abandon=Accepter les pertes
