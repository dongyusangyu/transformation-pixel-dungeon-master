actors.hero.talent.calm_dose.title=Dose Calmante
actors.hero.talent.calm_dose.desc=_+1：_Après s'être injecté une seringue, le moine dissipe immédiatement tous ses effets négatifs et gagne _3 tours de Purification Totale_.\n\n_+2：_Après s'être injecté une seringue, le moine dissipe immédiatement tous ses effets négatifs et gagne _5 tours de Purification Totale_.\n\n_+3：_Après s'être injecté une seringue, le moine dissipe immédiatement tous ses effets négatifs et gagne _8 tours de Purification Totale_.\n\n_+4：_Après s'être injecté une seringue, le moine dissipe immédiatement tous ses effets négatifs et gagne _10 tours de Purification Totale_.
