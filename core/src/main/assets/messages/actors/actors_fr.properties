actors.hero.abilities.warrior.heroicleap.name=Bond Héroïque
actors.hero.abilities.warrior.heroicleap.prompt=Choisissez où bondir
actors.hero.abilities.warrior.heroicleap.short_desc=Le Guerrier utilise _Bond Héroïque_ vers un point ciblé, sautant par-dessus tous les ennemis et terrains dangereux.
actors.hero.abilities.warrior.heroicleap.desc=Le Guerrier saute vers un point ciblé, ignorant tous les ennemis et dangers sur son passage. Il ne peut pas franchir les murs ni les obstacles solides.
actors.hero.abilities.warrior.shockwave.name=Choc Tellurique
actors.hero.abilities.warrior.shockwave.short_desc=Le Guerrier frappe le sol, déclenchant un _Choc Tellurique_ en cône. Les ennemis touchés subissent des dégâts et sont estropiés.
actors.hero.abilities.warrior.shockwave.desc=Le Guerrier frappe le sol, créant une onde de choc sur un cône de 60° / 4 cases.
actors.hero.abilities.warrior.endure.name=Endurance
actors.hero.abilities.warrior.endure$enduretracker.name=Courroux de l'Endurance
actors.hero.abilities.warrior.endure$enduretracker.desc=Le Guerrier tisse la douleur endurée en rage, déversant des dégâts supplémentaires.
actors.hero.abilities.warrior.endure.short_desc=Le Guerrier active _Endurance_ : il saute quelques tours en résistant fortement aux dégâts, puis inflige des dégâts bonus basés sur les dégâts bruts endurés.
actors.hero.abilities.warrior.endure.desc=Le Guerrier endure 3 tours, réduisant de moitié tous les dégâts subis (cette réduction s'applique avant les autres).

actors.hero.abilities.mage.elementalblast.name=Tempête Élémentaire
actors.hero.abilities.mage.elementalblast.no_staff=Vous ne pouvez pas utiliser cette capacité sans votre bâton.
actors.hero.abilities.mage.elementalblast.short_desc=Le Mage libère une _Tempête Élémentaire_ de son bâton, déferlant sur une vaste zone centrée sur lui. L'effet dépend du gantelet enchanté dans le bâton.
actors.hero.abilities.mage.elementalblast.desc=Le Mage libère une rafale de puissance magique (rayon 4), infligeant 15~25 dégâts. L'effet secondaire varie selon le gantelet enchanté.
actors.hero.abilities.mage.elementalblast.generic_desc=L'effet de Tempête Élémentaire est similaire à celui du gantelet lancé sur une cible.
actors.hero.abilities.mage.wildmagic.name=Magie Sauvage
actors.hero.abilities.mage.wildmagic.no_wands=Vous n'avez aucune baguette à utiliser !
actors.hero.abilities.mage.wildmagic.short_desc=Le Mage canalise la _Magie Sauvage_ de ses baguettes, les déchargeant aléatoirement plusieurs fois en un seul tour.
actors.hero.abilities.mage.wildmagic.desc=Le Mage canalise ses baguettes, déchargeant jusqu'à 4 aléatoirement en un tour (sans le bâton). Les baguettes sont considérées comme +2 niveaux (max 13). Les sorts coûtent 1/2 charge, 2 tirs max par baguette.
