actors.hero.talent.potential_9.desc=_+1 :\nObtient _1 parchemin de mutation_.\n\n_+2 :\nObtient _1 parchemin de mutation_.\n\n_+3 :\nSans effet.
actors.hero.talent.potential_9.comment=Ce type de talent qui donne directement des ressources par amélioration ou mutation a une limite de _26_ déclenchements (ou _39_ pour le noble).

actors.hero.talent.abyssal_gaze.title=Regard des abysses
actors.hero.talent.abyssal_gaze.desc=_+1 :\nLa correction de pénétration des dégats obtenue en canalisant un baton à travers une créature ou un terrain solide passe à _2x_.\n\n_+2 :\nEn plus du niveau 1, les _dégats du baton canalisé augmentent de 20%_.
actors.hero.talent.abyssal_gaze.comment=? Quand tu regardes l''ab?me, l''ab?me te regarde aussi. ?

actors.hero.talent.moronity.title=Crétinerie
actors.hero.talent.moronity.desc=_+1 :\nLancer un sort avec un baton ou une baguette _inflige aléatoirement 1 tour de confusion, vulnérabilité ou faiblesse_.\n\n_+2 :\nLancer un sort avec un baton ou une baguette _inflige aléatoirement 2 tours de confusion, vulnérabilité ou faiblesse_.\n\n_+3 :\nLancer un sort avec un baton ou une baguette _inflige aléatoirement 3 tours de confusion, vulnérabilité ou faiblesse_.
actors.hero.talent.moronity.comment=Ce talent inflige un des trois malus aléatoirement, pas les trois à la fois.


actors.hero.talent.journey_nature.title=Voyage naturel
actors.hero.talent.journey_nature.desc=_+1 :\nL''effet d''augmentation du taux de butin de graines du Voyage naturel _augmente de 50%_.\n\n_+2 :\nEn plus du niveau 1, la _consommation de charge_ de l''enracinement du Voyage naturel _réduit de 50%_ (sans modifier le besoin de charge à l''utilisation).
actors.hero.talent.journey_nature.comment=? Les chaussures que porte la chasseresse. ?

actors.hero.talent.love_backstab.title=Trahison amoureuse
actors.hero.talent.love_backstab.desc=_+1 :\nLes dégats contre les unités _charmées_ augmentent de _15%_.\n\n_+2 :\nLes dégats contre les unités _charmées_ augmentent de _30%_.\n\n_+3 :\nLes dégats contre les unités _charmées_ augmentent de _45%_.
actors.hero.talent.love_backstab.comment=? Premier commandement en prison : frapper d''abord la personne visée. ?


actors.hero.talent.concept_grid.title=Grille conceptuelle
actors.hero.talent.concept_grid.desc=_+1 :\nLes _dégats non-faim et non-retardés sont réduits de 1_, calculé après toutes les réductions.\n\n_+2 :\nLes _dégats non-faim et non-retardés sont réduits de 2_, calculé après toutes les réductions.\n\n_+3 :\nLes _dégats non-faim et non-retardés sont réduits de 3_, calculé après toutes les réductions.
actors.hero.talent.concept_grid.comment=

actors.hero.talent.abacus.title=Boulier
actors.hero.talent.abacus.desc=_+1 :\nLes attaques physiques ont _50% de chance_ d''ajouter _2 points de bouclier cumulable_.\n\n_+2 :\nLes attaques physiques ont _75% de chance_ d''ajouter _2 points de bouclier cumulable_.\n\n_+3 :\nLes attaques physiques _ajoutent à coup s?r 2 points de bouclier cumulable_.
actors.hero.talent.abacus.comment=

actors.hero.talent.time_sand.title=Sable du temps
actors.hero.talent.time_sand.desc=_+1 :\nLe nombre de tours que le sablier peut sauter est _doublé_.\n\n_+2 :\nEn plus du niveau 1, chaque point de charge du sablier _gèle la durée des effets autour de 1 tour supplémentaire_ (la première charge consommée n''augmente pas le nombre de tours).\n\n_+3 :\nEn plus des niveaux 1 et 2, la _vitesse de charge du sablier augmente de 20%_.
actors.hero.talent.time_sand.comment=? THE WORLD!!! ?

actors.hero.talent.damaged_core.title=C?ur endommagé
actors.hero.talent.damaged_core.desc=_+1 :\nLes attaques physiques infligent _1 dégat magique_ supplémentaire.\n\n_+2 :\nLes attaques physiques infligent _2 dégats magiques_ supplémentaires.
actors.hero.talent.damaged_core.comment=? Le poulet épicé est le meilleur du monde ! ?

actors.hero.talent.read_profitable.title=Lire est bénéfique
actors.hero.talent.read_profitable.desc=Après amélioration, chaque lecture d''un parchemin donne aléatoirement _1 effet bénéfique_.\n\n_+1 :\nL''effet aléatoire inclut _5 tours de purification totale, flottaison ou vitesse extrême_.\n\n_+2 :\nEn plus du niveau 1, inclut aussi _5 tours d''invisibilité_.\n\n_+3 :\nEn plus des niveaux 1 et 2, inclut aussi _restauration de 2.5% de la vie maximale_.
actors.hero.talent.read_profitable.comment=Ce talent peut être déclenché en lisant un livre de magie chaotique.

actors.hero.talent.strength_cloak.title=Cape renforcée
actors.hero.talent.strength_cloak.desc=_+1 :\nChaque point de charge de la cape d''ombre donne _1 tour d''esquive d''ombre_ supplémentaire.\n\n_+2 :\nChaque point de charge de la cape d''ombre donne _1.5 tour d''esquive d''ombre_ supplémentaire.\n\n_+3 :\nChaque point de charge de la cape d''ombre donne _2 tours d''esquive d''ombre_ supplémentaires, et la _vitesse de charge augmente de 20%_.
actors.hero.talent.strength_cloak.comment=

actors.hero.talent.anesthesia.title=Anesthésique
actors.hero.talent.anesthesia.desc=_+1 :\nBoire une potion donne _5 points de bouclier_ pour parer la prochaine attaque subie.\n\n_+2 :\nBoire une potion donne _8 points de bouclier_ pour parer la prochaine attaque subie.
actors.hero.talent.anesthesia.comment=? Anesthésique. ?

actors.hero.talent.wanling_potion.title=Potion universelle
actors.hero.talent.wanling_potion.desc=_+1 :\nBoire une potion donne _2 tours de purification totale_.\n\n_+2 :\nBoire une potion donne _3 tours de purification totale_.\n\n_+3 :\nBoire une potion donne _4 tours de purification totale_ et supprime tous les malus actuels du héros.
actors.hero.talent.wanling_potion.comment=? Ce n''est pas l''élixir universel qu''un certain roi déchu voulait. ?

actors.hero.talent.active_muscles.title=Muscles actifs
actors.hero.talent.active_muscles.desc=_+1 :\nMonter de niveau donne _2 points de force temporaire_.\n\n_+2 :\nMonter de niveau donne _4 points de force temporaire_.\n\n_+3 :\nMonter de niveau donne _6 points de force temporaire_.
actors.hero.talent.active_muscles.comment=Cet effet _dure 400 tours_.

actors.hero.talent.sea_wind.title=Vent des quatre mers
actors.hero.talent.sea_wind.desc=_+1 :\nLe héros a _20% de vitesse de déplacement_ dans l''eau.\n\n_+2 :\nLe héros a _40% de vitesse de déplacement_ dans l''eau.\n\n_+3 :\nLe héros a _60% de vitesse de déplacement_ dans l''eau.
actors.hero.talent.sea_wind.comment=? Le vent se lève, les nuages s''envolent. ?\n_L''Ouest et_

actors.hero.talent.endless_meal.title=Arrière-go?t infini
actors.hero.talent.endless_meal.desc=_+1 :\nManger donne _2 tours de bulle de temps_.\n\n_+2 :\nManger donne _4 tours de bulle de temps_.\n\n_+3 :\nManger donne _6 tours de bulle de temps_.
actors.hero.talent.endless_meal.comment=

actors.hero.talent.experience_meal.title=Repas expérimenté
actors.hero.talent.experience_meal.desc=_+1 :\nManger donne _2 points d''expérience_.\n\n_+2 :\nManger donne _3 points d''expérience_.
actors.hero.talent.experience_meal.comment=Ce talent partage une limite de _100_ déclenchements avec les talents _Repas nuageux_, _Repas invincible_ et _Cadeau d''anniversaire_.\n\n? Manger un morceau, manger un morceau... ?

actors.hero.talent.birthday_gift.title=Cadeau d''anniversaire
actors.hero.talent.birthday_gift.desc=_+1 :\nManger a _17% de chance_ d''obtenir _1 butin bas niveau_.\n\n_+2 :\nManger a _33% de chance_ d''obtenir _1 butin bas niveau_.\n\n_+3 :\nManger a _50% de chance_ d''obtenir _1 butin bas niveau_.
actors.hero.talent.birthday_gift.comment=Ce talent partage une limite de _100_ déclenchements avec les talents _Repas expérimenté_, _Repas nuageux_ et _Repas invincible_.\n\n? Happy Birthday! ?

actors.hero.talent.collect_plants.title=Collecte de plantes
actors.hero.talent.collect_plants.desc=_+1 :\nObtient _3 graines aléatoires_.\n\n_+2 :\nObtient _4 graines aléatoires_.\n\n_+3 :\nObtient _5 graines aléatoires_ et _1 fruit insipide_.
actors.hero.talent.collect_plants.comment=Ce type de talent qui donne directement des ressources par amélioration ou mutation a une limite de _26_ déclenchements (ou _39_ pour le noble).\n\nCe talent ne donne pas de graine de pourriture.

actors.hero.talent.sharp_head.title=Tête pointue
actors.hero.talent.sharp_head.desc=_+1 :\n_Force +3_, _précision réduite de 17%_.\n\n_+2 :\n_Force +6_, _précision réduite de 33%_.\n\n_+3 :\n_Force +9_, _précision réduite de 50%_.
actors.hero.talent.sharp_head.comment=? Je te demande. ?

actors.hero.talent.strength_armband.title=Bracelet renforcé
actors.hero.talent.strength_armband.desc=_+1 :\nLa _vitesse de charge_ du bracelet de voleur augmente de _20%_.\n\n_+2 :\nEn plus du niveau 1, la _durée des malus_ infligés par le vol à un ennemi augmente de _30%_.\n\n_+3 :\nEn plus des niveaux 1 et 2, voler un ennemi donne _3 tours de frénésie_ au héros ; la _consommation de charge_ du vol d''objet est _réduite de 1_ (minimum 1, sans modifier la probabilité de succès ni le besoin de charge à l''utilisation).
actors.hero.talent.strength_armband.comment=

actors.hero.talent.strength_book.title=Livre renforcé
#fix9：注释补充
actors.hero.talent.strength_book.desc=_+1 :\nLire un livre de magie chaotique _déclenche_ un effet de parchemin _de combat ou non-combat_ selon la présence d''ennemis dans le champ de vision.\n\n_+2 :\nEn plus du niveau 1, la _vitesse de charge_ du livre de magie chaotique augmente de _20%_.
actors.hero.talent.strength_book.comment=Comme pour le cristal chaotique, les _parchemins de combat_ incluent miroir/charge/téléportation/sommeil/fureur/vengeance/peur, tandis que les _parchemins non-combat_ incluent identification/exorcisme/charge/téléportation/sommeil/détection.\n\n? C''est ?a, le vrai livre de magie chaotique. ?

actors.hero.talent.eternal_curse.title=Malédiction éternelle
actors.hero.talent.eternal_curse.desc=_+0 :\nNécessite au moins _2 parchemins d''exorcisme_ pour retirer une malédiction.\n\n_+1 :\nUn seul _parchemin d''exorcisme_ suffit, mais l''_enchantement/gravure_ maudit est conservé.\n\n_+2 :\nUn seul parchemin suffit pour _retirer complètement la malédiction_.
actors.hero.talent.eternal_curse.comment=? Plus on a de malédictions, plus on est tranquille. ?\n_Malédiction venue du DM-216_
actors.hero.talent.eternal_curse.unremove=Nombre d''exorcismes insuffisant, impossible de retirer la malédiction.

actors.hero.talent.eater.title=Mangeur
actors.hero.talent.eater.desc=_+0 :\n_Vitesse de faim augmentée de 30%_.\n\n_+1 :\n_Vitesse de faim augmentée de 15%_.\n\n_+2 :\n_Vitesse de faim non augmentée_.
actors.hero.talent.eater.comment=? Tu m''écoutes ? Tu m''écoutes ? Tu m''écoutes ? J''ai faim. ?

actors.hero.talent.fate_decision.title=Choix du destin
actors.hero.talent.fate_decision.desc=_+0 :\nMutation : _options -2_.\n\n_+1 :\nMutation : _options -1_.\n\n_+2 :\nMutation : options inchangées.
actors.hero.talent.fate_decision.comment=? Ainsi va le destin. ?\n_Venu du ressentiment de DM-216 de ne pas pouvoir contr?ler les choix_

actors.hero.talent.endless_malice.title=Malice infinie
actors.hero.talent.endless_malice.desc=_+0 :\nRamasser un objet a _40% de chance_ de _perdre 10% de la vie maximale_.\n\n_+1 :\nRamasser un objet a _30% de chance_ de _perdre 5% de la vie maximale_.\n\n_+2 :\nRamasser un objet ne fait plus perdre de vie.
actors.hero.talent.endless_malice.comment=? Tu peux sentir la malveillance de ces objets envers leur nouveau ma?tre. ?\n_Malice venue du DM-216_
actors.hero.talent.endless_malice.kill=Vous êtes mort par une conception de jeu malveillante...
actors.hero.talent.endless_malice.rankings_desc=Tué par : conception de jeu malveillante

actors.hero.talent.feeble.title=Faible
actors.hero.talent.feeble.desc=_+0 :\n_Dégats physiques réduits de 20%_.\n\n_+1 :\n_Dégats physiques réduits de 10%_.\n\n_+2 :\nLes dégats physiques ne sont plus réduits.
actors.hero.talent.feeble.comment=? Poisson pourri — poisson pourri, attaque pourrie. ?

actors.hero.talent.malnutrition.title=Malnutrition
actors.hero.talent.malnutrition.desc=_+0 :\nEn état de _famine extrême_, chaque perte de vie due à la faim donne _10 tours de confusion et de faiblesse_.\n\n_+1 :\nEn état de _famine extrême_, chaque perte de vie due à la faim donne _10 tours de faiblesse_.\n\n_+2 :\nEn état de famine extrême, aucun malus supplémentaire n''est subi.
actors.hero.talent.malnutrition.comment=? Remède : Menu KFC x1, total : 50. ?

actors.hero.talent.shortsighted.title=Vue courte
actors.hero.talent.shortsighted.desc=_+0 :\n_Champ de vision réduit de 40%_.\n\n_+1 :\n_Champ de vision réduit de 20%_.\n\n_+2 :\nLe champ de vision n''est plus réduit.
actors.hero.talent.shortsighted.comment=

actors.hero.talent.bat_serum.title=Sérum de chauve-souris
actors.hero.talent.bat_serum.desc=_+0 :\nLes ennemis obtiennent _40% de vol de vie_ sur leurs attaques de mêlée.\n\n_+1 :\nLes ennemis obtiennent _20% de vol de vie_ sur leurs attaques de mêlée.\n\n_+2 :\nLes ennemis n''obtiennent plus de vol de vie supplémentaire.
actors.hero.talent.bat_serum.comment=? Manger la chair de héros avec appétit, rire et boire le sang des vampires. ?

actors.hero.talent.myopia.title=Myopie
actors.hero.talent.myopia.desc=_+0 :\n_Précision réduite de 40%_.\n\n_+1 :\n_Précision réduite de 20%_.\n\n_+2 :\nLa précision n''est plus réduite.
actors.hero.talent.myopia.comment=

actors.hero.talent.land_swimming.title=Nage terrestre
actors.hero.talent.land_swimming.desc=_+0 :\nLes piranhas géants et piranhas fant?mes sont _remplacés_ par des piranhas géants terrestres et piranhas fant?mes terrestres, avec les mêmes attributs.\n\n_+1 :\nLa _vitesse de déplacement_ des piranhas géants et fant?mes terrestres _réduite de 50%_.\n\n_+2 :\nLes piranhas géants et fant?mes ne sont plus remplacés ; les piranhas géants terrestres et fant?mes terrestres sur la terre ferme _meurent immédiatement_.
actors.hero.talent.land_swimming.comment=? Le ma?tre dit au bord de la rivière : ''Ainsi passe le temps''. ?\n—— Mais dit-on en amont de la rivière, ceux qui sont mordus par les piranhas sont aussi innombrables que l''eau du fleuve

actors.hero.talent.jiulongla_coffin.title=Cercueil de Jiulongla
actors.hero.talent.jiulongla_coffin.desc=_+0 :\n_Réduit la vie maximale_ du héros de _40%_.\n\n_+1 :\n_Réduit la vie maximale_ du héros de _20%_.\n\n_+2 :\nNe réduit plus la vie maximale du héros.
actors.hero.talent.jiulongla_coffin.comment=? Des rumeurs viennent du donjon : un héros du donjon mangeait trop, au niveau 30 il avait déjà des rations complètes, et fut finalement tué par le rayon du dieu ancien. ?

actors.hero.talent.cowboy.title=Commerce déloyal
#fix9：补充注释
actors.hero.talent.cowboy.desc=_+0 :\nAcheter un objet a _30% de chance_ d''être _remplacé par une pierre_.\n\n_+1 :\nAcheter un objet a _15% de chance_ d''être _remplacé par une pierre_.\n\n_+2 :\nLes objets achetés ne sont plus remplacés par des pierres.
actors.hero.talent.cowboy.comment=Note : les paquets (tube de parchemin, sacoche de potion, étui à baguette) sont aussi inclus.\n\n? Les bénéfices de ce projet sont tous destinés à l''achat de rations. ?\n—— Kèzé l''affamé

actors.hero.talent.mamba_out.title=Hommage au prisonnier
actors.hero.talent.mamba_out.desc=_+0 :\nQuand le héros tombe dans un gouffre, il subit en plus des _dégats retardés_ de _10% de la vie maximale_.\n\n_+1 :\nQuand le héros tombe dans un gouffre, il subit en plus des _dégats retardés_ de _5% de la vie maximale_.\n\n_+2 :\nTomber dans un gouffre n''inflige plus de dégats retardés supplémentaires.
actors.hero.talent.mamba_out.comment=? Doucement ! Qui je découpe ! Mamba Out ! ?

actors.hero.talent.explosion_meal.title=Manger jusqu''à exploser
actors.hero.talent.explosion_meal.desc=_+0 :\nManger a _20% de chance_ d''_exploser_.\n\n_+1 :\nManger a _10% de chance_ d''_exploser_.\n\n_+2 :\nManger n''explose plus.
actors.hero.talent.explosion_meal.comment=? Tu es le roi de la bombe. ?\n—— Kèzé

actors.hero.talent.handon_ground.title=Tête au sol
actors.hero.talent.handon_ground.desc=_+0 :\nQuand l''_état de flottaison_ se termine, subir un _saignement_ de base égal à _10% de la vie actuelle_.\n\n_+1 :\nQuand l''_état de flottaison_ se termine, subir un _saignement_ de base égal à _10% de la vie actuelle_.\n\n_+2 :\nLa fin de la flottaison n''inflige plus de saignement.
actors.hero.talent.handon_ground.comment=? Il faut faire attention à la sécurité à l''atterrissage... ?\n? ?a marche super bien avec ''Voler de plaisir'' ! ?\n—— Kèzé

actors.hero.talent.chill_water.title=Boire de travers
actors.hero.talent.chill_water.desc=_+0 :\nBoire de la rosée ou une potion a _30% de chance_ de donner l''effet _gel_.\n\n_+1 :\nBoire de la rosée a _15% de chance_ de donner l''effet _gel_ ; boire une potion ne gèle plus.\n\n_+2 :\nBoire de la rosée ou une potion ne donne plus l''effet de gel.
actors.hero.talent.chill_water.comment=? Pas de chance, boire de l''eau donne le hoquet. ?\n? Enfin, ?a n''affecte pas vraiment le jeu ?—— Murmure de Kèzé

actors.hero.talent.life_sport.title=La vie, c''est le mouvement
#fix9：注释补充
actors.hero.talent.life_sport.desc=_+0 :\nAttendre inflige _2 points de dégats_.\n\n_+1 :\nAttendre inflige _1 point de dégats_.\n\n_+2 :\nAttendre n''inflige plus de dégats.
actors.hero.talent.life_sport.comment=Attendre longtemps pour dormir n''applique les dégats qu''une fois.
actors.hero.talent.life_sport.kill=Faire du sport est bon pour la santé...
actors.hero.talent.life_sport.rankings_desc=Tué par : trop paresseux

actors.hero.talent.weaken_chalice.title=Calice affaibli
actors.hero.talent.weaken_chalice.desc=_+0 :\nLes _dégats du sacrifice du Calice de sang augmentent de 100%_.\n\n_+1 :\nLes _dégats du sacrifice du Calice de sang augmentent de 50%_.\n\n_+2 :\nLes dégats du sacrifice du Calice de sang restent inchangés.
actors.hero.talent.weaken_chalice.comment=? Le calice ne sert que de trophée, pas vrai ? ?

actors.hero.talent.extreme_casting.title=Incantation extrême
actors.hero.talent.extreme_casting.desc=_+1 :\nLa _vitesse de charge_ des batons et baguettes _réduite de 10%_, mais les _dégats des sorts augmentent de 20%_.\n\n_+2 :\nLa _vitesse de charge_ des batons et baguettes _réduite de 20%_, mais les _dégats des sorts augmentent de 40%_.\n\n_+3 :\nLa _vitesse de charge_ des batons et baguettes _réduite de 30%_, mais les _dégats des sorts augmentent de 60%_.
actors.hero.talent.extreme_casting.comment=? Explosion! ?\n_Givre_

actors.hero.talent.precise_shot.title=Tir de précision
actors.hero.talent.precise_shot.desc=_+1 :\nUtiliser une arme de jet contre un ennemi à _3 cases ou plus_ donne _10%_ de bonus de précision et de dégats.\n\n_+2 :\nUtiliser une arme de jet contre un ennemi à _3 cases ou plus_ donne _20%_ de bonus de précision et de dégats.\n\n_+3 :\nUtiliser une arme de jet contre un ennemi à _3 cases ou plus_ donne _30%_ de bonus de précision et de dégats.
actors.hero.talent.precise_shot.comment=Les héros avec un arc spirituel ou une arme de jet spéciale bénéficient aussi de ce talent.

actors.hero.talent.exploration_intuition.title=Intuition d''exploration
actors.hero.talent.exploration_intuition.desc=_+1 :\nVotre _détection passive_ des portes et pièges cachés _augmente de 50%_.\n\n_+2 :\nVotre _détection passive_ des portes et pièges cachés _augmente de 100%_.
actors.hero.talent.exploration_intuition.comment=? Laissez-moi voir ! ?

actors.hero.talent.fudi_chouxin.title=Coup au c?ur
actors.hero.talent.fudi_chouxin.desc=_+1 :\nLes attaques physiques ont _25% de chance_ d''infliger _2 tours de faiblesse_.\n\n_+2 :\nLes attaques physiques ont _50% de chance_ d''infliger _2 tours de faiblesse_.
actors.hero.talent.fudi_chouxin.comment=? Neutralisation. ?

actors.hero.talent.poison_inbody.title=Poison interne
actors.hero.talent.poison_inbody.desc=_+1 :\nPour _chaque malus_ sur vous, les _dégats physiques augmentent de 10%_.\n\n_+2 :\nPour _chaque malus_ sur vous, les _dégats physiques augmentent de 20%_.
actors.hero.talent.poison_inbody.comment=? Toujours un bon héros ? ?

actors.hero.talent.treasure_sense.title=Flair du trésor
actors.hero.talent.treasure_sense.desc=_+1 :\nEn entrant dans un nouvel étage, _17% de chance_ de _révéler_ toutes les positions des objets.\n\n_+2 :\nEn entrant dans un nouvel étage, _33% de chance_ de _révéler_ toutes les positions des objets.\n\n_+3 :\nEn entrant dans un nouvel étage, _50% de chance_ de _révéler_ toutes les positions des objets.
actors.hero.talent.treasure_sense.comment=? Je t''ai vu. ?

actors.hero.talent.seed_recycling.title=Recyclage de graines
actors.hero.talent.seed_recycling.desc=_+1 :\nQuand une plante est piétinée, _20% de chance_ de _laisser tomber sa graine_.\n\n_+2 :\nQuand une plante est piétinée, _40% de chance_ de _laisser tomber sa graine_.
actors.hero.talent.seed_recycling.comment=Ce talent n''affecte pas le butin normal des graines de pourriture.\n\n? Quand les cycles se renouvellent, toute chose re?oit la nourriture. ?\n_Givre_

actors.hero.talent.hedonism.title=Hédonisme
actors.hero.talent.hedonism.desc=_+1 :\nSi le héros n''est pas en état de _faim ou de famine extrême_, les _dégats infligés augmentent de 2 points_, calculé avant tous les autres bonus de dégats.\n\n_+2 :\nSi le héros n''est pas en état de _faim ou de famine extrême_, les _dégats infligés augmentent de 4 points_, calculé avant tous les autres bonus de dégats.
actors.hero.talent.hedonism.comment=? Un moment de plaisir, une vie d''erreur. ?

actors.hero.talent.beyond_limit.title=Dépasser les limites
actors.hero.talent.beyond_limit.desc=_+1 :\nMonter de niveau donne _20 tours de vitesse extrême et frénésie_.\n\n_+2 :\nMonter de niveau donne _40 tours de vitesse extrême et frénésie_.\n\n_+3 :\nMonter de niveau donne _60 tours de vitesse extrême et frénésie_.
actors.hero.talent.beyond_limit.comment=

actors.hero.talent.healthy_food.title=Nourriture saine
actors.hero.talent.healthy_food.desc=_+1 :\nManger donne _2 tours de purification totale_.\n\n_+2 :\nManger donne _3 tours de purification totale_.\n\n_+3 :\nManger donne _4 tours de purification totale_.
actors.hero.talent.healthy_food.comment=? Finis cette galette, et te voilà un homme. ?

actors.hero.talent.mental_collapse.title=Effondrement mental
actors.hero.talent.mental_collapse.desc=_+0 :\nLes attaques physiques contre les ennemis ont _20% de chance_ de subir _50% de dégats en retour_.\n\n_+1 :\nLes attaques physiques contre les ennemis ont _10% de chance_ de subir _50% de dégats en retour_.\n\n_+2 :\nLes attaques physiques n''ont plus de dégats en retour.
actors.hero.talent.mental_collapse.comment=? Qui m''a tué ? ?\n? Et moi, qui ai-je tué ?! ?

actors.hero.talent.unavoidable.title=Inévitable
actors.hero.talent.unavoidable.desc=_+0 :\nLes dégats subis sont au minimum de _10% de la vie maximale_.\n\n_+1 :\nLes dégats subis sont au minimum de _5% de la vie maximale_.\n\n_+2 :\nIl n''y a plus de minimum de dégats subis.
actors.hero.talent.unavoidable.comment=

actors.hero.talent.parasitism.title=Parasitisme
actors.hero.talent.parasitism.desc=_+0 :\nQuand un ennemi meurt, _20% de chance_ de générer _1 larve du dieu ancien_.\n\n_+1 :\nQuand un ennemi meurt, _10% de chance_ de générer _1 larve du dieu ancien_.\n\n_+2 :\nLes ennemis ne génèrent plus de larves à leur mort.
actors.hero.talent.parasitism.comment=Les larves générées par ce talent négatif sont toujours affectées par ce même talent négatif.\n\n? Le donjon est si sale... c''est normal d''avoir quelques parasites, non ? (Choisir le parasitisme dans les égouts peut grandement améliorer l''expérience de jeu !) ?\n_Venant de la malice ultime de Kèzé_

actors.hero.talent.dump_truck.title=Camion-benne
actors.hero.talent.dump_truck.desc=_+0 :\nLes ennemis avec l''attribut _géant_ voient leurs _dégats augmentés de 100%_ et leur _vitesse de déplacement augmentée de 100%_.\n\n_+1 :\nLes ennemis avec l''attribut _géant_ voient leurs _dégats augmentés de 50%_ et leur _vitesse de déplacement augmentée de 50%_.\n\n_+2 :\nLes ennemis géants n''ont plus d''augmentation de dégats ni de vitesse.
actors.hero.talent.dump_truck.comment=_Ennemis géants_ : DM-200, DM-201, DM-300, golems, poing rouillé, golems dorés et ennemis d''élite géants.\n\n? Directement un camion à trois essieux ! ?

actors.hero.talent.burnout_champion.title=Champion du burn-out
actors.hero.talent.burnout_champion.desc=_+0 :\nSe déplacer a _4% de chance_ de donner _3 tours de br?lure_.\n\n_+1 :\nSe déplacer a _2% de chance_ de donner _3 tours de br?lure_.\n\n_+2 :\nSe déplacer n''a plus de risque d''auto-combustion.
actors.hero.talent.burnout_champion.comment=? C''est le rocher de Luojia à 4 heures du matin que Kobe voulait voir. ?

actors.hero.talent.photophoby.title=Photophobie
actors.hero.talent.photophoby.desc=_+0 :\nEn _état de lueur_, la _précision et les dégats baissent de 40%_.\n\n_+1 :\nEn _état de lueur_, la _précision et les dégats baissent de 20%_.\n\n_+2 :\nLa précision et les dégats ne baissent plus en état de lueur.
actors.hero.talent.photophoby.comment=

actors.hero.talent.outcontrol_magic.title=Magie incontr?lée
actors.hero.talent.outcontrol_magic.desc=_+0 :\nLancer un sort avec un baton ou une baguette a _40% de chance_ de vous faire _exploser_.\n\n_+1 :\nLancer un sort avec un baton ou une baguette a _20% de chance_ de vous faire _exploser_.\n\n_+2 :\nLancer un sort avec un baton ou une baguette ne vous fait plus exploser.
actors.hero.talent.outcontrol_magic.comment=? La magie de Lu Yisi. ?

actors.hero.talent.winter_swimming.title=Nage d''hiver
actors.hero.talent.winter_swimming.desc=_+0 :\nSe déplacer dans l''eau a _10% de chance_ de donner _3 tours de gel_.\n\n_+1 :\nSe déplacer dans l''eau a _5% de chance_ de donner _3 tours de gel_.\n\n_+2 :\nSe déplacer dans l''eau ne donne plus l''effet de gel.
actors.hero.talent.winter_swimming.comment=? Un talent Kèzé inoffensif. ?\n—— Kèzé

actors.hero.talent.fire_wood.title=Bois sec en feu
actors.hero.talent.fire_wood.desc=_+0 :\nAttaquer un ennemi a _10% de chance_ de charmer les deux camps pendant 10 tours et d''enflammer les deux camps pendant 5 tours.\n\n_+1 :\nAttaquer un ennemi a _5% de chance_ de charmer les deux camps pendant 10 tours et d''enflammer les deux camps pendant 5 tours.\n\n_+2 :\nAttaquer un ennemi ne fait plus ressentir à personne l''amour du feu.
actors.hero.talent.fire_wood.comment=? Nous tourbillonnons toute la nuit jusqu''à sombrer dans les flammes. ?\n? Les enfants qui choisissent le bois sec se feront br?ler leurs parchemins de mutation — Kèzé ricane ?

actors.hero.talent.be_inconstant.title=Changeant
actors.hero.talent.be_inconstant.desc=_+0 :\nRamasser une arme a _20% de chance_ de l''_équiper immédiatement_.\n\n_+1 :\nRamasser une arme a _10% de chance_ de l''_équiper immédiatement_.\n\n_+2 :\nRamasser une arme ne l''équipe plus immédiatement.
actors.hero.talent.be_inconstant.comment=

actors.hero.talent.unbear_hunger.title=Faim insoutenable
actors.hero.talent.unbear_hunger.desc=_+0 :\nLes _dégats de faim_ subis _augmentent de 100%_.\n\n_+1 :\nLes _dégats de faim_ subis _augmentent de 50%_.\n\n_+2 :\nLes dégats de faim n''augmentent plus.
actors.hero.talent.unbear_hunger.comment=

actors.hero.talent.vip_meal.title=Restaurant VIP
actors.hero.talent.vip_meal.desc=_+0 :\nManger dépense _20%_ de l''or actuel.\n\n_+1 :\nManger dépense _10%_ de l''or actuel.\n\n_+2 :\nManger ne co?te plus d''or.
actors.hero.talent.vip_meal.comment=? Le héros a trois désirs : manger, explorer, chercher des trésors. ?

actors.hero.talent.fast_die.title=Mourir vite
actors.hero.talent.fast_die.desc=_+0 :\nChaque chargement de sauvegarde _réduit la vie maximale de 20%_.\n\n_+1 :\nChaque chargement de sauvegarde _réduit la vie maximale de 10%_.\n\n_+2 :\nCharger une sauvegarde ne réduit plus la vie.
actors.hero.talent.fast_die.comment=Ce talent ne peut pas tuer le héros, mais ne laisse au minimum que 1 point de vie.\n\nNote : après avoir obtenu l''Amulette de Yendor, l''écran de fin de jeu se charge automatiquement une fois, ce qui réduit la vie.\n\n? Donc j''ai mis fin à cette sauvegarde moi-même ! ?\n? Toi, tu ne penses qu''à jouer à d''autres jeux ! ?

actors.hero.talent.wash_hand.title=Se laver les mains
actors.hero.talent.wash_hand.desc=_+0 :\nCollecter de la rosée a _20% de chance_ d''être _empoisonné 3 tours_.\n\n_+1 :\nCollecter de la rosée a _10% de chance_ d''être _empoisonné 3 tours_.\n\n_+2 :\nCollecter de la rosée n''empoisonne plus.
actors.hero.talent.wash_hand.comment=? Pourquoi l''eau du robinet est-elle si sale, alors que les pommes lavées à l''eau du robinet peuvent être mangées directement ? ?\n—— Talent Kèzé de base

actors.hero.talent.thorns_sprang.title=Buisson d''épines
actors.hero.talent.thorns_sprang.desc=_+0 :\nFouler les hautes herbes a _20% de chance_ d''infliger un _saignement_ de base _1_.\n\n_+1 :\nFouler les hautes herbes a _10% de chance_ d''infliger un _saignement_ de base _1_.\n\n_+2 :\nFouler les hautes herbes ne provoque plus de saignement.
actors.hero.talent.thorns_sprang.comment=? Les conséquences de marcher dans les buissons sans chaussures. ?\n—— Talent Kèzé attentionné

actors.hero.talent.fullpassion.title=Pleine passion
actors.hero.talent.fullpassion.desc=_+0 :\nLes _dégats sournois_ de tous les mimes _augmentent de 60%_ et leur _vitesse de déplacement est doublée_.\n\n_+1 :\nLes _dégats sournois_ de tous les mimes _augmentent de 30%_ et leur _vitesse de déplacement est 1.5x_.\n\n_+2 :\nLes dégats sournois et la vitesse des mimes reviennent à la normale.
actors.hero.talent.fullpassion.comment=? Qui ose encore jouer au casino ? ?\n_Passion venue du DM-216_

actors.hero.talent.fullfighting.title=Ardeur combative
actors.hero.talent.fullfighting.desc=_+0 :\nTuer un ennemi a _60% de chance_ de _réveiller tous les ennemis de l''étage_.\n\n_+1 :\nTuer un ennemi a _30% de chance_ de _réveiller tous les ennemis de l''étage_.\n\n_+2 :\nTuer un ennemi ne réveille plus tout l''étage.
actors.hero.talent.fullfighting.comment=

actors.hero.talent.phaseclaw.title=Griffes dimensionnelles
actors.hero.talent.phaseclaw.desc=_+0 :\nLes ennemis ont _une portée d''attaque +1_ et leurs attaques ont _10% de chance_ d''infliger _3 tours de vulnérabilité_.\n\n_+1 :\nLes ennemis ont _une portée d''attaque +1_.\n\n_+2 :\nLa portée d''attaque des ennemis n''augmente plus.
actors.hero.talent.phaseclaw.comment=

actors.hero.talent.backfired.title=Contre-productif
actors.hero.talent.backfired.desc=_+1 :\nBoire une potion de feu liquide donne _5 tours de pouvoir de flamme_.\n\n_+2 :\nBoire une potion de feu liquide donne _8 tours de pouvoir de flamme_.
actors.hero.talent.backfired.comment=? Quand il fait froid, il faut boire chaud ! ?\n_Givre_

actors.hero.talent.goldofbook.title=L''or dans les livres
actors.hero.talent.goldofbook.desc=_+1 :\nLire un parchemin donne _50 pièces d''or_.\n\n_+2 :\nLire un parchemin donne _100 pièces d''or_.
actors.hero.talent.goldofbook.comment=Ce talent peut être déclenché en lisant un livre de magie chaotique.\n\n? Je pensais que ''la maison d''or est dans le livre'' était une citation motivante... ?

actors.hero.talent.extreme_reaction.title=Réaction extrême
actors.hero.talent.extreme_reaction.desc=_+1 :\nEsquiver une attaque physique ennemie donne _1 tour de frénésie_.\n\n_+2 :\nEsquiver une attaque physique ennemie donne _2 tours de frénésie_.\n\n_+3 :\nEsquiver une attaque physique ennemie donne _3 tours de frénésie_.
actors.hero.talent.extreme_reaction.comment=Quand la durée actuelle de la frénésie du héros dépasse 5 tours, ce talent cesse d''en ajouter.

actors.hero.talent.deep_fear.title=Peur profonde
actors.hero.talent.deep_fear.desc=_+0 :\nEn progressant dans les étages, la _vie maximale_ du héros diminue de _3x_ le nombre d''étages atteints.\n\n_+1 :\nEn progressant dans les étages, la _vie maximale_ du héros diminue de _2x_ le nombre d''étages atteints.\n\n_+2 :\nLa vie maximale du héros ne diminue plus avec la profondeur.
actors.hero.talent.deep_fear.comment=? Un vrai héros descend 100 étages ! (En fait, il n''y a même pas 100 étages) ?\n_Peur implantée par DM-216_

actors.hero.talent.no_door.title=Il n''y a pas de porte
actors.hero.talent.no_door.desc=_+0 :\nLa probabilité qu''une porte normale soit _remplacée par une porte cachée est multipliée par 2_.\n\n_+1 :\nLa probabilité qu''une porte normale soit _remplacée par une porte cachée est multipliée par 1.5_.\n\n_+2 :\nLa probabilité de remplacement des portes n''augmente plus.
actors.hero.talent.no_door.comment=

actors.hero.talent.updraft.title=Courant ascendant
actors.hero.talent.updraft.desc=_+0 :\nEn _état de brûlure_, gagnez un nombre _équivalent de tours de flottement_ ; en _flottement_, gagnez un nombre _équivalent de tours de brûlure_.\n\n_+1 :\nEn _état de brûlure_, gagnez un nombre _équivalent de tours de flottement_ ; le flottement ne déclenche plus la brûlure.\n\n_+2 :\nLa brûlure et le flottement ne s''infligent plus mutuellement.\n
actors.hero.talent.updraft.comment=Les effets de flottement et de brûlure obtenus via ce talent négatif ne s''accumulent pas avec eux-mêmes.\n

actors.hero.talent.quantum_hacking.title=Piratage quantique
actors.hero.talent.quantum_hacking.desc=_+1 :\nLancer un sort avec un _bâton ou une baguette_ et toucher la cible lui inflige _1 tour d''étourdissement_.\n\n_+2 :\nLancer un sort avec un _bâton ou une baguette_ et toucher la cible lui inflige _2 tours d''étourdissement_.
actors.hero.talent.quantum_hacking.comment=« La recherche en magie est restée bloquée longtemps, jusqu''à ce qu''on essaie d''envahir le cerveau des êtres vivants avec de l''énergie magique. »

actors.hero.talent.cicada_dance.title=Danse de la cigale
actors.hero.talent.cicada_dance.desc=_+1 :\nTuer un ennemi par _attaque physique_ confère _2 tours d''invisibilité_.\n\n_+2 :\nTuer un ennemi par _attaque physique_ confère _3 tours d''invisibilité_.\n\n_+3 :\nTuer un ennemi par _attaque physique_ confère _4 tours d''invisibilité_.
actors.hero.talent.cicada_dance.comment=

actors.hero.talent.chocolate_coins.title=Pièces en chocolat
actors.hero.talent.chocolate_coins.desc=_+1 :\n_75%_ des pièces d''or lootées sur les monstres sont _remplacées par des pièces en chocolat_.\n\n_+2 :\n_45%_ des pièces d''or lootées sur les monstres sont _remplacées par des pièces en chocolat_.\n\n_+3 :\n_20%_ des pièces d''or lootées sur les monstres sont _remplacées par des pièces en chocolat_.
actors.hero.talent.chocolate_coins.comment=“C'est probablement le mauvais goût d'un sorcier, mais ces pièces sont comestibles.”

actors.hero.talent.ghost_gift.title=Cadeau spectral
actors.hero.talent.ghost_gift.desc=_+1 :\nAprès avoir choisi la _récompense d''armure_ du fant?me triste, _75% de chance_ d''obtenir _aussi la récompense d''arme_.\n\n_+2 :\nAprès avoir choisi la _récompense d''armure_ du fant?me triste, _obtient à coup s?r_ aussi la _récompense d''arme_.
actors.hero.talent.ghost_gift.comment=Choisir la récompense d''arme rend ce talent inactif.\n? Fant?mette, tu es ma meilleure amie. ?

actors.hero.talent.personal_attack.title=Attaque personnelle
actors.hero.talent.personal_attack.desc=_+1 :\nLire un _parchemin de rage_ inflige _5 tours de vulnérabilité_ aux ennemis affectés.\n\n_+2 :\nLire un _parchemin de rage_ inflige _5 tours de vulnérabilité_ et _5 tours de faiblesse_ aux ennemis affectés.
actors.hero.talent.personal_attack.comment=Améliorer ce talent donne _1 parchemin de rage_ supplémentaire, et ce talent peut être déclenché en lisant un livre de magie chaotique contenant un parchemin de rage.\nCes talents qui octroient directement des ressources via l''amélioration ou la métamorphose partagent une _limite de 26 déclenchements_ (39 pour le Chevalier).\n? Pourquoi tu cries si fort ? ?

actors.hero.talent.shoot_satellite.title=Tir anti-satellite
actors.hero.talent.shoot_satellite.desc=_+1 :\nLes _dégats_ contre les ennemis en _état de vol_ sont _augmentés de 20%_.\n\n_+2 :\nLes _dégats_ contre les ennemis en _état de vol_ sont _augmentés de 30%_.
actors.hero.talent.shoot_satellite.comment=Si vous utilisez une _pierre_ contre un ennemi en _état de vol_, les _dégats sont doublés_.\nLes ennemis normalement en _état de vol_ incluent : abeille dorée, esprit vengeur, esprit de cha?ne, méduse, élémentaire de feu nouveau-né, chauve-souris vampire, esprit de cristal, élémentaire de flamme, élémentaire de givre, élémentaire d''éclair, élémentaire du chaos, démon, grand démon et élémentaire doré. Vous pouvez aussi donner l''effet _flottement_ à n''importe quel ennemi pour déclencher ce talent.\n? Histoire du donjon : ''Grand-père le guerrier écrase le dieu antique avec trois pierres +20''. ?

actors.hero.talent.holy_faith.title=Foi sacrée
actors.hero.talent.holy_faith.desc=_+1 :\nQuand le héros obtient l''effet _lueur_, il gagne _5 tours d''augure et de recharge de baton_ supplémentaires.\n\n_+2 :\nQuand le héros obtient l''effet _lueur_, il gagne _7 tours d''augure et de recharge de baton_ supplémentaires.\n\n_+3 :\nQuand le héros obtient l''effet _lueur_, il gagne _9 tours d''augure, de recharge de baton_ et _4 tours de recharge de relique_ supplémentaires.
actors.hero.talent.holy_faith.comment=

actors.hero.talent.honey_fish.title=Pot de poisson au miel
actors.hero.talent.honey_fish.desc=_+1 :\nLancer un pot de miel crée de l''eau sur place et génère un _poisson prédateur géant_ qui remplace l''abeille dorée. Le poisson prédateur géant gagne _50 tours de frénésie_.\n\n_+2 :\nEn plus des effets de +1, l''emplacement du pot de miel brisé déclenche _une fois_ l''effet d''_explosion aqueuse_.
actors.hero.talent.honey_fish.comment=Le poisson prédateur géant généré par ce talent peut aussi être remplacé par un _poisson prédateur fant?me_, et les deux sont affectés par le talent négatif _nage terrestre_.\n? Un bocal à poisson bleu opaque. ?

actors.hero.talent.instant_refining.title=Affinage instantané
actors.hero.talent.instant_refining.desc=_+1 :\nQuand un ennemi meurt, le héros a _40% de chance_ de gagner _1 point d''énergie de transmutation_.\n\n_+2 :\nQuand un ennemi meurt, le héros a _60% de chance_ de gagner _1 point d''énergie de transmutation_.
actors.hero.talent.instant_refining.comment=Ce butin est également limité par le niveau du héros.\n? Attrape-le, affinage instantané ! ?

actors.hero.talent.changqi_bookstore.title=Librairie Changqi
actors.hero.talent.changqi_bookstore.desc=_+1 :\nLire un parchemin a _30% de chance_ de donner _1 rune aléatoire_.\n\n_+2 :\nLire un parchemin a _45% de chance_ de donner _1 rune aléatoire_.\n\n_+3 :\nLire un parchemin a _60% de chance_ de donner _1 rune aléatoire_.
actors.hero.talent.changqi_bookstore.comment=Ce talent ne donne pas de runes d''enchantement. Il peut être déclenché en lisant un livre de magie chaotique, mais la limite d''acquisition est de _26 fois_ (39 pour le Chevalier) et cette limite est partagée avec la plupart des talents qui octroient directement des ressources via l''amélioration ou la métamorphose.

actors.hero.talent.ascension_curse.title=Malédiction d''ascension
actors.hero.talent.ascension_curse.desc=_+1 :\nLe _reliquaire_ peut lancer le sort _malédiction d''ascension_, consommant _1 charge_ pour faire _flotter_ le héros _5 tours_.\n\n_+2 :\nLe _reliquaire_ peut lancer le sort _malédiction d''ascension_, consommant _1 charge_ pour faire _flotter_ le héros _8 tours_.
actors.hero.talent.ascension_curse.comment=? Envole-toi ! ?

actors.hero.talent.divine_protection.title=Protection divine
actors.hero.talent.divine_protection.desc=_+1 :\nLe _reliquaire_ peut lancer le sort _protection divine_, consommant _2 charges_ pour rendre le héros _invincible 3 tours_.\n\n_+2 :\nLe _reliquaire_ peut lancer le sort _protection divine_, consommant _2 charges_ pour rendre le héros _invincible 5 tours_.
actors.hero.talent.divine_protection.comment=? J''ai des appuis en haut lieu. ?

actors.hero.talent.shepherd_intention.title=Intention du berger
actors.hero.talent.shepherd_intention.desc=_+1 :\nLe _reliquaire_ peut lancer le sort _intention du berger_, consommant _2 charges_ pour désigner un emplacement et _générer un petit groupe de moutons magiques_.\n\n_+2 :\nLe _reliquaire_ peut lancer le sort _intention du berger_, consommant _2 charges_ pour désigner un emplacement et _générer un troupeau de moutons magiques_.
actors.hero.talent.shepherd_intention.comment=? D''où viennent ces moutons ? ?

actors.hero.talent.conversion_holy.title=Conversion sacrée
actors.hero.talent.conversion_holy.desc=_+1 :\nLe _reliquaire_ peut lancer le sort _conversion sacrée_, consommant _2 charges_ pour _submerger_ n''importe quelle cible dans le champ de vision.\n\n_+2 :\nEn plus des effets de +1, accorde _10 tours d''augure_ à la cible.
actors.hero.talent.conversion_holy.comment=Les ennemis submergés par ce sort ne laissent aucun butin.\n? Rejoignez l''église sacrée, rejoignez l''église sacrée merci. ?

actors.hero.talent.purifying_evil.title=Purification du mal
actors.hero.talent.purifying_evil.desc=_+1 :\nLe _reliquaire_ peut lancer le sort _purification du mal_, consommant _2 charges_ pour _supprimer tous les effets bénéfiques_ de la cible.\n\n_+2 :\nEn plus des effets de +1, _supprime aussi les effets d''élixir_ de la cible.\n\n_+3 :\nEn plus des effets de +1 et +2, inflige aux ennemis de type _mort-vivant et démon_ des dégats égaux à _20% de la vie maximale du héros_ (effet réduit de moitié sur les Boss).
actors.hero.talent.purifying_evil.comment=

actors.hero.talent.divine_storm.title=Tempête de domaine divin
actors.hero.talent.divine_storm.desc=_+1 :\nLe _reliquaire_ peut lancer le sort _tempête de domaine divin_, consommant _2 charges_ pour créer une _zone 3x3_ de _champ électrique_ durant _10 tours_.\n\n_+2 :\nLe _reliquaire_ peut lancer le sort _tempête de domaine divin_, consommant _2 charges_ pour créer une _zone 7x7_ de _champ électrique_ durant _20 tours_.\n\n_+3 :\nEn plus des effets de +2, crée aussi une _zone 5x5_ de _flammes_ durant _5 tours_.
actors.hero.talent.divine_storm.comment=

actors.hero.talent.genesis.title=Genèse
actors.hero.talent.genesis.desc=_+1 :\nLe _reliquaire_ peut lancer le sort _genèse_, consommant _3 charges_ pour _réinitialiser les points de talent des deux derniers étages_.\n\n_+2 :\nLe _reliquaire_ peut lancer le sort _genèse_, consommant _3 charges_ pour _réinitialiser tous les points de talent_.
actors.hero.talent.genesis.comment=? Et ainsi, tout commen?a à s''inverser. ?

actors.hero.talent.indulgence.title=Indulgence
actors.hero.talent.indulgence.desc=_+1 :\nLe _reliquaire_ peut lancer le sort _indulgence_, consommant _200 pièces d''or_ pour restaurer _2 charges de reliquaire_.\n\n_+2 :\nLe _reliquaire_ peut lancer le sort _indulgence_, consommant _150 pièces d''or_ pour restaurer _2 charges de reliquaire_.
actors.hero.talent.indulgence.comment=Ce sort ne fonctionne pas sur les reliquaires de donjon.\n? Repentez-vous. ?

actors.hero.talent.silver_language.title=Langue d''argent
actors.hero.talent.silver_language.desc=_+1 :\nLe _reliquaire_ peut lancer le sort _langue d''argent_, consommant _2 charges_ pour infliger _3 tours de frénésie_ à la cible.\n\n_+2 :\nLe _reliquaire_ peut lancer le sort _langue d''argent_, consommant _2 charges_ pour infliger _5 tours de frénésie_ à la cible.
actors.hero.talent.silver_language.comment=? Qui aurait cru que le reliquaire contienne des paroles si vulgaires ? ?

actors.hero.talent.resurrection.title=Sort de résurrection
actors.hero.talent.resurrection.desc=_+1 :\nLe _reliquaire_ peut lancer le sort _résurrection_, consommant _4 charges_ pour accorder au héros ou à un allié _5 tours de mort imminente_ ; mourir pendant cet effet déclenche une _résurrection immédiate_.\n\n_+2 :\nLe _reliquaire_ peut lancer le sort _résurrection_, consommant _4 charges_ pour accorder _10 tours de mort imminente_.\n\n_+3 :\nLe _reliquaire_ peut lancer le sort _résurrection_, consommant _4 charges_ pour accorder _10 tours de mort imminente_ et _20 tours d''augure_ après résurrection.
actors.hero.talent.resurrection.comment=Si le sort est lancé sur un allié, il revient en pleine forme ; sur le héros, il restaure au maximum 1 point de vie.

actors.hero.talent.bone_fire.title=Feu d''ossements
actors.hero.talent.bone_fire.desc=_+0 :\nLes _flammes générées ne s''éteignent pas naturellement_, et quand une créature est blessée par le feu, la _probabilité de br?ler un objet est doublée_.\n\n_+1 :\nLes _flammes générées ne s''éteignent pas naturellement_.\n\n_+2 :\nLes flammes générées s''éteignent normalement.
actors.hero.talent.bone_fire.comment=

actors.hero.talent.jump_face_silicone.title=Silicone de visage
actors.hero.talent.jump_face_silicone.desc=_+0 :\nQuand un ennemi se réveille, il gagne _2 tours de bulle temporelle_.\n\n_+1 :\nQuand un ennemi se réveille, il gagne _1 tour de bulle temporelle_.\n\n_+2 :\nLes ennemis ne gagnent plus de bulle temporelle au réveil.
actors.hero.talent.jump_face_silicone.comment=? Surprise ! ?\n_Givre_

actors.hero.talent.grass_mob.title=Les herbes sont des soldats
actors.hero.talent.grass_mob.desc=_+0 :\nQuand les hautes herbes sont détruites, _20% de chance_ de générer _1 tentacule pourri_.\n\n_+1 :\nQuand les hautes herbes sont détruites, _10% de chance_ de générer _1 tentacule pourri_.\n\n_+2 :\nLes hautes herbes ne génèrent plus de tentacules pourris.
actors.hero.talent.grass_mob.comment=

actors.hero.talent.disaster_curse.title=Malédiction de catastrophe
actors.hero.talent.disaster_curse.desc=_+0 :\nQuand un ennemi inflige des dégats de mêlée au héros, _50% de chance_ d''infliger _1 tour de lenteur et de faiblesse_.\n\n_+1 :\nQuand un ennemi inflige des dégats de mêlée au héros, _25% de chance_ d''infliger _1 tour de lenteur et de faiblesse_.\n\n_+2 :\nLes ennemis n''infligent plus de lenteur ni de faiblesse en attaquant.
actors.hero.talent.disaster_curse.comment=

actors.hero.talent.ashes_bow.title=Arc de cendres
actors.hero.talent.ashes_bow.desc=_+1 :\nLes attaques à distance infligent _1 tour de br?lure_.\n\n_+2 :\nLes attaques à distance infligent _2 tours de br?lure_.\n\n_+3 :\nLes attaques à distance infligent _3 tours de br?lure_.
actors.hero.talent.ashes_bow.comment=Ce talent a _5 tours de recharge_.\nSi le héros possède un arc spirituel ou une autre arme de jet spéciale, ces armes bénéficient aussi de ce talent.
actors.hero.talent$ashesbowcooldown.name=Arc de cendres - Recharge
actors.hero.talent$ashesbowcooldown.desc=Vous venez d''utiliser ce talent, veuillez attendre avant de pouvoir l''utiliser à nouveau.\nRecharge restante : %s tours

actors.hero.talent.swift_church.title=église rapide
actors.hero.talent.swift_church.desc=_+1 :\nGagnez _1 baton de régénération_.\n\n_+2 :\nEn plus des effets de +1 (sans compter l''acquisition de ressource), les attaques sous _bulle temporelle_ _réduisent la bulle de 5 tours_ au lieu de la dissiper immédiatement.\n\n_+3 :\nSous _bulle temporelle_, les attaques _réduisent la bulle de 3 tours_ au lieu de la dissiper immédiatement.
actors.hero.talent.swift_church.comment=Ces talents qui octroient directement des ressources via l''amélioration ou la métamorphose partagent une _limite de 26 déclenchements_ (39 pour le Chevalier).\n? Une terrible dame en violet a réussi à vaincre le dernier Boss en boucle infinie de quatre tours, tu sais de qui je parle. ?\n_— Chacun son domaine_

actors.hero.talent.protect_curse.title=Protection maudite
actors.hero.talent.protect_curse.desc=_+1 :\nLes _armes et armures maudites_ gagnent _1 niveau supplémentaire_.\n\n_+2 :\nLes _armes et armures maudites_ gagnent _2 niveaux supplémentaires_.
actors.hero.talent.protect_curse.comment=? Maintenant, on peut vraiment dire qu''on n''est jamais trop maudit. ?

actors.hero.talent.potential_energy.title=Conversion d''énergie potentielle
actors.hero.talent.potential_energy.desc=_+1 :\nQuand le héros tombe dans un gouffre, il n''obtient plus l''effet _estropié_ mais gagne _3 tours de frénésie_.\n\n_+2 :\nQuand le héros tombe dans un gouffre, il n''obtient plus l''effet _estropié_ mais gagne _5 tours de frénésie_.
actors.hero.talent.potential_energy.comment=? Guerrier éclair du donjon. ?

actors.hero.talent.nirvana.title=Nirvana
actors.hero.talent.nirvana.desc=_+1 :\nAprès la fin de l''effet _br?lure_ sur le héros, celui-ci récupère _un nombre de PV égal à son niveau/2_.\n\n_+2 :\nEn plus des effets de +1, attaquer un ennemi sous _état de br?lure_ lui inflige _3 tours de br?lure_.
actors.hero.talent.nirvana.comment=? Je n''ai pas peur du feu d''ossements. ?

actors.hero.talent.insinuation.title=Insinuation
actors.hero.talent.insinuation.desc=_+1 :\nLancer un sort sur une créature _endormie_ inflige _3 tours de poison_ supplémentaires.\n\n_+2 :\nLancer un sort sur une créature _endormie_ inflige _5 tours de poison_ supplémentaires.
actors.hero.talent.insinuation.comment=? Insinuer des soup?ons sur les autres, même les malades l''ignorent. Les paroles habiles construisent des accusations, jusqu''à la mort on ne se méfie pas. ?

actors.hero.talent.auto_pick.title=Ramassage automatique
actors.hero.talent.auto_pick.desc=_+1 :\nLe temps de ramassage des objets est réduit à _50%_ de la normale.\n\n_+2 :\nLe ramassage des objets _ne prend plus de temps_.
actors.hero.talent.auto_pick.comment=? Qui a activé mon ramassage automatique ? ?

actors.hero.talent.hand_slip.title=Glissement de main
actors.hero.talent.hand_slip.desc=_+0 :\nLes _dégats subis au tour suivant un déplacement augmentent de 50%_.\n\n_+1 :\nLes _dégats subis au tour suivant un déplacement augmentent de 25%_.\n\n_+2 :\nLes dégats n''augmentent plus après un déplacement.
actors.hero.talent.hand_slip.comment=? C''est dans la poche. ?\n_— Caiyu_

actors.hero.talent.hand_destruction.title=Main destructrice
actors.hero.talent.hand_destruction.desc=_+1 :\nLes _attaques physiques_ peuvent _exécuter_ directement les cibles _sans résistance à la mort_ dont les PV sont _inférieurs à 5%_.\n\n_+2 :\nLes _attaques physiques_ peuvent _exécuter_ directement les cibles _sans résistance à la mort_ dont les PV sont _inférieurs à 10%_.\n\n_+3 :\nLes _attaques physiques_ peuvent _exécuter_ directement les cibles _sans résistance à la mort_ dont les PV sont _inférieurs à 15%_.
actors.hero.talent.hand_destruction.comment=

actors.hero.talent.predictive_lover.title=Amateur de parchemins de divination
actors.hero.talent.predictive_lover.desc=_+1 :\nLire un _parchemin de divination_ permet d''_identifier 1 objet supplémentaire_.\n\n_+2 :\nLire un _parchemin de divination_ permet d''_identifier 2 objets supplémentaires_.
actors.hero.talent.predictive_lover.comment=Ce talent peut être déclenché en lisant un livre de magie chaotique contenant un parchemin de divination.\n? Monsieur, j''aime les bagues. ?

actors.hero.talent.fire_ball.title=Boule de feu
actors.hero.talent.fire_ball.desc=_+1 :\nLancer un sort sur une case inflammable y libère _1 unité de feu_.\n\n_+2 :\nLancer un sort sur une case inflammable y libère _2 unités de feu_.
actors.hero.talent.fire_ball.comment=? C''est... une petite sorcière des flammes ? ?

actors.hero.talent.flash_genius.title=éclair de génie
actors.hero.talent.flash_genius.desc=_+1 :\nUtiliser une _pierre de détection_ avec succès pour identifier un objet inflige _2 tours de cécité et d''étourdissement_ à tous les ennemis de l''étage.\n\n_+2 :\nUtiliser une _pierre de détection_ avec succès pour identifier un objet inflige _3 tours de cécité et d''étourdissement_ à tous les ennemis de l''étage.
actors.hero.talent.flash_genius.comment=Améliorer ce talent donne _1 pierre de détection_ supplémentaire.\nCes talents qui octroient directement des ressources via l''amélioration ou la métamorphose partagent une _limite de 26 déclenchements_ (39 pour le Chevalier).\n? Balle flash. ?

actors.hero.talent.witch_potion.title=Potion de sorcière
actors.hero.talent.witch_potion.desc=_+1 :\nLancer une potion sur un emplacement inflige _15 tours de charme_ aux ennemis présents.\n\n_+2 :\nLancer une potion sur un emplacement inflige _15 tours de charme_ et _3 tours de poison_ aux ennemis présents.
actors.hero.talent.witch_potion.comment=? Le café habituellement amer contenait en fait une potion... ?\n? Moi, la plus mature, je suis amoureuse de la belle clown, tombant heureusement dans les rêves... ?

actors.hero.talent.traitorous_spell.title=Sort de trahison
actors.hero.talent.traitorous_spell.desc=_+1 :\nLe _reliquaire_ peut lancer le sort _trahison_, consommant _2 charges_ pour libérer l''effet d''une _baguette maudite_ à l''emplacement désigné.\n\n_+2 :\nLe _reliquaire_ peut lancer le sort _trahison_, consommant _1 charge_ pour libérer l''effet d''une _baguette maudite_ à l''emplacement désigné.
actors.hero.talent.traitorous_spell.comment=? Cela ne ressemble pas à un sort enregistré dans le reliquaire. ?

actors.hero.talent.sprint_spell.title=Sort de sprint
actors.hero.talent.sprint_spell.desc=_+1 :\nLe _reliquaire_ peut lancer le sort _sprint_, consommant _1 charge_ pour gagner _3 tours de frénésie_.\n\n_+2 :\nLe _reliquaire_ peut lancer le sort _sprint_, consommant _1 charge_ pour gagner _5 tours de frénésie_.
actors.hero.talent.sprint_spell.comment=? Super vitesse ! ?

actors.hero.talent.focus_light.title=Rayon focalisé
actors.hero.talent.focus_light.desc=_+1 :\nLe _reliquaire_ peut lancer le sort _rayon focalisé_, consommant _2 charges_ pour tirer un rayon à haute température infligeant _4~8_ dégats et enflammant la trajectoire et la cible.\n\n_+2 :\nLe _reliquaire_ peut lancer le sort _rayon focalisé_, consommant _2 charges_ pour tirer un rayon à haute température infligeant _6~10_ dégats et enflammant la trajectoire et la cible.
actors.hero.talent.focus_light.comment=? C''est... un fusil à rayon thermique. ?

actors.hero.talent.zhuanyu_spell.title=Sort de conversion
actors.hero.talent.zhuanyu_spell.desc=_+1 :\nLe _reliquaire_ peut lancer le sort _conversion_, consommant _1 charge_ pour convertir _50%_ de la _protection actuelle_ en soins.\n\n_+2 :\nLe _reliquaire_ peut lancer le sort _conversion_, consommant _1 charge_ pour convertir _75%_ de la _protection actuelle_ en soins.\n\n_+3 :\nLe _reliquaire_ peut lancer le sort _conversion_, consommant _1 charge_ pour convertir _100%_ de la _protection actuelle_ en soins.
actors.hero.talent.zhuanyu_spell.comment=La quantité totale de soins de ce sort ne peut pas dépasser la moitié de la vie maximale du héros.\n? Comble le défaut du reliquaire qui ne donne que des boucliers sans aucun soin. ?

actors.hero.talent.thorn_whip.title=Fouet d''épines
actors.hero.talent.thorn_whip.desc=_+1 :\nLe _reliquaire_ peut lancer le sort _fouet d''épines_, consommant _1 charge_ pour attirer un ennemi et lui infliger _3 points de saignement_.\n\n_+2 :\nLe _reliquaire_ peut lancer le sort _fouet d''épines_, consommant _1 charge_ pour attirer un ennemi et lui infliger _5 points de saignement_.
actors.hero.talent.thorn_whip.comment=? Le fouet divin. ?

actors.hero.talent.strongest_shield.title=Bouclier suprême
actors.hero.talent.strongest_shield.desc=_+1 :\nQuand vous subissez une _attaque physique_, _50% de chance_ de faire un _calcul de réduction d''armure supplémentaire_.\n\n_+2 :\nEn plus des effets de +1, subir une _attaque magique_ a aussi _50% de chance_ de faire un _calcul de réduction d''armure supplémentaire_.
actors.hero.talent.strongest_shield.comment=

actors.hero.talent.combo_package.title=Menu combo
actors.hero.talent.combo_package.desc=_+1 :\nTous les _6 coups_ d''attaques de mêlée, déclenche _1 effet de repas_.\n\n_+2 :\nTous les _4 coups_ d''attaques de mêlée, déclenche _1 effet de repas_.
actors.hero.talent.combo_package.comment=L''effet de recharge de relique obtenu via ce talent ne peut pas recharger la _Corne d''abondance_.\n? Tu n''as pas mangé ? Prends donc mon poing ! ?\n_Givre_
actors.hero.talent$combopackage.name=Menu combo
actors.hero.talent$combopackage.desc=Pour une raison inconnue, en encha?nant continuellement les frappes sur les ennemis, tu ressens un plaisir comparable à celui de déguster un bon repas.\nLes attaques de mêlée encha?nées un certain nombre de fois peuvent déclencher un effet de repas.\nNombre de combos actuel : %1$d
actors.hero.talent.break_enemy_ranks.title=Désir de briser les rangs
actors.hero.talent.break_enemy_ranks.desc=_+1：_Chaque ennemi dans le champ de vision confère au héros _0~3 points d'armure_.\n\n_+2：_Chaque ennemi dans le champ de vision confère au héros _1~4 points d'armure_.
actors.hero.talent.break_enemy_ranks.comment=

actors.hero.talent.hunting_intuition.title=Intuition de Chasse
actors.hero.talent.hunting_intuition.desc=_+1：_La vitesse d'identification des armes de jet du ninja est multipliée par _3_.\n\n_+2：_Le ninja _identifie instantanément_ une arme de jet quand elle touche un ennemi.
actors.hero.talent.hunting_intuition.comment=“Peut-on vraiment être un ninja sans maîtriser les armes de jet ?”

actors.hero.talent.revelation.title=Apocalypse
actors.hero.talent.revelation.desc=_+1：_Le Livre Saint peut lancer le sort _Apocalypse_, consommant 1 charge pour obtenir _3 tours d'Apocalypse_, ce qui _augmente de +1 le niveau des effets de talents positifs_ existants.\n\n_+2：_Le Livre Saint peut lancer le sort _Apocalypse_, consommant 1 charge pour obtenir _5 tours d'Apocalypse_, ce qui _augmente de +1 le niveau des effets de talents positifs_ existants.
actors.hero.talent.revelation.comment=Le niveau d'effet du talent ne dépasse pas le niveau maximal.\n\n« Affaiblissement de talent ? Sans importance. »

actors.hero.talent.holy_grenade.title=Grenade Sacrée
actors.hero.talent.holy_grenade.desc=_+1：_Le Livre Saint peut lancer le sort _Grenade Sacrée_, consommant 2 charges pour infliger _15~30_ points de dégâts aux ennemis dans une _zone de 3x3_.\n\n_+2：_Le Livre Saint peut lancer le sort _Grenade Sacrée_, consommant 2 charges pour infliger _20~40_ points de dégâts aux ennemis dans une _zone de 3x3_.\n\n_+3：_Le Livre Saint peut lancer le sort _Grenade Sacrée_, consommant 2 charges pour infliger _20~40_ points de dégâts aux ennemis dans une _zone de 5x5_.
actors.hero.talent.holy_grenade.comment=La Grenade Sacrée inflige toujours les dégâts maximaux aux ennemis de type _Mort-Vivant et Démon_.\n\n“Alléluia~”

actors.hero.talent.blade_star.title=Escalier de Lames
actors.hero.talent.blade_star.desc=_+1：_Le Livre Saint peut lancer le sort _Escalier de Lames_, consommant 3 charges pour créer une _zone de 3x3_ de lames durant 10 tours.\n\n_+2：_Le Livre Saint peut lancer le sort _Escalier de Lames_, consommant 3 charges pour créer une _zone de 5x5_ de lames durant 10 tours.\n\n_+3：_Le Livre Saint peut lancer le sort _Escalier de Lames_, consommant 3 charges pour créer une _zone de 7x7_ de lames durant 10 tours.
actors.hero.talent.blade_star.comment=La zone de lames inflige 4~8 dégâts ignorant l'armure par tour et applique 3 tours de mutilation.

actors.hero.talent.sacred_blade.title=Rotation Dorée
actors.hero.talent.sacred_blade.desc=_+1：_Le Livre Saint peut lancer le sort _Rotation Dorée_, consommant 1 charge pour infliger des _dégâts magiques basés sur l'arme de mêlée_ à la cible.\n\n_+2：_En plus de +1, inflige toujours les dégâts maximaux aux ennemis de type _Mort-Vivant et Démon_.\n\n_+3：_En plus de +1 et +2, les dégâts aux ennemis de type _Mort-Vivant et Démon_ sont _augmentés de 30%_.
actors.hero.talent.sacred_blade.comment=« Ce n'est pas une boule de fer. »

actors.hero.talent.equipment_bless.title=Bénédiction d'Équipement
actors.hero.talent.equipment_bless.desc=_+1：_Le Livre Saint peut lancer le sort _Bénédiction d' Équipement_, consommant 3 charges pour obtenir _50 tours de Bénédiction d' Équipement_, conférant _1 niveau supplémentaire_ à toutes les armes et armures.\n\n_+2：_Le Livre Saint peut lancer le sort _Bénédiction d' Équipement_, consommant 3 charges pour obtenir _50 tours de Bénédiction d' Équipement_, conférant _2 niveaux supplémentaires_ à toutes les armes et armures.
actors.hero.talent.equipment_bless.comment=“Création divine.”

actors.hero.talent.hotlight.title=Lumière Aveuglante
actors.hero.talent.hotlight.desc=_+1：_Le Livre Saint peut lancer le sort _Lumière Aveuglante_, consommant _3 charges_ pour infliger _3 tours de Cécité_ aux cibles non-héros et non-alliées dans le champ de vision, et _3 tours de Brûlure_ aux ennemis de type _Mort-Vivant et Démon_.\n\n_+2：_Le Livre Saint peut lancer le sort _Lumière Aveuglante_, consommant _2 charges_ pour infliger _3 tours de Cécité_ aux cibles non-héros et non-alliées dans le champ de vision, et _3 tours de Brûlure_ aux ennemis de type _Mort-Vivant et Démon_.
actors.hero.talent.hotlight.comment=“Grenade flash !”

actors.hero.talent.healattack.title=Guérison Sacrée
actors.hero.talent.healattack.desc=_+1：_Attaquer physiquement un ennemi ayant la Lueur Sacrée restaure _3 points de vie_.\n\n_+2：_Attaquer physiquement un ennemi ayant la Lueur Sacrée restaure _30% du niveau du héros en vie_.
actors.hero.talent.healattack.comment=“Que Dieu te bénisse (bonkââ).”

actors.hero.talent.eat_mind.title=Dévoreur d'Esprits
actors.hero.talent.eat_mind.desc=_+1：_Chaque point de dégâts magiques infligé par un bâton ou une baguette _restaure 0,2 point de satiété_.\n\n_+2：_Chaque point de dégâts magiques infligé par un bâton ou une baguette _restaure 0,3 point de satiété_.
actors.hero.talent.eat_mind.comment=“Voir le détail, dévorer l'esprit.”\n\n_Frost Morning_

actors.hero.talent.disabliity_posion.title=Nuage Toxique Handicapant
actors.hero.talent.disabliity_posion.desc=_+1：_Le brouillard corrosif du Bâton d'Acide voit ses _dégâts de départ augmentés de 2 points_ et son _volume de gaz augmenté de 30%_.\n\n_+2：_En plus de +1, les ennemis dans le brouillard corrosif gagnent _1 tour de Mutilation_ en continu.\n\n_+3：_En plus de +1 et +2, les ennemis dans le brouillard corrosif gagnent _1 tour de Faiblesse et Confusion_ en continu.
actors.hero.talent.disabliity_posion.comment=

actors.hero.talent.light_crop.title=Pluie d'Orage sur les Récoltes
actors.hero.talent.light_crop.desc=_+1：_Dans le champ électrique, les cases vides normales _font pousser de l'herbe_, les braises et l'herbe _font pousser de hautes herbes_.\n\n_+2：_En plus de +1, utiliser le Bâton de Foudre applique l'effet _d'herbe haute (+1 de ce talent)_ à l'emplacement du sort.
actors.hero.talent.light_crop.comment=“N2+O2 décharge produit 2NO.”\n“2NO+O2 produit 2NO2.”\n“3NO2+H2O produit 2HNO3+NO.”

actors.hero.talent.devil_flame.title=Flamme Démoniaque
actors.hero.talent.devil_flame.desc=_+1：_Quand le Bâton de Vagues Ardentes lance un sort, si la _consommation d'origine est de 3 points_, alors _consommation -1_.\n\n_+2：_Quand le Bâton de Vagues Ardentes lance un sort, si la _consommation d'origine est de 2 points ou plus_, alors _consommation -1_.\n\n_+3：_En plus de +2, les dégâts du Bâton de Vagues Ardentes augmentent de _20%_, et la persistance des flammes _est prolongée d'1 tour_.
actors.hero.talent.devil_flame.comment=La réduction de consommation de ce talent n'affecte pas les dégâts du Bâton de Vagues Ardentes, toujours calculés selon la consommation d'origine.

actors.hero.talent.fast_break.title=Accumulation d'Expérience
actors.hero.talent.fast_break.desc=_+1：_Le _niveau maximum_ des butins et de l'expérience des ennemis est _augmenté de 2_.\n\n_+2：_Le _niveau maximum_ des butins et de l'expérience des ennemis est _augmenté de 3_.
actors.hero.talent.fast_break.comment=“Richesse... armure double... spectre... je peux encore farmer...”

actors.hero.talent.crazy_dancer.title=Danseur Fou
actors.hero.talent.crazy_dancer.desc=_+1：_Quand le héros esquive des dégâts physiques ennemis, l'ennemi devient _frénétique pendant 2 tours_.\n\n_+2：_Quand le héros esquive des dégâts physiques ennemis, l'ennemi devient _frénétique pendant 3 tours_.
actors.hero.talent.crazy_dancer.comment=“Arrêtez de vous battre !”

actors.hero.talent.throwing_recycling.title=Recyclage de Jet
actors.hero.talent.throwing_recycling.desc=_+1：_Les attaques physiques contre un ennemi en état _d'Empalement_ ont _25% de chances_ de récupérer l'arme de jet sur son corps.\n\n_+2：_Les attaques physiques contre un ennemi en état _d'Empalement_ ont _50% de chances_ de récupérer l'arme de jet sur son corps.\n\n_+3：_Les attaques physiques contre un ennemi en état _d'Empalement_ ont _75% de chances_ de récupérer l'arme de jet sur son corps.
actors.hero.talent.throwing_recycling.comment=« En théorie, une chaîne infinie de lancers de haches. »

actors.hero.talent.falsehood_power.title=Pouvoir Illusoire
actors.hero.talent.falsehood_power.desc=_+1：_Force _-1_. Quand vous portez une arme ou une armure trop lourde, la _pénalité de force est réduite de 3 points_.\n\n_+2：_Force _-1_. Quand vous portez une arme ou une armure trop lourde, la _pénalité de force est réduite de 4 points_.
actors.hero.talent.falsehood_power.comment=“Un pouvoir illusoire, pourtant plus fort que le vrai.”

actors.hero.talent.flame_incarnation.title=Incarnation des Cendres Enflammées
actors.hero.talent.flame_incarnation.desc=_+1：_Tuer un ennemi sous l'effet _Brûlure_ a _10% de chances d'invoquer 1 élément de feu_ pour combattre à vos côtés.\n\n_+2：_Tuer un ennemi sous l'effet _Brûlure_ a _20% de chances d'invoquer 1 élément de feu_ pour combattre à vos côtés.\n\n_+3：_Tuer un ennemi sous l'effet _Brûlure_ a _30% de chances d'invoquer 1 élément de feu_ pour combattre à vos côtés.
actors.hero.talent.flame_incarnation.comment=Les attributs des éléments de feu produits par ce talent dépendent de l'étage.

actors.hero.talent.marksman.title=Tireur d'Élite Magique
actors.hero.talent.marksman.desc=_+1：_Le bâton qui a gagné un niveau via le Bâton de Projectiles Magiques _ne consomme pas de charge_ lors du prochain sort.\n\n_+2：_En plus de +1, le Bâton de Projectiles Magiques _a ses dégâts de sort +3_.
actors.hero.talent.marksman.comment=La caractéristique de non-consommation de charge de ce talent ne s'applique pas au Bâton de Projectiles Magiques.\n\n“Tu veux dire un Tireur de Pois ?”

actors.hero.talent.spider_sense.title=Sens d'Araignée
actors.hero.talent.spider_sense.desc=_+1：_Quand le héros subit une attaque hors de son champ de vision, il gagne _1 tour de Bulle Temporelle_.\n\n_+2：_Quand le héros subit une attaque hors de son champ de vision, il gagne _2 tours de Bulle Temporelle_.
actors.hero.talent.spider_sense.comment=« Sens d'araignée. »

actors.hero.talent.no_more_mob.title=PAS de Cluster
actors.hero.talent.no_more_mob.desc=_+1：_Les ennemis endormis hors du champ de vision ont _50% de chances_ de ne pas être réveillés lorsque l'intelligence de cluster est active.\n\n_+2：_En plus de +1, les ennemis ainsi réveillés entrent en état _errant_ au lieu de cibler le héros.
actors.hero.talent.no_more_mob.comment=« Je n'activerai plus jamais le mode cluster 3. »

actors.hero.talent.kebi.title=Plume ・ Bryant
actors.hero.talent.kebi.desc=_+1：_La Plume d'Arcane peut désormais aussi _conférer un enchantement à une arme_.\n\n_+2：_En plus de +1, la Plume d'Arcane _augmente la probabilité de conférer un enchantement/gravure puissant_.
actors.hero.talent.kebi.comment=“Bryant est un enchanteur de petit talent qui a créé de nombreux enchantements et gravures puissants. Malheureusement, il est décédé lors d'une démonstration de gravure de lévitation, et les recherches sur cette gravure ont été interdites depuis.”

actors.hero.talent.ice_meal.title=Repas Glacé
actors.hero.talent.ice_meal.desc=_+1：_Manger ne coûte qu'1 tour et confère _2 tours de Pouvoir de Givre_.\n\n_+2：_Manger ne coûte qu'1 tour et confère _4 tours de Pouvoir de Givre_.\n\n_+3：_En plus de +2, manger gèle les créatures autour du héros pendant _10 tours_.
actors.hero.talent.ice_meal.comment=

actors.hero.talent.more_favors.title=Plus de Faveurs
actors.hero.talent.more_favors.desc=_+1：_La faveur accordée par le forgeron troll par minerai sombre _augmente de 25_.\n\n_+2：_La faveur accordée par le forgeron troll par minerai sombre _augmente de 50_, et la limite de faveur passe de 3000 _à 4000_.
actors.hero.talent.more_favors.comment=« Mauvaise bouche mais bon cœur. »

actors.hero.talent.hardware_elements.title=Éléments de Quincaillerie
actors.hero.talent.hardware_elements.desc=_+1：_Les Cendres d'Élément ne sont pas consumées lors de la fabrication d'un Pilier d'Invocation de Démon, mais la _consommation d'énergie alchimique passe à 20_.\n\n_+2：_Les Cendres d'Élément ne sont pas consumées lors de la fabrication d'un Pilier d'Invocation de Démon, mais la _consommation d'énergie alchimique passe à 15_.\n\n_+3：_Les Cendres d'Élément ne sont pas consumées lors de la fabrication d'un Pilier d'Invocation de Démon, et la _consommation d'énergie alchimique n'augmente plus_.
actors.hero.talent.hardware_elements.comment=“Obtenir une énergie infinie est aussi l'un des buts de l'alchimie.”

actors.hero.talent.static_light.title=Courant Statique
actors.hero.talent.static_light.desc=_+1：_Dégâts de sort +1_, lancer un sort avec un bâton ou une baguette inflige en plus _tours de paralysie égaux à 5% des dégâts infligés_.\n\n_+2：_Dégâts de sort +2_, lancer un sort avec un bâton ou une baguette inflige en plus _tours de paralysie égaux à 7,5% des dégâts infligés_.
actors.hero.talent.static_light.comment=Les tours de paralysie accordés par ce talent sont arrondis à l'inférieur.\n\n« C'est un petit pas vers le Seigneur de la Foudre. »

actors.hero.talent.miracle_alchemy.title=Alchimie Miraculeuse
actors.hero.talent.miracle_alchemy.desc=_+1：_L'alchimie a _20% de chances_ de produire un produit alchimique supplémentaire.\n\n_+2：_L'alchimie a _40% de chances_ de produire un produit alchimique supplémentaire.
actors.hero.talent.miracle_alchemy.comment=Ce talent ne s'applique pas aux bijoux, ragoûts, fruits insipides cuits, potions de mémoire musculaire, parchemins enchantés, toutes les bombes, liquides d'or, tomes saints, élixirs d'os, cristaux enchantés et cristaux de transmutation.\n\n« L'alchimie elle-même est un miracle, j'adore l'alchimie. »

actors.hero.talent.hungry_ghost.title=Voie des Esprits Affamés
actors.hero.talent.hungry_ghost.desc=_+0：_Subir des dégâts de faim _génère un Spectre_. Être attaqué par un Spectre _réduit la satiété de 5 points_.\n\n_+1：_Subir des dégâts de faim _génère un Spectre_.\n\n_+2：_Subir des dégâts de faim ne génère plus de Spectre.
actors.hero.talent.hungry_ghost.comment=

actors.hero.talent.unable_rest.title=Sans Repos
actors.hero.talent.unable_rest.desc=_+0：_Les ennemis de type _Mort-Vivant et Démon_ conservent _1 PV_ lorsqu'ils subissent des dégâts mortels et gagnent un _bouclier égal à 50% de leur vie maximale_.\n\n_+1：_Les ennemis de type _Mort-Vivant et Démon_ conservent _1 PV_ lorsqu'ils subissent des dégâts mortels.\n\n_+2：_Les ennemis de type _Mort-Vivant et Démon_ subissant des dégâts mortels peuvent aller voir Dieu directement.
actors.hero.talent.unable_rest.comment=Ce talent ne s'applique pas aux ennemis ayant naturellement une capacité de résurrection (comme les zombies nains) ni aux boss.

actors.hero.talent.cursedman.title=Le Maudit
actors.hero.talent.cursedman.desc=_+0：_Utiliser un _parchemin d'amélioration, un parchemin d'infusion, une pierre d'enchantement ou une plume d'arcane_ sur un objet le maudit.\n\n_+1：_Utiliser une _pierre d'enchantement ou une plume d'arcane_ sur un objet le maudit.\n\n_+2：_Utiliser un parchemin d'amélioration, un parchemin d'infusion, une pierre d'enchantement ou une plume d'arcane sur un objet ne le maudit plus.
actors.hero.talent.cursedman.comment=

actors.hero.talent.usury.title=Prêt Usuraire
actors.hero.talent.usury.desc=_+0：_Peut obtenir 1000 pièces d'or ? Quoi qu'il en soit, à chaque étage suivant, _200 pièces d'or_ d'intérêts seront déduites.\n\n_+1：_Les intérêts sont réduits à _150 pièces d'or_.\n\n_+2：_Plus d'intérêts déduits.
actors.hero.talent.usury.comment=
actors.hero.talent.usury.nomoney=« Surprise ! Le marchand a détourné une partie de ton prêt ! »
actors.hero.talent.usury.principal=C'est le prêt usuraire que le marchand t'a accordé.
actors.hero.talent.usury.interest=Intérêt par étage : %d pièces d'or.

actors.hero.talent.armed_uprising.title=Escouade Infernale
actors.hero.talent.armed_uprising.desc=_+1：_Les attaques physiques des alliés synchronisent la plupart des _effets d'attaque physique_ du héros.\n\n_+2：_En plus de +1, les attaques physiques des alliés synchronisent aussi la plupart des _bonus de dégâts physiques_ du héros.
actors.hero.talent.armed_uprising.comment=Les effets de synergie de ce talent dépendent principalement des talents et des caractéristiques du héros.\n\n“En avant, toute !”

actors.hero.talent.dungeon_hero.title=Héros du Donjon
actors.hero.talent.dungeon_hero.desc=_+1：_En interagissant pour la première fois avec les PNJ de quête et les marchands de chaque zone, obtenez _2 butins bas_.\n\n_+2：_En interagissant pour la première fois avec les PNJ de quête et les marchands de chaque zone, obtenez _2 butins moyens_.
actors.hero.talent.dungeon_hero.comment=“N'accepte ni émeraudes ni échanges d'objets.”

actors.hero.talent.exp_solid.title=Solidification d'Expérience
actors.hero.talent.exp_solid.desc=_+1：_Réduit le _niveau du héros de 1_ et obtenez _1 potion d'expérience_.\n\n_+2：_Réduit le _niveau du héros de 2_ et obtenez _2 potions d'expérience_.
actors.hero.talent.exp_solid.comment=Améliorer ce talent après avoir atteint la limite de déclenchement réduit encore le niveau du héros. Ces talents partagent _26 limites de déclenchement_ (39 pour le gentleman).\n\n“Je deviens plus faible ? Non, je deviens plus fort (en équipant l'anneau de richesse).”

actors.hero.talent.wealth_statue.title=Statue de Richesse
actors.hero.talent.wealth_statue.desc=_+1：_Les statues fossiles et les statues blindées laissent tomber un _anneau aléatoire de niveau 2_ à leur mort, tandis que les gardiens invoqués laissent tomber un _anneau aléatoire de niveau 1_.\n\n_+2：_Les statues fossiles et les statues blindées laissent tomber un _anneau aléatoire de niveau 3_ à leur mort, tandis que les gardiens invoqués laissent tomber un _anneau aléatoire de niveau 2_.\n\n_+3：_Les statues fossiles et les statues blindées laissent tomber un _anneau aléatoire de niveau 4_ à leur mort, tandis que les gardiens invoqués laissent tomber un _anneau aléatoire de niveau 3_.
actors.hero.talent.wealth_statue.comment=L'anneau obtenu par ce talent n'est pas identifié. Le nombre de fois que ce talent peut acquérir des ressources _est limité à 26_ (39 pour le Gentleman) et cette limite est partagée avec la plupart des talents qui acquièrent directement des ressources via l'amélioration ou la transmutation.

actors.hero.talent.sweet_sleep.title=Doux Sommeil Éternel
actors.hero.talent.sweet_sleep.desc=_+1：_Les embuscades infligent _30% de dégâts supplémentaires_.\n\n_+2：_Les embuscades infligent _40% de dégâts supplémentaires_.
actors.hero.talent.sweet_sleep.comment=« La mort n'est pas effrayante. La mort est une nuit d'été rafraîchissante où l'on peut dormir paisiblement sans souci. »

actors.hero.talent.light_shock.title=Frappé par la Lumière
actors.hero.talent.light_shock.desc=_+1：_Obtenez _1 Bâton Prismatique_. Le Bâton Prismatique inflige _niveau du bâton x 50% tours de Mutilation_ en plus de la Cécité. Si la cible a déjà la Cécité avant le sort, la Mutilation est aussi infligée.\n\n_+2：_En plus de +1 (hors ressource), les dégâts du Bâton Prismatique augmentent de _30%_ lorsqu'il inflige la Cécité ou cible un ennemi déjà aveuglé.
actors.hero.talent.light_shock.comment=Ces talents partagent _26 limites de déclenchement_ (39 pour le gentleman).\n\n“Manier la Gloire de la Lumière, c'est pour balayer le mal du monde.”

actors.hero.talent.boozy.title=Ivrogne
actors.hero.talent.boozy.desc=_+1：_Consommer une potion confère _5 points de régénération_ supplémentaires et _0~5 points d´écorce_ diminuant chaque tour.\n\n_+2：_Consommer une potion confère _10 points de régénération_ supplémentaires et _0~10 points d´écorce_ diminuant chaque tour.
actors.hero.talent.boozy.comment=“Les potions, comme le bon vin, se bonifient avec l'âge.”

actors.hero.talent.shadow_killer.title=Tueur d'Ombres
actors.hero.talent.shadow_killer.desc=_+1：_La correction de dégâts obtenue par embuscade passe à _75%_ et inflige des dégâts supplémentaires égaux à _100% de l'armure ennemie_.\n\n_+2：_La correction de dégâts obtenue par embuscade passe à _100%_ et inflige des dégâts supplémentaires égaux à _150% de l'armure ennemie_.
actors.hero.talent.shadow_killer.comment=

actors.hero.talent.kill_spree.title=Festin Meurtrier
actors.hero.talent.kill_spree.desc=_+1：_Tuer un ennemi avec une attaque physique restaure _5% de la vie maximale de l'ennemi_ et confère _2 tours de charge d'artefact_.\n\n_+2：_Tuer un ennemi avec une attaque physique restaure _7,5% de la vie maximale de l'ennemi_ et confère _3 tours de charge d'artefact_.
actors.hero.talent.kill_spree.comment=

actors.hero.talent.seaofpeople.title=Foule Déchaînée
actors.hero.talent.seaofpeople.desc=_+1：_La vitesse de déplacement _augmente de 30%_ pour chaque ennemi dans le champ de vision.\n\n_+2：_La vitesse de déplacement _augmente de 45%_ pour chaque ennemi dans le champ de vision.
actors.hero.talent.seaofpeople.comment=

actors.hero.talent.phantom_step.title=Pas Fantomatique
actors.hero.talent.phantom_step.desc=_+1：_En quittant l'invisibilité ou l'ombre furtive, gagnez _3 tours de Célérité_ et _1 tour de Pas Fantomatique_ (esquive toutes les attaques).\n\n_+2：_En quittant l'invisibilité ou l'ombre furtive, gagnez _5 tours de Célérité_ et _2 tours de Pas Fantomatique_ (esquive toutes les attaques).
actors.hero.talent.phantom_step.comment=Ce talent ne peut pas augmenter la durée de Célérité si le héros a déjà au moins _6/10 tours_ de Célérité aux niveaux _+1/+2_.\n\nUn tout nouveau pouvoir venu du _Donjon Reconstruit_ !
actors.hero.talent$phantomstep.name=Pas fantomatique
actors.hero.talent$phantomstep.desc=Le summum convoité par tous les membres de la guilde des voleurs : maîtriser cette capacité.\n\nSous cet effet, vous esquivez toute attaque physique ou magique.\n\nDurée restante : %s tours

actors.hero.talent.steam_bean.title=Haricot Cuit à la Vapeur
actors.hero.talent.steam_bean.desc=_+0：_La première attaque physique contre un ennemi plonge le héros dans _8 tours de Stupeur_.\n\n_+1：_La première attaque physique contre un ennemi plonge le héros dans _4 tours de Stupeur_.\n\n_+2：_Attaquer physiquement un ennemi ne plonge plus le héros dans la Stupeur.
actors.hero.talent.steam_bean.comment=

actors.hero.talent.alchemy_accident.title=Accident Alchimique
actors.hero.talent.alchemy_accident.desc=_+0：_La fabrication de produits alchimiques a _20% de chances_ de provoquer une explosion centrée sur le héros.\n\n_+1：_La fabrication de produits alchimiques a _10% de chances_ de provoquer une explosion centrée sur le héros.\n\n_+2：_L'alchimie est désormais sans danger.
actors.hero.talent.alchemy_accident.comment=

actors.hero.talent.shell_cry.title=Carapace Cristalline
actors.hero.talent.shell_cry.desc=_+0：_L'armure du héros diminue avec ses PV, jusqu'à _100%_ de réduction.\n\n_+1：_L'armure du héros diminue avec ses PV, jusqu'à _50%_ de réduction.\n\n_+2：_L'armure du héros ne diminue plus avec ses PV.
actors.hero.talent.shell_cry.comment=

actors.hero.talent.mal_curse.title=Malédiction Malveillante
actors.hero.talent.mal_curse.desc=_+0：_L'équipement maudit _perd 2 niveaux_.\n\n_+1：_L'équipement maudit _perd 1 niveau_.\n\n_+2：_La malédiction n'affecte plus le niveau de l'équipement.
actors.hero.talent.mal_curse.comment=Ce talent peut réduire le niveau d'équipement à un niveau négatif.\n\nUne puissante malédiction venue du _Pixel Dungeon original_ !

actors.hero.talent.thunder_strike.title=Frappe de Tonnerre
actors.hero.talent.thunder_strike.desc=Améliorer ce talent fait que les attaques physiques infligent un arc électrique égal à _50% des dégâts infligés_ (le héros et ses alliés ne subissent pas les dégâts de l'arc). L'arc peut se lier aux créatures adjacentes à la cible (sans lier l'attaquant). Si la cible est dans l'eau ou si le héros a un _effet de charge de bâton ou d'artefact_, la distance de liaison augmente de +1.\n\n_+1：_L'arc _n'inflige des dégâts qu'aux ennemis liés suivants_.\n\n_+2：_L'arc _inflige des dégâts à tous les ennemis liés_.
actors.hero.talent.thunder_strike.comment=« Je dis que le DM-300 est aussi un robot défectueux, y a-t-il des connaisseurs ? »

actors.hero.talent.directional_collapse.title=Effondrement Dirigé
actors.hero.talent.directional_collapse.desc=_+1：_Tous les _4 sorts lancés_ par un bâton ou une baguette, un éboulement massif se produit autour de la cible, infligeant _10~20_ dégâts ignorant l'armure et _3 tours de Paralysie_.\n\n_+2：_Tous les _3 sorts lancés_ par un bâton ou une baguette, un éboulement massif se produit autour de la cible, infligeant _10~20_ dégâts ignorant l'armure et _3 tours de Paralysie_.
actors.hero.talent.directional_collapse.comment=Les éboulis produits par ce talent ne blessent ni ne paralysent le héros et ses alliés.
actors.hero.talent$directionalcollapse.name=Effondrement dirigé
actors.hero.talent$directionalcollapse.desc=Des fragments métalliques détachés de la foreuse de DM-300 semblent différents des fragments félins récupérés sur d'autres débris. Ils se dissipent dès que vous les touchez. Bien que vous ignoriez ce que cela signifie, vous sentez le bâton dans votre sac devenir plus puissant.\n\nTous les %s sorts lancés, un effondrement dirigé se produit, faisant tomber des rochers autour de la cible, infligeant 10~20 dégâts ignorant l'armure et 3 tours de paralysie. Heureusement, ces rochers ne vous blessent pas, ni vous ni vos alliés.\n\nNombre de sorts actuels : %s

#新法术
actors.hero.spells.ascension_curse.name=Malédiction d'ascension
actors.hero.spells.ascension_curse.short_desc=Confère la lévitation au lanceur.
actors.hero.spells.ascension_curse.desc=Le lanceur récite une incantation pour devenir plus léger, lui permettant de léviter pendant _%1$d tours_.\n\nCe sort _consomme 1 tour_.

actors.hero.spells.divine_protection.name=Protection divine
actors.hero.spells.divine_protection.short_desc=Rend le lanceur invincible temporairement.
actors.hero.spells.divine_protection.desc=Le lanceur implore la protection divine via le saint tome, devenant invincible pendant _%1$d tours_.\n\nCe sort _consomme 1 tour_.

actors.hero.spells.shepherd_intention.name=Intention du berger
actors.hero.spells.shepherd_intention.short_desc=Fait apparaître un troupeau de moutons magiques à un endroit désigné.
actors.hero.spells.shepherd_intention.desc=Le lanceur canalise son mana via le saint tome pour invoquer... un troupeau de moutons magiques ? Bon, au moins ils sont immortels.\n\nCe sort _consomme 1 tour_.

actors.hero.spells.conversion_holy.name=Conversion sacrée
actors.hero.spells.conversion_holy.short_desc=Convertit une cible.
actors.hero.spells.conversion_holy.no_target=Aucune cible pouvant être convertie.
actors.hero.spells.conversion_holy.desc=Le lanceur peut manifester la puissance du saint tome, convertissant la cible à la foi sacrée et en faisant un loyal serviteur.\n\nLes ennemis convertis par ce sort ne produisent aucun butin.\n\nCe sort _consomme 1 tour_.

actors.hero.spells.purifying_evil.name=Purification du mal
actors.hero.spells.purifying_evil.short_desc=Purifie une cible.
actors.hero.spells.purifying_evil.no_target=Aucune cible pouvant être purifiée.
actors.hero.spells.purifying_evil.desc=Le lanceur utilise la puissance sacrée du saint tome pour purifier un ennemi, dissipant ses bonus, pouvant même annuler les effets d'élite et blesser les morts-vivants et démons.\n\nCe sort _consomme 1 tour_.

actors.hero.spells.divine_storm.name=Tempête du domaine divin
actors.hero.spells.divine_storm.short_desc=Génère un puissant domaine divin pour juger les ennemis.
actors.hero.spells.divine_storm.desc=Le lanceur utilise le saint tome pour générer un puissant domaine divin qui paralyse et brûle les ennemis.\n\nCe sort _consomme 1 tour_.

actors.hero.spells.genesis.name=Genèse
actors.hero.spells.genesis.short_desc=Réinitialise les talents du personnage.
actors.hero.spells.genesis.desc=Le lanceur se remodèle, comme Dieu créant le monde.\n\nCe sort _consomme 1 tour_.

actors.hero.spells.indulgence.name=Indulgence
actors.hero.spells.indulgence.short_desc=Dépense de l'or pour restaurer les charges du saint tome.
actors.hero.spells.indulgence.desc=Le lanceur dépense _%1$d pièces d'or_ pour se laver de ses péchés et restaurer les charges du saint tome.\n\nCe sort _consomme 1 tour_.\n\nCe sort est inefficace sur les copies du saint tome.
actors.hero.spells.indulgence.no_tome=Pas de saint tome, votre repentance est vaine.

actors.hero.spells.silver_language.name=Parole argentée
actors.hero.spells.silver_language.short_desc=Rend la cible furieuse temporairement.
actors.hero.spells.silver_language.no_target=Aucune cible ne deviendra furieuse.
actors.hero.spells.silver_language.desc=Le lanceur récite des passages du saint tome à voix haute, brisant les défenses de la cible et la rendant furieuse _%1$d tours_.\n\nCe sort _consomme 1 tour_.

actors.hero.spells.resurrection.name=Résurrection
actors.hero.spells.resurrection.short_desc=La cible ressuscite en cas de mort rapide.
actors.hero.spells.resurrection.no_target=Impossible d'appliquer ce sort sur cette cible.
actors.hero.spells.resurrection.desc=Le lanceur utilise la puissance du saint tome pour appliquer une puissante résurrection sur lui-même ou un allié. En cas de mort rapide, la cible ressuscite.\n\nCe sort _consomme 1 tour_.
actors.hero.spells.resurrection$resurrection.name=Résurrection
actors.hero.spells.resurrection$resurrection.desc=Ce personnage ressuscitera s'il meurt !\n\nLes alliés affectés par cet effet ressuscitent en pleine forme s'ils meurent pendant la durée.\n\nSi le héros est affecté, il ressuscite également avec 1 PV minimum.\n\nTours restants : %s

actors.hero.spells.traitorous_spell.name=Sorcellerie du traître
actors.hero.spells.traitorous_spell.short_desc=Libère un effet de bâton maudit.
actors.hero.spells.traitorous_spell.desc=Le lanceur utilise la sorcellerie du Bélu aimé pour appliquer une malédiction aléatoire sur la cible.\n\nCe sort _consomme 1 tour_.

actors.hero.spells.sprint_spell.name=Sort de célérité
actors.hero.spells.sprint_spell.short_desc=Confère la célérité au lanceur.
actors.hero.spells.sprint_spell.desc=Le lanceur peut libérer un sort pour obtenir une vitesse fulgurante, lui conférant _%1$d tours de célérité_.\n\nCe sort _consomme 1 tour_.

actors.hero.spells.focus_light.name=Rayon focalisé
actors.hero.spells.focus_light.short_desc=Émet un rayon à haute température, brûlant tout sur son passage.
actors.hero.spells.focus_light.desc=Le lanceur émet un rayon à haute température infligeant _%1$d~%2$d dégâts_ et enflammant la trajectoire et la cible.\n\nCe sort _consomme 1 tour_.

actors.hero.spells.zhuanyu_spell.name=Conversion curative
actors.hero.spells.zhuanyu_spell.short_desc=Convertit le bouclier en soins.
actors.hero.spells.zhuanyu_spell.desc=Convertit _%d%%_ du bouclier du lanceur en soins, sans dépasser la moitié de ses PV maximaux.\n\nCe sort _consomme 1 tour_.

actors.hero.spells.thorn_whip.name=Fouet épineux
actors.hero.spells.thorn_whip.short_desc=Attire la cible et inflige un saignement.
actors.hero.spells.thorn_whip.no_target=Aucune cible à attirer ou cible impossible à attirer.
actors.hero.spells.thorn_whip.more_distance=Trop loin, impossible d'atteindre.
actors.hero.spells.thorn_whip.desc=Le lanceur matérialise un fouet doré épineux, attirant la cible et infligeant _un saignement d'intensité %1$d_.\n\nLa portée de ce sort est de _12 cases_.\n\nCe sort _consomme 1 tour_.

actors.hero.spells.revelation.name=Révélation
actors.hero.spells.revelation.short_desc=Augmente le niveau des talents positifs.
actors.hero.spells.revelation.desc=Le lanceur reçoit l'illumination divine, gagnant _%1$d tours de révélation_, augmentant de _+1 le niveau d'effet_ de tous ses talents positifs.\n\nLe niveau d'effet ne peut dépasser le niveau maximum.\n\nCe sort _ne consomme pas de temps_.
actors.hero.spells.revelation$revelationbuff.name=Révélation
actors.hero.spells.revelation$revelationbuff.desc=Vous sentez que vous avez reçu l'illumination divine. Tous vos talents positifs gagnent +1 niveau d'effet.\n\nTours restants : %s tours

actors.hero.spells.holy_grenade.name=Grenade sacrée
actors.hero.spells.holy_grenade.short_desc=Provoque une explosion blessant les ennemis.
actors.hero.spells.holy_grenade.desc=Le lanceur lance une boule d'énergie lumineuse, infligeant instantanément _%2$d~%3$d dégâts_ dans une zone _%1$dx%1$d_. Les morts-vivants et démons subissent toujours les dégâts maximaux.\n\nCe sort _consomme 1 tour_.

actors.hero.spells.blade_star.name=Escalier de lames
actors.hero.spells.blade_star.short_desc=Crée une zone de lames blessant et infirmant les ennemis.
actors.hero.spells.blade_star.desc=Le lanceur matérialise la Lumière sacrée en lames, créant une zone de _%1$dx%1$d_ cases. Les ennemis dans cette zone subissent _4~8 dégâts_ et _3 tours d'infirmité_. La zone dure _10 tours_.\n\nCe sort _consomme 1 tour_.
actors.hero.spells.blade_star.invalid_target=Impossible de créer une zone de lames à cet endroit.
actors.hero.spells.blade_star$blade_stair.name=Zone de lames
actors.hero.spells.blade_star$blade_stair.desc=Zone de lames infligeant des dégâts continus et ralentissant les ennemis.

actors.hero.spells.sacred_blade.name=Lame sacrée
actors.hero.spells.sacred_blade.short_desc=Lance un boomerang de Lumière sacrée infligeant des dégâts magiques.
actors.hero.spells.sacred_blade.desc=Le lanceur lance un boomerang de Lumière sacrée infligeant des _dégâts magiques basés sur l'arme tenue_. Les morts-vivants et démons subissent des dégâts supplémentaires.\n\nCe sort _consomme 1 tour_.

actors.hero.spells.equipment_bless.name=Bénédiction d'équipement
actors.hero.spells.equipment_bless.short_desc=Améliore toutes les armes et armures.
actors.hero.spells.equipment_bless.desc=Le lanceur peut bénir toutes ses armes et armures, augmentant temporairement leur niveau.\n\nCe sort _consomme 1 tour_.
actors.hero.spells.equipment_bless$blessbuff.name=Bénédiction d'équipement
actors.hero.spells.equipment_bless$blessbuff.desc=Vous sentez que votre équipement a été béni.\n\nPendant cet effet, le niveau de toutes vos armes et armures est temporairement augmenté.\n\nTours restants : %s tours

actors.hero.spells.hotlight.name=Lumière brûlante
actors.hero.spells.hotlight.short_desc=Libère une lumière aveuglante.
actors.hero.spells.hotlight.desc=Le lanceur libère une lumière brûlante, _aveuglant 3 tours_ tous les ennemis dans son champ de vision, et enflamme directement les morts-vivants et démons.\n\nCe sort _consomme 1 tour_.


actors.hero.heroclass.freeman=Gentleman
actors.hero.heroclass.freeman_desc_short=Le Gentleman _a plus de potentiel à débloquer_ et commence avec une _mallette_ unique.
actors.hero.heroclass.freeman_desc=Le Gentleman commence avec une _mallette unique_, lui permettant d'obtenir des objets ou capacités spéciaux.\n\nLe Gentleman n'a pas d'entraînement au combat et peu de capacités martiales, mais il _a un potentiel illimité à débloquer_.\n\nIl commence également avec _une canne_, _une pièce d'argent porte-bonheur_, une armure en tissu, une gourde et un sac en tissu.\n\nObjets identifiés au début :\n_-_Potion d'expérience\n_-_Parchemin de métamorphose, d'identification et de transmutation
actors.hero.heroclass.freeman_unlock=_Utiliser un parchemin de métamorphose pour transformer un talent_ pour débloquer le Gentleman.
actors.hero.herosubclass.freeman=Gentleman
actors.hero.herosubclass.freeman_short_desc=_Le Gentleman_ ne tire pas plus de puissance du masque du Tengu, mais il a encore du potentiel à débloquer.
actors.hero.herosubclass.freeman_desc=Le Gentleman ne tire pas beaucoup de puissance du masque du Tengu, mais quand le masque se brise, il gagne un parchemin de métamorphose supplémentaire.\n\nDe plus, il a encore plus de potentiel à débloquer.


actors.blobs.pheromone.desc=Une phéromone imprègne la zone, désorientant le héros et renforçant les alliés des disciples de Slaanesh.
actors.mobs.chaosdisciples$succboss.name=Disciple de Slaanesh
actors.mobs.chaosdisciples$succboss.desc=Le disciple de Slaanesh était autrefois un succube, un ami du petit démon. Pour aider le petit démon à réaliser ses ambitions et à acquérir une puissance redoutable, il est devenu un disciple de Slaanesh, le dieu du Chaos.\n\nLe disciple de Slaanesh a la capacité d'invoquer de nombreux succubes pour combattre à ses côtés, mais heureusement, cette capacité ne peut être utilisée que de temps à autre. De plus, il peut libérer des phéromones gazeuses qui annulent les effets d'absorption ou de dévouement des unités ennemies sur le héros, leur conférant un soin et un afflux hormonal, tout en charmant le héros et ses alliés.
actors.mobs.chaosdisciples$summoncooldown.name=Invocation de succubes - Refroidissement
actors.mobs.chaosdisciples$summoncooldown.desc=Le disciple de Slaanesh vient d'invoquer des succubes. Il devra attendre avant de pouvoir réinvoquer.\n\nRefroidissement restant : %s tour(s)
actors.mobs.chaosdisciples$scorpioboss.name=Disciple de Nurgle
actors.mobs.chaosdisciples$scorpioboss.desc=Le disciple de Nurgle était autrefois un scorpion géant, un ami du petit démon. Pour aider le petit démon à réaliser ses ambitions et à acquérir une puissance redoutable, il est devenu un disciple de Nurgle, le dieu du Chaos.\n\nLe disciple de Nurgle excelle à propager la peste, diffusant des gaz viraux mortels autour de lui. De plus, il possède une défense puissante qui rend difficile de lui infliger des dégâts physiques ou magiques, et peut même renvoyer les dégâts physiques à distance. Cependant, il _semble plus vulnérable à certains dégâts élémentaires_.
actors.mobs.chaosdisciples$scorpioboss.fire=Feu ! Feu ! J'ai si chaud !
actors.mobs.chaosdisciples$eyeboss.name=Disciple de Tzeentch
actors.mobs.chaosdisciples$eyeboss.desc=Le disciple de Tzeentch était autrefois un mauvais œil, un ami du petit démon. Pour aider le petit démon à réaliser ses ambitions et à acquérir une puissance redoutable, il est devenu un disciple de Tzeentch, le dieu du Chaos.\n\nLe disciple de Tzeentch est une créature rusée. De temps à autre, il peut tirer des lasers mortels comme un dieu ancien. De plus, il peut lancer une magie noire terrifiante pour perturber l'esprit du héros, et se téléporte aléatoirement après avoir subi une attaque.
actors.mobs.chaosdisciples$ripperboss.name=Disciple de Khorne
actors.mobs.chaosdisciples$ripperboss.desc=Le disciple de Khorne était autrefois un déchiqueteur, un ami du petit démon. Pour aider le petit démon à réaliser ses ambitions et à acquérir une puissance redoutable, il est devenu un disciple de Khorne, le dieu du Chaos.\n\nLe disciple de Khorne est un être belliqueux, expert en combat rapproché. Il gagne des bonus et des effets de combo en mêlée et lorsqu'il est touché, renforçant encore sa terrible mobilité et sa fréquence d'attaque. Pas moins de 56 héros sont morts sous ses coups.
actors.mobs.chaosdisciples$ripperboss.combo=Le disciple de Khorne a actuellement %d combo(s)
actors.mobs.chaosdisciples$ripperboss.combotime=, temps de combo restant : %s tour(s)

actors.mobs.npcs.greatimp.name=Petit démon ?
actors.mobs.npcs.greatimp.newyear=Bonne année ! Tu me demandes pourquoi je suis ici ? Ce n'est pas important, va vite chercher l'amulette !
actors.mobs.npcs.greatimp.hello=Surprise ! Tu me demandes pourquoi je suis ici ? Ce n'est pas important, va vite chercher l'amulette !
actors.mobs.npcs.greatimp.amulet=Tu as l'amulette ? Alors rentre vite chez toi fêter le Nouvel An avec ta famille !
#fix9：文案更改
actors.mobs.npcs.greatimp.warning=Il semble que tu m'as découvert. Je suis venu ici pour m'emparer du pouvoir restant du dieu ancien Yog-Dzewa afin de commander toutes les légions démoniaques. Ensuite, je régnerai sur ce donjon, puis je conquerrai le monde entier ! Vas-tu t'opposer à moi pour une résistance futile, ou préfères-tu t'en aller sagement pour profiter du reste de ta vie ?
actors.mobs.npcs.greatimp.yes=Arrête-le !
actors.mobs.npcs.greatimp.no=Rien à voir avec moi
actors.mobs.npcs.greatimp.time=Les gars, en avant ! Gagnez du temps pour moi !
actors.mobs.npcs.greatimp.desc=On ne sait pas pourquoi, mais le petit démon est venu jusqu'ici.
actors.mobs.npcs.greatimp.die=Merci pour le temps que vous m'avez accordé. Maintenant, je suis invincible !
actors.mobs.npcs.greatimp.nothing=......

actors.mobs.greatdemon.name=Grand démon
actors.mobs.greatdemon.desc=Le petit démon, après avoir absorbé le pouvoir des dieux anciens, a développé de longues cornes, une barbe et des ailes... On ne peut plus l'appeler petit démon, il faut l'appeler grand démon.\n\nLe grand démon possède un corps robuste. De temps à autre, il peut résister et renvoyer certaines attaques. En raison de son manque de connaissances en magie de combat, il a du mal à lancer divers sorts, mais ses capacités de mêlée sont redoutables. Il peut également invoquer d'autres démons mineurs pour l'assister au combat.
actors.mobs.greatdemon.die=Ce pouvoir... comment peut-il être si fragile ? À la prochaine fois !
actors.mobs.greatdemon.throw=Viens essayer ma Lance de Longinus !
actors.mobs.greatdemon.melee=Prends ça, tranche démoniaque !
actors.mobs.greatdemon.summon=Répondez à mon appel, démons !
actors.mobs.greatdemon.defence=Peau durcie ! Ni les lames ni les lances ne peuvent m'atteindre !
actors.mobs.greatdemon.haste=Le grand démon bat rapidement ses ailes démoniaques et vole à une vitesse fulgurante.
actors.mobs.greatdemon.magic=Protection magique, activée !
actors.mobs.greatdemon.missiles=Barrière magique, renvoie toutes les flèches pour moi !
actors.mobs.greatdemon$summoncooldown.name=Invocation démoniaque - Refroidissement
actors.mobs.greatdemon$summoncooldown.desc=Le grand démon vient d'invoquer 2 démons mineurs. Il devra attendre avant de pouvoir réinvoquer.\n\nRefroidissement restant : %s tour(s)
actors.mobs.greatdemon$hastecooldown.name=Ailes démoniaques accélérées - Refroidissement
actors.mobs.greatdemon$hastecooldown.desc=Le grand démon vient de battre violemment ses ailes démoniaques pour gagner de la vitesse. Il a besoin de se reposer un moment.\n\nRefroidissement restant : %s tour(s)
actors.mobs.greatdemon$magiccooldown.name=Défense magique - Refroidissement
actors.mobs.greatdemon$magiccooldown.desc=La défense magique ne peut être maintenue qu'un certain temps. Il faudra attendre avant de pouvoir l'activer à nouveau.\n\nRefroidissement restant : %s tour(s)
actors.mobs.greatdemon$meleescooldown.name=Peau épineuse - Refroidissement
actors.mobs.greatdemon$meleescooldown.desc=La peau épineuse ne peut être maintenue qu'un certain temps. Il faudra attendre avant de pouvoir l'activer à nouveau.\n\nRefroidissement restant : %s tour(s)
actors.mobs.greatdemon$missilescooldown.name=Renvoi de projectiles - Refroidissement
actors.mobs.greatdemon$missilescooldown.desc=Le renvoi de projectiles ne peut être maintenu qu'un certain temps. Il faudra attendre avant de pouvoir l'activer à nouveau.\n\nRefroidissement restant : %s tour(s)
actors.mobs.greatdemon$throwcooldown.name=Lance de Longinus - Refroidissement
actors.mobs.greatdemon$throwcooldown.desc=La Lance de Longinus vient d'être lancée par le grand démon. Il devra attendre avant de pouvoir la relancer.\n\nRefroidissement restant : %s tour(s)
actors.mobs.greatdemon$meleesdefence.name=Peau épineuse
actors.mobs.greatdemon$meleesdefence.desc=Réduit considérablement les dégâts de mêlée subis pendant un certain temps et renvoie une partie des dégâts à l'attaquant.\n\nTours restants : %s tour(s)
actors.mobs.greatdemon$missilesdefence.name=Renvoi de projectiles
actors.mobs.greatdemon$missilesdefence.desc=Rend complètement immunisé aux dégâts des armes de jet pendant un certain temps et contre-attaque l'attaquant par la magie.\n\nTours restants : %s tour(s)

actors.mobs.landpiranha.name=Piranha terrestre géant
actors.mobs.landpiranha.desc=Le piranha géant, sous l'effet d'une force magique étrange, a développé des pattes et peut respirer dans l'air. Peut-être qu'affaiblir un certain talent lui permettrait de retrouver son état d'origine.
actors.mobs.landpiranha.discover_hint=Vous pouvez rencontrer cet ennemi dans n'importe quelle zone du donjon après avoir acquis un certain talent négatif.
actors.mobs.phantomlandpiranha.name=Piranha terrestre fantôme
actors.mobs.phantomlandpiranha.desc=Le piranha terrestre fantôme est une rare variante du piranha fantôme, déformé par une magie étrange. Il possède un corps semi-transparent inquiétant et des capacités magiques. Il peut se téléporter lorsqu'il est attaqué, ce qui lui permet d'attaquer ou de fuir !\n\nBien que difficile à affronter, sa chair est très prisée pour ses propriétés magiques.
actors.mobs.phantomlandpiranha.discover_hint=Vous pouvez rencontrer cet ennemi dans n'importe quelle zone du donjon après avoir acquis un certain talent négatif.
actors.mobs.teststatue.name=Statue de test
actors.mobs.teststatue.desc=Une statue dont on ignore qui l'a placée ici. Elle a l'air très résistante. Vous ne pouvez pas vous empêcher de la frapper.

actors.mobs.goldboss$monkmaster.name=Maître moine
actors.mobs.goldboss$monkmaster.desc=Le Maître moine est le summum de l'art martial nain. Personne n'a jamais vu la limite de ses capacités.\n\nPeu importe la vitesse de son adversaire, le Maître moine est toujours plus rapide. Le Maître moine déteste les stratagèmes vils. Il vaut mieux ne pas le provoquer.
actors.mobs.goldboss$monkmaster.missileweapon=Ah, tu joues sale, hein ? Alors viens donc !

actors.mobs.goldboss$goldelemental.name=Élémentaire d'or
actors.mobs.goldboss$goldelemental.desc=L'Élémentaire d'or est une créature élémentaire invoquée par le propriétaire de la boutique selon la méthode des esprits élémentaires laissée par le roi nain.\n\nL'Élémentaire d'or peut lui-même utiliser la méthode des esprits élémentaires pour invoquer d'autres créatures élémentaires, et peut également drainer la richesse du héros pour son propre usage, voire créer de la richesse à partir de rien.
actors.mobs.goldboss$goldelemental.steal=L'Élémentaire d'or a drainé 300 pièces d'or de votre personne.
actors.mobs.goldboss$goldelemental.give=L'Élémentaire d'or a créé 400 pièces d'or dans votre sac à partir de rien.
actors.mobs.goldboss$goldgolem.name=Golem d'or
actors.mobs.goldboss$goldgolem.desc=Le Golem d'or est un golem modifié par le propriétaire de la boutique, entièrement fait d'or, bien plus imposant qu'un golem ordinaire.\n\nComparé à un golem ordinaire, le Golem d'or a perdu sa capacité de téléportation, mais possède des attributs d'attaque et de défense bien supérieurs. Il peut également libérer instantanément un champ électrique à haute tension pour paralyser les créatures, et même écraser les créatures magiques en un instant.
actors.mobs.goldboss$goldgolem.electricity=Débordement d'énergie, libération !
actors.mobs.goldboss$electricitycooldown.name=Champ électrique - Refroidissement
actors.mobs.goldboss$electricitycooldown.desc=Le Golem d'or vient de libérer un champ électrique. Il devra attendre avant de pouvoir le relâcher.\n\nRefroidissement restant : %s tour(s)

actors.mobs.goldboss$thymor.name=Grand archimage Thymor
actors.mobs.goldboss$thymor.desc=Thymor est un éminent sorcier nain. Il a collaboré avec le Maître moine pour tenter de renverser le règne du roi nain. Après avoir vu la terreur de la légion de démons menée par Yog-Dzewa, il s'est finalement soumis au roi nain et a combattu les démons sur le front. Aujourd'hui, après la mort du roi nain, il s'est allié au propriétaire de la boutique pour tenter de s'emparer de votre amulette Yendor afin de restaurer la cité naine en décomposition.\n\nThymor excelle dans l'utilisation de la magie noire et des sorts de malédiction de zone. Certains l'ont vu anéantir instantanément d'immenses légions démoniaques.
actors.mobs.goldboss$thymor.curse=Wabi wabi, wabi babou.
actors.mobs.goldboss$thymor.cursedo=Gili goulou, libération !
actors.mobs.goldboss$thymor.bolt_kill=Vous avez été tué par la puissante magie noire de Thymor...
actors.mobs.goldboss$sheepcursecooldown.name=Sort de mort de zone - Refroidissement
actors.mobs.goldboss$sheepcursecooldown.desc=Le sort de mort peut tuer instantanément les créatures ennemies, mais le héros est immunisé contre cet effet.\n\nRefroidissement restant : %s tour(s)
actors.buffs.mostdegrade.name=Malédiction de dégradation majeure
actors.buffs.mostdegrade.desc=Une puissante magie noire dévore la magie infusée par les parchemins d'amélioration dans ton équipement !\n\nLes objets dégradés sont considérés comme ayant un niveau inférieur à leur niveau d'origine. _Tout objet, quel que soit son niveau d'origine, est réduit au niveau 0_. La description des objets change également en fonction de l'effet de la dégradation.\n\nCependant, la dégradation n'affecte pas les prérequis de force, les charges des bâtons, la durabilité des armes de jet ni les artefacts.\n\nDurée restante de la dégradation : %s tours\n\nLa dégradation infligée par Timour est non seulement plus puissante, mais aussi impossible à dissiper avec un parchemin d'exorcisme.


actors.mobs.npcs.shopboss.name=Propriétaire ?
actors.mobs.npcs.shopboss.hello=Trésors, pièces d'or, hé hé (bave), ce voyage n'aura pas été vain.
actors.mobs.npcs.shopboss.warning=Quoi ? Tu veux aussi voler mes trésors ? Ne crois pas que tu es si formidable avec cette soi-disant amulette. Si tu es raisonnable, dégage maintenant, de toute façon cette amulette sera bientôt à moi (rire sournois).
actors.mobs.npcs.shopboss.yes=Bien sûr, quand on a de l'argent, on le partage !
actors.mobs.npcs.shopboss.no=Rien à voir avec moi
actors.mobs.npcs.shopboss.desc=Il semble que le propriétaire de la boutique vous ait suivi jusqu'ici. Il regarde partout autour de lui, comme s'il cherchait quelque chose.

actors.mobs.greatshoper.name=Propriétaire
actors.mobs.greatshoper.desc=Le propriétaire de la boutique, que vous n'aviez pas vu depuis un moment, est devenu méconnaissable. Son expression et son attitude révèlent toute sa cupidité et sa joie, ainsi que son hostilité envers vous.\n\nLe propriétaire a utilisé les arts secrets de la bibliothèque naine pour se transformer en un état immunisé contre toute magie, utilisant l'argent comme arme. Il s'est également allié avec les puissants nains survivants pour former son groupe d'intérêt.
actors.mobs.greatshoper$goldcurse.name=Malédiction d'or
actors.mobs.greatshoper$goldcurse.desc=La Malédiction d'or est l'un des arts interdits laissés par les nains. C'est une malédiction puissante qui ne peut être levée qu'en tuant celui qui l'a lancée. Mais le propriétaire de la boutique a modifié le nom de cet art interdit de son propre chef.\n\nSous l'effet de la Malédiction d'or, le héros perd 10 pièces d'or par tour. Si le nombre de pièces d'or est inférieur à 100, il perd 5 points de vie par tour, et les alliés perdent 5 points de vie par tour.\n\nLa Malédiction d'or convertit les dégâts provenant d'autres sources en dégâts différés, rendant difficile pour la victime d'y échapper.
actors.mobs.greatshoper.gold_kill=Vous avez été tué par des pièces d'or...
actors.mobs.greatshoper.no_damage=Inutile. Avec ce bouclier magique, tu ne peux pas me toucher.
actors.mobs.greatshoper.summon=Élémentaire d'or, Maître moine, bloquez cette personne pour moi !
actors.mobs.greatshoper.summon1=Deux bons à rien ! Thymor, protège-moi.
actors.mobs.greatshoper.phase4=Thymor ne peut pas t'arrêter non plus ? Alors, que tu périsses avec ces trésors !
actors.mobs.greatshoper.die=Trésor ! Mon trésor !

#新精英强敌描述
actors.buffs.championenemy$corrosion.name=Élite corrosif
actors.buffs.championenemy$corrosion.desc=Attaque au corps à corps +100% et effet de boue corrosive, projette de la boue corrosive autour d'elle à la mort.
actors.buffs.championenemy$haste.name=Élite rapide
actors.buffs.championenemy$haste.desc=Vitesse d'attaque au corps à corps +100%, vitesse de déplacement +50%.
actors.buffs.championenemy$holy.name=Élite sacré
actors.buffs.championenemy$holy.desc=Dégâts subis -25%, réapparaît après la mort avec 25% de ses PV max et obtient l'invulnérabilité pendant 5 tours, perd la propriété d'élite sacrée après la résurrection.
actors.buffs.championenemy$transform.name=Élite transformé
actors.buffs.championenemy$transform.desc=Dégâts subis -25%, réapparaît après la mort avec 33% de ses PV max en tant qu'ennemi aléatoire de la zone, perd la propriété d'élite de transformation après la résurrection et obtient une propriété d'élite aléatoire.

actors.mobs.warriorboss.name=Guerrier ?
actors.mobs.warriorboss.desc=Les dieux anciens maléfiques excellent à saisir les désirs les plus profonds des gens et les incitent à emprunter la voie des ténèbres. Quant au Guerrier... il veut maintenant dévorer toute créature qu'il voit.\n\nLe Guerrier ? maîtrise les techniques de combat du berserker et du gladiateur, et peut même utiliser le Bond héroïque.\n\nAvant qu'il ne s'apprête à bondir, il existe peut-être un moyen de _détourner son attention_, comme... _de la nourriture_ ?
actors.mobs.warriorboss$berserk.name=Rage
actors.mobs.warriorboss$berserk.angered_desc=Le Guerrier ? voit sa puissance d'attaque augmenter selon ses blessures. Lorsqu'il subit des dégâts physiques, il accumule de la rage, ce qui lui confère une plus grande puissance d'attaque.\n\nLa rage diminue avec le temps. Plus les points de vie du Guerrier ? sont bas, plus la rage persiste longtemps.\n\nRage actuelle : _%.0f%%_\n_+%.0f%%_ de dégâts
actors.mobs.warriorboss$combo.name=Combo
actors.mobs.warriorboss$combo.desc=Le Guerrier ? gagne en efficacité en enchaînant les coups sur son adversaire. Chaque attaque réussie augmente le compteur de combo de 1, mais ne pas attaquer pendant un certain temps réinitialise le compteur à zéro.\n\nLorsque le compteur de combo atteint un certain seuil, le Guerrier ? active la parade, obtenant un énorme bouclier et esquivant obligatoirement la prochaine attaque subie. Activer la parade réinitialise le compteur de combo.\n\nCombo actuel : %1$d\n\nLe combo sera perdu dans %2$s tour(s).
actors.mobs.warriorboss.eat=Cette nourriture est vraiment délicieuse.
actors.mobs.warriorboss.def=Je suis aussi très agile !
actors.mobs.warriorboss.wantjump=Maudit, tu te moques de mes petites jambes ?!
actors.mobs.warriorboss.wantfood=De la nourriture, de la délicieuse nourriture !
actors.mobs.warriorboss.leap=« Viande-Œuf-Poulet » !
actors.mobs.warriorboss.defeated=Il y a... encore tant de plats à déguster...
actors.mobs.warriorboss.wake=Quoi ? On passe à table ?
actors.mobs.warriorboss.kill=Vous avez été écrasé comme une galette par le Guerrier ?...

actors.mobs.rogueboss.name=Voleur ?
actors.mobs.rogueboss.desc=Les dieux anciens maléfiques excellent à saisir les désirs les plus profonds des gens et les incitent à emprunter la voie des ténèbres. Quant au Voleur... il tient le masque de Tengu, fou de joie d'avoir accompli sa mission. Il semble que le Tengu au bout du couloir ait été tué par lui.\n\nLe Voleur ? excelle dans les embuscades mortelles depuis l'ombre. Lorsque la situation lui est défavorable, il utilise son agilité pour s'éloigner rapidement et attaque avec des shurikens.\n\nLorsqu'il se fond dans l'ombre, vous ne pouvez pas l'attaquer au corps à corps, mais vous pouvez _essayer de l'attaquer à distance_.
actors.mobs.rogueboss.notice=Haha, une autre proie au bout de l'hameçon !
actors.mobs.rogueboss.invisibility=Essaie de m'attraper !
actors.mobs.rogueboss.execute=Prends ça !

actors.mobs.huntressboss.name=Chasseresse ?
actors.mobs.huntressboss.desc=La corruption des dieux anciens a aiguisé l'instinct de chasse de la Chasseresse ? en une obsession impitoyable. Les dégâts qu'elle subit par attaque ne dépassent pas 30. Lorsque sa proie quitte son champ de vision, elle la suit activement jusqu'à sa dernière position. Une fois au corps à corps, elle combat en mêlée, sinon elle utilise son arc ou cherche un abri. En phase de Tireuse d'élite, chaque tir normal ignore totalement l'armure. Tous les trois tirs normaux, elle prépare une flèche perforante. Lorsque sa vie tombe sous la moitié, elle passe en phase de Gardienne : ses flèches normales ne percent plus l'armure mais peuvent appliquer des effets de plante nuisible à la cible. Sa vision traverse les herbes hautes, et elle peut piétiner les plantes pour obtenir un bonus temporaire de Gardienne.
actors.mobs.huntressboss.discover_hint=Vous pouvez trouver ce boss à la fin d'une zone du donjon.
actors.mobs.huntressboss.gale_aim=Le vent a mémorisé ton point de chute.
actors.mobs.huntressboss.warden=Alors que toute l'arène s'enracine !
actors.mobs.huntressboss.defeated=Cette chasse... s'arrête ici.
actors.mobs.huntressboss.boon_blindweed=Herbe aveuglante, masque ma silhouette.
actors.mobs.huntressboss.boon_earthroot=Racine terrestre, affermis ma démarche.
actors.mobs.huntressboss.boon_fadeleaf=Feuille d'effacement, perturbe cette chasse.
actors.mobs.huntressboss.boon_firebloom=Fleur de feu, enflamme mes flèches.
actors.mobs.huntressboss.boon_icecap=Glace couronnée, gèle mes flèches.
actors.mobs.huntressboss.boon_mageroyal=Sang royal, purifie mon corps.
actors.mobs.huntressboss.boon_sorrowmoss=Mousse de chagrin, empoisonne mes flèches.
actors.mobs.huntressboss.boon_starflower=Fleur d'étoile, guide mon viseur.
actors.mobs.huntressboss.boon_stormvine=Liane de tempête, soulève mes pas.
actors.mobs.huntressboss.boon_sungrass=Herbe de soleil, guérit mes blessures.
actors.mobs.huntressboss.boon_swiftthistle=Chardon rapide, accélère cette chasse.

actors.mobs.huntressboss$distractinghawk.name=Faucon perturbateur
actors.mobs.huntressboss$distractinghawk.desc=Un faucon spectral fragile invoqué par la Chasseresse ? pour immobiliser sa proie. Ses serres n'infligent qu'1 point de dégât, mais chaque coup aveugle et estropie brièvement la cible.
actors.mobs.huntressboss$distractinghawk.discover_hint=Vous pouvez rencontrer cet ennemi lors du combat contre le boss Chasseresse ?.

actors.mobs.huntressboss$huntresstentacle.name=Tentacule de l'arène
actors.mobs.huntressboss$huntresstentacle.desc=De faibles tentacules éveillés lorsque la Chasseresse ? entre en phase de Gardienne. Ils obstruent le passage et fouettent les cibles qui s'approchent, exerçant une pression constante sur le joueur.
actors.mobs.huntressboss$huntresstentacle.discover_hint=Vous pouvez rencontrer cet ennemi pendant la phase de Gardienne de la Chasseresse ?.
actors.mobs.rogueboss.angered=Maudit... Dans ce cas...
actors.mobs.rogueboss.enraged=Enragé
actors.mobs.rogueboss.momentum=Tu peux encore suivre mon rythme ?
actors.mobs.rogueboss.momentum-recovery=Ouf, je suis épuisé...
actors.mobs.rogueboss.kill=Vous avez été tué par les ruses du Voleur ?...
actors.mobs.rogueboss.rankings_desc=Vous avez été tué par les ruses du Voleur ?...
actors.mobs.rogueboss.spkill=Vous avez été exécuté par le Voleur ?...
actors.mobs.rogueboss.executeninja=Voleur ? : « Ninja, ne m'en veux pas pour ma lâcheté... »
actors.mobs.rogueboss.defeated=Impossible... plus fort que Tengu...
actors.mobs.rogueboss$absoluteinvisibility.name=Ombre furtive
actors.mobs.rogueboss$absoluteinvisibility.spname=Phase de préparation
actors.mobs.rogueboss$absoluteinvisibility.desc=Le Voleur ? utilise sa Cape d'ombre pour devenir invisible.\n\nDans cet état, vous ne pouvez pas attaquer le Voleur ? au corps à corps directement, mais il sortira immédiatement de son invisibilité s'il subit une attaque à distance.\n\nLorsque ses points de vie actuels sont supérieurs à la moitié de ses points de vie maximum, le Voleur ? invisible entre en phase de préparation pour vous exécuter après 10 tours. Lorsque ses points de vie actuels sont inférieurs à la moitié de ses points de vie maximum, la durée de son effet d'élan ne diminue pas naturellement.\n\nDurée restante de l'Ombre furtive : %s tour(s)
actors.mobs.rogueboss$absoluteinvisibility.spdesc=Le Voleur ? attend patiemment, prêt à porter un coup fatal depuis l'ombre.\n\nAprès environ 10 tours de préparation, le Voleur ? foncera instantanément vers vous pour vous exécuter. Ce coup est imparable et particulièrement mortel ! Heureusement, toute attaque à distance de votre part l'interrompra et le fera sortir de sa phase de préparation.\n\nLe Voleur ? s'est préparé pendant %s tour(s).
actors.mobs.rogueboss$momentumtime.name=Élan
actors.mobs.rogueboss$momentumtime.spname=Repos
actors.mobs.rogueboss$momentumtime.desc=Le Voleur ? est en état d'élan. Pendant cette période, il se déplace à double vitesse et bénéficie d'une esquive, d'une précision et d'un bonus de dégâts accrus.\n\nHeureusement, chaque fois que le Voleur ? subit des dégâts, la durée de son élan est réduite de 3 tours. Une fois l'élan terminé, il aura besoin de se reposer avant de pouvoir réactiver cet état.\n\nDurée restante de l'effet : %s tour(s)
actors.mobs.rogueboss$momentumtime.spdesc=Le Voleur ? vient de sortir de son état d'élan. Il a maintenant besoin de se reposer un moment, pendant lequel il subira davantage de dégâts.\n\nMais ne vous y trompez pas : le Voleur ? accumule encore de l'élan pendant son repos. Une fois complètement rétabli, il entrera à nouveau en état d'élan.\n\nLe Voleur ? a besoin de %s tour(s) de repos.
actors.mobs.rogueboss$shadowrogue.name=Ombre reflet
actors.mobs.rogueboss$shadowrogue.desc=Un double du Voleur ? façonné par une ombre informe. Il reste immobile, les yeux vides, tandis qu'une fumée noire s'élève lentement autour de lui.\n\nCe n'est peut-être pas une copie parfaite, mais c'est un tueur compétent. Le Voleur ? l'a invoqué en situation d'urgence pour vous ralentir. En ce moment même, il vous fixe de ses yeux vides... c'est vraiment terrifiant.
actors.mobs.rogueboss$shadowrogue.discover_hint=Vous pouvez rencontrer cet ennemi dans une zone du donjon après avoir activé certains défis.


#slimegirl
actors.hero.talent$resilientarmor.name=Armure souple
actors.hero.talent$resilientarmor.desc=Vous sentez votre corps devenir plus souple, ainsi que votre armure.\n\nVous gagnez 0~3 armure supplémentaire pour les %1$d prochains coups subis.
actors.hero.talent.resilient_meal.title=Repas Résilient
actors.hero.talent.resilient_meal.desc=_+1：_Manger confère à la Fille Slime 0~3 points d'armure supplémentaires pour les _3 prochains coups_ subis.\n\n_+2：_Manger confère à la Fille Slime 0~3 points d'armure supplémentaires pour les _5 prochains coups_ subis.
actors.hero.talent.resilient_meal.comment=
actors.hero.talent.liquid_armor.title=Renforcement d'Armure Liquide
actors.hero.talent.liquid_armor.desc=_+1：_L'armure fournie par l'équipement du Slime Girl a _armure minimale +1_.\n\n_+2：_L'armure fournie par l'équipement du Slime Girl a _armure minimale +2_.
actors.hero.talent.liquid_armor.comment=

actors.hero.talent.tough_meal.title=Repas Résistant
actors.hero.talent.tough_meal.desc=_+1：_Manger confère à la Fille Slime un effet _Soin Herbal_ égal à _10% des PV perdus_, avec un minimum de _3 points_ et un maximum de _15 points_.\n\n_+2：_Manger confère à la Fille Slime un effet _Soin Herbal_ égal à _15% des PV perdus_, avec un minimum de _5 points_ et un maximum de _25 points_.
actors.hero.talent.tough_meal.comment=
actors.hero.talent.energy_absorption.title=Absorption d'Énergie
actors.hero.talent.energy_absorption.desc=_+1：_Les dégâts maximaux que le Slime Girl peut subir ne dépassent pas _16,7% de sa vie maximale_.\n\n_+2：_Les dégâts maximaux que le Slime Girl peut subir ne dépassent pas _12,5% de sa vie maximale_.
actors.hero.talent.energy_absorption.comment=L'effet de ce talent est déterminé après toutes les réductions de dégâts.
actors.hero.talent.energy_absorption.meta_desc=_Si un autre héros obtient ce talent_, au niveau +1, il subit au maximum 30% de sa vie maximale en dégâts ; au niveau +2, au maximum 20%.
actors.hero.talent.slime_greenhouse.title=Serre à Mucus
actors.hero.talent.slime_greenhouse.desc=_+1：_Les graines _ne consomment plus de tours_ pour germer dans le corps de la Fille Slime.\n\n_+2：_En plus de +1, la germination d'une graine restaure _30 points de satiété_.
actors.hero.talent.slime_greenhouse.comment=Si le défi Terres Désolées est activé, améliorer ce talent réduit le nombre de tours nécessaires pour qu'une graine germe dans le corps de 20 _à 15_.
actors.hero.talent.slime_greenhouse.meta_desc=_Si un autre héros obtient ce talent_, au niveau +1, il peut manger des graines pour restaurer 30 points de satiété ; au niveau +2, en plus de +1, il déclenche aussi l'effet de végétation correspondant à la graine.

actors.hero.talent.original_monster.title=Monstre Originel
actors.hero.talent.original_monster.desc=_+1：_La Fille Slime reçoit _50% de soin supplémentaire_ de l'effet _Soin Herbal_.\n\n_+2：_En plus de +1, avec l'effet _Soin Herbal_, la Fille Slime gagne aussi _33% de résistance élémentaire_.\n\n_+3：_En plus de +1 et +2, la Fille Slime _ne perd plus l'effet Soin Herbal en se déplaçant_.
actors.hero.talent.original_monster.comment=

actors.hero.herosubclass.waterslime=Slime d'eau
actors.hero.herosubclass.waterslime_short_desc=_La Slime d'eau_ a plus de PV maximaux et peut générer un mucus de slime après une attaque physique, dont l'absorption restaure des PV.
actors.hero.herosubclass.waterslime_desc=La Slime d'eau gagne 50% de ses PV maximaux en plus de son niveau actuel, et a un taux de régénération naturelle de 1% de ses PV maximaux (minimum 1).\n\nQuand elle subit une attaque physique, elle perd 10% de ses PV actuels et génère aléatoirement un mucus de slime dans une zone 9x9. L'absorption de ce mucus restaure 10% de ses PV maximaux.\n\nLa génération de mucus coûte au moins 1 PV (sans tuer la Slime d'eau) et a un temps de recharge de 30 tours, réduit de 1 tour à chaque attaque subie.
actors.hero.talent.water_body.title=Corps d'Eau
actors.hero.talent.water_body.desc=_+1：_La Fille Slime d'Eau gagne _100% du niveau actuel_ en vie maximale supplémentaire.\n\n_+2：_La Fille Slime d'Eau gagne _150% du niveau actuel_ en vie maximale supplémentaire.\n\n_+3：_La Fille Slime d'Eau gagne _200% du niveau actuel_ en vie maximale supplémentaire.
actors.hero.talent.water_body.comment=
actors.hero.talent.water_revival.title=Renaissance d'Eau
actors.hero.talent.water_revival.desc=_+1：_En absorbant du mucus de slime, la Fille Slime d'Eau restaure _12,5% de sa vie maximale_.\n\n_+2：_En absorbant du mucus de slime, la Fille Slime d'Eau restaure _15% de sa vie maximale_.\n\n_+3：_En plus de +2, la Fille Slime d'Eau ne consomme que _5% de sa vie actuelle_ pour produire du mucus de slime.
actors.hero.talent.water_revival.comment=
actors.hero.talent.water_regeneration.title=Régénération d'Eau
actors.hero.talent.water_regeneration.desc=_+1：_La Fille Slime d'Eau a un taux de régénération naturelle de _1,17% de sa vie maximale_ (minimum 1).\n\n_+2：_La Fille Slime d'Eau a un taux de régénération naturelle de _1,33% de sa vie maximale_ (minimum 1).\n\n_+3：_La Fille Slime d'Eau a un taux de régénération naturelle de _1,5% de sa vie maximale_ (minimum 1).
actors.hero.talent.water_regeneration.comment=
actors.hero.talent$slimemucuscooldown.name=Génération de mucus
actors.hero.talent$slimemucuscooldown.desc=La Slime d'eau vient de générer un mucus de slime. Elle doit attendre avant d'en générer un autre. Les attaques subies accélèrent la génération.\n\nTemps avant la prochaine génération : %s tours
actors.mobs.npcs.slimemucus.name=Mucus de Slime
actors.mobs.npcs.slimemucus.desc=Le mucus de Slime est un morceau de mucus qui s'est détaché du Slime aqueux. Après avoir touché le sol, il absorbe les micro-organismes en dessous et gonfle, afin d'être absorbé par le Slime aqueux pour restaurer plus de points de vie. Bien sûr, il peut aussi être détruit par les attaques ennemies.\n\nLe mucus de Slime a 10 points de vie et en perd 1 par tour. Le Slime aqueux peut l'absorber en cliquant sur le mucus dans un rayon de 8 cases. L'absorption ne consomme pas de tour.\n\nLe mucus de Slime hérite de la moitié de l'armure du Slime aqueux.
actors.mobs.npcs.slimemucus.absorb_title=Mucus de Slime
actors.mobs.npcs.slimemucus.absorb_body=C'est une partie du mucus qui s'est détachée de vous. Il semble avoir absorbé pas mal de nutriments environnants.\n\nVoulez-vous absorber ce mucus ? Cela restaurera votre vie.
actors.mobs.npcs.slimemucus.absorb_confirm=Absorber
actors.mobs.npcs.slimemucus.absorb_cancel=Annuler
actors.mobs.npcs.slimemucus.discover_hint=Vous pouvez découvrir cette unité via une spécialisation de héros.

actors.hero.herosubclass.darkslime=Slime des ténèbres
actors.hero.herosubclass.darkslime_short_desc=_La Slime des ténèbres_ perd une partie de ses PV maximaux mais est immunisée à la boue corrosive, en asperge les ennemis et peut utiliser un grappin des ténèbres.
actors.hero.herosubclass.darkslime_desc=La Slime des ténèbres absorbe les nutriments maléfiques du donjon et obtient le pouvoir des ténèbres, réduisant ses PV maximaux de 20% mais la rendant immunisée à la boue corrosive.\n\n50% de chances d'infliger 20 tours de boue corrosive à l'attaque. 15% de chances d'infliger 20 tours de boue corrosive à l'attaquant quand elle subit des dégâts (double pour les attaques à distance).\n\nTous les 65 tours, elle peut utiliser un grappin des ténèbres pour attirer un ennemi visible et l'immobiliser 3 tours.\n\nCette spécialisation a une capacité spéciale quand le grappin est disponible.
actors.buffs.darkhook.name=Grappin d'ombre
actors.buffs.darkhook.desc=Il est temps de choisir ta proie.\n\nTous les 65 tours, libère un grappin d'ombre pour attirer un ennemi visible jusqu'à toi et lui infliger un enchevêtrement pendant 3 tours.\n\nCette compétence a une portée maximale de 12 cases.
actors.hero.talent$darkhookcooldown.name=Récupération du grappin
actors.hero.talent$darkhookcooldown.desc=La Slime des ténèbres vient d'utiliser son grappin des ténèbres. L'effort l'a fatiguée, elle a besoin de temps pour récupérer.\n\nTemps de récupération : %s tours
actors.buffs.darkhook.cant_pull=Impossible de tirer la cible.
actors.buffs.darkhook.does_nothing=Cette distance ne peut plus être réduite.
actors.buffs.darkhook.more_distance=Trop loin, impossible d'atteindre.
actors.hero.talent.potent_ooze.title=Boue Puissante
actors.hero.talent.potent_ooze.desc=Améliorer ce talent fait que se tenir dans l'eau ne dissipe plus directement la Boue Corrosive, mais réduit sa durée supplémentaire.\n\n_+1：_Dans l'eau, l'effet _Boue Corrosive_ est réduit de _3 tours_ supplémentaires.\n\n_+2：_Dans l'eau, l'effet _Boue Corrosive_ est réduit de _2 tours_ supplémentaires.\n\n_+3：_Dans l'eau, l'effet _Boue Corrosive_ est réduit de _1 tour_ supplémentaire.
actors.hero.talent.potent_ooze.comment=
actors.hero.talent.dark_gas.title=Libération de Gaz Obscur
actors.hero.talent.dark_gas.desc=_+1：_Quand le Slime d'Ombre Liquide subit une attaque, il a _20% de chances_ de libérer un peu de _gaz toxique_ et gagne _4 tours de Barrière de Purification_.\n\n_+2：_Quand le Slime d'Ombre Liquide subit une attaque, il a _20% de chances_ de libérer un peu de _gaz toxique ou corrosif_ et gagne _4 tours de Barrière de Purification_.\n\n_+3：_Quand le Slime d'Ombre Liquide subit une attaque, il a _20% de chances_ de libérer un peu de _gaz toxique, corrosif ou fétide_ et gagne _4 tours de Barrière de Purification_.
actors.hero.talent.dark_gas.comment=Les trois gaz de ce talent sont libérés indépendamment avec leur propre probabilité, pas tous en une fois.
actors.hero.talent.dark_liquid.title=Ombre Liquide Tenace
actors.hero.talent.dark_liquid.desc=_+1：_Le Grappin d'Ombre Liquide du Slime inflige _2 tours d'immobilisation_ supplémentaires à la cible, pour un total de 5 tours.\n\n_+2：_En plus de +1, inflige _20 tours de Boue Corrosive_ supplémentaires à la cible.\n\n_+3：_En plus de +1 et +2, les ennemis tués sous _immobilisation_ fournissent au Slime d'Ombre Liquide _8 tours de charge de bâton et 5 tours de charge d'artefact_, et _réinitialisent le temps de recharge du Grappin d'Ombre Liquide_.
actors.hero.talent.dark_liquid.comment=Au niveau +3, traîner un ennemi dans l'abîme ne réinitialise pas le temps de recharge du Grappin d'Ombre Liquide.

actors.hero.heroclass.slimegirl=Fille slime
actors.hero.heroclass.slimegirl_desc_short=La Fille slime porte une _armure de mucus_ qui ne peut être retirée mais grandit avec elle, et peut _faire germer des graines dans son corps_.
actors.hero.heroclass.slimegirl_desc=La Fille slime commence avec une _armure de mucus unique_, impossible à retirer mais gagnant des niveaux et des rangs avec son niveau.\n\nElle a moins de force mais plus de PV et une meilleure croissance. Elle peut _faire germer des graines dans son corps_ pour produire des effets végétaux, prenant généralement 1 tour.\n\nElle commence également avec _une lance de conquérant_, _deux boules de mucus_, une gourde et un sac en tissu.\n\nEn tant que monstre, elle a peu de connaissances humaines, donc seuls ces objets sont identifiés :\n_-_Parchemin de métamorphose et d'identification
actors.hero.heroclass.slimegirl_unlock=_Vaincre le Goo dans une partie_ pour débloquer la Fille slime.

actors.hero.abilities.slime.madslime.name=Journal de la gloutonnerie
actors.hero.abilities.slime.madslime.self_target=Impossible de se cibler soi-même.
actors.hero.abilities.slime.madslime.no_target=Aucune cible à engloutir.
actors.hero.abilities.slime.madslime.more_distance=Cible trop éloignée.
actors.hero.abilities.slime.madslime.strong_target=Vous ne pouvez pas engloutir cette cible.
actors.hero.abilities.slime.madslime.eat=La cible est délicieuse, vous vous sentez rempli de force.
actors.hero.abilities.slime.madslime.eat1=Vous sentez vos blessures guérir lentement.
actors.hero.abilities.slime.madslime.eat2=Vous sentez comme une barrière vous protégeant.
actors.hero.abilities.slime.madslime.short_desc=La Fille slime maîtrise le _journal de la gloutonnerie_, sa faim insatiable lui permettant d'engloutir un ennemi adjacent.
actors.hero.abilities.slime.madslime.desc=La Fille slime est pleine d'envie de dévorer, lui permettant d'engloutir un ennemi adjacent pour restaurer sa satiété. L'ennemi englouti subit des dégâts massifs et meurt instantanément.\n\nElle ne peut engloutir les boss, mini-boss, élites et alliés.\n\nSatiété de base restaurée : _250_ (affecté par le défi Régime)
actors.hero.talent.no_pick.title=Dévoreur Affamé
actors.hero.talent.no_pick.desc=_+1：_La satiété restaurée en dévorant les ennemis _augmente de 20%_.\n\n_+2：_La satiété restaurée en dévorant les ennemis _augmente de 40%_.\n\n_+3：_La satiété restaurée en dévorant les ennemis _augmente de 60%_.\n\n_+4：_La satiété restaurée en dévorant les ennemis _augmente de 80%_.
actors.hero.talent.no_pick.comment=
actors.hero.talent.food_bonus.title=Nature Sanguinaire
actors.hero.talent.food_bonus.desc=_+1：_Dévorer un ennemi _déclenche un effet de repas_.\n\n_+2：_En plus de +1, dévorer un ennemi crée une _zone de duel de 5x5_ centrée sur lui-même.\n\n_+3：_En plus de +1 et +2, dévorer un ennemi soigne _25% de la vie perdue_.\n\n_+4：_En plus de +1, +2 et +3, dévorer un ennemi confère un _bouclier de 20% de la vie maximale_.
actors.hero.talent.food_bonus.comment=
actors.hero.talent.delicious_digestion.title=Grand Festin
actors.hero.talent.delicious_digestion.desc=_+1：_Quand le Slime Girl utilise le Journal de l'Histoire Folle à 100% de charge d'armure, la consommation de charge _est réduite de 16%_.\n\n_+2：_Quand le Slime Girl utilise le Journal de l'Histoire Folle à 100% de charge d'armure, la consommation de charge _est réduite de 30%_.\n\n_+3：_Quand le Slime Girl utilise le Journal de l'Histoire Folle à 100% de charge d'armure, la consommation de charge _est réduite de 40%_.\n\n_+4：_Quand le Slime Girl utilise le Journal de l'Histoire Folle à 100% de charge d'armure, la consommation de charge _est réduite de 50%_.
actors.hero.talent.delicious_digestion.comment=

actors.hero.abilities.slime.rapidwaterfall.name=Cascade rugissante
actors.hero.abilities.slime.rapidwaterfall.short_desc=La Fille slime déchaîne une _cascade rugissante_, produisant une vapeur d'eau qui transforme les zones en flaques et détruit tous les pièges.
actors.hero.abilities.slime.rapidwaterfall.desc=La Fille slime peut produire une vapeur d'eau bouillonnante autour d'elle, transformant les zones environnantes en flaques d'eau.\n\nQuantité de base de vapeur : _45_
actors.hero.abilities.slime.rapidwaterfall$rapidwater.name=Cascade rugissante
actors.hero.abilities.slime.rapidwaterfall$rapidwater.desc=Une vapeur d'eau bouillonnante qui peut transformer les zones environnantes en flaques d'eau et détruire tous les pièges.
actors.hero.talent.violent_storm.title=Tempête Violente
actors.hero.talent.violent_storm.desc=_+1：_La quantité de vapeur d'eau générée _augmente de 25%_.\n\n_+2：_La quantité de vapeur d'eau générée _augmente de 50%_.\n\n_+3：_La quantité de vapeur d'eau générée _augmente de 75%_.\n\n_+4：_La quantité de vapeur d'eau générée _augmente de 100%_.
actors.hero.talent.violent_storm.comment=
actors.hero.talent.new_trap.title=Piège Renouvelé
actors.hero.talent.new_trap.desc=_+1：_Quand la vapeur d'eau générée par Torrent Rugissant détruit un piège, il y a _20% de chances_ de produire _1 cristal de piège_.\n\n_+2：_Quand la vapeur d'eau générée par Torrent Rugissant détruit un piège, il y a _40% de chances_ de produire _1 cristal de piège_.\n\n_+3：_Quand la vapeur d'eau générée par Torrent Rugissant détruit un piège, il y a _60% de chances_ de produire _1 cristal de piège_.\n\n_+4：_Quand la vapeur d'eau générée par Torrent Rugissant détruit un piège, il y a _80% de chances_ de produire _1 cristal de piège_.
actors.hero.talent.new_trap.comment=Chaque utilisation de Torrent Rugissant donne au maximum 3 cristaux de piège.
actors.hero.talent.holy_bath.title=Bain Sacré
actors.hero.talent.holy_bath.desc=_+1：_Les ennemis dans la vapeur d'eau générée par le Torrent Rugissant sont _repoussés d'1 case_ vers une case non-aqueuse adjacente.\n\n_+2：_Les ennemis dans la vapeur d'eau générée par le Torrent Rugissant sont _repoussés de 2 cases_ vers une case non-aqueuse adjacente.\n\n_+3：_Les ennemis dans la vapeur d'eau générée par le Torrent Rugissant sont _repoussés de 3 cases_ vers une case non-aqueuse adjacente.\n\n_+4：_Les ennemis dans la vapeur d'eau générée par le Torrent Rugissant sont _repoussés de 4 cases_ vers une case non-aqueuse adjacente.
actors.hero.talent.holy_bath.comment=L'effet de recul de ce talent ne peut pas faire tomber les ennemis dans l'abîme.

actors.hero.abilities.slime.springspell.name=Cercle printanier
actors.hero.abilities.slime.springspell.short_desc=La Fille slime invoque un _cercle printanier_, soignant elle-même et ses alliés avec des herbes.
actors.hero.abilities.slime.springspell.desc=La Fille slime peut invoquer un cercle printanier, offrant un effet de soin herbal à elle-même et à ses alliés.\n\nSoin de base : _25_
actors.hero.talent.potent_healing.title=Soin Puissant
actors.hero.talent.potent_healing.desc=_+1：_L'effet _Soin Herbal_ obtenu via la Formation de Printemps passe à _30 points_.\n\n_+2：_L'effet _Soin Herbal_ obtenu via la Formation de Printemps passe à _35 points_.\n\n_+3：_L'effet _Soin Herbal_ obtenu via la Formation de Printemps passe à _40 points_.\n\n_+4：_L'effet _Soin Herbal_ obtenu via la Formation de Printemps passe à _45 points_.
actors.hero.talent.potent_healing.comment=
actors.hero.talent.efficient_healing.title=Soin Efficace
actors.hero.talent.efficient_healing.desc=_+1：_L'effet _d'Herboristerie_ du Cercle de Printemps est amélioré à _1,5 point de vie restauré par tour_.\n\n_+2：_L'effet _d'Herboristerie_ du Cercle de Printemps est amélioré à _2 points de vie restaurés par tour_.\n\n_+3：_L'effet _d'Herboristerie_ du Cercle de Printemps passe à _2,5 points de vie restaurés par tour_.\n\n_+4：_L'effet _d'Herboristerie_ du Cercle de Printemps passe à _3 points de vie restaurés par tour_.
actors.hero.talent.efficient_healing.comment=Ce talent n'affecte pas le soin total de l'Herboristerie, mais augmente sa vitesse de soin.
actors.hero.talent.mass_healing.title=Soin de Masse
actors.hero.talent.mass_healing.desc=_+1：_Lorsque la Formation de Printemps est active, un allié ayant le moins de PV dans la zone _3x3_ autour de la Fille Slime reçoit autant d'effet de _Soin Herbal_.\n\n_+2：_Lorsque la Formation de Printemps est active, un allié ayant le moins de PV dans la zone circulaire _5x5_ autour de la Fille Slime reçoit autant d'effet de _Soin Herbal_.\n\n_+3：_Lorsque la Formation de Printemps est active, un allié ayant le moins de PV dans la zone _5x5_ autour de la Fille Slime reçoit autant d'effet de _Soin Herbal_.\n\n_+4：_Lorsque la Formation de Printemps est active, un allié ayant le moins de PV dans la zone circulaire _7x7_ autour de la Fille Slime reçoit autant d'effet de _Soin Herbal_.
actors.hero.talent.mass_healing.comment=

actors.hero.talent.liquid_perception.title=Perception Liquide
actors.hero.talent.liquid_perception.desc=_+1：_Quand le Slime Girl boit une potion de force ou d'expérience, il identifie _1 potion_ aléatoire.\n\n_+2：_Quand le Slime Girl boit une potion de force ou d'expérience, il identifie _1 potion ou 1 parchemin_ aléatoire.
actors.hero.talent.liquid_perception.comment=Ce talent s'active aussi quand le héros consomme un objet fabriqué à partir d'une potion de force ou d'expérience.

actors.hero.talent.water_wave.title=Vague d'Eau
actors.hero.talent.water_wave.desc=_+1：_En attaquant un ennemi dans l'eau, la Fille Slime inflige _1 point de dégâts supplémentaires_.\n\n_+2：_En attaquant un ennemi dans l'eau, la Fille Slime inflige _2 points de dégâts supplémentaires_.
actors.hero.talent.water_wave.comment=

actors.hero.talent.natural_affinity.title=Affinité Naturelle
actors.hero.talent.natural_affinity.desc=_+1：_Le taux de faim de la Fille Slime _diminue de 20%_.\n\n_+2：_Le taux de faim de la Fille Slime _diminue de 33%_.
actors.hero.talent.natural_affinity.comment=

actors.hero.talent.quality_absorption.title=Absorption de Qualité
actors.hero.talent.quality_absorption.desc=_+1：_Les PV restaurés par la Fille Slime en absorbant des gouttes de rosée _augmentent de 2 points_.\n\n_+2：_Les PV restaurés par la Fille Slime en absorbant des gouttes de rosée _augmentent de 3 points_.
actors.hero.talent.quality_absorption.comment=Ce talent s'applique aussi aux gouttes de rosée dans la gourde d'eau, mais n'augmente qu'une seule fois la quantité absorbée.

actors.hero.talent.empowering_life.title=Vie Dynamisée
actors.hero.talent.empowering_life.desc=_+1：_Quand le Slime Girl est à pleine vie, l'excès de régénération naturelle se transforme en bouclier permanent, avec une limite de _6,7% de la vie maximale_, et ses _dégâts de sort augmentent de 10%_.\n\n_+2：_Quand le Slime Girl est à pleine vie, l'excès de régénération naturelle se transforme en bouclier permanent, avec une limite de _13,3% de la vie maximale_, et ses _dégâts de sort augmentent de 20%_.\n\n_+3：_Quand le Slime Girl est à pleine vie, l'excès de régénération naturelle se transforme en bouclier permanent, avec une limite de _20% de la vie maximale_, et ses _dégâts de sort augmentent de 30%_.
actors.hero.talent.empowering_life.comment=

actors.hero.talent.ninja_meal.title=Bento du Ninja
actors.hero.talent.ninja_meal.desc=_+1：_Manger restaure _1 charge_ de la boîte à shurikens du ninja.\n\n_+2：_Manger restaure _2 charges_ de la boîte à shurikens du ninja.
actors.hero.talent.ninja_meal.comment=Si la boîte à shurikens n'est pas dans le sac, ce talent fournit _1/2 tours_ de recharge d'artefact aux niveaux _+1/+2_ (la Corne d'Abondance ne peut pas se recharger elle-même).\n\n« Un repas copieux farci de viande, il en a avalé un d'un coup ! »

actors.hero.talent.agile_attack.title=Contre-Attaque Agile
actors.hero.talent.agile_attack.desc=_+1：_Lorsque le ninja esquive une attaque ennemie, sa prochaine attaque physique inflige _3 dégâts supplémentaires_.\n\n_+2：_Lorsque le ninja esquive une attaque ennemie, sa prochaine attaque physique inflige _5 dégâts supplémentaires_.
actors.hero.talent.agile_attack.comment=“Namu San, un combo esquive-contre-attaque aussi spectaculaire — vous, dotés de la vision dynamique des ninjas, l'avez sans doute parfaitement vu.”
actors.hero.talent$agileattack.name=Contre-attaque agile
actors.hero.talent$agileattack.desc=Le Ninja a récemment esquivé une attaque ennemie. Sa prochaine attaque physique sur la cible inflige des dégâts bonus.

actors.hero.talent.you_scared_me.title=Tu m'as fait peur
actors.hero.talent.you_scared_me.desc=_+1：_Chaque fois que le ninja esquive une attaque et que son bouclier actuel est inférieur à _4 points_, il gagne _2 points de bouclier_.\n\n_+2：_Chaque fois que le ninja esquive une attaque et que son bouclier actuel est inférieur à _6 points_, il gagne _3 points de bouclier_.
actors.hero.talent.you_scared_me.comment=Le bouclier obtenu via ce talent ne dépasse pas _4/6 points_ aux niveaux _+1/+2_.\n\n« Vent, forêt, feu, montagne, cérémonie du thé, et puis... Vent, forêt, feu, montagne. »

actors.hero.talent.yunying_meal.title=Repas de Nuage Caché
actors.hero.talent.yunying_meal.desc=_+1：_Le ninja ne met qu'1 tour pour manger et gagne _2 tours d'invisibilité_.\n\n_+2：_Le ninja ne met qu'1 tour pour manger et gagne _4 tours d'invisibilité_.
actors.hero.talent.yunying_meal.comment=Ce talent partage une _limite de 100 déclenchements_ avec les talents _Manger pour l'Expérience_, _Repas Invincible_ et _Cadeau d'Anniversaire_.\n\n« AIEEEEEE ! Un ninja ! Comment est-ce qu'un ninja se trouve ici ?! »

actors.hero.talent.xia.title=Pas de Brume
actors.hero.talent.xia.desc=_+1：_Après avoir lu un parchemin ou utilisé un cristal de sort, le ninja gagne _3 tours_ de Pas de Brume (+50% d'esquive).\n\n_+2：_Après avoir lu un parchemin ou utilisé un cristal de sort, le ninja gagne _5 tours_ de Pas de Brume (+50% d'esquive).
actors.hero.talent.xia.comment=Si vous utilisez un parchemin d'amélioration, de transmutation ou un objet alchimique fabriqué à partir de ceux-ci, la durée de la technique Pas de Brume obtenue est doublée.\n\nPour les objets alchimiques à haut rendement (comme la plupart des cristaux), ce talent se déclenche en fonction de la quantité produite en une seule fois.\n\nCe talent peut se déclencher en lisant un grimoire chaotique.\n\n« Il y a longtemps, le premier maître ninja maîtrisant les secrets du ninjutsu utilisa un parchemin pour inventer une technique secrète : le Pas de Brume. »

actors.hero.talent$xiadef.name=Pas de Brume
actors.hero.talent$xiadef.desc=Après avoir lu un parchemin, le Ninja a brièvement compris un art secret, rendant son corps léger et agile.\n\nCet effet augmente votre esquive de 50%% pour mieux éviter les attaques ennemies.\n\nTours restants : %s tours

actors.hero.talent.quick_search.title=Recherche Rapide
actors.hero.talent.quick_search.desc=_+1：_Le ninja _ne met qu'1 tour_ pour chercher autour de lui.\n\n_+2：_En plus de +1, le ninja _ne consomme que 2 fois la satiété_ pour chercher autour de lui.
actors.hero.talent.quick_search.comment=Notez que chercher normalement coûte toujours 2 tours et consomme 3 fois la satiété.\n\n« Ce n'est qu'en explorant complètement l'environnement qu'on peut se reposer et combattre l'esprit tranquille. »

actors.hero.talent.ninja_social.title=Sociabilité du Ninja
actors.hero.talent.ninja_social.desc=_+1：_Après avoir tué un ennemi avec une arme physique, la _précision des 3 prochaines attaques_ du ninja augmente de 50%.\n\n_+2：_Après avoir tué un ennemi avec une arme physique, la _précision des 5 prochaines attaques_ du ninja augmente de 50%.
actors.hero.talent.ninja_social.comment=« Namu San, quel enchaînement de chops précis, un vrai talent. »
actors.hero.talent$ninjasocial.name=Relations ninja
actors.hero.talent$ninjasocial.desc=Lors des prochaines attaques, la précision du Ninja augmente de 50%%.\n\nUtilisations restantes : %s

actors.hero.talent.feint.title=Feinte
actors.hero.talent.feint.desc=_+1：_Lancer un objet non-armé vers une case vide attire les ennemis dans le champ de vision vers cette position, _temps de recharge de 20 tours_.\n\n_+2：_Lancer un objet non-armé vers une case vide attire les ennemis dans le champ de vision vers cette position, _temps de recharge de 15 tours_.
actors.hero.talent.feint.comment=Ce talent peut réveiller les ennemis endormis. En général, les ennemis attirés ont 50% de chances par tour de tourner leur attention vers le ninja ou ses alliés dans leur champ de vision.\n“Tu te fiches de moi, espèce d'idiot !”
actors.hero.talent$feintcooldown.name=Leurre sonore - Recharge
actors.hero.talent$feintcooldown.desc=Vous venez de lancer un objet pour attirer un ennemi, il sera difficile d'attirer son attention avec du bruit pour le moment.\n\nRecharge restante : %s tours

actors.hero.talent.light_box.title=Équipement Ninja Léger
actors.hero.talent.light_box.desc=_+1：_Le ninja peut utiliser les fonctions de la boîte à shurikens sans l'équiper, mais le taux de recharge tombe à _25%_.\n\n_+2：_Le ninja peut utiliser les fonctions de la boîte à shurikens sans l'équiper, mais le taux de recharge tombe à _50%_.\n\n_+3：_Le ninja peut utiliser les fonctions de la boîte à shurikens sans l'équiper, mais le taux de recharge tombe à _75%_.
actors.hero.talent.light_box.comment=Sans boîte à shurikens dans l'inventaire, ce talent améliore toutes les armes de jet de _1/2/3 niveaux_ pendant 4 tours après utilisation d'un artefact aux niveaux _+1/+2/+3_.

actors.hero.talent.qianfa_throwing.title=Lancer Millefold
actors.hero.talent.qianfa_throwing.desc=_+1：_Quand le ninja lance une arme de jet ou un petit shuriken, il y a _10% de chances_ d'infliger 3 fois les dégâts.\n\n_+2：_Quand le ninja lance une arme de jet ou un petit shuriken, il y a _20% de chances_ d'infliger 3 fois les dégâts.\n\n_+3：_Quand le ninja lance une arme de jet ou un petit shuriken, il y a _30% de chances_ d'infliger 3 fois les dégâts.
actors.hero.talent.qianfa_throwing.comment=Si un héros possédant une arme de jet spéciale comme l'Arc Psychique obtient ce talent, l'arme spéciale bénéficie aussi de ses bonus.\n\n« Instruction ・Un : Un ennemi que cent shurikens ne peuvent abattre, n'essaie pas de l'abattre avec un seul shuriken — lance mille shurikens ! »

actors.hero.heroclass.ninja=Ninja
actors.hero.heroclass.ninja_desc_short=Le Ninja peut utiliser sa _boîte à shurikens_ pour frapper ou paralyser les ennemis. Il a une plus grande _portée de détection_ et une _furtivité_ accrue.
actors.hero.heroclass.ninja_desc=Le Ninja commence avec une _boîte à shurikens unique_, lui permettant de lancer rapidement des shurikens pour frapper ou paralyser les ennemis.\n\nLe Ninja peut _détecter les secrets et les pièges_ à plus grande distance et ses mouvements sont _plus discrets_.\n\nIl commence également avec _un wakizashi_, une armure en tissu, une gourde et un sac en tissu.\n\nObjets identifiés au début :\n_-_Potion de gaz toxique\n_-_Parchemin de métamorphose, d'identification et de téléportation
actors.hero.heroclass.ninja_unlock=_Vaincre le Tengu dans une partie_ pour débloquer le Ninja.
actors.hero.herosubclass.tatteki_ninja=Ninja arquebusier
actors.hero.herosubclass.tatteki_ninja_short_desc=_Le Ninja arquebusier_ reçoit une arquebuse puissante aux dégâts très élevés et au long intervalle de tir.
actors.hero.herosubclass.tatteki_ninja_desc=Le Ninja arquebusier reçoit une arquebuse utilisable comme arme secondaire partageant le niveau de l'arme principale. Tirer inflige des dégâts très élevés et effraie les ennemis dans le champ de vision, mais chaque tir nécessite 30 tours d'intervalle.\n\nL'arquebuse du Ninja arquebusier est très imprécise et ne peut être utilisée pour des embuscades, mais il peut lancer des projectiles ou des shurikens pour appliquer un effet de correction balistique, garantissant que la cible affectée sera touchée par l'arquebuse.
actors.hero.talent.soko.title=Hayajiru
actors.hero.talent.soko.desc=_+1：_Le temps de rechargement du canon du ninja arquebusier _est réduit de 4 tours_.\n\n_+2：_Le temps de rechargement du canon du ninja arquebusier _est réduit de 7 tours_.\n\n_+3：_Le temps de rechargement du canon du ninja arquebusier _est réduit de 10 tours_.
actors.hero.talent.soko.comment=« Le Hayajiru (rechargement rapide) était une innovation majeure dans la technologie des canons en Orient. En pré-emballant la poudre et les projectiles dans des tubes de bambou ou des sachets en papier, le tireur n'avait qu'à les verser directement dans le canon, augmentant la cadence de tir de 1~2 à 4~5 coups par minute. »
actors.hero.talent.kono_fukusa.title=Embuscade de Pêche
actors.hero.talent.kono_fukusa.desc=_+1：_Quand le ninja arquebusier tend une embuscade ou attaque physiquement un ennemi en poursuite, ses dégâts _augmentent de 20%_.\n\n_+2：_Quand le ninja arquebusier tend une embuscade ou attaque physiquement un ennemi en poursuite, ses dégâts _augmentent de 40%_.\n\n_+3：_Quand le ninja arquebusier tend une embuscade ou attaque physiquement un ennemi en poursuite, ses dégâts _augmentent de 60%_.
actors.hero.talent.kono_fukusa.comment=“L'embuscade de pêche est une tactique créée par des stratèges orientaux, basée sur l'attraction de l'ennemi avant de lancer une embuscade anéantissante. Elle a permis de vaincre à nombre inférieur lors d'une invasion conjointe contre les Gnolls.”
actors.hero.talent.kunikuchi.title=Canon Kunikuchi
actors.hero.talent.kunikuchi.desc=_+1：_L'arquebusier ninja peut charger son arquebuse avec une bombe, rendant le _1 prochain tir_ explosif.\n\n_+2：_L'arquebusier ninja peut charger son arquebuse avec une bombe, rendant les _3 prochains tirs_ explosifs.\n\n_+3：_L'arquebusier ninja peut charger son arquebuse avec une bombe, rendant les _5 prochains tirs_ explosifs.
actors.hero.talent.kunikuchi.comment=“Le Canon Kunikuchi est un canon de gros calibre dont le bruit assourdissant impressionne plus l'ennemi que sa puissance réelle (même s'il ne faut pas sous-estimer cette dernière).”

actors.hero.herosubclass.ninja_master=Maître ninja
actors.hero.herosubclass.ninja_master_short_desc=_Le Maître ninja_ gagne de l'énergie ninja au fil du temps et peut la dépenser pour lancer diverses techniques selon le terrain.
actors.hero.herosubclass.ninja_master_desc=Le Maître ninja consomme de l'énergie ninja pour lancer diverses techniques selon le terrain. L'énergie ninja se régénère généralement de 1 point tous les 40 tours.\n\nTerrain normal :\nTechnique de fuite - Ombre fuyante : téléportation et invisibilité\nTechnique de corps à corps - Retour d'hirondelle : coupe rapide qui désoriente l'ennemi\nTechnique de lancer - Coup d'ombre : le prochain lancer mutile et fait saigner l'ennemi\n\nTerrain aquatique :\nTechnique de fuite - Fuite aquatique : vitesse de déplacement doublée sur l'eau\nTechnique de corps à corps - Lame fluide : coupe à distance qui refroidit l'ennemi\nTechnique de lancer - Lancer aquatique : le prochain lancer déplace l'eau environnante\n\nTerrain d'herbe ou de cendres :\nTechnique de fuite - Renaissance végétale : fait germer des tentacules de ronce\nTechnique de corps à corps - Lien végétal : coupe puissante qui entrave l'ennemi\nTechnique de lancer - Dispersion florale : le prochain lancer déclenche un effet de plante aléatoire\n\nCette spécialisation a une capacité spéciale quand l'énergie ninja se régénère.
actors.hero.talent.soul_hunting.title=Chasse d'Âme
actors.hero.talent.soul_hunting.desc=_+1：_Quand un ennemi meurt, le maître ninja gagne _0,5 point d'énergie ninjutsu_.\n\n_+2：_Quand un ennemi meurt, le maître ninja gagne _1 point d'énergie ninjutsu_.\n\n_+3：_Quand un ennemi meurt, le maître ninja gagne _1,5 point d'énergie ninjutsu_.
actors.hero.talent.soul_hunting.comment=
actors.hero.talent.use_environment.title=Utilisation de l'Environnement
actors.hero.talent.use_environment.desc=_+1：_Le maître ninja peut utiliser Fuite pour absorber les _flammes dans une zone de 3x3_ et gagner _3 tours de Force de Flammes_.\n\n_+2：_En plus de +1, le maître ninja peut utiliser Fuite pour absorber les _gaz non-flammes et non-électriques (étourdissants, paralysants, toxiques, etc.) dans une zone de 3x3_ et les _relâcher à l'emplacement cible_ lors du prochain Lancer.\n\n_+3：_En plus de +1 et +2, le maître ninja peut utiliser Fuite pour absorber les _champs électriques dans une zone de 3x3_ et les convertir en _un certain nombre de tours de charge de bâton et de charge d'artefact_ selon la quantité absorbée.
actors.hero.talent.use_environment.comment=
actors.hero.talent.mind_water.title=Eau de l'Esprit
actors.hero.talent.mind_water.desc=_+1：_Le maître ninja réduit de 1 point l'énergie ninjutsu consommée par _Approche_.\n\n_+2：_Le maître ninja réduit de 1 point l'énergie ninjutsu consommée par _Approche et Lancer_.\n\n_+3：_Le maître ninja réduit de 1 point l'énergie ninjutsu consommée par _Fuite, Approche et Lancer_.
actors.hero.talent.mind_water.comment=
actors.buffs.ninja_energy.name=Énergie ninja
actors.buffs.ninja_energy.desc=Le maître ninja gagne de l'énergie ninja au fil du temps et peut la consommer pour libérer diverses techniques selon le terrain.\n\nL'énergie ninja se régénère généralement de 1 point tous les 40 tours.\n\nÉnergie actuelle : %d/10
actors.buffs.ninja_energy.action=Ninjutsu
actors.buffs.ninja_energy$watersmooth.name=Glisse aquatique
actors.buffs.ninja_energy$watersmooth.desc=Le maître ninja a libéré la technique de fuite aquatique. Pendant cet effet, sa vitesse de déplacement dans l'eau est doublée.\n\nTours restants : %s
actors.buffs.ninja_energy$gas_storage.name=Stockage de gaz
actors.buffs.ninja_energy$gas_storage.desc=Le maître ninja stocke le gaz ambiant dans son corps et peut le libérer à l'emplacement cible lors de la prochaine utilisation de lancer.
actors.buffs.ninja_energy$throw_skill.name=Lancer
actors.buffs.ninja_energy$throw_skill.desc=Le maître ninja accumule de l'énergie ninja dans sa main, qui est libérée avec l'arme de jet et produit des effets supplémentaires.\n\nSur un terrain normal, le jet inflige un saignement et une infirmité basés sur les dégâts de l'arme de jet.\n\nSur un terrain aquatique, le jet transfère l'eau autour du maître ninja vers la zone d'impact.\n\nSur de l'herbe ou des cendres, le jet déclenche un effet de plante nuisible aléatoire.
actors.buffs.ninja_energy$ninjaability$transported.name_normal=Technique d'évasion - Fuite d'ombre
actors.buffs.ninja_energy$ninjaability$transported.desc_normal=Consomme un tour pour se téléporter jusqu'à 2 cases et obtient l'invisibilité pendant 5 tours.
actors.buffs.ninja_energy$ninjaability$transported.more_distance=Trop loin pour se téléporter.
actors.buffs.ninja_energy$ninjaability$transported.name_water=Technique d'évasion - Fuite aquatique
actors.buffs.ninja_energy$ninjaability$transported.desc_water=Confère un effet de glisse aquatique, doublant la vitesse de déplacement dans l'eau pendant 8 tours.
actors.buffs.ninja_energy$ninjaability$transported.name_grass=Technique d'évasion - Renaissance végétale
actors.buffs.ninja_energy$ninjaability$transported.desc_grass=Peut générer 1 à 3 tentacules de pourriture sombrée autour de soi.
actors.buffs.ninja_energy$ninjaability$transported.less=Espace insuffisant pour générer des tentacules.
actors.buffs.ninja_energy$ninjaability$taijutsu.name_normal=Taijutsu - Retour de l'hirondelle
actors.buffs.ninja_energy$ninjaability$taijutsu.desc_normal=Effectue 2 coupes infligeant 80% de dégâts chacune à un ennemi avec un étourdissement de 5 tours.
actors.buffs.ninja_energy$ninjaability$taijutsu.name_water=Taijutsu - Tranchée aquatique
actors.buffs.ninja_energy$ninjaability$taijutsu.desc_water=La coupe contre un ennemi a une portée d'attaque supplémentaire d'1 case et inflige un gel de 5 tours.
actors.buffs.ninja_energy$ninjaability$taijutsu.name_grass=Taijutsu - Liane enchevêtrante
actors.buffs.ninja_energy$ninjaability$taijutsu.desc_grass=Effectue une coupe infligeant 125% de dégâts à un ennemi avec un enchevêtrement de 5 tours.
actors.buffs.ninja_energy$ninjaability$throw.name_normal=Lancer - Frappe d'ombre
actors.buffs.ninja_energy$ninjaability$throw.desc_normal=Confère un effet de lancer, permettant au prochain jet sur un terrain normal d'infliger un saignement et une infirmité basés sur les dégâts de l'arme de jet.
actors.buffs.ninja_energy$ninjaability$throw.name_water=Lancer - Jet d'eau
actors.buffs.ninja_energy$ninjaability$throw.desc_water=Confère un effet de lancer, permettant au prochain jet sur un terrain aquatique de transférer l'eau autour du maître ninja vers la zone d'impact.
actors.buffs.ninja_energy$ninjaability$throw.name_grass=Lancer - Dispersion florale
actors.buffs.ninja_energy$ninjaability$throw.desc_grass=Confère un effet de lancer, permettant au prochain jet sur de l'herbe ou des cendres de déclencher un effet de plante nuisible aléatoire.
actors.buffs.ninja_energy$ninjaability$throw.hive_throw=Tu es en état de lancer.

actors.hero.abilities.ninja.decoy.name=Leurre d'ombre
actors.hero.abilities.ninja.decoy.short_desc=Le Ninja invoque un _leurre d'ombre_ pour l'assister au combat et encaisser les coups fatals.
actors.hero.abilities.ninja.decoy.desc=Le Ninja invoque un leurre d'ombre. Lorsqu'il est présent, utiliser cette capacité permet de le diriger. Le leurre d'ombre a initialement 40 PV et 10~15 d'attaque.\n\nIl assiste le Ninja au combat. Lorsque le Ninja subit un coup fatal, le leurre d'ombre encaisse les dégâts à sa place et meurt.
actors.hero.abilities.ninja.decoy.less=Espace insuffisant pour invoquer un leurre d'ombre.
actors.hero.abilities.ninja.decoy$decoyman.name=Leurre d'ombre
actors.hero.abilities.ninja.decoy$decoyman.direct_defend=À vos ordres.
actors.hero.abilities.ninja.decoy$decoyman.direct_follow=Je vous suis jusqu'à la mort !
actors.hero.abilities.ninja.decoy$decoyman.direct_attack=Attaquez tous !
actors.hero.abilities.ninja.decoy$decoyman.directed_wander=Trouvez et éliminez !
actors.hero.abilities.ninja.decoy$decoyman.desc=Un leurre d'ombre façonné par les ténèbres, imitant parfaitement vos gestes. Les ennemis ont du mal à le distinguer de vous.\n\nIl semble fragile, mais lorsque vous subissez un coup fatal, il peut l'encaisser à votre place, au prix de dégâts massifs, voire de sa destruction.
actors.hero.abilities.ninja.decoy$decoyman.die1=Les cerisiers sont en fleurs au pays natal, mais je ne peux plus y retourner...
actors.hero.abilities.ninja.decoy$decoyman.die2=Pouah... cette fumée... elle est infecte...
actors.hero.abilities.ninja.decoy$decoyman.die3=Vivre, c'est la preuve du combat...
actors.hero.abilities.ninja.decoy$decoyman.die4=Sayônara ! (Explosion !)
actors.hero.abilities.ninja.decoy$decoyman.discover_hint=Vous pouvez découvrir cette unité via une compétence d'armure de héros.
actors.hero.abilities.ninja.decoy$shadowmark.name=Marque d'ombre
actors.hero.abilities.ninja.decoy$shadowmark.desc=Le leurre d'ombre a marqué cet ennemi d'une marque d'ombre.\n\nLes ennemis marqués subissent plus de dégâts de la part du Ninja et du leurre d'ombre.\n\nTours restants : %s tours
actors.hero.talent.deversion.title=Technique des Ombres Multiples
actors.hero.talent.deversion.desc=_+1：_La vie maximale de l'Ombre Guerrière passe à _50 points_, ses dégâts à _20~25 points_.\n\n_+2：_En plus de +1, une invocation produit _2_ Ombres Guerrières.\n\n_+3：_La vie maximale de l'Ombre Guerrière passe à _60 points_, ses dégâts à _30~35 points_.\n\n_+4：_En plus de +3, une invocation produit _3_ Ombres Guerrières.
actors.hero.talent.deversion.comment=
actors.hero.talent.shinkage.title=Armure d'Ombre
actors.hero.talent.shinkage.desc=_+1：_L'armure de l'Ombre Guerrière passe à _1~5 points_.\n\n_+2：_En plus de +1, quand l'Ombre Guerrière subit une attaque, le ninja gagne _1 tour de Poussée d'Hormones_.\n\n_+3：_L'armure de l'Ombre Guerrière passe à _2~10 points_.\n\n_+4：_En plus de +3, quand l'Ombre Guerrière subit une attaque, le ninja gagne _1,5 tour de Poussée d'Hormones_.
actors.hero.talent.shinkage.comment=
actors.hero.talent.allhunting.title=Chasse en Meute
actors.hero.talent.allhunting.desc=_+1：_L'Ombre Guerrière marque sa cible d'une _marque d'ombre de 2 tours_ après l'avoir attaquée. Les ennemis marqués subissent _15% de dégâts supplémentaires_ de la part du ninja et de l'Ombre Guerrière.\n\n_+2：_L'Ombre Guerrière marque sa cible d'une _marque d'ombre de 4 tours_ après l'avoir attaquée. Les ennemis marqués subissent _30% de dégâts supplémentaires_ de la part du ninja et de l'Ombre Guerrière.\n\n_+3：_L'Ombre Guerrière marque sa cible d'une _marque d'ombre de 6 tours_ après l'avoir attaquée. Les ennemis marqués subissent _45% de dégâts supplémentaires_ de la part du ninja et de l'Ombre Guerrière.\n\n_+4：_L'Ombre Guerrière marque sa cible d'une _marque d'ombre de 8 tours_ après l'avoir attaquée. Les ennemis marqués subissent _60% de dégâts supplémentaires_ de la part du ninja et de l'Ombre Guerrière.
actors.hero.talent.allhunting.comment=


actors.hero.abilities.ninja.onesword.name=Une lame
actors.hero.abilities.ninja.onesword.short_desc=Le Ninja déploie la technique secrète _Une lame_, augmentant temporairement sa vitesse de déplacement, sa vitesse d'attaque et ses dégâts de mêlée.
actors.hero.abilities.ninja.onesword.desc=Le Ninja déploie la technique secrète du maître sabreur : Une lame ! Elle dure 10 tours.\n\nAprès l'avoir déployée, le Ninja bénéficie d'une vitesse de déplacement doublée, de +50% de vitesse d'attaque et de 30% de dégâts de mêlée supplémentaires. Avec un wakizashi ou un katana, les dégâts de mêlée augmentent de 20% supplémentaires.
actors.hero.abilities.ninja.onesword$oku_onesword.name=Technique secrète : Une lame
actors.hero.abilities.ninja.onesword$oku_onesword.desc=La plus grande technique secrète de l'école Shintō, désormais utilisée par le Ninja dans le combat rapproché, augmentant sa vitesse de déplacement, sa vitesse d'attaque et ses dégâts de mêlée.\n\nTours restants : %s tours
actors.hero.talent.offensive.title=Offensive
actors.hero.talent.offensive.desc=_+1：_Omniscience : Premier Coup augmente la vitesse d'attaque et les dégâts de mêlée de 50% et 30% à _62,5%_ et _45%_.\n\n_+2：_Omniscience : Premier Coup augmente la vitesse d'attaque et les dégâts de mêlée de 50% et 30% à _75%_ et _60%_.\n\n_+3：_Omniscience : Premier Coup augmente la vitesse d'attaque et les dégâts de mêlée de 50% et 30% à _87,5%_ et _75%_.\n\n_+4：_Omniscience : Premier Coup augmente la vitesse d'attaque et les dégâts de mêlée de 50% et 30% à _100%_ et _90%_.
actors.hero.talent.offensive.comment=« Ne craignant ni le tigre ni le dragon. »
actors.hero.talent.glimpse.title=Éclair
actors.hero.talent.glimpse.desc=_+1：_Le bonus de vitesse de déplacement d'Omniscience : Premier Coup passe de 100% à _137,5%_.\n\n_+2：_Le bonus de vitesse de déplacement d'Omniscience : Premier Coup passe de 100% à _175%_.\n\n_+3：_Le bonus de vitesse de déplacement d'Omniscience : Premier Coup passe de 100% à _212,5%_.\n\n_+4：_Le bonus de vitesse de déplacement d'Omniscience : Premier Coup passe de 100% à _250%_.
actors.hero.talent.glimpse.comment=“On n'en connaît qu'un aspect, ignorant les autres.”
actors.hero.talent.kill_continue.title=Prolongation d'Exécution
actors.hero.talent.kill_continue.desc=_+1：_Tuer un ennemi avec une arme de mêlée prolonge _d'1 tour_ Omniscience : Premier Coup.\n\n_+2：_Tuer un ennemi avec une arme de mêlée prolonge _de 2 tours_ Omniscience : Premier Coup.\n\n_+3：_Tuer un ennemi avec une arme de mêlée prolonge _de 3 tours_ Omniscience : Premier Coup.\n\n_+4：_Tuer un ennemi avec une arme de mêlée prolonge _de 4 tours_ Omniscience : Premier Coup.
actors.hero.talent.kill_continue.comment=“Tremblant de peur, comme au bord d'un abîme, comme marchant sur de la glace fine.”

actors.hero.abilities.ninja.spiderjar.name=Pot araignée Hiragumo
actors.hero.abilities.ninja.spiderjar.short_desc=Le Ninja remplit le _pot araignée Hiragumo_ de poudre, l'allume et le lance, provoquant une énorme explosion quand la mèche se consume.
actors.hero.abilities.ninja.spiderjar.desc=Le pot araignée Hiragumo dégage avant l'explosion un parfum enivrant pour les créatures et même les machines, attirant les ennemis éveillés. Généralement, les ennemis attirés ont 50% de chances par tour de rediriger leur attention vers le Ninja ou ses alliés dans leur champ de vision.\n\nAprès l'explosion, il inflige 20~40 dégâts aux unités dans une zone 3x3.
actors.hero.abilities.ninja.spiderjar$spider.name=Pot araignée Hiragumo
actors.hero.abilities.ninja.spiderjar$spider.desc=Un précieux ustensile à thé rempli de poudre, apparemment l'objet favori d'une personnalité importante. Le Ninja l'a rempli d'explosifs et allumé la mèche.\n\nIl dégage un parfum envoûtant, attirant continuellement les ennemis.
actors.hero.abilities.ninja.spiderjar$spider.ondeath=Comme Matsunaga Hisahide, vous avez enflammé la poudre et offert un magnifique feu d'artifice à tous...
actors.hero.abilities.ninja.spiderjar$smallspider.name=Petit pot araignée
actors.hero.abilities.ninja.spiderjar$smallspider.desc=Après l'explosion du pot araignée Hiragumo, un petit pot est resté intact.\n\nCet objet dégage un parfum envoûtant avec des effets LED cybernétiques, attirant continuellement les ennemis.
actors.hero.talent.power_gunpowder.title=Poudre Puissante
actors.hero.talent.power_gunpowder.desc=_+1：_Les dégâts d'explosion de la Bouilloire Araignée Plate passent à _25~55 points_.\n\n_+2：_En plus de +1, la zone d'explosion de la Bouilloire Araignée Plate passe à _5x5_.\n\n_+3：_Les dégâts d'explosion de la Bouilloire Araignée Plate passent à _30~70 points_.\n\n_+4：_En plus de +3, la zone d'explosion de la Bouilloire Araignée Plate passe à _7x7_.
actors.hero.talent.power_gunpowder.comment=
actors.hero.talent.tea_stains.title=Teinture de Thé
actors.hero.talent.tea_stains.desc=_+1：_L'explosion de la Bouilloire Araignée Plate inflige _5 tours de Brûlure_.\n\n_+2：_L'explosion de la Bouilloire Araignée Plate inflige _5 tours de Brûlure ou de Gelure_.\n\n_+3：_L'explosion de la Bouilloire Araignée Plate inflige _5 tours de Brûlure ou de Gelure_ et _3 tours de Paralysie_.\n\n_+4：_L'explosion de la Bouilloire Araignée Plate inflige _8 tours de Brûlure ou de Gelure_ et _3 tours de Paralysie_.
actors.hero.talent.tea_stains.comment=
actors.hero.talent.firework.title=Jeu d'Artifice
actors.hero.talent.firework.desc=_+1：_Après l'explosion de la Bouilloire Araignée Plate, elle laisse une petite bouilloire qui attire les ennemis non endormis pendant _10 tours_, puis explose en 3x3 sans infliger de dégâts.\n\n_+2：_Après l'explosion de la Bouilloire Araignée Plate, elle laisse une petite bouilloire qui attire les ennemis non endormis pendant _10 tours_, puis explose en 3x3 infligeant _10~20 points_ de dégâts.\n\n_+3：_Après l'explosion de la Bouilloire Araignée Plate, elle laisse une petite bouilloire qui attire les ennemis non endormis pendant _15 tours_, puis explose en 3x3 infligeant _10~20 points_ de dégâts.\n\n_+4：_Après l'explosion de la Bouilloire Araignée Plate, elle laisse une petite bouilloire qui attire les ennemis non endormis pendant _15 tours_, puis explose en 3x3 infligeant _15~30 points_ de dégâts.
actors.hero.talent.firework.comment=

actors.hero.heroclass.dm400=DM-400
actors.hero.heroclass.dm400_desc_short=DM-400 peut utiliser ses _outils de commande_ pour produire des drones de combat, et ses attaques physiques _renforcent_ les effets des drones contre les ennemis. Il a également le trait _non-vivant_.
actors.hero.heroclass.dm400_desc=DM-400 commence avec un _ensemble d'outils de commande_ unique, lui permettant de produire des drones pour l'assister au combat.\n\nDM-400 a le trait _non-vivant_, des PV de départ faibles et n'a pas d'arme, mais ses attaques à mains nues infligent _1~8 dégâts_. Ses attaques physiques marquent l'ennemi avec un _marquage de commande_ non cumulable de 3 tours, renforçant les effets de certains drones de combat.\n\nDM-400 commence également avec _deux engrenages usés_, une armure en tissu, une gourde et un sac en tissu.\n\nObjets identifiés au début :\n_-_Potion de givre\n_-_Parchemin de métamorphose, d'identification et de charge
actors.hero.heroclass.dm400_unlock=_Vaincre DM-300 dans une partie_ pour débloquer DM-400.

actors.hero.talent.mark_meal.title=Repas Marqué
actors.hero.talent.mark_meal.desc=_+1：_Manger augmente la durée de la marque d'instruction des 3 prochaines attaques physiques du DM-400 contre les ennemis à _5 tours_.\n\n_+2：_Manger augmente la durée de la marque d'instruction des 3 prochaines attaques physiques du DM-400 contre les ennemis à _6 tours_.
actors.hero.talent.mark_meal.comment=“64 65 6C 69 63 6F 75 73.”
actors.hero.talent.mark_meal.meta_desc=_Si un autre héros obtient ce talent_, il inflige 2/3 tours d'Étourcassement à la place.

actors.hero.talent.over_code.title=Code Surpuissant
actors.hero.talent.over_code.desc=_+1：_Quand le DM-400 lit un parchemin d'amélioration ou de transmutation, il identifie aléatoirement _1 type de parchemin_.\n\n_+2：_Quand le DM-400 lit un parchemin d'amélioration ou de transmutation, il identifie aléatoirement _1 type de parchemin ou 1 type de potion_.
actors.hero.talent.over_code.comment=Ce talent s'active aussi en lisant des objets fabriqués à partir de parchemins d'amélioration ou de transmutation.\n\n« Décodage des fichiers... »

actors.hero.talent$markmeal.name=Attaque marquante
actors.hero.talent$markmeal.desc=Les prochaines attaques physiques de DM-400 prolongent l'effet du marquage de commande.\n\nSi un autre héros obtient cet effet, ses prochaines attaques physiques étourdissent la cible.\n\nUtilisations restantes : %1$d

actors.hero.talent.tbm.title=Maintenance Régulière
actors.hero.talent.tbm.desc=_+1：_Tous les 60 tours, le DM-400 gagne _3 points de bouclier_.\n\n_+2：_Tous les 60 tours, le DM-400 gagne _5 points de bouclier_.
actors.hero.talent.tbm.comment=« Réparation des fichiers... »

actors.hero.talent.target_targeting.title=Ciblage de Cible
actors.hero.talent.target_targeting.desc=_+1：_En attaquant un ennemi avec _Marque d'Ordre_, le DM-400 inflige _1 point de dégâts supplémentaires_.\n\n_+2：_En attaquant un ennemi avec _Marque d'Ordre_, le DM-400 inflige _2 points de dégâts supplémentaires_.
actors.hero.talent.target_targeting.comment=« Cible verrouillée. »
actors.hero.talent.target_targeting.meta_desc=_Si un autre héros obtient ce talent_, il s'applique à la place aux ennemis étourdis.

actors.hero.talent.over_meal.title=Suralimentation
actors.hero.talent.over_meal.desc=_+1：_Le DM-400 ne met que _0,5 tour_ pour manger.\n\n_+2：_Le DM-400 _ne met aucun tour_ pour manger.
actors.hero.talent.over_meal.comment=« 63 72 75 6E 63 68 79. »

actors.hero.talent.recover_charge.title=Récupération de Charge
actors.hero.talent.recover_charge.desc=_+1：_Quand le DM-400 enregistre un parchemin dans l'Ensemble d'Outils d'Instructions, l'outil récupère _1 charge_.\n\n_+2：_Quand le DM-400 enregistre un parchemin dans l'Ensemble d'Outils d'Instructions, l'outil récupère _2 charges_.
actors.hero.talent.recover_charge.comment=« Recycle. »
actors.hero.talent.recover_charge.meta_desc=_Si un autre héros obtient ce talent_, au niveau +1, lire un parchemin ou un grimoire chaotique donne 2 tours de recharge d'artefact ; au niveau +2, 4 tours. Utiliser un parchemin d'amélioration, de transmutation ou un objet alchimique fabriqué à partir de ceux-ci n'améliore pas cet effet. Pour les objets alchimiques à haut rendement (comme la plupart des cristaux), l'effet se déclenche en fonction de la quantité produite en une seule fois.

actors.hero.talent.body_reinforce.title=Renforcement de Châssis
actors.hero.talent.body_reinforce.desc=_+1：_Les drones produits par le DM-400 héritent de _50% de son armure_.\n\n_+2：_Les drones produits par le DM-400 héritent de _75% de son armure_.
actors.hero.talent.body_reinforce.comment=“Le DM-400 et sa légion de fer.”
actors.hero.talent.body_reinforce.meta_desc=_Si un autre héros obtient ce talent_, au niveau +1, il réduit les dégâts de 5% lorsqu'il subit au moins 20 points de dégâts ; au niveau +2, la réduction passe à 10% lorsqu'il subit au moins 10 points de dégâts.

actors.hero.talent.efficient_order.title=Ordre Efficace
actors.hero.talent.efficient_order.desc=_+1：_Tous les alliés du DM-400 ont une _vitesse de déplacement augmentée de 30%_.\n\n_+2：_Tous les alliés du DM-400 ont une _vitesse de déplacement augmentée de 45%_.
actors.hero.talent.efficient_order.comment=“Go Work.”

actors.hero.talent.rocket_fist.title=Poing de Fusée
actors.hero.talent.rocket_fist.desc=_+1：_Les attaques à mains nues du DM-400 ont _60% de chances_ de repousser la cible d'_1 case_.\n\n_+2：_Les attaques à mains nues du DM-400 ont _60% de chances_ de repousser la cible de _2 cases_.
actors.hero.talent.rocket_fist.comment=Si vous attaquez avec une arme de mêlée, la probabilité de repoussement _n'est que de 30%_.\n\n« Poing de Fusée — !!! »

actors.hero.talent.big_fist.title=Poing de Fer
actors.hero.talent.big_fist.desc=_+1：_Les attaques à mains nues du DM-400 ignorent l'armure ennemie et infligent _3~20 points de dégâts_.\n\n_+2：_Les attaques à mains nues du DM-400 ignorent l'armure ennemie et infligent _4~25 points de dégâts_.\n\n_+3：_Les attaques à mains nues du DM-400 ignorent l'armure ennemie et infligent _5~30 points de dégâts_.
actors.hero.talent.big_fist.comment=Équiper l'anneau de force remplace les dégâts à mains nues du DM-400 au lieu de s'y ajouter, mais conserve l'effet d'ignorance d'armure de ce talent.

actors.hero.talent.quick_tool.title=Outil Rapide
actors.hero.talent.quick_tool.desc=_+1：_Le DM-400 peut utiliser les fonctions de l'Ensemble d'Outils d'Instructions sans l'équiper, mais le taux de recharge des outils tombe à _25%_ quand il n'est pas équipé.\n\n_+2：_Le DM-400 peut utiliser les fonctions de l'Ensemble d'Outils d'Instructions sans l'équiper, mais le taux de recharge des outils tombe à _50%_ quand il n'est pas équipé.\n\n_+3：_Le DM-400 peut utiliser les fonctions de l'Ensemble d'Outils d'Instructions sans l'équiper, mais le taux de recharge des outils tombe à _75%_ quand il n'est pas équipé.
actors.hero.talent.quick_tool.comment=
actors.hero.talent.quick_tool.meta_desc=_Si un autre héros obtient ce talent_, aux niveaux +1/+2/+3, tous les alliés gagnent 10/20/30% de réduction de dégâts supplémentaire.

actors.hero.herosubclass.at400=AT-400
actors.hero.herosubclass.at400_short_desc=_AT-400_ permet d'utiliser plus de types de drones de combat. Une vaste escadrille de drones frappe les cibles hostiles plus efficacement.
actors.hero.herosubclass.at400_desc=AT-400 inflige 30% de dégâts physiques supplémentaires aux ennemis marqués et peut encoder plus de parchemins pour débloquer plus de types de drones de combat, tous plus performants.\n\nDrone flash (exorcisme) : interfère avec la vision de l'ennemi\nDrone laser (charge) : brûle les ennemis avec des rayons laser puissants\nDrone étourdissant (hypnose) : étourdit ou repousse les ennemis\nDrone harceleur (rage) : harcèle et rend furieux les ennemis\nDrone de terreur (peur) : terrifie par la puissance de feu\nDrone du chaos (transmutation) : se transforme en drone auxiliaire aléatoire ou en quelque chose d'étrange\n\nSi le _mode aléatoire_ est activé, sans outil de commande, ce choix offre un ensemble d'outils de commande.

actors.hero.talent.sustain_mark.title=Marque Durable
actors.hero.talent.sustain_mark.desc=_+1：_Les attaques physiques de l'AT-400 infligent _2 tours supplémentaires de Marque d'Ordre_.\n\n_+2：_Les attaques physiques de l'AT-400 infligent _4 tours supplémentaires de Marque d'Ordre_.\n\n_+3：_Les attaques physiques de l'AT-400 infligent _6 tours supplémentaires de Marque d'Ordre_.
actors.hero.talent.sustain_mark.comment=Ce talent peut s'appliquer aux drones de harcèlement et aux drones de choc.

actors.hero.talent.battle_upgrade.title=Mise à Niveau de Combat
actors.hero.talent.battle_upgrade.desc=_+1：_Les dégâts infligés par tous les drones de combat produits par l'AT-400 augmentent de _15%_, avec un bonus supplémentaire basé sur l'armure de l'ennemi, pouvant ignorer jusqu'à _26,7% de l'armure ennemie_.\n\n_+2：_Les dégâts infligés par tous les drones de combat produits par l'AT-400 augmentent de _22,5%_, avec un bonus supplémentaire basé sur l'armure de l'ennemi, pouvant ignorer jusqu'à _53,3% de l'armure ennemie_.\n\n_+3：_Les dégâts infligés par tous les drones de combat produits par l'AT-400 augmentent de _30%_, avec un bonus supplémentaire basé sur l'armure de l'ennemi, pouvant ignorer jusqu'à _80% de l'armure ennemie_.
actors.hero.talent.battle_upgrade.comment=Ce talent n'affecte pas les drones d'aile.

actors.hero.talent.fly_drone.title=Moustique Volant
actors.hero.talent.fly_drone.desc=_+1：_Tous les drones de combat produits par l'AT-400 esquivent obligatoirement leurs _2 premières attaques_ subies.\n\n_+2：_Tous les drones de combat produits par l'AT-400 esquivent obligatoirement leurs _3 premières attaques_ subies.\n\n_+3：_Tous les drones de combat produits par l'AT-400 esquivent obligatoirement leurs _4 premières attaques_ subies.
actors.hero.talent.fly_drone.comment=Ce talent n'affecte pas les drones d'aile, les drones du chaos et les drones de soutien.

actors.hero.ally.attackdrone.name=Drone de combat
actors.hero.ally.attackdrone.desc=Drone spécialisé dans le combat.
actors.hero.ally.attackdrone$flashdrone.name=Drone flash
actors.hero.ally.attackdrone$flashdrone.desc=Drone de combat produit après avoir encodé un _parchemin d'exorcisme_. Bien qu'équipé d'un canon laser, il tire en réalité des rayons laser de sa « pupille ». Le canon ne sert que de voyant de tir.\n\nPortée d'attaque de 3 cases. Aveugle les ennemis marqués 3 tours et inflige 5 dégâts magiques supplémentaires aux morts-vivants et démons marqués.
actors.hero.ally.attackdrone$laserdrone.name=Drone laser
actors.hero.ally.attackdrone$laserdrone.desc=Drone de combat produit après avoir encodé un _parchemin de charge_. Il ressemble à un gros canon laser flottant, ce qu'il est effectivement. Son laser est parfait pour « griller » les ennemis.\n\nAttaque à distance et inflige des dégâts magiques. 50% de chances d'enflammer les ennemis marqués 3 tours.
actors.hero.ally.attackdrone$anesthesiadrone.name=Drone étourdissant
actors.hero.ally.attackdrone$anesthesiadrone.desc=Drone de combat produit après avoir encodé un _parchemin d'hypnose_. Ses deux bras mécaniques sont équipés d'un dispositif de choc électrique qui, sans paralyser la cible, l'étourdit.\n\nLes attaques contre les ennemis marqués ont 33% de chances d'étourdir 3 tours et 50% de chances supplémentaires de les repousser d'une case.
actors.hero.ally.attackdrone$raiddrone.name=Drone harceleur
actors.hero.ally.attackdrone$raiddrone.desc=Drone de combat produit après avoir encodé un _parchemin de rage_. Ce petit drone a une vitesse de vol doublée, parfait pour harceler les cibles. Face à une nuée de « moustiques », même la cible la plus patiente devient folle.\n\nVitesse de vol doublée, portée de 3 cases. 33% de chances de marquer les ennemis non marqués 3 tours, 17% de chances de les rendre furieux 3 tours s'ils sont déjà marqués.
actors.hero.ally.attackdrone$shockdrone.name=Drone de terreur
actors.hero.ally.attackdrone$shockdrone.desc=Drone de combat produit après avoir encodé un _parchemin de peur_. Équipé d'un lourd canon de sniper, il transperce facilement la chair. Quand on peut en produire en masse, fuir est plus sage.\n\nAttaque à distance. 17% de chances de marquer un ennemi non marqué 3 tours, 33% de chances d'effrayer un ennemi marqué 6 tours.

actors.hero.ally.auxiliarydrone.name=Drone auxiliaire
actors.hero.ally.auxiliarydrone.desc=Drone spécialisé dans le soutien.
actors.hero.ally.auxiliarydrone$scoutdrone.name=Drone éclaireur
actors.hero.ally.auxiliarydrone$scoutdrone.desc=Drone auxiliaire produit après avoir encodé un _parchemin d'identification_. Principalement utilisé pour la reconnaissance, sa « pupille » scanne le terrain et les cibles mobiles. C'est le seul drone partageant toute sa vision avec l'hôte.\n\nChamp de vision initial réduit (augmente avec l'outil), mais partagé avec DM-400. Marque les faiblesses des ennemis dans son champ de vision, augmentant les dégâts subis de 33% (non cumulable).
actors.hero.ally.auxiliarydrone$weaknessmark.name=Marque de faiblesse
actors.hero.ally.auxiliarydrone$weaknessmark.desc=Les faiblesses de cet ennemi ont été marquées par un drone éclaireur.\n\nLes ennemis dans le champ de vision du drone éclaireur voient leurs faiblesses marquées, augmentant les dégâts subis de 33%%.\n\nTours restants : %s tours
actors.hero.ally.auxiliarydrone$mirrordrone.name=Drone miroir
actors.hero.ally.auxiliarydrone$mirrordrone.desc=Drone auxiliaire produit après avoir encodé un _parchemin de miroir_. Utilisant une technologie d'imagerie de pointe (toujours basée sur la magie), il crée un miroir de l'utilisateur pouvant agir librement.\n\nGénère périodiquement un miroir de DM-400. Les outils d'amélioration réduisent le temps de génération.
actors.hero.ally.auxiliarydrone$protectdrone.name=Drone protecteur
actors.hero.ally.auxiliarydrone$protectdrone.desc=Drone auxiliaire produit après avoir encodé un _parchemin de téléportation_. Il génère un champ de défense invisible autour de l'hôte et, une fois détruit, téléporte l'attaquant ailleurs.\n\nConfère 1~3 armure supplémentaire à DM-400. À sa destruction, téléporte aléatoirement l'ennemi qui l'a détruit.
actors.hero.ally.auxiliarydrone$escortdrone.name=Drone d'escorte
actors.hero.ally.auxiliarydrone$escortdrone.desc=Drone auxiliaire produit après avoir encodé un _parchemin de détection_. Il masque les mouvements de l'hôte, offrant une sécurité lors de l'exploration. Curieusement, les cibles ont du mal à remarquer le drone lui-même.\n\nRend les actions de DM-400 plus difficiles à détecter et lui confère régulièrement 4 tours d'invisibilité.
actors.hero.ally.auxiliarydrone$bombdrone.name=Drone explosif
actors.hero.ally.auxiliarydrone$bombdrone.desc=Drone auxiliaire produit après avoir encodé un _parchemin de vengeance_. Capable d'explosions dévastatrices, il fonce sur la cible pour une attaque suicide. Rassurez-vous, l'explosion ne blesse ni l'hôte ni les autres drones.\n\nVitesse de vol doublée. Perd constamment des PV quand un ennemi est à 1 case. Explose à sa mort, ne blessant que les ennemis.
actors.hero.ally.auxiliarydrone$chaosdrone.name=Drone du chaos
actors.hero.ally.auxiliarydrone$chaosdrone.desc=Drone spécial produit après avoir encodé un _parchemin de transmutation_. D'étranges blocs noirs et blancs scintillent autour de lui...\n\nAucune fonction pour l'instant. Après un certain temps, il se transforme en un drone auxiliaire ou de combat aléatoire selon la spécialisation de DM-400, ou peut-être en quelque chose d'inattendu... Les outils d'amélioration réduisent le temps de transformation.

actors.hero.herosubclass.au400=AU-400
actors.hero.herosubclass.au400_short_desc=_AU-400_ permet d'utiliser plus de types de drones auxiliaires. Bien utiliser ces drones polyvalents améliore efficacement la survie.
actors.hero.herosubclass.au400_desc=AU-400 subit 20% de dégâts en moins des ennemis marqués et peut encoder plus de parchemins pour débloquer plus de types de drones auxiliaires, tous plus performants.\n\nDrone éclaireur (identification) : révèle les faiblesses ennemies\nDrone miroir (miroir) : génère périodiquement un miroir de vous\nDrone protecteur (téléportation) : améliore votre défense et téléporte les ennemis dangereux\nDrone d'escorte (détection) : masque vos mouvements pour une exploration plus sûre\nDrone explosif (vengeance) : explose pour blesser les ennemis\nDrone du chaos (transmutation) : se transforme en drone de combat aléatoire ou en quelque chose d'étrange\n\nSi le _mode aléatoire_ est activé, sans outil de commande, ce choix offre un ensemble d'outils de commande.

actors.hero.talent.special_mark.title=Marque Spécialisée
actors.hero.talent.special_mark.desc=_+1：_Quand l'AU-400 attaque un ennemi avec _Marque d'Ordre_, sa précision _augmente de 50%_ et il a _16,7% de chances_ de lui infliger _3 tours de Point de Mire_.\n\n_+2：_Quand l'AU-400 attaque un ennemi avec _Marque d'Ordre_, sa précision _augmente de 75%_ et il a _33,3% de chances_ de lui infliger _3 tours de Point de Mire_.\n\n_+3：_Quand l'AU-400 attaque un ennemi avec _Marque d'Ordre_, sa précision _augmente de 100%_ et il a _50% de chances_ de lui infliger _3 tours de Point de Mire_.
actors.hero.talent.special_mark.comment=

actors.hero.talent.assist_upgrade.title=Mise à Niveau d'Assistance
actors.hero.talent.assist_upgrade.desc=_+1：_Chaque drone de soutien produit par l'AU-400 lui fournit _4 points de bouclier_ tous les _50 tours_.\n\n_+2：_Chaque drone de soutien produit par l'AU-400 lui fournit _4 points de bouclier_ tous les _40 tours_.\n\n_+3：_Chaque drone de soutien produit par l'AU-400 lui fournit _4 points de bouclier_ tous les _30 tours_.
actors.hero.talent.assist_upgrade.comment=Le bouclier cumulé via ce talent ne peut pas dépasser la moitié de la vie maximale.\n\nCe talent n'affecte pas les drones d'aile, les drones du chaos et les drones de combat.

actors.hero.talent.fast_cruise.title=Croisière Rapide
actors.hero.talent.fast_cruise.desc=_+1：_Chaque drone de soutien produit par l'AU-400 lui confère _2 tours de Célérité_ tous les _80 tours_.\n\n_+2：_Chaque drone de soutien produit par l'AU-400 lui confère _2 tours de Célérité_ tous les _70 tours_.\n\n_+3：_Chaque drone de soutien produit par l'AU-400 lui confère _2 tours de Célérité_ tous les _60 tours_.
actors.hero.talent.fast_cruise.comment=Ce talent n'affecte pas les drones d'aile, les drones du chaos et les drones de combat.

actors.hero.abilities.dm400.routine.name=Maintenance de routine
actors.hero.abilities.dm400.routine.short_desc=DM-400 effectue une _maintenance de routine_, améliorant temporairement ses performances.
actors.hero.abilities.dm400.routine.desc=DM-400 passe 4 tours à effectuer une maintenance de routine, réduisant les dégâts subis de 50% pendant cette période, puis entre en surcharge pendant 10 tours.\n\nPendant la surcharge, DM-400 bénéficie d'une vitesse d'attaque et de déplacement doublée (les drones aussi), mais subit 50% de dégâts supplémentaires.
actors.hero.abilities.dm400.routine$overload.name=Mode surcharge
actors.hero.abilities.dm400.routine$overload.desc=Attention ! DM-400 et ses drones auxiliaires sont passés en mode surcharge !\n\nPendant cette période, la vitesse d'attaque et de déplacement de DM-400 et des drones est doublée, mais les dégâts subis par DM-400 sont également augmentés.\n\nTours restants : %s tours
actors.hero.talent.over_extend.title=Prolongation de Surcharge
actors.hero.talent.over_extend.desc=_+1：_La surcharge est prolongée à _12 tours_.\n\n_+2：_La surcharge est prolongée à _15 tours_.\n\n_+3：_La surcharge est prolongée à _17 tours_.\n\n_+4：_La surcharge est prolongée à _20 tours_.
actors.hero.talent.over_extend.comment=
actors.hero.talent.terror_mach.title=Machine de Terreur
actors.hero.talent.terror_mach.desc=_+1：_Après être entré en surcharge, le premier ennemi qui entre dans le champ de vision du DM-400 subit _2 tours de Peur_.\n\n_+2：_Après être entré en surcharge, le premier ennemi qui entre dans le champ de vision du DM-400 subit _4 tours de Peur_.\n\n_+3：_Après être entré en surcharge, le premier ennemi qui entre dans le champ de vision du DM-400 subit _6 tours de Peur_.\n\n_+4：_Après être entré en surcharge, le premier ennemi qui entre dans le champ de vision du DM-400 subit _8 tours de Peur_.
actors.hero.talent.terror_mach.comment=Chaque ennemi ne peut subir l'effet de Peur qu'une seule fois de cette manière.
actors.hero.talent.strong_perserve.title=Maintenance Puissante
actors.hero.talent.strong_perserve.desc=_+1：_Après la maintenance, confère à soi-même et à tous les drones un _bouclier égal à 7,5% de la vie maximale_, et réduit les dégâts subis pendant la surcharge de _5%_.\n\n_+2：_Après la maintenance, confère à soi-même et à tous les drones un _bouclier égal à 10% de la vie maximale_, et réduit les dégâts subis pendant la surcharge de _10%_.\n\n_+3：_Après la maintenance, confère à soi-même et à tous les drones un _bouclier égal à 12,5% de la vie maximale_, et réduit les dégâts subis pendant la surcharge de _15%_.\n\n_+4：_Après la maintenance, confère à soi-même et à tous les drones un _bouclier égal à 15% de la vie maximale_, et réduit les dégâts subis pendant la surcharge de _20%_.
actors.hero.talent.strong_perserve.comment=

actors.hero.abilities.dm400.discharge_gas.name=Évacuation des gaz
actors.hero.abilities.dm400.discharge_gas.short_desc=DM-400 effectue une _évacuation des gaz_, libérant les gaz nocifs accumulés dans son corps.
actors.hero.abilities.dm400.discharge_gas.desc=DM-400 peut expulser les gaz d'échappement accumulés dans son corps, projetant un nuage de gaz toxique sur tous les ennemis dans son champ de vision, tout en dissipant tous ses effets négatifs.\n\nS'il n'y a aucun ennemi dans le champ de vision, elle dissipe uniquement ses effets négatifs sans libérer de gaz.\n\nQuantité de base des gaz : _50_
actors.blobs.discharge_gas$dm400gas.name=Gaz mécanique
actors.blobs.discharge_gas$dm400gas.desc=Un gaz mécanique verdâtre flotte dans l'air. Le DM-400 et ses drones ignorent les effets de ce gaz.
actors.hero.talent.over_time.title=Accumulation à Long Terme
actors.hero.talent.over_time.desc=_+1：_La quantité de gaz toxique projeté augmente de _15%_.\n\n_+2：_La quantité de gaz toxique projeté augmente de _30%_.\n\n_+3：_La quantité de gaz toxique projeté augmente de _45%_.\n\n_+4：_La quantité de gaz toxique projeté augmente de _60%_.
actors.hero.talent.over_time.comment=
actors.hero.talent.deadly_gas.title=Gaz Mortel
actors.hero.talent.deadly_gas.desc=_+1：_Les gaz toxiques projetés par le DM-400 ont _dégâts +1_.\n\n_+2：_Les gaz toxiques projetés par le DM-400 ont _dégâts +2_.\n\n_+3：_Les gaz toxiques projetés par le DM-400 ont _dégâts +3_.\n\n_+4：_Les gaz toxiques projetés par le DM-400 ont _dégâts +4_.
actors.hero.talent.deadly_gas.comment=
actors.hero.talent.discharge_happy.title=Décharge Réjouissante
actors.hero.talent.discharge_happy.desc=_+1：_Après avoir projeté du gaz toxique, le DM-400 gagne _2 tours de Célérité_.\n\n_+2：_Après avoir projeté du gaz toxique, le DM-400 gagne _4 tours de Célérité_.\n\n_+3：_Après avoir projeté du gaz toxique, le DM-400 gagne _6 tours de Célérité_.\n\n_+4：_Après avoir projeté du gaz toxique, le DM-400 gagne _8 tours de Célérité_.
actors.hero.talent.discharge_happy.comment=

actors.hero.abilities.dm400.honeycomb.name=Essaim de ruche
actors.hero.abilities.dm400.honeycomb.short_desc=DM-400 lance le programme _d'essaim de ruche_, offrant des bonus à l'hôte à chaque drone détruit.
actors.hero.abilities.dm400.honeycomb.desc=DM-400 lance le programme d'essaim de ruche. Pendant 20 tours, chaque drone détruit lui restaure 4% de ses PV maximaux et lui accorde 2 tours de recharge d'artefact.
actors.hero.abilities.dm400.honeycomb$honeycombbuff.name=Programme d'essaim
actors.hero.abilities.dm400.honeycomb$honeycombbuff.desc=DM-400 exécute ce programme, les drones auxiliaires partagent leurs données avec l'hôte.\n\nPendant l'exécution du programme, chaque drone auxiliaire détruit transmet des données à l'hôte, maintenant l'état de survie de DM-400 et accélérant la production de nouveaux drones.\n\nTours restants : %s tours
actors.hero.talent.process_extend.title=Prolongation de Processus
actors.hero.talent.process_extend.desc=_+1：_Pendant le Programme d'Essaim, chaque drone détruit _prolonge la durée du programme de 0,5 tour_.\n\n_+2：_Pendant le Programme d'Essaim, chaque drone détruit _prolonge la durée du programme de 1 tour_.\n\n_+3：_Pendant le Programme d'Essaim, chaque drone détruit _prolonge la durée du programme de 1,5 tour_.\n\n_+4：_Pendant le Programme d'Essaim, chaque drone détruit _prolonge la durée du programme de 2 tours_.
actors.hero.talent.process_extend.comment=
actors.hero.talent.glorious_dead.title=Sacrifice Glorieux
actors.hero.talent.glorious_dead.desc=_+1：_Pendant le Programme d'Essaim, chaque drone détruit restaure au DM-400 _4,5% de sa vie maximale_.\n\n_+2：_Pendant le Programme d'Essaim, chaque drone détruit restaure au DM-400 _5% de sa vie maximale_.\n\n_+3：_Pendant le Programme d'Essaim, chaque drone détruit restaure au DM-400 _5,5% de sa vie maximale_.\n\n_+4：_Pendant le Programme d'Essaim, chaque drone détruit restaure au DM-400 _6% de sa vie maximale_.
actors.hero.talent.glorious_dead.comment=
actors.hero.talent.upon_wave.title=Vague après Vague
actors.hero.talent.upon_wave.desc=_+1：_Pendant le Programme d'Essaim, chaque drone détruit donne au DM-400 _3 tours de recharge d'artefact_.\n\n_+2：_Pendant le Programme d'Essaim, chaque drone détruit donne au DM-400 _4 tours de recharge d'artefact_.\n\n_+3：_Pendant le Programme d'Essaim, chaque drone détruit donne au DM-400 _5 tours de recharge d'artefact_.\n\n_+4：_Pendant le Programme d'Essaim, chaque drone détruit donne au DM-400 _6 tours de recharge d'artefact_.
actors.hero.talent.upon_wave.comment=

actors.hero.abilities.freeman.salescontract.name=Contrat de servitude
actors.hero.abilities.freeman.salescontract.short_desc=Le Gentleman persuade les ennemis de signer un _contrat de servitude_, les asservissant à vie.
actors.hero.abilities.freeman.salescontract.desc=Le Gentleman peut, grâce à un langage universel des monstres appris on ne sait où (comptant principalement sur le pouvoir de la couronne), convaincre les ennemis de signer un contrat de servitude, les liant à vie.\n\nBien sûr, le bagout du Gentleman ne convainc pas tout le monde : les boss, mini-boss, élites et alliés refuseront de signer.
actors.hero.abilities.freeman.salescontract$saleself.name=Engagé à vie
actors.hero.abilities.freeman.salescontract$saleself.desc=Cet ennemi s'est vendu sans condition au Gentleman après avoir été embobiné, et travaille maintenant pour lui.\n\nUn ennemi ayant déjà signé un contrat ne peut évidemment pas en signer un autre, après tout, on ne peut pas engager sa prochaine vie aussi, n'est-ce pas ?
actors.hero.abilities.freeman.salescontract$workerwraith.name=Spectre travailleur
actors.hero.abilities.freeman.salescontract$workerwraith.desc=Un spectre né d'un travailleur (monstre) mort avec un plein de ressentiment. Bien que son corps soit mort, il doit encore travailler pour le Gentleman selon les termes du contrat.\n\nLe pauvre doit vraiment travailler deux vies pour le Gentleman.
actors.hero.abilities.freeman.salescontract.self_target=Impossible de se cibler soi-même.
actors.hero.abilities.freeman.salescontract.no_target=Aucune cible avec laquelle signer un contrat.
actors.hero.abilities.freeman.salescontract.more_distance=Cible trop éloignée.
actors.hero.abilities.freeman.salescontract.strong_target=La cible refuse de signer le contrat et vous méprise.
actors.hero.talent.elite_recruit.title=Recrutement d'Élite
actors.hero.talent.elite_recruit.desc=_+1：_En signant un contrat, le gentleman dépense _200 pièces d'or_ supplémentaires pour conférer un effet élite aléatoire à l'ennemi contracté.\n\n_+2：_En signant un contrat, le gentleman dépense _150 pièces d'or_ supplémentaires pour conférer un effet élite aléatoire à l'ennemi contracté.\n\n_+3：_En signant un contrat, le gentleman dépense _100 pièces d'or_ supplémentaires pour conférer un effet élite aléatoire à l'ennemi contracté.\n\n_+4：_En signant un contrat, le gentleman dépense _50 pièces d'or_ supplémentaires pour conférer un effet élite aléatoire à l'ennemi contracté.
actors.hero.talent.elite_recruit.comment=
actors.hero.talent.prim_accu.title=Accumulation Primitive
actors.hero.talent.prim_accu.desc=_+1：_Quand un ennemi sous contrat attaque physiquement un autre ennemi, il donne au gentleman _10 pièces d'or_.\n\n_+2：_Quand un ennemi sous contrat attaque physiquement un autre ennemi, il donne au gentleman _20 pièces d'or_.\n\n_+3：_Quand un ennemi sous contrat attaque physiquement un autre ennemi, il donne au gentleman _30 pièces d'or_.\n\n_+4：_Quand un ennemi sous contrat attaque physiquement un autre ennemi, il donne au gentleman _40 pièces d'or_.
actors.hero.talent.prim_accu.comment=
actors.hero.talent.soul_contract.title=Contrat d'Âme
actors.hero.talent.soul_contract.desc=_+1：_Quand un ennemi sous contrat meurt, il se transforme en _un fantôme travailleur corrompu_, et le gentleman, grâce à des détails négligés dans le contrat, obtient _100 pièces d'or_ d'indemnité pour accident du travail qui auraient dû revenir au fantôme travailleur.\n\n_+2：_En plus de +1, l'effet de corruption du fantôme travailleur devient l'effet _Travail à Vie_.\n\n_+3：_En plus de +1 et +2, le fantôme travailleur gagne aussi un effet _Élite_ aléatoire.\n\n_+4：_En plus de +1, +2 et +3, la _vie maximale_ du fantôme travailleur _égale celle de son ancien moi (l'ennemi contracté d'origine)_.
actors.hero.talent.soul_contract.comment=

actors.mobs.transformmimic.name=Mimique de métamorphose
actors.mobs.transformmimic.desc=Le Mimique est une créature magique capable de changer d'apparence à volonté. Dans le donjon, ils apparaissent presque toujours sous forme de coffres, car cela attire toujours les aventuriers imprudents.\n\nLe Mimique de métamorphose est un mimique formé à partir d'un parchemin de métamorphose corrompu par une force maléfique. Leurs capacités d'attaque et de défense sont identiques à celles d'un mimique ordinaire, mais ils contiennent toujours un parchemin de métamorphose au lieu d'autres butins.
actors.mobs.transformmimic.reveal=Il y a un mimique là-bas !
actors.mobs.transformmimic.hidden_name=Coffre violet ?
actors.mobs.transformmimic.hidden_desc=Vous ne pouvez pas voir ce qu'il contient avant de l'ouvrir !\n\nCe coffre violet semble très différent des coffres ordinaires. Il vaut mieux ne pas l'ouvrir imprudemment.
actors.mobs.transformmimic.discover_hint=Vous pouvez rencontrer cet ennemi dans n'importe quelle zone du donjon après avoir activé certains défis.

actors.hero.heroclass.princess=Princesse naine
actors.hero.heroclass.princess_desc_short=La Princesse naine porte un _anneau d'héritier_ pouvant stocker enchantements et gravures, et peut _convertir des pierres runiques en pierres runiques enchantées_ contre de l'énergie alchimique.
actors.hero.heroclass.princess_desc=La Princesse naine commence avec un _anneau d'héritier unique_, pouvant stocker enchantements et gravures comme une arme ou une armure.\n\nElle peut _convertir n'importe quelle pierre runique en pierre runique enchantée_ pour 8 points d'énergie alchimique.\n\nElle commence également avec _un bouclier de bras_, _un collier de runes_, une armure en tissu, une gourde et un sac en tissu.\n\nObjets identifiés au début :\n_-_Potion de lévitation\n_-_Parchemin de métamorphose, d'identification et de vengeance
actors.hero.heroclass.princess_unlock=_Vaincre le Roi nain dans une partie_ pour débloquer la Princesse naine.
actors.hero.talent.enchant_meal.title=Repas Enchanté
actors.hero.talent.enchant_meal.desc=_+1：_Manger augmente la probabilité de déclenchement de l'enchantement ou de la malédiction de l'arme physique de la princesse naine, rendant les _3 prochaines attaques_ 1,33 fois plus susceptibles de se déclencher.\n\n_+2：_Manger augmente la probabilité de déclenchement de l'enchantement ou de la malédiction de l'arme physique de la princesse naine, rendant les _5 prochaines attaques_ 1,33 fois plus susceptibles de se déclencher.
actors.hero.talent.enchant_meal.comment=Si l'anneau du prince héritier équipé possède un enchantement, ce talent s'applique aussi aux attaques à mains nues, aux armes sans enchantement et aux armes de jet.\n\n“T'ai-je déjà dit que plus tu manges, plus ton énergie arcanique est forte ?”
actors.hero.talent$enchantmeal.name=Renforcement d'enchantement
actors.hero.talent$enchantmeal.desc=Vos prochaines attaques physiques ont plus de chances de déclencher un enchantement.\n\nUtilisations restantes : %1$d
actors.hero.talent.mana_sense.title=Perception de Mana
actors.hero.talent.mana_sense.desc=_+1：_La vitesse d'identification des armes et armures enchantées ou gravées par la princesse naine est multipliée par _5_.\n\n_+2：_La princesse naine _identifie directement_ une arme ou une armure enchantée ou gravée _au moment de l'équiper_.
actors.hero.talent.mana_sense.comment=“Comme je le dis toujours en classe, tu as une perception innée particulièrement aiguë de l'énergie arcanique.”
actors.hero.talent.rune_blade.title=Lame Runique
actors.hero.talent.rune_blade.desc=_+1：_Quand la princesse naine attaque avec une arme physique enchantée, elle inflige _1 point de dégâts magiques_ supplémentaires.\n\n_+2：_Quand la princesse naine attaque avec une arme physique enchantée, elle inflige _2 points de dégâts magiques_ supplémentaires.
actors.hero.talent.rune_blade.comment=Si l'Anneau du Prince Héritier équipé possède un enchantement, ce talent s'applique aussi aux attaques à mains nues, aux armes sans enchantement et aux armes de jet.\n\n« L'énergie arcanique débordante se matérialise en force magique. »
actors.hero.talent.arcane_shield.title=Bouclier Arcanique
actors.hero.talent.arcane_shield.desc=_+1：_Lorsqu'elle subit une attaque, si l'armure équipée par la princesse naine possède une gravure, elle gagne immédiatement _2 points de bouclier_.\n\n_+2：_Lorsqu'elle subit une attaque, si l'armure équipée par la princesse naine possède une gravure, elle gagne immédiatement _3 points de bouclier_.
actors.hero.talent.arcane_shield.comment=Ce talent a _un temps de recharge de 20 tours_.\n\nSi l'anneau du prince héritier équipé possède une gravure, ce talent peut aussi s'appliquer aux armures sans gravure qui offrent une défense sans armure.\n\n“L'excès d'énergie arcanique vous protégera.”
actors.hero.talent$arcaneshieldcooldown.name=Bouclier arcanique - Recharge
actors.hero.talent$arcaneshieldcooldown.desc=Vous venez d'utiliser ce talent, attendez avant de l'utiliser à nouveau.\n\nRecharge restante : %s tours
actors.hero.talent.royal_meal.title=Banquet Royal
actors.hero.talent.royal_meal.desc=_+1：_La princesse naine ne met qu'1 tour pour manger, et pendant les 10 tours suivant le repas, l'Anneau du Prince Héritier _gagne 1 niveau_.\n\n_+2：_La princesse naine ne met qu'1 tour pour manger, et pendant les 10 tours suivant le repas, l'Anneau du Prince Héritier _gagne 2 niveaux_.
actors.hero.talent.royal_meal.comment=Si l'Anneau du Prince Héritier n'est pas dans le sac, ce talent augmente le niveau de tous les anneaux de 1 pendant _5/10 tours_ aux niveaux _+1/+2_.\n\n« Repas élégant. »
actors.hero.talent$royalmeal.name=Banquet royal
actors.hero.talent$royalmeal.desc=La Princesse naine a renforcé son anneau d'héritier après avoir mangé, lui conférant un niveau supplémentaire.\n\nSi l'anneau d'héritier n'est pas dans l'inventaire, cet effet s'applique à tous les anneaux.\n\nTours restants : %s tours
actors.hero.talent.rune_expert.title=Expert en Pierres Runiques
actors.hero.talent.rune_expert.desc=_+1：_La consommation d'énergie alchimique pour convertir une pierre runique en pierre runique enchantée _est réduite de 2 points_.\n\n_+2：_La consommation d'énergie alchimique pour convertir une pierre runique en pierre runique enchantée _est réduite de 4 points_.
actors.hero.talent.rune_expert.comment=« Le souvenir de l'enseignement de l'enchanteur de cour est encore vif ; la conversion des pierres runiques est devenue aussi simple que respirer. »
actors.hero.talent.rune_expert.meta_desc=_Si ce talent est obtenu par un autre héros_, aux niveaux +1/+2, le nombre de pierres runiques obtenues en décomposant des parchemins dans l'alambic alchimique augmente de +1/+2.
actors.hero.talent.str_rune.title=Rune Puissante
actors.hero.talent.str_rune.desc=_+1：_Quand la princesse naine utilise une pierre runique enchantée, elle ajoute une option de _niveau Commun_ en plus des niveaux aléatoires.\n\n_+2：_Quand la princesse naine utilise une pierre runique enchantée, elle ajoute une option de _niveau Rare_ en plus des niveaux aléatoires.\n\n_+3：_Quand la princesse naine utilise une pierre runique enchantée, elle ajoute une option de _niveau Commun_ et une de _niveau Rare_ en plus des niveaux aléatoires.
actors.hero.talent.str_rune.comment=
actors.hero.talent.more_ring.title=Plus d'Anneaux
actors.hero.talent.more_ring.desc=_+1：_La princesse naine peut équiper l'_Anneau du Prince Héritier_ dans l'emplacement d'artefact.\n\n_+2：_La princesse naine peut équiper _n'importe quel anneau_ dans l'emplacement d'artefact.
actors.hero.talent.more_ring.comment=Si ce talent est transmuté après avoir été activé, il retire automatiquement l'anneau déjà équipé dans l'emplacement d'artefact.\n\n« Quel amateur de bagues ! »
actors.hero.talent.more_ring.meta_desc=_Si ce talent est obtenu par un autre héros_, au niveau +1, il permet de changer d'anneau sans consommer de tour, et au niveau +2, d'équiper n'importe quel anneau dans l'emplacement d'artefact.
actors.hero.talent.mana_wreath.title=Enveloppe de Mana
actors.hero.talent.mana_wreath.desc=_+1：_Quand la princesse naine tue un ennemi avec une arme physique enchantée, elle gagne _0~10 points d'armure arcanique_ diminuant tous les _5 tours_.\n\n_+2：_Quand la princesse naine tue un ennemi avec une arme physique enchantée, elle gagne _0~10 points d'armure arcanique_ diminuant tous les _10 tours_.
actors.hero.talent.mana_wreath.comment=Si l'anneau du prince héritier équipé possède un enchantement, ce talent s'applique aussi aux attaques à mains nues, aux armes sans enchantement et aux armes de jet.\n\n“L'excès d'énergie arcanique peut aussi se transformer en armure arcanique contre les attaques magiques.”
actors.hero.talent.magic_arrow.title=Flèche Magique Aiguë
actors.hero.talent.magic_arrow.desc=_+1：_Quand la princesse naine attaque avec une arme de jet enchantée, ses dégâts _augmentent de 15%_.\n\n_+2：_Quand la princesse naine attaque avec une arme de jet enchantée, ses dégâts _augmentent de 30%_.
actors.hero.talent.magic_arrow.comment=Si l'anneau du prince héritier équipé possède un enchantement, ce talent s'applique aussi aux armes de jet sans enchantement.\n\nSi un héros possédant une arme de jet spéciale comme l'Arc Psychique obtient ce talent, l'arme de jet spéciale enchantée bénéficie aussi du bonus.\n\n“Concentrer l'énergie arcanique sur la flèche lui confère une puissance accrue.”
actors.hero.talent.ring_bond.title=Liaison d'Anneaux
actors.hero.talent.ring_bond.desc=_+1：_Si les autres anneaux dans le sac de la princesse naine sont de niveau inférieur à l'Anneau du Prince Héritier, elle gagne _1 niveau supplémentaire_.\n\n_+2：_Si les autres anneaux dans le sac de la princesse naine sont de niveau inférieur à l'Anneau du Prince Héritier, elle gagne _2 niveaux supplémentaires_.\n\n_+3：_Si les autres anneaux dans le sac de la princesse naine sont de niveau inférieur à l'Anneau du Prince Héritier, elle gagne _3 niveaux supplémentaires_.
actors.hero.talent.ring_bond.comment=Le niveau supplémentaire fourni par ce talent ne dépasse pas le niveau de l'Anneau du Prince Héritier.
actors.hero.talent.ring_bond.meta_desc=_Si ce talent est obtenu par un autre héros_, aux niveaux +1/+2/+3, l'effet de liaison de plusieurs anneaux identiques augmente de 1/2/3 niveaux supplémentaires.

actors.hero.herosubclass.runemage=Mage runique
actors.hero.herosubclass.runemage_short_desc=_Le Mage runique_ applique une marque runique après une attaque physique enchantée. La marque peut être déclenchée par un sort de bâton avec des effets selon l'enchantement.
actors.hero.herosubclass.runemage_desc=Le Mage runique applique une marque runique après une attaque physique avec un enchantement positif. La marque stocke les informations d'enchantement, le nombre d'enchantements correspondant au nombre de couches. La marque est déclenchée par un sort de bâton.\n\nQuand le Mage runique déclenche la marque avec un bâton, il inflige des dégâts supplémentaires (couches x 5) à tous les ennemis dans une zone 3x3, avec des effets spéciaux selon l'enchantement stocké.

actors.buffs.runemark.name=Marque runique
actors.buffs.runemark.desc=Le mage runique a marqué une cible avec la puissance des enchantements. Lorsqu'elle est touchée par un sort, une explosion se produit, infligeant des dégâts magiques supplémentaires uniquement aux ennemis, sans affecter le mage runique et ses alliés, et sans endommager l'environnement ni les objets.\n\nCette marque persiste jusqu'à ce qu'elle soit déclenchée par un sort ou que la cible meure.\n\nLa marque a stocké les enchantements suivants :
actors.buffs.runemark$runesurge.name=Afflux runique
actors.buffs.runemark$runesurge.desc=Les enchantements déclenchés par le mage runique seront renforcés pendant un certain temps.\n\nTours restants : %s

actors.hero.talent.darkmark.title=Marque Obscure
actors.hero.talent.darkmark.desc=_+1：_En appliquant une marque runique, le runiste inflige aussi _3 tours de Confusion_.\n\n_+2：_En appliquant une marque runique, le runiste inflige aussi _3 tours de Confusion et Vulnérabilité_.\n\n_+3：_En appliquant une marque runique, le runiste inflige aussi _3 tours de Confusion, Vulnérabilité et Faiblesse_.
actors.hero.talent.darkmark.comment=

actors.hero.talent.rune_blast.title=Détonation Runique
actors.hero.talent.rune_blast.desc=_+1：_Quand la marque runique appliquée par la runiste est déclenchée, elle recharge tous les bâtons de _niveaux de marque x 0,25 charge_.\n\n_+2：_En plus de +1, la marque runique appliquée par la runiste _peut être déclenchée 2 fois_. Si le second déclenchement utilise un bâton différent, _les dégâts de déclenchement +10_.\n\n_+3：_En plus de +1 et +2, la _zone de déclenchement_ de la marque runique passe à _5x5_.
actors.hero.talent.rune_blast.comment=

actors.hero.talent.rune_surge.title=Afflux Runique
actors.hero.talent.rune_surge.desc=_+1：_Pendant les _10 tours_ suivant le déclenchement d'une marque runique, l'effet d'enchantement de la runiste _augmente de 33%_.\n\n_+2：_Pendant les _15 tours_ suivant le déclenchement d'une marque runique, l'effet d'enchantement de la runiste _augmente de 67%_.\n\n_+3：_Pendant les _20 tours_ suivant le déclenchement d'une marque runique, l'effet d'enchantement de la runiste _augmente de 100%_.
actors.hero.talent.rune_surge.comment=Notez que ce talent, comme l'effet de l'Anneau d'Arcanes, n'amplifie que l'effet original des enchantements d'arme et non l'effet de déclenchement des marques runiques.

actors.hero.herosubclass.combatmaster=Maître de combat
actors.hero.herosubclass.combatmaster_short_desc=_Le Maître de combat_ a des effets de gravure d'armure supplémentaires puissants et maîtrise diverses postures de combat.
actors.hero.herosubclass.combatmaster_desc=Le Maître de combat exploite mieux le potentiel des gravures d'armure, offrant des effets puissants liés aux gravures. Il maîtrise également diverses postures de combat, lui donnant un avantage au corps à corps.\n\nIl commence en posture équilibrée. Changer de posture ne coûte pas de tour, mais rechanger dans les 6 tours étourdit 10 tours, empêchant tout changement.\n\nPosture équilibrée : légère augmentation des capacités de combat et de défense\nPosture agressive : augmente les capacités de combat mais réduit la défense\nPosture de parade : augmente la défense mais réduit les capacités de combat\n\nCette spécialisation a une capacité spéciale quand les postures sont disponibles. Maintenir enfoncé le raccourci permet de changer de capacité spéciale.

actors.buffs.fightstance.balance_name=Posture équilibrée
actors.buffs.fightstance.balance_desc=La maître de combat est en _posture équilibrée_. Sous cette posture, ses capacités de combat et de défense sont toutes améliorées.
actors.buffs.fightstance.balance_desc1=Augmente de 10% les dégâts au corps à corps, la défense d'armure, la précision et l'esquive.
actors.buffs.fightstance.balance_desc2=Augmente de 15% les dégâts au corps à corps, la défense d'armure, la précision et l'esquive.
actors.buffs.fightstance.balance_desc3=Augmente de 15% les dégâts au corps à corps, la défense d'armure, la vitesse d'attaque, la vitesse de déplacement, la précision et l'esquive.
actors.buffs.fightstance.invasion_name=Posture agressive
actors.buffs.fightstance.invasion_desc=La maître de combat est en _posture agressive_. Sous cette posture, ses capacités de combat sont améliorées mais sa défense est réduite.
actors.buffs.fightstance.invasion_desc1=Augmente de 20% les dégâts au corps à corps et confère 30% de chance d'attaquer deux fois (la seconde attaque peut déclencher les enchantements de l'arme), mais réduit l'esquive de 30%.
actors.buffs.fightstance.invasion_desc2=Augmente de 30% les dégâts au corps à corps et confère 30% de chance d'attaquer deux fois (la seconde attaque peut déclencher les enchantements de l'arme), mais réduit l'esquive de 30%.
actors.buffs.fightstance.invasion_desc3=Augmente de 30% les dégâts au corps à corps et confère 50% de chance d'attaquer deux fois (la seconde attaque peut déclencher les enchantements de l'arme), mais réduit l'esquive de 15%.
actors.buffs.fightstance.parry_name=Posture de parade
actors.buffs.fightstance.parry_desc=La maître de combat est en _posture de parade_. Sous cette posture, ses capacités défensives sont améliorées mais ses capacités offensives sont réduites.
actors.buffs.fightstance.parry_desc1=Augmente de 20% la défense d'armure et confère une concentration tous les 30 tours (cet effet ne se cumule pas et est annulé en changeant de posture), mais réduit la précision de 30%.
actors.buffs.fightstance.parry_desc2=Augmente de 30% la défense d'armure et confère une concentration tous les 30 tours (cet effet ne se cumule pas et est annulé en changeant de posture), mais réduit la précision de 30%.
actors.buffs.fightstance.parry_desc3=Augmente de 30% la défense d'armure et confère une concentration tous les 20 tours (cet effet ne se cumule pas et est annulé en changeant de posture), mais réduit la précision de 15%.
actors.buffs.fightstance.duration=La maître de combat a maintenu cette posture pendant %s tours.
actors.buffs.fightstance.action=Choisis la posture vers laquelle basculer.
actors.buffs.fightstance$stabilize.name=Stabilisation de posture
actors.buffs.fightstance$stabilize.desc=Tu viens de changer de posture. Il est préférable d'attendre d'être stabilisé avant d'en changer à nouveau.\n\nChanger de posture pendant cette période nécessitera plus de temps pour coordonner ton équilibre et tu ne pourras donc pas changer de posture.\n\nTu as encore besoin de %s tours pour te stabiliser.
actors.buffs.fightstance$coordination.name=Coordination de posture
actors.buffs.fightstance$coordination.desc=Tu as changé de posture plusieurs fois en peu de temps. Pour coordonner ton équilibre, tu dois attendre avant de pouvoir changer à nouveau de posture.\n\nTu as encore besoin de %s tours pour coordonner ton équilibre.
actors.buffs.fightstance$focus.name=Concentration
actors.buffs.fightstance$focus.desc=La maître de combat se concentre sur tout ce qui l'entoure et peut anticiper la prochaine attaque dirigée contre elle. En état de concentration, elle parera à coup sûr la prochaine attaque.
actors.hero.talent.fluent.title=Couler comme l'Eau
actors.hero.talent.fluent.desc=_+1：_Le maître combattant qui change de posture plusieurs fois en peu de temps _n'est plus étourdi_, mais ne peut toujours pas changer de posture pendant 10 tours.\n\n_+2：_En plus de +1, passer de la Posture Équilibrée à la Posture Agressive confère _5 tours de Célérité_, tandis que passer à la Posture de Parade confère _20 points de bouclier_.\n\n_+3：_En plus de +1 et +2, passer de la Posture Agressive à la Posture Équilibrée confère _4 tours de charge de bâton_, tandis que passer de la Posture de Parade à la Posture Équilibrée confère _4 tours de charge d'artefact_.
actors.hero.talent.fluent.comment=

actors.hero.talent.stance_mastery.title=Maîtrise des Postures
actors.hero.talent.stance_mastery.desc=_+1：_Les capacités améliorées du maître combattant en Posture Équilibrée _augmentent de 5%_.\n\n_+2：_En plus de +1, le bonus de dégâts de mêlée en Posture Agressive et le bonus d'armure en Posture de Parade _passent à 30%_.\n\n_+3：_En plus de +1 et +2, en Posture Équilibrée, le maître combattant gagne aussi _un bonus de vitesse d'attaque et de déplacement_ ; en Posture Agressive, la probabilité de combo _passe à 50%_ ; en Posture de Parade, l'intervalle de Concentration _passe à 20 tours_ ; et les effets négatifs correspondants des deux dernières postures _sont réduits à 15%_.
actors.hero.talent.stance_mastery.comment=

actors.hero.talent.inelement.title=À l'Aise
actors.hero.talent.inelement.desc=_+1：_Quand le maître combattant reste dans une posture pendant plus de _20 tours_, son effet de gravure augmente de _33%_.\n\n_+2：_Quand le maître combattant reste dans une posture pendant plus de _15 tours_, son effet de gravure augmente de _67%_.\n\n_+3：_Quand le maître combattant reste dans une posture pendant plus de _10 tours_, son effet de gravure augmente de _100%_.
actors.hero.talent.inelement.comment=Notez que ce talent, comme l'Anneau d'Arcanes, ne fait qu'amplifier l'effet original de la gravure d'armure sans affecter les bonus supplémentaires du maître combattant.

actors.hero.abilities.princess.marchforward.name=À grands pas
actors.hero.abilities.princess.marchforward.short_desc=La Princesse naine avance _à grands pas_, devenant plus rapide à chaque pas.
actors.hero.abilities.princess.marchforward.desc=La Princesse naine avance à grands pas, augmentant sa vitesse de déplacement de 50%, et de 5% supplémentaires par pas jusqu'à 100% maximum.\n\nCet effet est immédiatement interrompu si elle subit des dégâts.
actors.hero.abilities.princess.marchforward$forward.name=À grands pas
actors.hero.abilities.princess.marchforward$forward.desc=La Princesse naine avance à grands pas, augmentant sa vitesse de déplacement de %1$s%%, et de 5%% supplémentaires par pas, jusqu'à %2$s%% maximum.\n\nCet effet dure jusqu'à ce qu'elle subisse %3$d dégâts.
actors.hero.abilities.princess.marchforward.say=C'était une tactique dilatoire !
actors.hero.talent.speedup.title=À Toute Vitesse
actors.hero.talent.speedup.desc=_+1：_Le bonus de vitesse de déplacement de la princesse naine et sa limite _augmentent de 12,5%_.\n\n_+2：_Le bonus de vitesse de déplacement de la princesse naine et sa limite _augmentent de 25%_.\n\n_+3：_Le bonus de vitesse de déplacement de la princesse naine et sa limite _augmentent de 37,5%_.\n\n_+4：_Le bonus de vitesse de déplacement de la princesse naine et sa limite _augmentent de 50%_.
actors.hero.talent.speedup.comment=

actors.hero.talent.run_attack.title=Technique d'Attaque en Course
actors.hero.talent.run_attack.desc=_+1：_Les attaques physiques de la princesse naine dans cet état ont _7,5% de chances_ de ne pas consommer de tour.\n\n_+2：_Les attaques physiques de la princesse naine dans cet état ont _15% de chances_ de ne pas consommer de tour.\n\n_+3：_Les attaques physiques de la princesse naine dans cet état ont _22,5% de chances_ de ne pas consommer de tour.\n\n_+4：_Les attaques physiques de la princesse naine dans cet état ont _30% de chances_ de ne pas consommer de tour.
actors.hero.talent.run_attack.comment=

actors.hero.talent.delay_tactic.title=Stratagème Dilatoire
actors.hero.talent.delay_tactic.desc=_+1：_La princesse naine doit _subir 2 attaques_ pour interrompre cet effet. Si les dégâts viennent d'un attaquant, elle inflige _2 tours de Ralentissement_ à celui-ci.\n\n_+2：_La princesse naine doit _subir 2 attaques_ pour interrompre cet effet. Si les dégâts viennent d'un attaquant, elle inflige _4 tours de Ralentissement_ à celui-ci.\n\n_+3：_La princesse naine doit _subir 3 attaques_ pour interrompre cet effet. Si les dégâts viennent d'un attaquant, elle inflige _6 tours de Ralentissement_ à celui-ci.\n\n_+4：_La princesse naine doit _subir 3 attaques_ pour interrompre cet effet. Si les dégâts viennent d'un attaquant, elle inflige _8 tours de Ralentissement_ à celui-ci.
actors.hero.talent.delay_tactic.comment=

actors.hero.abilities.princess.taboomagic.name=Sort interdit
actors.hero.abilities.princess.taboomagic.short_desc=La Princesse naine peut lancer un _sort interdit_, infligeant de nombreux effets négatifs à un ennemi.
actors.hero.abilities.princess.taboomagic.desc=La Princesse naine peut lancer un sort interdit des archives naines, maudissant un ennemi avec de nombreux effets négatifs.\n\nLa cible ne peut être elle-même ou un allié. L'ennemi subit confusion, vulnérabilité et faiblesse pendant 10 tours. Ce sort peut déclencher les marques de runes du Mage runique.
actors.hero.abilities.princess.taboomagic.no_target=Aucune cible appropriée à cet endroit.
actors.hero.abilities.princess.taboomagic.say=Doucement, silencieusement, la vie se réduit en poussière.
actors.hero.abilities.princess.taboomagic.say1=La mort arrive lentement — imprévisible, inévitable.
actors.hero.abilities.princess.taboomagic.say2=L'esprit ne peut supporter un tel choc.
actors.hero.abilities.princess.taboomagic.say3=Confusion, halètement, franchissant la limite de la raison pour sombrer dans une folie sans fin !

actors.hero.abilities.princess.taboomagic.prompt=Choisissez la cible du sort interdit

actors.hero.talent.element_curse.title=Malédiction Élémentaire
actors.hero.talent.element_curse.desc=_+1：_Les sorts interdits infligent aussi _4 tours de Brûlure ou 8 tours de Gelure_.\n\n_+2：_En plus de +1, infligent aussi _5 tours d'Immobilisation_.\n\n_+3：_Les sorts interdits infligent aussi _8 tours de Brûlure ou 16 tours de Gelure_.\n\n_+4：_En plus de +3, infligent aussi _10 tours d'Immobilisation_.
actors.hero.talent.element_curse.comment=
actors.hero.talent.afflicted_illness.title=Affliction Maladive
actors.hero.talent.afflicted_illness.desc=_+1：_Les sorts interdits infligent aussi _4 tours de poison et 4 dégâts de saignement bruts_.\n\n_+2：_En plus de +1, infligent aussi _5 tours de mutilation_.\n\n_+3：_Les sorts interdits infligent aussi _8 tours de poison et 8 dégâts de saignement bruts_.\n\n_+4：_En plus de +3, infligent aussi _10 tours de mutilation_.
actors.hero.talent.afflicted_illness.comment=
actors.hero.talent.spread_pain.title=Répandre la Douleur
actors.hero.talent.spread_pain.desc=_+1：_Quand la princesse naine lance un sort interdit avec 100% de charge d'armure, la zone d'effet du sort s'étend à une _zone de 3x3_ centrée sur la cible.\n\n_+2：_Quand la princesse naine lance un sort interdit avec 100% de charge d'armure, la zone d'effet du sort s'étend à une _zone de 5x5_ centrée sur la cible.\n\n_+3：_Quand la princesse naine lance un sort interdit avec 100% de charge d'armure, la zone d'effet du sort s'étend à une _zone de 7x7_ centrée sur la cible.\n\n_+4：_Quand la princesse naine lance un sort interdit avec 100% de charge d'armure, la zone d'effet du sort s'étend à une _zone de 9x9_ centrée sur la cible.
actors.hero.talent.spread_pain.comment=Le héros et ses alliés dans cette zone ne sont pas affectés.

actors.hero.abilities.princess.kingblade.name=Lame du souverain
actors.hero.abilities.princess.kingblade.short_desc=La Princesse naine abat sa _lame du souverain_, blessant gravement l'ennemi et l'empêchant de riposter.
actors.hero.abilities.princess.kingblade.desc=La Princesse naine peut porter une attaque normale inévitable sur un ennemi adjacent, avec 50% de dégâts supplémentaires.\n\nSi l'ennemi survit, il est désarmé pendant 8 tours. S'il meurt, tous les ennemis dans le champ de vision de la Princesse sont désarmés 4 tours. Les ennemis désarmés ne peuvent infliger aucun dégât physique, mais les boss résistent à cet effet.
actors.hero.abilities.princess.kingblade.no_target=Vous devez sélectionner une cible adjacente.
actors.hero.abilities.princess.kingblade.say1=Arrière !
actors.hero.abilities.princess.kingblade.say2=Désarmé
actors.hero.abilities.princess.kingblade$disarm.name=Désarmement
actors.hero.abilities.princess.kingblade$disarm.desc=Cet ennemi a été désarmé.\n\nLes ennemis désarmés attaquent toujours mais ne peuvent infliger aucun dégât physique à vous et vos alliés. Les boss infligent encore 50%% de leurs dégâts physiques.\n\nDurée du désarmement : %s tours
actors.hero.talent.king_gaze.title=Regard du Roi
actors.hero.talent.king_gaze.desc=_+1：_En brandissant la Lame du Roi, la princesse naine gagne _2 tours de Vision Intérieure_ et inflige immédiatement _4 tours de Désarmement_ aux ennemis dans son champ de vision.\n\n_+2：_En brandissant la Lame du Roi, la princesse naine gagne _4 tours de Vision Intérieure_ et inflige immédiatement _4 tours de Désarmement_ aux ennemis dans son champ de vision.\n\n_+3：_En brandissant la Lame du Roi, la princesse naine gagne _6 tours de Vision Intérieure_ et inflige immédiatement _4 tours de Désarmement_ aux ennemis dans son champ de vision.\n\n_+4：_En brandissant la Lame du Roi, la princesse naine gagne _8 tours de Vision Intérieure_ et inflige immédiatement _4 tours de Désarmement_ aux ennemis dans son champ de vision.
actors.hero.talent.king_gaze.comment=
actors.hero.talent.king_power.title=Force du Roi
actors.hero.talent.king_power.desc=_+1：_Le bonus de dégâts de ce coup passe à _62,5%_.\n\n_+2：_Le bonus de dégâts de ce coup passe à _75%_.\n\n_+3：_Le bonus de dégâts de ce coup passe à _87,5%_.\n\n_+4：_Le bonus de dégâts de ce coup passe à _100%_.
actors.hero.talent.king_power.comment=
actors.hero.talent.king_might.title=Puissance du Roi
actors.hero.talent.king_might.desc=_+1：_Si ce coup tue l'ennemi, _5% de la charge d'armure_ est restituée.\n\n_+2：_Si ce coup tue l'ennemi, _10% de la charge d'armure_ est restituée.\n\n_+3：_Si ce coup tue l'ennemi, _15% de la charge d'armure_ est restituée.\n\n_+4：_Si ce coup tue l'ennemi, _20% de la charge d'armure_ est restituée.
actors.hero.talent.king_might.comment=


actors.hero.heroclass.friar=Frère
actors.hero.heroclass.friar_desc_short=Le Frère peut utiliser son _pistolet alchimique_ pour tirer des potions. Il peut _consommer de la raison pour de l'énergie alchimique_. Quand sa raison est épuisée, son _esprit est mis à l'épreuve_.
actors.hero.heroclass.friar_desc=Le Frère commence avec un _pistolet alchimique unique_, pouvant équiper des potions pour tirer.\n\nLe Frère peut _consommer de la raison pour la convertir en énergie alchimique_. En explorant les profondeurs, il peut perdre la raison. Quand elle est épuisée, son _esprit est mis à l'épreuve_.\n\nIl commence également avec _un fouet_, une armure en tissu, une gourde et un sac en tissu.\n\nObjets identifiés au début :\n_-_Potion de célérité\n_-_Parchemin de métamorphose, d'identification et de peur
actors.hero.heroclass.friar_unlock=_Vaincre Yog-Dzewa dans une partie_ pour débloquer le Frère.
actors.buffs.reason.name=Raison
actors.buffs.reason.desc_full=Ta conscience est parfaitement claire, du moins pour l'instant.\n\n
actors.buffs.reason.desc_half=Tu te sens un peu étourdi, mais cela n'affecte pas tes actions.\n\n
actors.buffs.reason.desc_quarter=Tu as un mal de tête atroce et ta respiration devient difficile.\n\n
actors.buffs.reason.desc_zero=Tu es au bord de la folie !\n\n
actors.buffs.reason.desc_simple=En explorant le donjon, affronter des ennemis terrifiants, marcher sur des pièges mortels ou souffrir de la faim épuiseront ta raison déjà limitée. Quand ta raison sera à bout, ton esprit sera mis à l'épreuve. Sera-ce une torture mentale qui viendra en premier ? Ou une noble qualité qui ne surgit que dans le désespoir ? Nul ne le sait.\n\nBien sûr, tout n'est pas si contraignant. En alchimie ou en chargeant un lanceur alchimique, tu peux convertir de la raison en énergie alchimique. Chaque point d'énergie alchimique produit consomme 5 points de raison.\n\nLa raison ne se régénère pas avec le temps. Les principaux moyens de la restaurer sont de tuer des ennemis, découvrir des secrets cachés et se nourrir.\n\nRaison actuelle : %s/100
actors.buffs.reason.half=Tu te sens un peu étourdi, mais rien de grave.
actors.buffs.reason.quarter=Tu as un mal de tête atroce, ta raison vacille.
actors.buffs.reason.zero=Tu es au bord de la folie !
actors.buffs.reason.kaoyan=Ton esprit est mis à l'épreuve...
actors.buffs.reason.energize_name=Raffinage d'énergie
actors.buffs.reason.energize_desc=Tu peux raffiner certains objets pour les convertir en énergie alchimique, y compris les potions, parchemins, graines, pierres runiques et autres objets liés à l'alchimie.\n\nTu peux aussi consommer une partie de ta raison pour la convertir en énergie alchimique. Chaque point d'énergie alchimique produit consomme généralement 5 points de raison.\n\nRaison actuelle : %s/100
actors.buffs.reason.energize_item=Choisis un objet à raffiner
actors.buffs.reason.energize_1=Convertir 5 points de raison en 1 point d'énergie
actors.buffs.reason.die=Tu meurs d'un arrêt cardiaque...
actors.buffs.reason.rankings_desc=Mort par : arrêt cardiaque
actors.buffs.suffering.name=Supplice
actors.buffs.suffering.desc=Tu subis %s !
actors.buffs.suffering$fear.name=Supplice : Peur
actors.buffs.suffering$fear.desc=La timidité et la lâcheté ont enfin saisi leur proie.\n\nPendant ce supplice, ton esquive est augmentée de 50%%, mais les dégâts physiques que tu infliges sont réduits de 25%%.\n\nSi tu es touché par un ennemi, tu as 30%% de chance de perdre 5 points de raison supplémentaires.\n\nCe supplice dure encore %s tours. Tuer des ennemis permet de l'éliminer plus rapidement.\n\nSi ta raison atteint zéro, tu succomberas à ce supplice douloureux.
actors.buffs.suffering$paranoia.name=Supplice : Paranoïa
actors.buffs.suffering$paranoia.desc=Parfois, la folie apporte une illumination, mais c'est bien trop rare...\n\nPendant ce supplice, ta vitesse d'attaque est augmentée de 20%%, mais ta précision est réduite de 20%%.\n\nSi ton attaque manque sa cible, tu as 30%% de chance de perdre 5 points de raison supplémentaires.\n\nCe supplice dure encore %s tours. Tuer des ennemis permet de l'éliminer plus rapidement.\n\nSi ta raison atteint zéro, tu succomberas à ce supplice douloureux.
actors.buffs.suffering$despair.name=Supplice : Désespoir
actors.buffs.suffering$despair.desc=Dans cet enfer, il n'y a aucun espoir, pas la moindre lueur d'espoir.\n\nPendant ce supplice, ta vitesse de déplacement est augmentée de 20%%, mais tu ne peux esquiver aucune attaque.\n\nCe supplice dure encore %s tours. Tuer des ennemis permet de l'éliminer plus rapidement.\n\nSi ta raison atteint zéro, tu succomberas à ce supplice douloureux.
actors.buffs.virtue.name=Vertu
actors.buffs.virtue.desc=Tu obtiens %s !
actors.buffs.virtue$firm.name=Vertu : Fermeté
actors.buffs.virtue$firm.desc=Beaucoup sombreraient dans la panique et le chaos, mais pas cette personne, pas maintenant !\n\nPendant cette vertu, tu obtiens un bouclier équivalant à 25%% de tes PV max qui ne se dissipe pas naturellement, et tout excès de soin est également converti en bouclier qui ne se dissipe pas naturellement.\n\nDe plus, chaque fois que tu tues un ennemi, tu as 25%% de chance de récupérer 6 points de raison supplémentaires.\n\nCette vertu dure encore %s tours. Tuer des ennemis la prolonge efficacement.\n\nSi ta raison atteint zéro, tu récupères immédiatement 100 points de raison, mais tu perds cette vertu.
actors.buffs.virtue$inspire.name=Vertu : Inspiration
actors.buffs.virtue$inspire.desc=Des souffrances infinies peuvent aussi engendrer l'espoir et raviver l'énergie !\n\nActiver cette vertu ramène ta raison à un meilleur état.\n\nDe plus, pendant cette vertu, chaque fois que tu tues un ennemi, tu as 25%% de chance de récupérer 10%% supplémentaires de tes PV max.\n\nCette vertu dure encore %s tours. Tuer des ennemis la prolonge efficacement.\n\nSi ta raison atteint zéro, tu récupères immédiatement 100 points de raison, mais tu perds cette vertu.
actors.buffs.virtue$fearless.name=Vertu : Intrépidité
actors.buffs.virtue$fearless.desc=Ce n'est que dans l'obscurité la plus désespérée que le courage soudain peut briller de mille feux.\n\nPendant cette vertu, ta vitesse de déplacement est augmentée de 50%%.\n\nDe plus, tu ne crains aucune obscurité et n'es plus affecté par la panique.\n\nCette vertu dure encore %s tours. Tuer des ennemis la prolonge efficacement.\n\nSi ta raison atteint zéro, tu récupères immédiatement 100 points de raison, mais tu perds cette vertu.


actors.buffs.panic.name=Peur panique
actors.buffs.panic.desc=Une panique flétrissante dévore ton esprit !\n\nLes attaques des ennemis morts-vivants et démoniaques érodent directement ta raison et peuvent te plonger dans une peur sans précédent. En état de panique, tu perds 1 à 2 points de raison par tour.\n\nTu as encore besoin de %s tours pour surmonter ta peur...
actors.buffs.panic.get=Tu ressens une peur sans précédent !

actors.hero.talent.tranquil_tincture.title=Teinture Tranquille
actors.hero.talent.tranquil_tincture.desc=_+1：_En explorant les étages suivants du donjon, le moine peut acheter _2 teintures tranquilles_ à la boutique.\n\n_+2：_En explorant les étages suivants du donjon, le moine peut acheter _3 teintures tranquilles_ à la boutique.
actors.hero.talent.tranquil_tincture.comment=La teinture tranquille se consomme rapidement, restaure un peu de satiété, dissipe la Peur et rend 50 points de raison au moine.

actors.buffs.erodingsoul.name=Érosion de l'âme
actors.buffs.erodingsoul.desc=La magie corruptrice érode partiellement l'âme même des créatures non corrompues.\n\nLes créatures affectées ont 20% de chance de se transformer en spectre corrompu à leur mort, et cette probabilité augmente de 5% pour chaque effet négatif existant (à l'exclusion de cet effet lui-même).\n\nSi la créature est corrompue ou condamnée avant de mourir, cet effet persiste et la transforme directement en spectre corrompu après sa mort définitive.\n\nCet effet est permanent, jusqu'à la fin de sa vie.

actors.hero.talent.eroding_soul.title=Âme Corrosive
actors.hero.talent.eroding_soul.desc=_+1：_Obtenez _1 Baguette de Corruption_. La Baguette de Corruption inflige un effet permanent _d'âme Corrosive_ (inefficace sur les ennemis _Morts-Vivants_).\n\n_+2：_En plus de +1 (hors ressource), la Baguette de Corruption a _50% de chances_ d'infliger un affaiblissement supplémentaire.
actors.hero.talent.eroding_soul.comment=Les créatures affectées par l'âme Corrosive ont _20% + nombre d'affaiblissements x5% de chances_ de se transformer en Spectre Corrompu à leur mort. Si déjà corrompues ou condamnées, cet effet est conservé jusqu'à leur mort définitive.\n\nCes talents qui fournissent directement des ressources via amélioration ou transformation partagent _26 limites de déclenchement_ (39 pour le gentleman).

actors.hero.talent.credulous.title=Abandon de la Foi
actors.hero.talent.credulous.desc=_+1：_Le Livre Saint peut lancer le sort _Abandon de la Foi_, consommant 1 charge pour obtenir _10 tours d'immunité magique_.\n\n_+2：_En plus de +1, ce sort est _instantané_.
actors.hero.talent.credulous.comment=“Traître, tu seras puni.”

actors.hero.talent.penetrating_cast.title=Percée
actors.hero.talent.penetrating_cast.desc=_+1：_Lancer un sort de bâton ou de baguette infligeant directement des dégâts dissipe tous les effets négatifs de l'ennemi. Pour chaque effet dissipé, les dégâts de ce sort _augmentent de 10%_.\n\n_+2：_Lancer un sort de bâton ou de baguette infligeant directement des dégâts dissipe tous les effets négatifs de l'ennemi. Pour chaque effet dissipé, les dégâts de ce sort _augmentent de 20%_.
actors.hero.talent.penetrating_cast.comment=« Perce la magie qui recouvre le corps ennemi, et le choc restant s'enfonce plus profondément dans la chair. »

actors.hero.talent.bountiful_enhancement.title=Renforcement d'Abondance
actors.hero.talent.bountiful_enhancement.desc=_+1：_Manger de la nourriture de la Corne d'Abondance confère _5 tours de Réserve Abondante_.\n\n_+2：_En plus de +1, la satiété restaurée par chaque charge de la Corne d'Abondance augmente de _20 points_.\n\n_+3：_La satiété restaurée par chaque charge de la Corne d'Abondance augmente de _30 points_.
actors.hero.talent.bountiful_enhancement.comment=Quand l'effet de Réserve Abondante prend fin, _un effet de repas se déclenche_. Consommer plusieurs fois de la nourriture de la Corne d'Abondance en peu de temps n'augmente pas le nombre de déclenchements.\n\n“L'abondance ne signifie pas seulement plus de nourriture, mais aussi la plénitude spirituelle à chaque repas.”
actors.hero.talent$delayedsatisfaction.name=Réserve d'abondance
actors.hero.talent$delayedsatisfaction.desc=Manger de la corne d'abondance vous a enrichi spirituellement. La magie déclenchera à nouveau l'effet du repas dans %s tours.

actors.hero.talent.ice_hell.title=Enfer de Glace
actors.hero.talent.ice_hell.desc=_+1：_Les sorts du Bâton de Glace sur les ennemis sous l'effet _Gelure_ _n'ont plus de diminution de dégâts_.\n\n_+2：_En plus de +1, les sorts du Bâton de Glace sur les ennemis sous l'effet _Gel_ infligent _niveau du bâton x4_ points de dégâts magiques.\n\n_+3：_En plus de +1 et +2, les sorts du Bâton de Glace ont _50% de chances_ de générer une zone de froid de _3x3_ durant _10 tours_ à l'emplacement ciblé.
actors.hero.talent.ice_hell.comment=“Le froid ne se contente plus de voler lentement la chaleur, mais transforme l'espace tout entier en un enfer gelant toute vie.”

actors.hero.talent.boss_talent_slot_1.title=Talent Vide
actors.hero.talent.boss_talent_slot_1.desc=Dès votre descente dans ce donjon, vous sentiez que quelque chose clochait. Ce n'est que maintenant que vous réalisez que certains de vos talents ont été effacés, ne laissant qu'un vide...\n\nHeureusement, en vainquant les puissants ennemis au cœur de ce donjon, vous obtiendrez une force encore plus grande. En bref, la seule option est d'avancer.\n\nLire le parchemin de sublimation laissé par le boss de l'étage 5 sublime ce talent en un talent de boss correspondant et offre un point de talent supplémentaire au niveau 1. Ce talent ne peut être ni amélioré ni transformé avant cela.
actors.hero.talent.boss_talent_slot_1.comment=
actors.hero.talent.boss_talent_slot_2.title=Talent Vide
actors.hero.talent.boss_talent_slot_2.desc=Dès votre descente dans ce donjon, vous sentiez que quelque chose clochait. Ce n'est que maintenant que vous réalisez que certains de vos talents ont été effacés, ne laissant qu'un vide...\n\nHeureusement, en vainquant les puissants ennemis au cœur de ce donjon, vous obtiendrez une force encore plus grande. En bref, la seule option est d'avancer.\n\nLire le parchemin de sublimation laissé par le boss de l'étage 10 sublime ce talent en un talent de boss correspondant et offre un point de talent supplémentaire au niveau 2. Ce talent ne peut être ni amélioré ni transformé avant cela.
actors.hero.talent.boss_talent_slot_2.comment=
actors.hero.talent.boss_talent_slot_3.title=Talent Vide
actors.hero.talent.boss_talent_slot_3.desc=Dès votre descente dans ce donjon, vous sentiez que quelque chose clochait. Ce n'est que maintenant que vous réalisez que certains de vos talents ont été effacés, ne laissant qu'un vide...\n\nHeureusement, en vainquant les puissants ennemis au cœur de ce donjon, vous obtiendrez une force encore plus grande. En bref, la seule option est d'avancer.\n\nLire le parchemin de sublimation laissé par le boss de l'étage 15 sublime ce talent en un talent de boss correspondant et offre un point de talent supplémentaire au niveau 2. Ce talent ne peut être ni amélioré ni transformé avant cela.
actors.hero.talent.boss_talent_slot_3.comment=
