actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=Ré vélable via une capacité d'armure héroïque.

actors.hero.abilities.huntress.spectralblades.name=Lame Spectrale
actors.hero.abilities.huntress.spectralblades.short_desc=La Chasseresse lance une _Lame Spectrale_ dont les dégâts dépendent de son arme de mêlée.
actors.hero.abilities.huntress.spectralblades.desc=La Chasseresse lance une lame spectrale, comme une attaque à distance conservant tous les effets de mêlée (enchantements inclus).
actors.hero.abilities.huntress.naturespower.name=Force de la Nature
actors.hero.abilities.huntress.naturespower.short_desc=La Chasseresse invoque la _Force de la Nature_, augmentant vitesse et cadence de tir.
actors.hero.abilities.huntress.naturespower.desc=Force de la Nature imprègne la Chasseresse et son arc pour 8 tours : double vitesse, +33% cadence de tir. N'affecte pas l'attaque du Sniper.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=Force de la Nature
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=Force de la Nature temporaire : vitesse et cadence augmentées.
