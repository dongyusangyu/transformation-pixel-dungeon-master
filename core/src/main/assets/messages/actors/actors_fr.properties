actors.hero.talent$preciseassaulttracker.desc=La prochaine attaque de mêlée normale de la duelliste bénéficiera d'un bonus de précision.\n\nTours restants : %s
actors.hero.talent$deadlyfollowuptracker.name=Enchaînement Mortel
actors.hero.talent$deadlyfollowuptracker.desc=La duelliste a récemment touché un ennemi avec une arme de jet, son attaque de mêlée contre la même cible infligera des dégâts bonus.\n\nTours restants : %s
actors.hero.talent$combinedlethalityabilitytracker.executed=Exécuté !
actors.hero.talent$satiatedspellstracker.name=Sorts Rassasiés
actors.hero.talent$satiatedspellstracker.desc=La prochaine incantation du prétre lui fournira un petit bouclier.
actors.hero.talent$searinglightcooldown.name=Lumière Brûlante
actors.hero.talent$searinglightcooldown.desc=Lumière Brûlante en recharge. Tours restants : %s


#warrior
actors.hero.talent.type=Talent de type
actors.hero.talent.hearty_meal.title=Repas Copieux
actors.hero.talent.hearty_meal.desc=_+1：_ Lorsque le guerrier mange alors que ses PV sont inférieurs ou égaux â 33%, il récupére _4 PV_.\n\n_+2：_ Lorsque le guerrier mange alors que ses PV sont inférieurs ou égaux â 33%, il récupére _6 PV_.
actors.hero.talent.hearty_meal.comment=“Même le pain sec suffit â un vrai guerrier.”
actors.hero.talent.veterans_intuition.title=Intuition du Vétéran
actors.hero.talent.veterans_intuition.desc=_+1：_ La vitesse d'identification des armes par le guerrier est multipliée par _1,75_, et celle des armures par _2,5_.\n\n_+2：_ La vitesse d'identification des armes par le guerrier est multipliée par _2,5_, et il peut les identifier _en les équipant_.
actors.hero.talent.veterans_intuition.comment=“Ce sont des leçons apprises sur les champs de bataille du Nord.”
actors.hero.talent.provoked_anger.title=Provocation
actors.hero.talent.provoked_anger.desc=_+1：_ Lorsque l'effet de bouclier du guerrier est brisé par des dégâts, sa prochaine attaque physique inflige _3 dégâts supplémentaires_.\n\n_+2：_ Lorsque l'effet de bouclier du guerrier est brisé par des dégâts, sa prochaine attaque physique inflige _5 dégâts supplémentaires_.
actors.hero.talent.provoked_anger.comment=“Quiconque défie un guerrier du Nord repose en paix.”
actors.hero.talent.iron_will.title=Volonté de Fer
actors.hero.talent.iron_will.desc=_+1：_ Le bouclier fourni par l'emblème du guerrier _augmente de 1_.\n\n_+2：_ Le bouclier fourni par l'emblème du guerrier _augmente de 2_.
actors.hero.talent.iron_will.comment=“Comment l'acier est trempé.”
actors.hero.talent.iron_will.meta_desc=_Si ce talent est obtenu par un autre héros_, il fournit l'effet de l'emblème brisé du guerrier avec un bouclier maximal de 1 ou 2 points.

actors.hero.talent.iron_stomach.title=Estomac de Fer
actors.hero.talent.iron_stomach.desc=_+1：_ Le guerrier ne met qu'1 tour â manger et gagne _75% de résistance aux dégâts_ en mangeant.\n\n_+2：_ Le guerrier ne met qu'1 tour â manger et gagne _100% de résistance aux dégâts_ en mangeant.
actors.hero.talent.iron_stomach.comment=“En temps de guerre, le cessez-le-feu pendant les repas est une règle entre soldats.”
actors.hero.talent.liquid_willpower.title=Volonté Liquide
actors.hero.talent.liquid_willpower.desc=_+1：_ Lorsque le guerrier boit ou lance une potion, une concoction ou une essence, il gagne un bouclier équivalant â _6,5% de ses PV max_.\n\n_+2：_ Lorsque le guerrier boit ou lance une potion, une concoction ou une essence, il gagne un bouclier équivalant â _10% de ses PV max_.
actors.hero.talent.liquid_willpower.comment=Si la potion utilisée est une potion de force, d'expérience ou un objet alchimique nécessitant l'une des potions susmentionnées, le bouclier gagné est doublé.\n\nPour les objets alchimiques â rendement élevé (comme les potions aquexplosives), ce talent se déclenche en fonction de la quantité produite par l'objet.\n\n“Une bonne rasade réveille l'âme guerrière, et les potions aussi.”
actors.hero.talent.runic_transference.title=Transfert Runique
actors.hero.talent.runic_transference.desc=_+1：_ L'emblème brisé du guerrier peut porter _un glyphe commun_, comme s'il bénéficiait d'un niveau d'amélioration.\n\n_+2：_ L'emblème brisé du guerrier peut porter _un glyphe commun, puissant ou maudit_, comme s'il bénéficiait d'un niveau d'amélioration.
actors.hero.talent.runic_transference.comment=L'emblème brisé ne peut porter que les glyphes apposés sur l'armure au moment oû l'emblème y est fixé.\n\n“Ce qui y est gravé n'est pas qu'un glyphe, c'est aussi l'ancienne gloire du guerrier.”
actors.hero.talent.runic_transference.meta_desc=_Si ce talent est obtenu par un autre héros_, il augmente le niveau maximum auquel un glyphe d'armure n'est pas effacé par un parchemin d'amélioration. Au talent +1, l'armure a une chance d'effacer le glyphe â partir de +6 (au lieu de +4), et au talent +2 â partir de +7 (au lieu de +4). Â +8, le glyphe est toujours effacé.
actors.hero.talent.lethal_momentum.title=Momentum Mortel
actors.hero.talent.lethal_momentum.desc=_+1：_ Lorsque le guerrier tue un ennemi avec une arme physique, ce coup a _67% de chance_ de ne pas consommer de tour.\n\n_+2：_ Lorsque le guerrier tue un ennemi avec une arme physique, ce coup a _100% de chance_ de ne pas consommer de tour.
actors.hero.talent.lethal_momentum.comment=“Bain de sang !”
actors.hero.talent.improvised_projectiles.title=Projectiles de Fortune
actors.hero.talent.improvised_projectiles.desc=_+1：_ Lorsque le guerrier lance un objet non-armé sur un ennemi, il inflige _2 tours_ de cécité.\n\n_+2：_ Lorsque le guerrier lance un objet non-armé sur un ennemi, il inflige _3 tours_ de cécité.
actors.hero.talent.improvised_projectiles.comment=Ce talent a _un rechargement de 20 tours_.\n\n“Quand il s'ennuie, le guerrier lance des objets en l'air, développant ainsi la capacité de les lancer précisément dans l'œil de l'ennemi.”

actors.hero.talent.hold_fast.title=Tenir Bon
actors.hero.talent.hold_fast.desc=_+1：_ Lorsque le guerrier attend, il gagne _1~2 points d'armure_ et ralentit la dégradation des combos et du bouclier de _50%_, jusqu'â ce qu'il se déplace.\n\n_+2：_ Lorsque le guerrier attend, il gagne _2~4 points d'armure_ et ralentit la dégradation des combos et du bouclier de _75%_, jusqu'â ce qu'il se déplace.\n\n_+3：_ Lorsque le guerrier attend, il gagne _3~6 points d'armure_ et ralentit la dégradation des combos et du bouclier de _100%_, jusqu'â ce qu'il se déplace.
actors.hero.talent.hold_fast.comment=
actors.hero.talent.strongman.title=Colosse
actors.hero.talent.strongman.desc=_+1：_ La force du guerrier augmente de _8%_, arrondie â l'inférieur.\n\n_+2：_ La force du guerrier augmente de _13%_, arrondie â l'inférieur.\n\n_+3：_ La force du guerrier augmente de _18%_, arrondie â l'inférieur.
actors.hero.talent.strongman.comment=

actors.hero.talent.endless_rage.title=Rage Inépuisable
actors.hero.talent.endless_rage.desc=_+1：_ La limite de rage du berserker passe â _116%_.\n\n_+2：_ La limite de rage du berserker passe â _133%_.\n\n_+3：_ La limite de rage du berserker passe â _150%_.
actors.hero.talent.endless_rage.comment=Lorsque la rage dépasse 100%, chaque 1% de rage supplémentaire augmente le bouclier de 1% et réduit le temps de recharge de l'enragement de 1%, mais l'augmentation des dégâts ne peut dépasser 50%.
actors.hero.talent.deathless_fury.title=Furie Immortelle
actors.hero.talent.deathless_fury.desc=_+1：_ Lorsque le berserker est sur le point de mourir et que sa rage atteint au moins 100%, il s'enrage automatiquement. Cet effet nécessite _3 niveaux de héros_ pour se recharger.\n\n_+2：_ Lorsque le berserker est sur le point de mourir et que sa rage atteint au moins 100%, il s'enrage automatiquement. Cet effet nécessite _2 niveaux de héros_ pour se recharger.\n\n_+3：_ Lorsque le berserker est sur le point de mourir et que sa rage atteint au moins 100%, il s'enrage automatiquement. Cet effet nécessite _1 niveau de héros_ pour se recharger.
actors.hero.talent.deathless_fury.comment=Attention : si les PV du berserker sont â 0 lorsque l'enragement se termine, il meurt quand même.
actors.hero.talent.enraged_catalyst.title=Catalyseur de Rage
actors.hero.talent.enraged_catalyst.desc=_+1：_ Plus la rage du berserker est élevée, plus les enchantements ou malédictions sur son arme ont de chances de se déclencher. Â 100% de rage, la probabilité de déclenchement est _multipliée par 1,15_.\n\n_+2：_ Plus la rage du berserker est élevée, plus les enchantements ou malédictions sur son arme ont de chances de se déclencher. Â 100% de rage, la probabilité de déclenchement est _multipliée par 1,30_.\n\n_+3：_ Plus la rage du berserker est élevée, plus les enchantements ou malédictions sur son arme ont de chances de se déclencher. Â 100% de rage, la probabilité de déclenchement est _multipliée par 1,45_.
actors.hero.talent.enraged_catalyst.comment=
actors.hero.talent.ceaseless_rage.title=Rage Incessante
actors.hero.talent.ceaseless_rage.desc=Améliorer ce talent empêche la rage du berserker de diminuer avec le temps lorsqu'elle ne dépasse pas un certain seuil, et lui confère une augmentation de vitesse d'action égale à sa rage actuelle.\n\n_+1：_Seuil à _30%_.\n\n_+2：_Seuil à _40%_.\n\n_+3：_Seuil à _50%_.
actors.hero.talent.ceaseless_rage.comment=La vitesse d'action affecte à la fois la vitesse d'attaque et de déplacement ; 100% de rage augmente les deux de 100%.
actors.hero.talent.mirrored_revenge.title=Vengeance Miroir
actors.hero.talent.mirrored_revenge.desc=Améliorer ce talent permet au blason brisé du berserker de réduire aléatoirement de 5 à 10 tours le temps de recharge du bouclier à chaque fois qu'il subit une attaque, et tous les effets de bouclier qu'il reçoit infligent des dégâts à l'ennemi lorsqu'ils bloquent des dégâts physiques.\n\n_+1：_Inflige _100% des dégâts bloqués_ à l'ennemi.\n\n_+2：_Inflige _150% des dégâts bloqués_ à l'ennemi.\n\n_+3：_Inflige _200% des dégâts bloqués_ à l'ennemi.
actors.hero.talent.mirrored_revenge.comment=Les dégâts de renvoi du bouclier ignorent l'armure ennemie, y compris les boucliers obtenus pendant l'Enragement et ceux provenant d'autres sources.
actors.hero.talent.bloodthirsty_berserk.title=Frénésie Sanguinaire
actors.hero.talent.bloodthirsty_berserk.desc=Améliorer ce talent étend la portée d'attaque de mêlée du berserker de 1 case en frénésie et lui confère un effet de Saignée supplémentaire. Hors frénésie, il gagne de la rage via les dégâts physiques infligés.\n\n_+1：_En frénésie, récupère _25%_ des dégâts physiques en vie ; hors frénésie, gagne _0,5%_ de la rage des dégâts infligés.\n\n_+2：_En frénésie, récupère _37%_ des dégâts physiques en vie ; hors frénésie, gagne _1%_ de la rage des dégâts infligés.\n\n_+3：_En frénésie, récupère _50%_ des dégâts physiques en vie ; hors frénésie, gagne _1,5%_ de la rage des dégâts infligés.
actors.hero.talent.bloodthirsty_berserk.comment=Saignée ne s'applique qu'aux attaques physiques de mêlée pendant la frénésie.

actors.hero.talent.cleave.title=Fendre
actors.hero.talent.cleave.desc=_+1：_ Lorsque le gladiateur tue un ennemi, ses combos sont conservés pendant _30 tours_ pour ses prochaines attaques.\n\n_+2：_ Lorsque le gladiateur tue un ennemi, ses combos sont conservés pendant _45 tours_ pour ses prochaines attaques.\n\n_+3：_ Lorsque le gladiateur tue un ennemi, ses combos sont conservés pendant _60 tours_ pour ses prochaines attaques.
actors.hero.talent.cleave.comment=
actors.hero.talent.lethal_defense.title=Défense Mortelle
actors.hero.talent.lethal_defense.desc=_+1：_ Lorsque le gladiateur tue un ennemi avec une technique de combo, il récupére _33%_ du bouclier de son emblème brisé.\n\n_+2：_ Lorsque le gladiateur tue un ennemi avec une technique de combo, il récupére _67%_ du bouclier de son emblème brisé.\n\n_+3：_ Lorsque le gladiateur tue un ennemi avec une technique de combo, il récupére _100%_ du bouclier de son emblème brisé.
actors.hero.talent.lethal_defense.comment=
actors.hero.talent.enhanced_combo.title=Combo Amélioré
actors.hero.talent.enhanced_combo.desc=_+1：_ Lorsque le combo du gladiateur atteint 7 ou plus, la distance de repoussement du choc _passe â 3 et étourdit_, et peut précipiter l'ennemi dans un gouffre.\n\n_+2：_ En plus des effets de +1, lorsque le combo atteint 9 ou plus, la parade riposte est efficace contre _plusieurs attaques en un tour_.\n\n_+3：_ En plus des effets de +1 et +2, le gladiateur peut sauter de _combo/3 cases_ pour se rapprocher de l'ennemi en utilisant Charge, Balayage ou Déluge.
actors.hero.talent.enhanced_combo.comment=
actors.hero.talent.combo_focus.title=Focus d'enchaînement
actors.hero.talent.combo_focus.desc=_+1：_Tous les _4 points_ de combo accumulés, le gladiateur augmente ses dégâts d'attaque physique de 1 (max 20) et sa _précision de 5%_ (max _100%_).\n\n_+2：_Tous les _3 points_ de combo accumulés, le gladiateur augmente ses dégâts d'attaque physique de 1 (max 20) et sa _précision de 7,5%_ (max _150%_).\n\n_+3：_Tous les _2 points_ de combo accumulés, le gladiateur augmente ses dégâts d'attaque physique de 1 (max 20) et sa _précision de 10%_ (max _200%_).
actors.hero.talent.combo_focus.comment=Le bonus de dégâts s'applique après les autres modifications de dégâts.
actors.hero.talent.relentless_combat.title=Combat Incessant
actors.hero.talent.relentless_combat.desc=_+1：_Quand le combo du gladiateur atteint 8 ou plus, la vitesse d'attaque _augmente de 50%_.\n\n_+2：_Quand le combo du gladiateur atteint 8 ou plus, la vitesse d'attaque _augmente de 100%_.\n\n_+3：_Quand le combo du gladiateur atteint 8 ou plus, la vitesse d'attaque _augmente de 150%_.
actors.hero.talent.relentless_combat.comment=
actors.hero.talent.combo_mastery.title=Maîtrise des Techniques
actors.hero.talent.combo_mastery.desc=Améliorer ce talent permet au gladiateur d'utiliser les techniques de combat sans réinitialiser le combo, mais en consommant le nombre de combo correspondant. L'impact et la parade consomment aussi du combo, permettant des usages multiples dans un même enchaînement.\n\n_+1：_Le nombre maximum de combo supplémentaire de l'emblème passe de 5 à _8 points_.\n\n_+2：_En plus de +1, le coût en combo de chaque technique de combat _est réduit de 1 point_.\n\n_+3：_En plus de +1 et +2, le temps de recharge de l'emblème de combo _est réduit de 10 tours_.
actors.hero.talent.combo_mastery.comment=Les effets des techniques de combat sont calculés selon le nombre de combo avant utilisation ; l'impact et la parade réussie rendent 1 point de combo.

actors.hero.talent.body_slam.title=Plaquage
actors.hero.talent.body_slam.desc=_+1：_ Lorsque le guerrier atterrit après son Saut héroîque, il inflige _1~4+25% d'armure_ dégâts â tous les ennemis adjacents.\n\n_+2：_ Lorsque le guerrier atterrit après son Saut héroîque, il inflige _2~8+50% d'armure_ dégâts â tous les ennemis adjacents.\n\n_+3：_ Lorsque le guerrier atterrit après son Saut héroîque, il inflige _3~12+75% d'armure_ dégâts â tous les ennemis adjacents.\n\n_+4：_ Lorsque le guerrier atterrit après son Saut héroîque, il inflige _4~16+100% d'armure_ dégâts â tous les ennemis adjacents.
actors.hero.talent.body_slam.comment=
actors.hero.talent.impact_wave.title=Onde de Choc
actors.hero.talent.impact_wave.desc=_+1：_ Lorsque le guerrier atterrit après son Saut héroîque, il repousse tous les ennemis adjacents de _2 cases_, avec _25% de chance_ de les vulnérabiliser pendant 5 tours.\n\n_+2：_ Lorsque le guerrier atterrit après son Saut héroîque, il repousse tous les ennemis adjacents de _3 cases_, avec _50% de chance_ de les vulnérabiliser pendant 5 tours.\n\n_+3：_ Lorsque le guerrier atterrit après son Saut héroîque, il repousse tous les ennemis adjacents de _4 cases_, avec _75% de chance_ de les vulnérabiliser pendant 5 tours.\n\n_+4：_ Lorsque le guerrier atterrit après son Saut héroîque, il repousse tous les ennemis adjacents de _5 cases_, avec _100% de chance_ de les vulnérabiliser pendant 5 tours.
actors.hero.talent.impact_wave.comment=
actors.hero.talent.double_jump.title=Double Saut
actors.hero.talent.double_jump.desc=_+1：_ Après avoir utilisé Saut héroîque, la prochaine utilisation du saut dans les 3 tours consomme _16%_ d'énergie en moins.\n\n_+2：_ Après avoir utilisé Saut héroîque, la prochaine utilisation du saut dans les 3 tours consomme _30%_ d'énergie en moins.\n\n_+3：_ Après avoir utilisé Saut héroîque, la prochaine utilisation du saut dans les 3 tours consomme _40%_ d'énergie en moins.\n\n_+4：_ Après avoir utilisé Saut héroîque, la prochaine utilisation du saut dans les 3 tours consomme _50%_ d'énergie en moins.
actors.hero.talent.double_jump.comment=

actors.hero.talent.expanding_wave.title=Vague Expansive
actors.hero.talent.expanding_wave.desc=_+1：_ La portée de l'Onde de choc passe de 5 â _6 cases_, et son angle passe de 60° â _75°_.\n\n_+2：_ La portée de l'Onde de choc passe de 5 â _7 cases_, et son angle passe de 60° â _90°_.\n\n_+3：_ La portée de l'Onde de choc passe de 5 â _8 cases_, et son angle passe de 60° â _105°_.\n\n_+4：_ La portée de l'Onde de choc passe de 5 â _9 cases_, et son angle passe de 60° â _120°_.
actors.hero.talent.expanding_wave.comment=
actors.hero.talent.striking_wave.title=Vague Frappante
actors.hero.talent.striking_wave.desc=_+1：_ L'Onde de choc a _30%_ de chance d'appliquer les effets d'attaque comme les enchantements et les combos.\n\n_+2：_ L'Onde de choc a _60%_ de chance d'appliquer les effets d'attaque comme les enchantements et les combos.\n\n_+3：_ L'Onde de choc a _90%_ de chance d'appliquer les effets d'attaque comme les enchantements et les combos.\n\n_+4：_ L'Onde de choc a _100%_ de chance d'appliquer les effets d'attaque comme les enchantements et les combos, et gagne _20% de renforcement d'enchantement_.
actors.hero.talent.striking_wave.comment=
actors.hero.talent.shock_force.title=Force de Choc
actors.hero.talent.shock_force.desc=_+1：_ Les dégâts de l'Onde de choc augmentent de _20%_, avec _25%_ de chance d'étourdir la cible au lieu de l'estropier.\n\n_+2：_ Les dégâts de l'Onde de choc augmentent de _40%_, avec _50%_ de chance d'étourdir la cible au lieu de l'estropier.\n\n_+3：_ Les dégâts de l'Onde de choc augmentent de _60%_, avec _75%_ de chance d'étourdir la cible au lieu de l'estropier.\n\n_+4：_ Les dégâts de l'Onde de choc augmentent de _80%_, avec _100%_ de chance d'étourdir la cible au lieu de l'estropier.
actors.hero.talent.shock_force.comment=

actors.hero.talent.sustained_retribution.title=Représailles Durables
actors.hero.talent.sustained_retribution.desc=_+1：_ La riposte passe d'une attaque bonus de 100% â _2 attaques_ bonus de _115%_.\n\n_+2：_ La riposte passe d'une attaque bonus de 100% â _3 attaques_ bonus de _130%_.\n\n_+3：_ La riposte passe d'une attaque bonus de 100% â _4 attaques_ bonus de _145%_.\n\n_+4：_ La riposte passe d'une attaque bonus de 100% â _5 attaques_ bonus de _160%_.
actors.hero.talent.sustained_retribution.comment=
actors.hero.talent.shrug_it_off.title=Encaisseur
actors.hero.talent.shrug_it_off.desc=_+1：_ La réduction des dégâts du guerrier en Endurance passe de 50% â _60%_.\n\n_+2：_ La réduction des dégâts du guerrier en Endurance passe de 50% â _68%_.\n\n_+3：_ La réduction des dégâts du guerrier en Endurance passe de 50% â _74%_.\n\n_+4：_ La réduction des dégâts du guerrier en Endurance passe de 50% â _80%_.
actors.hero.talent.shrug_it_off.comment=
actors.hero.talent.even_the_odds.title=Égaliser les Chances
actors.hero.talent.even_the_odds.desc=_+1：_ Â la fin de l'Endurance du guerrier, pour chaque ennemi dans les 2 cases alentour, il gagne _5% de dégâts supplémentaires_.\n\n_+2：_ Â la fin de l'Endurance du guerrier, pour chaque ennemi dans les 2 cases alentour, il gagne _10% de dégâts supplémentaires_.\n\n_+3：_ Â la fin de l'Endurance du guerrier, pour chaque ennemi dans les 2 cases alentour, il gagne _15% de dégâts supplémentaires_.\n\n_+4：_ Â la fin de l'Endurance du guerrier, pour chaque ennemi dans les 2 cases alentour, il gagne _20% de dégâts supplémentaires_.
actors.hero.talent.even_the_odds.comment=

#mage
actors.hero.talent.empowering_meal.title=Repas Revigorant
actors.hero.talent.empowering_meal.desc=_+1：_ Manger ajoute _2 dégâts supplémentaires_ aux 3 prochains coups de béton du mage.\n\n_+2：_ Manger ajoute _3 dégâts supplémentaires_ aux 3 prochains coups de béton du mage.
actors.hero.talent.empowering_meal.comment=“Juste après avoir mangé, tu sens l'énergie magique bouillonner en toi.”
actors.hero.talent.scholars_intuition.title=Intuition du Savant
actors.hero.talent.scholars_intuition.desc=_+1：_ La vitesse d'identification des bétons par le mage est _multipliée par 3_.\n\n_+2：_ Le mage peut identifier les bétons _en les utilisant_.
actors.hero.talent.scholars_intuition.comment=“On a déjâ vu ça â l'académie de magie.”
actors.hero.talent.lingering_magic.title=Magie Persistante
actors.hero.talent.lingering_magic.desc=_+1：_ Lorsque le mage lance un sort avec une baguette ou un béton, sa prochaine attaque physique inflige _1~2 dégâts supplémentaires_.\n\n_+2：_ Lorsque le mage lance un sort avec une baguette ou un béton, sa prochaine attaque physique inflige _2 dégâts supplémentaires_.
actors.hero.talent.lingering_magic.comment=“Il reste un peu d'énergie magique sur la main après avoir lancé un sort.”
actors.hero.talent.backup_barrier.title=Barrière de Réserve
actors.hero.talent.backup_barrier.desc=_+1：_ Chaque fois que le mage utilise la dernière charge d'une baguette, il gagne _3 points de bouclier_.\n\n_+2：_ Chaque fois que le mage utilise la dernière charge d'une baguette, il gagne _5 points de bouclier_.
actors.hero.talent.backup_barrier.comment=“Les dernières ondulations.”
actors.hero.talent.backup_barrier.meta_desc=_Si ce talent est obtenu par un autre héros_, il se déclenche â partir du béton ayant le plus haut niveau.

actors.hero.talent.energizing_meal.title=Repas Énergisant
actors.hero.talent.energizing_meal.desc=_+1：_ Manger ne coûte qu'1 tour au mage et lui confère _5 tours de charge de béton_.\n\n_+2：_ Manger ne coûte qu'1 tour au mage et lui confère _8 tours de charge de béton_.
actors.hero.talent.energizing_meal.comment=“Manger apporte une énergie magique plus abondante.”
actors.hero.talent.inscribed_power.title=Puissance Runique
actors.hero.talent.inscribed_power.desc=_+1：_ Lorsque le mage lit un parchemin ou utilise un cristal de sort, ses _2 prochaines incantations de béton_ sont améliorées de 2 niveaux.\n\n_+2：_ Lorsque le mage lit un parchemin ou utilise un cristal de sort, ses _3 prochaines incantations de béton_ sont améliorées de 2 niveaux.
actors.hero.talent.inscribed_power.comment=Si un parchemin d'amélioration, de transmutation ou un objet alchimique nécessitant l'un des parchemins susmentionnés est utilisé, le nombre d'incantations améliorées du béton est doublé.\n\nPour les objets alchimiques â rendement élevé (comme la plupart des cristaux), ce talent se déclenche en fonction de la quantité produite par l'objet.\n\nCe talent peut être déclenché en lisant le Grimoire du chaos.\n\n“Les runes inscrites sur les parchemins renferment une grande quantité d'énergie magique.”
actors.hero.talent.wand_preservation.title=Préservation de Baguette
actors.hero.talent.wand_preservation.desc=_+1：_ Lorsque le mage infuse un nouveau béton dans sa baguette, le béton précédent est récupéré au niveau 0, _mais cette récupération ne peut avoir lieu qu'une fois_.\n\n_+2：_ Lorsque le mage infuse un nouveau béton dans sa baguette, le béton précédent est récupéré au niveau 0, _cette récupération peut être répétée, mais avec un rechargement d'un niveau de héros_.
actors.hero.talent.wand_preservation.comment=“Les bétons de grande valeur sont toujours appréciés.”
actors.hero.talent.wand_preservation.meta_desc=_Si ce talent est obtenu par un autre héros_, il augmente la quantité de résine arcanique obtenue en plaçant un béton dans l'alambic alchimique. Au +1, la résine obtenue augmente de 1 ; au +2, elle augmente de 2.
actors.hero.talent.arcane_vision.title=Vision Arcane
actors.hero.talent.arcane_vision.desc=_+1：_ Lorsque le mage lance un sort sur un ennemi, il gagne une vision spirituelle de celui-ci pendant _10 tours_.\n\n_+2：_ Lorsque le mage lance un sort sur un ennemi, il gagne une vision spirituelle de celui-ci pendant _15 tours_.
actors.hero.talent.arcane_vision.comment=“L'énergie magique attachée â l'ennemi te permet de percevoir sa position.”
actors.hero.talent.shield_battery.title=Batterie de Bouclier
actors.hero.talent.shield_battery.desc=_+1：_ Le mage peut se lancer un sort â lui-même, convertissant chaque charge de son béton en bouclier équivalant â _4% de ses PV max_.\n\n_+2：_ Le mage peut se lancer un sort â lui-même, convertissant chaque charge de son béton en bouclier équivalant â _6% de ses PV max_.
actors.hero.talent.shield_battery.comment=“Mesure d'urgence.”

actors.hero.talent.desperate_power.title=Puissance Désespérée
actors.hero.talent.desperate_power.desc=_+1：_ Les sorts lancés avec la dernière charge du béton ou de la baguette du mage gagnent _1 niveau supplémentaire_.\n\n_+2：_ Les sorts lancés avec la dernière charge du béton ou de la baguette du mage gagnent _2 niveaux supplémentaires_.\n\n_+3：_ Les sorts lancés avec la dernière charge du béton ou de la baguette du mage gagnent _3 niveaux supplémentaires_.
actors.hero.talent.desperate_power.comment=
actors.hero.talent.ally_warp.title=Distorsion Alliée
actors.hero.talent.ally_warp.desc=_+1：_ Le mage peut sélectionner un allié dans un rayon de _2 cases_ et échanger instantanément sa position avec lui.\n\n_+2：_ Le mage peut sélectionner un allié dans un rayon de _4 cases_ et échanger instantanément sa position avec lui.\n\n_+3：_ Le mage peut sélectionner un allié dans un rayon de _6 cases_ et échanger instantanément sa position avec lui.
actors.hero.talent.ally_warp.comment=Le mage ne peut pas échanger de position avec un allié incapable de se déplacer.\n\nSi le DM-400 (y compris les spécialisations AT-400 et AU-400 en mode aléatoire) obtient ce talent, cliquer sur un drone non adjacent dans un rayon de _2/4/6 cases_ aux niveaux _+1/+2/+3_ permet de choisir entre l'échange de position ou le commandement.

actors.hero.talent.empowered_strike.title=Frappe Renforcée
actors.hero.talent.empowered_strike.desc=_+1：_ Après avoir lancé un sort avec une baguette, la première attaque de mêlée de cette baguette inflige _16% de dégâts supplémentaires_ et ses effets bonus ont _50% d'efficacité accrue_.\n\n_+2：_ Après avoir lancé un sort avec une baguette, la première attaque de mêlée de cette baguette inflige _33% de dégâts supplémentaires_ et ses effets bonus ont _100% d'efficacité accrue_.\n\n_+3：_ Après avoir lancé un sort avec une baguette, la première attaque de mêlée de cette baguette inflige _50% de dégâts supplémentaires_ et ses effets bonus ont _150% d'efficacité accrue_.
actors.hero.talent.empowered_strike.comment=
actors.hero.talent.mystical_charge.title=Charge Mystique
actors.hero.talent.mystical_charge.desc=_+1：_ Lorsque le mage de combat touche un ennemi en mêlée avec sa baguette, il gagne l'équivalent de _0,5 tour_ de charge d'artefact.\n\n_+2：_ Lorsque le mage de combat touche un ennemi en mêlée avec sa baguette, il gagne l'équivalent de _1 tour_ de charge d'artefact.\n\n_+3：_ Lorsque le mage de combat touche un ennemi en mêlée avec sa baguette, il gagne l'équivalent de _1,5 tour_ de charge d'artefact.
actors.hero.talent.mystical_charge.comment=
actors.hero.talent.excess_charge.title=Charge Excessive
actors.hero.talent.excess_charge.desc=_+1：_ Lorsque la baguette du mage de combat est complètement chargée, chaque niveau d'amélioration lui confère _0,67 point de bouclier_ lors de sa prochaine incantation.\n\n_+2：_ Lorsque la baguette du mage de combat est complètement chargée, chaque niveau d'amélioration lui confère _1,33 point de bouclier_ lors de sa prochaine incantation.\n\n_+3：_ Lorsque la baguette du mage de combat est complètement chargée, chaque niveau d'amélioration lui confère _2 points de bouclier_ lors de sa prochaine incantation.
actors.hero.talent.excess_charge.comment=

actors.hero.talent.soul_siphon.title=Siphon d'Âme
actors.hero.talent.soul_siphon.desc=_+1：_ Les dégâts physiques infligés par d'autres unités déclenchent la marque d'âme du sorcier avec _13% d'efficacité_.\n\n_+2：_ Les dégâts physiques infligés par d'autres unités déclenchent la marque d'âme du sorcier avec _27% d'efficacité_.\n\n_+3：_ Les dégâts physiques infligés par d'autres unités déclenchent la marque d'âme du sorcier avec _40% d'efficacité_.
actors.hero.talent.soul_siphon.comment=
actors.hero.talent.soul_eater.title=Mangeur d'Âme
actors.hero.talent.soul_eater.desc=_+1：_ Chaque point de dégât physique subi par une unité marquée fournit _0,33 point_ de satiété ; lorsqu'un ennemi marqué meurt, le sorcier a _10% de chance_ de déclencher un effet de repas.\n\n_+2：_ Chaque point de dégât physique subi par une unité marquée fournit _0,67 point_ de satiété ; lorsqu'un ennemi marqué meurt, le sorcier a _20% de chance_ de déclencher un effet de repas.\n\n_+3：_ Chaque point de dégât physique subi par une unité marquée fournit _1 point_ de satiété ; lorsqu'un ennemi marqué meurt, le sorcier a _30% de chance_ de déclencher un effet de repas.
actors.hero.talent.soul_eater.comment=
actors.hero.talent.necromancers_minions.title=Sbires du Nécromancien
actors.hero.talent.necromancers_minions.desc=_+1：_ Lorsqu'un ennemi marqué meurt, le sorcier a _13% de chance_ de le ranimer en esprit rancunier corrompu.\n\n_+2：_ Lorsqu'un ennemi marqué meurt, le sorcier a _27% de chance_ de le ranimer en esprit rancunier corrompu.\n\n_+3：_ Lorsqu'un ennemi marqué meurt, le sorcier a _40% de chance_ de le ranimer en esprit rancunier corrompu.
actors.hero.talent.necromancers_minions.comment=

actors.hero.talent.blast_radius.title=Rayon d'Explosion
actors.hero.talent.blast_radius.desc=_+1：_ Le rayon de la Tempête élémentaire passe de 4 â _5 cases_.\n\n_+2：_ Le rayon de la Tempête élémentaire passe de 4 â _6 cases_.\n\n_+3：_ Le rayon de la Tempête élémentaire passe de 4 â _7 cases_.\n\n_+4：_ Le rayon de la Tempête élémentaire passe de 4 â _8 cases_.
actors.hero.talent.blast_radius.comment=
actors.hero.talent.elemental_power.title=Puissance Élémentaire
actors.hero.talent.elemental_power.desc=_+1：_ La puissance de la Tempête élémentaire augmente de _25%_.\n\n_+2：_ La puissance de la Tempête élémentaire augmente de _50%_.\n\n_+3：_ La puissance de la Tempête élémentaire augmente de _75%_.\n\n_+4：_ La puissance de la Tempête élémentaire augmente de _100%_.
actors.hero.talent.elemental_power.comment=
actors.hero.talent.reactive_barrier.title=Barrière Réactive
actors.hero.talent.reactive_barrier.desc=_+1：_ Pour chaque personnage affecté par la Tempête élémentaire, le mage gagne _2,5 points de bouclier_, jusqu'â 5 personnages.\n\n_+2：_ Pour chaque personnage affecté par la Tempête élémentaire, le mage gagne _5 points de bouclier_, jusqu'â 6 personnages.\n\n_+3：_ Pour chaque personnage affecté par la Tempête élémentaire, le mage gagne _7,5 points de bouclier_, jusqu'â 7 personnages.\n\n_+4：_ Pour chaque personnage affecté par la Tempête élémentaire, le mage gagne _10 points de bouclier_, jusqu'â 8 personnages.
actors.hero.talent.reactive_barrier.comment=

actors.hero.talent.wild_power.title=Puissance Sauvage
actors.hero.talent.wild_power.desc=_+1：_ Lors du lancement de Magie sauvage, le béton est considéré comme ayant _2 ou 3 niveaux_ supplémentaires, jusqu'â un maximum de _+4_.\n\n_+2：_ Lors du lancement de Magie sauvage, le béton est considéré comme ayant _3 niveaux_ supplémentaires, jusqu'â un maximum de _+5_.\n\n_+3：_ Lors du lancement de Magie sauvage, le béton est considéré comme ayant _3 ou 4 niveaux_ supplémentaires, jusqu'â un maximum de _+6_.\n\n_+4：_ Lors du lancement de Magie sauvage, le béton est considéré comme ayant _4 niveaux_ supplémentaires, jusqu'â un maximum de _+7_.
actors.hero.talent.wild_power.comment=
actors.hero.talent.fire_everything.title=Tirer sur Tout
actors.hero.talent.fire_everything.desc=_+1：_ Magie sauvage passe de 4 â _5 bétons_ déclenchés, et chaque béton a _25% de chance_ d'être déclenché 3 fois.\n\n_+2：_ Magie sauvage passe de 4 â _6 bétons_ déclenchés, et chaque béton a _50% de chance_ d'être déclenché 3 fois.\n\n_+3：_ Magie sauvage passe de 4 â _7 bétons_ déclenchés, et chaque béton a _75% de chance_ d'être déclenché 3 fois.\n\n_+4：_ Magie sauvage passe de 4 â _8 bétons_ déclenchés, et chaque béton a _100% de chance_ d'être déclenché 3 fois.
actors.hero.talent.fire_everything.comment=
actors.hero.talent.conserved_magic.title=Magie Conservée
actors.hero.talent.conserved_magic.desc=_+1：_ La charge consommée par Magie sauvage par béton passe de 0,5 â _0,33 point_, et Magie sauvage a _25% de chance_ de ne pas coûter de temps.\n\n_+2：_ La charge consommée par Magie sauvage par béton passe de 0,5 â _0,225 point_, et Magie sauvage a _50% de chance_ de ne pas coûter de temps.\n\n_+3：_ La charge consommée par Magie sauvage par béton passe de 0,5 â _0,15 point_, et Magie sauvage a _75% de chance_ de ne pas coûter de temps.\n\n_+4：_ La charge consommée par Magie sauvage par béton passe de 0,5 â _0,1 point_, et Magie sauvage a _100% de chance_ de ne pas coûter de temps.
actors.hero.talent.conserved_magic.comment=

actors.hero.talent.telefrag.title=Téléfrag
actors.hero.talent.telefrag.desc=_+1：_ Lorsque le mage se téléporte sur sa balise et entre en collision avec un autre personnage, il lui inflige _10~15 dégâts_, mais subit _5 dégâts_.\n\n_+2：_ Lorsque le mage se téléporte sur sa balise et entre en collision avec un autre personnage, il lui inflige _20~30 dégâts_, mais subit _10 dégâts_.\n\n_+3：_ Lorsque le mage se téléporte sur sa balise et entre en collision avec un autre personnage, il lui inflige _30~45 dégâts_, mais subit _15 dégâts_.\n\n_+4：_ Lorsque le mage se téléporte sur sa balise et entre en collision avec un autre personnage, il lui inflige _40~60 dégâts_, mais subit _20 dégâts_.
actors.hero.talent.telefrag.comment=Le héros ne peut pas mourir de ses propres dégâts, et ces dégâts peuvent être réduits par la résistance magique.
actors.hero.talent.remote_beacon.title=Balise Distante
actors.hero.talent.remote_beacon.desc=_+1：_ Le mage peut placer une balise n'importe oû dans un rayon de _4 cases_.\n\n_+2：_ Le mage peut placer une balise n'importe oû dans un rayon de _8 cases_.\n\n_+3：_ Le mage peut placer une balise n'importe oû dans un rayon de _12 cases_.\n\n_+4：_ Le mage peut placer une balise n'importe oû dans un rayon de _16 cases_.
actors.hero.talent.remote_beacon.comment=Le mage ne peut pas placer de balise dans une zone inaccessible.
actors.hero.talent.longrange_warp.title=Distorsion Longue Portée
actors.hero.talent.longrange_warp.desc=_+1：_ Le mage peut se téléporter entre les étages, mais consomme _150% de charge_.\n\n_+2：_ Le mage peut se téléporter entre les étages, mais consomme _117% de charge_.\n\n_+3：_ Le mage peut se téléporter entre les étages, mais ne consomme que _83% de charge_.\n\n_+4：_ Le mage peut se téléporter entre les étages, mais ne consomme que _50% de charge_.
actors.hero.talent.longrange_warp.comment=Le mage ne peut pas utiliser cette capacité pour quitter un étage verrouillé.

#rogue
actors.hero.talent.cached_rations.title=Rations Cachées
actors.hero.talent.cached_rations.desc=_+1：_ En explorant les étages suivants, le voleur peut trouver _2 rations de réserve_ dans les coffres.\n\n_+2：_ En explorant les étages suivants, le voleur peut trouver _3 rations de réserve_ dans les coffres.
actors.hero.talent.cached_rations.comment=Les rations de réserve se consomment rapidement, restaurent une satiété modérée, récupérent 5 PV et rendent 1 charge â la Cape d'Ombre.\n\n“Du ravitaillement fourni par la Guilde des Voleurs â ses membres.”
actors.hero.talent.thiefs_intuition.title=Intuition du Voleur
actors.hero.talent.thiefs_intuition.desc=_+1：_ La vitesse d'identification des bagues par le voleur est _multipliée par 2_, et il peut identifier leur nature _en les équipant_.\n\n_+2：_ Le voleur peut identifier les bagues directement _en les équipant_, et aussi identifier leur nature _en les ramassant_.
actors.hero.talent.thiefs_intuition.comment=“Tu as déjâ vu ces gemmes dans le Manuel d'Identification des Bijoux distribué par la Guilde des Voleurs.”
actors.hero.talent.sucker_punch.title=Coup Vicieux
actors.hero.talent.sucker_punch.desc=_+1：_ Lors de la première embuscade contre un ennemi, le voleur inflige _1~2 dégâts supplémentaires_.\n\n_+2：_ Lors de la première embuscade contre un ennemi, le voleur inflige _2 dégâts supplémentaires_.
actors.hero.talent.sucker_punch.comment=“L'embuscade est un cours obligatoire pour tout membre de la Guilde des Voleurs.”
actors.hero.talent.protective_shadows.title=Ombres Protectrices
actors.hero.talent.protective_shadows.desc=_+1：_ Lorsqu'il est invisible, le voleur gagne 1 point de bouclier tous les _2 tours_, jusqu'â un maximum de _3 points_.\n\n_+2：_ Lorsqu'il est invisible, le voleur gagne 1 point de bouclier tous les _1 tour_, jusqu'â un maximum de _5 points_.
actors.hero.talent.protective_shadows.comment=“Marcher dans l'ombre, servir la lumière.”

actors.hero.talent.mystical_meal.title=Repas Mystique
actors.hero.talent.mystical_meal.desc=_+1：_ Manger ne coûte qu'1 tour au voleur (les rations de réserve ne coûtent aucun tour), et il gagne _3 tours de charge d'artefact_.\n\n_+2：_ Manger ne coûte qu'1 tour au voleur (les rations de réserve ne coûtent aucun tour), et il gagne _5 tours de charge d'artefact_.
actors.hero.talent.mystical_meal.comment=Ce talent ne permet pas â la Corne d'Abondance de se recharger elle-même.\n\n“Pour satisfaire les besoins des aventuriers en objets magiques, les marchands de nourriture emploient souvent des mages pour ajouter un peu d'énergie magique dans leurs plats...”
actors.hero.talent.inscribed_stealth.title=Furtivité Runique
actors.hero.talent.inscribed_stealth.desc=_+1：_ Après avoir lu un parchemin ou utilisé un cristal de sort, le voleur gagne _3 tours_ d'invisibilité.\n\n_+2：_ Après avoir lu un parchemin ou utilisé un cristal de sort, le voleur gagne _5 tours_ d'invisibilité.
actors.hero.talent.inscribed_stealth.comment=Si un parchemin d'amélioration, de transmutation ou un objet alchimique nécessitant l'un des parchemins susmentionnés est utilisé, la durée d'invisibilité est doublée.\n\nPour les objets alchimiques â rendement élevé (comme la plupart des cristaux), ce talent se déclenche en fonction de la quantité produite par l'objet.\n\nCe talent peut être déclenché en lisant le Grimoire du chaos.\n\n“Le voleur a l'habitude de fouiller dans les petits secrets honteux dans l'obscurité.”
actors.hero.talent.wide_search.title=Recherche Approfondie
actors.hero.talent.wide_search.desc=_+1：_ La zone de recherche du voleur passe d'un carré 5x5 â un _cercle 7x7_.\n\n_+2：_ La zone de recherche du voleur passe d'un carré 5x5 â un _carré 7x7_.
actors.hero.talent.wide_search.comment=“Lâ oû le regard porte, rien ne peut se cacher.”
actors.hero.talent.wide_search.meta_desc=_Si ce talent est obtenu par un autre héros_, il étend la zone de recherche â un cercle 5x5 au +1, et â un carré 5x5 au +2.
actors.hero.talent.silent_steps.title=Pas Silencieux
actors.hero.talent.silent_steps.desc=_+1：_ Le voleur ne réveille pas _les ennemis situés â 3 cases ou plus_.\n\n_+2：_ Le voleur ne réveille pas _les ennemis qui ne lui sont pas adjacents_.
actors.hero.talent.silent_steps.comment=“Chut.”
actors.hero.talent.rogues_foresight.title=Prescience du Voleur
actors.hero.talent.rogues_foresight.desc=_+1：_ Lorsque le voleur entre dans un nouvel étage contenant une salle cachée, il a _75% de chance_ de détecter la présence d'une salle cachée.\n\n_+2：_ Lorsque le voleur entre dans un nouvel étage contenant une salle cachée, il a _100% de chance_ de détecter la présence d'une salle cachée.
actors.hero.talent.rogues_foresight.comment=“Enfin trouvé.”

actors.hero.talent.light_cloak.title=Cape Légère
actors.hero.talent.light_cloak.desc=_+1：_ Le voleur peut utiliser la Cape d'Ombre sans l'équiper, mais son taux de recharge tombe â _25%_ lorsqu'elle n'est pas équipée.\n\n_+2：_ Le voleur peut utiliser la Cape d'Ombre sans l'équiper, mais son taux de recharge tombe â _50%_ lorsqu'elle n'est pas équipée.\n\n_+3：_ Le voleur peut utiliser la Cape d'Ombre sans l'équiper, mais son taux de recharge tombe â _75%_ lorsqu'elle n'est pas équipée.
actors.hero.talent.light_cloak.comment=
actors.hero.talent.light_cloak.meta_desc=_Si ce talent est obtenu par un autre héros_, il augmente la vitesse de recharge de tous les artefacts de 7/13/20% aux niveaux +1/+2/+3.
actors.hero.talent.enhanced_rings.title=Anneaux Améliorés
actors.hero.talent.enhanced_rings.desc=_+1：_ Pendant _3 tours_ après avoir utilisé un artefact, toutes les bagues du voleur gagnent 1 niveau.\n\n_+2：_ Pendant _6 tours_ après avoir utilisé un artefact, toutes les bagues du voleur gagnent 1 niveau.\n\n_+3：_ Pendant _9 tours_ après avoir utilisé un artefact, toutes les bagues du voleur gagnent 1 niveau.
actors.hero.talent.enhanced_rings.comment=

actors.hero.talent.enhanced_lethality.title=Létalité Accrue
actors.hero.talent.enhanced_lethality.desc=_+1：_ Le seuil de PV des ennemis que l'assassin peut exécuter directement avec la Préparation par palier passe de 3/10/20/50% â _4/13/27/67%_.\n\n_+2：_ Le seuil de PV des ennemis que l'assassin peut exécuter directement avec la Préparation par palier passe de 3/10/20/50% â _5/17/33/83%_.\n\n_+3：_ Le seuil de PV des ennemis que l'assassin peut exécuter directement avec la Préparation par palier passe de 3/10/20/50% â _6/20/40/100%_.
actors.hero.talent.enhanced_lethality.comment=
actors.hero.talent.assassins_reach.title=Portée de l'Assassin
actors.hero.talent.assassins_reach.desc=_+1：_ La distance d'éclair de la Préparation par palier passe de 1/2/3/4 cases â _1/3/4/6 cases_.\n\n_+2：_ La distance d'éclair de la Préparation par palier passe de 1/2/3/4 cases â _2/4/6/8 cases_.\n\n_+3：_ La distance d'éclair de la Préparation par palier passe de 1/2/3/4 cases â _2/5/7/10 cases_.
actors.hero.talent.assassins_reach.comment=Cet éclair peut traverser les terrains dangereux ou les ennemis, mais pas les obstacles solides comme les murs.
actors.hero.talent.bounty_hunter.title=Chasseur de Primes
actors.hero.talent.bounty_hunter.desc=_+1：_ Pour les ennemis tués par l'assassin avec une compétence, la probabilité de butin augmente de _2/4/8/16%_ selon le palier de Préparation.\n\n_+2：_ Pour les ennemis tués par l'assassin avec une compétence, la probabilité de butin augmente de _4/8/16/32%_ selon le palier de Préparation.\n\n_+3：_ Pour les ennemis tués par l'assassin avec une compétence, la probabilité de butin augmente de _6/12/24/48%_ selon le palier de Préparation.
actors.hero.talent.bounty_hunter.comment=

actors.hero.talent.evasive_armor.title=Armure Évasive
actors.hero.talent.evasive_armor.desc=_+1：_ En état d'Agilité, chaque point de force excédant les prérequis d'armure confère _1 point d'esquive_ supplémentaire au Vifargent.\n\n_+2：_ En état d'Agilité, chaque point de force excédant les prérequis d'armure confère _2 points d'esquive_ supplémentaires au Vifargent.\n\n_+3：_ En état d'Agilité, chaque point de force excédant les prérequis d'armure confère _3 points d'esquive_ supplémentaires au Vifargent.
actors.hero.talent.evasive_armor.comment=
actors.hero.talent.projectile_momentum.title=Momentum du Projectile
actors.hero.talent.projectile_momentum.desc=_+1：_ En état d'Agilité, les armes de jet du Vifargent gagnent _50% de précision et 15% de dégâts_ supplémentaires.\n\n_+2：_ En état d'Agilité, les armes de jet du Vifargent gagnent _100% de précision et 30% de dégâts_ supplémentaires.\n\n_+3：_ En état d'Agilité, les armes de jet du Vifargent gagnent _150% de précision et 45% de dégâts_ supplémentaires.
actors.hero.talent.projectile_momentum.comment=
actors.hero.talent.speedy_stealth.title=Furtivité Rapide
actors.hero.talent.speedy_stealth.desc=_+1：_ Lorsqu'il est invisible, le Vifargent gagne _2 points d'élan_ par tour.\n\n_+2：_ En plus des effets de +1, lorsque le Vifargent est invisible, la durée de l'Agilité _ne diminue pas_.\n\n_+3：_ En plus des effets de +1 et +2, lorsque le Vifargent est invisible, sa _vitesse de déplacement est doublée_, qu'il soit ou non en Agilité.
actors.hero.talent.speedy_stealth.comment=

actors.hero.talent.hasty_retreat.title=Retraite Précipitée
actors.hero.talent.hasty_retreat.desc=_+1：_ Après avoir utilisé l'éclair, le voleur gagne _1 tour_ de Célérité et d'Invisibilité.\n\n_+2：_ Après avoir utilisé l'éclair, le voleur gagne _2 tours_ de Célérité et d'Invisibilité.\n\n_+3：_ Après avoir utilisé l'éclair, le voleur gagne _3 tours_ de Célérité et d'Invisibilité.\n\n_+4：_ Après avoir utilisé l'éclair, le voleur gagne _4 tours_ de Célérité et d'Invisibilité.
actors.hero.talent.hasty_retreat.comment=
actors.hero.talent.body_replacement.title=Substitution Corporelle
actors.hero.talent.body_replacement.desc=_+1：_ Lors de l'éclair, le voleur laisse derrière lui un leurre avec _20 PV et 1~3 points d'armure_.\n\n_+2：_ Lors de l'éclair, le voleur laisse derrière lui un leurre avec _40 PV et 2~6 points d'armure_.\n\n_+3：_ Lors de l'éclair, le voleur laisse derrière lui un leurre avec _60 PV et 3~9 points d'armure_.\n\n_+4：_ Lors de l'éclair, le voleur laisse derrière lui un leurre avec _80 PV et 4~12 points d'armure_.
actors.hero.talent.body_replacement.comment=Un seul leurre peut exister â la fois.
actors.hero.talent.shadow_step.title=Pas d'Ombre
actors.hero.talent.shadow_step.desc=_+1：_ Lorsque le voleur est invisible, l'Explosion fumigéne peut être déclenchée instantanément et son coût en charge est _réduit de 16%_. L'Explosion fumigéne sous invisibilité n'aveugle pas les ennemis et ne déclenche pas d'autres talents.\n\n_+2：_ Lorsque le voleur est invisible, l'Explosion fumigéne peut être déclenchée instantanément et son coût en charge est _réduit de 30%_. L'Explosion fumigéne sous invisibilité n'aveugle pas les ennemis et ne déclenche pas d'autres talents.\n\n_+3：_ Lorsque le voleur est invisible, l'Explosion fumigéne peut être déclenchée instantanément et son coût en charge est _réduit de 41%_. L'Explosion fumigéne sous invisibilité n'aveugle pas les ennemis et ne déclenche pas d'autres talents.\n\n_+4：_ Lorsque le voleur est invisible, l'Explosion fumigéne peut être déclenchée instantanément et son coût en charge est _réduit de 50%_. L'Explosion fumigéne sous invisibilité n'aveugle pas les ennemis et ne déclenche pas d'autres talents.
actors.hero.talent.shadow_step.comment=

actors.hero.talent.fear_the_reaper.title=Craignez le Faucheur
actors.hero.talent.fear_the_reaper.desc=_+1：_ Les ennemis marqués par la Marque mortelle gagnent l'effet _Estropié_ lorsque leurs PV tombent â 0.\n\n_+2：_ Les ennemis marqués par la Marque mortelle gagnent les effets _Estropié et Peur_ lorsque leurs PV tombent â 0.\n\n_+3：_ Les ennemis marqués par la Marque mortelle gagnent les effets _Estropié et Peur_ lorsque leurs PV tombent â 0, et les autres ennemis dans un rayon de 3 cases gagnent l'effet _Estropié_.\n\n_+4：_ Les ennemis marqués par la Marque mortelle gagnent les effets _Estropié et Peur_ lorsque leurs PV tombent â 0, et les autres ennemis dans un rayon de 3 cases gagnent les effets _Estropié et Peur_.
actors.hero.talent.fear_the_reaper.comment=
actors.hero.talent.deathly_durability.title=Endurance Mortelle
actors.hero.talent.deathly_durability.desc=_+1：_ Les ennemis tués par la Marque mortelle confèrent au voleur un bouclier équivalant â _13%_ de leurs PV au moment du marquage.\n\n_+2：_ Les ennemis tués par la Marque mortelle confèrent au voleur un bouclier équivalant â _25%_ de leurs PV au moment du marquage.\n\n_+3：_ Les ennemis tués par la Marque mortelle confèrent au voleur un bouclier équivalant â _38%_ de leurs PV au moment du marquage.\n\n_+4：_ Les ennemis tués par la Marque mortelle confèrent au voleur un bouclier équivalant â _50%_ de leurs PV au moment du marquage.
actors.hero.talent.deathly_durability.comment=
actors.hero.talent.double_mark.title=Marque Double
actors.hero.talent.double_mark.desc=_+1：_ Marquer une deuxième cible immédiatement après la première réduit la consommation de charge de _30%_.\n\n_+2：_ Marquer une deuxième cible immédiatement après la première réduit la consommation de charge de _50%_.\n\n_+3：_ Marquer une deuxième cible immédiatement après la première réduit la consommation de charge de _65%_.\n\n_+4：_ Marquer une deuxième cible immédiatement après la première réduit la consommation de charge de _75%_.
actors.hero.talent.double_mark.comment=

actors.hero.talent.shadow_blade.title=Lame d'Ombre
actors.hero.talent.shadow_blade.desc=_+1：_ L'Ombre miroir obtient _8%_ des dégâts par tour de son maître, avec _25%_ de chance d'utiliser l'enchantement de l'arme du maître.\n\n_+2：_ L'Ombre miroir obtient _16%_ des dégâts par tour de son maître, avec _50%_ de chance d'utiliser l'enchantement de l'arme du maître.\n\n_+3：_ L'Ombre miroir obtient _24%_ des dégâts par tour de son maître, avec _75%_ de chance d'utiliser l'enchantement de l'arme du maître.\n\n_+4：_ L'Ombre miroir obtient _32%_ des dégâts par tour de son maître, avec _100%_ de chance d'utiliser l'enchantement de l'arme du maître.
actors.hero.talent.shadow_blade.comment=
actors.hero.talent.cloned_armor.title=Armure Clonée
actors.hero.talent.cloned_armor.desc=_+1：_ L'Ombre miroir obtient _12%_ de la valeur d'armure de son maître, avec _25%_ de chance d'utiliser le glyphe de l'armure du maître.\n\n_+2：_ L'Ombre miroir obtient _24%_ de la valeur d'armure de son maître, avec _50%_ de chance d'utiliser le glyphe de l'armure du maître.\n\n_+3：_ L'Ombre miroir obtient _36%_ de la valeur d'armure de son maître, avec _75%_ de chance d'utiliser le glyphe de l'armure du maître.\n\n_+4：_ L'Ombre miroir obtient _48%_ de la valeur d'armure de son maître, avec _100%_ de chance d'utiliser le glyphe de l'armure du maître.
actors.hero.talent.cloned_armor.comment=
actors.hero.talent.perfect_copy.title=Copie Parfaite
actors.hero.talent.perfect_copy.desc=_+1：_ L'Ombre miroir gagne _10%_ supplémentaire des PV max de son maître, et le voleur peut échanger instantanément sa position avec l'ombre dans un rayon de _1 case_.\n\n_+2：_ L'Ombre miroir gagne _20%_ supplémentaire des PV max de son maître, et le voleur peut échanger instantanément sa position avec l'ombre dans un rayon de _2 cases_.\n\n_+3：_ L'Ombre miroir gagne _30%_ supplémentaire des PV max de son maître, et le voleur peut échanger instantanément sa position avec l'ombre dans un rayon de _3 cases_.\n\n_+4：_ L'Ombre miroir gagne _40%_ supplémentaire des PV max de son maître, et le voleur peut échanger instantanément sa position avec l'ombre dans un rayon de _4 cases_.
actors.hero.talent.perfect_copy.comment=

#huntress
actors.hero.talent.natures_bounty.title=Offrande de la Nature
actors.hero.talent.natures_bounty.desc=_+1：_ En explorant les étages suivants, la chasseresse peut trouver _4 baies_ cachées dans les hautes herbes.\n\n_+2：_ En explorant les étages suivants, la chasseresse peut trouver _6 baies_ cachées dans les hautes herbes.
actors.hero.talent.natures_bounty.comment=Les baies se consomment rapidement, restaurent une petite satiété et peuvent même produire une graine utile.\n\n“Merci pour ce don de la nature.”
actors.hero.talent.survivalists_intuition.title=Intuition du Survivant
actors.hero.talent.survivalists_intuition.desc=_+1：_ La vitesse d'identification de tout équipement par la chasseresse est _multipliée par 1,75_.\n\n_+2：_ La vitesse d'identification de tout équipement par la chasseresse est _multipliée par 2,5_.
actors.hero.talent.survivalists_intuition.comment=“Pour survivre, tu dois rapidement obtenir les informations sur cet équipement.”
actors.hero.talent.followup_strike.title=Frappe de Suivi
actors.hero.talent.followup_strike.desc=_+1：_ Lorsque la chasseresse touche un ennemi avec son arc ou une autre arme de jet, sa prochaine attaque de mêlée contre ce même ennemi inflige _2 dégâts supplémentaires_.\n\n_+2：_ Lorsque la chasseresse touche un ennemi avec son arc ou une autre arme de jet, sa prochaine attaque de mêlée contre ce même ennemi inflige _3 dégâts supplémentaires_.
actors.hero.talent.followup_strike.comment=“Frappe fort l'ennemi blessé, ne lui laisse aucun répit.”
actors.hero.talent.natures_aid.title=Aide de la Nature
actors.hero.talent.natures_aid.desc=_+1：_ Lorsque l'effet d'une plante dans le champ de vision se déclenche, la chasseresse gagne 0~2 points d'écorce qui se dégradent tous les _3 tours_.\n\n_+2：_ Lorsque l'effet d'une plante dans le champ de vision se déclenche, la chasseresse gagne 0~2 points d'écorce qui se dégradent tous les _5 tours_.
actors.hero.talent.natures_aid.comment=“La bénédiction de la déesse de la nature, même infime.”

actors.hero.talent.invigorating_meal.title=Repas Revigorant
actors.hero.talent.invigorating_meal.desc=_+1：_ Manger ne coûte qu'1 tour â la chasseresse (les baies ne coûtent aucun tour), et elle gagne _1 tour de Célérité_.\n\n_+2：_ Manger ne coûte qu'1 tour â la chasseresse (les baies ne coûtent aucun tour), et elle gagne _2 tours de Célérité_.
actors.hero.talent.invigorating_meal.comment=“La chasseresse est agile, mais elle doit manger pour courir vite.”
actors.hero.talent.liquid_nature.title=Nature Liquide
actors.hero.talent.liquid_nature.desc=_+1：_ Lorsque la chasseresse boit ou lance une potion, une concoction ou une essence, _jusqu'â 4 hautes herbes_ poussent autour d'elle et les ennemis alentour sont entravés pendant _1 tour_.\n\n_+2：_ Lorsque la chasseresse boit ou lance une potion, une concoction ou une essence, _jusqu'â 6 hautes herbes_ poussent autour d'elle et les ennemis alentour sont entravés pendant _2 tours_.
actors.hero.talent.liquid_nature.comment=Si la potion utilisée est une potion de force, d'expérience ou un objet alchimique nécessitant l'une des potions susmentionnées, la croissance des hautes herbes et la durée d'entrave sont doublées.\n\nPour les objets alchimiques â rendement élevé (comme les potions aquexplosives), ce talent se déclenche en fonction de la quantité produite.\n\n“La chasseresse peut réutiliser les composants herbacés des potions pour libérer une force régénératrice.”
actors.hero.talent.rejuvenating_steps.title=Pas Revigorants
actors.hero.talent.rejuvenating_steps.desc=_+1：_ Lorsque la chasseresse marche sur des herbes basses ou des cendres, elles repoussent en hautes herbes et sont immédiatement piétinées. Ce talent a _un rechargement de 10 tours_.\n\n_+2：_ Lorsque la chasseresse marche sur des herbes basses ou des cendres, elles repoussent en hautes herbes et sont immédiatement piétinées. Ce talent a _un rechargement de 5 tours_.
actors.hero.talent.rejuvenating_steps.comment=Si la régénération passive est désactivée ou si le héros n'a pas gagné d'expérience depuis longtemps, ce talent ne produit que des herbes fanées.\n\n“Lâ oû elle passe, tout renaît.”
actors.hero.talent.heightened_senses.title=Sens Accrus
actors.hero.talent.heightened_senses.desc=_+1：_ La chasseresse obtient une vision spirituelle de toutes les unités dans un rayon de _2 cases_ autour d'elle.\n\n_+2：_ La chasseresse obtient une vision spirituelle de toutes les unités dans un rayon de _3 cases_ autour d'elle.
actors.hero.talent.heightened_senses.comment=“L'instinct du chasseur.”
actors.hero.talent.durable_projectiles.title=Projectiles Durables
actors.hero.talent.durable_projectiles.desc=_+1：_ Les armes de jet de la chasseresse gagnent _50% de durabilité supplémentaire_.\n\n_+2：_ Les armes de jet de la chasseresse gagnent _75% de durabilité supplémentaire_.
actors.hero.talent.durable_projectiles.comment=“Un bon chasseur sait entretenir ses armes.”

actors.hero.talent.point_blank.title=À Bout Portant
actors.hero.talent.point_blank.desc=_+1：_ Lorsque la chasseresse utilise une arme de jet ou l'Arc psychique â distance de mêlée, la pénalité de précision passe de -50% â _-25%_.\n\n_+2：_ Lorsque la chasseresse utilise une arme de jet ou l'Arc psychique â distance de mêlée, la pénalité de précision passe de -50% â _précision normale_.\n\n_+3：_ Lorsque la chasseresse utilise une arme de jet ou l'Arc psychique â distance de mêlée, la pénalité de précision passe de -50% â _+25%_.
actors.hero.talent.point_blank.comment=Attention, utiliser une arme de jet ou l'Arc psychique â distance non-mêlée confère toujours un bonus de précision de 50%.
actors.hero.talent.seer_shot.title=Tir de Voyant
actors.hero.talent.seer_shot.desc=_+1：_ Lorsque la chasseresse tire une fléche sur le sol, elle révéle une zone 3x3 autour du point d'impact, _pour 5 tours_.\n\n_+2：_ Lorsque la chasseresse tire une fléche sur le sol, elle révéle une zone 3x3 autour du point d'impact, _pour 10 tours_.\n\n_+3：_ Lorsque la chasseresse tire une fléche sur le sol, elle révéle une zone 3x3 autour du point d'impact, _pour 15 tours_.
actors.hero.talent.seer_shot.comment=Ce talent a _un rechargement de 20 tours_.
actors.hero.talent.seer_shot.meta_desc=_Si ce talent est obtenu par un autre héros_, il peut être déclenché par n'importe quelle arme de jet.

actors.hero.talent.farsight.title=Vision Lointaine
actors.hero.talent.farsight.desc=_+1：_ Le champ de vision du Sniper _augmente de 25%_.\n\n_+2：_ Le champ de vision du Sniper _augmente de 50%_.\n\n_+3：_ Le champ de vision du Sniper _augmente de 75%_.
actors.hero.talent.farsight.comment=
actors.hero.talent.shared_enchantment.title=Enchantement Partagé
actors.hero.talent.shared_enchantment.desc=_+1：_ Les armes de jet ont _33% de chance_ d'appliquer l'enchantement de l'Arc psychique du Sniper.\n\n_+2：_ Les armes de jet ont _67% de chance_ d'appliquer l'enchantement de l'Arc psychique du Sniper.\n\n_+3：_ Les armes de jet ont _100% de chance_ d'appliquer l'enchantement de l'Arc psychique du Sniper.
actors.hero.talent.shared_enchantment.comment=Quel que soit l'enchantement de l'arme de jet, l'enchantement de l'Arc psychique se déclenche normalement.
actors.hero.talent.shared_upgrades.title=Améliorations Partagées
#fix9：感觉很多人看不懂这个天赋，决定对其增加高亮标记以及注释
actors.hero.talent.shared_upgrades.desc=_+1：_ Lorsque le Sniper attaque avec une arme de jet _améliorée_, chaque _niveau_ d'amélioration augmente la durée du marquage du Sniper de _1 tour_ et les dégâts d'attaque spéciaux de _rang x 2,5%_.\n\n_+2：_ Lorsque le Sniper attaque avec une arme de jet _améliorée_, chaque _niveau_ d'amélioration augmente la durée du marquage du Sniper de _2 tours_ et les dégâts d'attaque spéciaux de _rang x 5%_.\n\n_+3：_ Lorsque le Sniper attaque avec une arme de jet _améliorée_, chaque _niveau_ d'amélioration augmente la durée du marquage du Sniper de _3 tours_ et les dégâts d'attaque spéciaux de _rang x 7,5%_.
actors.hero.talent.shared_upgrades.comment=L'effet de la Bague de tir est de rendre les dégâts de toutes les armes de jet équivalents â ceux de leur niveau correspondant, ce qui n'est pas considéré comme une arme _améliorée_. Par conséquent, l'effet de la Bague de tir sur les armes de jet n'a aucune synergie avec ce talent.

actors.hero.talent.durable_tips.title=Pointes Durables
actors.hero.talent.durable_tips.desc=_+1：_ Les fléchettes empoisonnées du Gardien ont _2x la durabilité_.\n\n_+2：_ Les fléchettes empoisonnées du Gardien ont _3x la durabilité_.\n\n_+3：_ Les fléchettes empoisonnées du Gardien ont _4x la durabilité_.
actors.hero.talent.durable_tips.comment=
actors.hero.talent.barkskin.title=Peau d'Écorce
actors.hero.talent.barkskin.desc=_+1：_ Dans les hautes herbes, le Gardien gagne un effet d'écorce équivalant â _0~50%_ de son niveau, qui se dégrade chaque tour.\n\n_+2：_ Dans les hautes herbes, le Gardien gagne un effet d'écorce équivalant â _0~100%_ de son niveau, qui se dégrade chaque tour.\n\n_+3：_ Dans les hautes herbes, le Gardien gagne un effet d'écorce équivalant â _0~150%_ de son niveau, qui se dégrade chaque tour.
actors.hero.talent.barkskin.comment=
actors.hero.talent.shielding_dew.title=Rosée Protectrice
actors.hero.talent.shielding_dew.desc=_+1：_ Lorsque les PV du Gardien sont au maximum, ramasser une goutte de rosée lui confère un bouclier, jusqu'â _20% de ses PV max_.\n\n_+2：_ Lorsque les PV du Gardien sont au maximum, ramasser une goutte de rosée lui confère un bouclier, jusqu'â _40% de ses PV max_.\n\n_+3：_ Lorsque les PV du Gardien sont au maximum, ramasser une goutte de rosée lui confère un bouclier, jusqu'â _60% de ses PV max_.
actors.hero.talent.shielding_dew.comment=

actors.hero.talent.fan_of_blades.title=Éventail de Lames
actors.hero.talent.fan_of_blades.desc=_+1：_ Les Lames d'âme peuvent toucher _1 cible supplémentaire_, infligeant 50% de dégâts. La cible doit être dans le champ de vision et dans un _angle de 30°_ avec la cible d'origine.\n\n_+2：_ Les Lames d'âme peuvent toucher _2 cibles supplémentaires_, infligeant 50% de dégâts. Les cibles doivent être dans le champ de vision et dans un _angle de 60°_ avec la cible d'origine.\n\n_+3：_ Les Lames d'âme peuvent toucher _3 cibles supplémentaires_, infligeant 50% de dégâts. Les cibles doivent être dans le champ de vision et dans un _angle de 90°_ avec la cible d'origine.\n\n_+4：_ Les Lames d'âme peuvent toucher _4 cibles supplémentaires_, infligeant 50% de dégâts. Les cibles doivent être dans le champ de vision et dans un _angle de 120°_ avec la cible d'origine.
actors.hero.talent.fan_of_blades.comment=
actors.hero.talent.projecting_blades.title=Lames Projetées
actors.hero.talent.projecting_blades.desc=_+1：_ La précision des Lames d'âme augmente de _25%_, elles peuvent traverser _2 cases de terrain solide_.\n\n_+2：_ La précision des Lames d'âme augmente de _50%_, elles peuvent traverser _4 cases de terrain solide_.\n\n_+3：_ La précision des Lames d'âme augmente de _75%_, elles peuvent traverser _6 cases de terrain solide_.\n\n_+4：_ La précision des Lames d'âme augmente de _100%_, elles peuvent traverser _8 cases de terrain solide_.
actors.hero.talent.projecting_blades.comment=
actors.hero.talent.spirit_blades.title=Lames d'âme
actors.hero.talent.spirit_blades.desc=_+1：_ Les Lames d'âme ont _30%_ de chance d'appliquer l'enchantement de l'Arc psychique en plus.\n\n_+2：_ Les Lames d'âme ont _60%_ de chance d'appliquer l'enchantement de l'Arc psychique en plus.\n\n_+3：_ Les Lames d'âme ont _90%_ de chance d'appliquer l'enchantement de l'Arc psychique en plus.\n\n_+4：_ Les Lames d'âme ont _100%_ de chance d'appliquer l'enchantement de l'Arc psychique en plus, et chaque enchantement gagne _10% de renforcement d'enchantement_.
actors.hero.talent.spirit_blades.comment=

actors.hero.talent.growing_power.title=Puissance Croissante
actors.hero.talent.growing_power.desc=_+1：_Les bonus de vitesse de tir et de vitesse de déplacement de la Force de la Nature passent de 33% et 100% à _38%_ et _125%_.\n\n_+2：_Les bonus de vitesse de tir et de vitesse de déplacement de la Force de la Nature passent de 33% et 100% à _42%_ et _150%_.\n\n_+3：_Les bonus de vitesse de tir et de vitesse de déplacement de la Force de la Nature passent de 33% et 100% à _46%_ et _175%_.\n\n_+4：_Les bonus de vitesse de tir et de vitesse de déplacement de la Force de la Nature passent de 33% et 100% à _50%_ et _200%_.
actors.hero.talent.growing_power.comment=
actors.hero.talent.natures_wrath.title=Colère de la Nature
actors.hero.talent.natures_wrath.desc=_+1：_Sous l'effet de la Force de la Nature, les tirs de l'Arc psychique ont _8% de chances_ de déclencher un effet de plante nuisible aléatoire.\n\n_+2：_Sous l'effet de la Force de la Nature, les tirs de l'Arc psychique ont _17% de chances_ de déclencher un effet de plante nuisible aléatoire.\n\n_+3：_Sous l'effet de la Force de la Nature, les tirs de l'Arc psychique ont _25% de chances_ de déclencher un effet de plante nuisible aléatoire.\n\n_+4：_Sous l'effet de la Force de la Nature, les tirs de l'Arc psychique ont _33% de chances_ de déclencher un effet de plante nuisible aléatoire.
actors.hero.talent.natures_wrath.comment=Plantes possibles：Herbe aveuglante, Fleur de flamme, Fleur de givre, Mousse brise-cœur, Liane tempête.
actors.hero.talent.wild_momentum.title=Élan Sauvage
actors.hero.talent.wild_momentum.desc=_+1：_Tuer un ennemi avec l'Arc psychique prolonge la Force de la Nature de _1 tour_, jusqu'à _2 tours_ maximum.\n\n_+2：_Tuer un ennemi avec l'Arc psychique prolonge la Force de la Nature de _2 tours_, jusqu'à _4 tours_ maximum.\n\n_+3：_Tuer un ennemi avec l'Arc psychique prolonge la Force de la Nature de _3 tours_, jusqu'à _6 tours_ maximum.\n\n_+4：_Tuer un ennemi avec l'Arc psychique prolonge la Force de la Nature de _4 tours_, jusqu'à _8 tours_ maximum.
actors.hero.talent.wild_momentum.comment=

actors.hero.talent.eagle_eye.title=Œil d'Aigle
actors.hero.talent.eagle_eye.desc=_+1：_La portée de vision de l'aigle passe de 6 cases à _7 cases_.\n\n_+2：_La portée de vision de l'aigle passe de 6 cases à _8 cases_.\n\n_+3：_La portée de vision de l'aigle passe de 6 cases à _9 cases_, et gagne _2 cases_ de vision spirituelle.\n\n_+4：_La portée de vision de l'aigle passe de 6 cases à _10 cases_, et gagne _3 cases_ de vision spirituelle.
actors.hero.talent.eagle_eye.comment=
actors.hero.talent.go_for_the_eyes.title=Griffes Aveuglantes
actors.hero.talent.go_for_the_eyes.desc=_+1：_L'aigle attaque les yeux de l'ennemi et l'aveugle pendant _2 tours_.\n\n_+2：_L'aigle attaque les yeux de l'ennemi et l'aveugle pendant _5 tours_.\n\n_+3：_L'aigle attaque les yeux de l'ennemi et l'aveugle pendant _5 tours_, et inflige _2 tours_ de mutilation.\n\n_+4：_L'aigle attaque les yeux de l'ennemi et l'aveugle pendant _5 tours_, et inflige _5 tours_ de mutilation.
actors.hero.talent.go_for_the_eyes.comment=
actors.hero.talent.swift_spirit.title=Esprit Rapide
actors.hero.talent.swift_spirit.desc=_+1：_La vitesse de déplacement de l'aigle passe de 2 cases par tour à _2.5 cases_, et esquive automatiquement les _2 premières attaques_ subies.\n\n_+2：_La vitesse de déplacement de l'aigle passe de 2 cases par tour à _3 cases_, et esquive automatiquement les _4 premières attaques_ subies.\n\n_+3：_La vitesse de déplacement de l'aigle passe de 2 cases par tour à _3.5 cases_, et esquive automatiquement les _6 premières attaques_ subies.\n\n_+4：_La vitesse de déplacement de l'aigle passe de 2 cases par tour à _4 cases_, et esquive automatiquement les _8 premières attaques_ subies.
actors.hero.talent.swift_spirit.comment=

#duelist
actors.hero.talent.strengthening_meal.title=Repas Fortifiant
actors.hero.talent.strengthening_meal.desc=_+1：_Manger augmente les _2 prochaines attaques physiques_ de la Duelliste de 3 dégâts supplémentaires.\n\n_+2：_Manger augmente les _3 prochaines attaques physiques_ de la Duelliste de 3 dégâts supplémentaires.
actors.hero.talent.strengthening_meal.comment=“Il faut être bien nourri pour avoir la force de se battre.”
actors.hero.talent.adventurers_intuition.title=Intuition d'Aventurière
actors.hero.talent.adventurers_intuition.desc=_+1：_La vitesse d'identification des armes de la Duelliste est multipliée par _2.5_, et celle des armures par _1.75_.\n\n_+2：_La Duelliste identifie directement une arme _lorsqu'elle l'équipe_, et la vitesse d'identification des armures est multipliée par _2.5_.
actors.hero.talent.adventurers_intuition.comment=“Maîtrise de toutes les armes et armures.”
actors.hero.talent.patient_strike.title=Frappe Patiente
actors.hero.talent.patient_strike.desc=_+1：_Si la Duelliste attend avant d'effectuer une attaque de mêlée, cette attaque inflige _1~2 dégâts supplémentaires_.\n\n_+2：_Si la Duelliste attend avant d'effectuer une attaque de mêlée, cette attaque inflige _2 dégâts supplémentaires_.
actors.hero.talent.patient_strike.comment=“Concentre ton énergie, frappe comme un dragon fulgurant.”
actors.hero.talent.aggressive_barrier.title=Barrière Aggressive
actors.hero.talent.aggressive_barrier.desc=_+1：_Lorsque la Duelliste a 50% ou moins de ses PV maximum, utiliser une technique de combat lui confère _3 points de bouclier_.\n\n_+2：_Lorsque la Duelliste a 50% ou moins de ses PV maximum, utiliser une technique de combat lui confère _5 points de bouclier_.
actors.hero.talent.aggressive_barrier.comment=“C'est la puissance que peut éveiller un guerrier en situation désespérée.”
actors.hero.talent.aggressive_barrier.meta_desc=_Si ce talent est obtenu par un autre héros_ : sans accès aux techniques de combat, ce talent confère le bouclier en effectuant des attaques de mêlée à faible vie. Ce talent a alors un temps de recharge de 50 tours.

actors.hero.talent.focused_meal.title=Repas Ciblé
actors.hero.talent.focused_meal.desc=_+1：_La Duelliste ne met qu'1 tour à manger et gagne _0.67 point de charge de technique_.\n\n_+2：_La Duelliste ne met qu'1 tour à manger et gagne _1 point de charge de technique_.
actors.hero.talent.focused_meal.comment=“Même avec cent techniques de combat, il faut bien manger.”
actors.hero.talent.focused_meal.meta_desc=_Si ce talent est obtenu par un autre héros_ : sans accès aux techniques de combat, au niveau +1, la prochaine attaque physique du héros inflige (niveau du héros)/3 dégâts supplémentaires, et au niveau +2, (niveau du héros)/2 dégâts supplémentaires.
actors.hero.talent.liquid_agility.title=Agilité Liquide
actors.hero.talent.liquid_agility.desc=_+1：_La Duelliste a _4x l'esquive_ en buvant ou lançant une potion, un élixir ou une potion secrète, et sa prochaine attaque de mêlée dans les 5 tours a _3x la précision_.\n\n_+2：_La Duelliste a _l'esquive infinie_ en buvant ou lançant une potion, un élixir ou une potion secrète, et sa prochaine attaque de mêlée dans les 5 tours a _la précision infinie_.
actors.hero.talent.liquid_agility.comment=Si une potion de force, une potion d'expérience ou un objet alchimique nécessitant ces potions est utilisé, le bonus d'esquive dure un tour supplémentaire et le bonus de précision dure une attaque supplémentaire.\n\nPour les objets alchimiques à haut rendement (comme l'élixir aquatique), ce talent se déclenche avec une probabilité basée sur la quantité produite en une fois.\n\n“Cela est dû à la faible teneur en alcool des potions et au fait que la Duelliste a appris la boxe de l'homme ivre.”
actors.hero.talent.weapon_recharging.title=Recharge d'Arme
actors.hero.talent.weapon_recharging.desc=_+1：_Lorsque la Duelliste est en état de recharge de bâton ou d'artefact, elle récupère 1 point de charge de technique tous les _15 tours_.\n\n_+2：_Lorsque la Duelliste est en état de recharge de bâton ou d'artefact, elle récupère 1 point de charge de technique tous les _10 tours_.
actors.hero.talent.weapon_recharging.comment=“La magie peut aussi faire partie des techniques de combat.”
actors.hero.talent.weapon_recharging.meta_desc=_Si ce talent est obtenu par un autre héros_ : sans accès aux techniques de combat et en état de recharge, inflige 5% de dégâts de mêlée supplémentaires au niveau +1, et 7.5% au niveau +2.
actors.hero.talent.lethal_haste.title=Hâte Mortelle
actors.hero.talent.lethal_haste.desc=_+1：_Après avoir tué un ennemi avec une technique de combat, la Duelliste gagne _3 tours_ d'ombre volante (téléportation).\n\n_+2：_Après avoir tué un ennemi avec une technique de combat, la Duelliste gagne _5 tours_ d'ombre volante (téléportation).
actors.hero.talent.lethal_haste.comment=“Excusez-moi.”
actors.hero.talent.lethal_haste.meta_desc=_Si ce talent est obtenu par un autre héros_ : sans accès aux techniques de combat, ce talent peut être déclenché par des attaques d'arme normales, mais avec un temps de recharge de 100 tours.
actors.hero.talent.swift_equip.title=Équipement Rapide
actors.hero.talent.swift_equip.desc=_+1：_La Duelliste peut changer instantanément d'arme équipée _une fois_ tous les 20 tours.\n\n_+2：_La Duelliste peut changer instantanément d'arme équipée _deux fois_ tous les 20 tours.
actors.hero.talent.swift_equip.comment=Placez une arme non équipée dans la barre de raccourcis. Lorsque ce talent n'est pas en recharge, cliquer sur l'arme non équipée dans la barre de raccourcis l'équipe instantanément.\n\n“C'est ce qu'on appelle la pratique rend parfait.”

actors.hero.talent.precise_assault.title=Assaut Précision
actors.hero.talent.precise_assault.desc=_+1：_Quand la Duelliste utilise une technique de combat, sa prochaine attaque de mêlée dans les 5 tours a _2x la précision_.\n\n_+2：_Quand la Duelliste utilise une technique de combat, sa prochaine attaque de mêlée dans les 5 tours a _5x la précision_.\n\n_+3：_Quand la Duelliste utilise une technique de combat, sa prochaine attaque de mêlée dans les 5 tours a _la précision infinie_.
actors.hero.talent.precise_assault.comment=
actors.hero.talent.precise_assault.meta_desc=_Si ce talent est obtenu par un autre héros_ : sans accès aux techniques de combat, augmente la précision de mêlée de 10/20/30% aux niveaux +1/+2/+3.
actors.hero.talent.deadly_followup.title=Poursuite Mortelle
actors.hero.talent.deadly_followup.desc=_+1：_Quand la Duelliste touche un ennemi avec une arme de jet, ses dégâts de mêlée contre lui augmentent de _10%_ pendant 5 tours.\n\n_+2：_Quand la Duelliste touche un ennemi avec une arme de jet, ses dégâts de mêlée contre lui augmentent de _20%_ pendant 5 tours.\n\n_+3：_Quand la Duelliste touche un ennemi avec une arme de jet, ses dégâts de mêlée contre lui augmentent de _30%_ pendant 5 tours.
actors.hero.talent.deadly_followup.comment=

actors.hero.talent.varied_charge.title=Charge Variée
actors.hero.talent.varied_charge.desc=_+1：_Quand la guerrière utilise deux techniques de combat différentes, elle gagne immédiatement _0.17 point de charge de technique_. Aucune limite de tours entre les deux utilisations.\n\n_+2：_Quand la guerrière utilise deux techniques de combat différentes, elle gagne immédiatement _0.33 point de charge de technique_. Aucune limite de tours entre les deux utilisations.\n\n_+3：_Quand la guerrière utilise deux techniques de combat différentes, elle gagne immédiatement _0.5 point de charge de technique_. Aucune limite de tours entre les deux utilisations.
actors.hero.talent.varied_charge.comment=
actors.hero.talent.twin_upgrades.title=Améliorations Jumelles
actors.hero.talent.twin_upgrades.desc=_+1：_Si parmi les deux armes maniées par la guerrière, l'une a un niveau inférieur et un rang _d'au moins 2 rangs inférieur_ à l'autre, son niveau est élevé à celui de l'autre.\n\n_+2：_Si parmi les deux armes maniées par la guerrière, l'une a un niveau inférieur et un rang _d'au moins 1 rang inférieur_ à l'autre, son niveau est élevé à celui de l'autre.\n\n_+3：_Si parmi les deux armes maniées par la guerrière, l'une a un niveau inférieur et un rang _inférieur ou égal_ à l'autre, son niveau est élevé à celui de l'autre.
actors.hero.talent.twin_upgrades.comment=
actors.hero.talent.combined_lethality.title=Létalité Combinée
actors.hero.talent.combined_lethality.desc=_+1：_Si la guerrière attaque immédiatement avec une arme de mêlée différente après avoir utilisé une technique de combat, cette attaque exécute les ennemis non-Boss ayant _moins de 13% de PV_.\n\n_+2：_Si la guerrière attaque immédiatement avec une arme de mêlée différente après avoir utilisé une technique de combat, cette attaque exécute les ennemis non-Boss ayant _moins de 27% de PV_.\n\n_+3：_Si la guerrière attaque immédiatement avec une arme de mêlée différente après avoir utilisé une technique de combat, cette attaque exécute les ennemis non-Boss ayant _moins de 40% de PV_.
actors.hero.talent.combined_lethality.comment=Cette attaque peut être une attaque d'arme de mêlée normale ou faire partie d'une technique de combat.

actors.hero.talent.unencumbered_spirit.title=Esprit Sans Entrave
actors.hero.talent.unencumbered_spirit.desc=_+1：_Pour chaque équipement de _rang 3 ou moins_ utilisé, l'énergie interne gagnée par le Moine augmente de _+50%_.\n\n_+2：_Pour chaque équipement de _rang 2 ou moins_ utilisé, l'énergie interne gagnée par le Moine augmente de _+75%_. Les équipements de rang 3 restent inchangés.\n\n_+3：_Pour chaque équipement de _rang 1_ utilisé, l'énergie interne gagnée par le Moine augmente de _+100%_. Les équipements de rangs 2 et 3 restent inchangés. Il reçoit également gratuitement une armure de tissu et des gantelets cloutés.
actors.hero.talent.unencumbered_spirit.comment=Note : Ce talent ne rapporte rien en attaquant à mains nues ou avec l'Anneau de force.
actors.hero.talent.monastic_vigor.title=Vigueur Monastique
actors.hero.talent.monastic_vigor.desc=_+1：_Si le Moine a _100% d'énergie interne_, ses techniques d'arts martiaux sont transcendées.\n\n_+2：_Si le Moine a _80% d'énergie interne_, ses techniques d'arts martiaux sont transcendées.\n\n_+3：_Si le Moine a _60% d'énergie interne_, ses techniques d'arts martiaux sont transcendées.
actors.hero.talent.monastic_vigor.comment=En état de transcendance :\n- Frappe du vide utilise l'enchantement de votre arme.\n- Concentration ne consomme pas de tour.\n- La distance de charge de Nuage ascendant +4.\n- Les dégâts de Dragon enroulé +50%, repousse et étourdit tous les ennemis adjacents.\n- Méditation restaure lentement 20% des PV perdus et confère 80% de résistance aux dégâts.
actors.hero.talent.combined_energy.title=Énergie Combinée
actors.hero.talent.combined_energy.desc=_+1：_Si le Moine utilise une technique de combat et une technique d'arts martiaux coûtant _4+ d'énergie interne_ dans les 5 tours, il regagne 1 point d'énergie interne.\n\n_+2：_Si le Moine utilise une technique de combat et une technique d'arts martiaux coûtant _3+ d'énergie interne_ dans les 5 tours, il regagne 1 point d'énergie interne.\n\n_+3：_Si le Moine utilise une technique de combat et une technique d'arts martiaux coûtant _2+ d'énergie interne_ dans les 5 tours, il regagne 1 point d'énergie interne.
actors.hero.talent.combined_energy.comment=

actors.hero.talent.close_the_gap.title=Fermer la Distance
actors.hero.talent.close_the_gap.desc=_+1：_En engageant un duel, la Duelliste se téléporte vers sa cible sur _jusqu'à 2 cases_.\n\n_+2：_En engageant un duel, la Duelliste se téléporte vers sa cible sur _jusqu'à 3 cases_.\n\n_+3：_En engageant un duel, la Duelliste se téléporte vers sa cible sur _jusqu'à 4 cases_.\n\n_+4：_En engageant un duel, la Duelliste se téléporte vers sa cible sur _jusqu'à 5 cases_.
actors.hero.talent.close_the_gap.comment=Cette téléportation peut traverser les terrains dangereux ou les ennemis, mais pas les murs ou autres terrains solides. La distance de téléportation est également prise en compte dans la portée d'engagement du duel.
actors.hero.talent.invigorating_victory.title=Victoire Revigorante
actors.hero.talent.invigorating_victory.desc=_+1：_Si la Duelliste vainc sa cible avant la fin du duel, elle récupère _5+30% des dégâts subis en duel_ PV.\n\n_+2：_Si la Duelliste vainc sa cible avant la fin du duel, elle récupère _10+50% des dégâts subis en duel_ PV.\n\n_+3：_Si la Duelliste vainc sa cible avant la fin du duel, elle récupère _15+65% des dégâts subis en duel_ PV.\n\n_+4：_Si la Duelliste vainc sa cible avant la fin du duel, elle récupère _20+75% des dégâts subis en duel_ PV.
actors.hero.talent.invigorating_victory.comment=
actors.hero.talent.elimination_match.title=Match d'Élimination
actors.hero.talent.elimination_match.desc=_+1：_Si la Duelliste engage un nouveau duel dans les 3 tours suivant la fin d'un duel, la charge consommée par ce duel est _réduite de 16%_.\n\n_+2：_Si la Duelliste engage un nouveau duel dans les 3 tours suivant la fin d'un duel, la charge consommée par ce duel est _réduite de 30%_.\n\n_+3：_Si la Duelliste engage un nouveau duel dans les 3 tours suivant la fin d'un duel, la charge consommée par ce duel est _réduite de 40%_.\n\n_+4：_Si la Duelliste engage un nouveau duel dans les 3 tours suivant la fin d'un duel, la charge consommée par ce duel est _réduite de 50%_.
actors.hero.talent.elimination_match.comment=

actors.hero.talent.elemental_reach.title=Portée Élémentaire
actors.hero.talent.elemental_reach.desc=_+1：_La portée de Frappe élémentaire passe de 4 cases à _5 cases_, et l'angle de diffusion passe de 65 degrés à _75 degrés_.\n\n_+2：_La portée de Frappe élémentaire passe de 4 cases à _6 cases_, et l'angle de diffusion passe de 65 degrés à _85 degrés_.\n\n_+3：_La portée de Frappe élémentaire passe de 4 cases à _7 cases_, et l'angle de diffusion passe de 65 degrés à _95 degrés_.\n\n_+4：_La portée de Frappe élémentaire passe de 4 cases à _8 cases_, et l'angle de diffusion passe de 65 degrés à _105 degrés_.
actors.hero.talent.elemental_reach.comment=
actors.hero.talent.striking_force.title=Force de Frappe
actors.hero.talent.striking_force.desc=_+1：_L'efficacité de Frappe élémentaire augmente de _30%_.\n\n_+2：_L'efficacité de Frappe élémentaire augmente de _60%_.\n\n_+3：_L'efficacité de Frappe élémentaire augmente de _90%_.\n\n_+4：_L'efficacité de Frappe élémentaire augmente de _120%_.
actors.hero.talent.striking_force.comment=
actors.hero.talent.directed_power.title=Puissance Dirigée
actors.hero.talent.directed_power.desc=_+1：_Pour chaque ennemi dans la zone de Frappe élémentaire, l'attaque directe sur la cible principale gagne _+30% de puissance d'enchantement_.\n\n_+2：_Pour chaque ennemi dans la zone de Frappe élémentaire, l'attaque directe sur la cible principale gagne _+60% de puissance d'enchantement_.\n\n_+3：_Pour chaque ennemi dans la zone de Frappe élémentaire, l'attaque directe sur la cible principale gagne _+90% de puissance d'enchantement_.\n\n_+4：_Pour chaque ennemi dans la zone de Frappe élémentaire, l'attaque directe sur la cible principale gagne _+120% de puissance d'enchantement_.
actors.hero.talent.directed_power.comment=

actors.hero.talent.feigned_retreat.title=Retraite Feinte
actors.hero.talent.feigned_retreat.desc=_+1：_Si un ennemi attaque l'image résiduelle de la Duelliste, elle gagne _2 tours_ de célérité.\n\n_+2：_Si un ennemi attaque l'image résiduelle de la Duelliste, elle gagne _4 tours_ de célérité.\n\n_+3：_Si un ennemi attaque l'image résiduelle de la Duelliste, elle gagne _6 tours_ de célérité.\n\n_+4：_Si un ennemi attaque l'image résiduelle de la Duelliste, elle gagne _8 tours_ de célérité.
actors.hero.talent.feigned_retreat.comment=
actors.hero.talent.expose_weakness.title=Exposer la Faiblesse
actors.hero.talent.expose_weakness.desc=_+1：_Les ennemis qui attaquent l'image résiduelle de la Duelliste subissent _2 tours_ de faiblesse et de vulnérabilité.\n\n_+2：_Les ennemis qui attaquent l'image résiduelle de la Duelliste subissent _4 tours_ de faiblesse et de vulnérabilité.\n\n_+3：_Les ennemis qui attaquent l'image résiduelle de la Duelliste subissent _6 tours_ de faiblesse et de vulnérabilité.\n\n_+4：_Les ennemis qui attaquent l'image résiduelle de la Duelliste subissent _8 tours_ de faiblesse et de vulnérabilité.
actors.hero.talent.expose_weakness.comment=
actors.hero.talent.counter_ability.title=Contre-Technique
actors.hero.talent.counter_ability.desc=_+1：_Si la Duelliste utilise une technique de combat dans les 3 tours après que son image résiduelle a été attaquée, elle regagne immédiatement _0.38 point de charge de technique_.\n\n_+2：_Si la Duelliste utilise une technique de combat dans les 3 tours après que son image résiduelle a été attaquée, elle regagne immédiatement _0.77 point de charge de technique_.\n\n_+3：_Si la Duelliste utilise une technique de combat dans les 3 tours après que son image résiduelle a été attaquée, elle regagne immédiatement _1.13 point de charge de technique_.\n\n_+4：_Si la Duelliste utilise une technique de combat dans les 3 tours après que son image résiduelle a été attaquée, elle regagne immédiatement _1.5 point de charge de technique_.
actors.hero.talent.counter_ability.comment=

#cleric
actors.hero.talent.satiated_spells.title=Sorts Rassasiés
actors.hero.talent.satiated_spells.desc=_+1：_Manger confère _3 points de bouclier_ à la Prêtresse lors de son prochain sort.\n\n_+2：_Manger confère _5 points de bouclier_ à la Prêtresse lors de son prochain sort.
actors.hero.talent.satiated_spells.comment=“C'est pour éviter que la 'Cène' ne se reproduise.”
actors.hero.talent.holy_intuition.title=Intuition Sacrée
actors.hero.talent.holy_intuition.desc=_+1：_Le Codex peut lancer le sort _Intuition Sacrée_, consommant _3 points de charge_ pour révéler si un objet est maudit.\n\n_+2：_Le Codex peut lancer le sort _Intuition Sacrée_, consommant _2 points de charge_ pour révéler si un objet est maudit.
actors.hero.talent.holy_intuition.comment=“Ta parole est une lampe à mes pieds, et une lumière sur mon sentier.”
actors.hero.talent.searing_light.title=Lumière Brûlante
actors.hero.talent.searing_light.desc=_+1：_Les attaques physiques de la Prêtresse contre les ennemis illuminés par _Lumière Guide_ infligent _3 dégâts supplémentaires_.\n\n_+2：_Les attaques physiques de la Prêtresse contre les ennemis illuminés par _Lumière Guide_ infligent _5 dégâts supplémentaires_.
actors.hero.talent.searing_light.comment=“La lumière luit dans les ténèbres, et les ténèbres ne l'ont point comprise.”
actors.hero.talent.shield_of_light.title=Bouclier Sacré
actors.hero.talent.shield_of_light.desc=_+1：_Le Codex peut lancer le sort _Bouclier Sacré_, consommant 1 point de charge pour conférer immédiatement _2~4 points d'armure_ à une seule cible pendant 5 tours.\n\n_+2：_Le Codex peut lancer le sort _Bouclier Sacré_, consommant 1 point de charge pour conférer immédiatement _3~6 points d'armure_ à une seule cible pendant 5 tours.
actors.hero.talent.shield_of_light.comment=“Ne crains rien, car je suis avec toi ; ne promène pas des regards inquiets, car je suis ton Dieu ; je te fortifie, je viens à ton secours, je te soutiens de ma droite triomphante.”

actors.hero.talent.enlightening_meal.title=Repas Éclairant
actors.hero.talent.enlightening_meal.desc=_+1：_La Prêtresse ne met qu'1 tour à manger et gagne _0.67 point de charge de Codex_.\n\n_+2：_La Prêtresse ne met qu'1 tour à manger et gagne _1 point de charge de Codex_.
actors.hero.talent.enlightening_meal.comment=Si le Codex n'est pas dans l'inventaire, ce talent confère _2/3 tours de recharge de bâton et d'artefact_ aux niveaux _+1/+2_ (ne permet pas à la Corne d'abondance de se recharger elle-même).\n\n“En vérité, la 'Cène' a déjà eu lieu, et ce Codex a été écrit pour que la tragédie ne se reproduise plus.”
actors.hero.talent.recall_inscription.title=Rappel d'Inscription
actors.hero.talent.recall_inscription.refunded=Vos objets ont été rendus !
actors.hero.talent.recall_inscription.desc=_+1：_Le Codex peut lancer le sort _Rappel d'Inscription_ pour réactiver l'effet de la rune ou du parchemin utilisé le plus récemment dans les _10 tours_.\n\n_+2：_Le Codex peut lancer le sort _Rappel d'Inscription_ pour réactiver l'effet de la rune ou du parchemin utilisé le plus récemment dans les _300 tours_.
actors.hero.talent.recall_inscription.comment=Rappel d'Inscription ne peut pas réactiver les effets des parchemins d'upgrade, de transmutation ou du parchemin secret de sublimation. Le coût en charge varie selon le dernier objet utilisé : rune 2 points, parchemin 3 points, parchemin secret 4 points. Le coût est doublé en déclenchant les effets d'un parchemin de transmutation ou d'une rune/parchemin secret de transmutation/upgrade.\n\n“Cette parole encore une fois signifie que les choses ébranlées, comme des choses faites, disparaîtront, afin que celles qui ne sont point ébranlées subsistent.”
actors.hero.talent.sunray.title=Rayon Solaire
actors.hero.talent.sunray.desc=_+1：_Le Codex peut lancer le sort _Rayon Solaire_, consommant 1 point de charge pour infliger _4~8_ dégâts et aveugler la cible pendant _4 tours_.\n\n_+2：_Le Codex peut lancer le sort _Rayon Solaire_, consommant 1 point de charge pour infliger _6~12_ dégâts et aveugler la cible pendant _6 tours_.
actors.hero.talent.sunray.comment=Le Rayon Solaire ne peut aveugler une cible qu'une fois, mais si la cible est déjà aveuglée par le Rayon Solaire, elle est paralysée à la place. Le Rayon Solaire inflige toujours des dégâts maximums aux ennemis _morts-vivants et démons_.\n\n“Mais pour vous qui craignez mon nom, se lèvera le soleil de la justice, et la guérison sera dans ses rayons ; vous sortirez, et vous sauterez comme les veaux d'une étable. Vous foulerez les méchants, car ils seront comme de la cendre sous la plante de vos pieds, au jour que je prépare.”
actors.hero.talent.divine_sense.title=Perception Divine
actors.hero.talent.divine_sense.desc=_+1：_Le Codex peut lancer le sort _Perception Divine_, consommant 2 points de charge pour obtenir une vision spirituelle sur _8 cases_ pendant 50 tours.\n\n_+2：_Le Codex peut lancer le sort _Perception Divine_, consommant 2 points de charge pour obtenir une vision spirituelle sur _12 cases_ pendant 50 tours.
actors.hero.talent.divine_sense.comment=“Il regarde sur les voies de l'homme, et voit tous ses pas. Il n'y a point de ténèbres, ni d'ombre épaisse, où puissent se cacher ceux qui commettent l'iniquité.”
#actors.hero.talent.divine_sense.meta_desc=_如果这个天赋被其它英雄获得_，那么它会在+1/+2等级时使英雄在使用法杖或神器后获得3/5格内的灵视感知。
actors.hero.talent.bless.title=Bénédiction
actors.hero.talent.bless.desc=_+1：_Le Codex peut lancer le sort _Bénédiction_, consommant 1 point de charge pour obtenir _6 tours de bénédiction et 10 points de bouclier_ sur soi-même, ou _10 tours de bénédiction et 10 points de soin_ sur une autre unité.\n\n_+2：_Le Codex peut lancer le sort _Bénédiction_, consommant 1 point de charge pour obtenir _10 tours de bénédiction et 15 points de bouclier_ sur soi-même, ou _15 tours de bénédiction et 15 points de soin_ sur une autre unité.
actors.hero.talent.bless.comment=Les soins excédentaires de ce sort sont convertis en bouclier.\n\n“Car l'Éternel Dieu est un soleil et un bouclier, l'Éternel donne la grâce et la gloire, il ne prive d'aucun bien ceux qui marchent dans l'intégrité.”
#actors.hero.talent.bless.meta_desc=_如果这个天赋被其它英雄获得_，那么它会在+1/+2等级时提升英雄和所有盟友3%/5%的精准和闪避。

actors.hero.talent.cleanse.title=Purification
actors.hero.talent.cleanse.desc=_+1：_Le Codex peut lancer le sort _Purification_, consommant 2 points de charge pour dissiper immédiatement tous les effets négatifs sur soi-même et les alliés proches, et conférer _10 points de bouclier_ à tous.\n\n_+2：_Le Codex peut lancer le sort _Purification_, consommant 2 points de charge pour dissiper immédiatement tous les effets négatifs sur soi-même et les alliés proches, conférer _20 points de bouclier_ et _3 tours d'immunité aux effets négatifs_ à tous.\n\n_+3：_Le Codex peut lancer le sort _Purification_, consommant 2 points de charge pour dissiper immédiatement tous les effets négatifs sur soi-même et les alliés proches, conférer _30 points de bouclier_ et _5 tours d'immunité aux effets négatifs_ à tous.
actors.hero.talent.cleanse.comment=
#actors.hero.talent.cleanse.meta_desc=_如果这个天赋被其它英雄获得_，那么它会在+1/+2/+3等级时有10/20/30%的概率使英雄在使用法杖或神器后净化英雄所有的减益效果。
actors.hero.talent.light_reading.title=Lecture Légère
actors.hero.talent.light_reading.desc=_+1：_La Prêtresse peut utiliser les fonctions du Codex sans l'équiper, mais son taux de recharge tombe à _25%_ lorsqu'il n'est pas équipé.\n\n_+2：_La Prêtresse peut utiliser les fonctions du Codex sans l'équiper, mais son taux de recharge tombe à _50%_ lorsqu'il n'est pas équipé.\n\n_+3：_La Prêtresse peut utiliser les fonctions du Codex sans l'équiper, mais son taux de recharge tombe à _75%_ lorsqu'il n'est pas équipé.
actors.hero.talent.light_reading.comment=
actors.hero.talent.light_reading.meta_desc=_Si ce talent est obtenu par un autre héros_ : augmente la vitesse de recharge de tous les bâtons de 7/13/20% aux niveaux +1/+2/+3.

actors.hero.talent.holy_lance.title=Lance Sacrée
actors.hero.talent.holy_lance.desc=_+1：_La Prêtresse peut lancer le sort _Lance Sacrée_, consommant 4 points de charge pour infliger _30~55 dégâts_ mortels.\n\n_+2：_La Prêtresse peut lancer le sort _Lance Sacrée_, consommant 4 points de charge pour infliger _45~83 dégâts_ mortels.\n\n_+3：_La Prêtresse peut lancer le sort _Lance Sacrée_, consommant 4 points de charge pour infliger _60~110 dégâts_ mortels.
actors.hero.talent.holy_lance.comment=La Lance Sacrée inflige toujours des dégâts maximums aux ennemis _morts-vivants et démons_. La Lance Sacrée a un temps de recharge de 30 tours avant de pouvoir être relancée.
actors.hero.talent.hallowed_ground.title=Sol Sacré
actors.hero.talent.hallowed_ground.desc=_+1：_La Prêtresse peut lancer le sort _Sol Sacré_, consommant 2 points de charge pour créer une zone sacrée de _3x3 cases_ pendant 20 tours.\n\n_+2：_La Prêtresse peut lancer le sort _Sol Sacré_, consommant 2 points de charge pour créer une zone sacrée de _5x5 cases_ pendant 20 tours.\n\n_+3：_La Prêtresse peut lancer le sort _Sol Sacré_, consommant 2 points de charge pour créer une zone sacrée de _7x7 cases_ pendant 20 tours.
actors.hero.talent.hallowed_ground.comment=Lors du lancement, le sort soigne immédiatement les alliés de 15 PV, enchevêtre brièvement les ennemis et répand des herbes basses. Ensuite, le Sol Sacré soigne lentement les alliés, estropie les ennemis et fait pousser aléatoirement des hautes herbes. Le Sol Sacré confère un bouclier à la Prêtresse au lieu de soins, et peut être détruit par le feu.
actors.hero.talent.mnemonic_prayer.title=Prière Mnémotechnique
actors.hero.talent.mnemonic_prayer.desc=_+1：_La Prêtresse peut lancer le sort _Prière Mnémotechnique_, consommant 1 point de charge pour prolonger de _3 tours_ les effets positifs/négatifs d'un allié/ennemi.\n\n_+2：_La Prêtresse peut lancer le sort _Prière Mnémotechnique_, consommant 1 point de charge pour prolonger de _4 tours_ les effets positifs/négatifs d'un allié/ennemi.\n\n_+3：_La Prêtresse peut lancer le sort _Prière Mnémotechnique_, consommant 1 point de charge pour prolonger de _5 tours_ les effets positifs/négatifs d'un allié/ennemi.
actors.hero.talent.mnemonic_prayer.comment=La Prière Mnémotechnique ne peut prolonger qu'une fois les effets positifs ou négatifs d'une cible spécifique, et ne peut pas prolonger les effets positifs provenant des compétences d'armure.

actors.hero.talent.lay_on_hands.title=Imposition des Mains
actors.hero.talent.lay_on_hands.desc=_+1：_Le Paladin peut lancer le sort _Imposition des Mains_, consommant 1 point de charge pour soigner immédiatement une unité proche de _15 PV_, ou obtenir _15 points de bouclier_ pour lui-même.\n\n_+2：_Le Paladin peut lancer le sort _Imposition des Mains_, consommant 1 point de charge pour soigner immédiatement une unité proche de _20 PV_, ou obtenir _20 points de bouclier_ pour lui-même.\n\n_+3：_Le Paladin peut lancer le sort _Imposition des Mains_, consommant 1 point de charge pour soigner immédiatement une unité proche de _25 PV_, ou obtenir _25 points de bouclier_ pour lui-même.
actors.hero.talent.lay_on_hands.comment=Les soins excédentaires de ce sort sont convertis en bouclier. L'Imposition des Mains peut être relancée, mais ne peut pas conférer un bouclier dépassant la valeur de trois incantations.
actors.hero.talent.aura_of_protection.title=Aura de Protection
actors.hero.talent.aura_of_protection.desc=_+1：_Le Paladin peut lancer le sort _Aura de Protection_, consommant 2 points de charge pour conférer au Paladin et à tous les alliés dans un rayon de 2 cases _20% de réduction de dégâts_ et _50% de renforcement de glyphe_ sur l'armure du Paladin.\n\n_+2：_Le Paladin peut lancer le sort _Aura de Protection_, consommant 2 points de charge pour conférer au Paladin et à tous les alliés dans un rayon de 2 cases _30% de réduction de dégâts_ et _75% de renforcement de glyphe_ sur l'armure du Paladin.\n\n_+3：_Le Paladin peut lancer le sort _Aura de Protection_, consommant 2 points de charge pour conférer au Paladin et à tous les alliés dans un rayon de 2 cases _40% de réduction de dégâts_ et _100% de renforcement de glyphe_ sur l'armure du Paladin.
actors.hero.talent.aura_of_protection.comment=
actors.hero.talent.wall_of_light.title=Mur de Lumière
actors.hero.talent.wall_of_light.desc=_+1：_Le Paladin peut lancer le sort _Mur de Lumière_, consommant 3 points de charge pour créer un mur solide de _3 cases de large_ devant lui, durant 20 tours, repoussant les ennemis.\n\n_+2：_Le Paladin peut lancer le sort _Mur de Lumière_, consommant 3 points de charge pour créer un mur solide de _5 cases de large_ devant lui, durant 20 tours, repoussant les ennemis.\n\n_+3：_Le Paladin peut lancer le sort _Mur de Lumière_, consommant 3 points de charge pour créer un mur solide de _7 cases de large_ devant lui, durant 20 tours, repoussant les ennemis.
actors.hero.talent.wall_of_light.comment=Le Mur de Lumière peut être placé dans 8 directions, mais un seul mur peut exister à la fois.

actors.hero.talent.divine_intervention.title=Intervention Divine
actors.hero.talent.divine_intervention.desc=_+1：_En Ascension Transcendante, la Prêtresse peut lancer le sort _Intervention Divine_ pour renforcer les boucliers de la Prêtresse et de tous les alliés à _150 points_ et prolonger l'Ascension de _3 tours_.\n\n_+2：_En Ascension Transcendante, la Prêtresse peut lancer le sort _Intervention Divine_ pour renforcer les boucliers de la Prêtresse et de tous les alliés à _200 points_ et prolonger l'Ascension de _4 tours_.\n\n_+3：_En Ascension Transcendante, la Prêtresse peut lancer le sort _Intervention Divine_ pour renforcer les boucliers de la Prêtresse et de tous les alliés à _250 points_ et prolonger l'Ascension de _5 tours_.\n\n_+4：_En Ascension Transcendante, la Prêtresse peut lancer le sort _Intervention Divine_ pour renforcer les boucliers de la Prêtresse et de tous les alliés à _300 points_ et prolonger l'Ascension de _6 tours_.
actors.hero.talent.divine_intervention.comment=L'Intervention Divine consomme jusqu'à 5 points de charge du Codex, et ne peut être lancée qu'une seule fois par Ascension Transcendante.
actors.hero.talent.judgement.title=Jugement
actors.hero.talent.judgement.desc=_+1：_En Ascension Transcendante, la Prêtresse peut lancer le sort _Jugement_ pour infliger _10~20 dégâts_ à tous les ennemis dans son champ de vision.\n\n_+2：_En Ascension Transcendante, la Prêtresse peut lancer le sort _Jugement_ pour infliger _15~30 dégâts_ à tous les ennemis dans son champ de vision.\n\n_+3：_En Ascension Transcendante, la Prêtresse peut lancer le sort _Jugement_ pour infliger _20~40 dégâts_ à tous les ennemis dans son champ de vision.\n\n_+4：_En Ascension Transcendante, la Prêtresse peut lancer le sort _Jugement_ pour infliger _25~50 dégâts_ à tous les ennemis dans son champ de vision.
actors.hero.talent.judgement.comment=Le Jugement consomme 3 points de charge du Codex. Chaque sort lancé par la Prêtresse depuis son entrée en Ascension Transcendante ou depuis le dernier Jugement inflige 33% de dégâts supplémentaires.
actors.hero.talent.flash.title=Échelle Céleste
actors.hero.talent.flash.desc=_+1：_En Ascension Transcendante, la Prêtresse peut lancer le sort _Échelle Céleste_ pour se téléporter sur _jusqu'à 3 cases_.\n\n_+2：_En Ascension Transcendante, la Prêtresse peut lancer le sort _Échelle Céleste_ pour se téléporter sur _jusqu'à 4 cases_.\n\n_+3：_En Ascension Transcendante, la Prêtresse peut lancer le sort _Échelle Céleste_ pour se téléporter sur _jusqu'à 5 cases_.\n\n_+4：_En Ascension Transcendante, la Prêtresse peut lancer le sort _Échelle Céleste_ pour se téléporter sur _jusqu'à 6 cases_.
actors.hero.talent.flash.comment=L'Échelle Céleste consomme initialement 2 points de charge du Codex, et chaque utilisation au cours de la même Ascension Transcendante augmente le coût de +1.

actors.hero.talent.body_form.title=Forme Corporelle
actors.hero.talent.body_form.desc=En améliorant ce talent, la Prêtresse peut lancer le sort _Forme Corporelle_, consommant 2 points de charge pour que la Trinité revête un enchantement ou un glyphe identifié lors de cette partie.\n\n_+1：_En utilisant la Trinité, la Prêtresse gagne l'effet de l'enchantement ou du glyphe choisi pendant _20 tours_.\n\n_+2：_En utilisant la Trinité, la Prêtresse gagne l'effet de l'enchantement ou du glyphe choisi pendant _27 tours_.\n\n_+3：_En utilisant la Trinité, la Prêtresse gagne l'effet de l'enchantement ou du glyphe choisi pendant _33 tours_.\n\n_+4：_En utilisant la Trinité, la Prêtresse gagne l'effet de l'enchantement ou du glyphe choisi pendant _40 tours_.
actors.hero.talent.body_form.comment=La Trinité ne peut revêtir qu'un seul effet de Forme Corporelle à la fois. Choisir un enchantement ou un glyphe rare et puissant augmente le coût en charge d'armure de la Trinité.
actors.hero.talent.mind_form.title=Forme Mentale
actors.hero.talent.mind_form.desc=En améliorant ce talent, la Prêtresse peut lancer le sort _Forme Mentale_, consommant 3 points de charge pour que la Trinité revête un bâton ou une arme de jet utilisé lors de cette partie.\n\n_+1：_En utilisant la Trinité, la Prêtresse utilise l'effet de _niveau 3_ du bâton ou de l'arme de jet choisi.\n\n_+2：_En utilisant la Trinité, la Prêtresse utilise l'effet de _niveau 4_ du bâton ou de l'arme de jet choisi.\n\n_+3：_En utilisant la Trinité, la Prêtresse utilise l'effet de _niveau 5_ du bâton ou de l'arme de jet choisi.\n\n_+4：_En utilisant la Trinité, la Prêtresse utilise l'effet de _niveau 6_ du bâton ou de l'arme de jet choisi.
actors.hero.talent.mind_form.comment=La Trinité ne peut revêtir qu'un seul effet de Forme Mentale à la fois.
actors.hero.talent.spirit_form.title=Forme Spirituelle
actors.hero.talent.spirit_form.desc=En améliorant ce talent, la Prêtresse peut lancer le sort _Forme Spirituelle_, consommant 4 points de charge pour que la Trinité revête un anneau ou un artefact (sauf le Codex) identifié lors de cette partie.\n\n_+1：_En utilisant la Trinité, la Prêtresse gagne l'effet de _niveau 1_ de l'anneau choisi pendant 20 tours ou utilise l'effet de _niveau 4_ de l'artefact choisi.\n\n_+2：_En utilisant la Trinité, la Prêtresse gagne l'effet de _niveau 2_ de l'anneau choisi pendant 20 tours ou utilise l'effet de _niveau 6_ de l'artefact choisi.\n\n_+3：_En utilisant la Trinité, la Prêtresse gagne l'effet de _niveau 3_ de l'anneau choisi pendant 20 tours ou utilise l'effet de _niveau 8_ de l'artefact choisi.\n\n_+4：_En utilisant la Trinité, la Prêtresse gagne l'effet de _niveau 4_ de l'anneau choisi pendant 20 tours ou utilise l'effet de _niveau 10_ de l'artefact choisi.
actors.hero.talent.spirit_form.comment=La Trinité ne peut revêtir qu'un seul effet de Forme Spirituelle à la fois. L'effet et le coût en charge d'armure de l'utilisation d'un artefact via la Trinité varient selon l'artefact.

actors.hero.talent.beaming_ray.title=Rayon Lumineux
actors.hero.talent.beaming_ray.desc=En améliorant ce talent, la Prêtresse peut lancer le sort _Rayon Lumineux_, consommant 1 point de charge pour que l'allié renforcé libère un rayon de téléportation. Le rayon traverse les murs et téléporte l'allié à l'emplacement ciblé. Si un ennemi s'y trouve, l'allié apparaît près de l'ennemi et le prend pour cible. Ce sort peut aussi téléporter les alliés normalement immobiles, mais la portée du rayon est alors réduite de moitié.\n\n_+1：_La portée maximale du rayon de téléportation est de _4 cases_, et le bonus de dégâts d'Unité contre l'ennemi le plus proche passe à _35%_ pendant 10 tours.\n\n_+2：_La portée maximale du rayon de téléportation est de _8 cases_, et le bonus de dégâts d'Unité contre l'ennemi le plus proche passe à _40%_ pendant 10 tours.\n\n_+3：_La portée maximale du rayon de téléportation est de _12 cases_, et le bonus de dégâts d'Unité contre l'ennemi le plus proche passe à _45%_ pendant 10 tours.\n\n_+4：_La portée maximale du rayon de téléportation est de _16 cases_, et le bonus de dégâts d'Unité contre l'ennemi le plus proche passe à _50%_ pendant 10 tours.
actors.hero.talent.beaming_ray.comment=
actors.hero.talent.life_link.title=Lien de Vie
actors.hero.talent.life_link.desc=En améliorant ce talent, la Prêtresse peut lancer le sort _Lien de Vie_, consommant 2 points de charge pour créer un lien de vie entre la Prêtresse et son allié renforcé. Ce sort partage les dégâts subis entre la Prêtresse et son allié, et les sorts de soutien de la Prêtresse de rang 3 ou moins affectent les deux lorsqu'ils sont lancés sur l'un ou l'autre.\n\n_+1：_Le Lien de Vie dure _10 tours_ et la réduction de dégâts d'Unité passe à _35%_.\n\n_+2：_Le Lien de Vie dure _13 tours_ et la réduction de dégâts d'Unité passe à _40%_.\n\n_+3：_Le Lien de Vie dure _17 tours_ et la réduction de dégâts d'Unité passe à _45%_.\n\n_+4：_Le Lien de Vie dure _20 tours_ et la réduction de dégâts d'Unité passe à _50%_.
actors.hero.talent.life_link.comment=
actors.hero.talent.stasis.title=Projection Astrale
actors.hero.talent.stasis.desc=En améliorant ce talent, la Prêtresse peut lancer le sort _Projection Astrale_, consommant 2 points de charge pour figer un allié renforcé. Ce sort retire temporairement l'allié du donjon tout en préservant la durée restante de tous ses effets positifs, y compris Unité. Lorsque l'effet du sort se termine, l'allié réapparaît près de vous. Ce sort peut être relancé immédiatement sans coût pour mettre fin à l'effet plus tôt. Ce sort fonctionne aussi sur les alliés immobiles, mais ne peut pas les déplacer entre les étages.\n\n_+1：_L'état figé dure au maximum _60 tours_.\n\n_+2：_L'état figé dure au maximum _90 tours_.\n\n_+3：_L'état figé dure au maximum _120 tours_.\n\n_+4：_L'état figé dure au maximum _150 tours_.
actors.hero.talent.stasis.comment=Lorsqu'un allié est figé, la Prêtresse peut lancer Rayon Lumineux pour le rappeler, ou Lien de Vie pour lui conférer les effets du sort par avance. Cependant, un allié figé ne peut pas bénéficier des effets du sort de Lien de Vie.


#universal
actors.hero.talent.heroic_energy.title=Énergie Héroïque
actors.hero.talent.heroic_energy.rat_title=Énergie Souricière
actors.hero.talent.heroic_energy.desc=_+1：_Le coût en charge pour activer la capacité de l'armure héroïque est _réduit de 12%_.\n\n_+2：_Le coût en charge pour activer la capacité de l'armure héroïque est _réduit de 23%_.\n\n_+3：_Le coût en charge pour activer la capacité de l'armure héroïque est _réduit de 32%_.\n\n_+4：_Le coût en charge pour activer la capacité de l'armure héroïque est _réduit de 40%_.
actors.hero.talent.heroic_energy.comment=

actors.hero.talent.ratsistance.title=Résistance de Rat
actors.hero.talent.ratsistance.desc=_+1：_Les dégâts infligés par les ennemis ratifiés sont _réduits de 10%_.\n\n_+2：_Les dégâts infligés par les ennemis ratifiés sont _réduits de 19%_.\n\n_+3：_Les dégâts infligés par les ennemis ratifiés sont _réduits de 27%_.\n\n_+4：_Les dégâts infligés par les ennemis ratifiés sont _réduits de 35%_.
actors.hero.talent.ratsistance.comment=
actors.hero.talent.ratlomacy.title=Ratlomatie
actors.hero.talent.ratlomacy.desc=_+1：_Utiliser Ratification sur un ennemi déjà ratifié fige sa forme de rat et le convertit définitivement en allié.\n\n_+2：_Utiliser Ratification sur un ennemi déjà ratifié fige sa forme de rat et le convertit définitivement en allié, et lui confère _2 tours_ de poussée hormonale.\n\n_+3：_Utiliser Ratification sur un ennemi déjà ratifié fige sa forme de rat et le convertit définitivement en allié, et lui confère _4 tours_ de poussée hormonale.\n\n_+4：_Utiliser Ratification sur un ennemi déjà ratifié fige sa forme de rat et le convertit définitivement en allié, et lui confère _6 tours_ de poussée hormonale.
actors.hero.talent.ratlomacy.comment=
actors.hero.talent.ratforcements.title=Renforts de Rats
actors.hero.talent.ratforcements.desc=_+1：_Utiliser Ratification sur soi-même _invoque 1_ souris rongeuse alliée à proximité.\n\n_+2：_Utiliser Ratification sur soi-même _invoque 2_ souris rongeuses alliées à proximité.\n\n_+3：_Utiliser Ratification sur soi-même _invoque 3_ souris rongeuses alliées à proximité.\n\n_+4：_Utiliser Ratification sur soi-même _invoque 4_ souris rongeuses alliées à proximité.
actors.hero.talent.ratforcements.comment=



###npcs
actors.mobs.npcs.blacksmith.name=Forgeron ogre
actors.mobs.npcs.blacksmith.intro_quest_warrior=Hé, l'humain ! T'as l'air plutôt costaud.
actors.mobs.npcs.blacksmith.intro_quest_mage=Hé, l'humain ! T'as l'air plutôt malin.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Hé, l'humain ! T'as l'air plutôt rusé.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Hé, l'humaine ! T'as l'air plutôt agile.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Hé, l'humaine ! T'as l'air plutôt fougueuse.
actors.mobs.npcs.blacksmith.intro_quest_cleric=Hé, l'humain ! T'as l'air plutôt sérieux.
#fix9：补充巨魔对绅士的形容
actors.mobs.npcs.blacksmith.intro_quest_freeman=Hé, l'humain ! T'as l'air plutôt classe.
actors.mobs.npcs.blacksmith.intro_quest_slimegirl=Hé, le monstre ! T'as l'air plutôt utile.
actors.mobs.npcs.blacksmith.intro_quest_ninja=Hé, l'humain ! T'as l'air plutôt mystérieux.
actors.mobs.npcs.blacksmith.intro_quest_dm400=Hé... oh, encore un tas de ferraille.
actors.mobs.npcs.blacksmith.intro_quest_princess=Hé, la naine ! Oui, toi, t'as beau avoir un peu de sang humain, je sens encore cette odeur de nain sur toi.
actors.mobs.npcs.blacksmith.intro_quest_friar=...T'as une odeur bizarre, mais tu m'impressionnes pas.
actors.mobs.npcs.blacksmith.intro_quest_start=Tu veux pas finir bon à rien, hein ? Parfait, j'ai du boulot pour toi. J'ai monté cette forge sur un vieux puits de mine, l'escalier est juste là. Prends cette pioche et déterre-moi du _minerai d'ombre_, 40 morceaux_ suffiront. La pierre en bas est pas très dure, _avec un peu d'huile de coude tu pourrais même casser un mur_.\n\nQuoi, ma récompense ? T'es bien gourmand...\n\nBon, d'accord, je peux te forger des trucs. Rends-toi chanceux, je suis le seul forgeron du coin.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Mais fais gaffe, la mine est trop dangereuse pour un faible comme toi. La mine est abandonnée depuis un moment, et pas mal de cristaux ont poussé. Les cristaux brillent, mais ils sont trop fragiles, ça vaut rien, et en plus ils sont protégés par des monstres. Ces trucs sont coriaces, alors _fais attention où tu creuses_, sinon tu vas attirer leur attention.\n\nY a un _gros cristal_ en bas, plutôt solide. Si tu comptes le casser, faudra te battre. Je parie que le briser ralentira la croissance des cristaux, et si tu fais le taf, je te filerai un bonus.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Mais fais gaffe, la mine est trop dangereuse pour un faible comme toi. Une bande de gnolls veut aussi récupérer de l'ombre, ils foutent le bazar en bas. Ces abrutis ont fait s'effondrer un tas de gravats en creusant. _Tu devras te frayer un chemin tout seul, alors cherche les rochers qui viennent de s'écrouler_.\n\nJe me souviens d'un gnoll qui mène la danse, un _shaman gnoll_ ou un truc du genre. Si tu arrives à le descendre, j'aurai un bonus pour toi, mais je te garantis qu'il va se défendre.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Mais fais gaffe, la mine est trop dangereuse pour un faible comme toi. Y a une espèce de champignon magique qui a poussé en bas. Y a même des gardes-champignons, s'ils te voient, tu vas en baver, mais ils ont pas de jambes donc ils peuvent pas te courir après. Si tu veux rester en vie, _ne rentre pas dans leur champ de vision_.\n\nSi tu arrives à descendre le _gros champignon_, j'aurai un bonus pour toi. Mais il est coriace, il est relié à des nœuds de mycélium cachés dans les murs. Tu devras détruire la plupart des nœuds avant de pouvoir vraiment lui faire des dégâts.
actors.mobs.npcs.blacksmith.reminder=Tu veux encore me faire perdre mon temps ? L'entrée de la mine est là.
actors.mobs.npcs.blacksmith.reminder_crystal=De l'ombre, il n'y en a jamais assez, et si tu peux casser ce gros cristal, ce serait bien.
actors.mobs.npcs.blacksmith.reminder_gnoll=De l'ombre, il n'y en a jamais assez, et si tu peux buter ce shaman gnoll, ce serait bien.
actors.mobs.npcs.blacksmith.reminder_fungi=De l'ombre, il n'y en a jamais assez, et si tu peux buter ce gros champignon, ce serait bien.
actors.mobs.npcs.blacksmith.lost_pick=Tu te fiches de moi ? Elle est où ma pioche ?!
actors.mobs.npcs.blacksmith.quest_start_prompt=T'es prêt à descendre ? Pense à garder de la place dans ton sac pour l'ombre.\n\n_Je te laisse descendre qu'une seule fois !_
actors.mobs.npcs.blacksmith.enter_yes=Je suis prêt
actors.mobs.npcs.blacksmith.enter_no=Pas encore
actors.mobs.npcs.blacksmith.exit_warn_none=C'est tout ? T'as à peine déterré quelques morceaux d'ombre ! Tu pourrais au moins en trouver _40_.\n\n_N'oublie pas, une fois que t'auras remonté ces marches, tu pourras plus redescendre._
actors.mobs.npcs.blacksmith.exit_warn_low=C'est tout ? On dirait que t'as pas trouvé beaucoup d'ombre. Tu pourrais au moins en trouver _40_.\n\n_N'oublie pas, une fois que t'auras remonté ces marches, tu pourras plus redescendre._
actors.mobs.npcs.blacksmith.exit_warn_med=Fini ? T'as trouvé quelques morceaux, mais y en a sûrement plus en bas. Tu pourrais au moins en trouver _40_.\n\n_N'oublie pas, une fois que t'auras remonté ces marches, tu pourras plus redescendre._
actors.mobs.npcs.blacksmith.exit_warn_high=Fini ? T'as déterré pas mal d'ombre, mais pour moi c'est jamais assez. Tu pourrais au moins en trouver _40_.\n\n_N'oublie pas, une fois que t'auras remonté ces marches, tu pourras plus redescendre._
actors.mobs.npcs.blacksmith.exit_warn_full=Fini ? T'as déterré pas mal d'ombre, mais fais gaffe à pas perdre quelque chose en bas.\n\n_N'oublie pas, une fois que t'auras remonté ces marches, tu pourras plus redescendre._
actors.mobs.npcs.blacksmith.exit_warn_crystal=Ce gros cristal est encore en bas. Si tu arrives à le casser, j'aurai un bonus pour toi.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=Ce shaman gnoll est encore en bas. Si tu arrives à le buter, j'aurai un bonus pour toi.
actors.mobs.npcs.blacksmith.exit_warn_fungi=Ce gros champignon est encore en bas. Si tu arrives à le buter, j'aurai un bonus pour toi.
actors.mobs.npcs.blacksmith.exit_yes=Fini
actors.mobs.npcs.blacksmith.exit_no=Pas encore
actors.mobs.npcs.blacksmith.get_lost=Je suis occupé. Dégage.
actors.mobs.npcs.blacksmith.entrance_blocked=Le passage est bloqué.
actors.mobs.npcs.blacksmith.cant_enter_old=Cette zone n'est pas disponible dans cette partie. Créez une nouvelle partie pour essayer la nouvelle quête.
actors.mobs.npcs.blacksmith.def_verb=Paré
actors.mobs.npcs.blacksmith.desc=Ce forgeron ogre ressemble à n'importe quel autre ogre : grand et maigre, la peau ayant la couleur et la texture de la pierre. Il tient un marteau ridiculement petit par rapport à sa taille et ne cesse de réparer des trucs.

##old blacksmith quest dialogue from pre-v2.2.0
actors.mobs.npcs.blacksmith.gold_1=Hé, l'ami ! Tu veux pas finir bon à rien, hein ? Prends cette pioche et déterre-moi du _minerai d'ombre_, 15 morceaux suffiront. Quoi, ma récompense ? T'es bien gourmand...\nBon, d'accord, j'ai pas d'argent à te donner, mais je peux te forger des trucs. Rends-toi chanceux, je suis le seul forgeron du coin.
actors.mobs.npcs.blacksmith.blood_1=Hé, l'ami ! Tu veux pas finir bon à rien, hein ? Prends cette pioche et _tue une chauve-souris_ avec, j'ai besoin du sang sur la tête. Quoi, ma récompense ? T'es bien gourmand...\n\nBon, d'accord, j'ai pas d'argent, mais je peux te forger des trucs. Rends-toi chanceux, je suis le seul forgeron du coin.
actors.mobs.npcs.blacksmith.gold_2=Minerai d'ombre. 15 morceaux. Sérieux, c'est si dur que ça ?
actors.mobs.npcs.blacksmith.blood_2=J'ai dit qu'il me fallait du sang de chauve-souris sur la pioche. Grouille !
actors.mobs.npcs.blacksmith.completed=Pff, t'es enfin revenu... bon, c'est toujours mieux que de pas revenir.

actors.mobs.npcs.ghost.name=Esprit triste
actors.mobs.npcs.ghost.rat_1=Bonjour, %s... Il fut un temps où j'étais comme toi — fort et confiant... jusqu'à ce qu'une bête maléfique me tue... Je ne peux pas quitter cet endroit... avant d'avoir accompli ma vengeance... Tue _le Rat putride_, c'est lui qui m'a pris la vie...\n\nIl rôde dans cet étage... répandant la souillure... _Méfie-toi des nuages puants et des morsures corrosives qui l'entourent, la bave acide qu'il produit se dissout dans l'eau..._
actors.mobs.npcs.ghost.rat_2=Aide-moi, je t'en prie... tue cette abomination...\n\n_Combat-le près de l'eau... esquive ses puanteurs..._
actors.mobs.npcs.ghost.gnoll_1=Bonjour, %s... Il fut un temps où j'étais comme toi — fort et confiant... mais j'ai été tué par un ennemi rusé... Je ne peux pas quitter cet endroit... avant d'avoir accompli ma vengeance... Tue _le gnoll sorcier_, c'est lui qui m'a pris la vie...\n\nIl est différent des autres gnolls... il peut s'invisibiliser et utiliser des armes de jet... _Méfie-toi de ses dagues empoisonnées et de ses haches de jet, reste près de lui..._
actors.mobs.npcs.ghost.gnoll_2=Aide-moi, je t'en prie... tue ce traître...\n\n_Ne le laisse pas te toucher... plus tu es près de lui, mieux c'est..._
actors.mobs.npcs.ghost.crab_1=Bonjour, %s... Il fut un temps où j'étais comme toi — fort et confiant... mais j'ai été tué par une créature ancienne... Je ne peux pas quitter cet endroit... avant d'avoir accompli ma vengeance... Tue _le Crabe géant_, c'est lui qui m'a pris la vie...\n\nIl a traversé des siècles... avec une pince massive et une carapace très épaisse... _Méfie-toi de sa pince, tu dois prendre ce crabe par surprise, sinon il parera toutes tes attaques avec ses pinces..._
actors.mobs.npcs.ghost.crab_2=Aide-moi, je t'en prie... tue ce crustacé...\n\n_S'il te repère... il bloquera toutes tes attaques..._
actors.mobs.npcs.ghost.find_me=Merci... viens me trouver...
actors.mobs.npcs.ghost.desc=Ce fantôme est presque invisible. Il ressemble à un amas informe de taches sombres avec un visage douloureux.

actors.mobs.npcs.imp.name=Diablotin ambitieux
actors.mobs.npcs.imp.intro=T'es un aventurier ? J'adore les aventuriers ! Si faut buter un truc, ils font toujours le taf. Pas vrai ? Bien sûr, à condition qu'y ait une prime.
actors.mobs.npcs.imp.golems_1=Bref, j'ai besoin que tu butes _quelques golems_. Tu vois, je veux lancer un petit business ici, mais ces golems stupides ruinent mon commerce ! C'est impossible de discuter avec ces tas de pierres qui traînent partout, c'est trop nul ! Donc s'il te plaît, tue... laisse-moi compter, _4 golems_, et la récompense est à toi.
actors.mobs.npcs.imp.monks_1=Bref, j'ai besoin que tu butes _quelques moines_. Tu vois, je veux lancer un petit business ici, mais ces tarés n'achètent rien et font fuir les autres clients. Donc s'il te plaît, tue... laisse-moi compter, _5 moines_, et la récompense est à toi.
actors.mobs.npcs.imp.golems_2=Où t'en es avec ta chasse aux golems ? N'oublie pas de rapporter leurs insignes.
actors.mobs.npcs.imp.monks_2=Hé, t'es encore en vie ! Je savais que t'étais plus fort qu'eux. N'oublie pas de rapporter leurs insignes.
actors.mobs.npcs.imp.cya=On se reverra, %s !
actors.mobs.npcs.imp.hey=Hé hé hé, %s !
actors.mobs.npcs.imp.desc=Les diablotins sont des démons inférieurs. Ils n'ont ni force puissante ni talent magique, mais ils sont assez intelligents et sociables. Beaucoup de diablotins aiment vivre là où il n'y a pas d'autres démons.

actors.mobs.npcs.impshopkeeper.name=Diablotin ambitieux
actors.mobs.npcs.impshopkeeper.greetings=Bonjour, %s !
actors.mobs.npcs.impshopkeeper.greetings_ascent=%s, qu'est-ce que t'as fabriqué ? Si t'as des affaires, fais vite, je veux pas traîner ici !
actors.mobs.npcs.impshopkeeper.thief=Je pensais pouvoir te faire confiance...
actors.mobs.npcs.impshopkeeper.buyback=Le diablotin vous a rendu vos objets d'un geste vif.
actors.mobs.npcs.impshopkeeper.desc=Le diablotin a installé un petit stand devant l'entrée du Hall des Démons. C'est agréable de voir un visage amical ici, mais le prix de ses marchandises, lui, n'a rien d'amical.

actors.mobs.npcs.mirrorimage.name=Image miroir
actors.mobs.npcs.mirrorimage.desc=Cette illusion vous ressemble beaucoup, portant même votre arme et armure actuelles.\n\nL'image miroir traque les ennemis et les attaque avec son arme miroir. L'arme miroir fonctionne comme la vôtre, mais inflige moins de dégâts. L'image miroir est presque invisible à sa création, mais devient visible après avoir attaqué.\n\nL'image miroir a une certaine capacité d'attaque, mais est très fragile : elle se dissipe instantanément si elle subit des dégâts.
actors.mobs.npcs.mirrorimage.discover_hint=Vous pouvez découvrir cette unité via un parchemin.

actors.mobs.npcs.npc.discover_hint=Vous pouvez découvrir cette unité dans une zone du donjon.

actors.mobs.npcs.dongyusangyu.name=Dongyu Sangyu
actors.mobs.npcs.dongyusangyu.desc=Ce chien orange porte un sac de marqueurs de chemin et un carnet de chasse au trésor bien tenu.
actors.mobs.npcs.dongyusangyu.hello=Tu veux tenter ta chance à une partie de chasse au trésor ?

actors.mobs.npcs.surfaceshopkeeper.name=Marchand
actors.mobs.npcs.surfaceshopkeeper.desc=Le marchand tient la boutique de surface. Les articles en rayon sont vendus au prix de l'étage 10, les articles commandés au prix de l'étage 5.
actors.mobs.npcs.surfaceshopkeeper.thief=Voleur, voleur !
actors.mobs.npcs.surfaceshopkeeper.warn=Attention ! Je ne t'avertirai pas une deuxième fois.
actors.mobs.npcs.surfaceshopkeeper.flee=Le marchand ferme boutique et prend la fuite !
actors.mobs.npcs.surfaceshopkeeper.sell=Vendre des objets
actors.mobs.npcs.surfaceshopkeeper.query=Commander
actors.mobs.npcs.surfaceshopkeeper.raid=Lancer un raid
actors.mobs.npcs.surfaceshopkeeper.talk=Parler
actors.mobs.npcs.surfaceshopkeeper.talk_text=Donne-moi le nom exact d'un consommable ordinaire, tant que ce n'est pas un objet important, je pourrai peut-être te le vendre.
actors.mobs.npcs.surfaceshopkeeper.raid_title=Mission de raid
actors.mobs.npcs.surfaceshopkeeper.raid_body=Le droit d'entrée est de %1$d pièces d'or. Trouvez la clé de cristal et atteignez la salle d'évacuation marquée. Vous devez vous échapper avec succès pour conserver le butin de cet étage ; l'échec vous fera perdre tout le butin de l'étage et 1 à 2 consommables ordinaires aléatoires. Vous évacuer avec une seconde clé de cristal vous rapportera %2$d pièces d'or supplémentaires.\n\nDes objets cachés et des armes de jet enchantées peuvent apparaître, mais il n'y aura pas d'armes de mêlée ou d'armures supplémentaires.
actors.mobs.npcs.surfaceshopkeeper.raid_enter=Payer et entrer
actors.mobs.npcs.surfaceshopkeeper.raid_cancel=Ne pas entrer
actors.mobs.npcs.surfaceshopkeeper.raid_no_gold=Entrer dans le raid nécessite %d pièces d'or.
actors.mobs.npcs.surfaceshopkeeper.raid_unavailable=Impossible de lancer un raid pour le moment.
actors.mobs.npcs.surfaceshopkeeper.buyback=Le marchand vous rend vos objets à contrecœur.
actors.mobs.npcs.surfaceshopkeeper.query_title=Commander
actors.mobs.npcs.surfaceshopkeeper.query_body=Entrez le nom complet de l'objet. Vous pouvez ajouter "x quantité" à la fin, exemple : Potion de soin x3. Chaque objet peut être commandé jusqu'à %d.
actors.mobs.npcs.surfaceshopkeeper.query_confirm=Rechercher
actors.mobs.npcs.surfaceshopkeeper.query_cancel=Annuler
actors.mobs.npcs.surfaceshopkeeper.invalid_quantity=Quantité invalide.
actors.mobs.npcs.surfaceshopkeeper.not_found=Impossible de trouver cet objet, ou cet objet n'a pas de prix de vente.
actors.mobs.npcs.surfaceshopkeeper.limit_reached=Chaque objet peut être commandé jusqu'à %1$d ; vous en avez déjà acheté %2$d.
actors.mobs.npcs.surfaceshopkeeper.query_offer=Quantité : %1$d\nPrix unitaire : %2$d pièces d'or\nPrix total : %3$d pièces d'or\nMarge restante avant achat : %4$d
actors.mobs.npcs.surfaceshopkeeper.buy=Acheter
actors.mobs.npcs.surfaceshopkeeper.not_enough_gold=Vous n'avez pas assez d'or.

actors.mobs.npcs.prismaticimage.name=Illusion prismatique
actors.mobs.npcs.prismaticimage.desc=Cette illusion scintillante de lumière prismatique vous ressemble beaucoup, portant même votre arme et armure actuelles.\n\nLe gardien prismatique traque les ennemis et attire leur agressivité, utilisant sa défense et sa vie renforcées pour encaisser les coups. Bien qu'il ne soit pas aussi offensif qu'une image miroir, il a plus de vie et une défense accrue basée sur votre armure.\n\nQuand sa vie tombe à 0, il persiste un moment pendant lequel il peut encore être soigné. Quand il n'y a plus d'ennemis autour, l'illusion se dissout et se rattache à son maître.
actors.mobs.npcs.prismaticimage.discover_hint=Vous pouvez découvrir cette unité via un parchemin.

actors.mobs.npcs.ratking.name=Roi des rats
actors.mobs.npcs.ratking.not_sleeping=Je ne dors pas !
actors.mobs.npcs.ratking.what_is_it=Qu'est-ce que tu veux ? J'ai pas de temps à perdre avec ces broutilles. Mon royaume ne va pas se gouverner tout seul !
actors.mobs.npcs.ratking.confused=Où... où suis-je ? Mon royaume a besoin de moi !
actors.mobs.npcs.ratking.crown_clothes=Remets tes habits ! Tu connais pas le protocole royal ?
actors.mobs.npcs.ratking.crown_desc=Ooh, cette couronne est pour moi ?! Elle est encore plus brillante que la mienne, alors j'accepte volontiers !\n\nBien sûr, moi, le Roi des rats, je ne prends pas sans rien donner. En échange, Sa Majesté peut t'accorder une capacité digne d'un "héros" ! Qu'est-ce que t'en dis ?
actors.mobs.npcs.ratking.crown_yes=Bien sûr !
actors.mobs.npcs.ratking.crown_info=Je veux en savoir plus.
actors.mobs.npcs.ratking.crown_no=Non merci...
actors.mobs.npcs.ratking.crown_thankyou=Héhéhé, merci bien ! Ne me déçois pas, va répandre ma renommée !
actors.mobs.npcs.ratking.crown_fine=Très bien ! De toute façon, je voulais pas vraiment de cette couronne qui brille...
actors.mobs.npcs.ratking.crown_after=Les nouveaux habits te vont ? Transaction honnête, ni repris ni échangé !
actors.mobs.npcs.ratking.desc_crown=Ce rat est un peu plus gros qu'un rat ordinaire. Il porte la couronne du Roi des Nains.
actors.mobs.npcs.ratking.desc_birthday=Ce rat est un peu plus gros qu'un rat ordinaire. Il porte un petit chapeau de fête vert au lieu de sa couronne habituelle. Joyeux anniversaire, Roi des rats !
actors.mobs.npcs.ratking.desc_winter=Ce rat est un peu plus gros qu'un rat ordinaire. Il porte un petit bonnet de fête au lieu de sa couronne habituelle. Joyeuses fêtes !
actors.mobs.npcs.ratking.desc=Ce rat est un peu plus gros qu'un rat ordinaire. Il porte une petite couronne.
actors.mobs.npcs.ratking.discover_hint=Vous pouvez découvrir cette unité au dernier étage d'une zone du donjon.

actors.mobs.npcs.sheep.name=Mouton
actors.mobs.npcs.sheep.baa!=Bêê !
actors.mobs.npcs.sheep.baa?=Bêê ?
actors.mobs.npcs.sheep.baa.=Bêê.
actors.mobs.npcs.sheep.baa...=Bêê...
actors.mobs.npcs.sheep.def_verb=Paré
actors.mobs.npcs.sheep.desc=C'est un mouton magique. Pourquoi l'appelle-t-on mouton magique ? Parce que tu ne peux pas le tuer. Il reste là jusqu'à disparaître, et la seule chose qu'il fait, c'est ruminer en te roulant des yeux.
actors.mobs.npcs.sheep.discover_hint=Vous pouvez découvrir cette unité via un objet ou un piège.

actors.mobs.npcs.shopkeeper.name=Marchand
actors.mobs.npcs.shopkeeper.thief=Voleur, voleur !
actors.mobs.npcs.shopkeeper.warn=Attention ! Je ne t'avertirai pas une deuxième fois.
actors.mobs.npcs.shopkeeper.flee=Le marchand ferme boutique et prend la fuite !
actors.mobs.npcs.shopkeeper.sell=Choisissez un objet à vendre
actors.mobs.npcs.shopkeeper.talk=Parler
actors.mobs.npcs.shopkeeper.buyback=Le marchand vous rend vos objets à contrecœur.
actors.mobs.npcs.shopkeeper.talk_prison_intro=J'ai tout ce qu'il te faut pour réussir ton aventure !
actors.mobs.npcs.shopkeeper.talk_prison_warrior=Ton sceau est plutôt intéressant. D'habitude, ils sont en un seul morceau. Serais-tu un héros déshonoré ou quelque chose comme ça ? Bon, quoi que t'aies fait, ça me regarde pas. C'est ton or qui m'intéresse.
actors.mobs.npcs.shopkeeper.talk_prison_mage=Hé hé, je crois que j'ai vu ton avis de recherche en ville. En cavale, hein ? Oh, tu dis que t'es innocent, vraiment ? Bon bon bon... t'inquiète, j'ai mieux à faire que de te dénoncer. Mais peut-être que tu devrais dépenser un peu pour t'en assurer ?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=T'es envoyé par la guilde des voleurs pour nettoyer le secteur ? Non ? T'es juste venu acheter ? Le fait que t'aies réussi à venir ici montre que t'as tué quelques monstres, mais t'attends pas à une réduction pour autant. J'ai payé assez de protection, et je vous ai pas vu traîner dans le coin.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=Mademoiselle, cet endroit n'est pas fait pour vous. Les couloirs étroits du donjon sont moins spacieux que les grandes salles des villes ou les forêts des faubourgs, pas vrai ? Hé hé, oh, ne faites pas attention à mon bavardage, pourquoi ne pas acheter quelque chose ?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=Ooh, c'est pas la grande héroïne qui parcourt le monde ! Si tu essaies de sauver encore un petit village, je ne peux que te souhaiter bonne chance. Parce que les dangers ici sont bien plus merdiques que des bandits de grand chemin. Bien sûr, je suis sûr que tu feras mieux que quiconque, mais surtout, ne meurs pas devant ma porte.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=Bonjour, Votre Éminence, ou devrais-je dire "Votre Altesse" ? Haha, quoi qu'il en soit, ce n'est pas un endroit pour un saint homme comme vous. Si vous "rejoigniez le Seigneur" ici, vos fidèles auraient le cœur brisé. Mais avec votre pouvoir suprême, vous ne devez pas manquer d'argent terrestre, alors pourquoi ne pas acheter quelques trucs au cas où ?
#fix9：文案更改
actors.mobs.npcs.shopkeeper.talk_prison_freeman=Oh, Monsieur, si je ne me trompe pas, j'ai déjà vu votre portrait dans un magazine économique. Ou plutôt, vous ressemblez à un célèbre magnat qui y figurait. Bref, vous n'avez pas l'air de regarder à la dépense, pourquoi ne pas acheter quelques trucs ici ? Je vous garantis sur ma tête de commerçant que ce sont de bonnes marchandises qui vous aideront à survivre.
actors.mobs.npcs.shopkeeper.talk_prison_slimegirl=Euh... bonjour ? Même si aucun monstre ne peut me blesser, ton arrivée m'a quand même fait sursauter. Puisque tu peux comprendre ce que je dis, jette un œil à ces trucs. En tant que monstre client, je te ferai des prix plus bas qu'aux humains, promis.
actors.mobs.npcs.shopkeeper.talk_prison_ninja=DOMO, ninja SAN, marchand DESU. Je me demande ce qui t'amène de ton lointain pays d'Orient jusqu'ici ? Serait-ce qu'après toutes ces décennies, vous avez enfin décidé de vous occuper du "traître" enfermé ici ? Quoi qu'il en soit, tout cela m'importe peu. Ce qui m'importe vraiment, c'est l'argent. Si ça t'intéresse, jette un œil, vois s'il y a quelque chose dont tu as besoin.
actors.mobs.npcs.shopkeeper.talk_prison_dm400=Hé, la ferraille, fais attention ! J'aimerais pas que tu casses mes affaires... Je sais pas pourquoi un type comme toi est venu ici, mais si tu veux regarder ce que j'ai, tu manipules tout avec précaution, compris ? T'as pas compris ? Tant pis, mais si tu casses quelque chose, tu l'achètes.
actors.mobs.npcs.shopkeeper.talk_prison_princess=Le seul membre survivant de la famille royale naine est un demi-nain, quelle ironie. Je n'ai que faire de vos histoires de vengeance entre nains de la surface. Même si tu as du sang royal, ici, ça ne compte pour rien, à moins que... t'aies beaucoup, beaucoup d'argent.
actors.mobs.npcs.shopkeeper.talk_prison_friar=Ha, je ne m'attendais pas à te voir ici. Comment vont tes yeux ? Tu vois encore ces choses terrifiantes ? Je ne me moque pas de toi, je te plains "sincèrement"... Mais ici, je ne vais pas te faire de prix spécial parce que t'es aveugle ou un génie. Choisis bien ce qu'il te faut pour survivre.
actors.mobs.npcs.shopkeeper.talk_caves=Dépense, et tu vivras plus longtemps.\n\nOh, si tu vois le forgeron ogre, dis-lui bonjour de ma part. Et rappelle à cet abruti qu'il ne m'a pas encore payé le marteau qu'il a acheté la semaine dernière.
actors.mobs.npcs.shopkeeper.talk_city=Mes marchandises te garderont en vie.\n\n...Et s'il te plaît, ne traîne pas ici. J'ai mis longtemps à éloigner les monstres d'ici, alors j'aimerais pas que tu ramènes des problèmes.
actors.mobs.npcs.shopkeeper.talk_halls=Hé, toi là-bas ! Je fais des prix spéciaux pour les chasseurs de démons !\n\nOh, et fais gaffe en bas ! Les démons du fond sont pas là pour faire peur. Si tu meurs, tu pourras plus revenir dépenser !)\n\nEst-ce que ces démons sont comme moi ? Hé hé, non. Je ne suis qu'un petit rôle, pas vraiment un combattant, et j'ai conservé mon libre arbitre. Ceux d'en bas sont bien plus féroces, et ils sont tous asservis par... enfin... bref, fais attention en bas.
actors.mobs.npcs.shopkeeper.talk_ascent=Je veux pas savoir ce que tu comptes faire avec ce talisman. Achète tes affaires et fous le camp, on devrait tous les deux déguerpir.
actors.mobs.npcs.shopkeeper.desc=Ce petit bonhomme trapu serait plus à sa place dans une grande ville qu'ici dans ce donjon. Les prix de ses marchandises expliquent pourquoi il aime faire des affaires ici.

actors.mobs.npcs.wandmaker.name=Vieux fabriquant de baguettes
actors.mobs.npcs.wandmaker.intro_warrior=Oh, bonjour ! C'est une belle surprise de rencontrer un guerrier du Nord dans cet endroit oppressant ! Tu as dû faire beaucoup de chemin pour arriver ici. Si l'aventure t'intéresse assez, j'ai un petit boulot pour toi.
actors.mobs.npcs.wandmaker.intro_rogue=Bon sang, tu m'as fait peur ! Ça fait si longtemps que je suis ici que t'es le premier voleur encore sensé que je vois, tu dois venir de la surface ! Si tu veux aider un étranger comme moi, j'ai une mission qui pourrait t'intéresser.
actors.mobs.npcs.wandmaker.intro_mage=Oh, bonjour %s ! Paraît que t'as causé pas mal d'histoires à l'académie de magie ? Bon, c'est pas grave, j'aime pas trop ces vieux schnocks conservateurs non plus. Si tu veux, j'ai un boulot où tu pourrais donner un coup de main.
actors.mobs.npcs.wandmaker.intro_huntress=Ah, bonjour ma demoiselle ! C'est une telle joie de voir un visage amical ici en bas, tu ne trouves pas ? Tiens, d'ailleurs, je parie que je t'ai déjà vue quelque part, mais je me souviens plus où... oh, tant pis, laisse tomber. Si tu es ici pour l'aventure, j'ai une mission pour toi.
actors.mobs.npcs.wandmaker.intro_duelist=Oh, bonjour mademoiselle ! Quel endroit oppressant, quelle merveilleuse rencontre ! Si ça te dit d'aider un vieux bonhomme, j'ai une petite mission à te confier.
actors.mobs.npcs.wandmaker.intro_cleric=Oh, bonjour Votre Éminence ! Vous rencontrer en un lieu si oppressant est une véritable bénédiction. Je n'ai pas l'intention de vous déranger, mais j'ai une faveur à vous demander.
#fix9：文案更改
actors.mobs.npcs.wandmaker.intro_freeman=Oh, bonjour ! Cher Monsieur, vous avez vraiment une allure distinguée ! Bref... j'ai un problème et je me demandais si vous voudriez bien aider un pauvre vieillard comme moi.
actors.mobs.npcs.wandmaker.intro_slimegirl=Oh, bon sang... Je crois que c'est la première fois que je parle à un monstre dans cet endroit horrible. J'ai failli croire que tu allais me sauter dessus comme les autres. Bref, puisque tu comprends ce que je dis, tu veux bien m'aider ? Je peux pas compter sur d'autres humains sensés ici.
actors.mobs.npcs.wandmaker.intro_ninja=DOMO, ninja SAN, Philis DESU. Comme tu peux le voir, je suis embêté par un problème. Si possible, j'aimerais que tu me donnes un coup de main.
actors.mobs.npcs.wandmaker.intro_dm400=Bon sang, un... "homme" mécanique ! Pour être honnête, j'ai toujours cru que seuls les objets infusés de magie pouvaient avoir une certaine intelligence... Hum, Monsieur le Ferraille, puisque tu comprends ce que je dis, j'espère que tu pourras aider un vieux comme moi.
actors.mobs.npcs.wandmaker.intro_princess=Oh, bonjour Votre Altesse ! Je ne m'attendais pas à vous rencontrer dans un endroit pareil. Grâce à vos soins, j'ai appris pas mal de nouvelles magies des nains... Bref, je suis tombé sur un sacré problème et j'implore votre aide.
actors.mobs.npcs.wandmaker.intro_friar=Oh, c'est toi, le génie de l'alchimie qui est passé dans les magazines. Tu avais l'air si éclatant avant, mais aujourd'hui on dirait que ton esprit a été saccagé par un terrible sorcier mental... Pardon, j'ai été trop bavard. Pour l'instant, j'ai besoin que tu fasses preuve de bonté et que tu m'aides... Tu sais, on est du même bord, je ne te tromperai pas.
actors.mobs.npcs.wandmaker.intro_1=\n\nJe suis ici pour trouver un matériau rare nécessaire à la fabrication d'une baguette, mais je me suis perdu, et mon bouclier magique s'affaiblit. Je dois quitter cet endroit au plus vite, mais je ne veux pas repartir les mains vides.
actors.mobs.npcs.wandmaker.intro_dust=Je cherche de la _poussière de cadavre_. C'est une cendre spéciale maudite qu'on trouve généralement dans des endroits comme celui-ci. Elle devrait être dans une salle fermée près d'ici, je suis sûr que tu pourras en trouver. Mais fais attention, la malédiction sur la poussière est très puissante. _Rapporte-la vite, je purifierai la malédiction._
actors.mobs.npcs.wandmaker.intro_ember=Je cherche des _braises élémentaires_ obtenues d'un élémentaire de feu nouveau-né. Les élémentaires apparaissent généralement lors d'invocations incontrôlées. Pour l'invoquer, il te faudra _quatre bougies_ et un _cercle d'invocation_ — je suis sûr que tu trouveras un tel endroit. Aussi, pendant le combat, tu ne voudras pas _te battre au corps à corps avec lui_ ; tu auras besoin d'objets _avec effet de gel_. L'élémentaire de feu naissant est puissant et sauvage, mais vulnérable au froid.
actors.mobs.npcs.wandmaker.intro_berry=L'ancien directeur de cette prison cultivait un _arbuste corrosif_, et je veux une de ses graines. Maintenant, cette plante a peut-être déjà poussé de façon incontrôlée, donc obtenir ses graines ne sera pas facile. Le jardin où elle se trouve devrait être près d'ici. Si tu veux t'en sortir indemne, _reste loin de ses tentacules_. Brûler l'arbuste serait une bonne idée, mais ne le fais pas : le brûler détruirait aussi ses graines.
actors.mobs.npcs.wandmaker.intro_2=\n\nSi tu peux me l'apporter, je te donnerai en échange une baguette que j'ai fabriquée avec soin ! J'en ai apporté deux, tu pourras choisir celle que tu préfères.
actors.mobs.npcs.wandmaker.reminder_dust=Où t'en es avec la poussière, %s ? Cherche des _obstacles_ pour t'aider.
actors.mobs.npcs.wandmaker.reminder_ember=Où t'en es avec les braises, %s ? Tu as besoin de trouver _quatre bougies_ et un _cercle d'invocation_.
actors.mobs.npcs.wandmaker.reminder_berry=Où t'en es avec la graine, %s ? Elle se trouve dans une _salle remplie de plantes_.
actors.mobs.npcs.wandmaker.def_verb=Paré
actors.mobs.npcs.wandmaker.desc=Ce vieil homme alerte a l'air un peu en détresse. Il est protégé par une barrière magique.



###mobs
actors.mobs.acidic.name=Scorpion acide
actors.mobs.acidic.desc=Ces grands arthropodes démoniaques ne choisissent pas le combat rapproché ; ils préfèrent tirer de loin des piquants dentelés mortels. Celui-ci dégouline même de boue corrodée.

actors.mobs.albino.name=Rat albinos
actors.mobs.albino.desc=C'est une espèce rare de rat au pelage blanc pur et aux dents en forme de scie.
actors.mobs.albino.discover_hint=Vous pouvez découvrir cet ennemi par hasard dans une zone du donjon.

actors.mobs.armoredstatue.name=Statue blindée
actors.mobs.armoredstatue.desc=Vous pensiez que ce n'était qu'une statue de plus dans le donjon, mais ses yeux rouges l'ont trahie.\n\nLa statue est équipée d'une armure de qualité, elle a l'air solide et sera probablement difficile à vaincre.
actors.mobs.armoredstatue.desc_arm_wep=Bien que la statue elle-même soit en pierre, _%1$s_ et _%2$s_ qu'elle porte semblent bien réels.

actors.mobs.bandit.name=Brigand fou
actors.mobs.bandit.desc=Un élite parmi les voleurs, qui se distingue par sa cape violette plus co?teuse. Malgré leur talent pour le vol, ils ne peuvent éviter le même sort que leurs semblables : perdre la raison.\n\nLe brigand fou non seulement vous vole vos biens, mais peut aussi vous aveugler temporairement, vous estropier et vous empoisonner ! Ils sont aussi plus susceptibles d'avoir du butin supplémentaire.

actors.mobs.bat.name=Chauve-souris vampire
actors.mobs.bat.desc=Ces créatures agiles et résistantes des cavernes sont bien plus redoutables qu'elles n'en ont l'air. Elles régénèrent leur vie à chaque attaque réussie, pouvant ainsi vaincre des adversaires bien plus grands qu'elles.

actors.mobs.bee.name=Abeille dorée
actors.mobs.bee.desc_honey=Bien que de petite taille, les abeilles dorées défendent farouchement leur territoire. Cette abeille a été calmée par vous et semble prête à vous suivre.
actors.mobs.bee.desc=Bien que de petite taille, les abeilles dorées défendent farouchement leur territoire. Cette abeille est très agressive ; vous feriez mieux de rester à distance.
actors.mobs.bee.discover_hint=Vous pouvez découvrir cette unité via un objet.

actors.mobs.brute.name=Brute gnoll
actors.mobs.brute.enraged=Enragé
actors.mobs.brute.def_verb=Parade
actors.mobs.brute.desc=La brute est le gnoll le plus grand, le plus fort et le plus résistant. Blessée mortellement, elle devient enragée, obtenant un bouclier temporaire et un énorme bonus de dégats.
actors.mobs.brute$bruterage.name=Fureur du gnoll
actors.mobs.brute$bruterage.desc=Cette brute gnoll est au bord de la mort, mais elle veut vous emmener avec elle !\n\nLe temps et les dégats extérieurs épuisent le bouclier ; une fois le bouclier brisé, la brute meurt. Cependant, soyez prudent : durant cette phase, la brute inflige des dégats énormes.\n\nBouclier restant : %d

actors.mobs.causticslime.name=Slime caustique
actors.mobs.causticslime.desc=Cette slime semble avoir été complètement corrodée par l'énergie sombre s'infiltrant du dessous. Elle a perdu son éclat vert d'origine et laisse constamment tomber de la boue corrodée.
actors.mobs.causticslime.discover_hint=Vous pouvez découvrir cet ennemi par hasard dans une zone du donjon.

actors.mobs.crab.name=Crabe des égouts
actors.mobs.crab.desc=Ces crabes géants sont au sommet de la cha?ne alimentaire des égouts. Ils se déplacent extrêmement vite et leur carapace épaisse peut encaisser de lourds coups.

actors.mobs.crystalguardian.name=Gardien de cristal
actors.mobs.crystalguardian.def_verb=Parade
actors.mobs.crystalguardian.desc=Ce grand gardien de cristal, n'étaient ses yeux luisants, serait presque impossible à distinguer d'une statue. Leur corps est fait de cristal durci, ce qui les rend lents mais extrêmement résistants. Il vaut donc mieux ne pas les déranger dans leur sommeil au sein des grottes de cristal.\n\nEn raison de leur taille massive, les gardiens de cristal se déplacent très lentement dans les espaces étroits. Ils sont aussi si résistants qu'ils ne peuvent être tués définitivement ; vaincus, ils s'effondrent temporairement avant de se reconstituer.
actors.mobs.crystalguardian.discover_hint=Vous pouvez découvrir cet ennemi dans une quête.

actors.mobs.crystalmimic.name=Mime de cristal
actors.mobs.crystalmimic.ate=Le mime de cristal a mangé votre %s !
actors.mobs.crystalmimic.escaped=Le mime de cristal s'est échappé !
actors.mobs.crystalmimic.desc=Le mime est une créature magique capable de changer d'apparence. Dans le donjon, ils apparaissent presque toujours sous forme de coffres, car cela attire mieux les aventuriers imprudents.\n\nLe mime de cristal est plus vicieux que ses cousins : il vole des objets et évite le combat autant que possible. Il s'enfuit rapidement une fois découvert et peut même déplacer ses ennemis par ses attaques.

actors.mobs.crystalspire.name=Flèche de cristal
actors.mobs.crystalspire.warning=Vous sentez les vibrations du cristal que vous frappez. Continuer attirera s?rement des ennuis...
actors.mobs.crystalspire.alert=Les vibrations du cristal s'intensifient, un grondement résonne dans toute la caverne !
actors.mobs.crystalspire.desc=Cette flèche géante est faite de cristal incroyablement dur, probablement la source de toutes les étranges créatures de cristal de la caverne. Les armes normales ne peuvent pas l'endommager ; vous devrez utiliser un pic pour la démolir.\n\n_Avant de vous y attaquer, préparez-vous au combat._ Démolir un bloc de cristal aussi massif prend du temps et il sera difficile de ne pas être dérangé. La flèche elle-même pourrait aussi avoir des mécanismes de défense. _Peut-être que ses attaques peuvent être utilisées contre elle._
actors.mobs.crystalspire.discover_hint=Vous pouvez découvrir cet ennemi dans une quête.

actors.mobs.crystalwisp.name=Feu follet de cristal
actors.mobs.crystalwisp.beam_kill=Vous êtes mort par rayon de lumière...
actors.mobs.crystalwisp.desc=Un petit fragment de cristal durci en colère flotte dans les airs, émettant une lumière vive. Bien qu'il ne soit pas très puissant, il tirera des rayons de lumière pour vous blesser à la moindre occasion.\n\nCe feu follet est assez petit pour survoler facilement les pointes de cristal, mais les rayons qu'il tire, eux, ne le peuvent pas.
actors.mobs.crystalwisp.discover_hint=Vous pouvez découvrir cet ennemi dans une quête.

actors.mobs.demonspawner.name=Autel démoniaque
actors.mobs.demonspawner.on_death=L'énergie démoniaque des lieux semble s'affaiblir avec la destruction de l'autel.
actors.mobs.demonspawner.desc=Cette masse de chair naine palpitante utilise les cadavres de la région pour créer sans cesse des déchireurs démons. Les démons semblent prêts à tout pour vaincre leurs ennemis.\n\nL'autel démoniaque, bien qu'effrayant, n'a ni capacité de déplacement ni moyens d'autodéfense directs. Cependant, sa masse imposante le rend difficile à détruire rapidement, et il accélère la production de déchireurs quand il est menacé.\n\n_L'autel démoniaque semble lié à une source d'énergie démoniaque. Le détruire pourrait affaiblir cette source._

actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=Vous êtes mort par électrocution...
actors.mobs.dm100.desc=Le DM-100 est un modèle précoce de ? machine de défense ? naine, utilisé pour protéger les mineurs nains des niveaux inférieurs. Mais en raison de sa puissance électrique insuffisante, ils ont été envoyés aux villes humaines des niveaux supérieurs. Bien que le directeur de la prison les ait d'abord jugés trop brutaux, après des années d'inactivité, ils finirent par être utilisés dans les prisons. Avec le temps, les prisonniers devenant de plus en plus difficiles à contr?ler, le DM-100 est devenu un équipement essentiel.

actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=Le DM-200 projette un nuage de gaz toxique !
actors.mobs.dm200.desc=Le DM-200 est la deuxième génération de ? machine de défense ? développée par les nains, initialement con?ue pour protéger les mineurs et la cité souterraine. Comparé à la première génération, il est bien plus massif et lourd, et utilise un puissant marteau hydraulique.\n\nSa taille imposante est un inconvénient — il ne peut pas passer par les portes et couloirs étroits. Pour compenser ce manque de mobilité, les nains ont ajouté une fonction : le DM-200 peut cracher du gaz toxique sur les ennemis éloignés ou inaccessibles.

actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=Le DM-201 lance une grenade acide !
actors.mobs.dm201.desc=Les nains ont fait quelques expériences pour pallier le défaut de mobilité du DM-200, créant ainsi une série de machines entièrement fixes. Le DM-201 est un DM-200 modifié servant de tourelle, sans aucune capacité de déplacement. En contrepartie, sa solidité et sa puissance d'attaque ont été considérablement améliorées.\n\nComme le DM-201 n'a pas de moteur pour évacuer les gaz, les nains leur ont équipé des grenades à gaz acide ! Cependant, le DM-201 utilise ses grenades avec prudence, ne les lan?ant que lorsqu'il est attaqué à distance.

actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=D?é?t?e?c?t?i?o?n? ?i?m?m?i?n?e?n?t?e? !
actors.mobs.dm300.shield=Le DM-300 puise l'électricité du réseau et génère un bouclier !
actors.mobs.dm300.charging=A?t?t?a?q?u?e? ?i?m?m?i?n?e?n?t?e? ?!? ?C?h?a?r?g?e? ?e?n? ?c?o?u?r?s?...
actors.mobs.dm300.charging_hint=Le DM-300 est invulnérable lorsqu'il re?oit de l'énergie des pyl?nes !
actors.mobs.dm300.supercharged=D?é?t?r?u?i?r?e? ?!? ?D?é?t?r?u?i?r?e? ?!? ?D?é?t?r?u?i?r?e? ?!?
actors.mobs.dm300.charge_lost=P?e?r?t?e? ?d?e? ?c?h?a?r?g?e? ?!? ?P?a?s?s?a?g?e? ?e?n? ?m?o?d?e? ?a?u?t?o?n?o?m?e? ?!?
actors.mobs.dm300.pylons_destroyed=A?l?e?r?t?e? ?!? ?R?é?s?e?a?u? ?é?l?e?c?t?r?i?q?u?e? ?h?o?r?s? ?s?e?r?v?i?c?e? ?!?
actors.mobs.dm300.rankings_desc=écrasé à mort par le DM-300
actors.mobs.dm300.def_verb=Parade
actors.mobs.dm300.defeated=D?é?t?e?c?t?i?o?n? ?d?e? ?d?o?m?m?a?g?e?s? ?c?r?i?t?i?q?u?e?s? ?!? ?P?a?s?s?a?g?e? ?e?n? ?m?o?d?e? ?r?é?p?a?r?a?t?i?o?n?...
actors.mobs.dm300.desc=Le DM-300 est la plus puissante ? machine de défense ? jamais inventée par les nains. Une machine aussi imposante est très difficile à produire, les nains n'en ont donc construit que quelques-unes pour protéger l'entrée de leur cité souterraine.\n\nIl est équipé d'une bouche d'aération crachant du gaz toxique et d'une foreuse à haute puissance pour attaquer et briser la roche. Le DM-300 peut aussi se connecter au réseau électrique pour décupler sa puissance.
actors.mobs.dm300.desc_supercharged=Le DM-300 est surchargé, fonctionnant à pleine puissance. Sous cette forme, il est invulnérable à tous les dégats et se déplace deux fois plus vite ! De plus, sa foreuse peut désormais _percer les murs_, mais il se déplace alors bien plus lentement.\n\nAttaquer directement le DM-300 surchargé est inutile, mais _il doit y avoir un dispositif dans les environs qui lui fournit de l'énergie_\u3000; le détruire pourrait l'affaiblir.

actors.mobs.dwarfking.name=Roi nain
actors.mobs.dwarfking.notice=Comment oses-tu pénétrer dans l'enceinte royale ! Insolent !
actors.mobs.dwarfking.notice1=L'ancien roi, dans sa sottise, a laissé un reste tel que toi ! Soit, je vais te montrer comment l'ancien roi s'est soumis !
actors.mobs.dwarfking.lifelink_1=Offrez-vous pour votre roi, mes serviteurs !
actors.mobs.dwarfking.lifelink_2=Pour ma grande ?uvre, l'honneur du sacrifice est v?tre !
actors.mobs.dwarfking.teleport_1=Vous autres, emparez-vous de cet individu !
actors.mobs.dwarfking.teleport_2=Vous autres, retenez cet individu !
actors.mobs.dwarfking.wave_1=Assez ! Combattez pour ma renaissance, vous, mes esclaves !
actors.mobs.dwarfking.wave_2=Continuez ! Pour mon royaume, combattez !
actors.mobs.dwarfking.wave_3=Incompétents ! Je vous ordonne de régler cela rapidement !
actors.mobs.dwarfking.enraged=Tu ne t'échapperas pas, %s. Je ? ?r?é?s?i?s?t?e?r?a?i? !
actors.mobs.dwarfking.losing=Non ! Tu ne peux pas... Tu ignores ce qui est enfoui sous mon royaume...
actors.mobs.dwarfking.defeated=Tu vas... tout détruire...
actors.mobs.dwarfking.rankings_desc=Soumis devant le Roi nain
actors.mobs.dwarfking.desc=Il y a bien des années, le plus puissant sorcier du conseil nain découvrit le secret pour dominer la vie et la mort. Rapidement, il utilisa ce pouvoir pour contr?ler et corrompre la cour et tout le conseil, étendant son emprise sur chaque nain du royaume. Il devint le Roi nain, régnant sur une immense armée de morts-vivants.\n\nLe Roi nain est un ennemi extrêmement agressif, qui tentera d'utiliser son armée pour écraser l'intrus.
actors.mobs.dwarfking$dkghoul.rankings_desc=Soumis devant le Roi nain
actors.mobs.dwarfking$dkmonk.rankings_desc=Soumis devant le Roi nain
actors.mobs.dwarfking$dkwarlock.rankings_desc=Soumis devant le Roi nain
actors.mobs.dwarfking$dkgolem.rankings_desc=Soumis devant le Roi nain

actors.mobs.ebonymimic.name=Mime d'ébène
actors.mobs.ebonymimic.reveal=C'est un coffre mimique !
actors.mobs.ebonymimic.hidden_name=Contour suspect
actors.mobs.ebonymimic.hidden_desc=Il y a quelque chose, mais c'est presque complètement transparent.
actors.mobs.ebonymimic.desc=Le mime est une créature magique capable de changer d'apparence. Dans le donjon, ils apparaissent presque toujours sous forme de coffres, car cela attire les aventuriers imprudents.\n\nLe mime d'ébène utilise son pouvoir d'invisibilité pour devenir presque invisible. Ils se cachent sur des objets avec lesquels les aventuriers pourraient interagir, attaquant par surprise. Ils contiennent aussi un butin qui leur est propre. Si vous percez leur camouflage, ils sont comparables à un mime ordinaire. Mais si vous n'y prenez pas garde, leur attaque surprise peut être mortelle.
actors.mobs.ebonymimic.discover_hint=Vous pouvez découvrir cet ennemi via un objet.

actors.mobs.elemental$fireelemental.name=élémentaire de feu
actors.mobs.elemental$fireelemental.desc=Les élémentaires sont des créatures violentes, généralement nées de puissants rituels magiques incontr?lés. Ils sont d'une intelligence très limitée et généralement liés à un élément spécifique.\n\nL'élémentaire de feu est un élémentaire courant qui attaque avec le pouvoir des flammes. Ses attaques de mêlée peuvent enflammer la cible, et il lui arrive de lancer des boules de feu à distance.
actors.mobs.elemental$newbornfireelemental.name=élémentaire de feu naissant
actors.mobs.elemental$newbornfireelemental.charging=L'élémentaire naissant se charge...
actors.mobs.elemental$newbornfireelemental.desc=Les élémentaires sont des créatures violentes, généralement nées de puissants rituels magiques incontr?lés. Ils sont d'une intelligence très limitée et généralement liés à un élément spécifique.\n\nCet élémentaire de feu vient d'être invoqué, mais il est tout aussi dangereux !
actors.mobs.elemental$newbornfireelemental.desc_boss=De par sa nature de créature invoquée violent, cet élémentaire ne peut attaquer qu'après un tour de charge, crachant une vague de flammes imprécise.
actors.mobs.elemental$newbornfireelemental.desc_ally=Comme cet élémentaire a été invoqué par un cristal, il contr?le mieux le feu. Il ne peut pas attaquer à distance, mais peut encore enflammer les ennemis au corps à corps.
actors.mobs.elemental$newbornfireelemental.discover_hint=Vous pouvez découvrir cet ennemi dans une quête.
actors.mobs.elemental$frostelemental.name=élémentaire de givre
actors.mobs.elemental$frostelemental.desc=Les élémentaires sont des créatures violentes, généralement nées de puissants rituels magiques incontr?lés. Ils sont d'une intelligence très limitée et généralement liés à un élément spécifique.\n\nL'élémentaire de givre est un élémentaire courant qui affaiblit les ennemis avec le pouvoir du givre. Ses attaques de mêlée et ses attaques à distance moins fréquentes gèlent les ennemis. Sa puissance de glace est plus efficace sur les ennemis dans l'eau.
actors.mobs.elemental$shockelemental.name=élémentaire de choc
actors.mobs.elemental$shockelemental.desc=Les élémentaires sont des créatures violentes, généralement nées de puissants rituels magiques incontr?lés. Ils sont d'une intelligence très limitée et généralement liés à un élément spécifique.\n\nL'élémentaire de choc est un élémentaire plus rare qui perturbe les ennemis avec l'électricité et les éclairs. Au corps à corps, il libère des arcs électriques autour de lui et peut infliger des dégats supplémentaires aux cibles dans l'eau. Il lui arrive aussi de concentrer son énergie pour aveugler les ennemis éloignés.
actors.mobs.elemental$chaoselemental.name=élémentaire du chaos
actors.mobs.elemental$chaoselemental.desc=Les élémentaires sont des créatures violentes, généralement nées de puissants rituels magiques incontr?lés. Ils sont d'une intelligence très limitée et généralement liés à un élément spécifique.\n\nL'élémentaire du chaos est un élémentaire extrêmement rare. Il n'est pas limité à un élément particulier, mais utilise ses attaques pour déverser sur ses ennemis une magie sauvage et imprévisible.

actors.mobs.eye.name=?il mauvais
actors.mobs.eye.deathgaze_kill=Vous êtes mort par le Regard de la mort...
actors.mobs.eye.desc=L'?il mauvais est une créature flottante imprégnée d'énergie démoniaque. Il a une capacité de mêlée, mais sa véritable technique de mort est cachée dans sa magie.\n\nAprès une brève charge, l'?il mauvais libère un rayon d'énergie destructrice appelé _Regard de la mort_. Tout ce que l'?il regarde subit d'énormes dégats ; tout aventurier avisé esquivera son faisceau.

actors.mobs.fetidrat.name=Rat fétide
actors.mobs.fetidrat.desc=Ce rat est anormal. Son pelage noir huileux et sa peau putréfiée ne ressemblent pas aux rats en bonne santé que vous avez vus. Ses yeux d'un vert pale lui donnent un air mena?ant.\n\nCe rat est entouré d'une odeur nauséabonde, encore plus forte de près.\n\nUne boue noire s'écoule de sa gueule. La boue corrode les briques, mais semble se dissoudre dans l'eau.
actors.mobs.fetidrat.discover_hint=Vous pouvez découvrir cet ennemi dans une quête.

actors.mobs.fungalcore.name=C?ur fongique
actors.mobs.fungalcore.desc=Ce champignon massif est s?rement la source de l'activité fongique anormale dans la caverne.

actors.mobs.fungalsentry.name=Sentinelle fongique
actors.mobs.fungalsentry.desc=Ce grand champignon est un n?ud défensif du réseau mycélien de la caverne.\n\nIl ne peut pas se déplacer, mais crache avec précision un liquide toxique sur toute créature entrant dans son champ de vision. Bien que la force de propulsion du liquide soit faible, _la dose de poison s'accumule rapidement_. Il peut être tué, mais il vaut mieux rester loin.

actors.mobs.fungalspinner.name=Tisseur fongique
actors.mobs.fungalspinner.desc=Cette araignée des mines semble contr?lée par un champignon parasite. Non seulement le champignon a modifié les capacités de son h?te, rempla?ant sa toile et son venin par la croissance fongique.\n\nLe tisseur fongique crache des spores plut?t que des toiles. Les spores propagent non seulement le champignon, mais peuvent aussi vous immobiliser. Bien que cette araignée ne soit pas venimeuse, elle gagne une grande résistance aux dégats à proximité de tout champignon.

actors.mobs.ghoul.name=Trépassé nain
actors.mobs.ghoul.desc=Avec l'effondrement de la société naine et la tyrannie du nouveau roi nain, ceux qui parlaient trop légèrement ou s'opposaient au nouveau roi n'ont pas fait de vieux os. Alors que le nouveau roi ma?trisait de mieux en mieux la magie noire, ces nains durent se soumettre à sa volonté, devenant les pions de son armée.\n\nUn seul trépassé n'est pas très fort au combat, mais ils errent toujours en groupe, et plus ils sont nombreux, plus ils sont difficiles à vaincre. _Tant qu'il reste d'autres de leur espèce à proximité, un trépassé abattu se relève après quelques tours_.

actors.mobs.gnoll.name=éclaireur gnoll
actors.mobs.gnoll.desc=Les gnolls sont des humano?des à l'apparence de hyènes. Ils errent dans les égouts et les donjons, tentant parfois de lancer des attaques vers la surface. L'éclaireur gnoll est le membre le plus ordinaire de leur espèce : ni aussi fort qu'une brute, ni aussi intelligent qu'un shaman.

actors.mobs.gnollexile.name=Exilé gnoll
actors.mobs.gnollexile.desc=Ce gnoll au pelage gris porte une marque visible sur l'épaule, signe de son exil. Les gnolls sont généralement exilés de leur société pour avoir ignoré les règles ou enfreint les lois. La force et l'intelligence sont les clés de la survie d'un exilé, et celui-ci semble manier habilement sa longue lance.
actors.mobs.gnollexile.desc_passive=_L''exilé gnoll n''a actuellement aucune intention d''attaque. _Il ne semble pas aussi belliqueux que les autres gnolls d''ici ; peut-être pense-t-il que se battre avec vous n''est pas rentable. Vous pouvez choisir de l''épargner, mais son paquetage contient peut-être des objets utiles...
actors.mobs.gnollexile.desc_aggro=_L''exilé gnoll regarde autour de lui avec méfiance. _Il semble avoir trouvé une raison de passer à l''attaque. Méfiez-vous de cette longue lance !
actors.mobs.gnollexile.seen_passive=Le gnoll à la lance vous regarde avec méfiance, mais n''a pas l''intention d''attaquer.
actors.mobs.gnollexile.seen_aggro=Le gnoll à la lance se prépare à attaquer.

actors.mobs.gnollgeomancer.name=Géomancien gnoll
actors.mobs.gnollgeomancer.warning=Le géomancien s''éveille, assurez-vous d''être prêt avant de continuer !
actors.mobs.gnollgeomancer.alert=Le géomancien a été réveillé ! La structure de la mine semble se modifier au rythme de ses cris per?ants !
actors.mobs.gnollgeomancer.rock_kill=Vous êtes mort par un rocher volant...
actors.mobs.gnollgeomancer.rockfall_kill=Vous êtes mort par une chute de pierres...
actors.mobs.gnollgeomancer.desc=Ce vieux gnoll à la carrure imposante doit être le chef des gnolls d''ici, ou la source de la magie tellurique des lieux. Contrairement aux ouvriers gnolls, le géomancien ma?trise la magie de la terre et ne peut donc pas être blessé par les chutes de pierres. Cependant, il ne peut probablement pas attaquer directement les ennemis proches.
actors.mobs.gnollgeomancer.desc_armor=Le géomancien est entouré d''une armure de roche. _Vous devez utiliser un pic au corps à corps pour briser l''armure de roche avant de pouvoir endommager le géomancien lui-même._
actors.mobs.gnollgeomancer.desc_armor_sapper=_Un ouvrier gnoll à proximité tient un dispositif qui semble renforcer l''armure de roche du géomancien ; le géomancien est maintenant immunisé contre tous les dégats !_
actors.mobs.gnollgeomancer.desc_sleeping=Ce vieux gnoll massif est entouré de roche, semblable à une statue. Mais en observant bien, on voit que la roche est une armure qui ondule au rythme de sa respiration. Grace à cette protection, il ne peut subir aucun dégat, d''où sa tranquillité à dormir au milieu de ce chaos de pierres.\n\nVotre pic devrait pouvoir briser son armure de roche, mais _ce combat nécessite une préparation suffisante_. Le géomancien doit être le chef des gnolls d''ici, ou la source de la magie tellurique. _Il serait préférable de vaincre les autres gnolls dispersés avant de le défier._
actors.mobs.gnollgeomancer.discover_hint=Vous pouvez découvrir cet ennemi dans une quête.

actors.mobs.gnollguard.name=Garde gnoll
actors.mobs.gnollguard.def_verb=Parade
actors.mobs.gnollguard.spear_warn=Le gnoll porte un coup violent avec sa lance !
actors.mobs.gnollguard.desc=Ce gnoll grand et robuste manie une longue lance et un bouclier, mais ne porte pas de casque. Ces gardes semblent s''entra?ner pour devenir brutes et patrouillent ici pour protéger la mine des bêtes sauvages.\n\nLe garde gnoll est fort et manie sa longue lance d''une seule main, mais pas très habilement. _Il a besoin d''un espace assez dégagé pour effectuer une attaque à longue portée. Une fois qu''on lui colle au corps, sa lance perd beaucoup de son efficacité._
actors.mobs.gnollguard.desc_armor=_Un ouvrier gnoll à proximité tient un dispositif qui semble doter ce garde d''une armure épaisse, réduisant considérablement les dégats qu''il subit._
actors.mobs.gnollguard.discover_hint=Vous pouvez découvrir cet ennemi dans une quête.

actors.mobs.gnollsapper.name=Ouvrier gnoll
actors.mobs.gnollsapper.desc=Ce gnoll est petit, faible mais rusé. Il a un pelage clair et porte une sacoche remplie de petits outils. Ils semblent aider à la prospection et à l''extraction du minerai d''ombre, et sont accompagnés de gardes gnolls. Bien qu''ils puissent combattre au corps à corps, leur puissance d''attaque est pitoyable, pas plus forte que celle d''un éclaireur gnoll.\n\nPlut?t que de se battre directement, l''ouvrier gnoll préfère utiliser ses divers dispositifs pour manipuler la roche environnante et attaquer. Ils ne font que lancer des pierres avec leurs outils, sans ma?triser la magie tellurique. _Il devrait y avoir de nombreuses fa?ons d''utiliser leurs attaques contre eux et les autres gardes._
actors.mobs.gnollsapper.discover_hint=Vous pouvez découvrir cet ennemi dans une quête.

actors.mobs.gnolltrickster.name=Trickster gnoll
actors.mobs.gnolltrickster.desc=Même pour un gnoll, cette créature est étrange. Elle se tient vo?tée, se déplace furtivement, la bouche grande ouverte laissant voir un sourire malveillant, sa sacoche à l''épaule gonflée comme un ballon. Ses pupilles mêlent peur et excitation.\n\nSa sacoche contient une grande quantité de dagues grossièrement forgées, apparemment enduites de diverses substances nocives.
actors.mobs.gnolltrickster.discover_hint=Vous pouvez découvrir cet ennemi dans une quête.

actors.mobs.goldenmimic.name=Mime doré
actors.mobs.goldenmimic.desc=Le mime est une créature magique capable de changer d''apparence. Dans le donjon, ils apparaissent presque toujours sous forme de coffres, car cela attire les aventuriers imprudents.\n\nLe mime doré est un puissant mime qui tente d''attirer les aventuriers les plus aguerris. Il possède un trésor plus riche, mais il est aussi plus fort qu''un mime ordinaire.

actors.mobs.golem.name=Golem
actors.mobs.golem.def_verb=Parade
actors.mobs.golem.desc=Le golem est le produit des nains tentant d''utiliser de nouvelles applications de la magie pour pallier les défauts de longue date de leurs machines. Bien que moins massif que le DM-300, il n''en possède pas moins une puissance destructrice non négligeable.\n\nLe golem est trop grand pour passer par les couloirs, mais les nains lui ont conféré un pouvoir magique pour compenser : le golem peut se téléporter entre les pièces et ramener à lui les ennemis inaccessibles.

actors.mobs.goo.name=Goo
actors.mobs.goo.notice=Gloogloogloogloo !
actors.mobs.goo.defeated=Glou... glou...
actors.mobs.goo.!!!=!!!
actors.mobs.goo.pumpup=Goo palpite sans cesse !
actors.mobs.goo.enraged=Enragé
actors.mobs.goo.gluuurp=Glouuuuglouuuu !
actors.mobs.goo.rankings_desc=Digéré par Goo
actors.mobs.goo.desc=Nous savons peu de choses sur Goo. Il est même possible que ce ne soit pas une créature, mais une entité née de l''agrégation de substances maléfiques à la surface des égouts ayant acquis une intelligence rudimentaire. Quoi qu''il en soit, il est évident que la magie noire a créé cette créature.\n\nSa nature gélatineuse lui a permis d''absorber beaucoup d''énergie noire ; votre simple proximité vous glace le sang. Si Goo utilise cette énergie contre vous, vous ne tiendrez pas longtemps.

actors.mobs.greatcrab.name=Crabe géant
actors.mobs.greatcrab.noticed=Le crabe géant pare l''attaque avec son énorme pince.
actors.mobs.greatcrab.def_verb=Parade
actors.mobs.greatcrab.desc=Ce crabe est le roi incontesté des crabes des égouts. Sa carapace bleue est couverte de fissures et de balanes, témoignant des innombrables années qu''il a traversées. Il se déplace lentement, son énorme pince rendant son équilibre précaire.\n\nBien qu''il n''ait plus qu''une seule pince, sa taille compense amplement ce manque. Le crabe lève sa pince devant lui dès qu''il détecte un danger, utilisant sa carapace incassable pour se défendre. Cependant, le crabe ne peut pas parer les attaques inaper?ues ni parer les assauts de plusieurs ennemis à la fois.
actors.mobs.greatcrab.discover_hint=Vous pouvez découvrir cet ennemi dans une quête.

actors.mobs.guard.name=Garde de prison
actors.mobs.guard.scorpion=Viens ici !
actors.mobs.guard.def_verb=Parade
actors.mobs.guard.desc=Ces gardes étaient autrefois les ge?liers de la prison, mais ils ne valent pas mieux que les prisonniers maintenant. Leur démarche chancelante est semblable à celle des zombies, cherchant sans but des créatures qui n''appartiennent pas à cette zone, comme vous !\n\nIl porte des cha?nes à la taille, qu''il utilisera peut-être pour attirer les ennemis à lui.

actors.mobs.hermitcrab.name=Crabe ermite
actors.mobs.hermitcrab.def_verb=Parade
actors.mobs.hermitcrab.desc=Pour une raison ou une autre, ce crabe des égouts a décidé de porter un vieux seau sur la tête ! Ce poids supplémentaire réduit sa vitesse de déplacement à un niveau normal, mais lui offre plus de défense. Vous avez l''impression d''entendre quelque chose cogner à l''intérieur du seau...

actors.mobs.mimic.name=Mime
actors.mobs.mimic.reveal=C''est un coffre mimique !
actors.mobs.mimic.hidden_hint=Ce coffre a l''air bizarre... l''ouvrir directement ne semble pas prudent.
actors.mobs.mimic.desc=Le mime est une créature capable de changer d''apparence. Dans le donjon, ils apparaissent presque toujours sous forme de coffres, car cela attire les aventuriers imprudents.\n\nLe mime a une puissance d''attaque assez élevée, mais possède généralement aussi un trésor plus important qu''un coffre ordinaire.
actors.mobs.mimic.discover_hint=Vous pouvez découvrir cet ennemi dans n''importe quelle zone du donjon.

actors.mobs.necromancer.name=Nécromancien
actors.mobs.necromancer.desc=Ces apprentis de la magie noire affluent en masse dans la prison, car c''est le lieu idéal pour pratiquer la nécromancie.\n\nLe nécromancien invoque et renforce des squelettes pour combattre. Lorsque le nécromancien est tué, les squelettes qu''il a invoqués se dissipent.
actors.mobs.necromancer$necroskeleton.name=Squelette du nécromancien
actors.mobs.necromancer$necroskeleton.desc=Ce squelette a été invoqué par le nécromancien. Ses capacités et son comportement sont identiques à ceux d''un squelette ordinaire ; il dispara?t simplement lorsque son invocateur est tué.

actors.mobs.mob.died=Vous entendez au loin quelque chose mourir.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Tué par %s
actors.mobs.mob.discover_hint=Vous pouvez découvrir cet ennemi dans une zone du donjon.

actors.mobs.monk.name=Moine nain
actors.mobs.monk.def_verb=Parade
actors.mobs.monk.parried=Paré
actors.mobs.monk.desc=Ces moines sont tous des fidèles fanatiques, donnant tout pour protéger le roi des étrangers. Leur ferveur leur a fait offrir leur volonté au roi, ne laissant que leur coquille vide errer dans la cité.\n\nLe moine nain ne porte ni armure ni arme, comptant uniquement sur son art martial à mains nues pour repousser l''ennemi. Un moine concentré parera à coup s?r la prochaine attaque physique, même inévitable. Les moines se concentrent plus rapidement en se dépla?ant, et plus lentement en combat.
actors.mobs.monk$focus.name=Concentration
actors.mobs.monk$focus.desc=Ce moine est complètement concentré sur les mouvements de sa cible, semblant anticiper sa prochaine action.\n\nUn personnage concentré parera à coup s?r la prochaine attaque physique, même inévitable. Parer une attaque consomme la concentration du moine, qui devra se reconcentrer pour parer la prochaine attaque. Le moine se concentre plus rapidement en se dépla?ant.

actors.mobs.phantompiranha.name=Piranha fant?me
actors.mobs.phantompiranha.teleport_away=Le piranha fant?me s''est téléporté...
actors.mobs.phantompiranha.desc=Le piranha fant?me est une variante rare du piranha géant, doté d''un corps étrangement translucide et de pouvoirs magiques. Il peut se téléporter lorsqu''il est attaqué, une capacité qui lui permet d''attaquer ou de fuir !\n\nBien que difficile à vaincre, sa chair est prisée pour ses propriétés magiques.

actors.mobs.piranha.name=Piranha géant
actors.mobs.piranha.desc=Ces poissons carnivores ont été spécialement élevés pour protéger les réserves inondées. Leurs morsures sont mortelles ; mieux vaut éviter de les affronter directement.
actors.mobs.piranha.discover_hint=Vous pouvez découvrir cet ennemi dans n''importe quelle zone du donjon.

actors.mobs.pylon.name=Pyl?ne énergétique
actors.mobs.pylon.desc_inactive=C''est un pyl?ne utilisé pour distribuer l''électricité aux machines de la zone.\n\nCe pyl?ne n''est pas activé et ne peut subir aucun dégat pour le moment.
actors.mobs.pylon.desc_active=C''est un pyl?ne utilisé pour distribuer l''électricité aux machines de la zone. Il est actuellement chargé d''énergie électrique, ce qui signifie qu''il soutient le DM-300 en surcharge !\n\nLe pyl?ne peut maintenant être détruit, mais il libérera des arcs électriques dans toutes les directions. Sa structure métallique épaisse le rend difficile à détruire rapidement.

actors.mobs.rat.name=Rat
actors.mobs.rat.desc=Bien qu''agressifs, les rats restent les créatures les plus faibles des égouts. Leurs morsures sont aga?antes, mais elles ne deviennent dangereuses qu''en très grand nombre.

actors.mobs.ripperdemon.name=Déchireur démon
actors.mobs.ripperdemon.leap=Le déchireur démon s''apprête à bondir !
actors.mobs.ripperdemon.desc=Cette créature terrifiante est formée par les démons à partir des nombreux cadavres nains des lieux. Le déchireur démon ressemble à un trépassé nain chétif, mais ses griffes osseuses sont exceptionnellement acérées.\n\nLe déchireur démon n''est pas très résistant, mais il reste rapide et mortel. Il peut fondre sur vous de loin et infliger des blessures saignantes avec ses griffes.

actors.mobs.rotheart.name=C?ur de pourriture
actors.mobs.rotheart.desc=Les fruits de la pourriture sont particuliers. Les fruits normaux pourrissent et se décomposent, mais les fruits de la pourriture durcissent et emprisonnent les graines. Le fruit sert de protection à l''organe qu''il contient. Cette énorme sphère est considérée comme le c?ur d''un plant de pourriture mature.
actors.mobs.rotheart.discover_hint=Vous pouvez découvrir cet ennemi dans une quête.

actors.mobs.rotlasher.name=Lacert de pourriture
actors.mobs.rotlasher.desc=Le lacert de pourriture fait partie du système racinaire d''un plant de pourriture mature, et constitue son principal moyen d''autodéfense. Le lacert n''a pas de vision et est fixé dans le sol, incapable de se déplacer. Mais lorsqu''une menace appara?t, il lui suffit d''un instant pour la percevoir et lancer une attaque violente. En l''absence d''ennemis, il reste immobile, tentant de se fondre dans la végétation environnante.
actors.mobs.rotlasher.discover_hint=Vous pouvez découvrir cet ennemi dans une quête.

actors.mobs.scorpio.name=Scorpion
actors.mobs.scorpio.desc=Ces grands arthropodes démoniaques ne choisissent pas le combat rapproché ; ils préfèrent tirer de loin des piquants dentelés mortels.

actors.mobs.senior.name=Ma?tre moine
actors.mobs.senior.desc=Ces moines sont tous des fidèles fanatiques, donnant tout pour protéger le roi des étrangers. Leur ferveur leur a fait offrir leur volonté au roi, ne laissant que leur coquille vide errer dans la cité.\n\nCe moine ma?trise un art martial profond. Comparé à un moine ordinaire, il se concentre plus rapidement en se dépla?ant. Un moine concentré parera à coup s?r la prochaine attaque physique, même inévitable. Les moines se concentrent plus rapidement en se dépla?ant, et plus lentement en combat.

actors.mobs.shaman.name=Shaman gnoll
actors.mobs.shaman.bolt_kill=Vous êtes mort par un rayon magique...
actors.mobs.shaman.desc=Les shamans gnolls sont plus sages que la plupart des gnolls ; ils utilisent la magie de combat pour compenser leur manque de force. Bien que leur force soit relativement faible, ils occupent une place importante dans la tribu.
actors.mobs.shaman$redshaman.spell_desc=Le shaman au masque rouge utilise la magie pour _affaiblir votre puissance d''attaque_.
actors.mobs.shaman$blueshaman.spell_desc=Le shaman au masque bleu utilise la magie pour _augmenter les dégats que vous subissez_.
actors.mobs.shaman$purpleshaman.spell_desc=Le shaman au masque violet utilise la magie pour _réduire votre précision et votre esquive_.

actors.mobs.armoredbrute.name=Brute blindée
actors.mobs.armoredbrute.desc=Ces brutes gnolls d''élite portent généralement une armure puissante pour montrer leur statut. L''armure double leur défense physique, et leur volonté de fer augmente considérablement la durée de leur rage à l''article de la mort.

actors.mobs.skeleton.name=Squelette
actors.mobs.skeleton.explo_kill=Vous êtes mort par un éclat d''os...
actors.mobs.skeleton.def_verb=Parade
actors.mobs.skeleton.desc=Les squelettes sont les cadavres d''aventuriers déchus et d''anciens habitants de la prison, ranimés par l''influence maléfique des profondeurs du donjon. Lorsque le squelette est détruit, ses os explosent en éclats. Les éclats d''os blessent tous les personnages à proximité, et une armure peut considérablement réduire ces dégats.

actors.mobs.slime.name=Slime
actors.mobs.slime.def_verb=Parade
actors.mobs.slime.desc=La slime est une étrange créature magique à l''apparence gélatineuse et au noyau liquide. Les égouts de la ville leur fournissent suffisamment d''eau et de nutriments.\n\nLa membrane extérieure de la slime est extrêmement élastique, ce qui rend toute attaque unique incapable de leur infliger plus de _6 points de dégats_.

actors.mobs.snake.name=Serpent des égouts
actors.mobs.snake.hint=Essayez d''utiliser le bouton d''examen sur le serpent pour apprendre à le vaincre.
actors.mobs.snake.desc=Ces grands serpents peuvent esquiver les attaques en glissant rapidement, ce qui les rend difficiles à toucher. Cependant, les attaques sournoises et magiques peuvent les prendre au dépourvu.\n\nAttaquer le serpent hors de son champ de vision constitue une attaque sournoise. Une fa?on d''y parvenir est de se cacher derrière une porte pendant qu''il vous poursuit, puis _d''attaquer au moment où il franchit la porte_.

actors.mobs.spectralnecromancer.name=Nécromancien spectral
actors.mobs.spectralnecromancer.desc=Les nécromanciens sont généralement obsédés par l''invocation de squelettes, mais certains préfèrent invoquer des créatures plus éthérées et intangibles. Les nécromanciens spectraux ont choisi les esprits vengeurs comme leurs griffes !\n\nUn esprit vengeur individuel n''est peut-être pas aussi fort qu''un squelette, mais ces nécromanciens spectraux ne sont jamais rassasiés du nombre de serviteurs qu''ils invoquent !

actors.mobs.spinner.name=Araignée des mines
actors.mobs.spinner.desc=Cette araignée des mines à la fourrure verte essaie d''éviter le combat direct. Elle préfère rester à distance, attendant que sa proie empêtrée dans sa toile meure lentement de son venin mortel. Elle peut aussi cracher sa toile à distance pour bloquer le passage de ses ennemis.

actors.mobs.statue.name=Statue animée
actors.mobs.statue.def_verb=Parade
actors.mobs.statue.desc=Vous pensiez que ce n''était qu''une statue de plus dans le donjon, mais ses yeux rouges l''ont trahie.
actors.mobs.statue.desc_weapon=Bien que la statue elle-même soit en pierre, _%s_ qu''elle porte semble bien réel.
actors.mobs.statue.discover_hint=Vous pouvez découvrir cet ennemi dans n''importe quelle zone du donjon.

levels.minigame.extraction.mobs.vaultarmoredstatue.name=Garde de fer du coffre
levels.minigame.extraction.mobs.vaultarmoredstatue.desc=Ce garde blindé a été créé pour protéger le coffre scellé. Contrairement aux statues ordinaires qui dorment, il est déjà réveillé au début de l''extraction et cherche activement les intrus.
levels.minigame.extraction.mobs.vaultarmoredstatue.desc_arm_wep=Le garde de fer tient une _%1$s_ et porte une _%2$s_.

levels.minigame.extraction.mobs.veilbreakereye.name=?il brise-voile
levels.minigame.extraction.mobs.veilbreakereye.desc=Cet ?il peut détecter les perturbations subtiles laissées par les personnages invisibles. Lorsqu''un héros invisible se trouve dans son champ de vision, il tente chaque tour de déchirer le voile d''invisibilité ; plus la distance est proche, plus la probabilité de dévoilement est élevée.
levels.minigame.extraction.mobs.veilbreakereye.reveal=L''?il brise-voile vous a verrouillé, le voile qui vous cachait est déchiré !

levels.minigame.extraction.mobs.chronosuccubus.name=Sucube du temps
levels.minigame.extraction.mobs.chronosuccubus.desc=Cette succube se nourrit non seulement d''émotions, mais aussi du temps volé. Lorsque vous agissez sous l''effet d''un arrêt du temps dans son champ de vision, elle peut briser immédiatement l''arrêt du temps ; moins il reste de tours, plus la probabilité de succès est élevée.
levels.minigame.extraction.mobs.chronosuccubus.break_time=La succube du temps a volé votre dernier moment figé !

levels.minigame.extraction.mobs.deferredscorpio.name=Scorpion à retardement
levels.minigame.extraction.mobs.deferredscorpio.desc=Les dards de ce scorpion magique infligent des blessures différées qui frappent immédiatement, et il est extrêmement difficile pour la victime d''en identifier la source.

levels.minigame.extraction.mobs.raidkeycarrier.name=Porteur de clé de cristal
levels.minigame.extraction.mobs.raidkeycarrier.desc=Cet ennemi porte une clé de cristal nécessaire à l''extraction. Vainquez-le pour récupérer la clé.

actors.mobs.succubus.name=Succube
actors.mobs.succubus.desc=La succube est un démetamorphe expert dans la manipulation des esprits. Celle-ci a pris l''apparence pale d''un elfe noir, peut-être pour attirer les mages nains.\n\nEn attaquant, la succube peut charmer temporairement sa cible, l''empêchant d''attaquer directement la succube. La succube peut drainer l''essence vitale de sa cible charmée en l''attaquant.

actors.mobs.swarm.name=Essaim de mouches
actors.mobs.swarm.desc=L''essaim de mouches mortelles bourdonne furieusement. Chaque attaque non magique le divise en deux essaims plus petits mais tout aussi dangereux.

actors.mobs.tengu.name=Tengu
actors.mobs.tengu.notice_gotcha=Je t''ai eu, %s !
actors.mobs.tengu.interesting=Il est temps de rendre ce combat plus intéressant...
actors.mobs.tengu.notice_have=Ta vie m''appartient, %s !
actors.mobs.tengu.defeated=Enfin... libéré...
actors.mobs.tengu.rankings_desc=Assassiné par Tengu
actors.mobs.tengu.desc=Un assassin légendaire, dont le nom vient du masque qui lui colle au visage.\n\nTengu porte des cha?nes aux poignets et sous les genoux, mais il semble s''être libéré de leurs entraves depuis longtemps.\n\nIl utilisera des pièges, une magie trompeuse et des attaques précises et mortelles pour éliminer la seule personne qui peut l''empêcher de s''échapper : vous.

actors.mobs.tengu$bombability$bombblob.desc=Une fumée br?lante roule ici. Attention, ?a va exploser !
actors.mobs.tengu$bombability$bombitem.name=Bombe fumigène
actors.mobs.tengu$bombability$bombitem.cant_pickup=Elle est scellée au sol, vous ne pouvez pas la déplacer.
actors.mobs.tengu$bombability$bombitem.desc=Tengu a lancé une bombe de forme étrange qui dégage une fumée épaisse et br?lante. Elle crépite, semblant sur le point d''exploser !\n\nLa bombe est enfoncée dans le sol, vous ne pouvez pas la ramasser.

actors.mobs.tengu$fireability$fireblob.desc=Tengu a dispersé une poudre fine qui commence à fumer, ?a va prendre feu !

actors.mobs.tengu$shockerability$shockerblob.desc=De l''électricité s''accumule ici ; toute unité qui s''y tient sera électrocutée au prochain tour.
actors.mobs.tengu$shockerability$shockeritem.name=Dispositif de choc
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=Le courant est trop fort, vous ne pouvez pas le toucher !
actors.mobs.tengu$shockerability$shockeritem.desc=Tengu a lancé un dispositif bizarre, apparemment fabriqué à partir de pièces de DM-100. Le dispositif émet continuellement des arcs électriques autour de lui, mais la zone semble suivre un schéma régulier.\n\nAvec des arcs à haute tension aussi denses autour, vous ne pouvez pas le ramasser.

actors.mobs.thief.name=Voleur fou
actors.mobs.thief.stole=Le voleur a volé votre %s !
actors.mobs.thief.carries=\n\nCe voleur porte un _%s_. Volé, de toute évidence.
actors.mobs.thief.escapes=Le voleur s''est enfui avec votre %s !
actors.mobs.thief.desc=Ces prisonniers se sont échappés de leur cellule, mais pas de cette prison. Avec le temps, la prison a détruit ce qu''il leur restait d''esprit et leur soif de liberté. Ces voleurs et brigands ont depuis longtemps oublié qui ils sont et pourquoi ils volent.\n\nCes ennemis préfèrent voler vos biens et s''enfuir plut?t que d''affronter le combat. Gardez-les à l''?il, sinon vous ne reverrez peut-être jamais vos biens volés.

actors.mobs.tormentedspirit.name=Esprit maudit
actors.mobs.tormentedspirit.desc=Les esprits maudits sont des ames bienveillantes tourmentées par une malédiction. Tant que la malédiction persiste, ils vous attaquent comme des esprits vengeurs plus puissants.\n\nPeut-être pouvez-vous utiliser un parchemin d''exorcisme à proximité pour purifier la malédiction de l''esprit. Si la malédiction est purifiée, ils vous récompenseront...
actors.mobs.tormentedspirit.thank_you=Merci...

actors.mobs.warlock.name=Sorcier nain
actors.mobs.warlock.bolt_kill=Vous êtes mort par un rayon d''ombre...
actors.mobs.warlock.desc=Quand l''intérêt des nains passa de l''ingénierie à l''occulte, les sorciers prirent progressivement le pouvoir dans la cité. Ils commencèrent par la magie élémentaire, mais se tournèrent rapidement vers la démonologie et la nécromancie. Le plus puissant des sorciers s''empara du tr?ne du royaume nain ; les autres sorciers, pour continuer à pratiquer la magie noire, durent abandonner leur liberté d''esprit et lui soumettre leur volonté.\n\nCes sorciers possèdent de puissantes magies perturbatrices, capables de supprimer temporairement la magie d''amélioration des équipements. Plus l''équipement est de haut niveau, plus l''effet de la magie de réduction est sévère.

actors.mobs.wraith.name=Esprit vengeur
actors.mobs.wraith.desc=Les esprits vengeurs sont les ames de criminels des tombeaux assoiffés de vengeance. En tant qu''entités intangibles flottantes, ils sont difficiles à toucher avec des armes normales.
actors.mobs.wraith.discover_hint=Vous pouvez découvrir cet ennemi dans n''importe quelle zone du donjon.

actors.mobs.yogdzewa.name=Yog-Dzewa
actors.mobs.yogdzewa.notice=Je ? t? ? v?o?i?s? ?
actors.mobs.yogdzewa.notice1=Ne ? c?h?e?r?c?h?e? ?p?a?s? ?à? ?t?e? ?c?a?c?h?e?r?
actors.mobs.yogdzewa.darkness=Les ténèbres approchent...
actors.mobs.yogdzewa.hope=L?e? ?d?e?s?t?i?n? ?d?e?s? ?a?v?e?n?t?u?r?i?e?r?s? ?e?s?t? ?l?e? ?c?h?a?o?s?
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.rankings_desc=Avalé par Yog-Dzewa
actors.mobs.yogdzewa.desc=Yog-Dzewa est un dieu ancien ; une monstruosité colossale qui étend sa puissance vers les mondes mortels et les dévore pour alimenter sa croissance infinie. Les nains ont d? attirer l''attention de cette horreur cosmique en jouant avec la magie noire, et depuis, ils tentent de contr?ler ce dieu pour l''empêcher de consumer le monde extérieur.\n\nCette divinité ancienne provient d''une dimension primitive, emplie de magie et de chaos, et ne peut amener sa véritable forme dans ce monde. Ainsi, elle a créé des avatars et invoqué des démons comme serviteurs pour accomplir ses ordres.\n\nCe grand ?il est le point focal du pouvoir du dieu ancien dans ce monde. Bien que l''?il lui-même soit immobile, il peut tirer de puissants rayons magiques et invoquer diverses créatures démoniaques à son aide.
actors.mobs.yogdzewa.desc_spawners=Vous sentez l''énergie démoniaque affluer des étages supérieurs vers l''?il du dieu ancien. Quelque chose que vous avez laissé vivant au-dessus fournit de l''énergie au dieu ancien. _Le dieu ancien utilisera cette énergie pour invoquer des serviteurs plus puissants !_
actors.mobs.yogdzewa$larva.name=Larve du dieu ancien
actors.mobs.yogdzewa$larva.rankings_desc=Avalé par Yog-Dzewa
actors.mobs.yogdzewa$larva.desc=Ces petites créatures du dieu ancien sont des êtres rudimentaires faciles à produire. Bien qu''une seule larve soit très fragile, elles peuvent être produites rapidement et deviennent difficiles à contenir une fois en grand nombre.
actors.mobs.yogdzewa$yogripper.rankings_desc=Avalé par Yog-Dzewa
actors.mobs.yogdzewa$yogeye.rankings_desc=Avalé par Yog-Dzewa
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Avalé par Yog-Dzewa

actors.mobs.yogfist.invuln_warn=Le poing est invulnérable lorsqu''il est près de l''?il du dieu ancien !
actors.mobs.yogfist.rankings_desc=Avalé par Yog-Dzewa
actors.mobs.yogfist.desc=Ce poing est une manifestation partielle du pouvoir du dieu ancien. Ces poings sont liés à la puissance du dieu ancien, et deviennent invulnérables à tous les dégats lorsqu''ils s''approchent de l''?il.
actors.mobs.yogfist$burningfist.name=Poing br?lant
actors.mobs.yogfist$burningfist.desc=Le poing br?lant est formé par la magie ardente du chaos. Il enflamme constamment l''environnement en se dépla?ant. Il peut aussi tirer de l''énergie de feu pour former un impact magique, plongeant la cible dans un brasier ardent.\n\nLa capacité du poing br?lant à enflammer l''environnement est supprimée près de l''eau, mais sa chaleur est si intense que l''eau s''évapore rapidement.
actors.mobs.yogfist$soiledfist.name=Poing de terre
actors.mobs.yogfist$soiledfist.desc=Le poing de terre est formé par la magie chaotique de la terre. En se dépla?ant, il fait constamment pousser de la végétation autour de lui. Il peut aussi tirer un impact de terre précis, emprisonnant sa cible entre des lianes et racines à croissance rapide.\n\nLe poing de terre peut puiser de la force dans la vie végétale, et encaisser les dégats en fonction de la quantité de végétation autour de lui.
actors.mobs.yogfist$rottingfist.name=Poing putride
actors.mobs.yogfist$rottingfist.desc=Le poing putride est formé d''une masse de chair putride vivante. C''est une masse de chair en putréfaction haute comme une tour, capable de projeter de la boue corrodée au corps à corps et de cracher du gaz toxique à distance. Pire encore, sa masse énorme fait qu''il n''entre qu''en état de saignement lorsqu''il est attaqué, sans subir de dégats directs.\n\nLa boue corrodée peut être lavée par l''eau, mais le poing putride peut aussi absorber l''eau pour se soigner ! De plus, infliger des dégats au poing putride alors qu''il saigne ne fait que renouveler son état de saignement sans aggraver l''effet.
actors.mobs.yogfist$rustedfist.name=Poing rouillé
actors.mobs.yogfist$rustedfist.desc=Le poing rouillé est formé d''un métal vivant. C''est un bloc de métal vivant haut comme une tour, doté d''une puissante capacité de mêlée et capable d''estropier ses cibles à distance. En raison de sa masse énorme, les dégats subis par le poing rouillé sont retardés plut?t qu''immédiats.\n\nCependant, son manque de souplesse l''empêche de passer par les passages étroits. De plus, bien que le poing rouillé ne subisse les dégats que lentement, les dégats retardés continuent de s''accumuler lors d''attaques multiples.
actors.mobs.yogfist$brightfist.name=Poing radieux
actors.mobs.yogfist$brightfist.teleport=Le poing radieux s''est téléporté dans un éclair aveuglant !
actors.mobs.yogfist$brightfist.desc=Le poing radieux est formé d''énergie lumineuse pure. Il peut tirer un puissant rayon aveuglant à chaque tour ! Ces rayons infligent d''énormes dégats et vous aveuglent temporairement. Pour s''échapper, le poing radieux peut émettre un éclair aveuglant couvrant toute la zone !\n\nLe poing radieux n''a pas de capacité spéciale au corps à corps.
actors.mobs.yogfist$darkfist.name=Poing d''ombre
actors.mobs.yogfist$darkfist.teleport=Le poing d''ombre s''est téléporté dans une noirceur qui éteint vos lumières !
actors.mobs.yogfist$darkfist.desc=Le poing d''ombre est formé d''énergie ténébreuse pure. Il peut tirer de puissants sorts d''ombre à chaque tour ! Ces sorts infligent d''énormes dégats et affaiblissent votre source de lumière. Pour s''échapper, le poing d''ombre peut plonger toute la zone dans l''obscurité !\n\nLe poing d''ombre n''a pas de capacité spéciale au corps à corps.


actors.char.kill=%s vous a tué...
actors.char.defeat=Vous avez vaincu %s.
actors.char.def_verb=Esquive
actors.char.invulnerable=Invulnérable
actors.char.immune=Immunisé

#新增天赋


actors.hero.talent.aquatic_recover.title=Récupération aquatique
actors.hero.talent.aquatic_recover.desc=_+1 :\nRécupère _1 point de vie_ toutes les _10 tours_ dans l''eau.\n\n_+2 :\nRécupère _1 point de vie_ toutes les _5 tours_ dans l''eau.
actors.hero.talent.aquatic_recover.comment=Si le héros n''a pas monté de niveau depuis longtemps, ce talent cessera progressivement de soigner.

actors.hero.talent.pump_attack.title=Attaque chargée
actors.hero.talent.pump_attack.desc=_+1 :\nLes attaques de mêlée ont _20% de chance_ d''infliger _2x les dégats_.\n\n_+2 :\nLes attaques de mêlée ont _20% de chance_ d''infliger _3x les dégats_.
actors.hero.talent.pump_attack.comment=
actors.hero.talent.pump_attack.glog=Cette attaque a accumulé une grande force, infligeant des dégats multiples.

actors.hero.talent.ooze_attack.title=Adsorption de boue
actors.hero.talent.ooze_attack.desc=_+1 :\nLes attaques de mêlée ont _50% de chance_ d''infliger _15 tours de boue_ et _10 dégats retardés_.\n\n_+2 :\nLes attaques de mêlée ont _75% de chance_ d''infliger _15 tours de boue_ et _10 dégats retardés_.
actors.hero.talent.ooze_attack.comment=

actors.hero.talent.surprise_throw.title=Lancer surprise
actors.hero.talent.surprise_throw.desc=Après amélioration, toutes les armes de jet gagnent la propriété d''épée de main (lancer après déplacement ne consomme pas de tour) et leurs dégats sont augmentés, mais la _précision est réduite de 50%_.\n\n_+1 :\n_Dégats des armes de jet augmentés de 20%_.\n\n_+2 :\n_Dégats des armes de jet augmentés de 40%_.
actors.hero.talent.surprise_throw.comment=Ce talent ne s''active que lorsque vous visez une cible ; les arcs spirituels et autres armes de jet spéciales bénéficient aussi de l''effet d''épée de main mais sans augmentation des dégats.\n\n? En gros, ?a renforce la force du poignet en utilisant le recul du lancer pour se déplacer. ?


actors.hero.talent.smoke_mask.title=Voile de fumée
actors.hero.talent.smoke_mask.desc=_+1 :\nObtient une capacité spéciale pour libérer un _nuage de fumée_ de _100 unités_ centré sur vous.\n\n_+2 :\nObtient une capacité spéciale pour libérer un _nuage de fumée_ de _150 unités_ centré sur vous.
actors.hero.talent.smoke_mask.comment=La capacité spéciale obtenue a _5 tours de recharge_.
actors.hero.talent$smokecooldown.name=Voile de fumée - Recharge
actors.hero.talent$smokecooldown.desc=Vous venez d''utiliser cette capacité, vous devez attendre avant de pouvoir l''utiliser à nouveau.\n\nRecharge restante : %s tours
actors.hero.talent$smokemask.name=Voile de fumée
actors.hero.talent$smokemask.desc=C''est une technique de ninja que Tengu a apprise au village ninja ; on ne sait pas pourquoi il n''a pas pu l''utiliser pendant votre combat. Peut-être que la corruption par la magie noire lui a fait oublier la plupart de ses techniques ninja, et vous devriez vous en réjouir.\n\nVous pouvez libérer un voile de fumée pour vous protéger, vous et vos alliés, sans consommer de tour.
actors.hero.talent$smokemask.action_name=Voile de fumée

actors.hero.talent.rush.title=Course rapide
actors.hero.talent.rush.desc=_+1 :\n_Vitesse de déplacement augmentée de 50%_.\n\n_+2 :\n_Vitesse de déplacement augmentée de 75%.
actors.hero.talent.rush.comment=

actors.hero.talent.overload_charge.title=Surcharge
actors.hero.talent.overload_charge.desc=_+1 :\nPendant l''effet de charge d''un baton ou d''un artefact, la _vitesse de déplacement_ du héros augmente de _50%_ et les _dégats de mêlée augmentent de 30%_.\n\n_+2 :\nPendant l''effet de charge d''un baton ou d''un artefact, la _vitesse de déplacement_ du héros augmente de _75%_ et les _dégats de mêlée augmentent de 50%.
actors.hero.talent.overload_charge.comment=? Attention ! Attention ! ?

actors.hero.talent.gas_spurt.title=Jet de gaz
actors.hero.talent.gas_spurt.desc=_+1 :\nLancer un sort avec un baton ou une baguette projette une petite quantité de _gaz toxique_ sur la cible.\n\n_+2 :\nLancer un sort avec un baton ou une baguette projette une petite quantité de _gaz acide_ sur la cible.
actors.hero.talent.gas_spurt.comment=Ce talent a _5 tours de recharge_.\n\n? Cette capacité magique provient principalement des recherches des explorateurs des mines naines sur les machines naines incontr?lées. ?
actors.hero.talent$gascooldown.name=Jet de gaz - Recharge
actors.hero.talent$gascooldown.desc=Vous venez d''utiliser ce talent, vous devez attendre avant de pouvoir l''utiliser à nouveau.\n\nRecharge restante : %s tours

actors.hero.talent.king_protect.title=Protection royale
actors.hero.talent.king_protect.desc=_+1 :\nQuand vous subissez des dégats, _75% de chance_ de les convertir en _dégats retardés_.\n\n_+2 :\nQuand vous subissez des dégats, ceux-ci sont _obligatoirement_ convertis en _dégats retardés_.
actors.hero.talent.king_protect.comment=

actors.hero.talent.summon_follower.title=Invocation royale
actors.hero.talent.summon_follower.desc=_+1 :\nEn utilisant une compétence d''armure, _invoque 1 sorcier ou moine nain_ pour combattre à vos c?tés.\n\n_+2 :\nEn utilisant une compétence d''armure, _invoque 2 sorciers ou moines nains_ pour combattre à vos c?tés.
actors.hero.talent.summon_follower.comment=

actors.hero.talent.wolfish_gaze.title=Regard de loup
actors.hero.talent.wolfish_gaze.desc=_+1 :\nLa précision augmente à _4 fois_ la valeur de base.\n\n_+2 :\nLes attaques _touchent à coup s?r_.
actors.hero.talent.wolfish_gaze.comment=

actors.hero.talent.fasting.title=Régime électronique
actors.hero.talent.fasting.desc=_+1 :\nQuand la vie est pleine, toute action consomme _1_ de satiété en moins.\n\n_+2 :\nQuand la vie est au dessus de _50%_, toute action consomme _1_ de satiété en moins.
actors.hero.talent.fasting.comment=

actors.hero.talent.strong_attack.title=Attaque puissante
actors.hero.talent.strong_attack.desc=_+1 :\nLes attaques de mêlée infligent _3 tours de vulnérabilité_.\n\n_+2 :\nLes attaques de mêlée infligent _5 tours de vulnérabilité_.
actors.hero.talent.strong_attack.comment=Ce talent a _5 tours de recharge_.\n\n? Le premier talent de la mutation a brisé le monopole des shamans gnolls sur la vulnérabilité. ?
actors.hero.talent$stratkcooldown.name=Attaque puissante - Recharge
actors.hero.talent$stratkcooldown.desc=Vous venez d''utiliser ce talent, vous devez attendre avant de pouvoir l''utiliser à nouveau.\n\nRecharge restante : %s tours

actors.hero.talent.survival_volition.title=Volonté de survie
actors.hero.talent.survival_volition.desc=_+1 :\nQuand la vie est en dessous de _50%_, être touché donne _50% de résistance aux dégats, vitesse extrême et purification totale pendant 3 tours_.\n\n_+2 :\nQuand la vie est en dessous de _50%_, être touché donne _50% de résistance aux dégats, vitesse extrême et purification totale pendant 5 tours_.
actors.hero.talent.survival_volition.comment=Ce talent a _10 tours de recharge_.\n\n? Héhé, je vais survivre co?te que co?te. ?
actors.hero.talent$survolcooldown.name=Volonté de survie - Recharge
actors.hero.talent$survolcooldown.desc=Vous venez d''utiliser ce talent, vous devez attendre avant de pouvoir l''utiliser à nouveau.\n\nRecharge restante : %s tours

actors.hero.talent.trap_master.title=Ma?tre des pièges
actors.hero.talent.trap_master.desc=_+1 :\nUtiliser un cristal de piège a _66% de chance de le récupérer_.\n\n_+2 :\nUtiliser un cristal de piège a _75% de chance de le récupérer_.\n\n_+3 :\nUtiliser un cristal de piège a _80% de chance de le récupérer_.
actors.hero.talent.trap_master.comment=Améliorer ce talent donne _1 cristal de piège_ supplémentaire.\n\nCes talents qui obtiennent directement des ressources par amélioration ou mutation ont une limite de _26_ déclenchements (ou _39_ pour le noble).

actors.hero.talent.strong_throw.title=Lancer puissant
actors.hero.talent.strong_throw.desc=_+1 :\nLancer une arme de mêlée inflige _2x le palier_ de l''arme en dégats.\n\n_+2 :\nLancer une arme de mêlée inflige _4x le palier_ de l''arme en dégats.
actors.hero.talent.strong_throw.comment=? Lame tournoyante ! ?

actors.hero.talent.counter_attack.title=Contre-attaque
actors.hero.talent.counter_attack.desc=_+1 :\nSubir une attaque de mêlée a _20% de chance_ d''infliger une _contre-attaque de 0.5x le niveau du héros_.\n\n_+2 :\nSubir une attaque de mêlée a _35% de chance_ d''infliger une _contre-attaque de 0.5x le niveau du héros_.\n\n_+3 :\nSubir une attaque de mêlée a _50% de chance_ d''infliger une _contre-attaque de 0.5x le niveau du héros_.
actors.hero.talent.counter_attack.comment=

actors.hero.talent.fear_incarnation.title=Incarnation de la peur
actors.hero.talent.fear_incarnation.desc=_+1 :\nAttaquer un ennemi en _état de peur_ inflige _3 dégats_ supplémentaires.\n\n_+2 :\nAttaquer un ennemi en _état de peur_ inflige _5 dégats_ supplémentaires.
actors.hero.talent.fear_incarnation.comment=? Frapper quand l''ennemi a peur. ?

actors.hero.talent.behest.title=Héritage
actors.hero.talent.behest.desc=_+1 :\nQuand un allié meurt, donne au héros _5 tours de frénésie_.\n\n_+2 :\nQuand un allié meurt, donne au héros _10 tours de frénésie_.\n\n_+3 :\nQuand un allié meurt, donne au héros _15 tours de frénésie_.
actors.hero.talent.behest.comment=Ce talent ne s''active pas sur les ennemis corrompus, submergés ou qui se sacrifient pour vous.

actors.hero.talent.burning_curse.title=Malédiction br?lante
actors.hero.talent.burning_curse.desc=_+1 :\nUtiliser un baton ou une baguette sur un ennemi en _état de br?lure_ inflige _2 tours d''estropiage_ supplémentaires.\n\n_+2 :\nUtiliser un baton ou une baguette sur un ennemi en _état de br?lure_ inflige _2 tours d''estropiage_ et _2 tours de cécité_ supplémentaires.
actors.hero.talent.burning_curse.comment=? Premier précepte de la magie du feu : respecte les flammes. ?

actors.hero.talent.invisibility_shadows.title=Ombre de champ de bataille
actors.hero.talent.invisibility_shadows.desc=Après amélioration, quand le héros obtient l''esquive d''ombre ou l''invisibilité (via cape d''ombre, potion d''invisibilité, etc.), il _génère 1 mirage_.\n\n_+1 :\nCe talent a _10 tours de recharge_.\n\n_+2 :\nCe talent a _10 tours de recharge_.
actors.hero.talent.invisibility_shadows.comment=? Ce n''est pas la Légion de l''Ombre. ?
actors.hero.talent$invshacooldown.name=Ombre de champ de bataille - Recharge
actors.hero.talent$invshacooldown.desc=Vous venez d''utiliser ce talent, vous devez attendre avant de pouvoir l''utiliser à nouveau.\n\nRecharge restante : %s tours

actors.hero.talent.justice_punish.title=Chatiment de la justice
#fix9：恶魔属性敌人补充生效对象(四小只和大恶魔)
actors.hero.talent.justice_punish.desc=_+1 :\nLes _attaques physiques_ contre les ennemis _morts-vivants et démons_ infligent _20% de dégats_ supplémentaires ; les tuer donne _1 tour de bénédiction_.\n\n_+2 :\nLes _attaques physiques_ contre les ennemis _morts-vivants et démons_ infligent _30% de dégats_ supplémentaires ; les tuer donne _2 tours de bénédiction_.
actors.hero.talent.justice_punish.comment=_Ennemis morts-vivants_ : esprits vengeurs, esprits maudits, squelettes, voleurs fous, brigands fous, gardes de prison, nécromanciens, nécromanciens spectraux, trépassés nains, sorciers nains, moines nains, ma?tres moines, roi nain, Archimage Timothée et Abbé des Moines.\n\n_Ennemis démons_ : mimes, mimes dorés, mimes de cristal, mimes d''ébène, mimes mutants, rats fétides, Goo, autels démoniaques, succubes, Yeux mauvais, scorpions, scorpions acides, larves du dieu ancien, poings Br?lant/Terre/Putride/Rouillé/Radieux/Ombre, Yog-Dzewa, Inquisiteurs/Tra?tres/Charmeurs et Grands Démons.\n\nLes déchireurs démons ont les deux attributs _mort-vivant et démon_ mais ce talent ne s''applique pas deux fois.\n\n? Je vous traquerai jusqu''aux portes de l''enfer. ?

actors.hero.talent.overwhelming.title=Puissance écrasante
actors.hero.talent.overwhelming.desc=Après amélioration, le héros tire avantage d''une vitesse d''attaque plus lente.\n\n_+1 :\nLa partie du temps d''attaque dépassant 1 tour est ajoutée aux dégats à _0.33x_ et à la précision à _0.5x_.\n\n_+2 :\nLa partie du temps d''attaque dépassant 1 tour est ajoutée aux dégats à _0.66x_ et à la précision à _1x_.\n\n_+3 :\nLa partie du temps d''attaque dépassant 1 tour est ajoutée aux dégats à _1x_ et à la précision à _1.5x_.
actors.hero.talent.overwhelming.comment=Une puissance venue du _donjon de l''Ouest_ !


actors.hero.talent.energy_conversion.title=Conversion d''énergie
actors.hero.talent.energy_conversion.desc=_+1 :\nLa vitesse de charge des artefacts, batons, compétences d''armure et techniques devient _0.5x la vitesse de déplacement_, sans descendre sous la vitesse d''origine.\n\n_+2 :\nLa vitesse de charge des artefacts, batons, compétences d''armure et techniques devient _1x la vitesse de déplacement_, sans descendre sous la vitesse d''origine.
actors.hero.talent.energy_conversion.comment=Une puissance venue du _donjon de l''Ouest_ !

actors.hero.talent.magic_recycling.title=Recyclage magique
actors.hero.talent.magic_recycling.desc=_+1 :\nLancer un sort avec un baton ou une baguette a _10% de chance_ de ne pas consommer de charge.\n\n_+2 :\nLancer un sort avec un baton ou une baguette a _15% de chance_ de ne pas consommer de charge.\n\n_+3 :\nLancer un sort avec un baton ou une baguette a _20% de chance_ de ne pas consommer de charge.
actors.hero.talent.magic_recycling.comment=

actors.hero.talent.precious_experience.title=Expérience précieuse
actors.hero.talent.precious_experience.desc=_+1 :\nBoire une potion d''expérience ou une préparation d''éveil divin donne un _demi-niveau d''expérience_ supplémentaire.\n\n_+2 :\nEn plus du bonus de base, donne _50 tours de bénédiction_.
actors.hero.talent.precious_experience.comment=? Cette expérience, c''est vraiment précieux. ?

actors.hero.talent.disturb_attack.title=Attaque perturbatrice
actors.hero.talent.disturb_attack.desc=_+1 :\nLes attaques physiques ont _10% de chance_ d''infliger _3 tours d''étourdissement_.\n\n_+2 :\nLes attaques physiques ont _20% de chance_ d''infliger _3 tours d''étourdissement_.
actors.hero.talent.disturb_attack.comment=? En fait, c''est en enduisant l''arme d''un liquide soporifique. ?

actors.hero.talent.gholl_witchcraft.title=Sorcellerie gnolle
actors.hero.talent.gholl_witchcraft.desc=_+1 :\nAttaquer un ennemi _empoisonné_ inflige _2 tours de confusion_.\n\n_+2 :\nAttaquer un ennemi _empoisonné_ inflige _3 tours de confusion_.
actors.hero.talent.gholl_witchcraft.comment=? Une piètre copie des techniques de sorcellerie utilisées par les gnolls. ?

actors.hero.talent.engineer_refit.title=Ingénieur
actors.hero.talent.engineer_refit.desc=_+1 :\nTuer un ennemi _mécanique_ a _12.5% de chance_ de le transformer en DM-100 corrompu.\n\n_+2 :\nTuer un ennemi _mécanique_ a _25% de chance_ de le transformer en DM-100 corrompu.
actors.hero.talent.engineer_refit.comment=Si DM-400 (y compris AT-400 et AU-400 spécialisés en mode aléatoire) obtient ce talent, alors quand personne n''est détruit, il a aussi une chance d''être transformé en DM-100 corrompu.\n\n_Ennemis mécaniques_ : statues animées, gardiens invoqués, statues blindées, DM-100, DM-200, DM-201, pyl?nes, DM-300, golems et golems dorés.\n\n? Tu connais le génie mécanique ? ?

actors.hero.talent.weird_throw.title=Lancer étrange
actors.hero.talent.weird_throw.desc=_+1 :\nLancer une arme non-lan?able sur un ennemi inflige _1 tour de peur_.\n\n_+2 :\nLancer une arme non-lan?able sur un ennemi inflige _2 tours de peur_.
actors.hero.talent.weird_throw.comment=? Ne pas savoir ce que l''autre va lancer est effectivement terrifiant. ?

actors.hero.talent.thrid_hand.title=Troisième main
actors.hero.talent.thrid_hand.desc=_+1 :\nA _10% de chance_ d''acheter un objet sans dépenser d''or.\n\n_+2 :\nA _20% de chance_ d''acheter un objet sans dépenser d''or.
actors.hero.talent.thrid_hand.comment=? Je me sers. ?
actors.hero.talent.thrid_hand.steal=Vous profitez d''un moment d''inattention du marchand pour subtiliser l''objet.

actors.hero.talent.water_attack.title=Attaque aquatique
actors.hero.talent.water_attack.desc=_+1 :\nLe héros inflige _1 dégat_ supplémentaire dans l''eau.\n\n_+2 :\nLe héros inflige _2 dégats_ supplémentaires dans l''eau.
actors.hero.talent.water_attack.comment=? Vite, de l''eau, vite, de l''eau. ?

actors.hero.talent.more_chance.title=Plus de chance
actors.hero.talent.more_chance.desc=_+1 :\nUtiliser un parchemin de mutation ou un cristal de mutation a _10% de chance_ de ne pas le consommer.\n\n_+2 :\nUtiliser un parchemin de mutation ou un cristal de mutation a _20% de chance_ de ne pas le consommer.
actors.hero.talent.more_chance.comment=? Accepte et mise. ?

actors.hero.talent.amazing_eyesight.title=Vue per?ante
actors.hero.talent.amazing_eyesight.desc=_+1 :\nLes dégats de mêlée contre les ennemis à _3 cases ou plus_ augmentent de _35%_ et la _précision augmente de 35%_.\n\n_+2 :\nLes dégats de mêlée contre les ennemis à _2 cases ou plus_ augmentent de _35%_ et la _précision augmente de 35%_.
actors.hero.talent.amazing_eyesight.comment=? Un pouce de plus, un pouce de plus fort. ?

actors.hero.talent.light_application.title=Armure légère
actors.hero.talent.light_application.desc=_+1 :\nL''esquive de base augmente de _palier d''armure_.\n\n_+2 :\nL''effet est _doublé_ par rapport au niveau 1.
actors.hero.talent.light_application.comment=Inefficace sans armure.\n\n? C''est en fait un sort de couleur. ?

actors.hero.talent.heavy_application.title=Armure lourde
actors.hero.talent.heavy_application.desc=_+1 :\nLe bouclier maximum augmente de _palier d''armure_.\n\n_+2 :\nL''effet est _doublé_ par rapport au niveau 1.
actors.hero.talent.heavy_application.comment=Inefficace sans armure.\n\n? Ce n''est pas juste un livre en dessous. ?

actors.hero.talent.bless_meal.title=Repas béni
actors.hero.talent.bless_meal.desc=_+1 :\nManger ne prend que _1 tour_ et donne _25 tours de bénédiction_.\n\n_+2 :\nManger ne prend que _1 tour_ et donne _35 tours de bénédiction_.
actors.hero.talent.bless_meal.comment=? Merci au Seigneur de nous donner la satiété. ?

actors.hero.talent.bomb_maniac.title=Démon de l''explosion
actors.hero.talent.bomb_maniac.desc=_+1 :\nLes _dégats de bombe augmentent de 25%_.\n\n_+2 :\nLes _dégats de bombe augmentent de 50%_.
actors.hero.talent.bomb_maniac.comment=Améliorer ce talent donne _1 bombe_ supplémentaire.\n\nIl n''y a pas de limite au nombre de ressources obtenues via ce talent.\n\n? L''art, c''est l''explosion. ?

actors.hero.talent.phantom_shooter.title=Tireur fant?me
actors.hero.talent.phantom_shooter.desc=_+1 :\nLancer une arme de jet lance _1 projectile fant?me_ infligeant _10% des dégats_ de l''arme.\n\n_+2 :\nLancer une arme de jet lance _1 projectile fant?me_ infligeant _20% des dégats_ de l''arme.\n\n_+3 :\nLancer une arme de jet lance _1 projectile fant?me_ infligeant _30% des dégats_ de l''arme.
actors.hero.talent.phantom_shooter.comment=

actors.hero.talent.wake_snake.title=Réveiller le serpent
actors.hero.talent.wake_snake.desc=_+1 :\nQuand une créature foule les hautes herbes, _10% de chance_ de générer _1 serpent corrompu_.\n\n_+2 :\nQuand une créature foule les hautes herbes, _20% de chance_ de générer _1 serpent corrompu_.
actors.hero.talent.wake_snake.comment=? La bénédiction de la phobie des serpents. ?

actors.hero.talent.collection_gold.title=Bouclier d''or
actors.hero.talent.collection_gold.desc=_+1 :\nChaque pièce d''or ramassée augmente le _bouclier de 1_.\n\n_+2 :\nChaque pièce d''or ramassée augmente le _bouclier de 2_.
actors.hero.talent.collection_gold.comment=? Plein de cuivre. ?

actors.hero.talent.martial_train.title=Entra?nement martial
actors.hero.talent.martial_train.desc=Après amélioration, le héros peut utiliser les techniques, avec une capacité de charge augmentant avec le niveau du talent, et récupère 1 point de charge de technique toutes les 90 tours.\n\n_+1 :\nCapacité de charge maximale des techniques : _2 points_.\n\n_+2 :\nCapacité de charge maximale des techniques : _3 points_.\n\n_+3 :\nCapacité de charge maximale des techniques : _4 points_.
actors.hero.talent.martial_train.comment=Les héros capables d''utiliser les techniques peuvent donc les utiliser pour déclencher les effets normaux (non d''exclusivité) des talents _Bouclier de fureur_, _Concentration_, _Charge d''arme_, _Momentum_ et _Frappe de précision_.\n\nSi le héros peut déjà utiliser les techniques, les niveaux _+1/+2/+3_ n''augmentent la capacité de charge que de _1/2/3 points_.\n\n? à force de travail, on y arrive. ?

actors.hero.talent.thickened_armor.title=Armure renforcée
actors.hero.talent.thickened_armor.desc=_+1 :\nLe _bouclier maximum_ fourni par l''armure augmente de _1_.\n\n_+2 :\nLe _bouclier maximum_ fourni par l''armure augmente de _2_.
actors.hero.talent.thickened_armor.comment=Inefficace sans armure.\n\n? C''est juste un livre sous le plastron. ?

actors.hero.talent.powerful_calculations.title=Calculs infaillibles
actors.hero.talent.powerful_calculations.desc=_+1 :\nChaque fois qu''un personnage meurt hors du champ de vision, le héros récupère _1 point de vie_.\n\n_+2 :\nChaque fois qu''un personnage meurt hors du champ de vision, le héros récupère _2 points de vie_.
actors.hero.talent.powerful_calculations.comment=? Ta prochaine phrase est... ?

actors.hero.talent.insert_bid.title=Marquage
actors.hero.talent.insert_bid.desc=_+1 :\nAttaquer un ennemi _empoisonné_ augmente la précision de _20%_.\n\n_+2 :\nAttaquer un ennemi _empoisonné_ augmente la précision de _40%_.
actors.hero.talent.insert_bid.comment=? Tu es couvert de flèches et tu crois encore que je vais te rater ? ?

actors.hero.talent.meal_shield.title=Bouclier repas
actors.hero.talent.meal_shield.desc=_+1 :\nManger restaure _4 points de bouclier_.\n\n_+2 :\nManger restaure _8 points de bouclier_.
actors.hero.talent.meal_shield.comment=? Bourré. ?

actors.hero.talent.drop_resistant.title=Résistance aux chutes
actors.hero.talent.drop_resistant.desc=_+1 :\nQuand le héros tombe dans un gouffre, il n''obtient plus l''effet _d''estropiage_.\n\n_+2 :\nQuand le héros tombe dans un gouffre, il n''obtient plus les effets _de saignement et d''estropiage_.
actors.hero.talent.drop_resistant.comment=? Avion nègre, seulement 824 yuans ! ?

actors.hero.talent.strength_train.title=Entra?nement de force
actors.hero.talent.strength_train.desc=_+1 :\nSans effet.\n\n_+2 :\nObtient _1 point de force_ supplémentaire.
actors.hero.talent.strength_train.comment=? Référence : méthode d''entra?nement du poing surhumain. ?

actors.hero.talent.treat_meal.title=Repas curatif
actors.hero.talent.treat_meal.desc=_+1 :\nManger restaure lentement _3 points de vie_.\n\n_+2 :\nManger restaure lentement _5 points de vie_.
actors.hero.talent.treat_meal.comment=? Repas nutritif. ?

actors.hero.talent.cover_scar.title=Plein de cicatrices
actors.hero.talent.cover_scar.desc=_+1 :\nLes attaques de mêlée infligent un _saignement_ de base _1_.\n\n_+2 :\nLes attaques de mêlée infligent un _saignement_ de base _2_.
actors.hero.talent.cover_scar.comment=? Enfoncer sauvagement le poignard dans sa poitrine. ?

actors.hero.talent.nurtritious_meal.title=Repas complet
actors.hero.talent.nurtritious_meal.desc=_+1 :\nManger restaure _2 points de vie_ et donne _2 points de bouclier_.\n\n_+2 :\nManger restaure _4 points de vie_ et donne _4 points de bouclier_.
actors.hero.talent.nurtritious_meal.comment=? Manger un repas nutritif jusqu''à être bourré. ?

actors.hero.talent.rage_attack.title=Attaque enragée
actors.hero.talent.rage_attack.desc=_+1 :\nLes _dégats physiques infligés et subis_ par le héros augmentent de _10%_.\n\n_+2 :\nLes _dégats physiques infligés et subis_ par le héros augmentent de _20%_.\n\n_+3 :\nLes _dégats physiques infligés et subis_ par le héros augmentent de _30%_.
actors.hero.talent.rage_attack.comment=

actors.hero.talent.military_waterskin.title=Gourde militaire
actors.hero.talent.military_waterskin.desc=_+1 :\nLa gourde peut collecter _15 points de rosée_ supplémentaires.\n\n_+2 :\nLa gourde peut collecter _30 points de rosée_ supplémentaires.
actors.hero.talent.military_waterskin.comment=? C''est la grande gourde. ?

actors.hero.talent.jasmine_tea.title=Thé au jasmin
actors.hero.talent.jasmine_tea.desc=_+1 :\nBoire la rosée de la gourde donne _3 tours de bénédiction_.\n\n_+2 :\nBoire la rosée de la gourde donne _5 tours de bénédiction_.
actors.hero.talent.jasmine_tea.comment=? J''ai l''impression... que ce n''est pas aussi bon que le thé rouge glacé. ?

actors.hero.talent.god_lefthand.title=Main gauche de Dieu
actors.hero.talent.god_lefthand.desc=_+1 :\nQuand ce talent est à +1, le talent _Main droite de Dieu +1_ peut s''activer.\n\n_+2 :\nQuand ce talent est à +2, le talent _Main droite de Dieu +2_ peut s''activer.
actors.hero.talent.god_lefthand.comment=? Le poing gauche ne fait pas mal. ?

actors.hero.talent.god_righthand.title=Main droite de Dieu
actors.hero.talent.god_righthand.desc=_+1 :\nLes _dégats physiques augmentent de 30%_, nécessite le talent _Main gauche de Dieu +1_ pour s''activer.\n\n_+2 :\nLes _dégats physiques augmentent de 60%_, nécessite le talent _Main gauche de Dieu +2_ pour s''activer.
actors.hero.talent.god_righthand.comment=? Le poing droit fait plus mal. ?

actors.hero.talent.gold_formation.title=Formation d''or
actors.hero.talent.gold_formation.desc=_+1 :\nQuand le héros ramasse de l''or, si le sac contient plus de 100 pièces, _100 pièces sont automatiquement dépensées_ pour générer _1 butin bas niveau_ à c?té.\n\n_+2 :\nQuand le héros ramasse de l''or, si le sac contient plus de 1000 pièces, _1000 pièces sont automatiquement dépensées_ pour générer _1 butin moyen niveau_ à c?té.\n\n_+3 :\nQuand le héros ramasse de l''or, si le sac contient plus de 5000 pièces, _5000 pièces sont automatiquement dépensées_ pour générer _1 butin haut niveau_ à c?té.
actors.hero.talent.gold_formation.comment=

actors.hero.talent.strengthen_chain.title=Cha?ne renforcée
actors.hero.talent.strengthen_chain.desc=_+1 :\nQuand la cha?ne du vide attire un ennemi, elle lui inflige _10 tours d''estropiage_.\n\n_+2 :\nEn plus du niveau 1, la cha?ne du vide _ne consomme plus de tour_ pour attirer un ennemi, et chaque utilisation réduit la _consommation de charge de 1_ (minimum 1, sans modifier le besoin de charge à l''utilisation).
actors.hero.talent.strengthen_chain.comment=? Viens ici ! ?

actors.hero.talent.strengthen_chalice.title=Calice renforcé
actors.hero.talent.strengthen_chalice.desc=_+1 :\nL''effet d''accélération de la régénération naturelle du calice de sang est _augmenté de 50%_.\n\n_+2 :\nL''effet d''accélération de la régénération naturelle du calice de sang est _augmenté de 100%_.
actors.hero.talent.strengthen_chalice.comment=? La puissance, en partie récupérée. ?

actors.hero.talent.savage_physique.title=Corps sauvage
actors.hero.talent.savage_physique.desc=_+1 :\nLe maximum de vie augmente de _10 points_.\n\n_+2 :\nLe maximum de vie augmente de _15 points_.
actors.hero.talent.savage_physique.comment=? Endurcir les muscles, fortifier le corps. ?

actors.hero.talent.ice_breaking.title=Briser la glace
actors.hero.talent.ice_breaking.desc=_+1 :\nQuand la cible est en _état de gel_, les attaques physiques infligent _1 dégat magique_ supplémentaire.\n\n_+2 :\nQuand la cible est en _état de gel_, les attaques physiques infligent _2 dégats magiques_ supplémentaires.
actors.hero.talent.ice_breaking.comment=Améliorer ce talent renforce l''effet du talent _Froid extrême +3_.\n\n? Je suis ! Gla?on ! ! ! ?

actors.hero.talent.burning_blood.title=Sang br?lant
actors.hero.talent.burning_blood.desc=_+1 :\nQuand un ennemi meurt, le héros récupère _1 point de vie_.\n\n_+2 :\nQuand un ennemi meurt, le héros récupère _2 points de vie_.
actors.hero.talent.burning_blood.comment=? Arrête de gaspiller le sang de porc, OK ? ?

actors.hero.talent.strength_greatest.title=Le plus fort
actors.hero.talent.strength_greatest.desc=_+1 :\nLes armes de jet infligent _1 dégat_ supplémentaire, les arcs spirituels infligent _0~1 dégat_ supplémentaire.\n\n_+2 :\nLes armes de jet infligent _2 dégats_ supplémentaires, les arcs spirituels infligent _0~2 dégats_ supplémentaires.
actors.hero.talent.strength_greatest.comment=? La flèche perce la pierre, la force est suprême ! ?

actors.hero.talent.accumulate_steadily.title=Progrès constants
actors.hero.talent.accumulate_steadily.desc=_+1 :\nSans effet.\n\n_+2 :\nSans effet.\n\n_+3 :\nPortée d''attaque _+1_.
actors.hero.talent.accumulate_steadily.comment=

actors.hero.talent.get_up.title=Lever du lit
actors.hero.talent.get_up.desc=_+1 :\nSubir des dégats en dormant donne _3 tours de frénésie_.\n\n_+2 :\nSubir des dégats en dormant donne _5 tours de frénésie_.
actors.hero.talent.get_up.comment=? Je ne permettrai à personne de troubler ce moment de paix ! ?
actors.hero.talent$nosleep.name=Sommeil
actors.hero.talent$nosleep.desc=Faites une petite sieste ; être dérangé vous mettra dans une colère noire.


actors.hero.talent.more_talent.title=Plus de talents
actors.hero.talent.more_talent.desc=_+1 :\nUtiliser un parchemin de mutation a _50% de chance_ d''ajouter _1 option_ supplémentaire.\n\n_+2 :\nUtiliser un parchemin de mutation _ajoute obligatoirement 1 option_ supplémentaire.
actors.hero.talent.more_talent.comment=? Tous les chemins mènent à Rome. ?

actors.hero.talent.giant_killer.title=Tueur de géants
actors.hero.talent.giant_killer.desc=_+1 :\nLes attaques physiques contre les ennemis avec l''attribut _géant_ infligent _35% de dégats_ supplémentaires.\n\n_+2 :\nLes attaques physiques contre les ennemis avec l''attribut _géant_ infligent _70% de dégats_ supplémentaires.
actors.hero.talent.giant_killer.comment=_Ennemis géants_ : DM-200, DM-201, DM-300, golems, poing rouillé, golems dorés et ennemis d''élite géants.\n\n? Chassez-les tous ! ?

actors.hero.talent.want_all.title=Je veux tout
actors.hero.talent.want_all.desc=_+1 :\nLa salle au trésor de cristal et la salle du chemin de cristal génèrent _1 clé de cristal_ supplémentaire.\n\n_+2 :\nEn plus du niveau 1, la salle de choix de cristal génère _1 clé de cristal_ supplémentaire.
actors.hero.talent.want_all.comment=La salle au trésor de cristal propose deux équipements au choix, la salle du chemin de cristal propose six consommables pour trois choix, la salle de choix de cristal propose un équipement et un consommable.\n\n? Les enfants font des choix, moi je prends tout. ?\n? Clé squelette : veuillez entrer le texte. ?


actors.hero.talent.vegetarianism.title=Végétarisme permanent
actors.hero.talent.vegetarianism.desc=_+1 :\nManger un aliment non carné donne _450 tours de satiété_ ; manger un aliment carné _réduit la satiété de 50%_.\n\n_+2 :\nManger un aliment non carné donne _450 tours de satiété_ et _une guérison de 5% de la vie maximale_ ; manger un aliment carné _réduit la satiété de 50%_.
actors.hero.talent.vegetarianism.comment=Seules les petites rations, les baies du donjon, les rations de réserve, la potion d''ame, les fruits insipides et les morceaux de fruits insipides sont décrits comme non carnés, donc seuls ces 6 aliments comptent comme non carnés.\n\nAvec le défi de restriction alimentaire, l''effet de satiété obtenu via ce talent est _réduit de 450 à 150 tours_.\n\n? Si je dois vraiment manger de la viande, alors... bourre-toi ! ?\n? Je n''ai jamais été heureux en mangeant de la viande... ?

actors.hero.talent.word_stun.title=étourdissement verbal
actors.hero.talent.word_stun.desc=_+1 :\nLancer un parchemin sur un ennemi inflige _2 tours de paralysie_.\n\n_+2 :\nLancer un parchemin sur un ennemi inflige _3 tours de paralysie_.
actors.hero.talent.word_stun.comment=Ce talent a _10 tours de recharge_.\n\n? Ce n''est pas qu''un simple bout de papier. ?
actors.hero.talent$wordstuncooldown.name=étourdissement verbal - Recharge
actors.hero.talent$wordstuncooldown.desc=Vous venez d''utiliser ce talent, vous devez attendre avant de pouvoir l''utiliser à nouveau.\n\nRecharge restante : %s tours

actors.hero.talent.novice_benefits.title=Avantages pour débutant
actors.hero.talent.novice_benefits.desc=_+1 :\nObtient immédiatement _1 parchemin de mutation_.\n\n_+2 :\nObtient immédiatement _1 parchemin de mutation_.
actors.hero.talent.novice_benefits.comment=Ce type de talent qui donne directement des ressources par amélioration ou mutation a une limite de _26_ déclenchements (ou _39_ pour le noble).\n\n? C''est ta garantie de tirage. ?

actors.hero.talent.double_trinkets.title=Double accessoire
actors.hero.talent.double_trinkets.desc=_+1 :\nObtient _1 touche d''énergie magique_.\n\n_+2 :\nSans effet.\n\n_+3 :\nSans effet.
actors.hero.talent.double_trinkets.comment=Note : les effets de deux accessoires identiques ne se cumulent pas.\n\nCe type de talent qui donne directement des ressources par amélioration ou mutation a une limite de _26_ déclenchements (ou _39_ pour le noble).\n\n? L''artefact et la mousse ne peuvent coexister, car un seul jugement s''applique. ?

actors.hero.talent.fishing_time.title=Temps de pêche
actors.hero.talent.fishing_time.desc=_+1 :\nLes dégats contre les ennemis _poissons_ augmentent de _30%_.\n\n_+2 :\nEn plus du niveau 1, peut _empêcher la téléportation des piranhas fant?mes_ et _ajoute 1 piranha géant_ dans les salles d''eau ; ce piranha géant généré est affecté par le talent négatif _Nage terrestre_.
actors.hero.talent.fishing_time.comment=_Ennemis poissons_ : piranhas géants, piranhas fant?mes, piranhas géants terrestres et piranhas fant?mes terrestres.\n\n? C''est un talent trouvé en pêchant. ?


actors.hero.talent.posion_dagger.title=Dague empoisonnée
actors.hero.talent.posion_dagger.desc=_+1 :\nLes armes _de type dague_ infligent _2 tours de poison_ supplémentaires.\n\n_+2 :\nLes armes _de type dague_ infligent _4 tours de poison_ supplémentaires.
actors.hero.talent.posion_dagger.comment=_Armes de type dague_ : dague de voleur, longue dague, lame d''assassin et dague rituelle du croyant.\n\n? Ma lame est couverte de poison... enfin... ?

actors.hero.talent.invincible_meal.title=Repas invincible
actors.hero.talent.invincible_meal.desc=_+1 :\nManger donne _1 tour d''invulnérabilité_.\n\n_+2 :\nManger donne _2 tours d''invulnérabilité_.\n\n_+3 :\nManger donne _3 tours d''invulnérabilité_.
actors.hero.talent.invincible_meal.comment=Ce talent partage une limite de _100_ déclenchements avec les talents _Repas expérimenté_, _Repas nuageux_ et _Cadeau d''anniversaire_.

actors.hero.talent.wellfed_meal.title=Repas copieux
actors.hero.talent.wellfed_meal.desc=_+1 :\nQuand le héros est _rassasié_, tous les dégats contre les ennemis _augmentent de 5%_ et il obtient _10% de réduction de dégats_.\n\n_+2 :\nQuand le héros est _rassasié_, tous les dégats contre les ennemis _augmentent de 10%_ et il obtient _20% de réduction de dégats_.\n\n_+3 :\nQuand le héros est _rassasié_, tous les dégats contre les ennemis _augmentent de 15%_ et il obtient _30% de réduction de dégats_.
actors.hero.talent.wellfed_meal.comment=

actors.hero.talent.shock_bomb.title=Bombe de choc
actors.hero.talent.shock_bomb.desc=_+1 :\nL''explosion d''une bombe inflige _1 tour de paralysie_ aux créatures dans un rayon de _9 cases_.\n\n_+2 :\nL''explosion d''une bombe inflige _2 tours de paralysie_ aux créatures dans un rayon de _9 cases_.
actors.hero.talent.shock_bomb.comment=Améliorer ce talent donne _1 bombe_ supplémentaire.\n\nIl n''y a pas de limite au nombre de ressources obtenues via ce talent.\n\n? Grenade assourdissante. ?

actors.hero.talent.illusion_feed.title=Manger des illusions
actors.hero.talent.illusion_feed.desc=_+1 :\nObtient immédiatement _1 galette_.\n\n_+2 :\nObtient immédiatement _1 galette_.
actors.hero.talent.illusion_feed.comment=Ce type de talent qui donne directement des ressources par amélioration ou mutation a une limite de _26_ déclenchements (ou _39_ pour le noble).\n\n? Tu es un artiste. ?

actors.hero.talent.heavy_burden.title=Fardeau lourd
actors.hero.talent.heavy_burden.desc=_+1 :\nScore de jeu _x2_.\n\n_+2 :\nScore de jeu _x3_.
actors.hero.talent.heavy_burden.comment=? Dieu du scoring. ?

actors.hero.talent.attack_door.title=Attaque à la porte
actors.hero.talent.attack_door.desc=_+1 :\nQuand un ennemi est sur une case de porte ouverte, les attaques physiques infligent _1 dégat_ supplémentaire.\n\n_+2 :\nQuand un ennemi est sur une case de porte ouverte, les attaques physiques infligent _2 dégats_ supplémentaires.
actors.hero.talent.attack_door.comment=? Here is Johnny~ ?

actors.hero.talent.arrow_penetration.title=Flèche perforante
actors.hero.talent.arrow_penetration.desc=_+1 :\nToutes les armes de jet ont l''effet _pénétration des murs_, limité à _8 cases_ de distance.\n\n_+2 :\nToutes les armes de jet ont l''effet _pénétration des murs_, limité à _12 cases_ de distance.
actors.hero.talent.arrow_penetration.comment=Si un héros avec un arc spirituel ou une arme de jet spéciale obtient ce talent, ces armes bénéficient aussi de son bonus.\n\n? Je suis vieux mais ma flèche est toujours acérée ! ?

actors.hero.talent.detox_damage.title=Détox par la douleur
actors.hero.talent.detox_damage.desc=_+1 :\nêtre touché a _25% de chance_ de donner _1 tour de purification totale_ ; après purification, _15% de chance_ de supprimer tous les malus.\n\n_+2 :\nêtre touché a _50% de chance_ de donner _1 tour de purification totale_ ; après purification, _15% de chance_ de supprimer tous les malus.\n\n_+3 :\nêtre touché a _75% de chance_ de donner _1 tour de purification totale_ ; après purification, _15% de chance_ de supprimer tous les malus.
actors.hero.talent.detox_damage.comment=

actors.hero.talent.returning_honor.title=Retour honorable
actors.hero.talent.returning_honor.desc=_+1 :\nL''expérience donnée par les ennemis morts _augmente de 25%_.\n\n_+2 :\nL''expérience donnée par les ennemis morts _augmente de 50%_.\n\n_+3 :\nL''expérience donnée par les ennemis morts _augmente de 75%_.
actors.hero.talent.returning_honor.comment=

#fix9：名字变更为原先投稿的“涿郡屠户”
actors.hero.talent.zhuojun_butcher.title=Boucher de Zhuojun
#fix9：补充生效对象(巨型陆地食人鱼)
actors.hero.talent.zhuojun_butcher.desc=_+1 :\nTuer un ennemi _de type créature_ a _10% de chance_ d''obtenir _1 morceau de viande mystérieuse_.\n\n_+2 :\nTuer un ennemi _de type créature_ a _20% de chance_ d''obtenir _1 morceau de viande mystérieuse_.
actors.hero.talent.zhuojun_butcher.comment=Le butin de ce talent est aussi limité par le niveau du héros.\n\n_Les ennemis de type créature_ n''incluent que : piranhas géants, piranhas fant?mes, piranhas géants terrestres, piranhas fant?mes terrestres, abeilles dorées, rats, rats albinos, serpents des égouts, éclaireurs gnolls, crabes des égouts, essaims, slimes, chauves-souris vampires, brutes gnolls, brutes blindées, shamans gnolls et araignées des mines — tous les ennemis sans attribut.\n\n? Pourquoi les slimes laissent-ils tomber de la viande ? ?\n? C''est peut-être un aventurier pas encore digéré. ?

actors.hero.talent.aid_stomach.title=Estomac acide
actors.hero.talent.aid_stomach.desc=_+1 :\nManger de la _viande mystérieuse_ n''a pas d''effet négatif.\n\n_+2 :\nEn plus du niveau 1, manger de la viande mystérieuse restaure _33% de satiété_ supplémentaire.
actors.hero.talent.aid_stomach.comment=? Boire le sang, avaler la chair crue. ?

actors.hero.talent.weapon_make.title=Fabrication d''armes
actors.hero.talent.weapon_make.desc=_+1 :\nObtient immédiatement _1 arme_ disponible dans la troisième région.\n\n_+2 :\nObtient immédiatement _1 arme_ disponible dans la quatrième région.\n\n_+3 :\nObtient immédiatement _1 arme_ disponible dans la cinquième région.
actors.hero.talent.weapon_make.comment=Les armes obtenues via ce talent sont _identifiées immédiatement_ et ont un _besoin en force réduit de 2_. Ce type de talent qui donne directement des ressources a une limite de _26_ déclenchements (ou _39_ pour le noble).

actors.hero.talent.secret_stash.title=Cagnotte secrète
actors.hero.talent.secret_stash.desc=_+1 :\nObtient immédiatement _1000 pièces d''or_.\n\n_+2 :\nObtient immédiatement _1000 pièces d''or_.\n\n_+3 :\nObtient immédiatement _1000 pièces d''or_.
actors.hero.talent.secret_stash.comment=Ce type de talent qui donne directement des ressources par amélioration ou mutation a une limite de _26_ déclenchements (ou _39_ pour le noble).

actors.hero.talent.earth_meal.title=Repas terrestre
actors.hero.talent.earth_meal.desc=_+1 :\nManger donne une _armure végétale_ de _0 à 67% du niveau du héros_ points, réduite d''1 par tour.\n\n_+2 :\nManger donne une _armure végétale_ de _0 à 133% du niveau du héros_ points, réduite d''1 par tour.\n\n_+3 :\nManger donne une _armure végétale_ de _0 à 200% du niveau du héros_ points, réduite d''1 par tour.
actors.hero.talent.earth_meal.comment=

actors.hero.talent.eaten_slowly.title=Manger lentement
actors.hero.talent.eaten_slowly.desc=_+1 :\nManger prend _10 tours supplémentaires_ et la _satiété restaurée augmente de 30%_.\n\n_+2 :\nManger prend _10 tours supplémentaires_ et la _satiété restaurée augmente de 60%_ ; manger une galette donne en plus _450 tours de satiété_.
actors.hero.talent.eaten_slowly.comment=Ce talent n''affecte pas la Corne d''Abondance, et sa priorité d''allongement du temps de repas est supérieure à tous les talents qui le réduisent.\n\nAvec le défi de restriction alimentaire, l''effet de satiété obtenu via ce talent est _réduit de 450 à 150 tours_.\n\n? Ce ne sont que des formalités avant le repas. ?

actors.hero.talent.invincible.title=Inarrêtable
actors.hero.talent.invincible.desc=_+1 :\nQuand un ennemi meurt, le héros gagne _2 tours de frénésie_.\n\n_+2 :\nQuand un ennemi meurt, le héros gagne _4 tours de frénésie_.
actors.hero.talent.invincible.comment=? De plus en plus courageux. ?

actors.hero.talent.yog_larva.title=Invocation de larve
actors.hero.talent.yog_larva.desc=_+1 :\nSubir plus de _5 dégats_ en une seule fois _invoque 1 larve du dieu ancien_ pour combattre avec vous.\n\n_+2 :\nSubir plus de _5 dégats_ en une seule fois _invoque 2 larves du dieu ancien_ pour combattre avec vous.\n\n_+3 :\nEn plus du niveau 2, les larves ont _50% de chance_ d''être _élite_.
actors.hero.talent.yog_larva.comment=

actors.hero.talent.yog_fist.title=Poing du titan
actors.hero.talent.yog_fist.desc=Après amélioration, utiliser un artefact donne le Poing du titan, effet _durant 5 tours_, _20 tours de recharge_.\n\n_+1 :\nObtient la force du poing Radieux/Ombre, donnant _40 tours de lueur_, et les attaques physiques infligent _5 tours de cécité_.\n\n_+2 :\nEn plus du niveau 1, obtient la force du poing Br?lant, donnant _10 tours de fureur ardente_.\n\n_+3 :\nEn plus des niveaux 1 et 2, obtient la force du poing de Terre, donnant une armure végétale de 0 à 50% du niveau du héros réduite d''1 par tour, et les attaques physiques infligent _5 tours d''enchevêtrement_.
actors.hero.talent.yog_fist.comment=
actors.hero.talent$yogfistcooldown.name=Poing du titan - Recharge
actors.hero.talent$yogfistcooldown.desc=Vous venez d''utiliser ce talent, vous devez attendre avant de pouvoir l''utiliser à nouveau.\n\nRecharge restante : %s tours
actors.hero.talent$yogfistpower.name=Poing du titan
actors.hero.talent$yogfistpower.desc=Vous allez libérer la puissance du poing du dieu ancien pendant un court moment.\n\nTemps restant : %s tours


actors.hero.talent.yog_ray.title=Rayon de la mort
actors.hero.talent.yog_ray.desc=Après amélioration, lancer un sort avec un baton libère un rayon de la mort ; _20 tours de recharge_.\n\n_+1 :\nTire _1 rayon_ infligeant _10~60_ dégats.\n\n_+2 :\nTirer un sort sur une seule cible peut tirer jusqu''à _3 rayons_ infligeant _10~70_ dégats autour d''elle.\n\n_+3 :\nTirer un sort sur une seule cible peut tirer jusqu''à _5 rayons_ infligeant _10~80_ dégats autour d''elle.
actors.hero.talent.yog_ray.comment=? Quand le roi nain était petit, il a vu ce recueil et a éveillé son adoration pour la nécromancie. ?
actors.hero.talent$yograycooldown.name=Rayon de la mort - Recharge
actors.hero.talent$yograycooldown.desc=Vous venez d''utiliser ce talent, vous devez attendre avant de pouvoir l''utiliser à nouveau.\n\nRecharge restante : %s tours

actors.hero.talent.afraid_death.title=Fuir la mort
actors.hero.talent.afraid_death.desc=_+1 :\nQuand la _vie est en dessous de 30%_, la _vitesse de déplacement augmente de 30%_ et les _dégats physiques infligés baissent de 50%_.\n\n_+2 :\nQuand la _vie est en dessous de 30%_, la _vitesse de déplacement augmente de 40%_ et les _dégats physiques infligés baissent de 40%_.\n\n_+3 :\nQuand la _vie est en dessous de 30%_, la _vitesse de déplacement augmente de 50%_ et les _dégats physiques infligés baissent de 30%_.
actors.hero.talent.afraid_death.comment=

actors.hero.talent.pyromaniac.title=Pyromane
actors.hero.talent.pyromaniac.desc=_+1 :\nObtient _3 potions de souffle de dragon_.\n\n_+2 :\nObtient _2 potions d''élixir infernal_.\n\n_+3 :\nObtient _1 potion d''élixir de sang de dragon_.
actors.hero.talent.pyromaniac.comment=Ce type de talent qui donne directement des ressources par amélioration ou mutation a une limite de _26_ déclenchements (ou _39_ pour le noble).

actors.hero.talent.reverse_polarity.title=Inversion de polarité
actors.hero.talent.reverse_polarity.desc=Après amélioration, la vie actuelle est ajustée en conséquence.\n\n_+1 :\nLa vie actuelle est ajustée à _1 point_.\n\n_+2 :\nLa vie actuelle est ajustée à _50% de la vie maximale_.\n\n_+3 :\nLa vie actuelle est ajustée à _100% de la vie maximale_.
actors.hero.talent.reverse_polarity.comment=? Cette expression sur ton visage, c''est quoi ? Ces larmes, c''est quoi ? Tes larmes peuvent-elles sauver la Terre ? ?

actors.hero.talent.hero_name.title=Nom du héros
actors.hero.talent.hero_name.desc=_+1 :\nMonter de niveau restaure _10% de la vie maximale_ supplémentaire.\n\n_+2 :\nMonter de niveau restaure _20% de la vie maximale_ supplémentaire.\n\n_+3 :\nMonter de niveau restaure _30% de la vie maximale_ supplémentaire.
actors.hero.talent.hero_name.comment=

actors.hero.talent.sky_earth.title=Puissance du ciel et de la terre
actors.hero.talent.sky_earth.desc=_+1 :\nQuand le héros est en état de _flottaison, d''enchevêtrement ou d''armure végétale_, les dégats augmentent de _15%_.\n\n_+2 :\nQuand le héros est en état de _flottaison, d''enchevêtrement ou d''armure végétale_, les dégats augmentent de _30%_.\n\n_+3 :\nQuand le héros est en état de _flottaison, d''enchevêtrement ou d''armure végétale_, les dégats augmentent de _45%_.
actors.hero.talent.sky_earth.comment=Note : quand le Gardien foule les racines terrestres, il n''obtient plus l''armure végétale mais l''effet d''écorce ; il n''est donc pas affecté par ce talent.\n\n? D''un coup de colère, les montagnes et les rivières se déchirent ; d''un coup au sol, le ciel s''effondre. ?

actors.hero.talent.water_isfood.title=L''eau comme nourriture
actors.hero.talent.water_isfood.desc=_+1 :\nBoire une potion restaure _30 points de satiété_.\n\n_+2 :\nEn plus du niveau 1, boire la rosée de la gourde restaure _10 fois_ la quantité de rosée consommée en satiété.\n\n_+3 :\nEn plus des niveaux 1 et 2, _peut déclencher les effets spéciaux de la nourriture_.
actors.hero.talent.water_isfood.comment=

actors.hero.talent.delicious_flying.title=Voler de plaisir
actors.hero.talent.delicious_flying.desc=_+1 :\nManger donne _15 tours de flottaison_.\n\n_+2 :\nManger donne _25 tours de flottaison_.
actors.hero.talent.delicious_flying.comment=? Je vais te faire voler en mangeant ! ?

actors.hero.talent.angel_stance.title=Posture angélique
actors.hero.talent.angel_stance.desc=_+1 :\nQuand le héros est en _état de lueur_, subir une attaque inflige _30% des dégats en contre magique_ à l''attaquant.\n\n_+2 :\nQuand le héros est en _état de lueur_, subir une attaque inflige _40% des dégats en contre magique_ à l''attaquant.\n\n_+3 :\nQuand le héros est en _état de lueur_, subir une attaque inflige _50% des dégats en contre magique_ à l''attaquant.
actors.hero.talent.angel_stance.comment=

actors.hero.talent.thorny_rose.title=Rose épineuse
actors.hero.talent.thorny_rose.desc=_+1 :\nQuand le héros est touché, l''attaquant subit un _saignement_ de base _1_.\n\n_+2 :\nEn plus du niveau 1, quand le héros est touché, l''attaquant subit en plus _1 dégat_.
actors.hero.talent.thorny_rose.comment=? Elle ne t''est jamais revenue, n''est-ce pas ? ?

actors.hero.talent.hometown_cloud.title=Nuage du pays natal
actors.hero.talent.hometown_cloud.desc=_+1 :\nLa _vitesse de déplacement_ pour le retour augmente de _20%_.\n\n_+2 :\nLa _vitesse de déplacement_ pour le retour augmente de _40%_.\n\n_+3 :\nLa _vitesse de déplacement_ pour le retour augmente de _60%_.
actors.hero.talent.hometown_cloud.comment=S''active si le héros a l''Amulette de Yendor dans son sac.

actors.hero.talent.deep_freeze.title=Froid extrême
actors.hero.talent.deep_freeze.desc=_+1 :\nLes dégats des armes enchantées de givre _augmentent de 20%_.\n\n_+2 :\nEn plus du niveau 1, les attaques physiques peuvent infliger _3 tours de gel_.\n\n_+3 :\nEn plus des niveaux 1 et 2, les dégats contre les ennemis en état de _gel ou congelé_ _augmentent de 20%_ ; si vous avez amélioré le talent _Briser la glace_, les dégats _augmentent encore de 50%_.
actors.hero.talent.deep_freeze.comment=

actors.hero.talent.frenzied_attack.title=Ami, un peu plus lent
actors.hero.talent.frenzied_attack.desc=_+1 :\nLes attaques physiques ont _25% de chance_ d''infliger _2 tours de frénésie_.\n\n_+2 :\nLes attaques physiques ont _50% de chance_ d''infliger _2 tours de frénésie_.
actors.hero.talent.frenzied_attack.comment=? Balayer l''ami, redevenir soi-même. ?

actors.hero.talent.wulei_zhengfa.title=Justice des cinq éclairs
actors.hero.talent.wulei_zhengfa.desc=_+1 :\nObtient _1 baton de foudre_ ; le héros n''est plus électrocuté par le baton de foudre mais _récupère 20% des dégats d''électricité en vie_.\n\n_+2 :\nEn plus du niveau 1 (sans compter l''obtention de ressource), les _dégats du baton de foudre augmentent de 30%_.
actors.hero.talent.wulei_zhengfa.comment=Ce type de talent qui donne directement des ressources par amélioration ou mutation a une limite de _26_ déclenchements (ou _39_ pour le noble).\n\n? Augmentez le courant. ?

actors.hero.talent.magic_girl.title=Fille magique
actors.hero.talent.magic_girl.desc=_+1 :\nUtiliser un parchemin donne _30 tours de déguisement_, pendant lequel les _dégats des batons augmentent de 20%_.\n\n_+2 :\nUtiliser un parchemin donne _45 tours de déguisement_ et _10 tours de lueur_, pendant lequel les _dégats des batons augmentent de 40%_.
actors.hero.talent.magic_girl.comment=Ce talent peut être déclenché en lisant un livre de magie chaotique.\n\n? Transformation ! Je suis une gentille fille ! ?

actors.hero.talent.wide_knowledge.title=Connaissance vaste
actors.hero.talent.wide_knowledge.desc=_+1 :\nRamasser un objet _révèle immédiatement_ s''il est maudit.\n\n_+2 :\nRamasser un objet _l''identifie immédiatement_.\n\n_+3 :\nEn plus du niveau 2, l''objet identifié en le ramassant donne _3 tours de charge de baton_.
actors.hero.talent.wide_knowledge.comment=

actors.hero.talent.gold_meal.title=Repas doré
actors.hero.talent.gold_meal.desc=_+1 :\nManger donne _25 pièces d''or_.\n\n_+2 :\nManger donne _35 pièces d''or_.
actors.hero.talent.gold_meal.comment=? Est-ce que la cro?te de cette ration est en or ou la viande est en or ? ?

actors.hero.talent.no_viewrape.title=Ne pas regarder
actors.hero.talent.no_viewrape.desc=_+1 :\nSubir des dégats à distance inflige _1 tour de cécité_ à l''attaquant.\n\n_+2 :\nSubir des dégats à distance inflige _2 tours de cécité_ à l''attaquant.\n\n_+3 :\nSubir des dégats à distance inflige _3 tours de cécité_ à l''attaquant.
actors.hero.talent.no_viewrape.comment=? Qui est ce nain à la cape violette et ce gnoll au maquillage épais ? ! ?

actors.hero.talent.water_ghost.title=Esprit d''eau vengeur
actors.hero.talent.water_ghost.desc=_+1 :\nQuand un ennemi meurt dans l''eau, _20% de chance_ de générer _1 esprit vengeur_ et de gagner _5 tours de frénésie_.\n\n_+2 :\nQuand un ennemi meurt dans l''eau, _20% de chance_ de générer _1 esprit vengeur corrompu_.
actors.hero.talent.water_ghost.comment=? La version aquatique de ''même les morts peuvent être remplacés''. ?

actors.hero.talent.ash_ledger.title=Livre de cendres
actors.hero.talent.ash_ledger.desc=_+1 :\nQuand un ennemi meurt, le héros gagne _2 points de bouclier_.\n\n_+2 :\nQuand un ennemi meurt, le héros gagne _4 points de bouclier_.
actors.hero.talent.ash_ledger.comment=? Capture d''ame. ?

actors.hero.talent.secret_lighting.title=Lumière secrète
actors.hero.talent.secret_lighting.desc=_+1 :\nLire un parchemin donne _20 tours de lueur_.\n\n_+2 :\nLire un parchemin donne _40 tours de lueur_.
actors.hero.talent.secret_lighting.comment=Ce talent peut être déclenché en lisant un livre de magie chaotique.\n\n? A?e ! Mes yeux ! ?

actors.hero.talent.potential_1.title=Réveil du potentiel
actors.hero.talent.potential_1.desc=_+1 :\nObtient _1 parchemin de mutation_.\n\n_+2 :\nSans effet.
actors.hero.talent.potential_1.comment=Ce type de talent qui donne directement des ressources par amélioration ou mutation a une limite de _26_ déclenchements (ou _39_ pour le noble).

