actors.hero.talent.boss_talent_slot_5.title=Talent Vide
actors.hero.talent.boss_talent_slot_5.desc=Dès votre descente dans ce donjon, vous sentiez que quelque chose clochait. Ce n'est que maintenant que vous réalisez que certains de vos talents ont été effacés, ne laissant qu'un vide...\n\nHeureusement, en vainquant les puissants ennemis au cœur de ce donjon, vous obtiendrez une force encore plus grande. En bref, la seule option est d'avancer.\n\nLire le parchemin de sublimation laissé par le boss de l'étage 25 sublime ce talent en un talent de boss correspondant et offre un point de talent supplémentaire au niveau 3. Ce talent ne peut être ni amélioré ni transformé avant cela.
actors.hero.talent.boss_talent_slot_5.comment=

actors.hero.spells.credulous.name=Abjuration de la foi
actors.hero.spells.credulous.short_desc=Confère une immunité magique temporaire.
actors.hero.spells.credulous.desc=Le lanceur abandonne temporairement sa perception de la magie, gagnant _10 tours d'immunité magique_.\n\nCe sort _consomme 1 tour_.
actors.hero.spells.credulous.desc_instant=Ce sort au niveau +2 _ne consomme pas de temps_.

actors.hero.talent.ravens_eye.title=Œil du Corbeau
actors.hero.talent.ravens_eye.desc=_+1：_Le moine peut consommer _30 points de raison_ pour inspecter un objet et voir s'il est maudit.\n\n_+2：_Le moine peut consommer _20 points de raison_ pour inspecter un objet et voir s'il est maudit.
actors.hero.talent.ravens_eye.comment=
actors.hero.talent.ravens_eye.meta_desc=_Si ce talent est obtenu par un autre héros_, il permet au héros d'inspecter les objets au prix d'un saignement. Au niveau +1, le saignement a une valeur de base de 6. Au niveau +2, le saignement a une valeur de base de 4.
actors.hero.talent.ravens_eye.action=Inspecter


actors.hero.talent.crystal_gunpowder.title=Poudre Cristalline
actors.hero.talent.crystal_gunpowder.desc=_+1：_Chaque point d'énergie alchimique du moine augmente ses dégâts d'attaque physique de _1 point_.\n\n_+2：_Chaque point d'énergie alchimique du moine augmente ses dégâts d'attaque physique de _2 points_.
actors.hero.talent.crystal_gunpowder.comment=Le bonus de dégâts supplémentaire via ce talent ne dépasse pas _2/4 points_ aux niveaux _+1/+2_.
actors.hero.talent.bulwark_greatshield.title=Grand Bouclier Bastion
actors.hero.talent.bulwark_greatshield.desc=_+1：_Le moine équipé d'une arme avec parade gagne _10% de réduction des dégâts physiques_.\n\n_+2：_Le moine équipé d'une arme avec parade gagne _15% de réduction des dégâts physiques_.
actors.hero.talent.bulwark_greatshield.comment=Les armes avec parade incluent l'épée rapière, le bouclier-bras, le bâton à tête de fer, le bouclier rond, le katana et le bouclier géant.

actors.hero.talent.whispering_meal.title=Repas Murmurant
actors.hero.talent.whispering_meal.desc=_+1：_Le moine ne met qu'1 tour pour manger (la teinture tranquille ne consomme pas de tour), et inflige _2 tours de Peur_ aux ennemis dans son champ de vision.\n\n_+2：_Le moine ne met qu'1 tour pour manger (la teinture tranquille ne consomme pas de tour), et inflige _4 tours de Peur_ aux ennemis dans son champ de vision.
actors.hero.talent.whispering_meal.comment=
actors.hero.talent.liquid_barrier.title=Barrière de Liquide
actors.hero.talent.liquid_barrier.desc=_+1：_Quand le moine boit ou lance une potion, une potion magique ou un élixir, il gagne _5 tours_ de Barrière de Purification.\n\n_+2：_Quand le moine boit ou lance une potion, une potion magique ou un élixir, il gagne _10 tours_ de Barrière de Purification.
actors.hero.talent.liquid_barrier.comment=Si une potion de force, une potion d'expérience ou un objet alchimique fabriqué à partir de celles-ci est utilisé, la durée de la Barrière de Purification est doublée.\n\nPour les objets alchimiques à haut rendement, ce talent se déclenche selon le nombre d'unités produites.
actors.hero.talent.fast_reload.title=Rechargement Rapide
actors.hero.talent.fast_reload.desc=_+1：_Le moine recharge son pistolet alchimique _sans perdre de temps_.\n\n_+2：_En plus de +1, après avoir rechargé son pistolet alchimique, le moine gagne _1 tour_ d'Ombre Volante (téléportation).
actors.hero.talent.fast_reload.comment=
actors.hero.talent.fast_reload.meta_desc=_Si un autre héros obtient ce talent_, il gagne l'effet Ombre Volante en utilisant de l'or liquide pour réparer la durabilité de ses armes de jet. +1 confère 1 tour, +2 confère 2 tours.
actors.hero.talent.otherworld_bane.title=Féau des Mondes
actors.hero.talent.otherworld_bane.desc=_+1：_Quand le moine tue un ennemi de type _Mort-Vivant ou Démon_, il gagne _2 tours_ de vision spirituelle.\n\n_+2：_Quand le moine tue un ennemi de type _Mort-Vivant ou Démon_, il gagne _3 tours_ de vision spirituelle.
actors.hero.talent.otherworld_bane.comment=
actors.hero.talent.bullseye.title=Plein dans le Mille
actors.hero.talent.bullseye.desc=_+1：_Le moine lançant des shurikens ou des shurikens empoisonnés gagne _50% de précision supplémentaire_ et inflige _3 dégâts supplémentaires_.\n\n_+2：_Le moine lançant des shurikens ou des shurikens empoisonnés gagne _75% de précision supplémentaire_ et inflige _5 dégâts supplémentaires_.
actors.hero.talent.bullseye.comment=

actors.hero.talent.midas_touch.title=Touche de Midas
actors.hero.talent.midas_touch.desc=_+1：_Le moine reçoit _20 Liquides d'Or_ et peut les convertir en potion aléatoire.\n\n_+2：_Le moine reçoit _40 Liquides d'Or_ et peut les convertir en potion aléatoire.\n\n_+3：_Le moine reçoit _60 Liquides d'Or_ et peut les convertir en potion aléatoire.
actors.hero.talent.midas_touch.comment=Le Liquide d'Or ne peut pas être converti en Potion de Force. La conversion en une potion consomme toujours _20 Liquides d'Or_.\n\nCe type de talent qui acquiert directement des ressources via l'amélioration ou la transmutation partage une _limite de 26 déclenchements_ (39 pour le Gentleman).
actors.hero.talent.human_glory.title=Gloire Humaine
actors.hero.talent.human_glory.desc=_+1：_Quand la raison du moine tombe à 0, la probabilité d'obtenir la Vertu passe de 25% à _30%_.\n\n_+2：_Quand la raison du moine tombe à 0, la probabilité d'obtenir la Vertu passe de 25% à _35%_.\n\n_+3：_Quand la raison du moine tombe à 0, la probabilité d'obtenir la Vertu passe de 25% à _40%_.
actors.hero.talent.human_glory.comment=Notez que l'augmentation de la probabilité de Vertu signifie aussi une réduction de la probabilité de Tourment. Aux niveaux _+1/+2/+3_, la probabilité de Tourment passe de 75% à _70/65/60%_.
actors.hero.talent.human_glory.meta_desc=_Si un autre héros obtient ce talent_, aux niveaux +1/+2/+3, sa précision et son esquive augmentent de 10/20/30%.

actors.hero.herosubclass.alchemist=Alchimiste
actors.hero.herosubclass.alchemist_short_desc=_L'Alchimiste_ a une consommation d'énergie alchimique réduite et utilise un pistolet alchimique plus puissant.
actors.hero.herosubclass.alchemist_desc=L'Alchimiste est plus à l'aise avec l'alchimie. La fabrication d'objets alchimiques coûte 3 points d'énergie alchimique de moins (minimum 1).\n\nSon pistolet alchimique inflige désormais des dégâts magiques, a une plus grande portée et des effets de potion plus puissants.\n\nSi le _mode aléatoire_ est activé, sans pistolet alchimique, ce choix offre un pistolet alchimique.

actors.hero.talent.alchemy_shield.title=Bouclier Alchimique
actors.hero.talent.alchemy_shield.desc=_+1：_La consommation d'énergie alchimique de l'alchimiste passe de 3 à _4 points réduits_, et après chaque consommation d'énergie alchimique (y compris le rechargement du pistolet), il gagne _1 couche de bouclier alchimique_.\n\n_+2：_La consommation d'énergie alchimique de l'alchimiste passe de 3 à _5 points réduits_, et après chaque consommation d'énergie alchimique (y compris le rechargement du pistolet), il gagne _2 couches de bouclier alchimique_.\n\n_+3：_La consommation d'énergie alchimique de l'alchimiste passe de 3 à _6 points réduits_, et après chaque consommation d'énergie alchimique (y compris le rechargement du pistolet), il gagne _3 couches de bouclier alchimique_.
actors.hero.talent.alchemy_shield.comment=Le bouclier alchimique réduit les dégâts des prochains coups subis en fonction de l'énergie alchimique disponible, perdant 1 couche par coup, jusqu'à 3 couches cumulées.
actors.hero.talent.close_blast.title=Tir à Bout Portant
actors.hero.talent.close_blast.desc=_+1：_Plus la cible est proche, plus les dégâts du pistolet alchimique de l'alchimiste sont élevés. À distance maximale, aucun bonus ; _10% de dégâts supplémentaires_ par case de proximité, jusqu'à _40% de dégâts supplémentaires_.\n\n_+2：_Plus la cible est proche, plus les dégâts du pistolet alchimique de l'alchimiste sont élevés. _15% de dégâts supplémentaires_ par case de proximité, jusqu'à _60% de dégâts supplémentaires_.\n\n_+3：_Plus la cible est proche, plus les dégâts du pistolet alchimique de l'alchimiste sont élevés. _20% de dégâts supplémentaires_ par case de proximité, jusqu'à _80% de dégâts supplémentaires_.
actors.hero.talent.close_blast.comment=
actors.hero.talent.conservation.title=Économie de Ressources
actors.hero.talent.conservation.desc=_+1：_Le pistolet alchimique de l'alchimiste a _10% de chances_ de ne pas consommer de liquide lors d'une projection, et _30% de chances_ de ne pas consommer la potion après équipement.\n\n_+2：_Le pistolet alchimique de l'alchimiste a _20% de chances_ de ne pas consommer de liquide lors d'une projection, et _45% de chances_ de ne pas consommer la potion après équipement.\n\n_+3：_Le pistolet alchimique de l'alchimiste a _30% de chances_ de ne pas consommer de liquide lors d'une projection, et _60% de chances_ de ne pas consommer la potion après équipement.
actors.hero.talent.conservation.comment=Quand ce talent s'active pour un effet de potion équipée, la réserve de liquide du pistolet est rechargée normalement, tandis que la potion de force ne consomme ni ne recharge jamais la réserve.
actors.hero.talent$alchemyshield.name=Barrière alchimique
actors.hero.talent$alchemyshield.desc=Des couches de barrières d'énergie alchimique vous entourent, vous protégeant des attaques ennemies.\n\nChaque fois que vous consommez de l'énergie alchimique, vous formez des couches de barrière alchimique, jusqu'à 3 maximum. Sous la protection de la barrière, tous les dégâts physiques ennemis sont réduits de 5 points, plus 1 point par point d'énergie alchimique actuel, jusqu'à 20 points maximum.\n\nAvec votre énergie alchimique actuelle, chaque couche de barrière réduit les dégâts physiques de %1$d points.\n\nVous avez actuellement %2$d couches de barrière. Chaque attaque subie en consomme une.

actors.hero.herosubclass.pious=Piétiste
actors.hero.herosubclass.pious_short_desc=_Le Piétiste_ reçoit une dague rituelle utilisable rapidement pour restaurer ou réduire partiellement la raison. Il obtient également un nouveau Tourment remplaçant tous les précédents.
actors.hero.herosubclass.pious_desc=Le Piétiste reçoit une dague rituelle utilisable sans équipement. Attaquer avec applique un effet de don de sang permanent : l'ennemi perdant des PV restaure un peu de raison au Piétiste. Tuer un certain nombre d'ennemis permet une estocade inévitable sans consommation de temps. Estocader un ennemi restaure beaucoup de raison, tandis que s'estocader soi-même en perd beaucoup.\n\nQuand sa raison atteint 0, il gagne un Tourment ou une Vertu, mais il peut obtenir un nouveau Tourment remplaçant tous les précédents. Nouveau Tourment : Extase, augmente considérablement les dégâts physiques et la vitesse d'attaque, mais réduit fortement l'esquive.\n\nCette spécialisation a une capacité spéciale quand la dague rituelle peut estocader. Si le _mode aléatoire_ est activé, sans capacité de raison, ce choix offre la capacité de raison, mais avec des interactions limitées et sans conversion en énergie alchimique.

actors.buffs.suffering$ecstasy.name=Supplice : Extase
actors.buffs.suffering$ecstasy.desc=La folie, ma vieille amie !\n\nPendant ce supplice, ta vitesse d'attaque est augmentée de 50%%, les dégâts physiques infligés sont augmentés de 30%%, mais ton esquive est réduite de 50%%.\n\nCe supplice dure encore %s tours. Tuer des ennemis permet de l'éliminer plus rapidement.\n\nSi ta raison atteint zéro, tu succomberas à une frénésie sans fin.

actors.hero.talent.never_compromise.title=Jamais de Compromis
actors.hero.talent.never_compromise.desc=_+1：_Quand le croyant est en état de _Tourment ou de Vertu_, une blessure mortelle ne le tue pas directement mais lui confère l'effet _agonie_, et prolonge le Tourment ou réduit la Vertu de _50 tours_.\n\n_+2：_Quand le croyant est en état de _Tourment ou de Vertu_, une blessure mortelle ne le tue pas directement mais lui confère l'effet _agonie_, et prolonge le Tourment ou réduit la Vertu de _40 tours_.\n\n_+3：_Quand le croyant est en état de _Tourment ou de Vertu_, une blessure mortelle ne le tue pas directement mais lui confère l'effet _agonie_, et prolonge le Tourment ou réduit la Vertu de _30 tours_.
actors.hero.talent.never_compromise.comment=En état d'agonie, si le Tourment ou la Vertu est toujours actif, chaque blessure mortelle laisse 1 PV et prolonge le Tourment ou réduit la durée de la Vertu, mais on peut toujours mourir d'insuffisance cardiaque due à la perte de raison pendant le Tourment. Après la fin du Tourment ou de la Vertu, on subit une blessure grave (réduction de certaines caractéristiques) pendant 100 tours.
actors.hero.talent.rewind_time.title=Remonter le Temps
actors.hero.talent.rewind_time.desc=_+1：_Quand la raison du croyant tombe sous 20 points pendant le Tourment, il récupère immédiatement _30 points de raison_ et dissipe tout effet de Peur existant.\n\n_+2：_Quand la raison du croyant tombe sous 20 points pendant le Tourment, il récupère immédiatement _40 points de raison_ et dissipe tout effet de Peur existant.\n\n_+3：_Quand la raison du croyant tombe sous 20 points pendant le Tourment, il récupère immédiatement _50 points de raison_ et dissipe tout effet de Peur existant.
actors.hero.talent.rewind_time.comment=Ce talent _a un temps de recharge de 50 tours_.
actors.hero.talent$rewindtimeused.name=Remonter le temps - Recharge
actors.hero.talent$rewindtimeused.desc=Vous venez de reprendre votre souffle après la frénésie. Attendez avant de réutiliser ce talent.\n\nRecharge restante : %s tours
actors.hero.talent.bright_warrior.title=Guerrier Lumineux
actors.hero.talent.bright_warrior.desc=_+1：_La durée de Vertu prolongée par le kill d'un ennemi pendant la Vertu passe de 3 à _6 tours_.\n\n_+2：_La durée de Vertu prolongée par le kill d'un ennemi pendant la Vertu passe de 3 à _9 tours_.\n\n_+3：_La durée de Vertu prolongée par le kill d'un ennemi pendant la Vertu passe de 3 à _12 tours_.
actors.hero.talent.bright_warrior.comment=

actors.hero.talent$dyingwill.name=Volonté mourante
actors.hero.talent$dyingwill.desc=Votre vie est comme une bougie dans le vent.\n\nHeureusement, une volonté puissante vous permet d'encaisser plusieurs coups fatals, mais après la fin du Tourment ou de la Vertu, vous entrez dans un état de blessure grave prolongée.\n\nLa mort par insuffisance cardiaque due à l'épuisement de la raison pendant un Tourment ne peut être évitée ainsi.
actors.hero.talent$dyingwill.get=Une volonté puissante vous a fait refuser la mort !
actors.hero.talent$dyingwill.heavy_wound=Blessure grave
actors.hero.talent$dyingwill.heavy_wound_log=Vous vous sentez un peu submergé...
actors.hero.talent$heavywound.name=Blessure grave
actors.hero.talent$heavywound.desc=Votre corps est brisé.\n\nPendant la blessure grave, vos dégâts physiques sont réduits de 50%%, votre précision et votre esquive de 30%%.\n\nTemps avant guérison complète : %s tours

actors.hero.abilities.friar.concentratedpotion.name=Potion concentrée
actors.hero.abilities.friar.concentratedpotion.short_desc=Le Frère peut équiper une _potion concentrée_ à son pistolet alchimique, restaurant la réserve et renforçant le prochain jet.
actors.hero.abilities.friar.concentratedpotion.desc=Le Frère peut équiper une potion concentrée supplémentaire à son pistolet alchimique, restaurant 6 points de réserve et améliorant de 2 niveaux l'effet du prochain jet.\n\nÉquiper une potion concentrée coûte 1 tour.
actors.hero.abilities.friar.concentratedpotion.no_spraygun=Vous devez avoir un pistolet alchimique pour équiper une potion concentrée.

actors.hero.talent.concentrated_essence.title=Essence Concentrée
actors.hero.talent.concentrated_essence.desc=_+1：_Quand le moine équipe une potion concentrée dans son pistolet alchimique, la prochaine projection déclenche _un effet aléatoire supplémentaire différent_.\n\n_+2：_Quand le moine équipe une potion concentrée dans son pistolet alchimique, la prochaine projection déclenche _deux effets aléatoires supplémentaires différents_.\n\n_+3：_Quand le moine équipe une potion concentrée dans son pistolet alchimique, la prochaine projection déclenche _trois effets aléatoires supplémentaires différents_.\n\n_+4：_Quand le moine équipe une potion concentrée dans son pistolet alchimique, la prochaine projection déclenche _quatre effets aléatoires supplémentaires différents_.
actors.hero.talent.concentrated_essence.comment=Ce talent ne déclenche pas d'effet de gel quand la potion de feu liquide est équipée, et vice versa. Si aucune des deux n'est équipée, un seul des deux effets peut apparaître parmi les effets aléatoires.
actors.hero.talent.reagent_enhancement.title=Renforcement de Réactif
actors.hero.talent.reagent_enhancement.desc=_+1：_Après avoir équipé une potion concentrée dans son pistolet alchimique, l'effet de la prochaine projection du moine _augmente de 3 niveaux_.\n\n_+2：_Après avoir équipé une potion concentrée dans son pistolet alchimique, l'effet de la prochaine projection du moine _augmente de 4 niveaux_.\n\n_+3：_Après avoir équipé une potion concentrée dans son pistolet alchimique, l'effet de la prochaine projection du moine _augmente de 5 niveaux_.\n\n_+4：_Après avoir équipé une potion concentrée dans son pistolet alchimique, l'effet de la prochaine projection du moine _augmente de 6 niveaux_.
actors.hero.talent.reagent_enhancement.comment=
actors.hero.talent.reuse_reagent.title=Réutilisation
actors.hero.talent.reuse_reagent.desc=_+1：_Si le moine équipe une potion concentrée alors qu'il reste plus de 6 unités de liquide, la charge consommée par cet équipement _est réduite de 16%_.\n\n_+2：_Si le moine équipe une potion concentrée alors qu'il reste plus de 6 unités de liquide, la charge consommée par cet équipement _est réduite de 30%_.\n\n_+3：_Si le moine équipe une potion concentrée alors qu'il reste plus de 6 unités de liquide, la charge consommée par cet équipement _est réduite de 40%_.\n\n_+4：_Si le moine équipe une potion concentrée alors qu'il reste plus de 6 unités de liquide, la charge consommée par cet équipement _est réduite de 50%_.
actors.hero.talent.reuse_reagent.comment=



actors.hero.abilities.friar.holyprayer.name=Prière de la Lumière sacrée
actors.hero.abilities.friar.holyprayer.short_desc=Le Frère fait une _prière de la Lumière sacrée_, appliquant une puissante bénédiction à lui-même et à ses alliés.
actors.hero.abilities.friar.holyprayer.desc=Le Frère prie la Lumière sacrée, demandant sa bénédiction pour lui et ses alliés. La bénédiction dure 30 tours.\n\nSi le Frère a déjà une Vertu, la bénédiction est prolongée de 50 tours et lui accorde 50% de précision et d'esquive supplémentaires.\n\nLes alliés bénis récupèrent 20% de leurs PV maximaux et gagnent 100% de précision et d'esquive supplémentaires.
actors.hero.abilities.friar.holyprayer.cast=Dans la lumière, puissions-nous triompher !

actors.hero.abilities.friar.holyprayer$holyprayerblessing.name=Bénédiction de la Lumière sacrée
actors.hero.abilities.friar.holyprayer$holyprayerblessing.desc=Le chemin est éclairé, la voie est claire, nous avons juste besoin de la force pour la suivre.\n\nLe Frère a prié pour lui-même et ses alliés, la Lumière sacrée bénit désormais tout le monde. Pendant la bénédiction, la précision et l'esquive du Frère augmentent de 50%%, celles des alliés de 100%%.\n\nLa bénédiction dure encore %s tours. Saisissez cet élan et avancez vers le but final !
actors.hero.abilities.friar.holyprayer$holyprayerblessing.desc_bane=Le chemin est éclairé, la voie est claire, nous avons juste besoin de la force pour la suivre.\n\nLe Frère a prié pour lui-même et ses alliés, la Lumière sacrée bénit désormais tout le monde. Pendant la bénédiction, la précision et l'esquive du Frère augmentent de 50%%, celles des alliés de 100%%.\n\nDe plus, sous cette bénédiction, les dégâts physiques du Frère et des alliés contre les morts-vivants et les démons augmentent de %1$s%%.\n\nLa bénédiction dure encore %2$s tours. Saisissez cet élan et avancez vers le but final !

actors.hero.talent.pious_faith.title=Foi Pieuse
actors.hero.talent.pious_faith.desc=_+1：_Après avoir effectué une Prière de Lumière Sacrée, le moine récupère _25 points de raison_.\n\n_+2：_Après avoir effectué une Prière de Lumière Sacrée, le moine récupère _50 points de raison_.\n\n_+3：_Après avoir effectué une Prière de Lumière Sacrée, le moine récupère _75 points de raison_.\n\n_+4：_Après avoir effectué une Prière de Lumière Sacrée, le moine récupère _100 points de raison_.
actors.hero.talent.pious_faith.comment=Le surplus de raison restauré par ce talent est converti en soin de vie égal.
actors.hero.talent.supreme_blessing.title=Bénédiction Suprême
actors.hero.talent.supreme_blessing.desc=_+1：_Après avoir effectué une Prière de Lumière Sacrée, la prolongation de la Vertu existante passe à _75 tours_, et le soin de vie des alliés passe à _40% de la vie maximale_.\n\n_+2：_Après avoir effectué une Prière de Lumière Sacrée, la prolongation de la Vertu existante passe à _100 tours_, et le soin de vie des alliés passe à _60% de la vie maximale_.\n\n_+3：_Après avoir effectué une Prière de Lumière Sacrée, la prolongation de la Vertu existante passe à _125 tours_, et le soin de vie des alliés passe à _80% de la vie maximale_.\n\n_+4：_Après avoir effectué une Prière de Lumière Sacrée, la prolongation de la Vertu existante passe à _150 tours_, et le soin de vie des alliés passe à _100% de la vie maximale_.
actors.hero.talent.supreme_blessing.comment=
actors.hero.talent.hatred_of_evil.title=Haine du Mal
actors.hero.talent.hatred_of_evil.desc=_+1：_Pendant la Bénédiction de Lumière Sacrée, les dégâts physiques infligés par le moine et ses alliés aux ennemis de type _Mort-Vivant et Démon_ _augmentent de 30%_.\n\n_+2：_Pendant la Bénédiction de Lumière Sacrée, les dégâts physiques infligés par le moine et ses alliés aux ennemis de type _Mort-Vivant et Démon_ _augmentent de 40%_.\n\n_+3：_Pendant la Bénédiction de Lumière Sacrée, les dégâts physiques infligés par le moine et ses alliés aux ennemis de type _Mort-Vivant et Démon_ _augmentent de 50%_.\n\n_+4：_Pendant la Bénédiction de Lumière Sacrée, les dégâts physiques infligés par le moine et ses alliés aux ennemis de type _Mort-Vivant et Démon_ _augmentent de 60%_.
actors.hero.talent.hatred_of_evil.comment=

actors.hero.abilities.friar.reasondose.name=Dose de raison
actors.hero.abilities.friar.reasondose.short_desc=Le Frère s'injecte une _dose de raison_, restaurant beaucoup de raison et dissipant la peur.
actors.hero.abilities.friar.reasondose.desc=Le Frère s'injecte une dose de raison, restaurant 50 points de raison et dissipant immédiatement la peur.\n\nL'injection ne consomme pas de temps.
actors.hero.abilities.friar.reasondose.cast=La douleur se calme instantanément...

actors.hero.talent.heart_dose.title=Dose Cardiaque
actors.hero.talent.heart_dose.desc=_+1：_Après s'être injecté une seringue, le moine restaure aussi _10% de sa vie maximale_.\n\n_+2：_Après s'être injecté une seringue, le moine restaure aussi _15% de sa vie maximale_.\n\n_+3：_Après s'être injecté une seringue, le moine restaure aussi _20% de sa vie maximale_.\n\n_+4：_Après s'être injecté une seringue, le moine restaure aussi _25% de sa vie maximale_.
actors.hero.talent.heart_dose.comment=
actors.hero.talent.shield_dose.title=Dose de Bouclier
actors.hero.talent.shield_dose.desc=_+1：_Après s'être injecté une seringue, le moine gagne aussi _20 points de bouclier_.\n\n_+2：_Après s'être injecté une seringue, le moine gagne aussi _30 points de bouclier_.\n\n_+3：_Après s'être injecté une seringue, le moine gagne aussi _40 points de bouclier_.\n\n_+4：_Après s'être injecté une seringue, le moine gagne aussi _50 points de bouclier_.
