actors.hero.talent.boss_talent_slot_4.desc=Dès votre descente dans ce donjon, vous sentiez que quelque chose clochait. Ce n'est que maintenant que vous réalisez que certains de vos talents ont été effacés, ne laissant qu'un vide...\n\nHeureusement, en vainquant les puissants ennemis au cœur de ce donjon, vous obtiendrez une force encore plus grande. En bref, la seule option est d'avancer.\n\nLire le parchemin de sublimation laissé par le boss de l'étage 20 sublime ce talent en un talent de boss correspondant et offre un point de talent supplémentaire au niveau 3. Ce talent ne peut être ni amélioré ni transformé avant cela.
