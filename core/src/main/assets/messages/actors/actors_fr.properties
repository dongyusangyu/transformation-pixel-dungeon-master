##classes
actors.hero.heroclass.warrior=Guerrier
actors.hero.heroclass.warrior_desc_short=Un combattant robuste spécialisé dans le combat rapproché.
actors.hero.heroclass.warrior_desc=Le Guerrier commence avec une épée et une armure solides. Sa force lui permet d'utiliser des armes lourdes efficacement. Il peut identifier les objets plus rapidement.
actors.hero.heroclass.warrior_unlock=Vainquez le Goo avec n'importe quelle classe pour débloquer le Guerrier.

actors.hero.heroclass.mage=Mage
actors.hero.heroclass.mage_desc_short=Un maître de la magie maniant un bâton puissant.
actors.hero.heroclass.mage_desc=Le Mage commence avec un bâton magique qui se renforce avec les gantelets enchantés. Ses sorts de baguettes sont plus efficaces et il recharge les baguettes en vous reposant.
actors.hero.heroclass.mage_unlock=Trouvez 3 graines différentes avec n'importe quelle classe pour débloquer le Mage.

actors.hero.heroclass.rogue=Voleur
actors.hero.heroclass.rogue_desc_short=Un spécialiste de l'ombre et des attaques sournoises.
actors.hero.heroclass.rogue_desc=Le Voleur commence avec une cape de camouflage qui lui confère l'invisibilité. Il est plus précis avec les armes de jet et peut détecter les secrets plus facilement.
actors.hero.heroclass.rogue_unlock=Débloquez 10 coffres verrouillés avec n'importe quelle classe pour débloquer le Voleur.

actors.hero.heroclass.huntress=Chasseresse
actors.hero.heroclass.huntress_desc_short=Une archère maniant un arc spirituel.
actors.hero.heroclass.huntress_desc=La Chasseresse commence avec un arc spirituel qui ne nécessite pas de munitions. Elle se déplace plus vite dans l'herbe et est une fine connaisseuse des plantes.
actors.hero.heroclass.huntress_unlock=Éliminez 10 ennemis avec des effets environnementaux avec n'importe quelle classe.

actors.hero.heroclass.duelist=Duelliste
actors.hero.heroclass.duelist_desc_short=Une combattante experte en armes variées.
actors.hero.heroclass.duelist_desc=La Duelliste peut manier deux armes à la fois et utiliser des capacités spéciales avec chaque arme. Elle gagne de l'énergie avec ses attaques.
actors.hero.heroclass.duelist_unlock=Atteignez le niveau 6 avec le Guerrier ou la Chasseresse.

actors.hero.heroclass.cleric=Clerc
actors.hero.heroclass.cleric_desc_short=Un serviteur de la lumière maniant le Tome sacré.
actors.hero.heroclass.cleric_desc=Le Clerc commence avec un Tome sacré qui se recharge avec les attaques. Il peut soigner, bénir, purifier et invoquer la puissance divine.
actors.hero.heroclass.cleric_unlock=Atteignez le niveau 6 avec le Mage ou le Voleur.

actors.hero.herosubclass.berserker=Berserker
actors.hero.herosubclass.berserker_short_desc=Plus il subit de dégâts, plus il frappe fort.
actors.hero.herosubclass.berserker_desc=Le Berserker canalise sa douleur en puissance. Quand il subit des dégâts, sa rage augmente, améliorant ses attaques.
actors.hero.herosubclass.gladiator=Gladiateur
actors.hero.herosubclass.gladiator_short_desc=Enchaîne les attaques pour des effets dévastateurs.
actors.hero.herosubclass.gladiator_desc=Le Gladiateur construit des combos en touchant des ennemis, débloquant des bonus de dégâts.
actors.hero.herosubclass.battlemage=Mage de Guerre
actors.hero.herosubclass.battlemage_short_desc=Mêle magie et combat au corps à corps.
actors.hero.herosubclass.battlemage_desc=Le Mage de Guerre infuse son bâton avec les effets des baguettes, appliquant des effets magiques en frappant les ennemis.
actors.hero.herosubclass.warlock=Sorcier
actors.hero.herosubclass.warlock_short_desc=Se nourrit de l'énergie vitale des ennemis.
actors.hero.herosubclass.warlock_desc=Le Sorcier vole la vie des ennemis avec ses baguettes et peut marquer les ennemis.
actors.hero.herosubclass.assassin=Assassin
actors.hero.herosubclass.assassin_short_desc=Tue ses ennemis d'un seul coup.
actors.hero.herosubclass.assassin_desc=L'Assassin prépare ses attaques en attendant, délivrant des coups dévastateurs.
actors.hero.herosubclass.freerunner=Coureur
actors.hero.herosubclass.freerunner_short_desc=Agile et insaisissable.
actors.hero.herosubclass.freerunner_desc=Le Coureur se déplace plus vite, évite plus d'attaques et utilise les ombres.
actors.hero.herosubclass.sniper=Sniper
actors.hero.herosubclass.sniper_short_desc=Tire des flèches dévastatrices à distance.
actors.hero.herosubclass.sniper_desc=Le Sniper peut tirer des flèches multiples et benefits de bonus de dégâts à distance.
actors.hero.herosubclass.warden=Gardienne
actors.hero.herosubclass.warden_short_desc=Maîtrise la nature et les plantes.
actors.hero.herosubclass.warden_desc=La Gardienne utilise la végétation pour se protéger, soigner et piéger les ennemis.
actors.hero.herosubclass.champion=Championne
actors.hero.herosubclass.champion_short_desc=Maîtrise le combat à deux armes.
actors.hero.herosubclass.champion_desc=La Championne peut améliorer ses deux armes et débloquer des capacités spéciales.
actors.hero.herosubclass.monk=Moine
actors.hero.herosubclass.monk_short_desc=Transforme son corps en arme.
actors.hero.herosubclass.monk_desc=Le Moine utilise l'énergie intérieure pour des frappes puissantes, des esquives et la guérison.
actors.hero.herosubclass.priest=Prêtre
actors.hero.herosubclass.priest_short_desc=Soigne et soutient ses alliés avec la lumière.
actors.hero.herosubclass.priest_desc=Le Prêtre utilise la lumière sacrée pour soigner, purifier et bénir ses alliés tout en affaiblissant les ennemis.
actors.hero.herosubclass.paladin=Paladin
actors.hero.herosubclass.paladin_short_desc=Un protecteur sacré avec une armure renforcée.
actors.hero.herosubclass.paladin_desc=Le Paladin combine la force du Clerc avec la robustesse du Guerrier, bénissant son armure et son arme.

