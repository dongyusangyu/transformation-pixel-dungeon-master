actors.hero.abilities.rogue.shadowclone.name=Ombre Miroir
actors.hero.abilities.rogue.shadowclone.short_desc=Le Voleur invoque une _Ombre Miroir_ et peut la commander au combat.
actors.hero.abilities.rogue.shadowclone.desc=Invoque une ombre miroir (sans coût). 80 PV, 10~20 dégâts mêlée, sans armure. Avec certains talents, stats améliorées par l'équipement du Voleur.
