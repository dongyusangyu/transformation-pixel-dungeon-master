actors.hero.talent.boss_talent_slot_4.title=Leeres Talent
actors.hero.talent.boss_talent_slot_4.desc=Schon beim Betreten dieses Verlieses hattest du ein ungutes Gefühl. Erst jetzt merkst du, dass einige deiner ursprünglichen Talente ausgelöscht wurden und nur eine Leere zurückblieb ...\n\nDoch wenn du die mächtigen Feinde in den Tiefen dieses Verlieses besiegst, wirst du noch stärkere Kräfte erlangen. Kurz gesagt, es bleibt dir nur, weiterzugehen.\n\nLies die Sublimations-Schriftrolle, die der Boss von _Etage 20_ fallen lässt, um dieses Talent in das entsprechende Boss-Talent zu sublimieren und einen zusätzlichen Talentpunkt für Etage 3 zu erhalten. Vorher kann dieses Talent weder aufgewertet noch metamorpbiert werden.
