actors.mobs.npcs.blacksmith.name=Trollschmied
actors.mobs.npcs.blacksmith.intro_quest_warrior=Hallo, Mensch! Du siehst robust aus.
actors.mobs.npcs.blacksmith.intro_quest_mage=Hallo, Mensch! Du siehst schlau aus.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Hallo, Mensch! Du siehst raffiniert aus.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Hallo, Mensch! Du siehst flink aus.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Hallo, Mensch! Du siehst mutig aus.
actors.mobs.npcs.blacksmith.intro_quest_cleric=Hallo, Mensch! Du siehst wichtig aus.
#fix9：补充巨魔对绅士的形容
actors.mobs.npcs.blacksmith.intro_quest_freeman=Hey, Mensch! Du siehst ja ganz passabel aus.
actors.mobs.npcs.blacksmith.intro_quest_slimegirl=Hey, Monster! Du siehst ganz nützlich aus.
actors.mobs.npcs.blacksmith.intro_quest_ninja=Hey, Mensch! Du siehst ziemlich geheimnisvoll aus.
actors.mobs.npcs.blacksmith.intro_quest_dm400=Hey... oh, schon wieder ein Eisen-Schrott.
actors.mobs.npcs.blacksmith.intro_quest_princess=Hey, Zwerg! Ja, dich meine ich. Du hast zwar ein bisschen was Menschliches an dir, aber diesen zwergischen Gestank rieche ich trotzdem.
actors.mobs.npcs.blacksmith.intro_quest_friar=...Du riechst furchtbar, aber mich schreckst du damit nicht.
actors.mobs.npcs.blacksmith.intro_quest_start=Willste dich nützlich machen, hä? Weil ich hätt' da 'nen Job für dich. Ich hab' diese Werkstatt über 'ner Goldmine gebaut, die is' am unteren Ende von der Leiter da. Schnapp dir 'ne Spitzhacke und schürf mir etwas _Dunkelgold-Erz_. _40 Stück_ sollten reichen. Das Gestein da unten is' schön weich, _du wirst dich mit etwas Mühe durch die Wände graben können._\n\nWas heißt hier, wie werde ich dafür bezahlen? Du gieriges...\n\nIs' ja schon gut, ich kann dir was zusammenschmieden. Kannst dich glücklich schätzen, ich bin in dieser Gegend nämlich der einzige Schmied!
actors.mobs.npcs.blacksmith.intro_quest_crystal=Aber pass auf, die Mine ist gefährlich für kleine Menschlein wie dich. Is' schon seit 'ner Weile verlassen, inzwischen wachsen da 'ne Menge Kristalle. Die funkeln schön, sind aber zu zerbrechlich und deshalb wertlos, zumal sie durch irgendwelche magischen Dinge beschützt werden. Und die sind ziemlich stark, also _sei vorsichtig beim Schürfen,_ sonst ziehst du ihre Aufmerksamkeit auf dich.\n\nEs gibt auch irgendwo so 'nen _Riesenkristall._ Der is' aber viel stabiler, also mach dich auf 'nen Kampf gefasst, wenn du da drauf haust. Ich wette, es verlangsamt das Wachstum aller Kristalle wenn du das Ding zerbrichst; ich zahl' also extra, wenn du das hinkriegst!
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Aber pass auf, die Mine is' gefährlich für kleine Menschlein wie dich. 'Ne Handvoll Gnolls sind auch auf das Gold aus, und jetz' zerlegen die da unten alles. Das sind dämliche Kerle, durch ihr Vorhauen gibt's überall Felsbrüche und Tunneleinstürze. Da musste dich durchwühlen, also Obacht bei _frisch gebrochenem Fels._\n\nEin Gnoll da unten is' glaub' ich ganz besonders übel, wohl so 'ne Art _Geomantie-Schamane_. Ich zahl' extra, wenn du den findest und platt machst, aber der haut mit Sicherheit auch zurück, hähä.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Aber pass auf, die Mine is' gefährlich für kleine Menschlein wie dich. Da wuchert inzwischen 'nen seltsames Pilzmonstrum herum. Das hat so 'ne Art Pilzwachen ausgebildet, die sind tödlich, wenn se dich bemerken, aber wenigstens können se dir nich' hinterherrennen. _Bleib außer Sichtweite,_ wenne weiterleben willst.\n\nIch zahle extra, wenn du den _größten Pilz_ ausschalten kannst, aber das wird garantiert nich' einfach. Der is' mit in Wänden versteckten Myzel-Knoten verbunden. Die meisten davon musste zerstören, eh' du ihm was anhaben kannst.
actors.mobs.npcs.blacksmith.reminder=Hör auf, mich abzulenken. Der Eingang zur Mine is' da drüben.
actors.mobs.npcs.blacksmith.reminder_crystal=Bring' mir so viel Gold, wie du kannst, und versuch' auch den großen Kristall zu zerbrechen.
actors.mobs.npcs.blacksmith.reminder_gnoll=Bring' mir so viel Gold, wie du kannst, und versuch' auch, den Gnoll-Geomanten zu töten.
actors.mobs.npcs.blacksmith.reminder_fungi=Bring' mir so viel Gold, wie du kannst, und versuch' auch den Riesenpilz zu töten.
actors.mobs.npcs.blacksmith.lost_pick=Ist dat´ dein Ernst? Wo ist meine Spitzhacke?!
actors.mobs.npcs.blacksmith.quest_start_prompt=Bereit zum Abstieg? Sieh zu, dass du etwas Stauraum für das Gold hast.\n\n_Ich lass’ dich nur einmal da runtergehen!_
actors.mobs.npcs.blacksmith.enter_yes=Bin bereit
actors.mobs.npcs.blacksmith.enter_no=Noch nicht
actors.mobs.npcs.blacksmith.exit_warn_none=Biste schon fertig? Du hast ja fast gar nix an Gold! Solltest schon _40 Stück_ beschaffen können!\n\n_Denk dran, ich lass dich nich' noch mal runter, wenn du erst wieder oben bist._
actors.mobs.npcs.blacksmith.exit_warn_low=Biste schon fertig? Sieht nich' so aus, als hätteste viel Gold dabei. Solltest schon _40 Stück_ beschaffen können!\n\n_Denk dran, ich lass dich nich' noch mal runter, wenn du erst wieder oben bist._
actors.mobs.npcs.blacksmith.exit_warn_med=Biste schon fertig? Bisschen Gold hast du ja, aber in der Mine ist definitiv noch mehr. Solltest schon _40 Stück_ beschaffen können!\n\n_Denk dran, ich lass dich nich' noch mal runter, wenn du erst wieder oben bist._
actors.mobs.npcs.blacksmith.exit_warn_high=Biste schon fertig? Hast ja ordentlich Gold dabei, aber ich könnte noch etwas mehr gebrauchen. Solltest schon _40 Stück_ beschaffen können!\n\n_Denk dran, ich lass dich nich' noch mal runter, wenn du erst wieder oben bist._
actors.mobs.npcs.blacksmith.exit_warn_full=Biste schon fertig? Du hast ja viel Gold dabei, aber sieh zu, dass du nix von deinem Krempel unten liegen lässt.\n\n_Denk dran, ich lass dich nich' noch mal runter, wenn du erst wieder oben bist._
actors.mobs.npcs.blacksmith.exit_warn_crystal=Der Riesenkristall is' auch noch da unten. Ich zahl' extra, wenn du den zerstörst.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=Der Gnoll-Geomant is' auch noch da unten. Ich zahl' extra, wenn du den umbringst.
actors.mobs.npcs.blacksmith.exit_warn_fungi=Der Riesenpilz is' auch noch da unten. Ich zahl' extra, wenn du den tötest.
actors.mobs.npcs.blacksmith.exit_yes=Bin Fertig
actors.mobs.npcs.blacksmith.exit_no=Noch nicht
actors.mobs.npcs.blacksmith.get_lost=Ich bin beschäftigt. Zisch ab!
actors.mobs.npcs.blacksmith.entrance_blocked=Der Weg nach unten ist versperrt.
actors.mobs.npcs.blacksmith.cant_enter_old=Dieses Gebiet ist in diesem Run nicht zugänglich. Beginne ein neues Spiel, um das neue Abenteuer zu versuchen!
actors.mobs.npcs.blacksmith.def_verb=geblockt
actors.mobs.npcs.blacksmith.desc=Der Trollschmied sieht aus wie alle Trolle: Er ist hochgewachsen und mager, und seine Haut erinnert in Farbe und Struktur an Stein. Der Trollschmied hantiert mit unverhältnismäßig kleinen Werkzeugen herum.

##old blacksmith quest dialogue from pre-v2.2.0
actors.mobs.npcs.blacksmith.gold_1=Hey Mensch! Willst’ nützlich sein, was? Nimm’ die Spitzhacke und hol’ mir mal _Dunkelgold-Erz. 15 Stück_ sollten genug sein. Wie? Du willst bezahlt werden? Du gieriges ... \n\nOkay, Okay, Ich hab’ zwar kein Geld, um dich zu bezahlen, aber ich kann was für dich anfertig’n. Schätze Dich glücklich, ich bin der einzige Schmied in dieser Gegend.
actors.mobs.npcs.blacksmith.blood_1=Hey Mensch! Willst’ nützlich sein, Huh? Nimm’ diese Spitzhacke und töte ’ne Fledermaus damit. Was? Du willst bezahlt werden? Du gieriges ...\n\nOkay, Okay, Ich hab’ zwar kein Geld, um dich zu bezahlen, aber ich kann was für dich anfertig’n. Schätze dich glücklich, ich bin der einzige Schmied in dieser Gegend.
actors.mobs.npcs.blacksmith.gold_2=Dunkelgold. 15 Stück. Ernsthaft, is´ dat´ so schwer?
actors.mobs.npcs.blacksmith.blood_2=Ich sagte, ich brauch´ Fledermausblut auf der Spitzhacke. Geh´ los, mach Zack und Hack!
actors.mobs.npcs.blacksmith.completed=Oh, da bisse´ ja wieder... Besser jetzt als nie.

actors.mobs.npcs.ghost.name=Trauriger Geist
actors.mobs.npcs.ghost.rat_1=Seid gegrüßt, %s... Einst war ich wie Ihr – stark und zuversichtlich... Doch dann wurde ich von einem widerwärtigen Wesen erschlagen... Ich kann diesen Ort nicht verlassen... Nicht, bevor ich gerächt werde... Vernichtet die _verfaulende Ratte,_ die mir das Leben nahm...\n\nSie kriecht auf dieser Ebene umher... Verteilt ihren Gestank überall... _Hütet Euch vor ihrem widerwärtigen Geruch und zersetzenden Biss. Ihr Gift löst sich im Wasser auf..._
actors.mobs.npcs.ghost.rat_2=Bitte... Helft mir... Erschlagt die abscheuliche Kreatur...\n\n_Bekämpft sie nah am Wasser... Meidet ihren Gestank..._
actors.mobs.npcs.ghost.gnoll_1=Seid gegrüßt, %s... Einst war ich wie Ihr – stark und zuversichtlich... doch dann wurde ich von einem verschlagenen Wesen ermordet... Ich kann diesen Ort nicht verlassen... Nicht, bevor ich gerächt werde... Tötet den _Gnoll-Trickser_, der mir das Leben nahm...\n\nEr verhält sich nicht wie normale Gnolle... Sondern versteckt sich und verwendet Wurfwaffen... _Hütet Euch vor seinen Gift- und Brandpfeilen und meidet den Fernkampf..._
actors.mobs.npcs.ghost.gnoll_2=Bitte... Helft mir... Erschlagt den Trickser...\n\n_Lasst euch nicht treffen... Geht nah an ihn ran..._
actors.mobs.npcs.ghost.crab_1=Seid gegrüßt, %s... Einst war ich wie Ihr – stark und zuversichtlich... doch dann wurde ich von einer uralten Kreatur niedergestreckt... Ich kann diesen Ort nicht verlassen... Nicht, bevor ich gerächt werde... Tötet die _gigantische Krabbe,_ welche mir das Leben nahm... \n\nDiese Kreatur ist unnatürlich alt... Sie hat eine massive Schere und einen festen Panzer... Seid vorsichtig... _Sie pariert viele Angriffe mit ihrer Schere. Ihr müsst sie überraschen, andernfalls wird sie ein harter Gegner..._
actors.mobs.npcs.ghost.crab_2=Bitte... Helft mir... Erschlagt das Krustentier...\n\n_Es wird immer blocken... Wenn es euch kommen sieht..._
actors.mobs.npcs.ghost.find_me=Vielen Dank... findet mich...
actors.mobs.npcs.ghost.desc=Der Geist ist kaum sichtbar. Er sieht wie ein formloser, schwächlicher Lichtfleck mit einem trauernden Gesicht aus.

actors.mobs.npcs.imp.name=Ehrgeiziger Wicht
actors.mobs.npcs.imp.intro=Bist du ein Abenteurer? Ich liebe Abenteurer! Auf sie kann man sich immer verlassen, wenn etwas getötet werden muss, oder? Natürlich für ein Kopfgeld ;)
actors.mobs.npcs.imp.golems_1=In meinem Fall wären es _Golems_, die da umgebracht werden müssten. Weißt du, ich möchte hier einen kleinen Laden eröffnen, aber diese dummen Golems sind schlecht für's Geschäft! Man kann mit einem wandelnden Granitklumpen so schlecht verhandeln, verdammt nochmal! Also, bitte, töte... sagen wir, _4 von ihnen_, und die Belohnung gehört dir.
actors.mobs.npcs.imp.monks_1=Weißt Du, ich möchte hier einen kleinen Laden eröffnen, aber diese fanatischen _Mönche_ würden nie etwas kaufen und verschrecken stattdessen die zahlende Kundschaft. Also bitte, bringe ... sagen wir ... _5 von ihnen_ um die Ecke, und die Belohnung gehört dir.
actors.mobs.npcs.imp.golems_2=Na, wie läuft deine Golem-Safari? Vergiss nicht, die Münzen einzusammeln.
actors.mobs.npcs.imp.monks_2=Oh, du bist noch am Leben! Ich wusste, dass dein Kung-Fu stärker ist ;) Vergiss bloß nicht, den Mönchen diese Münzen abzuknöpfen.
actors.mobs.npcs.imp.cya=Bis bald, %s!
actors.mobs.npcs.imp.hey=Psst, %s!
actors.mobs.npcs.imp.desc=Wichte sind geringere Dämonen. Sie sind nicht für ihre Stärke oder magischen Fähigkeiten bekannt, aber sie sind intelligent und anpassungsfähig. Viele Wichte bevorzugen das Zusammenleben mit Nicht-Dämonen.

actors.mobs.npcs.impshopkeeper.name=Ehrgeiziger Wicht
actors.mobs.npcs.impshopkeeper.greetings=Hallo, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=Was hast du getan, %s? Beeile dich beim Einkauf, ich muss hier weg!
actors.mobs.npcs.impshopkeeper.thief=Ich dachte, ich könnte dir vertrauen!
actors.mobs.npcs.impshopkeeper.buyback=Der Wicht gibt dir den Gegenstand fröhlich pfeifend zurück.
actors.mobs.npcs.impshopkeeper.desc=Der Wicht hat am Übergang zu den inneren Hallen einen kleinen Laden eröffnet. Es ist schön, hier ein freundliches Gesicht zu sehen, allerdings sind seine Preise alles andere als freundlich.

actors.mobs.npcs.mirrorimage.name=Spiegelbild
actors.mobs.npcs.mirrorimage.desc=Diese Illusion sieht dir sehr ähnlich, sie scheint sogar deine aktuelle Rüstung und Waffe zu tragen.\n\nSpiegelbilder suchen nach Feinden und greifen diese mit ihren imitierten Waffen an, welche sich genauso verhalten wie deine, aber weniger Schaden anrichten. Zuerst sind sie fast unsichtbar, aber um angreifen zu können, müssen Spielbilder eine feste Form annehmen.\n\nObwohl sie viel Schaden austeilen können, halten Spiegelbilder nicht lange durch und verblassen, sobald sie getroffen werden.
actors.mobs.npcs.mirrorimage.discover_hint=Du kannst diese Einheit durch eine bestimmte Schriftrolle entdecken.

actors.mobs.npcs.npc.discover_hint=Du kannst diese Einheit in einer Dungeonregion entdecken.

actors.mobs.npcs.dongyusangyu.name=Östlicher Morgen
actors.mobs.npcs.dongyusangyu.desc=Dieser orangefarbene Honey trägt einen Beutel mit Streckenmarkierungen und ein sauber geführtes Schatzjagd-Punkteheft bei sich.
actors.mobs.npcs.dongyusangyu.hello=Möchtest du dein Glück versuchen und eine Runde Schatzjagd spielen?

actors.mobs.npcs.surfaceshopkeeper.name=Ladenbesitzer
actors.mobs.npcs.surfaceshopkeeper.desc=Der Betreiber des Oberflächenladens. Die Regalware wird zum Preis der 20. Ebene verkauft, angefragte Ware zum Preis der 25. Ebene.
actors.mobs.npcs.surfaceshopkeeper.thief=Dieb, Dieb!
actors.mobs.npcs.surfaceshopkeeper.warn=Vorsicht! Ich warne dich kein zweites Mal.
actors.mobs.npcs.surfaceshopkeeper.flee=Der Ladenbesitzer macht den Laden dicht und haut ab!
actors.mobs.npcs.surfaceshopkeeper.sell=Gegenstände verkaufen
actors.mobs.npcs.surfaceshopkeeper.query=Anfragen & Kaufen
actors.mobs.npcs.surfaceshopkeeper.raid=Extraktion starten
actors.mobs.npcs.surfaceshopkeeper.talk=Gespräch
actors.mobs.npcs.surfaceshopkeeper.talk_text=Nenne mir den genauen Namen eines normalen Verbrauchsguts; solange es kein wichtiger Gegenstand ist, kann ich es dir vielleicht verkaufen.
actors.mobs.npcs.surfaceshopkeeper.raid_title=Extraktionsauftrag
actors.mobs.npcs.surfaceshopkeeper.raid_body=Die Eintrittsgebühr beträgt %1$d Goldmünzen. Finde den Kristallschlüssel und erreiche den markierten Evakuierungsraum. Nur der erfolgreiche Ausgang sichert dir die Beute dieser Runde; ein Fehlschlag führt zum Verlust der gesamten Beute und von 1 bis 2 zufälligen normalen Verbrauchsgütern. Mit einem zweiten Kristallschlüssel zu evakuieren gewährt zusätzlich %2$d Goldmünzen.\n\nIm Gebiet können Sammlerstücke und verzauberte Wurfwaffen gefunden werden, aber keine zusätzlichen Nahkampfwaffen oder Rüstungen.
actors.mobs.npcs.surfaceshopkeeper.raid_enter=Bezahlen & Betreten
actors.mobs.npcs.surfaceshopkeeper.raid_cancel=Noch nicht betreten
actors.mobs.npcs.surfaceshopkeeper.raid_no_gold=Für die Extraktion werden %d Goldmünzen benötigt.
actors.mobs.npcs.surfaceshopkeeper.raid_unavailable=Der Extraktionsauftrag kann jetzt nicht gestartet werden.
actors.mobs.npcs.surfaceshopkeeper.buyback=Der Ladenbesitzer gibt dir widerwillig deinen Gegenstand zurück.
actors.mobs.npcs.surfaceshopkeeper.query_title=Anfragen & Kaufen
actors.mobs.npcs.surfaceshopkeeper.query_body=Gib den vollständigen Gegenstandsnamen ein; „x Anzahl“ am Ende möglich, z. B. „Heiltrank x3“. Maximal 5 Stück pro Artikel anfragbar.
actors.mobs.npcs.surfaceshopkeeper.query_confirm=Anfragen
actors.mobs.npcs.surfaceshopkeeper.query_cancel=Abbrechen
actors.mobs.npcs.surfaceshopkeeper.invalid_quantity=Ungültige Kaufmenge.
actors.mobs.npcs.surfaceshopkeeper.not_found=Dieser Gegenstand kann nicht angefragt werden oder hat keinen Preis.
actors.mobs.npcs.surfaceshopkeeper.limit_reached=Maximal %1$d Stück pro Artikel anfragbar; du hast bereits %2$d Stück gekauft.
actors.mobs.npcs.surfaceshopkeeper.query_offer=Anzahl：%1$d\nEinzelpreis：%2$d Gold\nGesamtpreis：%3$d Gold\nVerbleibendes Kontingent vor Kauf：%4$d
actors.mobs.npcs.surfaceshopkeeper.buy=Kaufen
actors.mobs.npcs.surfaceshopkeeper.not_enough_gold=Dein Gold reicht nicht.

actors.mobs.npcs.prismaticimage.name=Lichtbrechung
actors.mobs.npcs.prismaticimage.desc=Diese glitzernde Illusion sieht dir sehr ähnlich, sie scheint sogar deine derzeitige Waffe und Rüstung zu tragen.\n\nPrismatische Abbilder versuchen, die Aufmerksamkeit der Feinde auf sich zu lenken und setzen ihre verbesserte Verteidigung und Gesundheit dazu ein, dich zu schützen. Sie verfügen zwar nicht über die gleiche Schlagkraft wie Spiegelbilder, so aber doch über bessere Ausdauer und profitieren auch von den Vorteilen deiner Rüstung.\n\nWenn ihre Lebenspunkte auf 0 fallen, verblassen sie über mehrere Züge und können in dieser Zeit immer noch geheilt werden. Wenn keine Feinde zugegen sind, verblassen die Abbilder und finden zu ihrem Herrn zurück.
actors.mobs.npcs.prismaticimage.discover_hint=Du kannst diese Einheit durch eine bestimmte Schriftrolle entdecken.

actors.mobs.npcs.ratking.name=König der Ratten
actors.mobs.npcs.ratking.not_sleeping=Ich schlafe nicht!
actors.mobs.npcs.ratking.what_is_it=Was ist? Ich habe keine Zeit für deinen Unsinn. Mein Königreich regiert sich nicht von alleine!
actors.mobs.npcs.ratking.confused=Wa... Wo bin ich? Mein Königreich braucht mich!
actors.mobs.npcs.ratking.crown_clothes=Zieh dir was an! Du bist nicht in der Verfassung, mit Majestäten zu sprechen!
actors.mobs.npcs.ratking.crown_desc=Oooh, ist diese Krone für mich? Sie glänzt viel mehr als meine, darum werde ich sie gnädigerweise annehmen!\n\nTatsächlich gedenke ich sogar, dir eine Belohnung für diese Krone anzubieten. Eine ungeheure Macht, die eines Helden wie dir angemessen ist! Würde dir das gefallen?
actors.mobs.npcs.ratking.crown_yes=Selbstverständlich!
actors.mobs.npcs.ratking.crown_info=Erzähle mir erstmal mehr.
actors.mobs.npcs.ratking.crown_no=Lieber doch nicht...
actors.mobs.npcs.ratking.crown_thankyou=Hehehe, vielen Dank! Jetzt geh' und mach deinen König stolz!
actors.mobs.npcs.ratking.crown_fine=Wohl an! Es ist ja nicht so, dass ich sie wollte...
actors.mobs.npcs.ratking.crown_after=Freust du dich über deine neue Rüstung? Keine Rücknahme!
actors.mobs.npcs.ratking.desc_crown=Diese Ratte ist etwas größer als eine gewöhnliche Beutelratte. Sie trägt die Krone des Zwergenkönigs auf ihrem Kopf.
actors.mobs.npcs.ratking.desc_birthday=Diese Ratte ist etwas größer als eine gewöhnliche Beutelratte. Sie trägt einen klitzekleinen grüne Partyhut anstelle der üblichen Krone. Alles Gute zum Geburtstag, Rattenkönig!
actors.mobs.npcs.ratking.desc_winter=Diese Ratte ist etwas größer als eine gewöhnliche Beutelratte. Sie trägt eine klitzekleine festliche Kopfbedeckung anstelle der üblichen Krone. Schöne Feiertage!
actors.mobs.npcs.ratking.desc=Diese Ratte ist etwas größer als eine gewöhnliche Beutelratte. Sie trägt eine klitzekleine Krone auf ihrem Kopf.
actors.mobs.npcs.ratking.discover_hint=Du kannst diese Einheit am Ende einer Dungeonregion entdecken.

actors.mobs.npcs.sheep.name=Schaf
actors.mobs.npcs.sheep.baa!=Bäh!
actors.mobs.npcs.sheep.baa?=Bäh?
actors.mobs.npcs.sheep.baa.=Bäh.
actors.mobs.npcs.sheep.baa...=Bäh...
actors.mobs.npcs.sheep.def_verb=geblockt
actors.mobs.npcs.sheep.desc=Dies ist ein magisches Schaf. Was daran so magisch sein soll? Du kannst es nicht töten. Es wird einfach stehenbleiben, sein Futter wiederkauen und sein sorgenfreies Leben genießen, bis es wie durch Zauberhand verschwindet.
actors.mobs.npcs.sheep.discover_hint=Du kannst diese Einheit durch einen bestimmten Gegenstand oder eine Falle entdecken.

actors.mobs.npcs.shopkeeper.name=Händler
actors.mobs.npcs.shopkeeper.thief=Dieb, Dieb!
actors.mobs.npcs.shopkeeper.warn=Pass auf! Ich warne dich nicht nochmal.
actors.mobs.npcs.shopkeeper.flee=Der Ladeninhaber flieht!
actors.mobs.npcs.shopkeeper.sell=Verkaufe einen Gegenstand
actors.mobs.npcs.shopkeeper.talk=Unterhalten
actors.mobs.npcs.shopkeeper.buyback=Der Ladenbesitzer gibt dir den Gegenstand widerwillig zurück.
actors.mobs.npcs.shopkeeper.talk_prison_intro=Ich habe alles, was du für ein erfolgreiches Abenteuer brauchst!
actors.mobs.npcs.shopkeeper.talk_prison_warrior=Das ist ein interessantes Siegel, das du da hast. Die gibt es normalerweise nur im Ganzen. Bist du ein in Ungnade gefallener Held oder sowas? Na, wie auch immer, was du getan hast ist nicht mein Problem, und es ändert nichts am Wert deiner Münzen.
actors.mobs.npcs.shopkeeper.talk_prison_mage=Hehe, ich glaube, ich habe einen Steckbrief mit deinem Namen irgendwo in der Stadt gesehen. Auf der Flucht, wie? Ach, du bist unschuldig? Klar, logisch... keine Sorge, ich habe besseres zu tun, als dich zu verpfeifen, aber vielleicht solltest du mir sicherheitshalber etwas abkaufen?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=Kommst du von der Diebesgilde, um die Gegend leerzuräumen? Nein, nur einkaufen? Gut, erledige ein paar Monster, wenn du schonmal da bist. Aber erwarte keinen Rabatt, ich bezahle schon genug Schutzgeld an euch Leute, dabei sorgt ihr hier unten kaum für meine Sicherheit.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=Du scheinst nicht gerade in deinem Element zu sein, Miss. Enge Dungeongänge sind nicht so weitläufig wie große Hallen oder die Wälder, die die Stadt umgeben, nicht wahr? Ach, lass dich von meinem Geschwafel nicht ärgern. Möchtest Du vielleicht etwas kaufen?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=Na, wenn das mal nicht die reisende Heldin ist! Wenn Du versuchst, mal wieder eine Stadt zu retten, dann viel Glück. Die Gefahren hier sind nämlich wesentlich schlimmer als ein paar läppische Gaunerbanden. Ich bin sicher, Du schlägst Dich besser als jede andere, nur versuche bitte, nicht direkt vor meiner Ladentür zu sterben.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=Guten Tag, Euer Gnaden. Oder sollte ich jetzt „Eure Majestät“ sagen? Hehe, jedenfalls ist dies nicht der Ort für einen Heiligen wie Euch. Wenn Ihr auch noch „heimgeht zum Herrn“, würden die Gläubigen sicherlich verzweifeln. Aber mit Eurer unvergleichlichen Autorität habt Ihr sicherlich keinen Mangel an weltlichen Gütern. Warum kauft Ihr nicht zur Sicherheit etwas ein?
#fix9：文案更改
actors.mobs.npcs.shopkeeper.talk_prison_freeman=Oh, mein Herr, wenn ich mich nicht irre, habe ich Ihr Porträt einmal in einer Wirtschaftszeitschrift gesehen – oder Sie sehen zumindest genauso aus wie der berühmte Magnat, der dort abgebildet war. Jedenfalls machen Sie nicht den Eindruck, als würden Sie mit Ihrem Geld geizen. Wie wäre es, etwas bei mir zu kaufen? Ich garantiere Ihnen mit meinem kaufmännischen Verstand, dass dies alles erstklassige Waren sind, die Ihnen das Überleben sichern.
actors.mobs.npcs.shopkeeper.talk_prison_slimegirl=Äh... hallo? Obwohl mir kein Monster etwas anhaben kann, hast du mich wirklich erschreckt. Da du mich verstehen kannst, wie wäre es, dir diese Sachen anzusehen? Da du mein erster Monsterkunde bist, bekommst du die Ware garantiert günstiger als die Menschen. So viel zu versprechen, ist kein Betrug.
actors.mobs.npcs.shopkeeper.talk_prison_ninja=DOMO, Ninja=SAN, Ladenbesitzer DESU. Was führt dich aus dem fernen östlichen Land hierher? Oder habt ihr nach Jahrzehnten endlich beschlossen, den hier inhaftierten „Verräter“ zu beseitigen? Wie dem auch sei, das alles ist mir egal. Was mich wirklich interessiert, sind nur Goldmünzen. Also, wenn du Interesse hast, sieh dich um, ob du etwas Brauchbares findest.
actors.mobs.npcs.shopkeeper.talk_prison_dm400=Hey, Blechkasten, pass gefälligst auf! Ich will nicht, dass du meine Sachen beschädigst... Ich weiß zwar nicht, warum so einer wie du hier gelandet ist, aber wenn du dir ansehen willst, was ich habe, dann nimm es vorsichtig in die Hand, verstanden? Wenn nicht, ist auch egal – wenn du etwas kaputt machst, musst du es eben kaufen.
actors.mobs.npcs.shopkeeper.talk_prison_princess=Wenige überlebende Zwergenkönigsfamilienmitglieder – und ausgerechnet ein Halbblut aus Zwerg und Mensch. Welch eine Ironie. Es ist mir egal und ich will mich nicht in die Fehden der Oberflächenzwerge einmischen. Selbst wenn du königliches Blut hast, ist das hier nichts wert... es sei denn, du hast sehr, sehr viel Geld.
actors.mobs.npcs.shopkeeper.talk_prison_friar=Ha, hätte nicht gedacht, dich hier zu treffen. Wie geht es deinen Augen? Siehst du immer noch diese grauenvollen Dinge? Ich lache dich natürlich nicht aus, ich habe nur „aufrichtiges“ Mitgefühl mit dir... Aber hier gibt es keine Sonderrabatte, nur weil du blind bist oder ein akademisches Genie. Such dir gut aus, was du zum Überleben brauchst...
actors.mobs.npcs.shopkeeper.talk_caves=Gib Geld aus, lebe länger.\n\nOh, und grüße den Trollschmied von mir, wenn Du ihn siehst. Erinnere das Schlitzohr an das Geld, das er mir immer noch für den Hammer schuldet, den ich ihm letzte Woche verkauft habe.
actors.mobs.npcs.shopkeeper.talk_city=Meine Waren können Dich hier unten schützen.\n\n... und trödel bitte nicht herum. Es hat ewig gedauert, die Bewohner hier dazu zu bringen, mich in Ruhe zu lassen. Ich will nicht, dass Du mir irgendwelchen Ärger verursachst.
actors.mobs.npcs.shopkeeper.talk_halls=Hey, ich hab Sonderangebote für Dämonenjäger!\n\nOh, und sei vorsichtig dort unten. Die Dämonen kümmern sich nicht darum, wie mutig du bist. Du kannst nicht zurückkommen und mehr Geld ausgeben, wenn du tot bist! ;)\n\nOb die Dämonen sind wie ich? Ha, nicht im geringsten. Ich bin nur ein gewöhnlicher Bursche, nicht gerade ein Kämpfer, und ich hab's geschafft, meinen Verstand intakt zu halten. Die Dämonen unten sind wesentlich stärkere Wesen, und sie alle wurden versklavt von... naja... sei einfach vorsichtig dort unten.
actors.mobs.npcs.shopkeeper.talk_ascent=Ich weiß nicht, was Du mit diesem Amulett vorhast, aber ich will nichts damit zu tun haben. Kauf irgendwas und zieh weiter, wir müssen beide hier weg!
actors.mobs.npcs.shopkeeper.desc=Dieser stämmige Typ würde von seinem Erscheinungsbild her eher ins Handelsviertel einer größeren Stadt passen als in ein Dungeon. Seine Preise erklären aber, warum er den Handel hier bevorzugt.

actors.mobs.npcs.wandmaker.name=Alter Stabmacher
actors.mobs.npcs.wandmaker.intro_warrior=Oh, sei gegrüßt! Welch eine angenehme Überraschung, einen Krieger aus dem Norden an diesem deprimierenden Ort anzutreffen! Du musst weit gereist sein, bevor du hierhergekommen bist. Wenn du auf Abenteuer aus bist, hätte ich vielleicht eine Aufgabe für dich.
actors.mobs.npcs.wandmaker.intro_rogue=Du meine Güte, hast du mich erschreckt! Ich habe keinen Banditen an diesem Ort entdeckt, der immer noch bei Verstand ist, also musst du von der Oberfläche sein! Wenn du Interesse hast, einem Fremden zu helfen, hätte ich eine Aufgabe für dich.
actors.mobs.npcs.wandmaker.intro_mage=Oh, Hallo %s! Ich habe mitbekommen, dass da wohl etwas Unruhe zwischen dir und dem Institut der Zauberer herrschte? Vergiss es, ich war niemals ein Freund dieser Engstirnigen. Wenn du möchtest, hätte ich eine Aufgabe für dich.
actors.mobs.npcs.wandmaker.intro_huntress=Oh, hallo, meine Dame! Ein freundliches Gesicht hier in dieser Tiefe zu entdecken ist wahrlich eine erfreuliche Überraschung, oder? Tatsächlich kommt mir dein Gesicht bekannt vor. Es liegt mir auf der Zunge... Wie dem auch sei, falls du hier auf Abenteuer aus bist, hätte ich vielleicht eine Aufgabe für dich.
actors.mobs.npcs.wandmaker.intro_duelist=Oh, hallo, meine Dame! Welch angenehme Überraschung, in dieser deprimierenden Umgebung einer Heldin zu begegnen! Wenn Du gewillt wärest, einem alten Mann zu helfen, hätte ich eine Aufgabe für Dich.
actors.mobs.npcs.wandmaker.intro_cleric=Oh, guten Tag, Euer Gnaden! Welch ein Glück, Euch an so einem bedrückenden Ort zu treffen! Ich möchte Euch nicht stören, aber ich habe eine Bitte.
#fix9：文案更改
actors.mobs.npcs.wandmaker.intro_freeman=Oh, hallo! Werter Herr, Ihr seht wirklich stattlich aus! Jedenfalls... ich habe hier ein Problem. Wärt Ihr so freundlich, einem armen alten Mann zu helfen?
actors.mobs.npcs.wandmaker.intro_slimegirl=Oh, meine Güte... Ich glaube, es ist das erste Mal, dass ich an diesem schrecklichen Ort mit einem Monster rede. Ich hatte schon befürchtet, du würdest dich wie die anderen Monster auf mich stürzen. Jedenfalls, da du mich verstehen kannst, könntest du mir einen kleinen Gefallen tun? Ich kann kaum erwarten, hier noch einen anderen vernünftigen Menschen zu treffen.
actors.mobs.npcs.wandmaker.intro_ninja=DOMO, Ninja=SAN, Felice DESU. Wie du siehst, plage ich mich mit einer lästigen Angelegenheit herum. Wenn es dir nichts ausmacht, könntest du mir einen kleinen Gefallen tun?
actors.mobs.npcs.wandmaker.intro_dm400=Meine Güte, ein... Roboter-Mensch! Ehrlich gesagt, dachte ich immer, nur magisch beseelte Geschöpfe könnten über Intelligenz verfügen... Hüstel, werter Herr Eisen, da du mich verstehen kannst, hoffe ich, dass du einem alten Mann wie mir helfen kannst.
actors.mobs.npcs.wandmaker.intro_princess=Oh, hallo! Hätte nicht gedacht, Euch hier zu treffen. Dank Eurer Fürsorge habe ich so manche neuartige Magie von den Zwergen gelernt... Zur Sache: Ich bin in eine ziemliche Klemme geraten und bitte Euch um Hilfe.
actors.mobs.npcs.wandmaker.intro_friar=Oh, du bist es, das alchemistische Genie aus der Zeitschrift. Damals so voller Elan, jetzt sieht man deiner Seele an, dass sie wie von einem finsteren Gedankenzerstörer zerrissen wurde... Verzeih, ich rede zu viel. Ich bitte dich, hilf mir bei einer Sache... Du weißt, wir sind uns ähnlich, ich würde dich nicht betrügen.
actors.mobs.npcs.wandmaker.intro_1=\n\nIch bin hier, um eine seltene Zutat für einen Zauberstab zu finden, doch habe ich mich verlaufen und mein magischer Schutzschild ist geschwächt. Ich muss diesen Ort bald verlassen, doch ich kann den Gedanken nicht ertragen, ihm mit leeren Händen den Rücken zu kehren.
actors.mobs.npcs.wandmaker.intro_dust=Ich suche nach etwas _Leichenstaub._ Das ist eine besondere Art verfluchtes Gebein, das normalerweise an Orten wie diesem zu finden ist. Hier müsste irgendwo ein verbarrikadierter Raum sein, ich wette, da gibt es solchen Staub. Sei aber vorsichtig, der Fluch auf diesem Staub ist ziemlich mächtig, also _komm so schnell wie möglich zurück,_ damit ich den Staub reinigen kann.
actors.mobs.npcs.wandmaker.intro_ember=Ich suche nach etwas _frischer Asche_ von einem neugeborenen Feuerelementar. Elementare erscheinen normalerweise, wenn ein Beschwörungsritual außer Kontrolle gerät, also suche einfach ein paar Kerzen und einen Ritualplatz. Ich bin mir sicher, dass Du eins auftauchen lassen kannst. Pass jedoch auf, dass Du Dir beim Kampf _nicht Deine Rückzugsmöglichkeiten nimmst,_ oder halte _etwas bereit, das Frost erzeugen kann._ Neugeborene Elementare sind recht stark und chaotisch, aber Kälte können sie nicht leiden.
actors.mobs.npcs.wandmaker.intro_berry=Die frühere Wärterin dieses Gefängnisses züchtete hier eine _Faulbeere_ und ich brauche die Samen dieser Pflanze. Die Pflanze muss inzwischen außer Rand und Band sein, daher benötigt diese Aufgabe etwas Fingerspitzengefühl. Der Garten sollte sich hier irgendwo in der Nähe befinden. Versuche _Abstand von den Ranken zu gewinnen,_ wenn du nicht in kleine Stückchen geschnitten werden möchtest. Alles in Brand zu setzen wirkt verlockend, aber ich bitte dich das zu vermeiden, da es die gesamte Pflanze und ihre Samen vernichtet.
actors.mobs.npcs.wandmaker.intro_2=\n\nWenn du mir das besorgen kannst, werde ich dich mit einem meiner ausgezeichneten Zauberstäbe belohnen. Ich habe zwei mitgebracht, daher darfst du dir einen aussuchen und behalten.
actors.mobs.npcs.wandmaker.reminder_dust=Hast du Leichenstaub gefunden, %s? Suche nach verbarrikadierten Räumen.
actors.mobs.npcs.wandmaker.reminder_ember=Hast du diese Asche gefunden, %s? Du brauchst vier Kerzen und einen Ritualplatz.
actors.mobs.npcs.wandmaker.reminder_berry=Hast du einen Fäulnissamen gefunden, %s? Suche nach einem Raum, der vollständig zugewuchert ist.
actors.mobs.npcs.wandmaker.def_verb=geblockt
actors.mobs.npcs.wandmaker.desc=Dieser alte, aber noch rüstige Herr blickt leicht verwirrt. Er wird beschützt von einem magischen Schutzschild.



###mobs
actors.mobs.acidic.name=Ätzender Skorpion
actors.mobs.acidic.desc=Diese riesigen, spinnenartigen Dämonenkreaturen vermeiden den Nahkampf, sie ziehen es vor, verkrüppelnde, zahnbesetzte Stacheln aus weiter Entfernung zu schießen. Diese hier trieft vor zersetzendem Schlamm.

actors.mobs.albino.name=Albinoratte
actors.mobs.albino.desc=Dies ist eine seltene Gattung der Ratte, erkennbar an ihrem weißen Fell und ihren gezackten Zähnen.
actors.mobs.albino.discover_hint=Du könntest diesen Gegner zufällig in einer Dungeonregion entdecken.

actors.mobs.armoredstatue.name=gepanzerte Statue
actors.mobs.armoredstatue.desc=Wären da nicht diese beunruhigend rot leuchtenden Augen, könnte man annehmen, es handle sich nur um eine weitere Skulptur in diesem Dungeon.\n\nAugenscheinlich ist die Rüstung, die sie trägt, in hervorragender Verfassung. Robust und widerstandsfähig könnte es sehr schwer werden, sie zu besiegen.
actors.mobs.armoredstatue.desc_arm_wep=Die Statue an sich ist aus Stein, aber _%1$s_ und _%2$s_, die sie bei sich trägt, sehen sehr echt aus.

actors.mobs.bandit.name=verrückter Bandit
actors.mobs.bandit.desc=Ein Elite-Dieb, der sich durch seinen teureren violetten Umhang von anderen abhebt. Trotz seiner meisterhaften Diebeskünste kann auch er dem Schicksal des Wahnsinns nicht entgehen.\n\nWahnsinnsbanditen stehlen nicht nur deine Besitztümer, sondern können dich auch kurzzeitig blenden, verkrüppeln und vergiften! Allerdings tragen sie auch häufiger zusätzliche Beute bei sich als gewöhnliche Diebe.

actors.mobs.bat.name=Vampirfledermaus
actors.mobs.bat.desc=Diese flinken und hartnäckigen Höhlenbewohner sind weit gefährlicher, als es den Anschein hat. Durch jeden erfolgreichen Angriff gewinnen sie Lebensenergie, wodurch sie in der Lage sind, weit größere Gegner zu besiegen.

actors.mobs.bee.name=goldene Biene
actors.mobs.bee.desc_honey=Ungeachtet ihrer geringen Größe verteidigen Goldbienen ihr Heim bis aufs Blut. Diese aber ist besänftigt und scheint dir folgen zu wollen.
actors.mobs.bee.desc=Trotz der geringen Größe der goldenen Bienen, verteidigen sie erbittert ihre Behausung. Diese hier ist sehr wütend, bleib lieber auf Distanz.
actors.mobs.bee.discover_hint=Du kannst diese Einheit durch einen bestimmten Gegenstand entdecken.

actors.mobs.brute.name=Gnoll-Grobian
actors.mobs.brute.enraged=rasend
actors.mobs.brute.def_verb=geblockt
actors.mobs.brute.desc=Grobiane sind die größten, stärksten und die zähsten aller Gnolle. Wenn sie tödlich verletzt sind, verfallen sie in Raserei, wodurch sie kurzzeitig einen Schild erhalten und weit mehr Schaden zufügen.
actors.mobs.brute$bruterage.name=Grobian-Raserei
actors.mobs.brute$bruterage.desc=Dieser Gnoll-Grobian ist tödlich verletzt, doch er möchte dich mit in den Tod reißen!\n\nDieser Grobian stirbt, sobald sein Schild abgelaufen ist, entweder mit der Zeit, oder durch zugefügten Schaden. Bis dahin fügt der Grobian erheblich mehr Schaden zu, pass also auf!\n\nVerbleibende Züge mit Schild: %d.

actors.mobs.causticslime.name=ätzender Schleim
actors.mobs.causticslime.desc=Dieser Schleim scheint von der dunklen Magie, welche von der Tiefe ausgeht, verdorben worden zu sein. Er hat seine normale grüne Farbe verloren und ätzender Schlamm tropft von ihm herunter.
actors.mobs.causticslime.discover_hint=Du könntest diesen Gegner zufällig in einer Dungeonregion entdecken.

actors.mobs.crab.name=Kanalkrabbe
actors.mobs.crab.desc=Diese riesigen Krabben stehen in der Nahrungskette der Abwasserkanäle am höchsten. Sie sind extremst schnell und ihr dicker Panzer widersteht auch schweren Schlägen.

actors.mobs.crystalguardian.name=Kristallwächter
actors.mobs.crystalguardian.def_verb=geblockt
actors.mobs.crystalguardian.desc=Diese großen, kristallinen Wächter sehen fast wie Statuen aus, wären da nicht die hell strahlenden Augen. Das verhärtete Kristall, aus dem sie bestehen, führt dazu, dass sie zwar träge, aber sehr robust sind, es wäre also besser, _sie so lange wie möglich in ihrem Kristallnest schlafen zu lassen._\n\nAufgrund ihrer Größe bewegen sich Kristallwächter in eng umschlossenen Räumen sehr viel langsamer. Außerdem sind sie so widerstandsfähig, dass sie nicht endgültig getötet werden können. Man kann sie niederschlagen und so für eine Zeitlang ausschalten, aber nach einer Weile stehen sie einfach wieder auf.
actors.mobs.crystalguardian.discover_hint=Du könntest diesen Gegner in einer bestimmten Aufgabe entdecken.

actors.mobs.crystalmimic.name=Kristall-Mimik
actors.mobs.crystalmimic.ate=Das Mimik hat dein %s gefressen!
actors.mobs.crystalmimic.escaped=Das Kristall-Mimik ist entkommen!
actors.mobs.crystalmimic.desc=Mimiks sind magische Kreaturen, die jede beliebige Gestalt annehmen können. Im Dungeon nehmen sie fast immer die Gestalt einer Schatztruhe an, um damit arglose Abenteurer zu verführen.\n\nKristall-Mimiks sind schlauer als ihre gewöhnlichen Artgenossen und ziehen es vor, den Kampf zu vermeiden und dabei Gegenstände zu stehlen. Werden sie entdeckt, so versuchen sie, das Weite zu suchen, außerdem sind sie dazu in der Lage, mit ihren Angriffen Feinde an eine andere Position zu verschieben.

actors.mobs.crystalspire.name=Kristallspitze
actors.mobs.crystalspire.warning=Der Kristall vibriert, als du darauf schlägst. Wenn du so weitermachst, wird das Aufmerksamkeit auf dich ziehen...
actors.mobs.crystalspire.alert=Die Vibrationen werden stärker und rollen durch die ganze Höhle!
actors.mobs.crystalspire.desc=Diese gigantische Kristallspitze aus ultrahartem Kristall ist vermutlich der Ursprung all der eigenartigen kristallinen Kreaturen in dieser Höhle. Deine normalen Waffen sind dagegen kaum zu gebrauchen, du müsstest schon deine Spitzhacke verwenden, falls du sie zerstören willst.\n\n_Sieh zu, dass du vorbereitet bist, bevor du loslegst._ Einen derart mächtigen Kristall zu zertrümmern wird bestimmt eine Weile dauern, und wahrscheinlich wirst du dabei auch nicht ungestört bleiben. Die Kristallspitze selbst verfügt möglicherweise sogar über gewisse Mittel der Selbstverteidigung. _Vielleicht können die Angriffe der Kristallspitze gegen ihre eigenen Lakaien gerichtet werden._
actors.mobs.crystalspire.discover_hint=Du könntest diesen Gegner in einer bestimmten Aufgabe entdecken.

actors.mobs.crystalwisp.name=Kristallbüschel
actors.mobs.crystalwisp.beam_kill=Der Lichtstrahl hat dich getötet...
actors.mobs.crystalwisp.desc=Ein kleiner, zorniger fliegender Brocken aus gehärtetem Kristall, der ein helles Leuchten hervorbringt. Kristallbüschel sind nicht allzu stark, aber bei freier Schusslinie werden sie Lichtstrahlen auf dich abfeuern.\n\nKristallbüschel sind klein genug, um sich durch die verschiedenen Kristallspitzen zu bewegen, aber sie können nicht hindurchschießen.
actors.mobs.crystalwisp.discover_hint=Du könntest diesen Gegner in einer bestimmten Aufgabe entdecken.

actors.mobs.demonspawner.name=Dämonenschleuder
actors.mobs.demonspawner.on_death=Als die Dämonenschleuder stirbt, scheint die dämonische Energie hier nachzulassen.
actors.mobs.demonspawner.desc=Diese sich drehende Masse aus Zwergenfleisch produziert Schlitzer-Dämonen aus den gefallenen Zwergen dieses Gebiets. Ganz offensichtlich haben diese Dämonen kein Problem damit, jede nur erdenkliche Ressource gegen ihre Feinde einzusetzen.\n\nObwohl sie furchterregend aussehen, können Dämonenschleudern sich weder fortbewegen noch selbst verteidigen. Dabei macht es ihre erhebliche Masse einem aber schwer, sie schnell zu töten, und sie bringen bei Gefahr schneller Schlitzer-Dämonen hervor.\n\n_Die Dämonenschleudern scheinen mit einer zentralen Quelle der Dämonenenergie verbunden zu sein. Sie zu töten, könnte die Quelle schwächen._

actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=Der Stromschlag hat dich getötet...
actors.mobs.dm100.desc=Der DM-100 ist eine frühe Version der 'Verteidigungsmaschine' der Zwerge, er war dazu gedacht, die Zwergen-Bergleute in den Höhlen unter diesem Gefängnis zu beschützen. Der elektrische Schlag der Maschine erwies sich aber als zu schwach, also schenkte man sie der Menschenstadt darüber. Jahrelang wurden sie nicht eingesetzt, dann aber fanden sie ihren Weg in das Gefängnis, wo die Wärter sie anfangs als zu grausam befanden. Doch als die Gefangenen immer widerspenstiger wurden, wurden sie zu schließlich einer Notwendigkeit.

actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=Der DM-200 schießt einen Strahl aus toxischen Abgasen!
actors.mobs.dm200.desc=Der DM-200 ist die zweite Generation der 'Verteidigungsmaschine' der Zwerge, er war dazu gedacht, die Zwergen-Bergleute in den Höhlen und in der Stadt weiter unten zu beschützen. Diese Maschinen sind viel größer und sperriger als ihre Vorläufer, sie greifen mit ihren verheerenden hydraulischen Fäusten an.\n\nIhre Größe ist jedoch zugleich auch ihre Hauptschwäche, denn sie passen nicht in die engen Tunnel und Türöffnungen des Dungeons. Die Zwerge wogen diesen Mangel an Beweglichkeit des DM-200 dadurch auf, dass sie ihm die Fähigkeit gaben, seine toxischen Abgase in Richtung weit entfernter oder unerreichbarer Gegner auszustoßen.

actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=Der DM-201 feuert eine zersetzende Granate!
actors.mobs.dm201.desc=Die Zwerge experimentierten kurz damit, die geringe Beweglichkeit des DM-200 stärker zu betonen und schufen einige DM-Modelle, die völlig stationär sind. Der DM-201 ist ein nachgerüsteter DM-200, der als Wachturm ohne Bewegungsfähigkeit dient. Im Austausch für die nicht vorhandene Beweglichkeit haben die neuen Modelle deutlich mehr Haltbarkeit und Angriffskraft.\n\nDa die DM-201 keinen Motor haben, aus dem man Abgase ablassen könnte, haben die Zwerge sie stattdessen mit zersetzenden Gasgranaten ausgestattet! Die DM-201 gehen jedoch vorsichtig mit diesen Granaten um und feuern sie nur ab, wenn zwischen ihnen und ihrem Angreifer ausreichend Abstand ist.

actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=UNBEFUGTES PERSONAL FESTGESTELLT!
actors.mobs.dm300.shield=Der DM-300 zapft Energie aus frei liegenden Kabeln ab und baut einen Schild auf!
actors.mobs.dm300.charging=SCHADEN ERLITTEN! AKTIVIERE STROMMAST!
actors.mobs.dm300.charging_hint=DM-300 ist unverwundbar, solange er unter Strom steht.
actors.mobs.dm300.supercharged=ZERSTÖREN! ZERSTÖREN! ZERSTÖREN!
actors.mobs.dm300.charge_lost=STROMMAST BESCHÄDIGT! RÜCKGRIFF AUF LOKALE ENERGIE!
actors.mobs.dm300.pylons_destroyed=ALARM! INSTABILITÄT IM STROMNETZ FESTGESTELLT!
actors.mobs.dm300.rankings_desc=Durch DM-300 zermalmt
actors.mobs.dm300.def_verb=geblockt
actors.mobs.dm300.defeated=KRITISCHER SCHADEN! INITIIERE STILLLEGU-
actors.mobs.dm300.desc=DM-300 ist die größte und stärkste 'Verteidigungsmaschine', die die Zwerge je gebaut haben. Eine solch wunderbare Maschine lässt sich nur schwer herstellen, so dass die Zwerge insgesamt nur sehr wenige gebaut haben, die die Eingänge ihrer unterirdischen Hauptstadt bewachten.\n\nDiese Maschine ist mit Ventilen ausgestattet, durch die toxische Abgase ausgestoßen werden, und mit einem Hochleistungsbohrer, den sie zum Angriff und zum Aufbrechen des Bodens einsetzen kann. DM-300 kann sich außerdem mit dem Stromnetz verbinden, was seine Kräfte noch weiter steigert.
actors.mobs.dm300.desc_supercharged=DM-300 ist elektrisch geladen. In diesem Zustand ist er unverwundbar und bewegt sich mit doppelter Geschwindigkeit! Zudem kann er sich nun durch _soliden Fels_ graben, auch wenn er sich dabei langsamer bewegt.\n\nDM-300 in diesem Zustand anzugreifen ist sinnlos; jedoch _muss ihn etwas in dieser Höhle mit Energie versorgen._ Dies zu zerstören, könnte ihn schwächen.

actors.mobs.dwarfking.name=König der Zwerge
actors.mobs.dwarfking.notice=Wie kannst du es wagen! Du hast keine Ahnung, worin du dich hier einmischst!
actors.mobs.dwarfking.notice1=Der törichte alte König hat tatsächlich Abschaum wie dich hinterlassen! Nun gut, ich werde dich wissen lassen, wie sich der alte König gebeugt hat!
actors.mobs.dwarfking.lifelink_1=Ich benötige etwas von deiner Essenz, Sklave!
actors.mobs.dwarfking.lifelink_2=Blute für mich, Sklave!
actors.mobs.dwarfking.teleport_1=Mach sie fertig, Sklave!
actors.mobs.dwarfking.teleport_2=Halte sie beschäftigt, Sklave!
actors.mobs.dwarfking.wave_1=Genug! Erhebt euch, meine Sklaven!
actors.mobs.dwarfking.wave_2=Mehr! Blutet für euren König!
actors.mobs.dwarfking.wave_3=Das ist nutzlos! TÖTET SIE JETZT!
actors.mobs.dwarfking.enraged=Du kannst mich nicht töten, %s. ICH. BIN. UNSTERBLICH!
actors.mobs.dwarfking.losing=Nein! Das kannst du nicht tun... du hast keine Ahnung, was hierunter liegt...
actors.mobs.dwarfking.defeated=Du hast... uns allen das Verderben gebracht...
actors.mobs.dwarfking.rankings_desc=Fiel vor dem König der Zwerge
actors.mobs.dwarfking.desc=Vor vielen Jahren entdeckte einer der höchsten Zauberer am Hof der Zwerge Geheimnisse, die ihm unglaubliche Macht über Leben und Tod verliehen. Schon bald missbrauchte er diese Macht, unterjochte und verdarb seinesgleichen, seinen König, und schließlich jeden der Zwergenbürger. Seither ist er König, Gebieter über eine Legion untoter Vasallen.\n\nDer Zwergenkönig ist ein aggressiver Feind, der seine Gegner bevorzugt durch Horden seiner untoten Lakaien umzingelt und überwältigt.
actors.mobs.dwarfking$dkghoul.rankings_desc=Fiel vor dem König der Zwerge
actors.mobs.dwarfking$dkmonk.rankings_desc=Fiel vor dem König der Zwerge
actors.mobs.dwarfking$dkwarlock.rankings_desc=Fiel vor dem König der Zwerge
actors.mobs.dwarfking$dkgolem.rankings_desc=Fiel vor dem König der Zwerge

actors.mobs.ebonymimic.name=Ebenholz-Mimik
actors.mobs.ebonymimic.reveal=Da war ein Mimik!
actors.mobs.ebonymimic.hidden_name=verdächtiger Umriss
actors.mobs.ebonymimic.hidden_desc=Es scheint etwas da zu sein, aber es ist fast vollkommen durchsichtig.
actors.mobs.ebonymimic.desc=Mimiks sind magische Kreaturen, die jede beliebige Gestalt annehmen können. Im Dungeon nehmen sie fast immer die Gestalt einer Schatztruhe an, um damit arglose Abenteurer zu verführen.\n\nEbenholz-Mimiks sind außergewöhnlich starke Mimiks und verfügen über die Fähigkeit, nahezu unsichtbar zu werden. Sie lauern auf Dingen, mit denen Abenteurer wahrscheinlich interagieren werden, beinhalten aber auch eigene Beute.
actors.mobs.ebonymimic.discover_hint=Du kannst diesen Gegner durch ein bestimmtes Schmuckstück entdecken.

actors.mobs.elemental$fireelemental.name=Feuerelementar
actors.mobs.elemental$fireelemental.desc=Elementare sind chaotische Wesen, die häufig hervorgebracht werden, wenn starke okkulte Magie nicht richtig kontrolliert wird. Elementare haben nur geringe Intelligenz, sie sind üblicherweise mit einer bestimmten Art von Magie verbunden.\n\nFeuerelementare sind eine häufige Art von Elementaren, sie fügen durch Feuermagie Schaden zu. Im Nahkampf setzen sie ihr Ziel in Brand, und gelegentlich können sie auch Feuerschläge schießen.
actors.mobs.elemental$newbornfireelemental.name=neugeborenes Feuerelementar
actors.mobs.elemental$newbornfireelemental.charging=Das Elementar lädt sich auf!
actors.mobs.elemental$newbornfireelemental.desc=Elementare sind chaotische Wesen, die häufig hervorgebracht werden, wenn starke, okkulte Magie nicht richtig kontrolliert wird. Elementare haben nur geringe Intelligenz, sie sind üblicherweise mit einer bestimmten Art von Magie verbunden.\n\nDieses Feuerelementar ist frisch beschworen, aber trotzdem schon ziemlich gefährlich!
actors.mobs.elemental$newbornfireelemental.desc_boss=Weil es so stümperhaft beschworen wurde, kann dieses Elementar Feuer erst nach einem Zug Aufladung und nur in ungenauen Stößen verschießen.
actors.mobs.elemental$newbornfireelemental.desc_ally=Da dieses Elementar durch einen Zauberspruch beschworen wurde, hat es etwas mehr Kontrolle über seine Flamme. Es ist zu Fernangriffen nicht in der Lage, aber es kann Feinde durch Nahkampfangriffe in Flammen setzen.
actors.mobs.elemental$newbornfireelemental.discover_hint=Du könntest diesen Gegner in einer bestimmten Aufgabe entdecken.
actors.mobs.elemental$frostelemental.name=Frostelementar
actors.mobs.elemental$frostelemental.desc=Elementare sind chaotische Wesen, die häufig hervorgebracht werden, wenn starke okkulte Magie nicht richtig kontrolliert wird. Elementare haben nur geringe Intelligenz, sie sind üblicherweise mit einer bestimmten Art von Magie verbunden.\n\nFrostelementare sind eine häufige Art von Elementaren, sie schwächen ihre Feinde durch Kälte-Magie. Sie frieren ihr Ziel im Nahkampf oder durch einen gelegentlichen Fernkampfangriff ein. Ihre Magie ist in Wasser wesentlich effektiver.
actors.mobs.elemental$shockelemental.name=Schockelementar
actors.mobs.elemental$shockelemental.desc=Elementare sind chaotische Wesen, die häufig hervorgebracht werden, wenn starke okkulte Magie nicht richtig kontrolliert wird. Elementare haben nur geringe Intelligenz, sie sind üblicherweise mit einer bestimmten Art von Magie verbunden.\n\nSchockelementare sind eine weniger häufige Art von Elementaren, sie zerreißen ihre Feinde durch Stromschläge und Lichtblitze. Im Nahkampf teilen sie Stromschläge an nahe befindliche Feinde aus, und dem Primärziel fügen sie zusätzlichen Schaden zu, wenn sie sich im Wasser befinden. Mitunter können sie auch einen Fernangriff mittels Lichtblitz gegen ihr Ziel richten, welcher dieses zeitweilig blendet.
actors.mobs.elemental$chaoselemental.name=Chaoselementar
actors.mobs.elemental$chaoselemental.desc=Elementare sind chaotische Wesen, die häufig hervorgebracht werden, wenn starke okkulte Magie nicht richtig kontrolliert wird. Elementare haben nur geringe Intelligenz, sie sind üblicherweise mit einer bestimmten Art von Magie verbunden.\n\nChaoselementare sind eine seltene und gefährliche Art von Elementaren, die sich noch in keinem bestimmten Element stabilisiert haben. Beim Angriff entfesseln sie wilde und unvorhersehbare Magie.

actors.mobs.eye.name=Übles Auge
actors.mobs.eye.deathgaze_kill=Der Blick des Bösen hat dich getötet...
actors.mobs.eye.desc=Üble Augen sind schwebende Bälle aufgestauter dämonischer Energie. Sie besitzen Nahkampffähigkeiten, aber ihre wahre Stärke zeigt sich durch ihre magischen Kräfte.\n\nNachdem sie kurz Energie aufbauen verschießt ein Übles Auge einen verheerenden Energiestrahl, welcher _Todesblick_ genannt wird. Alles im Sichtfeld des Üblen Auges nimmt enormen Schaden. Kluge Abenteurer nehmen hier schnell Deckung.

actors.mobs.fetidrat.name=Verfaulende Ratte
actors.mobs.fetidrat.desc=Es ist offensichtlich, dass etwas mit dieser Ratte nicht stimmt. Ihr schmieriges, schwarzes Fell und die faulende Haut sind keineswegs mit den gesunden Ratten vergleichbar, welche du bisher gesehen hast. Ihre blassen, grünen Augen lassen sie besonders bedrohlich erscheinen.\n\nDie Ratte sondert eine übelriechende Wolke ab und der Gestank macht dich benommen, wenn du nahe herankommst.\n\nDunkler Schleim tropft Ihr aus dem Mundwinkel, welcher sich durch den Boden frisst. Es scheint sich aber in Wasser aufzulösen.
actors.mobs.fetidrat.discover_hint=Du könntest diesen Gegner in einer bestimmten Aufgabe entdecken.

actors.mobs.fungalcore.name=Pilzkern
actors.mobs.fungalcore.desc=Dieser gigantische Pilz muss wohl die Quelle für den Pilzbefall in dieser Höhle sein.

actors.mobs.fungalsentry.name=Pilzwache
actors.mobs.fungalsentry.desc=Dieser besonders hohe Pilz fungiert als Verteidigungsstellung für das grössere, in dieser Höhle lebende Pilzgeflecht.\n\nEr ist unbeweglich, aber er schiesst präzise Giftstösse gegen alles, was in seine Sicht gerät. Der Einschlag dieser Stösse ist recht schwach, _aber das Gift kann sich schnell zu tödlichen Mengen summieren._ Er kann zwar getötet werden, aber besser wäre es, ihn zu meiden.

actors.mobs.fungalspinner.name=Pilzspinner
actors.mobs.fungalspinner.desc=Dieser Höhlenspinner wird von einem parasitären Pilz kontrolliert. Seine Spinnenfaden- und Giftdrüsen wurden durch den Pilz überwuchert. Der Pilzspinner wird dich statt mit Netzen mit Grünzeug bespucken, dadurch die Pilzsporen verbreiten und dich eventuell verwurzeln. Er kann dich nicht vergiften, aber er erreicht erhebliche Schadensresistenz, wenn er sich direkt neben einem Pilz befindet.

actors.mobs.ghoul.name=Zwergen-Wiedergänger
actors.mobs.ghoul.desc=Als die Zwergengesellschaft allmählich zusammenbrach und der jetzige Zwergenkönig uneingeschränkte Macht an sich riss, wurde die Schwachen und die, welche ihm widerstanden, nicht gerade fein behandelt. Als der König immer besser mit der Handhabung dunkler Magie vertraut wurde, unterjochte er diese Zwerge seinem Willen, und nun bilden sie das Fußvolk seiner Armee.\n\nWiedergänger sind für sich genommen nicht besonders stark, aber sie bewegen sich in Gruppen und es ist sehr viel schwerer, sie zur Strecke zu bringen, wenn sie in großer Zahl auftreten. _Wenn ein Wiedergänger besiegt wurde, wird er einige Züge später wieder auferstehen, solange noch ein anderer Wiedergänger in der Nähe ist._

actors.mobs.gnoll.name=Gnoll-Späher
actors.mobs.gnoll.desc=Gnolle sind Hyänen-ähnliche Humanoide. Sie hausen in der Kanalisation dieses Dungeons und wagen sich manchmal hinauf an die Oberfläche, um diese zu überfallen. Gnoll-Späher sind normale Mitglieder ihres Stammes,; Sie sind nicht so stark wie Rohlinge und nicht so intelligent wie Schamanen.

actors.mobs.gnollexile.name=Verbrannter Gnoll
actors.mobs.gnollexile.desc=Dieser graue Gnoll trägt an seiner Schulter ein auffälliges Mal, das ihn als Verbannten kennzeichnet. Gnolle werden normalerweise wegen Missachtung der Disziplin oder Gesetzesverstößen aus der Gnoll-Gesellschaft verbannt. Stärke und Gerissenheit sind die Überlebenskünste eines Verbannten, und dieser hier scheint seinen Speer meisterhaft zu führen.
actors.mobs.gnollexile.desc_passive=_Der verbannte Gnoll zeigt derzeit keine Angriffsabsicht._ Er scheint nicht so kampflustig zu sein wie die anderen Gnolle hier; vielleicht hält er einen Kampf gegen dich für nicht lohnend. Du könntest ihn verschonen, aber das Bündel, das er trägt, könnte nützliche Gegenstände enthalten...
actors.mobs.gnollexile.desc_aggro=_Der verbannte Gnoll blickt wachsam umher._ Anscheinend hat ihn doch etwas dazu gebracht, anzugreifen. Vorsicht vor diesem Speer!
actors.mobs.gnollexile.seen_passive=Der Speer tragende Gnoll beobachtet dich wachsam, zeigt aber keine Angriffsabsicht.
actors.mobs.gnollexile.seen_aggro=Der Speer tragende Gnoll bereitet sich auf einen Angriff vor!

actors.mobs.gnollgeomancer.name=Gnoll-Geomant
actors.mobs.gnollgeomancer.warning=Der Geomant beginnt sich zu rühren. Vergewissere dich, dass du bereit bist, bevor du fortfährst!
actors.mobs.gnollgeomancer.alert=Der Geomant erwacht! Die gesamte Höhle scheint in Bewegung zu geraten, als er mit verrücktem Gelächter davonspringt!
actors.mobs.gnollgeomancer.rock_kill=Der fliegende Felsbrocken hat dich erschlagen...
actors.mobs.gnollgeomancer.rockfall_kill=Herunterfallende Felsbrocken haben dich erschlagen...
actors.mobs.gnollgeomancer.desc=Dieser beeindruckend große, ältere Gnoll muss wohl die Quelle der verschiedenen Erdreich bewegenden Magie sein, die hier wirkt, und er ist wohl auch der Anführer der ganzen Gnoll-Aktivität. Im Unterschied zu den hier rumorenden Gnoll-Pionieren ist der Geomant in seiner Magie gut bewandert, und er kann nicht durch geworfene oder fallende Steine verletzt werden. Dabei hat er aber keinerlei Möglichkeit für den Nahkampf.
actors.mobs.gnollgeomancer.desc_armor=Der Geomant ist derzeit in einer Schicht aus Steinrüstung eingekapselt. _Du musst nahe heran, um sie mit deiner Spitzhacke zu brechen, bevor du dem Geomanten Schaden zufügen kannst._
actors.mobs.gnollgeomancer.desc_armor_sapper=_Ein Gnoll-Pionier in der Nähe hält ein Gerät, das die Steinrüstung des Geomanten mit Energie versorgt. Momentan kannst du sie in keiner Weise beschädigen!_
actors.mobs.gnollgeomancer.desc_sleeping=Dieser beeindruckend große Gnoll-Schamane ist von einer Steinschicht umgeben und sieht beinahe wie eine Statue aus. Bei genauerem Hinsehen erkennt man, wie die Steine sich auf magische Weise im Einklang mit dem Atem des älteren Gnolls bewegen. Solange er auf diese Weise in Stein eingekapselt ist, kann er nicht verletzt werden, und derzeit schläft er buchstäblich wie ein Stein.\n\nDu kannst mit deiner Spitzhacke vermutlich durch die Steinschichten hacken, aber _mach dich auf einen Kampf gefasst, wenn du das tust._ Der Geomant muss wohl die Quelle der verschiedenen Erdreich bewegenden Magie sein, die hier wirkt, und er ist wohl auch der Anführer der ganzen Gnoll-Aktivität. _Es wäre keine schlechte Idee, die hier versprengten Gnolle zu besiegen, bevor du ihn angreifst._
actors.mobs.gnollgeomancer.discover_hint=Du könntest diesen Gegner in einer bestimmten Aufgabe entdecken.

actors.mobs.gnollguard.name=Gnoll-Wächter
actors.mobs.gnollguard.def_verb=Blocken
actors.mobs.gnollguard.spear_warn=Der Gnoll landet einen bösen Treffer mit der Spitze seines Speers!
actors.mobs.gnollguard.desc=Ein groß und stark aussehender Gnoll, bewaffnet mit Speer und Schild, aber ohne Helm. Diese Wächter sind wahrscheinlich Grobiane in Ausbildung, die man dazu abgestellt hat, die Mine vor eindringenden Wildtieren schützen zu helfen.\n\nDer Gnoll-Wächter ist stark genug, um den Speer mit einer Hand zu führen, aber er ist nicht sehr gut damit. _Er braucht genug offenes Gelände, um damit aus der Entfernung anzugreifen, und er verursacht wesentlich weniger Schaden, wenn du nah genug dran bist._
actors.mobs.gnollguard.desc_armor=_Ein Gnoll-Pionier in der Nähe hält ein Gerät, das diesem Wächter eine irdene Rüstung verleiht, die ihm zugefügten Schaden wesentlich verringert._
actors.mobs.gnollguard.discover_hint=Du könntest diesen Gegner in einer bestimmten Aufgabe entdecken.

actors.mobs.gnollsapper.name=Gnoll-Pionier
actors.mobs.gnollsapper.desc=Ein kleiner und schwacher, aber intelligenter Gnoll mit bleichem Fell und einem Ranzen voll von verschiedenen Geräten. Sie sind vermutlich hier, um Dunkelgold zu erkunden und zu schürfen und haben zu ihrem Schutz einen Wächter in der Nähe. Sie können zwar kämpfen, aber ihre Angriffe sind erbärmlich schwach, nicht stärker als die eines Gnoll-Spähers.\n\nAnstelle eines direkten Kampfes bevorzugen es die Pioniere, ihre verschiedenen Geräte einzusetzen, um so das Gestein für sich kämpfen zu lassen. Sie selbst sind nicht mit Erdreich bewegender Magie vertraut und werden daher umso mehr Gebrauch von ihren Geräten und Vorrichtungen machen. _Es dürfte eine Menge Wege geben, ihre Angriffe gegen sie selbst oder gegen ihren Wächter zu richten._
actors.mobs.gnollsapper.discover_hint=Du könntest diesen Gegner in einer bestimmten Aufgabe entdecken.

actors.mobs.gnolltrickster.name=Gnoll-Trickser
actors.mobs.gnolltrickster.desc=Eine merkwürdig ausschauende Kreatur, sogar unter den Gnollen. Er ist gebuckelt und trägt ein boshaftes Grinsen im Gesicht, bedacht darauf seine Schultertasche zu schützen.\n\nEine große Sammlung dürftig gefertigter Pfeile befindet sich in der Tasche, alle davon scheinen mit gefährlichen Substanzen versetzt worden zu sein.
actors.mobs.gnolltrickster.discover_hint=Du könntest diesen Gegner in einer bestimmten Aufgabe entdecken.

actors.mobs.goldenmimic.name=Gold-Mimik
actors.mobs.goldenmimic.desc=Mimiks sind magische Kreaturen, die jede Gestalt annehmen können, die sie wollen. In den Dungeons wählen sie fast immer die Gestalt einer Schatztruhe, um so arglose Abenteurer zu verführen.\n\nGold-Mimiks sind eine stärkere Art, sie versuchen, die stärksten Abenteurer anzugreifen. Sie haben bessere Schätze, sind aber auch viel stärker als normale Mimiks.

actors.mobs.golem.name=Golem
actors.mobs.golem.def_verb=geblockt
actors.mobs.golem.desc=Golems sind ein Versuch, die früheren Makel an den Zwergenmaschinen durch die neu entdeckte Verwendung von Magie durch die Zwerge zu korrigieren. Sie sind im Vergleich mit dem DM-300 wesentlich kompakter und effizienter, dabei immer noch sehr todbringend.\n\nGolems sind zu groß, um durch enge Passagen zu passen, aber die Zwerge haben ihnen zum Ausgleich magische Kräfte verliehen. Golems können sich selbst von einem Raum zum anderen teleportieren, und sie können Feinde zu sich heranteleportieren, wenn diese außer Reichweite sind.

actors.mobs.goo.name=Schleim
actors.mobs.goo.notice=GLUPP-GLUPP!
actors.mobs.goo.defeated=glupp.... glupp...
actors.mobs.goo.!!!=!!!
actors.mobs.goo.pumpup=Der Schleim bläht sich auf!
actors.mobs.goo.enraged=Wütend
actors.mobs.goo.gluuurp=GLUUUUPP!
actors.mobs.goo.rankings_desc=Vom Schleim absorbiert
actors.mobs.goo.desc=Es ist wenig über den Schleim bekannt. Es kann gut sein, dass er nicht mal eine Kreatur ist, sondern eher eine Ansammlung von abscheulichen Substanzen der Kanalisation, die irgendwie intelligent geworden sind. Unabhängig davon ist es die dunkle Magie die diesem Wesen erlaubt zu existieren\n\nSeine glibbrige Beschaffenheit ließ ihn viel dunkle Magie absorbieren, du fühlst schon eine Kälte nur, weil du hier bist. Wenn der Schleim dich mit seiner Energie angreifen kann, wirst du nicht lange leben.

actors.mobs.greatcrab.name=Große Krabbe
actors.mobs.greatcrab.noticed=Die Krabbe verteidigt sich mit Ihrer riesigen Scherenklaue.
actors.mobs.greatcrab.def_verb=geblockt
actors.mobs.greatcrab.desc=Diese Krabbe ist riesig, sogar im Vergleich mit anderen Kanalkrabben. Ihre blaue Schale ist von Rissen und Seepocken überzogen und weisen auf ein hohes Alter hin. Sie bewegt sich schwerfällig umher, dabei schafft Sie es eben gerade Ihr Gleichgewicht mit der enormen Scherenklaue zu bewahren. Obwohl diese Krabbe nur eine Scherenklaue hat, gleicht ihre Größe das leicht aus. Die Krabbe hält die Klaue vor sich, wenn immer sie einen Feind erblickt, damit schützt sie sich vor Angriffen hinter einem undurchdringlichen Schutzpanzer. Jedoch kann die Krabbe sich nicht gegen Angriffe verteidigen, die sie nicht kommen sieht oder die von mehreren Gegnern ausgehen.
actors.mobs.greatcrab.discover_hint=Du könntest diesen Gegner in einer bestimmten Aufgabe entdecken.

actors.mobs.guard.name=Gefängniswache
actors.mobs.guard.scorpion=Komm hierher!
actors.mobs.guard.def_verb=geblockt
actors.mobs.guard.desc=Einst Hüter des unterirdischen Gefängnisses, sind diese Wächter schon lange nicht mehr besser als die Insassen. Sie schleifen sich fort wie Zombies, hirnlos durch die Hallen streifend auf der Suche nach allem was dort nicht hingehört, so wie du!\n\nSie tragen Ketten um ihre Hüfte, möglicherweise um Feinde nah heranzuziehen.

actors.mobs.hermitcrab.name=Einsiedlerkrebs
actors.mobs.hermitcrab.def_verb=Blocken
actors.mobs.hermitcrab.desc=Aus irgendeinem Grund hat sich diese Abwasser-Krabbe entschieden, ein altes Fass auf ihren Kopf zu setzen! Das zusätzliche Gewicht verlangsamt ihre Bewegungen auf normales Tempo, verleiht ihr aber auch mehr Verteidigung. Du glaubst, etwas im Fass klappern zu hören...

actors.mobs.mimic.name=Mimik
actors.mobs.mimic.reveal=Diese Truhe ist ein Mimik!
actors.mobs.mimic.hidden_hint=An dieser Kiste scheint etwas eigenartig zu sein... Es wäre keine gute Idee, da heranzugehen und sie zu öffnen versuchen.
actors.mobs.mimic.desc=Mimiks sind magische Kreaturen, die jede Gestalt annehmen können, die sie wollen. In den Dungeons wählen sie fast immer die Gestalt einer Schatztruhe, um so arglose Abenteurer zu verführen.\n\nMimiks fügen heftige Bisse zu, aber sie haben oft mehr Schätze, als eine normale Truhe.
actors.mobs.mimic.discover_hint=Du kannst diesen Gegner in jeder Dungeonregion entdecken.

actors.mobs.necromancer.name=Nekromant
actors.mobs.necromancer.desc=Diese Schüler von dunklen Magiern haben sich im Gefängnis zusammengerottet, da es der perfekte Ort ist, wo sie ihre dunkle Kunst ausüben können.\n\nNekromanten werden Skelette beschwören und verzaubern, sodass sie für die Nekromanten kämpfen. Wird der Nekromant getötet, so stirbt auch das Skelett, das er beschworen hat.
actors.mobs.necromancer$necroskeleton.name=Skelett des Nekromanten
actors.mobs.necromancer$necroskeleton.desc=Dieses Skelett wurde von einem Nekromanten zum Leben erweckt. Es verhält sich wie ein normales Skelett und wird sterben, sobald der Nekromant, der es herbeigerufen hat, getötet wurde.

actors.mobs.mob.died=Du hörst etwas in der Ferne sterben.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Getötet von: %s
actors.mobs.mob.discover_hint=Du kannst diesen Gegner in einer Dungeonregion entdecken.

actors.mobs.monk.name=Zwergenmönch
actors.mobs.monk.def_verb=geblockt
actors.mobs.monk.parried=pariert
actors.mobs.monk.desc=Diese Mönche sind Fanatiker, welche sich dem Schutz ihres Königs durch körperliche Kraft verschrieben haben. Ihre Ergebenheit ist so groß, dass sie ihren Geist vollständig ihrem König unterstellt haben, und nun streifen sie in der Zwergenstadt wie geistlose Zombies umher.\n\nMönche verlassen sich einzig auf die Kunst des Nahkampfs, sie sind dazu in der Lage, ihre unbewaffneten Fäuste sowohl offensiv, als auch defensiv einzusetzen. Wenn sie sich konzentrieren, werden Mönche die nächste physische Attacke gegen sie abwehren, selbst, wenn diese normalerweise garantiert getroffen hätte. Mönche bauen schneller Konzentration auf, wenn sie sich bewegen, und im direkten Kampf langsamer.
actors.mobs.monk$focus.name=konzentriert
actors.mobs.monk$focus.desc=Dieser Mönch ist vollständig auf sein Ziel konzentriert und scheint dessen Bewegungen vorauszuahnen, bevor diese passieren.\n\nWährend er so konzentriert ist, wird die nächste physische Attacke gegen diesen Charakter garantiert fehlgehen, ganz egal, unter welchen Bedingungen sie stattfindet. Die Abwehr dieser Attacke wird die Konzentration des Mönchs aufbrauchen, und er wird sie wieder aufbauen müssen, um eine weitere Attacke abzuwehren. Mönche bauen schneller Konzentration auf, wenn sie sich bewegen.

actors.mobs.phantompiranha.name=Phantom-Piranha
actors.mobs.phantompiranha.teleport_away=Der Phantom-Piranha teleportiert sich davon...
actors.mobs.phantompiranha.desc=Phantom-Piranhas sind eine seltene Piranha-Art mit magischen Fähigkeiten und unheimlich transparenten Körpern. Wenn sie angegriffen werden, können sie sich teleportieren - entweder in Sicherheit, oder in Angriffsreichweite zu ihrem Gegner!\n\nSie zu bekämpfen ist zwar ermüdend, aber ihr Fleisch ist für seine magischen Eigenschaften berühmt.

actors.mobs.piranha.name=Riesenpiranha
actors.mobs.piranha.desc=Diese fleischfressenden Fische sind keine natürlichen Bewohner unterirdischer Gewässer. Sie wurden speziell gezüchtet, um überflutete Schatzkammern zu beschützen.
actors.mobs.piranha.discover_hint=Du kannst diesen Gegner in jeder Dungeonregion entdecken.

actors.mobs.pylon.name=Strommast
actors.mobs.pylon.desc_inactive=Ein Strommast, welcher dazu gedacht ist, die Elektrizität zu regeln, die die Maschinen hier in dieser Gegend versorgt.\n\nDieser Mast ist derzeit nicht aktiv und gegen Schaden immun.
actors.mobs.pylon.desc_active=Ein Strommast, welcher dazu gedacht ist, die Elektrizität zu regeln, die die Maschinen hier in dieser Gegend versorgt. Dieser Mast summt geradezu von der elektrischen Energie, das muss es wohl sein, woher der DM-300 seine Superladung hat!\n\nIn diesem Zustand sind die Strommasten verwundbar, jedoch werden sie im Uhrzeigersinn Stromschläge in die umgebenden Felder schießen. Aufgrund ihrer massiven metallischen Bauweise können Strommasten eine große Menge an Schaden absorbieren.

actors.mobs.rat.name=Beutelratte
actors.mobs.rat.desc=Beutelratten sind aggressive, aber recht schwache Bewohner der Kanalisation. Sie können unangenehm zubeißen, sind jedoch nur in größeren Gruppen lebensbedrohlich.

actors.mobs.ripperdemon.name=Schlitzer-Dämon
actors.mobs.ripperdemon.leap=Der Schlitzer-Dämon bereitet sich auf den Sprung vor!
actors.mobs.ripperdemon.desc=Diese schrecklichen Kreaturen sind das Ergebnis von dämonischen Mächten, die die vielen Zwergenkadaver in dieser Region für ihre Zwecke nutzen. Schlitzer-Dämonen sind abgemagerte schaurige Kreaturen, die Zwergen ähneln, aber mit gebrochenen Körpern und langen scharfen Krallen aus Knochen.\n\nSchlitzer-Dämonen sind nicht besonders widerstandsfähig, aber sie sind wendig und gefährlich. Sie sind in der Lage, große Entfernungen zu überspringen, um Ziele schnell zu erreichen, bevor sie sie mit ihren Klauen aufspießen.

actors.mobs.rotheart.name=Fäulnisherz
actors.mobs.rotheart.desc=Die Frucht der Fäulnispflanze ist sehr einzigartig. Anstatt zu verrotten und Nährstoffe herzugeben, wächst diese Frucht, verhärtet sich und umschließt den Samen. Sie schützt damit die inneren Organe, welche in der Frucht wachsen. Diese große Kugelform bezeichnet man als das Herz einer ausgewachsenen Fäulnispflanze.
actors.mobs.rotheart.discover_hint=Du könntest diesen Gegner in einer bestimmten Aufgabe entdecken.

actors.mobs.rotlasher.name=Fäulnispeitsche
actors.mobs.rotlasher.desc=Die Fäulnispeitsche ist Teil der Wurzelstruktur einer reifen Faulbeerenpflanze und zugleich ihr wichtigstes Verteidigungsmittel. Peitschen sind blind und stecken fest im Boden, greifen aber jede Bedrohung, die ihnen nahe kommt, heftig an. Wenn es keine Feinde in der Nähe gibt, stehen sie bewegungslos und versuchen, sich in die umgebende Vegetation einzufügen.
actors.mobs.rotlasher.discover_hint=Du könntest diesen Gegner in einer bestimmten Aufgabe entdecken.

actors.mobs.scorpio.name=Skorpion
actors.mobs.scorpio.desc=Diese riesigen, spinnenartigen Dämonenkreaturen vermeiden den Nahkampf, sie ziehen es vor, verkrüppelnde, zahnbesetzte Stacheln aus weiter Entfernung zu schießen.

actors.mobs.senior.name=Ältesten-Mönch
actors.mobs.senior.desc=Diese Mönche sind Fanatiker, welche sich dem Schutz ihres Königs durch körperliche Kraft verschrieben haben. Ihre Ergebenheit ist so groß, dass sie ihren Geist vollständig ihrem König unterstellt haben, und nun streifen sie in der Zwergenstadt wie geistlose Zombies umher.\n\nDieser Mönch beherrscht den Nahkampf, er kann in Bewegung viel schneller an Konzentration gewinnen als normale Mönche. Wenn sie sich konzentrieren, werden Mönche die nächste physische Attacke gegen sie abwehren, selbst, wenn diese normalerweise garantiert getroffen hätte. Mönche bauen schneller Konzentration auf, wenn sie in Bewegung sind, und im direkten Kampf langsamer.

actors.mobs.shaman.name=Gnoll-Schamane
actors.mobs.shaman.bolt_kill=Der Zauberblitz hat dich getötet...
actors.mobs.shaman.desc=Gnollschamanen sind intelligente Gnolle, die Kampfmagie nutzen können und so ihre fehlende Stärke aufwiegen. Sie haben in der Gnoll-Gesellschaft trotz ihrer größeren Schwäche eine sehr ehrbare Stellung.
actors.mobs.shaman$redshaman.spell_desc=Dieser Schamane trägt eine rote Maske, er wird Magie einsetzen, die zeitweise _deine Angriffskraft schwächt._
actors.mobs.shaman$blueshaman.spell_desc=Dieser Schamane trägt eine blaue Maske, er wird Magie einsetzen, die zeitweise _den dir zugefügten Schaden erhöht._
actors.mobs.shaman$purpleshaman.spell_desc=Dieser Schamane trägt eine violette Maske, er wird Magie einsetzen, die zeitweise _deine Zielgenauigkeit und Fähigkeit zum Ausweichen herabsetzt._

actors.mobs.armoredbrute.name=gepanzerter Grobian
actors.mobs.armoredbrute.desc=Die ältesten unter den Gnoll-Grobianen tragen oft starke Rüstungen, um ihren Status zur Schau zu stellen. Die Rüstung macht diese Grobiane wesentlich unempfindlicher gegen physischen Schaden, und ihre bessere Disziplin bedeutet, dass sie wesentlich länger in Raserei verfallen sein können, bevor sie an ihren Wunden zugrunde gehen.

actors.mobs.skeleton.name=Skelett
actors.mobs.skeleton.explo_kill=Du wurdest durch eine Knochenexplosion getötet...
actors.mobs.skeleton.def_verb=geblockt
actors.mobs.skeleton.desc=Skelette bestehen aus den Knochen glückloser Abenteurer und der Insassen des Gefängnisses, welche durch die Ausstrahlung dunkler Magie aus den tieferen Ebenen angetrieben werden. Nachdem sie genug Schaden genommen haben, lösen sie sich in einer Knochenexplosion auf. Knochensplitter aus dieser Explosion fügen allem in der Nähe Schaden zu, aber Rüstungen schwächen diesen Schaden sehr wirksam ab.

actors.mobs.slime.name=Schleim
actors.mobs.slime.def_verb=geblockt
actors.mobs.slime.desc=Schleime sind eigenartige, leicht magische Kreaturen mit einem gummiartigen äußeren Körper und einem flüssigen Kern. Die Abwassersysteme der Stadt versorgen sie mit reichlich Wasser und Nahrung.\n\nWegen ihrer elastischen äußeren Membran ist es schwierig, einem Schleim mehr als _6 Schaden_ pro Attacke zuzufügen.

actors.mobs.snake.name=Kanalschlange
actors.mobs.snake.hint=Versuche, den Suchknopf auf einer Schlange anzuwenden, um zu erfahren, wie man sie bekämpfen kann.
actors.mobs.snake.desc=Diese übergroßen Schlangen können sich schnell um Angriffe herumschlängeln, was es ziemlich schwer macht, sie zu treffen. Allerdings können magische oder Überraschungsangriffe sie kalt erwischen.\n\nDu kannst einen Überraschungsangriff ausführen, indem du angreifst, während du nicht im Sichtfeld der Schlange bist. Eine Möglichkeit wäre, dich von ihr durch eine Tür jagen zu lassen und dann _zuzuschlagen, wenn die Schlange durch die Tür kommt._

actors.mobs.spectralnecromancer.name=Geister-Nekromanten
actors.mobs.spectralnecromancer.desc=Skelette sind zwar das tägliche Brot eines Nekromanten, aber manche ziehen es vor, sich mit anderen, weniger körperlichen Dienern zu beschäftigen. Geister-Nekromanten haben sich für Geister als Diener ihrer Wahl entschieden!\n\nEinzelne Geister sind nicht so stark wie Skelette, aber diese Nekromanten scheuen sich nicht davor, gleich einen ganzen Haufen von ihnen zu beschwören!

actors.mobs.spinner.name=Höhlenspinner
actors.mobs.spinner.desc=Diese grünlichen, behaarten Höhlenspinnen versuchen, den direkten Kampf zu vermeiden. Stattdessen ziehen sie es vor, in einer Entfernung abzuwarten, während ihre Opfer in dem von ihnen abgesonderten Spinnennetz gefangen sind und langsam an ihrem giftigen Biss sterben. Sie sind dazu in der Lage. ihre Netze über große Entfernungen zu verschießen, und versuchen, jeden Weg, den ihr Opfer nimmt, zu blockieren.

actors.mobs.statue.name=Belebte Statue
actors.mobs.statue.def_verb=geblockt
actors.mobs.statue.desc=Man könnte denken, dies sei nur eine weitere unbewegliche Statue dieses Dungeons, aber die rot leuchtenden Augen verraten sie.
actors.mobs.statue.desc_weapon=Die Statue an sich ist aus Stein, aber ihr _%s_, das sie bei sich trägt, sieht sehr echt aus.
actors.mobs.statue.discover_hint=Du kannst diesen Gegner in jeder Dungeonregion entdecken.

levels.minigame.extraction.mobs.vaultarmoredstatue.name=Kammereisenwächter
levels.minigame.extraction.mobs.vaultarmoredstatue.desc=Dieser gepanzerte Konstrukt wurde erschaffen, um die geschlossene Schatzkammer zu bewachen. Anders als gewöhnliche Statuen schläft er nicht, sondern ist bereits zu Beginn der Extraktion erwacht und sucht aktiv nach Eindringlingen.
levels.minigame.extraction.mobs.vaultarmoredstatue.desc_arm_wep=Der Eisenwächter trägt _%1$s_ und ist mit _%2$s_ gerüstet.

levels.minigame.extraction.mobs.veilbreakereye.name=Schleierbrecher-Blick
levels.minigame.extraction.mobs.veilbreakereye.desc=Dieser böse Blick kann die feinen Störungen erfassen, die von verborgenen Wesen verursacht werden. Befindet sich ein unsichtbarer Held in seinem Sichtfeld, versucht er jede Runde, den Schleier der Unsichtbarkeit zu zerreißen; je näher der Held, desto höher die Wahrscheinlichkeit der Entdeckung. Nach vollständiger Aufladung feuert er keinen einfachen Laser mehr ab, sondern verschießt Schattenschaden in einem 60-Grad-Kegel.
levels.minigame.extraction.mobs.veilbreakereye.reveal=Der Schleierbrecher-Blick hat dich entdeckt. Der schützende Schleier wurde von ihm zerrissen!

levels.minigame.extraction.mobs.chronosuccubus.name=Zeitdiebin-Sukkubus
levels.minigame.extraction.mobs.chronosuccubus.desc=Diese Sukkubus ernährt sich nicht nur von Emotionen, sondern auch von gestohlener Zeit. Wenn du dich in ihrem Sichtfeld mit Zeitstopp bewegst, kann sie den Zeitstopp sofort kollabieren lassen; je weniger Runden übrig sind, desto höher ist die Erfolgswahrscheinlichkeit.
levels.minigame.extraction.mobs.chronosuccubus.break_time=Die Zeitdiebin-Sukkubus hat dir den letzten verbleibenden Stillstand gestohlen!

levels.minigame.extraction.mobs.deferredscorpio.name=Verzögerter Skorpion
levels.minigame.extraction.mobs.deferredscorpio.desc=Dieser Magieskorpion feuert alle sechs normalen Angriffsintervalle einen Stachel ab. Jeder Stachel verursacht geringen Schaden, aber die schnelle Schussfolge reicht aus, um unvorsichtige Ziele zu überwältigen. Bei Treffern besteht eine 20% Chance, den eigenen Rüstungswurf des Ziels zuzufügen. Sein ursprüngliches lähmendes Gift bleibt ebenfalls wirksam.

levels.minigame.extraction.mobs.raidkeycarrier.name=Kristallschlüsselträger
levels.minigame.extraction.mobs.raidkeycarrier.desc=Dieser Feind trägt einen Kristallschlüssel, der für die Evakuierung benötigt wird. Besiege ihn, um den Schlüssel zu erhalten.

actors.mobs.succubus.name=Succubus
actors.mobs.succubus.desc=Succubi sind Dämonen, die den Verstand ihrer Opfer manipulieren. Dieser hier hat die eine blasse, gotisch anmutende Menschengestalt angenommen, vielleicht, um Zwergen-Hexer anzuziehen?\n\nSuccubi können, wenn sie angreifen, ihren Feind zeitweilig betören, wodurch der Feind nicht mehr in der Lage ist, sie direkt anzugreifen. Wenn Succubi einen betörten Feind angreifen, stehlen sie ein wenig Lebenskraft von ihm.

actors.mobs.swarm.name=Fliegenschwarm
actors.mobs.swarm.desc=Der tödliche Schwarm Fliegen summt verärgert. Jeder nicht-magischer Angriff wird ihn in zwei kleinere aber genau so gefährliche Schwärme teilen.

actors.mobs.tengu.name=Tengu
actors.mobs.tengu.notice_gotcha=Hab' ich dich, %s!
actors.mobs.tengu.interesting=Machen wir das Ganze interessanter...
actors.mobs.tengu.notice_have=Jetzt hab' ich dich, %s!
actors.mobs.tengu.defeated=Endlich frei...
actors.mobs.tengu.rankings_desc=Von Tengu gemeuchelt
actors.mobs.tengu.desc=Ein berüchtigter und geheimnisumwobener Meuchelmörder, benannt nach der Maske, welche auf sein Gesicht transplantiert wurde.\n\nDer Tengu wird von großen Schnallen an seinen Handgelenken und Knien unten gehalten, aber seine Ketten scheint er schon vor langer Zeit losgeworden zu sein.\n\nEr wird versuchen, Fallen, trügerische Magie und Präzisionsangriffe zu verwenden, um das letzte Hindernis zu eliminieren, das zwischen ihm und seiner Flucht steht: dich.

actors.mobs.tengu$bombability$bombblob.desc=Eine Wolke aus überhitztem Rauch bläht sich hier auf. Vorsicht, sie wird explodieren!
actors.mobs.tengu$bombability$bombitem.name=Rauchbombe
actors.mobs.tengu$bombability$bombitem.cant_pickup=Sie klebt am Boden, du kannst sie nicht bewegen!
actors.mobs.tengu$bombability$bombitem.desc=Tengu hat eine seltsame Rauchbombe an diese Stelle geworfen, aus der dicker, heißer Rauch austritt. Sie macht laute tickende Geräusche, ganz wie ein Countdown zu einer Explosion!\n\nDie Bombe hat sich mit dem Boden verbunden, du kannst sie nicht aufheben.

actors.mobs.tengu$fireability$fireblob.desc=Tengu hat ein feines Pulver geworfen, welches hier auf Dampf trifft. Es wird sich entzünden!

actors.mobs.tengu$shockerability$shockerblob.desc=Hier steht alles unter Strom. Alles, was auf diesem Feld steht, wird beim nächsten Zug einen Stromschlag abbekommen!
actors.mobs.tengu$shockerability$shockeritem.name=Schocker
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=Zu viel Elektrizität geht davon aus. Du kannst es nicht anfassen!
actors.mobs.tengu$shockerability$shockeritem.desc=Tengu hat hier eine eigenartige Maschine aufgebaut, die aus Teilen von DM-100 zu bestehen scheint. Aus der Maschine sprühen elektrische Funken, dabei scheint es aber, dass sie einem vorhersagbaren Muster folgen.\n\nWegen der ganzen Elektrizität darum gibt es keine Möglichkeit, sie aufzuheben.

actors.mobs.thief.name=verrückter Dieb
actors.mobs.thief.stole=Der Dieb hat %s von dir gestohlen!
actors.mobs.thief.carries=\n\nDer Dieb trägt ein _%s._ Gestohlen, versteht sich.
actors.mobs.thief.escapes=Der Dieb konnte mit deinem %s entkommen!
actors.mobs.thief.desc=Obwohl diese Insassen aus ihren Zellen befreit sind, ist dieser Ort immer noch ihr Gefängnis. Mit der Zeit hat dieser Ort sie sowohl ihres Verstands als auch ihrer Freiheit beraubt. Diese wahnwitzigen Diebe und Banditen haben schon vor langer Zeit vergessen, wer sie sind und warum sie stehlen.\n\nDiese Feinde tendieren dazu, zu stehlen und wegzulaufen, anstatt zu kämpfen. Stelle sicher, sie im Blick zu behalten, oder du wirst deine gestohlenen Dinge vielleicht nie wieder finden.

actors.mobs.tormentedspirit.name=gequälte Seele
actors.mobs.tormentedspirit.desc=Gequälte Seelen sind eigentlich gutmütige Geister, die allerdings verflucht wurden. Solange sie verflucht sind, werden sie genau wie Spuk alles und jeden angreifen, und sind dazu noch stärker!\n\nEs könnte möglich sein, den Fluch durch Benutzung des richtigen Gegenstandes in unmittelbarer Nähe der gequälten Seele zu lösen. Sicherlich wird die Seele dafür dankbar sein...
actors.mobs.tormentedspirit.thank_you=Danke...

actors.mobs.warlock.name=Zwergenhexer
actors.mobs.warlock.bolt_kill=Der Schattenblitz hat dich getötet...
actors.mobs.warlock.desc=Als das Interesse der Zwerge von der Ingenieurskunst zur Magie wechselte, kamen die Hexer in der Stadt an die Macht. Sie begannen mit Elementarmagie, wandten sich aber schnell der Dämonologie und Totenbeschwörung zu. Der stärkste dieser Hexer besetzte den Thron in der Zwergenstadt, und seinen Kumpanen wurde es gestattet, weiterhin ihre dunkle Magie zu praktizieren, solange sie ihm ihren freien Willen unterordnen.\n\nDiese Hexer besitzen starke, zerstörerische Magie, und sie sind dazu in der Lage, zeitweise die Verbesserungsmagie an deiner Ausrüstung außer Kraft zu setzen. Je mehr ein Gegenstand verbessert ist, desto stärker wird er davon betroffen sein.

actors.mobs.wraith.name=Spuk
actors.mobs.wraith.desc=Dies ist ein rachsüchtiges Gespenst eines Sünders, dessen Grabstätte gestört wurde. Als ätherisches Wesen ist es sehr schwer ihn mit gewöhnlichen Waffen zu treffen.
actors.mobs.wraith.discover_hint=Du kannst diesen Gegner in jeder Dungeonregion entdecken.

actors.mobs.yogdzewa.name=Yog-Dzewa
actors.mobs.yogdzewa.notice=ICH. SEHE. DICH.
actors.mobs.yogdzewa.notice1=Komm  zu  dei-nem  Schöp-fer
actors.mobs.yogdzewa.darkness=Die Dunkelheit rückt näher…
actors.mobs.yogdzewa.hope=DEINE. HOFFNUNG. IST. EINE. ILLUSION!
actors.mobs.yogdzewa.defeated=…
actors.mobs.yogdzewa.rankings_desc=Von Yog-Dzewa verschlungen
actors.mobs.yogdzewa.desc=Yog-Dzewa ist ein alter Gott; ein großes Ungeheuer, dessen Einfluss in die Welten der Sterblichen reicht und sie verschlingt, um sein endloses Wachstum zu nähren. Die Zwerge müssen die Aufmerksamkeit dieses kosmischen Grauens erregt haben, als sie mit dunkler Magie experimentierten, und versuchen seitdem, es unter Verschluss zu halten.\n\nYog-Dzewa stammt aus einer Dimension von rohem magischem Chaos und kann seine wahre Form nicht in diese Welt bringen. Stattdessen hat es Avatare erschaffen und dämonische Lakaien beschworen, die hier seine Befehle ausführen.\n\nDieses riesige Auge ist der Brennpunkt von Yog-Dzewas Macht in dieser Welt. Während das Auge selbst unbeweglich ist, ist es in der Lage, mächtige Strahlen dämonischer Magie abzufeuern und eine Vielzahl von Lakaien zu beschwören, die ihn unterstützen.
actors.mobs.yogdzewa.desc_spawners=Du kannst Wellen dämonischer Energie spüren, die von den weiter oben liegenden Ebenen zum Auge strömen. Yog-Dzewa muss diese Energie von Kreaturen, die du dort oben am Leben gelassen hast, beziehen. _Yog wird diese Energie nutzen, um stärkere Lakaien zu beschwören!_
actors.mobs.yogdzewa$larva.name=Gotteslarve
actors.mobs.yogdzewa$larva.rankings_desc=Verschlungen von Yog-Dzewa
actors.mobs.yogdzewa$larva.desc=Diese winzigen Ausgeburten von Yog-Dzewa sind einfache Lakaien, die leicht zu produzieren sind. Obwohl sie einzeln schwach sind, können sie schnell herbeigerufen und in der Masse überwältigend werden.
actors.mobs.yogdzewa$yogripper.rankings_desc=Verschlungen von Yog-Dzewa
actors.mobs.yogdzewa$yogeye.rankings_desc=Verschlungen von Yog-Dzewa
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Verschlungen von Yog-Dzewa

actors.mobs.yogfist.invuln_warn=Diese Faust ist in der Nähe des Auges unverwundbar!
actors.mobs.yogfist.rankings_desc=Verschlungen von Yog-Dzewa
actors.mobs.yogfist.desc=Diese Faust ist ein Bestandteil von Yog-Dzewas Macht. Die Fäuste sind mit seiner Macht verbunden und sind unverwundbar, wenn sie sich in der Nähe des Auges befinden.
actors.mobs.yogfist$burningfist.name=brennende Faust
actors.mobs.yogfist$burningfist.desc=Diese Faust ist aus chaotischer, feuriger Magie geformt. Während sie sich bewegt, wird sie ständig die Umgebung in Brand setzen. Sie ist auch in der Lage, Schüsse mit feuriger Kraft abzufeuern, die beim Aufprall Flammen verbreiten.\n\nDie Fähigkeit der Faust, Flammen zu verbreiten, wird in der Nähe von Wasser unterdrückt, aber ihre Hitze ist so groß, dass das Wasser um sie herum nach kurzer Zeit verdampft!
actors.mobs.yogfist$soiledfist.name=Faust des Erdreichs
actors.mobs.yogfist$soiledfist.desc=Diese Faust ist aus chaotischer irdener Magie geformt. Wenn sie sich bewegt, wird sie ständig Pflanzen um sich herum sprießen lassen. Sie kann auch konzentrierte Erdstöße abschießen, die ihr Ziel in schnell wachsende Reben und Wurzeln fesseln!\n\nDie Faust bezieht Kraft aus diesem Pflanzenleben und widersteht einer gewissen Menge Schaden, je nachdem, wie viel hohe oder zerfurchte Vegetation es in ihrer Nähe gibt!
actors.mobs.yogfist$rottingfist.name=Faust der Fäulnis
actors.mobs.yogfist$rottingfist.desc=Diese Faust ist aus lebendiger Fäulnis geformt. Sie ist eine hoch aufragende Masse aus verwesendem Fleisch, die im Nahkampf ätzenden Schleim und im Fernkampf giftige Gase absondern kann. Schlimmer noch, die große Masse der Faust lässt sie bluten, anstatt direkt Schaden zu nehmen.\n\nMit Wasser kann der Schleim abgewaschen werden, aber die Faust ist auch in der Lage, Wasser zu absorbieren, um sich selbst zu heilen! Außerdem führt eine Beschädigung der Faust, während sie blutet, dazu, dass sich die Blutung zwar erneuert, aber nicht vergrößert!
actors.mobs.yogfist$rustedfist.name=verrostete Faust
actors.mobs.yogfist$rustedfist.desc=Diese Faust ist aus lebendem Metall geformt. Es ist eine hoch aufragende Masse aus sich wandelndem Metall, die mächtige Nahkampfangriffe hat und ihre Ziele aus der Entfernung lahmlegen kann. Aufgrund ihrer enormen Masse nimmt die Faust jeden Schaden, der ihr zugefügt wird, nicht sofort, sondern über einen längeren Zeitraum auf.\n\nDie Faust ist jedoch unflexibel und kann sich nicht in enge Gänge zwängen. Dazu kommt, dass sie Schaden zwar verlangsamt aufnehmen kann, der verzögerte Schaden aber weiter zunehmen wird, wenn die Faust mehrmals getroffen wird.
actors.mobs.yogfist$brightfist.name=Faust des Lichts
actors.mobs.yogfist$brightfist.teleport=Die Faust teleportiert sich mit einem Lichtblitz davon, der dich erheblich blendet!
actors.mobs.yogfist$brightfist.desc=Diese Faust ist aus reiner Lichtenergie geformt. Sie ist in der Lage, bei jedem Zug kräftige Strahlen aus gleißendem Licht zu schießen! Diese Strahlen werden dich vorübergehend blenden und zusätzlich schweren Schaden anrichten. Die Faust ist auch in der Lage, die Arena kurz in blendendes Licht zu tauchen, um zu entkommen!\n\nDie Faust hat jedoch keine besonderen Fähigkeiten, die sie im Nahkampf einsetzen könnte.
actors.mobs.yogfist$darkfist.name=Faust der Dunkelheit
actors.mobs.yogfist$darkfist.teleport=Die Faust teleportiert sich in einem Strudel der Dunkelheit davon, wodurch deine Lichtquelle erlischt!
actors.mobs.yogfist$darkfist.desc=Diese Faust besteht aus purer, dunkler Energie. Sie kann jeden Zug mächtige Strahlen dunkler Magie ausstrahlen! Abgesehen davon, dass sie schweren Schaden verursachen, schwächen diese Strahlen deine Lichtquelle. Die Faust versteht es auch, das Gebiet kurz in Dunkelheit zu hüllen, um zu entkommen!\n\nDiese Faust hat allerdings keine besonderen Fähigkeiten für den Nahkampf.


actors.char.kill=%s hat dich getötet...
actors.char.defeat=du hast besiegt: %s.
actors.char.def_verb=ausgewichen
actors.char.invulnerable=unverwundbar
actors.char.immune=immun

#新增天赋


actors.hero.talent.aquatic_recover.title=Wasserregeneration
actors.hero.talent.aquatic_recover.desc=_+1:_ Im Wasser alle _10 Runden_ _1 Lebenspunkt_ wiederherstellen.\n\n_+2:_ Im Wasser alle _5 Runden_ _1 Lebenspunkt_ wiederherstellen.
actors.hero.talent.aquatic_recover.comment=Wenn der Held längere Zeit keine Stufe aufgestiegen ist, stoppt die Regeneration allmählich.

actors.hero.talent.pump_attack.title=Aufladungsangriff
actors.hero.talent.pump_attack.desc=_+1：_Nahkampfangriffe haben eine _20%ige Chance_, _2-fachen Schaden_ zu verursachen.\n\n_+2：_Nahkampfangriffe haben eine _20%ige Chance_, _3-fachen Schaden_ zu verursachen.
actors.hero.talent.pump_attack.comment=
actors.hero.talent.pump_attack.glog=Dieser Schlag sammelt sehr viel Kraft und verursacht mehrfachen Schaden.

actors.hero.talent.ooze_attack.title=Schlammhaftung
actors.hero.talent.ooze_attack.desc=_+1：_Nahkampfangriffe haben eine _50%ige Chance_, den Effekt _15 Runden Schlamm_ und _10 Punkte Verzögerungsschaden_ zu verursachen.\n\n_+2：_Nahkampfangriffe haben eine _75%ige Chance_, den Effekt _15 Runden Schlamm_ und _10 Punkte Verzögerungsschaden_ zu verursachen.
actors.hero.talent.ooze_attack.comment=

actors.hero.talent.surprise_throw.title=Überraschungswurf
actors.hero.talent.surprise_throw.desc=Nach Aufwertung dieser Fertigkeit erhalten alle Wurfwaffen die Shuriken-Eigenschaft (Wurf nach Bewegung verbraucht keine Runde). Der verursachte Schaden steigt, aber die Präzision sinkt um _50%_.\n\n_+1：_Wurfwaffenschaden _+20%_.\n\n_+2：_Wurfwaffenschaden _+40%_.
actors.hero.talent.surprise_throw.comment=Diese Fertigkeit wirkt nur, wenn das Ziel anvisiert wird. Spezielle Wurfwaffen wie der Psibogen erhalten ebenfalls die Shuriken-Eigenschaft, aber keinen zusätzlichen Schaden.\n\n„Im Kern wird die Handgelenkskraft gestärkt, um den Rückstoß des Wurfs zur Fortbewegung zu nutzen.“


actors.hero.talent.smoke_mask.title=Rauchtarnung
actors.hero.talent.smoke_mask.desc=_+1：_Erhalte eine Spezialfähigkeit, um _100 Einheiten_ _Rauchgas_ um sich herum freizusetzen.\n\n_+2：_Erhalte die Fähigkeit, _150 Einheiten_ freizusetzen.
actors.hero.talent.smoke_mask.comment=Die durch dieses Talent erhaltene Spezialfähigkeit _hat 25 Runden Abklingzeit_.
actors.hero.talent$smokecooldown.name=Rauchdeckung - Abklingzeit
actors.hero.talent$smokecooldown.desc=Du hast diese Fähigkeit gerade erst eingesetzt und musst eine Weile warten, bevor du sie erneut einsetzen kannst.\n\nVerbleibende Abklingzeit: %s Runden
actors.hero.talent$smokemask.name=Rauchdeckung
actors.hero.talent$smokemask.desc=Dies ist eine Ninja-Technik, die der Tengu im Ninja-Dorf gelernt hat. Aus irgendeinem Grund konnte er sie im Kampf gegen dich nicht einsetzen. Vielleicht hat die dunkle Magie ihn die meisten Ninja-Techniken vergessen lassen – sei froh darüber.\n\nDu kannst Rauch freisetzen, um dich und Verbündete zu decken, ohne eine Runde zu verbrauchen.
actors.hero.talent$smokemask.action_name=Rauchdeckung

actors.hero.talent.rush.title=Schnelle Bewegung
actors.hero.talent.rush.desc=_+1：_Bewegungsgeschwindigkeit _um 50% erhöht_.\n\n_+2：_Bewegungsgeschwindigkeit _um 75% erhöht_.
actors.hero.talent.rush.comment=

actors.hero.talent.overload_charge.title=Aufladungs-Überlast
actors.hero.talent.overload_charge.desc=_+1：_Während des Aufladens von Stab oder Artefakt _erhöht sich die Bewegungsgeschwindigkeit _um 50%_ und der Nahkampfschaden _um 30%_.\n\n_+2：_Während des Aufladens _erhöht sich die Bewegungsgeschwindigkeit _um 75%_ und der Nahkampfschaden _um 50%_.
actors.hero.talent.overload_charge.comment=„Warnung! Warnung!“

actors.hero.talent.gas_spurt.title=Giftgasausstoß
actors.hero.talent.gas_spurt.desc=_+1：_Zauber mit Zauberstab oder Rute verschießen eine kleine Menge _Giftgas_ auf das Ziel.\n\n_+2：_Zauber mit Zauberstab oder Rute verschießen eine kleine Menge _Ätzgas_ auf das Ziel.
actors.hero.talent.gas_spurt.comment=Diese Fertigkeit _hat 15 Runden Abklingzeit_.\n\nDiese magische Fähigkeit basiert hauptsächlich auf der Forschung außer Kontrolle geratener Zwergenmaschinen durch Zwergenminen-Entdecker.
actors.hero.talent$gascooldown.name=Gasausstoß - Abklingzeit
actors.hero.talent$gascooldown.desc=Du hast dieses Talent gerade erst eingesetzt und musst eine Weile warten, bevor du es erneut einsetzen kannst.\n\nVerbleibende Abklingzeit: %s Runden

actors.hero.talent.king_protect.title=Schutz des Königs
actors.hero.talent.king_protect.desc=_+1：_Beim Erleiden von Schaden besteht eine _75%ige Chance_, den Schaden in _verzögerten Schaden_ umzuwandeln.\n\n_+2：_Beim Erleiden von Schaden wird der Schaden _garantiert_ in _verzögerten Schaden_ umgewandelt.
actors.hero.talent.king_protect.comment=

actors.hero.talent.summon_follower.title=Königliche Beschwörung
actors.hero.talent.summon_follower.desc=_+1：_Bei Verwendung der Rüstungsfähigkeit wird _1 Zwerg-Zauberer oder Zwerg-Mönch_ für dich beschworen.\n\n_+2：_Bei Verwendung der Rüstungsfähigkeit werden _2 Zwerg-Zauberer oder Zwerg-Mönche_ für dich beschworen.
actors.hero.talent.summon_follower.comment=

actors.hero.talent.wolfish_gaze.title=Falkenauge-Wolfsblick
actors.hero.talent.wolfish_gaze.desc=_+1：_Präzision wird auf das _4-fache_ erhöht.\n\n_+2：_Angriffe treffen _garantiert_.
actors.hero.talent.wolfish_gaze.comment=

actors.hero.talent.fasting.title=Elektronische Enthaltsamkeit
actors.hero.talent.fasting.desc=_+1：Bei _vollen LP_ verbrauchen Aktionen 1 weniger Sättigung.\n\n_+2：Bei _LP über 80%_ verbrauchen Aktionen 1 weniger Sättigung.
actors.hero.talent.fasting.comment=

actors.hero.talent.strong_attack.title=Starker Angriff
actors.hero.talent.strong_attack.desc=_+1：_Nahkampfangriffe verursachen _3 Runden Verwundbarkeit_.\n\n_+2：_Verursachen _5 Runden Verwundbarkeit_.
actors.hero.talent.strong_attack.comment=Dieses Talent _hat 15 Runden Abklingzeit_.\n\n„Das erste Talent nach der Transformation brach das Monopol des Schakal-Hexenmeisters auf Verwundbarkeit.“
actors.hero.talent$stratkcooldown.name=Kraftvoller Angriff - Abklingzeit
actors.hero.talent$stratkcooldown.desc=Du hast dieses Talent gerade erst eingesetzt und musst eine Weile warten, bevor du es erneut einsetzen kannst.\n\nVerbleibende Abklingzeit: %s Runden

actors.hero.talent.survival_volition.title=Überlebenswille
actors.hero.talent.survival_volition.desc=_+1：_Bei unter 30% Gesundheit _erhältst du bei Treffern 50% Schadensresistenz, Eile und vollständige Reinigung für 2 Runden_.\n\n_+2：_Bei unter 30% Gesundheit _erhältst du bei Treffern 50% Schadensresistenz, Eile und vollständige Reinigung für 3 Runden_.
actors.hero.talent.survival_volition.comment=Diese Fertigkeit hat eine _Abklingzeit von 80 Runden_.\n\n„Hehe, ich muss überleben.“
actors.hero.talent$survolcooldown.name=Überlebenswille - Abklingzeit
actors.hero.talent$survolcooldown.desc=Du hast dieses Talent gerade erst eingesetzt und musst eine Weile warten, bevor du es erneut einsetzen kannst.\n\nVerbleibende Abklingzeit: %s Runden

actors.hero.talent.trap_master.title=Fallenmeister
actors.hero.talent.trap_master.desc=_+1：_Bei Verwendung einer Fallen-Kristallsäule besteht eine _66% Chance_, sie zurückzugewinnen.\n\n_+2：_Bei Verwendung einer Fallen-Kristallsäule besteht eine _75% Chance_, sie zurückzugewinnen.\n\n_+3：_Bei Verwendung einer Fallen-Kristallsäule besteht eine _80% Chance_, sie zurückzugewinnen.
actors.hero.talent.trap_master.comment=Aufwertung dieser Fertigkeit gewährt zusätzlich _1 Fallen-Kristallsäule_.\n\nTalente, die durch Aufwertung oder Transformation direkt Ressourcen gewähren, teilen sich eine _26-fache Auslösebegrenzung_ (beim Gent _39-fache_).

actors.hero.talent.strong_throw.title=Starker Wurf
actors.hero.talent.strong_throw.desc=_+1：_Beim Werfen einer Nahkampfwaffe verursacht sie _2-fachen Waffenstufen-Schaden_.\n\n_+2：_Verursacht _4-fachen Waffenstufen-Schaden_.
actors.hero.talent.strong_throw.comment=„Fliegender Schwert-Bumerang!“

actors.hero.talent.counter_attack.title=Gegenschlag
actors.hero.talent.counter_attack.desc=_+1:_ Bei Nahkampfangriffen besteht eine _20% Wahrscheinlichkeit_, einen _Gegenschlag mit dem 0,5-fachen der Heldenstufe_ auszuführen.\n\n_+2:_ _35% Wahrscheinlichkeit_ für einen Gegenschlag.\n\n_+3:_ _50% Wahrscheinlichkeit_ für einen Gegenschlag.
actors.hero.talent.counter_attack.comment=

actors.hero.talent.fear_incarnation.title=Inkarnation der Angst
actors.hero.talent.fear_incarnation.desc=_+1：_Angriffe auf _verängstigte_ Feinde verursachen _3 zusätzlichen Schaden_.\n\n_+2：_Angriffe auf _verängstigte_ Feinde verursachen _5 zusätzlichen Schaden_.
actors.hero.talent.fear_incarnation.comment=Schlage zu, wenn der Feind zögert.

actors.hero.talent.behest.title=Vermächtnis antreten
actors.hero.talent.behest.desc=_+1:_ Wenn ein Verbündeter stirbt, erhält der Held _5 Runden Hormonschub_.\n\n_+2:_ Wenn ein Verbündeter stirbt, erhält der Held _10 Runden Hormonschub_.\n\n_+3:_ Wenn ein Verbündeter stirbt, erhält der Held _15 Runden Hormonschub_.
actors.hero.talent.behest.comment=Dieses Talent wirkt nicht auf korrumpierte, verdorbene oder für dich kämpfende Feinde.

actors.hero.talent.burning_curse.title=Brennfluch
actors.hero.talent.burning_curse.desc=_+1:_ Angriffe mit Zauberstab oder Magiestab auf _brennende_ Feinde verursachen zusätzlich _2 Runden Lähmung_.\n\n_+2:_ Zusätzlich zu +1 verursachen solche Angriffe zusätzlich _2 Runden Lähmung_ und _2 Runden Blindheit_.
actors.hero.talent.burning_curse.comment=„Erste Lektion der Feuermagie: Bewahre Respekt vor dem Feuer."

actors.hero.talent.invisibility_shadows.title=Schatten der Verstärkung
actors.hero.talent.invisibility_shadows.desc=Durch Aufrüsten dieser Fertigkeit erzeugt der Held bei Erhalt von Schattentarnung oder Tarnung durch Schattenumhang, Tarnungstränke usw. _1 Spiegelbild_.\n\n_+1：_Diese Fertigkeit _hat 40 Runden Abklingzeit_.\n\n_+2：_Diese Fertigkeit _hat 30 Runden Abklingzeit_.
actors.hero.talent.invisibility_shadows.comment=Das ist nicht die Schattenlegion.
actors.hero.talent$invshacooldown.name=Schattenspieler - Abklingzeit
actors.hero.talent$invshacooldown.desc=Du hast dieses Talent gerade erst eingesetzt und musst eine Weile warten, bevor du es erneut einsetzen kannst.\n\nVerbleibende Abklingzeit: %s Runden

actors.hero.talent.justice_punish.title=Gerechtigkeit
#fix9：恶魔属性敌人补充生效对象(四小只和大恶魔)
actors.hero.talent.justice_punish.desc=_+1：_Physische Angriffe gegen _Untote und Dämonen_ verursachen _20% zusätzlichen Schaden_, ihr Tod gewährt _1 Runde Segen_.\n\n_+2：_Physische Angriffe gegen _Untote und Dämonen_ verursachen _30% zusätzlichen Schaden_, ihr Tod gewährt _2 Runden Segen_.
actors.hero.talent.justice_punish.comment=_Untote_ Feinde umfassen Geister, Fluchgeister, Skelette, verrückte Diebe, verrückte Räuber, Gefängniswachen, Nekromanten, Geistermagier, Zwergenleichen, Zwergenzauberer, Zwergenmönche, Meistermönche, Zwergenkönig, Großmeister Timur und Mönchsmeister.\n\n_Dämonische_ Feinde umfassen Mimics, Goldmimics, Kristallmimics, Ebenholzmimics, Wandlungsmimics, faulende Ratten, Schleim, Dämonenblutnest, Sukkubi, böse Blicke, Riesenskorpione, Säureskorpione, uralte Götterlarven, brennende/erdige/faulende/rostende/strahlende/schattenhafte Fäuste, Yog-Dzewa, Anhänger von Nurgle/Tzeentch/Khorne/Slaanesh und große Dämonen.\n\nDämonenreißer haben sowohl _Untot- als auch Dämoneneigenschaft_, aber diese Fertigkeit wirkt nicht doppelt.\n\nIch werde euch jagen, bis ans Ende der Hölle.

actors.hero.talent.overwhelming.title=Überwältigend
actors.hero.talent.overwhelming.desc=Durch Aufwerten dieses Talents erhält der Held Boni durch langsamere Angriffsgeschwindigkeit.\n\n_+1：_Der Teil der Angriffszeit, der 1 Runde übersteigt, wird mit _0.33-fach_ auf Schaden und mit _0.5-fach_ auf Genauigkeit angerechnet.\n\n_+2：_Der übersteigende Teil wird mit _0.66-fach_ auf Schaden und mit _1-fach_ auf Genauigkeit angerechnet.\n\n_+2：_Der übersteigende Teil wird mit _1-fach_ auf Schaden und mit _1.5-fach_ auf Genauigkeit angerechnet.
actors.hero.talent.overwhelming.comment=Eine mächtige Kraft aus dem _Rübenverlies_!


actors.hero.talent.energy_conversion.title=Energiewandlung
actors.hero.talent.energy_conversion.desc=_+1：_Die Aufladerate von Artefakten, Zauberstäben, Rüstungsfähigkeiten und Kampfkünsten wird das _0,5-Fache der Bewegungsgeschwindigkeit_, nicht unter der ursprünglichen Rate.\n\n_+2：_Die Aufladerate von Artefakten, Zauberstäben, Rüstungsfähigkeiten und Kampfkünsten wird das _1-Fache der Bewegungsgeschwindigkeit_, nicht unter der ursprünglichen Rate.
actors.hero.talent.energy_conversion.comment=Mächtige Kraft aus dem _Rübenverlies_!

actors.hero.talent.magic_recycling.title=Magisches Recycling
actors.hero.talent.magic_recycling.desc=_+1：_Zauber mit Zauberstab oder Rute haben eine _10%ige Chance_, keine Aufladung zu verbrauchen.\n\n_+2：_Zauber mit Zauberstab oder Rute haben eine _15%ige Chance_, keine Aufladung zu verbrauchen.\n\n_+3：_Zauber mit Zauberstab oder Rute haben eine _20%ige Chance_, keine Aufladung zu verbrauchen.
actors.hero.talent.magic_recycling.comment=

actors.hero.talent.precious_experience.title=Kostbare Erfahrung
actors.hero.talent.precious_experience.desc=_+1：_Beim Trinken von Erfahrungstrank oder göttlichem Inspirations-Trank erhält man zusätzlich _eine halbe Stufe Erfahrung_.\n\n_+2：_Zusätzlich zu +1 erhält man _50 Runden Segen_.
actors.hero.talent.precious_experience.comment=„Diese Erfahrung ist sehr wertvoll.“

actors.hero.talent.disturb_attack.title=Störender Schlag
actors.hero.talent.disturb_attack.desc=_+1：_Physische Angriffe haben eine _10%ige Chance_, _3 Runden Betäubung_ zu verursachen.\n\n_+2：_Physische Angriffe haben eine _20%ige Chance_, _3 Runden Betäubung_ zu verursachen.
actors.hero.talent.disturb_attack.comment=Eigentlich wird halluzinogene Flüssigkeit auf die Waffe aufgetragen.

actors.hero.talent.gholl_witchcraft.title=Gnollhexerei
actors.hero.talent.gholl_witchcraft.desc=_+1：_Angriffe auf Feinde im Zustand _Getroffen_ verursachen _2 Runden Verwirrung_.\n\n_+2：_Angriffe auf Feinde im Zustand _Getroffen_ verursachen _3 Runden Verwirrung_.
actors.hero.talent.gholl_witchcraft.comment=Eine klägliche Nachahmung der von den Gnollstämmen verwendeten Hexerei.

actors.hero.talent.engineer_refit.title=Ingenieur
actors.hero.talent.engineer_refit.desc=_+1：_Das Töten _maschineller_ Feinde hat eine _12,5%ige Chance_, sie zu DM-100 umzubauen und zu korrumpieren.\n\n_+2：_Das Töten _maschineller_ Feinde hat eine _25%ige Chance_, sie zu DM-100 umzubauen und zu korrumpieren.
actors.hero.talent.engineer_refit.comment=Erhält DM-400 (auch AT-400 und AU-400 im Zufallsmodus) diese Fertigkeit, haben zerstörte Drohnen eine Chance, zu DM-100 umgebaut und korrumpiert zu werden.\n\n_Maschinelle_ Feinde umfassen lebende Statuen, Wächter, Steinstatuen, DM-100, DM-200, DM-201, Energietürme, DM-300, Golems und Goldgolems.\n\nVerstehst du etwas von Maschinenbau?

actors.hero.talent.weird_throw.title=Seltsamer Wurf
actors.hero.talent.weird_throw.desc=_+1：_Das Werfen einer Nicht-Wurfwaffe auf einen Feind verursacht _1 Runde Angst_.\n\n_+2：_Das Werfen einer Nicht-Wurfwaffe auf einen Feind verursacht _2 Runden Angst_.
actors.hero.talent.weird_throw.comment=„Zu wissen, dass man nicht weiß, was der Gegner werfen wird, ist in der Tat eine furchteinflößende Sache.“

actors.hero.talent.thrid_hand.title=Dritte Hand
actors.hero.talent.thrid_hand.desc=_+1：_Ein _10% Chance_, Gegenstände zu kaufen, ohne Gold zu verbrauchen.\n\n_+2：_Ein _20% Chance_, Gegenstände zu kaufen, ohne Gold zu verbrauchen.
actors.hero.talent.thrid_hand.comment=„Ich nehm mir nur ’nen Proviant.“
actors.hero.talent.thrid_hand.steal=Du hast die Ware unbemerkt eingesteckt, während der Ladenbesitzer nicht hinsah.

actors.hero.talent.water_attack.title=Wasserangriff
actors.hero.talent.water_attack.desc=_+1：_Der Held verursacht im Wasser _1 zusätzlichen Schaden_.\n\n_+2：_Der Held verursacht im Wasser _2 zusätzlichen Schaden_.
actors.hero.talent.water_attack.comment=„Kommt Wasser, kommt Wasser.“

actors.hero.talent.more_chance.title=Mehr Chancen
actors.hero.talent.more_chance.desc=_+1：_Die Nutzung von Transformationsschriftrollen und Transformationskristallen verbraucht sich mit _10%iger Chance nicht_.\n\n_+2：_Die Nutzung von Transformationsschriftrollen und Transformationskristallen verbraucht sich mit _20%iger Chance nicht_.
actors.hero.talent.more_chance.comment=„Versprich mir, weiterzuspielen.“

actors.hero.talent.amazing_eyesight.title=Erstaunliche Sehkraft
actors.hero.talent.amazing_eyesight.desc=_+1:_ Der Nahkampfschaden gegen Feinde in _3 Feldern oder mehr_ Entfernung ist um _35%_ erhöht, die Genauigkeit um _35%_.\n\n_+2:_ Der Nahkampfschaden gegen Feinde in _2 Feldern oder mehr_ Entfernung ist um _35%_ erhöht, die Genauigkeit um _35%_.
actors.hero.talent.amazing_eyesight.comment=„Ein Zoll mehr Länge, ein Zoll mehr Stärke."

actors.hero.talent.light_application.title=Leichte Rüstung
actors.hero.talent.light_application.desc=_+1：_Basisausweichen erhöht sich um _5 - Rüstungsstufe_.\n\n_+2：_Wie bei +1, Effekt _verdoppelt_.
actors.hero.talent.light_application.comment=Ohne Rüstung unwirksam.\n\nEigentlich eine Verführungstechnik.

actors.hero.talent.heavy_application.title=Schwere Rüstung
actors.hero.talent.heavy_application.desc=_+1：_Maximale Rüstung erhöht sich um _Rüstungsstufe_.\n\n_+2：_Wie bei +1, Effekt _verdoppelt_.
actors.hero.talent.heavy_application.comment=Ohne Rüstung unwirksam.\n\nNicht nur ein Buch untergeschoben.

actors.hero.talent.bless_meal.title=Gesegnetes Mahl
actors.hero.talent.bless_meal.desc=_+1:_ Essen kostet nur 1 Runde und gewährt _25 Runden Segen_.\n\n_+2:_ Essen kostet nur 1 Runde und gewährt _35 Runden Segen_.
actors.hero.talent.bless_meal.comment=„Danke, Herr, für die Nahrung."

actors.hero.talent.bomb_maniac.title=Sprengstoff-Fanatiker
actors.hero.talent.bomb_maniac.desc=_+1:_ Bombenschaden um _25% erhöht_.\n\n_+2:_ Bombenschaden um _50% erhöht_.
actors.hero.talent.bomb_maniac.comment=Die Aufwertung dieses Talents gewährt zusätzlich _1 Bombe_.\n\nDie Anzahl der direkten Ressourcenbeschaffungen durch Aufwertung oder Metamorphose dieses Talents ist unbegrenzt.\n\n„Kunst ist eine Explosion."

actors.hero.talent.phantom_shooter.title=Phantomschütze
actors.hero.talent.phantom_shooter.desc=_+1：_Beim Werfen einer Wurfwaffe wird zusätzlich 1 Phantombild-Wurfgeschoss geworfen, das _10% des Wurfwaffenschadens_ verursacht.\n\n_+2：_Beim Werfen wird zusätzlich 1 Phantombild geworfen, das _20% des Wurfwaffenschadens_ verursacht.\n\n_+3：_Beim Werfen wird zusätzlich 1 Phantombild geworfen, das _30% des Wurfwaffenschadens_ verursacht.
actors.hero.talent.phantom_shooter.comment=

actors.hero.talent.wake_snake.title=Schlange im Gras aufscheuchen
actors.hero.talent.wake_snake.desc=_+1：_Andere Kreaturen, die hohes Gras betreten, haben eine _10% Chance_, _1 verdorbene Riesenschlange_ zu erzeugen.\n\n_+2：_Andere Kreaturen, die hohes Gras betreten, haben eine _20% Chance_, _1 verdorbene Riesenschlange_ zu erzeugen.
actors.hero.talent.wake_snake.comment=„Eine segensreiche Nachricht für Schlangenphobiker.“

actors.hero.talent.collection_gold.title=Goldschild
actors.hero.talent.collection_gold.desc=_+1:_ Erhalte beim Aufheben von Goldmünzen _1 Punkt Schild_.\n\n_+2:_ Erhalte beim Aufheben von Goldmünzen _2 Punkte Schild_.
actors.hero.talent.collection_gold.comment=„Voller Geldgeruch."

actors.hero.talent.martial_train.title=Kampfkunsttraining
actors.hero.talent.martial_train.desc=Durch Aufrüsten dieser Fertigkeit kann der Held Kampfkünste einsetzen, hat ein geringes, mit der Stufe steigendes Aufladungslimit und erhält alle 90 Runden 1 Aufladung zurück.\n\n_+1：_Kampfkunst-Aufladungslimit von _2_.\n\n_+2：_Kampfkunst-Aufladungslimit von _3_.\n\n_+3：_Kampfkunst-Aufladungslimit von _4_.
actors.hero.talent.martial_train.comment=Helden, die Kampfkünste einsetzen können, lösen durch deren Nutzung die normalen Effekte von _Kraftschild_, _Fokussierte Mahlzeit_, _Waffenaufladung_, _Tödlicher Schwung_ und _Präzisionsschlag_ aus, nicht die kompatiblen Effekte.\n\nKann der Held bereits Kampfkünste einsetzen, erhöht sich auf Stufe _+1/+2/+3_ nur das _Aufladungslimit um 1/2/3 Punkte_.\n\nÜbung macht den Meister.

actors.hero.talent.thickened_armor.title=Verstärkte Rüstung
actors.hero.talent.thickened_armor.desc=_+1：_Die Rüstung bietet _+1 maximale Rüstung_.\n\n_+2：_Die Rüstung bietet _+2 maximale Rüstung_.
actors.hero.talent.thickened_armor.comment=Ohne Rüstung unwirksam.\n\n„Hab mir nur ein Buch unter die Brust gestopft.“

actors.hero.talent.powerful_calculations.title=Unfehlbare Berechnung
actors.hero.talent.powerful_calculations.desc=_+1：_Immer wenn ein Charakter außerhalb des Sichtfelds stirbt, stellt der Held _1 Lebenspunkt_ wieder her.\n\n_+2：_Immer wenn ein Charakter außerhalb des Sichtfelds stirbt, stellt der Held _2 Lebenspunkte_ wieder her.
actors.hero.talent.powerful_calculations.comment=„Dein nächster Satz ist...“

actors.hero.talent.insert_bid.title=Pfeile im Gesicht
actors.hero.talent.insert_bid.desc=_+1：_Angriffe auf Feinde im Zustand _Getroffen_ erhöhen die Genauigkeit um _20%_.\n\n_+2：_Angriffe auf Feinde im Zustand _Getroffen_ erhöhen die Genauigkeit um _40%_.
actors.hero.talent.insert_bid.comment=Du steckst voller Pfeile wie ein Igel und denkst, ich treffe dich nicht?

actors.hero.talent.meal_shield.title=Schildmahlzeit
actors.hero.talent.meal_shield.desc=_+1：_Essen gewährt _4 Schildpunkte_.\n\n_+2：_Essen gewährt _8 Schildpunkte_.
actors.hero.talent.meal_shield.comment=„Ich bin voll.“

actors.hero.talent.drop_resistant.title=Sturzsicher
actors.hero.talent.drop_resistant.desc=_+1：_Nach einem Sturz in den Abgrund erhält der Held _keine Krüppelung_ mehr.\n\n_+2：_Nach einem Sturz in den Abgrund erhält der Held _keine Blutung und Krüppelung_ mehr.
actors.hero.talent.drop_resistant.comment=Kleiner schwarzer Mann, nur 824 Yuan!

actors.hero.talent.strength_train.title=Krafttraining
actors.hero.talent.strength_train.desc=_+1：_Kein Effekt.\n\n_+2：_Erhalte zusätzlich _1 Stärke_.
actors.hero.talent.strength_train.comment=„Siehe Ein-Schlag-Mann-Trainingsmethode.“

actors.hero.talent.treat_meal.title=Heilende Mahlzeit
actors.hero.talent.treat_meal.desc=_+1：_Essen regeneriert langsam _3 Leben_.\n\n_+2：_Essen regeneriert langsam _5 Leben_.
actors.hero.talent.treat_meal.comment=„Nahrhafte Mahlzeit.“

actors.hero.talent.cover_scar.title=Überall Narben
actors.hero.talent.cover_scar.desc=_+1:_ Nahkampfangriffe verursachen _Blutung mit Grundwert 1_.\n\n_+2:_ Nahkampfangriffe verursachen _Blutung mit Grundwert 2_.
actors.hero.talent.cover_scar.comment=„Stoße den Dolch tief in seine Brust."

actors.hero.talent.nurtritious_meal.title=Allheilmittel-Mahl
actors.hero.talent.nurtritious_meal.desc=_+1：_Essen stellt _2 Lebenspunkte_ wieder her und gewährt _2 Schildpunkte_.\n\n_+2：_Essen stellt _4 Lebenspunkte_ wieder her und gewährt _4 Schildpunkte_.
actors.hero.talent.nurtritious_meal.comment=„Vom nahrhaften Essen zu voll.“

actors.hero.talent.rage_attack.title=Wutangriff
actors.hero.talent.rage_attack.desc=_+1：_Physische Angriffe des Helden und erlittener Schaden _erhöhen sich um 10%_.\n\n_+2：_Erhöhen sich um 20%_.\n\n_+3：_Erhöhen sich um 30%_.
actors.hero.talent.rage_attack.comment=

actors.hero.talent.military_waterskin.title=Militär-Wasserschlauch
actors.hero.talent.military_waterskin.desc=_+1：_Der Wasserschlauch kann _15 zusätzliche Tautropfen_ sammeln.\n\n_+2：_Der Wasserschlauch kann _30 zusätzliche Tautropfen_ sammeln.
actors.hero.talent.military_waterskin.comment=„Der große Wasserschlauch.“

actors.hero.talent.jasmine_tea.title=Jasmintee
actors.hero.talent.jasmine_tea.desc=_+1：_Tautropfen im Wasserbeutel gewähren _3 Runden Segen_.\n\n_+2：_Tautropfen im Wasserbeutel gewähren _5 Runden Segen_.
actors.hero.talent.jasmine_tea.comment=Schmeckt... nicht so gut wie Eistee.

actors.hero.talent.god_lefthand.title=Gottes Linke Hand
actors.hero.talent.god_lefthand.desc=_+1：_Mit dieser Fertigkeit auf +1 kann _Gottes Rechte Hand +1_ wirken.\n\n_+2：_Mit dieser Fertigkeit auf +2 kann _Gottes Rechte Hand +2_ wirken.
actors.hero.talent.god_lefthand.comment=Linke Faust macht keinen Schaden.

actors.hero.talent.god_righthand.title=Gottes Rechte Hand
actors.hero.talent.god_righthand.desc=_+1：_Physischer Angriffsschaden +_30%_, erfordert _Gottes Linke Hand +1_.\n\n_+2：_Physischer Angriffsschaden +_60%_, erfordert _Gottes Linke Hand +2_.
actors.hero.talent.god_righthand.comment=Rechte Faust macht viel Schaden.

actors.hero.talent.gold_formation.title=Goldformation
actors.hero.talent.gold_formation.desc=_+1：_Hebt der Held Goldmünzen auf und hat über 500 Gold, werden _automatisch 500 Gold_ verbraucht, um _1 niedrigen Beutefall_ auszulösen.\n\n_+2：_Hebt der Held Goldmünzen auf und hat über 1000 Gold, werden _automatisch 1000 Gold_ verbraucht, um _1 mittleren Beutefall_ auszulösen.\n\n_+3：_Hebt der Held Goldmünzen auf und hat über 2000 Gold, werden _automatisch 2000 Gold_ verbraucht, um _1 hohen Beutefall_ auszulösen.
actors.hero.talent.gold_formation.comment=

actors.hero.talent.strengthen_chain.title=Verstärkte Kette
actors.hero.talent.strengthen_chain.desc=_+1：_Wenn die Leerenkette einen Gegner heranzieht, erhält der Gegner _10 Runden Krüppelung_.\n\n_+2：_Zusätzlich zu +1 verbraucht das Heranziehen _keine Runde mehr_, und der Aufladungsverbrauch pro Nutzung reduziert sich _um 1 Punkt_ (Mindestverbrauch bleibt 1, Aufladungsanforderung bleibt unverändert).
actors.hero.talent.strengthen_chain.comment=„Komm her!“

actors.hero.talent.strengthen_chalice.title=Verstärkter Blutkelch
actors.hero.talent.strengthen_chalice.desc=_+1：_Die Beschleunigung der natürlichen Lebensregeneration durch den Blutkelch _erhöht sich um 50%_.\n\n_+2：_Erhöht sich um 100%_.
actors.hero.talent.strengthen_chalice.comment=„Kraft, ein Teil wurde zurückgewonnen.“

actors.hero.talent.savage_physique.title=Wilder Körperbau
actors.hero.talent.savage_physique.desc=_+1：_Maximale Lebenspunkte _um 10 erhöht_.\n\n_+2：_Um 15 erhöht_.
actors.hero.talent.savage_physique.comment=„Stärke den Körper durch Mühsal.“

actors.hero.talent.ice_breaking.title=Eisbrecher
actors.hero.talent.ice_breaking.desc=_+1：_Bei Zielen mit _Erfrierung_ verursachen physische Angriffe _1 zusätzlichen Magieschaden_.\n\n_+2：_Bei Zielen mit _Erfrierung_ verursachen physische Angriffe _2 zusätzlichen Magieschaden_.
actors.hero.talent.ice_breaking.comment=Die Verbesserung dieser Fertigkeit verstärkt _Extreme Kälte +3_.\n\nOh mein Gott! Eis!!!

actors.hero.talent.burning_blood.title=Brennendes Blut
actors.hero.talent.burning_blood.desc=_+1:_ Wenn ein Feind stirbt, stellt der Held _1 Lebenspunkt_ wieder her.\n\n_+2:_ Wenn ein Feind stirbt, stellt der Held _2 Lebenspunkte_ wieder her.
actors.hero.talent.burning_blood.comment=„Hör auf, das Schweineblut abzulassen, okay?"

actors.hero.talent.strength_greatest.title=Überragende Kraft
actors.hero.talent.strength_greatest.desc=_+1：_Wurfwaffen verursachen zusätzlich _1 Schadenspunkt_, der Seelenbogen zusätzlich _0~1 Schadenspunkt_.\n\n_+2：_Wurfwaffen verursachen zusätzlich _2 Schadenspunkte_, der Seelenbogen zusätzlich _0~2 Schadenspunkte_.
actors.hero.talent.strength_greatest.comment=„Pfeile durchbohren harten Stein, die Kraft überragt die gesamte Armee!“

actors.hero.talent.accumulate_steadily.title=Stetige Ansammlung
actors.hero.talent.accumulate_steadily.desc=_+1:_ Kein Effekt.\n\n_+2:_ Kein Effekt.\n\n_+3: Angriffsreichweite +1_.
actors.hero.talent.accumulate_steadily.comment=

actors.hero.talent.get_up.title=Ruhestörung
actors.hero.talent.get_up.desc=_+1：_Schaden während des Schlafens gewährt _3 Runden Hormonschub_.\n\n_+2：_Schaden während des Schlafens gewährt _5 Runden Hormonschub_.
actors.hero.talent.get_up.comment=Ich werde die Ruhe dieses Moments nicht stören lassen!
actors.hero.talent$nosleep.name=Schlafen
actors.hero.talent$nosleep.desc=Ein kleines Nickerchen – wenn man gestört wird, gibt es einen großen Wutanfall.


actors.hero.talent.more_talent.title=Mehr Talente
actors.hero.talent.more_talent.desc=_+1：_Beim Lesen einer Transformationsschriftrolle besteht eine _50%ige Chance_, _1 zusätzliche Option_ zu erhalten.\n\n_+2：_Beim Lesen einer Transformationsschriftrolle wird _garantiert_ _1 zusätzliche Option_ hinzugefügt.
actors.hero.talent.more_talent.comment=„Alle Wege führen nach Rom.“

actors.hero.talent.giant_killer.title=Riesentöter
actors.hero.talent.giant_killer.desc=_+1：_Physische Angriffe gegen Feinde mit der Eigenschaft _Riese_ verursachen _35% zusätzlichen Schaden_.\n\n_+2：_Physische Angriffe gegen Feinde mit der Eigenschaft _Riese_ verursachen _70% zusätzlichen Schaden_.
actors.hero.talent.giant_killer.comment=_Riesenartige_ Feinde umfassen DM-200, DM-201, DM-300, Golem, Rostfaust, Goldgolem und riesige Elitefeinde.\n\nVertreibe sie alle!

actors.hero.talent.want_all.title=Ich will alles
actors.hero.talent.want_all.desc=_+1：_Kristall-Schatzräume und Kristall-Wegräume erzeugen _1 zusätzlichen Kristallschlüssel_.\n\n_+2：_Zusätzlich zu +1: Kristall-Wahlräume erzeugen _1 zusätzlichen Kristallschlüssel_.
actors.hero.talent.want_all.comment=Kristall-Schatzräume: Eine von zwei Ausrüstungen. Kristall-Wegräume: Drei von sechs Verbrauchsgütern. Kristall-Wahlräume: Eine Wahl zwischen Ausrüstung und Verbrauchsgut.\n\n„Nur Kinder treffen eine Wahl. Ich will alles.“\n„Skelettschlüssel：Bitte Text eingeben.“


actors.hero.talent.vegetarianism.title=Dauerhafter Vegetarismus
actors.hero.talent.vegetarianism.desc=_+1：_Verzehr von fleischlosen Nahrungsmitteln gewährt _450 Runden Sättigung_, Verzehr von Fleischnahrung _reduziert die Sättigungswiederherstellung um 30%_.\n\n_+2：_Verzehr von fleischlosen Nahrungsmitteln gewährt _450 Runden Sättigung_ und _25% der maximalen Gesundheit als Lebensregeneration_. Verzehr von Fleischnahrung _reduziert die Sättigungswiederherstellung um 30%_.
actors.hero.talent.vegetarianism.comment=Nur kleine Proviantbeutel, Dungeonbeeren, Reserveproviant, Beruhigungs-Elixier, geschmacklose Früchte und geschmacklose Fruchtstücke gelten als fleischlos. Somit zählen nur diese 6 Nahrungsmittel als Nicht-Fleisch-Nahrung.\n\nMit der Herausforderung „Reduzierte Mahlzeiten“ sinkt die Sättigungsdauer dieser Fertigkeit von 450 Runden _auf 150 Runden_.\n\n„Wenn ich schon Fleisch essen muss, dann W A T A S H I!“\n„Ich habe mich noch nie über Fleischessen gefreut...“

actors.hero.talent.word_stun.title=Wort-Lähmung
actors.hero.talent.word_stun.desc=_+1：_Beim Werfen einer Schriftrolle auf einen Feind wird _2 Runden Lähmung_ zugefügt.\n\n_+2：_Beim Werfen einer Schriftrolle auf einen Feind wird _3 Runden Lähmung_ zugefügt.
actors.hero.talent.word_stun.comment=Diese Fertigkeit hat eine _Abklingzeit von 50 Runden_.\n\n„Es ist nicht nur ein bloßer Schriftzug.“
actors.hero.talent$wordstuncooldown.name=Wort der Betäubung - Abklingzeit
actors.hero.talent$wordstuncooldown.desc=Du hast dieses Talent gerade erst eingesetzt und musst eine Weile warten, bevor du es erneut einsetzen kannst.\n\nVerbleibende Abklingzeit: %s Runden

actors.hero.talent.novice_benefits.title=Anfängervorteile
actors.hero.talent.novice_benefits.desc=_+1：_Sofort _1 Transformationsschriftrolle_ erhalten.\n\n_+2：_Sofort _1 Transformationsschriftrolle_ erhalten.
actors.hero.talent.novice_benefits.comment=Talente, die durch Aufstieg oder Transformation direkt Ressourcen gewähren, teilen sich _26 Auslösebegrenzungen_ (_39_ für den Gentleman).\n\n„Das ist dein Beschwörungs-Garantie.“

actors.hero.talent.double_trinkets.title=Doppelter Schmuck
actors.hero.talent.double_trinkets.desc=_+1：_Erhalte _1 magischen Katalysator_.\n\n_+2：_Kein Effekt.\n\n_+3：_Kein Effekt.
actors.hero.talent.double_trinkets.comment=Hinweis: Gleiche Schmuckstückeffekte stapeln sich nicht.\n\nTalente, die durch Aufstieg oder Wandlung direkt Ressourcen gewähren, teilen sich _26 Auslösebegrenzungen_ (beim Gentleman _39_).\n\nKomponenten und Moos kann man nicht zugleich erhalten, da nur eine Auslösung zählt.

actors.hero.talent.fishing_time.title=Rumträumen
actors.hero.talent.fishing_time.desc=_+1：_Schaden gegen _Fischartige_ Feinde erhöht sich um _30%_.\n\n_+2：_Wie bei +1, zusätzlich wird _Phantom-Piranha-Teleportation verhindert_ und in Wasserbecken _1 zusätzlicher Riesenpiranha_ erzeugt, der vom negativen Talent _Landschwimmen_ betroffen ist.
actors.hero.talent.fishing_time.comment=_Fischartige_ Feinde umfassen Riesenpiranhas, Phantom-Piranhas, Riesenlandpiranhas und Phantom-Landpiranhas.\n\nDas ist eine Fertigkeit, die während des Rumträumens entstanden ist.


actors.hero.talent.posion_dagger.title=Vergifteter Dolch
actors.hero.talent.posion_dagger.desc=_+1：_Dolchartige _Waffenangriffe verursachen zusätzlich _2 Runden Vergiftung_.\n\n_+2：_Dolchartige _Waffenangriffe verursachen zusätzlich _4 Runden Vergiftung_.
actors.hero.talent.posion_dagger.comment=_Dolchartige_ Waffen umfassen Diebesdolch, Langdolch, Meuchelklinge und Ritualdolch des Gläubigen.\n\n„Mein Messer hier ist eine mit Gift beschichtete Giftklinge (lecker)...“

actors.hero.talent.invincible_meal.title=Unbesiegbarkeitsmahl
actors.hero.talent.invincible_meal.desc=_+1：_Essen gewährt _1 Runde Unverwundbarkeit_.\n\n_+2：_Essen gewährt _2 Runden Unverwundbarkeit_.\n\n_+3：_Essen gewährt _3 Runden Unverwundbarkeit_.
actors.hero.talent.invincible_meal.comment=Diese Fertigkeit teilt sich mit _Erfahrung durch Essen_, _Wolkenmahl_ und _Geburtstagsgeschenk_ eine _100er Auslösebegrenzung_.

actors.hero.talent.wellfed_meal.title=Gestärkte Mahlzeit
actors.hero.talent.wellfed_meal.desc=_+1：_Ist der Held im _gesättigten Zustand_, wird der _Gesamtschaden gegen Feinde um 15% erhöht_ und du erhältst _10% Schadensreduktion_.\n\n_+2：_Ist der Held im _gesättigten Zustand_, wird der _Gesamtschaden gegen Feinde um 30% erhöht_ und du erhältst _20% Schadensreduktion_.\n\n_+3：_Ist der Held im _gesättigten Zustand_, wird der _Gesamtschaden gegen Feinde um 45% erhöht_ und du erhältst _30% Schadensreduktion_.
actors.hero.talent.wellfed_meal.comment=

actors.hero.talent.shock_bomb.title=Schockexplosion
actors.hero.talent.shock_bomb.desc=_+1：_Bombenexplosionen verursachen _1 Runde Lähmung_ bei Kreaturen im Umkreis von 9 Feldern.\n\n_+2：_Verursachen _2 Runden Lähmung_.
actors.hero.talent.shock_bomb.comment=Durch Aufwerten dieses Talents erhält man zusätzlich _1 Bombe_.\n\nDie Anzahl der direkten Ressourcenbeschaffungen durch Aufwerten oder Transformation dieses Talents ist unbegrenzt.\n\n„Schockgranate.“

actors.hero.talent.illusion_feed.title=Gemalte Pastete
actors.hero.talent.illusion_feed.desc=_+1：_Erhalte sofort _1 Pastete_.\n\n_+2：_Erhalte sofort _1 Pastete_.
actors.hero.talent.illusion_feed.comment=Talente, die durch Aufstieg oder Wandlung direkt Ressourcen gewähren, teilen sich _26 Auslösebegrenzungen_ (beim Gentleman _39_).\n\nDu bist der Zauberpinsel Malian.

actors.hero.talent.heavy_burden.title=Schwere Last
actors.hero.talent.heavy_burden.desc=_+1：_Spielergebnis _x2_.\n\n_+2：_Spielergebnis _x3_.
actors.hero.talent.heavy_burden.comment=Meister des Punktefarmens.

actors.hero.talent.attack_door.title=Mit der Axt an der Tür
actors.hero.talent.attack_door.desc=_+1:_ Wenn sich der Feind auf einem Feld mit offener Tür befindet, verursacht der physische Angriff _1 zusätzlichen Schaden_.\n\n_+2:_ Wenn sich der Feind auf einem Feld mit offener Tür befindet, verursacht der physische Angriff _2 zusätzlichen Schaden_.
actors.hero.talent.attack_door.comment=„Here is Johnny~"

actors.hero.talent.arrow_penetration.title=Pfeile durchschlagen Stein
actors.hero.talent.arrow_penetration.desc=_+1:_ Alle Wurfwaffen haben einen _Wanddurchdringungs_-Effekt mit einer _Reichweitenbegrenzung von 8 Feldern_.\n\n_+2:_ Alle Wurfwaffen haben einen _Wanddurchdringungs_-Effekt mit einer _Reichweitenbegrenzung von 12 Feldern_.
actors.hero.talent.arrow_penetration.comment=Wenn ein Held mit einer besonderen Wurfwaffe wie dem Psychobogen dieses Talent erhält, profitiert die Waffe ebenfalls von diesem Talent.\n\n„Obwohl ich alt bin, sind meine Pfeile noch scharf!"

actors.hero.talent.detox_damage.title=Schmerzentgiftung
actors.hero.talent.detox_damage.desc=_+1:_ Bei einem Treffer besteht eine _25% Wahrscheinlichkeit_, _1 Runde vollständige Reinigung_ zu erhalten. Nach Erhalt der vollständigen Reinigung besteht eine _15% Wahrscheinlichkeit_, alle negativen Effekte zu entfernen.\n\n_+2:_ _50% Wahrscheinlichkeit_ für vollständige Reinigung.\n\n_+3:_ _75% Wahrscheinlichkeit_ für vollständige Reinigung.
actors.hero.talent.detox_damage.comment=

actors.hero.talent.returning_honor.title=Ehrenvoll zurückkehren
actors.hero.talent.returning_honor.desc=_+1：_Die Erfahrung von getöteten Gegnern _erhöht sich um 25%_.\n\n_+2：_Erhöht sich um 50%_.\n\n_+3：_Erhöht sich um 75%_.
actors.hero.talent.returning_honor.comment=

#fix9：名字变更为原先投稿的“涿郡屠户”
actors.hero.talent.zhuojun_butcher.title=Metzger aus Zhuojun
#fix9：补充生效对象(巨型陆地食人鱼)
actors.hero.talent.zhuojun_butcher.desc=_+1：_Töten _biologischer_ Feinde gewährt mit _10% Wahrscheinlichkeit_ zusätzlich _1 mysteriöses Fleisch_.\n\n_+2：_Töten _biologischer_ Feinde gewährt mit _20% Wahrscheinlichkeit_ zusätzlich _1 mysteriöses Fleisch_.
actors.hero.talent.zhuojun_butcher.comment=Der Beutefall dieser Fertigkeit unterliegt ebenfalls der Heldenstufenbegrenzung.\n\n_Biologische_ Feinde umfassen nur Riesenpiranhas, Phantom-Piranhas, Riesenland-Piranhas, Phantomland-Piranhas, Goldbienen, Nagetiere, Albino-Ratten, Abwasser-Riesenschlangen, Schakal-Patrouillen, Abwasser-Krabben, Fliegenschwärme, Schleime, Vampirfledermäuse, Schakal-Schläger, Schwerpanzer-Schläger, Schakal-Schamanen und Minen-Spinnen – also Feinde _ohne jegliche Eigenschaften_.\n\n„Warum lässt ein Schleim Fleisch fallen?“\n„Vielleicht ein noch nicht vollständig verdauter Abenteurer.“

actors.hero.talent.aid_stomach.title=Magen mit Säure
actors.hero.talent.aid_stomach.desc=_+1:_ Der Verzehr von mysteriösem Fleisch hat _keine negativen Effekte_.\n\n_+2:_ Zusätzlich zu +1 stellt mysteriöses Fleisch zusätzlich _33% Sättigung_ wieder her.
actors.hero.talent.aid_stomach.comment=„Rohes Fleisch, lebendig verschlungen."

actors.hero.talent.weapon_make.title=Waffenherstellung
actors.hero.talent.weapon_make.desc=_+1：_Erhalte sofort _1 Waffe aus Region 3_.\n\n_+2：_Erhalte sofort _1 Waffe aus Region 4_.\n\n_+3：_Erhalte sofort _1 Waffe aus Region 5_.
actors.hero.talent.weapon_make.comment=Durch diese Fertigkeit erhaltene Waffen _werden sofort identifiziert und haben -2 Stärke-Anforderung_. Talente, die durch Aufwertung oder Transformation direkt Ressourcen gewähren, teilen sich eine _26-fache Auslösebegrenzung_ (beim Gent _39-fache_).

actors.hero.talent.secret_stash.title=Geheimkasse
actors.hero.talent.secret_stash.desc=_+1：_Sofort _1000 Goldmünzen_ erhalten.\n\n_+2：_Sofort _1000 Goldmünzen_ erhalten.\n\n_+3：_Sofort _1000 Goldmünzen_ erhalten.
actors.hero.talent.secret_stash.comment=Talente, die durch Aufstieg oder Transformation direkt Ressourcen gewähren, teilen sich _26 Auslösebegrenzungen_ (_39_ für den Gentleman).

actors.hero.talent.earth_meal.title=Erdenmahl
actors.hero.talent.earth_meal.desc=_+1：_Essen gewährt _0~67% der Heldenstufe Rindenpanzer_, der pro Runde abklingt.\n\n_+2：_Essen gewährt _0~133% der Heldenstufe Rindenpanzer_, der pro Runde abklingt.\n\n_+3：_Essen gewährt _0~200% der Heldenstufe Rindenpanzer_, der pro Runde abklingt.
actors.hero.talent.earth_meal.comment=

actors.hero.talent.eaten_slowly.title=Genüsslich kauen
actors.hero.talent.eaten_slowly.desc=_+1：_Essen dauert _10 Runden länger_, erhält aber _30% mehr Sättigung_.\n\n_+2：_Essen dauert _10 Runden länger_, erhält aber _60% mehr Sättigung_, und Pasteten geben zusätzlich _450 Runden Sättigung_.
actors.hero.talent.eaten_slowly.comment=Diese Fertigkeit wirkt nicht auf das Füllhorn. Die verlängerte Essensdauer hat Vorrang vor allen verkürzenden Talenten.\n\nMit der Herausforderung 'Schmalkost' sinkt der Sättigungseffekt von 450 Runden _auf 150 Runden_.\n\nNur eine unnötige Formsache vor dem Essen.

actors.hero.talent.invincible.title=Unaufhaltsam
actors.hero.talent.invincible.desc=_+1：_Beim Tod eines Feindes erhält der Held _2 Runden Hormonschub_.\n\n_+2：_Beim Tod eines Feindes erhält der Held _4 Runden Hormonschub_.
actors.hero.talent.invincible.comment=Je mehr du kämpfst, desto stärker wirst du.

actors.hero.talent.yog_larva.title=Larvenruf
actors.hero.talent.yog_larva.desc=_+1：_Bei Erleiden von mehr als 5 Schaden durch einen einzelnen Treffer _wird 1 uralte Gottheitslarve_ beschworen, die für dich kämpft.\n\n_+2：_Bei Erleiden von mehr als 5 Schaden durch einen einzelnen Treffer _werden 2 uralte Gottheitslarven_ beschworen.\n\n_+3：_Zusätzlich zu +2: Uralte Gottheitslarven haben eine _50% Chance_, zu Eliten zu werden.
actors.hero.talent.yog_larva.comment=

actors.hero.talent.yog_fist.title=Riesenfaust-Kraft
actors.hero.talent.yog_fist.desc=Nach Aufwertung dieser Fertigkeit erhältst du bei Verwendung eines Artefakts die Riesenfaust-Kraft. Dieser Effekt hält _5 Runden_ und hat eine _Abklingzeit von 20 Runden_.\n\n_+1：_Erhalte die Kraft der Dunkel-Licht-Faust, erhalte _40 Runden Leuchten_ und physische Angriffe verursachen _5 Runden Blindheit_.\n\n_+2：_Zusätzlich zu +1: Erhalte die Kraft der Brennenden Faust, erhalte _10 Runden Feuermacht_.\n\n_+3：_Zusätzlich zu +1 und +2: Erhalte die Kraft der Erd-Faust, erhalte pro Runde abnehmend _0~50% der Heldenstufe an Baumrinde_, und physische Angriffe verursachen _5 Runden Ummantelung_.
actors.hero.talent.yog_fist.comment=
actors.hero.talent$yogfistcooldown.name=Faust der Riesen - Abklingzeit
actors.hero.talent$yogfistcooldown.desc=Du hast dieses Talent gerade erst eingesetzt und musst eine Weile warten, bevor du es erneut einsetzen kannst.\n\nVerbleibende Abklingzeit: %s Runden
actors.hero.talent$yogfistpower.name=Faust der Riesen
actors.hero.talent$yogfistpower.desc=Du entfesselst für kurze Zeit die Kraft der Faust der Uralten.\n\nVerbleibende Dauer: %s Runden


actors.hero.talent.yog_ray.title=Todesstrahl
actors.hero.talent.yog_ray.desc=Nach Aufwertung dieser Fertigkeit wird beim Wirken eines Zaubers mit dem Stab auf ein Ziel ein Todesstrahl freigesetzt, _Abklingzeit von 20 Runden_.\n\n_+1：_Schieße _1 Todesstrahl mit 40-60 Schaden_.\n\n_+2：_Beim Wirken auf ein einzelnes Ziel werden maximal _3 Todesstrahlen mit 40-70 Schaden_ um das Ziel herum abgefeuert.\n\n_+3：_Beim Wirken auf ein einzelnes Ziel werden maximal _5 Todesstrahlen mit 40-80 Schaden_ um das Ziel herum abgefeuert.
actors.hero.talent.yog_ray.comment=„Der Zwergenkönig hat als Kind diese Folge gesehen und den Totenkult entdeckt.“
actors.hero.talent$yograycooldown.name=Todesstrahl - Abklingzeit
actors.hero.talent$yograycooldown.desc=Du hast dieses Talent gerade erst eingesetzt und musst eine Weile warten, bevor du es erneut einsetzen kannst.\n\nVerbleibende Abklingzeit: %s Runden

actors.hero.talent.afraid_death.title=Hautabschmieren
actors.hero.talent.afraid_death.desc=_+1:_ Bei _Lebenspunkten unter 30%_ erhöht sich die _Bewegungsgeschwindigkeit um 30%_, der verursachte _physische Schaden sinkt um 50%_.\n\n_+2:_ Bei _Lebenspunkten unter 30%_ erhöht sich die _Bewegungsgeschwindigkeit um 40%_, der verursachte _physische Schaden sinkt um 40%_.\n\n_+3:_ Bei _Lebenspunkten unter 30%_ erhöht sich die _Bewegungsgeschwindigkeit um 50%_, der verursachte _physische Schaden sinkt um 30%_.
actors.hero.talent.afraid_death.comment=

actors.hero.talent.pyromaniac.title=Pyromane
actors.hero.talent.pyromaniac.desc=_+1：_Erhalte _3 Drachenfeuer-Atemtränke_.\n\n_+2：_Erhalte _2 Höllenfeuertränke_.\n\n_+3：_Erhalte _1 Drachenblut-Elixier_.
actors.hero.talent.pyromaniac.comment=Talente, die durch Aufstieg oder Transformation direkt Ressourcen gewähren, teilen sich _26 Auslösebegrenzungen_ (_39_ für den Gentleman).

actors.hero.talent.reverse_polarity.title=Der Himmel mag Überraschungen
actors.hero.talent.reverse_polarity.desc=Durch Aufwerten dieses Talents wird die aktuelle Lebenspunkte entsprechend angepasst.\n\n_+1：_Aktuelle Lebenspunkte werden auf _1 Punkt_ angepasst.\n\n_+2：_Aktuelle Lebenspunkte werden auf _50% der maximalen Lebenspunkte_ angepasst.\n\n_+3：_Aktuelle Lebenspunkte werden auf _100% der maximalen Lebenspunkte_ angepasst.
actors.hero.talent.reverse_polarity.comment=„Was ist mit deinem Gesicht los, was ist mit deinen Tränen los, können deine Tränen die Erde retten?“

actors.hero.talent.hero_name.title=Name des Helden
actors.hero.talent.hero_name.desc=_+1：_Beim Aufstieg werden zusätzlich _20% der max. LP_ wiederhergestellt.\n\n_+2：_Beim Aufstieg werden zusätzlich _40% der max. LP_ wiederhergestellt.\n\n_+3：_Beim Aufstieg werden zusätzlich _60% der max. LP_ wiederhergestellt.
actors.hero.talent.hero_name.comment=

actors.hero.talent.sky_earth.title=Kraft von Himmel und Erde
actors.hero.talent.sky_earth.desc=_+1：_Wenn der Held _schwebt, ummantelt ist oder Pflanzenrüstung_ hat, erhöht sich der Schaden um _15%_.\n\n_+2：_Erhöht sich um _30%_.\n\n_+3：_Erhöht sich um _45%_.
actors.hero.talent.sky_earth.comment=Hinweis: Wenn der Wächter auf Erdwurzeln tritt, erhält er anstelle des Pflanzenrüstungseffekts den Baumhauteffekt, daher wird er von diesem Talent nicht beeinflusst.\n\n„Ein Wutschrei des Himmels spaltet Berge, ein Schlag auf die Erde zerbricht den Himmel.“

actors.hero.talent.water_isfood.title=Wasser als Nahrung
actors.hero.talent.water_isfood.desc=_+1：_Beim Trinken eines Trankes werden _30 Sättigung_ wiederhergestellt.\n\n_+2：_Zusätzlich zu +1: Beim Trinken von Tau aus dem Wasserschlauch werden _10-fache der getrunkenen Taumenge an Sättigung_ wiederhergestellt.\n\n_+3：_Zusätzlich zu +1 und +2: _Ess-Effekte werden ausgelöst_.
actors.hero.talent.water_isfood.comment=

actors.hero.talent.delicious_flying.title=So gut, dass man fliegt
actors.hero.talent.delicious_flying.desc=_+1:_ Beim Essen erhältst du _15 Runden Schweben_.\n\n_+2:_ Beim Essen erhältst du _25 Runden Schweben_.
actors.hero.talent.delicious_flying.comment=„Beim Essen fliegst du hoch hinaus!"

actors.hero.talent.angel_stance.title=Engelshaltung
actors.hero.talent.angel_stance.desc=_+1:_ Wenn der Held _leuchtet_, fügt jeder erlittene Angriff dem Angreifer _30% magischen Gegenschaden_ zu.\n\n_+2:_ Wenn der Held _leuchtet_, fügt jeder erlittene Angriff dem Angreifer _40% magischen Gegenschaden_ zu.\n\n_+3:_ Wenn der Held _leuchtet_, fügt jeder erlittene Angriff dem Angreifer _50% magischen Gegenschaden_ zu.
actors.hero.talent.angel_stance.comment=

actors.hero.talent.thorny_rose.title=Dornige Rose
actors.hero.talent.thorny_rose.desc=_+1：_Bei Treffern auf den Helden wird dem Angreifer _Blutung mit Basiswert 1_ zugefügt.\n\n_+2：_Zusätzlich zu +1: Bei Treffern erleidet der Angreifer zusätzlich _1 Schaden_.
actors.hero.talent.thorny_rose.comment=„Hat sie dir immer noch nicht geantwortet?“

actors.hero.talent.hometown_cloud.title=Wolken der Heimat
actors.hero.talent.hometown_cloud.desc=_+1：_Die Bewegungsgeschwindigkeit auf dem Rückweg _erhöht sich um 20%_.\n\n_+2：_Die Bewegungsgeschwindigkeit auf dem Rückweg _erhöht sich um 40%_.\n\n_+3：_Die Bewegungsgeschwindigkeit auf dem Rückweg _erhöht sich um 60%_.
actors.hero.talent.hometown_cloud.comment=Wirkt, wenn das Yendor-Amulett im Inventar ist.

actors.hero.talent.deep_freeze.title=Extremtiefkälte
actors.hero.talent.deep_freeze.desc=_+1:_ Der Schaden von Waffen mit Frostverzauberung ist um _20% erhöht_.\n\n_+2:_ Zusätzlich zu +1 verursachen physische Angriffe _3 Runden Erfrierung_.\n\n_+3:_ Zusätzlich zu +1 und +2 ist der Schaden gegen Feinde im _Erfrierungs- oder Eis-Zustand_ um _20% erhöht_; wenn das Talent _Eisbrechende Aktion_ aufgewertet wurde, erhöht sich der Schaden zusätzlich um _50%_.
actors.hero.talent.deep_freeze.comment=

actors.hero.talent.frenzied_attack.title=Halt, Kamerad!
actors.hero.talent.frenzied_attack.desc=_+1：_Physische Angriffe haben eine _25%ige Chance_, _2 Runden Raserei_ zu verursachen.\n\n_+2：_Physische Angriffe haben eine _50%ige Chance_, _2 Runden Raserei_ zu verursachen.
actors.hero.talent.frenzied_attack.comment=Feg die Kameraden weg, werde wieder du selbst.

actors.hero.talent.wulei_zhengfa.title=Donner-Bannformel
actors.hero.talent.wulei_zhengfa.desc=_+1：_Erhalte _1 Donner-Stab_. Der Held erleidet keinen Blitzschaden mehr durch den Donner-Stab, sondern _stellt 20% des Blitzschadens als Leben wieder her_.\n\n_+2：_Zusätzlich zu +1 (ohne Ressourcenerhalt): Der Zauberschaden des Donner-Stabs erhöht sich um _30%_.
actors.hero.talent.wulei_zhengfa.comment=Talente, die durch Aufwertung oder Transformation direkt Ressourcen gewähren, teilen sich eine _26-fache Auslösebegrenzung_ (beim Gent _39-fache_).\n\n„Mehr Spannung.“

actors.hero.talent.magic_girl.title=Magical Girl
actors.hero.talent.magic_girl.desc=_+1：_Die Verwendung einer Rolle gewährt _30 Runden Tarnung_. Unter Tarnung erhöht sich der Zauberstabschaden um _20%_.\n\n_+2：_Die Verwendung einer Rolle gewährt _45 Runden Tarnung_ und _10 Runden Leuchten_. Unter Tarnung erhöht sich der Zauberstabschaden um _40%_.
actors.hero.talent.magic_girl.comment=Diese Fertigkeit kann durch Lesen des Buches des Chaos ausgelöst werden.\n\nVerwandlung! Magical Girl Kriegerin!

actors.hero.talent.wide_knowledge.title=Umfangreiches Wissen
actors.hero.talent.wide_knowledge.desc=_+1：_Aufgesammelte Gegenstände _sofort erkennen_, ob sie verflucht sind.\n\n_+2：_Aufgesammelte Gegenstände _sofort identifizieren_.\n\n_+3：_Zusätzlich zu +2: Identifizierte aufgesammelte Gegenstände gewähren _3 Runden Stabaufladung_.
actors.hero.talent.wide_knowledge.comment=

actors.hero.talent.gold_meal.title=Gold im Essen
actors.hero.talent.gold_meal.desc=_+1：_Essen gewährt _25 Goldmünzen_.\n\n_+2：_Essen gewährt _35 Goldmünzen_.
actors.hero.talent.gold_meal.comment=Ist dieser Proviant aus Gold oder das Fleisch aus Gold?

actors.hero.talent.no_viewrape.title=Nicht anstarren
actors.hero.talent.no_viewrape.desc=_+1：_Bei Fernkampfschaden erhält der Angreifer _1 Runde Blindheit_.\n\n_+2：_Bei Fernkampfschaden erhält der Angreifer _2 Runden Blindheit_.\n\n_+3：_Bei Fernkampfschaden erhält der Angreifer _3 Runden Blindheit_.
actors.hero.talent.no_viewrape.comment=„Wer ist dieser Zwerg im lila Minirock und dieser geschminkte Schakal!?“

actors.hero.talent.water_ghost.title=Wassergeist-Rache
actors.hero.talent.water_ghost.desc=_+1：_Wenn ein Feind im Wasser stirbt, besteht eine _20% Chance_, _1 Rachegeist_ zu erzeugen und _5 Runden Raserei_ zu erhalten.\n\n_+2：_Wenn ein Feind im Wasser stirbt, besteht eine _20% Chance_, _1 verdorbenen Rachegeist_ zu erzeugen.
actors.hero.talent.water_ghost.comment=„Leichentuch-Ersatz, mit Wasser gestreckt.“

actors.hero.talent.ash_ledger.title=Aschebuch
actors.hero.talent.ash_ledger.desc=_+1:_ Wenn ein Feind stirbt, erhält der Held _2 Punkte Schild_.\n\n_+2:_ Wenn ein Feind stirbt, erhält der Held _4 Punkte Schild_.
actors.hero.talent.ash_ledger.comment=„Seelenraub."

actors.hero.talent.secret_lighting.title=Geheimnis der Beleuchtung
actors.hero.talent.secret_lighting.desc=_+1：_Lesen einer Schriftrolle gewährt _20 Runden Leuchten_.\n\n_+2：_Gewährt _40 Runden Leuchten_.
actors.hero.talent.secret_lighting.comment=Dieses Talent kann durch Lesen des Buches des Chaos ausgelöst werden.\n\n„Quak! Meine Augen!“

actors.hero.talent.potential_1.title=Potenzialentfaltung
actors.hero.talent.potential_1.desc=_+1：_Erhalte _1 Transformationsschriftrolle_.\n\n_+2：_Kein Effekt.
actors.hero.talent.potential_1.comment=Talente, die durch Aufstieg oder Transformation direkt Ressourcen gewähren, teilen sich _26 Auslösebegrenzungen_ (_39_ für den Gentleman).

