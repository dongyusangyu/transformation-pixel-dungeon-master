actors.hero.talent.potential_9.comment=Talente, die durch Aufstieg oder Transformation direkt Ressourcen gewähren, teilen sich _26 Auslösebegrenzungen_ (_39_ für den Gentleman).

actors.hero.talent.abyssal_gaze.title=Abgrundblick
actors.hero.talent.abyssal_gaze.desc=_+1:_ Der Durchdringungsbonus des Disintegrationszaubers durch Lebewesen oder festes Terrain wird auf _das 2-fache_ erhöht.\n\n_+2:_ Zusätzlich zu +1 wird der Schaden des Disintegrationszaubers um _20%_ erhöht.
actors.hero.talent.abyssal_gaze.comment=„Wenn du in den Abgrund blickst, blickt der Abgrund auch in dich zurück."

actors.hero.talent.moronity.title=Schwachsinn
actors.hero.talent.moronity.desc=_+1：_Zauber mit Stab oder Zauberstab _verursachen zufällig 1 Runde Verwirrung, Verwundbarkeit oder Schwäche_.\n\n_+2：_Zauber mit Stab oder Zauberstab _verursachen zufällig 2 Runden Verwirrung, Verwundbarkeit oder Schwäche_.\n\n_+3：_Zauber mit Stab oder Zauberstab _verursachen zufällig 3 Runden Verwirrung, Verwundbarkeit oder Schwäche_.
actors.hero.talent.moronity.comment=Dieses Talent wendet zufällig einen von drei Debuffs an, nicht alle gleichzeitig.


actors.hero.talent.journey_nature.title=Reise der Natur
actors.hero.talent.journey_nature.desc=_+1：_Die Erhöhung der Samenfallwahrscheinlichkeit durch Naturschuhe wird um _50%_ verstärkt.\n\n_+2：_Wie bei +1 reduziert das Verwurzeln der Naturschuhe den Aufladungsverbrauch um _50%_ (ändert nicht die Mindestaufladung).
actors.hero.talent.journey_nature.comment=Die Schuhe der Jägerin.

actors.hero.talent.love_backstab.title=Liebesrückenstich
actors.hero.talent.love_backstab.desc=_+1：_Schaden gegen _verführte_ Einheiten erhöht sich um _15%_.\n\n_+2：_Schaden gegen _verführte_ Einheiten erhöht sich um _30%_.\n\n_+3：_Schaden gegen _verführte_ Einheiten erhöht sich um _45%_.
actors.hero.talent.love_backstab.comment=Erster Stoß ins Verlies, erstmal die Liebste erstochen.


actors.hero.talent.concept_grid.title=Konzeptraster
actors.hero.talent.concept_grid.desc=_+1:_ Schaden durch Nicht-Hunger und Verzögerungsschaden wird um _1 reduziert_, berechnet nach allen Schadensreduzierungen.\n\n_+2:_ Schaden wird um _2 reduziert_.\n\n_+3:_ Schaden wird um _3 reduziert_.
actors.hero.talent.concept_grid.comment=

actors.hero.talent.abacus.title=Abakus
actors.hero.talent.abacus.desc=_+1:_ Physische Angriffe haben eine _50% Chance_, _2 Punkte stapelbaren Schild_ zu erhalten.\n\n_+2:_ Physische Angriffe haben eine _75% Chance_, _2 Punkte stapelbaren Schild_ zu erhalten.\n\n_+3:_ Physische Angriffe _erhalten garantiert_ _2 Punkte stapelbaren Schild_.
actors.hero.talent.abacus.comment=

actors.hero.talent.time_sand.title=Sand der Zeit
actors.hero.talent.time_sand.desc=_+1：_Die übersprungenen Runden der Sanduhr _verdoppeln sich_.\n\n_+2：_Zusätzlich zu +1: Jeder Ladungspunkt der Sanduhr erhöht die Dauer des Einfrierens der Umgebung um _1 Runde_ (der erste verbrauchte Ladungspunkt zählt nicht).\n\n_+3：_Zusätzlich zu +1 und +2: Die Aufladegeschwindigkeit der Sanduhr erhöht sich um _20%_.
actors.hero.talent.time_sand.comment=„THE WORLD!!!“

actors.hero.talent.damaged_core.title=Beschädigter Kern
actors.hero.talent.damaged_core.desc=_+1:_ Physische Angriffe verursachen zusätzlich _1 magischen Schaden_.\n\n_+2:_ Physische Angriffe verursachen zusätzlich _2 magischen Schaden_.
actors.hero.talent.damaged_core.comment=„Hähnchenbraten ist der Beste!"

actors.hero.talent.read_profitable.title=Lesen lohnt sich
actors.hero.talent.read_profitable.desc=Durch Aufwerten dieses Talents erhält man jedes Mal beim Lesen einer Schriftrolle zufällig _1 Buff_.\n\n_+1：_Mögliche Buffs sind _5 Runden vollständige Reinigung, Schweben oder Hast_.\n\n_+2：_Zusätzlich zu +1 auch _5 Runden Unsichtbarkeit_.\n\n_+3：_Zusätzlich zu +1 und +2 auch _Wiederherstellung von 12.5% der maximalen Lebenspunkte_.
actors.hero.talent.read_profitable.comment=Dieses Talent kann durch Lesen des Buches des Chaos ausgelöst werden.

actors.hero.talent.strength_cloak.title=Verstärkter Umhang
actors.hero.talent.strength_cloak.desc=_+1：_Jeder Aufladungspunkt des Schattenumhangs gewährt zusätzlich _1 Runde Schattentarnung_.\n\n_+2：_Gewährt zusätzlich _1.5 Runden Schattentarnung_.\n\n_+3：_Gewährt zusätzlich _2 Runden Schattentarnung_, und die Aufladegeschwindigkeit erhöht sich _um 20%_.
actors.hero.talent.strength_cloak.comment=

actors.hero.talent.anesthesia.title=Betäubungstinktur
actors.hero.talent.anesthesia.desc=_+1:_ Beim Trinken eines Trankes erhältst du _5 Punkte Schild_, um den nächsten Schaden abzuwehren.\n\n_+2:_ Beim Trinken eines Trankes erhältst du _8 Punkte Schild_, um den nächsten Schaden abzuwehren.
actors.hero.talent.anesthesia.comment=„Tinktur."

actors.hero.talent.wanling_potion.title=Allheilmittel-Trank
actors.hero.talent.wanling_potion.desc=_+1：_Trinken eines Trankes gewährt _2 Runden vollständige Reinigung_.\n\n_+2：_Trinken eines Trankes gewährt _3 Runden vollständige Reinigung_.\n\n_+3：_Trinken eines Trankes gewährt _4 Runden vollständige Reinigung_ und entfernt alle aktuellen Debuffs des Helden.
actors.hero.talent.wanling_potion.comment=„Es ist nicht das Allheilmittel, das sich irgendein Schurkenkönig gewünscht hat.“

actors.hero.talent.active_muscles.title=Aktive Muskeln
actors.hero.talent.active_muscles.desc=_+1:_ Erhalte beim Aufstieg _2 temporäre Stärke_.\n\n_+2:_ Erhalte beim Aufstieg _4 temporäre Stärke_.\n\n_+3:_ Erhalte beim Aufstieg _6 temporäre Stärke_.
actors.hero.talent.active_muscles.comment=Der Effekt hält _400 Runden_ an.

actors.hero.talent.sea_wind.title=Wind der vier Meere
actors.hero.talent.sea_wind.desc=_+1：_Der Held erhält im Wasser _20% mehr Bewegungsgeschwindigkeit_.\n\n_+2：_Erhält _40% mehr_.\n\n_+3：_Erhält _60% mehr_.
actors.hero.talent.sea_wind.comment=„Der Wind erhebt sich, die Wolken ziehen.“\n\n_Rüben Gu_

actors.hero.talent.endless_meal.title=Unendlicher Nachgeschmack
actors.hero.talent.endless_meal.desc=_+1：_Essen gewährt _2 Runden Zeitblase_.\n\n_+2：_Essen gewährt _4 Runden Zeitblase_.\n\n_+3：_Essen gewährt _6 Runden Zeitblase_.
actors.hero.talent.endless_meal.comment=

actors.hero.talent.experience_meal.title=Erfahrung durch Essen
actors.hero.talent.experience_meal.desc=_+1：_Essen gewährt _2 Erfahrungspunkte_.\n\n_+2：_Essen gewährt _3 Erfahrungspunkte_.
actors.hero.talent.experience_meal.comment=Diese Fertigkeit teilt sich mit _Wolkenmahl_, _Unbesiegbarkeitsmahl_ und _Geburtstagsgeschenk_ eine _100er Auslösebegrenzung_.\n\nAus Schaden wird man klug, aus Schaden wird man klug, aus Schaden...

actors.hero.talent.birthday_gift.title=Geburtstagsgeschenk
actors.hero.talent.birthday_gift.desc=_+1:_ Beim Essen besteht eine _17% Wahrscheinlichkeit_ auf _1 niedrigstufigen Drop_.\n\n_+2:_ _33% Wahrscheinlichkeit_ auf _1 niedrigstufigen Drop_.\n\n_+3:_ _50% Wahrscheinlichkeit_ auf _1 niedrigstufigen Drop_.
actors.hero.talent.birthday_gift.comment=Dieses Talent teilt sich mit den Talenten _Essen für Erfahrung_, _Wolkenverstecktes Essen_ und _Unbesiegbares Essen_ eine _Grenze von 100 Auslösungen_.\n\n„Happy Birthday!"

actors.hero.talent.collect_plants.title=Pflanzen sammeln
actors.hero.talent.collect_plants.desc=_+1:_ Erhalte _3 zufällige Samen_.\n\n_+2:_ Erhalte _4 zufällige Samen_.\n\n_+3:_ Erhalte _5 zufällige Samen_ und _1 geschmacklose Frucht_.
actors.hero.talent.collect_plants.comment=Talente, die durch Aufwertung oder Metamorphose direkt Ressourcen beschaffen, teilen sich eine _Grenze von 26 Auslösungen_ (für Gentlemen _39_).\n\nDieses Talent bringt dir keine verrotteten Beerensamen.

actors.hero.talent.sharp_head.title=Spitzer Kopf
actors.hero.talent.sharp_head.desc=_+1：_Stärke _+3_, Genauigkeit _um 17% verringert_.\n\n_+2：_Stärke _+6_, Genauigkeit _um 33% verringert_.\n\n_+3：_Stärke _+9_, Genauigkeit _um 50% verringert_.
actors.hero.talent.sharp_head.comment=„Dann frag ich dich.“

actors.hero.talent.strength_armband.title=Verstärkte Armbinde
actors.hero.talent.strength_armband.desc=_+1：_Die Aufladegeschwindigkeit der Meisterdieb-Armbinde _erhöht sich um 20%_.\n\n_+2：_Zusätzlich zu +1 erhöht sich die Dauer der von Gegnern gestohlenen Debuffs _um 30%_.\n\n_+3：_Zusätzlich zu +1 und +2 gewährt das Bestehlen von Gegnern dem Helden _3 Runden Hormonschub_, und der Aufladungsverbrauch für das Stehlen von Waren reduziert sich _um 1 Punkt_ (der Mindestverbrauch bleibt 1, Erfolgsrate und Aufladungsanforderung bleiben unverändert).
actors.hero.talent.strength_armband.comment=

actors.hero.talent.strength_book.title=Verstärktes Buch des Chaos
#fix9：注释补充
actors.hero.talent.strength_book.desc=_+1：_Das Lesen des Buches des Chaos löst je nachdem, _ob Gegner im Sichtfeld sind_, den Effekt einer _Kampf-/Nicht-Kampf_-Schriftrolle aus.\n\n_+2：_Zusätzlich zu +1 erhöht sich die Aufladegeschwindigkeit des Buches des Chaos _um 20%_.
actors.hero.talent.strength_book.comment=Wie bei Transformationskristallen umfassen _Kampf_-Schriftrollen: Spiegel/Aufladung/Teleportation/Hypnose/Wut/Rache/Angst-Schriftrollen, während _Nicht-Kampf_-Schriftrollen: Identifikation/Exorzismus/Aufladung/Teleportation/Hypnose/Erkundung-Schriftrollen umfassen.\n\n„Das ist das wahre Buch des Chaos.“

actors.hero.talent.eternal_curse.title=Ewiger Fluch
actors.hero.talent.eternal_curse.desc=_+0：_Es werden mindestens _2 Reinigungsrollen_ benötigt, um den Fluch zu entfernen.\n\n_+1：_Es wird nur 1 Reinigungsrolle benötigt, aber die _verzaubernde/siegelnde Wirkung des Fluchs bleibt erhalten_.\n\n_+2：_Es wird nur 1 Reinigungsrolle benötigt, um den Fluch vollständig zu entfernen.
actors.hero.talent.eternal_curse.comment=Viele Flüche lasten nicht schwer.\n\n_Fluch von DM-216_
actors.hero.talent.eternal_curse.unremove=Nicht genug Reinigungen, um den Fluch zu entfernen.

actors.hero.talent.eater.title=Fresssack
actors.hero.talent.eater.desc=_+0：_Die Hungergeschwindigkeit steigt um _30%_.\n\n_+1：_Die Hungergeschwindigkeit steigt um _15%_.\n\n_+2：_Die Hungergeschwindigkeit steigt nicht.
actors.hero.talent.eater.comment=Hör mir zu, hör mir zu, hör mir zu, hör mir zu, hör mir zu, hör mir zu, hör mir zu, ich habe Hunger.

actors.hero.talent.fate_decision.title=Schicksalsentscheidung
actors.hero.talent.fate_decision.desc=_+0：_Wandlungsoptionen _-2_.\n\n_+1：_Wandlungsoptionen _-1_.\n\n_+2：_Wandlungsoptionen bleiben unverändert.
actors.hero.talent.fate_decision.comment=Dies ist das Schicksal.\n\n_DM-216s Wut über fehlgeschlagene Würfe_

actors.hero.talent.endless_malice.title=Endlose Bosheit
actors.hero.talent.endless_malice.desc=_+0：_Jedes Aufheben eines Gegenstands hat eine _40%ige Chance_, _10% der max. LP_ zu entziehen.\n\n_+1：_Jedes Aufheben eines Gegenstands hat eine _30%ige Chance_, _5% der max. LP_ zu entziehen.\n\n_+2：_Gegenstände entziehen keine LP mehr.
actors.hero.talent.endless_malice.comment=Du spürst die Bosheit dieser Gegenstände gegenüber ihrem neuen Besitzer.\n\n_Bosheit von DM-216_
actors.hero.talent.endless_malice.kill=Du wurdest von absichtlichem Game-Design getötet...
actors.hero.talent.endless_malice.rankings_desc=Gestorben durch: Absichtliches Game-Design

actors.hero.talent.feeble.title=Kraftlos
actors.hero.talent.feeble.desc=_+0：_Physischer Schaden _um 20% reduziert_.\n\n_+1：_Physischer Schaden _um 10% reduziert_.\n\n_+2：_Physischer Schaden wird nicht reduziert.
actors.hero.talent.feeble.comment=Niemand da – Niemands-physischer Angriff

actors.hero.talent.malnutrition.title=Mangelernährung
actors.hero.talent.malnutrition.desc=_+0：Im _Zustand starken Hungers_ erhält der Held bei jedem Hungerschaden _10 Runden Verwirrung und Schwäche_.\n\n_+1：Im _Zustand starken Hungers_ erhält der Held bei jedem Hungerschaden _10 Runden Schwäche_.\n\n_+2：_Im Zustand starken Hungers erhält der Held keine zusätzlichen Debuffs.
actors.hero.talent.malnutrition.comment=Heilrezept: KFC Family Bucket x1\nGesamtkosten: 50.

actors.hero.talent.shortsighted.title=Kurzsichtig
actors.hero.talent.shortsighted.desc=_+0：_Sichtweite _um 40% reduziert_.\n\n_+1：_Sichtweite _um 20% reduziert_.\n\n_+2：_Sichtweite wird nicht mehr reduziert.
actors.hero.talent.shortsighted.comment=

actors.hero.talent.bat_serum.title=Fledermausserum
actors.hero.talent.bat_serum.desc=_+0:_ Feinde erhalten _40% Blutungseffekt_ bei Nahkampftreffern.\n\n_+1:_ Feinde erhalten _20% Blutungseffekt_ bei Nahkampftreffern.\n\n_+2:_ Feinde erhalten keinen zusätzlichen Blutungseffekt mehr.
actors.hero.talent.bat_serum.comment=„Mit kühnem Willen Heldenblut trinken, lächelnd Blutpaketblut schlürfen."

actors.hero.talent.myopia.title=Kurzsichtigkeit
actors.hero.talent.myopia.desc=_+0：_Genauigkeit _um 40% reduziert_.\n\n_+1：_Genauigkeit _um 20% reduziert_.\n\n_+2：_Genauigkeit wird nicht mehr reduziert.
actors.hero.talent.myopia.comment=

actors.hero.talent.land_swimming.title=Landschwimmen
actors.hero.talent.land_swimming.desc=_+0：_Riesenpiranhas und Phantom-Piranhas werden durch _Riesenlandpiranhas und Phantom-Landpiranhas_ mit denselben Eigenschaften ersetzt.\n\n_+1：_Riesenlandpiranhas und Phantom-Landpiranhas haben 50% weniger Bewegungsgeschwindigkeit.\n\n_+2：_Riesenpiranhas und Phantom-Piranhas werden nicht mehr ersetzt. Riesenlandpiranhas und Phantom-Landpiranhas an Land sterben sofort.
actors.hero.talent.land_swimming.comment=Der Meister sprach am Fluss: So wie dieser Fluss fließt alles unaufhörlich dahin.\n\n_Keze, am oberen Flussufer stehend, bemerkte, dass die Zahl derer, die hier von Piranhas gefressen wurden, so unerschöpflich ist wie das Wasser des Flusses_

actors.hero.talent.jiulongla_coffin.title=Sarg der Neun Drachen
actors.hero.talent.jiulongla_coffin.desc=_+0：_Reduziert die _max. LP des Helden um 40%_.\n\n_+1：_Reduziert die _max. LP des Helden um 20%_.\n\n_+2：_Reduziert die max. LP des Helden nicht mehr.
actors.hero.talent.jiulongla_coffin.comment=Aus dem Dungeon kam die Schreckensnachricht: Der Held 'Krieger' aß zu viel, hatte auf Stufe 30 schon vollen Proviant und wurde schließlich von einem uralten Gott mit Laser erschossen – verflogen zum Planeten der Fleischpasteten.

actors.hero.talent.cowboy.title=Schwarzhändler
#fix9：补充注释
actors.hero.talent.cowboy.desc=_+0:_ Beim Kauf von Gegenständen besteht eine _30% Wahrscheinlichkeit_, dass sie durch _Schleudersteine_ ersetzt werden.\n\n_+1:_ _15% Wahrscheinlichkeit_ für Ersatz durch Schleudersteine.\n\n_+2:_ Gekaufte Gegenstände werden nicht mehr durch Schleudersteine ersetzt.
actors.hero.talent.cowboy.comment=Beachte, dass auch Behälter (Schriftrollenröhren, Trankgurte und Zaubertaschen) einbezogen sind.\n\n„Alle legalen Einnahmen dieses Projekts werden für den Kauf von Proviant verwendet."\n\n_— Der hungrige Keze_

actors.hero.talent.mamba_out.title=Hommage an Kobe
actors.hero.talent.mamba_out.desc=_+0：_Nach einem Sturz in den Abgrund erhält der Held zusätzlich _50% der max. LP_ als _verzögerten Schaden_.\n\n_+1：_Nach einem Sturz in den Abgrund erhält der Held zusätzlich _25% der max. LP_ als _verzögerten Schaden_.\n\n_+2：_Nach einem Sturz in den Abgrund erhält der Held keinen zusätzlichen verzögerten Schaden mehr.
actors.hero.talent.mamba_out.comment=Langsam! Ich haue den! Mamba Out!

actors.hero.talent.explosion_meal.title=Explosiv lecker
actors.hero.talent.explosion_meal.desc=_+0：_Essen hat eine _20%ige Chance_ zu explodieren.\n\n_+1：_Essen hat eine _10%ige Chance_ zu explodieren.\n\n_+2：_Essen explodiert nicht mehr.
actors.hero.talent.explosion_meal.comment=Du bist der Meister der Granaten.\n\n_Keze_

actors.hero.talent.handon_ground.title=Kopf voraus
actors.hero.talent.handon_ground.desc=_+0：_Beim Ende des _Schwebens_ erhält der Held _Blutung in Höhe von 20% der aktuellen LP_.\n\n_+1：_Beim Ende des _Schwebens_ erhält der Held _Blutung in Höhe von 10% der aktuellen LP_.\n\n_+2：_Beim Ende des Schwebens keine Blutung mehr.
actors.hero.talent.handon_ground.comment=Bei der Landung vorsichtig sein...\nIn Kombination mit 'Lecker fliegen' sehr effektiv.\n\n_Keze_

actors.hero.talent.chill_water.title=Pech beim Trinken
actors.hero.talent.chill_water.desc=_+0:_ Beim Trinken von Tau und Tränken besteht eine _30% Wahrscheinlichkeit_, _Erfrierung_ zu erleiden.\n\n_+1:_ Beim Trinken von Tau besteht eine _15% Wahrscheinlichkeit_, _Erfrierung_ zu erleiden; Tränke verursachen keine Erfrierung mehr.\n\n_+2:_ Weder Tau noch Tränke verursachen Erfrierung.
actors.hero.talent.chill_water.comment=„Pech im Spiel, Pech in der Liebe."\n\n_„Aber das hat keine Auswirkungen auf das Spiel, oder?" – Kezes Geflüster_

actors.hero.talent.life_sport.title=Bewegung ist Leben
#fix9：注释补充
actors.hero.talent.life_sport.desc=_+0：_Warten verursacht _2 Schaden_.\n\n_+1：_Warten verursacht _1 Schaden_.\n\n_+2：_Warten verursacht keinen Schaden mehr.
actors.hero.talent.life_sport.comment=Langes Drücken zum Schlafen löst nur einmal Schaden aus.
actors.hero.talent.life_sport.kill=Bewegung tut Körper und Seele gut...
actors.hero.talent.life_sport.rankings_desc=Gestorben durch: Zu faul

actors.hero.talent.weaken_chalice.title=Geschwächter Kelch
actors.hero.talent.weaken_chalice.desc=_+0：_Der Blutopfer-Schaden des Blutkelchs ist um _100%_ erhöht.\n\n_+1：_Der Blutopfer-Schaden des Blutkelchs ist um _50%_ erhöht.\n\n_+2：_Der Blutopfer-Schaden des Blutkelchs bleibt unverändert.
actors.hero.talent.weaken_chalice.comment=„Der Kelch ist doch nur eine Trophäe, völlig nutzlos, oder?“

actors.hero.talent.extreme_casting.title=Extremes Wirken
actors.hero.talent.extreme_casting.desc=_+1：_Die Aufladegeschwindigkeit von Zauberstäben und Ruten sinkt um _10%_, aber der Zauberschaden steigt um _20%_.\n\n_+2：_Die Aufladegeschwindigkeit von Zauberstäben und Ruten sinkt um _20%_, aber der Zauberschaden steigt um _40%_.\n\n_+3：_Die Aufladegeschwindigkeit von Zauberstäben und Ruten sinkt um _30%_, aber der Zauberschaden steigt um _60%_.
actors.hero.talent.extreme_casting.comment=Explosion!\n\n_Frostmorgen_

actors.hero.talent.precise_shot.title=Präzisionsschuss
actors.hero.talent.precise_shot.desc=_+1：_Wurfwaffenangriffe auf Gegner _jenseits von 3 Feldern_ erhalten _10%_ Genauigkeitsbonus und Schadenserhöhung.\n\n_+2：_Erhalten _20%_ Bonus.\n\n_+3：_Erhalten _30%_ Bonus.
actors.hero.talent.precise_shot.comment=Wenn ein Held mit besonderen Wurfwaffen wie dem Seelenbogen dieses Talent erhält, profitieren auch besondere Wurfwaffen von diesem Bonus.

actors.hero.talent.exploration_intuition.title=Erkundungsintuition
actors.hero.talent.exploration_intuition.desc=_+1：_Die passive Entdeckung von Geheimtüren und Fallen _erhöht sich um 50%_.\n\n_+2：_Die passive Entdeckung von Geheimtüren und Fallen _erhöht sich um 100%_.
actors.hero.talent.exploration_intuition.comment=Lass mich sehen!

actors.hero.talent.fudi_chouxin.title=Kesselflicker
actors.hero.talent.fudi_chouxin.desc=_+1：_Physische Angriffe haben eine _25%ige Chance_, _2 Runden Schwäche_ zu verursachen.\n\n_+2：_Physische Angriffe haben eine _50%ige Chance_, _2 Runden Schwäche_ zu verursachen.
actors.hero.talent.fudi_chouxin.comment=Neutralisation.

actors.hero.talent.poison_inbody.title=Gift im Körper
actors.hero.talent.poison_inbody.desc=_+1：_Pro aktivem Debuff _auf sich selbst_ erhöht sich der physische Angriffsschaden _um 10%_.\n\n_+2：_Pro aktivem Debuff _erhöht sich der Schaden _um 20%_.
actors.hero.talent.poison_inbody.comment=„Noch ein guter Held?“

actors.hero.talent.treasure_sense.title=Schatzsinn
actors.hero.talent.treasure_sense.desc=_+1：_Beim Betreten einer neuen Ebene besteht eine _17% Chance_, die Position aller Gegenstände zu erfahren.\n\n_+2：_Beim Betreten einer neuen Ebene besteht eine _33% Chance_, die Position aller Gegenstände zu erfahren.\n\n_+3：_Beim Betreten einer neuen Ebene besteht eine _50% Chance_, die Position aller Gegenstände zu erfahren.
actors.hero.talent.treasure_sense.comment=„Ich·se·he·dich.“

actors.hero.talent.seed_recycling.title=Samenrecycling
actors.hero.talent.seed_recycling.desc=_+1：_Nach dem Zertreten einer Pflanze besteht eine _20%ige Chance_, ihren Samen zu erhalten.\n\n_+2：_Eine _40%ige Chance_.
actors.hero.talent.seed_recycling.comment=Dieses Talent beeinflusst nicht den normalen Fall von Faulbeersamen.\n\n„Im Kreislauf der Wiedergeburt wird alles genährt.“\n\n_Frostmorgen_

actors.hero.talent.hedonism.title=Hedonismus
actors.hero.talent.hedonism.desc=_+1：_Befindet sich der Held nicht in _Hunger oder starkem Hunger_, wird der _verursachte Schaden um 2 erhöht_, vor allen anderen Schadensboni.\n\n_+2：_Befindet sich der Held nicht in _Hunger oder starkem Hunger_, wird der _verursachte Schaden um 4 erhöht_, vor allen anderen Schadensboni.
actors.hero.talent.hedonism.comment=Ruhe verliert, Leben verliert, ewig ruhen, ewig nichts!

actors.hero.talent.beyond_limit.title=Grenzen überwinden
actors.hero.talent.beyond_limit.desc=_+1:_ Erhalte beim Aufstieg _20 Runden Eile und Hormonschub_.\n\n_+2:_ Erhalte beim Aufstieg _40 Runden Eile und Hormonschub_.\n\n_+3:_ Erhalte beim Aufstieg _60 Runden Eile und Hormonschub_.
actors.hero.talent.beyond_limit.comment=

actors.hero.talent.healthy_food.title=Gesundes Essen
actors.hero.talent.healthy_food.desc=_+1：_Essen gewährt _2 Runden vollständige Reinigung_.\n\n_+2：_Essen gewährt _3 Runden vollständige Reinigung_.\n\n_+3：_Essen gewährt _4 Runden vollständige Reinigung_.
actors.hero.talent.healthy_food.comment=Runter mit dem Fladenbrot, wieder ein ganzer Kerl.

actors.hero.talent.mental_collapse.title=Geistiger Zusammenbruch
actors.hero.talent.mental_collapse.desc=_+0：_Physische Angriffe auf Gegner haben eine _20%ige Chance_, _50% des Schadens zurückzuerhalten_.\n\n_+1：_Physische Angriffe auf Gegner haben eine _10%ige Chance_, _50% des Schadens zurückzuerhalten_.\n\n_+2：_Physische Angriffe fügen keinen Rückschlag mehr zu.
actors.hero.talent.mental_collapse.comment=„Wer hat mich getötet?“\n„Und wen habe ich getötet!“

actors.hero.talent.unavoidable.title=Unvermeidbar
actors.hero.talent.unavoidable.desc=_+0：_Der erlittene Schaden beträgt mindestens _10% der maximalen Gesundheit_.\n\n_+1：_Der erlittene Schaden beträgt mindestens _5% der maximalen Gesundheit_.\n\n_+2：_Es gibt keine Mindestschadensgrenze mehr.
actors.hero.talent.unavoidable.comment=

actors.hero.talent.parasitism.title=Parasitismus
actors.hero.talent.parasitism.desc=_+0：_Nach dem Tod eines Gegners besteht eine _20%ige Chance, 1 Urzeitgottlarve_ zu erzeugen.\n\n_+1：_Nach dem Tod eines Gegners besteht eine _10%ige Chance, 1 Urzeitgottlarve_ zu erzeugen.\n\n_+2：_Nach dem Tod eines Gegners werden keine Urzeitgottlarven mehr erzeugt.
actors.hero.talent.parasitism.comment=Durch dieses negative Talent erzeugte Urzeitgottlarven werden weiterhin von diesem Talent beeinflusst.\n\n„Im Verlies ist es so schmutzig… ein paar Parasiten sind doch normal (im Abwasserkanal kann Parasitismus das Spielerlebnis stark verbessern).“\n\n_Äußerste Bosheit von Keze_

actors.hero.talent.dump_truck.title=Müllkippe
actors.hero.talent.dump_truck.desc=_+0：_Feinde mit der Eigenschaft _Riese_ verursachen _100% mehr Schaden_ und haben _100% mehr Bewegungsgeschwindigkeit_.\n\n_+1：_Feinde mit der Eigenschaft _Riese_ verursachen _50% mehr Schaden_ und haben _50% mehr Bewegungsgeschwindigkeit_.\n\n_+2：_Feinde mit der Eigenschaft Riese erhalten keine Schadens- oder Geschwindigkeitsboni mehr.
actors.hero.talent.dump_truck.comment=_Riesenartige_ Feinde umfassen DM-200, DM-201, DM-300, Golem, Rostfaust, Goldgolem und riesige Elitefeinde.\n\nDirekt drei Lastwagen voll für dich!

actors.hero.talent.burnout_champion.title=Verbannter Champion
actors.hero.talent.burnout_champion.desc=_+0:_ Bei Bewegung besteht eine _4% Wahrscheinlichkeit_, _3 Runden Brennen_ zu erhalten.\n\n_+1:_ Bei Bewegung besteht eine _2% Wahrscheinlichkeit_, _3 Runden Brennen_ zu erhalten.\n\n_+2:_ Bewegung hat keine Chance mehr, Selbstentzündung zu verursachen.
actors.hero.talent.burnout_champion.comment=„Dies ist das Los Angeles um 4 Uhr morgens, das Kobe sehen wollte."

actors.hero.talent.photophoby.title=Lichtscheu
actors.hero.talent.photophoby.desc=_+0：_Im _Leuchtend-Zustand_ _sinken Genauigkeit und Schaden um 40%_.\n\n_+1：_Im _Leuchtend-Zustand_ _sinken Genauigkeit und Schaden um 20%_.\n\n_+2：_Im Leuchtend-Zustand sinken Genauigkeit und Schaden nicht mehr.
actors.hero.talent.photophoby.comment=

actors.hero.talent.outcontrol_magic.title=Kontrollverlust-Magie
actors.hero.talent.outcontrol_magic.desc=_+0：_Beim Zaubern mit Stab oder Zauberstab besteht eine _40%ige Chance_, selbst zu explodieren.\n\n_+1：_Beim Zaubern mit Stab oder Zauberstab besteht eine _20%ige Chance_, selbst zu explodieren.\n\n_+2：_Beim Zaubern mit Stab oder Zauberstab explodiert man nicht mehr selbst.
actors.hero.talent.outcontrol_magic.comment=„Louises Magie.“

actors.hero.talent.winter_swimming.title=Winter-Schwimm-Oddball
actors.hero.talent.winter_swimming.desc=_+0：_Der Held erhält bei Bewegung im Wasser mit _10% Wahrscheinlichkeit_ _3 Runden Frostbrand_.\n\n_+1：_Der Held erhält bei Bewegung im Wasser mit _5% Wahrscheinlichkeit_ _3 Runden Frostbrand_.\n\n_+2：_Der Held erhält bei Bewegung im Wasser keinen Frostbrand mehr.
actors.hero.talent.winter_swimming.comment=„Eine harmlosere Standard-Fertigkeit.“\n\n_— Keze_

actors.hero.talent.fire_wood.title=Feuer und Flamme
actors.hero.talent.fire_wood.desc=_+0：_Angriffe auf Feinde haben eine _10%ige Chance, beide Seiten 10 Runden zu verführen und 3 Runden zu entzünden_.\n\n_+1：_Angriffe auf Feinde haben eine _5%ige Chance, beide Seiten 10 Runden zu verführen und 3 Runden zu entzünden_.\n\n_+2：_Angriffe lassen Feinde keine feurige Liebe mehr spüren.
actors.hero.talent.fire_wood.comment=Wir wirbeln die ganze Nacht, bis wir in den Flammen verschwinden.\n\nKinder, die dürres Holz sammeln, verbrennen ihre Wandlungsrollen – Keze kichert

actors.hero.talent.be_inconstant.title=Unbeständigkeit
actors.hero.talent.be_inconstant.desc=_+0:_ Beim Aufheben einer Waffe besteht eine _20% Wahrscheinlichkeit_, dass sie sofort ausgerüstet wird.\n\n_+1:_ Beim Aufheben einer Waffe besteht eine _10% Wahrscheinlichkeit_, dass sie sofort ausgerüstet wird.\n\n_+2:_ Aufgehobene Waffen werden nicht sofort ausgerüstet.
actors.hero.talent.be_inconstant.comment=

actors.hero.talent.unbear_hunger.title=Unerträglicher Hunger
actors.hero.talent.unbear_hunger.desc=_+0：_Erlittener Hungerschaden_ um 100% erhöht_.\n\n_+1：_Erlittener Hungerschaden_ um 50% erhöht_.\n\n_+2：_Erlittener Hungerschaden wird nicht mehr erhöht.
actors.hero.talent.unbear_hunger.comment=

actors.hero.talent.vip_meal.title=Mitglieder-Restaurant
actors.hero.talent.vip_meal.desc=_+0：_Essen verbraucht _20%_ des aktuellen Goldes.\n\n_+1：_Essen verbraucht _10%_ des aktuellen Goldes.\n\n_+2：_Essen verbraucht kein Gold mehr.
actors.hero.talent.vip_meal.comment=„Ein Held hat drei große Gelüste: Esslust, Erkundungslust, Schatzsuchlust.“

actors.hero.talent.fast_die.title=Schnelles Ende
actors.hero.talent.fast_die.desc=_+0：_Jeder Ladevorgang reduziert die LP um _40% der max. LP_.\n\n_+1：_Jeder Ladevorgang reduziert die LP um _20% der max. LP_.\n\n_+2：_Ladevorgänge reduzieren keine LP mehr.
actors.hero.talent.fast_die.comment=Diese Fertigkeit tötet den Helden nicht, sondern lässt mindestens 1 LP übrig.\n\nHinweis: Nach Erhalt des Yendor-Amuletts wird beim Betreten des Endbildschirms ein Autoload ausgelöst, der LP reduziert.\n\nAlso habe ich diesen Speicherstand persönlich beendet!\nDu denkst nur ans Spielen anderer Spiele!

actors.hero.talent.wash_hand.title=Händewaschen vor dem Essen
actors.hero.talent.wash_hand.desc=_+0：_Beim Sammeln von Tau besteht eine _20% Chance_, _3 Runden vergiftet_ zu werden.\n\n_+1：_Beim Sammeln von Tau besteht eine _10% Chance_, _3 Runden vergiftet_ zu werden.\n\n_+2：_Beim Sammeln von Tau wird man nicht mehr vergiftet.
actors.hero.talent.wash_hand.comment=„Warum ist Leitungswasser dreckig, aber ein damit gewaschener Apfel sofort essbar?“\n\n_— Keze, hilfreich bereitgestellte Standard-Fertigkeit_

actors.hero.talent.thorns_sprang.title=Dornengestrüpp
actors.hero.talent.thorns_sprang.desc=_+0：_Betreten von hohem Gras verursacht mit _20% Wahrscheinlichkeit_ eine _Blutung mit Basiswert 1_.\n\n_+1：_Betreten von hohem Gras verursacht mit _10% Wahrscheinlichkeit_ eine _Blutung mit Basiswert 1_.\n\n_+2：_Betreten von hohem Gras verursacht keine Blutung mehr.
actors.hero.talent.thorns_sprang.comment=„Die Folge, wenn man ohne Schuhe durchs Gras läuft.“\n\n_— Keze, hilfreiche Standard-Fertigkeit_

actors.hero.talent.fullpassion.title=Volle Leidenschaft
actors.hero.talent.fullpassion.desc=_+0：_Alle Mimics _verursachen 60% mehr Überraschungsschaden_ und haben _2-fache Bewegungsgeschwindigkeit_.\n\n_+1：_Alle Mimics _verursachen 30% mehr Überraschungsschaden_ und haben _1,5-fache Bewegungsgeschwindigkeit_.\n\n_+2：_Alle Mimics haben normale Überraschungsschäden und Bewegungsgeschwindigkeit.
actors.hero.talent.fullpassion.comment=Wer wagt es jetzt noch, den Zahn zu ziehen?\n\n_Leidenschaft von DM-216_

actors.hero.talent.fullfighting.title=Kampfeslust
actors.hero.talent.fullfighting.desc=_+0：_Das Töten von Feinden hat eine _60%ige Chance_, alle Feinde auf der Etage zu wecken.\n\n_+1：_Das Töten von Feinden hat eine _30%ige Chance_, alle Feinde auf der Etage zu wecken.\n\n_+2：_Das Töten von Feinden weckt keine Feinde mehr auf der Etage.
actors.hero.talent.fullfighting.comment=

actors.hero.talent.phaseclaw.title=Phasenklaue
actors.hero.talent.phaseclaw.desc=_+0：_Gegner _Angriffsreichweite +1_, Angriffe haben _10% Chance auf 3 Runden Verwundbarkeit_.\n\n_+1：_Gegner _Angriffsreichweite +1_.\n\n_+2：_Gegner Angriffsreichweite erhöht sich nicht mehr.
actors.hero.talent.phaseclaw.comment=

actors.hero.talent.backfired.title=Feuer fangen
actors.hero.talent.backfired.desc=_+1:_ Beim Trinken eines Flüssigfeuer-Trankes erhältst du _5 Runden Feuerkraft_.\n\n_+2:_ Beim Trinken eines Flüssigfeuer-Trankes erhältst du _8 Runden Feuerkraft_.
actors.hero.talent.backfired.comment=„Bei Kälte sollte man heiße Getränke trinken!"\n\n_Frostmorgen_

actors.hero.talent.goldofbook.title=Gold im Buch
actors.hero.talent.goldofbook.desc=_+1：_Lesen einer Rolle gewährt _50 Goldmünzen_.\n\n_+2：_Lesen einer Rolle gewährt _100 Goldmünzen_.
actors.hero.talent.goldofbook.comment=Diese Fertigkeit kann durch Lesen des Buches des Chaos ausgelöst werden.\n\nIch dachte, im Buch steckt ein goldenes Haus wäre nur ein Spruch...

actors.hero.talent.extreme_reaction.title=Extreme Reaktion
actors.hero.talent.extreme_reaction.desc=_+1：_Ausweichen vor physischen Angriffen gewährt _1 Runde Hormonschub_.\n\n_+2：_Ausweichen vor physischen Angriffen gewährt _2 Runden Hormonschub_.\n\n_+3：_Ausweichen vor physischen Angriffen gewährt _3 Runden Hormonschub_.
actors.hero.talent.extreme_reaction.comment=Hat der Held mehr als 5 Runden Hormonschub, wird kein weiterer Hormonschub gestapelt.

actors.hero.talent.deep_fear.title=Tiefenangst
actors.hero.talent.deep_fear.desc=_+0:_ Mit zunehmender Etagentiefe reduziert sich die maximale Lebenspunkte des Helden um _3x die maximal erreichte Etagenzahl_.\n\n_+1:_ Reduzierung um _2x die maximal erreichte Etagenzahl_.\n\n_+2:_ Die maximale Lebenspunkte wird nicht mehr mit der Etagentiefe reduziert.
actors.hero.talent.deep_fear.comment=„Held, geh runter in die 100. Etage! (Eigentlich gibt es keine 100 Etagen)"\n\n_Von DM-216 implantierte Angst_

actors.hero.talent.no_door.title=Keine Türen
actors.hero.talent.no_door.desc=_+0：_Wahrscheinlichkeit, dass normale Türen durch versteckte Türen ersetzt werden _x2_.\n\n_+1：_Wahrscheinlichkeit, dass normale Türen durch versteckte Türen ersetzt werden _x1.5_.\n\n_+2：_Erhöht die Wahrscheinlichkeit nicht mehr.
actors.hero.talent.no_door.comment=

actors.hero.talent.updraft.title=Aufwind
actors.hero.talent.updraft.desc=_+0：_Beim Brennen erhältst du _gleich viele Runden Schweben_, beim Schweben erhältst du _gleich viele Runden Brennen_.\n\n_+1：_Beim Brennen erhältst du _gleich viele Runden Schweben_, beim Schweben erhältst du keine Brennen-Runden mehr.\n\n_+2：_Weder Brennen noch Schweben verleihen die entsprechenden Effekte mehr.
actors.hero.talent.updraft.comment=Durch dieses Negativtalent erhaltenes Schweben und Brennen stapeln die entsprechenden Effekte nicht weiter.\n\n„Falls der Schwebezustand im Kerker auf Düsenmagie beruht...“

actors.hero.talent.quantum_hacking.title=Quanten-Hacking
actors.hero.talent.quantum_hacking.desc=_+1：_Nach einem Treffer mit einem Stab- oder Zauberstabzauber erhält das Ziel _1 Runde Betäubung_.\n\n_+2：_Das Ziel erhält _2 Runden Betäubung_.
actors.hero.talent.quantum_hacking.comment=„Lange Zeit stagnierte die Erforschung der Magie, bis man begann, mit magischer Kraft in die Gehirne von Lebewesen einzudringen.“

actors.hero.talent.cicada_dance.title=Zikadentanz
actors.hero.talent.cicada_dance.desc=_+1:_ Wenn der Held einen Feind durch einen physischen Angriff tötet, erhält er _2 Runden Unsichtbarkeit_.\n\n_+2:_ Der Held erhält _3 Runden Unsichtbarkeit_.\n\n_+3:_ Der Held erhält _4 Runden Unsichtbarkeit_.
actors.hero.talent.cicada_dance.comment=

actors.hero.talent.chocolate_coins.title=Schokoladenmünzen
actors.hero.talent.chocolate_coins.desc=_+1:_ Wenn du Hungerschaden erleidest und mehr als 75 Goldmünzen im Rucksack hast, werden _37 Münzen verbraucht_, um diesen Schaden zu verhindern.\n\n_+2:_ Wenn du mehr als 50 Goldmünzen hast, werden _25 Münzen verbraucht_, um den Hungerschaden zu verhindern.
actors.hero.talent.chocolate_coins.comment=„Vielleicht der schlechte Geschmack eines Magiers, aber diese Münzen sind essbar."

actors.hero.talent.ghost_gift.title=Geistgeschenk
actors.hero.talent.ghost_gift.desc=_+1：_Nach Wahl der Rüstungsbelohnung vom Trauergeist besteht eine _75%ige Chance_, auch die Waffenbelohnung zu erhalten.\n\n_+2：_Nach Wahl der Rüstungsbelohnung vom Trauergeist wird _garantiert_ auch die Waffenbelohnung erhalten.
actors.hero.talent.ghost_gift.comment=Wird die Waffenbelohnung gewählt, wirkt diese Fertigkeit nicht.\n\nGeistschwester, du bist meine beste Freundin.

actors.hero.talent.personal_attack.title=Persönlicher Angriff
actors.hero.talent.personal_attack.desc=_+1：_Beim Lesen einer Wutschriftrolle erhalten betroffene Gegner _5 Runden Verwundbarkeit_.\n\n_+2：_Beim Lesen einer Wutschriftrolle erhalten betroffene Gegner _5 Runden Verwundbarkeit_ und _5 Runden Schwäche_.
actors.hero.talent.personal_attack.comment=Durch Aufwerten dieses Talents erhält man zusätzlich _1 Wutschriftrolle_. Das Talent kann auch durch Lesen der Wutschriftrolle im Buch des Chaos ausgelöst werden.\n\nTalente, die durch Aufstieg oder Transformation direkt Ressourcen gewähren, teilen sich _26 Auslösebegrenzungen_ (_39_ für den Gentleman).\n\n„Warum schreist du so laut.“

actors.hero.talent.shoot_satellite.title=Satelliten abschießen
actors.hero.talent.shoot_satellite.desc=_+1：_Schaden gegen Gegner im _Flugzustand_ _um 20% erhöht_.\n\n_+2：_Um 30% erhöht_.
actors.hero.talent.shoot_satellite.comment=Wenn ein Gegner im _Flugzustand_ mit einem Steinwurf getroffen wird, _verdoppelt sich der Schaden_.\n\nGegner, die sich normalerweise im _Flugzustand_ befinden: Goldbiene, Geist, Fluchgeist, Fliegenschwarm, neugeborenes Feuerelementar, Vampirfledermaus, Kristallcluster, Feuer-, Eis-, Blitz- und Chaoselementar, Böses Auge, Erzdämon, Goldelementar. Du kannst auch Gegner mit _Schweben_ belegen, um dieses Talent auszulösen.\n\n„Verlies-Schuldengeschichte: ‚Der Kriegergroßvater zerschmettert den Urzeitgott mit drei +20-versteinerten Kugeln.‘“

actors.hero.talent.holy_faith.title=Glaube an das Heilige Licht
actors.hero.talent.holy_faith.desc=_+1：_Erhält der Held _Leuchten_, erhält er zusätzlich _5 Runden Segen und Zauberstab-Aufladung_.\n\n_+2：_Erhält der Held _Leuchten_, erhält er zusätzlich _7 Runden Segen und Zauberstab-Aufladung_.\n\n_+3：_Erhält der Held _Leuchten_, erhält er zusätzlich _9 Runden Segen, Zauberstab-Aufladung_ und _4 Runden Artefakt-Aufladung_.
actors.hero.talent.holy_faith.comment=

actors.hero.talent.honey_fish.title=Honigfischglas
actors.hero.talent.honey_fish.desc=_+1：_Werfen eines Honigglases erzeugt Wasser und einen Riesenpiranha anstelle einer goldenen Biene. Der Riesenpiranha erhält _50 Runden Raserei_.\n\n_+2：_Wie bei +1 wird an der Zerbruchstelle zusätzlich _ein Wasserexplosionstrank-Effekt_ ausgelöst.
actors.hero.talent.honey_fish.comment=Durch diese Fertigkeit erzeugte Riesenpiranhas können durch Phantom-Piranhas ersetzt werden und sind vom negativen Talent _Landschwimmen_ betroffen.\n\nEin blaues, undurchsichtiges Aquarium.

actors.hero.talent.instant_refining.title=Sofortige Veredelung
actors.hero.talent.instant_refining.desc=_+1：_Beim Tod eines Feindes hat der Held eine _40%ige Chance_, 1 Alchemieenergie zu erhalten.\n\n_+2：_Beim Tod eines Feindes hat der Held eine _60%ige Chance_, 1 Alchemieenergie zu erhalten.
actors.hero.talent.instant_refining.comment=Der Beutefall dieser Fertigkeit unterliegt ebenfalls der Heldenstufenbegrenzung.\n\nSchnapp es dir, im Nu veredelt.

actors.hero.talent.changqi_bookstore.title=Changqi-Bücherei
actors.hero.talent.changqi_bookstore.desc=_+1:_ Beim Lesen einer Schriftrolle besteht eine _30% Wahrscheinlichkeit_, _1 zufälligen Runenstein_ zu erhalten.\n\n_+2:_ _45% Wahrscheinlichkeit_, _1 zufälligen Runenstein_ zu erhalten.\n\n_+3:_ _60% Wahrscheinlichkeit_, _1 zufälligen Runenstein_ zu erhalten.
actors.hero.talent.changqi_bookstore.comment=Dieses Talent erwirbt keine Verzauberungsrunensteine, kann aber durch Lesen des Chaotischen Grimoires ausgelöst werden. Die Anzahl der Ressourcenbeschaffungen ist _auf 26 begrenzt_ (für Gentlemen _39_) und diese Begrenzung wird mit den meisten Talenten geteilt, die durch Aufwertung oder Metamorphose direkt Ressourcen beschaffen.

actors.hero.talent.ascension_curse.title=Himmelfahrtsfluch
actors.hero.talent.ascension_curse.desc=_+1:_ Die Schriftrolle kann den Zauber _Himmelfahrtsfluch_ wirken, der 1 Ladung verbraucht und _5 Runden Schweben_ verleiht.\n\n_+2:_ Die Schriftrolle kann den Zauber _Himmelfahrtsfluch_ wirken, der 1 Ladung verbraucht und _8 Runden Schweben_ verleiht.
actors.hero.talent.ascension_curse.comment=„Flieg hoch!"

actors.hero.talent.divine_protection.title=Göttlicher Schutz
actors.hero.talent.divine_protection.desc=_+1：_Der Codex kann _Göttlichen Schutz_ wirken, der 5 Aufladungen verbraucht, um _3 Runden Unverwundbarkeit_ zu gewähren.\n\n_+2：_Der Codex kann _Göttlichen Schutz_ wirken, der 5 Aufladungen verbraucht, um _5 Runden Unverwundbarkeit_ zu gewähren.
actors.hero.talent.divine_protection.comment=Ich habe Verbindungen da oben.

actors.hero.talent.shepherd_intention.title=Hirtengebot
actors.hero.talent.shepherd_intention.desc=_+1：_Die Bibel kann den Zauber _Hirtengebot_ wirken, der 3 Aufladungen verbraucht, um an einem bestimmten Ort _eine kleine Gruppe magischer Schafe_ zu erschaffen.\n\n_+2：_Um _eine Gruppe magischer Schafe_ zu erschaffen.
actors.hero.talent.shepherd_intention.comment=„Woher kommen diese Schafe?“

actors.hero.talent.conversion_holy.title=Bekehrung zum Heiligen Gesetz
actors.hero.talent.conversion_holy.desc=_+1:_ Die Schriftrolle kann den Zauber _Bekehrung zum Heiligen Gesetz_ wirken, der 5 Ladungen verbraucht, um _jedes Ziel in Sichtweite zu verderben_.\n\n_+2:_ Zusätzlich zu +1 erhält das Ziel _10 Runden Segen_.
actors.hero.talent.conversion_holy.comment=Durch diesen Zauber verdorbene Feinde lassen keine Gegenstände fallen.\n\n„Tritt der Heiligen Kirche bei, tritt der Heiligen Kirche bei, danke."

actors.hero.talent.purifying_evil.title=Reinigung des Bösen
actors.hero.talent.purifying_evil.desc=_+1：_Die Bibel kann den Zauber _Reinigung des Bösen_ wirken, der 3 Aufladungen verbraucht, um _alle Buffs des Ziels zu entfernen_.\n\n_+2：_Zusätzlich zu +1 entfernt es auch _den Elite-Effekt des Ziels_.\n\n_+3：_Zusätzlich zu +1 und +2 fügt es Gegnern mit _Untoten- oder Dämonenattribut_ _20% der maximalen Lebenspunkte des Helden_ als Schaden zu (halbiert gegen Bosse).
actors.hero.talent.purifying_evil.comment=

actors.hero.talent.divine_storm.title=Göttlicher Machtsturm
actors.hero.talent.divine_storm.desc=_+1：_Der Codex kann _Göttlicher Machtsturm_ wirken, der 3 Aufladungen verbraucht, um ein _3x3_ Feld für _10 Runden_ zu erzeugen.\n\n_+2：_Der Codex kann _Göttlicher Machtsturm_ wirken, der 3 Aufladungen verbraucht, um ein _7x7_ Feld für _20 Runden_ zu erzeugen.\n\n_+3：_Wie bei +2, zusätzlich entsteht ein _5x5_ Feuerfeld für _5 Runden_.
actors.hero.talent.divine_storm.comment=

actors.hero.talent.genesis.title=Genesis
actors.hero.talent.genesis.desc=_+1：_Der Codex kann _Genesis_ wirken, der 8 Aufladungen verbraucht, um _die Talentpunkte der letzten zwei Etagen zurückzusetzen_.\n\n_+2：_Der Codex kann _Genesis_ wirken, der 8 Aufladungen verbraucht, um _alle Talentpunkte zurückzusetzen_.
actors.hero.talent.genesis.comment=Und so begann alles sich umzukehren.

actors.hero.talent.indulgence.title=Ablassbrief
actors.hero.talent.indulgence.desc=_+1：_Der Codex kann _Ablassbrief_ wirken, der _200 Gold_ verbraucht, um 1 Codex-Aufladung zurückzugewinnen.\n\n_+2：_Der Codex kann _Ablassbrief_ wirken, der _150 Gold_ verbraucht, um 1 Codex-Aufladung zurückzugewinnen.
actors.hero.talent.indulgence.comment=Dieser Zauber wirkt nicht auf Codex-Kopien.\n\nReue.

actors.hero.talent.silver_language.title=Silberne Worte
actors.hero.talent.silver_language.desc=_+1：_Die Bibel kann den Zauber _Silberne Worte_ wirken, der 2 Aufladungen verbraucht, um dem Ziel _3 Runden Raserei_ zu geben.\n\n_+2：_Gibt _5 Runden Raserei_.
actors.hero.talent.silver_language.comment=„Wer hätte gedacht, dass die Bibel solche derben Worte enthält?“

actors.hero.talent.resurrection.title=Wiederbelebung
actors.hero.talent.resurrection.desc=_+1：_Die Bibel kann den Zauber _Wiederbelebung_ wirken, der 8 Aufladungen verbraucht, um sich selbst oder einem Verbündeten _5 Runden Totenbeschwörung_ zu gewähren. Stirbt man während dieser Zeit, wird man sofort wiederbelebt.\n\n_+2：_Gewährt _10 Runden Totenbeschwörung_.\n\n_+3：_Gewährt _10 Runden Totenbeschwörung_ und nach Wiederbelebung _20 Runden Segen_.
actors.hero.talent.resurrection.comment=Wird der Zauber auf einen Verbündeten gewirkt, wird er im besten Zustand wiederbelebt. Wird er auf den Helden selbst gewirkt, wird er mit höchstens 1 Lebenspunkt wiederbelebt.

actors.hero.talent.bone_fire.title=Knochenfeuer
actors.hero.talent.bone_fire.desc=_+0:_ Erzeugtes _Feuer erlischt nicht auf natürliche Weise_; die Wahrscheinlichkeit, dass Gegenstände durch Feuerschaden zerstört werden, ist _verdoppelt_.\n\n_+1:_ Erzeugtes _Feuer erlischt nicht auf natürliche Weise_.\n\n_+2:_ Erzeugtes Feuer erlischt normal.
actors.hero.talent.bone_fire.comment=

actors.hero.talent.jump_face_silicone.title=Gesichtssprung
actors.hero.talent.jump_face_silicone.desc=_+0：_Beim Aufwachen erhält der Feind _2 Runden Zeitblase_.\n\n_+1：_Beim Aufwachen erhält der Feind _1 Runde Zeitblase_.\n\n_+2：_Beim Aufwachen erhält der Feind keine Zeitblase mehr.
actors.hero.talent.jump_face_silicone.comment=Wao!\n\n_Frostmorgen_

actors.hero.talent.grass_mob.title=Gras Feinde
actors.hero.talent.grass_mob.desc=_+0：_Zerstörtes hohes Gras hat eine _20%ige Chance, 1 Fäulnistentakel_ zu erzeugen.\n\n_+1：_Zerstörtes hohes Gras hat eine _10%ige Chance, 1 Fäulnistentakel_ zu erzeugen.\n\n_+2：_Zerstörtes hohes Gras erzeugt keine Fäulnistentakel mehr.
actors.hero.talent.grass_mob.comment=

actors.hero.talent.disaster_curse.title=Unheilsfluch
actors.hero.talent.disaster_curse.desc=_+0：_Feinde haben bei Nahkampftreffern eine _50%ige Chance, 1 Runde Verlangsamung und Schwäche zu verursachen_.\n\n_+1：_Feinde haben bei Nahkampftreffern eine _25%ige Chance, 1 Runde Verlangsamung und Schwäche zu verursachen_.\n\n_+2：_Feinde verursachen bei Nahkampftreffern keine Verlangsamung oder Schwäche mehr.
actors.hero.talent.disaster_curse.comment=

actors.hero.talent.ashes_bow.title=Aschebogen
actors.hero.talent.ashes_bow.desc=_+1:_ Wurfwaffen fügen bei Schaden _1 Runde Brennen_ zu.\n\n_+2:_ Wurfwaffen fügen bei Schaden _2 Runden Brennen_ zu.\n\n_+3:_ Wurfwaffen fügen bei Schaden _3 Runden Brennen_ zu.
actors.hero.talent.ashes_bow.comment=Dieses Talent _hat eine Abklingzeit von 15 Runden_.\n\nWenn ein Held mit einer besonderen Wurfwaffe wie dem Psychobogen dieses Talent erhält, profitiert die Waffe ebenfalls.
actors.hero.talent$ashesbowcooldown.name=Aschebogen - Abklingzeit
actors.hero.talent$ashesbowcooldown.desc=Du hast dieses Talent gerade erst eingesetzt und musst eine Weile warten, bevor du es erneut einsetzen kannst.\n\nVerbleibende Abklingzeit: %s Runden

actors.hero.talent.swift_church.title=Schnelle-Distel-Kirche
actors.hero.talent.swift_church.desc=_+1：_Erhalte _1 Stab der Regeneration_.\n\n_+2：_Zusätzlich zu +1 (ohne Ressourcenerhalt): Angriffe im _Zeitblasen_-Status reduzieren die Zeitblase um _5 Runden_, anstatt sie sofort zu beenden.\n\n_+3：_Angriffe im _Zeitblasen_-Status reduzieren die Zeitblase um _3 Runden_, anstatt sie sofort zu beenden.
actors.hero.talent.swift_church.comment=Talente, die durch Aufwertung oder Transformation direkt Ressourcen gewähren, teilen sich eine _26-fache Auslösebegrenzung_ (beim Gent _39-fache_).\n\n„Eine gruselige Frau in Lila hat eine unendliche 4-Runden-Kombo zusammengestellt und den Boss der letzten Zone besiegt. Weißt du, wer sie ist.“\n\n_— Kenntnisse sind Spezialisierung_

actors.hero.talent.protect_curse.title=Fluchschutz
actors.hero.talent.protect_curse.desc=_+1：_Verfluchte Waffen und Rüstungen erhalten _1 zusätzliche Stufe_.\n\n_+2：_Verfluchte Waffen und Rüstungen erhalten _2 zusätzliche Stufen_.
actors.hero.talent.protect_curse.comment=„Jetzt gilt wirklich: Viele Flüche, keine Last.“

actors.hero.talent.potential_energy.title=Potenzialumwandlung
actors.hero.talent.potential_energy.desc=_+1：_Nach einem Sturz in den Abgrund erhält der Held nicht mehr den Krüppel-Effekt, sondern _3 Runden Hast_.\n\n_+2：_Nach einem Sturz erhält der Held _5 Runden Hast_.
actors.hero.talent.potential_energy.comment=„Verlies-Blitzkrieg.“

actors.hero.talent.nirvana.title=Nirwana
actors.hero.talent.nirvana.desc=_+1：_Nachdem der _Brenn_-Effekt auf sich selbst endet, erhält man _Lebensregeneration in Höhe der halben Stufe_.\n\n_+2：_Zusätzlich zu +1 fügen Angriffe unter _Brenn_-Effekt dem Gegner _3 Runden Brennen_ zu.
actors.hero.talent.nirvana.comment=„Fürchte das ätzende Feuer nicht.“

actors.hero.talent.insinuation.title=Versteckte Anspielung
actors.hero.talent.insinuation.desc=_+1：_Zauber auf schlafende Kreaturen verursachen zusätzlich _3 Runden Gift_.\n\n_+2：_Zauber auf schlafende Kreaturen verursachen zusätzlich _5 Runden Gift_.
actors.hero.talent.insinuation.comment=Mit Sand im Schatten schießen, die Krankheit bleibt unbemerkt. Mit Worten falsche Anschuldigungen erheben, der Tod bleibt unerkannt.

actors.hero.talent.auto_pick.title=Automatische Aufnahme
actors.hero.talent.auto_pick.desc=_+1:_ Die Zeit zum Aufheben von Gegenständen wird auf _50%_ reduziert.\n\n_+2:_ Das Aufheben von Gegenständen _kostet keine Zeit mehr_.
actors.hero.talent.auto_pick.comment=„Wer hat meine automatische Aufnahme eingeschaltet?"

actors.hero.talent.hand_slip.title=Ausrutscher
actors.hero.talent.hand_slip.desc=_+0：_Der erlittene Schaden in der Runde nach einer Bewegung erhöht sich um _50%_.\n\n_+1：_Der erlittene Schaden in der Runde nach einer Bewegung erhöht sich um _25%_.\n\n_+2：_Bewegung erhöht den erlittenen Schaden nicht mehr.
actors.hero.talent.hand_slip.comment=Das sitzt.\n\n_Caiyu_

actors.hero.talent.hand_destruction.title=Zerstörerische Hand
actors.hero.talent.hand_destruction.desc=_+1：_Physische Angriffe können Ziele ohne Todesresistenz mit _unter 5% LP_ sofort _töten_.\n\n_+2：_Physische Angriffe können Ziele ohne Todesresistenz mit _unter 10% LP_ sofort _töten_.\n\n_+3：_Physische Angriffe können Ziele ohne Todesresistenz mit _unter 15% LP_ sofort _töten_.
actors.hero.talent.hand_destruction.comment=

actors.hero.talent.predictive_lover.title=Vorhersage-Geheimrollen-Liebhaber
actors.hero.talent.predictive_lover.desc=_+1：_Beim Lesen der Vorhersagegeheimrolle _zusätzlich 1 Gegenstand identifizieren_.\n\n_+2：_Beim Lesen _zusätzlich 2 Gegenstände identifizieren_.
actors.hero.talent.predictive_lover.comment=Dieses Talent kann durch Lesen der Vorhersage-Geheimrolle im Buch des Chaos ausgelöst werden.\n\n„Meine Damen und Herren, ich mag Ringe.“

actors.hero.talent.fire_ball.title=Feuerball
actors.hero.talent.fire_ball.desc=_+1：_Zaubern auf brennbare Felder erzeugt _1 Einheit Feuer_ auf diesem Feld.\n\n_+2：_Zaubern auf brennbare Felder erzeugt _2 Einheiten Feuer_ auf diesem Feld.
actors.hero.talent.fire_ball.comment=Ist das eine kleine Feuerwelle?

actors.hero.talent.flash_genius.title=Geistesblitz
actors.hero.talent.flash_genius.desc=_+1：_Bei erfolgreicher Identifikation mit einem Sinnesstein werden Feinde auf der Etage für _2 Runden geblendet und betäubt_.\n\n_+2：_Bei erfolgreicher Identifikation mit einem Sinnesstein werden Feinde auf der Etage für _3 Runden geblendet und betäubt_.
actors.hero.talent.flash_genius.comment=Verbesserung dieser Fertigkeit gewährt zusätzlich _1 Sinnesstein_.\n\nTalente, die durch Aufstieg oder Wandlung direkt Ressourcen gewähren, teilen sich _26 Auslösebegrenzungen_ (beim Gentleman _39_).\n\nBlendgranate.

actors.hero.talent.witch_potion.title=Hexen-Liebestrank
actors.hero.talent.witch_potion.desc=_+1：_Beim Werfen eines Trankes wird dem Feind am Zielort _15 Runden Verzauberung_ zugefügt.\n\n_+2：_Beim Werfen eines Trankes wird dem Feind am Zielort _15 Runden Verzauberung und 5 Runden Vergiftung_ zugefügt.
actors.hero.talent.witch_potion.comment=„Normalerweise bitterer Kaffee, aber da war Liebestrank drin...“\n„Ich, im schönsten Alter, verliebt in den hübschen Clown, fiel glücklich in Träume...“

actors.hero.talent.traitorous_spell.title=Tzeentch-Magie
actors.hero.talent.traitorous_spell.desc=_+1：_Das Tome kann den Zauber _Tzeentch-Magie_ wirken, verbraucht _2 Ladungen_, um an einer bestimmten Stelle einen verfluchten Stab-Effekt auszulösen.\n\n_+2：_Das Tome kann den Zauber _Tzeentch-Magie_ wirken, verbraucht _1 Ladung_, um an einer bestimmten Stelle einen verfluchten Stab-Effekt auszulösen.
actors.hero.talent.traitorous_spell.comment=„Das sieht nicht aus wie ein in den Tomes verzeichneter Zauber.“

actors.hero.talent.sprint_spell.title=Sprint
actors.hero.talent.sprint_spell.desc=_+1：_Die Bibel kann den Zauber _Sprint_ wirken, der 2 Aufladungen verbraucht, um _3 Runden Hast_ zu gewähren.\n\n_+2：_Gewährt _5 Runden Hast_.
actors.hero.talent.sprint_spell.comment=„Speed Force.“

actors.hero.talent.focus_light.title=Fokuslicht
actors.hero.talent.focus_light.desc=_+1：_Der Codex kann _Fokuslicht_ wirken, der 2 Aufladungen verbraucht, um eine Hitzestrahl mit _4~8 Schaden_ abzufeuern, die das Ziel und den Pfad entzündet.\n\n_+2：_Der Codex kann _Fokuslicht_ wirken, der 2 Aufladungen verbraucht, um eine Hitzestrahl mit _6~10 Schaden_ abzufeuern, die das Ziel und den Pfad entzündet.
actors.hero.talent.focus_light.comment=Das ist eine Hitzestrahlpistole.

actors.hero.talent.zhuanyu_spell.title=Heilungswandlung
actors.hero.talent.zhuanyu_spell.desc=_+1：_Das Tome kann den Zauber _Heilungswandlung_ wirken, verbraucht 2 Ladungen, wandelt aktuelles Schild mit einer Effizienz von _50%_ in Heilung um.\n\n_+2：_Das Tome kann den Zauber _Heilungswandlung_ wirken, verbraucht 2 Ladungen, wandelt aktuelles Schild mit einer Effizienz von _75%_ in Heilung um.\n\n_+3：_Das Tome kann den Zauber _Heilungswandlung_ wirken, verbraucht 2 Ladungen, wandelt aktuelles Schild mit einer Effizienz von _100%_ in Heilung um.
actors.hero.talent.zhuanyu_spell.comment=Die Gesamtheilung dieses Zaubers überschreitet nicht die Hälfte der maximalen Gesundheit des Helden.\n\n„Behebt den Mangel des Tomes, das nur Schilde und keine Heilung bietet.“

actors.hero.talent.thorn_whip.title=Dornenpeitsche
actors.hero.talent.thorn_whip.desc=_+1：_Das Tome kann den Zauber _Dornenpeitsche_ wirken, verbraucht 1 Ladung, zieht Feinde näher und verursacht _Blutung mit Basiswert 3_.\n\n_+2：_Das Tome kann den Zauber _Dornenpeitsche_ wirken, verbraucht 1 Ladung, zieht Feinde näher und verursacht _Blutung mit Basiswert 5_.
actors.hero.talent.thorn_whip.comment=„Die Geißel Gottes.“

actors.hero.talent.strongest_shield.title=Stärkster Schild
actors.hero.talent.strongest_shield.desc=_+1：_Bei physischen Angriffen besteht eine _50% Chance_, dass die Rüstung ein zweites Mal reduziert wird.\n\n_+2：_Zusätzlich zu +1: Bei magischen Angriffen besteht eine _50% Chance_ auf eine zusätzliche Rüstungsreduktion.
actors.hero.talent.strongest_shield.comment=

actors.hero.talent.combo_package.title=Kombomenü
actors.hero.talent.combo_package.desc=_+1:_ Alle _6 Treffer_ im Nahkampf lösen einen Ess-Effekt aus.\n\n_+2:_ Alle _4 Treffer_ im Nahkampf lösen einen Ess-Effekt aus.
actors.hero.talent.combo_package.comment=Durch dieses Talent ausgelöste Ess-Effekte können das Füllhorn nicht aufladen.\n\n„Nichts gegessen? Dann nimm meinen Faustschlag!"\n\n_Frostmorgen_
actors.hero.talent$combopackage.name=Kombomenü
actors.hero.talent$combopackage.desc=Aus irgendeinem Grund verspürst du durch das ununterbrochene Verprügeln von Feinden ein Gefühl der Genugtuung, als ob du ein köstliches Mahl genießen würdest.\n\nDurch eine bestimmte Anzahl aufeinanderfolgender Nahkampftreffer wird ein Ess-Effekt ausgelöst.\n\nAktuelle Trefferzahl: %1$d
actors.hero.talent.break_enemy_ranks.title=In die feindlichen Reihen
actors.hero.talent.break_enemy_ranks.desc=_+1:_ Jeder Feind in Sichtweite gewährt dem Helden _0~3 Rüstung_.\n\n_+2:_ Jeder Feind in Sichtweite gewährt dem Helden _1~4 Rüstung_.
actors.hero.talent.break_enemy_ranks.comment=

actors.hero.talent.hunting_intuition.title=Jagdintuition
actors.hero.talent.hunting_intuition.desc=_+1：_Die Identifikationsgeschwindigkeit von Wurfwaffen ist _3-mal_ so hoch.\n\n_+2：_Der Ninja kann Wurfwaffen _bei Treffern sofort identifizieren_.
actors.hero.talent.hunting_intuition.comment=Ohne Wurfwaffen zu beherrschen, kann man sich kaum Ninja nennen.

actors.hero.talent.revelation.title=Offenbarung
actors.hero.talent.revelation.desc=_+1：_Die Bibel kann den Zauber _Offenbarung_ wirken, der 1 Aufladung verbraucht, um _3 Runden Offenbarung_ zu erhalten, wodurch der _Effekt positiver Talente um +1 Stufe_ erhöht wird.\n\n_+2：_Erhält _5 Runden Offenbarung_.
actors.hero.talent.revelation.comment=Der Talentstufeneffekt kann die Begrenzungsstufe nicht überschreiten.\n\n„Talentabschwächung? Nicht der Rede wert.“

actors.hero.talent.holy_grenade.title=Heilige Granate
actors.hero.talent.holy_grenade.desc=_+1：_Der Codex kann _Heilige Granate_ wirken, der 2 Aufladungen verbraucht, um in einem _3x3_ Bereich _15~30 Schaden_ zu verursachen.\n\n_+2：_Der Codex kann _Heilige Granate_ wirken, der 2 Aufladungen verbraucht, um in einem _3x3_ Bereich _20~40 Schaden_ zu verursachen.\n\n_+3：_Der Codex kann _Heilige Granate_ wirken, der 2 Aufladungen verbraucht, um in einem _5x5_ Bereich _20~40 Schaden_ zu verursachen.
actors.hero.talent.holy_grenade.comment=Heilige Granaten verursachen gegen _Untote und Dämonen_ stets maximalen Schaden.\n\nHa~lle~luja~

actors.hero.talent.blade_star.title=Klingentreppe
actors.hero.talent.blade_star.desc=_+1:_ Die Schriftrolle kann den Zauber _Klingentreppe_ wirken, der 3 Ladungen verbraucht, um einen _3x3 Bereich_ mit Klingen für 10 Runden zu erschaffen.\n\n_+2:_ Zauber _Klingentreppe_ erschafft einen _5x5 Bereich_.\n\n_+3:_ Zauber _Klingentreppe_ erschafft einen _7x7 Bereich_.
actors.hero.talent.blade_star.comment=Der Klingenbereich verursacht pro Runde 4~8 Schaden (ignoriert Rüstung) und fügt 3 Runden Lähmung zu.

actors.hero.talent.sacred_blade.title=Goldene Drehung
actors.hero.talent.sacred_blade.desc=_+1：_Die Bibel kann den Zauber _Goldene Drehung_ wirken, der 1 Aufladung verbraucht, um _magischen Schaden basierend auf der Nahkampfwaffe_ zu verursachen.\n\n_+2：_Zusätzlich zu +1 verursacht er gegen Gegner mit _Untoten- oder Dämonenattribut_ garantiert maximalen Schaden.\n\n_+3：_Zusätzlich zu +1 und +2 erhöht sich der Schaden gegen _Untote und Dämonen_ um _30%_.
actors.hero.talent.sacred_blade.comment=„Nicht irgendeine Eisenkugel.“

actors.hero.talent.equipment_bless.title=Ausrüstungssegen
actors.hero.talent.equipment_bless.desc=_+1：_Der Codex kann _Ausrüstungssegen_ wirken, der 3 Aufladungen verbraucht, um für 50 Runden alle Waffen und Rüstungen um _1 Stufe_ zu verstärken.\n\n_+2：_Der Codex kann _Ausrüstungssegen_ wirken, der 3 Aufladungen verbraucht, um für 50 Runden alle Waffen und Rüstungen um _2 Stufen_ zu verstärken.
actors.hero.talent.equipment_bless.comment=Göttliche Schöpfung.

actors.hero.talent.hotlight.title=Grelles Licht
actors.hero.talent.hotlight.desc=_+1：_Der Codex kann _Grelles Licht_ wirken, der _3 Aufladungen_ verbraucht, um alle sichtbaren nicht-verbündeten Ziele für _3 Runden zu blenden_ und _Untote und Dämonen_ für _3 Runden zu entzünden_.\n\n_+2：_Der Codex kann _Grelles Licht_ wirken, der _2 Aufladungen_ verbraucht, um alle sichtbaren nicht-verbündeten Ziele für _3 Runden zu blenden_ und _Untote und Dämonen_ für _3 Runden zu entzünden_.
actors.hero.talent.hotlight.comment=Blendgranate werfen!

actors.hero.talent.healattack.title=Heiliger Schlag
actors.hero.talent.healattack.desc=_+1：_Physische Angriffe auf Feinde mit Glanz erholen _3 LP_.\n\n_+2：_Physische Angriffe auf Feinde mit Glanz erholen _30% der Heldenstufe an LP_.
actors.hero.talent.healattack.comment=Möge der Herr dich segnen (bäm –).

actors.hero.talent.eat_mind.title=Geistverzehr
actors.hero.talent.eat_mind.desc=_+1：_Jeder Punkt Magieschaden durch Zauberstab oder Rute gibt _0,2 Sättigung_ zurück.\n\n_+2：_Jeder Punkt Magieschaden durch Zauberstab oder Rute gibt _0,3 Sättigung_ zurück.
actors.hero.talent.eat_mind.comment=Im Kleinen das Große sehen, den Geist verspeisen.\n\n_Frostmorgen_

actors.hero.talent.disabliity_posion.title=Krüppelnder Giftnebel
actors.hero.talent.disabliity_posion.desc=_+1：_Der anfängliche Schaden des ätzenden Nebels, der durch den Zauberstab für Ätze erzeugt wird, erhöht sich um 2 und die Gasmenge um _30%_.\n\n_+2：_Wie bei +1 erhalten Feinde im ätzenden Nebel dauerhaft _1 Runde Krüppelung_.\n\n_+3：_Wie bei +1 und +2 erhalten Feinde im ätzenden Nebel dauerhaft _1 Runde Schwäche und Verwirrung_.
actors.hero.talent.disabliity_posion.comment=

actors.hero.talent.light_crop.title=Gewitter bringt Ernte
actors.hero.talent.light_crop.desc=_+1：_Im elektrischen Feld wächst auf freiem Boden _Gras_, auf Asche und Gras wächst _hohes Gras_.\n\n_+2：_Wie bei +1 wird bei Verwendung des Blitz-Zauberstabs an der Zauberposition der _Graswuchseffekt von +1_ angewendet.
actors.hero.talent.light_crop.comment=N2 + O2 + Entladung = 2NO.\n2NO + O2 = 2NO2.\n3NO2 + H2O = 2HNO3 + NO.

actors.hero.talent.devil_flame.title=Dämonenflamme
actors.hero.talent.devil_flame.desc=_+1:_ Wenn der Flammenschlag-Zauber mit _ursprünglich 3 Ladungen_ gewirkt wird, _reduziert sich der Ladungsverbrauch um 1_.\n\n_+2:_ Wenn der _ursprüngliche Ladungsverbrauch 2 oder mehr_ beträgt, _reduziert sich der Ladungsverbrauch um 1_.\n\n_+3:_ Zusätzlich zu +2 ist der Schaden des Flammenschlags um _20% erhöht_ und die _Verweildauer des Feuers ist um 1 Runde verlängert_.
actors.hero.talent.devil_flame.comment=Die durch dieses Talent reduzierte Ladung beeinflusst nicht den Schaden des Flammenschlag-Zaubers; er wird weiterhin basierend auf dem ursprünglichen Ladungsverbrauch berechnet.

actors.hero.talent.fast_break.title=Erfahrungsansammlung
actors.hero.talent.fast_break.desc=_+1：_Das _maximale Level_ für Beute und Erfahrung von Feinden ist _+2_.\n\n_+2：_Das _maximale Level_ für Beute und Erfahrung von Feinden ist _+3_.
actors.hero.talent.fast_break.comment=Reichtum... Doppelgängerpanzer... Geistschwester... ich kann noch mehr farmen...

actors.hero.talent.crazy_dancer.title=Verrückter Tänzer
actors.hero.talent.crazy_dancer.desc=_+1:_ Wenn der Held einem physischen Angriff ausweicht, gerät der Feind für _2 Runden in Raserei_.\n\n_+2:_ Der Feind gerät für _3 Runden in Raserei_.
actors.hero.talent.crazy_dancer.comment=„Hört auf zu kämpfen!"

actors.hero.talent.throwing_recycling.title=Wurfrecycling
actors.hero.talent.throwing_recycling.desc=_+1：_Physische Angriffe auf Feinde im _Getroffen_-Zustand haben eine _25% Chance_, die Wurfwaffe vom Feind zurückzuholen.\n\n_+2：_Physische Angriffe auf Feinde im _Getroffen_-Zustand haben eine _50% Chance_, die Wurfwaffe vom Feind zurückzuholen.\n\n_+3：_Physische Angriffe auf Feinde im _Getroffen_-Zustand haben eine _75% Chance_, die Wurfwaffe vom Feind zurückzuholen.
actors.hero.talent.throwing_recycling.comment=„Theoretisch unendliche Axtwürfe.“

actors.hero.talent.falsehood_power.title=Falsche Kraft
actors.hero.talent.falsehood_power.desc=_+1：_Stärke _-1_. Beim Tragen überstarker Waffen oder Rüstungen wird der Stärkemalus um _3 Punkte_ reduziert.\n\n_+2：_Stärke _-1_. Beim Tragen überstarker Waffen oder Rüstungen wird der Stärkemalus um _4 Punkte_ reduziert.
actors.hero.talent.falsehood_power.comment=Falsche Kraft, doch mächtiger als die wahre.

actors.hero.talent.flame_incarnation.title=Inkarnation der Glut
actors.hero.talent.flame_incarnation.desc=_+1：_Nach dem Töten eines _brennenden_ Feindes besteht eine _10%ige Chance, 1 Feuerelementar_ zu beschwören.\n\n_+2：_Nach dem Töten eines _brennenden_ Feindes besteht eine _20%ige Chance, 1 Feuerelementar_ zu beschwören.\n\n_+3：_Nach dem Töten eines _brennenden_ Feindes besteht eine _30%ige Chance, 1 Feuerelementar_ zu beschwören.
actors.hero.talent.flame_incarnation.comment=Die Eigenschaften der erzeugten Feuerelementare hängen von der Etage ab.

actors.hero.talent.marksman.title=Magiegeschoss-Schütze
actors.hero.talent.marksman.desc=_+1：_Ein durch Magiegeschoss-Zauberstab aufgewerteter Zauberstab verbraucht beim nächsten Zaubern _keine Aufladung_.\n\n_+2：_Wie bei +1 erhöht sich der Zauberschaden des Magiegeschoss-Zauberstabs um _3_.
actors.hero.talent.marksman.comment=Die Eigenschaft, keine Aufladung zu verbrauchen, wirkt nicht auf den Magiegeschoss-Zauberstab selbst.\n\nWas meinst du mit Erbsenschütze?

actors.hero.talent.spider_sense.title=Spinnensinn
actors.hero.talent.spider_sense.desc=_+1：_Bei Angriffen von außerhalb des Sichtfelds erhält der Held _1 Runde Zeitblase_.\n\n_+2：_Erhält _2 Runden Zeitblase_.
actors.hero.talent.spider_sense.comment=„Peter kriegt eine Gänsehaut.“

actors.hero.talent.no_more_mob.title=KEIN Cluster
actors.hero.talent.no_more_mob.desc=_+1：_Schlafende Gegner außerhalb des Sichtfelds, wenn der Cluster-Verstand aktiv ist, werden mit _50%iger Chance_ nicht geweckt.\n\n_+2：_Zusätzlich zu +1 wechseln so geweckte Gegner in den _Wanderzustand_, anstatt den Helden zu lokalisieren.
actors.hero.talent.no_more_mob.comment=„Ich aktiviere nie wieder Cluster-Stufe 3.“

actors.hero.talent.kebi.title=Stichel · Brian
actors.hero.talent.kebi.desc=_+1：_Der arkane Stichel kann nun auch _Waffen Verzauberungen verleihen_.\n\n_+2：_Wie bei +1 erhöht sich die Wahrscheinlichkeit für _starke Verzauberungen/Siegel_.
actors.hero.talent.kebi.comment=Brian ist ein kleiner, erfolgreicher Verzauberer, der viele mächtige Verzauberungen und Siegel erschuf. Leider starb dieser Verzauberer bei einer Vorführung des Schwebesiegels durch einen Sturz, woraufhin die Forschung an diesem Siegel verboten wurde.

actors.hero.talent.ice_meal.title=Eismahl
actors.hero.talent.ice_meal.desc=_+1：_Essen dauert nur 1 Runde und gewährt _2 Runden Frostkraft_.\n\n_+2：_Essen dauert nur 1 Runde und gewährt _4 Runden Frostkraft_.\n\n_+3：_Wie bei +2 friert das Essen Kreaturen in der Nähe für _10 Runden_ ein.
actors.hero.talent.ice_meal.comment=

actors.hero.talent.more_favors.title=Mehr Gefälligkeiten
actors.hero.talent.more_favors.desc=_+1：_Die Gefälligkeiten pro Dunkelgold vom Trolschmied-Auftrag _erhöhen sich um 25_.\n\n_+2：_Die Gefälligkeiten pro Dunkelgold vom Trolschmied-Auftrag _erhöhen sich um 50_, und das Gefälligkeitslimit steigt von 3000 _auf 4000_.
actors.hero.talent.more_favors.comment=„Stinkendes Maul, aber gutes Herz.“

actors.hero.talent.hardware_elements.title=Metallische Elemente
actors.hero.talent.hardware_elements.desc=_+1：_Elementarreste werden beim Herstellen von Beschwörungskristallen nicht verbraucht, aber der _Alchemieenergieverbrauch steigt auf 20_.\n\n_+2：_Elementarreste werden beim Herstellen von Beschwörungskristallen nicht verbraucht, aber der _Alchemieenergieverbrauch steigt auf 15_.\n\n_+3：_Elementarreste werden beim Herstellen von Beschwörungskristallen nicht verbraucht, der _Alchemieenergieverbrauch steigt nicht mehr_.
actors.hero.talent.hardware_elements.comment=Die Gewinnung unendlicher Energie ist eines der Ziele der Alchemie.

actors.hero.talent.static_light.title=Statischer Strom
actors.hero.talent.static_light.desc=_+1：_Zauberschaden +1_, Zauber mit Stab oder Zauberstab fügen Gegnern zusätzlich _Lähmung für 5% des verursachten Schadens in Runden_ zu.\n\n_+2：_Zauberschaden +2_, _Lähmung für 7.5% des Schadens_.
actors.hero.talent.static_light.comment=Die durch dieses Talent gewährten Lähmungsrunden werden abgerundet.\n\n„Dies ist ein kleiner Schritt zum Blitzmagier.“

actors.hero.talent.miracle_alchemy.title=Wunder-Alchemie
actors.hero.talent.miracle_alchemy.desc=_+1：_Beim Alchemieren besteht eine _20%ige Chance_, ein zusätzliches Alchemieprodukt herzustellen.\n\n_+2：_Beim Alchemieren besteht eine _40%ige Chance_, ein zusätzliches Alchemieprodukt herzustellen.
actors.hero.talent.miracle_alchemy.comment=Dieses Talent wirkt nicht auf Schmuck, Eintopf, gekochte geschmacklose Früchte, Muskelgedächtnis-Trank, Verzauberungsgeheimrolle, alle Bomben, Flüssiggold, heilige Kopien, Wurzelgeheimtrank, Verzauberungskristall und Transformationskristall.\n\n„Alchemie selbst ist ein Wunder. Ich liebe Alchemie.“

actors.hero.talent.hungry_ghost.title=Hungergeist
actors.hero.talent.hungry_ghost.desc=_+0：_Hungerschaden erzeugt _einen Geist_. Angriffe von Geistern _reduzieren die Sättigung um 5 Punkte_.\n\n_+1：_Hungerschaden erzeugt _einen Geist_.\n\n_+2：_Hungerschaden erzeugt keine Geister mehr.
actors.hero.talent.hungry_ghost.comment=

actors.hero.talent.unable_rest.title=Keine Ruhe
actors.hero.talent.unable_rest.desc=_+0：_Untote und Dämonen _behalten bei tödlichem Schaden _1 Leben_ und erhalten _einen Schild in Höhe von 50% der maximalen Gesundheit_.\n\n_+1：_Untote und Dämonen _behalten bei tödlichem Schaden _1 Leben_.\n\n_+2：_Untote und Dämonen _können bei tödlichem Schaden direkt ins Jenseits gehen.
actors.hero.talent.unable_rest.comment=Diese Fertigkeit wirkt nicht auf Feinde, die von Natur aus wiederbelebungsfähig sind (wie Zwergenleichen) und auch nicht auf Bossgegner.

actors.hero.talent.cursedman.title=Der Verfluchte
actors.hero.talent.cursedman.desc=_+0:_ Die Verwendung von _Aufwertungsschriftrollen, Verzauberungsschriftrollen, Verzauberungsrunensteinen oder Arkografen_ auf Gegenstände führt zu deren Verfluchung.\n\n_+1:_ Nur _Verzauberungsrunensteine oder Arkografen_ führen zur Verfluchung.\n\n_+2:_ Die Verwendung dieser Gegenstände führt nicht mehr zur Verfluchung.
actors.hero.talent.cursedman.comment=

actors.hero.talent.usury.title=Wucherkredit
actors.hero.talent.usury.desc=_+0：_Kann 1000 Goldmünzen gewähren? Aber der Held verliert pro betretener Ebene _200 Goldmünzen_ Zinsen.\n\n_+1：_Zinsen sinken auf _150 Goldmünzen_.\n\n_+2：_Es werden keine Zinsen mehr abgezogen.
actors.hero.talent.usury.comment=
actors.hero.talent.usury.nomoney=Unglaublich! Der Ladenbesitzer hat einen Teil deines Kredits unterschlagen!
actors.hero.talent.usury.principal=Der Ladenbesitzer hat dir diesen Wucherkredit gewährt.
actors.hero.talent.usury.interest=Zinszahlung pro Ebene：%d Goldmünzen.

actors.hero.talent.armed_uprising.title=Extrem böse Einheit
actors.hero.talent.armed_uprising.desc=_+1:_ Die physischen Angriffe von Verbündeten synchronisieren die meisten _physischen Angriffseffekte_ des Helden.\n\n_+2:_ Zusätzlich zu +1 synchronisieren die physischen Angriffe von Verbündeten auch die meisten _physischen Angriffsschadensboni_ des Helden.
actors.hero.talent.armed_uprising.comment=Die Synchronisation dieses Talents hängt hauptsächlich von den Talenten des Helden und seinen eigenen Eigenschaften ab.\n\n„Gesamte Armee – Vorrücken!"

actors.hero.talent.dungeon_hero.title=Dungeonheld
actors.hero.talent.dungeon_hero.desc=_+1：_Bei der ersten Interaktion mit Quest-NPCs und Händlern erhalte _2 niedrige Beutestücke_.\n\n_+2：_Bei der ersten Interaktion mit Quest-NPCs und Händlern erhalte _2 mittlere Beutestücke_.
actors.hero.talent.dungeon_hero.comment=Akzeptiere keine Smaragde oder Gegenstände als Bezahlung.

actors.hero.talent.exp_solid.title=Erfahrungsverfestigung
actors.hero.talent.exp_solid.desc=_+1：_Senke die _Heldenstufe um 1_ und erhalte _1 Erfahrungstrank_.\n\n_+2：_Senke die _Heldenstufe um 2_ und erhalte _2 Erfahrungstränke_.
actors.hero.talent.exp_solid.comment=Ein Upgrade nach Erreichen der Ressourcengrenze senkt weiterhin die Heldenstufe. Talente, die durch Aufstieg oder Wandlung direkt Ressourcen gewähren, teilen sich _26 Auslösebegrenzungen_ (beim Gentleman _39_).\n\nBin ich schwächer? Nein, ich bin stärker (setze den Ring des Reichtums auf).

actors.hero.talent.wealth_statue.title=Reichtumsstatue
actors.hero.talent.wealth_statue.desc=_+1：_Beim Tod von lebenden und gepanzerten Statuen fällt ein _zufälliger Ring der Stufe 2_, beim Tod von beschworenen Wächtern ein _zufälliger Ring der Stufe 1_.\n\n_+2：_Beim Tod von lebenden und gepanzerten Statuen fällt ein _zufälliger Ring der Stufe 3_, beim Tod von beschworenen Wächtern ein _zufälliger Ring der Stufe 2_.\n\n_+3：_Beim Tod von lebenden und gepanzerten Statuen fällt ein _zufälliger Ring der Stufe 4_, beim Tod von beschworenen Wächtern ein _zufälliger Ring der Stufe 3_.
actors.hero.talent.wealth_statue.comment=Durch diese Fertigkeit erhaltene Ringe sind nicht identifiziert. Die Ressourcenbeschaffung dieser Fertigkeit ist _auf 26 Nutzungen begrenzt_ (beim Gent _39_) und teilt diese Begrenzung mit den meisten Talenten, die durch Aufwertung oder Transformation direkt Ressourcen gewähren.

actors.hero.talent.sweet_sleep.title=Süßer Schlaf
actors.hero.talent.sweet_sleep.desc=_+1：_Hinterhalte verursachen _30% zusätzlichen Schaden_.\n\n_+2：_Hinterhalte verursachen _40% zusätzlichen Schaden_.
actors.hero.talent.sweet_sleep.comment=„Der Tod ist nicht schrecklich. Der Tod ist eine kühle Sommernacht, in der man sorglos schlafen kann.“

actors.hero.talent.light_shock.title=Blendender Schock
actors.hero.talent.light_shock.desc=_+1：_Erhalte _1 Prismazauberstab_. Zauber mit dem Prismazauberstab verursachen zusätzlich zur Blendung _Zauberstablvl x 50% Runden Krüppelung_. Ist das Ziel bereits geblendet, wird erneut Krüppelung verursacht.\n\n_+2：_Wie bei +1 (ohne Ressourcenerhalt) erhöht sich der Schaden um _30%_, wenn der Zauber Blendung verursacht oder auf ein geblendetes Ziel gewirkt wird.
actors.hero.talent.light_shock.comment=Talente, die durch Aufstieg oder Wandlung direkt Ressourcen gewähren, teilen sich _26 Auslösebegrenzungen_ (beim Gentleman _39_).\n\nDas Licht in der Hand zu halten, um alles Böse der Welt zu vertreiben.

actors.hero.talent.boozy.title=Sucht
actors.hero.talent.boozy.desc=_+1:_ Beim Trinken eines Trankes erhältst du zusätzlich _5 Punkte Lebensregeneration_ und pro Runde abklingende _0~5 Punkte Baumrinde_.\n\n_+2:_ Beim Trinken eines Trankes erhältst du zusätzlich _10 Punkte Lebensregeneration_ und pro Runde abklingende _0~10 Punkte Baumrinde_.
actors.hero.talent.boozy.comment=„Tränke sind wie edler Wein – je älter, desto aromatischer."

actors.hero.talent.shadow_killer.title=Schattenkiller
actors.hero.talent.shadow_killer.desc=_+1：_Der Schadensbonus durch Hinterhalte _erhöht sich auf 75%_ und verursacht zusätzlich _100% der gegnerischen Rüstung_ als Schaden.\n\n_+2：_Der Bonus _erhöht sich auf 100%_ und verursacht zusätzlich _150% der Rüstung_ als Schaden.
actors.hero.talent.shadow_killer.comment=

actors.hero.talent.kill_spree.title=Tötungsrausch
actors.hero.talent.kill_spree.desc=_+1：_Tötet der Held einen Feind mit einem physischen Angriff, erhält er _5% der max. LP des Feindes als Heilung_ und _2 Runden Artefakt-Aufladung_.\n\n_+2：_Tötet der Held einen Feind mit einem physischen Angriff, erhält er _7,5% der max. LP des Feindes als Heilung_ und _3 Runden Artefakt-Aufladung_.
actors.hero.talent.kill_spree.comment=

actors.hero.talent.seaofpeople.title=Menschenmenge
actors.hero.talent.seaofpeople.desc=_+1：_Pro Gegner im Sichtfeld _erhöht sich die Bewegungsgeschwindigkeit um 30%_.\n\n_+2：_Erhöht sich um 45%_.
actors.hero.talent.seaofpeople.comment=

actors.hero.talent.phantom_step.title=Phantomtritt
actors.hero.talent.phantom_step.desc=_+1：_Nach dem Beenden von Tarnung oder Schattentanz erhält man _3 Runden Hast_ und _1 Runde Phantomtritt_ (weicht allen Angriffen garantiert aus).\n\n_+2：_Nach dem Beenden erhält man _5 Runden Hast_ und _2 Runden Phantomtritt_.
actors.hero.talent.phantom_step.comment=Wenn der Held auf +1/+2 bereits mindestens _6/10 Runden_ Hast hat, kann dieses Talent die Hast-Dauer nicht weiter erhöhen.\n\nEine neue Kraft aus dem _Rekonstruierten Verlies_!
actors.hero.talent$phantomstep.name=Phantomtritt
actors.hero.talent$phantomstep.desc=Die höchste Stufe, die jedes Mitglied der Diebesgilde anstrebt, ist die Beherrschung dieser Fähigkeit.\n\nUnter diesem Effekt wirst du jedem physischen oder magischen Angriff ausweichen.\n\nVerbleibende Wirkungsdauer: %s Runden

actors.hero.talent.steam_bean.title=Dampfbohnen
actors.hero.talent.steam_bean.desc=_+0：_Der erste physische Angriff auf einen Gegner versetzt den Helden in _8 Runden Benommenheit_.\n\n_+1：_Der erste Angriff versetzt den Helden in _4 Runden Benommenheit_.\n\n_+2：_Physische Angriffe versetzen den Helden nicht mehr in Benommenheit.
actors.hero.talent.steam_bean.comment=

actors.hero.talent.alchemy_accident.title=Alchemieunfall
actors.hero.talent.alchemy_accident.desc=_+0:_ Beim Brauen von Alchemieprodukten besteht eine _20% Wahrscheinlichkeit_ einer Explosion mit dem Helden im Zentrum.\n\n_+1:_ Beim Brauen von Alchemieprodukten besteht eine _10% Wahrscheinlichkeit_ einer Explosion mit dem Helden im Zentrum.\n\n_+2:_ Alchemie ist jetzt sicher.
actors.hero.talent.alchemy_accident.comment=

actors.hero.talent.shell_cry.title=Kristalliner Körperpanzer
actors.hero.talent.shell_cry.desc=_+0：_Die Rüstung des Helden sinkt mit abnehmenden Lebenspunkten, bis zu _100% Reduktion_.\n\n_+1：_Die Rüstung sinkt bis zu _50% Reduktion_.\n\n_+2：_Die Rüstung sinkt nicht mehr mit abnehmenden Lebenspunkten.
actors.hero.talent.shell_cry.comment=

actors.hero.talent.mal_curse.title=Bösartiger Fluch
actors.hero.talent.mal_curse.desc=_+0：_Verfluchte Ausrüstung _sinkt um 2 Stufen_.\n\n_+1：_Verfluchte Ausrüstung _sinkt um 1 Stufe_.\n\n_+2：_Flüche beeinflussen die Ausrüstungsstufe nicht mehr.
actors.hero.talent.mal_curse.comment=Diese Fertigkeit kann Ausrüstungsstufen auf negative Werte senken.\n\nMächtiger Fluch aus dem _Original Pixel Dungeon_!

actors.hero.talent.thunder_strike.title=Donnerschlag
actors.hero.talent.thunder_strike.desc=Nach Aufwertung dieser Fertigkeit verursachen physische Angriffe einen Lichtbogen mit _50% des verursachten Schadens_ (der Held und Verbündete erleiden keinen Lichtbogenschaden). Der Lichtbogen verbindet Kreaturen, die dem Angriffsziel benachbart sind (nicht den Angreifer). Befindet sich das Ziel im Wasser oder hat der Held _Stab- oder Artefaktaufladung_, erhöht sich die Verbindungsreichweite um +1.\n\n_+1：_Der Lichtbogen schadet _nur den nachfolgend verbundenen Feinden_.\n\n_+2：_Der Lichtbogen schadet _allen verbundenen Feinden_.
actors.hero.talent.thunder_strike.comment=„Ich sage, die DM-300 ist auch ein kaputter Roboter, versteht das jemand?“

actors.hero.talent.directional_collapse.title=Gerichteter Einsturz
actors.hero.talent.directional_collapse.desc=_+1:_ Alle _4 Zauberanwendungen_ mit Zauberstab oder Magiestab löst einen Steinschlag um das Ziel herum aus, der _10~20_ Schaden (ignoriert Rüstung) und _3 Runden Lähmung_ verursacht.\n\n_+2:_ Alle _3 Zauberanwendungen_ löst den Steinschlag aus.
actors.hero.talent.directional_collapse.comment=Der durch dieses Talent erzeugte Steinschlag verursacht weder dem Helden noch Verbündeten Schaden oder Lähmung.
actors.hero.talent$directionalcollapse.name=Gerichteter Einsturz
actors.hero.talent$directionalcollapse.desc=Metallfragmente, die vom Hochleistungsbohrer von DM-300 abgebrochen sind, scheinen sich geringfügig von anderen dämonischen Fragmenten zu unterscheiden, die man an Metallschrottstellen findet. Sie lösen sich sofort auf, sobald du sie berührst. Was auch immer das bedeutet, du spürst, dass der Zauberstab in deinem Rucksack etwas stärker geworden ist.\n\nAlle %s Zauberanwendungen löst dies einen gerichteten Einsturz aus, der eine Menge Steinschlag um das Zauberziel herum verursacht, 10~20 Schaden ignoriert Rüstung und 3 Runden Lähmung. Glücklicherweise sind diese Steine für dich und deine Verbündeten harmlos.\n\nAktuelle Zauberanzahl: %s

#新法术
actors.hero.spells.ascension_curse.name=Aufstiegsfluch
actors.hero.spells.ascension_curse.short_desc=Verleiht dem Zaubernden Schwebeffekt.
actors.hero.spells.ascension_curse.desc=Der Zaubernde spricht einen Zauberspruch, der ihn für kurze Zeit leichter macht und ihm erlaubt, für _%1$d Runden_ zu schweben.\n\nDieser Zauber _verbraucht 1 Runde_.

actors.hero.spells.divine_protection.name=Göttlicher Schutz
actors.hero.spells.divine_protection.short_desc=Macht den Zaubernden für kurze Zeit unverwundbar.
actors.hero.spells.divine_protection.desc=Der Zaubernde erfleht mit der Kraft des Kodex den Schutz der Gottheit. Nach Erhörung ist er für _%1$d Runden_ unverwundbar.\n\nDieser Zauber _verbraucht 1 Runde_.

actors.hero.spells.shepherd_intention.name=Hirtenabsicht
actors.hero.spells.shepherd_intention.short_desc=Erzeugt eine Gruppe magischer Schafe an einem bestimmten Ort.
actors.hero.spells.shepherd_intention.desc=Der Zaubernde bündelt mit der Schriftrolle die in ihm fließende Magie und beschwört an einer bestimmten Position ... eine Gruppe magischer Schafe? Nun, sie sind zumindest unsterblich.\n\nDieser Zauber _kostet 1 Runde_.

actors.hero.spells.conversion_holy.name=Heilige Bekehrung
actors.hero.spells.conversion_holy.short_desc=Kann ein Ziel versenken.
actors.hero.spells.conversion_holy.no_target=Es gibt kein Ziel, das versenkt werden kann.
actors.hero.spells.conversion_holy.desc=Der Zaubernde kann die Macht des Kodex zeigen, um ein Ziel zur heiligen Lehre zu bekehren und es zu einem treuen Diener zu machen.\n\nDurch diesen Zauber versunkene Gegner hinterlassen keine Beute.\n\nDieser Zauber _verbraucht 1 Runde_.

actors.hero.spells.purifying_evil.name=Läuterung des Bösen
actors.hero.spells.purifying_evil.short_desc=Kann ein Ziel läutern.
actors.hero.spells.purifying_evil.no_target=Es gibt kein Ziel, das geläutert werden kann.
actors.hero.spells.purifying_evil.desc=Der Zaubernde nutzt die gewaltige heilige Kraft der Schriftrolle, um Feinde zu läutern, ihre positiven Effekte zu entfernen, sogar Elite-Effekte zu beseitigen und Untoten und Dämonen Schaden zuzufügen.\n\nDieser Zauber _kostet 1 Runde_.

actors.hero.spells.divine_storm.name=Göttliches Sturmfeld
actors.hero.spells.divine_storm.short_desc=Erzeugt ein mächtiges göttliches Feld, das Gegner richtet.
actors.hero.spells.divine_storm.desc=Der Zaubernde erzeugt mit dem Kodex ein mächtiges göttliches Feld, das Gegner lähmt und sogar versengt.\n\nDieser Zauber _verbraucht 1 Runde_.

actors.hero.spells.genesis.name=Genesis
actors.hero.spells.genesis.short_desc=Setzt die eigenen Talentfähigkeiten zurück.
actors.hero.spells.genesis.desc=Der Zaubernde wird sich wie ein Gott, der die Welt erschafft, neu formen.\n\nDieser Zauber _verbraucht 1 Runde_.

actors.hero.spells.indulgence.name=Ablass
actors.hero.spells.indulgence.short_desc=Verbraucht Gold, um Schriftrollenladungen wiederherzustellen.
actors.hero.spells.indulgence.desc=Der Zaubernde verbraucht _%1$d Goldmünzen_, um seine Sünden zu tilgen und die Schriftrollenladungen wiederherzustellen.\n\nDieser Zauber _kostet 1 Runde_.\n\nDieser Zauber wirkt nicht auf Schriftrollenabschriften.
actors.hero.spells.indulgence.no_tome=Ohne Schriftrolle ist deine Buße bedeutungslos.

actors.hero.spells.silver_language.name=Silberne Worte
actors.hero.spells.silver_language.short_desc=Versetzt das Ziel für kurze Zeit in Raserei.
actors.hero.spells.silver_language.no_target=Kein Ziel wird dadurch in Raserei versetzt.
actors.hero.spells.silver_language.desc=Der Zaubernde rezitiert lauthals einige Passagen aus der Schriftrolle, die das Ziel für _%1$d Runden_ in Raserei versetzen.\n\nDieser Zauber _kostet 1 Runde_.

actors.hero.spells.resurrection.name=Wiederbelebung
actors.hero.spells.resurrection.short_desc=Das Ziel wird bei Tod innerhalb kurzer Zeit wiederbelebt.
actors.hero.spells.resurrection.no_target=Kann diesen Zauber nicht auf dieses Ziel anwenden.
actors.hero.spells.resurrection.desc=Der Zaubernde nutzt die Macht der Schriftrolle, um sich oder einem Verbündeten eine mächtige Wiederbelebung zu gewähren, die bei Tod innerhalb kurzer Zeit wirkt.\n\nDieser Zauber _kostet 1 Runde_.
actors.hero.spells.resurrection$resurrection.name=Totenbeschwörung
actors.hero.spells.resurrection$resurrection.desc=Dieser Charakter wird nach dem Tod wieder auferstehen!\n\nVerbündete, die von diesem Effekt betroffen sind, werden bei Tod während der Wirkungsdauer im besten Zustand wiederbelebt.\n\nWenn der Held betroffen ist, wird er bei Tod während der Wirkungsdauer ebenfalls wiederbelebt, jedoch mit maximal 1 Lebenspunkt.\n\nVerbleibende Runden: %s

actors.hero.spells.traitorous_spell.name=Verräterischer Zauber
actors.hero.spells.traitorous_spell.short_desc=Entfesselt einen verfluchten Zauberstab-Effekt.
actors.hero.spells.traitorous_spell.desc=Der Zaubernde verwendet einen verräterischen Zauber, um einen zufälligen Fluch auf das Ziel anzuwenden.\n\nDieser Zauber _kostet 1 Runde_.

actors.hero.spells.sprint_spell.name=Eilzauber
actors.hero.spells.sprint_spell.short_desc=Verleiht sich selbst Eile.
actors.hero.spells.sprint_spell.desc=Der Zaubernde kann durch das Wirken eines Zauberspruchs übermenschliche Geschwindigkeit erlangen und sich selbst _%1$d Runden Eile_ verleihen.\n\nDieser Zauber _kostet 1 Runde_.

actors.hero.spells.focus_light.name=Fokussiertes Licht
actors.hero.spells.focus_light.short_desc=Feuert einen hochenergetischen Strahl ab, der alles versengt.
actors.hero.spells.focus_light.desc=Der Zaubernde kann einen hochenergetischen Strahl abfeuern, der _%1$d~%2$d Schaden_ verursacht und den Pfad sowie das Ziel entzündet.\n\nDieser Zauber _verbraucht 1 Runde_.

actors.hero.spells.zhuanyu_spell.name=Heilungsrotation
actors.hero.spells.zhuanyu_spell.short_desc=Wandelt Schilde in Heilung um.
actors.hero.spells.zhuanyu_spell.desc=Wandelt Schilde des Zaubernden zu _%d%%_ in Heilung um. Die Gesamtheilung überschreitet nicht die Hälfte der maximalen Lebenspunkte.\n\nDieser Zauber _kostet 1 Runde_.

actors.hero.spells.thorn_whip.name=Dornenpeitsche
actors.hero.spells.thorn_whip.short_desc=Zieht das Ziel heran und fügt Blutung zu.
actors.hero.spells.thorn_whip.no_target=Kein Ziel kann herangezogen werden oder das Ziel kann nicht herangezogen werden.
actors.hero.spells.thorn_whip.more_distance=Zu weit entfernt, um es zu erreichen.
actors.hero.spells.thorn_whip.desc=In der Hand des Zaubernden erscheint eine dornige Goldpeitsche, die das Ziel heranziehen kann und _Blutung mit Grundwert %1$d_ zufügt.\n\nDie Reichweite dieses Zaubers ist auf _12 Felder_ begrenzt.\n\nDieser Zauber _kostet 1 Runde_.

actors.hero.spells.revelation.name=Offenbarung
actors.hero.spells.revelation.short_desc=Erhöht die Stufe vorhandener positiver Talente.
actors.hero.spells.revelation.desc=Der Zaubernde erhält Erleuchtung von oben und erhält _%1$d Runden Offenbarung_, die alle vorhandenen _positiven Talent-Effekte um +1 Stufe_ erhöht.\n\nDie Talent-Effektstufe kann die maximale Stufe nicht überschreiten.\n\nDieser Zauber _kostet keine Zeit_.
actors.hero.spells.revelation$revelationbuff.name=Offenbarung
actors.hero.spells.revelation$revelationbuff.desc=Du fühlst dich von oben erleuchtet. Alle deine vorhandenen positiven Talent-Effekte erhalten +1 Stufe.\n\nVerbleibende Runden: %s Runden

actors.hero.spells.holy_grenade.name=Heilige Granate
actors.hero.spells.holy_grenade.short_desc=Erzeugt eine Explosion, die Feinde verletzt.
actors.hero.spells.holy_grenade.desc=Der Zaubernde wirft eine Energiekugel, die sofort im _%1$dx%1$d_ Umkreis _%2$d~%3$d Schaden_ verursacht. Untote und Dämonen erleiden garantiert maximalen Schaden.\n\nDieser Zauber _kostet 1 Runde_.

actors.hero.spells.blade_star.name=Klingentreppe
actors.hero.spells.blade_star.short_desc=Erschafft einen Klingenbereich, der Gegner schädigt und lähmt.
actors.hero.spells.blade_star.desc=Der Zaubernde materialisiert heiliges Licht zu Klingen und erschafft einen Klingenbereich der Größe _%1$dx%1$d_. Gegner in diesem Bereich erleiden kontinuierlich _4-8 Schaden_ und erhalten _3 Runden Lähmung_. Der Bereich hält _10 Runden_.\n\nDieser Zauber _verbraucht 1 Runde_.
actors.hero.spells.blade_star.invalid_target=Kann an dieser Position keinen Klingenbereich erzeugen.
actors.hero.spells.blade_star$blade_stair.name=Klingenbereich
actors.hero.spells.blade_star$blade_stair.desc=Dieser Bereich wurde in einen Klingenbereich verwandelt. Der Klingenbereich fügt Gegnern kontinuierlich Schaden zu und verlangsamt sie.

actors.hero.spells.sacred_blade.name=Goldener Kreisel
actors.hero.spells.sacred_blade.short_desc=Wirft einen Bumerang aus heiligem Licht, der magischen Schaden verursacht.
actors.hero.spells.sacred_blade.desc=Der Zaubernde wirft einen Bumerang aus heiligem Licht, der _magischen Schaden basierend auf der aktuellen Waffe_ verursacht. Untote und Dämonen erleiden zusätzlichen Schaden.\n\nDieser Zauber _kostet 1 Runde_.

actors.hero.spells.equipment_bless.name=Ausrüstungssegen
actors.hero.spells.equipment_bless.short_desc=Stärkt alle Waffen und Rüstungen.
actors.hero.spells.equipment_bless.desc=Der Zaubernde kann alle Waffen und Rüstungen segnen, um ihre Stufe vorübergehend zu erhöhen.\n\nDieser Zauber _verbraucht 1 Runde_.
actors.hero.spells.equipment_bless$blessbuff.name=Ausrüstungssegen
actors.hero.spells.equipment_bless$blessbuff.desc=Du spürst, dass deine Ausrüstung gesegnet wurde.\n\nWährend dieser Effekt anhält, wird die Stufe aller Waffen und Rüstungen vorübergehend erhöht.\n\nVerbleibende Runden: %s

actors.hero.spells.hotlight.name=Gleißend heißes Licht
actors.hero.spells.hotlight.short_desc=Entfesselt gleißendes Licht, das Feinde blendet.
actors.hero.spells.hotlight.desc=Der Zaubernde entfesselt gleißend heißes Licht, das alle Feinde in Sichtweite für _3 Runden blendet_ und Untote sowie Dämonen direkt entzündet.\n\nDieser Zauber _kostet 1 Runde_.


actors.hero.heroclass.freeman=Gentleman
actors.hero.heroclass.freeman_desc_short=Der Gentleman _hat mehr Potenzial, das entfesselt werden kann_, und beginnt mit einem einzigartigen _Aktenkoffer_.
actors.hero.heroclass.freeman_desc=Der Gentleman beginnt mit einem _einzigartigen Aktenkoffer_, aus dem er besondere Gegenstände oder Fähigkeiten erhalten kann.\n\nDer Gentleman hat keine spezielle Kampfausbildung und nur geringe Kampffähigkeiten, aber _er hat unendliches Potenzial, das entfesselt werden kann_.\n\nAußerdem beginnt der Gentleman mit _einem Spazierstock_, _einer glücklichen Silbermünze_, Stoffrüstung, einem Wasserschlauch und einem Beutel.\n\nZu Beginn identifizierte Gegenstände:\n_-_ Erfahrungstrank\n_-_ Wandlungs-, Identifikations- und Wandlungs-Schriftrolle
actors.hero.heroclass.freeman_unlock=_Wandle ein Talent mit einer Wandlungs-Schriftrolle_, um den Gentleman freizuschalten.
actors.hero.herosubclass.freeman=Gentleman
actors.hero.herosubclass.freeman_short_desc=Der _Gentleman_ erhält nicht viel Kraft aus Tengus Maske, hat aber noch mehr Potenzial zu entfesseln.
actors.hero.herosubclass.freeman_desc=Nachdem der Gentleman Tengus Maske aufgesetzt hat, erhält er nicht viel Kraft daraus, aber nachdem die Maske zerfällt, erhält er eine zusätzliche Wandlungs-Schriftrolle.\n\nAußerdem hat der Gentleman noch mehr Potenzial zu entfesseln.


actors.blobs.pheromone.desc=Ein Pheromongas liegt in der Luft, verwirrt Helden und stärkt die Verbündeten der Anhänger des Slaanesh.
actors.mobs.chaosdisciples$succboss.name=Slaanesh-Anhänger
actors.mobs.chaosdisciples$succboss.desc=Der Slaanesh-Anhänger war einst eine Sukkubus, ein Freund des kleinen Dämons. Um dem kleinen Dämon bei der Verwirklichung seiner Ambitionen zu helfen, strebte er nach mächtigen Kräften und wurde zum Anhänger des Chaosgottes Slaanesh.\n\nDer Slaanesh-Anhänger kann eine große Anzahl von Sukkubi für sich kämpfen lassen, aber diese Fähigkeit kann nur in bestimmten Abständen eingesetzt werden. Darüber hinaus kann er Pheromongase freisetzen, die bei gegnerischen Einheiten die Unterwerfungs- oder Opferbereitschaftseffekte des Helden aufheben, Heilung und Hormonschübe gewähren und den Helden sowie seine Verbündeten in Verzauberung versetzen.
actors.mobs.chaosdisciples$summoncooldown.name=Sukkubus-Beschwörung - Abklingzeit
actors.mobs.chaosdisciples$summoncooldown.desc=Der Slaanesh-Anhänger hat gerade Sukkubi beschworen; es dauert eine Weile, bis er es erneut tun kann.\n\nVerbleibende Abklingzeit：%s Runden
actors.mobs.chaosdisciples$scorpioboss.name=Nurgle-Anhänger
actors.mobs.chaosdisciples$scorpioboss.desc=Der Nurgle-Anhänger war einst ein Riesen-Skorpion, ein Freund des kleinen Dämons. Um dem kleinen Dämon bei der Verwirklichung seiner Ambitionen zu helfen, strebte er nach mächtigen Kräften und wurde zum Anhänger des Chaosgottes Nurgle.\n\nDer Nurgle-Anhänger ist ein Meister der Seuchenverbreitung und versetzt die Umgebung mit tödlichen Virengasen. Darüber hinaus besitzt er eine starke Verteidigung; sowohl physische als auch magische Angriffe fügen ihm kaum Schaden zu. Er kann physische Fernangriffe reflektieren, scheint aber _anfälliger für bestimmte Elementarschäden_ zu sein.
actors.mobs.chaosdisciples$scorpioboss.fire=Feuer! Feuer! So heiß!
actors.mobs.chaosdisciples$eyeboss.name=Tzeentch-Anhänger
actors.mobs.chaosdisciples$eyeboss.desc=Der Tzeentch-Anhänger war einst ein böser Blick, ein Freund des kleinen Dämons. Um dem kleinen Dämon bei der Verwirklichung seiner Ambitionen zu helfen, strebte er nach mächtigen Kräften und wurde zum Anhänger des Chaosgottes Tzeentch.\n\nDer Tzeentch-Anhänger ist ein hinterhältiger Kerl, der in regelmäßigen Abständen tödliche Laser wie eine uralte Gottheit abfeuern kann. Darüber hinaus kann er schreckliche schwarze Magie freisetzen, um den Verstand des Helden zu verwirren, und sich nach einem Treffer zufällig teleportieren.
actors.mobs.chaosdisciples$ripperboss.name=Khorne-Anhänger
actors.mobs.chaosdisciples$ripperboss.desc=Der Khorne-Anhänger war einst ein Zerfleischer, ein Freund des kleinen Dämons. Um dem kleinen Dämon bei der Verwirklichung seiner Ambitionen zu helfen, strebte er nach mächtigen Kräften und wurde zum Anhänger des Chaosgottes Khorne.\n\nDer Khorne-Anhänger ist ein kriegerischer Kerl, der auf Nahkampf spezialisiert ist. Im Nahkampf und bei Treffern erhält er Verstärkungen und Kombo-Effekte, die seine bereits furchterregende Beweglichkeit und Angriffsfrequenz weiter steigern. 56 Helden sind bereits durch seine Hände gefallen.
actors.mobs.chaosdisciples$ripperboss.combo=Die aktuelle Kombozahl des Khorne-Anhängers beträgt %d
actors.mobs.chaosdisciples$ripperboss.combotime=, verbleibende Kombozeit：%s Runden.

actors.mobs.npcs.greatimp.name=Kleiner Dämon?
actors.mobs.npcs.greatimp.newyear=Frohes neues Jahr! Du fragst, warum ich hier bin? Das ist unwichtig. Hol dir das Amulett!
actors.mobs.npcs.greatimp.hello=Überraschung! Du fragst, warum ich hier bin? Das ist unwichtig. Hol dir das Amulett!
actors.mobs.npcs.greatimp.amulet=Du hast das Amulett? Dann geh schnell nach Hause und feiere mit deiner Familie das Frühlingsfest!
#fix9：文案更改
actors.mobs.npcs.greatimp.warning=Du hast mich wohl doch entdeckt. Ich bin hierhergekommen, um die verbleibende Kraft der uralten Gottheit Yog-Dzewa an mich zu reißen, alle Dämonenlegionen zu führen, diesen Kerker zu beherrschen und dann die ganze Welt zu erobern! Willst du mich hier aufhalten und sinnlosen Widerstand leisten, oder willst du friedlich gehen und den Rest deines Lebens genießen?
actors.mobs.npcs.greatimp.yes=Halt ihn auf!
actors.mobs.npcs.greatimp.no=Geht mich nichts an
actors.mobs.npcs.greatimp.time=Leute, los, verschafft mir Zeit!
actors.mobs.npcs.greatimp.desc=Es ist unklar, warum der kleine Dämon an diesen Ort gekommen ist.
actors.mobs.npcs.greatimp.die=Danke für die Zeit, die ihr mir verschafft habt. Jetzt bin ich unbesiegbar!
actors.mobs.npcs.greatimp.nothing=......

actors.mobs.greatdemon.name=Großdämon
actors.mobs.greatdemon.desc=Der kleine Dämon, der gerade erst die Kraft der uralten Gottheit absorbiert hat, hat längere Dämonenhörner, einen Bart und Flügel bekommen... Man kann ihn nicht mehr kleinen Dämon nennen; er sollte Großdämon heißen.\n\nDer Großdämon besitzt einen kräftigen Körper und kann in bestimmten Abständen bestimmte Angriffe abwehren und reflektieren. Da ihm das Wissen über Kampfmagie fehlt, fällt es ihm schwer, verschiedene Zauber zu wirken, aber seine Nahkampffähigkeiten sind äußerst beeindruckend. Außerdem kann er andere niedere Dämonen zur Unterstützung beschwören.
actors.mobs.greatdemon.die=Diese Kraft, wie kann sie so schwach sein? Auf ein Wiedersehen!
actors.mobs.greatdemon.throw=Probier meinen Longinus-Speer!
actors.mobs.greatdemon.melee=Nimm meinen Dämonenhieb!
actors.mobs.greatdemon.summon=Hört meinen Ruf, Dämonen!
actors.mobs.greatdemon.defence=Haut verhärtet sich! Weder Schwert noch Pfeil können mir etwas anhaben!
actors.mobs.greatdemon.haste=Der Großdämon schlägt schnell seine Dämonenflügel und fliegt mit rasender Geschwindigkeit.
actors.mobs.greatdemon.magic=Magieschutz, aktivieren!
actors.mobs.greatdemon.missiles=Magische Barriere, reflektiere alle Pfeile und Geschosse!
actors.mobs.greatdemon$summoncooldown.name=Dämonenbeschwörung - Abklingzeit
actors.mobs.greatdemon$summoncooldown.desc=Der Großdämon hat gerade 2 niedere Dämonen beschworen; es dauert eine Weile, bis er es erneut tun kann.\n\nVerbleibende Abklingzeit：%s Runden
actors.mobs.greatdemon$hastecooldown.name=Dämonenflügel-Beschleunigung - Abklingzeit
actors.mobs.greatdemon$hastecooldown.desc=Der Großdämon hat gerade heftig seine Dämonenflügel geschlagen, um einen Geschwindigkeitsschub zu erhalten; jetzt muss er sich etwas erholen.\n\nVerbleibende Abklingzeit：%s Runden
actors.mobs.greatdemon$magiccooldown.name=Magische Verteidigung - Abklingzeit
actors.mobs.greatdemon$magiccooldown.desc=Magische Verteidigung hält nur eine Zeit lang; es dauert eine Weile, bis sie erneut aktiviert werden kann.\n\nVerbleibende Abklingzeit：%s Runden
actors.mobs.greatdemon$meleescooldown.name=Dornenhaut - Abklingzeit
actors.mobs.greatdemon$meleescooldown.desc=Dornenhaut hält nur eine Zeit lang; es dauert eine Weile, bis sie erneut aktiviert werden kann.\n\nVerbleibende Abklingzeit：%s Runden
actors.mobs.greatdemon$missilescooldown.name=Fernschuss-Reflexion - Abklingzeit
actors.mobs.greatdemon$missilescooldown.desc=Fernschuss-Reflexion hält nur eine Zeit lang; es dauert eine Weile, bis sie erneut aktiviert werden kann.\n\nVerbleibende Abklingzeit：%s Runden
actors.mobs.greatdemon$throwcooldown.name=Longinus-Speer - Abklingzeit
actors.mobs.greatdemon$throwcooldown.desc=Der Longinus-Speer wurde gerade vom Großdämon geworfen; es dauert eine Weile, bis er es erneut tun kann.\n\nVerbleibende Abklingzeit：%s Runden
actors.mobs.greatdemon$meleesdefence.name=Dornenhaut
actors.mobs.greatdemon$meleesdefence.desc=Reduziert für eine Zeit lang massiv den erlittenen Nahkampfschaden und reflektiert einen Teil des Schadens an den Angreifer.\n\nVerbleibende Runden：%s Runden
actors.mobs.greatdemon$missilesdefence.name=Fernschuss-Reflexion
actors.mobs.greatdemon$missilesdefence.desc=Macht eine Zeit lang vollständig immun gegen Wurfwaffenschaden und kontert den Angreifer mit magischen Geschossen.\n\nVerbleibende Runden：%s Runden

actors.mobs.landpiranha.name=Riesenland-Piranha
actors.mobs.landpiranha.desc=Durch seltsame Magie haben die Riesenpiranhas Beine entwickelt und können an der Luft atmen. Vielleicht könnte das Schwächen einer bestimmten Fertigkeit sie wieder normal machen.
actors.mobs.landpiranha.discover_hint=Du kannst diesen Gegner in jeder Dungeonregion entdecken, nachdem du ein bestimmtes Negativtalent besitzt.
actors.mobs.phantomlandpiranha.name=Phantomland-Piranha
actors.mobs.phantomlandpiranha.desc=Der Phantomland-Piranha ist eine seltene Variante des Phantom-Piranhas, die durch seltsame Magie verzerrt wurde. Er besitzt einen seltsamen, durchscheinenden Körper und magische Fähigkeiten. Bei Angriffen kann er sich teleportieren, was ihn sowohl offensiv als auch defensiv gefährlich macht!\n\nObwohl schwer zu besiegen, wird sein Fleisch wegen seiner magischen Kräfte sehr geschätzt.
actors.mobs.phantomlandpiranha.discover_hint=Du kannst diesen Gegner in jeder Dungeonregion entdecken, nachdem du ein bestimmtes Negativtalent besitzt.
actors.mobs.teststatue.name=Teststatue
actors.mobs.teststatue.desc=Keine Ahnung, wer diese Statue hier aufgestellt hat. Sie sieht sehr stoßfest aus – du kannst nicht anders, als draufzuhauen.

actors.mobs.goldboss$monkmaster.name=Mönchsmeister
actors.mobs.goldboss$monkmaster.desc=Der Mönchsmeister ist der Gipfel der zwergischen Kampfkunst; niemand kennt die Grenzen seiner Fähigkeiten.\n\nEgal wie schnell der Gegner des Mönchsmeisters ist, der Mönchsmeister ist immer schneller. Der Mönchsmeister verabscheut hinterhältige Tricks; es ist besser, ihn nicht zu reizen.
actors.mobs.goldboss$monkmaster.missileweapon=Verdammt, ihr spielt falsch? Dann legt los!

actors.mobs.goldboss$goldelemental.name=Gold-Elementar
actors.mobs.goldboss$goldelemental.desc=Das Gold-Elementar ist ein Elementarwesen, das der Ladenbesitzer mithilfe der vom Zwergenkönig hinterlassenen Methode der Elementargeister beschworen hat.\n\nDas Gold-Elementar kann selbst die Methode der Elementargeister anwenden, um andere Elementarwesen zu beschwören, und kann auch den Reichtum des Helden für sich nutzen oder sogar aus dem Nichts Reichtum erschaffen.
actors.mobs.goldboss$goldelemental.steal=Das Gold-Elementar hat 300 Goldmünzen von dir entwendet.
actors.mobs.goldboss$goldelemental.give=Das Gold-Elementar hat in deinem Rucksack 400 Goldmünzen aus dem Nichts erschaffen.
actors.mobs.goldboss$goldgolem.name=Goldgolem
actors.mobs.goldboss$goldgolem.desc=Der Goldgolem ist ein vom Ladenbesitzer umgebauter Golem, der vollständig aus Gold gefertigt ist und weitaus einschüchternder wirkt als gewöhnliche Golems.\n\nIm Vergleich zu gewöhnlichen Golems hat der Goldgolem zwar seine Teleportationsfähigkeit verloren, besitzt aber stärkere Angriffs- und Verteidigungseigenschaften. Er kann augenblicklich ein Hochspannungsfeld zur Lähmung von Lebewesen freisetzen und sogar magische Kreaturen augenblicklich zermalmen.
actors.mobs.goldboss$goldgolem.electricity=Energie freisetzen, jetzt!
actors.mobs.goldboss$electricitycooldown.name=Freisetzung des elektrischen Feldes - Abklingzeit
actors.mobs.goldboss$electricitycooldown.desc=Der Goldgolem hat gerade ein elektrisches Feld freigesetzt; es dauert eine Weile, bis er es erneut tun kann.\n\nVerbleibende Abklingzeit：%s Runden

actors.mobs.goldboss$thymor.name=Erzmagier Thymor
actors.mobs.goldboss$thymor.desc=Thymor ist ein herausragender Zwergenzauberer, der einst mit dem Mönchsmeister zusammenarbeitete, um die Herrschaft des Zwergenkönigs zu stürzen. Nachdem er die Schrecken der von Yog-Dzewa angeführten Dämonenlegion erlebt hatte, unterwarf er sich schließlich dem Zwergenkönig und kämpfte fortan an vorderster Front gegen Dämonen. Nach dem Tod des Zwergenkönigs verbündete er sich mit dem Ladenbesitzer, um dein Yendor-Amulett an sich zu reißen und die längst verfallene Zwergenstadt wiederzubeleben.\n\nThymor ist ein Meister der schwarzen Magie und großflächiger Fluch-Verbote. Manche haben gesehen, wie er eine riesige Dämonenlegion augenblicklich auslöschte.
actors.mobs.goldboss$thymor.curse=Wibbly wobbly, wibbly wobbly.
actors.mobs.goldboss$thymor.cursedo=Murmel murmel, freisetzen!
actors.mobs.goldboss$thymor.bolt_kill=Du wurdest von Thymors mächtiger schwarzer Magie getötet...
actors.mobs.goldboss$sheepcursecooldown.name=Großflächiger Todesfluch - Abklingzeit
actors.mobs.goldboss$sheepcursecooldown.desc=Der Todesfluch kann feindliche Kreaturen augenblicklich töten, aber der Held ist immun gegen diesen Effekt.\n\nVerbleibende Abklingzeit：%s Runden
actors.buffs.mostdegrade.name=Extrem starker Stufungsfluch
actors.buffs.mostdegrade.desc=Mächtige Dunkelmagie verschlingt die Magie, die Upgrade-Schriftrollen in deine Ausrüstung eingebracht haben!\n\nGestufte Ausrüstung wird als niedrigerer Level betrachtet. _Egal wie hoch das ursprüngliche Level, es wird auf Stufe 0 reduziert_. Die Gegenstandsbeschreibung ändert sich entsprechend.\n\nDie Stufung beeinflusst jedoch nicht die Stärkeanforderungen, Zauberstabladungen, Wurfwaffenhaltbarkeit oder Artefakte.\n\nVerbleibende Dauer des Stufungseffekts: %s Runden\n\nDie von Timur verhängte Stufung ist nicht nur stärker, sondern kann auch nicht mit Bannschriftrollen entfernt werden.


actors.mobs.npcs.shopboss.name=Ladenbesitzer?
actors.mobs.npcs.shopboss.hello=Schätze, Goldmünzen, hehe (sabbert), die Reise hat sich gelohnt.
actors.mobs.npcs.shopboss.warning=Was? Du willst mir auch meine Schätze stehlen? Glaub ja nicht, dass du mit diesem lächerlichen Amulett etwas Besonderes bist. Wenn du klug bist, verschwindest du jetzt sofort. Dieses Amulett wird früher oder später mir gehören (hämisches Lachen).
actors.mobs.npcs.shopboss.yes=Reichtum teilt man sich
actors.mobs.npcs.shopboss.no=Geht mich nichts an
actors.mobs.npcs.shopboss.desc=Anscheinend ist der Ladenbesitzer dir auch hierher gefolgt. Er schaut sich ständig um, als suche er etwas.

actors.mobs.greatshoper.name=Ladenbesitzer
actors.mobs.greatshoper.desc=Der Ladenbesitzer, den man eine Weile nicht gesehen hat, ist nicht wiederzuerkennen. Sein Gesichtsausdruck und seine Haltung zeigen pure Gier und Schadenfreude, gemischt mit Feindseligkeit dir gegenüber.\n\nDer Ladenbesitzer hat sich mit geheimen Künsten aus der Zwergenbibliothek in einen Zustand der Magieimmunität versetzt, nutzt Goldregen als Angriffsmethode und hat die verbliebenen mächtigen Zwergenwesen in seine Interessengemeinschaft aufgenommen.
actors.mobs.greatshoper$goldcurse.name=Goldfluch
actors.mobs.greatshoper$goldcurse.desc=Der Goldfluch ist eines der von den Zwergen hinterlassenen Verbote. Es ist ein mächtiger Fluch, der nur durch das Töten des Verfluchers endet. Der Ladenbesitzer hat sich jedoch eigenmächtig erlaubt, den Namen dieses Verbots willkürlich zu ändern.\n\nUnter dem Einfluss des Goldfluchs verliert der Held jede Runde 10 Goldmünzen. Unterschreitet die Goldmenge 100, verliert er jede Runde 5 Leben; Verbündete verlieren jede Runde 5 Leben.\n\nDer Goldfluch wandelt Schaden aus anderen Quellen in verzögerten Schaden um, sodass der Verfluchte kaum ausweichen kann.
actors.mobs.greatshoper.gold_kill=Du wurdest von Goldmünzen erschlagen...
actors.mobs.greatshoper.no_damage=Nutzlos! Mit diesem Magieschild kannst du mir nichts anhaben.
actors.mobs.greatshoper.summon=Gold-Elementar, Mönchsmeister, haltet diesen Kerl auf!
actors.mobs.greatshoper.summon1=Zwei Versager! Thymor, beschütze mich.
actors.mobs.greatshoper.phase4=Thymor kann dich auch nicht aufhalten? Dann sollst du mit diesen Schätzen begraben werden!
actors.mobs.greatshoper.die=Schätze! Meine Schätze!

#新精英强敌描述
actors.buffs.championenemy$corrosion.name=Ätz-Elite
actors.buffs.championenemy$corrosion.desc=Nahkampf-Angriffsgeschwindigkeit +100% mit ätzendem Schlamm, spritzt beim Tod ätzenden Schlamm um sich
actors.buffs.championenemy$haste.name=Flinke Elite
actors.buffs.championenemy$haste.desc=Nahkampf-Angriffsgeschwindigkeit +100%, Bewegungsgeschwindigkeit +50%.
actors.buffs.championenemy$holy.name=Heilige Elite
actors.buffs.championenemy$holy.desc=Erleidet 25% weniger Schaden, belebt nach Tod mit 25% der max. HP wieder, erhält 5 Runden Unverwundbarkeit, verliert danach die Heilige-Elite-Eigenschaft.
actors.buffs.championenemy$transform.name=Transformations-Elite
actors.buffs.championenemy$transform.desc=Erleidet 25% weniger Schaden, belebt nach Tod mit 33% der max. HP als zufälliger Gegner der Region wieder, verliert die Transformations-Elite-Eigenschaft und erhält eine zufällige Elite-Eigenschaft.

actors.mobs.warriorboss.name=Krieger?
actors.mobs.warriorboss.desc=Die böse uralte Gottheit versteht es, die tiefsten Wünsche im Herzen eines Menschen zu ergreifen und ihn auf den dunklen Pfad zu locken. Der Krieger... möchte jetzt alles verschlingen, was ihm vor die Augen kommt.\n\nDer Krieger? beherrscht die Kampftechniken eines Berserkers und Gladiators und kann sogar den Heldensprung ausführen.\n\nBevor er sich zum Sprung bereitmacht, gibt es vielleicht eine Möglichkeit, _seine Aufmerksamkeit abzulenken_, zum Beispiel... _Essen_?
actors.mobs.warriorboss$berserk.name=Wut
actors.mobs.warriorboss$berserk.angered_desc=Der Grad der Verletzung des Kriegers? verstärkt seine Angriffskraft. Erhält der Krieger? physischen Schaden, sammelt er Wut, die ihm zusätzliche Angriffskraft verleiht.\n\nDie Wut lässt mit der Zeit nach. Je niedriger die Gesundheit des Kriegers?, desto länger hält die Wut an.\n\nAktuelle Wut：_%.0f%%_\n_+%.0f%%_ Schaden
actors.mobs.warriorboss$combo.name=Kombo
actors.mobs.warriorboss$combo.desc=Der Krieger? kommt bei fortgesetzten Angriffen in Fahrt. Jeder Treffer erhöht seine Kombozahl um 1, aber lange Pausen zwischen Angriffen setzen die Kombozahl zurück.\n\nBei einer bestimmten Kombozahl aktiviert der Krieger? die Parade, erhält einen massiven Schild und weicht dem nächsten erlittenen Angriff garantiert aus. Die Aktivierung der Parade setzt die Kombozahl zurück.\n\nAktuelle Kombozahl：%1$d\n\nKombo verfällt nach %2$s Runden.
actors.mobs.warriorboss.eat=Das Essen ist wirklich köstlich.
actors.mobs.warriorboss.def=Ich bin auch sehr wendig!
actors.mobs.warriorboss.wantjump=Verdammt, ihr macht euch über meine kurzen Beine lustig, oder?!
actors.mobs.warriorboss.wantfood=Essen, leckeres Essen!
actors.mobs.warriorboss.leap=Fleisch-Ei-Zwiebel-Huhn!
actors.mobs.warriorboss.defeated=Es gab noch... so viel Leckeres zu essen...
actors.mobs.warriorboss.wake=Was? Gibt es Essen?
actors.mobs.warriorboss.kill=Du wurdest vom Krieger? mit Fleisch-Ei-Zwiebel-Huhn zu einem Fleischklops zerquetscht...

actors.mobs.rogueboss.name=Schurkin?
actors.mobs.rogueboss.desc=Die böse uralte Gottheit versteht es, die tiefsten Wünsche im Herzen eines Menschen zu ergreifen und ihn auf den dunklen Pfad zu locken. Die Schurkin... hält gerade die Tengu-Maske in den Händen und jubelt über die Erfüllung des Kopfgeldauftrags. Anscheinend wurde der Tengu am Ende des Kerkers von ihr getötet.\n\nDie Schurkin? ist eine Meisterin tödlicher Hinterhalte aus den Schatten. In ungünstigen Situationen nutzt sie ihre flinken Beine, um sich schnell vom Feind zu entfernen, und greift mit Wurf-Shuriken an.\n\nWenn sie in die Schatten eintaucht, kannst du sie nicht im Nahkampf angreifen, aber du kannst es _mit Fernkampfmitteln versuchen_.
actors.mobs.rogueboss.notice=Haha, schon wieder ein Opfer an der Angel!
actors.mobs.rogueboss.invisibility=Versuch mich zu fangen!
actors.mobs.rogueboss.execute=Spür meinen Stich!

actors.mobs.huntressboss.name=Jägerin?
actors.mobs.huntressboss.desc=Die Verderbnis der uralten Gottheit hat den Jagdinstinkt der Jägerin zu einer kalten Obsession geschliffen. Sie erleidet nicht mehr als 30 Schaden pro Treffer; wenn die Beute ihr Sichtfeld verlässt, folgt sie aktiv der letzten Position; auf kurze Distanz kämpft sie im Nahkampf, aus der Ferne nutzt sie Pfeil und Bogen oder sucht Deckung. In der Scharfschützenphase ignorieren ihre normalen Schüsse die Rüstung vollständig; nach jeweils drei normalen Schüssen zielt sie mit einem Durchschlagspfeil. Bei halber Gesundheit wechselt sie zur Wächterin: Normale Pfeile ignorieren keine Rüstung mehr, können aber schädliche Pflanzeneffekte auf das Ziel anwenden. Ihr Sichtfeld durchdringt hohes Gras, und sie kann Pflanzen zertrampeln, um kurzzeitig einen Wächter-Buff zu erhalten.
actors.mobs.huntressboss.discover_hint=Du könntest diesen Boss am Ende einer Dungeonregion entdecken.
actors.mobs.huntressboss.gale_aim=Der Wind hat deine Landemarke bereits gespeichert.
actors.mobs.huntressboss.warden=Dann lass die ganze Arena wurzeln!
actors.mobs.huntressboss.defeated=Diese Jagd... ist zu Ende.
actors.mobs.huntressboss.boon_blindweed=Kräuterblende, verberge meine Gestalt.
actors.mobs.huntressboss.boon_earthroot=Erdwurzel, festige meinen Schritt.
actors.mobs.huntressboss.boon_fadeleaf=Schwindblatt, durchkreuze diese Jagd.
actors.mobs.huntressboss.boon_firebloom=Feuerblüte, entzünde meine Pfeile.
actors.mobs.huntressboss.boon_icecap=Eiskappen, gefriere meine Pfeile.
actors.mobs.huntressboss.boon_mageroyal=Königsblut, reinige meinen Körper.
actors.mobs.huntressboss.boon_sorrowmoss=Kummermoos, vergifte meine Pfeile.
actors.mobs.huntressboss.boon_starflower=Sternblüte, leite mein Visier.
actors.mobs.huntressboss.boon_stormvine=Sturmranke, trage meine Schritte.
actors.mobs.huntressboss.boon_sungrass=Sonnengras, heile meine Wunden.
actors.mobs.huntressboss.boon_swiftthistle=Schnelldistel, beschleunige diese Jagd.

actors.mobs.huntressboss$distractinghawk.name=Ablenkungsfalke
actors.mobs.huntressboss$distractinghawk.desc=Der fragile Geist eines Falken, den die Jägerin? herbeiruft, um Beute zu binden. Seine Klauen verursachen nur 1 Schaden, aber jeder Treffer blendet das Ziel kurzzeitig und macht es bewegungsunfähig.
actors.mobs.huntressboss$distractinghawk.discover_hint=Du kannst diesen Gegner im Kampf gegen die Jägerin? treffen.

actors.mobs.huntressboss$huntresstentacle.name=Kampfplatz-Tentakel
actors.mobs.huntressboss$huntresstentacle.desc=Eine schwache Tentakel, die die Jägerin? nach Eintritt in die Wächterphase erweckt. Sie versperrt den Weg und peitscht auf nahe Ziele ein, wodurch der Spieler dauerhaft gebunden wird.
actors.mobs.huntressboss$huntresstentacle.discover_hint=Du kannst diesen Gegner in der Wächterphase der Jägerin? treffen.
actors.mobs.rogueboss.angered=Verdammt... wenn das so ist...
actors.mobs.rogueboss.enraged=Wut
actors.mobs.rogueboss.momentum=Kannst du jetzt noch mit mir mithalten?
actors.mobs.rogueboss.momentum-recovery=Aua, verdammt, das war anstrengend...
actors.mobs.rogueboss.kill=Du wurdest durch die hinterhältigen Tricks der Schurkin? getötet...
actors.mobs.rogueboss.rankings_desc=Du wurdest durch die hinterhältigen Tricks der Schurkin? getötet...
actors.mobs.rogueboss.spkill=Du wurdest von der Schurkin? exekutiert...
actors.mobs.rogueboss.executeninja=Schurkin?：“Ninja, verzeih mir meine Hinterhältigkeit...”
actors.mobs.rogueboss.defeated=Es sollte... stärker sein als der Tengu...
actors.mobs.rogueboss$absoluteinvisibility.name=Schattenflucht
actors.mobs.rogueboss$absoluteinvisibility.spname=Vorbereitungsphase
actors.mobs.rogueboss$absoluteinvisibility.desc=Die Schurkin? nutzt ihren Schattenumhang, um unsichtbar zu werden.\n\nIn diesem Zustand kannst du die Schurkin? nicht direkt im Nahkampf angreifen. Nach einem Fernkampf-Angriff wird sie jedoch sofort sichtbar.\n\nWenn ihre aktuelle Gesundheit über der Hälfte ihrer maximalen Gesundheit liegt, bereitet sich die unsichtbare Schurkin? in einer Vorbereitungsphase darauf vor, dich nach 10 Runden zu exekutieren. Liegt ihre Gesundheit unter der Hälfte, sinkt die Dauer des Fließgleichgewichts-Effekts in der Unsichtbarkeit nicht auf natürliche Weise.\n\nVerbleibende Schattenfluchtdauer：%s Runden
actors.mobs.rogueboss$absoluteinvisibility.spdesc=Die Schurkin? wartet geduldig und bereitet sich darauf vor, aus den Schatten den tödlichen Schlag zu führen.\n\nNach etwa 10 Runden Vorbereitung stürmt die Schurkin? blitzschnell auf dich zu und exekutiert dich. Dieser Schlag ist unausweichlich und tödlich! Zum Glück unterbricht jeder deiner Fernkampfangriffe ihre Vorbereitungsphase.\n\nDie Schurkin? hat sich %s Runden lang vorbereitet.
actors.mobs.rogueboss$momentumtime.name=Fließgleichgewicht
actors.mobs.rogueboss$momentumtime.spname=Erholung
actors.mobs.rogueboss$momentumtime.desc=Die Schurkin? befindet sich im Fließgleichgewicht. In diesem Zustand bewegt sie sich doppelt so schnell, hat eine höhere Ausweich- und Präzisionsrate sowie eine höhere Schadensverstärkung.\n\nZum Glück reduziert jeder Treffer auf die Schurkin? die Dauer des Fließgleichgewichts um 3 Runden. Nach dem Ende des Fließgleichgewichts muss sie sich eine Weile ausruhen, bevor sie es erneut aktivieren kann.\n\nVerbleibende Wirkungsdauer：%s Runden
actors.mobs.rogueboss$momentumtime.spdesc=Die Schurkin? hat das Fließgleichgewicht gerade beendet und muss sich nun eine Weile ausruhen. In dieser Zeit erleidet sie erhöhten Schaden.\n\nAber lass dich nicht täuschen: Die Schurkin? sammelt während der Ruhe weiterhin Impulse. Sobald sie sich vollständig erholt hat, tritt sie erneut in das Fließgleichgewicht ein.\n\nDie Schurkin? muss sich noch %s Runden ausruhen.
actors.mobs.rogueboss$shadowrogue.name=Schattenbild
actors.mobs.rogueboss$shadowrogue.desc=Eine formlose Schattenkopie der Schurkin?. Sie regt sich nicht und hat leere Augen, während schattenhafter Dunst um sie aufsteigt.\n\nSie ist zwar keine perfekte Kopie, aber dennoch ein fähiger Killer. Die Schurkin? hat sie in einer Notlage beschworen, um dich aufzuhalten. Ihre leeren Augen starren dich unentwegt an... ein wirklich erschreckender Anblick.
actors.mobs.rogueboss$shadowrogue.discover_hint=Du kannst diesen Gegner in einer Dungeonregion entdecken, nachdem du eine bestimmte Herausforderung aktiviert hast.


#slimegirl
actors.hero.talent$resilientarmor.name=Geschmeidige Rüstung
actors.hero.talent$resilientarmor.desc=Du fühlst, wie dein Körper geschmeidiger wird, und deine Rüstung ebenfalls.\n\nDu erhältst 0~3 zusätzliche Rüstung für die nächsten %1$d Treffer.
actors.hero.talent.resilient_meal.title=Robuste Mahlzeit
actors.hero.talent.resilient_meal.desc=_+1：_Essen gewährt dem Schleimmädchen 0~3 zusätzliche Rüstung für die nächsten _3 erlittenen Treffer_.\n\n_+2：_Essen gewährt 0~3 Rüstung für die nächsten _5 erlittenen Treffer_.
actors.hero.talent.resilient_meal.comment=
actors.hero.talent.liquid_armor.title=Flüssigpanzerverstärkung
actors.hero.talent.liquid_armor.desc=_+1：_Die Rüstung des Schleimmädchens gewährt _+1 Mindestpanzerung_.\n\n_+2：_Die Rüstung des Schleimmädchens gewährt _+2 Mindestpanzerung_.
actors.hero.talent.liquid_armor.comment=

actors.hero.talent.tough_meal.title=Kraftvolle Mahlzeit
actors.hero.talent.tough_meal.desc=_+1：_Essen gewährt dem Schleimenmädchen _10% des verlorenen Lebens als Kräuterheilung_, mindestens _3_ und maximal _15_.\n\n_+2：_Essen gewährt dem Schleimenmädchen _15% des verlorenen Lebens als Kräuterheilung_, mindestens _5_ und maximal _25_.
actors.hero.talent.tough_meal.comment=
actors.hero.talent.energy_absorption.title=Energieabsorption
actors.hero.talent.energy_absorption.desc=_+1：_Der maximale Schaden, den Schleimmädchen erleiden, beträgt höchstens _16,7% der max. LP_.\n\n_+2：_Der maximale Schaden, den Schleimmädchen erleiden, beträgt höchstens _12,5% der max. LP_.
actors.hero.talent.energy_absorption.comment=Diese Fertigkeit wird nach allen Schadensreduktionen berechnet.
actors.hero.talent.energy_absorption.meta_desc=_Wenn diese Fertigkeit von einem anderen Helden erhalten wird_, begrenzt sie bei +1 den erlittenen Schaden auf 30% der max. LP und bei +2 auf 20%.
actors.hero.talent.slime_greenhouse.title=Schleim-Gewächshaus
actors.hero.talent.slime_greenhouse.desc=_+1：_Samen keimen im Körper des Schleimmädchens _ohne Rundeneinsatz_.\n\n_+2：_Zusätzlich zu +1 stellen keimende Samen _30 Sättigung_ wieder her.
actors.hero.talent.slime_greenhouse.comment=Mit der Herausforderung „Ödland“ reduziert das Aufwerten dieses Talents die Runden für die Samenkeimung im Körper von 20 _auf 15_.
actors.hero.talent.slime_greenhouse.meta_desc=_Wenn dieses Talent von einem anderen Helden erlangt wird_, kann er auf +1 Samen essen, um 30 Sättigung wiederherzustellen. Auf +2 wird zusätzlich der entsprechende Pflanzeneffekt des Samens ausgelöst.

actors.hero.talent.original_monster.title=Ursprüngliches Monster
actors.hero.talent.original_monster.desc=_+1：_Die Heilung des Schleimmädchens durch den _Kräuterheilung_-Effekt wird um _50% erhöht_.\n\n_+2：_Zusätzlich zu +1 erhält das Schleimmädchen mit _Kräuterheilung_ außerdem _33% Elementarresistenz_.\n\n_+3：_Zusätzlich zu +1 und +2 verliert das Schleimmädchen _den Kräuterheilung-Effekt nicht mehr bei Bewegung_.
actors.hero.talent.original_monster.comment=

actors.hero.herosubclass.waterslime=Wasserschleim
actors.hero.herosubclass.waterslime_short_desc=_Wasserschleim_ hat höhere max. Lebenspunkte und kann bei physischen Angriffen Schleimtropfen abspalten, deren Aufnahme Leben regeneriert.
actors.hero.herosubclass.waterslime_desc=Der Wasserschleim erhält zusätzlich 50% der aktuellen Stufe an max. Lebenspunkten. Er hat zudem eine natürliche Lebensregenerationsrate von 1% der max. Lebenspunkte (mindestens 1).\n\nBei erlittenem physischen Schaden verliert der Wasserschleim 10% seiner aktuellen Lebenspunkte und spaltet im umliegenden 9x9-Bereich zufällig einen Schleimtropfen ab. Durch Aufnehmen dieses Tropfens können 10% der max. Lebenspunkte regeneriert werden.\n\nDas Abspalten eines Schleimtropfens kostet mindestens 1 Lebenspunkt (führt nicht zum Tod des Wasserschleims). Nach jeder Erzeugung gibt es 30 Runden Abklingzeit. Erlittener Schaden reduziert die Abklingzeit um 1 Runde.
actors.hero.talent.water_body.title=Wassergeist-Körper
actors.hero.talent.water_body.desc=_+1：_Das Wasserelementar-Schleim erhält zusätzlich _100% der aktuellen Stufe_ an maximaler Gesundheit.\n\n_+2：_Das Wasserelementar-Schleim erhält zusätzlich _150% der aktuellen Stufe_ an maximaler Gesundheit.\n\n_+3：_Das Wasserelementar-Schleim erhält zusätzlich _200% der aktuellen Stufe_ an maximaler Gesundheit.
actors.hero.talent.water_body.comment=
actors.hero.talent.water_revival.title=Wasser-Wiederbelebung
actors.hero.talent.water_revival.desc=_+1：_Das Wasserelementar-Schleim absorbiert Schleim-Schleim und stellt _12.5% der maximalen Gesundheit_ wieder her.\n\n_+2：_Das Wasserelementar-Schleim absorbiert Schleim-Schleim und stellt _15% der maximalen Gesundheit_ wieder her.\n\n_+3：_Zusätzlich zu +2: Das Wasserelementar-Schleim verbraucht beim Absondern von Schleim-Schleim nur _5% der aktuellen Gesundheit_.
actors.hero.talent.water_revival.comment=
actors.hero.talent.water_regeneration.title=Wasser-Regeneration
actors.hero.talent.water_regeneration.desc=_+1：_Das Wasserelementar-Schleim erhält eine natürliche Lebensregeneration von _1.17% der maximalen Gesundheit_ (mindestens 1).\n\n_+2：_Das Wasserelementar-Schleim erhält eine natürliche Lebensregeneration von _1.33% der maximalen Gesundheit_ (mindestens 1).\n\n_+3：_Das Wasserelementar-Schleim erhält eine natürliche Lebensregeneration von _1.5% der maximalen Gesundheit_ (mindestens 1).
actors.hero.talent.water_regeneration.comment=
actors.hero.talent$slimemucuscooldown.name=Schleimabscheidung
actors.hero.talent$slimemucuscooldown.desc=Der Wasserschleim hat gerade erst einen Teil seines Schleims abgespalten. Er braucht eine Weile, um den nächsten abspalten zu können. Zudem beschleunigt er die Schleimabscheidung, wenn er angegriffen wird.\n\nDer Wasserschleim braucht noch %s Runden, um den nächsten Schleim abzuspalten.
actors.mobs.npcs.slimemucus.name=Schleim-Schleim
actors.mobs.npcs.slimemucus.desc=Schleim-Schleim ist ein Stück Schleim, das sich vom Wassergeist-Schleim gelöst hat. Nach dem Aufsetzen absorbiert er Mikroorganismen unter dem Schleim und dehnt sich aus, um nach der Absorption durch den Wassergeist-Schleim mehr Leben wiederherzustellen. Er kann natürlich auch durch feindliche Angriffe zerstört werden.\n\nSchleim-Schleim hat 10 Leben und verliert jede Runde 1 Leben. Der Wassergeist-Schleim kann Schleim-Schleim in einem Umkreis von 8 Feldern durch Anklicken absorbieren. Der Absorptionsvorgang verbraucht keine Runde.\n\nSchleim-Schleim erbt die Hälfte der Rüstung des Wassergeist-Schleims.
actors.mobs.npcs.slimemucus.absorb_title=Schleim-Schleim
actors.mobs.npcs.slimemucus.absorb_body=Dieser Teil des Schleims, der sich von dir abgespalten hat, scheint bereits Nährstoffe aus der Umgebung aufgesogen zu haben.\n\nMöchtest du diesen Schleim absorbieren? Er kann dein Leben wiederherstellen.
actors.mobs.npcs.slimemucus.absorb_confirm=Absorbieren
actors.mobs.npcs.slimemucus.absorb_cancel=Abbrechen
actors.mobs.npcs.slimemucus.discover_hint=Du kannst diese Einheit durch eine bestimmte Helden-Spezialisierung entdecken.

actors.hero.herosubclass.darkslime=Dunkelschleim
actors.hero.herosubclass.darkslime_short_desc=_Dunkelschleim_ verliert einen Teil seiner max. Lebenspunkte, ist aber immun gegen ätzenden Schlamm und spritzt ihn auf Gegner. Zudem kann er die Dunkelflüssigkeitsklaue einsetzen.
actors.hero.herosubclass.darkslime_desc=Der Dunkelschleim hat die bösen Nährstoffe des Kerkers aufgenommen und dunkle Kräfte erlangt. Dies reduziert seine max. Lebenspunkte um 20%, macht ihn aber immun gegen ätzenden Schlamm.\n\nDer Dunkelschleim hat eine 50% Chance, dem Ziel bei einem Angriff 20 Runden ätzenden Schlamm zu verleihen. Er hat zudem eine 15% Chance, dem Angreifer bei erlittenem Schaden 20 Runden ätzenden Schlamm zu verleihen (verdoppelt bei Fernkampfangriffen).\n\nDer Dunkelschleim kann alle 65 Runden eine Dunkelflüssigkeitsklaue einsetzen, um einen Gegner in Sichtweite heranzuziehen und 3 Runden zu fesseln.\n\nDiese Spezialisierung hat eine Spezialfähigkeit, wenn die Klaue bereit ist. Bei mehreren Spezialfähigkeiten kann durch langes Drücken des Kurzbefehls gewechselt werden.
actors.buffs.darkhook.name=Dunkelflüssigkeitsklaue
actors.buffs.darkhook.desc=Zeit, eine Beute auszuwählen.\n\nAlle 65 Runden kann die Dunkelflüssigkeitsklaue eingesetzt werden, um einen Gegner in Sichtweite heranzuziehen und 3 Runden zu fesseln.\n\nDie Reichweite dieser Fähigkeit beträgt 12 Felder.
actors.hero.talent$darkhookcooldown.name=Hakenklauen-Erholung
actors.hero.talent$darkhookcooldown.desc=Der Dunkelflüssigkeits-Schleim hat gerade erst seine Dunkelflüssigkeits-Hakenklaue eingesetzt. Das kräftige Ziehen hat sie so sehr ermüdet, dass sie eine Weile braucht, um sich zu erholen.\n\nDie Erholung dieser Fähigkeit dauert noch %s Runden.
actors.buffs.darkhook.cant_pull=Kann das Ziel nicht ziehen.
actors.buffs.darkhook.does_nothing=Diese Entfernung kann nicht weiter verringert werden.
actors.buffs.darkhook.more_distance=Zu weit entfernt, um es zu erreichen.
actors.hero.talent.potent_ooze.title=Starker Schlamm
actors.hero.talent.potent_ooze.desc=Durch Aufwerten dieses Talents entfernt Wasser den ätzenden Schlamm nicht mehr sofort, sondern reduziert nur die Dauer.\n\n_+1：_Im Wasser reduziert sich die Dauer von _Ätzendem Schlamm_ um zusätzliche _3 Runden_.\n\n_+2：_Im Wasser reduziert sich die Dauer um zusätzliche _2 Runden_.\n\n_+3：_Im Wasser reduziert sich die Dauer um zusätzliche _1 Runde_.
actors.hero.talent.potent_ooze.comment=
actors.hero.talent.dark_gas.title=Dunkelgas-Freisetzung
actors.hero.talent.dark_gas.desc=_+1:_ Nach einem Angriff auf den Dunkelflüssigkeits-Schleim besteht eine _20% Wahrscheinlichkeit_, dass etwas _Giftgas_ freigesetzt wird und er _4 Runden Reinigungsbarriere_ erhält.\n\n_+2:_ _20% Wahrscheinlichkeit_ für _Gift- oder Säuregas_ und _4 Runden Reinigungsbarriere_.\n\n_+3:_ _20% Wahrscheinlichkeit_ für _Gift-, Säure- oder Fäulnisgas_ und _4 Runden Reinigungsbarriere_.
actors.hero.talent.dark_gas.comment=Die drei Gasarten werden einzeln mit Wahrscheinlichkeit freigesetzt, nicht alle auf einmal.
actors.hero.talent.dark_liquid.title=Dunkelflüssigkeits-Ummantelung
actors.hero.talent.dark_liquid.desc=_+1:_ Der Dunkelflüssigkeits-Schleim wendet mit der Dunkelflüssigkeits-Hakenklaue zusätzlich _2 Runden Ummantelung_ an, insgesamt 5 Runden.\n\n_+2:_ Zusätzlich zu +1 wendet er _20 Runden Korrosionsschlamm_ an.\n\n_+3:_ Zusätzlich zu +1 und +2 gewährt ein im _Ummantelungs-Zustand_ getöteter Feind _8 Runden Zauberstabladung und 5 Runden Artefaktladung_ und _setzt die Abklingzeit der Hakenklaue zurück_.
actors.hero.talent.dark_liquid.comment=Wenn dieses Talent auf +3 ist, setzt das Ziehen von Feinden in den Abgrund die Abklingzeit der Dunkelflüssigkeits-Hakenklaue nicht zurück.

actors.hero.heroclass.slimegirl=Schleimmädchen
actors.hero.heroclass.slimegirl_desc_short=Das Schleimmädchen beginnt mit einer nicht ablegbaren, aber mitwachsenden _Schleimrüstung_ und kann _Samen in ihrem Körper keimen lassen_.
actors.hero.heroclass.slimegirl_desc=Das Schleimmädchen beginnt mit einer _einzigartigen Schleimrüstung_. Die Schleimrüstung kann nicht abgelegt werden, erhält aber mit jedem Levelaufstieg zusätzliche Stufen und sogar Qualitätsstufen.\n\nDas Schleimmädchen hat weniger Stärke, dafür aber höhere Anfangslebenspunkte und ein besseres Wachstum. Sie kann _Samen in ihrem Körper keimen lassen, um entsprechende Pflanzeneffekte zu erzeugen_, was normalerweise 1 Runde dauert.\n\nAußerdem beginnt das Schleimmädchen mit _einem Speer des Bestrafers_, _zwei Schleimkugeln_, einem Wasserschlauch und einem Beutel.\n\nAls Monster hat das Schleimmädchen nicht viel menschliches Wissen, daher sind zu Beginn nur folgende Gegenstände identifiziert:\n_-_ Wandlungs- und Identifikations-Schriftrolle
actors.hero.heroclass.slimegirl_unlock=_Besiege Goo in einem Spiel_, um das Schleimmädchen freizuschalten.

actors.hero.abilities.slime.madslime.name=Wildes Fressen
actors.hero.abilities.slime.madslime.self_target=Kann nicht auf sich selbst angewendet werden.
actors.hero.abilities.slime.madslime.no_target=Kein Ziel zum Verschlingen verfügbar.
actors.hero.abilities.slime.madslime.more_distance=Ziel zu weit entfernt.
actors.hero.abilities.slime.madslime.strong_target=Du kannst dieses Ziel nicht verschlingen.
actors.hero.abilities.slime.madslime.eat=Das Ziel war köstlich, du fühlst dich voller Kraft.
actors.hero.abilities.slime.madslime.eat1=Du spürst, wie deine Wunden langsam heilen.
actors.hero.abilities.slime.madslime.eat2=Du hast das Gefühl, als würde eine Barriere dich schützen.
actors.hero.abilities.slime.madslime.short_desc=Das Schleimmädchen beherrscht _Wildes Fressen_, ihr unstillbarer Appetit kann einen benachbarten Gegner vollständig verschlingen.
actors.hero.abilities.slime.madslime.desc=Das Schleimmädchen ist voller Fresslust. Sie kann einen benachbarten Gegner verschlingen, um ihren Sättigungsgrad wiederherzustellen. Der verschlungene Gegner erhält massiven Schaden und stirbt sofort.\n\nDas Schleimmädchen kann keine Bosse, kleinen Bosse, Eliten oder Verbündeten verschlingen.\n\nBasis-Sättigungsregeneration: _250_ (beeinflusst durch Essensknappheit-Herausforderung)
actors.hero.talent.no_pick.title=Hungrig wählerlos
actors.hero.talent.no_pick.desc=_+1：_Durch Verschlingen von Gegnern wiederhergestellte Sättigung _um 20% erhöht_.\n\n_+2：_Durch Verschlingen von Gegnern wiederhergestellte Sättigung _um 40% erhöht_.\n\n_+3：_Durch Verschlingen von Gegnern wiederhergestellte Sättigung _um 60% erhöht_.\n\n_+4：_Durch Verschlingen von Gegnern wiederhergestellte Sättigung _um 80% erhöht_.
actors.hero.talent.no_pick.comment=
actors.hero.talent.food_bonus.title=Blutige Natur
actors.hero.talent.food_bonus.desc=_+1：_Das Verschlingen von Feinden _löst Essenseffekte aus_.\n\n_+2：_Wie bei +1 erzeugt das Verschlingen ein _5x5 Duellfeld_ um den Helden.\n\n_+3：_Wie bei +1 und +2 gewährt das Verschlingen _25% der verlorenen LP als Heilung_.\n\n_+4：_Wie bei +1, +2 und +3 gewährt das Verschlingen _20% der max. LP als Schild_.
actors.hero.talent.food_bonus.comment=
actors.hero.talent.delicious_digestion.title=Schlemmen
actors.hero.talent.delicious_digestion.desc=_+1:_ Wenn die Schleimmutter bei 100% Rüstungsladung das Tagebuch der wilden Geschichte verwendet, wird der Ladungsverbrauch _um 16% reduziert_.\n\n_+2:_ Ladungsverbrauch _reduziert um 30%_.\n\n_+3:_ Ladungsverbrauch _reduziert um 40%_.\n\n_+4:_ Ladungsverbrauch _reduziert um 50%_.
actors.hero.talent.delicious_digestion.comment=

actors.hero.abilities.slime.rapidwaterfall.name=Sturzwasserfall
actors.hero.abilities.slime.rapidwaterfall.short_desc=Das Schleimmädchen wirkt _Sturzwasserfall_, der die Umgebung mit aufsteigendem Wasserdampf füllt, Areale in Wasserbecken verwandelt und alle Fallen zerstört.
actors.hero.abilities.slime.rapidwaterfall.desc=Das Schleimmädchen kann aufsteigenden Wasserdampf um sich herum erzeugen, der die Umgebung in Wasserbecken verwandelt.\n\nBasis-Dampfmenge: _45_
actors.hero.abilities.slime.rapidwaterfall$rapidwater.name=Sturzwasserfall
actors.hero.abilities.slime.rapidwaterfall$rapidwater.desc=Aufsteigender Wasserdampf, der die Umgebung in Wasserbecken verwandeln und alle Fallen zerstören kann.
actors.hero.talent.violent_storm.title=Sturm und Regen
actors.hero.talent.violent_storm.desc=_+1：_Die erzeugte Dampf-Gas-Einheit _erhöht sich um 25%_.\n\n_+2：_Die erzeugte Dampf-Gas-Einheit _erhöht sich um 50%_.\n\n_+3：_Die erzeugte Dampf-Gas-Einheit _erhöht sich um 75%_.\n\n_+4：_Die erzeugte Dampf-Gas-Einheit _erhöht sich um 100%_.
actors.hero.talent.violent_storm.comment=
actors.hero.talent.new_trap.title=Neues aus der Tiefe
actors.hero.talent.new_trap.desc=_+1：_Wenn aufsteigender Dampf von Tosender Strom Fallen zerstört, besteht eine _20%ige Chance, 1 Fallenkristall_ zu erzeugen.\n\n_+2：_Wenn aufsteigender Dampf von Tosender Strom Fallen zerstört, besteht eine _40%ige Chance, 1 Fallenkristall_ zu erzeugen.\n\n_+3：_Wenn aufsteigender Dampf von Tosender Strom Fallen zerstört, besteht eine _60%ige Chance, 1 Fallenkristall_ zu erzeugen.\n\n_+4：_Wenn aufsteigender Dampf von Tosender Strom Fallen zerstört, besteht eine _80%ige Chance, 1 Fallenkristall_ zu erzeugen.
actors.hero.talent.new_trap.comment=Jede Nutzung von Tosender Strom erzeugt maximal 3 Fallenkristalle.
actors.hero.talent.holy_bath.title=Heiliges Bad
actors.hero.talent.holy_bath.desc=_+1：_Feinde im Dampf des tosenden Wasserfalls werden _1 Feld_ in Richtung eines benachbarten Nicht-Wasser-Feldes zurückgestoßen.\n\n_+2：_Feinde im Dampf des tosenden Wasserfalls werden _2 Felder_ in Richtung eines benachbarten Nicht-Wasser-Feldes zurückgestoßen.\n\n_+3：_Feinde im Dampf des tosenden Wasserfalls werden _3 Felder_ in Richtung eines benachbarten Nicht-Wasser-Feldes zurückgestoßen.\n\n_+4：_Feinde im Dampf des tosenden Wasserfalls werden _4 Felder_ in Richtung eines benachbarten Nicht-Wasser-Feldes zurückgestoßen.
actors.hero.talent.holy_bath.comment=Der Rückstoßeffekt dieser Fertigkeit kann Feinde nicht in den Abgrund stoßen.

actors.hero.abilities.slime.springspell.name=Frühlingszauber
actors.hero.abilities.slime.springspell.short_desc=Das Schleimmädchen wirkt einen _Frühlingszauber_, der ihr und Verbündeten einen Kräuterheilungseffekt gewährt.
actors.hero.abilities.slime.springspell.desc=Das Schleimmädchen kann einen Frühlingszauber wirken, der ihr und sogar Verbündeten einen Kräuterheilungseffekt gewährt.\n\nBasisheilung: _25_
actors.hero.talent.potent_healing.title=Starke Heilung
actors.hero.talent.potent_healing.desc=_+1：_Der _Kräuterheilung_-Effekt durch das Frühlingsarray wird auf _30 Punkte_ erhöht.\n\n_+2：_Der _Kräuterheilung_-Effekt wird auf _35 Punkte_ erhöht.\n\n_+3：_Der _Kräuterheilung_-Effekt wird auf _40 Punkte_ erhöht.\n\n_+4：_Der _Kräuterheilung_-Effekt wird auf _45 Punkte_ erhöht.
actors.hero.talent.potent_healing.comment=
actors.hero.talent.efficient_healing.title=Effiziente Heilung
actors.hero.talent.efficient_healing.desc=_+1：_Die _Kräuterheilung_ des Frühlingskreises heilt _1,5 LP pro Runde_.\n\n_+2：_Die _Kräuterheilung_ des Frühlingskreises heilt _2 LP pro Runde_.\n\n_+3：_Die _Kräuterheilung_ des Frühlingskreises heilt _2,5 LP pro Runde_.\n\n_+4：_Die _Kräuterheilung_ des Frühlingskreises heilt _3 LP pro Runde_.
actors.hero.talent.efficient_healing.comment=Diese Fertigkeit beeinflusst nicht die Gesamtheilung der Kräuterheilung, sondern nur die Geschwindigkeit.
actors.hero.talent.mass_healing.title=Massenheilung
actors.hero.talent.mass_healing.desc=_+1：_Wenn das Frühlingsarray aktiv ist, erhält ein Verbündeter mit den wenigsten Lebenspunkten im _3x3-Bereich_ um das Schleimmädchen herum den gleichen _Kräuterheilung_-Effekt.\n\n_+2：_Wenn das Frühlingsarray aktiv ist, erhält ein Verbündeter mit den wenigsten Lebenspunkten im _5x5-Kreisbereich_ um das Schleimmädchen herum den gleichen _Kräuterheilung_-Effekt.\n\n_+3：_Wenn das Frühlingsarray aktiv ist, erhält ein Verbündeter mit den wenigsten Lebenspunkten im _5x5-Bereich_ um das Schleimmädchen herum den gleichen _Kräuterheilung_-Effekt.\n\n_+4：_Wenn das Frühlingsarray aktiv ist, erhält ein Verbündeter mit den wenigsten Lebenspunkten im _7x7-Kreisbereich_ um das Schleimmädchen herum den gleichen _Kräuterheilung_-Effekt.
actors.hero.talent.mass_healing.comment=

actors.hero.talent.liquid_perception.title=Flüssige Wahrnehmung
actors.hero.talent.liquid_perception.desc=_+1：_Wenn das Schleimmädchen einen Stärke- oder Erfahrungstrank trinkt, wird _1 Trank_ zufällig identifiziert.\n\n_+2：_Wenn das Schleimmädchen einen Stärke- oder Erfahrungstrank trinkt, werden _1 Trank oder 1 Rolle_ zufällig identifiziert.
actors.hero.talent.liquid_perception.comment=Diese Fertigkeit wirkt auch beim Konsum von Gegenständen, die aus Stärke- oder Erfahrungstränken hergestellt wurden.

actors.hero.talent.water_wave.title=Wellenschlag
actors.hero.talent.water_wave.desc=_+1：_Beim Angriff auf Feinde im Wasser verursacht das Schleimenmädchen _1 zusätzlichen Schaden_.\n\n_+2：_Beim Angriff auf Feinde im Wasser verursacht das Schleimenmädchen _2 zusätzlichen Schaden_.
actors.hero.talent.water_wave.comment=

actors.hero.talent.natural_affinity.title=Naturverbundenheit
actors.hero.talent.natural_affinity.desc=_+1：_Die Hungerrate des Schleimmädchens _sinkt um 20%_.\n\n_+2：_Die Hungerrate des Schleimmädchens _sinkt um 33%_.
actors.hero.talent.natural_affinity.comment=

actors.hero.talent.quality_absorption.title=Qualitätsabsorption
actors.hero.talent.quality_absorption.desc=_+1：_Die Lebenswiederherstellung des Schleimmädchens durch absorbierte Tautropfen erhöht sich um _2 Punkte_.\n\n_+2：_Erhöht sich um _3 Punkte_.
actors.hero.talent.quality_absorption.comment=Dieses Talent gilt auch für Tautropfen aus dem Wasserschlauch, erhöht aber nur die Menge einer einzelnen Absorption.

actors.hero.talent.empowering_life.title=Gestärktes Leben
actors.hero.talent.empowering_life.desc=_+1：_Ist die LP der Schleimmädchen voll, wird überschüssige natürliche Heilung in nicht verfallende Schilde umgewandelt, begrenzt auf _6,7% der max. LP_, und _Zauberschaden erhöht sich um 10%_.\n\n_+2：_Ist die LP der Schleimmädchen voll, wird überschüssige natürliche Heilung in nicht verfallende Schilde umgewandelt, begrenzt auf _13,3% der max. LP_, und _Zauberschaden erhöht sich um 20%_.\n\n_+3：_Ist die LP der Schleimmädchen voll, wird überschüssige natürliche Heilung in nicht verfallende Schilde umgewandelt, begrenzt auf _20% der max. LP_, und _Zauberschaden erhöht sich um 30%_.
actors.hero.talent.empowering_life.comment=

actors.hero.talent.ninja_meal.title=Ninja-Bentō
actors.hero.talent.ninja_meal.desc=_+1：_Essen stellt _1 Aufladung_ des Shurikenkastens des Ninjas wieder her.\n\n_+2：_Essen stellt _2 Aufladungen_ des Shurikenkastens des Ninjas wieder her.
actors.hero.talent.ninja_meal.comment=Wenn sich kein Shurikenkasten im Inventar befindet, gewährt dieses Talent auf _+1/+2_ _1/2 Runden Artefaktaufladung_ (kann das Füllhorn nicht selbst aufladen).\n\n„Fest mit Fleisch gefüllte Feldration, er hat sie auf einmal verschlungen!“

actors.hero.talent.agile_attack.title=Flinker Konter
actors.hero.talent.agile_attack.desc=_+1:_ Wenn der Ninja einem feindlichen Angriff ausweicht, verursacht sein nächster physischer Angriff _3 zusätzlichen Schaden_.\n\n_+2:_ Wenn der Ninja einem feindlichen Angriff ausweicht, verursacht sein nächster physischer Angriff _5 zusätzlichen Schaden_.
actors.hero.talent.agile_attack.comment=„Namo Amida Butsu – so ein geschickter Ausweich-Konter-Combo, den die Zuschauer mit ihrer Ninja-Dynamic-Vision sicherlich klar gesehen haben."
actors.hero.talent$agileattack.name=Flinker Konter
actors.hero.talent$agileattack.desc=Der Ninja hat kürzlich einem feindlichen Angriff ausgewichen. Sein nächster physischer Angriff auf das Ziel erhält Schadensbonus.

actors.hero.talent.you_scared_me.title=Du hast mich erschreckt
actors.hero.talent.you_scared_me.desc=_+1：_Jedes Mal, wenn der Ninja einem Angriff ausweicht und der aktuelle Schild unter _4 Punkten_ liegt, erhält er _2 Schildpunkte_.\n\n_+2：_Jedes Mal, wenn der Ninja einem Angriff ausweicht und der aktuelle Schild unter _6 Punkten_ liegt, erhält er _3 Schildpunkte_.
actors.hero.talent.you_scared_me.comment=Durch diese Fertigkeit erhaltener Schild überschreitet auf Stufe _+1/+2_ nicht _4/6 Punkte_.\n\n„Wind-Wald-Feuer-Berg, Teezeremonie, und dann... Wind-Wald-Feuer-Berg.“

actors.hero.talent.yunying_meal.title=Wolkenversteck-Mahlzeit
actors.hero.talent.yunying_meal.desc=_+1：_Der Ninja isst in nur 1 Runde und erhält _2 Runden Unsichtbarkeit_.\n\n_+2：_Der Ninja isst in nur 1 Runde und erhält _4 Runden Unsichtbarkeit_.
actors.hero.talent.yunying_meal.comment=Diese Fertigkeit teilt sich mit den Talenten _Essen für Erfahrung_, _Unbesiegbare Mahlzeit_ und _Geburtstagsgeschenk_ eine _100-fache Auslösebegrenzung_.\n\n„AIEEEEEEEE! Ninja! Was macht ein Ninja hier?!“

actors.hero.talent.xia.title=Nebelschritt-Geheimnis
actors.hero.talent.xia.desc=_+1：_Nach dem Lesen einer Schriftrolle oder der Verwendung eines Zauberkristalls erhält der Ninja _3 Runden_ Nebelschritt (+50% Ausweichen).\n\n_+2：_Nach dem Lesen einer Schriftrolle oder der Verwendung eines Zauberkristalls erhält der Ninja _5 Runden_ Nebelschritt (+50% Ausweichen).
actors.hero.talent.xia.comment=Bei Verwendung einer Aufwertungsrolle, einer Transformationsrolle oder eines daraus hergestellten alchemistischen Gegenstands verdoppelt sich die Wirkungsdauer der Nebelschritt-Technik.\n\nBei ergiebigen alchemistischen Gegenständen (wie den meisten Kristallen) löst sich die Fertigkeit basierend auf der Wahrscheinlichkeit der Einzelausbeute aus.\n\nDiese Fertigkeit kann durch Lesen des Chaotischen Tomes ausgelöst werden.\n\n„Vor langer Zeit erfand der erste Ninja-Meister, der die geheimen Ninja-Künste beherrschte, eine geheime Technik namens Nebelschritt mithilfe einer Schriftrolle.“

actors.hero.talent$xiadef.name=Nebelschritt
actors.hero.talent$xiadef.desc=Nach dem Lesen einer Schriftrolle hat der Ninja kurzzeitig eine geheime Technik erfasst, die seinen Körper leicht und beweglich macht.\n\nDieser Effekt erhöht dein Ausweichen um 50%%, um feindlichen Angriffen besser auszuweichen.\n\nVerbleibende Runden: %s Runden

actors.hero.talent.quick_search.title=Schnellsuche
actors.hero.talent.quick_search.desc=_+1：_Die Suche des Ninjas in der Umgebung _verbraucht nur 1 Runde_.\n\n_+2：_Zusätzlich zu +1 verbraucht die Suche _nur das 2-fache an Sättigung_.
actors.hero.talent.quick_search.comment=Hinweis: Normales Suchen verbraucht immer 2 Runden und das 3-fache an Sättigung.\n\n„Erst wenn die Umgebung erkundet ist, kann man sich ausruhen und kämpfen.“

actors.hero.talent.ninja_social.title=Ninja-Gesellschaft
actors.hero.talent.ninja_social.desc=_+1：_Nachdem der Ninja einen Gegner mit einer physischen Waffe getötet hat, erhöht sich die Genauigkeit der nächsten _3 Angriffe_ um 50%.\n\n_+2：_Nachdem der Ninja einen Gegner mit einer physischen Waffe getötet hat, erhöht sich die Genauigkeit der nächsten _5 Angriffe_ um 50%.
actors.hero.talent.ninja_social.comment=„Namu, was für ein präziser Chop-Combo, wirklich eine gute Fertigkeit.“
actors.hero.talent$ninjasocial.name=Ninja-Gesellschaft
actors.hero.talent$ninjasocial.desc=Bei den nächsten Angriffen ist die Genauigkeit des Ninjas um 50%% erhöht.\n\nVerbleibende Anwendungen: %s

actors.hero.talent.feint.title=Finte
actors.hero.talent.feint.desc=_+1：_Wirft der Ninja einen Nicht-Waffen-Gegenstand auf leeres Feld, lockt dies Feinde in Sichtweite dorthin. _20 Runden Abklingzeit_.\n\n_+2：_Wirft der Ninja einen Nicht-Waffen-Gegenstand auf leeres Feld, lockt dies Feinde in Sichtweite dorthin. _15 Runden Abklingzeit_.
actors.hero.talent.feint.comment=Diese Fertigkeit kann schlafende Feinde wecken. Normalerweise haben angelockte Feinde pro Runde eine 50%ige Chance, die Aufmerksamkeit auf den Ninja oder Verbündete zu richten.\n\nWillst du mich verarschen?!
actors.hero.talent$feintcooldown.name=Ablenkung - Abklingzeit
actors.hero.talent$feintcooldown.desc=Du hast gerade einen Gegenstand geworfen, um Feinde abzulenken. Es wird eine Weile dauern, bis du wieder durch Geräusche ihre Aufmerksamkeit erregen kannst.\n\nVerbleibende Abklingzeit: %s Runden

actors.hero.talent.light_box.title=Leichter Ninja-Werkzeugkasten
actors.hero.talent.light_box.desc=_+1：_Der Ninja kann den Wurfscheibenkasten auch ohne Ausrüstung nutzen, aber die Aufladerate sinkt auf _25%_.\n\n_+2：_Der Ninja kann den Wurfscheibenkasten auch ohne Ausrüstung nutzen, aber die Aufladerate sinkt auf _50%_.\n\n_+3：_Der Ninja kann den Wurfscheibenkasten auch ohne Ausrüstung nutzen, aber die Aufladerate sinkt auf _75%_.
actors.hero.talent.light_box.comment=Ist kein Wurfscheibenkasten im Inventar, verbessert diese Fertigkeit auf Stufe _+1/+2/+3_ alle Wurfwaffen um _1/2/3 Stufen_ für 4 Runden nach Benutzung des Artefakts.

actors.hero.talent.qianfa_throwing.title=Tausend-Wurf
actors.hero.talent.qianfa_throwing.desc=_+1：_Wenn der Ninja eine Wurfwaffe oder einen kleinen Shuriken wirft, besteht eine _10%ige Chance_ auf 3-fachen Schaden.\n\n_+2：_Eine _20%ige Chance_ auf 3-fachen Schaden.\n\n_+3：_Eine _30%ige Chance_ auf 3-fachen Schaden.
actors.hero.talent.qianfa_throwing.comment=Wenn ein Held mit besonderen Wurfwaffen wie dem Seelenbogen dieses Talent erhält, profitieren auch besondere Wurfwaffen von diesem Bonus.\n\n„Anleitung · Eins: Wenn du einen Gegner nicht mit hundert Shuriken erledigen kannst, versuche nicht, es mit einem zu schaffen – wirf tausend!“

actors.hero.heroclass.ninja=Ninja
actors.hero.heroclass.ninja_desc_short=Der Ninja kann seinen _Wurfstern-Kasten_ nutzen, um Gegner zu treffen oder zu lähmen. Er hat zudem eine größere _Aufspürreichweite_ und eine höhere _Tarnfähigkeit_.
actors.hero.heroclass.ninja_desc=Der Ninja beginnt mit einem _einzigartigen Wurfstern-Kasten_, aus dem er schnell kleine Wurfsterne nehmen und werfen kann, um Gegner zu treffen oder zu lähmen.\n\nDer Ninja kann _Geheimnisse und Fallen aus größerer Entfernung aufspüren_ und seine Bewegungen sind _schwerer zu bemerken_.\n\nAußerdem beginnt der Ninja mit _einem Wakizashi_, Stoffrüstung, einem Wasserschlauch und einem Beutel.\n\nZu Beginn identifizierte Gegenstände:\n_-_ Giftgastrank\n_-_ Wandlungs-, Identifikations- und Teleportations-Schriftrolle
actors.hero.heroclass.ninja_unlock=_Besiege Tengu in einem Spiel_, um den Ninja freizuschalten.
actors.hero.herosubclass.tatteki_ninja=Gewehr-Ninja
actors.hero.herosubclass.tatteki_ninja_short_desc=Der _Gewehr-Ninja_ erhält ein mächtiges Gewehr mit enormem Schaden und langer Abklingzeit.
actors.hero.herosubclass.tatteki_ninja_desc=Der Gewehr-Ninja erhält ein Gewehr, das als Zweitwaffe ausgerüstet werden kann und die Stufe der Hauptwaffe teilt. Schüsse mit dem Gewehr verursachen enormen Schaden und jagen allen Feinden im Sichtfeld Angst ein, unabhängig davon, ob der Schuss trifft. Jeder Schuss benötigt jedoch 30 Runden Abklingzeit.\n\nDas Gewehr des Gewehr-Ninja hat eine sehr geringe Treffergenauigkeit und kann nicht für Hinterhalte genutzt werden. Er kann jedoch durch Werfen von Wurfwaffen oder kleinen Wurfsternen einen ballistischen Korrektureffekt auf Gegner anwenden, wodurch das Ziel garantiert vom Gewehr getroffen wird.
actors.hero.talent.soko.title=Hayaze (Frühladung)
actors.hero.talent.soko.desc=_+1：_Die Ladezeit des Gewehr-Ninjas _reduziert sich um 4 Runden_.\n\n_+2：_Reduziert sich um 7 Runden_.\n\n_+3：_Reduziert sich um 10 Runden_.
actors.hero.talent.soko.comment=„Hayaze war eine wichtige Innovation der ostasiatischen Länder für die Kanonenladetechnik. Durch das Vorverpacken der erforderlichen Schießpulvermenge und Kugeln für einen einzelnen Schuss in Bambus- oder Papierbehältern, die direkt in den Lauf gegossen wurden, stieg die Feuerrate der Kanoniere von 1~2 auf 4~5 Schuss pro Minute.“
actors.hero.talent.kono_fukusa.title=Kono Fukusa
actors.hero.talent.kono_fukusa.desc=_+1：_Wenn der Gewehr-Ninja Feinde hinterhältig angreift oder bei Verfolgungsangriffen, erhöht sich der Schaden um _20%_.\n\n_+2：_Wenn der Gewehr-Ninja Feinde hinterhältig angreift oder bei Verfolgungsangriffen, erhöht sich der Schaden um _40%_.\n\n_+3：_Wenn der Gewehr-Ninja Feinde hinterhältig angreift oder bei Verfolgungsangriffen, erhöht sich der Schaden um _60%_.
actors.hero.talent.kono_fukusa.comment=Kono Fukusa ist eine von östlichen Taktikern entwickelte Taktik, die darauf basiert, den Feind tief ins eigene Gebiet zu locken, um ihn dann mit einem Hinterhalt zu vernichten. Sie wurde erfolgreich eingesetzt, als die nördlichen Grenzstaaten gemeinsam das Eindringen der Gnolle zurückschlugen.
actors.hero.talent.kunikuchi.title=Kunikuchi-Kanone
actors.hero.talent.kunikuchi.desc=_+1：_Der Gewehr-Ninja kann das Gewehr mit Bomben laden, sodass die nächsten _1 Schuss_ einen Bombeneffekt haben.\n\n_+2：_Der Gewehr-Ninja kann das Gewehr mit Bomben laden, sodass die nächsten _3 Schüsse_ einen Bombeneffekt haben.\n\n_+3：_Der Gewehr-Ninja kann das Gewehr mit Bomben laden, sodass die nächsten _5 Schüsse_ einen Bombeneffekt haben.
actors.hero.talent.kunikuchi.comment=Die Kunikuchi-Kanone ist eine großkalibrige Kanone, deren gewaltiges Donnergrollen den Feind weit mehr erschüttert als ihre tatsächliche Durchschlagskraft (obwohl die auch nicht zu verachten ist).

actors.hero.herosubclass.ninja_master=Ninja-Meister
actors.hero.herosubclass.ninja_master_short_desc=Der _Ninja-Meister_ erhält im Laufe der Zeit Ninja-Energie, die er verbrauchen kann, um je nach Gelände verschiedene Ninja-Techniken einzusetzen.
actors.hero.herosubclass.ninja_master_desc=Der Ninja-Meister verbraucht Ninja-Energie, um je nach Gelände verschiedene Ninja-Techniken einzusetzen. Ninja-Energie regeneriert sich normalerweise alle 40 Runden um 1 Punkt.\n\nNormales Gelände:\nFluchttechnik - Schattenflucht: Teleportiert und macht unsichtbar\nNahkampftechnik - Schwalbenkehre: Schnelle Hiebe, die Gegner verwirren\nWurftechnik - Schattenstoß: Nächster Wurf auf entsprechendem Gelände verstümmelt und bringt Gegner zum Bluten\n\nWassergelände:\nFluchttechnik - Wasserflucht: Verdoppelt für einige Zeit die Bewegungsgeschwindigkeit im Wasser\nNahkampftechnik - Fließwasserschnitt: Hiebe aus größerer Entfernung, die Kälte zufügen\nWurftechnik - Wasserwurf: Nächster Wurf transferiert umgebendes Wasser zum Zielort\n\nGras- oder Aschegelände:\nFluchttechnik - Pflanzenwiederbelebung: Erzeugt Fäulnisbeer-Tentakel zur Unterstützung\nNahkampftechnik - Rankenfessel: Kräftiger Hieb, der die Bewegungsfreiheit einschränkt\nWurftechnik - Hundert Blüten: Nächster Wurf löst einen zufälligen schädlichen Pflanzeneffekt aus\n\nDiese Spezialisierung hat eine Spezialfähigkeit, wenn Ninja-Energie regeneriert wird. Bei mehreren Spezialfähigkeiten kann durch langes Drücken des Kurzbefehls gewechselt werden.
actors.hero.talent.soul_hunting.title=Seelenjagd
actors.hero.talent.soul_hunting.desc=_+1：_Wenn ein Gegner stirbt, erhält der Ninjameister _0.5 Punkte Ninja-Energie_.\n\n_+2：_Erhält _1 Punkt Ninja-Energie_.\n\n_+3：_Erhält _1.5 Punkte Ninja-Energie_.
actors.hero.talent.soul_hunting.comment=
actors.hero.talent.use_environment.title=Umgebungsnutzung
actors.hero.talent.use_environment.desc=_+1：_Der Ninja-Meister absorbiert bei Verwendung einer Fluchttechnik _Feuer in einem 3x3-Bereich_ und erhält _3 Runden Feuermacht_.\n\n_+2：_Zusätzlich zu +1: Der Ninja-Meister absorbiert bei Verwendung einer Fluchttechnik _Nicht-Feuer-, Nicht-Elektro-Gase_ in einem 3x3-Bereich (wie Blenden, Lähmung, Gift) und setzt diese Gase _beim nächsten Wurftechnik-Einsatz am Zielort frei_.\n\n_+3：_Zusätzlich zu +1 und +2: Der Ninja-Meister absorbiert bei Verwendung einer Fluchttechnik _elektrische Felder in einem 3x3-Bereich_ und wandelt die absorbierte Menge in _bestimmte Runden Stab- und Artefaktaufladung_ um.
actors.hero.talent.use_environment.comment=
actors.hero.talent.mind_water.title=Geistesstille
actors.hero.talent.mind_water.desc=_+1：_Der Ninjameister verbraucht 1 Punkt weniger Ninja-Energie für _Nahkampfkunst_.\n\n_+2：_Der Ninjameister verbraucht 1 Punkt weniger Ninja-Energie für _Nahkampfkunst und Wurfkunst_.\n\n_+3：_Der Ninjameister verbraucht 1 Punkt weniger Ninja-Energie für _Fluchtkunst, Nahkampfkunst und Wurfkunst_.
actors.hero.talent.mind_water.comment=
actors.buffs.ninja_energy.name=Ninja-Energie
actors.buffs.ninja_energy.desc=Der Ninja-Meister erhält im Laufe der Zeit Ninja-Energie, die er verbrauchen kann, um je nach Gelände verschiedene Ninja-Techniken einzusetzen.\n\nNinja-Energie wird normalerweise alle 40 Runden um 1 Punkt regeneriert.\n\nAktuelle Energie: %d/10
actors.buffs.ninja_energy.action=Ninja-Technik
actors.buffs.ninja_energy$watersmooth.name=Wasserflink
actors.buffs.ninja_energy$watersmooth.desc=Der Ninja-Meister hat Wasserflucht eingesetzt. Während dieses Effekts ist seine Bewegungsgeschwindigkeit im Wasser verdoppelt.\n\nVerbleibende Runden: %s
actors.buffs.ninja_energy$gas_storage.name=Gasspeicher
actors.buffs.ninja_energy$gas_storage.desc=Der Ninja-Meister speichert umgebende Gase im Körper und kann sie bei der nächsten Wurftechnik am Zielort freisetzen.
actors.buffs.ninja_energy$throw_skill.name=Wurftechnik
actors.buffs.ninja_energy$throw_skill.desc=Der Ninja-Meister sammelt Ninja-Energie in der Hand, die mit der Wurfwaffe geworfen wird und zusätzliche Effekte erzeugt.\n\nAuf normalem Gelände: Wurf verursacht Blutung und Lähmung basierend auf dem Wurfschaden.\n\nAuf Wassergelände: Der Wurf transferiert Wasser um den Ninja-Meister zum Zielort.\n\nAuf Gras- oder Aschegelände: Der Wurf löst einen zufälligen schädlichen Pflanzeneffekt aus.
actors.buffs.ninja_energy$ninjaability$transported.name_normal=Fluchttechnik - Schattenflucht
actors.buffs.ninja_energy$ninjaability$transported.desc_normal=Verbraucht 1 Runde, um bis zu 2 Felder weit zu teleportieren, und erhält 5 Runden Unsichtbarkeit.
actors.buffs.ninja_energy$ninjaability$transported.more_distance=Zu weit entfernt, um zu teleportieren.
actors.buffs.ninja_energy$ninjaability$transported.name_water=Fluchttechnik - Wasserflucht
actors.buffs.ninja_energy$ninjaability$transported.desc_water=Erhält den Effekt Wasserflink: Bewegungsgeschwindigkeit im Wasser verdoppelt für 8 Runden.
actors.buffs.ninja_energy$ninjaability$transported.name_grass=Fluchttechnik - Pflanzenwiederbelebung
actors.buffs.ninja_energy$ninjaability$transported.desc_grass=Erzeugt 1-3 versunkene Fäulnisbeer-Tentakel in der Umgebung.
actors.buffs.ninja_energy$ninjaability$transported.less=Nicht genug Platz, um Tentakel zu erzeugen.
actors.buffs.ninja_energy$ninjaability$taijutsu.name_normal=Nahkampftechnik - Schwalbenkehre
actors.buffs.ninja_energy$ninjaability$taijutsu.desc_normal=Führt 2 Hiebe mit je 80% Schaden aus und betäubt den Gegner für 5 Runden.
actors.buffs.ninja_energy$ninjaability$taijutsu.name_water=Nahkampftechnik - Fließwasserschnitt
actors.buffs.ninja_energy$ninjaability$taijutsu.desc_water=Der Hieb hat 1 Feld zusätzliche Reichweite und fügt 5 Runden Kälteverletzung zu.
actors.buffs.ninja_energy$ninjaability$taijutsu.name_grass=Nahkampftechnik - Rankenfessel
actors.buffs.ninja_energy$ninjaability$taijutsu.desc_grass=Führt einen Hieb mit 125% Schaden aus und fesselt den Gegner für 5 Runden.
actors.buffs.ninja_energy$ninjaability$throw.name_normal=Wurftechnik - Schattenstoß
actors.buffs.ninja_energy$ninjaability$throw.desc_normal=Erhält Wurftechnik-Effekt: Nächster Wurf auf normalem Gelände verursacht Blutung und Lähmung basierend auf dem Wurfwaffenschaden.
actors.buffs.ninja_energy$ninjaability$throw.name_water=Wurftechnik - Wasserwurf
actors.buffs.ninja_energy$ninjaability$throw.desc_water=Erhält Wurftechnik-Effekt: Nächster Wurf auf Wassergelände transferiert Wasser um den Ninja-Meister zum Zielort.
actors.buffs.ninja_energy$ninjaability$throw.name_grass=Wurftechnik - Hundert Blüten
actors.buffs.ninja_energy$ninjaability$throw.desc_grass=Erhält Wurftechnik-Effekt: Nächster Wurf auf Gras- oder Aschegelände löst einen zufälligen schädlichen Pflanzeneffekt aus.
actors.buffs.ninja_energy$ninjaability$throw.hive_throw=Du bist im Wurftechnik-Zustand.

actors.hero.abilities.ninja.decoy.name=Schattenkämpfer
actors.hero.abilities.ninja.decoy.short_desc=Der Ninja beschwört einen _Schattenkämpfer_, der im Kampf unterstützt und tödliche Angriffe abfangen kann.
actors.hero.abilities.ninja.decoy.desc=Der Ninja beschwört einen Schattenkämpfer. Solange dieser existiert, kann die Fähigkeit genutzt werden, um ihn zu steuern. Der Schattenkämpfer hat anfangs nur 40 Lebenspunkte und 10-15 Angriffskraft.\n\nDer Schattenkämpfer unterstützt den Ninja im Kampf. Erleidet der Ninja einen tödlichen Angriff, nimmt der Schattenkämpfer stattdessen massiven Schaden und stirbt.
actors.hero.abilities.ninja.decoy.less=Nicht genug Platz, um einen Schattenkämpfer zu beschwören.
actors.hero.abilities.ninja.decoy$decoyman.name=Schattenkämpfer
actors.hero.abilities.ninja.decoy$decoyman.direct_defend=Zu Befehl.
actors.hero.abilities.ninja.decoy$decoyman.direct_follow=Bis in den Tod!
actors.hero.abilities.ninja.decoy$decoyman.direct_attack=Zum Angriff!
actors.hero.abilities.ninja.decoy$decoyman.directed_wander=Auf Feindsuche!
actors.hero.abilities.ninja.decoy$decoyman.desc=Ein aus Schatten geformter Schattenkämpfer, dessen jede Bewegung der deinen gleicht. Feinde können kaum zwischen dir und ihm unterscheiden.\n\nEr wirkt zerbrechlich. Erleidest du einen tödlichen Treffer, kann er diesen für dich abfangen, erleidet dabei jedoch massiven Schaden und kann sogar sterben.
actors.hero.abilities.ninja.decoy$decoyman.die1=Die Kirschblüten der Heimat sind wieder erblüht, schade, dass ich nicht zurückkehren kann...
actors.hero.abilities.ninja.decoy$decoyman.die2=Pff... dieser Rauch... wirklich widerlich...
actors.hero.abilities.ninja.decoy$decoyman.die3=Das Leben selbst ist der Beweis des Kampfes...
actors.hero.abilities.ninja.decoy$decoyman.die4=Sayonara! (Explodiert in alle Richtungen)
actors.hero.abilities.ninja.decoy$decoyman.discover_hint=Du kannst diese Einheit durch eine Helden-Rüstungsfähigkeit entdecken.
actors.hero.abilities.ninja.decoy$shadowmark.name=Schattenmal
actors.hero.abilities.ninja.decoy$shadowmark.desc=Der Schattenkämpfer hat ein Schattenmal auf diesen Gegner geprägt.\n\nGegner mit diesem Mal erleiden mehr Schaden durch Ninja und Schattenkämpfer.\n\nVerbleibende Runden: %s
actors.hero.talent.deversion.title=Nebelspalter
actors.hero.talent.deversion.desc=_+1:_ Die maximalen Lebenspunkte des Schattenspielers werden auf _50_ erhöht, der Angriff auf _20~25_.\n\n_+2:_ Zusätzlich zu +1 kann eine Beschwörung _2_ Schattenspieler erzeugen.\n\n_+3:_ Die maximalen Lebenspunkte des Schattenspielers werden auf _60_ erhöht, der Angriff auf _30~35_.\n\n_+4:_ Zusätzlich zu +3 kann eine Beschwörung _3_ Schattenspieler erzeugen.
actors.hero.talent.deversion.comment=
actors.hero.talent.shinkage.title=Schattenrüstung
actors.hero.talent.shinkage.desc=_+1：_Die Rüstung des Schattenkriegers erhöht sich auf _1~5 Punkte_.\n\n_+2：_Zusätzlich zu +1 erhält der Ninja bei Angriffen auf den Schattenkrieger _1 Runde Hormonschub_.\n\n_+3：_Die Rüstung erhöht sich auf _2~10 Punkte_.\n\n_+4：_Zusätzlich zu +3 erhält der Ninja _1.5 Runden Hormonschub_.
actors.hero.talent.shinkage.comment=
actors.hero.talent.allhunting.title=Schwarmjagd
actors.hero.talent.allhunting.desc=_+1:_ Der Schattenspieler verleiht Feinden bei Angriffen ein _2 Runden Schattenmal_. Feinde mit dem Mal erleiden von Ninja und Schattenspieler _15% mehr Schaden_.\n\n_+2:_ Der Schattenspieler verleiht Feinden bei Angriffen ein _4 Runden Schattenmal_. Feinde mit dem Mal erleiden _30% mehr Schaden_.\n\n_+3:_ Der Schattenspieler verleiht Feinden bei Angriffen ein _6 Runden Schattenmal_. Feinde mit dem Mal erleiden _45% mehr Schaden_.\n\n_+4:_ Der Schattenspieler verleiht Feinden bei Angriffen ein _8 Runden Schattenmal_. Feinde mit dem Mal erleiden _60% mehr Schaden_.
actors.hero.talent.allhunting.comment=


actors.hero.abilities.ninja.onesword.name=Ein-Schwert
actors.hero.abilities.ninja.onesword.short_desc=Der Ninja entfesselt das Kampfgeheimnis des Schwertmeisters: _Ein-Schwert_, das für kurze Zeit Bewegungsgeschwindigkeit, Angriffsgeschwindigkeit und Nahkampfschaden erhöht.
actors.hero.abilities.ninja.onesword.desc=Der Ninja entfesselt das Kampfgeheimnis des Schwertmeisters: Ein-Schwert! Dieses Geheimnis hält 10 Runden.\n\nNach Entfesselung von Ein-Schwert hat der Ninja die doppelte Bewegungsgeschwindigkeit, +50% Angriffsgeschwindigkeit und 30% mehr Nahkampfschaden. Ist die Waffe ein Wakizashi oder Katana, erhöht sich der Nahkampfschaden um weitere 20%.
actors.hero.abilities.ninja.onesword$oku_onesword.name=Geheimnis: Ein-Schwert
actors.hero.abilities.ninja.onesword$oku_onesword.desc=Die höchste Schwertkunst des Shintō-Ryū, nun vom Ninja in seine Nahkampftechnik integriert. Erhöht Bewegungsgeschwindigkeit, Angriffsgeschwindigkeit und Nahkampfschaden.\n\nVerbleibende Runden: %s
actors.hero.talent.offensive.title=Offensive
actors.hero.talent.offensive.desc=_+1：_Die Boni von Geheimnis: Erste Klinge auf Angriffsgeschwindigkeit und Nahkampfschaden steigen von 50% und 30% auf _62.5%_ und _45%_.\n\n_+2：_Die Boni steigen von 50% und 30% auf _75%_ und _60%_.\n\n_+3：_Die Boni steigen von 50% und 30% auf _87.5%_ und _75%_.\n\n_+4：_Die Boni steigen von 50% und 30% auf _100%_ und _90%_.
actors.hero.talent.offensive.comment=„Wage nicht, den Tiger bloß mit den Händen zu jagen, noch den Fluss ohne Boot zu überqueren.“
actors.hero.talent.glimpse.title=Ein Blick
actors.hero.talent.glimpse.desc=_+1：_Die Bewegungsgeschwindigkeit von Klinge der Einzigartigkeit steigt von 100% auf _137,5%_.\n\n_+2：_Die Bewegungsgeschwindigkeit von Klinge der Einzigartigkeit steigt von 100% auf _175%_.\n\n_+3：_Die Bewegungsgeschwindigkeit von Klinge der Einzigartigkeit steigt von 100% auf _212,5%_.\n\n_+4：_Die Bewegungsgeschwindigkeit von Klinge der Einzigartigkeit steigt von 100% auf _250%_.
actors.hero.talent.glimpse.comment=Man kennt nur das eine, nicht das andere.
actors.hero.talent.kill_continue.title=Tötungsserie
actors.hero.talent.kill_continue.desc=_+1：_Beim Töten eines Feindes mit einer Nahkampfwaffe wird _Klinge der Einzigartigkeit_ um _1 Runde_ verlängert.\n\n_+2：_Beim Töten eines Feindes mit einer Nahkampfwaffe wird _Klinge der Einzigartigkeit_ um _2 Runden_ verlängert.\n\n_+3：_Beim Töten eines Feindes mit einer Nahkampfwaffe wird _Klinge der Einzigartigkeit_ um _3 Runden_ verlängert.\n\n_+4：_Beim Töten eines Feindes mit einer Nahkampfwaffe wird _Klinge der Einzigartigkeit_ um _4 Runden_ verlängert.
actors.hero.talent.kill_continue.comment=Zitternd und ängstlich, wie am Rande eines Abgrunds, wie auf dünnem Eis.

actors.hero.abilities.ninja.spiderjar.name=Hirukuba-Kessel
actors.hero.abilities.ninja.spiderjar.short_desc=Der Ninja füllt den _Hirukuba-Kessel_ mit Schießpulver, zündet die Lunte und wirft ihn. Nach Ablauf der Lunte verursacht er eine gewaltige Explosion.
actors.hero.abilities.ninja.spiderjar.desc=Der Hirukuba-Kessel verströmt vor der Explosion einen Duft, der selbst Maschinen berauscht und Gegner anlockt. Normalerweise lenkt dies die Aufmerksamkeit der Gegner mit 50% Wahrscheinlichkeit pro Runde auf den Ninja oder seine Verbündeten.\n\nDie Explosion des Kessels fügt Einheiten im 3x3-Bereich 20-40 Schaden zu.
actors.hero.abilities.ninja.spiderjar$spider.name=Hirukuba-Kessel
actors.hero.abilities.ninja.spiderjar$spider.desc=Ein wertvolles, mit Schießpulver gefülltes Teegefäß, das einst einem hohen Tier gehörte. Nun hat der Ninja es mit Sprengstoff gefüllt und die Lunte entzündet.\n\nDas Gefäß verströmt einen betörenden Duft, der Gegner anzieht.
actors.hero.abilities.ninja.spiderjar$spider.ondeath=Wie Matsunaga Hisahide entzündest du das Schießpulver und bescherst allen ein prächtiges Feuerwerk...
actors.hero.abilities.ninja.spiderjar$smallspider.name=Kleiner Spinnenkessel
actors.hero.abilities.ninja.spiderjar$smallspider.desc=Nach der Explosion des Hirukuba-Kessels ist ein kleiner Kessel übrig geblieben, der nicht vollständig detoniert ist.\n\nDieses Teegefäß verströmt einen betörenden Duft und ist mit einer prächtigen Cyber-LED-Beleuchtung ausgestattet, die Gegner anzieht.
actors.hero.talent.power_gunpowder.title=Starkes Schießpulver
actors.hero.talent.power_gunpowder.desc=_+1：_Der Explosionsschaden der Hira-shurikane-Kessel erhöht sich auf _25~55 Punkte_.\n\n_+2：_Zusätzlich zu +1 erhöht sich der Explosionsradius auf _5x5_.\n\n_+3：_Der Explosionsschaden erhöht sich auf _30~70 Punkte_.\n\n_+4：_Zusätzlich zu +3 erhöht sich der Explosionsradius auf _7x7_.
actors.hero.talent.power_gunpowder.comment=
actors.hero.talent.tea_stains.title=Charakteristische Teeflecken
actors.hero.talent.tea_stains.desc=_+1：_Die Explosion des Flachen Spinnenkessels verursacht _5 Runden Brennen_.\n\n_+2：_Die Explosion des Flachen Spinnenkessels verursacht _5 Runden Brennen oder Frostbrand_.\n\n_+3：_Die Explosion des Flachen Spinnenkessels verursacht _5 Runden Brennen oder Frostbrand_ sowie _3 Runden Lähmung_.\n\n_+4：_Die Explosion des Flachen Spinnenkessels verursacht _8 Runden Brennen oder Frostbrand_ sowie _3 Runden Lähmung_.
actors.hero.talent.tea_stains.comment=
actors.hero.talent.firework.title=Feuerwerk
actors.hero.talent.firework.desc=_+1：_Nach der Explosion der Plattspinnenkessel hinterlässt diese einen kleinen Kessel, der wache Feinde _10 Runden_ anlockt und dann in einer 3x3-Explosion ohne Schaden detoniert.\n\n_+2：_Nach der Explosion der Plattspinnenkessel hinterlässt diese einen kleinen Kessel, der wache Feinde _10 Runden_ anlockt und dann in einer 3x3-Explosion mit _10~20 Schaden_ detoniert.\n\n_+3：_Nach der Explosion der Plattspinnenkessel hinterlässt diese einen kleinen Kessel, der wache Feinde _15 Runden_ anlockt und dann in einer 3x3-Explosion mit _10~20 Schaden_ detoniert.\n\n_+4：_Nach der Explosion der Plattspinnenkessel hinterlässt diese einen kleinen Kessel, der wache Feinde _15 Runden_ anlockt und dann in einer 3x3-Explosion mit _15~30 Schaden_ detoniert.
actors.hero.talent.firework.comment=

actors.hero.heroclass.dm400=DM-400
actors.hero.heroclass.dm400_desc_short=DM-400 kann mit dem _Befehlsatz-Werkzeug_ Drohnen zur Unterstützung produzieren. Seine physischen Angriffe _verstärken_ die Wirkung von Kampfdrohnen auf Gegner. Es hat zudem die Eigenschaft _unbelebt_.
actors.hero.heroclass.dm400_desc=DM-400 beginnt mit einem _einzigartigen Befehlsatz-Werkzeug_, um Drohnen zur Unterstützung zu produzieren.\n\nDM-400 hat die Eigenschaft _unbelebt_, anfangs niedrige Lebenspunkte und trägt keine Waffe, aber unbewaffnete Angriffe verursachen _1-8 Schaden_. Physische Angriffe von DM-400 verleihen dem getroffenen Gegner eine 3 Runden nicht stapelbare _Befehlsmarkierung_, die die Wirkung einiger Kampfdrohnen auf Gegner verstärkt.\n\nAußerdem beginnt DM-400 mit _zwei alten Zahnrädern_, Stoffrüstung, einem Wasserschlauch und einem Beutel.\n\nZu Beginn identifizierte Gegenstände:\n_-_ Eistrank\n_-_ Wandlungs-, Identifikations- und Aufladungs-Schriftrolle
actors.hero.heroclass.dm400_unlock=_Besiege DM-300 in einem Spiel_, um DM-400 freizuschalten.

actors.hero.talent.mark_meal.title=Markierte Mahlzeit
actors.hero.talent.mark_meal.desc=_+1：_Essen verlängert die Dauer von Befehlsmarkierungen auf den nächsten 3 physischen Angriffen von DM-400 auf _5 Runden_.\n\n_+2：_Essen verlängert die Dauer von Befehlsmarkierungen auf den nächsten 3 physischen Angriffen von DM-400 auf _6 Runden_.
actors.hero.talent.mark_meal.comment=64 65 6C 69 63 6F 75 73.
actors.hero.talent.mark_meal.meta_desc=_Wenn diese Fertigkeit von einem anderen Helden erhalten wird_, verursacht sie stattdessen 2/3 Runden Betäubung.

actors.hero.talent.over_code.title=Supercomputer-Code
actors.hero.talent.over_code.desc=_+1：_Wenn DM-400 eine Aufwertungs- oder Transformationsschriftrolle liest, wird zufällig _1 Schriftrollen-Art_ identifiziert.\n\n_+2：_Wenn DM-400 eine Aufwertungs- oder Transformationsschriftrolle liest, wird zufällig _1 Schriftrollen- oder 1 Trank-Art_ identifiziert.
actors.hero.talent.over_code.comment=Dieses Talent wirkt auch beim Lesen von Gegenständen, die aus Aufwertungs- oder Transformationsschriftrollen hergestellt wurden.\n\n„Decoding Files...“

actors.hero.talent$markmeal.name=Markierungsschlag
actors.hero.talent$markmeal.desc=Die nächsten physischen Angriffe von DM-400 verlängern die Dauer des Befehlsmarkierungs-Effekts.\n\nWenn andere Helden diesen Effekt erhalten, versetzen die nächsten physischen Angriffe das Ziel für eine bestimmte Anzahl von Runden in Betäubung.\n\nVerbleibende Anwendungen: %1$d

actors.hero.talent.tbm.title=Regelmäßige Wartung
actors.hero.talent.tbm.desc=_+1：_Die DM-400 erhält alle 60 Runden _3 Schildpunkte_.\n\n_+2：_Die DM-400 erhält alle 60 Runden _5 Schildpunkte_.
actors.hero.talent.tbm.comment=„Repairing Files...“

actors.hero.talent.target_targeting.title=Zielgerichtete Markierung
actors.hero.talent.target_targeting.desc=_+1：_Bei Angriffen auf Feinde mit _Befehlsmarkierung_ verursacht die DM-400 _1 zusätzlichen Schaden_.\n\n_+2：_Bei Angriffen auf Feinde mit _Befehlsmarkierung_ verursacht die DM-400 _2 zusätzlichen Schaden_.
actors.hero.talent.target_targeting.comment=„Target Locked.“
actors.hero.talent.target_targeting.meta_desc=_Falls diese Fertigkeit von einem anderen Helden erlangt wird_, wirkt sie stattdessen auf betäubte Feinde.

actors.hero.talent.over_meal.title=Essens-Überlast
actors.hero.talent.over_meal.desc=_+1：_DM-400 Essen _verbraucht nur 0.5 Runden_.\n\n_+2：_DM-400 Essen _verbraucht keine Runde_.
actors.hero.talent.over_meal.comment=„63 72 75 6E 63 68 79.“

actors.hero.talent.recover_charge.title=Aufladungsrückgewinnung
actors.hero.talent.recover_charge.desc=_+1：_Wenn DM-400 eine Schriftrolle in die Werkzeugkiste einliest, stellt dies _1 Aufladung_ der Werkzeugkiste wieder her.\n\n_+2：_Stellt _2 Aufladungen_ wieder her.
actors.hero.talent.recover_charge.comment=„Recycle.“
actors.hero.talent.recover_charge.meta_desc=_Wenn dieses Talent von einem anderen Helden erlangt wird_, erhält der Held auf +1 nach dem Lesen einer Schriftrolle oder des Buches des Chaos 2 Runden Artefaktaufladung, auf +2 4 Runden. Die Nutzung von Aufwertungs-, Transformations- oder daraus hergestellten alchemistischen Gegenständen verstärkt diesen Effekt nicht. Bei ertragreicheren alchemistischen Gegenständen (wie den meisten Kristallen) basiert die Auslösung auf der Wahrscheinlichkeit der Einzelproduktionsmenge.

actors.hero.talent.body_reinforce.title=Rumpfverstärkung
actors.hero.talent.body_reinforce.desc=_+1:_ Von DM-400 produzierte Drohnen erben _50% seiner Rüstung_.\n\n_+2:_ Von DM-400 produzierte Drohnen erben _75% seiner Rüstung_.
actors.hero.talent.body_reinforce.comment=„Eisenpanzer 400 und seine Eisenpanzer-Armee."
actors.hero.talent.body_reinforce.meta_desc=_Falls dieses Talent von anderen Helden erhalten wird_, erhält der Held bei +1 5% Schadensreduzierung bei mindestens 20 erlittenem Schaden, bei +2 10% Schadensreduzierung bei mindestens 10 Schaden.

actors.hero.talent.efficient_order.title=Effizienter Befehl
actors.hero.talent.efficient_order.desc=_+1：_Alle Verbündeten von DM-400 erhalten _30% mehr Bewegungsgeschwindigkeit_.\n\n_+2：_Alle Verbündeten von DM-400 erhalten _45% mehr Bewegungsgeschwindigkeit_.
actors.hero.talent.efficient_order.comment=Go Work.

actors.hero.talent.rocket_fist.title=Raketenfaust
actors.hero.talent.rocket_fist.desc=_+1：_DM-400s unbewaffnete Angriffe haben eine _60%ige Chance, das Ziel um 1 Feld zurückzustoßen_.\n\n_+2：_Eine _60%ige Chance, das Ziel um 2 Felder zurückzustoßen_.
actors.hero.talent.rocket_fist.comment=Bei Angriffen mit Nahkampfwaffen beträgt die Rückstoßwahrscheinlichkeit _nur 30%_.\n\n„Raketenfaust——！！“

actors.hero.talent.big_fist.title=Schwere Faust
actors.hero.talent.big_fist.desc=_+1:_ DM-400s unbewaffnete Angriffe ignorieren die Rüstung des Feindes und verursachen _3~20 Schaden_.\n\n_+2:_ Unbewaffnete Angriffe ignorieren Rüstung, Schaden _4~25_.\n\n_+3:_ Unbewaffnete Angriffe ignorieren Rüstung, Schaden _5~30_.
actors.hero.talent.big_fist.comment=Das Ausrüsten des Rings der Stärke überschreibt den unbewaffneten Schaden von DM-400 anstatt ihn zu addieren, behält aber den Effekt der Rüstungsignorierung.

actors.hero.talent.quick_tool.title=Schnellwerkzeug
actors.hero.talent.quick_tool.desc=_+1：_DM-400 kann die Werkzeugkiste auch ohne Ausrüstung nutzen, aber die Aufladerate sinkt auf _25%_.\n\n_+2：_Die Aufladerate sinkt auf _50%_.\n\n_+3：_Die Aufladerate sinkt auf _75%_.
actors.hero.talent.quick_tool.comment=
actors.hero.talent.quick_tool.meta_desc=_Wenn dieses Talent von einem anderen Helden erlangt wird_, erhalten auf +1/+2/+3 alle Verbündeten 10/20/30% zusätzliche Schadensreduktion.

actors.hero.herosubclass.at400=AT-400
actors.hero.herosubclass.at400_short_desc=_AT-400_ erlaubt den Einsatz weiterer Kampfdrohnentypen. Eine großer Drohnenschwarm bekämpft feindliche Ziele effektiver.
actors.hero.herosubclass.at400_desc=AT-400 verursacht 30% mehr physischen Schaden gegen markierte Gegner und kann nun mehr Schriftrollen einlesen, um weitere Kampfdrohnentypen zu produzieren, die alle bessere Kampfeigenschaften haben.\n\nBlitzdrohne (Bannung): Blendet Gegner und stört ihre Sicht\nLaserdrohne (Aufladung): Verschießt starke Laserstrahlen, die Gegner versengen\nBetäubungsdrohne (Hypnose): Angriffe können betäuben oder zurückstoßen\nStördrohne (Zorn): Stört Gegner und macht sie rasend\nSchockdrohne (Angst): Schreckt Gegner durch Feuerkraft\nChaosdrohne (Wandlung): Verwandelt sich nach einiger Zeit in eine beliebige Hilfsdrohne oder etwas Seltsames\n\nIst der _Zufallsmodus_ aktiviert, erhält man beim Wählen dieser Spezialisierung ein Befehlsatz-Werkzeug, falls man keines besitzt.

actors.hero.talent.sustain_mark.title=Anhaltende Markierung
actors.hero.talent.sustain_mark.desc=_+1：_Die physischen Angriffe der AT-400 fügen _2 Runden Befehlsmarkierung_ zu.\n\n_+2：_Die physischen Angriffe der AT-400 fügen _4 Runden Befehlsmarkierung_ zu.\n\n_+3：_Die physischen Angriffe der AT-400 fügen _6 Runden Befehlsmarkierung_ zu.
actors.hero.talent.sustain_mark.comment=Diese Fertigkeit wirkt auf Schwarm- und Schockdrohnen.

actors.hero.talent.battle_upgrade.title=Kampfupgrade
actors.hero.talent.battle_upgrade.desc=_+1:_ Der Schaden aller von AT-400 produzierten Kampfdrohnen ist um _15%_ erhöht, zusätzlich basierend auf der Rüstung des Feindes, bis zu einer effektiven Ignorierung von _26.7% der Feindesrüstung_.\n\n_+2:_ Der Schaden ist um _22.5%_ erhöht, zusätzlich bis zu _53.3% Rüstungsignorierung_.\n\n_+3:_ Der Schaden ist um _30%_ erhöht, zusätzlich bis zu _80% Rüstungsignorierung_.
actors.hero.talent.battle_upgrade.comment=Dieses Talent wirkt nicht auf Begleitdrohnen.

actors.hero.talent.fly_drone.title=Fliegende Mücke
actors.hero.talent.fly_drone.desc=_+1：_Alle von AT-400 produzierten Kampfdrohnen weichen den _ersten 2 Angriffen_ garantiert aus.\n\n_+2：_Alle von AT-400 produzierten Kampfdrohnen weichen den _ersten 3 Angriffen_ garantiert aus.\n\n_+3：_Alle von AT-400 produzierten Kampfdrohnen weichen den _ersten 4 Angriffen_ garantiert aus.
actors.hero.talent.fly_drone.comment=Diese Fertigkeit wirkt nicht auf Begleit-, Chaos- oder Unterstützungsdrohnen.

actors.hero.ally.attackdrone.name=Kampfdrohne
actors.hero.ally.attackdrone.desc=Spezialisiert auf Kampfeinsätze.
actors.hero.ally.attackdrone$flashdrone.name=Blitzdrohne
actors.hero.ally.attackdrone$flashdrone.desc=Eine Kampfdrohne, die nach dem Einlesen einer _Bann-Schriftrolle_ produziert wurde. Obwohl sie mit einem Lasergewehr ausgestattet ist, schießt sie tatsächlich Laserstrahlen aus ihren „Pupillen" auf Gegner. Das Lasergewehr dient nur als Feuersignal.\n\nHat 3 Felder Angriffsreichweite. Angriffe auf Gegner mit Befehlsmarkierung blenden den Gegner für 3 Runden und verursachen zusätzlich 5 magischen Schaden gegen Untote und Dämonen mit Befehlsmarkierung.
actors.hero.ally.attackdrone$laserdrone.name=Laserdrohne
actors.hero.ally.attackdrone$laserdrone.desc=Eine Kampfdrohne, die nach dem Einlesen einer _Aufladungs-Schriftrolle_ produziert wurde. Sie sieht aus wie eine schwebende große Laserkanone, und das ist sie auch. Ihr Laser eignet sich hervorragend zum „Grillen".\n\nFernkampfangriff mit magischem Schaden. Angriffe auf Gegner mit Befehlsmarkierung haben 50% Chance, den Gegner 3 Runden zu entzünden.
actors.hero.ally.attackdrone$anesthesiadrone.name=Betäubungsdrohne
actors.hero.ally.attackdrone$anesthesiadrone.desc=Eine Kampfdrohne, die nach dem Einlesen einer _Hypnose-Schriftrolle_ produziert wurde. Die beiden Roboterarme sind mit Elektroschock-Vorrichtungen ausgestattet, die das Ziel zwar nicht lähmen, aber benommen machen können. Niemand möchte wohl freiwillig ihren Stromschlag erleben.\n\nAngriffe auf Gegner mit Befehlsmarkierung haben 33% Chance, den Gegner 3 Runden zu betäuben und zusätzlich 50% Chance, ihn um 1 Feld zurückzustoßen.
actors.hero.ally.attackdrone$raiddrone.name=Stördrohne
actors.hero.ally.attackdrone$raiddrone.desc=Eine Kampfdrohne, die nach dem Einlesen einer _Zorn-Schriftrolle_ produziert wurde. Dieses kleine Modell ist schneller und perfekt zum Belästigen von Zielen. Selbst das geduldigste Ziel wird durch einen Schwarm solcher „Mücken" verrückt.\n\nHat doppelte Fluggeschwindigkeit und 3 Felder Angriffsreichweite. Angriffe auf Gegner ohne Befehlsmarkierung haben 33% Chance, eine nicht stapelbare Befehlsmarkierung für 3 Runden zu vergeben. Angriffe auf Gegner mit Befehlsmarkierung haben 17% Chance, sie 3 Runden zu verwirren.
actors.hero.ally.attackdrone$shockdrone.name=Schockdrohne
actors.hero.ally.attackdrone$shockdrone.desc=Eine Kampfdrohne, die nach dem Einlesen einer _Angst-Schriftrolle_ produziert wurde. Mit einem schweren Scharfschützengewehr ausgestattet, kann sie leicht Fleisch und Knochen durchdringen. Wenn solche Drohnen in Massen produziert werden können, ist Flucht die klügere Wahl.\n\nFernkampfangriff. Angriffe auf Gegner ohne Befehlsmarkierung haben 17% Chance, eine nicht stapelbare Befehlsmarkierung für 3 Runden zu vergeben. Angriffe auf Gegner mit Befehlsmarkierung haben 33% Chance, ihnen 6 Runden Angst einzujagen.

actors.hero.ally.auxiliarydrone.name=Hilfsdrohne
actors.hero.ally.auxiliarydrone.desc=Spezialisiert auf Unterstützungseinsätze.
actors.hero.ally.auxiliarydrone$scoutdrone.name=Späherdrohne
actors.hero.ally.auxiliarydrone$scoutdrone.desc=Eine Hilfsdrohne, die nach dem Einlesen einer _Identifikations-Schriftrolle_ produziert wurde. Sie ist hauptsächlich für Aufklärungsarbeit zuständig. Ihre „Pupillen" scannen ständig die Umgebung und aktive Ziele. Zudem ist sie die einzige Hilfsdrohne, die die volle Sicht mit dem Host teilt.\n\nHat anfangs einen kleinen Sichtbereich (wird durch Werkzeug-Upgrades erweitert), teilt aber die gesamte Sicht mit DM-400. Markiert zudem Schwachstellen aller Feinde im Sichtfeld, wodurch diese 33% mehr Schaden erleiden (nicht stapelbar).
actors.hero.ally.auxiliarydrone$weaknessmark.name=Schwachstellenmarkierung
actors.hero.ally.auxiliarydrone$weaknessmark.desc=Die Schwachstelle dieses Gegners wurde von der Späherdrohne markiert.\n\nGegner im Sichtfeld der Späherdrohne werden kontinuierlich markiert und erleiden 33%% mehr Schaden.\n\nVerbleibende Runden: %s
actors.hero.ally.auxiliarydrone$mirrordrone.name=Spiegeldrohne
actors.hero.ally.auxiliarydrone$mirrordrone.desc=Eine Hilfsdrohne, die nach dem Einlesen einer _Spiegel-Schriftrolle_ produziert wurde. Sie verwendet neuartige Abbildungstechnologie, um ein frei bewegliches Abbild des Benutzers zu projizieren. Natürlich basiert diese Technologie immer noch auf Magie.\n\nErzeugt in regelmäßigen Abständen ein Abbild von DM-400 in der Umgebung. Ein Upgrade-Werkzeug verkürzt die Erzeugungszeit.
actors.hero.ally.auxiliarydrone$protectdrone.name=Schutzdrohne
actors.hero.ally.auxiliarydrone$protectdrone.desc=Eine Hilfsdrohne, die nach dem Einlesen einer _Teleportations-Schriftrolle_ produziert wurde. Sie erzeugt ein unsichtbares Schutzfeld um den Host und teleportiert Angreifer nach ihrer Zerstörung an einen anderen Ort. Sie wird dir ein Gefühl der Sicherheit geben.\n\nSolange sie existiert, gewährt sie DM-400 zusätzlich 1-3 Rüstungspunkte. Wird sie von einem Gegner zerstört, wird dieser zufällig an einen anderen Ort teleportiert.
actors.hero.ally.auxiliarydrone$escortdrone.name=Begleitdrohne
actors.hero.ally.auxiliarydrone$escortdrone.desc=Eine Hilfsdrohne, die nach dem Einlesen einer _Erkundungs-Schriftrolle_ produziert wurde. Sie kann die Bewegungen des Hosts verschleiern und so für Sicherheit bei Erkundungen sorgen. Seltsamerweise fällt selbst die Drohne den Zielen kaum auf.\n\nErschwert es Feinden, DM-400s Bewegungen zu bemerken, und versetzt DM-400 in regelmäßigen Abständen für 4 Runden in Unsichtbarkeit.
actors.hero.ally.auxiliarydrone$bombdrone.name=Sprengdrohne
actors.hero.ally.auxiliarydrone$bombdrone.desc=Eine Hilfsdrohne, die nach dem Einlesen einer _Rache-Schriftrolle_ produziert wurde. Besitzt eine große Sprengkraft und nähert sich schnell dem Ziel für einen Selbstmordanschlag. Die Explosion schadet weder dem Host noch anderen Drohnen.\n\nHat doppelte Fluggeschwindigkeit. Befindet sich ein Gegner im 1-Feld-Umkreis, verliert sie kontinuierlich Lebenspunkte. Beim Tod oder bei Zerstörung explodiert sie und schadet nur Feinden.
actors.hero.ally.auxiliarydrone$chaosdrone.name=Chaosdrohne
actors.hero.ally.auxiliarydrone$chaosdrone.desc=Eine spezielle Drohne, die nach dem Einlesen einer _Wandlungs-Schriftrolle_ produziert wurde. Aus unbekannten Gründen flackern schwarz-weiße Blöcke unbekannter Herkunft um sie herum...\n\nHat keine Funktion. Nach einiger Zeit verwandelt sie sich je nach Spezialisierung von DM-400 in eine zufällige Hilfs- oder Kampfdrohne – oder in etwas völlig Unerwartetes... Ein Upgrade-Werkzeug verkürzt die Verwandlungszeit.

actors.hero.herosubclass.au400=AU-400
actors.hero.herosubclass.au400_short_desc=_AU-400_ erlaubt den Einsatz weiterer Hilfsdrohnentypen. Der geschickte Einsatz funktionsreicher Drohnen erhöht die Überlebensfähigkeit.
actors.hero.herosubclass.au400_desc=AU-400 erhält 20% Schadensreduktion bei physischen Angriffen markierter Gegner und kann nun mehr Schriftrollen einlesen, um weitere Hilfsdrohnentypen zu produzieren, die alle bessere Unterstützungseigenschaften haben.\n\nSpäherdrohne (Identifikation): Späht aus und deckt Schwachstellen auf\nSpiegeldrohne (Spiegelung): Erzeugt in regelmäßigen Abständen ein Abbild von dir\nSchutzdrohne (Teleportation): Verbessert deine Verteidigung und teleportiert gefährliche Gegner weg\nBegleitdrohne (Erkundung): Tarnt deine Bewegungen für sicherere Erkundung\nSprengdrohne (Rache): Schadet Gegnern durch Selbstzerstörung\nChaosdrohne (Wandlung): Verwandelt sich nach einiger Zeit in eine Kampfdrohne oder etwas Seltsames\n\nIst der _Zufallsmodus_ aktiviert, erhält man beim Wählen dieser Spezialisierung ein Befehlsatz-Werkzeug, falls man keines besitzt.

actors.hero.talent.special_mark.title=Spezialisierte Markierung
actors.hero.talent.special_mark.desc=_+1：_Wenn AU-400 Gegner mit dem _Befehlsmarkierung_-Effekt angreift, erhöht sich die Genauigkeit um _50%_ und es besteht eine _16.7%ige Chance_, dem Gegner _3 Runden Ziel der Allgemeinheit_ zu geben.\n\n_+2：_Genauigkeit um _75%_ erhöht, _33.3%ige Chance_.\n\n_+3：_Genauigkeit um _100%_ erhöht, _50%ige Chance_.
actors.hero.talent.special_mark.comment=

actors.hero.talent.assist_upgrade.title=Unterstützungsupgrade
actors.hero.talent.assist_upgrade.desc=_+1:_ Jede von AU-400 produzierte Unterstützungsdrohne gewährt alle _50 Runden_ _4 Punkte Schild_.\n\n_+2:_ Jede Unterstützungsdrohne gewährt alle _40 Runden_ _4 Punkte Schild_.\n\n_+3:_ Jede Unterstützungsdrohne gewährt alle _30 Runden_ _4 Punkte Schild_.
actors.hero.talent.assist_upgrade.comment=Durch dieses Talent aufgebauter Schild überschreitet nicht die Hälfte der maximalen Lebenspunkte.\n\nDieses Talent wirkt nicht auf Begleitdrohnen, Chaosdrohnen und Kampfdrohnen.

actors.hero.talent.fast_cruise.title=Schnelle Fahrt
actors.hero.talent.fast_cruise.desc=_+1：_Jede von AU-400 produzierte Unterstützungsdrohne gibt alle _80 Runden_ _2 Runden Hochgeschwindigkeit_.\n\n_+2：_Jede von AU-400 produzierte Unterstützungsdrohne gibt alle _70 Runden_ _2 Runden Hochgeschwindigkeit_.\n\n_+3：_Jede von AU-400 produzierte Unterstützungsdrohne gibt alle _60 Runden_ _2 Runden Hochgeschwindigkeit_.
actors.hero.talent.fast_cruise.comment=Diese Fertigkeit wirkt nicht auf Begleit-, Chaos- oder Kampfdrohnen.

actors.hero.abilities.dm400.routine.name=Routinewartung
actors.hero.abilities.dm400.routine.short_desc=DM-400 führt eine _Routinewartung_ durch, um seine Leistung kurzzeitig zu steigern.
actors.hero.abilities.dm400.routine.desc=DM-400 führt 4 Runden lang Routinewartung durch, erleidet dabei 50% weniger Schaden und tritt anschließend für 10 Runden in den Überlastmodus ein.\n\nIm Überlastmodus hat DM-400 verdoppelte Angriffs- und Bewegungsgeschwindigkeit (Drohnen profitieren ebenfalls), erleidet aber 50% mehr Schaden.
actors.hero.abilities.dm400.routine$overload.name=Überlastmodus
actors.hero.abilities.dm400.routine$overload.desc=Warnung! DM-400 und seine Drohnen sind in den Überlastmodus eingetreten!\n\nWährend dieser Zeit sind die Angriffs- und Bewegungsgeschwindigkeit von DM-400 und seinen Drohnen verdoppelt, aber DM-400 erleidet erhöhten Schaden.\n\nVerbleibende Runden: %s
actors.hero.talent.over_extend.title=Überlast-Verlängerung
actors.hero.talent.over_extend.desc=_+1：_Überlast auf _12 Runden_ verlängert.\n\n_+2：_Überlast auf _15 Runden_ verlängert.\n\n_+3：_Überlast auf _17 Runden_ verlängert.\n\n_+4：_Überlast auf _20 Runden_ verlängert.
actors.hero.talent.over_extend.comment=
actors.hero.talent.terror_mach.title=Terrormaschine
actors.hero.talent.terror_mach.desc=_+1：_Nach Eintritt in die Überlastung gerät der erste Feind, der in das Sichtfeld der DM-400 tritt, für _2 Runden in Angst_.\n\n_+2：_Nach Eintritt in die Überlastung gerät der erste Feind, der in das Sichtfeld der DM-400 tritt, für _4 Runden in Angst_.\n\n_+3：_Nach Eintritt in die Überlastung gerät der erste Feind, der in das Sichtfeld der DM-400 tritt, für _6 Runden in Angst_.\n\n_+4：_Nach Eintritt in die Überlastung gerät der erste Feind, der in das Sichtfeld der DM-400 tritt, für _8 Runden in Angst_.
actors.hero.talent.terror_mach.comment=Jeder Feind kann nur einmal pro Kampf von diesem Effekt betroffen sein.
actors.hero.talent.strong_perserve.title=Starke Wartung
actors.hero.talent.strong_perserve.desc=_+1：_Nach der Wartung erhalten der Held und alle Drohnen einen Schild in Höhe von _7.5% der maximalen Lebenspunkte_, und der erlittene Schaden während der Überlast _sinkt um 5%_.\n\n_+2：_Schild _10%_, Schadensreduktion _10%_.\n\n_+3：_Schild _12.5%_, Schadensreduktion _15%_.\n\n_+4：_Schild _15%_, Schadensreduktion _20%_.
actors.hero.talent.strong_perserve.comment=

actors.hero.abilities.dm400.discharge_gas.name=Abgasausstoß
actors.hero.abilities.dm400.discharge_gas.short_desc=DM-400 führt einen _Abgasausstoß_ durch, um angesammelte Schadstoffe freizusetzen.
actors.hero.abilities.dm400.discharge_gas.desc=DM-400 kann die lang angesammelten Abgase ausstoßen, eine Giftgaswolke auf alle Feinde in Sichtweite abfeuern und dabei alle eigenen Debuffs entfernen.\n\nBefinden sich keine Feinde in Sichtweite, werden nur die eigenen Debuffs entfernt, ohne Gas freizusetzen.\n\nBasis-Gasmenge: _50_
actors.blobs.discharge_gas$dm400gas.name=Maschinenabluft
actors.blobs.discharge_gas$dm400gas.desc=Eine grünliche Maschinenabluft schlängelt sich hier. DM-400 und seine Drohnen ignorieren die Wirkung dieses Gases.
actors.hero.talent.over_time.title=Langanhaltende Anhäufung
actors.hero.talent.over_time.desc=_+1：_Die Giftgasmenge pro ausgestoßener Wolke erhöht sich um _15%_.\n\n_+2：_Die Giftgasmenge pro ausgestoßener Wolke erhöht sich um _30%_.\n\n_+3：_Die Giftgasmenge pro ausgestoßener Wolke erhöht sich um _45%_.\n\n_+4：_Die Giftgasmenge pro ausgestoßener Wolke erhöht sich um _60%_.
actors.hero.talent.over_time.comment=
actors.hero.talent.deadly_gas.title=Tödliches Gas
actors.hero.talent.deadly_gas.desc=_+1:_ Das von DM-400 versprühte Giftgas verursacht _+1 Schaden_.\n\n_+2:_ Giftgas _+2 Schaden_.\n\n_+3:_ Giftgas _+3 Schaden_.\n\n_+4:_ Giftgas _+4 Schaden_.
actors.hero.talent.deadly_gas.comment=
actors.hero.talent.discharge_happy.title=Entlüftungsfreude
actors.hero.talent.discharge_happy.desc=_+1：_DM-400 erhält nach dem Ausstoßen von Giftgas _2 Runden Hochgeschwindigkeit_.\n\n_+2：_DM-400 erhält nach dem Ausstoßen von Giftgas _4 Runden Hochgeschwindigkeit_.\n\n_+3：_DM-400 erhält nach dem Ausstoßen von Giftgas _6 Runden Hochgeschwindigkeit_.\n\n_+4：_DM-400 erhält nach dem Ausstoßen von Giftgas _8 Runden Hochgeschwindigkeit_.
actors.hero.talent.discharge_happy.comment=

actors.hero.abilities.dm400.honeycomb.name=Bienenschwarm
actors.hero.abilities.dm400.honeycomb.short_desc=DM-400 startet das _Bienenschwarm_-Programm. Wenn eine Drohne zerstört wird, erhält der Host einen Bonus.
actors.hero.abilities.dm400.honeycomb.desc=DM-400 startet das Bienenschwarm-Programm. Für 20 Runden stellt jede zerstörte Drohne 4% der max. Lebenspunkte von DM-400 wieder her und gewährt 2 Runden Artefaktladung.
actors.hero.abilities.dm400.honeycomb$honeycombbuff.name=Schwarmprogramm
actors.hero.abilities.dm400.honeycomb$honeycombbuff.desc=DM-400 führt dieses Programm aus. Die angeschlossenen Drohnen teilen Daten mit dem Host.\n\nWährend der Programmausführung übermitteln zerstörte Drohnen Daten an den Host, um dessen Überlebensfähigkeit zu erhalten und die Produktion neuer Drohnen zu beschleunigen.\n\nVerbleibende Runden: %s
actors.hero.talent.process_extend.title=Prozessverlängerung
actors.hero.talent.process_extend.desc=_+1：_Während der Clusterprogramm-Ausführung verlängert jede zerstörte Drohne die effektive Zeit des Programms um _0.5 Runden_.\n\n_+2：_Verlängert um _1 Runde_.\n\n_+3：_Verlängert um _1.5 Runden_.\n\n_+4：_Verlängert um _2 Runden_.
actors.hero.talent.process_extend.comment=
actors.hero.talent.glorious_dead.title=Ruhmreicher Tod
actors.hero.talent.glorious_dead.desc=_+1：_Während des Schwarmprogramms erhält DM-400 für jede zerstörte Drohne _4,5% der max. LP_ zurück.\n\n_+2：_Während des Schwarmprogramms erhält DM-400 für jede zerstörte Drohne _5% der max. LP_ zurück.\n\n_+3：_Während des Schwarmprogramms erhält DM-400 für jede zerstörte Drohne _5,5% der max. LP_ zurück.\n\n_+4：_Während des Schwarmprogramms erhält DM-400 für jede zerstörte Drohne _6% der max. LP_ zurück.
actors.hero.talent.glorious_dead.comment=
actors.hero.talent.upon_wave.title=Welle um Welle
actors.hero.talent.upon_wave.desc=_+1：_Während des Schwarmprogramms gewährt jede zerstörte Drohne der DM-400 _3 Runden Artefaktaufladung_.\n\n_+2：_Während des Schwarmprogramms gewährt jede zerstörte Drohne der DM-400 _4 Runden Artefaktaufladung_.\n\n_+3：_Während des Schwarmprogramms gewährt jede zerstörte Drohne der DM-400 _5 Runden Artefaktaufladung_.\n\n_+4：_Während des Schwarmprogramms gewährt jede zerstörte Drohne der DM-400 _6 Runden Artefaktaufladung_.
actors.hero.talent.upon_wave.comment=

actors.hero.abilities.freeman.salescontract.name=Arbeitsvertrag
actors.hero.abilities.freeman.salescontract.short_desc=Der Gentleman überredet Gegner, einen _Arbeitsvertrag_ zu unterschreiben, der sie für immer in seinen Dienst stellt.
actors.hero.abilities.freeman.salescontract.desc=Der Gentleman kann mit seiner irgendwo erlernten universellen Monstersprache (natürlich hauptsächlich durch die Kraft der Krone) Gegner überreden, einen Arbeitsvertrag mit ihm zu unterschreiben. Dadurch arbeiten unter Vertrag stehende Gegner ein Leben lang für ihn.\n\nNatürlich kann der Gentleman nicht jeden überzeugen. Bosse, kleine Bosse, Eliten und Verbündete werden ablehnen.
actors.hero.abilities.freeman.salescontract$saleself.name=Auf Lebenszeit verkauft
actors.hero.abilities.freeman.salescontract$saleself.desc=Dieser Gegner wurde vom Gentleman überredet, sich ihm bedingungslos zu verkaufen, und arbeitet nun für ihn.\n\nEin bereits unter Vertrag stehender Gegner kann offensichtlich keinen weiteren Vertrag unterschreiben – schließlich kann man nicht auch noch sein nächstes Leben verpfänden.
actors.hero.abilities.freeman.salescontract$workerwraith.name=Arbeitergeist
actors.hero.abilities.freeman.salescontract$workerwraith.desc=Ein Geist, der aus einem vor Wut gestorbenen Arbeiter (Monster) entstanden ist. Obwohl der Körper tot ist, muss er gemäß dem Vertrag weiterhin für den Gentleman arbeiten.\n\nDer Arme muss wirklich zwei Leben lang für den Gentleman schuften.
actors.hero.abilities.freeman.salescontract.self_target=Kann nicht auf sich selbst angewendet werden.
actors.hero.abilities.freeman.salescontract.no_target=Kein Ziel verfügbar, mit dem ein Vertrag geschlossen werden kann.
actors.hero.abilities.freeman.salescontract.more_distance=Ziel zu weit entfernt.
actors.hero.abilities.freeman.salescontract.strong_target=Das Ziel lehnt den Vertrag ab und blickt verächtlich auf dich herab.
actors.hero.talent.elite_recruit.title=Elitenanwerbung
actors.hero.talent.elite_recruit.desc=_+1：_Bei Vertragsabschluss gibt der Gentleman _200 Gold_ extra aus, um dem Vertragsfeind einen zufälligen Eliten-Effekt zu verleihen.\n\n_+2：_Bei Vertragsabschluss gibt der Gentleman _150 Gold_ extra aus, um dem Vertragsfeind einen zufälligen Eliten-Effekt zu verleihen.\n\n_+3：_Bei Vertragsabschluss gibt der Gentleman _100 Gold_ extra aus, um dem Vertragsfeind einen zufälligen Eliten-Effekt zu verleihen.\n\n_+4：_Bei Vertragsabschluss gibt der Gentleman _50 Gold_ extra aus, um dem Vertragsfeind einen zufälligen Eliten-Effekt zu verleihen.
actors.hero.talent.elite_recruit.comment=
actors.hero.talent.prim_accu.title=Primitive Akkumulation
actors.hero.talent.prim_accu.desc=_+1：_Wenn ein vertraglich gebundener Gegner andere Gegner physisch angreift, erhält der Gentleman _10 Goldmünzen_.\n\n_+2：_Erhält _20 Goldmünzen_.\n\n_+3：_Erhält _30 Goldmünzen_.\n\n_+4：_Erhält _40 Goldmünzen_.
actors.hero.talent.prim_accu.comment=
actors.hero.talent.soul_contract.title=Seelenvertrag
actors.hero.talent.soul_contract.desc=_+1：_Wenn ein vertraglich gebundener Gegner stirbt, _wird er zu einem korrumpierten Arbeitergeist_, und der Gentleman erhält durch unbeachtete Details im Vertrag die eigentlich dem Arbeitergeist zustehende Unfallentschädigung von _100 Goldmünzen_.\n\n_+2：_Zusätzlich zu +1 wird der Korruptionseffekt des Arbeitergeistes zu einem _Lebenslangen-Dienst_-Effekt.\n\n_+3：_Zusätzlich zu +1 und +2 erhält der Arbeitergeist einen _zufälligen Elite_-Effekt.\n\n_+4：_Zusätzlich zu +1, +2 und +3 entspricht die _maximale Lebenspunkte des Arbeitergeistes_ der seines früheren Lebens (des ursprünglichen Vertragsgegners).
actors.hero.talent.soul_contract.comment=

actors.mobs.transformmimic.name=Transformations-Truhenimitator
actors.mobs.transformmimic.desc=Truhenimitatore sind magische Kreaturen, die ihre Gestalt beliebig ändern können. In den Kerkern treten sie fast immer als Truhen auf, da dies unvorsichtige Abenteurer anlockt.\n\nTransformations-Truhenimitatore sind Truhenimitatore, die aus einer Transformationsrolle geformt wurden, die von einer bösen Macht beseelt wurde. Ihre Angriffs- und Verteidigungsfähigkeiten unterscheiden sich nicht von gewöhnlichen Truhenimitatoren, aber sie enthalten immer eine Transformationsrolle und keine andere Beute.
actors.mobs.transformmimic.reveal=Dort ist ein Truhenimitator!
actors.mobs.transformmimic.hidden_name=Violette Truhe?
actors.mobs.transformmimic.hidden_desc=Du kannst nicht sehen, was drin ist, bevor du es öffnest!\n\nDiese violette Truhe unterscheidet sich stark von den üblichen Truhen. Öffne sie besser nicht vorschnell.
actors.mobs.transformmimic.discover_hint=Du kannst diesen Gegner in jeder Dungeonregion entdecken, nachdem du eine bestimmte Herausforderung aktiviert hast.

actors.hero.heroclass.princess=Zwergenprinzessin
actors.hero.heroclass.princess_desc_short=Die Zwergenprinzessin trägt einen _Kronprinzenring_, der Verzauberungen und Gravuren speichern kann, und kann Runensteine gegen Alchemie-Energie in _Verzauberungsrunensteine umwandeln_.
actors.hero.heroclass.princess_desc=Die Zwergenprinzessin beginnt mit einem _einzigartigen Kronprinzenring_, der wie Waffen und Rüstungen Verzauberungen und Gravuren speichern und direkt auf beide anwenden kann.\n\nDie Zwergenprinzessin kann jeden Runenstein direkt in _einen Verzauberungsrunenstein umwandeln_, was 8 Alchemie-Energie kostet.\n\nAußerdem beginnt die Zwergenprinzessin mit _einem Armschild_, _einer Runenkette_, Stoffrüstung, einem Wasserschlauch und einem Beutel.\n\nZu Beginn identifizierte Gegenstände:\n_-_ Schwebetrank\n_-_ Wandlungs-, Identifikations- und Rache-Schriftrolle
actors.hero.heroclass.princess_unlock=_Besiege den Zwergenkönig in einem Spiel_, um die Zwergenprinzessin freizuschalten.
actors.hero.talent.enchant_meal.title=Verzauberte Mahlzeit
actors.hero.talent.enchant_meal.desc=_+1：_Essen erhöht die Auslösewahrscheinlichkeit von Verzauberungen oder Flüchen auf Zwergenprinzessin-Waffen für die nächsten _3 Angriffe_ auf das 1,33-Fache.\n\n_+2：_Essen erhöht die Auslösewahrscheinlichkeit von Verzauberungen oder Flüchen auf Zwergenprinzessin-Waffen für die nächsten _5 Angriffe_ auf das 1,33-Fache.
actors.hero.talent.enchant_meal.comment=Ist der Ring des Kronprinzen verzaubert, wirkt diese Fertigkeit auch auf unbewaffnete Angriffe, nicht verzauberte Waffen oder Wurfwaffen.\n\nHabe ich dir je gesagt, je satter du bist, desto stärker wird die arkane Kraft?
actors.hero.talent$enchantmeal.name=Verzauberungsverstärkung
actors.hero.talent$enchantmeal.desc=Die Wahrscheinlichkeit, dass deine nächsten physischen Angriffe Verzauberungen auslösen, ist erhöht.\n\nVerbleibende Anwendungen: %1$d
actors.hero.talent.mana_sense.title=Manawahrnehmung
actors.hero.talent.mana_sense.desc=_+1：_Die Identifikationsgeschwindigkeit von verzauberten und gesiegelten Waffen und Rüstungen ist _5-mal_ so hoch.\n\n_+2：_Die Zwergenprinzessin kann _beim Anlegen_ verzauberter und gesiegelter Waffen und Rüstungen diese _sofort identifizieren_.
actors.hero.talent.mana_sense.comment=Wie ich im Unterricht immer sagte: Du hast von Geburt an die feinste Wahrnehmung für arkane Energie.
actors.hero.talent.rune_blade.title=Runenklinge
actors.hero.talent.rune_blade.desc=_+1：_Wenn die Zwergenprinzessin mit einer physischen Waffe mit Verzauberung angreift, fügt sie _1 magischen Schaden_ hinzu.\n\n_+2：_Fügt _2 magischen Schaden_ hinzu.
actors.hero.talent.rune_blade.comment=Wenn der ausgerüstete Erbprinzenring eine Verzauberung hat, wirkt dieses Talent auch auf unbewaffnete Angriffe und Waffen oder Wurfwaffen ohne eigene Verzauberung.\n\n„Überschüssige arkane Energie wird zu greifbarer Magie.“
actors.hero.talent.arcane_shield.title=Arkaner Schild
actors.hero.talent.arcane_shield.desc=_+1:_ Erhalte bei einem Treffer sofort _2 Punkte Schild_, wenn die von der Zwergenprinzessin getragene Rüstung eine Gravur hat.\n\n_+2:_ Erhalte bei einem Treffer sofort _3 Punkte Schild_, wenn die Rüstung eine Gravur hat.
actors.hero.talent.arcane_shield.comment=Dieses Talent _hat eine Abklingzeit von 20 Runden_.\n\nWenn der ausgerüstete Ring des Thronfolgers eine Gravur hat, kann dieses Talent auch auf Rüstungen ohne eigene Gravur wirken.\n\n„Überschüssige arkane Energie wird dich beschützen."
actors.hero.talent$arcaneshieldcooldown.name=Arkaner Schild - Abklingzeit
actors.hero.talent$arcaneshieldcooldown.desc=Du hast dieses Talent gerade erst eingesetzt und musst eine Weile warten, bevor du es erneut einsetzen kannst.\n\nVerbleibende Abklingzeit: %s Runden
actors.hero.talent.royal_meal.title=Königliches Bankett
actors.hero.talent.royal_meal.desc=_+1：_Die Zwergenprinzessin isst in nur 1 Runde und erhöht den Erbprinzenring für 10 Runden um _1 Stufe_.\n\n_+2：_Erhöht den Ring um _2 Stufen_.
actors.hero.talent.royal_meal.comment=Wenn sich kein Erbprinzenring im Inventar befindet, erhöht dieses Talent auf _+1/+2_ alle Ringe für _5/10 Runden_ um 1 Stufe.\n\n„Vornehmes Essen.“
actors.hero.talent$royalmeal.name=Königliches Festmahl
actors.hero.talent$royalmeal.desc=Die Zwergenprinzessin hat nach dem Essen ihren Ring des Thronfolgers gestärkt und ihm eine zusätzliche Stufe verliehen.\n\nWenn sich kein Ring des Thronfolgers im Rucksack befindet, werden stattdessen alle Ringe um eine Stufe verstärkt.\n\nVerbleibende Runden: %s Runden
actors.hero.talent.rune_expert.title=Runenstein-Experte
actors.hero.talent.rune_expert.desc=_+1：_Der Alchemieenergieverbrauch der Zwergenprinzessin zur Umwandlung eines beliebigen Runensteins in einen Verzauberungsrunenstein _reduziert sich um 2 Punkte_.\n\n_+2：_Reduziert sich um 4 Punkte_.
actors.hero.talent.rune_expert.comment=„Die Lehren des Hofverzauberers sind dir noch frisch in Erinnerung. Die Umwandlung von Runensteinen ist für dich so einfach wie Atmen.“
actors.hero.talent.rune_expert.meta_desc=_Wenn dieses Talent von einem anderen Helden erlangt wird_, erhält er auf +1/+2 +1/+2 zusätzliche Runensteine beim Zerlegen von Schriftrollen im Alchemiekessel.
actors.hero.talent.str_rune.title=Starker Runenstein
actors.hero.talent.str_rune.desc=_+1：_Bei Verwendung eines Verzauberungsrunensteins erhält die Zwergenprinzessin zusätzlich zur zufälligen Stufe eine _gewöhnliche Stufe_ als Option.\n\n_+2：_Erhält zusätzlich eine _seltene Stufe_ als Option.\n\n_+3：_Erhält sowohl eine _gewöhnliche_ als auch eine _seltene Stufe_ als Optionen.
actors.hero.talent.str_rune.comment=
actors.hero.talent.more_ring.title=Mehr Ringe
actors.hero.talent.more_ring.desc=_+1：_Die Zwergenprinzessin kann den _Erbprinzenring_ im Artefaktplatz ausrüsten.\n\n_+2：_Die Zwergenprinzessin kann _beliebige Ringe_ im Artefaktplatz ausrüsten.
actors.hero.talent.more_ring.comment=Wenn dieses Talent nach seiner Aktivierung transformiert wird, wird der bereits im Artefaktplatz ausgerüstete Ring automatisch abgelegt.\n\n„So ein Schmuckliebhaber.“
actors.hero.talent.more_ring.meta_desc=_Wenn dieses Talent von einem anderen Helden erlangt wird_, kann er auf +1 Ringe ohne Rundeneinsatz wechseln und auf +2 beliebige Ringe im Artefaktplatz ausrüsten.
actors.hero.talent.mana_wreath.title=Manakranz
actors.hero.talent.mana_wreath.desc=_+1：_Tötet die Zwergenprinzessin einen Feind mit einer verzauberten physischen Waffe, erhält sie _alle 5 Runden_ abklingende 0~10 arkane Rüstung.\n\n_+2：_Tötet die Zwergenprinzessin einen Feind mit einer verzauberten physischen Waffe, erhält sie _alle 10 Runden_ abklingende 0~10 arkane Rüstung.
actors.hero.talent.mana_wreath.comment=Ist der Ring des Kronprinzen verzaubert, wirkt diese Fertigkeit auch auf unbewaffnete Angriffe, nicht verzauberte Waffen oder Wurfwaffen.\n\nÜberschüssige arkane Energie kann auch als arkane Rüstung gegen magische Angriffe dienen.
actors.hero.talent.magic_arrow.title=Magischer Pfeil
actors.hero.talent.magic_arrow.desc=_+1：_Wenn die Zwergenprinzessin mit einer verzauberten Wurfwaffe angreift, erhöht sich der Schaden um _15%_.\n\n_+2：_Wenn die Zwergenprinzessin mit einer verzauberten Wurfwaffe angreift, erhöht sich der Schaden um _30%_.
actors.hero.talent.magic_arrow.comment=Ist der Ring des Kronprinzen verzaubert, wirkt diese Fertigkeit auch auf nicht verzauberte Wurfwaffen.\n\nWenn ein Held mit einer Spezialwurfwaffe (wie dem Seelenbogen) diese Fertigkeit erhält, profitieren auch verzauberte Spezialwurfwaffen vom Bonus.\n\nDurch die Konzentration arkaner Energie auf den Pfeil wird die Durchschlagskraft erhöht.
actors.hero.talent.ring_bond.title=Ringverbindung
actors.hero.talent.ring_bond.desc=_+1：_Wenn andere Ringe im Inventar der Zwergenprinzessin eine niedrigere Stufe als der Erbprinzenring haben, erhält dieser _1 zusätzliche Stufe_.\n\n_+2：_Erhält _2 zusätzliche Stufen_.\n\n_+3：_Erhält _3 zusätzliche Stufen_.
actors.hero.talent.ring_bond.comment=Die zusätzliche Stufe dieses Talents kann die Stufe des Erbprinzenrings nicht überschreiten.
actors.hero.talent.ring_bond.meta_desc=_Wenn dieses Talent von einem anderen Helden erlangt wird_, erhöht es auf +1/+2/+3 den Verbindungseffekt mehrerer gleicher Ringe um 1/2/3 zusätzliche Stufen.

actors.hero.herosubclass.runemage=Runenmagier
actors.hero.herosubclass.runemage_short_desc=Nach einem physischen Angriff mit einer positiven Verzauberung erhält der _Runenmagier_ ein Runenmal. Das Runenmal kann mit einem Zauberstab ausgelöst werden und erzeugt je nach Verzauberung spezielle Effekte.
actors.hero.herosubclass.runemage_desc=Nach einem physischen Angriff mit einer positiven Verzauberung erhält der Runenmagier ein Runenmal. Das Runenmal speichert die entsprechende Verzauberungsinformation. Die Anzahl der gespeicherten Verzauberungen entspricht der Stapelzahl des Males. Das Mal wird beim Wirken eines Zauberstabs ausgelöst.\n\nWenn der Runenmagier das Runenmal mit einem Zauberstab auslöst, erleiden alle Feinde im 3x3-Bereich zusätzlichen Schaden in Höhe von Stapelzahl x 5, zusammen mit einem speziellen Effekt basierend auf der gespeicherten Verzauberung.

actors.buffs.runemark.name=Runenmal
actors.buffs.runemark.desc=Der Runenmagier hat mit Hilfe der Verzauberungskraft ein Mal auf das Ziel geprägt. Wird es von einem Zauber getroffen, explodiert es und fügt Feinden zusätzlichen magischen Schaden zu, ohne den Runenmagier oder seine Verbündeten zu beeinträchtigen oder die Umgebung zu beschädigen.\n\nDieses Mal bleibt bestehen, bis es durch einen Zauber ausgelöst wird oder das Ziel stirbt.\n\nDas Mal hat folgende Verzauberungen gespeichert:
actors.buffs.runemark$runesurge.name=Runenschub
actors.buffs.runemark$runesurge.desc=Die Verzauberungseffekte des Runenmagiers werden für einige Zeit verstärkt.\n\nVerbleibende Runden: %s

actors.hero.talent.darkmark.title=Dunkles Mal
actors.hero.talent.darkmark.desc=_+1:_ Der Runenmagier wendet mit dem Runenmal zusätzlich _3 Runden Verwirrung_ an.\n\n_+2:_ Zusätzlich zu +1 wendet er _3 Runden Verwirrung und Verwundbarkeit_ an.\n\n_+3:_ Zusätzlich zu +2 wendet er _3 Runden Verwirrung, Verwundbarkeit und Schwäche_ an.
actors.hero.talent.darkmark.comment=

actors.hero.talent.rune_blast.title=Runenexplosion
actors.hero.talent.rune_blast.desc=_+1：_Wenn die Runensiegel des Runenmagiers ausgelöst werden, stellen sie allen Stäben _Siegelschichten x 0.25 Aufladungen_ wieder her.\n\n_+2：_Zusätzlich zu +1 können die Siegel _2 Mal ausgelöst werden_. Bei der zweiten Auslösung mit einem anderen Stab _erhöht sich der Schaden um +10_.\n\n_+3：_Zusätzlich zu +1 und +2 _erhöht sich der Explosionsradius der Siegel auf 5x5_.
actors.hero.talent.rune_blast.comment=

actors.hero.talent.rune_surge.title=Runenflut
actors.hero.talent.rune_surge.desc=_+1：_Innerhalb von _10 Runden_ nach dem Auslösen eines Runensiegels ist der Verzauberungseffekt des Runenmagiers um _33%_ erhöht.\n\n_+2：_Innerhalb von _15 Runden_ um _67%_ erhöht.\n\n_+3：_Innerhalb von _20 Runden_ um _100%_ erhöht.
actors.hero.talent.rune_surge.comment=Hinweis: Wie der Arkane Ring verstärkt dieses Talent nur die ursprünglichen Effekte von Waffenverzauberungen, nicht die Explosionseffekte von Runensiegeln.

actors.hero.herosubclass.combatmaster=Kampfmeisterin
actors.hero.herosubclass.combatmaster_short_desc=Die _Kampfmeisterin_ erhält zusätzliche starke Effekte von Rüstungsgravuren und beherrscht verschiedene Kampfhaltungen.
actors.hero.herosubclass.combatmaster_desc=Die Kampfmeisterin kann die verborgene Kraft von Rüstungsgravuren besser nutzen, was ihr zusätzliche starke Effekte für offensive Gravuren verleiht. Sie beherrscht zudem verschiedene Kampfhaltungen, was ihr im Nahkampf Vorteile verschafft.\n\nDie Kampfmeisterin beginnt in der Balancehaltung. Haltungswechsel kosten keine Runde, aber ein erneuter Wechsel innerhalb von 6 Runden nach einem Wechsel versetzt sie für 10 Runden in Benommenheit, in der keine weiteren Wechsel möglich sind.\n\nBalancehaltung: Leichte Verbesserung aller Kampf- und Verteidigungsfähigkeiten\nAngriffshaltung: Verbesserte Kampffähigkeiten, aber verringerte Verteidigung\nParadehaltung: Verbesserte Verteidigung, aber verringerte Kampffähigkeiten\n\nDiese Spezialisierung hat eine Spezialfähigkeit, wenn Haltungen gewechselt werden können. Bei mehreren Spezialfähigkeiten kann durch langes Drücken des Kurzbefehls gewechselt werden.

actors.buffs.fightstance.balance_name=Balancehaltung
actors.buffs.fightstance.balance_desc=Die Kampfmeisterin befindet sich in der _Balancehaltung_. In dieser Haltung werden ihre Kampf- und Verteidigungsfähigkeiten gesteigert.
actors.buffs.fightstance.balance_desc1=Erhöht Nahkampfschaden, Rüstungsverteidigung, Präzision und Ausweichen um 10%.
actors.buffs.fightstance.balance_desc2=Erhöht Nahkampfschaden, Rüstungsverteidigung, Präzision und Ausweichen um 15%.
actors.buffs.fightstance.balance_desc3=Erhöht Nahkampfschaden, Rüstungsverteidigung, Angriffsgeschwindigkeit, Bewegungsgeschwindigkeit, Präzision und Ausweichen um 15%.
actors.buffs.fightstance.invasion_name=Angriffshaltung
actors.buffs.fightstance.invasion_desc=Die Kampfmeisterin befindet sich in der _Angriffshaltung_. In dieser Haltung werden ihre Kampffähigkeiten gesteigert, aber ihre Verteidigung geschwächt.
actors.buffs.fightstance.invasion_desc1=Erhöht Nahkampfschaden um 20% mit 30% Chance auf Doppelangriff (der zweite Treffer löst normal Waffenverzauberungen aus), aber Ausweichen sinkt um 30%.
actors.buffs.fightstance.invasion_desc2=Erhöht Nahkampfschaden um 30% mit 30% Chance auf Doppelangriff (der zweite Treffer löst normal Waffenverzauberungen aus), aber Ausweichen sinkt um 30%.
actors.buffs.fightstance.invasion_desc3=Erhöht Nahkampfschaden um 30% mit 50% Chance auf Doppelangriff (der zweite Treffer löst normal Waffenverzauberungen aus), aber Ausweichen sinkt um 15%.
actors.buffs.fightstance.parry_name=Paradehaltung
actors.buffs.fightstance.parry_desc=Die Kampfmeisterin befindet sich in der _Paradehaltung_. In dieser Haltung werden ihre Verteidigungsfähigkeiten gesteigert, aber ihre Kampffähigkeiten geschwächt.
actors.buffs.fightstance.parry_desc1=Erhöht Rüstungsverteidigung um 20% und gewährt alle 30 Runden Fokus (stapelt nicht, wird bei Haltungswechsel aufgehoben), aber Präzision sinkt um 30%.
actors.buffs.fightstance.parry_desc2=Erhöht Rüstungsverteidigung um 30% und gewährt alle 30 Runden Fokus (stapelt nicht, wird bei Haltungswechsel aufgehoben), aber Präzision sinkt um 30%.
actors.buffs.fightstance.parry_desc3=Erhöht Rüstungsverteidigung um 30% und gewährt alle 20 Runden Fokus (stapelt nicht, wird bei Haltungswechsel aufgehoben), aber Präzision sinkt um 15%.
actors.buffs.fightstance.duration=Die Kampfmeisterin hält diese Haltung seit %s Runden.
actors.buffs.fightstance.action=Wähle die Haltung, die du einnehmen möchtest.
actors.buffs.fightstance$stabilize.name=Haltungsstabilisierung
actors.buffs.fightstance$stabilize.desc=Du hast gerade die Haltung gewechselt. Warte besser, bis du dich stabilisiert hast.\n\nEin erneuter Haltungswechsel in dieser Zeit würde mehr Koordinationszeit erfordern und weitere Wechsel verhindern.\n\nDu brauchst noch %s Runden, um dich zu stabilisieren.
actors.buffs.fightstance$coordination.name=Haltungskoordination
actors.buffs.fightstance$coordination.desc=Du hast gerade mehrfach die Haltung gewechselt. Um das Gleichgewicht zu koordinieren, musst du eine Weile warten.\n\nDu brauchst noch %s Runden, um dein Gleichgewicht zu koordinieren.
actors.buffs.fightstance$focus.name=Fokus
actors.buffs.fightstance$focus.desc=Die Kampfmeisterin ist hochkonzentriert und kann den nächsten Angriff vorhersehen. Im Fokus-Zustand pariert sie den nächsten eingehenden Angriff garantiert.
actors.hero.talent.fluent.title=Fließend wie Wasser
actors.hero.talent.fluent.desc=_+1：_Der Kampfmeister kann bei schnellem Haltungswechsel _nicht verwirrt werden_, kann aber 10 Runden lang keine Haltung wechseln.\n\n_+2：_Wie bei +1 erhält der Kampfmeister beim Wechsel von Ausgeglichen zu Aggressiv _5 Runden Hochgeschwindigkeit_, von Ausgeglichen zu Abwehr _20 Schildpunkte_.\n\n_+3：_Wie bei +1 und +2 erhält der Kampfmeister beim Wechsel von Aggressiv zu Ausgeglichen _4 Runden Zauberstab-Aufladung_, von Abwehr zu Ausgeglichen _4 Runden Artefakt-Aufladung_.
actors.hero.talent.fluent.comment=

actors.hero.talent.stance_mastery.title=Stil-Meisterschaft
actors.hero.talent.stance_mastery.desc=_+1：_Die verbesserten Fähigkeiten des Kampfmeisters im Gleichgewichts-Stil _erhöhen sich um 5%_.\n\n_+2：_Zusätzlich zu +1 erhöht sich der Nahkampfschadensbonus im Angriffs-Stil und der Rüstungsbonus im Abwehr-Stil jeweils _auf 30%_.\n\n_+3：_Zusätzlich zu +1 und +2 erhöht der Gleichgewichts-Stil auch _Angriffs- und Bewegungsgeschwindigkeit_, die Combo-Chance im Angriffs-Stil _steigt auf 50%_, das Konzentrationsintervall im Abwehr-Stil _sinkt auf 20 Runden_, und die negativen Effekte der letzten beiden Stile _sinken auf 15%_.
actors.hero.talent.stance_mastery.comment=

actors.hero.talent.inelement.title=Spielraum
actors.hero.talent.inelement.desc=_+1：_Befindet sich der Kampfmeister länger als _20 Runden_ in einer Haltung, wird der Siegeleffekt um _33%_ verstärkt.\n\n_+2：_Befindet sich der Kampfmeister länger als _15 Runden_ in einer Haltung, wird der Siegeleffekt um _67%_ verstärkt.\n\n_+3：_Befindet sich der Kampfmeister länger als _10 Runden_ in einer Haltung, wird der Siegeleffekt um _100%_ verstärkt.
actors.hero.talent.inelement.comment=Hinweis: Wie der Ring der Arkanen verstärkt diese Fertigkeit nur die ursprünglichen Effekte von Rüstungssiegeln, nicht die Zusatzeffekte des Kampfmeisters.

actors.hero.abilities.princess.marchforward.name=Stürmischer Vormarsch
actors.hero.abilities.princess.marchforward.short_desc=Die Zwergenprinzessin _marschiert stürmisch vorwärts_, jeder Schritt macht sie schneller.
actors.hero.abilities.princess.marchforward.desc=Die Zwergenprinzessin marschiert unaufhaltsam vorwärts. Ihre Bewegungsgeschwindigkeit ist um 50% erhöht, und mit jedem weiteren Schritt steigt sie um 5%, bis maximal 100%.\n\nErleidet die Zwergenprinzessin Schaden, wird der Effekt sofort unterbrochen.
actors.hero.abilities.princess.marchforward$forward.name=Stürmischer Vormarsch
actors.hero.abilities.princess.marchforward$forward.desc=Die Zwergenprinzessin marschiert unaufhaltsam vorwärts. Ihre Bewegungsgeschwindigkeit ist um %1$s%% erhöht, und mit jedem weiteren Schritt steigt sie um weitere 5%%, bis maximal %2$s%%.\n\nDieser Effekt hält an, bis sie %3$d Mal Schaden erleidet.
actors.hero.abilities.princess.marchforward.say=Das war nur eine Verzögerungstaktik!
actors.hero.talent.speedup.title=Im Galopp
actors.hero.talent.speedup.desc=_+1：_Der Bewegungsgeschwindigkeitsbonus der Zwergenprinzessin und sein Maximum _erhöhen sich um zusätzliche 12.5%_.\n\n_+2：_Erhöhen sich um zusätzliche 25%_.\n\n_+3：_Erhöhen sich um zusätzliche 37.5%_.\n\n_+4：_Erhöhen sich um zusätzliche 50%_.
actors.hero.talent.speedup.comment=

actors.hero.talent.run_attack.title=Laufangriff-Methode
actors.hero.talent.run_attack.desc=_+1：_Physische Angriffe der Zwergenprinzessin in diesem Zustand haben eine _7.5%ige Chance_, keine Runde zu verbrauchen.\n\n_+2：_Eine _15%ige Chance_.\n\n_+3：_Eine _22.5%ige Chance_.\n\n_+4：_Eine _30%ige Chance_.
actors.hero.talent.run_attack.comment=

actors.hero.talent.delay_tactic.title=Verzögerungstaktik
actors.hero.talent.delay_tactic.desc=_+1:_ Die Zwergenprinzessin muss _2 Treffer einstecken_, um diesen Effekt zu unterbrechen. Wenn der Schaden von einem Angreifer kommt, erhält dieser _2 Runden Verlangsamung_.\n\n_+2:_ Der Angreifer erhält _4 Runden Verlangsamung_.\n\n_+3:_ Die Prinzessin muss _3 Treffer einstecken_, der Angreifer erhält _6 Runden Verlangsamung_.\n\n_+4:_ Die Prinzessin muss _3 Treffer einstecken_, der Angreifer erhält _8 Runden Verlangsamung_.
actors.hero.talent.delay_tactic.comment=

actors.hero.abilities.princess.taboomagic.name=Verbotener Zauber
actors.hero.abilities.princess.taboomagic.short_desc=Die Zwergenprinzessin kann _Verbotene Zauber_ wirken, um Gegner mit einer Vielzahl von Debuffs zu belegen.
actors.hero.abilities.princess.taboomagic.desc=Die Zwergenprinzessin kann verbotene Zauber aus der Zwergenbibliothek wirken, um Gegner mit äußerst bösartigen Flüchen zu belegen und mit einer Vielzahl von Debuffs zu überziehen.\n\nDas Ziel des Zaubers kann nicht der selbst oder ein Verbündeter sein. Der betroffene Gegner erhält 10 Runden Verwirrung, Verwundbarkeit und Schwäche. Dieser Zauber kann Runenmale des Runenmagiers zur Explosion bringen.
actors.hero.abilities.princess.taboomagic.no_target=Kein geeignetes Ziel in Reichweite.
actors.hero.abilities.princess.taboomagic.say=Langsam, leise, so zerfällt das Leben zu Staub.
actors.hero.abilities.princess.taboomagic.say1=Der Tod naht – unerwartet, unausweichlich.
actors.hero.abilities.princess.taboomagic.say2=Der Geist kann nicht erwarten, solch einen Schlag zu überstehen.
actors.hero.abilities.princess.taboomagic.say3=Benommen, keuchend, über die Grenzen des Verstandes hinaus in den endlosen Wahnsinn!

actors.hero.abilities.princess.taboomagic.prompt=Wähle ein Ziel für den verbotenen Zauber

actors.hero.talent.element_curse.title=Elementarfluch
actors.hero.talent.element_curse.desc=_+1：_Verbotene Zauber verursachen zusätzlich _4 Runden Brennen oder 8 Runden Erfrieren_.\n\n_+2：_Wie bei +1, zusätzlich _5 Runden Ummantelung_.\n\n_+3：_Verbotene Zauber verursachen zusätzlich _8 Runden Brennen oder 16 Runden Erfrieren_.\n\n_+4：_Wie bei +3, zusätzlich _10 Runden Ummantelung_.
actors.hero.talent.element_curse.comment=
actors.hero.talent.afflicted_illness.title=Krankheit geplagt
actors.hero.talent.afflicted_illness.desc=_+1:_ Verbotene Zauber wenden außerdem _4 Runden Gift und Blutung mit Grundwert 4_ an.\n\n_+2:_ Zusätzlich zu +1 wird auch _5 Runden Lähmung_ angewendet.\n\n_+3:_ Verbotene Zauber wenden außerdem _8 Runden Gift und Blutung mit Grundwert 8_ an.\n\n_+4:_ Zusätzlich zu +3 wird auch _10 Runden Lähmung_ angewendet.
actors.hero.talent.afflicted_illness.comment=
actors.hero.talent.spread_pain.title=Schmerz verbreiten
actors.hero.talent.spread_pain.desc=_+1：_Wenn die Zwergenprinzessin bei 100% Rüstungsaufladung einen verbotenen Zauber wirkt, erweitert sich der Einflussbereich auf _3x3_ um das gewählte Ziel.\n\n_+2：_Auf _5x5_.\n\n_+3：_Auf _7x7_.\n\n_+4：_Auf _9x9_.
actors.hero.talent.spread_pain.comment=Helden oder Verbündete in diesem Bereich sind nicht betroffen.

actors.hero.abilities.princess.kingblade.name=Königsklinge
actors.hero.abilities.princess.kingblade.short_desc=Die Zwergenprinzessin schwingt die _Königsklinge_, fügt Gegnern schweren Schaden zu und erschwert ihnen die Gegenwehr.
actors.hero.abilities.princess.kingblade.desc=Die Zwergenprinzessin kann einen normalen Angriff mit garantierter Trefferchance auf einen benachbarten Gegner ausführen. Dieser Angriff hat 50% Schadensbonus.\n\nStirbt der getroffene Gegner nicht, erhält er 8 Runden Entwaffnung. Stirbt der Gegner, erhalten alle Feinde im Sichtfeld 4 Runden Entwaffnung. Entwaffnete Gegner können der Zwergenprinzessin und ihren Verbündeten keinen physischen Schaden zufügen. Boss-Gegner widerstehen diesem Effekt.
actors.hero.abilities.princess.kingblade.no_target=Du musst ein benachbartes Ziel auswählen.
actors.hero.abilities.princess.kingblade.say1=Zurück!
actors.hero.abilities.princess.kingblade.say2=Entwaffnet!
actors.hero.abilities.princess.kingblade$disarm.name=Entwaffnet
actors.hero.abilities.princess.kingblade$disarm.desc=Dieser Gegner wurde von dir entwaffnet.\n\nEntwaffnete Gegner greifen weiterhin an, können dir und deinen Verbündeten aber keinen physischen Schaden zufügen. Boss-Gegner verursachen weiterhin 50%% physischen Schaden.\n\nDauer des Entwaffnungseffekts: %s Runden
actors.hero.talent.king_gaze.title=Zorniger Blick des Königs
actors.hero.talent.king_gaze.desc=_+1：_Beim Schwertstreich des Königs erhält die Zwergenprinzessin _2 Runden Sicht_ und alle sichtbaren Feinde erhalten sofort _4 Runden Entwaffnung_.\n\n_+2：_Beim Schwertstreich des Königs erhält die Zwergenprinzessin _4 Runden Sicht_ und alle sichtbaren Feinde erhalten sofort _4 Runden Entwaffnung_.\n\n_+3：_Beim Schwertstreich des Königs erhält die Zwergenprinzessin _6 Runden Sicht_ und alle sichtbaren Feinde erhalten sofort _4 Runden Entwaffnung_.\n\n_+4：_Beim Schwertstreich des Königs erhält die Zwergenprinzessin _8 Runden Sicht_ und alle sichtbaren Feinde erhalten sofort _4 Runden Entwaffnung_.
actors.hero.talent.king_gaze.comment=
actors.hero.talent.king_power.title=Kraft des Königs
actors.hero.talent.king_power.desc=_+1：_Der Schadensbonus dieses Schlags der Zwergenprinzessin steigt auf _62,5%_.\n\n_+2：_Der Schadensbonus dieses Schlags der Zwergenprinzessin steigt auf _75%_.\n\n_+3：_Der Schadensbonus dieses Schlags der Zwergenprinzessin steigt auf _87,5%_.\n\n_+4：_Der Schadensbonus dieses Schlags der Zwergenprinzessin steigt auf _100%_.
actors.hero.talent.king_power.comment=
actors.hero.talent.king_might.title=Macht des Königs
actors.hero.talent.king_might.desc=_+1：_Tötet dieser Schlag der Zwergenprinzessin den Feind, werden _5% Rüstungsaufladung_ zurückerstattet.\n\n_+2：_Tötet dieser Schlag der Zwergenprinzessin den Feind, werden _10% Rüstungsaufladung_ zurückerstattet.\n\n_+3：_Tötet dieser Schlag der Zwergenprinzessin den Feind, werden _15% Rüstungsaufladung_ zurückerstattet.\n\n_+4：_Tötet dieser Schlag der Zwergenprinzessin den Feind, werden _20% Rüstungsaufladung_ zurückerstattet.
actors.hero.talent.king_might.comment=


actors.hero.heroclass.friar=Mönch
actors.hero.heroclass.friar_desc_short=Der Mönch kann mit der _Alchemiespritze_ bestückte Tränke versprühen. Er kann _Verstand in Alchemie-Energie umwandeln_. Ist der Verstand aufgebraucht, _wird sein Geist auf die Probe gestellt_.
actors.hero.heroclass.friar_desc=Der Mönch beginnt mit einer _einzigartigen Alchemiespritze_, die mit Tränken bestückt und versprüht werden kann.\n\nDer Mönch kann _einen Teil seines Verstandes in Alchemie-Energie umwandeln_. Bei der Erkundung des Kerkers kann er auch den Verstand verlieren. Ist der Verstand aufgebraucht, _wird sein Geist auf die Probe gestellt_.\n\nAußerdem beginnt der Mönch mit _einer Peitsche_, Stoffrüstung, einem Wasserschlauch und einem Beutel.\n\nZu Beginn identifizierte Gegenstände:\n_-_ Geschwindigkeitstrank\n_-_ Wandlungs-, Identifikations- und Angst-Schriftrolle
actors.hero.heroclass.friar_unlock=_Besiege Yog-Dzewa in einem Spiel_, um den Mönch freizuschalten.
actors.buffs.reason.name=Verstand
actors.buffs.reason.desc_full=Dein Verstand ist vollkommen klar, zumindest vorerst.\n\n
actors.buffs.reason.desc_half=Du fühlst dich etwas benommen, aber es beeinträchtigt deine Handlungen nicht.\n\n
actors.buffs.reason.desc_quarter=Du hast rasende Kopfschmerzen und das Atmen fällt dir schwer.\n\n
actors.buffs.reason.desc_zero=Du stehst am Rande des Wahnsinns!\n\n
actors.buffs.reason.desc_simple=Auf der Erkundung des Kerkers zehren die Begegnung mit furchterregenden Feinden, das Treten in tödliche Fallen und der Kampf gegen den Hunger an deinem ohnehin knappen Verstand. Ist der Verstand erst aufgebraucht, wird dein Geist auf die Probe gestellt. Kommt zuerst die geistige Pein? Oder die edlen Eigenschaften, die nur in der Verzweiflung erblühen? Niemand weiß es.\n\nAber nicht alles ist beschwerlich: Beim Alchemisieren oder Befüllen der Alchemiespritze kannst du einen Teil deines Verstandes opfern, um die benötigte Alchemie-Energie aus dem Nichts zu erzeugen. Pro 1 Punkt Alchemie-Energie werden 5 Punkte Verstand verbraucht.\n\nVerstand regeneriert sich normalerweise nicht mit der Zeit. Die wichtigste Methode zur Wiederherstellung ist das Töten von Feinden, das Entdecken verborgener Geheimnisse und die Nahrungsaufnahme.\n\nAktueller Verstand: %s/100
actors.buffs.reason.half=Du fühlst dich etwas benommen, aber es ist nichts Ernstes.
actors.buffs.reason.quarter=Du hast rasende Kopfschmerzen, dein Verstand schwankt.
actors.buffs.reason.zero=Du stehst am Rande des Wahnsinns!
actors.buffs.reason.kaoyan=Dein Geist wird auf die Probe gestellt...
actors.buffs.reason.energize_name=Energie raffinieren
actors.buffs.reason.energize_desc=Du kannst bestimmte Gegenstände raffinieren, um sie in Alchemie-Energie umzuwandeln, darunter Tränke, Schriftrollen, Samen, Runensteine und andere alchemistische Gegenstände.\n\nDu kannst auch einen Teil deines Verstandes opfern, um die benötigte Alchemie-Energie zu erzeugen. Normalerweise werden pro 1 Punkt erzeugter Alchemie-Energie 5 Punkte Verstand verbraucht.\n\nAktueller Verstand: %s/100
actors.buffs.reason.energize_item=Wähle einen Gegenstand zum Raffinieren
actors.buffs.reason.energize_1=Wandle 5 Verstand in 1 Energie um
actors.buffs.reason.die=Du stirbst an Herzversagen...
actors.buffs.reason.rankings_desc=Gestorben an: Herzversagen
actors.buffs.suffering.name=Pein
actors.buffs.suffering.desc=Erhalte %s!
actors.buffs.suffering$fear.name=Pein: Angst
actors.buffs.suffering$fear.desc=Feigheit und Schwäche haben endlich ihr Opfer gepackt.\n\nWährend dieser Pein ist dein Ausweichen um 50%% erhöht, aber dein verursachter physischer Schaden um 25%% verringert.\n\nWirst du getroffen, besteht eine 30%% Chance auf zusätzliche 5 Verstandesverlust.\n\nDiese Pein hält noch %s Runden an. Das Töten von Feinden kann sie schneller beenden.\n\nFällt dein Verstand auf Null, stirbst du in qualvoller Pein.
actors.buffs.suffering$paranoia.name=Pein: Paranoia
actors.buffs.suffering$paranoia.desc=Manchmal kann man im Wahnsinn Erleuchtung finden, doch das kommt viel zu selten vor...\n\nWährend dieser Pein ist deine Angriffsgeschwindigkeit um 20%% erhöht, aber deine Präzision um 20%% verringert.\n\nVerfehlst du einen Angriff, besteht eine 30%% Chance auf zusätzliche 5 Verstandesverlust.\n\nDiese Pein hält noch %s Runden an. Das Töten von Feinden kann sie schneller beenden.\n\nFällt dein Verstand auf Null, stirbst du in qualvoller Pein.
actors.buffs.suffering$despair.name=Pein: Verzweiflung
actors.buffs.suffering$despair.desc=In dieser Hölle gibt es keine Hoffnung, nicht einen einzigen Funken.\n\nWährend dieser Pein ist deine Bewegungsgeschwindigkeit um 20%% erhöht, aber du kannst keinem Angriff ausweichen.\n\nDiese Pein hält noch %s Runden an. Das Töten von Feinden kann sie schneller beenden.\n\nFällt dein Verstand auf Null, stirbst du in qualvoller Pein.
actors.buffs.virtue.name=Tugend
actors.buffs.virtue.desc=Erhalte %s!
actors.buffs.virtue$firm.name=Tugend: Standhaftigkeit
actors.buffs.virtue$firm.desc=Viele mögen in Panik und Chaos verfallen, aber nicht dieser Mensch, nicht jetzt!\n\nWährend dieser Tugend erhältst du einen Schild in Höhe von 25%% deiner max. Lebenspunkte, der nicht natürlich verfällt. Überschüssige Lebensregeneration wird ebenfalls in einen nicht verfallenden Schild umgewandelt.\n\nAußerdem besteht bei jedem getöteten Feind eine 25%% Chance, zusätzlich 6 Verstand zu regenerieren.\n\nDiese Tugend hält noch %s Runden an. Das Töten von Feinden verlängert sie effektiv.\n\nFällt dein Verstand auf Null, erhältst du sofort 100 Verstand zurück, verlierst aber die Tugend.
actors.buffs.virtue$inspire.name=Tugend: Inspiration
actors.buffs.virtue$inspire.desc=Unendliches Leid kann auch Hoffnung gebären und Lebenskraft entfachen!\n\nDas Entfachen dieser Tugend bringt deinen Verstand in einen besseren Zustand.\n\nAußerdem besteht während dieser Tugend bei jedem getöteten Feind eine 25%% Chance, zusätzlich 10%% der max. Lebenspunkte zu regenerieren.\n\nDiese Tugend hält noch %s Runden an. Das Töten von Feinden verlängert sie effektiv.\n\nFällt dein Verstand auf Null, erhältst du sofort 100 Verstand zurück, verlierst aber die Tugend.
actors.buffs.virtue$fearless.name=Tugend: Furchtlosigkeit
actors.buffs.virtue$fearless.desc=Nur in der tiefsten, hoffnungslosesten Dunkelheit kann plötzlicher Mut das hellste Licht entfachen.\n\nWährend dieser Tugend ist deine Bewegungsgeschwindigkeit um 50%% erhöht.\n\nDarüber hinaus fürchtest du keine Dunkelheit und bist immun gegen Panik-Effekte.\n\nDiese Tugend hält noch %s Runden an. Das Töten von Feinden verlängert sie effektiv.\n\nFällt dein Verstand auf Null, erhältst du sofort 100 Verstand zurück, verlierst aber die Tugend.


actors.buffs.panic.name=Panik
actors.buffs.panic.desc=Welke Panik verschlingt den Geist!\n\nAngriffe von Untoten und Dämonen zehren nicht nur direkt an deinem Verstand, sondern können dir auch ungeheure Angst einjagen. Im Panik-Zustand verlierst du pro Runde 1-2 Verstand.\n\nDu brauchst noch %s Runden, um die Angst zu überwinden...
actors.buffs.panic.get=Du verspürst eine nie gekannte Angst!

actors.hero.talent.tranquil_tincture.title=Beruhigungs-Elixier
actors.hero.talent.tranquil_tincture.desc=_+1：_Der Mönch kann in den folgenden Dungeonebenen _2 Flaschen Beruhigungs-Elixier_ im Laden kaufen.\n\n_+2：_Der Mönch kann in den folgenden Dungeonebenen _3 Flaschen Beruhigungs-Elixier_ im Laden kaufen.
actors.hero.talent.tranquil_tincture.comment=Das Beruhigungs-Elixier kann schnell konsumiert werden, stellt eine geringe Sättigung wieder her, hebt Angsteffekte auf und gibt dem Mönch 50 Verstand zurück.

actors.buffs.erodingsoul.name=Seelenfraß
actors.buffs.erodingsoul.desc=Korruptionsmagie zerfrisst die Seele eines Wesens, selbst wenn es nicht korrumpiert ist.\n\nEin von diesem Effekt betroffenes Wesen verwandelt sich nach dem Tod mit 20% Wahrscheinlichkeit in einen korrupten Geist. Für jede bestehende Debuff-Wirkung (außer dieser selbst) erhöht sich diese Wahrscheinlichkeit um 5%.\n\nWird das Wesen vor dem Tod korrumpiert oder ist es todgeweiht, bleibt der Effekt bestehen und verwandelt es nach dem endgültigen Tod direkt in einen korrupten Geist.\n\nDieser Effekt hält permanent an, bis das Leben endet.

actors.hero.talent.eroding_soul.title=Seelenfraß
actors.hero.talent.eroding_soul.desc=_+1：_Erhalte _1 Korruptionszauberstab_. Zauber mit dem Korruptionszauberstab verursachen zusätzlich einen permanenten _Seelenfraß_-Effekt (wirkt nicht auf _Untote_).\n\n_+2：_Wie bei +1 (ohne Ressourcenerhalt) haben Zauber mit dem Korruptionszauberstab eine _50%ige Chance_, ein zusätzliches Debuff zu verursachen.
actors.hero.talent.eroding_soul.comment=Kreaturen mit Seelenfraß-Effekt haben eine _20% + Anzahl Debuffs x 5% Chance_, nach dem Tod zu einem korrumpierten Geist zu werden. Ist die Kreatur bereits korrumpiert oder todgeweiht, bleibt dieser Effekt bis zum endgültigen Tod erhalten.\n\nTalente, die durch Aufstieg oder Wandlung direkt Ressourcen gewähren, teilen sich _26 Auslösebegrenzungen_ (beim Gentleman _39_).

actors.hero.talent.credulous.title=Glaubensabkehr
actors.hero.talent.credulous.desc=_+1:_ Die Schriftrolle kann den Zauber _Glaubensabkehr_ wirken, der 1 Ladung verbraucht, um _10 Runden Magieimmunität_ zu gewähren.\n\n_+2:_ Zusätzlich zu +1 _kostet dieser Zauber keine Zeit_.
actors.hero.talent.credulous.comment=„Der Treulose muss bestraft werden."

actors.hero.talent.penetrating_cast.title=Durchdringung
actors.hero.talent.penetrating_cast.desc=_+1：_Direkt schadende Stab- oder Zauberstabzauber entfernen alle Debuffs des Gegners. Pro entfernter Debuff wird der Schaden dieses Zaubers um _10%_ erhöht.\n\n_+2：_Direkt schadende Zauber entfernen alle Debuffs des Gegners. Pro entfernter Debuff wird der Schaden um _20%_ erhöht.
actors.hero.talent.penetrating_cast.comment=„Durchschlage die am Gegner haftende Magie, und die verbleibende Energie dringt tief ins Fleisch ein.“

actors.hero.talent.bountiful_enhancement.title=Vorratsverstärkung
actors.hero.talent.bountiful_enhancement.desc=_+1:_ Das Essen aus dem Füllhorn gewährt _5 Runden Vorratssegen_.\n\n_+2:_ Zusätzlich zu +1 erhöht sich die Sättigungswiederherstellung pro Ladung des Füllhorns um _20 Punkte_.\n\n_+3:_ Die Sättigungswiederherstellung pro Ladung des Füllhorns erhöht sich um _30 Punkte_.
actors.hero.talent.bountiful_enhancement.comment=Wenn der Vorratssegen endet, wird _einmal ein Ess-Effekt ausgelöst_. Mehrmaliges Essen aus dem Füllhorn innerhalb kurzer Zeit erhöht nicht die Anzahl der Ess-Effekte am Ende des Vorratssegens.\n\n„Fülle bedeutet nicht nur mehr Nahrung, sondern auch geistige Erfüllung bei jedem Essen."
actors.hero.talent$delayedsatisfaction.name=Vorratssegen
actors.hero.talent$delayedsatisfaction.desc=Das Essen aus dem Füllhorn hat dir geistige Erfüllung gebracht. Die darin enthaltene Magie wird in %s Runden erneut einen Ess-Effekt auslösen.

actors.hero.talent.ice_hell.title=Eishölle
actors.hero.talent.ice_hell.desc=_+1：_Eiszauberstab-Angriffe gegen Feinde mit _Erfrierung_ haben _keinen Schadensabfall_ mehr.\n\n_+2：_Wie bei +1 verursachen Eiszauberstab-Angriffe gegen Feinde mit _Gefrierung_ _Zauberstablvl x4_ Magieschaden.\n\n_+3：_Wie bei +1 und +2 haben Eiszauberstab-Zauber eine _50%ige Chance_, am Zielort ein _3x3_ Kältefeld für _10 Runden_ zu erzeugen.
actors.hero.talent.ice_hell.comment=Kälte raubt nicht nur langsam die Wärme, sondern verwandelt den Raum in eine Hölle, die alles Leben gefriert.

actors.hero.talent.boss_talent_slot_1.title=Leeres Talent
actors.hero.talent.boss_talent_slot_1.desc=Schon beim Betreten dieses Verlieses hattest du ein ungutes Gefühl. Erst jetzt merkst du, dass einige deiner ursprünglichen Talente ausgelöscht wurden und nur eine Leere zurückblieb ...\n\nDoch wenn du die mächtigen Feinde in den Tiefen dieses Verlieses besiegst, wirst du noch stärkere Kräfte erlangen. Kurz gesagt, es bleibt dir nur, weiterzugehen.\n\nLies die Sublimations-Schriftrolle, die der Boss von _Etage 5_ fallen lässt, um dieses Talent in das entsprechende Boss-Talent zu sublimieren und einen zusätzlichen Talentpunkt für Etage 1 zu erhalten. Vorher kann dieses Talent weder aufgewertet noch metamorpbiert werden.
actors.hero.talent.boss_talent_slot_1.comment=
actors.hero.talent.boss_talent_slot_2.title=Leeres Talent
actors.hero.talent.boss_talent_slot_2.desc=Schon beim Betreten dieses Verlieses hattest du ein ungutes Gefühl. Erst jetzt merkst du, dass einige deiner ursprünglichen Talente ausgelöscht wurden und nur eine Leere zurückblieb ...\n\nDoch wenn du die mächtigen Feinde in den Tiefen dieses Verlieses besiegst, wirst du noch stärkere Kräfte erlangen. Kurz gesagt, es bleibt dir nur, weiterzugehen.\n\nLies die Sublimations-Schriftrolle, die der Boss von _Etage 10_ fallen lässt, um dieses Talent in das entsprechende Boss-Talent zu sublimieren und einen zusätzlichen Talentpunkt für Etage 2 zu erhalten. Vorher kann dieses Talent weder aufgewertet noch metamorpbiert werden.
actors.hero.talent.boss_talent_slot_2.comment=
