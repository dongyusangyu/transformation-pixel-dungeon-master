actors.hero.talent.boss_talent_slot_5.title=Leeres Talent
actors.hero.talent.boss_talent_slot_5.desc=Schon beim Betreten dieses Verlieses hattest du ein ungutes Gefühl. Erst jetzt merkst du, dass einige deiner ursprünglichen Talente ausgelöscht wurden und nur eine Leere zurückblieb ...\n\nDoch wenn du die mächtigen Feinde in den Tiefen dieses Verlieses besiegst, wirst du noch stärkere Kräfte erlangen. Kurz gesagt, es bleibt dir nur, weiterzugehen.\n\nLies die Sublimations-Schriftrolle, die der Boss von _Etage 25_ fallen lässt, um dieses Talent in das entsprechende Boss-Talent zu sublimieren und einen zusätzlichen Talentpunkt für Etage 3 zu erhalten. Vorher kann dieses Talent weder aufgewertet noch metamorpbiert werden.
actors.hero.talent.boss_talent_slot_5.comment=

actors.hero.spells.credulous.name=Glaubensabkehr
actors.hero.spells.credulous.short_desc=Erhält für einige Zeit Magieimmunität.
actors.hero.spells.credulous.desc=Der Zaubernde verzichtet kurzzeitig auf seine Magiewahrnehmung und erhält daher _10 Runden Magieimmunität_.\n\nDieser Zauber _verbraucht 1 Runde_.
actors.hero.spells.credulous.desc_instant=Dieser Zauber _kostet keine Zeit_ auf +2 Stufe.

actors.hero.talent.ravens_eye.title=Rabenauge
actors.hero.talent.ravens_eye.desc=_+1：_Der Mönch kann _30 Vernunft_ verbrauchen, um Gegenstände auf Flüche zu untersuchen.\n\n_+2：_Der Mönch kann _20 Vernunft_ verbrauchen.
actors.hero.talent.ravens_eye.comment=
actors.hero.talent.ravens_eye.meta_desc=_Wenn dieses Talent von einem anderen Helden erlangt wird_, kann er Gegenstände untersuchen, erleidet jedoch Blutung. Auf +1 erhält er Blutung mit einem Startwert von 6, auf +2 mit einem Startwert von 4.
actors.hero.talent.ravens_eye.action=Untersuchen


actors.hero.talent.crystal_gunpowder.title=Kristallpulver
actors.hero.talent.crystal_gunpowder.desc=_+1:_ Pro Punkt alchemistischer Energie verursacht der Mönch mit seinen physischen Angriffen _1 zusätzlichen Schaden_.\n\n_+2:_ Pro Punkt alchemistischer Energie verursacht der Mönch _2 zusätzlichen Schaden_.
actors.hero.talent.crystal_gunpowder.comment=Der zusätzliche Schadensbonus durch dieses Talent überschreitet bei _+1/+2_ nicht _2/4 Punkte_.
actors.hero.talent.bulwark_greatshield.title=Bollwerk-Großschild
actors.hero.talent.bulwark_greatshield.desc=_+1:_ Wenn der Mönch eine Waffe mit Parade ausrüstet, erhält er _10% physische Schadensreduzierung_.\n\n_+2:_ Der Mönch erhält _15% physische Schadensreduzierung_.
actors.hero.talent.bulwark_greatshield.comment=Waffen mit Parade-Eigenschaft umfassen Degen, Armschild, Eisenstab, Rundschild, Samurai-Schwert und Riesenschild.

actors.hero.talent.whispering_meal.title=Flüsternde Mahlzeit
actors.hero.talent.whispering_meal.desc=_+1：_Der Mönch isst in nur 1 Runde (Beruhigungs-Elixier kostet keine Runde) und verursacht bei Feinden in Sichtweite _2 Runden Angst_.\n\n_+2：_Der Mönch isst in nur 1 Runde (Beruhigungs-Elixier kostet keine Runde) und verursacht bei Feinden in Sichtweite _4 Runden Angst_.
actors.hero.talent.whispering_meal.comment=
actors.hero.talent.liquid_barrier.title=Flüssiger Schild
actors.hero.talent.liquid_barrier.desc=_+1：_Wenn der Mönch einen Trank, Magiertrank oder Geheimtrank trinkt oder wirft, erhält er _5 Runden_ Reinigungsschild.\n\n_+2：_Wenn der Mönch einen Trank, Magiertrank oder Geheimtrank trinkt oder wirft, erhält er _10 Runden_ Reinigungsschild.
actors.hero.talent.liquid_barrier.comment=Bei Verwendung von Stärke-, Erfahrungstränken oder daraus hergestellten alchemistischen Gegenständen verdoppelt sich die Dauer des Reinigungsschilds.\n\nBei ergiebigen alchemistischen Gegenständen (wie Wasserexplosionstränken) basiert die Auslösung auf der Stückzahl pro Herstellung.
actors.hero.talent.fast_reload.title=Schnelles Nachladen
actors.hero.talent.fast_reload.desc=_+1：_Der Mönch lädt die Alchemiespritze _ohne Zeitverbrauch_.\n\n_+2：_Wie bei +1 erhält der Mönch nach dem Laden _1 Runde_ Schattenblitz (Sofortteleportation).
actors.hero.talent.fast_reload.comment=
actors.hero.talent.fast_reload.meta_desc=_Wenn diese Fertigkeit von einem anderen Helden erhalten wird_, erhält er bei der Reparatur von Wurfwaffen mit Flüssigmetall einen Schattenblitz. Bei +1 für 1 Runde, bei +2 für 2 Runden.
actors.hero.talent.otherworld_bane.title=Jenseits-Bezwinger
actors.hero.talent.otherworld_bane.desc=_+1：_Nachdem der Mönch einen Gegner mit _Untoten- oder Dämonenattribut_ getötet hat, erhält er _2 Runden_ Nachtsicht.\n\n_+2：_Nachdem der Mönch einen Gegner mit _Untoten- oder Dämonenattribut_ getötet hat, erhält er _3 Runden_ Nachtsicht.
actors.hero.talent.otherworld_bane.comment=
actors.hero.talent.bullseye.title=Volltreffer
actors.hero.talent.bullseye.desc=_+1:_ Der Mönch hat beim Werfen von Wurfmessern oder Giftsalbe-Messern auf Feinde _50% zusätzliche Genauigkeit_ und verursacht _3 zusätzlichen Schaden_.\n\n_+2:_ Der Mönch hat beim Werfen _75% zusätzliche Genauigkeit_ und verursacht _5 zusätzlichen Schaden_.
actors.hero.talent.bullseye.comment=

actors.hero.talent.midas_touch.title=Midas Hand
actors.hero.talent.midas_touch.desc=_+1：_Der Mönch erhält _20 Flüssiggold_ und kann es in zufällige Tränke umwandeln.\n\n_+2：_Der Mönch erhält _40 Flüssiggold_ und kann es in zufällige Tränke umwandeln.\n\n_+3：_Der Mönch erhält _60 Flüssiggold_ und kann es in zufällige Tränke umwandeln.
actors.hero.talent.midas_touch.comment=Flüssiges Gold kann nicht in Stärketränke umgewandelt werden. Die Umwandlung in einen Trank verbraucht immer _20 Flüssiggold_.\n\nTalente, die durch Aufstieg oder Transformation direkt Ressourcen gewähren, teilen sich _26 Auslösebegrenzungen_ (_39_ für den Gentleman).
actors.hero.talent.human_glory.title=Glanz der Menschheit
actors.hero.talent.human_glory.desc=_+1：_Sinkt die Vernunft des Mönchs auf 0, steigt die Wahrscheinlichkeit, Tugend zu erhalten, von 25% auf _30%_.\n\n_+2：_Sinkt die Vernunft des Mönchs auf 0, steigt die Wahrscheinlichkeit, Tugend zu erhalten, von 25% auf _35%_.\n\n_+3：_Sinkt die Vernunft des Mönchs auf 0, steigt die Wahrscheinlichkeit, Tugend zu erhalten, von 25% auf _40%_.
actors.hero.talent.human_glory.comment=Hinweis: Eine höhere Tugendwahrscheinlichkeit bedeutet auch eine niedrigere Qualwahrscheinlichkeit. Auf Stufe _+1/+2/+3_ sinkt die Qualwahrscheinlichkeit von 75% auf _70/65/60%_.
actors.hero.talent.human_glory.meta_desc=_Wenn diese Fertigkeit von einem anderen Helden erhalten wird_, erhöht sie auf Stufe +1/+2/+3 die Genauigkeit und Ausweichrate um 10/20/30%.

actors.hero.herosubclass.alchemist=Alchemist
actors.hero.herosubclass.alchemist_short_desc=_Alchemisten_ haben einen geringeren Alchemie-Energieverbrauch und nutzen eine stärkere Alchemiespritze.
actors.hero.herosubclass.alchemist_desc=Der Alchemist ist im Alchemisieren geschickter. Bei der Herstellung alchemistischer Produkte, die Alchemie-Energie benötigen, reduziert sich der Verbrauch um 3 Punkte (mindestens 1 Punkt Verbrauch).\n\nDie Alchemiespritze des Alchemisten kann nun magischen Schaden verursachen, hat eine größere Sprühreichweite und stärkere Trank-Bestückungseffekte.\n\nIst der _Zufallsmodus_ aktiviert, erhält man beim Wählen dieser Spezialisierung eine Alchemiespritze, falls man keine besitzt.

actors.hero.talent.alchemy_shield.title=Alchemie-Barriere
actors.hero.talent.alchemy_shield.desc=_+1:_ Der Alchemist verbraucht beim Brauen 4 anstatt 3 Punkte alchemistische Energie und erhält nach jedem Verbrauch (einschließlich Nachladen der Spritze) _1 Schicht Alchemie-Barriere_.\n\n_+2:_ Der Alchemist verbraucht beim Brauen 5 anstatt 3 Punkte alchemistische Energie und erhält nach jedem Verbrauch (einschließlich Nachladen der Spritze) _2 Schichten Alchemie-Barriere_.\n\n_+3:_ Der Alchemist verbraucht beim Brauen 6 anstatt 3 Punkte alchemistische Energie und erhält nach jedem Verbrauch (einschließlich Nachladen der Spritze) _3 Schichten Alchemie-Barriere_.
actors.hero.talent.alchemy_shield.comment=Die Alchemie-Barriere reduziert den Schaden der nächsten Treffer basierend auf der vorhandenen alchemistischen Energie. Jeder Treffer reduziert eine Schicht, maximal 3 Schichten überlagerbar.
actors.hero.talent.close_blast.title=Naheexplosion
actors.hero.talent.close_blast.desc=_+1:_ Die Alchemie-Spritze des Alchemisten verursacht mehr Schaden, je näher das Ziel ist. Die maximale Entfernung verursacht keinen Bonus; pro Feld Nähe _10% zusätzlicher Schaden_, maximal _40%_.\n\n_+2:_ Pro Feld Nähe _15% zusätzlicher Schaden_, maximal _60%_.\n\n_+3:_ Pro Feld Nähe _20% zusätzlicher Schaden_, maximal _80%_.
actors.hero.talent.close_blast.comment=
actors.hero.talent.conservation.title=Sparsame Sitte
actors.hero.talent.conservation.desc=_+1:_ Die Alchemie-Spritze des Alchemisten hat beim Sprühen eine _10% Wahrscheinlichkeit_, keine Flüssigkeit zu verbrauchen, und nach dem Montieren eines Trankes eine _30% Wahrscheinlichkeit_, den Trank nicht zu verbrauchen.\n\n_+2:_ _20% Wahrscheinlichkeit_ kein Flüssigkeitsverbrauch, _45% Wahrscheinlichkeit_ kein Trankverbrauch.\n\n_+3:_ _30% Wahrscheinlichkeit_ kein Flüssigkeitsverbrauch, _60% Wahrscheinlichkeit_ kein Trankverbrauch.
actors.hero.talent.conservation.comment=Wenn dieses Talent aktiv ist, wird der Flüssigkeitsvorrat der Spritze bei montierten Tränken normal wieder aufgefüllt, während Stärketränke weder verbrauchen noch nachfüllen.
actors.hero.talent$alchemyshield.name=Alchemistische Barriere
actors.hero.talent$alchemyshield.desc=Eine Barriere aus alchemistischer Energie umgibt dich und schützt dich vor feindlichen Angriffen.\n\nJedes Mal, wenn du alchemistische Energie verbrauchst, erhältst du eine gewisse Anzahl an Schichten der alchemistischen Barriere, maximal 3. Unter dem Schutz der Barriere wird jeder physische Schaden von Feinden um 5 Punkte reduziert, plus 1 weiteren Punkt pro aktueller alchemistischer Energie, bis zu maximal 20 Punkten Reduzierung.\n\nBei deiner aktuellen alchemistischen Energie reduziert jede Schicht deiner Barriere %1$d physischen Schaden.\n\nDu hast noch %2$d Schichten der Barriere, von denen jede Treffer eine Schicht verbraucht.

actors.hero.herosubclass.pious=Frommer
actors.hero.herosubclass.pious_short_desc=Der _Fromme_ erhält einen Ritualdolch für schnelle Angriffe, der Verstand regenerieren oder reduzieren kann. Zudem erhält er eine neue Pein, die alle vorherigen ersetzt.
actors.hero.herosubclass.pious_desc=Der Fromme erhält einen Ritualdolch, der ohne Ausrüstung direkt verwendet werden kann. Angriffe mit dem Ritualdolch verursachen einen permanenten Blutgeschenk-Effekt. Gegner mit diesem Effekt stellen beim Verlust von Lebenspunkten eine geringe Menge Verstand des Frommen wieder her. Nach dem Töten einer bestimmten Anzahl von Gegnern kann der Fromme einen garantiert treffenden Stich ohne Zeitverbrauch ausführen. Beim Stechen in einen Gegner wird viel Verstand regeneriert, beim Stechen in sich selbst wird viel Verstand verbraucht.\n\nWenn der Verstand des Frommen auf 0 fällt, erhält er ebenfalls Pein oder Tugenden. Anders als andere erhält er eine neue Pein, die alle vorherigen ersetzt. Neue Pein: Ekstase – erhöht stark den verursachten physischen Schaden und die Angriffsgeschwindigkeit, reduziert aber stark das Ausweichen.\n\nDiese Spezialisierung hat eine Spezialfähigkeit, wenn der Ritualdolch bereit ist. Bei mehreren Spezialfähigkeiten kann durch langes Drücken des Kurzbefehls gewechselt werden. Ist der _Zufallsmodus_ aktiviert, erhält man beim Wählen dieser Spezialisierung die Verstand-Fähigkeit, jedoch nur mit eingeschränkter Regeneration und Reduktion bei Interaktionen mit bestimmten Gegenständen und Umgebungen, ohne Umwandlung in Alchemie-Energie.

actors.buffs.suffering$ecstasy.name=Pein: Ekstase
actors.buffs.suffering$ecstasy.desc=Wahnsinn, mein alter Freund!\n\nWährend dieser Pein ist deine Angriffsgeschwindigkeit um 50%% erhöht, dein verursachter physischer Schaden um 30%%, aber dein Ausweichen um 50%% verringert.\n\nDiese Pein hält noch %s Runden an. Das Töten von Feinden kann sie schneller beenden.\n\nFällt dein Verstand auf Null, stirbst du in endloser Raserei.

actors.hero.talent.never_compromise.title=Kein Kompromiss
actors.hero.talent.never_compromise.desc=_+1：_Wenn der Gläubige im _Folter- oder Tugendzustand_ ist, stirbt er bei tödlichem Schaden nicht sofort, sondern erhält den _Sterbend_-Effekt, während die Dauer von Folter um _50 Runden_ verlängert oder von Tugend verkürzt wird.\n\n_+2：_Wenn der Gläubige im _Folter- oder Tugendzustand_ ist, stirbt er bei tödlichem Schaden nicht sofort, sondern erhält den _Sterbend_-Effekt, während die Dauer von Folter um _40 Runden_ verlängert oder von Tugend verkürzt wird.\n\n_+3：_Wenn der Gläubige im _Folter- oder Tugendzustand_ ist, stirbt er bei tödlichem Schaden nicht sofort, sondern erhält den _Sterbend_-Effekt, während die Dauer von Folter um _30 Runden_ verlängert oder von Tugend verkürzt wird.
actors.hero.talent.never_compromise.comment=Während des Sterbens, wenn Folter oder Tugend noch aktiv sind, bleibt bei jedem tödlichen Treffer 1 Lebenspunkt erhalten, und die Dauer von Folter wird verlängert oder die von Tugend verkürzt. Der Tod tritt dennoch ein, wenn die Vernunft während der Folter auf Null fällt (Herzversagen). Nach Ablauf von Folter oder Tugend wird der Zustand in eine 100 Runden andauernde schwere Verletzung umgewandelt (einige Attribute reduziert).
actors.hero.talent.rewind_time.title=Zeit zurückdrehen
actors.hero.talent.rewind_time.desc=_+1：_Wenn die Vernunft des Gläubigen während der Folter unter 20 fällt, stellt er sofort _30 Vernunft_ wieder her und entfernt bestehende Panik-Effekte.\n\n_+2：_Stellt _40 Vernunft_ wieder her.\n\n_+3：_Stellt _50 Vernunft_ wieder her.
actors.hero.talent.rewind_time.comment=Dieses Talent _hat 50 Runden Abklingzeit_.
actors.hero.talent$rewindtimeused.name=Zeit zurückdrehen - Abklingzeit
actors.hero.talent$rewindtimeused.desc=Du hast gerade erst eine Verschnaufpause vom Wahnsinn bekommen und musst eine Weile warten, bevor du dieses Talent erneut auslösen kannst.\n\nVerbleibende Abklingzeit: %s Runden
actors.hero.talent.bright_warrior.title=Lichtkrieger
actors.hero.talent.bright_warrior.desc=_+1:_ Die Verlängerung der Tugenddauer durch das Töten von Feinden während der Tugend wird von 3 Runden auf _6 Runden_ erhöht.\n\n_+2:_ Verlängerung auf _9 Runden_.\n\n_+3:_ Verlängerung auf _12 Runden_.
actors.hero.talent.bright_warrior.comment=

actors.hero.talent$dyingwill.name=Todeswille
actors.hero.talent$dyingwill.desc=Dein Leben hängt an einem seidenen Faden.\n\nDank deines starken Willens kannst du einige tödliche Treffer überleben, aber nach Ablauf der Qual oder Tugend erleidest du eine lange Phase schwerer Verletzungen.\n\nTod durch Herzversagen aufgrund von Vernunftverlust während der Qual kann dadurch nicht verhindert werden.
actors.hero.talent$dyingwill.get=Dein starker Wille hat den Tod abgelehnt!
actors.hero.talent$dyingwill.heavy_wound=Schwere Verletzung
actors.hero.talent$dyingwill.heavy_wound_log=Du fühlst dich etwas überfordert ...
actors.hero.talent$heavywound.name=Schwere Verletzung
actors.hero.talent$heavywound.desc=Dein Körper ist schwer gezeichnet.\n\nWährend der schweren Verletzung verursachst du -50%% physischen Schaden, Genauigkeit und Ausweichen sind um -30%% reduziert.\n\nBis zur vollständigen Genesung dauert es noch %s Runden.

actors.hero.abilities.friar.concentratedpotion.name=Konzentrierter Trank
actors.hero.abilities.friar.concentratedpotion.short_desc=Der Mönch kann seine Alchemiespritze mit einem _Konzentrierten Trank_ bestücken, der die Reserve auffüllt und die nächste Sprühwirkung verstärkt.
actors.hero.abilities.friar.concentratedpotion.desc=Der Mönch kann seine Alchemiespritze zusätzlich mit einem Konzentrierten Trank bestücken, der 6 Punkte Flüssigkeitsreserve auffüllt und die nächste Sprühwirkung um 2 Stufen verbessert.\n\nDas Bestücken des Konzentrierten Tranks kostet 1 Runde.
actors.hero.abilities.friar.concentratedpotion.no_spraygun=Du benötigst eine Alchemiespritze, um einen Konzentrierten Trank zu bestücken.

actors.hero.talent.concentrated_essence.title=Konzentriertes Essenz
actors.hero.talent.concentrated_essence.desc=_+1:_ Nachdem der Mönch der Alchemie-Spritze einen konzentrierten Trank zugefügt hat, löst die nächste Spritze einen _zusätzlichen, anderen zufälligen Montage-Effekt_ aus.\n\n_+2:_ Die nächste Spritze löst _zwei_ zusätzliche Effekte aus.\n\n_+3:_ Die nächste Spritze löst _drei_ zusätzliche Effekte aus.\n\n_+4:_ Die nächste Spritze löst _vier_ zusätzliche Effekte aus.
actors.hero.talent.concentrated_essence.comment=Wenn dieses Talent mit Flüssigfeuer-Trank ausgerüstet ist, löst es keine Frosttrank-Effekte aus, und umgekehrt. Sind beide nicht ausgerüstet, erscheint beim zufälligen Mischen nur einer von beiden.
actors.hero.talent.reagent_enhancement.title=Verstärkung der Reagenz
actors.hero.talent.reagent_enhancement.desc=_+1：_Nachdem der Mönch einen konzentrierten Trank in die Alchemiespritze eingelegt hat, ist der nächste Sprüheffekt _um 3 Stufen erhöht_.\n\n_+2：_Um 4 Stufen erhöht_.\n\n_+3：_Um 5 Stufen erhöht_.\n\n_+4：_Um 6 Stufen erhöht_.
actors.hero.talent.reagent_enhancement.comment=
actors.hero.talent.reuse_reagent.title=Wiederverwertung
actors.hero.talent.reuse_reagent.desc=_+1：_Wenn der Mönch einen konzentrierten Trank bei einem Flüssigkeitsstand über 6 einlegt, reduziert sich der Aufladungsverbrauch dieser Einlage _um 16%_.\n\n_+2：_Reduziert sich _um 30%_.\n\n_+3：_Reduziert sich _um 40%_.\n\n_+4：_Reduziert sich _um 50%_.
actors.hero.talent.reuse_reagent.comment=



actors.hero.abilities.friar.holyprayer.name=Heiliges Gebet
actors.hero.abilities.friar.holyprayer.short_desc=Der Mönch spricht ein _Heiliges Gebet_, um sich und seinen Verbündeten einen mächtigen Segen zu verleihen.
actors.hero.abilities.friar.holyprayer.desc=Der Mönch spricht ein heiliges Gebet, um den Segen des Lichts für sich und seine Verbündeten zu erbitten. Der heilige Segen hält 30 Runden.\n\nErhält der Mönch den Segen und besitzt bereits eine Tugend, wird diese um 50 Runden verlängert und er erhält zusätzlich 50% Präzision und Ausweichen.\n\nErhalten Verbündete den Segen, werden 20% ihrer max. Lebenspunkte wiederhergestellt und sie erhalten zusätzlich 100% Präzision und Ausweichen.
actors.hero.abilities.friar.holyprayer.cast=Mögen wir im Licht den Sieg erringen!

actors.hero.abilities.friar.holyprayer$holyprayerblessing.name=Heiliger Segen
actors.hero.abilities.friar.holyprayer$holyprayerblessing.desc=Der Weg ist erleuchtet, der Gang ist klar. Wir brauchen nur die Kraft, ihm zu folgen.\n\nDer Mönch hat für sich und seine Verbündeten gebetet. Nun beschützt das heilige Licht alle. Während des Segens sind Präzision und Ausweichen des Mönchs um 50%% erhöht, die von Verbündeten um 100%%.\n\nDer heilige Segen hält noch %s Runden. Nutze diesen Schwung für den letzten Vorstoß!
actors.hero.abilities.friar.holyprayer$holyprayerblessing.desc_bane=Der Weg ist erleuchtet, der Gang ist klar. Wir brauchen nur die Kraft, ihm zu folgen.\n\nDer Mönch hat für sich und seine Verbündeten gebetet. Nun beschützt das heilige Licht alle. Während des Segens sind Präzision und Ausweichen des Mönchs um 50%% erhöht, die von Verbündeten um 100%%.\n\nZudem wird unter diesem Segen der gegen Untote und Dämonen verursachte physische Schaden von Mönch und Verbündeten um %1$s%% erhöht.\n\nDer heilige Segen hält noch %2$s Runden. Nutze diesen Schwung für den letzten Vorstoß!

actors.hero.talent.pious_faith.title=Frommer Glaube
actors.hero.talent.pious_faith.desc=_+1：_Nach dem Heiligen Lichtgebet stellt der Mönch _25 Vernunft_ wieder her.\n\n_+2：_Nach dem Gebet stellt der Mönch _50 Vernunft_ wieder her.\n\n_+3：_Nach dem Gebet stellt der Mönch _75 Vernunft_ wieder her.\n\n_+4：_Nach dem Gebet stellt der Mönch _100 Vernunft_ wieder her.
actors.hero.talent.pious_faith.comment=Überschüssige Vernunft-Wiederherstellung dieses Talents wird in Lebensregeneration umgewandelt.
actors.hero.talent.supreme_blessing.title=Höchster Segen
actors.hero.talent.supreme_blessing.desc=_+1：_Nach dem heiligen Lichtgebet des Mönchs erhöht sich die Verlängerung vorhandener Tugenden auf _75 Runden_, die Lebensregeneration für Verbündete auf _40%_ der maximalen Gesundheit.\n\n_+2：_Nach dem heiligen Lichtgebet des Mönchs erhöht sich die Verlängerung vorhandener Tugenden auf _100 Runden_, die Lebensregeneration für Verbündete auf _60%_ der maximalen Gesundheit.\n\n_+3：_Nach dem heiligen Lichtgebet des Mönchs erhöht sich die Verlängerung vorhandener Tugenden auf _125 Runden_, die Lebensregeneration für Verbündete auf _80%_ der maximalen Gesundheit.\n\n_+4：_Nach dem heiligen Lichtgebet des Mönchs erhöht sich die Verlängerung vorhandener Tugenden auf _150 Runden_, die Lebensregeneration für Verbündete auf _100%_ der maximalen Gesundheit.
actors.hero.talent.supreme_blessing.comment=
actors.hero.talent.hatred_of_evil.title=Hass auf das Böse
actors.hero.talent.hatred_of_evil.desc=_+1：_Der Mönch und seine Verbündeten verursachen während des Segens des Heiligen Lichts gegen _Untote und Dämonen_ _30% mehr_ physischen Schaden.\n\n_+2：_Der Mönch und seine Verbündeten verursachen während des Segens des Heiligen Lichts gegen _Untote und Dämonen_ _40% mehr_ physischen Schaden.\n\n_+3：_Der Mönch und seine Verbündeten verursachen während des Segens des Heiligen Lichts gegen _Untote und Dämonen_ _50% mehr_ physischen Schaden.\n\n_+4：_Der Mönch und seine Verbündeten verursachen während des Segens des Heiligen Lichts gegen _Untote und Dämonen_ _60% mehr_ physischen Schaden.
actors.hero.talent.hatred_of_evil.comment=

actors.hero.abilities.friar.reasondose.name=Verstandesspritze
actors.hero.abilities.friar.reasondose.short_desc=Der Mönch injiziert sich eine _Verstandesspritze_, um viel Verstand wiederherzustellen und Panik zu beenden.
actors.hero.abilities.friar.reasondose.desc=Der Mönch injiziert sich eine Verstandesspritze, stellt 50 Verstand wieder her und beendet sofort den Panik-Effekt.\n\nDie Injektion kostet keine Zeit.
actors.hero.abilities.friar.reasondose.cast=Der Schmerz lässt augenblicklich nach...

actors.hero.talent.heart_dose.title=Herzstärkende Spritze
actors.hero.talent.heart_dose.desc=_+1：_Nach einer Injektion erholt der Mönch zusätzlich _10% der max. LP_.\n\n_+2：_Nach einer Injektion erholt der Mönch zusätzlich _15% der max. LP_.\n\n_+3：_Nach einer Injektion erholt der Mönch zusätzlich _20% der max. LP_.\n\n_+4：_Nach einer Injektion erholt der Mönch zusätzlich _25% der max. LP_.
actors.hero.talent.heart_dose.comment=
actors.hero.talent.shield_dose.title=Schild-Serum
actors.hero.talent.shield_dose.desc=_+1：_Nach der Injektion eines Serums erhält der Mönch zusätzlich _20 Schildpunkte_.\n\n_+2：_Erhält _30 Schildpunkte_.\n\n_+3：_Erhält _40 Schildpunkte_.\n\n_+4：_Erhält _50 Schildpunkte_.
actors.hero.talent.shield_dose.comment=
actors.hero.talent.calm_dose.title=Beruhigungsdosis
actors.hero.talent.calm_dose.desc=_+1:_ Nach der Injektion einer Spritze entfernt der Mönch sofort alle eigenen negativen Effekte und erhält _3 Runden vollständige Reinigung_.\n\n_+2:_ Er erhält _5 Runden vollständige Reinigung_.\n\n_+3:_ Er erhält _8 Runden vollständige Reinigung_.\n\n_+4:_ Er erhält _10 Runden vollständige Reinigung_.
