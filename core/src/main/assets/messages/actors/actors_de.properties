actors.hero.abilities.cleric.trinity.max_drone=Bereits 10 Drohnen produziert, die maximale Produktionsgrenze ist erreicht. Dreifaltigkeit kann keine weiteren produzieren.
levels.minigame.extraction.overburden.name=Extraktionslast
levels.minigame.extraction.overburden.desc=Die Last der Beute drückt auf die Bewegungsbeschleunigung der Ausrüstung. Jeder belegte Inventarplatz reduziert die verbleibende Ausrüstungsbeschleunigung um ein Drittel; Behälter und Wasserschläuche zählen nicht zur Last.\n\nBelegte Inventarplätze：%d\nBeibehaltene Ausrüstungsbeschleunigung：%d%%
levels.minigame.extraction.extractionraidrun.session_name=Extraktionsauftrag
levels.minigame.extraction.extractionraidrun.session_desc=Dieser Auftrag zeichnet die aktuelle Extraktionsrunde auf. Du kannst ihn nutzen, um die Runde freiwillig aufzugeben, was jedoch den gleichen Semi-Hardcore-Verlust wie beim Tod auslöst.
levels.minigame.extraction.extractionraidrun.missing_key=Das Evakuierungsgerät reagiert nicht. Du brauchst noch einen Kristallschlüssel.
levels.minigame.extraction.extractionraidrun.extract_title=Evakuierungspunkt
levels.minigame.extraction.extractionraidrun.extract_body=Das Evakuierungsgerät erkennt %d Kristallschlüssel. Jetzt evakuieren und die Beute dieser Runde sichern?
levels.minigame.extraction.extractionraidrun.extract=Sofort evakuieren
levels.minigame.extraction.extractionraidrun.continue_raid=Weitersuchen
levels.minigame.extraction.extractionraidrun.success=Evakuierung erfolgreich. Die Beute dieser Runde wurde in sichere Gegenstände umgewandelt.
levels.minigame.extraction.extractionraidrun.success_bonus=Evakuierung erfolgreich. Überschüssige Kristallschlüssel wurden für %d Goldmünzen eingetauscht.
levels.minigame.extraction.extractionraidrun.failure=Evakuierung fehlgeschlagen：%1$d Gruppen Beute und %2$d normale Verbrauchsgüter verloren.
levels.minigame.extraction.extractionraidrun.abandon_action=Extraktion aufgeben
levels.minigame.extraction.extractionraidrun.abandon_title=Runde aufgeben?
levels.minigame.extraction.extractionraidrun.abandon_body=Ohne Evakuierung über den Extraktionspunkt verlierst du alle markierten Gegenstände dieser Runde und 1 bis 2 zufällige normale Verbrauchsgüter.
levels.minigame.extraction.extractionraidrun.abandon=Verlust einkalkulieren
