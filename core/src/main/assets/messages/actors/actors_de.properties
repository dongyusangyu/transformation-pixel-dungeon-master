###blobs
actors.blobs.blizzard.name=Blizzard
actors.blobs.blizzard.desc=Hier tobt ein Schneesturm.

actors.blobs.confusiongas.name=Betäubungsgas
actors.blobs.confusiongas.desc=Eine Wolke aus Verwirrungsgas wirbelt hier herum.

actors.blobs.electricity.name=Elektrisches Feld
actors.blobs.electricity.desc=Ein elektrisches Feld wirft hier helle Funken.
actors.blobs.electricity.rankings_desc=Durch Stromschlag getötet
actors.blobs.electricity.ondeath=Ein Stromschlag hat dich erledigt...

actors.blobs.fire.name=Feuer
actors.blobs.fire.desc=Hier wütet ein Feuer.

actors.blobs.foliage.name=Laub
actors.blobs.foliage.desc=Lichtstrahlen durchbrechen die Finsternis des unterirdischen Gartens.

actors.blobs.freezing.name=Eis
actors.blobs.freezing.desc=Die Luft ist unnatürlich kalt hier.

actors.blobs.goowarn.name=Dunkle Energie
actors.blobs.goowarn.desc=Partikel dunkler Energie schwärmen hier umher!

actors.blobs.inferno.name=Höllenfeuer
actors.blobs.inferno.desc=Hier wütet ein Inferno.

actors.blobs.paralyticgas.name=Lähmungsgas
actors.blobs.paralyticgas.desc=Eine Wolke aus Lähmungsgas wirbelt hier herum.

actors.blobs.regrowth.name=Nachwachsen

actors.blobs.sacrificialfire.name=Opferfeuer
actors.blobs.sacrificialfire.desc=Hier ist ein Altar mit einer darauf brennenden Opferflamme. Jede Kreatur, die hier getötet wird, wird von den Flammen als ein Opfer für die Geister des Dungeons verzehrt.\n\nVielleicht gibt es eine Belohnung, wenn genügend Opfer dargebracht worden sind?
actors.blobs.sacrificialfire.worthy=Das Feuer verzehrt deine Opfergabe und wird größer.
actors.blobs.sacrificialfire.unworthy=Das Feuer verzehrt deine Opfergabe, es verändert sich aber nicht.
actors.blobs.sacrificialfire.reward=Das Feuer erstrahlt hell und löst sich dann auf; zurück bleibt eine Belohnung!

actors.blobs.smokescreen.name=Rauchwand
actors.blobs.smokescreen.desc=Hier wirbelt eine dicke, schwarze Rauchwolke herum.

actors.blobs.stenchgas.name=Gestankgas
actors.blobs.stenchgas.desc=Eine übelriechende Wolke hängt hier schwer in der Luft.

actors.blobs.stormcloud.name=Sturmwolke
actors.blobs.stormcloud.desc=Hier wabert eine Wolke aus Wasserdampf herum.

actors.blobs.toxicgas.name=Giftgas
actors.blobs.toxicgas.desc=Eine grünliche Wolke aus toxischen Gasen wirbelt hier herum.
actors.blobs.toxicgas.rankings_desc=Erstickt
actors.blobs.toxicgas.ondeath=Du bist durch das giftige Gas gestorben...

actors.blobs.corrosivegas.name=Ätzsäurenebel
actors.blobs.corrosivegas.desc=Hier wirbelt eine Wolke aus tödlich ätzendem Gas herum.

actors.blobs.waterofawareness.name=Quelle der Erkenntnis
actors.blobs.waterofawareness.procced=Als du einen Schluck nimmst, spürst du, wie sich dein Geist mit Erkenntnis füllt.
actors.blobs.waterofawareness.desc=Die Macht des Wissens strahlt aus dem Wasser dieses Brunnens. Von ihm zu trinken wird alle getragenen Gegenstände vollständig identifizieren, Flüche auf allen Gegenständen im Inventar identifizieren und alle Gegenstände in der aktuellen Ebene offenbaren.

actors.blobs.waterofhealth.name=Quelle des Lebens
actors.blobs.waterofhealth.procced=Als du einen Schluck nimmst, fühlst du, wie alle deine Wunden verheilen.
actors.blobs.waterofhealth.desc=Die Kraft der Gesundheit wird vom Wasser dieses Brunnens ausgestrahlt. Trinke aus diesem Brunnen, um deine Wunden zu heilen, deinen Hunger zu stillen und Flüche von allen getragenen Gegenständen zu brechen.

actors.blobs.web.name=Spinnennetz
actors.blobs.web.desc=Dicke Spinnweben bedecken hier alles. Die Spinnweben werden durch alles, was sie berührt oder durch sie hindurchgeworfen wird, zerstört, aber der betroffene Gegenstand bleibt an der Stelle hängen.




###buffs
actors.buffs.swiftthistle$timebubble.name=Zeitblase
actors.buffs.swiftthistle$timebubble.desc=Eine Blase, die den Zeitablauf beschleunigt.\n\nDu kannst in der Blase mehrere Aktionen sofort ausführen, aber Angriffe oder Zauber unterbrechen diesen Effekt.\n\nVerbleibende Dauer: %s Runden

actors.buffs.timekeepershourglass$timestasis.name=Zeitstase
actors.buffs.timekeepershourglass$timestasis.desc=Du lässt deine eigene Zeit völlig stillstehen, während die Zeit um dich herum weiterfließt. Im Stillstand kannst du dich nicht bewegen, bist aber nahezu unbeeinflusst von der Außenwelt.\n\nVerbleibende Dauer: %s Runden

actors.buffs.timekeepershourglass$timefreeze.name=Zeitstillstand
actors.buffs.timekeepershourglass$timefreeze.desc=Die Zeit außerhalb wurde eingefroren. Du kannst jetzt in einem Augenblick jede beliebige Aktion ausführen. Dieser Zustand hält an, bis du ihn aufhebst oder deine Sanduhr keine Ladung mehr hat. Angriffe oder Magie beenden den Effekt ebenfalls.\n\nBis zum nächsten Ladungsverbrauch: %s Runden

actors.buffs.adrenaline.name=Adrenalin
actors.buffs.adrenaline.desc=Ein Kraftschub, welcher Adrenalin freigibt und so Angriffs- und Bewegungsgeschwindigkeit verstärkt.\n\nDas so freigegebene Adrenalin ermöglicht es dem Anwender, die doppelte Angriffs- und 1,5-fache Bewegungsgeschwindigkeit zu entfalten\n\nVerbleibende Züge: %s

actors.buffs.adrenalinesurge.name=Stärkebonus
actors.buffs.adrenalinesurge.desc=Eine plötzlicher Anstieg großer Macht, leider jedoch nicht von Dauer.\n\nStärkebonus +%d.\nZüge bis zum  Abklingen: %s.

actors.buffs.amok.name=Amok
actors.buffs.amok.desc=Amok erzeugt einen Zustand des Zorns und Verwirrung in jenen, die ihm ausgesetzt werden. \n\nSolange eine Kreatur Amok läuft, wird diese alles angreifen, was in ihrer Nähe ist, egal ob Freund oder Feind. \n\nVerbleibende Züge mit Amok: %s.

actors.buffs.arcanearmor.name=arkane Rüstung
actors.buffs.arcanearmor.desc=Ein feiner Schild umgibt dich, welcher den Schaden von magischen Angriffen verringert.\n\nDeine magische Rüstung ist momentan verstärkt um: 0-%d.\n\nZüge, bis die magische Rüstung vergeht: %s.

actors.buffs.artifactrecharge.name=Artefaktaufladung
actors.buffs.artifactrecharge.desc=Energie durchströmt dich und erhöht die Aufladegeschwindigkeit deiner ausgerüsteten Artefakte.\n\nDieser Effekt betrifft Artefakte unterschiedlich stark, jedoch wird jedes Artefakt schneller aufgeladen als normal.\n\nVerbleibende Züge: %s.

actors.buffs.ascensionchallenge.name=Fluch des Amuletts
actors.buffs.ascensionchallenge.desc=Irgendwie erhält Yog-Dzewa durch das Amulett seinen Einfluss auf diese Welt aufrecht und versucht, deinen Aufstieg zu verhindern!\n\nYog-Dzewas Einfluss macht das Dungeon wesentlich gefährlicher - dadurch wächst die Zahl der Gegner und sie werden stärker! Diese Macht wird weiter wachsen, wenn nichts dagegen unternommen wird. Sie kann eingedämmt werden, wenn man Gegner besiegt, welche durch die Macht Yog-Dzewas verstärkt worden sind.
actors.buffs.ascensionchallenge.desc_clear=Die dunkle Energie, die von dem Amulett ausgestrahlt wird, ist einstweilen, so gut es möglich ist, geschwächt.
actors.buffs.ascensionchallenge.desc_beckon=Das Amulett _ruft gerade entfernte Gegner herbei_ und führt sie zu deiner Position.
actors.buffs.ascensionchallenge.desc_haste=Das Amulett _beschleunigt jetzt entfernte Gegner,_ so dass sie schneller zu dir kommen!
actors.buffs.ascensionchallenge.desc_slow=Das Amulett _verlangsamt dich_ gerade, so dass Effekte der Geschwindigkeitserhöhung negiert werden!
actors.buffs.ascensionchallenge.desc_damage=Die von dem Amulett abgestrahlte Energie ist so stark geworden, dass sie dir _direkt schadet!_
actors.buffs.ascensionchallenge.beckon=Das Amulett ruft nun weit entfernte Gegner herbei.
actors.buffs.ascensionchallenge.haste=Das Amulett beschleunigt nun weit entfernte Gegner!
actors.buffs.ascensionchallenge.slow=Das Amulett fühlt sich in deinen Habseligkeiten nun an wie ein bleiernes Gewicht!
actors.buffs.ascensionchallenge.damage=Das Amulett beginnt, dunkle Energie auszustrahlen. Es brennt!
actors.buffs.ascensionchallenge.weaken_info_no_kills=Besiegst du Feinde, wird der Fluch des Amuletts geschwächt!
actors.buffs.ascensionchallenge.weaken_info=Du musst Feinde besiegen, um den Fluch des Amuletts zu schwächen!
actors.buffs.ascensionchallenge.weaken=Du spürst, wie der Fluch des Amuletts etwas nachlässt.
actors.buffs.ascensionchallenge.break=Du nimmst dir etwas Zeit, um Atem zu schöpfen, und spürst, wie deine Wunden zu heilen beginnen!
actors.buffs.ascensionchallenge.almost=Du spürst, wie Yog-Dzewas Macht über das Amulett schwächer wird, du hast es fast geschafft!
actors.buffs.ascensionchallenge.on_kill=Die dunkle Energie verschlingt dich...

actors.buffs.barkskin.name=Rindenhaut
actors.buffs.barkskin.desc=Deine Haut ist gehärtet, sie fühlt sich rau und fest an wie Rinde.\n\nDie gehärtete Haut erhöht deine effektive Rüstung, wodurch du dich besser gegen physische Angriffe verteidigen kannst.\n\nDeine Rüstung ist derzeit erhöht um: 0-%d.\nVerbleibende Züge bis zur Schwächung der Rindenhaut: %s.\n\nFalls du Rindenhaut von mehreren Quellen erhältst, wirkt sich nur die stärkste aus.

actors.buffs.barrier.name=Barriere
actors.buffs.barrier.desc=Eine dauerhafte Kraftblase, die jeglichen Schaden blockiert.\n\nDie Barriere übernimmt den Schaden für alles, was sie schützt, solange noch Abschirmung vorhanden ist. Die Abschirmung wird jedoch mit der Zeit langsam abgebaut.\n\nVerbleibende Abschirmung: %d.

actors.buffs.berserk.angered=verärgert
actors.buffs.berserk.berserk=rasend
actors.buffs.berserk.exhausted=erschöpft
actors.buffs.berserk.recovering=sich erholend
actors.buffs.berserk.angered_desc=Die Schwere der Verletzungen des Berserkers verstärkt seine Angriffe. Wenn der Berserker physischen Schaden nimmt, baut sich seine Wut auf und verleiht ihm zusätzlichen Schaden auf seine Angriffe. Auch Schaden, der von der Rüstung absorbiert wird, steigert die Wut.\n\nDiese Wut nimmt jedoch mit der Zeit ab. Je niedriger die Lebenspunkte, desto länger hält sie an.\n\nBei 100%% Wut kann der Berserker in Rage verfallen, wodurch er das Doppelte des maximalen Schutzes seines Siegels bekommt bis hin zum Sechsfachen bei sehr niedrigen Lebenspunkten. Dieser Schutz verfällt mit der Zeit, und sobald er verschwunden ist, muss der Berserker ausruhen, ehe er wieder Wut aufbauen kann.\n\nDerzeitige Wut: _%.0f%%_\n_+%.0f%%_ Schaden
actors.buffs.berserk.action_speed=_+%.0f%%_ Aktionsgeschwindigkeit
actors.buffs.berserk.berserk_desc=Furcht und Unsicherheit verblassen, nur der blanke Zorn bleibt. Dieser Zustand verleiht dem Berserker große Macht: _Er teilt 50% mehr Schaden aus und die Stärke seines Schilds wächst._\n\nDieser Schildbonus entspricht 2x dem maximalen Schild seines Siegels, und erhöht sich bis auf 6x, wenn der Berserker nur noch wenige Lebenspunkte hat. Sobald der Schild auf 0 gefallen ist, endet die Raserei.\n\nDer Berserker muss nun eine Zeitlang ruhen, bis sich seine Wut wieder aufbauen kann.
actors.buffs.berserk.recovering_desc=Innere Stärke hat ihre Grenzen. Der Berserker muss sich ausruhen, bevor er sich wieder in Rage bringen kann.\n\nWährend der Berserker sich erholt, erzeugt erlittener Schaden keine Wut.
actors.buffs.berserk.recovering_desc_turns=Züge bis zur Genesung: _%d_
actors.buffs.berserk.recovering_desc_levels=Level bis zur Erholung: _%.2f_
actors.buffs.berserk.rankings_desc=Zu Tode gewütet.
actors.buffs.berserk.action_name=Berserker
actors.buffs.berserk.no_seal=Du benötigst dein gebrochenes Siegel für die Raserei!

actors.buffs.bleeding.name=blutend
actors.buffs.bleeding.ondeath=Du bist verblutet...
actors.buffs.bleeding.heromsg=Du blutest!
actors.buffs.bleeding.rankings_desc=Verblutet
actors.buffs.bleeding.desc=Aus dieser Wunde tritt eine besorgniserregende Menge Blut aus. \n\nDie Blutung richtet jeden Zug Schaden an. Dieser Schaden verringert sich jeden Zug um einen zufälligen Wert, bis die Blutung gestillt ist.\n\nDiese Blutung richtet im Moment bis zu %d Schaden an.

actors.buffs.bless.name=gesegnet
actors.buffs.bless.desc=Eine beträchtliche Steigerung der Konzentration, ausgelöst durch eine Eingebung der Götter, so sagt man.\n\nDieser Segen steigert die Zielgenauigkeit und Ausweichrate um 25%%, was den Gesegneten einen Kampf wesentlich effektiver bestreiten lässt.\n\nVerbleibende Züge mit Segnung: %s.

actors.buffs.blindness.name=geblendet
actors.buffs.blindness.heromsg=Du bist geblendet!
actors.buffs.blindness.desc=Geblendet zu sein, hüllt die umliegende Welt in einen dunklen Schleier. \n\nWährend ein Charakter geblendet ist, ist seine Sichtweite auf ein Feld reduziert, womit Fernkampfangriffe nutzlos sind und man weiter entfernte Feinde leicht aus der Sicht verliert. Zusätzlich ist ein geblendeter Held nicht in der Lage, Schriftrollen oder Bücher zu lesen. \n\nVerbleibende Züge mit Erblindung: %s.

actors.buffs.buff.heromsg=

actors.buffs.burning.name=brennend
actors.buffs.burning.heromsg=Du hast Feuer gefangen!
actors.buffs.burning.burnsup=%s verbrennt!
actors.buffs.burning.ondeath=Du bist verbrannt...
actors.buffs.burning.rankings_desc=Zu Asche verbrannt
actors.buffs.burning.desc=Nur wenige Dinge sind besorgniserregender, als von Flammen verschlungen zu werden.\n\nFeuer richtet jeden Zug Schaden an, bis es durch Wasser gelöscht wird oder abklingt. Auch das Zerschmettern eines Trankes in unmittelbarer Nähe kann Feuer löschen.\n\nSolange man brennt, besteht die Gefahr, dass entflammbare Gegenstände oder Terrain entzündet werden, sobald man mit diesem in Berührung kommt.\n\nVerbleibende Züge in Flammen: %s.

actors.buffs.championenemy.warn=Du spürst eine tödliche Gegenwart.
actors.buffs.championenemy$blazing.name=Flammen-Champion
actors.buffs.championenemy$blazing.desc=Flammende Champions verursachen 25% mehr Nahkampfschaden, entzünden Gegner, die sie angreifen, sind immun gegen Feuer und verbreiten bei ihrem Tod Feuer um sich herum. Wasser ist von diesem Feuer aber nicht betroffen.
actors.buffs.championenemy$projecting.name=projizierender Champion
actors.buffs.championenemy$projecting.desc=Projizierende Champions verursachen 25% mehr Nahkampfschaden und haben +3 Angriffsreichweite.
actors.buffs.championenemy$antimagic.name=Antimagie-Champion
actors.buffs.championenemy$antimagic.desc=Antimagische Champions erleiden 50% weniger Schaden und sind immun gegenüber magischen Effekten.
actors.buffs.championenemy$giant.name=Riesen-Champion
actors.buffs.championenemy$giant.desc=Riesen-Champions erleiden 80% weniger Schaden und haben +1 Angriffsreichweite, können sich aber nicht durch enge Räume bewegen.
actors.buffs.championenemy$blessed.name=gesegneter Champion
actors.buffs.championenemy$blessed.desc=Gesegnete Champions haben eine 4-fache Genauigkeit und Ausweichrate.
actors.buffs.championenemy$growing.name=Wachstums-Champion
actors.buffs.championenemy$growing.desc=Wachsende Champions erhalten einen stetig steigenden Bonus auf Genauigkeit, Ausweichen, physischen Schaden und eine Reduzierung des erlittenen Schadens.\n\nAktueller Genauigkeit-/Ausweich-/Schadensbonus: %1$d%%\nAktuelle Schadensreduzierung: %2$d%%
actors.buffs.championenemy$randomminiboss.name=Kleiner Boss
actors.buffs.championenemy$randomminiboss.desc=Ein uralter Gott hat zufällig eine böse Kreatur im Kerker gesegnet und sie noch furchterregender gemacht.\n\nGegner mit diesem Effekt erhalten je nach aktueller Ebene verbesserte Eigenschaften, was sie schwerer zu besiegen macht. Dementsprechend lassen diese Gegner wertvollere Beute fallen.

actors.buffs.charm.name=betört
actors.buffs.charm.heromsg=Du wurdest betört!
actors.buffs.charm.cant_attack=Du wurdest von diesem Gegner betört und kannst ihn nicht angreifen.
actors.buffs.charm.desc=Betörung ist eine manipulative Magie, die Feinde zeitweilig dazu bringen kann, einander zu mögen.\n\nCharaktere, welche von Betörung betroffen sind, können den Feind, von welchem sie betört wurden, nicht direkt angreifen. Dabei ist es aber nach wie vor möglich, andere Ziele zu attackieren. Der Schock durch Schmerz wird die Dauer der Betörung verringern.\n\nVerbleibende Züge mit Betörung: %s.

actors.buffs.chill.name=unterkühlt
actors.buffs.chill.freezes=%s friert ein!
actors.buffs.chill.desc=Nicht ganz gefroren, aber trotzdem viel zu kalt\n\nUnterkühlte Ziele führen alles langsamer aus, abhängig von den übrigen Zügen des Effekts. Im schlimmsten Fall wirkt die Unterkühlung wie eine Verlangsamung.\n\nVerbleibende Züge mit Unterkühlung:%1$s.\nGeschwindigkeit ist reduziert um:%2$s%%

actors.buffs.combo.name=Kombi
actors.buffs.combo.action_name=Kombi-Angriff
actors.buffs.combo.combo=%d-Treffer-Kombi!
actors.buffs.combo.bad_target=Das Ziel ist zu weit entfernt
actors.buffs.combo.prompt=Wähle ein Ziel für den Angriff.
actors.buffs.combo.desc=Der Gladiator baut Schwung auf, wenn er erfolgreiche Schläge landet. Jeder Angriff erhöht den Kombi-Zähler um eins, aber zu langes Warten zwischen den Schlägen setzt den Kombi-Zähler auf 0 zurück.\n\nDer Aufbau einer Kombi schaltet spezielle Kombi-Angriffe frei, die nicht Ihr Ziel verfehlen werden! Bei 2, 4, 6, 8 und 10 Kombi-Zählern wird jeweils ein anderer Angriff freigeschaltet. Einige dieser speziellen Kombi-Angriffe setzen den Kombi-Zähler zurück, andere nicht, aber jeder Kombi-Angriff kann nur einmal pro Kampf verwendet werden.\n\nAktueller Kombi-Zähler: %1$d.\n\nZüge, bis die Kombi verloren geht: %2$s.
actors.buffs.combo.focus_desc=_+%1$d_ physischer Schaden\n_+%2$s%%_ Präzision
actors.buffs.combo.mastery_desc=Kampfkunst-Meisterschaft lässt Kampfkünste entsprechende Combo-Punkte verbrauchen, anstatt alle zurückzusetzen, und erlaubt Stoß und Parade mehrfach in derselben Combo.
actors.buffs.combo$combomove.clobber.name=Prügel
actors.buffs.combo$combomove.clobber.desc=Stößt einen Gegner 2 Felder zurück, verursacht aber keinen Schaden und kann ihn nicht in Fallgruben stoßen. Erhöht den Kombi-Zähler um 1.
actors.buffs.combo$combomove.clobber.empower_desc=Stößt einen Gegner 3 Felder zurück, verursacht Schwindel, aber keinen Schaden. Erhöht den Kombi-Zähler um 1.
actors.buffs.combo$combomove.slam.name=Harter Schlag
actors.buffs.combo$combomove.slam.desc=Verursacht %d%% (Kombi*20%%) deines Rüstungswertes als zusätzlichen Schaden. Setzt die Kombi bei Verwendung zurück.
actors.buffs.combo$combomove.slam.empower_desc=_Springt bis zu %1$d Feld(ern)_ und verursacht %2$d%% (Kombi*20%%) deiner Abwehrkraft als Bonus-Schaden. Setzt den Kombi-Zähler zurück, wenn verwendet.
actors.buffs.combo$combomove.parry.name=Parade
actors.buffs.combo$combomove.parry.desc=Blockt den nächsten Angriff innerhalb eines Zuges, und kontert diesen sofort. Setzt den Kombi-Zähler auch dann zurück, wenn nichts pariert wurde.
actors.buffs.combo$combomove.parry.empower_desc=Blockt _alle Angriffe_ innerhalb eines Zugs. wenn aktiviert, und kontert diese sofort. Setzt den Kombi-Zähler zurück, wenn nichts pariert wurde.
actors.buffs.combo$combomove.crush.name=Brecher
actors.buffs.combo$combomove.crush.desc=Fügt dem Primärziel %d%% (Kombi*25%%) Schaden und die Hälfte dieses Schadens allen umliegenden Gegnern in einem 7x7 Felder großen Wirkungsbereich zu.
actors.buffs.combo$combomove.crush.empower_desc=_Springt bis zu %1$d Feld(er)_ und fügt dem Primärziel %2$d%% (Kombi*25%%) Schaden sowie allen anderen Gegnern in einem 7x7 Felder großen Wirkungsbereich die Hälfte dieses Schadens zu. Bei Benutzung wird die Kombi zurückgesetzt.
actors.buffs.combo$combomove.fury.name=Wut
actors.buffs.combo$combomove.fury.desc=Trifft den Gegner einmal pro gesammelter Kombi. Jeder Treffer verursacht 60% Schaden und kann Verzauberungen auslösen. Setzt den Kombi-Zähler bei Benutzung zurück.
actors.buffs.combo$combomove.fury.empower_desc=_Springt bis zu %d Feld(er)_ und trifft einen Gegner je einmal pro Kombi, die du hast; jeder Treffer verursacht 60%% Schaden und kann Verzauberungen auslösen. Bei Benutzung wird die Kombi zurückgesetzt.
actors.buffs.combo$combomove.clobber.mastery_desc=Stößt einen Gegner 2 Felder zurück, verursacht aber keinen Schaden und kann ihn nicht in den Abgrund stoßen. Gibt 1 Combo-Punkt zurück.
actors.buffs.combo$combomove.clobber.mastery_empower_desc=Stößt einen Gegner _3 Felder zurück, betäubt ihn und kann ihn in den Abgrund stoßen_, verursacht aber keinen Schaden. Gibt 1 Combo-Punkt zurück.
actors.buffs.combo$combomove.slam.mastery_desc=Verursacht zusätzlichen Schaden in Höhe von %1$d%% der eigenen Verteidigung (aktuelle Combo x20%%).
actors.buffs.combo$combomove.slam.mastery_empower_desc=_Springt bis zu %1$d Felder, um das Ziel zu erreichen_, verursacht zusätzlichen Schaden in Höhe von %2$d%% der Verteidigung (aktuelle Combo x20%%).
actors.buffs.combo$combomove.parry.mastery_desc=Pariert nach Anwendung den ersten Angriff in der nächsten Runde und kontert sofort. Wird keine Parade ausgelöst, verbraucht es dennoch Combo-Punkte.
actors.buffs.combo$combomove.parry.mastery_empower_desc=Pariert nach Anwendung _alle Angriffe_ in der nächsten Runde und kontert sofort. Wird keine Parade ausgelöst, verbraucht es dennoch Combo-Punkte.
actors.buffs.combo$combomove.crush.mastery_desc=Fügt dem Hauptziel %1$d%% Schaden zu (aktuelle Combo x25%%) und anderen Gegnern im 7x7-Bereich die Hälfte davon.
actors.buffs.combo$combomove.crush.mastery_empower_desc=_Springt bis zu %1$d Felder, um das Ziel zu erreichen_, fügt dem Hauptziel %2$d%% Schaden zu (aktuelle Combo x25%%) und anderen Gegnern im 7x7-Bereich die Hälfte.
actors.buffs.combo$combomove.fury.mastery_desc=Für jeden Combo-Punkt greifst du einen Gegner einmal an, jeder Angriff verursacht 60% Schaden und kann Waffenverzauberungen auslösen.
actors.buffs.combo$combomove.fury.mastery_empower_desc=_Springt bis zu %d Felder, um das Ziel zu erreichen_, greift Gegner entsprechend deiner aktuellen Combo-Anzahl an, jeder Angriff verursacht 60%% Schaden und kann Verzauberungen auslösen.

actors.buffs.corruption.name=korrumpiert
actors.buffs.corruption.desc=Korruption sickert in das Innerste eines Wesens, wodurch es sich gegen seine eigene Natur wendet.\n\nKorrumpierte Kreaturen greifen ihre Verbündeten an und ignorieren ihre vorherigen Gegner. Korruption schadet außerdem dem Opfer, wodurch es langsam verendet.\n\nKorruption ist permanent und kann nur durch den Tod beendet werden.

actors.buffs.cripple.name=verkrüppelt
actors.buffs.cripple.heromsg=Du bist verkrüppelt!
actors.buffs.cripple.desc=Du bist dir ziemlich sicher, dass Beine nicht auf diese Weise gebeugt werden sollten.\n\nVerkrüppelte bewegen sich nur halb so schnell, wodurch sie zwei Züge benötigen, um sich ein Feld fortzubewegen.\n\nAnzahl verbleibender Züge mit Verkrüppelung: %s.

actors.buffs.daze.name=benommen
actors.buffs.daze.heromsg=Du bist benommen!
actors.buffs.daze.desc=Ohrensausen und verschwommene Sicht erschweren den Kampf.\n\nWährend du benommen bist, sind Genauigkeit und Ausweichen um 50%% reduziert.\n\nVerbleibende Runden mit Benommenheit: %s.

actors.buffs.degrade.name=geschwächt
actors.buffs.degrade.heromsg=Deine Ausrüstung fühlt sich schwächer an!
actors.buffs.degrade.desc=Mächtige dunkle Magie zehrt an der Stärke deiner Ausrüstung, welche durch Schriftrollen der Verbesserung aufgewertet wurden!\n\nVerbesserte Ausrüstungsgegenstände werden temporär so behandelt, als hätten sie eine niedrigere Stufe als vorher. _Jeder Verbesserung ab +3 wird exponentiell schwächer._ Die Beschreibungen deiner Gegenstände wird angepasst, damit du Ihre geschwächten Werte einsehen kannst.\n\nSchwächungen beeinflussen keine Stärkeanforderungen, Ladungen von Zauberstäben, Haltbarkeit von Wurfwaffen oder Artefakte.\n\nVerbleibende Züge mit Schwächung: %s. Die Nutzung einer Schriftrolle der Verbesserung oder des Fluchbrechers wird die Schwächung sofort aufheben.

actors.buffs.doom.name=verdammt
actors.buffs.doom.desc=Es ist schwer, optimistisch zu bleiben, wenn es scheint, dass alle Welt dich tot sehen möchte.\n\nVerdammte Charaktere erleiden +67% Schaden aus allen Schadensquellen.\n\nDie Verdammung ist permanent, ihre Auswirkungen enden erst mit dem Tod.

actors.buffs.dread.name=Grauen
actors.buffs.dread.desc=Ein Schrecken, der so groß ist, dass dieser sein Ziel dazu nötigt, so schnell wie möglich aus dem Dungeon zu fliehen!\n\nKreaturen, die vom Schrecken betroffen sind, laufen mit hoher Geschwindigkeit vor ihrem Gegner davon und verschwinden vollständig aus dem Dungeon, sobald sie außer Sichtweite sind. Für Feinde, die auf diese Weise beseitigt werden, gibt es keine Gegenstände und nur die Hälfte an Erfahrungspunkten. Der Schock des Schmerzes verringert die Dauer des Grauens.\n\nVerbleibende Züge des Grauens: %d.

actors.buffs.drowsy.name=schläfrig
actors.buffs.drowsy.desc=Eine magische Kraft macht es schwierig, wach zu bleiben. Nach einigen Runden fällt das Ziel in einen tiefen magischen Schlaf.\n\nDer Held kann der Schläfrigkeit widerstehen, indem er Schaden nimmt oder bei voller Gesundheit ist.\n\nRunden bis zum magischen Schlaf: %s

actors.buffs.earthimbue.name=eins mit der Erde
actors.buffs.earthimbue.desc=Du wirst von der Kraft der Erde erfüllt!\n\nAlle physischen Angriffe lassen den Erdboden unter den Feinden beben, so dass sie für eine kurze Zeit verkrüppelt werden.\n\nVerbleibende Züge mit Erd-Durchdringung: %s.

actors.buffs.enhancedrings.name=verbesserte Ringe
actors.buffs.enhancedrings.desc=Das zuletzt genutzte Artefakt des Schurken verstärkt seine Ringe, deren Stufe um 1 erhöht wird.\n\nVerbleibende Züge: %s.

actors.buffs.fireimbue.name=eins mit dem Feuer
actors.buffs.fireimbue.desc=Die Kräfte des Feuers durchströmen deinen Körper!\n\nAlle deine physischen Angriffe haben eine Chance, dass Gegner in Flammen aufgehen. Außerdem bist du komplett immun gegen die Auswirkungen von Feuer. \n\nVerbleibende Züge mit Feuer-Durchdringung: %s.

actors.buffs.foresight.name=Vorhersehung
actors.buffs.foresight.desc=Irgendwie ist es dir nun möglich, die räumlichen Umrisse des dich umgebenden Gebietes in deinem Geist zu erblicken.\n\nSolange der Effekt der Vorhersehung anhält, werden dir sämtliche Felder in einem großen Radius um dich herum offenbar, einschließlich eventueller versteckter Fallen oder Türen.\n\nVerbleibende Züge mit Vorhersehung: %s.

actors.buffs.frost.name=eingefroren
actors.buffs.frost.freezes=%s friert ein!
actors.buffs.frost.desc=Nicht zu verwechseln mit einer kompletten Einfrierung: Hier ist das Ziel eher von einer unschädlichen Eisschicht umhüllt.\n\nEinfrieren wirkt ähnlich wie Lähmung, was dem Opfer jegliche Bewegung verwehrt. Anders als bei einer Lähmung endet der Effekt, wenn das eingefrorene Ziel Schaden erleidet, da dadurch die Eisschicht aufbricht.\n\nVerbleibende Züge mit Einfrieren: %s.

actors.buffs.frostimbue.name=eins mit dem Frost
actors.buffs.frostimbue.desc=Die Kräfte des Eises durchströmen deinen Körper!\n\nAlle deine physischen Angriffe werden Feinde immer stärker einfrieren. Zusätzlich bist du selbst komplett gegen Kälte immun.\n\nVerbleibende Züge mit Frostkraft: %s.

actors.buffs.fury.name=wütend
actors.buffs.fury.heromsg=Du wirst wütend!
actors.buffs.fury.desc=Du bist wütend und das mögen deine Feinde ganz und gar nicht.\n\nEine große Wut ist in dir entbrannt, durch die der von dir verursachte physische Schaden um 50%% erhöht ist.\n\nSolange deine aktuelle Lebensenergie unter 50%% verbleibt, hält deine Wut an.

actors.buffs.blobimmunity.name=reinigende Barriere
actors.buffs.blobimmunity.desc=Eine wunderliche Kraft umgibt dich mit einer Schutzschicht, welche alle über die Luft kommenden negativen Effekte blockiert.\n\nDu bist immun gegen alle an den Ort gebundenen Effekte, solange die Barriere anhält.\n\nVerbleibende Züge mit Immunität: %s.

actors.buffs.gravitychaostracker.name=Gravitationschaos
actors.buffs.gravitychaostracker.desc_intro=Alle paar Runden werden alle Einheiten auf der aktuellen Ebene in eine zufällige Richtung geschleudert.
actors.buffs.gravitychaostracker.desc_positive=Du und deine Verbündeten scheinen jedoch dagegen immun zu sein.
actors.buffs.gravitychaostracker.desc_duration=Wie lange das Gravitationschaos anhält, ist ungewiss, aber es wird nicht ewig dauern.

actors.buffs.greaterhaste.name=größere Eile
actors.buffs.greaterhaste.desc=Ein unglaublicher Geschwindigkeitsschub, für einen Moment fühlt es sich an, als ob alles andere stillsteht.\n\nUnter dem Einfluss größerer Eile dauern Bewegungsaktionen überhaupt keine Zeit, andere Aktionen werden jedoch weiterhin mit normaler Geschwindigkeit ausgeführt. Jeder Bewegungsschritt verbraucht eine Runde größerer Eile.\n\nVerbleibende Runden größerer Eile: %d

actors.buffs.haste.name=Eile
actors.buffs.haste.desc=Energie fließt durch deine Muskeln, was dich dazu befähigt, unglaublich schnell zu laufen!\n\nWährend du unter Eile stehst, rennst du mit 3-facher Geschwindigkeit, wirst aber alle anderen Aktionen mit normaler Geschwindigkeit ausführen\n\nVerbleibende Züge mit Eile: %s.

actors.buffs.healing.name=Heilung
actors.buffs.healing.desc=Ein magisches Heilmittel, welches Wunden schließt und Fleisch wieder zusammenfügt.\n\nDie Lebensenergie wird mit jedem Zug wiederhergestellt, bis die heilende Wirkung endet. Die Stärke der Heilung mag über die Zeit abnehmen.\n\nNächste Heilung: %d.\n\nVerbleibende Züge mit Heilung: %d.

actors.buffs.herodisguise.name=Tarnung
actors.buffs.herodisguise.desc=Illusionäre Magie hat dein Aussehen verändert! Der Effekt ist rein kosmetisch, fühlt sich aber trotzdem sehr seltsam an.\n\nVerbleibende Verkleidungsrunden: %s

actors.buffs.hex.name=verhext
actors.buffs.hex.heromsg=Du wurdest verhext!
actors.buffs.hex.desc=Dunkle Magie, welche die Konzentration beeinträchtigt und das Ziel so leicht desorientiert macht.\n\nVerhexung reduziert die Genauigkeit und das Ausweichen um 20%%, so dass das Ziel im Kampf weniger effektiv ist.\n\nVerbleibende Züge mit Verhexung: %s.

actors.buffs.holdfast.name=Position halten
actors.buffs.holdfast.desc=Der Krieger hält seine Position, was seine Rüstung um %1$d-%2$d verstärkt. Sobald er sich bewegt, verschwindet der Effekt.

actors.buffs.hunger.hungry=hungrig
actors.buffs.hunger.dmhungry=Niedriger Akku
actors.buffs.hunger.starving=verhungernd
actors.buffs.hunger.dmstarving=Akku schwach
actors.buffs.hunger.onhungry=Du hast Hunger.
actors.buffs.hunger.onstarving=Du verhungerst!
actors.buffs.hunger.ondmhungry=Aktueller Akkustand niedrig.
actors.buffs.hunger.ondmstarving=Akkustand kritisch!
actors.buffs.hunger.ondeath=Du bist verhungert...
actors.buffs.hunger.cursedhorn=Das verfluchte Horn stiehlt dem Essen einen Teil seiner Energie, wenn du etwas isst.
actors.buffs.hunger.rankings_desc=Verhungert
actors.buffs.hunger.desc_intro_hungry=Du fühlst, dass dein Bauch etwas zu Essen verlangt, aber es lässt sich noch aushalten.
actors.buffs.hunger.desc_intro_starving=Du bist so hungrig, dass es weh tut.
actors.buffs.hunger.desc_intro_dmhungry=Dein aktueller Akkustand ist niedrig, aber die verbleibende Energie reicht noch für eine Weile.
actors.buffs.hunger.desc_intro_dmstarving=Dein Akkustand ist kritisch und gefährdet bereits den normalen Betrieb deines Körpers.
actors.buffs.hunger.desc=\n\nDein Hunger erhöht sich mit der Zeit, die du im Dungeon verbringst. Irgendwann beginnst du zu verhungern. Während du verhungerst, wirst du Lebensenergie verlieren, anstatt sie zu regenerieren.\n\nRationieren ist wichtig! Wenn du über genug Lebensenergie verfügst, kann Hungern eine Option sein, um Nahrung für später aufzusparen. Durch effiziente Rationierung kann deine Nahrung viel länger ausreichen!
actors.buffs.hunger.dmdesc=\n\nDie Erkundung des Kerkers verbraucht ständig deinen Akku. Je mehr Zeit du aufwendest, desto niedriger wird er. Ist der Akku schwach, wird der Betrieb deines Körpers gefährdet: Die Lebenspunkte regenerieren nicht mehr und beginnen langsam zu sinken.\n\nObwohl Aufladen im Kerker schwierig ist, kann dein miniaturisiertes thermochemisches Umwandlungssystem Nahrung effizient in elektrische Energie umwandeln. Nahrung ist jedoch ebenfalls begrenzt – lerne, sie klug zu nutzen!

actors.buffs.invisibility.name=unsichtbar
actors.buffs.invisibility.desc=Du bist visuell komplett mit deiner Umgebung verschmolzen, wodurch es unmöglich ist, dich zu entdecken.\n\nSolange du unsichtbar bist, können Gegner dich nicht angreifen oder verfolgen. Physische Angriffe oder magische Effekte (wie die Verwendung von Schriftrollen und Zauberstäben) beenden die Unsichtbarkeit sofort.\n\nVerbleibende Züge mit Unsichtbarkeit: %s.

actors.buffs.invulnerability.name=unverwundbar
actors.buffs.invulnerability.desc=Du bist mit großer Schutzkraft ausgestattet, die dir für kurze Zeit Unverwundbarkeit verleiht!\n\nVerbleibende Runden:%s

actors.buffs.levitation.name=schwebend
actors.buffs.levitation.desc=Eine magische Kraft lässt Dich schwerelos über dem Boden schweben.\n\nSchwebende Charaktere bewegen sich lautlos und ignorieren alle Erdboden Effekte. Fallen lösen nicht aus, brennende Charaktere können sich nicht im Wasser löschen, Pflanzen werden nicht zertrampelt, Wurzeln verfehlen und Gruben werden überflogen. \n\nSei vorsichtig, denn all diese Dinge können in der Sekunde in Kraft treten, in der die Levitation endet!\n\nVerbleibende Schweberunden: %s

actors.buffs.lifelink.name=Lebensverbindung
actors.buffs.lifelink.ondeath=Du stirbst durch den geteilten Schaden der Lebensverbindung...
actors.buffs.lifelink.desc=Die Lebenskraft dieses Charakters ist mit einem anderen Charakter in der Nähe verbunden. Jeglicher Schaden wird von diesen beiden geteilt.\n\nSobald diesem Charakter Schaden zugefügt wird, wird die Hälfte davon stattdessen an den Charakter am Ende der Lebensverbindung weitergegeben.\n\nVerbleibende Züge mit Lebensverbindung: %s, oder bis der verbundene Charakter stirbt.

actors.buffs.light.name=beleuchtet
actors.buffs.light.desc=Selbst im dunkelsten Dungeon ist ein ruhiges Licht an deiner Seite tröstlich.\n\nLicht hält Dunkelheit in Schach und erlaubt es dir, die umliegende Gegend angemessen zu erhellen.\n\nVerbleibende Züge mit Illumination: %s.

actors.buffs.lockedfloor.name=Ebene ist verschlossen
actors.buffs.lockedfloor.desc=Diese Ebene ist verschlossen und du kannst sie nicht verlassen!\n\nWährend eine Ebene verschlossen ist, leidest du keinen Hunger und erleidest keinen Schaden durch Verhungern. Außerdem werden deine passiven Regenerationseffekte stoppen, wenn du dich nicht gerade daran machst, den Boss auf dieser Ebene zu besiegen.\n\nWenn du von einem ungesegneten Anch wiederbelebt wirst, während die Ebene verschlossen ist, wird die Ebene neu gestartet.\n\nTöte den Boss, um die Ebene zu entriegeln.

actors.buffs.lostinventory.name=verlorenes Inventar
actors.buffs.lostinventory.desc=Du hast dein Inventar irgendwo im Dungeon verloren! Bis du es wiedererlangst, wirst du kaum Gegenstände aufnehmen und benutzen können.

actors.buffs.magicalsight.name=magische Sicht
actors.buffs.magicalsight.desc=Irgendwie kannst du mit deinem Geist anstelle deiner Augen sehen.\n\nSolange Magische Sicht aktiv ist, kannst du in einem 12-Felder-Radius durch das Gelände blicken.\n\nVerbleibende Züge mit magischer Sicht: %s.

actors.buffs.magicalsleep.name=magischer Schlaf
actors.buffs.magicalsleep.toohealthy=Du bist zu gesund und widerstehst dem Drang zu schlafen.
actors.buffs.magicalsleep.fallasleep=Du fällst in einen magischen Schlaf.
actors.buffs.magicalsleep.wakeup=Du wachst auf und fühlst dich erfrischt und gesund.
actors.buffs.magicalsleep.desc=Dieser Charakter ist in einen magischen Schlaf gefallen, von dem er auf natürliche Weise nicht erwachen kann.\n\nMagischer Schlaf ähnelt normalem Schlaf, allerdings kann nur zugefügter Schaden das Ziel wecken.\n\nFür den Helden und seine Verbündeten hat der magische Schlaf einige regenerative Eigenschaften, die es ihnen erlauben, sich beim Schlafen schnell zu heilen.

actors.buffs.magicimmune.name=immun gegenüber Magie
actors.buffs.magicimmune.desc=Alle magischen Effekte verlieren ihre Gewalt über dich, du bist ihnen gegenüber vollkommen immun.\n\nSolange die Immunität gegen Magie anhält, haben schädigende und helfende magische Effekte keine Wirkung auf dich, einschließlich solcher Dinge wie Flüche, Verzauberungen, Zauberstäbe, Schriftrollen, Ringe, Artefakte usw. Die Fähigkeiten der Heldenrüstung sind allerdings stark genug, um trotz dieses Effekts zu funktionieren.\n\nVerbleibende Züge mit Immunität gegen Magie: %s.

actors.buffs.mindvision.name=übersinnliche Wahrnehmung
actors.buffs.mindvision.desc=Irgendwie kannst du alle Kreaturen auf dieser Ebene mithilfe deiner Gedanken ausmachen. Es ist ein seltsames Gefühl.\n\nAlle Wesen auf dieser Ebene sind sichtbar, solange die übersinnliche Wahrnehmung aktiv ist. Eine dadurch gesichtete Kreatur gilt als gültiges Ziel für viele magische Effekte.\n\nVerbleibende Züge mit übersinnlicher Wahrnehmung: %s.

actors.buffs.momentum.momentum=Schwung aufbauen
actors.buffs.momentum.running=freilaufend
actors.buffs.momentum.resting=sich erholend
actors.buffs.momentum.action_name=Freilauf
actors.buffs.momentum.momentum_desc=Wenn er sich bewegt, baut der Freiläufer Schwung auf, welchen er zum Starten des Freilaufens nutzen kann.\n\nJede Ladung Schwung garantiert 2 Züge Freilaufen; der Freiläufer kann bis zu 10 Ladungen aufbauen. Schwung geht schnell verloren, wenn der Freiläufer stehen bleibt.\n\nDerzeitige Schwung-Ladung: %d.
actors.buffs.momentum.running_desc=Während er sich bewegt, baut der Freiläufer Schwung auf, welchen er zum Starten des Freilaufens nutzen kann.\n\nWährend des Freilaufens bewegt sich der Freiläufer doppelt so schnell und bekommt einen auf seiner Stufe basierenden Bonus auf Ausweichen.\n\nVerbleibende Züge: %d.
actors.buffs.momentum.resting_desc=Während er sich bewegt, baut der Freiläufer Schwung auf, welchen er zum Starten des Freilaufens nutzen kann.\n\nDer Freiläufer braucht Zeit, um seine Ausdauer zu regenerieren, bevor er wieder Schwung aufbauen kann.\n\nVerbleibende Züge: %d.

actors.buffs.monkenergy.name=Energie
actors.buffs.monkenergy.action=Fähigkeiten der Nonne
actors.buffs.monkenergy.desc=Indem sie Feinde besiegt, sammelt die Nonne Energie, die sie in einer Vielzahl verschiedener Fähigkeiten einsetzen kann. Die meisten Feinde bringen ihr, wenn sie besiegt werden, 1 Energie, und die Nonne verliert mit der Zeit keine Energie.\n\nAktuelle Energie: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=Die Nonne hat gerade eine Fähigkeit eingesetzt, und muss etwas warten, bevor sie eine weitere einsetzen kann.\n\nAktuelle Abklingzeit: %d Züge.
actors.buffs.monkenergy$monkability$flurry.name=hastige Hiebe
actors.buffs.monkenergy$monkability$flurry.desc=Zwei sofortige Schläge, die %1$d-%2$d Schaden verursachen und Rüstung ignorieren. Diese Fähigkeit kann nicht sofort wiederholt werden.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Zwei sofortige Schläge, die %1$d-%2$d Schaden verursachen, Rüstung ignorieren _und die Verzauberung deiner Waffe nutzen_. Diese Fähigkeit kann nicht sofort wiederholt werden.
actors.buffs.monkenergy$monkability$focus.name=Konzentration
actors.buffs.monkenergy$monkability$focus.desc=Die Nonne konzentriert sich einen Zug lang, so dass sie den gegen sie geführten Angriff pariert.
actors.buffs.monkenergy$monkability$focus.empower_desc=Die Nonne _fokussiert augenblicklich_, wodurch sie den nächsten, gegen sie geführten Angriff pariert.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=konzentriert
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=Die Nonne konzentriert sich auf ihre Umgebung und kann den nächsten gegen sie geführten Angriff voraussehen. Solange sie konzentriert ist, wird sie den nächsten Angriff garantiert parieren.
actors.buffs.monkenergy$monkability$dash.name=Sprint
actors.buffs.monkenergy$monkability$dash.prompt=Wähle einen Ort
actors.buffs.monkenergy$monkability$dash.desc=Ein augenblicklicher Sprint auf bis zu 4 Felder Entfernung. Mit dieser Fähigkeit überquert man auch Gefahren, man kann aber nicht durch Feinde oder Wände gelangen.
actors.buffs.monkenergy$monkability$dash.empower_desc=Ein augenblicklicher Sprung über bis zu _8 Felder_. Durch diese Fähigkeit kann man über Gefahren, nicht aber über Gegner oder Hindernisse springen.
actors.buffs.monkenergy$monkability$dragonkick.name=Drachentritt
actors.buffs.monkenergy$monkability$dragonkick.desc=Ein verheerender Tritt, der %1$d-%2$d Schaden zufügt und Rüstungen ignoriert. Der Tritt schleudert das Ziel fort und paralysiert es einen Zug pro Feld, das es dabei zurücklegt.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=Ein verheerender Tritt, der _%1$d-%2$d Schaden_ verursacht und dabei Rüstung ignoriert. Der Tritt stößt _alle angrenzenden Ziele_ weg und paralysiert sie so lange, wie viele Felder sie gestoßen wurden.
actors.buffs.monkenergy$monkability$meditate.name=Meditieren
actors.buffs.monkenergy$monkability$meditate.desc=Die Nonne fokussiert 5 Züge lang Energie in ihrem Körper. Dies reinigt sie von den meisten negativen Effekten und gewährt ihr 8 Züge lang Aufladung von Zauberstäben und Artefakten.
actors.buffs.monkenergy$monkability$meditate.empower_desc=Die Nonne fokussiert ihre Energie 5 Züge lang in ihren Körper. Dadurch werden die meisten negativen Effekte neutralisiert und sie erhält 8 Züge Aufladung für Zauberstäbe und Artefakte. _Sie erhält außerdem 80% Schadensresistenz während der Meditation, und 20% ihrer fehlenden Lebenspunkte werden allmählich wiederhergestellt._

actors.buffs.ooze.name=ätzender Schlamm
actors.buffs.ooze.heromsg=Ätzender Schlamm frisst sich durch dein Fleisch! Wasch ihn ab!
actors.buffs.ooze.ondeath=Du löst dich auf...
actors.buffs.ooze.rankings_desc=Aufgelöst
actors.buffs.ooze.desc=Diese klebrige Säure haftet sich an Fleisch und löst es langsam auf.\n\nDer Schlamm wird dir durchgängig Schaden zufügen, kann jedoch sofort im Wasser abgewaschen werden.\n\nVerbleibende Züge mit Schlamm: %s.

actors.buffs.paralysis.name=gelähmt
actors.buffs.paralysis.heromsg=Du bist gelähmt!
actors.buffs.paralysis.out=widersteht der Lähmung
actors.buffs.paralysis.desc=Häufig ist es das Schlimmste, gar nichts zu tun.\n\nEine Lähmung bringt sämtliche Aktionen zum Erliegen und zwingt das Ziel dazu, solange auszuharren, bis der Effekt vorüber ist. Der Schmerz von erlittenen Verletzungen kann aber dazu führen, dass Opfer der Lähmung widerstehen und sich damit von der Wirkung befreien.\n\nVerbleibende Züge mit Lähmung: %s.

actors.buffs.physicalempower.name=körperlich ertüchtigt
actors.buffs.physicalempower.desc=Deine Schläge sind verstärkt, so dass du mit physischen Angriffen mehr Schaden austeilst, sofern du Feinde angreifst.\n\nBonusschaden: %1$d.\nVerbleibende Schläge: %2$d.

actors.buffs.pincushion.name=Nadelkissen
actors.buffs.pincushion.desc=Die Wurfwaffen, die du gegen diesen Charakter eingesetzt hast, stecken derzeit in ihm und fallen zu Boden, nachdem er besiegt wurde.\n\nDie folgenden Gegenstände sind derzeit angeheftet:

actors.buffs.poison.name=vergiftet
actors.buffs.poison.heromsg=Du bist vergiftet!
actors.buffs.poison.ondeath=Du bist an der Vergiftung gestorben...
actors.buffs.poison.rankings_desc=Dem Gift erlegen
actors.buffs.poison.desc=Gift arbeitet sich durch deinen gesamten Körper und schädigt diesen nach und nach.\n\nDas Gift richtet jeden Zug Schaden an, bis es abklingt. Die Menge des Schadens hängt von der Dauer der Vergiftung ab,\n\nVerbleibende Züge mit Vergiftung: %s.

actors.buffs.preparation.name=Vorbereitung
actors.buffs.preparation.action_name=vorbereiteter Schlag
actors.buffs.preparation.desc=Der Attentäter wartet geduldig und bereitet sich darauf vor, aus dem Schatten zuzuschlagen.
actors.buffs.preparation.desc_dmg=Sein nächster Angriff wird _%1$d%%Bonus-Schaden anrichten_ und wird einfache Gegner mit weniger als _%2$d%% Gesundheit_ oder Bosse mit weniger als _%3$d%%Gesundheit_ umbringen.
actors.buffs.preparation.desc_dmg_likely=Der Angriff hat außerdem eine höhere Chance, mehr Schaden zuzufügen.
actors.buffs.preparation.desc_blink=Er kann sich an den Gegner heran teleportieren, bevor er angreift, mit einer maximalen Reichweite von _%d._
actors.buffs.preparation.desc_invis_time=Unsichtbar verbrachte Züge: _%d._
actors.buffs.preparation.desc_invis_next=Züge mit verstärkten Angriffen: _%d._
actors.buffs.preparation.prompt=Wähle ein anzugreifendes Ziel!\nMaximale Teleportationsreichweite: %d
actors.buffs.preparation.no_target=Hier gibt es nichts anzugreifen.
actors.buffs.preparation.out_of_reach=Das Ziel ist außer Reichweite.
actors.buffs.preparation.assassinated=gemeuchelt

actors.buffs.prismaticguard.name=Spektralschild
actors.buffs.prismaticguard.desc=Du wirst von einem spektralen Abbild geschützt, das derzeit nicht aktiv ist. Wenn Feinde zugegen sind, wird das Abbild zu deinem Schutze aktiv!\n\nSolange es inaktiv ist, wird das Abbild sich stetig von Schaden erholen, den es erlitten hat.\n\nDerzeitige Lebenspunkte: %d/%d.
actors.buffs.prismaticguard.desc_many=Dieses Prisma-Bildnis wurde durch Eins-Sein verstärkt. Verbleibende Runden: %d

actors.buffs.recharging.name=aufladend
actors.buffs.recharging.desc=Energie fließt durch deinen Körper, was die Aufladerate deiner Zauberstäbe verbessert.\n\nDie Aufladung wird jeden Zug um ein Viertel erhöht, zusätzlich zur Standardaufladung. \n\nVerbleibende Züge mit Aufladung: %s.

actors.buffs.revealedarea.name=aufgedecktes Gebiet
actors.buffs.revealedarea.desc=Dem Helden wurde vorübergehend ein Teil des Dungeons offenbart. Der Held wird diesen Teil sehen, egal, wo er sich befindet.\n\nVerbleibende Züge: %s.

actors.buffs.revealedchar.name=aufgedeckt
actors.buffs.revealedchar.desc=Dieser Charakter wurde dem Helden offenbart. Der Held wird ihn sehen, egal, wo er sich befindet.\n\nVerbleibende Züge: %s.

actors.buffs.roots.name=verwurzelt
actors.buffs.roots.heromsg=Du kannst dich nicht bewegen!
actors.buffs.roots.desc=Wurzeln (magisch oder natürlich) schlingen sich um Füße und halten ihre Opfer am Boden.\n\nWurzeln fesseln das Opfer und zwingen es zur Bewegungslosigkeit. Andere Aktionen können weiterhin durchgeführt werden, einschließlich Teleportationseffekte.\n\nVerbleibende Züge mit Verwurzelung: %s.

actors.buffs.scrollempower.name=Schriftrollenverstärker
actors.buffs.scrollempower.desc=Die Energie aus der kürzlich gelesenen Schriftrolle des Magiers stärkt seine Zauberstäbe!\n\nStufenanstieg: +%1$d.\nVerbleibende Zauber: %2$d.

actors.buffs.shadows.name=mit den Schatten verschmolzen
actors.buffs.shadows.desc=Du bist mit den Schatten verschmolzen, was dir Unsichtbarkeit gewährt und deinen Stoffwechsel verlangsamt.\n\nWährend du unsichtbar bist, können Gegner dich weder angreifen noch dir folgen. Die meisten physischen sowie magischen Angriffe (wie Schriftrollen oder Stäbe) werden die Unsichtbarkeit sofort beenden. Außerdem nimmt dein Hunger langsamer zu, während du unsichtbar bist.\n\nDein Schattenmantel verbleibt so lange, bis du die Schatten verlässt oder in Kontakt mit einem Gegner kommst.

actors.buffs.slow.name=verlangsamt
actors.buffs.slow.desc=Verlangsamungsmagie wirkt auf den Zeitfluss ihres Ziels; für das Ziel bewegt sich alles ungewöhnlich schnell.\n\nEin verlangsamter Charakter benötigt für alle seine Aktionen doppelt so viel Zeit wie gewöhnlich.\n\nVerbleibende Züge mit Verlangsamung: %s.

actors.buffs.snipersmark.name=Markierung des Scharfschützen
actors.buffs.snipersmark.action_name_snapshot=Schnappschuss
actors.buffs.snipersmark.action_name_volley=Salve
actors.buffs.snipersmark.action_name_sniper=Scharfschützenschuss
actors.buffs.snipersmark.desc=Die Scharfschützin ist auf das Ziel konzentriert, das sie zuletzt angegriffen hat. Sie ist in der Lage, mit ihrem Bogen einen speziellen Angriff auszuführen, der davon abhängt, wie der Bogen verbessert wurde.\n\nEin nicht ausgerüsteter Bogen wird einen _Schnellschuss_ abfeuern, der weniger Schaden anrichtet, aber keine Zeit zum Abfeuern braucht.\n\nEin Bogen, der hinsichtlich Geschwindigkeit verbessert wurde, kann eine _Salve_ von drei Pfeilen abfeuern. Jeder Pfeil verursacht geringen Schaden, kann aber trotzdem eine Verzauberung bewirken. Das Abfeuern der Salve dauert einen Zug.\n\nEin auf Schaden hin ausgebauter Bogen wird einen _Präzisionsschuss_ abfeuern. Dieser Schuss ist ein garantierter Treffer, benötigt zwei Züge und verursacht einen Extraschaden, welcher von der Entfernung zum Ziel abhängt.\n\nÜbrige Runden: %s.

actors.buffs.soulmark.name=Seele markiert
actors.buffs.soulmark.desc=Der Hexenmeister hat sich an die Seele dieser Kreatur gebunden. Er heilt und sättigt sich, während die Kreatur physischen Schaden nimmt, solange das Seelenzeichen verbleibt.\n\nVerbleibende Züge mit Seelenzeichnung: %s.

actors.buffs.stamina.name=Ausdauer
actors.buffs.stamina.desc=Du hast unendliche Ausdauer, die dir schnellere Bewegungen erlaubt!\n\nSolange du unter dem Einfluss der Ausdauer stehst, läufst du 50 %% schneller, aber wirst alle anderen Aktionen mit normaler Geschwindigkeit ausführen.\n\nVerbleibende Züge mit Ausdauer: %s.

actors.buffs.vulnerable.name=verwundbar
actors.buffs.vulnerable.heromsg=Du fühlst dich zerbrechlich!
actors.buffs.vulnerable.desc=Verwundbarkeitsmagie steigert jeden physischen Schaden, der einem Charakter zugefügt wird, um 33%%, nachdem der Schaden durch die Rüstung reduziert worden ist.\n\nVerbleibende Züge mit Verwundbarkeit: %s.

actors.buffs.terror.name=verängstigt
actors.buffs.terror.desc=Terror ist manipulative Magie, die ihr Ziel zu einer unkontrollierten Panik zwingt.\n\nTerrorisierte Charakter werden gezwungen, vor ihrem Feind Reißaus zu nehmen und zu versuchen, so viele Türen und Wände wie möglich zwischen sich und den Feind zu bringen. Allerdings verringert der Schock durch Schmerz die Dauer des Terrors.\n\nVerbleibende Züge mit Terror: %s.

actors.buffs.toxicimbue.name=eins mit dem Gift
actors.buffs.toxicimbue.desc=Du bist eins mit dem Element des Giftes!\n\nImmer, wenn du dich bewegst, bricht ein Schwall von giften Gasen hervor, welcher deinen Gegnern schadet. Solange du diesen Effekt besitzt, und einige Züge darüber hinaus, bist du gegen die Auswirkungen von Giftgas und Gift immun.\n\nVerbleibende Züge mit toxischer Durchdringung: %s.

actors.buffs.corrosion.name=Korrosion
actors.buffs.corrosion.heromsg=Du löst dich auf!
actors.buffs.corrosion.ondeath=Du löst dich auf...
actors.buffs.corrosion.rankings_desc=Aufgelöst
actors.buffs.corrosion.desc=Eine starke Säure löst – mit atemberaubender Geschwindigkeit – Fleisch, Metall und Knochen auf.\n\nDer Schaden durch die Zersetzung steigt mir der Zeit, in der sich das Ziel weiter auflöst.\n\nVerbleibende Züge mit Zersetzung: %1$s.\nDerzeitiger Zersetzungschaden: %2$d.

actors.buffs.vertigo.name=schwindelig
actors.buffs.vertigo.desc=In einer geraden Linie zu laufen kann schwierig sein, wenn sich dabei die ganze Welt dreht.\n\nSolange man unter Schwindel leidet, bewegt man sich in eine zufällige Richtung anstatt in die gewünschte Richtung.\n\nVerbleibende Züge mit Schwindelgefühl: %s

actors.buffs.wandempower.name=Zauberstäbe gestärkt
actors.buffs.wandempower.desc=Deine schadensverursachenden Zauberstäbe wurden verstärkt, wodurch der Schaden, den sie verursachen, für einige Treffer erhöht ist.\n\nBonusschaden: %1$d.\nVerbleibende Treffer: %2$d.

actors.buffs.weakness.name=geschwächt
actors.buffs.weakness.heromsg=Du fühlst dich geschwächt!
actors.buffs.weakness.desc=Alles erscheint plötzlich sehr viel schwerer zu sein.\n\nSchwächungsmagie reduziert die körperliche Stärke eines Charakters, so dass dieser um 33%% verringerten Schaden verursacht.\n\nVerbleibende Züge mit Schwäche: %s.

actors.buffs.wellfed.name=gut genährt
actors.buffs.wellfed.dmname=Akku gesättigt
actors.buffs.wellfed.desc=Du fühlst dich ziemlich zufrieden und satt.\n\nSolange dein Bauch vollgestopft ist, wird dein Hunger sich nicht vergrößern und du wirst eine Zeitlang etwas mehr heilen.\n\nVerbleibende Züge: %d.
actors.buffs.wellfed.dmdesc=Dein aktueller Akkustand ist gesättigt.\n\nBei gesättigtem Akku sinkt er für eine längere Zeit nicht und du regenerierst mit der Zeit zusätzliche Lebenspunkte.\n\nVerbleibende Dauer: %d Runden



###hero

##abilities
actors.hero.abilities.armorability.self_target=Du kannst nicht auf dich selbst zielen!
actors.hero.abilities.armorability.no_target=Dort befindet sich kein Ziel!
actors.hero.abilities.armorability.prompt=Wähle einen Ort als Ziel
actors.hero.abilities.armorability.cost=Aufladekosten: _%d_

actors.hero.abilities.warrior.heroicleap.name=Heldensprung
actors.hero.abilities.warrior.heroicleap.prompt=Wähle die Richtung, in die du springen möchtest
actors.hero.abilities.warrior.heroicleap.short_desc=Der Krieger führt einen _Heldensprung_ zum anvisierten Ort aus und segelt dabei über Feinde und Gefahren hinweg.
actors.hero.abilities.warrior.heroicleap.desc=Der Krieger springt zu einer anvisierten Position und überspringt dabei alle Feinde oder Hindernisse, die sich ihm in den Weg stellen. Er kann jedoch nicht über Wände oder anderes festes Terrain springen.
actors.hero.abilities.warrior.shockwave.name=Schockwelle
actors.hero.abilities.warrior.shockwave.short_desc=Der Krieger setzt eine _Schockwelle_ in einem konischen Gebiet frei, indem er auf den Boden schlägt. Feinde, die von der Schockwelle erfasst werden, erleiden Schaden und werden gelähmt.
actors.hero.abilities.warrior.shockwave.desc=Der Krieger schlägt auf den Boden und ruft dadurch eine Schockwelle hervor, die bis zu 5 Felder weit in einem kegelförmigen Bereich von 60 Grad reicht.\n\nFeinde, die von dieser Schockwelle erwischt werden, sind 5 Züge lang verkrüppelt. Außerdem bekommen sie 5-10 Punkte Schaden, dazu 1-2 Schadenspunkte pro Stärke, die der Krieger über 10 hinaus hat.
actors.hero.abilities.warrior.endure.name=ertragen
actors.hero.abilities.warrior.endure$enduretracker.name=Ausdauer
actors.hero.abilities.warrior.endure$enduretracker.desc=Der Krieger verursacht nun Bonusschaden auf der Grundlage des erlittenen Schadens.\n\nBonus-Schaden: %1$d\nVerbleibende Schläge: %2$d
actors.hero.abilities.warrior.endure.short_desc=Der Krieger _hält durch_, überspringt mehrere Züge, erhält aber eine hohe Schadensresistenz. Er verursacht dann Bonus-Schaden basierend auf dem Schaden, den er ertragen hat.
actors.hero.abilities.warrior.endure.desc=Der Krieger hält 3 Züge lang durch und erleidet nur die Hälfte des Schadens aus allen Quellen. Diese Reduktion wird vor schadenssenkenden Effekten wie Rüstungen angewendet.\n\nNach dem Durchhalten teilt der Krieger bei seinem nächsten Treffer innerhalb von 10 Zügen Bonusschaden aus. Dieser Bonusschaden entspricht der Hälfte des gesamten Schadens, der ihm während des Aushaltens zugefügt wurde, vor allen Effekten der Schadensreduzierung!\n\nWenn der Krieger über eine Kombi verfügt, erhöht sich die verbleibende Zeit durch den Einsatz dieser Fähigkeit um 3 Züge.

actors.hero.abilities.mage.elementalblast.name=Elementarstoß
actors.hero.abilities.mage.elementalblast.no_staff=Du kannst diese Fähigkeit ohne deinen Zauberstab nicht einsetzen.
actors.hero.abilities.mage.elementalblast.short_desc=Der Magier sendet einen _Elementarstoß_ aus seinem Stab aus, der einen großen Bereich um ihn herum mit einem Effekt bedeckt, der je nach dem Zauber in seinem Stab variiert.
actors.hero.abilities.mage.elementalblast.desc=Der Magier sendet einen Magiestoß aus, der einen Radius von bis zu 4 Feldern abdeckt und bis zu 15-25 Schaden verursacht. Der spezifische Effekt des Magiestoßes hängt von dem Zauberstab ab, der mit dem Stab des Magiers fusioniert wurde.
actors.hero.abilities.mage.elementalblast.generic_desc=Die Wirkung des Elementarstoßes ähnelt der Wirkung des Zauberstabs, wenn er auf einen Feind oder Verbündeten gezielt wird.
actors.hero.abilities.mage.wildmagic.name=Wilde Magie
actors.hero.abilities.mage.wildmagic.no_wands=Du hast keine Zauberstäbe, die du einsetzen könntest!
actors.hero.abilities.mage.wildmagic.short_desc=Der Magier entfesselt die _Wilde Magie_, die in seinen Zauberstäben innewohnt, und feuert sie in einem einzigen Zug zufällig mehrmals auf ein ausgewähltes Ziel.
actors.hero.abilities.mage.wildmagic.desc=Der Magier entfesselt die Macht in seinen Zauberstäben, indem er sie bis zu 4 Mal in einem einzigen Zug zufällig abfeuert. Der Stab des Magiers wird bei diesem Effekt nicht berücksichtigt.\n\nAußerdem wird die Stufe jedes Zauberstabs um 2 erhöht, bis zu +3. Diese Fähigkeit verbraucht die Hälfte der Ladungen für jeden Schuss, und ein Zauberstab kann nicht mehr als 2 Mal abgefeuert werden.
actors.hero.abilities.mage.warpbeacon.name=Sprungmarke
actors.hero.abilities.mage.warpbeacon.depths=Du kannst nicht zwischen Tiefen springen.
actors.hero.abilities.mage.warpbeacon.locked_floor=Du kannst eine blockierte Ebene nicht verlassen.
actors.hero.abilities.mage.warpbeacon.too_far=Dieser Ort is zu weit entfernt!
actors.hero.abilities.mage.warpbeacon.invalid_beacon=Du kannst den Marker dort nicht platzieren!
actors.hero.abilities.mage.warpbeacon.window_desc=Dein Marker ist derzeit platziert auf Ebene %d.
actors.hero.abilities.mage.warpbeacon.window_tele=Teleportiere zum Marker
actors.hero.abilities.mage.warpbeacon.window_clear=entferne Marker
actors.hero.abilities.mage.warpbeacon.window_cancel=abbrechen
actors.hero.abilities.mage.warpbeacon.short_desc=Der Magier platziert eine _Sprungmarke_ an seinem aktuellen Standort, zu dem er sich sofort zurückteleportieren kann.
actors.hero.abilities.mage.warpbeacon.desc=Der Magier platziert eine Sprungmarke, zu der er sich auf Wunsch teleportieren kann. Die Platzierung einer Sprungmarke benötigt einen Zug, aber das Teleportieren passiert augenblicklich.\n\nDer Magier kann normalerweise nicht zwischen verschiedenen Ebenen teleportieren oder unerreichbare Orte, wie verschlossene Räume, erreichen. Der Magier kann in Gegner hinein teleportieren, wodurch sie beiseite geschoben werden.

actors.hero.abilities.rogue.smokebomb.name=Rauchbombe
actors.hero.abilities.rogue.smokebomb.fov=Du kannst nur zu einem leeren Feld in deinem Sichtfeld springen.
actors.hero.abilities.rogue.smokebomb.prompt=Wähle, wohin du springen möchtest
actors.hero.abilities.rogue.smokebomb$ninjalog.name=hölzerner Köder
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=Irgendwie sind Gegner einfach davon überzeugt, dass dieser hölzerne Köder der echte Schurke ist!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=Du kannst diese Einheit durch eine Helden-Rüstungsfähigkeit entdecken.
actors.hero.abilities.rogue.smokebomb.short_desc=Der Schurke lässt eine _Rauchbombe_ fallen, während er sich wegteleportiert. Er blendet die Gegner nahe seiner alten Position.
actors.hero.abilities.rogue.smokebomb.desc=Der Schurke wirft eine Rauchbombe und teleportiert sich bis zu 6 Felder weit weg. Er kann durch Gefahren und Feinde hindurch teleportieren, aber nicht durch festes Terrain wie Wände.\n\nFeinde, die sich in der Nähe der alten Position des Schurken befinden, werden 5 Züge lang geblendet.
actors.hero.abilities.rogue.deathmark.name=Todesmakierung
actors.hero.abilities.rogue.deathmark.ally_target=Du kannst nur Gegner markieren.
actors.hero.abilities.rogue.deathmark.short_desc=Der Schurke platziert eine _Todesmarkierung_ auf einem ausgewählten Gegner. Markierte Gegner erleiden Bonusschaden, aber können nicht sterben, bevor die Markierung beendet ist.
actors.hero.abilities.rogue.deathmark.desc=Der Schurke platziert eine Markierung auf einen ausgewählten Gegner, was dafür sorgt, dass dieser 25% Bonusschaden bekommt. Die Markierung wird sofort eingesetzt und hält 5 Züge.\n\nMarkierte Gegner erleiden Bonusschaden, aber können nicht sterben, bis die Markierung ausläuft. Wenn ein Gegner bei Auslauf der Markierung 0 Lebenspunkte hat, stirbt er sofort.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=für den Tod markiert
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=Dieser Gegner wurde markiert, was dafür sorgt, dass er 25%% Bonusschaden bekommt, aber auch, dass er nicht sterben kann, bevor die Markierung ausläuft.\n\nVerbleibende Züge: %s.
actors.hero.abilities.rogue.shadowclone.name=Schattendoppelgänger
actors.hero.abilities.rogue.shadowclone.short_desc=Der Schurke beschwört einen _Schattendoppelgänger_, welcher gelenkt werden kann, um ihn im Kampf zu unterstützen.
actors.hero.abilities.rogue.shadowclone.desc=Der Schurke beschwört eine schattenhafte Nachahmung seiner selbst, die darauf gerichtet werden kann, ihn im Kampf zu unterstützen. Die Führung des Schattenklons kostet keine Ladung.\n\nDer Klon hat 80 Lebenspunkte, keine Rüstung und verursacht 10-20 Schaden. Alle diese Eigenschaften können mit Talenten verbessert werden, so dass der Klon von Waffen und Rüstungen profitiert, die der Held besitzt.
actors.hero.abilities.rogue.shadowclone$shadowally.name=Schattenschurke
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Dein Klon bewegt sich an diese Position.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Dein Klon wird dir folgen.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Dein Klon greift jetzt an!
actors.hero.abilities.rogue.shadowclone$shadowally.directed_wander=Dein Abbild patrouilliert.
actors.hero.abilities.rogue.shadowclone$shadowally.desc=Eine Kopie des Schurken aus schattenhafter Dunkelheit. Es steht still wie eine Statue, mit leeren Augen und winzigen Irrlichtern aus Dunkelheit, die wie Dampf aus ihm aufsteigen.\n\nDer Klon ist keine perfekte Kopie des Schurken, aber dennoch ein anständiger Kämpfer und kann mit den richtigen Talenten von der Ausrüstung des Schurken profitieren.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=Du kannst diese Einheit durch eine Helden-Rüstungsfähigkeit entdecken.

actors.hero.abilities.huntress.spectralblades.name=Spektralklingen
actors.hero.abilities.huntress.spectralblades.short_desc=Die Jägerin wirft _Spektralklingen_ auf ein Ziel und verursacht Schaden auf Grundlage ihrer momentan ausgerüsteten Nahkampfwaffe.
actors.hero.abilities.huntress.spectralblades.desc=Die Jägerin wirft eine Geisterklinge auf einen Feind, die wie ein Fernangriff ihrer Nahkampfwaffe wirkt. Alle normalen Effekte einer Nahkampfwaffe werden aktiviert, einschließlich Verzauberungen.
actors.hero.abilities.huntress.naturespower.name=Kraft der Natur
actors.hero.abilities.huntress.naturespower.short_desc=Die Jägerin ruft die _Kräfte der Natur_, wodurch ihre Bewegungsgeschwindigkeit und die Feuerrate ihres Bogens für eine kurze Zeit erhöht wird.
actors.hero.abilities.huntress.naturespower.desc=Die Jägerin stärkt sich und ihren Bogen eine Zeitlang mit der Kraft der Natur! Dies hält 8 Züge lang an.\n\nIn dieser Zeit bewegt sich die Jägerin mit doppelter Geschwindigkeit, die Angriffe mit ihrem Bogen erfolgen um 33% schneller. Die Bonuseffekte am Bogen werden nicht ausgelöst, wenn die Scharfschützin ihre Spezialangriffe einsetzt.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=Kraft der Natur
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=Die Jägerin ist kurzzeitig dazu in der Lage, ihre Bewegungsgeschwindigkeit und die Angriffsgeschwindigkeit mit ihrem Bogen zu erhöhen.\n\nVerbleibende Züge: %s.
actors.hero.abilities.huntress.spirithawk.name=Geisterfalke
actors.hero.abilities.huntress.spirithawk.no_space=Es ist kein Platz in deiner Nähe frei.
actors.hero.abilities.huntress.spirithawk.short_desc=Die Jägerin beschwört einen _Geisterfalken_-Vertrauten, der ihr helfen kann, Orte auszukundschaften und Gegner abzulenken.
actors.hero.abilities.huntress.spirithawk.desc=Die Jägerin beschwört einen Geisterfalken-Vertrauten, der durch erneutes Anwenden der Fähigkeit gelenkt werden kann, solange er beschworen bleibt. Der Falke bleibt 100 Züge lang aktiv, und die Steuerung des Falken kostet keine Ladung.\n\nDer Falke hat nur wenige Lebenspunkte und Angriffskraft, ist aber schnell, weicht gut aus und ist treffsicher. Er teilt sein gesamtes Sichtfeld stetig mit der Jägerin. Er ist immun gegen alle flächengebundenen Effekte, wie Feuer oder Giftgas. Er greift nicht an, wenn er nicht ausdrücklich dazu aufgefordert wird.
actors.hero.abilities.huntress.spirithawk$hawkally.name=Geisterfalke
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Dein Falke bewegt sich an diese Position.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Dein Falke bewegt sich und folgt dir.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Dein Falke bewegt sich zum Angriff!
actors.hero.abilities.huntress.spirithawk$hawkally.directed_wander=Dein Falke patrouilliert.
actors.hero.abilities.huntress.spirithawk$hawkally.desc=Ein magischer Falke, beschworen von der Jägerin. Er leuchtet in einem hellen ätherischen Blau, sein Kopf bewegt sich ständig, während er die Umgebung überblickt. \n\nObwohl er kein großer Kämpfer ist, eignen sich seine Geschwindigkeit und seine Sicht hervorragend zum Aufspüren und Ablenken von Feinden.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Verbleibende Züge: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=garantiertes Ausweichen übrig: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=Du kannst diese Einheit durch eine Helden-Rüstungsfähigkeit entdecken.

actors.hero.abilities.duelist.challenge.name=herausfordern
actors.hero.abilities.duelist.challenge.prompt=Wähle einen Feind zum Herausfordern
actors.hero.abilities.duelist.challenge.already_dueling=Du kannst nur an einem Duell gleichzeitig teilnehmen.
actors.hero.abilities.duelist.challenge.ally_target=Du kannst nur Feinde zum Kampf herausfordern.
actors.hero.abilities.duelist.challenge.unreachable_target=Du musst dazu in der Lage sein, dein Ziel zu erreichen.
actors.hero.abilities.duelist.challenge.distant_target=Dieser Gegner ist zu weit entfernt, als dass du ihn herausfordern könntest.
actors.hero.abilities.duelist.challenge.short_desc=Die Zweikämpferin _fordert_ einen in der Nähe befindlichen Gegner zu einem Duell, wodurch alle anderen Gegner zeitweilig eingefroren werden.
actors.hero.abilities.duelist.challenge.desc=Die Zweikämpferin fordert einen in der Nähe befindlichen Gegner zum Duell. Dieser Gegner ist dann gezwungen, gegen sie zu kämpfen, während alle anderen Gegner zeitweilig in der Zeit eingefroren werden.\n\nDas Ziel muss erreichbar und sich innerhalb eines Radius von 5 Feldern um die Zweikämpferin herum befinden. Das Duell hält an, bis 10 Züge vorüber sind, der Gegner stirbt oder die Zweikämpferin mehr als 5 Felder vom Gegner entfernt steht.\n\nEingefrorene Gegner sind unverwundbar. Die Alliierten der Zweikämpferin werden durch diese Fähigkeit nicht eingefroren, wird jedoch ein Boss herausgefordert, so werden seine Lakaien ebenfalls nicht eingefroren.
actors.hero.abilities.duelist.challenge$duelparticipant.name=Duellteilnehmer
actors.hero.abilities.duelist.challenge$duelparticipant.desc=Dieser Charakter nimmt an einem Duell teil. Er sowie jeder seiner Alliierten oder Lakaien können normal agieren, während andere eingefroren sind.\n\nDas Duell dauert eine bestimmte Zeit an, bis einer der Teilnehmer stirbt, oder bis die Teilnehmer sich auseinander bewegen, bis sie mehr als 5 Felder voneinander entfernt sind.\n\nVerbleibende Züge: %d.
actors.hero.abilities.duelist.elementalstrike.name=Elementarschlag
actors.hero.abilities.duelist.elementalstrike.short_desc=Die Zweikämpferin setzt einen _Elementarschlag_ ein, bei dem sich ein auf ihrer Waffenverzauberung beruhender Effekt kegelförmig ausbreitet.
actors.hero.abilities.duelist.elementalstrike.desc=Die Zweikämpferin schlägt einen Feind oder einen Ort mit einem regulären Angriff, der garantiert trifft und einen magischen Effekt in einem kegelförmigen Bereich von 65 Grad bis zu 4 Felder weit hervorruft. Dieser magische Effekt ist je nach der Verzauberung der Primärwaffe der Zweikämpferin unterschiedlich.
actors.hero.abilities.duelist.elementalstrike.generic_desc=Ein Elementarschlag ohne Verzauberung ruft einen geringen magischen Impuls hervor, der allen Feinden in Reichweite zwischen 6 und 12 Schadenspunkte zufügt.
actors.hero.abilities.duelist.feint.name=Finte
actors.hero.abilities.duelist.feint.prompt=Wähle einen Ort, wohin du sprinten möchtest
actors.hero.abilities.duelist.feint.too_far=Dieser Ort befindet sich nicht direkt neben dir.
actors.hero.abilities.duelist.feint.bad_location=Du kannst dich nicht an diesen Ort  bewegen.
actors.hero.abilities.duelist.feint.short_desc=Die Zweikämpferin _schlägt eine Finte_ und täuscht dabei einen Angriff vor, während sie aber auf ein angrenzendes Feld springt. Feinde werden ihr Nachbild angreifen und stehen einem Gegenangriff gegenüber schutzlos da.
actors.hero.abilities.duelist.feint.desc=Die Zweikämpferin täuscht einen Angriff vor, während sie aber auf ein nächstgelegenes Feld springt und ein kurzzeitiges Nachbild von sich hinterlässt. Feinde, welche die Zweikämpferin angreifen, werden stattdessen dieses Nachbild angreifen.\n\nFeinde, die ein solches Nachbild angreifen, werden verwirrt, wodurch ihre nächste Aktion abgebrochen wird und sie einem Überraschungsangriff schutzlos gegenüberstehen.

actors.hero.abilities.cleric.ascendedform.name=Erhabener Aufstieg
actors.hero.abilities.cleric.ascendedform.short_desc=Der Kleriker _erhebt sich_, tritt in einen göttlichen Zustand und erhält neue Zauber, Angriffsreichweite und Schilde.
actors.hero.abilities.cleric.ascendedform.desc=Der Kleriker entfesselt heilige Energie und tritt für 10 Runden in einen göttlichen Zustand. In dieser Form kann er neue Zauber wirken, erhält 2 Felder Angriffsreichweite und 30 Schildpunkte. Pro verbrauchter Schriftladung erhält er 10 Schildpunkte.\n\nDurch den Erhabenen Aufstieg und seine Zauber gewährte Schilde verfallen nicht natürlich, verschwinden aber sofort beim Ende des Aufstiegs. Erneute Verwendung der Fähigkeit verlängert die Dauer.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=Erhabener Aufstieg
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=Heilige Energie fließt durch den Kleriker. In dieser Form erhält der Kleriker durch seine heilige Energie 2 Felder Angriffsreichweite und pro verbrauchter Schriftladung 10 Schildpunkte. Zudem kann er durch Aufstieg-Fertigkeiten freigeschaltete Zauber wirken.\n\nDurch Aufstieg und seine Zauber gewährte Schilde verfallen nicht normal, verschwinden aber sofort beim Ende des Aufstiegs.\n\nAktuelle Schildpunkte: %1$d\nVerbleibende Runden: %2$d
actors.hero.abilities.cleric.trinity.name=Dreifaltigkeit
actors.hero.abilities.cleric.trinity.no_imbue=Dreifaltigkeit hat derzeit keine Effektsammlung für einen Aspekt. Verwende einen Aspekt-Zauber, um eine Sammlung zu erhalten!
actors.hero.abilities.cleric.trinity.no_duplicate=Dreifaltigkeit kann keine Effekte von bereits getragener Ausrüstung kopieren!
actors.hero.abilities.cleric.trinity.ench_glyph_use=Dreifaltigkeit verbraucht _%2$s Ladungen_, um den Effekt dieser Verzauberung oder Gravur für _%1$d Runden_ zu erhalten.
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=Dreifaltigkeit verbraucht _%2$s Ladungen_, um den Effekt dieser _mächtigen_ Verzauberung oder Gravur für _%1$d Runden_ zu erhalten.
actors.hero.abilities.cleric.trinity.wand_use=Dreifaltigkeit verbraucht _%2$s Ladungen_, um den Zauberstab-Effekt der _Stufe %1$d_ zu nutzen.
actors.hero.abilities.cleric.trinity.wand_multi_use=Dreifaltigkeit verbraucht _%2$s Ladungen_, um den _mehrfach geladenen_ Zauberstab-Effekt der _Stufe %1$d_ zu nutzen.
actors.hero.abilities.cleric.trinity.thrown_use=Dreifaltigkeit verbraucht _%2$s Ladungen_, um den Wurfwaffen-Effekt _Stufe %1$d_ zu nutzen.
actors.hero.abilities.cleric.trinity.ring_use=Dreifaltigkeit verbraucht _%2$s Ladungen_, um den Effekt dieses Rings für 20 Runden auf _Stufe %1$d_ zu erhalten.
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=Dreifaltigkeit verbraucht _%2$s Ladungen_, um den Fernalchemie-Effekt dieses Artefakts zu nutzen.
actors.hero.abilities.cleric.trinity.chaliceofblood_use=Dreifaltigkeit verbraucht _%2$s Ladungen_, um die passive Lebensregeneration der _Stufe %1$d_ dieses Artefakts für 20 Runden zu erhalten.
actors.hero.abilities.cleric.trinity.driedrose_use=Dreifaltigkeit verbraucht _%2$s Ladungen_, um den Effekt dieses Artefakts zu nutzen: einen freundlichen korrupten Geist mit _Stufe %1$d_ Geist-Lebenspunkten zu beschwören.
actors.hero.abilities.cleric.trinity.etherealchains_use=Dreifaltigkeit verbraucht _%2$s Ladungen_, um den Ketten-Effekt dieses Artefakts mit _%1$d Felder_ Reichweite zu nutzen.
actors.hero.abilities.cleric.trinity.hornofplenty_use=Dreifaltigkeit verbraucht _%2$s Ladungen_, um den Naschen-Effekt dieses Artefakts zu nutzen.
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=Dreifaltigkeit verbraucht _%2$s Ladungen_, um den Diebstahl-Effekt _Stufe %1$d_ dieses Artefakts auf Gegner anzuwenden.
actors.hero.abilities.cleric.trinity.sandalsofnature_use=Dreifaltigkeit verbraucht _%2$s Ladungen_, um den Effekt dieses Artefakts zu nutzen: einen zufälligen schädlichen Samen Wurzeln schlagen zu lassen.
actors.hero.abilities.cleric.trinity.talismanofforesight_use=Dreifaltigkeit verbraucht _%2$s Ladungen_, um den Erkundungs-Effekt _Stufe %1$d_ dieses Artefakts zu nutzen.
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=Dreifaltigkeit verbraucht _%2$s Ladungen_, um den Zeitstillstands-Effekt dieses Artefakts für _%1$d_ Runden zu erhalten.
actors.hero.abilities.cleric.trinity.unstablespellbook_use=Dreifaltigkeit verbraucht _%2$s Ladungen_, um den Effekt dieses Artefakts zu nutzen: eine zufällige Schriftrolle mit _%1$d/10_ Wahrscheinlichkeit für kostenlose Nutzung.
actors.hero.abilities.cleric.trinity.skeletonkey_use=Dreifaltigkeit verbraucht _%2$s Ladungen_, um den Einsetzen-Effekt dieses Artefakts zu nutzen.
actors.hero.abilities.cleric.trinity.cloakofshadows_use=Dreifaltigkeit verbraucht _%2$s Ladungen_, um den Unsichtbarkeitseffekt dieses Artefakts für _%1$d_ Runden zu erhalten.
actors.hero.abilities.cleric.trinity.capeofthorns_use=Dreifaltigkeit verbraucht _%2$s Ladungen_, um den Dornen-Effekt dieses Artefakts für _%1$d_ Runden zu erhalten.
actors.hero.abilities.cleric.trinity.lloydsbeacon_use=Dreifaltigkeit verbraucht _%2$s Ladungen_, um den Teleportations-Effekt dieses Artefakts zu nutzen.
actors.hero.abilities.cleric.trinity.shuriken_box_use=Dreifaltigkeit verbraucht _%2$s Ladungen_, um den Effekt dieses Artefakts zu nutzen: einen _kleinen Wurfstern der Stufe %1$d_ zu werfen.
actors.hero.abilities.cleric.trinity.instructiontool_use=Dreifaltigkeit verbraucht _%2$s Ladungen_, um den Effekt dieses Artefakts zu nutzen: eine Begleitdrohne mit _%1$d/10_ der maximalen Helden-Lebenspunkte zu produzieren.
actors.hero.abilities.cleric.trinity.cost=Die Ladungskosten dieser Rüstungsfähigkeit variieren, betragen aber normalerweise _%d_.
actors.hero.abilities.cleric.trinity.short_desc=Der Kleriker erhält die _Dreifaltigkeit_-Rüstungsfähigkeit, die göttliche Allwissenheit verleiht, um neue Zauber zu nutzen und Effekte seiner identifizierten Ausrüstung zu manifestieren.
actors.hero.abilities.cleric.trinity.desc=Der Kleriker erhält mit _Dreifaltigkeit_ eine Rüstungsfähigkeit, die durch drei neue Zauber verschiedene Gegenstandseffekte auswählt und nutzt. Jeder Aspekt-Zauber ist auf eine andere Art von bereits identifizierter Ausrüstung spezialisiert: Körper-Aspekt (Waffen & Rüstungen), Geist-Aspekt (Stäbe & Wurfwaffen), Seelen-Aspekt (Ringe & Artefakte).\n\nJeder Aspekt-Zauber kann nur einen Effekt gleichzeitig manifestieren. Dreifaltigkeit kann keine Effekte von bereits getragener Ausrüstung kopieren.
actors.hero.abilities.cleric.trinity$wndusetrinity.text=Wähle den Aspekt-Zauber für die Dreifaltigkeit. Effekte verschiedener Aspekte können gleichzeitig wirken.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_Körper-Aspekt: %s_
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_Geist-Aspekt: %s_
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_Seelen-Aspekt: %s_
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=Wähle den Gegenstandseffekt für die Dreifaltigkeit. Zusätzliche Informationen werden vor der Bestätigung angezeigt.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=Wähle einen Körper-Aspekt-Effekt
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=Wähle einen Geist-Aspekt-Effekt
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=Wähle einen Seelen-Aspekt-Effekt
actors.hero.abilities.cleric.powerofmany.name=Eins-Sein
actors.hero.abilities.cleric.powerofmany.prompt_default=Wähle einen Verbündeten oder eine Position
actors.hero.abilities.cleric.powerofmany.prompt_ally=Gib deinem Heiligen Bund einen Befehl
actors.hero.abilities.cleric.powerofmany.ally_exists=Du hast bereits einen gestärkten Verbündeten.
actors.hero.abilities.cleric.powerofmany.no_vision=Du kannst keine Position außerhalb deiner Sicht anvisieren.
actors.hero.abilities.cleric.powerofmany.only_allies=Du kannst nur Verbündete verstärken.
actors.hero.abilities.cleric.powerofmany.short_desc=Der Kleriker kanalisiert _Eins-Sein_, um bestehende Verbündete zu verstärken oder einen neuen Bund zu erschaffen.
actors.hero.abilities.cleric.powerofmany.desc=Der Kleriker kanalisiert _Eins-Sein_, um bestehende Verbündete zu verstärken oder einen neuen, 100 Runden währenden Bund zu erschaffen. Wirkt der Kleriker diese Rüstungsfähigkeit auf eine leere Position, erschafft er einen neuen Bund.\n\nDurch Eins-Sein gestärkte Verbündete erhalten 25% Schadensbonus und 25% Schadensreduktion und teilen die Sicht mit dem Kleriker. Bei Nutzung der Rüstungsfähigkeit erhalten sie zudem 25 Schildpunkte.\n\nDer Kleriker erhält außerdem drei neue Zauber, die nur auf gestärkte Verbündete gewirkt werden können. Eins-Sein endet nicht durch diese Zauber.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=Eins-Sein
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=Dieser Verbündete wurde durch Eins-Sein gestärkt und erhält 25%% Schadensbonus und 25%% Schadensreduktion. Der Verbündete teilt auch die Sicht mit dem Kleriker und profitiert vom Eins-Sein-Zauber.\n\nWenn Verbündete wie der Prismawächter vergehen, bleibt der Eins-Sein-Effekt bestehen, aber seine Dauer läuft weiter ab.\n\nVerbleibende Runden: %s
actors.hero.abilities.cleric.powerofmany$lightally.name=Heiliger Bund
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=Dein Verbündeter hat sich dorthin bewegt.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=Dein Verbündeter folgt dir.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=Dein Verbündeter greift an!
actors.hero.abilities.cleric.powerofmany$lightally.directed_wander=Dein Verbündeter patrouilliert.
actors.hero.abilities.cleric.powerofmany$lightally.desc=Ein Klon eines Abenteuergefährten des Klerikers, ganz aus kondensiertem heiligem Licht geformt. Auch wenn der Heilige Bund die Gestalt eines anderen Helden hat, besitzt er keine dessen einzigartigen Fähigkeiten. Der Verbündete bleibt bestehen, solange der Eins-Sein-Effekt anhält.\n\nDer Verbündete kann ohne Ladungsverbrauch durch erneute Verwendung der Eins-Sein-Rüstungsfähigkeit gesteuert werden.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=Du kannst diese Einheit durch eine Helden-Rüstungsfähigkeit entdecken.


actors.hero.abilities.ratmogrify.name=rattifizieren
actors.hero.abilities.ratmogrify.cant_transform=Du kannst das nicht rattifizieren!
actors.hero.abilities.ratmogrify.too_strong=Dieser Gegner ist zu stark zum Rattifizieren!
actors.hero.abilities.ratmogrify.short_desc=Der Held _rattifiziert_ einen Gegner! Dies verwandelt ihn eine Zeitlang in eine Ratte ohne Fähigkeiten.
actors.hero.abilities.ratmogrify.desc=Der Held verwandelt einen Gegner 6 Züge lang in eine Ratte! Bosse, Verbündete und Ratten können nicht rattifiziert werden.\n\nVerwandelte Feinde behalten ihre ursprünglichen Werte, haben aber keine Fähigkeiten.
actors.hero.abilities.ratmogrify$transmograt.name=rattifiziert %s
actors.hero.abilities.ratmogrify$transmograt.desc=Dieser Gegner wurde in eine Ratte verwandelt. Eine enorme Verbesserung,  wenn du mich fragst! - Der Rattenkönig
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Getötet von: einem rattifizierten Feind


##Cleric Spells
actors.hero.spells.auraofprotection.name=Schutzaura
actors.hero.spells.auraofprotection.short_desc=Stärkt die Verteidigung des Paladins und naher Verbündeter.
actors.hero.spells.auraofprotection.desc=Der Paladin beginnt, schützende Energie um sich herum auszustrahlen und erzeugt für _20 Runden_ eine Schutzaura. Alle Verbündeten (einschließlich des Paladins selbst) im _2-Feld_-Umkreis erhalten _%1$d%%_ Schadensreduktion und _%2$d%%_ Verstärkung der Paladin-Rüstungsgravur.\n\nDie Schadensreduktion hat Vorrang vor anderen Schadensminderungseffekten (z. B. Rüstung). Die Gravurverstärkung wirkt immer, aber wenn eine Einheit (z. B. der Paladin selbst, Prismawächter) bereits von der Paladin-Gravur profitiert, kann dieser Zauber keinen weiteren Nutzen bringen.\n\nDieser Zauber _verbraucht 1 Runde_.
actors.hero.spells.auraofprotection$aurabuff.name=Schutzaura
actors.hero.spells.auraofprotection$aurabuff.desc=Der Paladin strahlt schützende Energie um sich herum aus.\n\nAlle Verbündeten in der Nähe (einschließlich des Paladins selbst) erhalten Schadensreduktion und Verstärkung der Paladin-Rüstungsgravur.\n\nVerbleibende Runden: %s

actors.hero.spells.beamingray.name=Lichtbeschwörung
actors.hero.spells.beamingray.no_space=Dort ist kein Platz für deinen Verbündeten.
actors.hero.spells.beamingray.out_of_range=Diese Position ist außerhalb der Reichweite.
actors.hero.spells.beamingray.short_desc=Teleportiert deinen Verbündeten und gewährt einen Schadensbonus.
actors.hero.spells.beamingray.desc=Der Kleriker nutzt die Kraft seiner Verbündeten, um einen Lichtstrahl zu erschaffen, der einen Verbündeten an eine Position teleportiert. Wird der Strahl auf einen Gegner gerichtet, teleportiert er den Verbündeten in die Nähe des Gegners und macht ihn zum Angriffsziel.\n\nDie maximale Reichweite des Lichtstrahls beträgt _%1$d Felder_ und erhöht den Schadensbonus von Eins-Sein gegen den nächsten Gegner im _4-Feld_-Umkreis auf _%2$d%%_ für _10 Runden_. Dieser Zauber kann auch normalerweise unbewegliche Verbündete teleportieren, halbiert dann aber die Reichweite.\n\nDieser Zauber _verbraucht 1 Runde_.
actors.hero.spells.beamingray$beamingrayboost.name=Lichtbeschwörung
actors.hero.spells.beamingray$beamingrayboost.desc=Dieser Verbündete wurde kürzlich durch einen Lichtstrahl der Lichtbeschwörung teleportiert und erhält einen Schadensbonus gegen den Gegner, der dem Teleportationsziel am nächsten ist. Eins-Sein endet nicht während der Wirkung dieses Bonus.\n\nVerbleibende Runden: %s

actors.hero.spells.blessspell.name=Heiliger Segen
actors.hero.spells.blessspell.short_desc=Gewährt dem Zaubernden Segen und Schild, anderen Einheiten Segen und Heilung.
actors.hero.spells.blessspell.desc=Der Zaubernde segnet sich selbst oder eine Einheit im Sichtfeld mit einem heiligen Segen.\n\nZielt der Segen auf den Zaubernden selbst, ist er schwächer: Er erhält _%1$d Runden Segen_ und _%2$d Schildpunkte_.\n\nZielt der Segen auf eine andere Einheit, ist er stärker: Sie erhält _%3$d Runden Segen_ und _%4$d Heilung_. Überschüssige Heilung wird in Schild umgewandelt.\n\nDieser Zauber _verbraucht 1 Runde_, unabhängig vom Ziel.

actors.hero.spells.bodyform.name=Körper-Aspekt
actors.hero.spells.bodyform.short_desc=Wählt eine Verzauberung oder Gravur für Dreifaltigkeit aus.
actors.hero.spells.bodyform.desc=Der Kleriker wählt eine bereits identifizierte Verzauberung oder Gravur aus und die Dreifaltigkeit manifestiert deren Effekt.\n\nBei Verwendung der Dreifaltigkeit erhält der Kleriker den Effekt der gewählten Verzauberung oder Gravur für _%d Runden_. Die temporäre Verzauberung oder Gravur hat alle Effekte, die sie normalerweise hätte.\n\nDieser Zauber erneuert jeden bereits durch Dreifaltigkeit manifestierten Körper-Aspekt-Effekt.\n\nDieser Zauber _kostet keine Zeit_.
actors.hero.spells.bodyform$bodyformbuff.name=Körper-Aspekt
actors.hero.spells.bodyform$bodyformbuff.desc=Der Körper-Aspekt-Zauber verleiht dir den Effekt einer Verzauberung oder Gravur, als ob du sie an deiner aktuellen Waffe oder Rüstung ausgerüstet hättest.\n\nBeachte: Der Körper-Aspekt kann keine Effekte kopieren, die du bereits ausgerüstet hast.\n\nAktueller Effekt: %1$s\n\nVerbleibende Runden: %2$s

actors.hero.spells.cleanse.name=Heilige Reinigung
actors.hero.spells.cleanse.short_desc=Entfernt Debuffs und gewährt Schild.
actors.hero.spells.cleanse.desc=Der Zaubernde entfernt alle Debuffs von sich und allen Verbündeten im Sichtfeld. Anschließend erhalten alle betroffenen Einheiten _%1$d Runden_ Debuff-Immunität und _%2$d Schildpunkte_.\n\nDieser Zauber _verbraucht 1 Runde_.

actors.hero.spells.clericspell.prompt=Wähle ein Ziel
actors.hero.spells.clericspell.no_target=Dort gibt es kein Ziel.
actors.hero.spells.clericspell.invalid_target=Du kannst diese Position nicht anvisieren.
actors.hero.spells.clericspell.invalid_enemy=Du kannst diesen Gegner nicht anvisieren.
actors.hero.spells.clericspell.charge_cost=Ladungsverbrauch: %d

actors.hero.spells.divinesense.name=Göttliche Wahrnehmung
actors.hero.spells.divinesense.short_desc=Erhält für kurze Zeit Sehersinn mit großer Reichweite.
actors.hero.spells.divinesense.desc=Der Zaubernde konzentriert seine Wahrnehmung auf die Umgebung und erhält für _50 Runden_ Sehersinn mit _%d Felder_ Reichweite.\n\nDieser Zauber _kostet keine Zeit_.
actors.hero.spells.divinesense$divinesensetracker.name=Göttliche Wahrnehmung
actors.hero.spells.divinesense$divinesensetracker.desc=Diese Einheit kann vorübergehend mit ihrem Sehersinn andere Lebewesen in der Nähe wahrnehmen!\n\nVerbleibende Runden: %s

actors.hero.spells.divineintervention.name=Göttliche Intervention
actors.hero.spells.divineintervention.short_desc=Stärkt die Schilde des Klerikers und seiner Verbündeten erheblich.
actors.hero.spells.divineintervention.desc=Der Kleriker nutzt den Kodex, um sich und seinen Verbündeten unübertreffliche göttliche Kraft zu verleihen, erhöht den Schild aller auf _%1$d Punkte_ und verlängert den Erhabenen Aufstieg um _%2$d Runden_. Die unübertreffliche Verteidigung dieses Zaubers entspricht seinem hohen Ladungsverbrauch.\n\nWie andere durch Erhabenen Aufstieg gewährte Schilde verfällt auch dieser nicht normal, verschwindet aber sofort beim Ende des Erhabenen Aufstiegs.\n\nDieser Zauber _verbraucht 1 Runde_.

actors.hero.spells.flash.name=Himmelstreppe
actors.hero.spells.flash.prompt=Wähle eine Position
actors.hero.spells.flash.short_desc=Teleportiert an einen nahen Ort.
actors.hero.spells.flash.desc=Der Kleriker kanalisiert die Kraft des Erhabenen Aufstiegs an einem nahen Ort und teleportiert sich dorthin. Die Himmelstreppe kann den Kleriker an jeden unbesetzten, bereits erkundeten Ort in Reichweite teleportieren. Jede Verwendung dieses Zaubers während desselben Erhabenen Aufstiegs verbraucht mehr Kodexladungen.\n\nDieser Zauber _verbraucht 1 Runde_.

actors.hero.spells.guidinglight.name=Leitlicht
actors.hero.spells.guidinglight.short_desc=Verursacht fernen magischen Schaden mit garantierter Treffern.
actors.hero.spells.guidinglight.desc=Der Zaubernde feuert einen magischen Lichtpfeil auf das Ziel ab, der _2~8 Schaden_ verursacht und Glanz anwendet. Der nächste nicht überstärkte physische Angriff auf ein Glanz-Ziel trifft garantiert.\n\nDieser Zauber _kostet 1 Runde_.
actors.hero.spells.guidinglight.desc_priest=_Wenn der Priester diesen Zauber wirkt, ist er stärker._ Die erste Anwendung alle 50 Runden verbraucht keine Schriftrollenladung, und Glanz kann durch Glanz, Zauberstäbe, andere Einheiten und direkt auf Feinde wirkende Artefakte verbraucht werden. Bei solcher Verwendung verursacht Glanz zusätzlichen magischen Schaden in Höhe von _Priesterstufe +5_.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=Göttliches Leiten
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=Der Priester kann alle 50 Runden einmal kostenlos Göttliches Leiten wirken.\n\nVerbleibende Runden: %s
actors.hero.spells.guidinglight$illuminated.name=Glanz
actors.hero.spells.guidinglight$illuminated.desc=Diese Einheit wurde von Göttlichem Leiten getroffen und mit Heiligenschein belegt. Die Helligkeit des Heiligenscheins reicht nicht aus, um die Umgebung zu erhellen, aber seine Magie erleichtert dem Kleriker das Treffen von Gegnern.
actors.hero.spells.guidinglight$illuminated.desc_priest=Priester können Glanz durch Morgenrot-Glanz, Zauberstabzauber, Verbündetenangriffe oder bestimmte Artefakteffekte verbrauchen. So verwendeter Glanz verursacht zusätzlichen magischen Schaden in Höhe von Priesterstufe +5.
actors.hero.spells.guidinglight$illuminated.desc_generic=Andere Helden können durch das Talent Glühendes Licht immer noch zusätzlichen Schaden verursachen, erhalten jedoch keinen Präzisionsbonus davon.

actors.hero.spells.hallowedground.name=Heiliges Gebiet
actors.hero.spells.hallowedground.prompt=Wähle eine Position
actors.hero.spells.hallowedground.short_desc=Heilt Verbündete, verlangsamt Feinde und verbreitet Vegetation im Umkreis.
actors.hero.spells.hallowedground.desc=Der Priester bündelt seine heilige Magie auf dem Boden in der Nähe und erschafft ein heiliges Gebiet der Größe _%1$dx%1$d_ für _20 Runden_.\n\nBeim Wirken heilt der Zauber sofort alle Verbündeten um _15 Punkte_ (unverletzte Verbündete und der Priester erhalten Schilde), fesselt Feinde kurz und verbreitet niedriges Gras.\n\nJede Runde heilt das heilige Gebiet Verbündete um _1 Punkt_ (unverletzte Verbündete und der Priester erhalten Schilde), schwächt Feinde und lässt zufällig hohes Gras wachsen.\n\nHeiliges Gebiet wird durch Feuer zerstört. Wenn passive Heilung deaktiviert ist oder der Priester lange keine Erfahrungspunkte erhält, erzeugt das Gebiet nur dürres Gras.\n\nDieser Zauber _kostet 1 Runde_.
actors.hero.spells.hallowedground$hallowedterrain.desc=Dieser Ort wurde in heiliges Gebiet verwandelt. Heiliges Gebiet verlangsamt Feinde, heilt Verbündete und verbreitet Vegetation.

actors.hero.spells.holyintuition.name=Heilige Vorahnung
actors.hero.spells.holyintuition.prompt=Wähle einen Gegenstand
actors.hero.spells.holyintuition.cursed=Du spürst eine bösartige Magie, die in diesem Gegenstand lauert.
actors.hero.spells.holyintuition.uncursed=Dieser Gegenstand ist nicht verflucht.
actors.hero.spells.holyintuition.short_desc=Prüft einen Gegenstand auf Verfluchung.
actors.hero.spells.holyintuition.desc=Der Zaubernde konzentriert seine Wahrnehmung auf einen Gegenstand, um seinen Fluchstatus zu bestimmen, ohne ihn auszurüsten.\n\nDieser Zauber _kostet 1 Runde_.

actors.hero.spells.holylance.name=Heiliger Speer
actors.hero.spells.holylance.short_desc=Verursacht hohen fernen magischen Schaden.
actors.hero.spells.holylance.desc=Der Priester bündelt große Mengen Energie zu einem tödlichen heiligen Wurfspeer. Der Speer verursacht _%1$d~%2$d Schaden_ und fügt Untoten und Dämonen garantiert maximalen Schaden zu.\n\nDieser Zauber hat einen extrem hohen Ladungsverbrauch und eine _Abklingzeit von 30 Runden_.\n\nDieser Zauber _kostet 1 Runde_.
actors.hero.spells.holylance$lancecooldown.name=Heiliger Speer - Abklingzeit
actors.hero.spells.holylance$lancecooldown.desc=Der Priester hat kürzlich den Heiligen Speer gewirkt und muss eine Weile warten, bevor er ihn erneut wirken kann.\n\nVerbleibende Runden: %s

actors.hero.spells.holyward.name=Heilige Rüstung
actors.hero.spells.holyward.glyph_name=Heilige%s
actors.hero.spells.holyward.glyph_desc=Diese Gravur erhöht die Schadensmenge, die die Rüstung abwehren kann, geringfügig.
actors.hero.spells.holyward.short_desc=Überschreibt vorübergehend Gravuren, um die Rüstungsverteidigung zu verstärken.
actors.hero.spells.holyward.desc=Der Zaubernde versieht seine getragene Rüstung mit einer heiligen Gravur, die die Rüstungsverteidigung um _1 Punkt_ erhöht. Dieser Zauber kostet keine Zeit.\n\nDie Gravur hält _50 Runden_ und überschreibt während dieser Zeit jede vorhandene positive Gravur der Rüstung. Der Zaubernde kann den Effekt auch ohne Rüstung auslösen.\n\nDieser Zauber _kostet keine Zeit_.
actors.hero.spells.holyward.desc_paladin=_Wenn der Paladin diesen Zauber wirkt, ist er stärker._ Die zusätzliche Schadensverteidigung der Heiligen Rüstung erhöht sich auf _3 Punkte_ und überschreibt keine vorhandenen Verzauberungen mehr. Jeder während der Wirkung der Heiligen Rüstung für andere Zauber verbrauchte Ladungspunkt verlängert die Wirkung um 10 Runden.
actors.hero.spells.holyward$holyarmbuff.name=Heilige Rüstung
actors.hero.spells.holyward$holyarmbuff.desc=Der Zaubernde hat seine getragene Rüstung mit einer heiligen Gravur versehen, die jede vorhandene Gravur vorübergehend überschreibt und die Rüstung um 1 zusätzlichen Schadenspunkt verstärkt.\n\nVerbleibende Runden: %s
actors.hero.spells.holyward$holyarmbuff.desc_paladin=Der Paladin hat seine getragene Rüstung mit einer heiligen Gravur versehen, die die Rüstung um 3 zusätzliche Schadenspunkte verstärkt.\n\nJeder Ladungspunkt, der für andere Zauber während der Wirkung der Heiligen Rüstung verbraucht wird, verlängert die Zauberwirkung um 10 Runden.\n\nVerbleibende Runden: %s

actors.hero.spells.holyweapon.name=Heilige Waffe
actors.hero.spells.holyweapon.ench_name=Heilige%s
actors.hero.spells.holyweapon.ench_desc=Feinde, die von der Heiligen Waffe getroffen werden, erleiden zusätzlichen magischen Schaden.
actors.hero.spells.holyweapon.short_desc=Überschreibt vorübergehend Verzauberungen, um den Waffenschaden zu verstärken.
actors.hero.spells.holyweapon.desc=Der Zaubernde versieht seine getragene Waffe mit einer heiligen Verzauberung, die bei jedem Angriff auf Feinde zusätzlich _2 magischen Schaden_ verursacht. Dieser Zauber kostet keine Zeit.\n\nDie Verzauberung hält _50 Runden_ und überschreibt während dieser Zeit jede vorhandene positive Verzauberung der Waffe. Auch Faustangriffe auf Feinde können den Effekt auslösen.\n\nDieser Zauber _kostet keine Zeit_.
actors.hero.spells.holyweapon.desc_paladin=_Wenn der Paladin diesen Zauber wirkt, ist er stärker._ Der zusätzliche magische Schaden der Heiligen Waffe erhöht sich auf _6 Punkte_ und überschreibt keine vorhandenen Verzauberungen mehr. Jeder während der Wirkung der Heiligen Waffe für andere Zauber verbrauchte Ladungspunkt verlängert die Wirkung um 10 Runden.
actors.hero.spells.holyweapon.runemark=_Runenmagier_ erhalten einen gewissen Segen, wenn sie ein mit heiliger Verzauberung versehenes Siegel zur Explosion bringen.
actors.hero.spells.holyweapon$holywepbuff.name=Heilige Waffe
actors.hero.spells.holyweapon$holywepbuff.desc=Der Zaubernde hat seine getragene Waffe mit einer heiligen Verzauberung versehen, die jede vorhandene Verzauberung vorübergehend überschreibt und der Waffe 2 zusätzlichen magischen Schaden pro Angriff verleiht.\n\nVerbleibende Runden: %s
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=Der Paladin hat seine getragene Waffe mit einer heiligen Verzauberung versehen, die 6 zusätzlichen magischen Schaden verursacht.\n\nJeder Ladungspunkt, der für andere Zauber während der Wirkung der Heiligen Waffe verbraucht wird, verlängert die Zauberwirkung um 10 Runden.\n\nVerbleibende Runden: %s

actors.hero.spells.judgement.name=Jüngstes Gericht
actors.hero.spells.judgement.short_desc=Verursacht Schaden an allen Feinden in Sichtweite.
actors.hero.spells.judgement.desc=Der Priester reißt den Himmel auf und richtet alle Feinde in Sichtweite im Namen des heiligen Lichts. Der Zauber verursacht _%1$d~%2$d Grundschaden_ plus zusätzlich _33%%_ Schaden für jede Zauberanwendung seit dem Eintritt in die himmlische Erhebung (oder seit der letzten Anwendung des Jüngsten Gerichts).\n\nDas derzeitige Jüngste Gericht verursacht _%3$d~%4$d Schaden_.\n\nDieser Zauber _kostet 1 Runde_.

actors.hero.spells.layonhands.name=Heilige Berührung
actors.hero.spells.layonhands.short_desc=Heilt sofort eine nahe Einheit oder gewährt dem Paladin einen Schild.
actors.hero.spells.layonhands.desc=Der Paladin kanalisiert heilige Energie durch seine Hände, um jede Einheit, die er berührt, zu heilen oder zu schützen.\n\nDer Paladin kann diesen Zauber wirken, um einer nahen Einheit _%1$d Heilung_ zu gewähren oder sich selbst einen _%1$d Schild_ zu geben. Überschüssige Heilung wird in Schilde umgewandelt.\n\nDer Zauber kann sofort und wiederholt gewirkt werden, kann aber nicht mehr als das Dreifache des Zauberwertes als Schild sofort anwenden.\n\nDieser Zauber _kostet keine Zeit_.

actors.hero.spells.lifelinkspell.name=Blutige Bindung
actors.hero.spells.lifelinkspell.short_desc=Teilt erlittenen Schaden mit Verbündeten und gewährt ihnen Schadensreduzierung.
actors.hero.spells.lifelinkspell.desc=Der Priester verstärkt die Lebensverbindung zwischen sich und seinem gestärkten Verbündeten. Diese verstärkte Lebensverbindung hält _%1$d Runden_, lässt den Helden und seinen Verbündeten erlittenen Schaden teilen und erhöht die Schadensreduzierung von Alles-in-Eins auf _%2$d%%_. Hinweis: Schadensteilung hat Priorität vor Rüstung, ist aber geringer als die Schadensreduzierung von Alles-in-Eins.\n\nWährend die Lebensverbindung aktiv ist, wirken positive Priesterzauber der Stufe 3 und darunter auf beide Seiten.\n\nDieser Zauber _kostet 1 Runde_.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=Blutige Bindung
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=Der Priester hat kürzlich eine Blutige Bindung zu diesem Verbündeten hergestellt, um eine Lebensverbindung aufzubauen.\n\nZusätzlich zu den üblichen Effekten der Lebensverbindung erhält diese Einheit Schadensreduzierung. Jeder positive Priesterzauber, der auf den Priester oder diesen Verbündeten gewirkt wird, wirkt auf beide. Alles-in-Eins endet nicht, solange dieser Effekt aktiv ist.\n\nVerbleibende Runden: %s

actors.hero.spells.mindform.name=Geistesaspekt
actors.hero.spells.mindform.short_desc=Wählt einen Zauberstab oder Wurfwaffe für die Dreifaltigkeit.
actors.hero.spells.mindform.desc=Der Priester wählt einen in dieser Partie identifizierten Zauberstab oder Wurfwaffe und lässt die Dreifaltigkeit dessen Effekt nachahmen.\n\nBei Verwendung der Dreifaltigkeit nutzt der Priester die _Stufe %d_ des gewählten Gegenstands für einen einzelnen Angriff. Dieser Angriff löst alle Effekte aus, die die normale Verwendung des Gegenstands auslösen würde.\n\nDieser Zauber aktualisiert jeden bestehenden Geistesaspekt-Effekt der Dreifaltigkeit.\n\nDieser Zauber _kostet keine Zeit_.

actors.hero.spells.mnemonicprayer.name=Bittgebet
actors.hero.spells.mnemonicprayer.short_desc=Verlängert positive/negative Effekte bei Verbündeten/Feinden und wendet Glanz erneut an.
actors.hero.spells.mnemonicprayer.desc=Der Priester rezitiert heilige Verse, die alle positiven oder negativen Effekte eines bestimmten Ziels um _%1$d Runden_ verlängern. Positive Effekte halten bei Verbündeten (einschließlich des Priesters) länger, negative Effekte bei Feinden länger.\n\nDas Gebet kann die Effekte eines bestimmten Ziels nur einmal verlängern und kann keine positiven Effekte von Rüstungsfähigkeiten verlängern.\n\nDieser Zauber _kostet keine Zeit_.

actors.hero.spells.radiance.name=Morgenrot-Glanz
actors.hero.spells.radiance.short_desc=Löst Glanz bei Feinden in Sichtweite aus, wendet ihn an und betäubt sie vorübergehend.
actors.hero.spells.radiance.desc=Der Priester strahlt heiliges Licht aus, das alle Feinde in Sichtweite für _3 Runden betäubt_. Wenn ein Feind bereits Glanz hat, löst der Zauber den zusätzlichen Schaden von Glanz aus und wendet Glanz erneut an. Wenn die Sicht auf dieser Ebene dunkel ist, leuchtet der Priester für _100 Runden_.\n\nDieser Zauber _kostet 1 Runde_.

actors.hero.spells.recallinscription.name=Schriftrollen-Zitat
actors.hero.spells.recallinscription.short_desc=Wiederholt den Effekt des zuletzt verwendeten Runensteins oder der Schriftrolle.
actors.hero.spells.recallinscription.desc=Der Zaubernde kopiert mit heiliger Magie die zuletzt verwendete Rune, um den magischen Effekt einer _%s Runden_ zuvor verwendeten Schriftrolle oder eines Runensteins erneut auszulösen.\n\nSchriftrollen-Zitat kann keine Upgrade-Schriftrollen, Metamorphose-Schriftrollen oder Sublimations-Schriftrollen erneut auslösen. Der Ladungsverbrauch variiert je nach zuletzt verwendetem Gegenstand: Runenstein 2 Ladungen, Schriftrolle 3 Ladungen, Sublimations-Schriftrolle 4 Ladungen. Bei Verwendung von Transmutations-Schriftrollen oder Transmutations-/Upgrade-Schriftrollen-Runensteinen/Sublimations-Schriftrollen verdoppelt sich der Ladungsverbrauch.\n\nDieser Zauber _kostet 1 Runde_.
actors.hero.spells.recallinscription$useditemtracker.name=Kürzlich verwendete Rune
actors.hero.spells.recallinscription$useditemtracker.desc=Der Zaubernde hat kürzlich einen Gegenstand verwendet, der mit dem Effekt des Schriftrollen-Zitats kompatibel ist, und kann den Effekt durch erneutes Wirken auslösen.\n\nVerwendeter Gegenstand: %1$s\n\nVerbleibende Runden: %2$s

actors.hero.spells.shieldoflight.name=Heiliger Schild
actors.hero.spells.shieldoflight.short_desc=Erhält eine temporäre Rüstung, die nur gegen ein einzelnes Ziel wirkt.
actors.hero.spells.shieldoflight.desc=Der Zaubernde erschafft einen schwachen heiligen Schild zwischen sich und dem Feind, der die Rüstung gegen diesen Feind für _5 Runden_ um _%1$d~%2$d Verteidigung_ erhöht.\n\nDieser Zauber _kostet keine Zeit_, kann aber nicht gleichzeitig gegen mehrere Ziele eingesetzt werden.
actors.hero.spells.shieldoflight$shieldoflighttracker.name=Heiliger Schild
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=Ein schwacher heiliger Schild steht zwischen dieser Einheit und dem Feind. Der Schild ist nicht stark genug, um Angriffe vollständig zu blockieren, aber er kann sie abschwächen.\n\nVerbleibende Runden: %s

actors.hero.spells.spiritform.name=Seelenaspekt
actors.hero.spells.spiritform.short_desc=Wählt einen Ring oder ein Artefakt für die Dreifaltigkeit.
actors.hero.spells.spiritform.desc=Der Priester wählt einen in dieser Partie identifizierten Ring oder ein Artefakt (außer dem Heiligen Kodex) und lässt die Dreifaltigkeit dessen Effekt nachahmen.\n\nWenn der gewählte Gegenstand ein Ring ist, erhält die Dreifaltigkeit den Effekt des Rings der _Stufe %1$d_ für _20 Runden_.\n\nWenn der gewählte Gegenstand ein Artefakt ist, kopiert die Dreifaltigkeit den Effekt des Artefakts der _Stufe %2$d_. Die genauen Effekte und der Rüstungsladungsverbrauch variieren je nach Artefakt.\n\nDieser Zauber aktualisiert jeden bestehenden Seelenaspekt-Effekt der Dreifaltigkeit.\n\nDieser Zauber _kostet keine Zeit_.
actors.hero.spells.spiritform$spiritformbuff.name=Seelenaspekt
actors.hero.spells.spiritform$spiritformbuff.desc=Der Seelenaspekt der Dreifaltigkeit lässt dich die Effekte eines Gegenstands erhalten, als ob du ihn ausgerüstet hättest.\n\nHinweis: Der Seelenaspekt kann keine bereits ausgerüsteten Gegenstandseffekte kopieren.\n\nDerzeitige Effekte: %1$s\n\nVerbleibende Runden: %2$s

actors.hero.spells.smite.name=Rächer-Schlag
actors.hero.spells.smite.short_desc=Ein garantierter Treffer mit zusätzlichem Schaden und Verstärkung der Verzauberung.
actors.hero.spells.smite.desc=Der Paladin erfüllt einen tödlichen Nahkampfangriff mit göttlicher Kraft.\n\nZusätzlich zum normalen Nahkampfschaden trifft der Rächer-Schlag garantiert bei nicht überstärkten Angriffen, hat _300%%_ Verstärkung der Verzauberung und verursacht _%1$d~%2$d zusätzlichen magischen Schaden_.\n\nDer zusätzliche magische Schaden des Rächer-Schlags skaliert mit der Paladinstufe und fügt Dämonen und Untoten garantiert maximalen zusätzlichen Schaden zu.\n\nDieser Zauber _kostet 1 Runde_.

actors.hero.spells.stasis.name=Astralprojektion
actors.hero.spells.stasis.short_desc=Entfernt Verbündete aus dem Verlies und friert ihren Status ein.
actors.hero.spells.stasis.desc=Der Priester konzentriert die Verbindung zu seinem Verbündeten auf sich selbst und versetzt den Verbündeten vorübergehend in einen Zustand eingefrorener Energie in seinem Körper. Der Verbündete bleibt maximal _%d Runden_ in Stasis, während der alle seine positiven Effekte nicht von der Zeit beeinflusst werden.\n\nWenn der Effekt natürlich endet, erscheint der Verbündete in der Nähe des Priesters. Der Priester kann den Zauber auch sofort und ohne Kosten erneut wirken, um ihn vorzeitig zu beenden. Astralprojektion kann auch unbewegliche Verbündete bewegen, aber nicht zwischen Etagen.\n\nDieser Zauber _kostet 1 Runde_.
actors.hero.spells.stasis$stasisbuff.name=Astralprojektion
actors.hero.spells.stasis$stasisbuff.left_behind=Dein unbeweglicher Verbündeter wurde zurückgelassen.
actors.hero.spells.stasis$stasisbuff.desc=Der Priester hat derzeit einen Verbündeten in astraler Projektion in Stasis versetzt. Alle positiven Effekte des Verbündeten, einschließlich Alles-in-Eins, werden eingefroren, und der Verbündete erscheint am Ende des Effekts in der Nähe des Priesters wieder. Der Effekt kann durch erneutes Wirken der astralen Projektion vorzeitig beendet werden.\n\nEingefrorener Verbündeter: %1$s\nVerbleibende Runden: %2$s

actors.hero.spells.sunray.name=Sonnenstrahl
actors.hero.spells.sunray.short_desc=Verursacht fernen magischen Schaden und blendet das Ziel einmal.
actors.hero.spells.sunray.desc=Der Zaubernde feuert einen blendenden Lichtstrahl auf das Ziel ab, der _%1$d~%2$d Schaden_ verursacht und es für _%3$d Runden blendet_. Sonnenstrahl fügt Untoten und Dämonen garantiert maximalen Schaden zu.\n\nNachdem ein Feind von diesem Zauber getroffen wurde, passt er seine Sicht an, um nicht erneut geblendet zu werden. Wenn er jedoch nach der Blendung erneut getroffen wird, überwältigt ihn das grelle Licht und lähmt ihn anstatt zu blenden.\n\nDieser Zauber _kostet 1 Runde_.

actors.hero.spells.walloflight.name=Heilige Barriere
actors.hero.spells.walloflight.short_desc=Erschafft eine Barriere, die Feinde blockiert.
actors.hero.spells.walloflight.desc=Der Paladin formt Licht zu einer Wand und erschafft eine heilige Barriere von _1 Feld_ Dicke, _%1$d Feldern_ Breite, die _20 Runden_ hält.\n\nDie heilige Barriere ist bis auf die Tatsache, dass sie die Sicht nicht blockiert, wie eine normale Wand. Bei der Erschaffung werden in der Barriere gefangene Feinde kurz betäubt und zurückgestoßen, wenn möglich. Alles, was in der Barriere steckt, kann herausgenommen werden.\n\nDie Barriere kann in acht Richtungen errichtet werden. Wenn bereits eine Barriere existiert, kann der Zauber kostenlos erneut verwendet werden, um sie sofort zu entfernen.\n\nDieser Zauber _kostet 1 Runde_.
actors.hero.spells.walloflight.early_end=Du entfernst die heilige Barriere.
actors.hero.spells.walloflight$lightwall.desc=Eine heilige Barriere versperrt den Weg hier.

##main hero
actors.hero.hero.name=du
actors.hero.hero.leave=Du kannst jetzt noch nicht gehen, der Rest des Dungeons wartet da unten.
actors.hero.hero.level_up=Level Up!
actors.hero.hero.new_level=Stufenaufstieg! +Genauigkeit, +Ausweichen, +5 LP!
actors.hero.hero.new_talent=+1 Talentpunkt!
actors.hero.hero.unspent=Du hast unverbrauchte Talentpunkte!
actors.hero.hero.level_cap=Du kannst nicht stärker werden, aber deine Erfahrung gibt dir einen Kräfteschub!
actors.hero.hero.you_now_have=Du hast aufgenommen: %s.
actors.hero.hero.you_cant_have=Du kannst nicht mehr mitnehmen: %s.
actors.hero.hero.locked_chest=Diese Truhe ist verschlossen und du hast keinen Schlüssel, um sie zu öffnen.
actors.hero.hero.locked_door=Du besitzt keinen passenden Schlüssel.
actors.hero.hero.noticed_smth=Du bemerkst etwas.
actors.hero.hero.wait=...
actors.hero.hero.search=suchen
actors.hero.hero.search_distracted=Es fällt schwer sich zu konzentrieren, das Suchen ist ermüdend.
actors.hero.hero.key_distracted=Du konntest dieses Schloss nicht öffnen. Versuche es erneut.
actors.hero.hero.pain_resist=Die Schmerzen helfen dir deinem Drang nach Schlaf zu widerstehen.
actors.hero.hero.revive=Das Anch explodiert mit lebenspendender Energie!

##classes
actors.hero.heroclass.warrior=Krieger
actors.hero.heroclass.warrior_desc_short=Der Krieger hält zusätzlichen Schaden aus, wenn sein _gebrochenes Siegel_ ihm Schild gewährt. Das Siegel kann von Rüstung zu Rüstung übertragen werden und _überträgt eine einzelne Verbesserung._
actors.hero.heroclass.warrior_desc=Der Krieger beginnt mit einem _einzigartigen gebrochenen Siegel,_ das Schild über sein Leben generiert. Das Siegel kann von einer Rüstung auf eine andere übertragen werden und _eine Verbesserung mit übernehmen_.\n\nDer Krieger startet ebenfalls mit einem _abgenutzten Kurzschwert_, _drei Wurfsteinen_, einer Stoffrüstung, einem Wasserschlauch und einem Samtbeutel.\n\nDer Krieger identifiziert automatisch:\n_-_ Schriftrollen der Identifizierung\n_-_ Heiltränke\n_-_ Schriftrollen der Wut
actors.hero.heroclass.warrior_unlock=Der Krieger ist automatisch freigeschaltet.

actors.hero.heroclass.mage=Magier
actors.hero.heroclass.mage_desc_short=Der Magier ist ein arkaner Meister und trägt einen _magischen Stab_, der stärker ist als ein Zauberstab. Der Stab kann _mit jedem beliebigen Zauberstab verschmolzen werden_, den der Zauberer findet.
actors.hero.heroclass.mage_desc=Der Magier startet mit einem _einzigartigen Zauberstab_, der sich deutlich schneller als andere Stäbe wieder auflädt und eine Ladung mehr hat. Der Zauberstab _kann mit jedem Stab verschmolzen werden_, den der Magier im Dungeon findet.\n\nDer Magier startet außerdem mit einem _Stab der magischen Geschosse_, welcher mit seinem Zauberstab verschmolzen ist, einer Stoffrüstung, einem Wasserschlauch und einem Samtbeutel.\n\nDer Magier identifiziert automatisch:\n_-_ Schriftrollen der Identifizierung\n_-_ Trank der flüssigen Flamme\n_-_ Schriftrolle der Verbesserung
actors.hero.heroclass.mage_unlock=Um den Magier freizuschalten, _benutze eine Schriftrolle der Verbesserung, um einen Gegenstand stärker zu machen._

actors.hero.heroclass.rogue=Schurke
actors.hero.heroclass.rogue_desc_short=Der Schurke kann Feinden ausweichen und aus der Unsichtbarkeit heraus angreifen, wenn er seinen _Umhang der Schatten_ benutzt. Außerdem _entdeckt er Geheimnisse und Fallen_ bereits aus größerer Entfernung.
actors.hero.heroclass.rogue_desc=Der Schurke startet mit einem einzigartigen _Umhang der Schatten_, mit dem er sich nach Belieben unsichtbar machen kann.\n\nDer Schurke kann aus großer Distanz _Geheimnisse und Fallen orten_.\n\nDer Schurke startet außerdem mit _einem Dolch_, _drei Wurfmessern_, einer Stoffrüstung, einem Wasserschlauch und einem Samtbeutel.\n\nDer Schurke identifiziert automatisch:\n_-_ Schriftrollen der Identifizierung\n_-_ Tränke der Unsichtbarkeit\n_-_ Schriftrollen der magischen Kartographie
actors.hero.heroclass.rogue_unlock=Um den Schurken freizuschalten, _führe 10 Überraschungsangriffe in einem Spiel aus._

actors.hero.heroclass.huntress=Jägerin
actors.hero.heroclass.huntress_desc_short=Die Jägerin ist eine Meisterin der Wurfwaffen und besitzt einen _magischen Bogen_ mit unendlich vielen Pfeilen. Außerdem kann sie durch hohes Gras laufen, _ohne es zu zertrampeln._
actors.hero.heroclass.huntress_desc=Die Jägerin startet mit einem _einzigartigen Seelenbogen_, der eine unendliche Anzahl von beschworenen Pfeilen abfeuern kann.\n\nDie Jägerin kann durch hohes Gras laufen, _ohne es zu zertrampeln._\n\nDie Jägerin startet außerdem mit _Kampfhandschuhen_, einer Stoffrüstung, einem Wasserschlauch und einem Samtbeutel.\n\nDie Jägerin identifiziert automatisch:\n_-_ Schriftrollen der Identifizierung\n_-_ Tränke der übersinnlichen Wahrnehmung\n_-_ Schriftrollen des Wiegenlieds
actors.hero.heroclass.huntress_unlock=Um die Jägerin freizuschalten, _triff 10 mal mit Wurfwaffen gegen Feinde in einem Spiel._

actors.hero.heroclass.duelist=Zweikämpferin
actors.hero.heroclass.duelist_desc_short=Die Zweikämpferin ist eine Meisterin der Waffen, sie kann ihre Waffe dazu einsetzen, eine _besondere Waffenfähigkeit_ aufzurufen. Diese besondere Fähigkeit ist _bei jeder Waffe eine andere._
actors.hero.heroclass.duelist_desc=Die Zweikämpferin beginnt mit einem _einzigartigen Rapier_, dessen besondere Fähigkeit mit der Zeit wieder aufgeladen wird.\n\nJede Waffe im Spiel hat eine _eigene besondere Fähigkeit_, welche die Zweikämpferin nutzen kann.\n\nDie Zweikämpferin beginnt auch mit _zwei Wurfspießen_, einer Stoffrüstung, einem Wasserschlauch und einem Samtbeutel.\n\nDie Zweikämpferin identifiziert automatisch:\n_-_ Schriftrollen der Identifizierung\n_-_ Tränke der Stärke\n_-_ Schriftrollen des Spiegelbilds
actors.hero.heroclass.duelist_unlock=Um die Zweikämpferin freizuschalten, _rüste eine Waffe der Klasse 2 oder höher ohne Einbußen durch mangelnde Stärke_ aus.

actors.hero.heroclass.cleric=Kleriker
actors.hero.heroclass.cleric_desc_short=Der Kleriker ist ein heiliger Zauberwirker, der seinen _einzigartigen heiligen Kodex_ nutzt, um göttliche Magie zu kanalisieren und durch Talente _Zauber zu erlernen und zu verbessern_.
actors.hero.heroclass.cleric_desc=Der Kleriker beginnt mit einem _einzigartigen heiligen Kodex_, der es ihm erlaubt, verschiedene Zauber zu wirken.\n\nDie meisten Talente des Klerikers konzentrieren sich auf das _Erlernen oder Verbessern von Zaubern_.\n\nAußerdem beginnt der Kleriker mit _einem Zepter_, Stoffrüstung, einem Wasserschlauch und einem Beutel.\n\nZu Beginn identifizierte Gegenstände:\n_-_ Reinigungstrank\n_-_ Wandlungs-, Identifikations- und Bann-Schriftrolle
actors.hero.heroclass.cleric_unlock=_Reinige den Fluch eines verfluchten Gegenstands vollständig_, um den Kleriker freizuschalten.

actors.hero.herosubclass.berserker=Berserker
actors.hero.herosubclass.berserker_short_desc=Der  _Berserker_ baut Wut auf, wenn er Schaden erleidet. Wut erhöht den von ihm ausgeteilten Schaden und kann bei 100% aktiviert werden, wodurch er einen zusätzlichen Schild erhält.
actors.hero.herosubclass.berserker_desc=Der Berserker gewinnt an Wut, wenn er physischen Schaden erleidet, einschließlich Schaden, der von seiner Rüstung blockiert wird! Die Wut lässt mit der Zeit stetig nach, schwindet aber langsamer, wenn er nur noch wenige LP hat.\n\nDer Berserker verursacht bei 100% Wut bis zu +50% Schaden. Bei 100% Wut kann er auch in Rage verfallen, und dabei erhält er das 2- bis 6-fache der maximalen Abschirmung seines Siegels in Abhängigkeit von den ihm fehlenden Lebenspunkten, und bleibt bei 100% Wut, solange er noch Abschirmung übrig hat. Der Berserker braucht jedoch Zeit, um sich zu erholen, nachdem er in Rage verfallen ist.
actors.hero.herosubclass.gladiator=Gladiator
actors.hero.herosubclass.gladiator_short_desc=Der _Gladiator_ baut eine Kombi auf, wenn er erfolgreiche Attacken durchführt. Er kann die Kombi einsetzen, um einzigartige Fähigkeiten zu nutzen.
actors.hero.herosubclass.gladiator_desc=Der Gladiator bekommt jedes mal einen Kombi-Punkt, wenn er erfolgreich mit einem Nahkampf- oder einer Wurfwaffe angreift. Wenn der Gladiator innerhalb von 5 Zügen keinen erfolgreichen Angriff ausführt, wird sein Kombi-Zähler zurückgesetzt.\n\nWährend des Kombi-Aufbaus werden verschiedene Kombi-Fähigkeiten freigeschaltet, für die er seine Kombi-Punkte einsetzen kann:\n2 Kombi: Gegner wird zurückgestoßen, Kombi bleibt erhalten\n4 Kombi: verursacht Schaden basierend auf der Rüstung\n6 Kombi: pariert, Kombi bleibt erhalten\n8 Kombi: schädigt Ziel und nahe befindliche Gegner\n10 Kombi: greift einmal für jede Kombi an
actors.hero.herosubclass.battlemage=Kampfmagier
actors.hero.herosubclass.battlemage_short_desc=Der _Kampfmagier_ löst Bonuseffekte aus, wenn er seinen Stab als Nahkampfwaffe einsetzt. Diese Effekte basieren auf dem Zauberstab, welcher mit dem Stab des Magiers verbunden ist.
actors.hero.herosubclass.battlemage_desc=Der Kampfmagier erhält einen Bonuseffekt, wenn er mit seinem Stab im Nahkampf zuschlägt, als hätte sein Stab eine zusätzliche Verzauberung. Diese Effekte hängen von dem Zauberstab ab, mit dem der Stab verschmolzen ist; jeder Zauberstab hat dabei seinen eigenen Effekt. Zusätzlich zu den Zauberstab-Effekten erhält der Stab des Kampfmagiers 0,5 Ladungen, wenn er damit zuschlägt.
actors.hero.herosubclass.warlock=Hexenmeister
actors.hero.herosubclass.warlock_short_desc=Der _Hexenmeister_ hat eine Chance, mit seinen Zauberstäben eine Seelenmarkierung auf Gegner zu setzen. Er heilt sich immer, wenn er markierten Gegnern physischen Schaden zufügt.
actors.hero.herosubclass.warlock_desc=Der Hexenmeister hat die Chance, Charakteren eine Seelenmarkierung zuzufügen, wenn er mit einem Zauberstab angreift. Die Chance, eine Seelenmarkierung anzubringen und ihre Dauer erhöhen sich mit dem Level des Zauberstabs.\n\nWenn ein Feind eine Seelenmarkierung besitzt, heilt der Hexenmeister 2 LP für jeweils 5 Schaden, den er ihm zufügt, jedoch nur mit Angriffen von Nahkampf- oder Wurfwaffen, nicht von Zauberstäben!
actors.hero.herosubclass.assassin=Attentäter
actors.hero.herosubclass.assassin_short_desc=Der _Attentäter_ kann einen tödlichen Angriff vorbereiten, während er unsichtbar ist. Je länger er wartet, desto stärker wird der Angriff.
actors.hero.herosubclass.assassin_desc=Der Attentäter bereitet seinen nächsten Schlag vor, wenn er unsichtbar wird. Je länger er sich vorbereitet, desto mächtiger wird sein nächster Angriff. Die Vorbereitung kann bis zu 9 Züge dauern.\n\nNach der Vorbereitung verursacht der Attentäter bei seinem nächsten Angriff zusätzlichen Schaden, kann zu seinem Ziel springen und sogar Gegner, die schwach genug sind, sofort töten.
actors.hero.herosubclass.freerunner=Freiläufer
actors.hero.herosubclass.freerunner_short_desc=Der _Freiläufer_ baut Schwung auf, wenn er läuft, den er nutzen kann, um das Freilaufen zu starten. Dies gibt ihm für eine kurze Zeit einen Bonus auf Geschwindigkeit und Ausweichen.
actors.hero.herosubclass.freerunner_desc=Der _Freiläufer_ baut beim Laufen Schwung auf. Er kann bis zu 10 Schwung aufbauen, nachdem er sich 10 Züge bewegt hat, aber er verliert diesen schnell, wenn er aufhört, sich zu bewegen. Der Freiläufer kann seinen Schwung 2 Züge pro Schwung-Punkt nutzen, um das Freilaufen zu starten.\n\nWährend des Freilaufens bewegt sich der Freiläufer doppelt so schnell und bekommt einen auf seiner Stufe basierenden Bonus auf Ausweichen. Sobald das Freilaufen vorüber ist, beginnt eine Abklingzeit, bevor wieder Schwung aufgebaut werden kann.
actors.hero.herosubclass.sniper=Scharfschützin
actors.hero.herosubclass.sniper_short_desc=Die _Scharfschützin_ kann Rüstung mit ihren Fernkampfangriffen durchdringen. Nach dem Angriff mit einer Wurfwaffe kann sie mit einem Spezialangriff von ihrem Bogen nachsetzen.
actors.hero.herosubclass.sniper_desc=Die Scharfschützin ist eine Meisterin des Fernkampfes; ihre Fernangriffe durchbohren feindliche Rüstungen. Wenn sie einen Feind mit Wurfwaffen angreift, platziert sie eine Scharfschützen-Markierung auf dem Feind, welche dann einen Spezialangriff mit ihrem Bogen gestattet. Dieser Spezialangriff ist abhängig von der Verzauberung des Bogens.\n\nEin nicht verzauberter Bogen wird sofort einen Schuss abgeben, allerdings mit reduziertem Schaden. Ein schneller Bogen wird eine Salve aus drei Pfeilen abfeuern, die zwar reduzierten Schaden bewirken, jedoch Verzauberungen auslösen können und einen Zug dauern. Ein Bogen mit erhöhtem Schaden wird einen Scharfschützenpfeil abfeuern, der garantiert trifft und Zusatzschaden verursacht. Dies dauert zwei Züge.
actors.hero.herosubclass.warden=Wächterin
actors.hero.herosubclass.warden_short_desc=_Die Wächterin_ kann durch hohes Gras sehen und bekommt Bonuseffekte, wenn sie Samen pflanzt und Pflanzen zertrampelt.
actors.hero.herosubclass.warden_desc=Die Wächterin hat eine starke Verbindung zur Natur, die ihr eine Reihe von Bonuseffekten in Bezug auf Gras und Pflanzen gibt. Sie kann durch hohes und gefurchtes Gras sehen, als wäre es ein leeres Feld.\n\nDie Wächterin sorgt dafür, dass um jeden Samen, den sie wirft oder pflanzt, Gras wächst; wenn sie Pflanzen zertritt, erhält sie Bonuseffekte. Diese Bonuseffekte ersetzen die normalen Pflanzeneffekte, was bedeutet, dass keine Pflanze, auf die die Wächterin tritt, ihr schadet.
actors.hero.herosubclass.champion=Meisterin
actors.hero.herosubclass.champion_short_desc=Die _Meisterin_ kann zwei Waffen führen und bekommt mehr Waffenladungen. Ihre normalen Angriffe erfolgen mit der Primärwaffe, aber sie kann die Waffen tauschen und die Fähigkeiten beider Waffen einsetzen.
actors.hero.herosubclass.champion_desc=Die Meisterin beherrscht Nahkampfwaffen perfekt und kann zusätzlich zu ihrer Primärwaffe eine zweite Waffe ausrüsten. Ihre normalen Angriffe erfolgen mit der Primärwaffe, aber sie kann ihre Waffen augenblicklich tauschen und die Fähigkeit einer der Waffen einsetzen.\n\nSie erhält außerdem 2 maximale Ladungen der Waffenfähigkeit mehr und eine um 50% erhöhte Aufladegeschwindigkeit der Waffenfähigkeit.
actors.hero.herosubclass.monk=Nonne
actors.hero.herosubclass.monk_short_desc=Die _Nonne_ baut im Kampf Energie auf. Diese Energie kann in einer Reihe von einzigartigen Fähigkeiten eingesetzt werden.
actors.hero.herosubclass.monk_desc=Die Nonne beherrscht die Körpertechnik perfekt. Wenn sie Feinde besiegt, gewinnt sie Energie, welche in einer Vielzahl an defensiven und technischen Fähigkeiten eingesetzt werden kann. Diese Energie nimmt mit der Zeit nicht ab, hat aber einen Maximalwert in Abhängigkeit von der Stufe der Nonne.\n\n1 Energie: schnelle Faustschläge\n2 Energie: fokussiert aufs Ausweichen gegen den nächsten Angriff\n3 Energie: augenblicklich im Nahbereich springen\n4 Energie: einen Feind zurücktreten\n5 Energie: meditieren zum Löschen des Status und zur Wiederherstellung der Ladungen von Zauberstäben und Artefakten
actors.hero.herosubclass.priest=Priester
actors.hero.herosubclass.priest_short_desc=Der _Priester_ erhält neue Fernkampfzauber und eine verbesserte Version von Göttlichem Leiten.
actors.hero.herosubclass.priest_desc=Der Priester erhält eine Reihe neuer, verbesserter Zauber, die sich auf Fernkampfangriffe und die Kompatibilität mit magischen Gegenständen konzentrieren.\n\nDer Priester kann alle 50 Runden einmal kostenlos _Göttliches Leiten_ wirken, um einen Gegner mit Heiligenschein zu belegen. Verbündete, Zauberstäbe und bestimmte Artefakte können den Heiligenschein verbrauchen, um zusätzlichen Schaden in Höhe von Kleriker-Stufe + 5 zu verursachen.\n\nDer Priester erhält außerdem den Zauber _Morgendämmerungsglanz_, der 2 Ladungen verbraucht, um Dunkelheit zu vertreiben, allen Feinden im Sichtfeld Heiligenschein zu verleihen und sie kurz zu betäuben.\n\nIst der _Zufallsmodus_ aktiviert, erhält man beim Wählen dieser Spezialisierung einen heiligen Kodex, falls man keinen besitzt.
actors.hero.herosubclass.paladin=Paladin
actors.hero.herosubclass.paladin_short_desc=Der _Paladin_ erhält neue Nahkampfzauber und verbesserte Versionen von Heilige Waffe und Heilige Rüstung.
actors.hero.herosubclass.paladin_desc=Der Paladin erhält eine Reihe neuer, verbesserter Zauber, die sich auf Nahkampfangriffe und die Kompatibilität von Waffen und Rüstungen konzentrieren.\n\nDie Angriffs- und Verteidigungsboni der Zauber _Heilige Waffe_ und _Heilige Rüstung_ des Paladins werden stark verstärkt. Sie überschreiben nicht mehr vorhandene Verzauberungen und Gravuren und können durch das Wirken anderer Zauber verlängert werden.\n\nDer Paladin erhält außerdem den Zauber _Geweihter Hieb_, einen garantiert treffenden Nahkampfangriff mit zusätzlichem Schaden und Verzauberungsstärke.\n\nIst der _Zufallsmodus_ aktiviert, erhält man beim Wählen dieser Spezialisierung einen heiligen Kodex, falls man keinen besitzt.

##talents
actors.hero.talent$provokedangertracker.name=provozierter Zorn
actors.hero.talent$provokedangertracker.desc=Der Krieger hat gerade seine Abschirmung verloren, sein nächster physischer Angriff wird Zusatzschaden verursachen.\n\nVerbleibende Züge: %s.
actors.hero.talent$lingeringmagictracker.name=nachwirkende Magie
actors.hero.talent$lingeringmagictracker.desc=Der Magier hat gerade einen Zauberstab oder Magierstab verwendet, und sein nächster physischer Angriff wird Zusatzschaden verursachen.\n\nVerbleibende Züge: %s.
actors.hero.talent$followupstriketracker.name=Anschlusstreffer
actors.hero.talent$followupstriketracker.desc=Nachdem die Zweikämpferin einen Feind mit einer Wurfwaffe angegriffen hat, verursacht sie bei ihren nächsten Nahkampfangriff gegen dasselbe Ziel Bonusschaden.\n\nVerbleibende Züge: %s.
actors.hero.talent$patientstriketracker.name=geduldiger Schlag
actors.hero.talent$patientstriketracker.desc=Die Zweikämpferin hat einen Zug gewartet, ihr nächster Nahkampfangriff wird Bonusschaden anrichten.
actors.hero.talent$improvisedprojectilecooldown.name=Abklingzeit für improvisierte Wurfgeschosse
actors.hero.talent$improvisedprojectilecooldown.desc=Du hast dieses Talent vor kurzem benutzt und musst warten, bevor du es erneut nutzen kannst.\n\nVerbleibende Züge: %s.
actors.hero.talent$rejuvenatingstepscooldown.name=Abklingzeit für Schritte der Verjüngung
actors.hero.talent$rejuvenatingstepscooldown.desc=Du hast dieses Talent vor kurzem benutzt und musst warten, bevor du es erneut nutzen kannst.\n\nVerbleibende Züge: %s.
actors.hero.talent$seershotcooldown.name=Abklingzeit für Schuss der klaren Sicht
actors.hero.talent$seershotcooldown.desc=Du hast dieses Talent vor kurzem benutzt und musst warten, bevor du es erneut nutzen kannst.\n\nVerbleibende Züge: %s.
actors.hero.talent$aggressivebarriercooldown.name=Abklingzeit aggressive Barriere
actors.hero.talent$aggressivebarriercooldown.desc=Du hast dieses Talent vor kurzem benutzt und musst warten, bevor du es erneut nutzen kannst.\n\nVerbleibende Züge: %s.
actors.hero.talent$liquidagilacctracker.name=flüssige Wendigkeit
actors.hero.talent$liquidagilacctracker.desc=Der nächste normale Angriff der Zweikämpferin erhält zusätzliche Genauigkeit.\n\nVerbleibende Züge: %s.
actors.hero.talent$lethalhastecooldown.name=Abklingzeit letale Eile
actors.hero.talent$lethalhastecooldown.desc=Du hast dieses Talent vor kurzem benutzt und musst warten, bevor du es erneut nutzen kannst.\n\nVerbleibende Züge: %s.
actors.hero.talent$swiftequipcooldown.name=Abklingzeit rasches Ausrüsten
actors.hero.talent$swiftequipcooldown.desc=Du hast dieses Talent vor kurzem benutzt und musst warten, bevor du es erneut nutzen kannst.\n\nVerbleibende Züge: %s.
actors.hero.talent$preciseassaulttracker.name=präziser Angriff
actors.hero.talent$preciseassaulttracker.desc=Der nächste normale Angriff der Zweikämpferin erhält zusätzliche Genauigkeit.\n\nVerbleibende Züge: %s.
actors.hero.talent$deadlyfollowuptracker.name=tödliches Nachtreten
actors.hero.talent$deadlyfollowuptracker.desc=Nachdem die Zweikämpferin einen Feind mit einer Wurfwaffe angegriffen hat, verursacht sie bei ihren nächsten Nahkampfangriff gegen dasselbe Ziel Bonusschaden.\n\nVerbleibende Züge: %s.
actors.hero.talent$combinedlethalityabilitytracker.executed=hingerichtet
actors.hero.talent$satiatedspellstracker.name=Zauberschild
actors.hero.talent$satiatedspellstracker.desc=Der nächste Zauber des Priesters gewährt ihm einen kleinen Schild.
actors.hero.talent$searinglightcooldown.name=Gleißendes Licht
actors.hero.talent$searinglightcooldown.desc=Du hast dieses Talent gerade erst eingesetzt und musst eine Weile warten, bevor du es erneut einsetzen kannst.\n\nVerbleibende Abklingzeit: %s Runden


#warrior
actors.hero.talent.type=Fertigkeitstyp：_%s_.
actors.hero.talent.hearty_meal.title=herzhafte Mahlzeit
actors.hero.talent.hearty_meal.desc=_+1:_ Das Essen von Nahrung heilt den Krieger um _3 LP_, wenn er weniger als 30% Gesundheit hat.\n\n_+2:_ Das Essen von Nahrung heilt den Krieger um _5 LP_, wenn er weniger als 30% Gesundheit hat.
actors.hero.talent.hearty_meal.comment=Runter mit dem Fladenbrot, immer noch ein ganzer Kerl.
actors.hero.talent.veterans_intuition.title=Intuition des Veteranen
actors.hero.talent.veterans_intuition.desc=_+1:_ Der Krieger identifiziert Waffen _1,75x schneller_ und Rüstungen _2,5x schneller_.\n\n_+2:_ Der Krieger identifiziert Waffen _2,5x schneller_ und Rüstungen, _sobald er sie ausrüstet_.
actors.hero.talent.veterans_intuition.comment=„Diese Erfahrung habe ich auf dem nördlichen Schlachtfeld gesammelt.“
actors.hero.talent.provoked_anger.title=provozierter Zorn
actors.hero.talent.provoked_anger.desc=_+1:_ Wenn die Abschirmung des Kriegers zerbricht, wird sein nächster physischer Angriff _2 Punkte Zusatzschaden_ verursachen.\n\n_+2:_ Wenn die Abschirmung des Kriegers zerbricht, wird sein nächster physischer Angriff _3 Punkte Zusatzschaden_ verursachen.
actors.hero.talent.provoked_anger.comment=„Wer es wagt, einen Krieger des Nordens herauszufordern, ist längst tot.“
actors.hero.talent.iron_will.title=eiserner Wille
actors.hero.talent.iron_will.desc=_+1:_ Der maximale Schild, den das Siegel des Kriegers bietet, wird _um 1_ erhöht.\n\n_+2:_ Der maximale Schild, den das Siegel des Kriegers bietet, wird _um 2_ erhöht.
actors.hero.talent.iron_will.comment=Wie wird Stahl gehärtet.
actors.hero.talent.iron_will.meta_desc=_Wenn dieses Talent durch einen anderen Helden gewonnen wird_, so gewährt es seinen Schildbonus ohne das gebrochene Siegel.

actors.hero.talent.iron_stomach.title=eiserner Magen
actors.hero.talent.iron_stomach.desc=_+1:_ Nahrung zu sich nehmen braucht für den Krieger 1 Zug und verleiht ihm _75% Schadenswiderstand_ während des Essens.\n\n_+2:_ Nahrung zu sich nehmen braucht für den Krieger 1 Zug und verleiht ihm _100% Schadenswiderstand_ beim Essen.
actors.hero.talent.iron_stomach.comment=In Kriegszeiten ist der Waffenstillstand zum Essen eine Übereinkunft beider Seiten.
actors.hero.talent.liquid_willpower.title=flüssige Willenskraft
actors.hero.talent.liquid_willpower.desc=_+1:_ Der Krieger erhält sofort _50% seiner Abschirmung_ von seinem zerbrochenen Siegel zurück, wenn er einen Trank, ein Gebräu oder Elixier trinkt oder wirft.\n\n_+2:_ Der Krieger erhält sofort _75% seiner Abschirmung_ von seinem zerbrochenen Siegel zurück, wenn er einen Trank, ein Gebräu oder Elixier trinkt oder wirft\n\nDer Schildregenerationseffekt verdoppelt sich, wenn Tränke der Stärke, der Erfahrung oder alchemisch aus diesen Tränken hergestellte Gegenstände verwendet werden.\n\nBei alchemischen Gegenständen mit größerer Ausgabemenge (z.B. Aqua-Gebräu) kann dieses Talent abhängig davon, wieviel dieses Gegenstands hergestellt wurde, ausgelöst werden.
actors.hero.talent.liquid_willpower.comment=Bei Verwendung von Stärke-, Erfahrungstränken oder daraus hergestellten alchemistischen Gegenständen verdoppelt sich die erhaltene Schildmenge.\n\nBei ergiebigen alchemistischen Gegenständen (wie Wasserexplosionstränken) basiert die Auslösung auf der Stückzahl pro Herstellung.\n\nEin Hochprozentiger kann den Kampfgeist eines Kriegers entfachen, und Tränke können das auch.
actors.hero.talent.runic_transference.title=Runentransfer
actors.hero.talent.runic_transference.desc=_+1:_ Das zerbrochene Siegel des Kriegers kann _normale Glyphen_ genau so transferieren wie eine Verbesserung.\n\n_+2:_ Das zerbrochene Siegel des Kriegers kann _normale, starke und verfluchte Glyphen_ genau so transferieren wie eine Verbesserung.\n\nDas Siegel kann nur Glyphen transferieren, die an der Rüstung angewandt wurden, als das Siegel daran angebracht war.
actors.hero.talent.runic_transference.comment=Das beschädigte Wappen kann nur die Gravur tragen, die auf der Rüstung zum Zeitpunkt der Anbringung vorhanden war.\n\n„Darauf eingraviert sind nicht nur die Zeichen, sondern auch der einstige Ruhm des Kriegers.“
actors.hero.talent.runic_transference.meta_desc=_Wenn dieses Talent von einem anderen Helden erworben wird_, verringert sich stattdessen die Wahrscheinlichkeit, dass Rüstungsverzauberungen durch den Einsatz von Schriftrollen der Verbesserung entfernt werden. Die Wahrscheinlichkeit, dass Rüstungsverzauberungen verloren gehen, beginnt bei Level 6 (statt 4) bei +1, oder bei Level 7 (statt 4) bei +2. Die Stufe, bei der Rüstungsverzauberungen garantiert verloren gehen, verbleibt unverändert bei +8.
actors.hero.talent.lethal_momentum.title=tödlicher Schwung
actors.hero.talent.lethal_momentum.desc=_+1:_ Wenn der Krieger einen tödlichen Schlag mit einer physischen Waffe landet, besteht eine _Chance von 67%_, dass er 0 Züge braucht.\n\n_+2:_ Wenn der Krieger einen tödlichen Schlag mit einer physischen Waffe landet, besteht eine _Chance von 100%_, dass er 0 Züge braucht.
actors.hero.talent.lethal_momentum.comment=Kampfblut fließt!
actors.hero.talent.improvised_projectiles.title=improvisierte Wurfgeschosse
actors.hero.talent.improvised_projectiles.desc=_+1:_ Der Krieger kann einen Feind für _2 Züge_ blenden, indem er einen beliebigen Gegenstand, der keine Wurfwaffe ist, auf diesen wirft. Dies braucht 50 Züge, bis es erneut verfügbar ist.\n\n_+2:_ Der Krieger kann einen Feind für _3 Züge_ blenden, indem er einen beliebigen Gegenstand, der keine Wurfwaffe ist, auf diesen wirft. Dies braucht 50 Züge, bis es erneut verfügbar ist.
actors.hero.talent.improvised_projectiles.comment=Diese Fertigkeit _hat 20 Runden Abklingzeit_.\n\nWenn der Krieger sich langweilt, wirft er Gegenstände in der Hand hin und her, bis er sie präzise in die Augen der Feinde werfen kann.

actors.hero.talent.hold_fast.title=Position halten
actors.hero.talent.hold_fast.desc=_+1:_ Wenn der Krieger wartet, bekommt er _1-2 Rüstung_, bis er sich bewegt.\n\n_+2:_ Wenn der Krieger wartet, bekommt er _2-4 Rüstung_, bis er sich bewegt.\n\n_+3:_ Wenn der Krieger wartet, bekommt er _3-6 Rüstung_, bis er sich bewegt.
actors.hero.talent.hold_fast.comment=
actors.hero.talent.strongman.title=Muskelmann
actors.hero.talent.strongman.desc=_+1:_ Die Stärke des Kriegers wird um _8% erhöht_, es wird abgerundet.\n\n_+2:_ Die Stärke des Kriegers wird um _13% erhöht_, es wird abgerundet.\n\n_+3:_ Die Stärke des Kriegers wird um _18% erhöht_, es wird abgerundet.
actors.hero.talent.strongman.comment=

actors.hero.talent.endless_rage.title=endlose Wut
actors.hero.talent.endless_rage.desc=_+1:_ Der Berserker kann bis zu _116% Wut_ erreichen.\n\n_+2:_ Der Berserker kann bis zu _133% Wut_ erreichen.\n\n_+3:_  Der Berserker kann bis zu _150% Wut_ erreichen.\n\nJeder Punkt Rage über 100% erhöht den Raserei-Schild um 1% und setzt die Abklingzeit um 1% herab, erhöht den Bonusschaden aber nicht über +50%.
actors.hero.talent.endless_rage.comment=Übersteigt der Zorn 100%, erhöht jedes zusätzliche 1% Zorn den Schild um 1% und reduziert die Abklingzeit der Raserei um 1%, aber der Schadensbonus übersteigt nicht 50%.
actors.hero.talent.deathless_fury.title=unsterbliche Wut
actors.hero.talent.deathless_fury.desc=_+1:_ Wenn der Berserker gleich stirbt und die Wut 100% oder mehr beträgt , wird automatisch Raserei aktiviert, aber die Abklingzeit beträgt _3 Level des Helden_, wenn dies eintritt.\n\n_+2:_ Wenn der Berserker gleich stirbt und die Wut 100% oder mehr beträgt , wird automatisch Raserei aktiviert, aber die Abklingzeit beträgt _2 Level des Helden_, wenn dies eintritt.\n\n_+3:_ Wenn der Berserker gleich stirbt und die Wut 100% oder mehr beträgt , wird automatisch Raserei aktiviert, aber die Abklingzeit beträgt _1 Level des Helden_, wenn dies eintritt.\n\nDenke daran, dass der Berserker trotzdem stirbt, wenn er am Ende der Raserei 0 Lebenspunkte hat.
actors.hero.talent.deathless_fury.comment=Beachte: Wenn die Raserei endet und der Berserker 0 Lebenspunkte hat, stirbt er trotzdem.
actors.hero.talent.enraged_catalyst.title=wütender Katalysator
actors.hero.talent.enraged_catalyst.desc=_+1:_ Verzauberungen und Flüche auf der Waffe eines Berserkers werden umso öfter aktiviert, je mehr Wut er angestaut hat, bis zu _15% öfter_ bei 100% Wut.\n\n_+2:_ Verzauberungen und Flüche auf der Waffe eines Berserkers werden umso öfter aktiviert, je mehr Wut er angestaut hat, bis zu _30% öfter_ bei 100% Wut.\n\n_+3:_ Verzauberungen und Flüche auf der Waffe eines Berserkers werden umso öfter aktiviert, je mehr Wut er angestaut hat, bis zu _45% öfter_ bei 100% Wut.
actors.hero.talent.enraged_catalyst.comment=
actors.hero.talent.ceaseless_rage.title=Unaufhörlicher Zorn
actors.hero.talent.ceaseless_rage.desc=Durch die Aufwertung dieses Talents verfällt die aktuelle Wut des Berserkers nicht unter einen bestimmten Wert, und er erhält eine Aktionsgeschwindigkeitserhöhung in Höhe der aktuellen Wut.\n\n_+1:_ Schwellwert _30%_.\n\n_+2:_ Schwellwert _40%_.\n\n_+3:_ Schwellwert _50%_.
actors.hero.talent.ceaseless_rage.comment=Die Aktionsgeschwindigkeit beeinflusst sowohl Angriffs- als auch Bewegungsgeschwindigkeit; 100% Wut erhöht beide um 100%.
actors.hero.talent.mirrored_revenge.title=Gespiegelte Rache
actors.hero.talent.mirrored_revenge.desc=Durch Aufwerten dieses Talents reduziert das beschädigte Wappen des Berserkers bei jedem erlittenen Angriff zufällig 5~10 Runden der Schild-Regenerationsabklingzeit. Zudem fügt jeder Schild, den er erhält, beim Abfangen von physischem Schaden durch Gegner dem Angreifer Schaden zu.\n\n_+1：_Fügt Gegnern _100% des abgefangenen Schadens_ zu.\n\n_+2：_Fügt Gegnern _150% des abgefangenen Schadens_ zu.\n\n_+3：_Fügt Gegnern _200% des abgefangenen Schadens_ zu.
actors.hero.talent.mirrored_revenge.comment=Schild-Rückschlag ignoriert die Rüstung des Gegners, einschließlich Schilde während der Raserei und anderen Schildquellen.
actors.hero.talent.bloodthirsty_berserk.title=Blutrünstige Raserei
actors.hero.talent.bloodthirsty_berserk.desc=Durch die Aufwertung dieses Talents verlängert sich die Nahkampfreichweite des Berserkers während der Raserei um 1 Feld und er erhält zusätzlichen Bluttrunk-Effekt. Außerhalb der Raserei erhält er durch physischen Schaden Wut.\n\n_+1:_ Stelle während der Raserei _25%_ des verursachten physischen Schadens als Leben wieder her; außerhalb der Raserei erhalte Wut in Höhe von _0.5%_ des Schadens.\n\n_+2:_ Stelle _37%_ Leben wieder her; außerhalb erhalte _1%_ Wut.\n\n_+3:_ Stelle _50%_ Leben wieder her; außerhalb erhalte _1.5%_ Wut.
actors.hero.talent.bloodthirsty_berserk.comment=Bluttrinken wirkt nur bei Nahkampf-angriffen während der Raserei.

actors.hero.talent.cleave.title=Durchschneiden
actors.hero.talent.cleave.desc=_+1:_ Wenn der Gladiator einen Gegner tötet, wird Abklingzeit der Kombi für seinen nächsten Treffer auf _15 Züge_ gesetzt.\n\n_+2:_ Wenn der Gladiator einen Gegner tötet, wird Abklingzeit der Kombi für seinen nächsten Treffer auf _30 Züge_ gesetzt.\n\n_+3 _ Wenn der Gladiator einen Gegner tötet, wird Abklingzeit der Kombi für seinen nächsten Treffer auf _45 Züge_ gesetzt.
actors.hero.talent.cleave.comment=
actors.hero.talent.lethal_defense.title=tödliche Abwehr
actors.hero.talent.lethal_defense.desc=_+1:_ Wenn der Gladiator einen Gegner mit einem Kombiangriff tötet, _erhält er 33%_ Schild des zerbrochenen Siegels zurück.\n\n_+2:_ Wenn der Gladiator einen Gegner mit einem Kombiangriff tötet, _erhält er 67%_ Schild des zerbrochenen Siegels zurück.\n\n_+3:_ Wenn der Gladiator einen Gegner mit einem Kombiangriff tötet, _erhält er 100%_ Schildschutz des zerbrochenen Siegels zurück.
actors.hero.talent.lethal_defense.comment=
actors.hero.talent.enhanced_combo.title=verbesserte Kombi
actors.hero.talent.enhanced_combo.desc=_+1:_ Wenn der Kombiwert des Gladiators 7 oder mehr beträgt, erhöht sich der Rückstoß des Schlags auf 3, er verursacht Schwindel, und er kann Feinde in Gruben stoßen.\n\n_+2:_ Zusätzlich zu den Vorteilen von +1 funktioniert die Parade bei mehreren Angriffen, wenn der Kombiwert 9 oder höher beträgt.\n\n_+3:_ Zusätzlich zu den Vorteilen von +1 und +2 kann der Gladiator bis zu Kombiwert/3 Felder hervorspringen, wenn er Slam, Crush, oder Wut einsetzt.
actors.hero.talent.enhanced_combo.comment=
actors.hero.talent.combo_focus.title=Kombofokus
actors.hero.talent.combo_focus.desc=_+1:_ Der Gladiator erhöht pro _4_ gesammelten Kombo-Punkten den verursachten physischen Schaden um 1 (maximal 20) und die _Genauigkeit um 5%_ (maximal _100%_).\n\n_+2:_ Pro _3_ Kombo-Punkten, Schaden +1 (max. 20), _Genauigkeit +7.5%_ (max. _150%_).\n\n_+3:_ Pro _2_ Kombo-Punkten, Schaden +1 (max. 20), _Genauigkeit +10%_ (max. _200%_).
actors.hero.talent.combo_focus.comment=Der Schadensbonus wird nach anderen Schadensmodifikationen berechnet.
actors.hero.talent.relentless_combat.title=Unaufhörlicher Kampf
actors.hero.talent.relentless_combat.desc=_+1：_Wenn die Combo-Zahl des Gladiators 8 oder mehr erreicht, erhöht sich die Angriffsgeschwindigkeit um _50%_.\n\n_+2：_Erhöht sich um _100%_.\n\n_+3：_Erhöht sich um _150%_.
actors.hero.talent.relentless_combat.comment=
actors.hero.talent.combo_mastery.title=Kampftechnik-Meisterschaft
actors.hero.talent.combo_mastery.desc=Durch die Aufwertung dieses Talents setzen Kampftechniken des Gladiators die Kombo nicht mehr zurück, sondern verbrauchen entsprechende Punkte. Schock und Parade verbrauchen ebenfalls Kombo-Punkte, sodass sie mehrmals in derselben Kombo verwendet werden können.\n\n_+1:_ Das maximale zusätzliche Kombo-Limit durch Wappen steigt von 5 auf _8 Punkte_.\n\n_+2:_ Zusätzlich zu +1 wird der Kombo-Punkteverbrauch aller Kampftechniken _um 1 reduziert_.\n\n_+3:_ Zusätzlich zu +1 und +2 wird die Abklingzeit der Wappen-Kombo _um 10 Runden reduziert_.
actors.hero.talent.combo_mastery.comment=Die Effekte der Kampftechniken werden basierend auf der Kombonummer vor der Anwendung berechnet. Schock und erfolgreiche Parade geben 1 Kombo-Punkt zurück.

actors.hero.talent.body_slam.title=Körperschlag
actors.hero.talent.body_slam.desc=_+1:_ Wenn der Krieger nach dem Sprung landet, bekommen alle nebenstehenden Gegner _1-4 plus 25% _ seines Rüstungswertes als Schaden.\n\n_+2:_ Wenn der Krieger nach dem Sprung landet, bekommen alle nebenstehenden Gegner _2-8 plus 50%_ seines Rüstungswertes als Schaden.\n\n_+3:_ Wenn der Krieger nach dem Sprung landet, bekommen alle nebenstehenden Gegner _3-12 plus 75%_ seines Rüstungswertes als Schaden.\n\n_+4:_ Wenn der Krieger nach dem Sprung landet, bekommen alle nebenstehenden Gegner _4-16 plus 100%_ seines Rüstungswertes als Schaden.
actors.hero.talent.body_slam.comment=
actors.hero.talent.impact_wave.title=Druckwelle
actors.hero.talent.impact_wave.desc=_+1:_ Wenn der Krieger nach dem Sprung landet, werden alle benachbarten Feinde _2 Felder_ zurückgestoßen und haben eine _25% Chance_, 5 Züge lang verwundbar zu werden.\n\n_+2:_ Wenn der Krieger nach dem Sprung landet, werden alle benachbarten Feinde _3 Felder_ zurückgestoßen und haben eine _50% Chance_, 5 Züge lang verwundbar zu werden.\n\n_+3:_ Wenn der Krieger nach dem Sprung landet, werden alle benachbarten Feinde _4 Felder_ zurückgestoßen und haben eine _75% Chance_, 5 Züge lang verwundbar zu werden.\n\n_+4:_ Wenn der Krieger nach dem Sprung landet, werden alle benachbarten Feinde _5 Felder_ zurückgestoßen und haben eine _100% Chance_, 5 Züge lang verwundbar zu werden.
actors.hero.talent.impact_wave.comment=
actors.hero.talent.double_jump.title=Doppelsprung
actors.hero.talent.double_jump.desc=_+1:_ Wenn der Krieger innerhalb von 3 Zügen einen zweiten Sprung ausführt, hat dieser Sprung _16% reduzierte_ Aufladungskosten.\n\n_+2:_ Wenn der Krieger innerhalb von 3 Zügen einen zweiten Sprung ausführt, hat dieser Sprung _30% reduzierte_ Aufladungskosten.\n\n_+3:_ Wenn der Krieger innerhalb von 3 Zügen einen zweiten Sprung ausführt, hat dieser Sprung um _40% reduzierte_ Aufladungskosten.\n\n_+4:_ Wenn der Krieger innerhalb von 3 Zügen einen zweiten Sprung ausführt, hat dieser Sprung _50% reduzierte_ Aufladungskosten.
actors.hero.talent.double_jump.comment=

actors.hero.talent.expanding_wave.title=ausbreitende Welle
actors.hero.talent.expanding_wave.desc=_+1:_ Die Reichweite der Schockwelle erhöht sich von 5 auf _6 Felder_, und der Winkel der Ausbreitung vergrößert sich von 60 auf _75 Grad_.\n\n_+2:_ Die Reichweite der Schockwelle erhöht sich von 5 auf _7 Felder_, und der Winkel der Ausbreitung vergrößert sich von 60 auf _90 Grad_.\n\n_+3:_ Die Reichweite der Schockwelle erhöht sich von 5 auf _8 Felder_, und der Winkel der Ausbreitung vergrößert sich von 60 auf _105 Grad_.\n\n_+4:_ Die Reichweite der Schockwelle erhöht sich von 5 auf _9 Felder_, und der Winkel der Ausbreitung vergrößert sich von 60 auf _120 Grad_.
actors.hero.talent.expanding_wave.comment=
actors.hero.talent.striking_wave.title=Wellenschlag
actors.hero.talent.striking_wave.desc=_+1:_ Schockwelle hat eine Chance von _30%_, auch Treffereffekte wie Verzauberungen und Kombi zu verwenden.\n\n_+2:_ Schockwelle hat eine Chance von _60%_, auch Treffereffekte wie Verzauberungen und Kombi zu verwenden.\n\n_+3:_ Schockwelle hat eine Chance von _90%_, auch Treffereffekte wie Verzauberungen und Kombi zu verwenden.\n\n_+4:_ Schockwelle hat eine Chance von _100%_, auch Treffereffekte wie Verzauberungen und Kombi zu verwenden, und verleiht Verzauberungen _20% mehr Kraft_.
actors.hero.talent.striking_wave.comment=
actors.hero.talent.shock_force.title=Energieschock
actors.hero.talent.shock_force.desc=_+1:_ Schockwelle verursacht _20% mehr Schaden_ und hat eine Chance von _25%_, statt zu verkrüppeln, zu betäuben.\n\n_+2:_ Schockwelle verursacht _40% mehr Schaden_ und hat eine Chance von _50%_, zu betäuben statt zu verkrüppeln.\n\n_+3:_ Schockwelle verursacht _60% mehr Schaden_ und hat eine Chance von _75%_, zu betäuben statt zu verkrüppeln.\n\n_+4:_ Schockwelle verursacht _80% mehr Schaden_ und hat eine Chance von _100%_, statt zu verkrüppeln, zu betäuben.
actors.hero.talent.shock_force.comment=

actors.hero.talent.sustained_retribution.title=anhaltende Vergeltung
actors.hero.talent.sustained_retribution.desc=_+1:_ Der Krieger verursacht _115% Bonusschaden_ verteilt auf _2 Treffer_, anstatt 100% Bonusschaden in 1 Treffer.\n\n_+2:_ Der Krieger verursacht _130% Bonusschaden_ verteilt auf _3 Treffer_, anstatt 100% Bonusschaden in 1 Treffer.\n\n_+3:_ Der Krieger verursacht _145% Bonusschaden_ verteilt auf _4 Treffer_, anstatt 100% Bonusschaden in 1 Treffer.\n\n_+4:_ Der Krieger verursacht _160 % Bonusschaden_ verteilt auf _5 Treffer_, anstatt 100 % Bonusschaden in 1 Treffer.
actors.hero.talent.sustained_retribution.comment=
actors.hero.talent.shrug_it_off.title=nimm es hin
actors.hero.talent.shrug_it_off.desc=_+1:_ Die Schadensreduktion eines Kriegers ist von 50% _auf 60% erhöht_, während er durchhält.\n\n_+2:_ Die Schadensreduktion eines Kriegers ist von 50% _auf 68% erhöht_, während er durchhält.\n\n_+3:_ Die Schadensreduktion eines Kriegers ist von 50% _auf 74% erhöht_, während er durchhält.\n\n_+4:_ Die Schadensreduktion eines Kriegers ist von 50% _auf 80% erhöht_, während er durchhält.
actors.hero.talent.shrug_it_off.comment=
actors.hero.talent.even_the_odds.title=die Chancen ausgleichen
actors.hero.talent.even_the_odds.desc=_+1:_ Der Krieger teilt zusätzliche _5% Bonus-Schaden_ an alle Feinde im Umkreis von 2 Feldern aus, wenn das Aushalten endet.\n\n_+2:_ Der Krieger teilt zusätzliche _10% Bonus-Schaden_ an alle Feinde im Umkreis von 2 Feldern aus, wenn das Aushalten endet.\n\n_+3:_ Der Krieger teilt zusätzliche _15% Bonus-Schaden_ an alle Feinde im Umkreis von 2 Feldern aus, wenn das Aushalten endet.\n\n_+4:_ Der Krieger teilt zusätzliche _20% Bonus-Schaden_ an alle Feinde im Umkreis von 2 Feldern aus, wenn das Aushalten endet.
actors.hero.talent.even_the_odds.comment=

#mage
actors.hero.talent.empowering_meal.title=stärkende Mahlzeit
actors.hero.talent.empowering_meal.desc=_+1:_ Das Essen von Nahrung gewährt dem Magier bei den nächsten drei Malen, in denen er mit einem Zauberstab Schaden verursacht, _2 zusätzlichen Schaden_.\n\n_+2:_ Das Essen von Nahrung gewährt dem Magier bei den nächsten 3 Malen, in denen er mit einem Zauberstab Schaden verursacht, 3 zusätzlichen Schaden.
actors.hero.talent.empowering_meal.comment=Im Moment nach dem Essen spürst du, wie die Magie in dir aufwallt.
actors.hero.talent.scholars_intuition.title=Intuition des Gelehrten
actors.hero.talent.scholars_intuition.desc=_+1:_ Der Magier kann Zauberstäbe _3 mal so schnell_ identifizieren.\n\n_+2:_ Der Magier identifiziert Zauberstäbe, _sobald er sie benutzt_.
actors.hero.talent.scholars_intuition.comment=„Das wurde alles an der Magierakademie gelehrt.“
actors.hero.talent.lingering_magic.title=nachwirkende Magie
actors.hero.talent.lingering_magic.desc=_+1:_ Wenn der Magier einen Zauberstab oder Stab einsetzt, verursacht sein nächster physischer Angriff _1-2 Bonusschaden_.\n\n_+2:_ Wenn der Magier einen Zauberstab oder Stab einsetzt, verursacht sein nächster physischer Angriff _2 Bonusschaden Schaden_.
actors.hero.talent.lingering_magic.comment=Im Grunde bleiben nach dem Zaubern ein wenig Magie an den Händen zurück.
actors.hero.talent.backup_barrier.title=Notbarriere
actors.hero.talent.backup_barrier.desc=_+1:_ Der Magier erhält _3 Schildpunkte_, wenn er die letzte Ladung seines Stabs verbraucht.\n\n_+2:_ Der Magier erhält _5 Schildpunkte_, wenn er die letzte Ladung seines Stabs verbraucht.
actors.hero.talent.backup_barrier.comment=„Die letzte Welle."
actors.hero.talent.backup_barrier.meta_desc=_Wenn dieses Talent durch einen anderen Helden gewonnen wird_, wird es stattdessen durch den Zauberstab des Helden mit dem höchsten Level ausgelöst.

actors.hero.talent.energizing_meal.title=energiereiche Mahlzeit
actors.hero.talent.energizing_meal.desc=_+1:_ Das Essen von Nahrung dauert für den Magier 1 Runde und gewährt ihm _5 Züge Zauberstab-Aufladung_.\n\n_+2:_ Das Essen von Nahrung dauert für den Magier 1 Runde und gewährt ihm _8 Züge Zauberstab-Aufladung_.
actors.hero.talent.energizing_meal.comment=Essen bringt üppigere Magie.
actors.hero.talent.inscribed_power.title=niedergeschriebene Macht
actors.hero.talent.inscribed_power.desc=_+1:_ Wenn der Magier eine Schriftrolle liest oder einen Zaubergegenstand verwendet, erhalten seine _nächsten 2 Zauberstab-Zaps_ +2 Stufen.\n\n_+2:_ Wenn der Magier eine Schriftrolle liest oder einen Zaubergegenstand verwendet, erhalten seine _nächsten 3 Zauberstab-Zaps_ +2 Stufen.\n\nDie Anzahl der verbesserten Zauberstab-Zaps wird verdoppelt, wenn eine Schriftrolle mit Upgrade-, Transmutations- oder Alchemiegegenständen verwendet wird, die mit diesen Schriftrollen hergestellt wurde..\n\nBei Alchemiegegenständen mit höheren Produktionsmengen (z. B. den meisten Zaubersprüchen) besteht eine Chance, dass dieses Talent ausgelöst wird, je nachdem, wie viele dieser Gegenstände produziert werden.
actors.hero.talent.inscribed_power.comment=Bei Verwendung von Aufwertungs-, Wandlungsrollen oder daraus hergestellten alchemistischen Gegenständen verdoppelt sich die Anzahl der verstärkten Zauber des Zauberstabs.\n\nBei ergiebigen alchemistischen Gegenständen (wie den meisten Kristallen) basiert die Auslösung auf der Stückzahl pro Herstellung.\n\nDiese Fertigkeit kann durch Lesen des Buches des Chaos ausgelöst werden.\n\nDie in die Rollen gemeißelten Runen enthalten selbst große Mengen an Magie.
actors.hero.talent.wand_preservation.title=Bewahrung von Zauberstäben
actors.hero.talent.wand_preservation.desc=_+1:_ Wenn der Magier einen neuen Zauberstab in seinen Stab einsetzt, wird der alte Zauberstab mit +0 zurückgegeben, _das kann aber nur einmal gemacht werden._\n\n_+2:_ Wenn der Magier einen neuen Zauberstab in seinen Stab einsetzt, wird der alte Zauberstab mit +0 zurückgegeben, _das kann einmal pro Heldenstufe gemacht werden._
actors.hero.talent.wand_preservation.comment=„Hochwertige Stäbe werden stets bevorzugt.“
actors.hero.talent.wand_preservation.meta_desc=_Wenn dieses Talent durch einen anderen Helden gewonnen wird_, erhöht es stattdessen die Menge an gewonnenem arkanem Harz, wenn ein Zauberstab in einem Alchemiekessel aufgelöst wird, um 1 bei +1, oder um 2 bei +2.
actors.hero.talent.arcane_vision.title=arkane Wahrnehmung
actors.hero.talent.arcane_vision.desc=_+1:_ Wenn der Magier auf einen Feind feuert, bekommt er _10 Züge lang_ die Übersinnliche Wahrnehmung für ihn.\n\n_+2:_ Wenn der Magier auf einen Feind feuert, bekommt er _15 Züge lang_ die Übersinnliche Wahrnehmung für ihn.
actors.hero.talent.arcane_vision.comment=„Die an Feinden haftende Magie ermöglicht es dir, ihre Position zu spüren."
actors.hero.talent.shield_battery.title=Schildbatterie
actors.hero.talent.shield_battery.desc=_+1:_ Der Magier kann mit einem Zauberstab auf sich selbst zielen, um alle Ladungen des Zauberstabs mit einer Rate von _4% maximale LP pro Ladung_ in einen Schild umzuwandeln.\n\n_+2:_ Der Magier kann mit einem Zauberstab auf sich selbst zielen, um alle Ladungen des Zauberstabs mit einer Rate von _6% maximale LP pro Ladung_ in einen Schild umzuwandeln.
actors.hero.talent.shield_battery.comment=„Notmaßnahme.“

actors.hero.talent.desperate_power.title=verzweifelte Macht
actors.hero.talent.desperate_power.desc=_+1:_ Die Stäbe des Magiers erhalten _+1 Stufe_ auf ihren letzten Angriff, wenn sie nur noch eine Ladung haben.\n\n_+2:_ Die Stäbe des Magiers erhalten _+2 Stufen_ auf ihren letzten Angriff, wenn sie nur noch eine Ladung haben.\n\n_+3:_ Die Stäbe des Magiers erhalten _+3 Stufen_ auf ihren letzten Angriff, wenn sie nur noch eine Ladung haben.
actors.hero.talent.desperate_power.comment=
actors.hero.talent.ally_warp.title=Verbündeten-Teleportation
actors.hero.talent.ally_warp.desc=_+1:_ Der Magier kann einen Verbündeten innerhalb von _2 Feldern Entfernung_ wählen, um sofort mit ihm den Platz zu tauschen.\n\n_+2:_ Der Magier kann einen Verbündeten innerhalb von _4 Feldern Entfernung_ wählen, um sofort mit ihm den Platz zu tauschen.\n\n_+3:_ Der Magier kann einen Verbündeten innerhalb von _6 Feldern Entfernung_ wählen, um sofort mit ihnen den Platz zu tauschen.\n\nDer Magier kann seinen Platz nicht mit unbeweglichen Verbündeten tauschen.
actors.hero.talent.ally_warp.comment=Der Magier kann nicht mit unbeweglichen Verbündeten den Platz tauschen.\n\nWenn DM-400 (einschließlich AT-400 und AU-400 Spezialisierungen im Zufallsmodus) dieses Talent erhält, kann er auf Stufe _+1/+2/+3_ durch Klicken auf nicht benachbarte Drohnen in _2/4/6 Feldern_ Entfernung wählen, ob er mit ihnen den Platz tauschen oder sie befehligen möchte.

actors.hero.talent.empowered_strike.title=ermächtigter Schlag
actors.hero.talent.empowered_strike.desc=_+1:_ Der erste Nahkampf-Schlag des Kampfmagiers mit seinem Stab nach dem Einsatz als Zauberstab verursacht _+16% Schaden_ und der Bonuseffekt des Stabs erhält _+50% Kraft_.\n\n_+2:_ Der erste Nahkampf-Schlag des Kampfmagiers mit seinem Stab nach dem Einsatz als Zauberstab verursacht _+33% Schaden_ und der Bonuseffekt des Stabs erhält _+100% Kraft_.\n\n_+3:_ Der erste Nahkampf-Schlag des Kampfmagiers mit seinem Stab nach dem Einsatz als Zauberstab verursacht _+50% Schaden_ und der Bonuseffekt des Stabs erhält _+150% Kraft_.
actors.hero.talent.empowered_strike.comment=
actors.hero.talent.mystical_charge.title=mystische Ladung
actors.hero.talent.mystical_charge.desc=_+1:_ Das Schlagen mit seinem Stab gewährt dem Kampfmagier _0,5 Züge_ Wiederaufladen von Artefakten.\n\n_+2:_ Das Schlagen mit seinem Stab gewährt dem Kampfmagier eine Wiederaufladung von Artefakten im Wert von _1 Zug_.\n\n_+3:_ Das Schlagen mit seinem Stab gewährt dem Kampfmagier _1,5 Züge_ Wiederaufladen von Artefakten.
actors.hero.talent.mystical_charge.comment=
actors.hero.talent.excess_charge.title=überschüssige Ladung
actors.hero.talent.excess_charge.desc=_+1:_ Wenn der Stab des Kampfmagiers voll aufgeladen ist, gewährt sein nächster Schuss ihm _0.67 Schild_ pro Stufe des Stabs.\n\n_+2:_ Wenn der Stab des Kampfmagiers voll aufgeladen ist, gewährt sein nächster Schuss ihm _1.33 Schild_ pro Stufe des Stabs.\n\n_+3:_ Wenn der Stab des Kampfmagiers voll aufgeladen ist, gewährt sein nächster Schuss ihm _2 Schild_ pro Stufe des Stabs.
actors.hero.talent.excess_charge.comment=

actors.hero.talent.soul_siphon.title=Seelenfänger
actors.hero.talent.soul_siphon.desc=_+1:_ Physischer Schaden, der von anderen Charakteren verursacht wird, löst das Seelenzeichen des Hexenmeisters mit _13% Effektivität_ aus.\n\n_+2:_ Physischer Schaden, der von anderen Charakteren verursacht wird, löst das Seelenzeichen des Hexenmeisters mit _27 % Effektivität_ aus.\n\n_+3:_ Physischer Schaden, der von anderen Charakteren verursacht wird, löst das Seelenzeichen des Hexenmeisters mit _40% Effektivität_ aus.
actors.hero.talent.soul_siphon.comment=
actors.hero.talent.soul_eater.title=Seelenfresser
actors.hero.talent.soul_eater.desc=_+1:_ Seelenzeichen gewährt _0,33 Züge_ Sättigung für jeden zugefügten physischen Schaden. Seelenmarkierte Feinde haben eine _10% Chance_, bei ihrem Tod Effekte wie nach dem Verzehr von Nahrung auszulösen.\n\n_+2:_ Seelenzeichen gewährt _0,67 Züge_ Sättigung für jeden zugefügten physischen Schaden. Seelenmarkierte Feinde haben eine _20% Chance_, bei ihrem Tod Effekte wie nach dem Verzehr von Nahrung auszulösen.\n\n_+3:_ Seelenzeichen gewährt _1 Zug_ Sättigung für jeden zugefügten physischen Schaden. Seelenmarkierte Feinde haben eine _30% Chance_, bei ihrem Tod Effekte wie nach dem Verzehr von Nahrung auszulösen.
actors.hero.talent.soul_eater.comment=
actors.hero.talent.necromancers_minions.title=Schergen des Nekromanten
actors.hero.talent.necromancers_minions.desc=_+1:_ Wenn ein seelenmarkierter Feind stirbt, hat der Hexenmeister eine _13% Chance_, ihn als verderbten Geist zu erwecken.\n\n_+2:_ Wenn ein seelenmarkierter Feind stirbt, hat der Hexenmeister eine  _27% Chance_, ihn als verderbten Geist zu erwecken.\n\n_+3:_ Wenn ein seelenmarkierter Feind stirbt, hat der Hexenmeister eine  _40% Chance_, ihn als verderbten Geist zu erwecken.
actors.hero.talent.necromancers_minions.comment=

actors.hero.talent.blast_radius.title=Explosionsradius
actors.hero.talent.blast_radius.desc=_+1:_ Der Radius der Elementarexplosion wird erhöht von 4 auf _5 Felder_.\n\n_+2:_ Der Radius der Elementarexplosion wird erhöht von 4 auf _6 Felder_.\n\n_+3:_ Der Radius der Elementarexplosion wird erhöht von 4 auf _7 Felder_.\n\n_+4:_ Der Radius der Elementarexplosion wird erhöht von 4 auf _8 Felder_.
actors.hero.talent.blast_radius.comment=
actors.hero.talent.elemental_power.title=Elementarenergie
actors.hero.talent.elemental_power.desc=_+1:_ Die Kraft der Elementarexplosion wird um _25%_ erhöht.\n\n_+2:_ Die Kraft der Elementarexplosion wird um _50%_ erhöht.\n\n_+3:_ Die Kraft der Elementarexplosion wird um _75%_ erhöht.\n\n_+4:_ Die Kraft der Elementarexplosion wird um _100%_ erhöht.
actors.hero.talent.elemental_power.comment=
actors.hero.talent.reactive_barrier.title=reaktive Barriere
actors.hero.talent.reactive_barrier.desc=_+1:_ Der Magier erhält _2,5 Schild_ für jeden von einer Elementarexplosion betroffenen Charakter, für höchstens 5 Charaktere.\n\n_+2:_ Der Magier erhält _5 Schild_ für jeden von einer Elementarexplosion betroffenen Charakter, für höchstens 6 Charaktere.\n\n_+3:_ Der Magier erhält _7,5 Schild_ für jeden von einer Elementarexplosion betroffenen Charakter, für höchstens 7 Charaktere.\n\n_+4:_ Der Magier erhält _10 Schild_ für jeden von einer Elementarexplosion betroffenen Charakter, für höchstens 8 Charaktere.
actors.hero.talent.reactive_barrier.comment=

actors.hero.talent.wild_power.title=wilde Kraft
actors.hero.talent.wild_power.desc=_+1:_ Beim Einsatz von wilder Magie werden Zauberstäbe um _2 oder 3, bis auf +4_, verstärkt.\n\n_+2:_ Beim Einsatz von wilder Magie werden Zauberstäbe um _3, bis auf +5_, verstärkt.\n\n_+3:_ Beim Einsatz von wilder Magie werden Zauberstäbe um _3 oder 4, bis auf +6_, verstärkt.\n\n_+4:_ Beim Einsatz von wilder Magie werden Zauberstäbe um _4, bis auf +7_, verstärkt.
actors.hero.talent.wild_power.comment=
actors.hero.talent.fire_everything.title=aus allen Rohren
actors.hero.talent.fire_everything.desc=_+1:_ wilde Magie feuert nun _5_ statt bisher 4 mal, und jeder Zauberstab hat eine 25% Chance, bis zu dreimal verwendet werden zu können.\n\n_+2:_ wilde Magie feuert nun _6_ statt bisher 4 mal, und jeder Zauberstab hat eine 50% Chance, bis zu dreimal verwendet werden zu können.\n\n_+3:_ wilde Magie feuert nun _7_ statt bisher 4 mal, und jeder Zauberstab hat eine 75% Chance, bis zu dreimal verwendet werden zu können.\n\n_+4:_ wilde Magie feuert nun _8_ statt bisher 4 mal, und jeder Zauberstab hat eine 100% Chance, bis zu dreimal verwendet werden zu können.
actors.hero.talent.fire_everything.comment=
actors.hero.talent.conserved_magic.title=konservierte Magie
actors.hero.talent.conserved_magic.desc=_+1:_ Jeder Schuss mit wilder Magie verbraucht jetzt _0,33 Ladungen_ statt 0,5 und wilde Magie hat eine Chance von _25%_, keinen Zug zu verbrauchen.\n\n_+2:_ Jeder Schuss mit wilder Magie verbraucht jetzt _0,225 Ladungen_ statt 0,5 und wilde Magie hat eine Chance von _50%_, keinen Zug zu verbrauchen.\n\n_+3:_ Jeder Schuss mit wilder Magie verbraucht jetzt _0,15 Ladungen_ statt 0,5 und wilde Magie hat eine Chance von _75%_, keinen Zug zu verbrauchen.\n\n_+4:_ Jeder Schuss mit wilder Magie verbraucht jetzt _0,1 Ladungen_ statt 0,5 und wilde Magie hat eine Chance von _100%_, keinen Zug zu verbrauchen.
actors.hero.talent.conserved_magic.comment=

actors.hero.talent.telefrag.title=Teleporttod
actors.hero.talent.telefrag.desc=_+1:_ Wenn der Magier in einen anderen Charakter teleportiert, fügt er diesem _10-15 Schaden_ zu, erleidet aber selbst auch _5 Schaden_.\n\n_+2:_ Wenn der Magier in einen anderen Charakter teleportiert, fügt er diesem _20-30 Schaden_ zu, erleidet aber selbst auch _10 Schaden_.\n\n_+3:_ Wenn der Magier in einen anderen Charakter teleportiert, fügt er diesem _30-45 Schaden_ zu, erleidet aber selbst auch _15 Schaden_.\n\n_+4:_ Wenn der Magier in einen anderen Charakter teleportiert, fügt er diesem _40-60 Schaden_ zu, erleidet aber selbst auch _20 Schaden_.\n\nDer Held kann durch dieses Talent nicht getötet werden, der Selbstschaden kann durch Magieresistenz-Effekte reduziert werden.
actors.hero.talent.telefrag.comment=Der Held stirbt nicht durch Selbstschaden; dieser Schaden kann durch Magieresistenz reduziert werden.
actors.hero.talent.remote_beacon.title=fernes Leuchtfeuer
actors.hero.talent.remote_beacon.desc=_+1:_ Der Magier kann eine Sprungmarke an einem beliebigen Ort innerhalb von _4 Feldern_ aufstellen.\n\n_+2:_ Der Magier kann eine Sprungmarke an einem beliebigen Ort innerhalb von _8 Feldern_ aufstellen.\n\n_+3:_ Der Magier kann eine Sprungmarke an einem beliebigen Ort innerhalb von _12 Feldern_ aufstellen.\n\n_+4:_ Der Magier kann eine Sprungmarke an einem beliebigen Ort innerhalb von _16 Feldern_ platzieren.\n\nDer Magier kann keine Sprungmarken an Orten platzieren, die nicht zugänglich sind.
actors.hero.talent.remote_beacon.comment=Der Magier kann keine Leuchtfeuer an unzugänglichen Orten platzieren.
actors.hero.talent.longrange_warp.title=Fernteleportation
actors.hero.talent.longrange_warp.desc=_+1:_ Der Magier kann jetzt mit _150% Ladungskosten_ zwischen Ebenen teleportieren.\n\n_+2:_ Der Magier kann jetzt mit _117% Ladungskosten_ zwischen Ebenen teleportieren.\n\n_+3:_ Der Magier kann jetzt mit _83% Ladungskosten_ zwischen Ebenen teleportieren.\n\n_+4:_ Der Magier kann jetzt mit _50% Ladungskosten_ zwischen Ebenen teleportieren.\n\nDer Magier kann die Fernteleportation nicht nutzen, um abgeschlossene Ebenen zu verlassen.
actors.hero.talent.longrange_warp.comment=Der Magier kann diese Fähigkeit nicht nutzen, um blockierte Etagen zu verlassen.

#rogue
actors.hero.talent.cached_rations.title=versteckte Essensrationen
actors.hero.talent.cached_rations.desc=_+1:_ Der Schurke kann _2 Versorgungsrationen_ in Truhen finden, während er die nächsten Ebenen des Dungeons erforscht.\n\n_+2:_ Der Schurke kann _3 kleine Versorgungsrationen_ in Truhen finden, während er die nächsten Ebenen des Dungeons erforscht.\n\nVersorgungsrationen sind schnell gegessen, durch sie wird man mäßig gesättigt, sie heilen 5 Lebenspunkte und laden den Umhang der Schatten um 1 auf.
actors.hero.talent.cached_rations.comment=Notrationen können schnell verzehrt werden, stellen mittlere Sättigung wieder her, heilen 5 Lebenspunkte und laden den Schattenumhang um 1 Ladung auf.\n\n„Materialunterstützung von der Diebesgilde für ihre Mitglieder."
actors.hero.talent.thiefs_intuition.title=Intuition des Diebes
actors.hero.talent.thiefs_intuition.desc=_+1:_ Der Schurke identifiziert Ringe _2x schneller_ und identifiziert den Typ eines Ringes, _sobald er ihn ausrüstet_.\n\n_+2:_ Der Schurke identifiziert Ringe, _sobald er sie ausrüstet_, und identifiziert den Typ eines Ringes, _sobald er ihn aufhebt_.
actors.hero.talent.thiefs_intuition.comment=„Diese Juwelen kennst du aus dem ‚Juwelier-Handbuch‘, das du in der Diebesgilde erworben hast.“
actors.hero.talent.sucker_punch.title=Überraschungsschlag
actors.hero.talent.sucker_punch.desc=_+1:_ Der Schurke fügt einem Feind beim ersten Überraschungsangriff _1-2 Punkte zusätzlichen Schadens_ zu.\n\n_+2:_ Der Schurke fügt einem Feind beim ersten Überraschungsangriff _2 Punkte zusätzlichen Schadens_ zu.
actors.hero.talent.sucker_punch.comment="Ein Hinterhalt ist Pflicht für jedes Mitglied der Diebesgilde."
actors.hero.talent.protective_shadows.title=schützende Schatten
actors.hero.talent.protective_shadows.desc=_+1:_ Der Schurke erhält _aller zwei Züge_, in denen er unsichtbar ist, einen Schildpunkt, _maximal 3_.\n\n_+2:_ Der Schurke erhält _jeden Zug_, in dem er unsichtbar ist, einen Schildpunkt, _maximal 5_.
actors.hero.talent.protective_shadows.comment=„Gehe im Dunkeln, diene dem Licht.“

actors.hero.talent.mystical_meal.title=mystische Mahlzeit
actors.hero.talent.mystical_meal.desc=_+1:_ Das Essen von Nahrung dauert für den Schurken einen Zug (Versorgungsrationen werden sofort gegessen) und gewährt ihm _3 Züge mit Artefakt-Aufladung_.\n\n_+2:_ Das Essen von Nahrung dauert für den Schurken einen Zug (Versorgungsrationen werden sofort gegessen) und gewährt ihm _5 Züge mit Artefakt-Aufladung_.\n\nDieses Talent kann nicht dazu eingesetzt werden, dass sich das Horn des Überflusses selbst auflädt.
actors.hero.talent.mystical_meal.comment=Dieses Talent kann das Füllhorn nicht selbst aufladen.\n\n„Um den Bedarf der Abenteurer an magischen Gegenständen zu decken, stellen Lebensmittelgeschäfte oft Magier ein, um den Speisen eine kleine Menge… Magie hinzuzufügen.“
actors.hero.talent.inscribed_stealth.title=niedergeschriebene Unsichtbarkeit
actors.hero.talent.inscribed_stealth.desc=Alchemie_+1:_ Der Schurke erhält _3 Runden_ Unsichtbarkeit, nachdem er eine Schriftrolle liest oder einen Zaubergegenstand verwendet.\n\n_+2:_ Der Schurke erhält _5 Runden_ Unsichtbarkeit, nachdem er eine Schriftrolle liest oder einen Zaubergegenstand verwendet.\n\nDie Dauer der Unsichtbarkeit verdoppelt sich, wenn eine Schriftrolle der Verbesserung oder der Umwandlung bzw. auf diesen Schriftrollen basierenden alchemistischen Gegenständen verwendet werden, \n\nBei alchemistischen Gegenständen mit höheren Produktionsmengen (z. B. den meisten Zaubersprüchen) besteht eine Chance, dass dieses Talent ausgelöst wird, abhängig davon, wie viele Exemplare des Gegenstands produziert werden.
actors.hero.talent.inscribed_stealth.comment=Bei Verwendung von Aufwertungs-, Wandlungsrollen oder daraus hergestellten alchemistischen Gegenständen verdoppelt sich die Dauer der Tarnung.\n\nBei ergiebigen alchemistischen Gegenständen (wie den meisten Kristallen) basiert die Auslösung auf der Stückzahl pro Herstellung.\n\nDiese Fertigkeit kann durch Lesen des Buches des Chaos ausgelöst werden.\n\nDiebe sind es gewohnt, im Dunkeln ihre schmutzigen kleinen Geheimnisse zu lesen.
actors.hero.talent.wide_search.title=großangelegte Suche
actors.hero.talent.wide_search.desc=_+1:_ Der Suchradius des Schurken wird von einem 5x5 Felder großen Bereich zu einem _7x7 Felder großen Kreis_ erweitert.\n\n_+2:_ Der Suchradius des Schurken wird von einem 5x5 Felder großen Bereich zu einem _7x7 Felder großen Bereich_ erweitert..
actors.hero.talent.wide_search.comment=„Nichts kann sich in meinem Blickfeld verstecken.“
actors.hero.talent.wide_search.meta_desc=_Wenn dieses Talent durch einen anderen Helden erworben wird_, wird es seinen Suchradius stattdessen von einem 3x3-Quadrat bei +1 zu einem 5x5-Kreis, bei +2 zu einem 5x5-Quadrat erweitern.
actors.hero.talent.silent_steps.title=leise Schritte
actors.hero.talent.silent_steps.desc=_+1:_ Der Schurke weckt keine schlafenden Feinde, solange er _3 oder mehr Felder entfernt_ ist.\n\n_+2:_ Der Schurke weckt keine schlafenden Feinde, solange er _nicht direkt neben ihnen_ steht.
actors.hero.talent.silent_steps.comment=„Pst.“
actors.hero.talent.rogues_foresight.title=Vorhersehung des Schurken
actors.hero.talent.rogues_foresight.desc=_+1:_ Wenn der Schurke sich auf einer Ebene mit einem Geheimraum befindet, hat er eine _75% Chance zu bemerken_, dass die Ebene ein Geheimnis enthält.\n\n_+2:_ Wenn der Schurke sich auf einer Ebene mit einem Geheimraum befindet, hat er eine _100% Chance zu bemerken_, dass die Ebene ein Geheimnis enthält.
actors.hero.talent.rogues_foresight.comment=„Endlich gefunden.“

actors.hero.talent.light_cloak.title=leichter Umhang
actors.hero.talent.light_cloak.desc=_+1:_ Der Schurke kann seinen Schattenmantel benutzen, wenn er nicht ausgerüstet ist, aber er lädt sich mit nur _25% Geschwindigkeit_ wieder auf.\n\n_+2:_ Der Schurke kann seinen Schattenmantel benutzen, wenn er nicht ausgerüstet ist, aber er lädt sich mit nur _50% Geschwindigkeit_ wieder auf.\n\n_+3:_ Der Schurke kann seinen Schattenmantel benutzen, wenn er nicht ausgerüstet ist, aber er lädt sich mit nur _75% Geschwindigkeit_ auf.
actors.hero.talent.light_cloak.comment=
actors.hero.talent.light_cloak.meta_desc=_Wenn dieses Talent durch einen anderen Helden erworben wird_, wird es stattdessen die Geschwindigkeit der Aufladung aller Artefakte um 7/13/20% bei je +1/+2/+3 erhöhen.
actors.hero.talent.enhanced_rings.title=verbesserte Ringe
actors.hero.talent.enhanced_rings.desc=_+1:_ Wenn der Schurke ein Artefakt verwendet, erhalten seine Ringe _3 Züge lang_ eine Verbesserung um +1.\n\n_+2:_ Wenn der Schurke ein Artefakt verwendet, erhalten seine Ringe _6 Züge lang_ eine Verbesserung um +1.\n\n_+3:_ Wenn der Schurke ein Artefakt verwendet, erhalten seine Ringe _9 Züge lang_ eine Verbesserung um +1.
actors.hero.talent.enhanced_rings.comment=

actors.hero.talent.enhanced_lethality.title=verbesserte Sterblichkeit
actors.hero.talent.enhanced_lethality.desc=_+1:_ Der Attentäter kann Gegner, die weniger als _4/13/27/67% Lebenspunkte_ pro Level der Vorbereitung haben, meucheln, statt solche mit weniger als 3/10/20/50%.\n\n_+2:_ Der Attentäter kann Gegner, die weniger als _5/17/33/83% Lebenspunkte_ pro Level der Vorbereitung haben, meucheln, statt solche mit weniger als 3/10/20/50%.\n\n_+3:_ Der Attentäter kann Gegner, die weniger als _6/20/40/100% Lebenspunkte_ pro Level der Vorbereitung haben, meucheln, statt solche mit weniger als 3/10/20/50%.
actors.hero.talent.enhanced_lethality.comment=
actors.hero.talent.assassins_reach.title=Reichweite des Attentäters
actors.hero.talent.assassins_reach.desc=_+1:_ Die Teleportreichweite des Attentäters pro Vorbereitungsstufe wird von 1/2/3/4 auf _1/3/4/6 Felder_ erhöht.\n\n_+2:_ Die Teleportreichweite des Attentäters pro Vorbereitungsstufe wird von 1/2/3/4 auf _2/4/6/8 Felder_ erhöht.\n\n_+3:_ Die Teleportreichweite des Attentäters pro Vorbereitungsstufe wird von 1/2/3/4 auf _2/5/7/10 Felder_ erhöht.\n\nDie Teleportation kann durch Gefahren und Gegner gehen, aber nicht durch festes Gelände wie Mauern.
actors.hero.talent.assassins_reach.comment=Dieser Blitz kann über gefährliches Terrain oder Feinde hinwegfegen, aber nicht durch feste Wände oder ähnliches.
actors.hero.talent.bounty_hunter.title=Kopfgeldjäger
actors.hero.talent.bounty_hunter.desc=_+1:_ Wenn der Attentäter einen Gegner mit einem vorbereiteten Angriff tötet, erhöht sich die Chance, dass der Gegner Gegenstände fallen lässt, um _2/4/8/16%_ pro Stufe der Vorbereitung.\n\n_+2:_ Wenn der Attentäter einen Gegner mit einem vorbereiteten Angriff tötet, erhöht sich die Chance, dass der Gegner Gegenstände fallen lässt, um _4/8/16/32%_ pro Stufe der Vorbereitung.\n\n_+3:_ Wenn der Attentäter einen Gegner mit einem vorbereiteten Angriff tötet, erhöht sich die Chance, dass der Gegner Gegenstände fallen lässt, um _6/12/24/48%_ pro Stufe der Vorbereitung.
actors.hero.talent.bounty_hunter.comment=

actors.hero.talent.evasive_armor.title=ausweichende Rüstung
actors.hero.talent.evasive_armor.desc=_+1:_ Beim Freilaufen erhält der Freiläufer zusätzlich _+1 Ausweichen_ pro bezüglich seiner Rüstung überschüssigem Stärkepunkt.\n\n_+2:_ Beim Freilaufen erhält der Freiläufer zusätzlich _+2 Ausweichen_ pro bezüglich seiner Rüstung überschüssigem Stärkepunkt.\n\n_+3:_ Beim Freilaufen erhält der Freiläufer zusätzlich _+3 Ausweichen_ pro bezüglich seiner Rüstung überschüssigem Stärkepunkt.
actors.hero.talent.evasive_armor.comment=
actors.hero.talent.projectile_momentum.title=Projektilschwung
actors.hero.talent.projectile_momentum.desc=_+1:_ Beim Freilaufen erhält der Freiläufer _+20% Genauigkeit und +15% Schaden_ mit Wurfwaffen.\n\n_+2:_ Beim Freilaufen erhält der Freiläufer _+40% Genauigkeit und +30% Schaden_ mit Wurfwaffen.\n\n_+3:_ Beim Freilaufen erhält der Freiläufer _+60% Genauigkeit und +45% Schaden_ mit Wurfwaffen.
actors.hero.talent.projectile_momentum.comment=
actors.hero.talent.speedy_stealth.title=schnelle Heimlichkeit
actors.hero.talent.speedy_stealth.desc=_+1:_ Der Freiläufer erhält pro Zug 2 Stöße Schwung, solange er unsichtbar ist.\n\n_+2:_ Zusätzlich zu den Vorteilen von +1 zählt Freilaufen nicht mehr herunter, solange der Freiläufer unsichtbar ist.\n\n_+3:_ Zusätzlich zu den Vorteilen von +1 und +2 bewegt sich der Freiläufer mit 2-facher Geschwindigkeit, wenn er unsichtbar ist, egal ob er frei läuft oder nicht.
actors.hero.talent.speedy_stealth.comment=

actors.hero.talent.hasty_retreat.title=hastiger Rückzug
actors.hero.talent.hasty_retreat.desc=_+1:_ Nach dem Teleportieren erhält der Schurke _1 Zug_ Eile und Unsichtbarkeit.\n\n_+2:_ Nach dem Teleportieren erhält der Schurke _2 Züge_ Eile und Unsichtbarkeit.\n\n_+3:_ Nach dem Teleportieren erhält der Schurke _3 Züge_ Eile und Unsichtbarkeit.\n\n_+4:_ Nach dem Teleportieren erhält der Schurke _4 Züge_ Eile und Unsichtbarkeit.
actors.hero.talent.hasty_retreat.comment=
actors.hero.talent.body_replacement.title=Körperersatz
actors.hero.talent.body_replacement.desc=_+1:_ Nach dem Teleportieren hinterlässt der Schurke einen hölzernen Köder, der _20 Gesundheit und 1-3 Rüstung_ hat.\n\n_+2:_ Nach dem Teleportieren lässt der Schurke einen hölzernen Lockvogel zurück, der _40 Lebenspunkte und 2-6 Rüstung_ hat.\n\n_+3:_ Nach dem Teleportieren lässt der Schurke einen hölzernen Lockvogel zurück, der _60 Lebenspunkte und 3-9 Rüstung_ hat.\n\n_+4:_ Nach dem Teleportieren lässt der Schurke einen hölzernen Köder zurück, der _80 Lebenspunkte und 4-12 Rüstung_ hat.\n\nEs kann jeweils nur ein Köder aktiv sein.
actors.hero.talent.body_replacement.comment=Es kann nur ein Ersatz-Holzpfahl gleichzeitig existieren.
actors.hero.talent.shadow_step.title=Schattenschritt
actors.hero.talent.shadow_step.desc=_+1:_ Wenn der Schurke eine Rauchbombe einsetzt, während er unsichtbar ist, tritt sie sofort ein und hat um _16% reduzierte Aufladekosten, aber sie blendet auch keine Gegner und löst keine anderen Talente aus.\n\n_+2:_ Wenn der Schurke eine Rauchbombe einsetzt, während er unsichtbar ist, tritt sie sofort ein und hat um _30% reduzierte Aufladekosten, aber sie blendet auch keine Gegner und löst keine anderen Talente aus.\n\n_+3:_ Wenn der Schurke eine Rauchbombe einsetzt, während er unsichtbar tritt sie sofort ein und hat um _41% reduzierte Aufladekosten, aber sie blendet auch keine Gegner und löst keine anderen Talente aus.\n\n_+4:_ Wenn der Schurke eine Rauchbombe einsetzt, während er unsichtbar ist, tritt sie sofort ein und hat um 50 % reduzierte Aufladekosten, aber sie blendet auch keine Gegner und löst keine anderen Talente aus.
actors.hero.talent.shadow_step.comment=

actors.hero.talent.fear_the_reaper.title=fürchte den Sensenmann
actors.hero.talent.fear_the_reaper.desc=_+1:_ Wenn zum Tod markierte Gegner 0 LP erreichen, werden sie _verkrüppelt_.\n\n_+2:_ Wenn zum Tod markierte Gegner 0 LP erreichen, werden sie _verängstigt und verkrüppelt_.\n\n_+3:_ Wenn zum Tod markierte Gegner 0 LP erreichen, werden sie _verängstigt und verkrüppelt_ und Gegner im Radius von 3 Feldern werden _verkrüppelt_.\n\n_+4:_ Wenn zum Tod markierte Gegner 0 LP erreichen, werden sie _verängstigt und verkrüppelt_ und Gegner im Radius von 3 Feldern werden _verängstigt und verkrüppelt_.
actors.hero.talent.fear_the_reaper.comment=
actors.hero.talent.deathly_durability.title=tödliche Haltbarkeit
actors.hero.talent.deathly_durability.desc=_+1:_ Gegner, die durch Todesmarkierung getötet wurden, geben dem Schurken einen Schild in Höhe von _13%_ ihrer LP, die sie besaßen, als sie markiert wurden.\n\n_+2:_ Gegner, die durch Todesmarkierung getötet wurden geben dem Schurken einen Schild in Höhe von _25%_ ihrer LP, die sie besaßen, als sie markiert wurden.\n\n_+3:_ Gegner, die durch Todesmarkierung getötet wurden geben dem Schurken einen Schild in Höhe von _38%_ ihrer LP, die sie besaßen, als sie markiert wurden.\n\n_+4:_ Gegner, die durch Todesmarkierung getötet wurden geben dem Schurken einen Schild in Höhe von _50%_ ihrer LP, die sie besaßen, als sie markiert wurden.
actors.hero.talent.deathly_durability.comment=
actors.hero.talent.double_mark.title=Doppelmarkierung
actors.hero.talent.double_mark.desc=_+1:_ Das Markieren eines zweiten Ziels zur gleichen Zeit wie das erste hat _30% reduzierte_ Ladekosten.\n\n_+2:_ Das Markieren eines zweiten Ziels zur gleichen Zeit wie das erste hat _50% reduzierte_ Ladekosten.\n\n_+3:_ Das Markieren eines zweiten Ziels zur gleichen Zeit wie das erste hat _65% reduzierte_ Ladekosten.\n\n_+4:_ Das Markieren eines zweiten Ziels zur gleichen Zeit wie das erste hat _75% reduzierte_ Ladekosten.
actors.hero.talent.double_mark.comment=

actors.hero.talent.shadow_blade.title=Schattenklinge
actors.hero.talent.shadow_blade.desc=_+1:_ Der Schattenklon erhält _8%_ des Schadens des Helden pro Zug und hat eine Chance von _25%_, die Verzauberung auf der Waffe des Helden zu verwenden.\n\n_+2:_ Der Schattenklon erhält _16%_ des Schadens des Helden pro Zug und hat eine Chance von _50%_, die Verzauberung auf der Waffe des Helden anzuwenden.\n\n_+3:_ Der Schattenklon erhält _24%_ des Schadens des Helden pro Zug und hat eine Chance von _75%_, die Verzauberung auf der Waffe des Helden anzuwenden.\n\n_+4:_ Der Schattenklon erhält _32%_ des Schadens des Helden pro Zug und hat eine Chance von _100%_, die Verzauberung auf der Waffe des Helden anzuwenden.
actors.hero.talent.shadow_blade.comment=
actors.hero.talent.cloned_armor.title=geklonte Rüstung
actors.hero.talent.cloned_armor.desc=_+1:_ Der Schattenklon erhält _12%_ des Rüstungswerts des Helden und hat eine Chance von _25%_, die Glyphe auf der Rüstung des Helden zu verwenden.\n\n_+2:_ Der Schattenklon erhält _24%_ des Rüstungswerts des Helden und hat eine Chance von _50%_, die Glyphe auf der Rüstung des Helden zu verwenden.\n\n_+3:_ Der Schattenklon erhält _36%_ des Rüstungswerts des Helden und hat eine Chance von _75%_, die Glyphe auf der Rüstung des Helden zu verwenden.\n\n_+4:_ Der Schattenklon erhält _48%_ des Rüstungswerts des Helden und hat eine Chance von _100%_, die Glyphe auf die Rüstung des Helden zu verwenden.
actors.hero.talent.cloned_armor.comment=
actors.hero.talent.perfect_copy.title=perfekte Kopie
actors.hero.talent.perfect_copy.desc=_+1:_ Der Schattenklon erhält _10%_ der maximalen LP des Helden und kann sofort mit dem Helden bis zu _1 Feld_ entfernt die Plätze tauschen.\n\n_+2:_ Der Schattenklon erhält _20%_ der maximalen LP des Helden und kann sofort mit dem Helden bis zu _2 Felder_ entfernt Plätze tauschen.\n\n_+3:_ Der Schattenklon erhält _30%_ der maximalen LP des Helden und kann sofort mit dem Helden bis zu _3 Felder_ entfernt Plätze tauschen.\n\n_+4:_ Der Schattenklon erhält _40%_ der maximalen LP des Helden und kann sofort mit dem Helden bis zu _4 Felder_ entfernt Plätze tauschen.
actors.hero.talent.perfect_copy.comment=

#huntress
actors.hero.talent.natures_bounty.title=Fülle der Natur
actors.hero.talent.natures_bounty.desc=_+1:_ Die Jägerin kann _4 Beeren_ finden, die im hohen Gras versteckt sind, während sie die nächsten Stockwerke des Verlieses erkundet.\n\n_+2:_ Die Jägerin kann _6 Beeren_ finden, die im hohen Gras versteckt sind, während sie die nächsten Stockwerke des Verlieses erkundet.\n\nBeeren werden schnell gegessen, stellen ein wenig Sättigung wieder her und könnten einen verwendbaren Samen enthalten.
actors.hero.talent.natures_bounty.comment=Beeren können schnell gegessen werden, stellen eine kleine Menge Sättigung wieder her und können einen nützlichen Samen hervorbringen.\n\n„Danke für die Gabe der Natur.“
actors.hero.talent.survivalists_intuition.title=Intuition der Überlebenskünstlerin
actors.hero.talent.survivalists_intuition.desc=_+1:_ Die Jägerin identifiziert jede Ausrüstung _1,75 mal schneller_.\n\n_+2:_ Die Jägerin identifiziert jede Ausrüstung _2,5 mal schneller_.
actors.hero.talent.survivalists_intuition.comment=„Zum Überleben musst du diese Ausrüstungsinformationen schnell erfassen.“
actors.hero.talent.followup_strike.title=Anschlusstreffer
actors.hero.talent.followup_strike.desc=_+1:_ Wenn die Jägerin einen Feind mit ihrem Bogen oder einer Wurfwaffe trifft, verursacht ihr nächster Nahkampfangriff gegen diesen Feind _2 Bonusschaden_.\n\n_+2:_ Wenn die Jägerin einen Feind mit ihrem Bogen oder einer Wurfwaffe trifft, verursacht ihr nächster Nahkampfangriff gegen diesen Feind _3 Bonusschaden_.
actors.hero.talent.followup_strike.comment=Schlage verwundete Feinde hart, ohne ihnen Zeit zum Verschnaufen zu geben.
actors.hero.talent.natures_aid.title=Hilfe der Natur
actors.hero.talent.natures_aid.desc=_+1:_ Die Jägerin erhält eine Rindenhaut-Rüstung im Wert von 0-2, die alle _3 Züge_ nachlässt, wenn der Effekt einer Pflanze in ihrem Sichtfeld aktiviert wird.\n\n_+2:_ Die Jägerin erhält eine Rindenhaut-Rüstung im Wert von 0-2, die alle _5 Züge_ nachlässt, wenn der Effekt einer Pflanze in ihrem Sichtfeld aktiviert wird.
actors.hero.talent.natures_aid.comment=„Der Segen der Naturgöttin, wenn auch noch so gering.“

actors.hero.talent.invigorating_meal.title=stärkende Mahlzeit
actors.hero.talent.invigorating_meal.desc=_+1:_ Das Essen von Nahrung benötigt bei der Jägerin 1 Zug (Beeren werden sofort verspeist) und gewährt ihr _1 Zug Eile_.\n\n_+2:_ Das Essen von Nahrung benötigt bei der Jägerin 1 Zug (Beeren werden sofort verspeist) und gewährt ihr _2 Züge Eile_.
actors.hero.talent.invigorating_meal.comment=Die Jägerin ist zwar wendig, aber sie muss satt sein, um schnell zu laufen.
actors.hero.talent.liquid_nature.title=flüssige Natur
actors.hero.talent.liquid_nature.desc=_+1:_ Wenn die Jägerin einen Trank, ein Gebräu oder Elixier trinkt oder wirft, sprießt _Gras auf bis zu 4 Feldern_ in der Umgebung, und benachbarte Feinde werden _1 Zug lang_ verwurzelt.\n\n_+2:_ Wenn die Jägerin einen Trank, ein Gebräu oder Elixier trinkt oder wirft, sprießt _Gras auf bis zu 6 Feldern_ in der Umgebung, und benachbarte Feinde werden _2 Züge lang_ verwurzelt.\n\nDie Menge des Grases und die Dauer der Verwurzelung verdoppeln sich, wenn ein Trank der Stärke, der Erfahrung, oder alchemische Gegenstände, die aus diesen gewonnen wurden, verwendet werden.\n\nBei alchemischen Gegenständen mit größerer Ausgabemenge (z.B. Aqua-Gebräu) kann dieses Talent abhängig davon, wieviel dieses Gegenstands hergestellt wurde, ausgelöst werden.
actors.hero.talent.liquid_nature.comment=Bei Verwendung von Stärke-, Erfahrungstränken oder daraus hergestellten alchemistischen Gegenständen verdoppeln sich das Wachstum von hohem Gras und die Dauer der Ummantelung.\n\nBei ergiebigen alchemistischen Gegenständen (wie Wasserexplosionstränken) basiert die Auslösung auf der hergestellten Menge.\n\nDie Jägerin kann die Kräuterbestandteile in Tränken wiederverwerten und so regenerative Kräfte entfesseln.
actors.hero.talent.rejuvenating_steps.title=Schritte der Verjüngung
actors.hero.talent.rejuvenating_steps.desc=_+1:_ Wenn die Jägerin auf kurzes Gras oder Asche tritt, sprießt hohes Gras, das die Jägerin sofort zerfurcht. Dies hat eine Abklingzeit von _10 Zügen_.\n\n_+2:_ Wenn die Jägerin auf kurzes Gras oder Asche tritt, sprießt hohes Gras, das die Jägerin sofort zerfurcht. Dies hat eine Abklingzeit von _5 Zügen_.\n\nDieses Talent erzeugt zerfurchtes Gras, wenn passive Regenerationseffekte deaktiviert sind oder der Held längere Zeit keine Erfahrung gesammelt hat.
actors.hero.talent.rejuvenating_steps.comment=Wenn die passive Regeneration deaktiviert ist oder der Held lange Zeit keine Erfahrung erhält, bringt dieses Talent nur vertrocknetes Gras hervor.\n\n„Wo immer er hintritt, sprießt alles Leben.“
actors.hero.talent.heightened_senses.title=geschärfte Sinne
actors.hero.talent.heightened_senses.desc=_+1:_ Die Jägerin erlangt übersinnliche Wahrnehmung gegen einen Feind, der bis zu _2 Felder von ihr entfernt_ steht.\n\n_+2:_ Die Jägerin erlangt übersinnliche Wahrnehmung gegen einen Feind, der bis zu _3 Felder von ihr entfernt_ steht.
actors.hero.talent.heightened_senses.comment=Die Intuition der Jägerin.
actors.hero.talent.durable_projectiles.title=haltbare Wurfgeschosse
actors.hero.talent.durable_projectiles.desc=_+1:_ Von der Jägerin verwendete Wurfwaffen haben _+50% Haltbarkeit_.\n\n_+2:_ Von der Jägerin verwendete Wurfwaffen haben _+75% Haltbarkeit_.
actors.hero.talent.durable_projectiles.comment=Eine gute Jägerin sollte ihre Waffen zu pflegen wissen.

actors.hero.talent.point_blank.title=aus nächster Nähe
actors.hero.talent.point_blank.desc=_+1:_ Wenn die Jägerin ihren Bogen oder eine Wurfwaffe im Nahkampf verwendet, hat sie _-30% Genauigkeit,_ statt -50%.\n\n_+2:_ Wenn die Jägerin ihren Bogen oder eine Wurfwaffe im Nahkampf verwendet, hat sie _-10% Genauigkeit,_ statt -50%.\n\n_+3:_ Wenn die Jägerin ihren Bogen oder eine Wurfwaffe im Nahkampf verwendet, hat sie _+10% Genauigkeit,_ statt -50%.\n\nBeachte, dass Wurfwaffen oder der Seelenbogen immer +50% Genauigkeit haben, wenn sie aus der Ferne verwendet werden.
actors.hero.talent.point_blank.comment=Hinweis: Bei Wurfwaffen oder dem Seelenbogen außerhalb von Nahkampfdistanz gibt es immer einen 50%igen Genauigkeitsbonus.
actors.hero.talent.seer_shot.title=Schuss der klaren Sicht
actors.hero.talent.seer_shot.desc=_+1:_ Wenn die Jägerin einen Pfeil auf den Boden abfeuert, gewährt er ihr _5 Züge lang_ Sicht in einem Bereich von 3x3 Feldern um diese Stelle herum. Dies hat eine Abklingzeit von 20 Zügen.\n\n_+2:_ Wenn die Jägerin einen Pfeil auf den Boden abfeuert, gewährt er ihr _10 Züge lang_ Sicht in einem Bereich von 3x3 Feldern um diese Stelle herum. Dies hat eine Abklingzeit von 20 Zügen.\n\n_+3:_ Wenn die Jägerin einen Pfeil auf den Boden abfeuert, gewährt er ihr _15 Züge lang_ Sicht in einem Bereich von 3x3 Feldern um diese Stelle herum. Dies hat eine Abklingzeit von 20 Zügen.
actors.hero.talent.seer_shot.comment=Dieses Talent _hat 20 Runden Abklingzeit_.
actors.hero.talent.seer_shot.meta_desc=_Wenn dieses Talent durch einen anderen Helden erworben wird_, wird es von einer beliebigen Wurfwaffe ausgelöst.

actors.hero.talent.farsight.title=Weitsicht
actors.hero.talent.farsight.desc=_+1:_ Die Sichtweite der Scharfschützin wird _um 25% erhöht_.\n\n_+2:_ Die Sichtweite der Scharfschützin wird _um 50% erhöht_.\n\n_+3:_ Die Sichtweite der Scharfschützin wird _um 75% erhöht_.
actors.hero.talent.farsight.comment=
actors.hero.talent.shared_enchantment.title=geteilte Verzauberung
actors.hero.talent.shared_enchantment.desc=_+1:_ Wurfwaffen haben eine _33% Chance_, die Verzauberung des Scharfschützenbogens zu verwenden.\n\n_+2:_ Wurfwaffen haben eine _67% Chance_, die Verzauberung des Scharfschützenbogens zu verwenden.\n\n_+3:_ Wurfwaffen haben eine _100% Chance_, die Verzauberung des Scharfschützenbogens zu verwenden.\n\nDieses Talent gilt nicht für Pfeile, die aus einer verzauberten Armbrust geschossen werden, denn diese lösen bereits die Verzauberung der Armbrust aus.
actors.hero.talent.shared_enchantment.comment=Unabhängig von der Verzauberung der Wurfwaffe wird die Verzauberung des Seelenbogens normal ausgelöst.
actors.hero.talent.shared_upgrades.title=geteilte Verbesserungen
#fix9：感觉很多人看不懂这个天赋，决定对其增加高亮标记以及注释
actors.hero.talent.shared_upgrades.desc=_+1:_ Wenn die Scharfschützin mit einer verbesserten Wurfwaffe angreift, erhöht jede Verbesserung die Dauer der Scharfschützenmarkierung um 1 Zug und den Schaden ihres Spezialangriffs um _10%_.\n\n_+2:_ Wenn die Scharfschützin mit einer verbesserten Wurfwaffe angreift, erhöht jede Verbesserung die Dauer der Scharfschützenmarkierung um 1 Zug und den Schaden ihres Spezialangriffs um _20%_.\n\n_+3:_ Wenn die Scharfschützin mit einer verbesserten Wurfwaffe angreift, erhöht jede Verbesserung die Dauer der Scharfschützenmarkierung um 1 Zug und den Schaden ihres Spezialangriffs um _30%_.
actors.hero.talent.shared_upgrades.comment=Der Effekt des Scharfschützenrings lässt alle Wurfwaffen Schaden entsprechend ihrer Stufe verursachen, was nicht als _aufgewertete_ Wurfwaffen zählt. Daher hat der Bonus des Rings keine Wechselwirkung mit diesem Talent.

actors.hero.talent.durable_tips.title=langlebige Spitzen
actors.hero.talent.durable_tips.desc=_+1:_ Präparierte Pfeile haben _2x Haltbarkeit_, wenn die Wächterin sie verwendet.\n\n_+2:_ Präparierte Pfeile haben _3x Haltbarkeit_, wenn die Wächterin sie verwendet.\n\n_+3:_ Präparierte Pfeile haben _4x Haltbarkeit_, wenn die Wächterin sie verwendet.
actors.hero.talent.durable_tips.comment=
actors.hero.talent.barkskin.title=Rindenhaut
actors.hero.talent.barkskin.desc=_+1:_ Wenn die Wächterin ins Gras tritt, erhält sie Rindenhaut in Höhe von _0-50% ihrer Stufe_, die mit jedem Zug nachlässt.\n\n_+2:_ Wenn die Wächterin ins Gras tritt, erhält sie Rindenhaut in Höhe von _0-100% ihrer Stufe_, die mit jedem Zug nachlässt.\n\n_+3:_ Wenn die Wächterin ins Gras tritt, erhält sie Rindenhaut in Höhe von _0-150% ihrer Stufe_, die mit jedem Zug nachlässt.
actors.hero.talent.barkskin.comment=
actors.hero.talent.shielding_dew.title=Abschirmtau
actors.hero.talent.shielding_dew.desc=_+1:_ Tautropfen können die Wächterin schützen, wenn ihre Gesundheit voll ist, bis zu _20% ihrer maximalen LP_.\n\n_+2:_ Tautropfen können die Wächterin schützen, wenn ihre Gesundheit voll ist, bis zu _40% ihrer maximalen LP_.\n\n_+3:_ Tautropfen können die Wächterin schützen, wenn ihre Gesundheit voll ist, bis zu _60% ihrer maximalen LP_.
actors.hero.talent.shielding_dew.comment=

actors.hero.talent.fan_of_blades.title=Fächer der Klingen
actors.hero.talent.fan_of_blades.desc=_+1:_ Spektralklingen können bis zu _1 zusätzliches Ziel_ mit 50% Schaden treffen. Das Ziel muss sichtbar sein und sich innerhalb eines kegelförmigen Bereichs von _30 Grad_ befinden.\n\n_+2:_ Spektralklingen können bis zu _2 zusätzliche Ziele_ mit 50% Schaden treffen. Die Ziele müssen sichtbar sein und sich innerhalb eines kegelförmigen Bereichs von _60 Grad_ befinden.\n\n_+3:_ Spektralklingen können bis zu _3 zusätzliche Ziele_ mit 50% Schaden treffen. Die Ziele müssen sichtbar sein und sich innerhalb eines kegelförmigen Bereichs von _90 Grad_ befinden.\n\n_+4:_ Spektralklingen können bis zu _4 zusätzliche Ziele_ mit 50% Schaden treffen. Die Ziele müssen sichtbar sein und sich innerhalb eines kegelförmigen Bereichs von _120 Grad_ befinden.
actors.hero.talent.fan_of_blades.comment=
actors.hero.talent.projecting_blades.title=projizierende Klingen
actors.hero.talent.projecting_blades.desc=_+1:_ Spektralklingen haben _+25% Genauigkeit_ und können bis zu _2 feste Felder_ durchdringen.\n\n_+2:_ Spektralklingen haben _+50% Genauigkeit_ und können bis zu _4 feste Felder_ durchdringen.\n\n_+3:_ Spektralklingen haben _+75% Genauigkeit_ und können bis zu _6 feste Felder_ durchdringen.\n\n_+4:_ Spektralklingen haben _+100% Genauigkeit_ und können bis zu _8 feste Felder_ durchdringen.
actors.hero.talent.projecting_blades.comment=
actors.hero.talent.spirit_blades.title=Geisterklingen
actors.hero.talent.spirit_blades.desc=_+1:_ Spektralklingen haben eine Chance von _30%_, die Verzauberung auch auf den Geisterbogen anzuwenden.\n\n_+2:_ Spektralklingen haben eine Chance von _60%_, die Verzauberung auch auf den Geisterbogen anzuwenden.\n\n_+3:_ Spektralklingen haben eine Chance von _90%_, die Verzauberung auch auf den Geisterbogen anzuwenden.\n\n_+4:_ Spektralklingen haben eine Chance von _100%_, die Verzauberung auch auf den Geisterbogen anzuwenden, und verleiht jeder Verzauberung _10% mehr Kraft_.
actors.hero.talent.spirit_blades.comment=

actors.hero.talent.growing_power.title=wachsende Kraft
actors.hero.talent.growing_power.desc=_+1:_ Die Erhöhung der Angriffs- und Bewegungsgeschwindigkeit durch die Kraft der Natur beträgt statt je 33% und 100% nun _38% und 125%_.\n\n_+2:_ Die Erhöhung der Angriffs- und Bewegungsgeschwindigkeit durch die Kraft der Natur beträgt statt je 33% und 100% nun _42% und 150%_.\n\n_+3:_ Die Erhöhung der Angriffs- und Bewegungsgeschwindigkeit durch die Kraft der Natur beträgt statt je 33% und 100% nun _46% und 175%_.\n\n_+4:_ Die Erhöhung der Angriffs- und Bewegungsgeschwindigkeit durch die Kraft der Natur beträgt statt je 33% und 100% nun _50% und 200%_.
actors.hero.talent.growing_power.comment=
actors.hero.talent.natures_wrath.title=Zorn der Natur
actors.hero.talent.natures_wrath.desc=_+1:_ Solange die Naturkraft aktiv ist, haben Schüsse aus dem Geisterbogen eine Chance von _8%_, einen zufälligen schädlichen Pflanzeneffekt auszulösen.\n\n_+2:_ Solange die Naturkraft aktiv ist, haben Schüsse aus dem Geisterbogen eine Chance von _17%_, einen zufälligen schädlichen Pflanzeneffekt auszulösen.\n\n_+3:_ Solange die Naturkraft aktiv ist, haben Schüsse aus dem Geisterbogen eine _25% Chance_, einen zufälligen schädlichen Pflanzeneffekt auszulösen.\n\n_+4:_ Solange die Naturkraft aktiv ist, haben Schüsse aus dem Geisterbogen eine _33% Chance_, einen zufälligen schädlichen Pflanzeneffekt auszulösen.\n\nDie Pflanzen, deren Effekte ausgelöst werden können, sind: Blindkraut, Feuerblüte, Eiskappe, Trauermoos und Sturmranke.
actors.hero.talent.natures_wrath.comment=Mögliche Pflanzen: Blindkraut, Flammenkraut, Eiskronenkraut, Würgepflanze, Sturmranke.
actors.hero.talent.wild_momentum.title=wilder Schwung
actors.hero.talent.wild_momentum.desc=_+1:_ Das Töten eines Feindes mit dem Geisterbogen verlängert die Wirkungsdauer der Naturkraft um _1 Zug_. Die Dauer kann um maximal _2 Züge_ verlängert werden.\n\n_+2:_ Das Töten eines Feindes mit dem Geisterbogen verlängert die Wirkungsdauer der Naturkraft um _2 Züge_. Die Dauer kann um max. _4 Züge_ verlängert werden.\n\n_+3:_ Das Töten eines Feindes mit dem Geisterbogen verlängert die Wirkungsdauer der Naturkraft um _3 Züge_. Die Dauer kann um maximal _6 Züge_ verlängert werden.\n\n_+4:_ Das Töten eines Feindes mit dem Geisterbogen verlängert die Wirkungsdauer der Naturkraft um _4 Züge_. Die Dauer kann um maximal _8 Züge_ verlängert werden.
actors.hero.talent.wild_momentum.comment=

actors.hero.talent.eagle_eye.title=Adlerauge
actors.hero.talent.eagle_eye.desc=_+1:_ Die Sichtweite des Geisterfalken wird von 6 auf _7 Felder_ erhöht.\n\n_+2:_ Die Sichtweite des Geisterfalken wird von 6 auf _8 Felder_ erhöht.\n\n_+3:_ Die Sichtweite des Geisterfalken wird von 6 auf _9 Felder_ erhöht und er erhält _2 Felder_ Gedankensicht.\n\n_+4:_ Die Sichtweite des Geisterfalken wird von 6 auf _10 Felder_ erhöht und er erhält _3 Felder_ Gedankensicht.
actors.hero.talent.eagle_eye.comment=
actors.hero.talent.go_for_the_eyes.title=hol dir die Augen
actors.hero.talent.go_for_the_eyes.desc=_+1:_ Angriffe des Geisterfalken blenden Feinde _2 Züge lang_.\n\n_+2:_ Angriffe des Geisterfalken blenden Gegner _5 Züge lang_.\n\n_+3:_ Angriffe des Geisterfalken blenden Gegner _5 Züge lang_ und verkrüppeln ihn für _2 Züge_.\n\n_+4:_ Angriffe des Geisterfalken blenden Gegner _5 Züge lang_ und verkrüppeln ihn für _5 Züge_.
actors.hero.talent.go_for_the_eyes.comment=
actors.hero.talent.swift_spirit.title=flinker Geist
actors.hero.talent.swift_spirit.desc=_+1:_ Die Bewegungsgeschwindigkeit des Geisterfalken wird von 2 auf _2,5 Felder_ erhöht, und er weicht garantiert den ersten _2 Angriffen_ aus, die gegen ihn geführt werden.\n\n_+2:_ Die Bewegungsgeschwindigkeit des Geisterfalken wird von 2 auf _3 Felder_ erhöht und er weicht garantiert den ersten _4 Angriffen_ aus, die gegen ihn geführt werden.\n\n_+3:_ Die Bewegungsgeschwindigkeit des Geisterfalken wird von 2 auf _3,5 Felder_ erhöht und er weicht garantiert den ersten _6 Angriffen_ aus, die gegen ihn geführt werden.\n\n_+4:_ Die Bewegungsgeschwindigkeit des Geisterfalken wird von 2 auf _4 Felder_ erhöht und er weicht garantiert den ersten _8 Angriffen_ aus, die gegen ihn geführt werden.
actors.hero.talent.swift_spirit.comment=

#duelist
actors.hero.talent.strengthening_meal.title=kräftigende Mahlzeit
actors.hero.talent.strengthening_meal.desc=_+1:_ Das Essen von Nahrung gewährt der Zweikämpferin beim nächsten _2 Mal_, wenn sie einen Gegner mit einem physischen Angriff trifft, 3 Bonusschaden.\n\n_+2:_ Das Essen von Nahrung gewährt der Zweikämpferin 3 Bonusschaden, wenn sie das nächste Mal _3 Mal_ einen Gegner mit einem physischen Angriff trifft.
actors.hero.talent.strengthening_meal.comment=„Nur mit vollem Magen kann man kämpfen.“
actors.hero.talent.adventurers_intuition.title=Intuition des Abenteurers
actors.hero.talent.adventurers_intuition.desc=_+1:_ Die Zweikämpferin identifiziert Waffen _2,5x schneller_ und Rüstungen _1,75x schneller_.\n\n_+2:_ Die Zweikämpferin identifiziert Waffen _sobald sie diese ausrüstet_ und Rüstungen _2,5x schneller_.
actors.hero.talent.adventurers_intuition.comment=„Alle Waffen und Rüstungen, alle meisterhaft beherrscht."
actors.hero.talent.patient_strike.title=geduldiger Schlag
actors.hero.talent.patient_strike.desc=_+1:_ Wenn die Zweikämpferin wartet, bevor sie einen Nahkampfangriff ausführt, wird sie damit _1-2 Punkte Bonus-Schaden_ zufügen.\n\n_+2:_ Wenn die Zweikämpferin wartet, bevor sie einen Nahkampfangriff ausführt, wird sie damit _2 Punkte Bonus-Schaden_ zufügen.
actors.hero.talent.patient_strike.comment=„Senke die Energie ins Dantian, die Faust wie ein fliegender Drache.“
actors.hero.talent.aggressive_barrier.title=aggressive Barriere
actors.hero.talent.aggressive_barrier.desc=_+1:_ Die Zweikämpferin erhält _3 Schildpunkte_, wenn sie eine Waffenfähigkeit einsetzt und weniger als _50% Lebenspunkte_ hat.\n\n_+2:_ Die Zweikämpferin erhält _5 Schildpunkte_, wenn sie eine Waffenfähigkeit einsetzt und weniger als _50% Lebenspunkte_ hat.
actors.hero.talent.aggressive_barrier.comment=„Dies ist die Kraft, die ein in die Enge getriebener Krieger entfesseln kann."
actors.hero.talent.aggressive_barrier.meta_desc=_Wenn dieses Talent durch einen anderen Helden gewonnen wird_, verleiht es stattdessen eine Abschirmung bei Nahkampfangriffen mit niedrigen Lebenspunkten, mit einer Abklingzeit von 50 Zügen.

actors.hero.talent.focused_meal.title=fokussierte Mahlzeit
actors.hero.talent.focused_meal.desc=_+1:_ Das Essen von Nahrung dauert für die Zweikämpferin 1 Zug und gewährt ihr _0,67 Ladung_ auf ihre Waffen.\n\n_+2:_ Das Essen von Nahrung dauert für die Zweikämpferin 1 Zug und gewährt ihr _1 Ladung_ auf ihre Waffen.
actors.hero.talent.focused_meal.comment=Selbst mit hundert Kampfkünsten darf das Essen nicht fehlen.
actors.hero.talent.focused_meal.meta_desc=_Wenn dieses Talent von einem anderen Helden erlangt wird,_ verleiht es stattdessen dem nächsten Treffer Bonusschaden in Höhe seiner Stufe/3 bei +1 oder Stufe/2 bei +2.
actors.hero.talent.liquid_agility.title=flüssige Wendigkeit
actors.hero.talent.liquid_agility.desc=_+1:_ Beim Trinken oder Werfen eines Tranks, Gebräus oder Elixiers hat die Zweikämpferin _3x Ausweichfähigkeit_ und _3x Genauigkeit_ bei ihrem nächsten Nahkampfangriff innerhalb von 5 Runden.\n\n_+2:_ Beim Trinken oder Werfen eines Tranks, Gebräus oder Elixiers hat die Zweikämpferin _unendliche Ausweichfähigkeit_ und _unendliche Genauigkeit_ bei ihrem nächsten Nahkampfangriff innerhalb von 5 Runden.\n\nDieser Bonus hält eine zusätzliche Runde und einen zusätzlichen Angriff an, wenn Tränke der Stärke, Erfahrung oder alchemistische Gegenstände verwendet werden, die mit diesen Tränken hergestellt werden müssen.\n\nBei alchemistischen Gegenständen mit höheren Produktionsmengen (z. B. Aquagebräu) besteht eine Chance, dass dieses Talent ausgelöst wird, je nachdem, wie viele von diesem Gegenstand hergestellt werden.
actors.hero.talent.liquid_agility.comment=Bei Verwendung von Stärke-, Erfahrungstränken oder daraus hergestellten alchemistischen Gegenständen hält der Ausweichbonus eine Runde länger und der Genauigkeitsbonus einen Angriff länger.\n\nBei ergiebigen alchemistischen Gegenständen (wie Wasserexplosionstränken) basiert die Auslösung auf der Stückzahl pro Herstellung.\n\nDas verdanken wir dem geringen Alkoholgehalt der Tränke und der Tatsache, dass die Duellantin einst betrunkenes Boxen lernte.
actors.hero.talent.weapon_recharging.title=Waffenaufladung
actors.hero.talent.weapon_recharging.desc=_+1:_ Die Zweikämpferin erhält aller _15 Züge_ eine Waffenladung, solange ein Waffen- oder Artefakt-Aufladungseffekt anhält.\n\n_+2:_ Die Zweikämpferin erhält aller _10 Züge_ eine Waffenladung, solange ein Waffen- oder Artefakt-Aufladungseffekt anhält.
actors.hero.talent.weapon_recharging.comment=„Magie kann auch Teil der Kampfkunst sein.“
actors.hero.talent.weapon_recharging.meta_desc=_Wenn dieses Talent durch einen anderen Helden gewonnen wird_, führt es dazu, dass er beim Aufladen +5% Nahkampfschaden bei +1 verursacht, oder +7,5% Nahkampfschaden bei +2.
actors.hero.talent.lethal_haste.title=letale Eile
actors.hero.talent.lethal_haste.desc=_+1:_ Trifft die Zweikämpferin einen Feind mit einer Waffenfähigkeit und landet einen tödlichen Schlag, erhält sie _3 Runden_ sofortige Eile. \n\n_+2:_ Trifft die Zweikämpferin einen Feind mit einer Waffenfähigkeit und landet einen tödlichen Schlag, erhält sie _5 Runden_ sofortige Eile.
actors.hero.talent.lethal_haste.comment=Entschuldigung, kurz durch.
actors.hero.talent.lethal_haste.meta_desc=_Wenn dieses Talent durch einen anderen Helden gewonnen wird_, wird es stattdessen durch reguläre Angriffe mit Waffen ausgelöst, mit einer Abklingzeit von 100 Zügen.
actors.hero.talent.swift_equip.title=rasches Ausrüsten
actors.hero.talent.swift_equip.desc=_+1:_ Die Zweikämpferin kann ihre ausgerüstete Waffe _einmal_ alle 20 Runden sofort umrüsten.\n\n_+2:_ Die Zweikämpferin kann ihre ausgerüstete Waffe _zweimal_ alle 20 Runden sofort umrüsten.\n\nWenn die Zweikämpferin über dieses Talent verfügt und es sich nicht in der Abklingzeit befindet, wird die Schnellnutzung eine nicht ausgerüstete Waffe diese ausrüsten.
actors.hero.talent.swift_equip.comment=Nicht ausgerüstete Waffen können in die Schnellleiste gelegt werden. Ist diese Fertigkeit nicht abklingend, wird die Waffe beim Klicken sofort ausgerüstet.\n\n„Übung macht den Meister.“

actors.hero.talent.precise_assault.title=präziser Angriff
actors.hero.talent.precise_assault.desc=_+1:_ Wenn die Zweikämpferin eine Waffenfähigkeit einsetzt, erhält sie innerhalb von 5 Runden _zweifache Genauigkeit_ bei ihrem nächsten Nahkampfangriff.\n\n_+2:_ Wenn die Zweikämpferin eine Waffenfähigkeit einsetzt, erhält sie innerhalb von 5 Runden _fünffache Genauigkeit_ bei ihrem nächsten Nahkampfangriff.\n\n_+3:_ Wenn die Zweikämpferin eine Waffenfähigkeit einsetzt, erhält sie innerhalb von 5 Runden _unendliche Genauigkeit_ bei ihrem nächsten Nahkampfangriff.
actors.hero.talent.precise_assault.comment=
actors.hero.talent.precise_assault.meta_desc=_Wenn dieses Talent von einem anderen Helden erlangt wird,_ erhöht es stattdessen die Nahkampfgenauigkeit um 10 % bei +1, 20 % bei +2 oder 30 % bei +3.
actors.hero.talent.deadly_followup.title=tödliches Nachtreten
actors.hero.talent.deadly_followup.desc=_+1:_ Wenn die Zweikämpferin einen Gegner mit einer Wurfwaffe trifft, fügt sie ihm 5 Runden lang _10 % mehr Nahkampfschaden_ zu.\n\n_+2:_ Wenn die Zweikämpferin einen Gegner mit einer Wurfwaffe trifft, fügt sie ihm 5 Runden lang _20 % mehr Nahkampfschaden_ zu.\n\n_+3:_ Wenn die Zweikämpferin einen Gegner mit einer Wurfwaffe trifft, fügt sie ihm 5 Runden lang _30 % mehr Nahkampfschaden_ zu.
actors.hero.talent.deadly_followup.comment=

actors.hero.talent.varied_charge.title=gewechselte Ladung
actors.hero.talent.varied_charge.desc=_+1:_ Die Meisterin erhält sofort _0,17 Waffenaufladungen_, wenn sie zwei verschiedene Waffenfähigkeiten nutzt, ohne Zeitlimit.\n\n_+2:_ Die Meisterin erhält sofort _0,33 Waffenaufladungen_, wenn sie zwei verschiedene Waffenfähigkeiten nutzt, ohne Zeitlimit.\n\n_+3:_ Die Meisterin erhält sofort _0,5 Waffenaufladungen_, wenn sie zwei verschiedene Waffenfähigkeiten nutzt, ohne Zeitlimit.
actors.hero.talent.varied_charge.comment=
actors.hero.talent.twin_upgrades.title=Zwillings-Verbesserungen
actors.hero.talent.twin_upgrades.desc=_+1:_ Ist eine der beiden ausgerüsteten Waffen der Meisterin auf einer niedrigeren Stufe und _2 oder mehr Ränge niedriger_ als die andere, wird sie auf die Stufe der anderen Waffe verbessert.\n\n_+2:_ Ist eine der beiden ausgerüsteten Waffen der Meisterin auf einer niedrigeren Stufe und _1 oder mehr Ränge niedriger_ als die andere, wird sie auf die Stufe der anderen Waffe verbessert.\n\n_+3:_ Ist eine der beiden ausgerüsteten Waffen der Meisterin auf einer niedrigeren Stufe und _auf dem gleichen oder einem niedrigeren Rang_ wie die andere, wird sie auf die Stufe der anderen Waffe verbessert.
actors.hero.talent.twin_upgrades.comment=
actors.hero.talent.combined_lethality.title=kombinierte Letalität
actors.hero.talent.combined_lethality.desc=_+1:_ Nutzt die Meisterin zwei verschiedene Waffenfähigkeiten in Folge, so wird die zweite Fähigkeit jeden Gegner, der kein Boss ist, töten, sofern er _weniger als 13% seiner maximalen Lebenspunkte_ hat.\n\n_+2:_ Nutzt die Meisterin zwei verschiedene Waffenfähigkeiten in Folge, so wird die zweite Fähigkeit jeden Gegner, der kein Boss ist, töten, sofern er _weniger als 27% seiner maximalen Lebenspunkte_ hat.\n\n_+3:_ Nutzt die Meisterin zwei verschiedene Waffenfähigkeiten in Folge, so wird die zweite Fähigkeit jeden Gegner, der kein Boss ist, töten, sofern er _weniger als 40% seiner maximalen Lebenspunkte_ hat.\n\nSollte die zweite Fähigkeit keinen Angriff beinhalten, wird dieses Talent stattdessen innerhalb von 5 Zügen beim nächsten Angriff der Meisterin ausgelöst.
actors.hero.talent.combined_lethality.comment=Dieser Angriff kann ein normaler Nahkampfwaffenangriff oder Teil einer Kampftechnik sein.

actors.hero.talent.unencumbered_spirit.title=Unbeschwerter Geist
actors.hero.talent.unencumbered_spirit.desc=_+1:_ Die Nonne erhält _50% mehr Energie_ für jedes Ausrüstungsteil _der Klasse 3 oder niedriger_, das sie verwendet.\n\n_+2:_ Die Nonne erhält _75% mehr Energie_ für jedes Ausrüstungsteil _der Klasse 2 oder niedriger_, das sie verwendet.\n\n_+3:_ Die Nonne erhält _100% mehr Energie_ für jedes Ausrüstungsteil _der Klasse 1_, das sie verwendet. Sie erhält außerdem eine Stoffrüstung und Kampfhandschuhe.\n\nDas Talent gewährt keinen Bonus, wenn sie keine Waffe trägt oder mit einem Ring der Kraft angreift.
actors.hero.talent.unencumbered_spirit.comment=Hinweis: Diese Fertigkeit bringt keinen Nutzen, wenn du unbewaffnet kämpfst oder den Ring der Stärke benutzt.
actors.hero.talent.monastic_vigor.title=klösterliche Lebenskraft
actors.hero.talent.monastic_vigor.desc=_+1:_ Wenn die Nonne _100% Energie_ hat, sind ihre Fähigkeiten verstärkt.\n\n_+2:_ Wenn die Nonne _80% oder mehr Energie_ hat, sind ihre Fähigkeiten verstärkt.\n\n_+3:_ Wenn die Nonne _60% oder mehr Energie_ hat, sind ihre Fähigkeiten verstärkt.\n\nWenn die Fähigkeiten verstärkt sind:\n-  Hastige Hiebe verwenden Waffenverzauberungen\n- Konzentration passiert augenblicklich\n- Sprint erhält +4 Reichweite\n- Drachentritt fügt +50% Schaden zu, schleudert alle benachbarten Feinde zurück und paralysiert sie.\n- Meditation gewährt 80% Schadensresistenz und heilt langsam 20% der fehlenden Lebenspunkte.
actors.hero.talent.monastic_vigor.comment=Im Durchbruchszustand:\n-Leerschwünge verwenden deine Waffenverzauberung.\n-Konzentration verbraucht keine Runde.\n-Sprungwolke Sprintdistanz +4.\n-Schlängeldrache verursacht +50% Schaden, kann alle benachbarten Gegner zurückstoßen und betäuben.\n-Meditation regeneriert langsam 20% der verlorenen Lebenspunkte und gewährt 80% Schadensresistenz.
actors.hero.talent.combined_energy.title=kombinierte Energie
actors.hero.talent.combined_energy.desc=_+1:_ Wenn die Nonne innerhalb von 5 Runden eine Waffenfähigkeit und eine Fähigkeit mit _4+ Energie_ einsetzt, erhält sie 1 verbrauchte Energie zurück.\n\n_+2:_ Wenn die Nonne innerhalb von 5 Runden eine Waffenfähigkeit und eine Fähigkeit mit _3+ Energie_ einsetzt, erhält sie 1 verbrauchte Energie zurück.\n\n_+3:_ Wenn die Nonne innerhalb von 5 Runden eine Waffenfähigkeit und eine Fähigkeit mit _2+ Energie_ einsetzt, erhält sie 1 verbrauchte Energie zurück.
actors.hero.talent.combined_energy.comment=

actors.hero.talent.close_the_gap.title=Lückenschluss
actors.hero.talent.close_the_gap.desc=_+1:_ Die Zweikämpferin teleportiert _bis zu zwei Felder weit_ in Richtung ihres Ziels, wenn sie ein Duell beginnt.\n\n_+2:_ Die Zweikämpferin teleportiert _bis zu drei Felder weit_ in Richtung ihres Ziels, wenn sie ein Duell beginnt.\n\n_+3:_ Die Zweikämpferin teleportiert _bis zu vier Felder weit_ in Richtung ihres Ziels, wenn sie ein Duell beginnt.\n\n_+4:_ Die Zweikämpferin teleportiert _bis zu fünf Felder weit_ in Richtung ihres Ziels, wenn sie ein Duell beginnt.\n\nDie Teleportation kann durch Gefahren und Gegner gehen, aber nicht durch festes Gelände wie Mauern. Die Teleportation wird berücksichtigt, wenn bestimmt wird, ob ein Gegner für eine Herausforderung innerhalb der Reichweite ist.
actors.hero.talent.close_the_gap.comment=Dieser Blitz kann über gefährliches Terrain oder Feinde hinwegfegen, aber nicht durch feste Wände. Die Blitzdistanz wird auch für die Duell-Eröffnungsdistanz berücksichtigt.
actors.hero.talent.invigorating_victory.title=erfrischender Sieg
actors.hero.talent.invigorating_victory.desc=_+1:_ Wenn die Zweikämpferin ihr Ziel besiegt, bevor das Duell beendet ist, wird sie um _5 LP plus 30% des Schadens_, den sie beim Duell eingesteckt hat, geheilt.\n\n_+2:_ Wenn die Zweikämpferin ihr Ziel besiegt, bevor das Duell beendet ist, wird sie um _10 LP plus 50% des Schadens_, den sie beim Duell eingesteckt hat, geheilt.\n\n_+3:_ Wenn die Zweikämpferin ihr Ziel besiegt, bevor das Duell beendet ist, wird sie um _15 LP plus 65% des Schadens_, den sie beim Duell eingesteckt hat, geheilt.\n\n_+4:_ Wenn die Zweikämpferin ihr Ziel besiegt, bevor das Duell beendet ist, wird sie um _20 LP plus 75% des Schadens_, den sie beim Duell eingesteckt hat, geheilt.
actors.hero.talent.invigorating_victory.comment=
actors.hero.talent.elimination_match.title=K.o.-Runde
actors.hero.talent.elimination_match.desc=_+1:_ Wenn die Zweikämpferin innerhalb von 3 Zügen nach Abschluss eines Duells wieder zu einem Duell herausfordert, so hat die neue Herausforderung _16% weniger_ Ladungskosten.\n\n_+2:_ Wenn die Zweikämpferin innerhalb von 3 Zügen nach Abschluss eines Duells wieder zu einem Duell herausfordert, so hat die neue Herausforderung _30% weniger_ Ladungskosten.\n\n_+3:_ Wenn die Zweikämpferin innerhalb von 3 Zügen nach Abschluss eines Duells wieder zu einem Duell herausfordert, so hat die neue Herausforderung _40% weniger_ Ladungskosten.\n\n_+4:_ Wenn die Zweikämpferin innerhalb von 3 Zügen nach Abschluss eines Duells wieder zu einem Duell herausfordert, so hat die neue Herausforderung _50% weniger_ Ladungskosten.
actors.hero.talent.elimination_match.comment=

actors.hero.talent.elemental_reach.title=elementare Reichweite
actors.hero.talent.elemental_reach.desc=_+1:_ Die Reichweite des Elementarschlags ist von 4 auf _5 Felder_ erhöht, sein Winkel von 65 auf _75 Grad_ erweitert.\n\n_+2:_ Die Reichweite des Elementarschlags ist von 4 auf _6 Felder_ erhöht, sein Winkel von 65 auf _85 Grad_ erweitert.\n\n_+3:_ Die Reichweite des Elementarschlags ist von 4 auf _7 Felder_ erhöht, sein Winkel von 65 auf _95 Grad_ erweitert.\n\n_+4:_ Die Reichweite des Elementarschlags ist von 4 auf _8 Felder_ erhöht, sein Winkel von 65 auf _105 Grad_ erweitert.
actors.hero.talent.elemental_reach.comment=
actors.hero.talent.striking_force.title=Schlagkraft
actors.hero.talent.striking_force.desc=_+1:_ Die Wirkung eines Elementarschlagst ist um _30%_ erhöht.\n\n_+2:_ Die Wirkung eines Elementarschlagst ist um _60%_ erhöht.\n\n_+3:_ Die Wirkung eines Elementarschlagst ist um _90%_ erhöht.\n\n_+4:_ Die Wirkung eines Elementarschlagst ist um _120%_ erhöht.
actors.hero.talent.striking_force.comment=
actors.hero.talent.directed_power.title=gerichtete Kraft
actors.hero.talent.directed_power.desc=_+1:_ Der direkte Angriff mittels Elementarschlag wird pro Gegner in Reichweite des Effekts, einschließlich des direkten Ziels, _um 30% verstärkt_.\n\n_+2:_ Der direkte Angriff mittels Elementarschlag wird pro Gegner in Reichweite des Effekts, einschließlich des direkten Ziels, _um 60% verstärkt_.\n\n_+3:_ Der direkte Angriff mittels Elementarschlag wird pro Gegner in Reichweite des Effekts, einschließlich des direkten Ziels, _um 90% verstärkt_.\n\n_+4:_ Der direkte Angriff mittels Elementarschlag wird pro Gegner in Reichweite des Effekts, einschließlich des direkten Ziels, _um 120% verstärkt_.
actors.hero.talent.directed_power.comment=

actors.hero.talent.feigned_retreat.title=fingierter Rückzug
actors.hero.talent.feigned_retreat.desc=_+1:_ Wenn ein Feind das Nachbild der Zweikämpferin angreift, erhält sie _2 Züge_ Eile.\n\n_+2:_ Wenn ein Feind das Nachbild der Zweikämpferin angreift, erhält sie _4 Züge_ Eile.\n\n_+3:_ Wenn ein Feind das Nachbild der Zweikämpferin angreift, erhält sie _6 Züge_ Eile.\n\n_+4:_ Wenn ein Feind das Nachbild der Zweikämpferin angreift, erhält sie _8 Züge_ Eile.
actors.hero.talent.feigned_retreat.comment=
actors.hero.talent.expose_weakness.title=Schwäche bloßstellen
actors.hero.talent.expose_weakness.desc=_+1:_ Feinde, die das Nachbild der Zweikämpferin angreifen, werden für _2 Züge_ geschwächt und verwundbar.\n\n_+2:_ Feinde, die das Nachbild der Zweikämpferin angreifen, werden für _4 Züge_ geschwächt und verwundbar.\n\n_+3:_ Feinde, die das Nachbild der Zweikämpferin angreifen, werden für _6 Züge_ geschwächt und verwundbar.\n\n_+4:_ Feinde, die das Nachbild der Zweikämpferin angreifen, werden für _8 Züge_ geschwächt und verwundbar.
actors.hero.talent.expose_weakness.comment=
actors.hero.talent.counter_ability.title=Fähigkeit kontern
actors.hero.talent.counter_ability.desc=_+1:_ Wenn die Zweikämpferin innerhalb von 3 Zügen, nachdem ihr Nachbild angegriffen wurde, eine Waffenfähigkeit einsetzt, erhält sie sofort _0,38 Ladungen_ zurück.\n\n_+2:_ Wenn die Zweikämpferin innerhalb von 3 Zügen, nachdem ihr Nachbild angegriffen wurde, eine Waffenfähigkeit einsetzt, erhält sie sofort _0,77 Ladungen_ zurück.\n\n_+3:_ Wenn die Zweikämpferin innerhalb von 3 Zügen, nachdem ihr Nachbild angegriffen wurde, eine Waffenfähigkeit einsetzt, erhält sie sofort _1,13 Ladungen_ zurück.\n\n_+4:_ Wenn die Zweikämpferin innerhalb von 3 Zügen, nachdem ihr Nachbild angegriffen wurde, eine Waffenfähigkeit einsetzt, erhält sie sofort _1,5 Ladungen_ zurück.
actors.hero.talent.counter_ability.comment=

#cleric
actors.hero.talent.satiated_spells.title=Abendmahls-Segen
actors.hero.talent.satiated_spells.desc=_+1：_Essen gewährt dem Priester beim nächsten Zauber _3 Schildpunkte_.\n\n_+2：_Essen gewährt _5 Schildpunkte_.
actors.hero.talent.satiated_spells.comment=„Dies soll verhindern, dass sich das ‚Letzte Abendmahl‘ wiederholt.“
actors.hero.talent.holy_intuition.title=Heilige Voraussicht
actors.hero.talent.holy_intuition.desc=_+1：_Der Codex kann _Heilige Voraussicht_ wirken, der _3 Aufladungen_ verbraucht, um Gegenstände auf Flüche zu prüfen.\n\n_+2：_Der Codex kann _Heilige Voraussicht_ wirken, der _2 Aufladungen_ verbraucht, um Gegenstände auf Flüche zu prüfen.
actors.hero.talent.holy_intuition.comment=Dein Wort ist meines Fußes Leuchte und ein Licht auf meinem Wege.
actors.hero.talent.searing_light.title=Sengendes Licht
actors.hero.talent.searing_light.desc=_+1：_Physische Angriffe des Priesters auf Gegner, die durch _Göttliches Licht_ mit heiligem Glanz belegt sind, verursachen _3 zusätzlichen Schaden_.\n\n_+2：_Verursachen _5 zusätzlichen Schaden_.
actors.hero.talent.searing_light.comment=„Das Licht scheint in der Finsternis, und die Finsternis hat es nicht überwunden.“
actors.hero.talent.shield_of_light.title=Heiliger Schild
actors.hero.talent.shield_of_light.desc=_+1：_Die Bibel kann den Zauber _Heiliger Schild_ wirken, der 1 Aufladung verbraucht, um sofort _2~4 Rüstung_ für 5 Runden gegen ein einzelnes Ziel zu gewähren.\n\n_+2：_Gewährt _3~6 Rüstung_.
actors.hero.talent.shield_of_light.comment=„Fürchte dich nicht, denn ich bin bei dir; sei nicht verzagt, denn ich bin dein Gott. Ich stärke dich, ich helfe dir, ich halte dich mit meiner gerechten Rechten.“

actors.hero.talent.enlightening_meal.title=Erleuchtetes Abendmahl
actors.hero.talent.enlightening_meal.desc=_+1：_Der Priester isst nur 1 Runde und erhält _0,67 Codex-Aufladung_.\n\n_+2：_Der Priester isst nur 1 Runde und erhält _1 Codex-Aufladung_.
actors.hero.talent.enlightening_meal.comment=Ist kein heiliger Codex im Inventar, gewährt diese Fertigkeit auf Stufe _+1/+2_ _2/3 Runden_ Zauberstab- und Artefakt-Aufladung (kann das Füllhorn nicht selbst aufladen).\n\nDas letzte Abendmahl fand bereits statt; dieser Codex wurde geschrieben, damit sich die Tragödie nicht wiederholt.
actors.hero.talent.recall_inscription.title=Beschwörungsformel
actors.hero.talent.recall_inscription.refunded=Dein Gegenstand wurde zurückgegeben!
actors.hero.talent.recall_inscription.desc=_+1：_Die Bibel kann den Zauber _Beschwörungsformel_ wirken, um den Effekt des zuletzt innerhalb von _10 Runden_ genutzten Runensteins oder Schriftrolle erneut auszulösen.\n\n_+2：_Um den Effekt des zuletzt innerhalb von _300 Runden_ Genutzten erneut auszulösen.
actors.hero.talent.recall_inscription.comment=Die Beschwörungsformel kann Aufwertungs-, Transformations- und Erhebungs-Schriftrollen nicht erneut auslösen. Der Aufladungsverbrauch variiert je nach zuletzt genutztem Gegenstand: Runenstein 2 Aufladungen, Schriftrolle 3 Aufladungen, Geheimrolle 4 Aufladungen. Bei Auslösung von Transformations- oder Aufwertungs-/Transformations-Runensteinen/Geheimrollen verdoppelt sich der Verbrauch.\n\n„Dieses ‚wieder‘ bedeutet, dass alles Erschütterte entfernt wird, damit das Unerschütterliche bleibt.“
actors.hero.talent.sunray.title=Sonnenglanz
actors.hero.talent.sunray.desc=_+1：_Das Tome kann den Zauber _Sonnenglanz_ wirken, verbraucht 1 Ladung, verursacht _4-8_ Schaden und blendet das Ziel für _4 Runden_.\n\n_+2：_Das Tome kann den Zauber _Sonnenglanz_ wirken, verbraucht 1 Ladung, verursacht _6-12_ Schaden und blendet das Ziel für _6 Runden_.
actors.hero.talent.sunray.comment=Sonnenglanz kann ein Ziel nur einmal blenden, aber falls das Ziel bereits durch Sonnenglanz geblendet wurde, wird es stattdessen gelähmt. Sonnenglanz fügt _Untoten und Dämonen_ stets maximalen Schaden zu.\n\n„Aber euch, die meinen Namen fürchten, wird die Sonne der Gerechtigkeit aufgehen, und Heilung wird unter ihren Flügeln sein. Ihr werdet hervorspringen wie die gemästeten Kälber. Ihr werdet die Frevler zertreten, denn sie werden Asche unter euren Füßen sein an dem Tag, den ich bereite.“
actors.hero.talent.divine_sense.title=Göttliche Wahrnehmung
actors.hero.talent.divine_sense.desc=_+1：_Der Codex kann _Göttliche Wahrnehmung_ wirken, der 2 Aufladungen verbraucht, um für 50 Runden _8 Felder_ Sicht zu gewähren.\n\n_+2：_Der Codex kann _Göttliche Wahrnehmung_ wirken, der 2 Aufladungen verbraucht, um für 50 Runden _12 Felder_ Sicht zu gewähren.
actors.hero.talent.divine_sense.comment=Er achtet auf den Weg der Menschen und sieht all ihre Schritte. Keine Finsternis und kein Dunkel gibt es für die Übeltäter, sich zu verstecken.
#actors.hero.talent.divine_sense.meta_desc=_如果这个天赋被其它英雄获得_，那么它会在+1/+2等级时使英雄在使用法杖或神器后获得3/5格内的灵视感知。
actors.hero.talent.bless.title=Heiliger Segen
actors.hero.talent.bless.desc=_+1:_ Die Schriftrolle kann den Zauber _Heiliger Segen_ wirken, der 1 Ladung verbraucht, um dir _6 Runden Segen und 10 Schild_ zu gewähren oder einer anderen Einheit _10 Runden Segen und 10 Heilung_.\n\n_+2:_ Der Zauber gewährt dir _10 Runden Segen und 15 Schild_ oder anderen _15 Runden Segen und 15 Heilung_.
actors.hero.talent.bless.comment=Überschüssige Heilung dieses Zaubers wird in Schilde umgewandelt.\n\n„Denn Gott ist Sonne und Schild, er gibt Gnade und Ehre. Er hält nichts Gutes zurück für die, die rechtschaffen wandeln."
#actors.hero.talent.bless.meta_desc=_如果这个天赋被其它英雄获得_，那么它会在+1/+2等级时提升英雄和所有盟友3%/5%的精准和闪避。

actors.hero.talent.cleanse.title=Heilige Reinigung
actors.hero.talent.cleanse.desc=_+1:_ Die Schriftrolle kann den Zauber _Heilige Reinigung_ wirken, der 2 Ladungen verbraucht, um sofort alle negativen Effekte von dir und nahen Verbündeten zu entfernen und allen _10 Schild_ zu gewähren.\n\n_+2:_ Der Zauber gewährt allen _20 Schild_ und _3 Runden Debuff-Immunität_.\n\n_+3:_ Der Zauber gewährt allen _30 Schild_ und _5 Runden Debuff-Immunität_.
actors.hero.talent.cleanse.comment=
#actors.hero.talent.cleanse.meta_desc=_如果这个天赋被其它英雄获得_，那么它会在+1/+2/+3等级时有10/20/30%的概率使英雄在使用法杖或神器后净化英雄所有的减益效果。
actors.hero.talent.light_reading.title=Leichte Lektüre
actors.hero.talent.light_reading.desc=_+1：_Der Priester kann den Codex auch ohne Ausrüstung nutzen, aber die Aufladerate sinkt auf _25%_.\n\n_+2：_Der Priester kann den Codex auch ohne Ausrüstung nutzen, aber die Aufladerate sinkt auf _50%_.\n\n_+3：_Der Priester kann den Codex auch ohne Ausrüstung nutzen, aber die Aufladerate sinkt auf _75%_.
actors.hero.talent.light_reading.comment=
actors.hero.talent.light_reading.meta_desc=_Wenn diese Fertigkeit von einem anderen Helden erhalten wird_, erhöht sie auf Stufe +1/+2/+3 die Aufladegeschwindigkeit aller Zauberstäbe um 7/13/20%.

actors.hero.talent.holy_lance.title=Heiliger Speer
actors.hero.talent.holy_lance.desc=_+1：_Der Priester kann _Heiliger Speer_ wirken, der 4 Aufladungen verbraucht, um tödliche _30~55 Schaden_ zu verursachen.\n\n_+2：_Der Priester kann _Heiliger Speer_ wirken, der 4 Aufladungen verbraucht, um tödliche _45~83 Schaden_ zu verursachen.\n\n_+3：_Der Priester kann _Heiliger Speer_ wirken, der 4 Aufladungen verbraucht, um tödliche _60~110 Schaden_ zu verursachen.
actors.hero.talent.holy_lance.comment=Die heilige Lanze verursacht gegen _Untote und Dämonen_ stets maximalen Schaden. Die heilige Lanze hat 30 Runden Abklingzeit.
actors.hero.talent.hallowed_ground.title=Heiliges Feld
actors.hero.talent.hallowed_ground.desc=_+1：_Der Priester kann _Heiliges Feld_ wirken, der 2 Aufladungen verbraucht, um ein _3x3_ Feld für 20 Runden zu erschaffen.\n\n_+2：_Der Priester kann _Heiliges Feld_ wirken, der 2 Aufladungen verbraucht, um ein _5x5_ Feld für 20 Runden zu erschaffen.\n\n_+3：_Der Priester kann _Heiliges Feld_ wirken, der 2 Aufladungen verbraucht, um ein _7x7_ Feld für 20 Runden zu erschaffen.
actors.hero.talent.hallowed_ground.comment=Beim Wirken heilt der Zauber sofort 15 LP bei Verbündeten, ummantelt Feinde kurz und verbreitet niedriges Gras. Danach heilt das heilige Feld langsam Verbündete, krüppelt Feinde und lässt zufällig hohes Gras wachsen. Das heilige Feld gewährt dem Priester Schilde statt Heilung und wird durch Feuer zerstört.
actors.hero.talent.mnemonic_prayer.title=Gebetsgedicht
actors.hero.talent.mnemonic_prayer.desc=_+1：_Die Priesterin kann den Zauber _Gebetsgedicht_ wirken, der 1 Aufladung verbraucht, um Buffs/Debuffs von Verbündeten/Gegnern um _3 Runden_ zu verlängern.\n\n_+2：_Die Priesterin kann den Zauber _Gebetsgedicht_ wirken, der 1 Aufladung verbraucht, um Buffs/Debuffs von Verbündeten/Gegnern um _4 Runden_ zu verlängern.\n\n_+3：_Die Priesterin kann den Zauber _Gebetsgedicht_ wirken, der 1 Aufladung verbraucht, um Buffs/Debuffs von Verbündeten/Gegnern um _5 Runden_ zu verlängern.
actors.hero.talent.mnemonic_prayer.comment=Das Gebetsgedicht kann nur einmal Buffs oder Debuffs eines bestimmten Ziels verlängern, nicht jedoch Buffs von Rüstungsfähigkeiten.

actors.hero.talent.lay_on_hands.title=Heiliger Touch
actors.hero.talent.lay_on_hands.desc=_+1：_Der Paladin kann _Heiliger Touch_ wirken, der 1 Aufladung verbraucht, um eine Einheit in der Nähe um _15 LP_ zu heilen oder dem Paladin _15 Schildpunkte_ zu geben.\n\n_+2：_Der Paladin kann _Heiliger Touch_ wirken, der 1 Aufladung verbraucht, um eine Einheit in der Nähe um _20 LP_ zu heilen oder dem Paladin _20 Schildpunkte_ zu geben.\n\n_+3：_Der Paladin kann _Heiliger Touch_ wirken, der 1 Aufladung verbraucht, um eine Einheit in der Nähe um _25 LP_ zu heilen oder dem Paladin _25 Schildpunkte_ zu geben.
actors.hero.talent.lay_on_hands.comment=Überschüssige Heilung dieses Zaubers wird in Schilde umgewandelt. Heiliger Touch kann wiederholt gewirkt werden, aber nicht mehr als das Dreifache des Einzelwirkungswertes als Schild erzeugen.
actors.hero.talent.aura_of_protection.title=Schutzaura
actors.hero.talent.aura_of_protection.desc=_+1:_ Der Paladin kann den Zauber _Schutzaura_ wirken, der 2 Ladungen verbraucht, um dem Paladin und allen Verbündeten in 2 Feldern Umkreis _20% Schadensreduzierung_ und _50% Gravurverstärkung_ der Paladinrüstung zu gewähren.\n\n_+2:_ Der Paladin kann den Zauber _Schutzaura_ wirken, der 2 Ladungen verbraucht, um _30% Schadensreduzierung_ und _75% Gravurverstärkung_ zu gewähren.\n\n_+3:_ Der Paladin kann den Zauber _Schutzaura_ wirken, der 2 Ladungen verbraucht, um _40% Schadensreduzierung_ und _100% Gravurverstärkung_ zu gewähren.
actors.hero.talent.aura_of_protection.comment=
actors.hero.talent.wall_of_light.title=Heilige Barriere
actors.hero.talent.wall_of_light.desc=_+1：_Der Paladin kann den Zauber _Heilige Barriere_ wirken, verbraucht 3 Ladungen, um vor sich eine feste Mauer zu erschaffen, die 20 Runden hält, _3 Felder breit_ ist und Feinde zurückstößt.\n\n_+2：_Der Paladin kann den Zauber _Heilige Barriere_ wirken, verbraucht 3 Ladungen, um vor sich eine feste Mauer zu erschaffen, die 20 Runden hält, _5 Felder breit_ ist und Feinde zurückstößt.\n\n_+3：_Der Paladin kann den Zauber _Heilige Barriere_ wirken, verbraucht 3 Ladungen, um vor sich eine feste Mauer zu erschaffen, die 20 Runden hält, _7 Felder breit_ ist und Feinde zurückstößt.
actors.hero.talent.wall_of_light.comment=Die heilige Barriere kann in acht Richtungen platziert werden; es kann nur eine Barriere gleichzeitig existieren.

actors.hero.talent.divine_intervention.title=Göttliches Eingreifen
actors.hero.talent.divine_intervention.desc=_+1：_Beim Aktivieren des Aufstiegs kann der Priester _Göttliches Eingreifen_ wirken, um die Schilde aller Verbündeten auf _150_ zu verstärken und den Aufstieg um _3 Runden_ zu verlängern.\n\n_+2：_Beim Aktivieren des Aufstiegs kann der Priester _Göttliches Eingreifen_ wirken, um die Schilde aller Verbündeten auf _200_ zu verstärken und den Aufstieg um _4 Runden_ zu verlängern.\n\n_+3：_Beim Aktivieren des Aufstiegs kann der Priester _Göttliches Eingreifen_ wirken, um die Schilde aller Verbündeten auf _250_ zu verstärken und den Aufstieg um _5 Runden_ zu verlängern.\n\n_+4：_Beim Aktivieren des Aufstiegs kann der Priester _Göttliches Eingreifen_ wirken, um die Schilde aller Verbündeten auf _300_ zu verstärken und den Aufstieg um _6 Runden_ zu verlängern.
actors.hero.talent.divine_intervention.comment=Göttliches Eingreifen verbraucht bis zu 5 Aufladungen des Codex und kann nur einmal pro Aufstieg gewirkt werden.
actors.hero.talent.judgement.title=Apokalypse
actors.hero.talent.judgement.desc=_+1：_Beim Aktivieren des Aufstiegs kann der Priester _Apokalypse_ wirken, um allen sichtbaren Feinden _10~20 Schaden_ zuzufügen.\n\n_+2：_Beim Aktivieren des Aufstiegs kann der Priester _Apokalypse_ wirken, um allen sichtbaren Feinden _15~30 Schaden_ zuzufügen.\n\n_+3：_Beim Aktivieren des Aufstiegs kann der Priester _Apokalypse_ wirken, um allen sichtbaren Feinden _20~40 Schaden_ zuzufügen.\n\n_+4：_Beim Aktivieren des Aufstiegs kann der Priester _Apokalypse_ wirken, um allen sichtbaren Feinden _25~50 Schaden_ zuzufügen.
actors.hero.talent.judgement.comment=Apokalypse verbraucht 3 Codex-Aufladungen. Jeder Zauber des Priesters seit dem Aufstieg oder der letzten Apokalypse verursacht 33% zusätzlichen Schaden.
actors.hero.talent.flash.title=Himmelstreppe
actors.hero.talent.flash.desc=_+1：_Beim Aktivieren des Aufstiegs kann der Priester _Himmelstreppe_ wirken, um bis zu _3 Felder_ weit zu teleportieren.\n\n_+2：_Beim Aktivieren des Aufstiegs kann der Priester _Himmelstreppe_ wirken, um bis zu _4 Felder_ weit zu teleportieren.\n\n_+3：_Beim Aktivieren des Aufstiegs kann der Priester _Himmelstreppe_ wirken, um bis zu _5 Felder_ weit zu teleportieren.\n\n_+4：_Beim Aktivieren des Aufstiegs kann der Priester _Himmelstreppe_ wirken, um bis zu _6 Felder_ weit zu teleportieren.
actors.hero.talent.flash.comment=Himmelstreppe verbraucht anfangs 2 Codex-Aufladungen und jede weitere Nutzung während des Aufstiegs kostet +1 Aufladung.

actors.hero.talent.body_form.title=Körperaspekt
actors.hero.talent.body_form.desc=Durch die Aufwertung dieses Talents kann der Priester den Zauber _Körperaspekt_ wirken, der 2 Ladungen verbraucht, damit die Dreifaltigkeit eine identifizierte Verzauberung oder Gravur nachahmt.\n\n_+1:_ Der Priester erhält den Effekt der gewählten Verzauberung oder Gravur für _20 Runden_.\n\n_+2:_ Effekt für _27 Runden_.\n\n_+3:_ Effekt für _33 Runden_.\n\n_+4:_ Effekt für _40 Runden_.
actors.hero.talent.body_form.comment=Die Dreifaltigkeit kann jeweils nur einen Körperaspekt-Effekt nachahmen. Seltene und mächtige Verzauberungen oder Gravuren verbrauchen mehr Rüstungsladungen der Dreifaltigkeit.
actors.hero.talent.mind_form.title=Geistes-Persona
actors.hero.talent.mind_form.desc=Durch Aufwerten dieses Talents kann der Priester den Zauber _Geistes-Persona_ wirken, der 3 Aufladungen verbraucht, damit die Dreifaltigkeit einen bereits benutzten Stab oder eine Wurfwaffe des Priesters nachahmt.\n\n_+1：_Bei Nutzung der Dreifaltigkeit verwendet der Priester den Effekt des gewählten Stabs oder der Wurfwaffe auf _Stufe 3_.\n\n_+2：_Bei Nutzung der Dreifaltigkeit verwendet der Priester den Effekt des gewählten Stabs oder der Wurfwaffe auf _Stufe 4_.\n\n_+3：_Bei Nutzung der Dreifaltigkeit verwendet der Priester den Effekt des gewählten Stabs oder der Wurfwaffe auf _Stufe 5_.\n\n_+4：_Bei Nutzung der Dreifaltigkeit verwendet der Priester den Effekt des gewählten Stabs oder der Wurfwaffe auf _Stufe 6_.
actors.hero.talent.mind_form.comment=Die Dreifaltigkeit kann nur jeweils eine Geistes-Persona annehmen.
actors.hero.talent.spirit_form.title=Seelen-Persona
actors.hero.talent.spirit_form.desc=Durch Aufwerten dieses Talents kann der Priester den Zauber _Seelen-Persona_ wirken, der 4 Aufladungen verbraucht, damit die Dreifaltigkeit einen bereits identifizierten Ring oder ein Artefakt (außer dem Heiligen Kodex) nachahmt.\n\n_+1：_Der Priester erhält den Effekt des gewählten Rings auf _Stufe 1_ für 20 Runden oder des gewählten Artefakts auf _Stufe 4_.\n\n_+2：_Ring _Stufe 2_ oder Artefakt _Stufe 6_.\n\n_+3：_Ring _Stufe 3_ oder Artefakt _Stufe 8_.\n\n_+4：_Ring _Stufe 4_ oder Artefakt _Stufe 10_.
actors.hero.talent.spirit_form.comment=Die Dreifaltigkeit kann nur jeweils eine Geistes-Persona annehmen. Die Effekte der Artefaktnutzung und der Rüstungsaufladungsverbrauch variieren je nach Artefakt.

actors.hero.talent.beaming_ray.title=Lichtgeist-Beschwörung
actors.hero.talent.beaming_ray.desc=Durch die Aufwertung dieses Talents kann der Priester den Zauber _Lichtgeist-Beschwörung_ wirken, der 1 Ladung verbraucht, um einen verstärkten Verbündeten einen Teleportationsstrahl aussenden zu lassen. Der Strahl kann Wände durchdringen und den Verbündeten an eine bestimmte Position teleportieren. Befindet sich dort ein Feind, erscheint der Verbündete in der Nähe und greift ihn an. Der Zauber kann auch normalerweise unbewegliche Verbündete teleportieren, jedoch mit halbierter Reichweite.\n\n_+1:_ Die maximale Reichweite des Teleportationsstrahls beträgt _4 Felder_ und erhöht den Schadensbonus von Alles-in-Eins gegen den nächsten Feind für 10 Runden auf _35%_.\n\n_+2:_ Reichweite _8 Felder_, Schadensbonus _40%_.\n\n_+3:_ Reichweite _12 Felder_, Schadensbonus _45%_.\n\n_+4:_ Reichweite _16 Felder_, Schadensbonus _50%_.
actors.hero.talent.beaming_ray.comment=
actors.hero.talent.life_link.title=Blutige Bindung
actors.hero.talent.life_link.desc=Durch Aufrüsten dieser Fertigkeit kann der Priester _Blutige Bindung_ wirken, der 2 Aufladungen verbraucht, um eine Lebensverbindung zwischen sich und einem verstärkten Verbündeten herzustellen. Dieser Zauber teilt erlittenen Schaden zwischen Priester und Verbündeten. Segenszauber des Priesters der Stufe 3 und darunter wirken auf beide, wenn sie auf einen gewirkt werden.\n\n_+1：_Die Lebensverbindung hält _10 Runden_ und erhöht die Schadensreduktion von 'Alles eine Seele' auf _35%_.\n\n_+2：_Die Lebensverbindung hält _13 Runden_ und erhöht die Schadensreduktion von 'Alles eine Seele' auf _40%_.\n\n_+3：_Die Lebensverbindung hält _17 Runden_ und erhöht die Schadensreduktion von 'Alles eine Seele' auf _45%_.\n\n_+4：_Die Lebensverbindung hält _20 Runden_ und erhöht die Schadensreduktion von 'Alles eine Seele' auf _50%_.
actors.hero.talent.life_link.comment=
actors.hero.talent.stasis.title=Astralprojektion
actors.hero.talent.stasis.desc=Durch Aufwerten dieses Talents kann der Priester den Zauber _Astralprojektion_ wirken, der 2 Aufladungen verbraucht, um einen Verbündeten zu stärken, indem er ihn in Starre versetzt. Der Zauber entfernt den Verbündeten vorübergehend aus dem Verlies, behält aber die Restzeit aller seiner Buffs, einschließlich All-Eins. Wenn der Zauber endet, erscheint der Verbündete in deiner Nähe wieder. Der Zauber kann sofort ohne Kosten erneut gewirkt werden, um ihn vorzeitig zu beenden. Der Zauber wirkt auch auf unbewegliche Verbündete, kann sie aber nicht zwischen Etagen bewegen.\n\n_+1：_Der Starre-Zustand hält maximal _60 Runden_.\n\n_+2：_Maximal _90 Runden_.\n\n_+3：_Maximal _120 Runden_.\n\n_+4：_Maximal _150 Runden_.
actors.hero.talent.stasis.comment=Wenn ein Verbündeter im Starre-Zustand ist, kann der Priester immer noch Lichtgeister beschwören, um den Verbündeten erneut zu rufen, oder Blutbande wirken, damit der Verbündete den Zaubereffekt vorzeitig erhält. Verbündete im Starre-Zustand können jedoch nicht von den Effekten der Blutbande-Zauber profitieren.


#universal
actors.hero.talent.heroic_energy.title=heroische Energie
actors.hero.talent.heroic_energy.rat_title=rattenhafte Energie
actors.hero.talent.heroic_energy.desc=_+1:_ Die Rüstungsfähigkeit des Helden hat um _12% reduzierte_ Ladungskosten.\n\n_+2:_ Die Rüstungsfähigkeit des Helden hat um _23% reduzierte_ Ladungskosten.\n\n_+3:_ Die Rüstungsfähigkeit des Helden hat um _32% reduzierte_ Ladungskosten.\n\n_+4:_ Die Rüstungsfähigkeit des Helden hat um _40% reduzierte_ Ladungskosten.
