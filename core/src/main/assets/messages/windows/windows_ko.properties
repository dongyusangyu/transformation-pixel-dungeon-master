windows.wndtreasurehuntmenu.rules_info=_용기 6_으로 시작합니다. 각 단계마다 15가지 사건 중 무작위로 세 가지가 제시됩니다. 위험한 선택을 하면 연속 기록이 쌓이고 더 높은 점수를 얻지만 용기를 잃을 수 있습니다. 야영지, 달샘, 잉걸불 서약은 용기를 회복하는 데 도움이 될 수 있습니다. 다섯 단계를 마칠 때마다 피로가 발생해 _용기 -1, 잔광 +1_이 됩니다.\n\n10단계를 모두 완료하면 경험의 물약 또는 변환의 주문서를 받습니다. 500점을 넘긴 채 일찍 끝내면 일반 물약 또는 주문서를 받고, 그 외에는 룬스톤이나 씨앗을 받습니다. 무한 보물찾기에서는 점수만 기록되고 실제 아이템은 지급되지 않습니다.
