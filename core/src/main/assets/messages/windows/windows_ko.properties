windows.wndvictorycongrats.title=승리!
windows.wndvictorycongrats.start_text=던전을 정복한 것을 축하드립니다! 이제 영웅을 선택할 때 다음과 같은 새로운 기능을 사용할 수 있게 되었습니다.
windows.wndvictorycongrats.challenges=_도전 항목_을 활성화할 수 있게 되었습니다! 도전 항목은 다양한 방법으로 게임을 더 어렵게 만들 수 있게 해 주는 선택 사항입니다.
windows.wndvictorycongrats.custom_seeds=_사용자 지정 시드_를 입력할 수 있게 되었습니다! 동일한 버전의 동일한 시드는 항상 같은 던전을 생성합니다.
windows.wndvictorycongrats.dailies=_일일 도전_에 참가할 수 있게 되었습니다! 매일 새로운 일일 도전이 모든 플레이어에게 똑같이 제공됩니다.
windows.wndvictorycongrats.thank_you=섀터드 픽셀 던전을 플레이해 주셔서 대단히 감사합니다!
windows.wndvictorycongrats.support_prompt=아직 하지 않았다면, _게임을 후원하는 것도 고려해 주세요._ 열성적인 플레이어의 후원을 통해 개발자는 게임을 계속 개선할 수 있습니다!
windows.wndvictorycongrats.support=후원하기
windows.wndvictorycongrats.close=닫기

windows.wndwandmaker.dust=오오, 가루를 가져왔군! 유령들은 걱정하지 말게나, 내가 상대할 수 있으니. 약속한대로 내 질 좋은 마법 막대 중 하나를 주지.
windows.wndwandmaker.ember=오오, 잉걸불을 가져왔군! 불정령들이 상대하기에 너무 까다롭진 않았나 모르겠군. 약속한대로 내 질 좋은 마법 막대 중 하나를 주지.
windows.wndwandmaker.berry=오오, 열매를 가져왔군! 썩은열매 나무 때문에 위험에 처하지는 않았나 모르겠군. 약속한대로 내 질 좋은 마법 막대 중 하나를 주지.
windows.wndwandmaker.farewell=당신의 모험에 행운이 함께하기를, %s(이)여!
windows.wndskins.skin_mage_3=니코
windows.wndskins.skin_duelist_4=코비
windows.wndskins.skin_friar_2=Emoji
windows.wndranking$statstab.remove_desc=이 기록을 영웅의 전당에서 삭제할까요? 일반 랭킹의 원본 기록에는 영향을 주지 않습니다.
windows.wndranking$challengestab.restart_desc=승리한 영웅을 0층에서 다시 시작하게 할까요? 소모품은 25층 기준 가치로 골드로 환산되고, 보유한 비유물 장비는 0레벨로 초기화되며, 강화의 두루마리 15장이 지급됩니다. 도전 항목, 부정적 특성, 무작위 모드 데이터는 삭제됩니다.\n\n이 승리 기록은 한 번만 사용할 수 있습니다.
windows.wndranking$challengestab.restart_confirm=다시 시작
windows.wndranking$challengestab.restart_cancel=취소
windows.wndranking$challengestab.no_slots=빈 저장 슬롯이 없습니다.
windows.wndscorebreakdown.progress_desc_tower=탑은 25층까지 층마다 800점(최대 20,000점)을 얻으며, 그 이후에는 층 깊이의 제곱에 따른 점수가 보호된 방식으로 증가합니다.
windows.wndscorebreakdown.treasure_desc_tower=보물 가치 20,000골드까지는 점수를 모두 얻으며, 초과분은 로그 방식으로 압축됩니다.
windows.wndscorebreakdown.explore_desc_tower=보스 층을 제외하고 탐험한 탑 층에는 일반 탐험 점수가 적용됩니다.
windows.wndscorebreakdown.bosses_desc_tower=탑 보스를 처치할 때마다 10,000점을 얻습니다. 보스는 전투를 완료하면 한 번만 집계됩니다.
windows.wndsettings$datatab.sync_data=서버 정보 동기화
windows.wndsettings$datatab.sync_stale=로컬 데이터가 변경되었거나 더 새로운 복원 요청이 있어 이전 응답을 무시했습니다. 필요하면 복원을 다시 요청하세요.
windows.wndsettings$datatab.sync_pending=클라우드 복원 계속하기
windows.wndsettings$datatab.sync_pending_body=이전에 요청한 클라우드 복원을 계속할까요? 로컬 전역 데이터가 대체됩니다. 요청 이후 로컬 데이터가 변경되었다면 이전 복원은 취소됩니다.
windows.wndsettings$datatab.sync_success=서버 정보가 이 기기에 동기화되었습니다.
windows.wndsettings$datatab.sync_failed=서버 정보 동기화에 실패했습니다.
windows.wndsettings$datatab.sync_uuid_title=클라우드 데이터 복원
windows.wndsettings$datatab.sync_uuid_body=복원할 플레이어 UUID를 입력하세요. 비워 두면 이 기기에 설치된 이전 데이터를 자동으로 식별합니다.
windows.wndsettings$datatab.sync_invalid_uuid=플레이어 UUID가 올바르지 않습니다. 전체 UUID를 입력하거나 기기 자동 확인을 사용하려면 비워 두세요.
windows.wndsettings$datatab.sync_confirm_title=클라우드 복원 확인
windows.wndsettings$datatab.sync_confirm_body=클라우드 데이터가 이 기기의 배지, 랭킹, 아이템 및 몬스터 도감, 아이템 사용 및 획득 횟수, 처치한 몬스터 수, 특성 및 기타 전역 도감 통계를 대체합니다.\n\n진행 중인 게임이나 저장 슬롯은 다운로드되거나 변경되지 않습니다. 복원에 성공하면 일회성 권한이 소모되고 이 기기가 복원된 UUID에 연결됩니다.
