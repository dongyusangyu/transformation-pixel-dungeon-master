windows.wndblacksmith$hardenselector.prompt=选择要硬化的物品
windows.wndblacksmith$upgradeselector.prompt=选择要升级的物品
windows.wndblacksmith$wndsmith.prompt=行，这些就是我能锻造的装备了。锻炉已经烧热了，所以你赶紧给我选。

