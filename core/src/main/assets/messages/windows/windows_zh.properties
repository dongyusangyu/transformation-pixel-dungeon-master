windows.wndtreasurehunt.narrative_mossy_path=你拨开湿润的苔藓，在石缝中找到了前人遗落的微光。
windows.wndtreasurehunt.narrative_ancient_runes=沉睡的符文逐个亮起，像是在拼出一张失落的藏宝图。
windows.wndtreasurehunt.narrative_broken_bridge=石桥在脚下呻吟，你赶在最后一块石板坠落前跃了过去。
windows.wndtreasurehunt.narrative_lost_ghost=幽魂没有袭击你，只用冰冷的手指向一处被遗忘的角落。
windows.wndtreasurehunt.narrative_rat_ambush=鼠群从暗处扑来；尘埃落定后，它们藏起的战利品归你了。
windows.wndtreasurehunt.narrative_toxic_thicket=毒藤追着你的脚步合拢，荧光汁液却照出了隐秘通道。
windows.wndtreasurehunt.narrative_falling_rocks=巨石擦着斗篷滚过，崩开的墙后露出一只旧钱袋。
windows.wndtreasurehunt.narrative_stone_guardian=石像的拳头沉重如钟；它倒下时，胸腔中传来金币声。
windows.wndtreasurehunt.narrative_dark_riddle=门上的谜语没有答案，但你发现“问题”本身就是钥匙。
windows.wndtreasurehunt.narrative_cursed_altar=祭坛收走一缕勇气，随后吐出比火焰更暗的宝光。
windows.wndtreasurehunt.narrative_mimic_chest=宝箱咬住了你的手套，也因此没能守住肚子里的收藏。
windows.wndtreasurehunt.narrative_abyss_shortcut=你沿深渊边缘疾行，脚下每块碎石都在提醒你别回头。
windows.wndtreasurehunt.narrative_ember_camp=余火里还埋着温度；短暂休息让呼吸重新平稳。
windows.wndtreasurehunt.narrative_moon_well=月色从看不见的穹顶落入泉水，疲惫随涟漪散去。
windows.wndtreasurehunt.narrative_ember_pact=余烬化作温暖的文字，与你交换了一段继续前行的勇气。
