windows.wndsettings$datatab.sync_pending=Reprendre la restauration depuis le cloud
windows.wndsettings$datatab.sync_pending_body=Reprendre la restauration des données du cloud interrompue précédemment ? Cela remplacera toutes les données locales. Si les données locales ont changé, la demande précédente sera ignorée.
