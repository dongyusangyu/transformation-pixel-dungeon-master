windows.wndwandmaker.book=Oh, je vois que vous avez le Necronomicon. Vous pourrez donc vous occuper des esprits vous-même, sans mon aide. La poussière de cadavre a disparu, mais pouvoir examiner le contenu de ce livre est déjà une belle récompense. Vous pouvez donc toujours choisir l’une de mes baguettes de grande qualité. Quant à ce livre… puisque j’en connais déjà le contenu, gardez-le.
windows.wndtreasurehuntmenu.title=Mini-jeu de chasse au trésor de Dongyu Sangyu
windows.wndtreasurehuntmenu.prompt=Le mini-jeu de chasse au trésor vous intéresse ? Vous pouvez en lancer une partie quand vous le souhaitez.\n\nDeux modes sont disponibles : la chasse en dix étapes et la chasse sans fin. Le premier ne peut être joué qu’une fois et comporte au plus dix étapes, mais votre score final vous rapportera une récompense. Le second est illimité en durée et en étapes, mais ne fait qu’enregistrer votre score et ne donne aucune récompense.\n\nÀ chaque étape, trois itinéraires vous sont proposés. À vous d’évaluer le courage que chacun pourrait vous coûter. La partie se termine si votre courage tombe à zéro.\n\nVous pouvez consulter vos parties terminées en mode sans fin dans les scores et classements. Si les règles vous semblent obscures, vous pouvez aussi me poser vos questions.
windows.wndtreasurehuntmenu.ten_step=Chasse en dix étapes (une seule fois)
windows.wndtreasurehuntmenu.ten_step_pending=Terminer la chasse et récupérer la récompense
