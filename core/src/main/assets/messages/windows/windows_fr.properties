windows.wndtreasurehuntmenu.rank_line=%1$de place — %2$d points
windows.wndtreasurehuntmenu.rules_title=Règles du mini-jeu de chasse au trésor
windows.wndtreasurehuntmenu.rules_info=Vous commencez avec _6 points de courage_. À chaque étape, trois itinéraires sont tirés au hasard parmi quinze événements.\nLes événements dangereux peuvent prolonger votre série d’audace et rapporter davantage de points, mais ils risquent aussi de vous faire perdre du courage.\nLe camp aux braises, le puits lunaire et le pacte des cendres peuvent vous rendre du courage, mais interrompent votre série d’audace.\nEn plus des effets des événements, la fatigue de l’aventure survient toutes les cinq étapes : _Courage -1, Cendres +1_.\n\nTerminez les dix étapes du mode correspondant pour recevoir une potion d’expérience ou un parchemin de transmutation. Si vous abandonnez avant la fin avec plus de 500 points, vous recevrez une potion aléatoire ou un parchemin aléatoire ; sinon, vous ne recevrez qu’une graine ou une pierre runique aléatoire.\n\nLa chasse sans fin ne fait qu’enregistrer votre score et ne donne aucune récompense.
windows.wndtreasurehunt.status_ten=Étapes terminées : _%1$d/10_\nCourage : _%2$d/6_\nCendres : _%3$d_\nSérie d’audace : _%4$d_\nScore actuel : _%5$d_
