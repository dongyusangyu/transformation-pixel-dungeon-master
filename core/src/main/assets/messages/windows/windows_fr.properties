windows.wndsettings$datatab.sync_uuid_title=Restauration des données du cloud
windows.wndsettings$datatab.sync_uuid_body=Saisissez l’UID dont vous souhaitez restaurer les données. Vous pouvez laisser ce champ vide si des données ont déjà été installées et téléversées depuis cet appareil ; son identifiant permettra alors de le reconnaître automatiquement.
windows.wndsettings$datatab.sync_invalid_uuid=Format d’UID invalide. Saisissez un UID complet ou laissez le champ vide pour utiliser l’identifiant de cet appareil.
windows.wndsettings$datatab.sync_confirm_title=Confirmer la restauration des données du cloud
windows.wndsettings$datatab.sync_confirm_body=Après confirmation, les données téléversées sur le cloud pour cet UID remplaceront les données locales actuelles. Les classements, journaux et autres données existantes seront modifiés en conséquence.\n\nCela ne téléchargera ni ne modifiera aucune partie d’une partie en cours ni aucune sauvegarde. Une fois la restauration réussie, l’ancien UID sera immédiatement invalidé et les données locales de cet appareil seront associées au nouvel UID.
