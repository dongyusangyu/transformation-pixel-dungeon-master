windows.wndtreasurehuntmenu.scores_info=_Historique des scores_\nDernier score : _%1$d_\nMeilleur score : _%2$d_\nParties jouées : _%3$d_\nScore cumulé : _%4$d_\n\n_Classement personnel — 5 premiers_\n%5$s
