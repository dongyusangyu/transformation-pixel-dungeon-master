windows.wndtreasurehuntmenu.rules_title=How to Hunt
windows.wndtreasurehuntmenu.rules_info=You begin with _6 courage_. Each step randomly offers three of fifteen encounters; no route is guaranteed. Dangerous choices build a streak and score more, while camps, moonwells, and ember pacts can help you recover. Every fifth step causes fatigue: _-1 courage, +1 afterglow_.\n\nCompleting all ten steps awards either a Potion of Experience or a Scroll of Transmutation. An early ending above 500 points awards an ordinary potion or scroll; otherwise it awards a runestone or seed. The Endless Hunt awards scores only.
windows.wndtreasurehuntmenu.close=Close

