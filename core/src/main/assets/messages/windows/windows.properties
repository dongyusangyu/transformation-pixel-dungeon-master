windows.wndtreasurehunt.narrative_mossy_path=You brush aside the damp moss and find a faint gleam left between the stones.
windows.wndtreasurehunt.narrative_ancient_runes=The sleeping runes light one by one, sketching part of a long-lost treasure map.
windows.wndtreasurehunt.narrative_broken_bridge=The bridge groans beneath you, but you leap clear before its last slab falls.
windows.wndtreasurehunt.narrative_lost_ghost=The ghost does not attack; one icy finger points toward a forgotten hiding place.
windows.wndtreasurehunt.narrative_rat_ambush=Rats burst from the dark. When the dust settles, their hidden spoils are yours.
windows.wndtreasurehunt.narrative_toxic_thicket=Vines snap shut behind you, while their glowing sap reveals a secret passage.
windows.wndtreasurehunt.narrative_falling_rocks=A boulder grazes your cloak, and the shattered wall reveals an old coin purse.
windows.wndtreasurehunt.narrative_stone_guardian=The guardian strikes like a bell; when it falls, coins ring inside its chest.
windows.wndtreasurehunt.narrative_dark_riddle=The riddle has no answer, but you discover that the question itself is the key.
windows.wndtreasurehunt.narrative_cursed_altar=The altar drinks a measure of courage, then exhales treasure-dark fire.
windows.wndtreasurehunt.narrative_mimic_chest=The chest bites your glove, but in doing so fails to guard what lies in its belly.
windows.wndtreasurehunt.narrative_abyss_shortcut=You race along the abyss, every falling pebble warning you not to look back.
windows.wndtreasurehunt.narrative_ember_camp=Warmth still sleeps beneath the ash, and your breathing soon grows steady.
windows.wndtreasurehunt.narrative_moon_well=Moonlight falls from an unseen vault, carrying your weariness away in ripples.
windows.wndtreasurehunt.narrative_ember_pact=The embers become warm words and trade themselves for courage to continue.
