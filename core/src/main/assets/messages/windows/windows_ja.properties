windows.wndscorebreakdown.progress_desc_tower=塔は25階まで各階800点（最大20,000点）を獲得し、それ以降は深度の二乗に応じた保護付きの加算が適用されます。
windows.wndscorebreakdown.treasure_desc_tower=財宝20,000ゴールド分までは満点となり、それを超える価値は対数的に圧縮されます。
windows.wndscorebreakdown.explore_desc_tower=ボス階を除く、探索済みの塔の階には通常の探索スコアが適用されます。
windows.wndscorebreakdown.bosses_desc_tower=塔のボスを倒すごとに10,000点を獲得します。ボスは戦闘を完了した時点で一度だけ計上されます。
windows.wndsettings$datatab.sync_data=サーバー情報を同期
windows.wndsettings$datatab.sync_stale=ローカルデータが変更されたか、新しい復元要求が行われたため、古い応答は無視されました。必要であれば、もう一度復元を要求してください。
windows.wndsettings$datatab.sync_pending=クラウド復元を続行
windows.wndsettings$datatab.sync_pending_body=前回要求したクラウド復元を続行しますか？ローカルの全体データが置き換えられます。要求後にローカルデータが変更されていた場合、古い復元はキャンセルされます。
windows.wndsettings$datatab.sync_success=サーバー情報をこの端末に同期しました。
windows.wndsettings$datatab.sync_failed=サーバー情報の同期に失敗しました。
windows.wndsettings$datatab.sync_uuid_title=クラウドデータを復元
windows.wndsettings$datatab.sync_uuid_body=復元するプレイヤーUUIDを入力してください。空欄のままにすると、この端末に以前インストールされていたデータを自動で識別します。
windows.wndsettings$datatab.sync_invalid_uuid=プレイヤーUUIDが無効です。完全なUUIDを入力するか、端末の自動照合を使う場合は空欄にしてください。
windows.wndsettings$datatab.sync_confirm_title=クラウド復元の確認
windows.wndsettings$datatab.sync_confirm_body=クラウドデータによって、この端末のバッジ、ランキング、アイテムとモンスターの図鑑、アイテムの使用数と取得数、討伐したモンスター数、才能、およびその他の全体的な記録が置き換えられます。\n\nプレイ中のゲームやセーブ枠はダウンロードも変更もされません。復元が成功すると、一度限りの許可が消費され、この端末は復元したUUIDに紐付けられます。
windows.wndsettings$datatab.sync_not_found=このUUIDまたは端末に対応するクラウドデータが見つかりません。
windows.wndsettings$datatab.sync_not_allowed=このプレイヤーUUIDにはクラウド復元が許可されていません。先に管理者へ許可を依頼してください。
windows.wndsettings$datatab.sync_network_failed=サーバーに接続できなかったため、クラウド復元に失敗しました。
windows.wndsettings$datatab.sync_invalid_response=サーバーから無効なクラウドデータが返されました。ローカルのプレイヤーIDは変更されていません。
