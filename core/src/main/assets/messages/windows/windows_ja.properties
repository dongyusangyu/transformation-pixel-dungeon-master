windows.wndblacksmith.prompt=よぉし、約束は約束だ、俺ができることはコレだ。ただ俺は識別されてて、呪われてねぇモノしか扱わねぇ。\n\n_現在の好意度: %d_
windows.wndblacksmith.pickaxe=_つるはし (好意度 %d):_ 何ならつるはしをお前にやるぜ。他にもまだ沢山あるからな。
windows.wndblacksmith.pickaxe_verify=こんなオンボロだがいいのか？この辺りの岩盤は鉱山のように柔らかくねぇから、これ以上掘り進めることはできねぇぞ。
windows.wndblacksmith.pickaxe_free=よし、かなりいい働きだったし、タダでやるよ。
windows.wndblacksmith.pickaxe_yes=はい、欲しいです。
windows.wndblacksmith.pickaxe_no=なんでもないです。
windows.wndblacksmith.reforge=_再鍛造 (好意度 %d):_ 2つの同じアイテムを、より質の高いアイテム1つに鍛え直すぜ。
windows.wndblacksmith.harden=_硬化 (好意度 %d):_ 武器や鎧を硬化させて、エンチャントや刻印を維持しやすくするぜ。
windows.wndblacksmith.upgrade=_強化 (好意度 %d):_ +2未満の識別済みのアイテムを持っているなら、強化してやるぜ。
windows.wndblacksmith.smith=_鍛冶 (好意度 %d):_ お前のために武器や鎧を一から鍛造したい。より高いランクで、おそらく強化されたものになるだろうし、何ができるかもある程度選べるだろう。
windows.wndblacksmith.smith_verify=わかった、炉を温めてくるから、好きなものを選んでくれ。
windows.wndblacksmith.smith_yes=では、炉を温めてください。
windows.wndblacksmith.smith_no=なんでもないです。
windows.wndblacksmith.cashout=_清算 (好意度を全て消費):_ その辺に転がっている普通の金貨をやるよ。好意度1ポイントにつき1ゴールドだ。
windows.wndblacksmith.cashout_verify=よし、これで%dゴールドだ。だが、この後は何もしてやれねぇぞ！
windows.wndblacksmith.cashout_yes=お金をください。
windows.wndblacksmith.cashout_no=なんでもないです。
windows.wndblacksmith$wndreforge.message=よぉし、2つの識別済みで同一のアイテムを鍛え直してやるぜ。強化値が弱い方を壊して、強い方を強化する。同じ強化値同士なら、左のものを残すぜ。
