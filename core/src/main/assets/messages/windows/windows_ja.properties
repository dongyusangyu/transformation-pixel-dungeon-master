windows.wndtreasurehuntmenu.rules_info=勇気を_6_持った状態で始まります。各ターン、15種類のイベントからランダムに3つが提示されます。危険な選択をすると連続記録が伸び、より多く得点できますが、勇気を失うことがあります。野営地、月の泉、残り火の契約は回復に役立つ場合があります。5歩進むごとに疲労が発生し、_勇気-1、残り火+1_となります。\n\n10歩を完了すると、経験の薬または変成の巻物を獲得します。500点を超えて途中終了した場合は通常の薬または巻物、それ以外はルーンストーンまたは種を獲得します。無限の宝探しではスコアのみ記録され、実際のアイテムはもらえません。
windows.wndtreasurehunt.status_ten=完了した歩数：_%1$d/10_\n勇気：_%2$d/6_   残り火：_%3$d_\n危険の連続：_%4$d_   スコア：_%5$d_
