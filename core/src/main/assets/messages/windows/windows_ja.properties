windows.wndranking$statstab.remove_desc=この記録を英雄の殿堂から削除しますか？通常ランキングの元の記録には影響しません。
windows.wndranking$challengestab.restart_desc=この勝利した勇士を地下0階から再スタートさせますか？消耗品は地下25階時点の価値でゴールドに換算され、保持する神器以外の装備はレベル0に戻り、強化の巻物が15枚支給されます。挑戦、負の才能、ランダムモードのデータは消去されます。\n\nこの勝利記録は一度しか使用できません。
