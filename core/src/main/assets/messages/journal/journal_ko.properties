journal.document.adventurers_guide.tran1.body=“몸을 바꾸고 무기를 벼려야 살아남을 수 있다. 이것이 생존의 길이다.”\n\n기묘한 마법의 영향으로 이제 던전에서 많은 변이 주문서를 찾을 수 있습니다! 각 지역에는 변이 주문서가 4장씩 있습니다.\n\n특성을 변이할 때 여러 특성 유형 중 하나를 선택할 수 있습니다. 특성 도감에서 변이 가능한 특성의 유형을 확인한 뒤 원하는 유형을 지정하면 그 유형이 나타날 확률이 몇 배로 높아집니다!\n\n행운을 빌어요!

# 추가 번역
journal.document.adventurers_guide.tran.body=“변화된 자여, 변화에도 적응하라.”\n\n모든 영웅의 특성 수가 어느 정도 바뀌었다. 1단계에는 승급 가능한 변이 특성이 2개만 있고, 2단계에는 3개만 있으며, 3단계에는 직업 특성을 제외하면 승급 가능한 변이 특성이 1개뿐이다(신사는 4개).\n\n그 대신 변이로 얻을 수 있는 특성의 종류가 매우 다양해졌으니, 쓸모 있는 특성으로 변이하면 생존에 큰 도움이 될 것이다.\n\n또한 고정된 진행에 등장하는 모든 우두머리는 고유한 승화 주문서를 떨어뜨린다. 승화 주문서를 읽으면 여러 우두머리 특성 중 하나를 골라 1·2·3단계의 빈 특성을 해당 특성으로 승화하고, 추가 특성 점수도 얻을 수 있다. 이런 특성은 대개 매우 강력하다!\n\n도전을 켰다면 무서운 특성이 나타날 수도 있다...
journal.document.hero.slimegril.body=첫 번째... 기억 읽기 시도...\n“...대장... 조금만... 더 버텨... 우리... 곧 여기서... 나갈 수 있어...”\n“아... 나 신경 쓰지 말고... 그 길을... 계속 따라가... 출구를... 찾아...”\n식별... 인간 여성... 이 육체의 소유자... 인간 남성... 이 육체가 대화하던 대상... 관계 추정... 동료?\n\n두 번째 기억 읽기 시도. 성대 복구가 거의 끝나 이제 비교적 유창하게 말할 수 있다.\n“젠장, 왜... 왜 하필 이런 일을... 이 끔찍한 곳에서, 이 더러운 하수구에서 나가고 싶어!”\n“으... 대장... 미안해...”\n앞서 언급한 남성 대상의 사망 확인. 이 육체에서 강한 감정 변동 발생... ‘감정’? 이해 불가...\n\n세 번째 기억 읽기 시도.\n“(작성)상·당·히·이·상·해... 음, 이 정도만 적자... 잠깐, 저 괴물이... 따라잡았다고?! 안... 안 돼!”\n“컥——! 아파... 눈이... 눈을 뜰 수가 없어...”\n“아빠... 엄마... 대장... 모두... 미안해...”\n산야...인가? 이 나무패에 적힌 것이 원래 ‘나’의 이름인 모양이다.\n이상한 기분이다. 이 감정은 무엇일까? ‘분함’이라고 부르는 감정인 것 같다...\n\n봄이 오는 열여섯째 날... 377년... 계산이 틀리지 않았다면 바로 이 날짜다.\n지금 내 이름은: 에이미아  ・실레르.
journal.document.hero.ninja.body=전국 시대, 마을, 닌자\n불락성의 함락과 함께 전국 시대는 끝났다. 병역과 군공으로도 더는 마을의 세금을 대신할 수 없었다. 최근 몇 년 동안 마을은 가뭄과 태풍에 연달아 시달렸고, 사공육민의 세금조차 내기 어려웠다. 올해는 또 얼마나 많은 사람이 굶어 죽을까... 반드시 방법을 찾아 마을을 구해야 한다.\n\n텐구, 가면, 배신자\n수십 년 전, 마을에는 비길 데 없는 닌자 천재가 태어났다. 수리검에 능했고 화약과 폭탄 제작에도 뛰어났다. 하지만 신사에 봉헌된 가면을 훔친 뒤 자취를 감췄다. 그 후 마을 인구는 날로 줄고 굶어 죽는 이들은 늘었다. 촌장은 텐구가 가면을 훔쳐 신사를 노하게 했기에 신벌이 마을에 내렸다고 늘 말한다. 맹세한다, 그자를 산산조각 내리라.\n\n남만 상인, 철포, 부적\n최근 마을에 남만 상인이 와서 생활용품부터 사람을 떨게 하는 전장의 무기 ‘철포’까지 온갖 물건을 팔고 있다. 나는 그 무서움을 직접 보았다. 동료 아키도 그것 때문에 죽었다. 상인은 철포 한 자루가 50관이며 무사가 관직을 사는 값과 같다고 했다. 그것을 가지면 텐구보다 강해질지도 모른다.\n남만 상인은 마을의 곤궁한 사정을 보고 ‘부적’에 관한 전설을 들려주었다. 어떤 소원이든 이루어 주는 보물이며, 다음 목적지가 서환 대륙이라 그 흔적을 찾으러 간다는 것이다. 나는 간절히 애원했고, 마침내 함께 가도 좋다는 허락을 받았다. 반드시 부적을 손에 넣어 마을을 구하겠다.\n\n여름이 돌아온 닷새째 날... 374년... 출항!
journal.document.hero.princess.body=폐하께 올리는 글:\n\n신은 탐사원 총장 로버트  ・스테노입니다. 목숨을 걸고 이 피로 쓴 상소를 폐하께 바칩니다.\n\n신은 고대의 두루마리에서 흉조를 보았습니다. 왕국에 권력욕으로 이성을 잃고 꼭두각시의 사슬을 엮어 만민을 지배하려는 오만한 자가 나타날 것입니다. 그가 완전히 권력을 쥐면 외부의 사악한 신을 불러들이고, 왕국은 멸망하며 천지 또한 재앙을 입을 것입니다. 인간의 힘으로는 막기 어려울 것입니다.\n\n신하와 병사들 중에는 이미 조종당한 듯한 이상 징후가 나타났고, 재앙의 조짐은 분명합니다. 왕족의 혈통과 드워프 문명을 보전하기 위해, 왕자와 공주가 일부 백성을 이끌고 중요한 서적과 기술, 법기를 챙겨 비밀 통로로 지상 세계로 피신하여 다른 종족과 함께 살아가도록 속히 명령해 주시기를 간청합니다.\n\n이 상소의 글자마다 피눈물이 맺혀 있습니다. 온 가족의 목숨을 걸고 보증하오니, 부디 일찍 결단하여 드워프 문명에 한 줄기 생기를 남겨 주십시오.\n\n신 로버트  ・스테노 삼가 판결을 기다립니다.\n법력 33년 1월 14일
