journal.document.alchemy_guide.weapons.body=투척 무기와 마법 지팡이는 물론 주문 용기도 연금술 반응에 사용할 수 있다！\n\n투척 무기 한 묶음을 일정량의 액체 금속으로 녹이면 같은 등급과 강화 단계의 투척 무기 한 묶음을 완전히 수리할 수 있다. 단, 투척 무기 묶음을 연금술에 사용하면 수량이 가득 차 있지 않아도 전부 파괴된다！\n\n마법 지팡이 하나를 비전 수지로 분해하면 같은 강화 단계의 지팡이 두 개를 강화하기에 충분한 양을 얻는다. 하지만 이 방법으로 지팡이를 +3보다 높게 강화할 수는 없다.\n\n아무 주문서 두 장과 마법 각인 펜을 더하면 모든 주문을 시전할 수 있지만 충전은 할 수 없는 성전 필사본을 만들 수 있다. 필사 과정에서 마법 각인 펜은 소모되지 않으니 안심하자.
journal.document.alchemy_guide.weapon_crafting.title=신형 장비
journal.document.alchemy_guide.weapon_crafting.body=특별한 장비… 특별한 재료… 그리고 일정량의 연금술 에너지… 완벽한 신형 장비를 만드는 데 필요한 재료는 이것뿐이다！ 물론 화학물질 X는 없다.\n\n신형 무기나 마법 지팡이를 합성할 때 재료에 강화 단계가 있다면, 재료 단계의 합을 3으로 나눈 값(최대 +3)이 새 무기나 지팡이의 강화 단계가 된다.\n\n신형 유물은 재료의 강화 단계와 관계없이 언제나 0단계로 합성된다.
journal.talentcatalog.meta_subclass=\n\n_로컬 기록／전체 기록：_\n승화 횟수：_%1$d__/__%3$d_。\n선택률：_%2$s%%__/__%4$s%%_。

journal.document.backs.shopkeeper.body=첫째\n이 하수도는 악취 나는 오물과 끔찍한 쥐로 가득하다. 술 취한 드워프의 말은 거짓뿐이며 드워프 왕국과 보물은 존재하지 않는다.\n\n둘째\n최근 제법 강해 보이는 모험가가 왔다. 하지만 다른 불운한 자들처럼 하수도의 기형 게나 감옥 입구의 슬라임에게 죽을 것이다. 살아남으면 주운 잡동사니를 비싸게 팔 수 있다.\n\n셋째\n이 모험가의 실력은 예상 밖이었다. 감옥 깊은 곳의 괴물까지 베어 죽였다. 따라가면 잃어버린 왕국과 보물을 찾을 수 있을 것 같다.\n\n넷째\n드디어 드워프 왕국의 보물과 마법을 찾았다! 저 얼간이가 전설의 부적을 가져온다니, 남은 드워프를 속여 부적과 그의 보물을 모두 빼앗게 하자.
journal.document.hero.dm400.body=법력 145년 4월 6일（주: 춘력 375년 6월 6일）\n“우리 도시는 몰락했다…” 병든 아버지가 남긴 마지막 말이다. 나는 지상의 드워프 티무르 로브다. 이 기록을 읽는다면 내가 만든 인간형 기계가 고장 난 것이다.\n\n조부와 아버지는 지하의 드워프 수도에서 살다가 소수의 생존자와 지상으로 도망쳤다. 아버지는 드워프 여성과 사랑에 빠져 나를 낳았다. DM-400은 몰락한 수도를 탐사하려고 지하로 향했다. 조부는 143세, 아버지는 117세에 죽었고, 64세인 나에게도 같은 병이 나타났다. 우리는 저주받은 듯하다.\n\n모험가든 생존자든 이 기록과 DM-400의 로그를 세상에 전해 지하의 진실을 밝혀 주길 바란다.\n……\n（비밀 기록）“DM-400, 너는 내 최고의 작품이다. 그곳에 도착할 수 있다고 믿는다. 모든 것을 전하지 못해도, 부적을 가져오지 못해도 살아남아라.”\n“……알겠습니다, 주인님.”
journal.document.backs.imp.body=첫째\n날짜는 모른다. 악마에게 시간 감각이 필요할 리 없으니까! 드워프 수도에 살아 있는 모험가가 오다니 진귀한 일이다. 이용하면 원하는 것을 얻을 수 있을지도 모른다.\n\n둘째\n모험가에게 드워프 휘장 수집을 맡겼더니 금세 모두 모았다. 광기 어린 왕은 물론 고대신 Yog-Dzewa까지 쓰러뜨릴지도 모른다. 보상 반지에 추적 마법을 걸어 받는 순간 몸에 새겼다.\n\n셋째\n휘장을 모아 혼돈신의 요구를 충족했고 고대신의 힘을 흡수하는 마법을 손에 넣었다. 네 동료도 혼돈신의 신자가 되어 전례 없는 힘을 얻었다. 세계는 우리의 것이 될 것이다!\n\n넷째\n모험가는 정말 고대신을 쓰러뜨렸다. 감언이설로 부적을 가지러 가게 했다. 이제 고대신의 강대한 힘은 내 것이다!
