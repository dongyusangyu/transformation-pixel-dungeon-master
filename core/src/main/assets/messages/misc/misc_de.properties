challenges.no_food=Auf Diät
challenges.no_food_desc=Nahrungsmittel sind ohnehin knapp, aber man muss auch auf die Portionen achten!\n\n- Nahrung und das Füllhorn haben nur ein Drittel des hungerstillenden Effekts\n- Andere Sättigungsquellen sind davon nicht betroffen
challenges.no_armor=Der Glaube ist meine Rüstung
challenges.no_armor_desc=Du benötigst Vertrauen in dich selbst, denn deine Rüstung wird nicht viel nützen!\n\n- Der Basisschutzwert ist für alle Rüstungen, außer Kleidung, reduziert.\n- Alle Verbesserungen bei Rüstung sind nun kaum noch effektiv.\n- Die Verteidigungskraft des irdenen Wächters ist ebenfalls deutlich reduziert.
challenges.no_healing=Pharmakophobie
challenges.no_healing_desc=Heiltränke sind sicher praktisch, leider bist du dagegen allergisch!\n\n- Heiltränke und Gegenstände, die mit Heiltränken hergestellt werden, sowie Sonnenfrucht vergiften den Helden, anstatt ihn zu heilen.\n- Instabiles Gebräu kann den Helden nicht zufällig vergiften oder heilen.\n- Diese Gegenstände funktionieren für andere Charaktere weiterhin normal.
challenges.no_herbalism=Ödland
challenges.no_herbalism_desc=In diesem verfluchten Dungeon scheint es kein klares Wasser mehr zu geben...\n\n- Tautropfen sind entfernt\n- Pflanzen sind entfernt\n- Samen erscheinen weiterhin, werden aber nicht gedeihen
challenges.swarm_intelligence=Schwarmintelligenz
challenges.swarm_intelligence_desc=Pass auf, die Monster im Dungeon werden intelligenter!\n\n- Wenn ein Gegner dich bemerkt, werden nahe Gegner zu dieser Position gezogen
challenges.darkness=In die Finsternis
challenges.darkness_desc=Es ist eben ein Dungeon!\n\n- Normale Sichtweite stark verringert\n- Eine Fackel erscheint auf jeder Ebene\n- Licht-Effekt hält nicht sehr lange
challenges.no_scrolls=Verbotene Runen
challenges.no_scrolls_desc=Eine bestimmte Rune lässt sich schwerer finden. Leider ist das immer die nützlichste!\n\n- Die Hälfte der Schriftrollen der Verbesserung werden aus dem Dungeon entfernt
challenges.champion_enemies=Feindliche Champions
challenges.champion_enemies_desc=Du bist nicht der Einzige, der aufsteigen kann!\n\n- Normale Gegner haben eine 1/8 Chance, mit einem speziellem Champion-Buff zu erscheinen;\n- Champions wachen auf, wenn sie schlafend erscheinen;\n- Der Held erfährt, wenn ein Champion erscheint;\n- Champions sind immun gegen Korruption.\n\nEs gibt sechs Arten von gegnerischen Champions:\n_Flammend (orange):_ +25% Nahkampfschaden, entzündet beim Treffer, verbreitet Flammen bei Tod, kann keine Wasserfelder entzünden;\n_Projizierend (lila):_ +25% Nahkampfschaden, +3 Nahkampf-Reichweite;\n_Antimagisch (grün):_ -50% erlittener Schaden, immun gegen magische Effekte;\n_Gigantisch (blau):_ -80% erlittener Schaden, +1 Nahkampfreichweite, kann keine Tunnel betreten;\n_Gesegnet (gelb):_ 4x Genauigkeit und Ausweichen;\n_Wachsend (rot):_ +20% Genauigkeit, Ausweichen, Schaden und effektive Lebenspunkte. Erhöht sich alle 4 Züge um 1%.
challenges.stronger_bosses=Bösere Bosse
challenges.stronger_bosses_desc=Die Bosse sind mit dieser Herausforderung viel härter!\n\n_Schleim:_ +20% Gesundheit\n_-_ Heilung im Wasser erhöht sich auf 3/Zug\n_-_ Pumpt sich in 1 Zug auf, statt in 2\n_Tengu:_ +25% Gesundheit\n_-_ Phase 1: Fallen sind viel tödlicher\n_-_ Phase 2: Fähigkeiten sind häufiger\n_DM-300:_ +33% Gesundheit\n_-_ Pylonen sind zäher und 3 aktivieren\n_-_ Fähigkeiten sind mächtiger und häufiger\n_-_ DM-300 ist schneller, wenn er aufgeladen ist\n_-_ Freiliegende Drähte sind doppelt so häufig\n_Zwergenkönig:_ +50% Gesundheit\n_-_ Untertanen sind in allen Phasen stärker\n_-_ Phase 1: schnellere Fähigkeiten und Beschwörungen\n_-_ Phase 2: 2 Untertanen mehr pro Zug\n_-_ Phase 3: 2x Gesundheit, schnellere Beschwörungen\n_Yog-Dzewa:_\n_-_ Es werden zwei Fäuste auf einmal beschworen!\n_-_ +60% Laserschaden\n_-_ Stärkere Untertanen

rankings$record.something=Durch Etwas getötet
rankings$record.won=Das Amulett von Yendor erlangt
rankings$record.ascended=Mit dem Amulett aufgestiegen!
challenges.harsh_environment=Harte Umgebung
challenges.harsh_environment_desc=Für Helden, die mit Gefahr umgehen können!\n\n-Erhöht alle Herausforderungsstufen auf ￡Stufe 2￡. Wenn keine andere Grundherausforderung aktiv ist, wird zufällig eine aktiviert.
challenges.extreme_environment=Extreme Umgebung
challenges.extreme_environment_desc=Für Krieger, die es wagen, der Leere entgegenzusehen!\n\n-Erhöht alle Herausforderungsstufen auf ￥Stufe 3￥. Aktiviert automatisch ￡Harte Umgebung￡.
challenges.weakened_talent=Geschwächte Talente
challenges.weakened_talent_desc=Eine unwiderstehliche Macht hat deine Talente geschwächt!\n\n-Talente auf +0 und +1 haben keine Wirkung.\n-Talente auf +2 und +3 verwenden nur den +1-Effekt.\n-Talente auf +4 verwenden nur den +2-Effekt.\n-Talentprüfungen beginnen erst ab +2.
challenges.weakened_text=Eine böse Magie hat dir zwei negative Talente gegeben!
challenges.red_envelope=Rote-Umschläge-Sprint
challenges.red_envelope_desc=Das neue Mondjahr naht, und die alten Götter haben jedem Wesen im Dungeon einen roten Umschlag gegeben. Zeit, sie zu sammeln!\n\n-Alle normalen Beutegegenstände werden durch rote Umschläge ersetzt.\n-Rote Umschläge enthalten immer Gold und können eine Überraschung enthalten.\n-Diese Herausforderung setzt deine Punktzahl auf null.
challenges.max_wheat=Die vollste Ähre
challenges.max_wheat_desc=Talente zu transmutieren gleicht Sokrates’ Suche nach der vollsten Weizenähre.\n\n-Jedes Talent kann nur einmal transmutiert werden.\n-Transmutationskristalle und Talente aus Sublimationsschriftrollen sind nicht betroffen.\n-￡Die Transmutationschance sinkt auf das Dreifache.￡
challenges.negative=Negative Talente
challenges.negative_desc=Wenn es positive Talente gibt, sollte es auch negative geben!\n\n-Aktueller Pool: allgemeine Talente plus 5 begrenzte Talente.\n-Auf den Ebenen 2, 6, 11 und 21 wählt der Spieler eines von zwei negativen Talenten.\n-Verfügbare Talente hängen vom Samen des Laufs ab.
challenges.test_mode=Testzeit
challenges.test_mode_desc=Zusätzliche Optionen – Testzeit!\nHinweis: Manche Inhalte können fehlen oder falsch dokumentiert sein.\n\n-Gegenstände erzeugen, bewegen und Gegner erscheinen lassen.\n-Im Testmodus wird das Herausforderungssymbol ersetzt.\n-Testspiele erscheinen nicht in Ranglisten und schalten nichts frei.

