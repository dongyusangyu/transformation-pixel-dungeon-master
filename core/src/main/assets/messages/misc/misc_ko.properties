challenges.harsh_environment_desc=위험에 대처할 수 있는 영웅에게 적합!\n\n-모든 도전의 단계가 ￡2단계￡로 상승하며, 이 도전만 켜고 기본 도전을 켜지 않았다면 기본 도전 하나가 무작위로 활성화된다
challenges.extreme_environment=극한 환경
challenges.extreme_environment_desc=절망적인 상황을 정면으로 마주할 용사에게 적합!\n\n-모든 도전의 단계가 ￥3단계￥로 상승하며, 이 도전을 켜면 ￡혹독한 환경￡ 도전이 자동으로 활성화된다
challenges.weakened_talent=약화된 특성
challenges.weakened_talent_desc=저항할 수 없는 힘으로 특성 효과가 약해졌다!\n￡약해진 것은 특성만이 아니라 성장도 마찬가지다! (2단계)￡\n￥너의 성장은 언제나 병목기에 들어선다! (3단계)￥\n\n-특성 +0, +1에서는 적용되지 않음\n-특성 +2, +3에서는 +1 효과만 적용\n-특성 +4에서는 +2 효과만 적용\n-특성 +2부터 특성 판정 발동\n-￡이제 2레벨마다 원래 즉시 얻는 특성 점수 2점을 획득/￡￥3레벨마다 원래 즉시 얻는 특성 점수 3점을 획득￥
challenges.weakened_text=사악한 마법의 힘이 부정적 특성 두 개를 부여했다!
challenges.red_envelope=홍바오 작전
challenges.red_envelope_desc=새해 명절이 다가오자 고대 신이 던전의 모든 생물에게 지난 한 해의 노고를 치하하는 새해 홍바오를 하나씩 보냈다.\n그러니 이제 홍바오를 쟁취할 시간이다!\n\n-모든 적의 일반 전리품이 홍바오로 대체됨\n-홍바오는 반드시 금화를 주며, 낮은 확률로 특별한 행운이 나옴!\n-이 도전은 게임 점수를 0으로 만든다
challenges.max_wheat_desc=변이 특성은 소크라테스가 가장 큰 밀 이삭을 찾던 것과 같다.\n￡가장 큰 밀 이삭을 잡을 기회가 얼마나 남아 있을까? (2단계)￡\n￥가장 큰 밀 이삭을 찾으려면 더 큰 대가를 치러야 한다. (3단계)￥\n\n-각 특성은 한 번만 변이할 수 있으며, 이미 변이한 특성은 다시 변이할 수 없다. 변이 주문서 시전을 취소해도 변이 기회에는 영향이 없다\n-변이 결정 시전과 승화 주문서로 얻는 특성은 도전의 영향을 받지 않는다\n-￡변이 특성의 변이 배율이 3배로 감소￡\n-￥이제 던전의 대부분 변이 주문서는 특수 상자 괴물이 지킨다￥
challenges.negative_desc=긍정적 특성이 있다면 부정적 특성도 있어야 한다!\n￡부정적 특성도 “약화”되었다! (2단계)￡\n￥빌어먹을 부정적 특성이 더 많아졌다! (3단계)￥\n\n-현재 버전의 부정적 특성 그룹: 일반 + 한정 1\n-플레이어가 2, 6, 11, 21층에 처음 도달하면 부정적 특성 2개 중 하나를 강제로 선택\n-선택 가능한 부정적 특성은 해당 게임의 시드와 관련됨\n-부정적 특성 효과는 특성 약화의 영향을 받지 않음\n-￡부정적 특성 +0, +1은 약화되지 않으며 +2에서 +1 효과로 약화됨(이 강화 내용은 특성 약화 도전의 영향을 받지 않으며 도전을 켜지 않아도 적용됨)￡\n-￥2층과 21층에서 부정적 특성 2개를 직접 획득￥
