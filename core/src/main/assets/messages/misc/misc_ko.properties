challenges.stronger_bosses_desc=모든 우두머리가 더 어려워진다!\n￡모든 우두머리가 더 위험해진다! (2단계)￡\n￥모든 우두머리가 더욱 치명적이 된다! (3단계)￥\n\n_점액：_체력 +20%\n_-_ 물속에 있는 동안 체력 회복량이 증가하여 턴당 최대 3/￡4￡\n_-_ 폭발 공격의 충전 시간이 2턴에서 1턴으로 감소￥, 회피 불가￥\n_-_￥체력을 24 잃을 때마다 침식 슬라임 1마리로 분열￥\n\n_전사？：_체력 +50%\n_-_ 분노 감소 속도 25%/￡50% 감소￡\n_-_ 보호막 획득에 필요한 연계 공격 수 -1￥, 보호막 +5￥\n_-_￥음식 섭취가 1턴만 걸리며 그 턴 동안 무적￥\n\n_텐구：_체력 +25%\n_-_ 1단계: 함정이 더 치명적\n_-_ 2단계: 기술 사용 빈도 증가\n_-_ ￡공격 속도 +50%￡\n_-_ ￥각 단계 시작 시 감옥 경비병 1명 소환￥\n\n_도적？：_체력 +25%\n_-_ 1단계: 준비가 끝나면 영웅을 즉시 처치\n_-_ 2단계: 일정 피해를 받으면 그림자 환영 소환\n_-_ ￡이탈 상태에서 더 빨리 회복￡\n_-_ ￥공격을 받아 은신이 풀려도 마비되지 않고, 대신 1턴 동안 호르몬 급증 획득￥\n\n_DM-300：_체력 +33%/￥+66%￥\n_-_ 에너지 탑이 더 튼튼해지고 파괴해야 할 수가 3개/￥4개￥로 증가\n_-_ 기술 사용 빈도와 위력 증가\n_-_ 과부하 상태의 이동 속도 증가\n_-_ 지상 전선 수 2배\n_-_ ￡공격 속도 +100%￡\n\n_사냥꾼？：_체력 +33%\n_-_ 사이킥 활의 최대 사거리가 6칸에서 8/￥10￥칸으로 증가\n_-_ 공격 피해 +20%\n_-_ ￡체력을 75 잃을 때마다 사이킥 매 1마리 소환￡\n_-_ ￡1단계: 저격 화살을 쏜 뒤 재조준 불필요￡\n_-_ ￥2단계: 특수 식물을 조준할 때 이동 속도가 3배에서 5배로 증가￥\n\n_드워프 왕：_체력 +50%\n_-_ 모든 단계에서 더 강력한 부하를 더 많이 소환\n_-_ 1단계: 기술과 소환 빈도 증가￡, 이 단계에서 받은 모든 피해가 지연 피해로 전환￡\n_-_ 2단계: 매 라운드 부하 2명 추가 소환\n_-_ 3단계: 체력 +100%, 소환 빈도 추가 증가\n_-_ ￥죽은 뒤 소환한 부하는 죽지 않음￥\n\n_Yog-Dzewa：_\n_-_ 고대의 주먹 둘을 동시에 소환！￡고대의 주먹은 15턴 동안 무적￡\n_-_ 레이저 피해 +60%￡, 레이저 수 +1￡\n_-_ 더 강력한 부하 소환！￥부하는 20턴 동안 무적￥\n_-_ ￥악마의 피 둥지도 더 강한 부하를 소환￥
challenges.test_mode_desc=추가 옵션: 시험 시간！\n일부 콘텐츠가 누락되었거나 정보가 잘못되었을 수 있습니다.\n\n-아이템과 적을 자유롭게 생성하고 자유롭게 이동할 수 있다\n-시험 시간에는 도전 아이콘이 시험 시간 표시로 바뀐다\n-시험 시간 게임은 순위표에 기록되지 않으며 콘텐츠도 해금할 수 없다
