challenges.harsh_environment_desc=危険な状況に立ち向かえる英雄向け！\n\n-すべての挑戦のレベルを￡レベル2￡に上げる。有効化後に他の基本挑戦が有効でなければ、基本挑戦を1つランダムに有効化する
challenges.extreme_environment=極限環境
challenges.extreme_environment_desc=絶望的な状況に立ち向かう勇者向け！\n\n-すべての挑戦のレベルを￥レベル3￥に上げる。この挑戦を有効にすると￡過酷な環境￡も自動的に有効になる
challenges.weakened_talent=弱体化した才能
challenges.weakened_talent_desc=抗えない力により、才能の効果が弱められる！\n￡弱まるのは才能だけでなく、成長もだ！(レベル2)￡\n￥成長はいつも壁に突き当たる！(レベル3)￥\n\n-才能+0、+1では発動しない\n-才能+2、+3では+1の効果だけ発動する\n-才能+4では+2の効果だけ発動する\n-才能+2で初めて才能判定が発生する\n-￡2レベル上がるごとに、本来すぐ得られる2才能ポイントを得る/￡￥3レベル上がるごとに、本来すぐ得られる3才能ポイントを得る￥
challenges.weakened_text=邪悪な魔力により、2つの負の才能を得た！
challenges.red_envelope=紅包作戦
challenges.red_envelope_desc=新春節が近づき、古き神がダンジョンのすべての生物に、昨年の働きを称えて新春の紅包を贈った。\nさあ、紅包を奪う時だ！\n\n-敵の通常ドロップが紅包に置き換わる\n-紅包からは必ず金貨が出て、低確率で特別な驚きも出る！\n-この挑戦を有効にするとスコアが0になる
challenges.max_wheat_desc=変異の才能は、ソクラテスの最大の麦穂探しに似ている。\n￡最大の麦穂をつかむ機会はあと何回ある？(レベル2)￡\n￥最大の麦穂を見つけるには、より大きな代償が必要だ。(レベル3)￥\n\n-各才能の変異機会は1回だけ。すでに変異した才能は再び変異できない。変異の巻物の使用を取り消しても機会は戻らない\n-変異結晶の使用と昇華秘巻で得た才能は影響を受けない\n-￡変異した才能の変異倍率を3倍に下げる￡\n-￥ダンジョン内の大半の変異の巻物を特殊な宝箱ミミックが守る￥
challenges.negative_desc=正の才能があるなら、負の才能もあるはずだ！\n￡負の才能も「弱体化」される！(レベル2)￡\n￥忌まわしい負の才能がさらに増える！(レベル3)￥\n\n-現在の負の才能グループ：共通系+限定1\n-プレイヤーが2、6、11、21階に初めて到達した時、2つの負の才能から1つを強制的に選ぶ\n-選択できる負の才能はそのゲームのシードに関連する\n-負の才能の効果は才能弱体化の影響を受けない\n-￡負の才能+0、+1は弱まらず、+2で+1効果まで弱まる（この強化は才能弱体化の挑戦の影響を受けず、同挑戦を有効にしていなくても適用される）￡\n-￥第2階と第21階で負の才能を2つ直接得る￥
