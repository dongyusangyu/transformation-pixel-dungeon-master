challenges.stronger_bosses_desc=すべてのボスが手強くなる！\n￡すべてのボスがより危険になる！（レベル2）￡\n￥すべてのボスがより致命的になる！（レベル3）￥\n\n_粘体：_体力+20%\n_-_水中にいる間、体力の回復量が増え、1ターン最大3/￡4￡\n_-_爆発攻撃の溜めが2ターンから1ターンに短縮￥、回避不可￥\n_-_￥体力を24失うごとに侵食スライムが1体分裂￥\n\n_戦士？：_体力+50%\n_-_怒りの減衰速度-25%/￡-50%￡\n_-_盾の獲得に必要なコンボ数-1￥、盾の量+5￥\n_-_￥食事は1ターンで済み、そのターンは無敵￥\n\n_天狗：_体力+25%\n_-_第1段階：罠がより危険に\n_-_第2段階：技をより頻繁に使用\n_-_￡攻撃速度+50%￡\n_-_￥各段階の開始時に監獄の衛兵を1体召喚￥\n\n_盗賊？：_体力+25%\n_-_第1段階：準備が終わると英雄を即座に倒す\n_-_第2段階：一定のダメージを受けると影の分身を召喚\n_-_￡逸脱状態からより速く回復￡\n_-_￥攻撃で姿を現しても麻痺せず、代わりにホルモン急増を1ターン得る￥\n\n_DM-300：_体力+33%/￥+66%￥\n_-_エネルギータワーがより頑丈になり、破壊数が3/￥4￥基必要\n_-_技の頻度と威力が上昇\n_-_過負荷時の移動速度が上昇\n_-_地上の配線数が2倍\n_-_￡攻撃速度+100%￡\n\n_女狩人？：_体力+33%\n_-_サイキック弓の射程上限が6から8/￥10￥マスに増加\n_-_攻撃ダメージ+20%\n_-_￡体力を75失うごとにサイキック鷹を1体召喚￡\n_-_￡第1段階：狙撃矢を放った後、再装填不要￡\n_-_￥第2段階：特殊な植物を狙う間の移動速度が3倍から5倍へ￥\n\n_ドワーフ王：_体力+50%\n_-_すべての段階で、より強力な手下を多く召喚\n_-_第1段階：技と召喚の頻度が上昇￡、受けたダメージはすべて遅延ダメージに￡\n_-_第2段階：各ターンに手下をさらに2体召喚\n_-_第3段階：体力+100%、召喚頻度もさらに上昇\n_-_￥死亡後に召喚した手下は死なない￥\n\n_Yog-Dzewa：_\n_-_古の拳を2体同時に召喚！￡古の拳は15ターン無敵￡\n_-_レーザー攻撃のダメージ+60%￡、レーザー数+1￡\n_-_より強力な手下を召喚！￥手下は20ターン無敵￥\n_-_￥悪魔の血の巣からもより強力な手下が出現￥
challenges.test_mode_desc=追加オプション：テストモード！\n注意：一部の内容が未実装だったり、情報が誤っていたりする場合があります。\n\n-アイテムや敵を自由に生成し、自由に移動できます\n-テストモード中はチャレンジのアイコンが専用表示に置き換わります\n-テストモードのゲームはランキングに記録されず、コンテンツも解除されません
